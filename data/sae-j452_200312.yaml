  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE Standards for aluminum casting alloys cover a wide range of castings for general and special use, but do not include all the alloys in commercial use. Over the years, aluminum alloys have been identified by many numbering systems as shown in &lt;span class="xref"&gt;Table 1&lt;/span&gt;. Presently, SAE is recommending the use of the UNS Numbering System to identify these materials. The castings are made principally by sand cast, permanent mold, or die cast methods; however, shell molding, investment casting, plaster cast, and other less common foundry methods may also be used. If the alloys listed do not have the desired characteristics, it is recommended that the manufacturers of aluminum castings be consulted.&lt;/div&gt;&lt;/div&gt;</p>
