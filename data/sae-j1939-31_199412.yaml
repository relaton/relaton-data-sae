  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This series of SAE Recommended Practices was developed to provide an open interconnect system for on-board electronic systems. It is the intention of these documents to allow electronic devices to communicate with each other by providing a standard architecture. This particular document describes the Network Layer which defines the requirements and services needed for communicating between devices that are on different segments of the SAE J1939 Vehicle Network.&lt;/div&gt;&lt;/div&gt;</p>
