  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AS covers oxygen filler valves for use in aircraft to ensure safe servicing of high pressure oxygen system cylinders. The intent is that the valve shall automatically control the rate of fill such that the temperature rise in the oxygen system caused by compression heating of the gas will be within acceptable limits. In addition, the valve shall have a pressure sensitive closing valve to automatically control the final pressure for a correct amount of oxygen in the system cylinder. The pressure closing level may be manually selected by means of adjustment dials on the valve.&lt;/div&gt;&lt;/div&gt;</p>
