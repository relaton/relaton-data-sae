  content: |-
    <p>This SAE Standard applies to off-road self-propelled construction, forestry and industrial machines as listed in categories 1, 2, and 4 of SAE J1116.
    Purpose
    This Standard provides a field procedure to determine the ability of a machine to operate statically and dynamically on sloping surfaces.
    Depending upon the objective of the test, any item listed as specified is to be selected at the discretion of either the manufacturer, the test agency, the owner, or a combination of these parties.</p>
