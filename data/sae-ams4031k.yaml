    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an aluminum alloy in the form of sheet and plate 0.020 to 2.000 inches (0.51 to 50.80 mm), inclusive, in nominal thickness, supplied in the annealed (-O) condition (see &lt;span class="xref"&gt;8.3&lt;/span&gt;). When specified, product shall be supplied in the “as fabricated” (-F) temper.&lt;/div&gt;&lt;/div&gt;</p>
