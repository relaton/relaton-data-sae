  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the test procedure, environment, and instrumentation to be used for measuring the exterior exhaust sound level for passenger cars, multipurpose vehicles, and light trucks under stationary conditions providing a continuous measure of exhaust system or simulated exhaust sound level over a range of engine speeds or simulated engine speeds.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies only to road vehicles equipped with an internal combustion engine or with an external sound system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The method is designed to meet the requirements of simplicity as far as they are consistent with reproducibility of results under the operating conditions of the vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is within the scope of this document to measure the stationary A-weighted sound pressure level during:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Measurements at the manufacturing stage&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Measurements at official testing stations&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Measurements at roadside testing&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;It does neither specify a method to check the exhaust sound pressure level when the engine is operated at realistic load nor a method to check the exhaust sound pressure levels against a general noise limit for categories of road vehicles. It provides the means for detecting exhaust system resonances with the potential to affect both exterior and interior sound quality.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J2805 provides methods to assess vehicle noise emission consistent with in-use vehicle noise emissions at realistic vehicle loads and speeds.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document incorporates certain provisions of ISO 5130:2019 for measuring the sound level of exhaust systems (see &lt;span class="xref"&gt;Appendix A&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
