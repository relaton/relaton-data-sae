  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;IMPORTANT NOTICE:&lt;/b&gt; In any intended vehicle application, if the products covered by this specification are, or may be, subjected to conditions beyond those described in this document, they must pass special tests simulating the actual conditions to be encountered before they can be considered acceptable for actual vehicle application. Products certified by their supplier as having passed specific applicable portions of this specification are not to be used in applications where conditions may exceed those for which the product has been satisfactorily tested.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Authorized Person is the final authority as to what tests are to be performed on his or her parts and for what purpose these tests are required. He or she is also the final authority for resolving any questions related to testing to this specification and to authorizing any deviations to the equipment or procedures contained in this specification. Any such deviation must be documented and included in the final test report.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;This specification defines basic test methods and requirements for ultrasonically welded cable termination type connections. These procedures are applicable to the ultrasonically welded cable attachment method to buss, terminal, or device connections including welded eyelet or battery terminations.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The wiring supplier has the primary responsibility for testing and selection of weld tooling and equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Specific terminal designs may require specialized ultrasonic weld tooling and equipment. The component supplier is responsible to provide the component processor or wire harness supplier information based on the weld tooling and equipment used in the terminal DV and PV testing process.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Traceability to the tooling and equipment used to prepare the samples under test must be documented in the test report. Obtaining approval from the customer with appropriate test data showing that the welded termination will function as defined by this specification lies with the wiring harness supplier.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;New or revised ultrasonically welded terminations shall be tested to the requirements of this specification.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;4&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Deviations from the requirements of this specification must be approved by the customer engineering department.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;5&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Procedures included within this specification are intended to cover performance testing and development of welded cable terminations that are part of the electrical connection systems used in road vehicle applications at ambient temperatures of 125°C maximum. The OEM customer must approve use of these test procedures for use at temperatures beyond this limit.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;6&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Welded terminations using crimped insulation wings for strain relief shall meet the insulation crimped grip requirements of SAE/USCAR 21.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: This specification was developed with clean, bare, uncoated, stranded automotive copper wire. Welded terminations using compressed, compacted, or solid core construction or other core materials (clad, steel core, etc) need to be reviewed to determine that this specification is applicable to evaluate those terminations. Coating, lubricants, or contamination in the bond area of wires or components can affect the mechanical and electrical performance of ultrasonically welded cable terminations. For the purpose this specification the words: cable and wire shall be used interchangeably&lt;/div&gt;
    &lt;/div&gt;</p>
