  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to describe the application of single-phase DC to AC inverters, and bidirectional inverter/chargers, which supply power to ac loads in Class heavy duty on-highway trucks (10K GVW). The document identifies appropriate operating performance requirements and adds some insight into inverter selection.
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to factory and after-market installed DC-to-AC inverter systems (Including inverter chargers) providing up 3000 W of 120 VAC line-voltage power as a convenience for operator and passenger use. Such inverters are intended to power user loads not essential to vehicle Operation or safety (e.g., HVAC, TV, microwave ovens, battery chargers for mobile phones or laptop computers, audio equipment, etc.).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Systems incorporate the inverter itself as well as the input, output, control, and signal wiring associated with the inverter. Requirements are given for the performance, safety, reliability, and environmental compatibility of the system.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;These are recommended requirements to be used by vehicle manufacturers in the development of their own specifications, which may incorporate more or less stringent requirements.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;This document scope excludes military vehicles, bus and 28 V systems.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;</p>
