    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report establishes procedures and terminology for measuring, calculating, and referencing the percent vehicle overlap for a case vehicle in real-world or staged end plane collisions where the end plane of the case vehicle is engaged at one of the two bumper corners but not both. This SAE Information Report may be applied to rear or front plane impacts.&lt;/div&gt;&lt;/div&gt;</p>
