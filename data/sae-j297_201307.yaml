    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended to improve operator efficiency and convenience by providing guidelines for the uniformity of location and direction of motion of operator controls used on industrial wheeled equipment. The controls covered are those centrally located at the operator's normal position.&lt;/div&gt;

