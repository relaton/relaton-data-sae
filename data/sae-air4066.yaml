    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR defines the materials, strength, and finishes utilized in recent linear hydraulic flight control actuators. To keep the information at a relevant minimum, only cylinders (barrels), glands and pistons are listed. Also identified are the reasons for the material selection and any pertinent comments. All data were collected from the respective suppliers.&lt;/div&gt;&lt;/div&gt;</p>
