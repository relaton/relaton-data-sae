  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the characteristics and utilization of 270 V DC electric power at the utilization equipment interface and the constraints of the utilization equipment based on practical experience. These characteristics shall be applicable for both airborne and ground support power systems. This document also defines the related distribution and installation considerations. Utilization equipment designed for a specific application may not deviate from these requirements without the approval of the procuring activity.&lt;/div&gt;
    &lt;/div&gt;</p>
