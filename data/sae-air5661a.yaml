  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides data and general analysis methods for calculation of internal and external, pressurized and unpressurized airplane compartment pressures during rapid discharge of cabin pressure. References to the applicable current FAA and EASA rules and advisory material are provided. While rules and interpretations can be expected to evolve, numerous airplanes have been approved under current and past rules that will have a continuing need for analysis of production and field modifications, alterations and repairs. The data and basic principles provided by this report are adaptable to any compartment decompression analysis requirement.&lt;/div&gt;
    &lt;/div&gt;</p>
