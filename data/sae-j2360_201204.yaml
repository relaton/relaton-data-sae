  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The gear lubricants covered by this standard exceed American Petroleum Institute (API) Service Classification API GL-5 and are intended for hypoid type, automotive gear units, operating under conditions of high-speed/shock load and low-speed/high-torque. These lubricants may be appropriate for other gear applications where the position of the shafts relative to each other and the type of gear flank contact involve a large percentage of sliding contact. Such applications typically require extreme pressure (EP) additives to prevent the adhesion and subsequent tearing away of material from the loaded gear flanks. These lubricants are not appropriate for the lubrication of worm gears.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Appendix A&lt;/span&gt; is a mandatory part of this standard. The information contained in &lt;span class="xref"&gt;Appendix A&lt;/span&gt; is intended for the demonstration of compliance with the requirements of this standard and for listing on the Qualified Products List (QPL) administered by the Lubricant Review Institute (LRI). &lt;span class="xref"&gt;Appendix A&lt;/span&gt; contains a summary of key qualification requirements. A complete listing of qualification requirements and procedures can be found in the Program Document (PD4000) – Gear Lubricant Review Program available from the Performance Review Institute, Attn: Secretary of the LRI, 161 Thorn Hill Road, Warrendale, PA 15086, (724) 772-1616 or at &lt;a href="http://www.pri-network.com" target="_blank"&gt;www.pri-network.com&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;</p>
