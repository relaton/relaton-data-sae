  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies the general requirements for hydraulic system reservoirs that are installed in commercial and military aircraft and helicopters and also in missile hydraulic systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document includes design, test (production and qualification) criteria for various types of reservoirs. &lt;span class="xref"&gt;Appendix A&lt;/span&gt; provides information on hydraulic fluid volume requirements and reservoir sizing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document also provides a basis for the Procurement Specification to completely define individual reservoir requirements.&lt;/div&gt;
    &lt;/div&gt;</p>
