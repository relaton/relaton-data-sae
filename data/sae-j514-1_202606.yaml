abstract:
- language: en
  script: Latn
  content: |-
    <p>This part of SAE J514 covers general and dimensional specifications for 37 degree flared tube fittings. Also included are 37 degree flared fittings with NPTF pipe threads in Appendix B. These fittings are intended for general application in hydraulic systems on industrial equipment and commercial products.
    These fittings are capable of providing leak-proof, full flow connections in hydraulic systems operating at working pressures as specified in Table 6. Since many factors influence the pressure at which a hydraulic system will or will not perform satisfactorily, the values shown in Table 6 should not be construed as a guaranteed minimum.
    For any application, it is recommended that sufficient testing be conducted and reviewed by both the user and fitting manufacturer to assure that performance levels will be safe and satisfactory.</p>
