  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) addresses the design, installation, and testing of coiled tube assemblies using Ti-3Al-2.5V cold worked, stress relieved (CWSR) tubing per AMS4945. It specifically details five different configurations of coiled tubing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The configurations detailed herein should be compatible with pressure levels up to 8000 psi (55.2 MPa) upon completion of analysis for the actual stress and life requirement of the intended application.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Formal qualification tests are recommended to verify satisfactory installation, clamping, and the life of each unique design.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: For information on design of coiled tube assemblies using CRES steel tubing, see ARP584.&lt;/div&gt;

    &lt;/div&gt;</p>
