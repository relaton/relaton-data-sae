  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These specifications cover molded cups 2 in. in diameter and under, compounded from high temperature resistant rubber for use in hydraulic actuating cylinders employing motor vehicle fluid conforming to the requirements specified in SAE J1702 and SAE J1703.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These specifications cover the performance tests of hydraulic brake cups under specified conditions and do not include requirements relating to chemical composition, tensile strength, and elongation of the rubber compound.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Disc brake seals are not covered by this specification.&lt;/div&gt;&lt;/div&gt;</p>
