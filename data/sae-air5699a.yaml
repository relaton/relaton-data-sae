  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Consideration for the damaging effects to aircraft from the failure of wheels and tires should be evaluated. This document discusses the types of problems in-service aircraft have experienced and methodology in place to assist the designers when evaluating threats for new aircraft design. The purpose of this document is to provide a history of in-service problems, provide a historical summary of the design improvements made to wheels and tires during the past 40 years, and to offer methodology which has been used to help designers assess the threat to ensure the functionality of systems and equipment located in and around the landing gear and in wheel wells.&lt;/div&gt;&lt;/div&gt;</p>
