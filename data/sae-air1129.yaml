abstract:
- language: en
  script: Latn
  content: "<p>The primary purpose of a Propellant Transfer Unit (PTU) is to temperature-condition
    and weigh a specific amount of propellant, and transfer if to a vehicle propellant
    tank. A secondary purpose of a PTU may be to drain propellant from the vehicle
    tank and return it to the  transfer unit when required. The transfer unit may
    also be used for flushing the vehicle fill lines and transfer unit with appropriate
    flushing fluids, followed with nitrogen for the purpose of drying the  lines and
    weigh tank. The transfer unit may include provisions for helium purging of the
    propellant transfer tank and lines, ad supplying a blanket of helium pressure
    to the transfer tank. Each PTU consists of a piping system with appropriate propellant
    and pneumatic valves,  regulators, relief valves, filters and a propellant pump.
    Various components such as a scrubber, bubbler, propellant cooler (heat  exchanger),
    propellant weigh tank, weigh scale and a chiller may make up the balance of the
    assembly. The PTU is an integrated assembly with all components mounted on a common
    support frame. Protective covers are provided for those units which operate outside
    of a controlled environment area.</p>"
