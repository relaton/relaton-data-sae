    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Information Report is to provide automotive engineers and designers with a concise statement of the basic characteristics of cast iron under elevated temperature conditions. As such, the report concentrates on general statements regarding these properties with limited illustrative data, anticipating that those who may be interested in more detail will want to use the bibliography provided at the conclusion of the report.&lt;/div&gt;&lt;/div&gt;</p>
