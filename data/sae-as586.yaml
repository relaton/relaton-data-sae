  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard sets forth the minimum quality required for aircraft wheel and brake castings. Its use will establish minimum acceptable requirements for internal structure and surface conditions and is predicated on the use of a casting factor for the ultimate load of 1.51 (minimum) to 2.00 (maximum). When casting factors of 1.25 minimum to 1.50 maximum are used, visual, penetrant, and radiographic or other approved equivalent non-destructive inspection methods shall all be required on each production casting. Where specific parts or areas require a quality level exceeding that described by this standard, the requirements shall be established by negotiation between the purchaser and vendor.&lt;/div&gt;&lt;/div&gt;</p>
