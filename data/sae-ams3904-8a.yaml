abstract:
- language: en
  script: Latn
  content: "<p>This specification covers one type of organic fiber in the form of  yarn. The product shall be formed as a multiplicity of filaments drawn together and gathered into an approximately parallel arrangement. Organic fiber 1500 denier yarn with 390,000 psi (2689 MPa) tensile strength and 8,500,000 psi (59 GPa) tensile modulus for use in weaving into fabric  requiring high tensile strength and moderate modulus of elasticity in  tension.</p>"
