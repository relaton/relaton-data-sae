    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aeronautical Recommended Practice covers two types of two unit Pressure Ratio Instruments each of which consist of a Transducer and an Indicator. The Transducer computes the ratio of two pressures and converts this ratio to a synchro electrical signal which is transmitted to the Indicator.&lt;/div&gt;
