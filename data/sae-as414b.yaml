  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers two basic types of temperature instruments as follows:
    &lt;div class="table-wrap anchor "&gt;
    &lt;div class="table-container"&gt;&lt;table class="br-none tbr-void " data-dataset-id=""&gt;
    &lt;tbody&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Type I:&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Ratiometer type, actuated by changes in electrical resistance of a temperature sensing electrical resistance element; the resistance changes being obtained by temperature changes of the temperature sensing resistance element.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Type II:&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Millivoltmeter type, operated and actuated by varying EMF output of a thermocouple; the varying EMF input to the instrument being obtained by temperature changes of the temperature sensing thermocouple.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div/&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;</p>
