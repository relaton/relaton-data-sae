  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements and test procedures for automotive miniature bulb retention devices, including wedge base sockets with integral connectors, direct wire wedge base sockets, bayonet base sockets with integral connectors, direct wire bayonet base sockets, wedge base and bayonet base sockets with circuit plate assemblies, and associated interfaces.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Tests shall follow the sequence shown in the flow charts in &lt;span class="xref"&gt;Appendices E&lt;/span&gt; and &lt;span class="xref"&gt;F&lt;/span&gt; whenever the following occurs:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;New design.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Design, material, or process change made to an existing device, which could affect the outcome of the test.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;The test sequences shown in &lt;span class="xref"&gt;Appendix G&lt;/span&gt; shall be run annually.&lt;/div&gt;
    &lt;/div&gt;</p>
