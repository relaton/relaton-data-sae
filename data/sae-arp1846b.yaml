  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Recommendations presented in this document are intended primarily for the acquisition of far-field noise data. The test engine is to be appropriately configured and operated so that the sound pressure levels obtained are consistent with the specific objectives of the test. The principal output of the data reduction system is one-third octave band sound pressure levels. However, when appropriate, data may be recorded for purposes of broader or narrower bandwidth analysis.&lt;/div&gt;
    &lt;/div&gt;</p>
