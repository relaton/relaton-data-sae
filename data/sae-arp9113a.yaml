  content: |-
    <p>Supply Chain Risk Management (SCRM), defined in this guideline, can be applied proactively for the protection of all procured products and services; both flying and non-flying through all levels of the supply chain.

    The guideline focuses on Quality as a key risk assessment factor taking into accoutn elements from all aspects of the business having a direct link to global quality management.</p>
