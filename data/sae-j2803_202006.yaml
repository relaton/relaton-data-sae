  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the boundary line for establishing dimensional compatibility between air disc brake calipers and 22.5 x 8.25 inch disc wheels, including bent valve stems on steel wheels and manufacturer recommended valve stems on aluminum wheels. The line establishes the minimum wheel with valve stem envelope to allow interchangeability. The line does not accommodate customer-specific wheels (such as OEM-specific stylized wheels) or customer-specific brakes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document addresses dimensional characteristics only and makes no reference to the performance, operational dynamic deflections or heat dissipation of the system. It is up to the system integrator to ensure sufficient clearance exists between the caliper, wheel and valve stem to provide safe operating conditions. Mounting systems as noted are referenced in SAE J694.&lt;/div&gt;&lt;/div&gt;</p>
