abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this standard is to provide uniform physical item identification
    marking, in constantly recurring symbols, of nickel and nickel alloy mill products
    procured and issued for government agencies and their contractors.  Applicability
    shall be by specific reference to this standard in specification, contract, or
    purchase order.  Shipment and inspection acceptance markings are not within the
    scope of this document.</p>"
