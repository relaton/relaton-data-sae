  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Most signal and marking lighting devices have light sources (bulbs), which can be based on either filament or LED technology. To assure field replacement, it is important that light source types employed be readily available in normal service channels. This document defines the physical, electrical, and photometric characteristics necessary to achieve a proper replacement for popular types of signal and marking light sources.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Some of the design characteristics in this document are listed solely for the sake of standardization and are not intended to describe the performance of lighting devices (lamp assemblies) on the vehicle.&lt;/div&gt;&lt;/div&gt;</p>
