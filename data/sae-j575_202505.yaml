    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances. This document provides standardized laboratory tests, test methods and equipment, and requirements for lighting devices covered by SAE Recommended Practices and Standards. It is intended for devices used on vehicles less than 2032 mm in width. Tests for vehicles larger than 2032 mm in overall width are covered in SAE J2139. Device-specific tests and requirements can be found in applicable SAE Technical Reports.&lt;/div&gt;&lt;/div&gt;</p>
