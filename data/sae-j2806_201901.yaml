abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Subject document is specifically intended for service brakes and service brakes when used for parking and/or emergency brakes (only) that are commonly used for automotive-type, ground-wheeled vehicles exceeding 4536 kg (10000 pounds) gross vehicle weight rating (GVWR). Subject specification provides the off-vehicle procedures, methods, and processes used to objectively determine suitability of tactical and combat ground-wheeled vehicle brake systems and selected secondary-item brake components (aka, aftermarket or spare parts), including brake “block” for commercial applications only, specifically identified within subject document. Subject specification is primarily based on known industry and military test standards utilizing brake inertia dynamometers. Targeted vehicles and components include, but may not be limited to, the following:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Civilian, commercial, military, and militarized-commercial ground-wheeled vehicles such cargo trucks, vocational vehicles, truck tractors, trailers, and specialized support and engineering equipment under the generic heading of ground vehicle “dry” brake systems (GVDBS).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Hydraulic, air, and mechanical “dry” disc brake and drum brake systems, when used as service brakes, including service brakes (only), when used as emergency and/or parking brakes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Hydraulic, air, and mechanical “dry” disc brake pad assemblies and rotor assemblies.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Hydraulic, air, and mechanical “dry” drum brake shoe assemblies and drum assemblies.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Hydraulic, air, and mechanical brake “block” when intended for use on a. through d. above, except for those vehicles, pad assemblies, and shoe assemblies specifically procured for military use and/or tested under ATPD-2354. It must be noted that the U.S. Government’s Military Services buys only assemblies, and doesn’t normally use “brake block” and relined brake shoes/pads; therefore, testing using separate brake “block” was specifically excluded from ATPD-2354 by the original authors.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
