    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard incorporates driving cycles that produce fuel consumption data relating to Urban, Suburban, and Interstate driving patterns and is intended to be used to determine the relative fuel economy among vehicles and driving patterns under warmed-up conditions on test tracks, suitable roads, or chassis dynamometers.&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; The urban driving cycle forms the basis of a Cold-Start Test Procedure described in SAE J1256.&lt;/div&gt;
    &lt;/div&gt;</p>
