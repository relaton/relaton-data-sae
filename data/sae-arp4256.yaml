  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers monochrome and color LCDs (transmissive, transflective, and reflective), both matrixed and segmented in format, and is applicable to the following types of displays:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Flight and navigation displays&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Engine, systems, and warning devices&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Control displays&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;In this document the terms “LCD”, “LCD Display”, “Display”, and “Instrument” are synonymous and encompass the display system (e.g., LCD device, drivers, backlight, display processor, etc.), not just the device.&lt;/div&gt;
    &lt;/div&gt;</p>
