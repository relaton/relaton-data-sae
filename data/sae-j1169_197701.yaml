    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the test procedure, environment, and instrumentation to be used for measuring the exhaust sound level for passenger cars and light trucks under stationary conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This sound level measurement procedure has been developed as a guide for governmental agencies establishing vehicle in-service sound level limitations and enforcement measurement procedures. It is directed at the assessment of vehicle exhaust noise and is not designed to determine maximum vehicle sound levels.&lt;/div&gt;&lt;/div&gt;</p>
