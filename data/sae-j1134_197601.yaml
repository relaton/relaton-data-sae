  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes a single bolt pattern for both No. 1 and No. 2 clutch housings (see &lt;span class="xref"&gt;Fig. 1&lt;/span&gt;).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This four-bolt pattern is designated to give commonality of mounting brackets in existing frame rails.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The 16.5 in span, pad face to pad face, allows the ease of installation in existing frame rail widths. This is also the minimum spacing which will accommodate a 15 in two-plate clutch. The bolt pattern due to its symmetry allows reversing or inverting of brackets to attain change in vertical or horizontal positioning with fewer brackets.&lt;/div&gt;
    &lt;/div&gt;</p>
