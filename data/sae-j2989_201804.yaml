    &lt;div class="htmlview paragraph"&gt;This standard is intended for the automotive industry. Testing methods may specifically define the handling and packaging conditions for the material to be analyzed. In these cases, follow the method as closely as possible. Use this standard as a guide, where the protocol for handling and packaging the samples between part production and testing may be undefined.&lt;/div&gt;
