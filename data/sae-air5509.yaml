  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines the process steps involved in collecting and processing engine test data for use in understanding engine behavior. It describes the use of an aero-thermal cycle model for reduction and analysis of those data. The analysis process may include the calculation of modifiers to match the model to measured data, and prediction of engine performance based on that analysis&lt;/div&gt;

    &lt;/div&gt;</p>
