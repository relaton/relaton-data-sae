    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice identifies and defines the specifications most commonly used to describe high-speed steel track and articulated rubber-tired clam bunk skidders. The illustrations used are not intended to be descriptive of any existing machine or dictate a combination needed for a particular logging situation. The dimensions indicated are basic and may be supplemented by the individual machine manufacturer.&lt;/div&gt;
