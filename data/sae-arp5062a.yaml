  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to provide recommended test fluids for testing of electrical components used on aircraft exterior or for ground support near aircraft. These fluids were selected based on a consolidation of test fluids used by military and commercial sources and on review of national and international component specifications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These recommendations are general guidelines. Safety factors for any unusual testing applications or operating conditions should be given special consideration by the designer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test fluids provided are intended to be recommendations and are not intended to limit or supersede those recommended by aircraft or ground support equipment manufacturers.&lt;/div&gt;&lt;/div&gt;</p>
