  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;The chart is to include basic maintenance items that the manufacturer considers essential for normal operation of the machine. The chart is not intended to cover all maintenance functions and should refer the user to the manufacturers’ manuals.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Attachments may be included on the chart with the standard machine or covered by separate charts. When preparing a chart, consult SAE J752b, Maintenance Interval and SAE J754a. Lubricant Types.&lt;/div&gt;
    &lt;/div&gt;</p>
