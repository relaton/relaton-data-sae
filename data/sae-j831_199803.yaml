    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard contains the industry standard definitions for electrical equipment used in the generation of electric power onboard today's conventional road vehicles. It is intended to complement the electronic terminology that was formerly documented in SAE J1213 (canceled) and/or in other industry glossaries of electrical/electronic devices.&lt;/div&gt;&lt;/div&gt;</p>
