  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Table 1&lt;/span&gt; lists the components of construction and industrial equipment and the various lubricants which may be used. &lt;span class="xref"&gt;Table 2&lt;/span&gt; lists lubricant types and identifying abbreviations. Lubricants that had common usage in the past are retained in &lt;span class="xref"&gt;Table 2&lt;/span&gt; to show where the new specifications originated.&lt;/div&gt;


    &lt;div class="htmlview paragraph"&gt;Original factory lubrication may deviate from field recommendations because of special requirements, such as breakin.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Lubricant viscosity grade should be selected for various climatic conditions (described in SAE J300 and SAE J307).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The final selection of the lubricant and grade will depend upon the requirements of the equipment manufacturer.&lt;/div&gt;
    &lt;/div&gt;</p>
