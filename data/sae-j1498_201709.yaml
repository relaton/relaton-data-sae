  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The heating value or heat of combustion is a measure of the energy available from the fuel. The fraction or percentage of the heat of combustion that is converted to useful work is a measure of the thermal efficiency of an engine. Thus, a knowledge of the heat of combustion of the fuel is basic to the engineering of automotive engines. This SAE Information Report provides information on the standardized procedures for determining the heat of combustion of fuels that may be used for automotive engines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The changes to SAE J1498 include:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE Publications - Added SAE Paper 2010-01-1517&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Other Publications and &lt;span class="xref"&gt;Sections 5&lt;/span&gt;, &lt;span class="xref"&gt;9&lt;/span&gt;, and &lt;span class="xref"&gt;10&lt;/span&gt; - Updated ASTM alphanumeric designations and titles.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 10&lt;/span&gt; - Added discussion of a method to calculate net heating value for gasoline-ethanol blends using ASTM D3338.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
