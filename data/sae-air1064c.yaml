  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The landing gear is a complex multi-degree of freedom dynamic system and may encounter vibration problems induced by braking action. The vibratory modes can be induced by several frictional characteristics and brake design features. These should be assessed during the design concept and verified during the development of the hardware.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) has been prepared by a panel of the A-5A Subcommittee to present an overview of the landing gear system problems associated with aircraft brake dynamics and the approaches to the solution of these problems. In addition, facilities available for test and evaluation are presented and discussed.&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;</p>
