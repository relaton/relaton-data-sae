    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines the minimum normal operating space envelope for clothed seated (SAE J899 seat configuration) and standing operators (95th percentile operator, SAE J833).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to off-road, self-propelled work machines used in construction, general purpose industrial, agricultural, and forestry as identified in SAE J1116.&lt;/div&gt;
