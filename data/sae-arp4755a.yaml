  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This paper describes a recommended practice and procedure for the correlation of test cells that are used for the performance testing of turboprop and turboshaft engines. This Aerospace Recommended Practice (ARP) shall apply to both dynamometer and propeller based testing. Test cell correlation is performed to determine the effect of any given test cell enclosure and equipment on the performance of an engine relative to the baseline performance of that engine.&lt;/div&gt;&lt;/div&gt;</p>
