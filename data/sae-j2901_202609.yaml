abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of the specification is to present a functional set of requirements which define the user and hardware interfaces while providing sufficient capability to meet the misfire patterns for compliance demonstration and engineering development. Throughout this requirement, any reference to “ignition or injector control signal” is used interchangeably to infer that the effected spark ignition engine’s ignition control signal or the compression ignition engine’s injector control signal is interrupted, timing phased, or directly passed by the misfire generator.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For spark ignition engines, the misfire generator behaves as a spark-defeat device which induces misfires by inhibiting normal ignition coil discharge. It does so by monitoring the vehicle’s ignition timing signals and suspends ignition coil saturation for selected cylinder firing events. The misfire generator will thereby induce engine misfire in spark ignited gasoline internal combustion engines; including rotary engines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For compression ignition engines, the misfire generator behaves as a fuel injection-defeat device which induces misfire by inhibiting the normal fuel injection pulses. It does so by monitoring the injection pulses signal and suspending the injection pulses for selected cylinder firing events. The misfire generator will thereby induce engine misfire in compression ignition engines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This requirement assumes that the user has a fundamental understanding of misfire diagnostics as well as ignition controls. This requirement is not intended to be an introductory misfire guideline or interpretation of regulatory requirements.&lt;/div&gt;
    &lt;/div&gt;</p>
