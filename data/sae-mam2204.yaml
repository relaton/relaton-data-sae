  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established metric manufacturing tolerances applicable to aluminum alloy standard structural shapes ordered to metric dimensions. Standard structural shapes are shapes in certain standard alloys, tempers, sizes, and sections such as angles, channels, Tees, Zees, I-Beams, and H-Beams commonly used for structural purposes. These tolerances apply to all conditions, unless otherwise noted.&lt;/div&gt;&lt;/div&gt;</p>
