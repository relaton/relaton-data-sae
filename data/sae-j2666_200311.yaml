  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The Gauge Evaluation Procedure Task Force was formed by the Non-Hydraulic Hose Committee to develop a gauge evaluation procedure to be used when evaluating the capability of gauges used for hose measurement. The use of a standard method for gauge evaluation will help users easily compare equipment capability. The information provided in this recommendation is based on the methods used to produce the data presented in SAE J1759 and J2605.&lt;/div&gt;&lt;/div&gt;</p>
