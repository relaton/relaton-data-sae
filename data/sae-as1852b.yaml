  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines the maximum allowable free opening dimensions for airframe fueling ports on civil aircraft that require the exclusive use of gasoline as an engine fuel and the minimum free opening dimensions for airframe fueling ports on civil aircraft that operate with turbine fuels as the primary fuel type.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In addition, this document defines the minimum fuel nozzle tip dimensions for turbine fuel ground service equipment and the maximum fuel nozzle tip diameter for gasoline ground service equipment.&lt;/div&gt;
    &lt;/div&gt;</p>
