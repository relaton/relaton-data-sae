  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice specifies an intrusion resistance test method for glazing systems installed in motor vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Intrusion resistance performance is determined not solely by the glazing but also by the glazing attachment to the vehicle and by the vehicle structure. Therefore, the glazing/ attachment /vehicle structure must be tested as a single unit.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This test determines intrusion resistance only. The test applies to those materials that meet the requirements for use as safety glazing materials as specified in Safety Standard ANSI/SAE Z26.1 or other applicable standards. The test applies to all installation locations.&lt;/div&gt;&lt;/div&gt;</p>
