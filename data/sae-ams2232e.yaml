  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established manufacturing tolerances for carbon steel sheet, strip, and plate. Tolerances shown herein shall apply unless otherwise specified. These tolerances apply to all conditions and are based on individual measurements, unless otherwise noted. The term "excl" is used to apply only to the higher figure of the specified range. Tolerances for product sizes not listed herein shall be as agreed upon by purchaser and vendor.&lt;/div&gt;&lt;/div&gt;</p>
