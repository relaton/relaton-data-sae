  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAEJ2521 procedure is applicable to high frequency squeal type noise occurrences for passenger car and light truck type vehicles that are used under conventional operating conditions. The procedure incorporates high temperature and low temperature test matrices, but does not fully account for the effects of the environment on brake squeal. Much research is currently underway in this area and can potentially be incorporated in future revisions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAEJ2521 procedure is applicable to high frequency squeal type noise occurrences for passenger car and light truck type vehicles that are used under conventional operating conditions. For the purposes of this test procedure, squeal is defined as occurring between 900 and 17,000 Hz for disc brake tests utilizing a full suspension corner assembly, between 2000 and 17,000 Hz for disc brakes not utilizing a full suspension corner assembly and between 500 and 17,000 Hz for drum brakes.&lt;/div&gt;

    &lt;/div&gt;</p>
