  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines a set of standard application layer interfaces called JAUS Environment Sensing Services. JAUS Services provide the means for software entities in an unmanned system or system of unmanned systems to communicate and coordinate their activities. The Environment Sensing Services represent typical environment sensing capabilities commonly found across all domains and types of unmanned systems in a platform-independent manner. At present, twelve services are defined in this document:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Range Sensor: Determine the proximity of objects in the platform’s environment&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Visual Sensor: Provides common configuration and setup for different types of imaging systems&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Digital Video: A type of Visual Sensor that manages digital video&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Analog Video: A type of Visual Sensor that manages analog video&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Still Image: A type of Visual Sensor that manages and encodes individual digital images&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Digital Audio Sensor: Provides common configuration and setup for different types of audio streams&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Digital Audio Output: Send streaming audio to a destination, frequently a speaker on a remote platform&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Digital Resource Discovery: Support run-time discovery of RTSP-based streaming audio and video&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Force Torque Sensor: Report the forces and torques measured in six degrees of freedom&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;H264 Video Encoding: Configure the parameters of an H.264 based video encoded stream&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Port Mapper: Provides a bridge between internal and external networks, similar to Network Address Translation&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Video Illuminator: Control one or more lights associated with one or more cameras&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;Each service is described by a JAUS Service Definition (JSD) which specifies the message set and protocol required for compliance. Each JSD is fully compliant with the JAUS Service Interface Definition Language (AS5684).&lt;/div&gt;


    &lt;/div&gt;</p>
