  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The desired system for aircraft instrument panel and cockpit lighting is one that will furnish light of adequate intensity and distribution under all conditions of external lighting so that the crew may read instrumentation, placards, check lists, manuals, maps, instrument color coding, distinguish controls, etc., without undue interference with their vision outside of the aircraft.&lt;/div&gt;&lt;/div&gt;</p>
