  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides general and dimensional specifications for the most common hose fittings used in conjunction with hydraulic hoses specified in SAE J517 and utilized in hydraulic systems on mobile and stationary equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The general specifications contained in &lt;span class="xref"&gt;Sections 1&lt;/span&gt; through &lt;span class="xref"&gt;15&lt;/span&gt; are applicable to all hydraulic hose fittings and supplement the detailed specifications for the 100R-series fittings contained in the later sections of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document shall be utilized as a procurement document only to the extent agreed upon by the manufacturer and user.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Refer to SAE J517 for specifications of hose and information on hose assemblies. SAE J1273 contains information on application factors affecting hose fittings, hose, and hose assemblies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;THE RATED WORKING PRESSURE OF A HOSE ASSEMBLY COMPRISING SAE J516 FITTINGS AND SAE J517 HOSE SHALL NOT EXCEED THE LOWER OF THE TWO WORKING PRESSURE RATED VALUES.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following are hose fitting types contained in this document:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Male dryseal pipe thread hose fittings shall be as shown in &lt;span class="xref"&gt;Figure 2&lt;/span&gt; for the respective styles, and in &lt;span class="xref"&gt;Table 2&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Male straight thread O-ring hose fittings shall be as shown in &lt;span class="xref"&gt;Figure 3&lt;/span&gt; or the respective styles, and in &lt;span class="xref"&gt;Table 3&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Male 37° flare hose fittings shall be as shown in &lt;span class="xref"&gt;Figure 4&lt;/span&gt; for the respective styles, and in &lt;span class="xref"&gt;Table 4&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Female 37° flare hose fittings shall be as shown in &lt;span class="xref"&gt;Figures 5&lt;/span&gt; to &lt;span class="xref"&gt;5B&lt;/span&gt; for the respective styles and shapes, and in &lt;span class="xref"&gt;Tables 5&lt;/span&gt; to &lt;span class="xref"&gt;5B&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Male 45° flare hose fittings shall be as shown by the 37° figures and tables.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Female 45° flare hose fittings shall be as shown by the 37° figures and tables.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;g&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Male flareless 24° cone hose fittings shall be as shown in &lt;span class="xref"&gt;Figure 6&lt;/span&gt; and in &lt;span class="xref"&gt;Table 6&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;h&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Female flareless 24° cone hose fittings shall be as shown in &lt;span class="xref"&gt;Figure 7&lt;/span&gt; and in &lt;span class="xref"&gt;Table 7&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;i&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;4-bolt split flange hose fittings shall be as shown in &lt;span class="xref"&gt;Figures 8&lt;/span&gt; to &lt;span class="xref"&gt;8F&lt;/span&gt; for the respective styles and shapes, and in &lt;span class="xref"&gt;Tables 8&lt;/span&gt; to &lt;span class="xref"&gt;8F&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;j&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Male O-ring face seal hose fittings shall be as shown in &lt;span class="xref"&gt;Figure 9&lt;/span&gt; for the respective styles, and in &lt;span class="xref"&gt;Table 9&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;k&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Female O-ring face seal hose fittings shall be as shown in &lt;span class="xref"&gt;Figures 10&lt;/span&gt; to &lt;span class="xref"&gt;10B&lt;/span&gt; for the respective styles, and &lt;span class="xref"&gt;Tables 10&lt;/span&gt; to &lt;span class="xref"&gt;10B&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;It is recommended that where step sizes or additional types of fittings are required, they be designed to conform with the specifications of this document insofar as they may apply. The following general specifications shall supplement the dimensional data contained in the tables with respect to all unspecified detail.&lt;/div&gt;&lt;/div&gt;</p>
