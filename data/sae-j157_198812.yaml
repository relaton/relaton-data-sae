    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the mechanical and chemical requirements of oil tempered chromium silicon alloy steel wire used for the manufacture of springs requiring resistance to set when used at moderately elevated temperatures. It also covers the basic material and processing requirements of springs fabricated from this wire.&lt;/div&gt;&lt;/div&gt;</p>
