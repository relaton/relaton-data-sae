    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform engineering nomenclature for wide base disc wheels and demountable rims. This nomenclature and accompanying figures are intended to define fundamental wide base disc wheel and demountable rim terms. The dimensions given are those necessary to maintain serviceability and interchangeability of the wide base disc wheels and demountable rims with standard hardware. Valve clearances have not been included in this document.&lt;/div&gt;&lt;/div&gt;</p>
