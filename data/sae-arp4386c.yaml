    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) comprises the technical terms and nomenclature, together with their definitions and abbreviations that are used in aerospace Fluid Power Actuation and Control Systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: When a term is applicable to more than one branch or segment of the technology it may have different meanings and definitions in each. Where this occurs the multiple listings with appropriate designations will be shown under the same primary term.&lt;/div&gt;


