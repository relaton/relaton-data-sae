  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this Recommended Practice is limited to gasoline fuel pumps used in automotive direct fuel injection systems. It is primarily restricted to bench tests.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice also defines the minimum design verification testing that is recommended to verify the suitability of Gasoline Direct Injection (GDI) High Pressure fuel pumps used for pumping gasoline or gasoline blend fuels. Additional tests not specified in SAE J2714 will be required for non-automotive pump applications or pumps, such as those intended for use on aircraft, motorcycles, or marine equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Except where stated, test results are recorded for individual parts under recommended test conditions. Where population characteristics are reported, the sample size, selection method, and statistical analysis technique must be explicitly stated.&lt;/div&gt;&lt;/div&gt;</p>
