  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is offered to provide state-of-the-art information about design factors that must be considered in the design of new or significantly modified engine test cells used to test propeller equipped turboprop engines in either QEC or bare engine configurations. The report does not address design considerations for test cells designed to test turboprop engines with dynamometer type load absorption devices because they are essentially tested as turboshaft engines. Design considerations for those test cells are presented in AIR4989, Reference 2.1.&lt;/div&gt;
    &lt;/div&gt;</p>
