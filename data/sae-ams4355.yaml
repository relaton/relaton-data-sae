    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers discontinuously reinforced aluminum alloy (DRA) metal matrix composites (MMC) made by mechanical alloying of the 2124A powder and SiC particulate, which is then consolidated by Hot Isostatic Pressing (HIP) into shapes less than 62 in&lt;sup&gt;2&lt;/sup&gt; (0.04 m&lt;sup&gt;2&lt;/sup&gt;) cross-section (see &lt;span class="xref"&gt;8.11&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
