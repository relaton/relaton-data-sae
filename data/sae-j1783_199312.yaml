    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Hydrospace Recommended Practice provides the designer with guidance for the selection of directional control valves for use in the hydraulic systems of surface ships and submersibles. This guidance includes use of standard valves and interfaces, minimum envelopes which should be reserved to permit interchangeability, and environmental considerations.&lt;/div&gt;&lt;/div&gt;</p>
