  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines test methods and general requirements at all phases of development, production, and field analysis of electrical terminals (including sense pins), connectors, and components that constitute the jump-start connection for road vehicles having 42 V (nominal) electrical systems. The 42 V jump start connector is always remote from the vehicle battery and may take the form of an in-line or Header Connection, either of which is in an accessible location for attachment of a jumper cable from an assist vehicle or battery charger.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;WARNING—The Jump Start Connector requires environmental protection. This specification assumes that such protection is in place and remains effective for the life of the vehicle. The level of protection depends on the vehicle packaging environment and duty cycle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Appendix B&lt;/span&gt; of this document contains the physical specification for the Jump Start Connector.&lt;/div&gt;&lt;/div&gt;</p>
