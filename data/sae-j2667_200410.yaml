    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a minimum standard for evaluating squeeze-type resistance spot welding (STRSW) equipment and minimum weld performance criteria for two-sided automotive collision repair welding. This document contains several standardized test methods that are designed for evaluating equipment performance in a laboratory environment.&lt;/div&gt;

