  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform engineering nomenclature for the most common wheel constructions, and their components used on passenger cars, light trucks, and multipurpose vehicles. These wheel constructions are welded disc wheels, cast wheels, forged wheels, composite wheels and hybrid wheels. This nomenclature and the accompanying drawings are intended to define fundamental wheel terms rather than to provide a comprehensive tabulation of all wheel design types.&lt;/div&gt;&lt;/div&gt;</p>
