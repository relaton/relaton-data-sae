abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The provisions of this SAE Aerospace Recommended Practice (ARP) cover minimum performance requirements and design parameters for preconditioned air (PCA) devices supplying air to the aircraft cabin. It identifies the need for interim and future performance improvement for ground equipment delivery systems, to meet industry requirements for reducing airborne compounds or particulates (“source types”) in the aircraft cabin and flight deck. This ARP will guide SAE, IATA, airline operators, and airframe and PCA manufacturers to meet new requirements. This ARP defines:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Minimum performance and maintenance requirements for filtration, hose assemblies, operations, and maintenance.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Level of humidity supplied by the ground equipment to the aircraft cabin.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Minimum performance and maintenance requirements for digital communication of cabin parameters between the cabin and the PCA.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Installation of the sensor unit within the aircraft cabin. The data collected by these sensors is not intended to assess impacts on aircraft occupant health and shall not be used to make a finding of airworthiness.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;

    &lt;/div&gt;</p>
