    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report provides information on certain fuels that are being used or have been suggested as alternatives to motor gasoline (SAE J312) or automotive diesel fuel (SAE J313) for use in spark-ignition or compression-ignition engines. Some of these fuels are derived from petroleum while others are from non petroleum sources.&lt;/div&gt;&lt;/div&gt;</p>
