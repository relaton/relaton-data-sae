abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This standard specifies the characteristics of the SAE Linear Token Passing Bus (LTPB) Interface Unit.&lt;/p&gt;
    &lt;p&gt;The LTPB provides a high reliability, high bandwidth, low latency serial interconnection netwrok suitable for utilization in real time military and commercial applications. Multiple redundant data paths can be implemented to enhance reliability and survivability in those applications that require these attributes. The token passing and data exchange protocols are optimized to provide low latency and fast failure detection and correction. Physical configurations with bus lengths up to 1000 meters can be accommodated.&lt;/p&gt;</p>
