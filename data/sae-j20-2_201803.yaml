    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides ordering information for any SAE 20R5 hose type (such as “EC, HT, LT” or combination thereof.) This is a wire-reinforced hose for coolant circulating systems of automotive type engines. This hose consists of a convoluted section with plain ends. The hose shall contain a wire helix or helices in the convoluted section. It is a supplement for Government use but may be used by others.&lt;/div&gt;&lt;/div&gt;</p>
