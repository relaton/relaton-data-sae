    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) is to be used as a supplement to SAE AS7109. In addition to the requirements contained in AS7109, the requirements contained herein shall apply to suppliers seeking NADCAP Coatings accreditation who are engaged in plating of coated parts. Demonstrated compliance (as described in SAE AS7003) to SAE AS7108 satisfies the requirements contained herein.&lt;/div&gt;&lt;/div&gt;</p>
