abstract:
- language: en
  script: Latn
  content: "<p>It is the purpose of the SAE Recommended Practice to define the minimum
    requirements for hole placement on Dozer End Bit supports.  The recommended practice
    applies to straight blade, angling blade, U blade, and semi-U blades used on earthmoving
    tractors per SAE J1057a up to a maximum weight of 100,000 lb (45,000 kg).</p>"
