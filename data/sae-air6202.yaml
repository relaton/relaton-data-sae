  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this information report applies to the steady state measurement of direct mass fuel flow in gas turbine engine test cells. A measurement accuracy, and hence uncertainty of between ±0.1 to ±0.2% of value is believed to be achievable for liquid flow applications with some meter models/installations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Whilst capable of general transient measurement in 50 to 100 Hz region, this type of fuel meter is not capable of rapid transient measurement (in 100 to 250 Hz region). It is also not currently considered suitable for "in flight" fuel flow measurement.&lt;/div&gt;&lt;/div&gt;</p>
