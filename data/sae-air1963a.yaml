  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) identifies Propulsion Engineer’s recommendations for the instrumentation that is required for the safe operation and maintenance of turbine engines as installed in helicopters. It should be used as a guide for cockpit layout, as well as a reference for maintenance considerations throughout the propulsion area. Propulsion instruments should receive attention early in the design phase of the helicopter. Maintenance and diagnostics recorders are not considered within the scope of this document. (See ARP1587, “Aircraft Gas Turbine Engine Monitoring System Guide”.)&lt;/div&gt;&lt;/div&gt;</p>
