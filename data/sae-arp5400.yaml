abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides guidelines for consolidation and standardization of commercial jet transport parts, materials, and processes currently defined by two or more company or industry standards. Included in this ARP are processes for selecting and evaluating standardization opportunities as well as a procedure for initiating the development and release of global aerospace industry standards. These practices are intended to be used when two or more company standards appear to have significant overlap or in fact be technically identical. Benefits of such standardization efforts include part numbers and potentially reduced inventory levels, reduced errors, reduced qualification costs, and reduced equipment life cycle costs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP is intended to be used by any two or more companies involved in the aerospace industry that wish to benefit from standardization. For the purpose of this document, companies undertaking such a standardization effort shall be referred to as a standardization committee.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The goal of such a standardization committee is not the actual development of an industry standard, but the identification of a valuable standardization opportunity. The actual development of the industry standard which will support the standardization effort will take place within an established Standards Developing Organization (SDO) according to the rules of due process.&lt;/div&gt;&lt;/div&gt;</p>
