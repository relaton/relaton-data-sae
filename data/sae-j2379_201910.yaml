  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to the function of building reciprocating spark-ignition engines which are used in conjunction with standard and high-performance ancillary components in applications intended to achieve a minimum of 1 hp/in&lt;sup&gt;3&lt;/sup&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not apply to rebuilt engines which may only be partially repaired with little or no machining, nor does it apply to second-hand or used engines.&lt;/div&gt;&lt;/div&gt;</p>
