  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) addresses the general requirements for data recording procedures, packaging, and storing of elastomeric seals and seal assemblies which include an elastomeric element prior to the seal being assembled into hardware components. It applies specifically to those elastomeric seals and seal assemblies packaged shortly after manufacture. The storage period prior to installation of the elastomeric seals and seal assemblies into hardware components is commonly referred to as shelf life.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The information contained in this ARP is intended to be utilized by those organizations who do not have specific requirements or recommendations already in place for the control of elastomeric seals and seal assemblies. This ARP can be specified in control, storage, and procurement documents. However, when the requirements of this document are in conflict with the customer's requirements or specifications, the requirements of the customer's detailed specification shall govern.&lt;/div&gt;
    &lt;/div&gt;</p>
