  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the minimum required performance and validation for the seatbelt pyrotechnic pretensioners integrated into retractors, buckles, and/or anchors. It also includes pyro for switchable load limiters. This specification is intended to focus on the performance of the tensioner function integrated into the aforementioned devices and NOT the entirety of the device integrated into the vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;See &lt;span class="xref"&gt;Figure 1&lt;/span&gt; in &lt;span class="xref"&gt;2.2&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
