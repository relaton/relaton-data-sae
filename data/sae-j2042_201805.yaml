    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides requirements, test procedures, and installation guidelines for clearance, sidemarker, and identification lamps intended for use on vehicles 2032 mm or more in overall width. Sidemarker lamps conforming to the requirements of this document may also be used on vehicles less than 2032 mm in overall width.&lt;/div&gt;&lt;/div&gt;</p>
