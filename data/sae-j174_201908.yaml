  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test procedure is intended to provide a quality control method for checking torque-tension characteristics of non-prevailing torque-type threaded steel fasteners 1/4 through 1 in nominal diameters. Realistically torque-tension relationships for specific individual fastener assembly joints will vary due to the different joint parameters. Tests using actual joint components will be required to determine accurate torque-tension values for those conditions. For the metric version, see SAE J174M.&lt;/div&gt;&lt;/div&gt;</p>
