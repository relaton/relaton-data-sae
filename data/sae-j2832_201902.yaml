  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers stress relieved electric resistance welded flash controlled single wall high strength low alloy steel tubing intended for use in high-pressure hydraulic lines and in other applications requiring tubing of a quality suitable for bending, double flaring,cold forming and brazing. Material produced to this specification is not intended to be used for single flare applications due to the potential leak path caused by the ID weld bead. The grade of material produced to this specification is of micro-alloy content. Nominal reference working pressures for this tubing are listed in ISO 10763 and SAE J1065.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Brazed and/or welded tube assembly configurations made to specific geometry and components in association with this material may require qualification testing in accordance with ISO 19879. Cold forming the tube end configurations avoids this systemic testing by not compromising the structural integrity of the tube material.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In an effort to standardize within a global marketplace and ensure that companies can remain competitive in an international market, it is the intent to convert to metric tube sizes, which will:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Lead to one global system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Guide users to preferred system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Reduce complexity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Eliminate inventory duplications&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
