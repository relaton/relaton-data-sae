  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test procedure is intended to provide a quality control method for checking torque-tension characteristics of non-prevailing torque-type threaded steel fasteners 6 through 24 mm nominal diameters. Realistically, torque-tension relationships for specific individual fastener assembly joints will vary due to the different joint parameters. Tests using actual joint components will be required to determine accurate torque-tension values for those conditions. For the inch series version, see SAE J174.&lt;/div&gt;&lt;/div&gt;</p>
