  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice provides a common method to measure wear of friction materials (brake pad assemblies and brake shoes) and their mating parts (brake disc or brake drum). These wear measurements apply to brakes fitted on passenger cars and light trucks up to 4536 kg of Gross Vehicle Weight Rating under the Federal Motor Vehicle Safety Standard (FMVSS), or vehicles category M1 (passenger cars up to nine occupants, including the driver) under the European Community’s ECE Regulations.&lt;/div&gt;
    &lt;/div&gt;</p>
