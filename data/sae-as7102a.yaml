  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for Heat Treating Accreditation by the National Aerospace and Defense Contractors Accreditation Program (NADCAP). These requirements may be supplemented by additional requirements specified by the NADCAP Heat Treating Task Group. Using the audit checklist (AC7102) will ensure that accredited heat treat suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All instructions, procedures, tests and inspection records, etc., referenced herein shall be in writing; distribution of instructions and procedures (including all revisions) shall be recorded and controlled.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The NADCAP Heat Treating Task Group recognizes SAE AS7004, SAE AS7106, and SAE AS7107 as equivalent to the systems questions of this document as noted in the NADCAP Auditor Handbook.&lt;/div&gt;&lt;/div&gt;</p>
