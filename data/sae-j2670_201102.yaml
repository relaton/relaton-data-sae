  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard applies to any and all additives and chemical solutions intended for aftermarket use in the refrigerant circuit of vehicle air-conditioning systems with belt-driven compressors, except as noted below. This standard provides testing and acceptance criteria for determining the stability and compatibility of additives and flushing materials (solutions) with A/C system materials and components, that may be intended for use in servicing or operation of vehicle air conditioning systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard does not provide test criteria for additive, compressor lubricant, or flushing solution effectiveness; such testing is the responsibility of the additive and/or solution manufacturer/supplier. This standard does not cover additives or flushing materials for electrically driven compressors. The use of additives with electrically driven compressors might cause electrical shorting and compressor failure. It is not the intent of this document to identify the requirements for ultraviolet leak detection dyes. Such dyes must meet the requirements of SAE J2297 for the intended refrigerant.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Additives for mobile air conditioning systems are not tested under this standard for system enhancement or performance. This standard only indicates if the additive is chemically compatible with materials used in the system components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Flushing solvents, when used, completely fill the component/system being flushed and, hence, should not harm system components at 100% concentration. They are not intended to remain in the system, either as a solvent or as an additive, but, because it is not possible to remove all of the flushing solvent, an indeterminate amount remains. The residual remaining in the system depends on many factors, including system/component configuration, component blind spots where liquid cannot be removed, the volatility of the solvent, the procedure(s) used to remove the solvent, and evacuation capability and procedure. No means exists to identify and/or specify the amount of residual solvent that either can, or will, remain in any given system after the procedure(s) have been followed. This standard does not address the flushing solvent procedure or its effectiveness at removing residual flushing agent.&lt;/div&gt;
    &lt;/div&gt;</p>
