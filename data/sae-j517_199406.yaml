  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides general, dimensional, and performance specifications for the most common hoses used in hydraulic systems on mobile and stationary equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The general specifications contained in &lt;span class="xref"&gt;Sections 1&lt;/span&gt; through &lt;span class="xref"&gt;12&lt;/span&gt; are applicable to all hydraulic hoses and supplement the detailed specifications for the 100R-series hoses contained in the later sections of this document. (See &lt;span class="xref"&gt;Table 1&lt;/span&gt;.)&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document shall be utilized as a procurement document only to the extent as agreed upon by the manufacturer and user.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The rated working pressure of a hose assembly comprising SAE J517 hose and hose fitting end connections per SAE J516, J518, J1453, etc., shall not exceed the lower of the respective SAE working pressure rated values.&lt;/div&gt;&lt;/div&gt;</p>
