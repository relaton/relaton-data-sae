abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides a recommended electrical performance testing guideline for LIBM, which makes up an xEV (Battery Electric Vehicles and Hybrid Electric Vehicles) battery pack system. This testing guideline may also be used for other applications, such as stationary, vessel, and aircraft. However, using the guideline for other applications should be determined by the users of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Users of this document may also be interested in conducting tests on battery cells and/or battery packs. To avoid conducting potentially redundant tests between cells, modules, and packs, this document does not specify which tests need to be conducted. Determination of which tests need to be conducted is at the user’s discretion and should be based on individual module applications. Rather than specifying which tests need to be conducted, this document describes how each test is to be conducted.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document provides a matrix of tests that can be selectively picked for the application requirements in order to standardize testing procedures for their specific application needs. Performance values from the tests in this document can be for comparative purposes, confirmation, and other reasons. However, pass/fail criteria are not part of this document. It is up to the customer and supplier to determine what the pass/fail criteria are. If the measured value is to be used to determine battery module ratings, the tested modules should be representative of those to be manufactured.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;LIBM consists of multiple cells grouped and electrically interconnected in various series and parallel configurations - typically noted as “XXP XXS.” Fully functional LIBM shall have a battery monitoring system to allow for the proper control and operation of individual cell voltage and module temperature monitoring. The LIBM configuration shall accommodate for cell compression, retention, thermal heat transferal, electrical isolation, and a hold-down method.&lt;/div&gt;&lt;/div&gt;</p>
