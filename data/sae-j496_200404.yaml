abstract:
- language: en
  script: Latn
  content: "<p>Table 3, Practical Length Increments and Ranges, indicates spring pin
    sizes. Information on availability of individual lengths in the various types,
    weights, and materials may be obtained from suppliers. The tolerance on length
    for coiled type spring pins shall be plus or minus 0.010 in. for sizes up to and
    including 5/16 in.; and plus or minus 0.015 in. for sizes larger than 5/16 in.</p>"
