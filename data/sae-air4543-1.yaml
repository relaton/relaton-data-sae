    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) contains Lessons Learned from aerospace actuation, control and fluid power systems technologies. The lessons were prepared by engineers from the aerospace industry and government services as part of the work of SAE Committee A-6, Aerospace Actuation, Control and Fluid Power Systems. Each lesson was presented to the appropriate A-6 technical panel. The technical topics are organized into five sections covering systems, actuation, hydraulic components, electrical components and miscellaneous, each further divided into subsections. The information topics are presented in a concise format of Problem, Issue, Solution and Lesson Learned, often with accompanying descriptive diagrams and illustrations for clarity and understanding.&lt;/div&gt;
    &lt;/div&gt;</p>
