    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to dyes intended to be introduced into a mobile air-conditioning system refrigerant circuit for the purpose of allowing the application of ultraviolet leak detection. In order to label any product(s), they shall meet SAE J2297, the certification process as described in SAE J2911 must be followed, and the documentation described in &lt;span class="xref"&gt;Appendix A&lt;/span&gt; shall be submitted to SAE.&lt;/div&gt;
    &lt;/div&gt;</p>
