    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard for Numerical Machine Control Perforated Tape is intended to serve as a guide in the coordination of equipment design, to minimize the number of sizes and codes of perforated tape used, and to minimize the variety of perforated tape preparation equipment required by users of numerically controlled machines.&lt;/div&gt;



