  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Glossary is designed to serve persons who need to know the accepted meanings, within specific contexts, of the terminology used in reports, articles, regulations, and other materials dealing with aviation safety -- with particular reference to terms specific to human factors in aviation safety. It is assumed that some users of the Glossary will be familiar with the nomenclature of aviation, but will need information on the language of human factors in engineering as they apply to aviation safety. Others (for example, engineers and psychologists) will have fairly extensive knowledge of the terminology of their own and related disciplines, but will need authoritative definitions of technical terms specific to aviation.&lt;/div&gt;
