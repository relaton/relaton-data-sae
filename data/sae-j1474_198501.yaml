  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;All materials classified as nylons share certain basic characteristics. However, even within the seemingly limited realm of glass fiber reinforced nylons, many levels and combinations of physical, thermal, and environmental resistance properties are available. These properties result from such factors as the following:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Type of nylon (6, 6/6, 6/10, 6/12, etc.)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Percentage (by weight) of glass fibers&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Diameter and length of glass fibers&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;4&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wetting agent used to promote adhesion between resin and fibers (if present)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;5&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Heat stabilizer (if present)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;6&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Impact modifier (if present)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;7&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Pigmentation (if present)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;In order to select a material with appropriate characteristics, the prospective manufacturer and end user should investigate the proposed application thoroughly, and maintain open communication with the various material suppliers.&lt;/div&gt;&lt;/div&gt;</p>
