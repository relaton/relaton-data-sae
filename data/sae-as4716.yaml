  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard provides standardized gland (groove) design criteria and dimensions for elastomeric seal glands for static and dynamic applications. The glands have been specifically designed for applications using SAE AS568 size O-rings at pressures exceeding 1500 psi utilizing one or two anti-extrusion (backup) rings and applications at pressures under 1500 psi without backup rings. The glands have been sized to provide sufficient squeeze for effective sealing while at the same time limiting squeeze to allow satisfactory operation in dynamic applications. While specifically designed for standard size O-rings, these glands are also to be used with other elastomeric seals.&lt;/div&gt;&lt;/div&gt;</p>
