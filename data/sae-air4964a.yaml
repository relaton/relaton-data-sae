abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Long wave ultraviolet or UV-A irradiation (between 320 and 400 nm) is used for fluorescent inspections in magnetic particle and liquid penetrant examinations. UV-A irradiation is obtained from either LED, fluorescent, or high intensity discharge lamps that are stationary or portable. Commercially available UV-A lamps possess a large variation in intensity output that may introduce a legitimate concern for possible health hazards. This document reviews the nature of UV-A irradiation emitted by lamps and acceptable UV dosage limits adopted by the American Conference of Governmental Industrial Hygienists (ACGIH®) and European Union and recommendation of proper practices when working with UV-A irradiation.&lt;/div&gt;&lt;/div&gt;</p>
