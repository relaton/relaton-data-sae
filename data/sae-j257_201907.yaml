abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;The minimum performance values in this SAE Recommended Practice
    are applicable to vehicles with brake systems having typical service pressure
    ranges 0 to 16.6 MPa (0 to 2400 psi) hydraulic or 0 to 945 kPa (0 to 135 psi)
    air only.  SAE J880 not only provides for determining maximum brake rating power
    capability, but also permits verification of any desired or arbitrary level such
    as the requirement established herein.  The determining criteria for deciding
    brake rating power capability are:&lt;/p&gt;\n&lt;p&gt;a. Cold brake stopping
    ability.&lt;/p&gt;\n&lt;p&gt;b. Fade as a result of brake power absorption.&lt;/p&gt;\n&lt;p&gt;c.
    Hot brake stopping ability following brake power absorption.&lt;/p&gt;\n&lt;p&gt;d.\tBrake
    system stability following brake power absorption.&lt;/p&gt;\n&lt;p&gt;e. Functional
    and structural integrity of brake system following test.&lt;/p&gt;</p>"
