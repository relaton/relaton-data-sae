  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The information in this document is intented to apply to commercial jet transport category airplanes that incorporate plastic (polycarbonate or acrylic) lenses on exterior light assemblies, or are being considered for such an application. Exterior lighting applications include position light assemblies, anticollision light asemblies, and landing light assemblies. However, much of the material provided herein is general in nature and is directly applicable to many aircraft categories including, but not limited to, helicopters, general aviation aircraft, and military aircraft.&lt;/div&gt;
    &lt;/div&gt;</p>
