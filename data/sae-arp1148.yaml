  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice outlines the general requirements for a transportable self-contained, continuous duty, diesel engine driven brushless alternator unit for supplying 400-Hertz electrical power to high performance commercial transport aircraft. It is intended to assist the airlines in standardardizing recommendations for various sizes and configurations of equipment and it is a guide for the preparation of detailed specifications by the purchaser. The unit is primarily intended to supply power to the aircraft during passenger loading and unloading, and during servicing operations at airports throughout the world. The combination of the equipment specified herein and the interconnecting cable(s) between the 400-Hertz alternator and the aircraft shall provide power characteristics at the aircraft receptacle which meet MIL-STD-704A requirements for Category "B" equipment. Other limits which are necessary to meet specific conditions must be specified by the purchaser.&lt;/div&gt;&lt;/div&gt;</p>
