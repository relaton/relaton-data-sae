  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Procurement specification is principally for defining protection sleeves on a cable or group of electrical/fiber optic wires (wiring bundle). Single wire protection depends on the minimum diameter of the wire. Sleeve may be used to protect a wire bundle for a platform installation or for repair of installed damaged jacket or jacket/shielded wire bundles. See AS50881 for aerospace wire bundle protection installations.&lt;/div&gt;
    &lt;/div&gt;</p>
