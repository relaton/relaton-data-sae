abstract:
- language: en
  script: Latn
  content: "<p>This aerospace recommended practice covers requirements for a self-propelled, boom type aerial device, equipped with an aircraft deicing fluid spraying system. The unit shall be highly maneuverable for deicing all exterior surfaces of intermediate size aircraft, e.g. DC-9, B-727, and B-737. The vehicle will also be used for aircraft maintenance and inspection. The vehicle shall be suitable for day and night operations.</p>"
