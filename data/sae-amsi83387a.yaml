  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers both the material and the examination process of an inspection material in the form of a dispersion of magnetic particles in a controlled viscosity rubber base that cures at room temperature by addition of one or more curing agents. The test object is magnetized with the uncured rubber covering the area of interest. The magnetic particles then migrate to the leakage field caused by the discontinuity. As the rubber cures, discontinuity indications remain in place on the rubber. The product may be supplied in a variety of viscosities and colors.&lt;/div&gt;&lt;/div&gt;</p>
