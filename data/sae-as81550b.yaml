abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for two types of a two-part, transparent, reversion resistant flexible insulating compound, to provide resilient, environmental, and electrical insulation of components in systems in temperature range -85 to 392 °F (-65 to 200 °C). These insulating compounds are intended for embedding, potting or encapsulation of electrical and electronic components in systems where tear resistance is not critical, but their use is not limited to such applications. These transparent compounds allow visual circuit and part identification and facilitate part replacement and repairs. The insulating compound shall cure in sections of unlimited thickness, either exposed to air or completely sealed.&lt;/div&gt;

    &lt;/div&gt;</p>
