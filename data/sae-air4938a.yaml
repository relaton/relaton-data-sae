  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This is a general curriculum that has been developed to identify the minimum knowledge and skill requirements of a composite and/or metal bond repair technician/specialist. This revision changes the document from an all-inclusive curriculum into a modular set of curricula.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Teaching levels have been assigned to the curriculum to define the knowledge, skills and abilities graduates will need to make composite repairs. Minimum hours of instruction have been provided to ensure adequate coverage of all subject matter - lecture and laboratory. These minimums may be exceeded, and may include an increase in the total number of training hours and/or increases in the teaching levels.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Each curriculum is a subpart of this document.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Part 1 is the basic curriculum independent of product and is the companion to ARP6262&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Part 2 is the aircraft specific curriculum and is currently under development and will be released in the next revision to this document.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Part 3 is the metal bond specific curriculum and is currently under development and will be released in the next revision to this document.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Part 4 is bolted repairs of composite structure curriculum and is currently under development.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;This document contains ATA104 level IV curricula.&lt;/div&gt;&lt;/div&gt;</p>
