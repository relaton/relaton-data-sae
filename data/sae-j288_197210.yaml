  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To provide a specification of performance of fuel tanks either manufactured or purchased by a snowmobile manufacturer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification includes details of the basic fuel tank without fittings, cap, or other attachments, as well as of completely assembled fuel tanks which include fittings and attachments.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Both metallic and nonmetallic fuel tanks are covered. Unless otherwise noted, requirements apply to both metallic and nonmetallic fuel tanks.&lt;/div&gt;&lt;/div&gt;</p>
