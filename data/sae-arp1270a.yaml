  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These recommendations cover the basic criteria for the design of aircraft cabin pressurization control systems as follows:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(1)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To ensure aircraft safety.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(2)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Physiology and limits which govern maximum permissible pressure time relations as related to aircraft passenger comfort.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(3)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;General pressurization control system performance requirements designed to satisfy (2).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(4)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Technical considerations relevant to satisfying (3).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
