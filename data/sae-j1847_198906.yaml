  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to the abrasion resistance testing of decorative tapes, graphics, and pin striping. It may also have relevance to certain vehicle labels and plastic wood grain film.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The resistance to abrasive damage is judged qualitatively by its effect on the legibility, pattern, and color of the graphic marking.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This recommended practice is intended as a guide toward standard practice but may be subject to frequent change to keep pace with experience and technical advances. This should be kept in mind when considering the use of this recommended practice.&lt;/div&gt;
    &lt;/div&gt;</p>
