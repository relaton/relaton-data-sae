  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the mounting hardware to be used with demountable rims, wheels for demountable rims, rim spacers designed for 28° bevel mounting systems, and intended for use on commercial vehicles. The dimensions given are those necessary to maintain serviceability and interchangeability of mounting hardware.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is divided into two sections. &lt;span class="xref"&gt;Section 1&lt;/span&gt; establishes the practice for mounting hardware. &lt;span class="xref"&gt;Section 2&lt;/span&gt; records information on current mounting hardware. Special and less common applications are not covered in this document.&lt;/div&gt;&lt;/div&gt;</p>
