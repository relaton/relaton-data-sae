  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a process for use by ADHP integrators of EEE parts and sub-assemblies (items) that have been targeted for other applications&lt;span class="xref"&gt;&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not describe specific tests to be conducted, sample sizes to be used, nor results to be obtained; instead, it describes a process to define and accomplish application-specific qualification; that provides confidence to both the ADHP integrators, and the integrators’ customers, that the item will performs its function(s) reliably in the ADHP application.&lt;/div&gt;&lt;/div&gt;</p>
