  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is used for establishing the compression set that could be expected to occur with a thermoset elastomeric hose under securing clamps. It seeks to reproduce the type of indentation caused by the clamps in the wall of a hose. An excessive compression set measured by this method may indicate a hose that could eventually allow leakage of fluid or gas past the clamps in service.&lt;/div&gt;&lt;/div&gt;</p>
