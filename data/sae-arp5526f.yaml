    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) documents a common understanding of terms, compliance issues, and design criteria to facilitate certification of seat installations specific to Part 25 aircraft. This ARP provides general guidance for seats to be installed in Part 23 aircraft and Parts 27 and 29 rotorcraft and does not specify specific designs or design methods for such certification.&lt;/div&gt;&lt;/div&gt;</p>
