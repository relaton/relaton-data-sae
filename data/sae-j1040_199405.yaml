  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to the following off-road work machines of mass greater than 700 kg that are commonly used in earthmoving, construction, logging, and mining applications as identified in SAE J1116 JUN86 and designed for an-board, seated operator:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Crawler tractors and loaders (see SAE J1057 SEP88 Sections 3.1 and 7.1 and SAE J727 JAN86 for description and nomenclature).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Graders (see SAE J1057 SEP88 Section 6 and SAE J870 JUL84 for description and nomenclature).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wheel loaders, wheel tractors, and their modifications used for rolling or compacting, dozer equipped wheel tractors, wheel log skidders, skid steer loaders, and backhoe loaders (see SAE J1057 SEP88 Sections 3.2, 7.2, and 9 for description and nomenclature).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wheel industrial tractors (see SAE J1092 JUN86 for description and nomenclature).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Tractor portion of semi-mounted scrapers, water wagons, articulated steer dumpers, bottom dump wagons, side dump wagons, rear dump wagons, and towed fifth wheel attachments (see SAE J1057 SEP88 Sections 4.1.1.4, 4.1.2, 4.2.1.1, 4.3.1.2, 4.3.1.3, 4.3.2, and 5 and SAE J869 JUL90 and SAE J728 JUL90 for description and nomenclature).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Rollers and compactors (see SAE J1017 JAN86 for description and nomenclature).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;g&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Rigid frame dumpers with full mounted bodies (see SAE J1057 SEP88 Sections 4.1.1.1, 4.1.1.2, 4.1.1.3, 4.1.1.5, and 4.3.1.1 and SAE J1016 JUL90 for description and nomenclature).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;

    &lt;div class="htmlview paragraph"&gt;EXCLUSIONS—Machines whose use is predominantly, or entirely, in manufacturing plants and/or warehouses are specifically excluded. Rough terrain forklifts, 360 degree rotation excavators, and excavator based machines are also excluded along with rollover protection for the operator of an attachment with an alternate seat position from that used for mobile operation (for example, an attachment backhoe).&lt;/div&gt;
    &lt;/div&gt;</p>
