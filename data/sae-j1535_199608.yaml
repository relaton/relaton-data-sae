    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes uniform test procedures for the defrosting systems of off-road, self-propelled work machines used in construction, general purpose industrial, agricultural, forestry, and specialized mining machinery categories as identified in SAE J1116, JUN86. It includes tests that can be conducted with uniform test equipment in commercially available laboratory facilities, as well as in an appropriate outdoor environment.&lt;/div&gt;&lt;/div&gt;</p>
