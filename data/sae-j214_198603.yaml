  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test procedure describes tests for determining characteristics of hydraulic cylinders as used on construction and industrial mobile machinery as referenced in SAE J1116. In this code, metric equivalents are established according to SAE J916. These characteristics are to be recorded on data sheets similar to the ones shown herein. Two sets of data sheets are to be submitted for each cylinder, one set at 120 °F (49 °C) and one at 180 °F (82 °C).&lt;/div&gt;
    &lt;/div&gt;</p>
