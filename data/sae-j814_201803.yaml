    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report is a source of information concerning the basic properties of engine coolants which are satisfactory for use in internal combustion engines. Engine coolant concentrate (antifreeze) must provide adequate corrosion protection, lower the freezing point, and raise the boiling point of the engine coolant. For additional information on engine coolants see ASTM D3306 and ASTM D4985.&lt;/div&gt;&lt;/div&gt;</p>
