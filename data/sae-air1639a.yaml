  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) presents safety criteria for pneumatic type engine starting system design and component hardware. Included are safety criteria in design of both starter control valves and starters as well as in design of airframe control systems. Safety topics concern starter valve operation and material application, airframe controls and instrumentation installations and starter rotor integrity and containment.&lt;/div&gt;&lt;/div&gt;</p>
