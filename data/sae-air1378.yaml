    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) is written as a guide for the wording recommended for use, when applicable, in design and procurement specifications for tube fittings and tube assemblies, both for general aerospace fluid power applications and for specific applications.&lt;/div&gt;
