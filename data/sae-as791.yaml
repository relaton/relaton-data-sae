  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides minimum performance criteria for air data instruments intended to provide cockpit indication of:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Indicated airspeed (V&lt;sub&gt;i&lt;/sub&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Computer airspeed (V&lt;sub&gt;c&lt;/sub&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;True airspeed (V&lt;sub&gt;t&lt;/sub&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Equivalent airspeed (V&lt;sub&gt;e&lt;/sub&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Mach number (M)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Altitude (H)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;g&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Vertical speed (H&lt;sub&gt;pr&lt;/sub&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;h&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Maximum operating limit speed (V&lt;sub&gt;mo&lt;/sub&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;i&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;True angle of attack (α&lt;sub&gt;t&lt;/sub&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;j&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Free air temperature (T&lt;sub&gt;fat&lt;/sub&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;k&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Total temperature (T&lt;sub&gt;t&lt;/sub&gt;)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;These functions shall be derived from a central air data computer (AS 417) and through system wiring applied to the respective indicator.&lt;/div&gt;&lt;/div&gt;</p>
