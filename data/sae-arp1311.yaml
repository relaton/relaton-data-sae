  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP applies to all types and models of civil aircraft for landing gear structure and mechanism excepting wheels, tires and brakes. All axles, wheel forks, axle beams, links, arms, mechanical and air-oil energy absorbers, braces, lock assemblies, trunnion beams, etc., that sustain loads originating at the ground and that are not integral parts of the airframe structure shall be in accordance with this practice.&lt;/div&gt;&lt;/div&gt;</p>
