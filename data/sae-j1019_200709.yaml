abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard is intended to establish uniform methods for testing and evaluation of hose and hose assemblies for use in high temperature transmission oil systems and high temperature lubricating oil systems using petroleum base oils within a temperature range of -40 to 150 degrees C (-40 to 302 degrees F) and a maximum working pressure of 1.5 MPa (217 psi). Hose construction, dimensions, identification, and hose fitting configurations shall be agreed upon by the supplier and user.</p>"
