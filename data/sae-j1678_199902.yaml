  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers low-voltage, ultrathin wall, primary cable intended for use at a nominal system voltage of 60 V DC or less in surface vehicle electrical systems. The tests are intended to qualify cables for normal applications with limited exposure to fluids and physical abuse. This document covers SAE wire sizes which usually differ from ISO wire sizes.&lt;/div&gt;&lt;/div&gt;</p>
