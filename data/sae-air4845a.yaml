  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR by the G-11AT (Automation and Tools) subcommittee, examines the failure mode, effects and criticality analysis (FMECA) requirements and procedures as performed on current and earlier vintage engineering programs. The subcommittee has focused on these procedures in relation to the concurrent engineering (CE) environment to determine where it may be beneficial, to both FMECA analysts and users, to automate some or all of the FMECA processes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Its purpose is to inform the reader about FMECAs and how the FMECA process could be automated in a concurrent engineering environment. There is no intent on the part of the authors that the material presented should become requirements or specifications imposed as part of any future contract.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The report is structured to include the following subjects:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A FMECA overview&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The current FMECA process&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;FMECA in the concurrent engineering environment&lt;/div&gt;&lt;/li&gt;
