    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides part numbers for the identification of fasteners for ship systems and equipment. This document lists some of the more common industry standards that have associated part numbering systems. In addition, this document provides part numbers for screws and nuts to American Society for Testing and Materials (ASTM) fastener standards covering materials most often used in ship systems and equipment.&lt;/div&gt;

    &lt;/div&gt;</p>
