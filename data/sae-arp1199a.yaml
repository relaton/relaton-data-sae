    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice provides technical and application information needed by the designers of aircraft electric systems and support equipment for the selection of overcurrent protective devices. It provides definitions to permit comparisons of various electric circuit protective devices. Included also are recommended procedures for periodic inspection.&lt;/div&gt;&lt;/div&gt;</p>
