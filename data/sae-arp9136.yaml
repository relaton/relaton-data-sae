  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The objective of any organization, as part of continual improvement, is to reduce the number of issues (i.e., undesirable conditions, defects, failures) and to minimize their impact on quality, delivery performance, and cost.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This includes having processes in place to detect and eradicate significant and recurrent issues, which implies having well identified problems, a common understanding of their impact and associated root causes, and having defined and implemented adequate actions so that these problems, including similar issues will not happen again.&lt;/div&gt;&lt;/div&gt;</p>
