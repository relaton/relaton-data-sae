abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice establishes an inertia dynamometer test procedure, using an exemplar caliper disc brake, to characterize the effectiveness of disc brake friction materials for passenger cars and  light-duty trucks, up to and including 2700 kg (5954 lb) GVW. SAE J1652 provides a method of characterizing friction material effectiveness on a full disc brake, using test conditions that approximate those for U.S. mandated new vehicle brake tests.</p>"
