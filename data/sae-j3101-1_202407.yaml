  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To gain an understanding of the software Application Programming Interface (API) landscape for SAE J3101 [SAEJ3101] devices, the SAE Vehicle Electrical Hardware Security Task Force conducted an analysis of various automotive-relevant crypto APIs. The purpose of this analysis was to identify how well the existing APIs cover the SAE J3101 requirements and to highlight the areas of coverage within these APIs. By examining these APIs, the Task Force aimed to gain insights into the current state of API support for SAE J3101 devices and identify any gaps in coverage that need to be addressed.&lt;/div&gt;&lt;/div&gt;</p>
