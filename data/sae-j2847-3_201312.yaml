  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to a Plug-in Electric Vehicle (PEV) which is equipped with an onboard inverter and communicates using the Smart Energy Profile 2.0 Application Protocol (SEP2). It is a supplement to the SEP2 Standard, which supports the use cases defined by J2836/3&lt;sup&gt;™&lt;/sup&gt;. It provides guidance for the use of the SEP2 Distributed Energy Resource Function Set with a PEV. It also provides guidance for the use of the SEP2 Flow Reservation Function Set, when used for discharging. It is not intended to be a comprehensive guide to the use of SEP2 in a PEV.&lt;/div&gt;
    &lt;/div&gt;</p>
