  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification specifies the engineering requirements for heat treatment, by part fabricators (users) or their vendors or subcontractors, of parts (see &lt;span class="xref"&gt;8.6.1&lt;/span&gt;). It also covers heat treatment by warehouses or distributors converting raw material from one temper to another temper (see &lt;span class="xref"&gt;1.3&lt;/span&gt; and &lt;span class="xref"&gt;8.5&lt;/span&gt;). It covers the following aluminum alloys:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;1100, 2004, 2014, 2017, 2024, 2098, 2117, 2124, 2195, 2219, 2224, 3003, 5052, 6013, 6061, 6063, 6066, 6951, 7049, 7050, 7075, 7149, 7178, 7249, and 7475.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;/div&gt;</p>
