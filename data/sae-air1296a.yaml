  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;It is recommended that all helicopter engine development programs include an evaluation of engine starting requirements. The evaluation should include starting requirement effects on helicopter weight, cost, and mission effectiveness. The evaluation should be appropriate to the engine stage of development.&lt;/div&gt;&lt;/div&gt;</p>
