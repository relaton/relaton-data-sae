  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document should be used as guidance for non-handbook based reliability predictions conducted on automotive electronics products. It presents a method that utilizes warranty and field repair data to calculate the failure rates of individual electronic components and predict the reliability of the entire electronic system. It assumes that the user has access to a database containing field return data with classification of components, times to failure, and a total number of components operating in the field.&lt;/div&gt;
    &lt;/div&gt;</p>
