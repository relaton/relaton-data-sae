  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers two types of hose, Type A and B, for use with automatic transmission fluid within a temperature range of -40 to +125°C (-40 to +257°F). Recommended maximum operating pressure for Type A hose is 1.73 MPa (250 psi) and 1.03 MPa (150 psi) for Type B hose. The lower pressure Type B hose is specifically for auxiliary cooler applications only.&lt;/div&gt;&lt;/div&gt;</p>
