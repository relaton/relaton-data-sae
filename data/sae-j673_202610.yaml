    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is a guidance document, which covers current safety glazing materials applicable for use in motor vehicles and motor vehicle equipment. Nominal specifications for thickness, flatness, curvature, size, and fabrication details are included.&lt;/div&gt;
