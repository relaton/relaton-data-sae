  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The material provided in this document consists of recommendations related to the design, analysis, testing, and intended functions of head up displays (HUDs) for transport category airplanes. The content of the document is limited to statements of general design and installation considerations, including display function criticality and compliance considerations; symbology, coding, clutter, dimensionality, and attention getting requirements; equipment installation; display visual characteristics; failure modes; information display and formatting; specific integrated display and mode; and system verification.&lt;/div&gt;
    &lt;/div&gt;</p>
