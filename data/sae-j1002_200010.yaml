    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report is a review of test methods that have been used to evaluate elastomeric hydrodynamic seals. The advantages and disadvantages of each method are discussed. There are ten methods total which include three suggested methods. For those interested in more detailed information on hydrodynamic sealing systems, see &lt;span class="xref"&gt;2.2&lt;/span&gt;.&lt;/div&gt;
