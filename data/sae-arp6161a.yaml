    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is a tool for the certifying authority, flight deck crew station designers, instrument suppliers, lighting suppliers, and component suppliers. It is an aid to understanding and meeting relevant regulatory requirements, particularly those relating to pilot compartment view (refer to 14 CFR § 25.773[a][2]) and instrument lights (refer to 14 CFR § 25.1381[a][2]) for glare arising from visible electromagnetic radiation.&lt;/div&gt;

    &lt;/div&gt;</p>
