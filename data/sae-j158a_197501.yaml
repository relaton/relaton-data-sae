    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J432 and J433 have been discontinued and replaced by this report. This SAE Standard covers castings of ferritic, pearlitic, tempered pearlite, and tempered martensitic grades of malleable iron used in products of the automotive and allied industries. Castings shall be heat treated to meet this SAE Standard&lt;/div&gt;&lt;/div&gt;</p>
