  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1939-82 compliance describes the compliance tests and procedures to verify an SAE J1939 electronic control unit (ECU) operates correctly on a SAE J1939 network. The purpose of these compliance procedures is to generate one or more test documents that outline the tests needed to assure that an ECU that is designed to operate as a node on a SAE J1939 network would do so correctly. SAE does not certify devices and these tests and their results do not constitute endorsement by SAE of any particular ECU. These tests are presented to allow testing of an ECU to determine self-compliance by the manufacturer of an ECU. The manufacturer can use its record of what procedures were run successfully to show the level of compliance with SAE J1939.&lt;/div&gt;&lt;/div&gt;</p>
