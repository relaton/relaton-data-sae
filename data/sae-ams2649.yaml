  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for etch inspection of bare high-strength low-alloy steel parts having tensile strength of 180,000 psi (1240 MPa) and higher and of carburized parts to detect over-heating caused by abusive machining or grinding in the heat treated condition. This process may remove 0.0001 to 0.0005 in. (2.5 to 12.5 μm) from the surface of the part.&lt;/div&gt;&lt;/div&gt;</p>
