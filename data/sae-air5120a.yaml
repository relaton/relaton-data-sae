abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;For Engine Monitoring Systems to meet their potential for improved safety and reduced operation and support costs, significant attention must be focused on their reliability and validity throughout the life cycle. This AIR will provide program managers, designers, developers and customers a concise reference of the activities, approaches and considerations for the development and verification of a highly reliable engine monitoring system.&lt;/p&gt;


    &lt;p&gt;When applying the guidelines of this AIR it should be noted that engine monitoring systems physically or functionally integrated with the engine control system and/or performing functions that affect engine safety or are used to effect  continued operation or return to service decisions shall be subject to the Type Investigation of the product in which they'll be incorporated and have to show compliance with the applicable airworthiness requirements as defined by the responsible Aviation Authority. This is not limited to but includes the application of software levels consistent with the criticality of the performed functions. For instance, low cycle fatigue (LCF) cycle counters for Engine Critical Parts would be included in the Type Investigation but most trend monitors and devices providing information for maintenance would not.&lt;/p&gt;</p>
