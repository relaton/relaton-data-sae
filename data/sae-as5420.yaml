    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers the requirements for a flexible, lightweight, low pressure, self-extinguishing, integrally heated silicone hose assembly. The hose has a fully fluorinated fluoropolymer inner liner and is primarily intended for use in aircraft potable water systems with an environmental operating temperature range of -65 °F (-54 °C) to +160 °F (+71 °C).&lt;/div&gt;&lt;/div&gt;</p>
