  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to valve assemblies that are used on passenger car and light truck braking systems utilizing motor vehicle hydraulic brake fluids. The procedure (SAE J1118) and these requirements (SAE J1137) were developed for brake fluids conforming to SAE J1703 and FMVSS 116 (DOT 3) requirements; however, it may be utilized for valves which use DOT 4 or DOT 5 brake fluid. These requirements are applicable to differential warning, metering hold off, bypass function, or proportioning type valves or any combination thereof.&lt;/div&gt;
    &lt;/div&gt;</p>
