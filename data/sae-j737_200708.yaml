abstract:
- language: en
  script: Latn
  content: |-
    <p>This standard is intended for cutting edge sections used on:
    a. Tractor-scrapers as described in SAE J1057 and J728
    b. Dozers as described in SAE J729. These cutting edges are further defined in SAE J738 for cross section and SAE J740 and J1580 for hole conformation. 

    (Note: Some inch dimentions in this standard are not equivalent to the corresponding millimeter figures because values which are widely used have been adapted.

    This standard specifies hole placement along with length and width of the cutting edge.</p>
