  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report analyzes the characteristics of mobile network communication and highlights the technical aspects of using mobile networks to implement V2X applications. This report provides a high-level analysis of architecture, protocols, and performance and is intended to support future implementation guidance and standardization for providing V2X services over mobile networks, also referred to as network V2X.&lt;/div&gt;&lt;/div&gt;</p>
