  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an alpha-beta Ti-6Al-4V alloy produced by laser powder bed fusion (L-PBF) additive manufacturing and subjected to hot isostatic press (HIP) operation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Typically, this material is used for complex-shaped aerospace products made to near net shape dimensions. These products have been used typically for parts requiring operating strength up to 750 °F (399 °C), but usage is not limited to such applications.&lt;/div&gt;&lt;/div&gt;</p>
