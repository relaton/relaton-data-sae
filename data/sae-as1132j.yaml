    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Aerospace Standard (AS) is to define the following dimensional requirements for double hexagon, hexagon head and tee headed bolts, and nuts with AS8879 UNJ inch series threads primarily for use in propulsion systems. Design requirements are based on UNJC threads for sizes 0.1640 and smaller and UNJF threads for sizes 0.1900 and larger.&lt;/div&gt;





    &lt;/div&gt;</p>
