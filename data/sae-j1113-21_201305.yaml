  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This part of SAE J1113 specifies test methods and procedures for testing electromagnetic immunity (of vehicle radiation sources) of electronic components for passenger cars and commercial vehicles. To perform this test method, the electronic module along with the wiring harness (prototype or standard test harness) and peripheral devices will be subjected to the electromagnetic disturbance generated inside an absorber-lined chamber. The electromagnetic disturbances considered in this part of SAE J1113 are limited to continuous narrowband electromagnetic fields.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Immunity measurements of complete vehicles are generally only performed at the vehicle manufacturer. The reasons, for example, are high costs of a large absorber-lined chamber, preserving the secrecy of prototypes, or the large number of different vehicle models. Therefore, for research, development and quality control, a laboratory measuring method shall be applied by the manufacturers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Part 1 of SAE J1113 specifies the general, definitions, practical use, and basic principles of the test procedure&lt;/div&gt;
    &lt;/div&gt;</p>
