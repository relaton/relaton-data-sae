    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes STANDARD-DUTY and EXTREME-DUTY Pilot Bearing requirements and sizes for class 6, 7, and 8 on-highway trucks and buses that use diesel engines and manual transmissions. The recommendations may apply to a wide range of other pilot-bearing applications, such as agricultural, industrial, and construction equipment.&lt;/div&gt;
