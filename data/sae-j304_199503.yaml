    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to describe test conditions and performance evaluation factors for both diesel and gasoline engine tests. Specifically, the tests described in this document are used to measure the engine performance requirements for engine oils described by the API Service Categories described in API Publication 1509, ASTM D 4485, SAE J183 and SAE J1423 standards, and U.S. military specifications.&lt;/div&gt;&lt;/div&gt;</p>
