  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is limited to the compatibility of typical fluids that may come in contact with PTFE hose assemblies. PTFE hose assemblies may be braided with CRES wire, polyester or para-aramid fibers. Hose assemblies may be equipped with aluminum, CRES, titanium or nickel alloy fittings; and with fire resistant cover materials. All of these constituent materials of PTFE hose assemblies must be compatible with all of the fluids found in any particular application.&lt;/div&gt;
    &lt;/div&gt;</p>
