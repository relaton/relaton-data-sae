    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This part of SAE J551 specifies Bulk Current Injection (BCI) test methods and procedures for testing the electromagnetic immunity of electronic components for passenger cars and commercial vehicles. The electromagnetic disturbance, considered in this part of SAE J551, will be limited to continuous narrow band electromagnetic fields.&lt;/div&gt;
