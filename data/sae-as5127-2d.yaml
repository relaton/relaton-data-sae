    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) describes the test methods to determine the flammability performance and capability to control the passage of, and effects from, fire on aircraft firewall sealing compounds. The methods are based on requirements of FAR Part 25, Sections 25.865, 25.867, 25.1191, and 25.1193 and may be used to demonstrate compliance with the requirements established by FAA AC 20-135. This standard shall be used in conjunction with applicable material specifications.&lt;/div&gt;&lt;/div&gt;</p>
