  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These requirements are applicable to IAQG global sectors when utilizing Aerospace Industry Controlled Other Party (ICOP) schemes for the assessment and certification of supplier quality systems in accordance with the requirements contained in 9104.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;IAQG member companies have committed to perform sufficient oversight of the Aerospace accreditation/certification assessment processes in order to ensure conformance to established requirements contained in 9104.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The IAQG OPMT oversight structure is depicted graphically in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
