abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is divided into five parts. The first part deals with flotation analysis features and definitions to acquaint the engineer with elements common to the various methods and the meanings of the terms used. The second part identifies and describes current flotation analysis methods. Due to the close relationship between flotation analysis and runway design, methods for the latter are also included in this document. As runway design criteria are occasionally used for flotation evaluation, including some for runways built to now obsolete criteria, a listing of the majority of these criteria constitutes the third part. The fourth part of this document tabulates the most relevant documents, categorizing them for commercial and civil versus military usage, by military service to be satisfied, and by type of pavement. This document concludes with brief elaborations of some concepts for broadening the analyst’s understanding of the subject. At revision B of this document, significant new material added is adapted from Reference [34], Schmidt, R. Kyle, &lt;i&gt;The Design of Aircraft Landing Gear&lt;/i&gt;, SAE International, 2020.&lt;/div&gt;
    &lt;/div&gt;</p>
