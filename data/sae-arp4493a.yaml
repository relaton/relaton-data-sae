  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is intended as a guide to aid in the specification and testing of Direct Drive Servovalves, but does not include the associated electronic controller.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommendations contained in this ARP are primarily confined to the input and output characteristics of Direct Drive Servovalves (DDV). The only exception to this approach involves the definition and specification of chip shear force, which is not typically measurable by nondestructive external testing. The information presented should be useful in standardizing the terminology, the specification of physical and performance parameters, and the test procedures used in conjunction with these components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Direct drive servovalves are of two basic types: open loop and closed loop. In the case of open loop direct drive servovalves, the significant input is the motor current as is the case with electrohydraulic servovalves covered in ARP490. A closed loop direct drive servovalve includes a means of position feedback and relies on an electronic controller to control its performance characteristics. Because of the importance of the closed loop category of DDVs, many specifications will be written for the closed loop performance. To generalize this document, the system input signal has been referred to as the "command" and applies equally well to open loop valves, in which the command will usually be expressed in amps, and to closed loop valves which usually receive commands as an input voltage to the valve controller. Many provisions of this document apply equally to larger tandem Main Control Valve (MCV) type DDVs as well as standard size single hydraulic system valves.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specifications contained herein should be used to describe direct drive flow control servovalves. Additional specifications may be necessary to define special requirements for specific control systems. Also, specialized test procedures may be necessary to measure DDV performance in these unusual specification areas. These considerations are beyond the scope of this recommended practice.&lt;/div&gt;&lt;/div&gt;</p>
