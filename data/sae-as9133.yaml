  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides a basic uniform method for ensuring that aerospace standard parts (products) conform with the requirements of technical specifications referring to qualified parts and for a manufacturer of such parts to have a qualified management system at least equivalent to AS/EN/SJAC9100.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These standards apply when called out in the aerospace standard part standard.&lt;/div&gt;
    &lt;/div&gt;</p>
