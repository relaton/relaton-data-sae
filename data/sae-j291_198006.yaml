    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This code provides a test procedure for obtaining and determining extremely high brake fluid temperature encountered in the brake system of a vehicle that is equipped with disc brakes. Vehicles in normal operation may or may not produce brake fluid temperatures that are obtained in this procedure.&lt;/div&gt;
