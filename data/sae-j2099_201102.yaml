  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;recycled R-134a refrigerant, used in servicing of motor vehicle air conditioning (A/C) systems that were designed for use with R-12 and have been retrofitted for use with R-134a;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;recycled R-134a refrigerant, used in servicing of motor vehicle air conditioning (A/C) systems that were designed for use with R-134a;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;recycled R-1234yf refrigerant, used in servicing of motor vehicle air conditioning (A/C) systems that were designed for use with R-1234yf.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;Hermetically sealed, refrigerated cargo systems are not covered by this document.&lt;/div&gt;
    &lt;/div&gt;</p>
