  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines, illustrates, and specifies allowable limits for various types of surface discontinuities that may occur during the manufacture and processing of bolts, screws, and studs in sizes through 24 mm or 1 in diameter inclusive with lengths to 150 mm or 6 in inclusive, having specified minimum tensile strengths of 900 MPa or 120 000 psi and greater, which are primarily intended for use in automotive assemblies.&lt;/div&gt;
    &lt;/div&gt;</p>
