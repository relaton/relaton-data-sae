abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes methods for calculating the attenuation of sound due to line-of-sight blockage or shielding from non-level terrain. This method applies to sound propagating from an airplane to locations on the ground during ground roll, climbout after liftoff, and landing operations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;AIR1845 and AIR5662 provides guidance for modeling aircraft noise at airports with flat terrain. In reality, many airports are surrounded by non-level terrain that may result in attenuation (or shielding) of sound at some receptors. This noise blockage can be accounted for with the line-of-sight blockage calculation, based on the difference in propagation path length between the direct path and propagation path over the top of terrain feature. The purpose of this aircraft information report is to provide a method that accounts for the attenuation due to line-of-sight blockage of aircraft noise by terrain features.&lt;/div&gt;&lt;/div&gt;</p>
