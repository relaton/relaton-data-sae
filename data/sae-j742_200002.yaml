abstract:
- language: en
  script: Latn
  content: |-
    <p>This standard applies to buckets of loaders (as defined by SAE J1057a, Identification Terminology of Earthmoving Machines).

    This method applies primarily to buckets having parallel sides and a cutting edge parallel to the top edge of the top edge of the back sheet.  Moderately clipped back sheet corners will introduce no appreciable errors.  Bucket teeth, tooth adapters, as well as other similar local discontinuities are ignored.

    a.  Interpretation of irregular shaped cutting edges is identified in 4.4.
    b.  Interpretation of irregular shaped side sheets is identified in 4.5.</p>
