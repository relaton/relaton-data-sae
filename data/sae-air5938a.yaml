  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The primary focus of this document is to provide information on the impacts hard landings and abnormal load conditions on landing gear and related systems. However, because hard landings potentially affect the entire aircraft, this document also includes information for non-landing gear areas. The document may be considered to be applicable to all types of aircraft. This document does NOT provide recommended practices for hard landing inspections, nor does it provide recommendations on the disposition of damaged equipment. Refer to ARP4915 and ARP5600 for information on dispositions relating to landing gear components or wheels involved in accidents/incidents.&lt;/div&gt;
    &lt;/div&gt;</p>
