abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;In accordance with § 4.11 of AS36100, materials used in the construction of pallets, nets, and containers shall take into account the effects of environmental conditions, such as temperature, humidity, and UV degradation, expected in service.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In accordance with (E)TSO-C90, the applicant shall consider environmental degradation due to aging, ultra-violet (UV) exposure, weathering, etc., for any materials used in the construction of pallets, nets, and containers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this Aerospace Recommended Practice (ARP) is to provide guidelines for the basic requirements to be considered regarding environmental degradation effects when qualifying composite materials in the design to fulfill the (E)TSO-C90 Minimum Performance Standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Material qualification is the verifying of a materials attributes and characterizations, which are typically determined through testing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Material variances related to raw materials and manufacturing processes are not part of this Aerospace Recommended Practice (ARP), nor is damage tolerance. However, these variances cannot be neglected, as all variances shall be considered when deciding the test factors for environmental effects.&lt;/div&gt;&lt;/div&gt;</p>
