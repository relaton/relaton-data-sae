  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method describes laboratory testing of final stage fuel filters used to protect engines from abrasive contaminant. It has been developed to provide a standardized method of rating fuel filter performance in terms of flow, pore size, contaminant holding capacity, efficiency, and media migration. Although development of this test method was based on diesel fuel filters, it is applicable to all types of liquid fuel filters used on automotive type internal combustion engines. Typical filter systems, service and space problems, environmental and other special factors which influenced the development of this test method are covered in more detail in “Fuel Filter Test Methods” (SAE Technical Progress Series, Vol. 1).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Since the contaminant used in this test is a hard, dry, and abrasive material, the ratings for efficiency and contaminant holding capacity are not necessarily applicable under conditions where a soft, gummy, sludge type contaminant is present. Efforts are being directed toward the development of methods for evaluating the effects of a filter under such conditions, which are sometimes encountered in actual engine operation.&lt;/div&gt;&lt;/div&gt;</p>
