    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Wire and cable products progress through a series of handling or operational steps from the time they leave the manufacturer, and until a finished harness or assembly is ready for installation on a vehicle. Throughout these many steps, environmental or processing conditions may be present which can generate damage detrimental to the wire or cable and/or its intended application.&lt;/div&gt;
