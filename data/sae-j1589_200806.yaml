  content: |-
    <p>Differences, where they exist, are shown in Appendix A.

    This SAE Standard defines the measuring principles to be used for measuring piston rings. It applies to piston rings up to and including 200 mm diameter for reciprocating combustion engines.

    These inspection measuring principles may also be used for piston rings for compressors working under analogous conditions.</p>
