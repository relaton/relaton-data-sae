  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers the design, fabrication, performance and operational testing requirements for lower deck containers for use in main line aircraft which do not require airworthiness certification when loaded under the conditions of compartment restraint and in accordance with the aircraft's Weight and Balance Manual and/or, where applicable according to the aircraft type's approved Weight and Balance Manual, AS36100A or NAS 3610 equivalent base plate restraint for these containers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Most sizes of containers covered by this document (base sizes K, L, P, and Q) cannot physically be loaded and latched on aircraft main deck cargo systems. Base size A and M containers can, but are not allowed on aircraft main decks, which do not accept non-certified units. Accordingly, all containers covered by this document are to be used/installed exclusively in aircraft lower deck compartments.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;IATA 50/0, “ULD General technical requirements”, should also be taken into account when designing and making equipment.&lt;/div&gt;
    &lt;/div&gt;</p>
