    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides testing and functional requirements to meet specified minimum performance criteria for electronic probe-type leak detectors. The equipment specified here will identify smaller refrigerant leaks when servicing motor vehicle air conditioning systems, including those engineered with improved sealing and smaller refrigerant charges to address environmental concerns and increase system efficiency. This document does not address any safety issues concerning the equipment design or use beyond that of sampling a flammable refrigerant save those described in &lt;span class="xref"&gt;3.1&lt;/span&gt; and &lt;span class="xref"&gt;3.2&lt;/span&gt; of this document. All requirements of this standard shall be verified in SAE J2911.&lt;/div&gt;
    &lt;/div&gt;</p>
