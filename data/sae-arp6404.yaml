    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document points to a standard ASTM test method utilized by land vehicle manufacturers and others to provide the electrical resistance of a tire. It is desired that this ASTM test method is also used with aircraft tires. This method will assure that more accurate repeatable data is provided to those in the aerospace industry who request it.&lt;/div&gt;
