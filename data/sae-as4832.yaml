  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) offers gland details for a 0.364 cross section gland (nominal 3/8 in) with proposed gland lengths for compression type seals with two backup rings over a range of 8 to 20 in in diameter.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A dash number system is proposed similar to AS568A. A 600 series has been chosen as a logical extension of AS568A and the 625 number has been arbitrarily chosen for the initial number. (Both 300 and 400 series begin with 325 and 425 sizes.)&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Seal configurations and design are not a part of this document. This gland is for use with custom compression type seals including, but not limited to, O-rings, T-rings, D-rings, etc.&lt;/div&gt;
    &lt;/div&gt;</p>
