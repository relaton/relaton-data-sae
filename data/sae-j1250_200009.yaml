abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice establishes a uniform practical series of subprocedures for level road testing of the brake performance of vehicles with gross vehicle weight ratings over 4500 kg (10 000 lb). The purpose of this practice is to establish a uniform method for use by operators and law enforcement agencies, to evaluate the condition of the brake systems of vehicles with GVWRs and GCWRs over 4500 kg (10 000 lb) under any condition of loading. By following the test procedures set forth, the operator and/or law enforcement agencies can ascertain if the vehicle meets the service brake and emergency brake stopping distance  requirements of applicable State and Federal regulations.</p>"
