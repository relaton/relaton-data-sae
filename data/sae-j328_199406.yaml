  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides minimum performance requirements and uniform procedures for fatigue testing of wheels intended for normal highway use and temporary use on passenger cars, light trucks, and multipurpose vehicles. For heavy truck wheels and wheels intended to be used as duals, see SAE J267. For wheels used on trailers drawn by passenger cars, light trucks, or multipurpose vehicles, see SAE J1204. These minimum performance requirements apply only to wheels made of materials included in &lt;span class="xref"&gt;Tables 1&lt;/span&gt; to &lt;span class="xref"&gt;4&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
