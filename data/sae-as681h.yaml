  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) provides the method for presentation of gas turbine engine steady-state and transient performance calculated using digital computer programs. It also provides for the presentation of parametric gas turbine data including performance, weight and dimensions computed by digital computer programs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard is intended to facilitate calculations by the program user without unduly restricting the method of calculation used by the program supplier.&lt;/div&gt;&lt;/div&gt;</p>
