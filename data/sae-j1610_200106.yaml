  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method provides a standardized procedure for evaluating the sealing capability of a hose connection or any of the individual components of the connection with a pressure, vibration, and temperature (PVT) test facility. This test method consists of a test procedure which includes vibration and coolant flow (#1) and a similar test procedure specified without vibration or coolant flow (#2). Any test parameters, other than those specified in this SAE Recommended Practice, are to be agreed to by the tester and the requestor.&lt;/div&gt;&lt;/div&gt;</p>
