    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) supplies information on trimmable horizontal stabilizer actuator structural load path integrity. It describes the different methods for detecting rupture or disconnection of load paths. It also describes the monitoring principle to compare existing solutions as a reference for its implementation in new aircraft programs.&lt;/div&gt;&lt;/div&gt;</p>
