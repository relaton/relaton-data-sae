    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) has been written for individuals associated with ground level testing of turbofan and turbojet engines, and particularly for those who might be interested in investigating steady-state performance characteristics of a new test cell design or of proposed modifications to an existing test cell by means of numerical modeling and simulation. It is not the intent of this standard to provide specific test cell design recommendations, which are covered in the reference documentation.&lt;/div&gt;
    &lt;/div&gt;</p>
