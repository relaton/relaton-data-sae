  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the minimum requirements for metric sizes of nonmetallic tubing as manufactured for use in air brake systems. Nonreinforced products are designated type A and reinforced products type B. It is not intended to cover tubing for any portion of the system that operates below −40 °C (−40 °F), above +93 °C (+200 °F), above a maximum working gage pressure of 1.0 MPa (150 psi), or in an area subject to attack by battery acid. This tubing is intended for use in the brake system for connections that maintain a basically fixed relationship between components during vehicle operation. Coiled tube assemblies required for those installations where flexing occurs are covered by this standard and SAE J1131 to the extent of setting minimum requirements on the essentially straight tube and tube fitting connections, which are used in the construction of such assemblies.&lt;span class="xref"&gt;&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;</p>
