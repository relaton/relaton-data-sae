  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice (RP) normalizes kinematic performance metrics and testing for powered standing scooters as defined in SAE J3194. Specifically, it describes:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Test procedures to measure the top speed, acceleration, and deceleration performance of powered standing scooters;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Test scenarios that consider initial vehicle conditions, operator anthropometry, environmental and roadway conditions, and operating domains (e.g., geofence);&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Relevant units, accuracy, and precision of measurement for each test; and&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Methods to collect and report such kinematic data.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;This RP does not prescribe pass/fail criteria for testing. This RP is applicable to powered standing scooters that are privately owned or available via shared- or rental-fleet operations.&lt;/div&gt;&lt;/div&gt;</p>
