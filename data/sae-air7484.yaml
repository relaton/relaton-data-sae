  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a number of jet fuel properties and where applicable gives the specification limits for Jet A and Jet A-1, though the properties are generally applicable to all turbine fuels. Later versions of this document will give more details on specification limits for other similar fuels, such as TS-1, where they differ from Jet A and Jet-A1. It gives details about the possible impact on airframe fuel system design.&lt;/div&gt;
    &lt;/div&gt;</p>
