  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This recommended practice specifies requirements in addition to those given in ISO 3046 for testing a high speed reciprocating internal combustion marine propulsion engine or propulsion system for recreational and small commercial craft, for the determination of the rated power (single point) or power curve. This code is not intended as a complete laboratory test manual or for derating engines for site conditions.&lt;/div&gt;&lt;/div&gt;</p>
