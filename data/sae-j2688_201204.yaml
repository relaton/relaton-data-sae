  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope and purpose of the SAE Recommended Practice is to provide standards for the control and indication of parking brakes in hydraulic braked vehicles over 4540 kg (10 000 lb) GVWR. This recommended practice pertains to automatic transmission applications and supplements the SAE J915 recommended practice. This recommended practice does not address parking brake system performance. Parking brake system performance, both static and dynamic conditions, is the responsibility of the OEM vehicle manufacturer or manufacturers that modify the vehicle by adding special vocational required equipment (such as but not limited to outriggers, cranes, etc.).&lt;/div&gt;&lt;/div&gt;</p>
