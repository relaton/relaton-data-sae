  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes guarding to help prevent hazardous machine movement caused by activation of the starter motor by bypassing the starter control system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is applicable to off-road, self-propelled work machines, as identified in SAE J1116, which have the potential for hazardous machine movement as a result of bypassing the starter control system and powering of the starter motor.&lt;/div&gt;&lt;/div&gt;</p>
