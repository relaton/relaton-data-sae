  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the requirements for physical and chemical properties and the minimum tests to evaluate suitability of phosphate ester hydraulic fluids for use in aircraft systems where fire resistance is required. Additional tests may be specified by the qualifying agency to demonstrate compliance with their specific requirements. The "qualifying agency" will be defined herein to be the airframe manufacturer submitting certification approval for use of the fluid in a specific model airplane.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Fluids meeting the requirements of this specification may be approved by a qualifying agency for use on specific airplane models. Data used to show compliance to this specification can be used by the qualifying agency to show compliance to the applicable regulations for the appropriate certifying authority; e.g., FAA, EASA, etc.&lt;/div&gt;&lt;/div&gt;</p>
