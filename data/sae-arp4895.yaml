  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Aerospace Recommended Practice (ARP) covers acquisition of flight test data for use in developing a statistical data base of aerospace vehicle flight control surface actuator duty cycle. The statistical data base is intended for use in establishing industry guidelines and procurement specification requirements for actuator displacement duty cycle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The objective of this ARP is to provide a uniform method for the aerospace industry to collect flight control displacement type duty cycle data during demonstration and full scale development of new aircraft or during development testing of new models of existing aircraft.&lt;/div&gt;&lt;/div&gt;</p>
