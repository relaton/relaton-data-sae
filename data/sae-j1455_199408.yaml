    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The climatic, dynamic, and electrical environments from natural and vehicle-induced sources that influence the performance and reliability of vehicle and tractor/trailer electronic components, are included in this SAE Recommended Practice. Test methods that can be used to simulate these environmental conditions are also included. This information is applicable to diesel power trucks in Classes 6, 7, and 8.&lt;/div&gt;
