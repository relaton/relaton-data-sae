  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice presents a series of standard calculations and numerical methods for processing safety test instrumentation data that has been acquired during impact tests with instruments installed in ATD’s (crash test dummies), vehicle structures, and laboratory fixtures. The output data from performing these calculations may have applications that include energy analysis, biomechanical analysis, regulation compliance, or other purposes. However, application of the output data from these calculations is outside the scope of this document. It is the intent of this document to present a basic set of calculations that are applicable to test labs that follow the practices set forth by SAE J211-1, SAE J211-2, SAE J2570, and SAE J1733. For the calculations that are described in other sources, the relevant documents are referenced.&lt;/div&gt;&lt;/div&gt;</p>
