  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Information Report is to set up a guide as to body, frame, and wheel housing clearance to accommodate tire chains, and also the minimum bogie spacing to permit using chains on both axles. These dimensions apply to trucks, buses, and combinations of vehicles 10 001 lb (4535.06 kg) GVW and over, and are based upon recommendations of the Tire and Rim Association and of the National Association of Chain Manufacturers. The diagram shows clearance for chains over the tire ONLY and allowance must be made for spring deflections in determining fender clearance. See &lt;span class="xref"&gt;Figure 1&lt;/span&gt; and &lt;span class="xref"&gt;Table 1&lt;/span&gt;.&lt;/div&gt;

    &lt;/div&gt;</p>
