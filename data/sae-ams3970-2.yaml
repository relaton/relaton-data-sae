  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AMS 3970/2 gives specific information about the qualification program for carbon fiber reinforced epoxy structural repair prepreg systems, applicable for 125 °C (250 °F) vacuum curing. The prepreg system may include an epoxy film adhesive to be applied in a co-curing process with the prepreg for joint and sandwich bonding. The need for a film adhesive shall be established during screening tests.&lt;/div&gt;
    &lt;/div&gt;</p>
