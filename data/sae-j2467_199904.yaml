  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE Standard covers normalized electric resistance welded, cold-drawn, single-wall, SAE 1021 carbon steel pressure tubing intended for use as pressure lines and in other applications requiring tubing of a quality suitable for bending, flaring, forming, and brazing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The grade of material produced to this specification is higher in carbon content and manganese content than the grade of material specified in SAE J525. The material produced to this specification is intended to service higher pressure applications than like sizes of SAE J525. Due to the higher carbon and manganese content, however, the forming characteristics of the finished tube is diminished somewhat when compared to SAE J525. Special attention to the overall forming requirements of the finished assembly should be taken into consideration when utilizing material produced to this specification.&lt;/div&gt;&lt;/div&gt;</p>
