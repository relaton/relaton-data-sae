abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Recommended Practice provides a screening procedure for evaluating the susceptibility of plastics to environmental stress cracking by testing their resistance to pure solvents or their mixtures.  This method can be used to evaluate effect of complex chemical mixtures with unknown or suspect components, which may be encountered in the polymer's environment.&lt;/p&gt;



    &lt;p&gt;The list of chemicals in Appendix A is intended only to serve as a guide and does not exclude any chemical that may represent the environment the polymer is subjected to in a specific application.  As specific environment and exposure conditions are application dependent and could vary significantly from one application to another, the user of the document is recommended to choose the appropriate solvents relevant to the actual application enviroment and is not under any obligation to test the effect of all the chemicals listed in Appendix A.&lt;/p&gt;</p>
