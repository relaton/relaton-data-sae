  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the test procedure, environment, and instrumentation for determining the maximum exterior sound level for highway motor trucks, truck tractors, and buses. The test results obtained by this test procedure give an objective measure of the maximum noise level emitted by vehicles under a prescribed condition. A subjective rating of the annoyance caused by vehicles in use may not be directly related to this type of noise level measurement.&lt;/div&gt;&lt;/div&gt;</p>
