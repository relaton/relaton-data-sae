  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes requirements for performing and documenting APQP and PPAP. APQP begins with conceptual product needs and extends through product definition, production planning, product and process validation (i.e., PPAP), product use, and post-delivery service. This standard integrates and collaborates with the requirements of the 9100, 9102, 9103, and 9110 standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements specified in this standard are complementary (not alternative) to contractual and applicable statutory and regulatory requirements. Should there be a conflict between the requirements of this standard and applicable statutory or regulatory requirements, the latter shall take precedence.&lt;/div&gt;

    &lt;/div&gt;</p>
