    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following topics are included in this report:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 2&lt;/span&gt;—References&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 3&lt;/span&gt;—Definitions&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 4&lt;/span&gt;—Material Selection&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 5&lt;/span&gt;—Production Considerations&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 6&lt;/span&gt;—Initial Structural Integrity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 7&lt;/span&gt;—In-Vehicle Testing&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 8&lt;/span&gt;—Laboratory Testing&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The Material Selection section lists environmental factors and material properties which should be considered when determining appropriate fan material(s) for a given application.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Production Considerations section covers various aspects of machine selection, mold design, and process control.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Initial Structural Integrity section lists factors which should be considered in addition to those covered by the same section of SAE J1390.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The In-Vehicle Testing section lists factors which should be considered in addition to those covered by the same section of SAE J1390.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Laboratory Testing section addresses some test considerations and methods for nonmetallic fans which differ from those used with metallic fans or which were not included in the Durability Test Methods section of SAE J1390.&lt;/div&gt;
    &lt;/div&gt;</p>
