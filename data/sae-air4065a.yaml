  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AIR 4065, "Propeller/Propfan In-Flight Thrust Determination" addresses steady state propeller thrust as applied to aircraft which are usually powered by gas turbine engines. It includes theory, examples and methods which have been used. Specifically two methods are discussed, the "J" or traditional J,C&lt;sub&gt;p&lt;/sub&gt;,C&lt;sub&gt;t&lt;/sub&gt;, η method including the SBAC variation and a new method we call the "Theta" method which is dependent on knowing blade angle, power/torque and flight Mach number. Implementation guidelines are offered as well as overall approaches to flight testing. Appendices include expansions on theory and testing as well as examples.&lt;/div&gt;&lt;/div&gt;</p>
