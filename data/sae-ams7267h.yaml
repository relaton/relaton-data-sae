  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a silicone (VMQ) rubber in the form of molded rings. These rings have been used typically as sealing rings for service from -65 to +260 °C (-85 to +500 °F) in contact with air, but usage is not limited to such applications. The cross-section of such rings is usually not over 0.275 inch (6.98 mm) in diameter or thickness.&lt;/div&gt;



    &lt;/div&gt;</p>
