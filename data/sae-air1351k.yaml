    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) covers the general requirements for, and the listing of, manufacturers’ identification markings, names, symbols or trademarks, and CAGE codes that appear on electrical and electronic wiring devices and accessories as required by individual product specifications. Supplier markings from previous submitted listings are maintained for component traceability.&lt;/div&gt;
