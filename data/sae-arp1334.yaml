  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Included in this document are requirements for conveyor systems, guides, stops, restraint hardware that are used on trucks, transporters, dollies, storage provisions, pallet build-up hoists, or other device-handling equipment.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;These requirements reflect state of the art criteria applied to known successfully operated hardware. Any design deviations shall be required to demonstrate equivalency to this specification criteria.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;These devices usually form an integral part of the aircraft and as such are subject to regulatory agencies' requirements to assure structural integrity.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
