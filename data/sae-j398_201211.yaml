  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice provides a method for establishing the rated or advertised fuel capacity for a vehicle utilizing liquid fuel at atmospheric pressure. It applies to passenger cars, multi-purpose passenger vehicles and light duty trucks (10 000 lb (4536 kg) maximum GVW), (Ref. SAE J1100). It also includes a standardized procedure for creating a full tank when another test requires that condition as a starting point. It is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances.&lt;/div&gt;
    &lt;/div&gt;</p>
