    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard defines the requirements for bulk protective sleeve to provide fire resistance for aircraft hose assemblies, which will enable these assemblies to meet the requirements of AS1055.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Use of this sleeve does not eliminate the need to demonstrate that the sleeved assemblies will meet the applicable requirements of AS1055.&lt;/div&gt;&lt;/div&gt;</p>
