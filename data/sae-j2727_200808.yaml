abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The original SAE J2727 “Emission Chart” provided a rating system for comparing mobile A/C systems and was not intended to define mobile A/C system refrigerant emission. It had been developed from industry experience of expected system refrigerant emission based upon currently available technologies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The “System Emissions Chart” contained in this revision is intended to serve as a means of estimating the annual refrigerant emissions rate (grams per year) from new production A/C systems equipped with specified component technologies. It provides emission values for various component technologies that are currently available, and can be expanded as new technologies are commercialized. This document provides the information to develop an Excel file template “System Emissions Chart” for system emission analysis. The chart includes automotive compressor technologies for conventional mobile air conditioning systems as well as those using semi-hermetic compressors. This standard can be considered a companion document to SAE J2763 Test Procedure for Determining Refrigerant Emissions from Mobile Air Conditioning Systems. SAE J2727 estimates system emissions, taking into account production assembly variation. SAE J2763 may be used to quantify emissions from properly assembled systems.&lt;/div&gt;&lt;/div&gt;</p>
