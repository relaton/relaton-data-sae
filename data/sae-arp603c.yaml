    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice establishes the requirements and the procedures for impulse testing of hose assemblies, tubing, and fittings for use in aerospace hydraulic systems of 3000 psi nominal operating pressure or less. It also refers to standard impulse test equipment to be used in conducting these impulse tests.&lt;/div&gt;&lt;/div&gt;</p>
