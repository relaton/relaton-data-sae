  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) defines tests to be performed on hydraulically, electrically, pneumatically, and mechanically actuated air valves. They may be further defined as those valves that function in response to externally applied forces or in response to variations in upstream and/or downstream duct air conditions in order to maintain a calibrated duct air condition (e.g., air flow, air pressure, air temperature, air pressure ratio, or air shutoff).&lt;/div&gt;&lt;/div&gt;</p>
