  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers both quality assurance and installation requirements for fasteners.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document establishes engineering criteria and guidance for quality assurance requirements (including Test and Inspection) for procurement of threaded fasteners where such criteria and guidance is not otherwise provided by existing fastener standards or specifications. The document also provides requirements and test procedures for self-locking fasteners including those manufactured by the installing activity.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document also provides requirements for the selection and use of fastener lubricants, additional corrosion protection treatments, fastener tightening procedures, and the use of thread-locking compounds.&lt;/div&gt;
    &lt;/div&gt;</p>
