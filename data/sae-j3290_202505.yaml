    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice is intended to provide general guidelines for the selection and proper use of technologies and methods intended to minimize the risk of exposure to infection through light-duty vehicle cabin air. It is not intended to include all aspects of cabin air quality, including odor, inorganic particulates, volatile organic compounds (VOCs), etc.&lt;/div&gt;&lt;/div&gt;</p>
