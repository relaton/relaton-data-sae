  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the requirements for lubricating oils containing ashless dispersant additives to be used in four-stroke cycle, reciprocating piston aircraft engines. This document covers the same lubricating oil requirements as the former military specification MIL-L-22851. Users should consult their airframe or engine manufacturer’s manuals for the latest listing of acceptable lubricants.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Compliance with this specification must be accomplished in accordance with the Performance Review Institute (PRI) product qualification process as described in the documents referenced in &lt;span class="xref"&gt;2.1.3&lt;/span&gt;. Requests for submittal information may be made to the PRI at the address shown in &lt;span class="xref"&gt;2.1.3&lt;/span&gt;, referencing this specification. Products qualified to this specification are listed on a Qualified Products List (QPL) managed by the PRI. Approval and/or certification for use of a specific piston engine oil in aero applications is the responsibility of the individual equipment builders and/or governmental authorities and may be accomplished by compliance with or qualification to this specification.&lt;/div&gt;
    &lt;/div&gt;</p>
