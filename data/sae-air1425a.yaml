  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is a description of methods to be employed to achieve Electromagnetic Compatibility (EMC) of gas turbine engine accessories. Its primary objectives are to aid those system designers of gas turbine assemblies who are employing commercial accessories, which are not always EMC designed, and to outline methods of achieving EMC employing readily available test instrumentation.&lt;/div&gt;
    &lt;/div&gt;</p>
