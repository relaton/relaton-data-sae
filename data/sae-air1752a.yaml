  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this AIR is twofold: (1) to present descriptive summary of aircraft nosewheel steering and centering systems, and (2) to provide a discussion of problems encountered and “lessons learned” by various airplane manufacturers and users.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers both military aircraft (land-based and ship-based) and commercial aircraft. It is intended that the document be continually updated as new aircraft and/or new “lessons learned” become available.&lt;/div&gt;&lt;/div&gt;</p>
