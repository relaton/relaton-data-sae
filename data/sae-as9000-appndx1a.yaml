abstract:
- language: en
  script: Latn
  content: "<p>To assure customer satisfaction, aerospace industry manufacturers must
    produce world class quality products at the lowest possible cost. AS9000 standardizes,
    to the greatest extent possible, the quality system requirements of the aerospace
    industry. Standardization of compliance requirements results in cost savings due
    to the elimination or reduction of unique requirements developed for each different
    customer. AS9000 Appendix 1, AS9000 Audit Summary and Supplier Profile Instructions,
    facilitates the standardization of this process.</p>"
