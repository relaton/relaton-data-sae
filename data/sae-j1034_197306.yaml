  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers glycol-type compounds which, when added to engine cooling systems at concentrations of 40-70% by volume of coolant concentrate in water, provide corrosion protection, lower the freezing point, and raise the boiling point of the coolant. Such compounds are intended for a minimum of 1 year (approximately 12,000 miles) service in a properly maintained cooling system. (Reference: SAE HS-40, Maintenance of Automotive Engine Cooling Systems.) Coolants meeting this standard do not require the use of supplementary materials. For additional information on engine coolants, see SAE J814.&lt;/div&gt;&lt;/div&gt;</p>
