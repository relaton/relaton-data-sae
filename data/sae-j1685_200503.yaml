abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice provides a system for classification  and specification for limited number of acrylonitrile/butadiene/styrene (ABS) and blends with polycarbonate (ABS+PC) plastics used in the Automotive Industry. Based upon ASTM D 4673, Classification System for (ABS) Molding Materials, it calls for additional descriptive characteristics and properties commonly used in the Automotive Industry. \n\nThis practice applies to natural, non-color matched black, and  plating gray compounds only. Color matched compounds shall be defined by the proprietary OEM standards. \n\nThis practice allows for the use of recycled, reconstituted, and regrind materials provided that the requirements as stated in this document are met, the material has not been altered or modified to change its suitability for safe processing and use, and the material shall be identified as such.</p>"
