    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To define capabilities and limitations of Raman spectroscopy as it pertains to counterfeit detection of EEE parts and suggest possible applications to these ends. Additionally, this document outlines requirements associated with the application of Raman spectroscopy including: Operator training; Sample preparation; Data interpretation; Computerized spectral matching including pass/fail criteria; Equipment maintenance and; Reporting of data.&lt;/div&gt;
