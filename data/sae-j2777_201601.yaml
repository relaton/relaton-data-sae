abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;With many corporations and suppliers conducting development and validation tests at different Climatic Wind Tunnel sites, there is an increasing need for a recommended best practice that defines a process by which climatic wind tunnels can be correlated. This document addresses the test methods and metrics used to obtain similar results, independent of location, for Heating Ventilation and Air Conditioning (HVAC) and Powertrain Cooling (PTC) development. This document should be used as a guideline to make sure key aspects of tunnel testing are covered when comparing various climatic wind tunnel facilities.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The depth of the correlation program is ultimately influenced by program objectives. Therefore a correlation program, for the intent and purposes of this document, can range from just a few tests to a full analysis that involves multiple vehicle tests identifying limitations and statistical boundaries. Using recommendations in this document will eliminate most of the items that effect facility mismatch in a correlation program.&lt;/div&gt;
    &lt;/div&gt;</p>
