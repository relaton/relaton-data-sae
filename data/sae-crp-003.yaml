abstract:
- language: en
  script: Latn
  content: "<p>Intended to assist in developing technology to recycle  HFC-134a, this
    report evaluates the chemical compatibility of mixtures of various lubricants
    chosen by major  compressor manufacturers for use with HFC-134a in mobile  air
    conditioning systems.  Resulting from a Cooperative Research Project, \n&lt;I&gt;HFC-134a
    Lubricant Compatibility&lt;/I&gt;\n  shows blind test results for 12 lubricants.
