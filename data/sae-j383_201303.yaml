    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice specifies design recommendations for location of seat belt assembly anchorages. It applies to seat belt anchorages attached to vehicle structure or to seat assemblies in the vehicle. (This SAE Recommended Practice supersedes the Design Section of SAE J787b.) Performance requirements and test procedures are specified in SAE J385 and SAE J384, respectively.&lt;/div&gt;&lt;/div&gt;</p>
