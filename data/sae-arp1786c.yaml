    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is to provide a recommended minimum laboratory roll performance for main landing gear aircraft wheels without tires installed and applies to both bolted and lock-ring wheel designs for FAA Part 25 and military aircraft main wheels (not required for any nose wheels or main wheels on FAA Part 23, 27 or 29 applications).&lt;/div&gt;&lt;/div&gt;</p>
