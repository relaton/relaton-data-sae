  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is limited specifically to the following types of passenger vehicles: automobiles, light trucks, and sport/utility vehicles. This document addresses modifications as they apply to legal use of the vehicle, and examines suspension modification as it applies to stock (as manufactured) ride height, and changed (raised or lowered) ride height. Note that modifications of ride height are considered, exclusive of wheel and/or tire modifications, which can also have potentially serious side effects, and are outside the scope of this document.&lt;/div&gt;
    &lt;/div&gt;</p>
