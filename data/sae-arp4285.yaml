  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes a method for evaluating the particulate matter extracted from the working fluid of a hydraulic system or component using a membrane. The amount of particulate matter deposited on the membrane due to filtering a given quantity of fluid is visually compared against a standard membrane in order to provide an indication of the cleanliness level of the fluid. A particular feature of this method is the membrane preparation to achieve an even particulate distribution on the membrane suitable for other applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Membrane evaluation using standard membranes, described in this document, is an alternative technique to counting with either an optical microscope (ARP598) or an automatic particle counter (ISO 11500). The latter particle counting procedures are considered more precise. This procedure shall not be used as an alternative to particle counting unless agreed to by the customer since the results by this procedure may differ from those by particle counting, even though the standard membrane correlates to a specific particle count.&lt;/div&gt;&lt;/div&gt;</p>
