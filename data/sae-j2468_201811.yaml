    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard specifies a method for testing and measuring the deflection of friction materials assemblies and compressibility of friction materials. This standard applies to disc brake pad assemblies and its coupons or segments, brake shoe lining and its coupons or segments, and brake blocks segments used in road vehicles. This SAE test method is consistent in intent with the ISO 6310 and the JIS 4413.&lt;/div&gt;&lt;/div&gt;</p>
