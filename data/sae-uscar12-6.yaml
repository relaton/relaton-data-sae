    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document gives specific and measurable design requirements to be applied at a design review prior to tooling. The specification is formatted as a checklist to aid in its use. The requirements do not apply in all situations so engineering judgment must be used. This is a specification for design; applicable performance specifications (USCAR-2, etc.) must still be performed. Specific requirements in this document are grouped by component using a prefix as shown in &lt;span class="xref"&gt;Table 1&lt;/span&gt; and are numbered by an item number following the prefix.&lt;/div&gt;
    &lt;/div&gt;</p>
