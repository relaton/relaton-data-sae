    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP covers the general requirements and test procedures for illuminating systems for integrally lighted aircraft instruments in order to provide (a) uniformity of illumination within each instrument, (b) legibility of instrument presentation under daylight or integral light, and (c) uniformity of illumination between instrument displays.&lt;/div&gt;&lt;/div&gt;</p>
