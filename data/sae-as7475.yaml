    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procurement specification covers aircraft quality bolts and screws made from a corrosion and heat resistant, work-strengthened, cobalt-chromium-nickel alloy of the type identified under the Unified Numbering System as UNS R30159, and of 260 000 psi tensile strength at room temperature, with maximum test temperature of parts at 1200°F.&lt;/div&gt;&lt;/div&gt;</p>
