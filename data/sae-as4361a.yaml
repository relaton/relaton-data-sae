abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Aerospace Standard (AS) establishes the minimum performance standards for equipment used as secondary direct current (DC) electrical power sources in aerospace electric power systems.&lt;/p&gt;
    &lt;p&gt;The purpose of this document is to define the guidelines and minimum performance test standards to be met by static electric power converters designed to operate from primary electric power systems. The tests specified herein provide a laboratory means to determine the performance and reliability characteristics of electric power converters under electrical and environmental conditions representative of these encountered in actual aerospace applications.&lt;/p&gt;</p>
