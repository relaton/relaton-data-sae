  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers concentric lay stranded and rope-lay stranded round electrical conductor fabricated from copper, copper alloy or aluminum. This specification also covers thermocouple extension conductor fabricated from nickel/chromium or nickel/aluminum/manganese. The conductors in this specification are suitable for use in insulated wires used in aerospace and other applications.&lt;/div&gt;
    &lt;/div&gt;</p>
