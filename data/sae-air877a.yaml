  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) describes a mathematical model that can be used to analyze particle count data. Particle counts that fit the model can be graphically displayed, converted from one counting size-frequency range to another, and extrapolated to estimate counts beyond the measured range. Derivation, applications and calculations are described.&lt;/div&gt;&lt;/div&gt;</p>
