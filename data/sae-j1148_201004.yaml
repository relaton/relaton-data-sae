abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Recommended Practice is intended to outline basic nomenclature and terminology in common use for engine charge air coolers, related charge air cooling system components, and charge air operating and performance parameters.&lt;/p&gt;
    &lt;p&gt;An engine charge air cooler is a heat exchanger used to cool the charge air of an internal combustion engine after it has been compressed by an exhaust gas driven turbocharger, an engine driven turbocharger, or a mechanically or electrically driven blower. The use of a charge air cooler allows increased engine horsepower output, and may reduce emission levels and improve fuel economy through a more complete combustion due to the increased air density available. Typical cooling media includes the engine's coolant, ambient air, or an external water or coolant source.&lt;/p&gt;</p>
