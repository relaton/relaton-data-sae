  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a titanium alloy in the form of bars and hand forgings up through 10.000 inches (254.00 mm), inclusive, in diameter or least distance between parallel sides and forging stock of any size. Bar over 6.000 inches (152.40 mm) in nominal thickness has a maximum cross-sectional area of 288 square inches (1858 square cm). Hand forgings with nominal thickness over 6.000 inches (152.40 mm) have a maximum cross-sectional area of 79 square inches (509 square cm) (see &lt;span class="xref"&gt;8.7&lt;/span&gt;).&lt;/div&gt;
    &lt;/div&gt;</p>
