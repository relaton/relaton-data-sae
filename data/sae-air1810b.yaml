    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document will examine the more important considerations relative to the utilization of "one piece", or integral electronics proximity switches, and "two piece", or separate sensor and electronics proximity switches, for applications on aircraft landing gear. In general, the recommendations included are applicable for other demanding aircraft sensor installations where the environment is equally severe.&lt;/div&gt;&lt;/div&gt;</p>
