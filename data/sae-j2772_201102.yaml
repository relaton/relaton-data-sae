abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Standard is restricted to refrigeration circuits that provide air-conditioning for the passenger compartments of passenger and commercial vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This Standard includes analytical and physical test procedures to evaluate concentration inside the passenger compartment. In the early phases of vehicle evaluation, usage of the analytical approach may be sufficient without performing physical tests.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The physical test procedure involves releasing refrigerant from an external source to a location adjacent to the evaporator core (inside the HVAC-Module). An apparatus is used to provide a repeatable, calibrated leak rate. If the system has multiple evaporators, leakage could be simulated at any of the evaporator locations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard gives detail information on the techniques for measuring R-744 [CO2] and R-1234yf [HFO-1234yf], but the general techniques described here can be used for other refrigerants as well.&lt;/div&gt;
    &lt;/div&gt;</p>
