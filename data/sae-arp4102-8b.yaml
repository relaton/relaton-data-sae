abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides criteria for the design, installation, operation, and training aspects of head-up display (HUD) systems in transport category aircraft, with emphasis on pilot interface and operational requirements. The recommendations apply to permanently installed (including stowable) HUDs that display primary flight information, including those integrating enhanced flight vision system (EFVS) imagery. The intent is to ensure HUDs are designed and used in a manner that improves pilot situational awareness and flight technical performance across all phases of flight, up to and including low-visibility operations. While technical design standards (optical performance, hardware specs, etc.) are defined in documents like ARP5288 and AS8055, this document focuses on pilot usage considerations and human factors. HUD systems addressed here are typically designed to support a fail-passive operational concept applicable to Category III instrument approach operations, where approved, though many recommendations also apply to HUD usage for Category I and II operations and other phases of flight. Devices such as head-worn displays are not specifically covered, though future provisions may consider “through-display” wearable systems as technology matures.&lt;/div&gt;&lt;/div&gt;</p>
