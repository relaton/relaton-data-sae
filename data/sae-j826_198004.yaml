  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The devices of this standard provide the means by which passenger compartment dimensions can be obtained using a deflected seat rather than a free seat contour as a reference for defining seating space. All definitions and dimensions used in conjunction with this standard are described in SAE J1100&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;. The devices described in this standard are intended for applications concerning seated driver side or center occupant accommodation spaces only and are not to be construed as instruments which measure or indicate occupant capabilities or comfort. This standard covers only one H-point machine installed on a seat during each test. Certified H-point templates and machines can be purchased from:&lt;/div&gt;
    &lt;/div&gt;</p>
