  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP discusses design philosophy, system and equipment requirements, and ambient conditions and design considerations for systems within the ATA 100 Specification, Chapter 21 (Reference 1). This chapter is principally concerned with passenger and crew environment and the air conditioning system that maintains this environment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The airplane air conditioning system comprises that arrangement of equipment, controls and indicators that supply and distribute air to the occupied compartments for ventilation, pressurization, and temperature and moisture control. The principal features of the system are:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A supply of fresh air from at least two sources with independent control valves&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A means for heating&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A means for cooling (air or vapor cycle units and heat exchangers)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A means for removing excess moisture from the air supply&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A ventilation subsystem&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A temperature control subsystem&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;g&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A pressure control subsystem&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Other system components for treating cabin air such as filtration and humidification would be included, as would the ancillary functions of equipment cooling and cargo compartment conditioning.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The interface with the major associated system, the pneumatic system (Chapter 36 of ATA 100), is at the inlet of the air conditioning shutoff valves. This boundary definition aligns with that in the ATA 100 Specification.&lt;/div&gt;
    &lt;/div&gt;</p>
