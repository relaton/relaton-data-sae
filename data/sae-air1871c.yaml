  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE Aerospace Information Report AIR1871 provides valuable insight into lessons learned in the development, implementation, and operation of various health monitoring systems for propulsion engines and drive train systems. This document provides an overview of the lessons learned for ground-based systems, oil debris monitoring systems, lubrication systems, and Health and Usage Monitoring Systems (HUMS) for military and commercial programs. For each case study, this document presents a brief technical description, the design requirements, accomplishments, lessons learned, and future recommendations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The lessons learned presented in this document represent a fragment of the knowledge gained through experience when developing and implementing a propulsion health management system. Previous versions of this document contain additional lessons learned during the 1980’s and 1990’s that may be of additional value to the reader. This document will be maintained as technology progresses so that industry members may benefit from the lessons learned of others.&lt;/div&gt;

    &lt;/div&gt;</p>
