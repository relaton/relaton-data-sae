  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Included herein are complete general and dimensional specifications for metric and inch types of spring nuts recognized as SAE standard. These nuts are intended for general use where the engagement of a single thread on the mating screw is considered adequate for the application.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It should be noted that spring nuts having other configurations, dimensions, provisions for ground, etc., are available and manufacturers should be consulted.&lt;/div&gt;&lt;/div&gt;</p>
