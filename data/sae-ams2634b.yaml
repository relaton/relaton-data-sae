  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers procedures for ultrasonic inspection of thin wall metal tubing of titanium, titanium alloy, and corrosion and heat resistant steels and alloys having nominal OD over 0.1875 inch (4.762 mm) with OD to wall thickness ratio of 8 or greater and wall thickness variation not exceeding ±10% of nominal.&lt;/div&gt;&lt;/div&gt;</p>
