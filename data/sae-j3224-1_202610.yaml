  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides the concept of operation and requirements for Infrastructure Sensor Sharing at the roadside. The concept of operation consists of the applicable use cases, functional flow, and related system descriptions. The requirements include a specific profile of SAE J3224 hosted by RSUs, the lower layers configurations and RF performance based on LTE-V2X PC5 Mode 4. It specifies how Infrastructure Sensor Sharing shall operate over a common channel, along with the requisite safety services/messages. Other standards such as the SAE J3224 and SAE J3161 family are referenced in the profile specified in this standard.&lt;/div&gt;&lt;/div&gt;</p>
