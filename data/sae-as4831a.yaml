    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To establish a specification for software input and output interfaces for condition monitoring and performance programs used to monitor equipment from multiple manufacturers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of standardizing these interfaces is to improve operational flexibility and efficiency of monitoring systems as an aid to cost effectiveness (e.g., easier implementation).&lt;/div&gt;&lt;/div&gt;</p>
