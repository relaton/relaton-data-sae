  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes two-dimensional Eyellipses representative of 90th, 95th, and 99th percentile increments of driver eye locations for use in passenger cars, trucks, buses and multipurpose passenger vehicles. A uniform method for describing and measuring the driver’s direct and indirect fields of view using the Eyellipse is established in the Recommended Practice, Describing and Measuring the Driver’s Field of View-SAE J1050a.&lt;/div&gt;&lt;/div&gt;</p>
