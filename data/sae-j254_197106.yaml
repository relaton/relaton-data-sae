  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform laboratory techniques for the continuous and grab sample measurement of various constituents in the exhaust gas of the gasoline engines installed in passenger cars and light trucks. The report concentrates on the measurement of the following components in exhaust gas: hydrocarbons (HC), carbon monoxide (CO), carbon dioxide (CO&lt;sub&gt;2&lt;/sub&gt;), nitric oxide (NO), nitrogen dioxide (NO&lt;sub&gt;2&lt;/sub&gt;), and oxygen (O&lt;sub&gt;2&lt;/sub&gt;).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This recommended practice includes the following sections:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;1&lt;/span&gt;. Introduction&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;2&lt;/span&gt;. Definitions and Terminology&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;3&lt;/span&gt;. Sampling and Instrumentation&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;4&lt;/span&gt;. Associated Test Equipment&lt;/div&gt;&lt;/li&gt;
