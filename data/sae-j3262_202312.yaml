  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report provides a compendium of terms, definitions, abbreviations, and acronyms to enable common terminology for use in engineering reports, diagnostic tools, and publications related to active safety systems. This information report is a survey of terms related to calibration of active safety systems. The definitions offered are descriptions of inputs, outputs, and processes rather than technical specifications. Definitions for end-of-line procedures are not included.&lt;/div&gt;&lt;/div&gt;</p>
