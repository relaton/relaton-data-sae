  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This method of test is intended for use in the measurement of the burning rate of materials used for automotive interior trim which includes, but is not limited to, the components used in items such as seats, arm rests, visors, crash pads, door and quarter panels, headliners, floor coverings, occupant restraints, headrests, plastic trim components, and any other items that are used in automotive interiors.&lt;/div&gt;&lt;/div&gt;</p>
