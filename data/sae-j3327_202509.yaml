abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;The initial scope of this standard is focused on the broadly supported set of objectives named above. The committee recognizes the need for standardization in other important areas that will form the basis of future revisions to this standard and other related standards. These include, among other topics, supply chain modeling, critical mineral information verification, and extended Producer responsibility.&lt;/p&gt;\n \n\n&lt;p&gt;As the International Energy Agency (IEA) notes: “Traceability systems can enable the collection of data on product origin, geographic path, the sequence of entities that held ownership or control over the product and its physical evolution.”&lt;/p&gt;\n\n\n&lt;p&gt;This standard centers on establishing a consistent, globally recognized practice for Electric Vehicle Battery data collection that is the foundation of an audit trail and independent verification within the EV Battery supply chain. This practice also supports Reuse and Recycling.&lt;/p&gt;</p>"
