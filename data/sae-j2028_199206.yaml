  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice outlines recommended practices for qualification testing and performance related criteria of elastomeric boot seals integral to constant velocity joint applications in surface vehicles. Typically, these applications are referred to as front-wheel-drive halfshafts or axles, but can also be utilized in rear-wheel-drive halfshafts and propeller shaft applications. For additional information regarding CV joint systems and their applications refer to SAE AE-7 “Universal Joint and Driveshaft Design Manual.” The grease quantities, clamps, and clamping mechanisms of an installation are considered to be the same as OEM or service designation. They are to be adequate and are not addressed in this document.&lt;/div&gt;
    &lt;/div&gt;</p>
