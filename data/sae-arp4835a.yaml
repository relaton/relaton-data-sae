    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) provides recommendations for the design and test requirements for a hydraulic thermal relief valve.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The thermal relief valve is intended for use in a civil or military aircraft hydraulic system with a rated system pressure up to 5000 psi (34500 kPa).&lt;/div&gt;

    &lt;/div&gt;</p>
