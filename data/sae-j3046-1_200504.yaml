abstract:
- language: en
  script: Latn
  content: "<p>This part of ISO 3046 specifies standard reference conditions and methods of declaring the power, fuel consumption, lubricating oil consumption, and test methods for reciprocating internal combustion (RIC) engines in commercial production using liquid or gaseous fuels. Where  necessary, individual requirements are given for particular engine applications.\n\nThis part of ISO 3046 covers RIC engines for land, rail-traction, and marine use, excluding engines used to propel agricultural tractors, road vehicles, and aircraft. \n\nThis part of ISO 3046 may be applied to engines used to propel road  construction and earthmoving machines, industrial trucks, and for other applications where no suitable International Standard for these engines exists. \n\nThis part of ISO 3046 may be applied to tests on a test bed at the manufacturer's works and to tests on site.</p>"
