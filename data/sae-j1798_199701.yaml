    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides for common test and verification methods to determine Electric Vehicle battery module performance. The document creates the necessary performance standards to determine (a) what the basic performance of EV battery modules is; and (b) whether battery modules meet minimum performance specification established by vehicle manufacturers or other purchasers. Specific values for these minimum performance specifications are not a part of this document.&lt;/div&gt;


    &lt;/div&gt;</p>
