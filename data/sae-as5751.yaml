  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Specification (AS) is applicable to all aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AS defines the minimum design and operating requirements for the aircraft refueling interface. These requirements establish the minimum criteria for the aircraft design that provides practical standardized refueling system requirements, provides minimum standardized criteria for the operation and performance of any aircraft refueling equipment, and establishes an integrated minimum performance for aircraft refueling operations. This standardization provides the minimum design criteria to assure full compatibility between the aircraft refueling system connection point(s), aircraft operating characteristics, and the design and operation of ground based aircraft refueling equipment in all steady state and dynamic refueling and defueling conditions. The criteria that shall be used to test the operation and performance of the aircraft refueling system and equipment are also specified. Compliance to this AS shall be deemed to mean that the aircraft or aircraft refueling equipment are in compliance with this standard when the refueling system is tested as per the test requirements specified in ARP5918 (mobile systems).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers all types of ground aircraft refueling operations using stationary refueling equipment (e.g., cabinet type units) and mobile refueling vehicles (e.g., hydrant service vehicles, tankers, towable carts, etc.), to fuel aircraft with jet fuel that meets ASTM D1655, ASTM D6615, or DEF-STD-91-91 (including those fuels with synthetic blending components conforming to ASTM D7566). This document also covers fueling with other commercially available and approved fuels such as Gost TS-1 and Chinese jet fuel No. 3. Fuel quality control as detailed in A4A (Airlines for America) Specification 103 and/or EI 1530 is expected to be applied. In addition, the following military standards are also pertinent and referenced: MIL-DTL-5624 or MIL-DTL-83133 listed herein.&lt;/div&gt;&lt;/div&gt;</p>
