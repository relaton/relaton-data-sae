  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) includes a discussion of liquid and particulate contaminants which enter the aircraft through the environmental control system (ECS). Gaseous contaminants such as ozone, fuel vapors, sulphates, etc. are also covered in this AIR. This publication is concerned with contamination sources which interface with ECS and fuel tank inerting systems, and the effects of this contamination on equipment. Methods of control will be limited to the equipment and interfacing ducting which normally falls within the responsibility of the ECS designer.&lt;/div&gt;
    &lt;/div&gt;</p>
