  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This part of SAE J1926 specifies dimensions, performance requirements, and test procedures for adjustable and nonadjustable heavy-duty (S series) stud ends with ASME B1.1 threads for use in fluid power and general applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Stud ends in accordance with this part of SAE J1926 may be used at working pressures up to 63 MPa for nonadjustable stud ends and up to 41.3 MPa for adjustable stud ends. The permissible working pressure depends upon materials, design, working conditions, application, etc.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For threaded ports and stud ends specified in new designs for hydraulic fluid power applications, only ISO 6149 shall be used. Threaded ports and stud ends in accordance with ISO 1179, ISO 9974, and ISO 11926 shall not be used for new design in hydraulic fluid power applications.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Conformance to the dimensional information does not guarantee rated performance. Each manufacturer shall perform testing according to the specification contained in this document to ensure that components made to this document comply with the performance rating.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Appendices A&lt;/span&gt; and &lt;span class="xref"&gt;B&lt;/span&gt; of this document are informative.&lt;/div&gt;&lt;/div&gt;</p>
