abstract:
- language: en
  script: Latn
  content: "<p>The scope of this SAE Recommended Practice is restricted to the testing of jacks supplied as original equipment on passenger cars, light trucks, and vans. To this end, both component suppliers and vehicle manufacturers are guided in the proper design and testing of jacks. The purpose of this document is to provide a test procedure that can be used to ensure reasonable quality and uniformity for vehicle jacks as supplied as original equipment.</p>"
