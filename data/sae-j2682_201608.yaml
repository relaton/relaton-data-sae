  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard specifies uniform methods for the testing of threadless connections for hydraulic fluid power applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These connections are intended for general application and hydraulic systems on industrial equipment and commercial products. These connections shall be capable of providing leak proof connections in hydraulic systems operating from 95 kPa vacuum to working pressures specified by the manufacturer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Since many factors influence the pressure at which a hydraulic system will or will not perform satisfactorily, it is recommended that sufficient testing be conducted and reviewed by both the user and manufacturer to ensure that required performance levels are met.&lt;/div&gt;&lt;/div&gt;</p>
