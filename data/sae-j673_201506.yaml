    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to cover current safety glazing practice applicable to safety glazing for use in motor vehicles and motor vehicle equipment. Nominal specifications for thickness, flatness, curvature, size, and fabrication details are included principally for the guidance of body engineers and designers.&lt;/div&gt;&lt;/div&gt;</p>
