  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) specifically discusses five configurations of flexible tubing. The design data given will aid in design of coiled tube assemblies using Ti-3Al-2.5V cold worked, stress relieved (CWSR) tubing per specification AMS4944. It should be noted that a particular system operating pressure level is not specified. The configurations discussed should be compatible with pressure levels up to 8000 psi upon completion of analysis for the actual stress and life requirement of the intended application. Formal qualification tests are recommended to verify satisfactory installation, clamping, and life of each unique design.&lt;/div&gt;&lt;/div&gt;</p>
