    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies a set of rules for the creation and management of the V2X ASN.1 Module Collection. These rules apply to the development of any message, data element, data frame, or any ASN.1 Entity that is part of the V2X ASN.1 Module Collection, regardless of the SAE technical report in which it appears. The intended audience for these rules includes every technical committee (TC) under the SAE V2X Communications Steering Committee.&lt;/div&gt;&lt;/div&gt;</p>
