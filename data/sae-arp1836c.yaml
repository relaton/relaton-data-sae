    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) outlines the functional and design requirements for a b self-propelled belt conveyor for handling baggage and cargo at aircraft bulk cargo holds. Additional considerations and requirements may legally apply in other countries. As an example, for operation in Europe (E.U. and E.F.T.A.), the applicable EN standards shall be complied with.&lt;/div&gt;&lt;/div&gt;</p>
