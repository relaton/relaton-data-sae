  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This is a SAE Standard specification with minimum performance characteristics for Turbine Flowmeter (TFM) that pertains only to sizes from ½ to 2 inches. The utilization of TFM is for hydrocarbon liquid fuel volumetric flow measurements. This Standard specifically excludes smart electronics in accomplishing the defined performance objectives. Users of this Standard should specify other TFM characteristics required to satisfy their application and utilization in operational environment. A User should understand fit and function of the TFM and define end user specific fit and function requirements. The TFM should be calibrated by the manufacturer should be based upon end user requirements and presented as Roshko versus Strouhal at a reference temperature. The Supplier shall be prepared to show evidence to User that the device demonstrates compliance with all requirements identified in this Standard.&lt;/div&gt;&lt;/div&gt;</p>
