  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice encompasses analytical procedures for measuring nonregulated diesel exhaust emissions. Methods are recommended for the measurement of aldehydes and carbonyl compounds, sulfates, and the characterization of diesel exhaust particulates. Informational methods are presented for the measurement of polycyclic aromatic hydrocarbons (PAH) in diesel exhaust particulate samples.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The procedures are based on current proven chemical and engineering practices. However, it should be noted that the procedures are subject to change to keep pace with established experience and technology.&lt;/div&gt;
    &lt;/div&gt;</p>
