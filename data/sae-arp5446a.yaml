  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These recommendations are provided to aid the international air transport industry by identifying a standard, minimum amount of safety instructions that should be given to sight-impaired passengers. This document is not meant to address problems associated with communicating safety information to sight-impaired passengers who are also hearing impaired or non-conversant in the language(s) used by the cabin crew to disseminate general safety information to passengers. Aircraft operators are encouraged to customize the safety instructions for their own operations in order to ensure that required safety information is provided to sight-impaired passengers.&lt;/div&gt;
    &lt;/div&gt;</p>
