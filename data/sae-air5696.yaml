  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) contains regulatory and guidance information related to transport airplane hydraulic systems. It contains certain Civil Air Regulations (CAR) and Federal Aviation Regulations (formerly referred to as FARs) from Title 14 Code of Federal Regulations (CFR) in their current version as well as the historical versions. This gives the reader an ability to assemble certain CAR/CFR parts as they existed at any date in the past (referred to as a Regulatory Basis). A certain amount of preamble explanatory material is included, which led to the regulatory rule changes (Amendments to the CFR).&lt;/div&gt;&lt;/div&gt;</p>
