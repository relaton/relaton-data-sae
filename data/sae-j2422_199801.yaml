    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the test procedures for conducting quasi-static cab roof strength tests for heavy-truck applications. Its purpose is to establish recommended test procedures which will standardize the procedure for heavy trucks. Descriptions of the test set-up, test instrumentation, photographic/video coverage, and the test fixtures are included.&lt;/div&gt;&lt;/div&gt;</p>
