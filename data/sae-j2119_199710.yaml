  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Since little data exists to provide appropriate values for control parameters that would be appropriate for mature drivers, the following recommendations are of a general nature. However, they are based upon the current understanding of the aging processes that characterize mature drivers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Notwithstanding the lack of an extensive amount of data in this field, the dissemination of this SAE Information Report is considered to be appropriate and timely in light of the large increase in the number of mature drivers on the public roads, and because of the need to at least initiate efforts toward developing an information report covering this issue.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is realized that there may be cases where specific recommendations may conflict with vehicle packaging and/or operational requirements. Deviation from the recommendations may be necessary and permissible to achieve the best overall system performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A "mature" driver is defined as one who is over the age of 50 since visual changes become noticeable at about this age. Degenerative cognitive and skeletal changes visually become more apparent at a later age (Reference 1).&lt;/div&gt;&lt;/div&gt;</p>
