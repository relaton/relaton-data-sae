  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practices specifies a procedure for determining structural strength and fatigue life of disc-brake caliper assemblies which are satisfactory for vehicle usage. It is applicable to new caliper assemblies which are employed in passenger car and truck brake systems utilizing hydraulic brake fluids. Brake design and vehicle performance requirements are not included. Specification limits are left to the discretion of the responsible manufacturer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure was developed for base brake operation and does not consider some unusual effects of ABS (Anti-Lock-Brake System) or Traction Control systems which may have a significant effect on the caliper. Careful analysis of the particular type ABS and/or Traction Control should be made and additional tests may be required which are not included in this document.&lt;/div&gt;&lt;/div&gt;</p>
