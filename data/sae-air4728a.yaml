  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) presents reference information for use in preparing detailed specifications and other documents. The intent is to have a master reference document containing frequently required tabulations of information, such as the meaning of abbreviations, the spelled out wording of acronyms, the definition of terms, etc. so that such tabulations need not be repeated in recommended practice documents describing how to prepare technical documents.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended to provide references in the field of fluid system components for space applications. Space applications include spacecraft, such as satellites, space stations, launch vehicles and space shuttles, and servicing equipment and components used for ground systems and launching and for servicing in space. Fluid system components include couplings, fittings, hose and tubing assemblies.&lt;/div&gt;&lt;/div&gt;</p>
