  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice specifies the test methods and procedures necessary to evaluate electrical components intended for automotive use to the threat of Electrostatic Discharges (ESDs). It describes test procedures for evaluating electrical components on the bench.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Functional status classifications for immunity to ESD are given in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A procedure for calibrating the simulator that is used for electrostatic discharges is given in &lt;span class="xref"&gt;Appendix B&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
