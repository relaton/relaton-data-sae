  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test procedure is for Qualification Testing of electrically powered hydraulic or mechanically operated devices which permit a person in a manual or powered wheelchair to enter or exit a personally licensed vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It establishes minimum test requirements for compliance. A lift completing the test without failure under this procedure shall be considered in compliance. The tests in &lt;span class="xref"&gt;Section 3&lt;/span&gt; shall be done in the sequence listed.&lt;/div&gt;
    &lt;/div&gt;</p>
