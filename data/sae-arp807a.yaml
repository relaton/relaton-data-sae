abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this Aerospace Recommended Practice is to provide recommendations which will lead to the standardization of flight deck interior doors and their operation in all transport aircraft by establishing design criteria which will provide optimum use under normal and emergency conditions. The flight deck interior door is that door which connects the flight deck area with any cabin area or area leading to any cabin area, whether passenger or cargo, and does not include any door leading from the flight deck directly to the outside of the aircraft.</p>"
