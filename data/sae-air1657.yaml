  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SI and other metric units related to aerospace hydraulics are summarized. Conversion of English units is provided as required. Fundamental fluid properties and physical laws governing fluid motion and pressure are described in SI units. Examples of application to typical aerospace hydraulic system components are worked out. Thermodynamic processes are excluded from the scope of this report.&lt;/div&gt;&lt;/div&gt;</p>
