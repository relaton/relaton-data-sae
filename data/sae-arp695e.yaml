  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice provides design and installation criteria intended to enhance overall safety by mitigating exposure of cabin crew and passengers to risks from:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Routine use of galley systems.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Galley components or equipment becoming dislodged under routine or abnormal operating conditions and under survivable crash or ditching conditions.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Malfunctions of, or defects in, a galley system or associated galley equipment.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: It is not the purpose of this Aerospace Recommended Practice to specify the specific designs or design methods to be followed in the accomplishment of stated objectives.&lt;/div&gt;&lt;/div&gt;</p>
