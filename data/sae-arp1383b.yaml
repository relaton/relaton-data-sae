    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes the minimum requirements and procedures for impulse testing of aerospace hydraulic actuators, valves, pressure containers, and similar fluid system components, for use in aerospace hydraulic systems; for exceptions, see paragraph &lt;span class="xref"&gt;9.1&lt;/span&gt;. This ARP also refers to standard impulse test equipment, which may be used in conducting these impulse tests.&lt;/div&gt;&lt;/div&gt;</p>
