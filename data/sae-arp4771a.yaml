abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This document contains information that can be used by the
    air transportation industry to provide passengers with consistent Brace for Impact
    positions in passenger safety information and briefings.  This information is
    intended to reduce the potential confusion passengers may experience upon being
    presented with different Brace for Impactpositions as they travel on different
    aircraft or on different carriers.  This document does not address child restraint
    or situations where adult passengers are seated behind fixed tables.&lt;/p&gt;</p>"
