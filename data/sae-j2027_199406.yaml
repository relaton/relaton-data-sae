    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the performance requirements for protective covers for gasoline fuel tubing. The ultimate performance of the protective cover can be highly dependant on the interaction of the fuel line tubing and protective cover. Therefore, it is recommended that specific tubing and cover combinations be tested as an assembly to qualify to this document.&lt;/div&gt;


    &lt;/div&gt;</p>
