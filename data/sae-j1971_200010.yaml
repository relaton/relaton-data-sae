    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides information on procedures, tools, and fixtures useful in determining frictional torque measurement of radial lip oil seals. Information on the effect of various operational environments on oil seals are discussed and a means of calculation of power consumption of seals is provided.&lt;/div&gt;&lt;/div&gt;</p>
