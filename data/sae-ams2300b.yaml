  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers sampling and testing procedures to determine conformance of premium aircraft-quality ferromagnetic steels to cleanliness requirements of material specifications in which this specification is referenced. Applicable primarily to blooms, billets, extrusions, tube rounds, stock for forgings and rings, bars, and heavy wall tubing used in the fabrication of highly stressed parts and assemblies where very rigid magnetic particle standards are used in the final inspection of such parts.&lt;/div&gt;&lt;/div&gt;</p>
