  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) establishes the part numbers and/or description of the critical components and operational guidelines for the standard hydraulic impulse machine for testing hydraulic hose assemblies, tubing, coils, and fittings and may be used for similar fluid system components, if desired.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The standard impulse machine is established for the following purposes:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;As referee in the event of conflicting data from two or more nonstandard impulse machines. Such a referee machine might be built by an impartial testing activity.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A design guide for future machines being built by manufacturers and users, or the upgrading of present machines.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A design guide for higher pressure machines or special purpose machines being designed.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;It is not the intention of this document to obsolete present machines.&lt;/div&gt;&lt;/div&gt;</p>
