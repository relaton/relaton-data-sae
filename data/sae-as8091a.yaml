  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides requirements for design and installation of aircraft jacking pad adapters and the mating jack socket interface to permit use of standard jacking equipment to be used in civil and military transport aircraft. The adapter defined herein shall be the key interface between the aircraft and the aircraft jack(s).&lt;/div&gt;&lt;/div&gt;</p>
