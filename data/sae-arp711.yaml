  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) covers the general design and performance characteristics of illuminated information signs for service in the passenger compartment of passenger transport aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;"Illuminated information signs" are lighted signs used to inform occupants of the passenger compartment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP does not apply to "EXIT" signs which are the subject of ARP503.&lt;/div&gt;&lt;/div&gt;</p>
