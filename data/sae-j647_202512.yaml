  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following schematic diagrams reflect various methods of illustrating automotive transmission arrangements. These have been developed to facilitate a clear understanding of the functional interrelations of the gearing, clutches, hydrodynamic drive unit, and other transmission components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Two variations of transmission diagrams are used: in neutral (clutches not applied) and in gear. For illustrative purposes, some typical transmissions are shown.&lt;/div&gt;&lt;/div&gt;</p>
