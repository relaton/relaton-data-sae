  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion and heat-resistant nickel alloy in the form of parts produced by laser-powder bed fusion (L-PBF) that are subjected to post-deposition stress relief (SR), hot isostatic press (HIP) and solution anneal operations. Parts may require subsequent machining or surface finishing to meet specific application requirements.&lt;/div&gt;&lt;/div&gt;</p>
