  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard identifies the material and dimensional requirements for component connector tubes and related items for use in fluid power components. Connector tubes are also identified as quills, ferrules or transfer tubes. Connector tubes are used to connect fluid passages within a component or to connect one component to another; for example, connecting control valves to subplates. Related items include plugs, undrilled connector tubes and connector tubes for internal check valves and restrictors.&lt;/div&gt;
    &lt;/div&gt;</p>
