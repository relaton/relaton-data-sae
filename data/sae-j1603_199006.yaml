  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes the performance and part requirements for elastomeric seals used in highway vehicle disc brake calipers. Seals covered by this specification may be the solid section type (square, rectangular, O-ring, etc.) mounted stationary in the cylinder bore or on the movable piston. The specification contains the following major sections:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Resistance to Fluid at Elevated Temperature - Physical Stability [loose parts in 120°C ± 2 (248°F ± 3.6) brake fluid for 70 h].&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Resistance to Fluid at Elevated Temperature - Precipitation Characteristics [loose parts in 120°C ± 2 (248°F ± 3.6) brake fluid for 70 h].&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Resistance to Elevated Temperatures in Dry Air [loose parts in 175°C ± 2 (347°F ± 3.6) air for 22 h].&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;4&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Ambient Temperature Stroking Test [tested in brake assembly for 500 000 cycles to 7 MPa ± 0.3 (1000 psi ± 50)].&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;5&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;High Temperature Stroking Test [tested in brake assembly for 70 h (70 000 strokes) at 120°C ± 2 (248°F ± 3.6) to 7 MPa ± 0.3 (1000 psi ± 50)].&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;6&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Low Temperature Leakage Test [tested in brake assembly for 120 h at -40 to 42.8°C (-40 to 45°F)].&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;7&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Cycling Humidity Storage Corrosion Test [tested in brake assembly for 14 days at 95% humidity cycling between 21 to 46°C (69.8 to 114.8°F)].&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
