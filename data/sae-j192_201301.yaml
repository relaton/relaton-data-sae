  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the instrumentation, test site, and test procedure for determining the maximum exterior sound level for snowmobiles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Sound propagation is directly related to the ground cover and provides the largest variation to the measured result. A correction factor is introduced to improve year round test repeatability of the results on grass surfaces by correcting their spectrum to be similar to snow covered spectra.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Measured sound pressure levels are also highly dependent on the degree of track slip present when performing the vehicle acceleration. Operators should attempt to limit track slip as much as possible while maintaining the requirements described in &lt;span class="xref"&gt;5.1.1&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
