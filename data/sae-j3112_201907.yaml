  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the test conditions and reporting method for quantifying refrigerant circuit oil circulation rate (OCR) reduction effectiveness of mobile air conditioning compressors using R-134a and R-1234yf refrigerants that include oil separators and/or other design features for the purpose of reducing the OCR in the refrigerant circuit.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard and the OCR values it produces are not intended to make judgement on suitability of OCR values with regard to compressor durability.&lt;/div&gt;&lt;/div&gt;</p>
