  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This FMEA standard describes potential failure mode and effects analysis in design (DFMEA), supplemental FMEA-MSR, and potential failure mode and effects analysis in manufacturing and assembly processes (PFMEA). It assists users in the identification and mitigation of risk by providing appropriate terms, requirements, rating charts, and worksheets. As a standard, this document contains requirements—”must”—and recommendations—”should”—to guide the user through the FMEA process. The FMEA process and documentation must comply with this standard as well as any corporate policy concerning this standard. Documented rationale and agreement with the customer are necessary for deviations in order to justify new work or changed methods during customer or third-party audit reviews.&lt;/div&gt;
    &lt;/div&gt;</p>
