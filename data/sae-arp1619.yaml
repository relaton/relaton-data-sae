    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) identifies "type" and "degree" of change to brake, wheel, or component thereof, and recommends substantiation procedures to confirm that &lt;u&gt;performance capability&lt;/u&gt; of an existing aircraft using the replacement or modified brake and wheel equipment &lt;u&gt;is not less&lt;/u&gt; than that when originally certified for commercial or military aircraft applications.&lt;/div&gt;&lt;/div&gt;</p>
