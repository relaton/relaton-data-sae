    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to electronic probe-type leak detectors used to identify refrigerant leakage when servicing motor vehicle air conditioning systems. This document does not address any safety issues concerning their design or use. The purpose of this SAE Standard is to establish the minimum performance criteria for electronic probe-type leak detectors.&lt;/div&gt;&lt;/div&gt;</p>
