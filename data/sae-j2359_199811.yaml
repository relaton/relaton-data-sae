    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers engine military oils suitable for lubrication of reciprocating internal combustion engines of both spark-ignition and compression-ignition types, and for power transmission fluid applications in combat/tactical service equipment (see &lt;span class="xref"&gt;7.1&lt;/span&gt;). This document is equivalent to MIL-PRF-2104G when all requirements are met.&lt;/div&gt;
