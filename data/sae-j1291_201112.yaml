  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard documents dimensional metric specifications for hydraulic brake system threaded ports and banjo bolts for the interconnection of major components in automotive hydraulic brake systems. Banjo blocks are not covered by this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to recommend preferred metrically dimensioned components (including alternative choices). Some applications may require sizes or forms other than those shown herein, and this document does not preclude such other details when they are required.&lt;/div&gt;&lt;/div&gt;</p>
