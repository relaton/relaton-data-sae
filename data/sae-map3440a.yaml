    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides the design criteria for static elastomeric O-ring seals used specifically in engine and engine control systems. It provides radial compression groove dimensions for aerospace metric O-ring sizes specified in MA2010. The conditions considered to formulate the design criteria are also described, e.g., seal stretch, cross-section reduction, seal squeeze, and swell.&lt;/div&gt;&lt;/div&gt;</p>
