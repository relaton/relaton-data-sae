  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Air cargo pallets and their cargo restraint nets constitute aircraft Unit Load Devices, defined by industry standards and airworthiness certified based on Technical Standard Order (TSO) C90c in accordance with the requirements of NAS 3610. This guarantees their design to be intrinsically safe for flight on board compatible aircraft types. However, actual flight safety also requires these certified pieces of equipment to be properly used: numerous occurrences have demonstrated a certified ULD can nevertheless jeopardize flight safety if loaded or restrained in an inadequate manner.&lt;/div&gt;&lt;/div&gt;</p>
