  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the method for safe deployment of airbag modules in vehicles equipped with electrically actuated airbag systems for the purpose of disposal. It is intended to provide a procedure that does not require significant technical expertise, is easy to operate, and is readily available to be used by automobile dismantlers or vehicle shredders to deploy airbag modules prior to automobile reclamation.&lt;/div&gt;
    &lt;/div&gt;</p>
