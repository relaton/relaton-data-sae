  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the functional safety (FuSa) assurance data to be included when communicating safety-related A_PDUs using either the Multi-PG service or the FD Transport service within an SAE J1939-22 protocol stack. It specifies the following:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The parameters that make up the FuSa assurance information&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The behavioral requirements when producing and consuming FuSa assurance information&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The technical requirements for different FuSa profiles intended to meet different application requirements&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The trailer formats for the different FuSa profiles that can be incorporated into Multi-PG and FD Transport services&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not specify the assignment of a FuSa profile to any values of the TOS and TF fields when using the Multi-PG service, or to any value of the AD TYPE field when using the FD Transport service; instead, SAE J1939-22, or an OEM in the manufacturer-specific ranges of these fields, specifies the assignments for these fields.&lt;/div&gt;&lt;/div&gt;</p>
