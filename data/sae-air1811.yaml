  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This publication is applicable to liquid cooling systems of the closed loop type and the expendable coolant type in which the &lt;u&gt;primary&lt;/u&gt; function is transporting of heat from its source to a heat sink. Most liquid cooling system applications are oriented toward the cooling of electronics. Liquid cooling techniques, heat sinks, design features, selection of coolants, corrosion control, and servicing requirements for these systems are presented. Information on vapor compression refrigeration systems, which are a type of cooling system, is found in Reference 1.&lt;/div&gt;&lt;/div&gt;</p>
