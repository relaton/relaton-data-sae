    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an acrylonitrile-butadiene (NBR) rubber in the form of molded rings, compression seals, molded O-ring cord, and molded-in-place gaskets for aeronautical and aerospace applications. For sheet, strip, tubing, extrusions, and molded shapes, refer to the AMS3215 specification, which is intended for that use.&lt;/div&gt;&lt;/div&gt;</p>
