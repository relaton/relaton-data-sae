    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this SAE Aerospace Information Report (AIR) is to document the design requirements and approaches for the crashworthy design of aircraft landing gear.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers the field of commercial and military airplanes and helicopters. This summary of crashworthy landing gear design requirements and approaches may be used as a reference for future aircraft.&lt;/div&gt;&lt;/div&gt;</p>
