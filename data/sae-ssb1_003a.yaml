  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is an annex to EIA Engineering Bulletin SSB-1, &lt;i&gt;Guidelines for Using Plastic Encapsulated Microcircuits and Semiconductors in Military, Aerospace and Other Rugged Applications&lt;/i&gt; (the latest revision).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document provides reference information concerning acceleration factors commonly used by device manufacturers to model failure rates in conjunction with statistical reliability monitoring. These acceleration factors are frequently used by OEMs in conjunction with physics of failure reliability analysis to assess the suitability of plastic encapsulated microcircuits and semiconductors for specific end use applications.&lt;/div&gt;&lt;/div&gt;</p>
