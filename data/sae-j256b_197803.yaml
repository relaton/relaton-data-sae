    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice covers service performance tests, test methods, and requirements applicable to lighting devices and components covered by SAE Standards, Recommended Practices, and Information Reports. It is intended to supplement the engineering design test procedures and requirements by establishing test procedures and requirements for service evaluation of many of the lighting devices covered by SAE Standards.&lt;/div&gt;&lt;/div&gt;</p>
