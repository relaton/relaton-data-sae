  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) reviews technical, operational, and maintenance data being exchanged between key stakeholders in aerospace asset lifecycle and data standards available for such exchanges. It identifies gaps and non-availability of data standards in certain areas. The scope of the current document is limited to aircraft operations, maintenance and disposal stages post-build phase, and does not include the detailed interactions during the aircraft build phase.&lt;/div&gt;


    &lt;/div&gt;</p>
