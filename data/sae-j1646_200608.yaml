  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the principal terms and equations pertaining to automotive automatic transmission clutch plate, band, or other wet-friction systems. The terms apply directly to friction-system testing as is typically conducted on inertia-stop test equipment. Some terms can be directly applied to the analysis of friction in the transmission or brake assembly and other friction-test equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The glossary presents terms used to describe the set-up, testing, and results of tests as shown in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;, which were taken on a clutch SAE No. 2 machine.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;The glossary is intended to provide a collection of definitions in the hope of eliminating confusion in development and their application to passenger cars and trucks.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document focuses on the terminology of friction-system testing. References for this type of testing are shown in &lt;span class="xref"&gt;Section 2&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
