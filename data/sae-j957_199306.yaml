  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies a procedure for approximating the volume of a typical material carried in the bowl of an elevating scraper as defined in SAE J728 and SAE J1057. The volumes are based on the inside dimensions of the bowl and a representative volume on top of the bowl. This rating method is intended to provide a consistent means of comparing capacities; it is not intended to define actual capacities that might be observed in any specific application.&lt;/div&gt;&lt;/div&gt;</p>
