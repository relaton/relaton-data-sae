  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers the requirements for ground power equipment that supplies 115/200 V, 3-phase, 400 Hz output capable of powering aircraft type loads requiring MIL-STD-704E/DFS-400 quality power. All forms of ground power including mobile and fixed systems are addressed by this document. High voltage (270 V DC) systems are not included in this specification.&lt;/div&gt;&lt;/div&gt;</p>
