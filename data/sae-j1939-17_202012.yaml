  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines a physical layer having a high bandwidth capacity utilizing the Flexible Data Rate Frame Format as defined in ISO 11898-1:2015. CAN controllers which support this format and compatible high speed transceivers are required for use on SAE J1939-17 networks.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended for light- and heavy-duty vehicles on- or off-road as well as appropriate stationary applications which use vehicle derived components (e.g., generator sets). Vehicles of interest include but are not limited to: on- and off-highway trucks and their trailers; construction equipment; and agricultural equipment and implements.&lt;/div&gt;
    &lt;/div&gt;</p>
