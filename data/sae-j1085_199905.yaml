    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These methods cover testing procedures for defining and specifying the dynamic characteristics of simple elastomers and simple fabricated elastomeric isolators used in vehicle components. Simple, here, is defined as solid (non-hydraulic) components tested at frequencies less than or equal to 25 Hz.&lt;/div&gt;&lt;/div&gt;</p>
