  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is an industrial collaboration with regulatory bodies like the European Aviation Safety Agency (EASA) and the Federal Aviation Administration (FAA) to determine the worst-case credible thermal runaway (TR) condition (energy released and maximum temperature) for the design of an aviation large propulsion battery system to quantitatively verify TR in lieu of battery level RTCA DO-311A testing with protections disabled. The ARP considers the three stages of TR within a cell and defines the two critical temperatures for a specific cell design. These temperatures are key to understanding the layers of monitoring necessary to determine the severity of a TR event.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Different trigger methods can be used to quantify the heating characteristics and resultant energy profile releases as a function of time. Results show three general phases of the event critical temperature (see &lt;span class="xref"&gt;1.5&lt;/span&gt;) corresponding with the reaction between the cell’s solid electrolyte interphase (SEI) for graphite anodes and the electrolyte, resulting in heat generated by the cell rather than heat supplied from the accelerating rate calorimeter (ARC). The temperature of the cell continues to rise until the separator begins to melt. Critical Temperature 2 occurs after the separator melts and electrodes are shorted together to generate large amounts of heat, raising the cell temperature quickly to 377 °C. These temperatures are key precursors of TR, regarding the length and severity of an event. Understanding this key bit of information is vital to the approach presented herein.&lt;/div&gt;





    &lt;/div&gt;</p>
