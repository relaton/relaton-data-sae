  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document aims to define the procurement requirements for galling-resistant, corrosion-resistant steel wire, with the chemical composition per UNS S21800 and AMS5848 and spring temper, used in the manufacture of helical coil threaded inserts. It will enable insert manufacturers to adhere to specific standards to meet the criteria outlined in this procurement specification.&lt;/div&gt;

    &lt;/div&gt;</p>
