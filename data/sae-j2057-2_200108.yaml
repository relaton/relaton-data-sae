  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The Class A Task Force of the Vehicle Network for Multiplex and Data Communications Committee is publishing this SAE Information Report to provide insight into Class A Multiplexing. Multiplexed actuators are generally defined as devices which accept information from the multiplexed bus. A multiplexed actuator can be an output device controlled by the operator or an intelligent controller. A Multiplex actuator can also be a display device that reports the status of a monitored vehicle function. This document is intended to help the network system engineers and is meant to stimulate the design thought process.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A list of multiplexed actuator examples is provided in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;, &lt;span class="xref"&gt;Figure A1&lt;/span&gt;. Many other examples can be it identified.&lt;/div&gt;

    &lt;/div&gt;</p>
