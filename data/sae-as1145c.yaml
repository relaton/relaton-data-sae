    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers minimum requirements for brake temperature monitoring equipment whenever used on any type and model of civil aircraft. It shall be the responsibility of the purchaser to determine the compatibility of these requirements with the application aircraft and to specify requirements in excess of these minimums as necessary.&lt;/div&gt;
