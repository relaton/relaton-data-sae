abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this recommended practice is to evaluate in the laboratory
    the effect of flexing on a brake hose when exposed to a high ozone concentration
    environment. This recommended practice is intended for all vehicle hydraulic brake
    hoses. It is an accelerated test which subjects the hose to dynamic ozone exposure.</p>"
