  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These requirements are applicable to Accreditation Bodies, Registrars and OEMs, when specified by an aerospace company requiring assessment and/or registration of their quality system in accordance with the requirements of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The quality management system standard shall be AS9000 or AS9100 and shall be applied to the organization’s complete Quality System that covers aerospace products.&lt;/div&gt;
    &lt;/div&gt;</p>
