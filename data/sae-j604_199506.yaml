    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is applicable to all types of reciprocating engines including two-stroke cycle and free piston engines, and was prepared to facilitate clear understanding and promote uniformity in nomenclature.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Modifying adjectives in some cases were omitted for simplicity. However, it is good practice to use adjectives when they add to clarity and understanding.&lt;/div&gt;&lt;/div&gt;</p>
