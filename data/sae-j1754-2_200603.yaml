    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers ordering information for steel wire reinforced rubber hose assemblies using connectors specified in SAE Standard J516 for use in hydraulic systems using petroleum based hydraulic fluids with maximum working pressures of 1.7 to 42 MPa. See Part 2, Table 8 for hose operating temperature ranges and identification codes.&lt;/div&gt;

