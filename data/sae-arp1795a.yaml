abstract:
- language: en
  script: Latn
  content: "<p>This document establishes a test procedure for determining the propensity of aircraft turbine engine cleaning and maintenance materials for causing stress-corrosion cracking of titanium alloy parts. The evaluation is conducted on representative titanium alloys by determining the effect of contact with cleaning and maintenance materials on tendency of pre-stressed titanium alloys to crack when subsequently heated to elevated temperatures.</p>"
