  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to all portions of the vehicle, but design efforts should focus on components and systems with the highest contribution to the overall average repair cost (see &lt;span class="xref"&gt;3.7&lt;/span&gt;). The costs to be minimized include not only insurance premiums, but also out-of-pocket costs incurred by the owner.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Damageability, repairability, serviceability and diagnostics are inter-related. Some repairability, serviceability and diagnostics operations may be required for collision or comprehensive loss-related causes only. Some operations may be for non-collision-related causes only (warranty, scheduled maintenance, non-scheduled maintenance, etc.). Some may be required for both causes. The scope of this document deals with only those operations that involve collision and comprehensive insurance loss repairs.&lt;/div&gt;
    &lt;/div&gt;</p>
