  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is intended to provide general background on aircraft wheel service lives on military aircraft and wheel laboratory test requirements as specified by military procurement agencies or aircraft manufacturers. Wheel service life in this document refers to the lowest life wheel half or flange in a wheel assembly measured in years (excluding bearing, bolt, and other removals). This information is intended as a reference guide for those responsible for specifying original equipment (OE) wheel laboratory test requirements.&lt;/div&gt;
    &lt;/div&gt;</p>
