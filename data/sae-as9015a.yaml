abstract:
- language: en
  script: Latn
  content: "<p>This SAE Aerospace Standard (AS) further defines the requirements for a delegation process identified in Aerospace Quality Management System (AQMS) standards (i.e., AS9100, AS9110, AS9120). This standard establishes minimum requirements for the delegation of product verification to an organization's suppliers; outlining requirements for the initial delegation (qualification/selection), maintenance, and removal/withdrawal of delegations.</p>"
