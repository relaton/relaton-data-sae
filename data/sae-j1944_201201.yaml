  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides the following for the windshield washer system for trucks, buses, and multipurpose vehicles with GVW of 4500 kg (10 000 lb) or greater:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Minimum performance requirement&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Uniform test procedures. The test procedures are limited to those tests that can be conducted with uniform test equipment by commercially available laboratory facilities.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Uniform terminology of windshield washer system characteristics and phenomena.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The minimum performance requirements and test procedures, outlined in this document, are based on currently available engineering data.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is intended that all portions of the document will be periodically reviewed and revised as additional data on windshield washer system performance are developed.&lt;/div&gt;&lt;/div&gt;</p>
