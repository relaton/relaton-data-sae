abstract:
- language: en
  script: Latn
  content: <p>This specification covers a corrosion and heat resistant nickel alloy
    in the form of bars, forgings, and stock for forging or heading. Primarily for
    parts, such as turbine blades, bolts, and fittings, requiring high strength up
    to 1600 degrees F (870 degrees Centigrade) and oxidation resistance up to 1800
    degrees F (980 degrees C). This specification has been declared "Noncurrent" by
    the Aerospace materials Division, SAE, as of October 16, 1987. It is recommended,
    therefore, that this specification not be specified for new designs.</p>
