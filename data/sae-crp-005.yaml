abstract:
- language: en
  script: Latn
  content: "<p>This SAE Cooperative Research Report analyzes whether discarded air bag inflator/module units should be regulated  under the federal Resource Conservation Recovery Act (RCRA).  This extensive document includes information on  EPA rules and policy statements, an analysis of whether undeployed and deployed air bag inflator/module units should be classified as hazardous wastes, recycling of  these units, federal legislative developments, and more.</p>"
