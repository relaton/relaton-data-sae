  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes requirements for Process Control Methods to sustain product conformity. This includes training, selection of control methods, analysis and improvement of their effectiveness, and subsequent monitoring and control. It applies to all controls documented in the Control Plan. This will include but is not limited to Key Characteristics (KCs) and Critical Items (CIs).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard aligns and collaborates with the requirements of AS9100, AS9103, AS9145, AS13000, AS13002, AS13003, and AS13004.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Commercial-Off-The-Shelf (COTS) items and Standard Catalogue Items (that neither the customer nor supplier hold design authority for) are not included.&lt;/div&gt;&lt;/div&gt;</p>
