abstract:
- language: en
  script: Latn
  content: |-
    <p>The Token Slot Data Link is intended to provide periodic, broadcast communications (communication that must occur on a regular, predetermined basis) within a vehicle system. The Token Slot protocol achieves this by implementing a masterless,  deterministic, non-contention Token Slot sequence which is designed to offer a transmit token to all devices (or nodes) without requiring that they respond. After acquiring the token, messages may be sent and verified using a variety of built-in techniques. The token passing slot sequence is then reinitiated by the current token holder.

    Vehicle Architecture for Data Communication Standards Committee voted to cancel document - 7/19/2002

    J2058 and J2106 Rationale
    Per Jack Volk, Vice Chairperson of Vehicle Architecture for Data Communication Standards Committee, document not being used.  Information may be contained in other documents, (not necessarily SAE documents).</p>
