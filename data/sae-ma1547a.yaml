    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the design, performance, and test requirements for high strength, thin wall, commercial sockets, universal sockets, and box wrenches used for the attachment and detachment of metric spline drive, high strength, and high temperature aircraft fasteners.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Inclusion of dimensional data in this standard is not intended to imply that all of the products described herein are stock production sizes. Consumers are requested to consult with manufacturers concerning lists of stock production sizes.&lt;/div&gt;
