  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard covers both “welded and cold drawn” and “seamless” stainless steel pressure tubing in the as-cold-drawn high strength condition intended for use as high pressure hydraulic lines and other applications requiring corrosion resistance. Welding, brazing, or other thermal processing methods that subject the tube material or assembly to elevated temperatures may compromise the strength of the tubing.&lt;/div&gt;&lt;/div&gt;</p>
