  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The recommended practice applies to the dynamometer test procedure which can be used to assess the smoke emission characteristics of vehicular diesel engines. In particular, this procedure describes the smoke test cycle, equipment and instrumentation, instrument checks, chart reading and calculation for evaluation of an engine’s transient smoke emission characteristic. In addition, this procedure offers guidelines to be used in establishing correlation between full flow in-line and end-of-line opacimeters.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Since the type of test described here is transient in nature, a fast responding full flow opacimeter is required for the smoke measurements. Slow responding or sampling, or both, type instruments must not be used since they typically have excessive and variable response delays and do not provide an accurate measurement of an engine’s transient smoke characteristics.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Note: It is recommended that whenever this procedure is cited, any additional or modified test conditions must be clearly reported.&lt;/div&gt;&lt;/div&gt;</p>
