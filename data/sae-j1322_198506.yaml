abstract:
- language: en
  script: Latn
  content: "<p>This information report is being issued to cover conversions from inch-pound units to those in the System International (SI) approach. Since all conversions cannot possibly be covered, the list contained in Section 4 is composed of the lighting oriented items which are found in SAE or Motor Vehicle Safety Standard (MVSS) in North America. This reference is to FMVSS in the United States and to CMVSS in Canada. The purpose of this report is to give guidance for uniformity particularly to those organizations, governmental or otherwise, who may in the future  have occasion to express present inch-pound units in metric or SI terms.</p>"
