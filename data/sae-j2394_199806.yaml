    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the minimum construction and performance requirements for seven-conductor 1/8-2/10-4/12 cable for use on trucks and trailers. Where appropriate, the document refers to two types of cables, (Type F and S, described later in the document), due to the variation in the performance demands of cables used in flexing and stationary applications.&lt;/div&gt;&lt;/div&gt;</p>
