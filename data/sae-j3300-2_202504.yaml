  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice is intended to establish a procedure to certify the trailer towing driving skill levels of professional drivers. This certification can be used by the individual driver to qualify their skills when seeking employment or other professional activity. These certification levels may also be used by test facilities or other organizations when seeking test or professional drivers of various skills.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document provides directions for obtaining certification through Probitas Authentication&lt;sup&gt;®&lt;/sup&gt;&lt;sup&gt;&lt;span class="xref"&gt;1&lt;/span&gt;&lt;/sup&gt; and associated trailer towing driving skill examination requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is a supplement to SAE J3300, providing information specific to the trailer towing driving skill certification and clarifying the application of the rules set forth in SAE J3300 to the trailer towing certification. While the references, definitions, rules, and guidelines presented in SAE J3300 Sections 1 through 5 apply to the trailer towing certification, they are not repeated in this document.&lt;/div&gt;&lt;/div&gt;</p>
