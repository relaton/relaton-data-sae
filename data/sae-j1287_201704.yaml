  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the test procedure, environment, and instrumentation for determining the exhaust sound pressure levels of motorcycles under stationary conditions. Since initial publication, it has been successfully applied to regulation and monitoring of sound pressure levels of off-highway vehicles, and that remains its recommended application. Users of SAE J1287 for the purpose of roadside enforcement of sound pressure levels for on-highway motorcycles have reported difficulties with its implementation in that application. In response, SAE J2825 was developed, and is recommended for measurement of exhaust sound pressure levels of stationary on-highway motorcycles. Care must be taken not to confuse stationary sound pressure levels with total motorcycle sound pressure levels. This test does not evaluate total motorcycle sound during operation. For this purpose, SAE J331 or SAE J47 is recommended. Any allowable sound limits (dBA) set in relation to SAE J1287 for exhaust sound pressure level should not conflict with the allowable sound limits (dBA) for total sound pressure level per the EPA requirements specified in the US Code of Federal Regulations, 40 Part 205.&lt;/div&gt;&lt;/div&gt;</p>
