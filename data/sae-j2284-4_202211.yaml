  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice will define the physical layer and portions of the data link layer of the open systems interconnection model (ISO 7498) for a 500 kbps arbitration bus with CAN FD data at 2 Mbps high-speed CAN (HSC) protocol implementation. Both ECU and media design requirements for networks will be specified. Requirements will primarily address the CAN physical layer implementation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Requirements will focus on a minimum standard level of performance from the HSC implementation. All ECUs and media shall be designed to meet certain component level requirements in order to ensure the HSC implementation system level performance at 500 kbps arbitration bus with CAN FD data at 2 Mbps. The minimum performance level shall be specified by system level performance requirements or characteristics described in detail in &lt;span class="xref"&gt;Section 6&lt;/span&gt; of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is designed such that if the electronic control unit (ECU) requirements defined in &lt;span class="xref"&gt;Section 6&lt;/span&gt; are met, then the system level attributes should be obtainable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document will address only requirements which may be tested at the ECU and media level. No requirements which apply to the testing of the HSC implementation as integrated into a vehicle are contained in this document. However, compliance with all ECU and media requirements will increase the possibility of communication compatibility between separately procured components and will greatly simplify the task of successfully integrating an HSC communication system in a vehicle.&lt;/div&gt;&lt;/div&gt;</p>
