  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the minimum labeling considered necessary for commercial containers used to package brake fluids of the nonpetroleum type for use in the braking system of motor vehicles such as passenger cars, trucks, buses, and trailers. The vehicle manufacturer’s service brake maintenance procedures are recommendations for specific makes or models of motor vehicles, and specified requirements for motor vehicle brake fluid must be followed in order to insure brake efficiency and safety, and to comply with legal regulations governing the sale and use of brake fluid. To designate the intended use and the performance level of all types and specifications of motor vehicle brake fluids, all packaged containers of brake fluid should be clearly and distinctly identified as to conformance to the SAE Motor Vehicle Brake Fluid specified in the latest SAE Standard.&lt;/div&gt;&lt;/div&gt;</p>
