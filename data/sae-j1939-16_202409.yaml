  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Define a process enabling network devices to detect the baud rate of a CAN Classic network as specified by physical layers SAE J1939-11, SAE J1939-14, or SAE J1939-15. The intent is to minimize or eliminate communication disruption between existing network devices. These networks only support Classical Base Frame Format (CBFF) and Classical Extended Frame Format (CEFF) Data Frames, as defined in ISO 11898-1:2015.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Baud rate detection on a SAE J1939 CAN FD network is not in scope, as SAE J1939-17 is currently the only SAE J1939 CAN FD physical layer option and specifies only one supported baud rate combination (500 kbit/s / 2000 kbit/s).&lt;/div&gt;&lt;/div&gt;</p>
