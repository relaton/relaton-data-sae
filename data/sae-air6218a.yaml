abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) supplements ARP4754B/ED-79B by identifying the crucial elements to be considered when constructing the development assurance plans described in &lt;span class="xref"&gt;Section 3&lt;/span&gt; (Development Assurance Planning) of ARP4754B/ED-79B for integrated systems. Section 4.6.4 of ARP4754B/ED-79B expands the aircraft/system integration and verification activities by emphasizing testing during integration to investigate for unintended behaviors. However, guidelines are needed for planning that are specifically aimed at the aircraft level and at integrating across system functions and boundaries. Until such guidelines are more comprehensively provided, this AIR presents a collection of lessons learned from past certification programs involving integrated systems, and as such it may be considered in conjunction with Sections 3 and 4 of ARP4754B/ED-79B.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;ARP4761A/ED-135 elaborates the safety activities by adding processes and methods such as the Aircraft or System Functional Hazard Assessment (AFHA/SFHA) and Preliminary Aircraft or System Safety Assessment (PASA/PSSA). These safety activities can contribute to the overall plans for the integration phase of development at the aircraft or system level, including the identification of areas that could lead to cascading failures or unintended behaviors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR is not guidance for system integration technologies.&lt;/div&gt;&lt;/div&gt;</p>
