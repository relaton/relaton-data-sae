  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides uniform procedures and minimum performance requirements for fatigue testing pressed steel wheels intended for normal highway use on travel, camping, and boat and light utility trailers drawn by passenger cars and light trucks. For procedures and minimum performance requirements for wheels used on trucks, see SAE J267, and for wheels used on passenger cars, see SAE J328. For the application of passenger car and light truck wheels [inset less than 0.33 ft (0.10 m)] to this trailer service, use this procedure. For the application of heavier truck wheels [inset 0.33 ft (0.10 m) or more] use SAE J267. Mobile home service is outside the scope of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;There are two basic test procedures described, a cornering fatigue test and radial fatigue test. The cornering test is directed at the wheel disc; whereas the radial test also examines the rim and attachment portion of the wheel. Both test procedures are required to obtain a thorough examination of the wheel.&lt;/div&gt;&lt;/div&gt;</p>
