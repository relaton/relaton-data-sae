  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines Minimum Performance Standards (MPS), qualification requirements, and minimum documentation requirements for side-facing seats in civil rotorcraft, transport aircraft, and general aviation aircraft. The goal is to achieve comfort, durability, and occupant protection under normal operational loads and to define test and evaluation criteria to demonstrate occupant protection when a side-facing seat/occupant/restraint system is subjected to statically applied ultimate loads and to dynamic test conditions set forth in Title 14, Code of Federal Regulations (CFR) Part 23, 25, 27, or 29.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While this document addresses system performance, responsibility for the seating system is divided between the seat supplier and the installation applicant. The seat supplier’s responsibility consists of meeting all the seat system performance requirements and obtaining and supplying to the installation applicant all the data prescribed by this document. The installation applicant has the final responsibility in assuring that all requirements for safe seat installation have been met.&lt;/div&gt;&lt;/div&gt;</p>
