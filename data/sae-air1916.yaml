    &lt;div class="htmlview paragraph"&gt;General terms peculiar to aerospace fluid power and control systems are defined in this glossary. Relevant terms have been excerpted from the referenced documents and included herein from the aerospace terms felt to be most useful to the ISO. This is a systems document and the only component-related terms are those significant at the systems level.&lt;/div&gt;&lt;/div&gt;</p>
