  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers various requirements for airport runway plows, ramp plows, wings, and hitches to be used with various carrier vehicles primarily used to cast snow away from airport airside operational areas, such as runways, ramps, and taxiways. It does not apply to plows and hitches for non-airport snow removal equipment such as highway plows or construction/farm machinery.&lt;/div&gt;
    &lt;/div&gt;</p>
