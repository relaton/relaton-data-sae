    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Report (AIR) provides a cross reference for SAE material standards to other similar standards. The SAE Committee G-3 invites comments and recommendations for the addition of materials and information for inclusion into this informational report.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;No attempt has been made to obtain samples of the materials or conduct physical and chemical analyses to determine if they are equivalent. Anyone using this AIR, therefore, is cautioned to verify for themselves the interchangeabillity of the specific materials.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Additional contributions of missing or supplemental data should be directed to SAE marked for the attention of Committee G-3.&lt;/div&gt;&lt;/div&gt;</p>
