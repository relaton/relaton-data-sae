  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers stress relieved annealed electric resistance welded and cold-drawn single-wall high strength low alloy steel tubing intended for use in hydraulic pressure lines and in other applications requiring tubing of a quality suitable for bending, flaring, cold forming, and brazing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The grade of material produced to this specification is of micro-alloy content. Nominal reference working pressures for this tubing are listed in ISO 10763 and SAE J1065.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;CAUTION: Sub-critically annealed steels are often produced using anneal temperatures below the Lower Critical Temperature (AC1) of the given steel to achieve the desired strength levels. Welding, brazing, or other processing methods that subject the tube material or assembly to temperatures near or above AC1 might initiate isothermal transformation of the tube microstructure and compromise the strength of the tube in the heat affected zone by further annealing the tube. Therefore, ISO 10763 and SAE J1065 nominal reference working pressures might not be applicable. It is recommended that the user and the fabricator validate and agree that the tube assembly design and pressure ratings are not compromised beyond system design from these processes. Performance testing as described in SAE J2551-2 will facilitate appropriate test recommendations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Brazed and/or welded tube assembly configurations made to specific geometry and components in association with this material may require qualification testing in accordance with ISO 19879 Test Methods for Hydraulic Fluid Power Connections. Cold forming the tube end connections in place of thermal processes such as brazing and welding avoids this systemic testing by not compromising the structural integrity of the tube material.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In an effort to standardize within a global marketplace and ensure that companies can remain competitive in an international market, it is the intent to convert to metric tube sizes which will:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Lead to one global system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Guide users to preferred system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Reduce complexity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Eliminate inventory duplications&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
