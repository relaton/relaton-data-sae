  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard sets forth the instrumentation and procedure to be used in measuring the exterior sound levels for self-propelled sweepers as defined in SAE J2130 and self-propelled off-road work machines in categories 1, 2, 4, and 5 of SAE J1116.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not address the operation of safety devices such as backup alarms, horns, or accessories. The sound levels obtained by using the test procedures set forth in this document are repeatable and are representative of the higher range of sound levels generated by machines under actual field operating conditions. Due to variability of field operating conditions, this data is not intended to be used for construction site boundary noise evaluations.&lt;/div&gt;&lt;/div&gt;</p>
