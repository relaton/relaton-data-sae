  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;In this document a servovalve is defined only as a valve, normally used in a servomechanism which has a hydraulic output (flow, pressure) which is a function of an electrical input (voltage, current, differential current). This ARP will confine itself to describing those parameters which are peculiar to such valves.&lt;/div&gt;&lt;/div&gt;</p>
