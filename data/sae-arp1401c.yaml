  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers a brief discussion of the icing problem in aircraft fuel systems and the different means that have been used to test for icing. Fuel preparation and icing test procedures for aircraft fuel systems and components are proposed herein as a recommended practice to be used for fixed wing and rotary-wing aircraft within their operational environment. This ARP mostly addresses aircraft fuel system level testing and provides a means to address the requirements of FAR 14 CFR § 23.951(c), § 25.951(c), § 27.951(c), and § 29.951(c). In the context of this ARP, the engine and the auxiliary power unit (APU) are not considered to be components of the aircraft fuel system. However, some of the methods described in this document can be applied to the engine, APU, and other aircraft (system or component level) icing tests.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This revision does not completely address new developments in ice accretion and release resulting from internal flow in tubing (see &lt;span class="xref"&gt;2.3.6&lt;/span&gt;). This will be addressed in a different document when more experimental data is available.&lt;/div&gt;
    &lt;/div&gt;</p>
