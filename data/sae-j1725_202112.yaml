    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The recommendations in this SAE Information Report apply to structural integrity, performance, driveability, and serviceability of personally licensed vehicles not exceeding 10 000 lb GVWR. While many of these recommendations may have application to other vehicles, such as those used in paratransit operations, the contents of this document are not directed at these types of vehicles.&lt;/div&gt;
