    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes dimensions for wheels for demountable rims, demountable rims, and rim spacers. The dimensions given are those necessary to maintain serviceability and interchangeability of the demountable rims, rim spacers, and wheels for demountable rims. Special and less common applications are not covered in this recommended practice.&lt;/div&gt;&lt;/div&gt;</p>
