    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides test procedures, requirements, and equipment recommendations for the methods of the measurement that characterizes potential design failures by utilizing a step stress approach to subject a device under test to thermal, vibration, and electrical stresses of types and levels beyond what it may see in actual use, but which will rapidly induce failure modes, allowing them to be detected and corrected.&lt;/div&gt;&lt;/div&gt;</p>
