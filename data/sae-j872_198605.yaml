  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies a test method to measure the drawbar pull performance of self-propelled construction, forestry, and industrial machines and their combinations with mounted and/or trailed equipment, with or without payload, as listed in SAE J1116.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It covers the following criteria measured against travel speed: drawbar pull, drawbar power, and wheel or track slip.&lt;/div&gt;&lt;/div&gt;</p>
