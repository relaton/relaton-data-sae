  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the mechanical and quality requirements for steel bolts, screws, studs, and sems used in automotive and related industries in sizes to 1½ in, inclusive. This standard does &lt;i&gt;not&lt;/i&gt; include limits for surface discontinuities. Where usage requires such control, limits may be specified separately. For certain type, size, and length of products this may be done by the statement: “Surface discontinuities shall not exceed the limits shown in SAE J123.”&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Previous issues of this standard also covered nuts, now covered separately in SAE J995.&lt;/div&gt;&lt;/div&gt;</p>
