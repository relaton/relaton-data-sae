    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) outlines the design and performance requirements for a battery-powered electric tow tractor for the handling of baggage or cargo trailers in airline service. The use of “shall” in this document indicates a mandatory requirement. The use of “should” indicates a recommendation or that which is advised but not required.&lt;/div&gt;&lt;/div&gt;</p>
