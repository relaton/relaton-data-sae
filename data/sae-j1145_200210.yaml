    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to nomenclature of emissions and emissions reduction apparatus as applied to various engines and vehicles. Modifying adjectives are omitted in some cases for the sake of simplicity. However, it is considered good practice to use such adjectives when they add to clarity and understanding.&lt;/div&gt;
