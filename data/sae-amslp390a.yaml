  content: "<p>This specification covers low, medium, and high density polyethylene and copolymers molding and extrusion material for general purpose use, for use as dielectric material, and for weather-resistant applications (see 6.1).  For the purpose of this specificaiton, the term polyethylene is used when referring to any of the types, classes, grades, and categories.</p>"
