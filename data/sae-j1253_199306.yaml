  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The electrical cranking system components, which include the battery, cables, and cranking motor, must be carefully selected to provide the necessary speed to start an engine under the most severe climatic conditions for which the system is intended. Engine cranking loads increase with cold temperatures, therefore, the initial selection of these components needs to consider low-temperature engine torque requirements. To insure an adequate electrical cranking system is obtained, it is important that proper test procedures are used for obtaining the cranking load requirements of the engine.&lt;/div&gt;&lt;/div&gt;</p>
