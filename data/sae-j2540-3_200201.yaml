abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides a table of textual messages meeting the requirements for expressing the names of street and roads and some basic building blocks for phrases commonly used in the ITS industry. The tables provided herein are taken from SAE J2369, and follow the rules of SAE J2540 and therefore allow a local representation in various different languages, media expressions, etc. to allow true international use of these phrases. The phrases are predominantly intended to provide a means to express street names including pre and post fixes ( North Oak Street is an example name with a prefix “North” and main portion “Oak” and a suffix “Street”). Other phrases exist for other specific specialty areas of ITS, and all such phrases follow a set of encoding and decoding rules outlined in SAE J2540 to ensure that the use of these phrases in messages remain interoperable between disparate types of user equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Implementers are cautioned to obtain the most recent set of tables by means of the ITS data registry, a process which involves the SAE and other standards setting organizations and which is intended to maintain and enhance the level of harmonization between ITS standards set by each of the organizations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document SHALL define the normative index values to be used to provide phrases needed by ITS practitioners when expressing the names of streets using indexed methods. This document SHALL follow the formats and rules established in SAE J2540 in the expressions, manipulations, and use of such tables.&lt;/div&gt;&lt;/div&gt;</p>
