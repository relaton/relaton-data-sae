  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the minimum performance and dimensional requirements for quick connect couplings between flexible tubing or hose and rigid tubing or tubular fittings used in coolant systems. This document applies to automotive and light duty truck applications under the following conditions:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Gasoline, diesel, hybrid, and electrical propulsion cooling systems.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Operating pressure up to 206 kPa (30 psi).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Operating temperatures from -40 °C (-40 °F) to 125 °C (260 °F).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Quick connect couplings function by joining the connector to a mating end form, typically without the use of tools. The requirements stated in this document apply to new connectors in assembly operations unless otherwise indicated.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For modern powertrain applications, the interconnection of the following devices is typically the design responsibility of the cooling group: coolant control valve, water-to-air charge air cooler (CAC), radiator (high and low temperature variants), and remote transmission oil heat exchanger (used for both warming and cooling functions).&lt;/div&gt;&lt;/div&gt;</p>
