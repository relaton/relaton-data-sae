  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to establish guidelines for the measurement of static and dynamic characteristic properties of aircraft tires. It is intended as a general guide toward standard practice, but may be subject to frequent changes to keep pace with experience and technical advances.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This revision (Revision A) is also intended to provide suggested guidelines for synthesizing tire dynamic data necessary for landing gear shimmy analyses.&lt;/div&gt;&lt;/div&gt;</p>
