    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification presents requirements for the heat treatment of parts and components fabricated from wrought (plate, sheet, strip, bar, rod, wire extrusions and tube and forgings) copper alloys, numbers C17000, C17200, C17300, C17500, and C17510 (see 6.7). This specification also covers “bright hardening”.&lt;/div&gt;&lt;/div&gt;</p>
