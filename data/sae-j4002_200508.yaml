  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Standard provides the specifications and procedures for using the H-point machine (HPM&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;) to audit vehicle seating positions. The HPM is a physical tool used to establish key reference points and measurements in a vehicle (see &lt;span class="xref"&gt;Figure 1&lt;/span&gt; and &lt;span class="xref"&gt;Appendix A&lt;/span&gt;). The H-point design tool (HPD) is a simplified CAD&lt;span class="xref"&gt;&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt; version of the HPM, which can be used in conjunction with the HPM to take the optional measurements specified in this document, or used independently during product design (see &lt;span class="xref"&gt;Appendix D&lt;/span&gt;).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These H-point devices provide a method for reliable layout and measurement of occupant seating compartments and/or seats. This document specifies the procedures for using the H-point machine (HPM) to audit (verify) key reference points and measurements in a vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The devices are intended for application at designated seating positions. They are not to be construed as tools that measure or indicate occupant capabilities or comfort. They are not intended for use in defining or assessing temporary seating, such as folding jump seats.&lt;/div&gt;
    &lt;/div&gt;</p>
