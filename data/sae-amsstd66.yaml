  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard, as referenced in the applicable product specifications in procurement documents, contains:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A catalog of the standard carbon steels, alloy steels (including H-steels), and stainless and heat-resisting steels that are designated by chemical composition, or (for H-steels) by chemical composition and hardenability limits by reference to standard industry documents.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Rules for designating the chemical content of carbon steels, alloy steels, and stainless and heat-resisting steels that are not classified as standard.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
