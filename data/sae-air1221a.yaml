abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This checklist is to be used by project personnel to assure that factors required for adequate system electromagnetic compatibility are considered and incorporated into a program. It provides a ready reference of EMC management and documentation requirements for a particular program from preproposal thru acquisition. When considered with individual equipments comprising the system and the electromagnetic operational environment in which the system will operate, the checklist will aid in the preparation of an EMC analysis. The analysis will facilitate the development of system- dependent EMC criteria and detailed system, subsystem, and equipment design requirements ensuring electromagnetic compatibility.&lt;/p&gt;


    &lt;p&gt;It should be noted that all subjects are not covered and that all items listed may not be required on a given program.&lt;/p&gt;</p>
