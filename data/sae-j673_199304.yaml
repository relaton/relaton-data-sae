    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to cover current safety glazing practice applicable to safety glasses for use in motor vehicles and motor vehicle equipment. Nominal specifications for thickness, flatness, curvature, size, and fabrication details are included principally for the guidance of body engineers and designers. For additional information on safety glazing materials for use in motor vehicles and motor vehicle equipment, see SAE J674.&lt;/div&gt;&lt;/div&gt;</p>
