  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the location of both driver and passenger heads inside a vehicle for the purpose of describing spatial requirements. Driver lateral head position includes head movement looking to the left and right while driving. Elliptical (head position contour) models in both two and three dimensions are used to represent 95th and 99th percentiles of driver and passenger head locations. This document describes two different procedures for locating driver head position contours, depending on whether or not the driver workspace is like that found in a passenger car or a heavy truck. The need for two different procedures has led to a vehicle classification scheme which labels vehicles as either Class A (passenger cars) or Class B (heavy trucks) according to definitions given in SAE J1100 APR97.&lt;/div&gt;
    &lt;/div&gt;</p>
