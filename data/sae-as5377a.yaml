  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for self-locking wrenchable nuts with thread sizes 0.7500 thru 1.5000 inches.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The nuts are made of corrosion and heat resistant precipitation hardenable iron base alloy of the type identified under the Unified Numbering System as UNS S66286 and of 160,000 psi axial tensile strength at room temperature, with maximum conditioning temperature of parts at 800 °F.&lt;/div&gt;&lt;/div&gt;</p>
