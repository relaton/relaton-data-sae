  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the power mode requirements for in-vehicle networks that conform to the Automotive Multimedia Interface Collaboration (AMI-C) specifications. These networks include, but are not limited to, the IDB-C (SAE J2366), IDB-1394, and MOST.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This version of the document covers primarily IDB-C and may be revised when the PMODE requirements for the other networks are more fully developed by AMI-C.&lt;/div&gt;&lt;/div&gt;</p>
