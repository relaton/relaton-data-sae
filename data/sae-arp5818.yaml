    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is a guideline for the design of an Aviation Aircraft Refueling and Defueling Tanker Vehicle and for the materials and components used thereon. The criteria set forth herein are the minimum recommendations and are limited to aircraft refueling vehicles for airport operations with operating fuel pressures and flow rates as specified within this document.&lt;/div&gt;&lt;/div&gt;</p>
