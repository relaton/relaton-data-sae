  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice identifies and defines requirements relating to the safe integration of the fuel cell system, the hydrogen fuel storage and handling systems (as defined and specified in SAE J2579) and high voltage electrical systems into the overall Fuel Cell Vehicle. The document may also be applied to hydrogen vehicles with internal combustion engines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document relates to the overall design, construction, operation and maintenance of fuel cell vehicles.&lt;/div&gt;

    &lt;/div&gt;</p>
