  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to motor vehicle signaling and marking devices which use light generated by a discharge source. This document provides test methods, requirements, and guidelines applicable to the unique characteristics of discharge lighting systems and their components. These are in addition to those required for signal and marking devices. This document is intended to be a guide to standard practice and is subject to change to reflect additional experience and technical advances.&lt;/div&gt;&lt;/div&gt;</p>
