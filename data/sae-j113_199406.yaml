  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the mechanical and chemical requirements of hard-drawn carbon-steel spring wire in two classes used for the manufacture of mechanical springs and wire forms generally employed for applications subject to static loads or infrequent stress repetitions. Class 2 is a higher tensile strength product. This specification also covers processing requirements of the springs and forms fabricated from this wire.&lt;/div&gt;&lt;/div&gt;</p>
