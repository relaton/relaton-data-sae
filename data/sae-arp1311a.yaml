  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) applies to landing gear structures and mechanisms (excluding wheels, tires, and brakes) for all types and models of civil and military aircraft applications. All axles, wheel forks, axle beams, links, arms, mechanical and air-oil energy absorbers braces, lock assemblies, trunnion beams, etc., that sustain loads originating at the ground, and that are not integral parts of the airframe structure should be designed in accordance with this document. Hydraulic actuators (retraction, steering, positioning, and/or damping) should also be included in this coverage.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It should be the responsibility of the airframe manufacturer to determine the compatibility of these needs with the aircraft and to specify requirements in excess of these minima where appropriate.&lt;/div&gt;
    &lt;/div&gt;</p>
