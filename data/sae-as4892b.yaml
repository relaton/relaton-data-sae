    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procurement specification covers inserts made from A286 alloy of the type identified under the Unified Numbering System as UNS S66286 which have self-locking internal threads and integrated locking keys to positively secure the insert against rotation when properly installed in threaded holes.&lt;/div&gt;&lt;/div&gt;</p>
