  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidance for substantiating the airworthiness of aircraft engine components. Generally these components are associated with the engine control system, the system or systems that allow the engine to provide thrust or power as demanded by the pilot of the aircraft while also ensuring the engine operates within acceptable operating limits. But these components may also include hardware and systems associated with engine lubrication, engine or aircraft hydraulic or electrical systems, aircraft environmental control systems, thrust reverser control, or similar aircraft or engine propulsion system functions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This paper develops the concept of using a 26 item matrix of environmental conditions for evaluating aircraft engine component airworthiness. This approach is compatible with current practices used in the industry and has been accepted by engine certification authorities as part of engine certification programs.&lt;/div&gt;

    &lt;/div&gt;</p>
