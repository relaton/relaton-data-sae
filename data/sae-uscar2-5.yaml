  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Procedures included within this specification are intended to cover performance testing at all phases of development, production, and field analysis of electrical terminals, connectors, and components that constitute the electrical connection systems in low voltage (0 - 20 VDC) road vehicle applications. These procedures are only applicable to terminals used for In-Line, Header, and Device Connector systems with and without Shorting Bars. They are not applicable to Edge Board connector systems, twist lock connector systems, &amp;gt; 20 VAC or DC, or to eyelet type terminals.&lt;/div&gt;

    &lt;/div&gt;</p>
