  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The AS81824 specification covers environment resistant, permanent crimp type, splices having heat shrinkable insulating sleeve and meltable environmental seals or heatless sealing sleeves. The splices may be used with tin, nickel, and silver-plated conductors in applications where the total temperature of the splice application does not exceed 200 °C or as specified in the detail specification.&lt;/div&gt;
    &lt;/div&gt;</p>
