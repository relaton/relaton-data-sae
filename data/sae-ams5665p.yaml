    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion and heat resistant nickel alloy in the form of round bars over 2.50 to 4.50 inches (over 63.5 to 114.3 mm), inclusive, in nominal diameter, forgings over 2.50 inches (63.5 mm) in nominal thickness, other bars and forgings, flash welded rings, and stock for forging or flash welded rings (see &lt;span class="xref"&gt;8.6&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
