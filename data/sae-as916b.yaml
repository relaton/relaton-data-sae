    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines the overall requirements applicable to oxygen flow indicating devices intended to operate in conjunction with an oxygen regulator and mask system. Flow indicators covered by this document are for use with pressure demand, diluter-demand and continuous flow oxygen systems.&lt;/div&gt;&lt;/div&gt;</p>
