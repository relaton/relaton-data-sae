  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice (RP) document applies to Heavy Vehicle Event Data Recorders (HVEDR) for heavy-duty (HD) ground wheeled vehicles over 4545 kg (10 000 US pounds), commonly referred to as Class 3–8, which are intended to be compliant with current Federal Motor Vehicle Safety Standards (FMVSS) and/or Federal Motor Carrier Safety Regulations (FMCSR). In the context of the J2728 RP, the term &lt;i&gt;&lt;u&gt;heavy vehicle&lt;/u&gt;&lt;/i&gt; refers to motor vehicles equipped with one or both of the following vehicle communication networks: SAE J1708/J1587 or SAE J1939. This document is focused primarily on wheeled vehicles with standard on-board power supplies (e.g., batteries). It is intended to address the needs of OEM original, OEM modified/additive, and aftermarket systems. It does not specifically exclude trailers and similar non-engine powered vehicles, even though the current lack of standardized methodologies and processes for inter-vehicular communication and power supply interconnections remain unresolved.&lt;/div&gt;
    &lt;/div&gt;</p>
