abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Since cargo restraint devices made with textiles should have a predictable service life, there should be data available so that predictions can be made. This document compiles available information on textiles of the types used in air cargo restraint devices and reviews the degradation characteristics of each.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Textiles are used primarily in cargo restraint nets on air cargo pallets and nonstructural containers, restraint nets installed in cargo aircraft, and similar applications.&lt;/div&gt;&lt;/div&gt;</p>
