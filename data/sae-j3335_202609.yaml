abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides a recommended test guideline for secondary sodium-ion cells used for propulsion of electric vehicles including battery electric vehicles (BEV), hybrid electric vehicles (HEV), and other similar propulsion applications (e.g., forklift trucks).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The objective of this document is to define common test procedures covering electrical performance, mechanical safety performance, thermal safety performance, and electrical safety performance. The results of these procedures can be used for comparative purposes. Requirements for pass/fail criteria are not defined in this document but are to be defined by the users of the document.&lt;/div&gt;&lt;/div&gt;</p>
