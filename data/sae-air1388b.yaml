  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is intended to assist in evaluating the serviceability of damaged hydraulic tubing lines. The performance requirements are outlined to which the defect samples were tested. Test methods and data are described and summarized. Permissible defect limits are listed for 6061-T6 aluminum return lines, 3000 psi hydraulic tubing of 21Cr-6Ni-9Mn SS, 304 1/8 hard, corrosion resistant steel (CRES), as well as 3Al-2.5V CWRS and 3Al-2.5V annealed, seamless titanium tubing. All dimensions are in inches unless otherwise noted.&lt;/div&gt;&lt;/div&gt;</p>
