  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document facilitates clear and consistent comparisons of realistic charging capabilities of passenger vehicles via commercially available DC EVSE. Common test procedures and metrics are established for both vehicles and EVSEs operating without limitations in nominal conditions. This document does not attempt to address performance variations of EV-EVSE interactions outside of nominal conditions such as extreme temperatures, variable SOCs, and so on.&lt;/div&gt;&lt;/div&gt;</p>
