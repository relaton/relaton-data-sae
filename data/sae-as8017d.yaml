  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes minimum performance standards for new equipment anticollision light systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard defines minimum light intensity in terms of "effective intensity" as defined in paragraph &lt;span class="xref"&gt;3.5&lt;/span&gt; of this standard and specified vertical and horizontal directions about the longitudinal and vertical axis of the airplane. It will also define flash rate and color for the anticollision light system. It is not intended that this standard require the use of any particular light source such as Xenon, LED or any other specific design of lamp.&lt;/div&gt;

    &lt;/div&gt;</p>
