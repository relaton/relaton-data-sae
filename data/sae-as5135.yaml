    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) describes the characteristics of a desiccant port installed through the flat wall of a shipping and storage container. With the cover removed, the desiccant port shall provide access to the interior of the container for installation and removal of desiccant.&lt;/div&gt;&lt;/div&gt;</p>
