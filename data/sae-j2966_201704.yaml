  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document outlines general requirements for the use of CFD methods for aerodynamic simulation of medium and heavy commercial ground vehicles weighing more than 10 000lbs. The document provides guidance for aerodynamic simulation with CFD methods to support current vehicle characterization, vehicle development, vehicle concept development and vehicle component development. The guidelines presented in the document are related to Navier-Stokes and Lattice-Boltzmann based solvers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is only valid for the classes of CFD methods and applications mentioned. Other classes of methods and applications may or may not be appropriate to simulate the aerodynamics of medium and heavy commercial ground vehicle weighing more than 10 000lbs.&lt;/div&gt;

    &lt;/div&gt;</p>
