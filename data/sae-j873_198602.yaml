    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies a test method to measure drag loss of self-propelled, as well as towed, construction, forestry and industrial machines, with or without payload, as listed in SAE J1057 and J1116.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Drag force is measured as a function of travel speed.&lt;/div&gt;&lt;/div&gt;</p>
