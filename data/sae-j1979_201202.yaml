    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1979 / ISO 15031-5 set includes the communication between the vehicle's OBD systems and test equipment implemented across vehicles within the scope of the legislated emissions-related OBD.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;To achieve this, it is based on the Open Systems Interconnection (OSI) Basic Reference Model in accordance with ISO/IEC 7498-1 and ISO/IEC 10731, which structures communication systems into seven layers. When mapped on this model, the services specified are broken into:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Diagnostic services (layer 7), specified in:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 15031-5/SAE J1979 (emissions-related OBD),&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 27145-3 (WWH-OBD),&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Presentation layer (layer 6), specified in:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 15031-2, SAE J1930-DA,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 15031-5, SAE J1979-DA,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 15031-6, SAE J2012-DA,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 27145-2, SAE J2012-DA,&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Session layer services (layer 5), specified in:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 14229-2 supports ISO 15765-4 DoCAN and ISO 14230-4 DoK-Line protocols,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 14229-2 is not applicable to the SAE J1850 and ISO 9141-2 protocols,&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Transport layer services (layer 4), specified in:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;DoCAN: ISO 15765-2 Transport protocol and network layer services,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1850: ISO 15031-5/SAE J1979 Emissions-related diagnostic services,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 9141-2: ISO 15031-5/SAE J1979 Emissions-related diagnostic services,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;DoK-Line: ISO 14230-4, ISO 15031-5/SAE J1979 Emissions-related diagnostic services,&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Network layer services (layer 3), specified in:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;DoCAN: ISO 15765-2 Transport protocol and network layer services,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1850: ISO 15031-5/SAE J1979 Emissions-related diagnostic services,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 9141-2: ISO 15031-5/SAE J1979 Emissions-related diagnostic services,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;DoK-Line: ISO 14230-4, ISO 15031-5/SAE J1979 Emissions-related diagnostic services,&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Data link layer (layer 2), specified in:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;DoCAN: ISO 15765-4, ISO 11898-1, -2,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1850,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 9141-2,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;DoK-Line: ISO 14230-2,&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Physical layer (layer 1), specified in:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;DoCAN: ISO 15765-4, ISO 11898-1, -2,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1850,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 9141-2,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;DoK-Line: ISO 14230-1,&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;in accordance with &lt;span class="xref"&gt;Table 1&lt;/span&gt;&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;SAE document reference concept&lt;/b&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 15031 references several SAE documents which contain all terms, data and DTC definitions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;See &lt;span class="xref"&gt;Figure 1&lt;/span&gt; - SAE Digital Annex document reference with the following definition of content in ISO 15031 parts:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1930: the document is concerned with a procedure for naming objects and systems and with the set of words from which names are built. It references SAE J1930-DA which contains all standardized naming objects, terms and abbreviations.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1979: the document is concerned with the definition of emissions-related diagnostic services (diagnostic test modes). It references SAE J1979-DA which contains all standardized data items like PIDs, Test Ids, Monitor IDs and InfoType IDs.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J2012: the document is concerned with the procedure for defining emissions-related diagnostic trouble codes. It references SAE J2012-DA which contains all standardized data items like DTCs and FTBs.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;

    &lt;div class="htmlview paragraph"&gt;On-Board Diagnostic (OBD) regulations require passenger cars, and light, medium and heavy duty trucks, to support a minimum set of diagnostic information to external (off-board) “generic” test equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;SAE J1979-DA (Digital Annex)&lt;/b&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This part of ISO 15031 references the SAE J1979-DA. The SAE J1979-DA is concerned with the definition of:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Parameter Identifiers (PIDs),&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Test Identifiers (TIDs),&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;OBD Monitor Identifiers (OBDMIDs),&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Unit and Scaling Identifiers (UASIDs), and&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;—&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Info Types (INFOTYPEs);&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;SAE Digital Annex revision procedure&lt;/b&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;New emissions-related regulatory requirements drive new in-vehicle technology to lower emissions. New technology related OBD monitor data and diagnostic trouble codes need to be standardized to support the external (off-board) “generic” test equipment. All relevant information is proposed by the automotive industry represented by members of the appropriate SAE task force.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;ISO 15031-5/SAE J1979 references a "Change Request Form" to be used for new data items to be defined by the SAE task force for standardization. The standardized data items will be defined in the SAE J1979-DA. Once the information has been balloted and approved, the documents will be published on the SAE Store Web Site.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The revision request form and instructions for updating ISO 15031 Part 5 / SAE J1979 can be obtained on the Registration Authority's web site at:&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;a href="http://www.sae.org/servlets/works/committeehome.do?comtid=tevds14" target="_blank"&gt;http://www.sae.org/servlets/works/committeeHome.do?comtID=TEVDS14&lt;/a&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The column titled "Resources" shows a document with the title: J1979-DA_Revision_Request_Form.doc. Double click on the name and you will be asked to download the document with the filename:&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE_J1979-DA_Revision_Request_Form.doc&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Fill out the revision request form with your request.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Please send e-mail with completed revision request form as attachment to:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE Automotive Headquarters&lt;/div&gt;
