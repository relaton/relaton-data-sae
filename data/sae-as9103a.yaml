abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is primarily intended to apply to new parts and products, but can also be applied to parts currently in production. The standard shall be applicable to all production processes, that influence the variation of KCs, as well as maintenance processes in which KCs are identified. It applies to assemblies and all levels of parts within an assembly, down to the basic materials including castings and forgings, and to organizations that are responsible for producing the design characteristics of the product.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It does not apply to lab-scale, pilot, or pre-production processes. However, particular management of some KCs might be required using other methods than those described in the standard, during these phases of a program, when required by the customer or deemed appropriate by the organization (e.g., Engineering department requirement).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The variation control process begins with product definition, typically an engineering drawing or specification which identifies KCs, and leads to a variation management program for those KCs. This process may also be used for producer-identified KCs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Producers and their subcontractors shall be responsible for flow down of the requirements of the applicable revision of this standard to subcontractors, who produce design characteristics, and for ensuring that KCs conform to customer requirements.&lt;/div&gt;

    &lt;/div&gt;</p>
