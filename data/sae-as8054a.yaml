  content: "<p>This SAE Aerospace Standard (AS) provides guidelines for the  functional, performance, qualification and acceptance testing, and documentation requirements for the components of an airborne engine vibration monitoring (EVM) system which is intended for use as a turbojet engine rotor unbalance indicating system, per FAR 25.1305 (D)(3) on transport category airplanes.</p>"
