  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) presents and discusses the results of tests of three models in six icing wind tunnels in North America and Europe. This testing activity was initiated by the Facility Standardization Panel of the SAE AC-9C Aircraft Icing Technology Subcommittee. The objective of the testing activity was to establish a benchmark that compared ice shapes produced by icing wind tunnels available for use by the aviation industry and to use that benchmark as a basis for dialogue between facility owners to improve the state-of-the-art of icing wind tunnel technology.&lt;/div&gt;
    &lt;/div&gt;</p>
