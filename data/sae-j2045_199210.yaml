  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard encompasses the minimum functional requirements for fuel tubing and nonmetallic and nonrubber hose assemblies to be used in gasoline fuel injection systems. It utilizes information from the tubing standard SAE J2043, fittings and connectors SAE J2044, and protective covers SAE J2027. It is not intended to cover assemblies that operate below 30 °C (-22 °F) or above 115 °C (239 °F). In addition, this document is applicable for gasoline F.I. systems up to 5 bar (approximately 75 psig) operating pressure. It should be noted that temperatures can affect assemblies in various manners and every effort must be made to determine the operating temperature to which a specific assembly will be exposed, and design accordingly.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not make recommendations as to which assemblies are appropriate for different ranges of operating temperatures. The SAE specifications J2027, J2043, and J2044 for tubings, connectors, and protective covering should be referenced when designing any assembly.&lt;/div&gt;&lt;/div&gt;</p>
