    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this SAE Aerospace Information Report (AIR) is to summarize and review the E34 committee’s efforts to educate the aerospace propulsion lubrication community on the science of micropitting, its consequences, and the various tribology evaluation methods that can be employed under aviation related conditions to differentiate formulation related aggravating factors.&lt;/div&gt;&lt;/div&gt;</p>
