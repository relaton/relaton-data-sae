    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The specification covers the requirements for locked-in studs. The method of locking in the stud is by means of a serrated collar and an accessory lockring with matching serrations installed within the parent material to prevent rotation.&lt;/div&gt;&lt;/div&gt;</p>
