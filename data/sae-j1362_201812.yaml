    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1362 presents graphical symbols for use on operator controls and other displays on off-road work machines as defined in SAE J1116 plus mobile cranes but excluding agricultural tractors. Symbols for agricultural tractors are covered by ASABE S304, ISO 3767-1, and ISO 3767-2.&lt;/div&gt;&lt;/div&gt;</p>
