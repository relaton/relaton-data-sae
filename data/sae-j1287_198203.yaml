    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the test procedure, environment, and instrumentation for determining the sound levels of motorcycles under stationary conditions. This test will measure primarily exhaust noise, but does not represent the best procedure for evaluating total vehicle noise. For this purpose, SAE Recommended Practice J331a, Sound Levels for Motorcycles, or SAE Recommended Practice J47, Maximum Sound Level Potential for Motorcycles, are recommended.&lt;/div&gt;&lt;/div&gt;</p>
