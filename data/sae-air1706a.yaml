abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Many different computer programs have been developed to determine performance capabilities of aircraft environmental control systems, and to calculate size and weight tradeoffs during preliminary design. Many of these computer programs are limited in scope to a particular arrangement of components for a specific application. General techniques, providing flexibility to handle varied types of ECS configurations and different requirements (i.e., during conceptual or preliminary design, development, testing, production, and operation) are designated "company proprietary" and are not available for industry-wide use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document describes capabilities, limitations, and potentials of a particular computer program which provides a general ECS analysis capability, and is available for use in industry. This program, names AECS&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;, was developed under the sponsorship of the U.S. Air Force Flight Dynamics Laboratory (References 1 and 2).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The basic operating modes and organizations of the program are described. Methods of problem definition, data inputs and outputs, control options, and computer system are discussed. The program's key capabilities and limitations, and recommendations for future improvements in AECS to facilitate its use as an industry-wide acceptable method for analysis, are also discussed.&lt;/div&gt;&lt;/div&gt;</p>
