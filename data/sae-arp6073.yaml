  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to webbing used on occupant restraint systems in service on 14 CFR/CS part 23, part 25, part 27, and part 29 aircraft applications. The guidelines presented within this document are intended to be supplemental to the requirements supplied by the OEM in the CMM, ICA, or like document. In cases of conflict between this ARP and the OEM’s requirements, the requirements of the OEM shall be followed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The objective of this document is to establish practical guidelines to help operators in the determining if restraint webbing has reached the end of its service life. The recommendations contained herein are based on test data from in service restraint systems and the continued airworthiness guidelines recommended by restraint system OEMs.&lt;/div&gt;&lt;/div&gt;</p>
