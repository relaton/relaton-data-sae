    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established manufacturing tolerances applicable to corrosion and heat resistant steel, iron alloy, titanium, and titanium alloy bars and wire. These tolerances apply to all conditions unless otherwise noted. The term "excl" is used to apply only to the higher figure of the specified range.&lt;/div&gt;&lt;/div&gt;</p>
