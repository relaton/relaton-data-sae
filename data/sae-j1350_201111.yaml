    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This information report covers fuel fired pre-heaters which burn gasoline, diesel, or propane fuels. This type of heater must be used in remote areas where 110/220 V, 60 Hz electric power is not available, and is recommended anywhere an on-board self contained system is required. The guidelines in this report are applicable, but not limited to, fuel burning heater installations on the off-road self-propelled work machines described in SAE J1116.&lt;/div&gt;
    &lt;/div&gt;</p>
