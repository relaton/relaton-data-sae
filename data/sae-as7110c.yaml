    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for suppliers of Welding/Brazing Services to be accredited by Nadcap. These requirements may be supplemented by additional requirements specified by Nadcap Welding Task Group. Using the audit checklist (AC7110) will ensure that accredited Welding/Brazing suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;&lt;/div&gt;</p>
