  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers an alternate gland design for the installation of scraper/wiper rings in the lower end of landing gear shock struts for the purpose of contaminant exclusion.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The defined scraper gland covered by this document, as shown in &lt;span class="xref"&gt;Table 1&lt;/span&gt;, is a variant of MIL-G-5514, the accepted gland standard for MS28775. Piston diameters, gland internal diameters, and the groove sidewall angles and surface finish are defined by MIL-G-5514, but the gland outer retaining wall diameter is changed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;AS4088 is similar to this document, but was developed by SAE A-6 for flight control and general purpose cylinders. It differs from this document primarily by the clearance between the rod (piston) and outer gland wall. Since landing gears are more susceptible to dirt contamination, the additional clearance provides a larger path to allow excessive dirt accumulation to exit the gland.&lt;/div&gt;
    &lt;/div&gt;</p>
