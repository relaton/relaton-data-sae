abstract:
- language: en
  script: Latn
  content: |-
    <p>This document applies to all hydraulic excavators and backhoes that are either crawler mounted or rubber tire mounted, with or without outrigger members, identified in SAE J1116 as earthmoving machines and defined in SAE J/ISO 6165.

    Purpose
    This document is to provide a uniform method of determining digging forces for hydraulic excavators and backhoes.</p>
