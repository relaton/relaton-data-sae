    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) describes a class of digital computer programs for use by organizations other than the engine supplier for reduction of engine test data relating to the interface of the engine in the airframe or test facility. This ARP also is intended as a guide for the preparation of such computer programs.&lt;/div&gt;&lt;/div&gt;</p>
