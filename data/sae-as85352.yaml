  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a direct reading, remote control, pneumatic pressure inflator assembly, for use on aircraft tires and struts having pneumatic pressure requirements up to 600 psi. It includes pressure relief provisions to provide for safe inflation. Also included are dual chuck stem gages for measuring tire pressure.&lt;/div&gt;&lt;/div&gt;</p>
