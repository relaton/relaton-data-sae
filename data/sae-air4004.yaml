  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Recent field experience has indicated significant problems with some types of wire and cable as routed on aircraft landing gear. This Aerospace Information Report (AIR) is intended to identify environmental concerns the designer must consider, materials that appear to be most suitable for use in these areas, routing, clamping, and other protection techniques that are appropriate in these applications.&lt;/div&gt;&lt;/div&gt;</p>
