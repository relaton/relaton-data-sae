    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes the basic recommendations for the following two types of configuration for securing cargo to aircraft passenger seats on transport category aircraft:&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;It is emphasized that the two types of restraint shown are merely examples of methods currently used and does not imply that alternative methods are not acceptable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For the purposes of this document, the minimum essential criteria are identified by the use of the key word "shall," Recommended criteria are identified by the use of the key word "should," and while not mandatory are considered to be of significant importance in providing safe, economical, and practical means of cargo restraint. Deviation from recommended criteria should occur only after careful consideration, extensive testing, and thorough service evaluation have shown alternative methods to be satisfactory.&lt;/div&gt;

    &lt;/div&gt;</p>
