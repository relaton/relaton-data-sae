    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard contains recommended test methods for snap-in tubeless tire valves intended for, but not limited to, highway applications. A snap-in valve is a tire valve having a rigid housing adhered to a resilient body designed to retain and seal the valve in the rim hole.&lt;/div&gt;&lt;/div&gt;</p>
