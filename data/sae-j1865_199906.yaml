  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines a clearance line for establishing dimensional compatibility between drum brakes and wheels with 19.5 in, 22.5 in, and 24.5 in diameter rims. The clearance line establishes the maximum envelope for brakes and minimum envelope for complete wheels to allow for interchangeability.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document addresses the dimensional characteristics only, and makes no reference to the performance, operational dynamic deflections, or heat dissipation of the system. Valve clearances have not been included in the fitment lines. Bent valves may be required to clear brake drums. Mounting systems as noted are referenced in SAE J694.&lt;/div&gt;&lt;/div&gt;</p>
