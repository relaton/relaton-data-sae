  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE data file format for exchanging controlled periodic overload data. The object of this SAE Standard is to provide a simple, common methodology for exchanging the data from periodic overload fatigue tests. These tests consist of a single large fatigue cycle followed by a larger number of smaller cycles. The overloads are fully reversed fatigue cycles while the smaller cycles share a common mean and amplitude.&lt;/div&gt;&lt;/div&gt;</p>
