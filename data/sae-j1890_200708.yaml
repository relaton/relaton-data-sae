    &lt;div class="htmlview paragraph"&gt;In order to insure that the remanufactured and/or rebuilt steering gear has and maintains the reliability and performance associated with a new OEM steering gear, it is essential that the following procedures be followed; if in-house engineering capabilities are limited, it may be necessary to consult with an outside laboratory to insure all testing methods used meet with the requirements outlined in this paper.&lt;/div&gt;&lt;/div&gt;</p>
