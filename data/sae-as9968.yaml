  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AS describes a standard method for viscosity measurements of thickened (AMS1428) anti-icing fluids.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Fluid manufacturers may publish alternate methods for their fluids. In case of conflicting results between the two methods, the manufacturer method takes precedence.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;To compare viscosities, exactly the same measurement elements (including spindle and container size) must have been used to obtain those viscosities.&lt;/div&gt;
    &lt;/div&gt;</p>
