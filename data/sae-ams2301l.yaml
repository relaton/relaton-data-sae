    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers steel cleanliness requirements in inch/pound units for aircraft-quality ferro-magnetic steels, other than hardenable corrosion resistant steels (refer to AMS2303), by magnetic particle inspection methods. This specification contains sampling, specimen preparation, inspection procedures and cleanliness rating criteria (see &lt;span class="xref"&gt;8.5&lt;/span&gt;).&lt;/div&gt;
    &lt;/div&gt;</p>
