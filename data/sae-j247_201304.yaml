  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide guidelines for selection of transducers, data acquisition systems, and other instrumentation as well as analysis methods to help ensure proper measurement and evaluation of acoustic impulses in automobiles. While this Recommended Practice focuses on automotive inflatable devices, such as, frontal airbag systems, pretensioners, inflatable curtains, side airbags, etc., it can be used for measurement of other impulsive sounds in a vehicle if needed. The objective is to achieve uniformity in instrumentation practice and reporting of test measurements. Use of this recommended practice should provide a basis for meaningful comparisons of test results from different sources. This recommended practice specifies procedures for static measurement of acoustic impulses, but due to the much more complicated nature of crash testing, does not specify procedures for measuring impulses in vehicles during crash tests.&lt;/div&gt;&lt;/div&gt;</p>
