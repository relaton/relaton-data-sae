    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The report presents air conditioning data for aircraft cargo which is affected by temperature, humidity, ventilation rate and atmospheric pressure. The major emphasis is on conditioning of perishable products and warm-blooded animals. The report also covers topics peculiar to cargo aircraft or which are related to the handling of cargo.&lt;/div&gt;&lt;/div&gt;</p>
