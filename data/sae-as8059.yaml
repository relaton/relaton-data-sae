  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) applies to a personal, portable oxygen concentrator (POC) to be supplied and used by a passenger requiring supplemental oxygen therapy while traveling on board civil, commercial, or personal aircraft. It covers a POC during both self-powered battery operation and while powered from an aircraft seat’s electrical power through the use of an accessory adapter. The POC is not intended to be connected to the aircraft’s oxygen systems or to be used by any aircraft personnel in any method of treatment or first aid of the general flying public.&lt;/div&gt;

    &lt;/div&gt;</p>
