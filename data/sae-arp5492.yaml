  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides recommendations for aircraft manufacturers and operating carriers about how to establish common information for the use of cargo systems with missing/inoperative restraints. Because of the fact that the certified restriction requirements due to missing/inoperative restraints are dependent of the specific aircraft structure and the system layout of the cargo loading system, this document shall only recommend common layout of information for the users based on the certified data provided to allow for common training, understanding and handling. This shall be used right from the beginning for future aircraft types for certified data.&lt;/div&gt;&lt;/div&gt;</p>
