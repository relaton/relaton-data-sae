    &lt;div class="htmlview paragraph"&gt;This specification covers standard chemical check (product or verification) analysis limits as established by AMS or AISI usage. The chemical check analysis limits shown herein shall apply when this specification is referenced in the material specification. Check analysis limits for elements or for ranges of elements not listed herein shall be as specified in the applicable material specification or as agreed upon by purchaser and vendor.&lt;/div&gt;&lt;/div&gt;</p>
