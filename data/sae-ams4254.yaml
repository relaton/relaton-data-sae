  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers aluminum alloy sheet laminated with one or more layers of unidirectional aramid fiber/epoxy prepreg. The outer layers are always aluminum alloy and, when specified, one or both shall be one side alclad with the cladding on the exposed or outside surface.&lt;/div&gt;&lt;/div&gt;</p>
