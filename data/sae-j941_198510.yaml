  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes two dimensional Eyellipses representative of 90th, 95th and 99th percentile distributions of driver eye locations for use in passenger cars, trucks, buses and multipurpose passenger vehicles. New information obtained from the SAE Truck Driver Anthropometric and Workspace Study has resulted in development of new eye location procedures for trucks and other vehicles with high H-point heights and large steering wheel diameters. Therefore, this practice has been separated into two parts. Part I describes the eye location procedure for vehicles with H-point heights (H30) and steering wheel diameters (W9) less than 405mm and 450mm, respectively, which includes passenger cars, vans and light trucks (Class A Vehicles). Part I is currently under revision based on information obtained from new driver eye location studies. Part II describes a separate eye locating procedure for vehicles with H-point heights (H30) between 405 and 530mm and steering wheel diameters (W9) between 450 and 560mm (Class B Vehicles). See &lt;span class="xref"&gt;Fig. 7&lt;/span&gt;. This class of vehicles includes heavy trucks and some buses and multipurpose passenger vehicles.&lt;/div&gt;&lt;/div&gt;</p>
