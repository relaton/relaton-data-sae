  content: |-
    <p>&lt;p&gt;This set of Abstract Syntax Notation (ASN.1) modules contains the precise definitions of data structures used in the SAE J3287 standard. Using the ASN.1 specification, a compiler tool can produce libraries that enable software applications to use the data structures and produce corresponding encodings using the Octet Encoding Rules (OER). For further information see the body of SAE J3287.&lt;/p&gt;
