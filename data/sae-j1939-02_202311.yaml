abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Recommended Practice specifies the requirements for application of SAE J1939 in agricultural and forestry equipment. This document specifies the series of documents within the set of SAE J1939 documents that are applicable to agricultural and forestry equipment and provides further requirements for this industry.&lt;/p&gt;


    &lt;p&gt;The SAE and ISO groups have cooperated to define agricultural and forestry networks in a manner to allow compatibility of ECUs and messaging protocols between agricultural and forestry ISO 11783 networks and truck and bus SAE J1939 networks.&lt;/p&gt;</p>
