  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform procedures for testing electric battery-powered vehicles which are capable of being operated on public and private roads. The procedure addresses electric vehicles (EVs) only. It is the intent of this document to provide standard tests which will allow for determination of energy consumption and range based on the Federal Emission Test Procedure using the Urban Dynamometer Driving Schedule (UDDS) and the Highway Fuel Economy Driving Schedule (HFEDS). Realistic alternatives should be allowed for new technology. Evaluations are based on the total vehicle system's performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Dynamometer test procedures are specified in this document in order to minimize the test-to-test variations inherent with track testing, and to adhere to standard industry practice for energy consumption and range testing.&lt;/div&gt;&lt;/div&gt;</p>
