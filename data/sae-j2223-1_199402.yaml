    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Draft Technical Report specifies dimensional characteristics of flat blades of single-pole connectors and specific requirements for on-board electrical harnesses of road vehicles, which can be fitted into female connectors such as those given as in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to connectors designed to be disconnected after mounting in the vehicle in the case of repair and/or maintenance only.&lt;/div&gt;&lt;/div&gt;</p>
