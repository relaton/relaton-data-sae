  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides guidelines to document the functional and physical interface requirements for the electrical systems (including an EPCS and its components) between a given propulsion system and the aircraft on which the system is installed and the functionality pertinent to each interface.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The scope includes civilian aircraft powered by turbofan, turboprop, and turboshaft engines equipped with electronic engine controls.&lt;/div&gt;&lt;/div&gt;</p>
