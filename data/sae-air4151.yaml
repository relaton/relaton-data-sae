    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) covers basic aircraft engine start systems fundamentals. It presents various ground power sources and aircraft “on board” starting units. Also included are descriptions of start system components and interconnections which together comprise an engine starting system.&lt;/div&gt;&lt;/div&gt;</p>
