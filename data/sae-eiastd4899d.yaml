abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This document applies to the development of Plans for integrating and managing electronic components in equipment for the military and commercial aerospace markets, as well as other ADHP markets that wish to use this document.&lt;/p&gt;


    &lt;p&gt;Examples of electronic components described in this document include resistors, capacitors, diodes, integrated circuits, hybrids, application specific integrated circuits, wound components, and relays.&lt;/p&gt;


    &lt;p&gt;It is critical for the Plan owner to review and understand the design, materials, configuration control, and qualification methods of all “as-received” electronic components and their capabilities with respect to the application; and to identify risks and, where necessary, take additional action to mitigate the risks.&lt;/p&gt;


    &lt;p&gt;The technical requirements are in Section 3 of this standard and the administrative requirements are in Section 4.&lt;/p&gt;</p>
