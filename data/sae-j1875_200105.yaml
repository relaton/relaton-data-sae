    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The materials defined by this SAE Standard are unreinforced thermoplastic acetal and thermoplastic 6/6 heat stabilized nylon, as both materials will function in this application.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specific material chosen will depend on the final application's surroundings and heat requirements. They are for use in vacuum booster check valves for hydraulic brake systems.&lt;/div&gt;&lt;/div&gt;</p>
