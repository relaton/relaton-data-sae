  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the wiring and rectangularly shaped connector standards for all types of trailers whose gross weight does not exceed 4540 kg (10 000 lb). These trailers are grouped in SAE J684, with running light circuit loads not to exceed 7.5 A per circuit. This document provides circuits for lighting, electric brakes, trailer battery charging, and an auxiliary circuit color coding and protection for the wiring from hazards or short circuits. Color coding is compatible with SAE J560 and ISO 1724-1980(E).&lt;/div&gt;&lt;/div&gt;</p>
