  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers environment-resisting, quick disconnect, EMI/RFI shielded and non-shielded umbilical, electric connectors and adapter assemblies with removable crimp or nonremovable solder-type contacts and accessories. Connectors are rated for operation from -55 °C (-67 °F) to 200 °C (392 °F). Adapter assemblies are rated for operation from -55 °C (-67 °F) to 125 °C (257 °F). The upper temperature is the maximum internal hot spot temperature resulting from any combination of electrical load and ambient temperature.&lt;/div&gt;



    &lt;/div&gt;</p>
