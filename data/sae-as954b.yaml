  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) covers reversible ratchet handles and high strength thin wall commercial sockets, flexible sockets, box wrenches and torque adapters designed for general usage which possess the strength, clearances, and internal wrenching design so configured that, when mated with 12-point fasteners conforming to the requirement of AS 870, they shall transmit torque to the fastener without bearing on the outer 5% of the fastener's wrenching points.&lt;/div&gt;&lt;/div&gt;</p>
