abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard has notes/guidance narratives interspersed throughout. These notes/guidance narratives are identified by a header and by text in &lt;i&gt;italics&lt;/i&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard defines a series of requirements that results in a specific AM machine qualified to produce material (see &lt;i&gt;GN1&lt;/i&gt;) in compliance to an aerospace materials specification. The machine control and/or configuration types are discussed in the next sections. The industry (including AIA and ASTM) generally acknowledges that there are three qualification milestones for AM machines; nevertheless, this document will focus only on the initial two stages, namely:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Installation Qualification (IQ): Producing objective evidence to show that all key aspects of the process equipment and ancillary system installation adhere to the AM Part Producer’s specification and that the recommendations of the supplier of the equipment are suitably considered; this is tied to a specific machine serial number.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Operational Qualification (OQ): Establishing sufficient process control to maintain stable material performance and demonstrating that the material specification requirements can be met; this is also tied to a specific machine serial number (see &lt;i&gt;GN2&lt;/i&gt;).&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;




    &lt;/div&gt;</p>
