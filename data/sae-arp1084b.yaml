abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this SAE Aerospace Recommended Practice (ARP) is to
    provide guide lines for allowable leakage for in-service aircraft hydraulic components
    at a nominal 100 °F (38 °C) temperature and to outline the procedure for measuring
    such leakage. The limits to be applied to any specific aircraft should be adjusted
    before inclusion in a maintenance manual.</p>"
