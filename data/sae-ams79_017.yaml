  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies requirements for a foaming liquid cleaning compound which, when diluted with water 1:9 v/v, is suitable for cleaning the soiled exterior of Service aircraft. The cleaning compound may be applied by spraying, either as foam or liquid, by brushing or by swabbing. The surfaces to be cleaned may be unpainted metal or surfaces painted with glossy or matt schemes, including strippable acrylic paint complying with DTD 5599. This Standard includes tests to limit specific forms of corrosion that affect aircraft structural materials.&lt;/div&gt;&lt;/div&gt;</p>
