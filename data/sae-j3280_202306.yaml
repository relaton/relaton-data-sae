  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to describe system design guidelines for the use of haptic interfaces to manage system safety and functional aspects of designs applicable for OEM and aftermarket systems in light vehicles. The intent of these guidelines is to help system designers determine when to use haptic interfaces and how to ensure their effectiveness. These may be stand-alone interfaces or the haptic aspects of multi-modal (audio, video, speech, haptic) interfaces. Excludes haptic systems designed for use by passengers, which may be addressed in a future version.&lt;/div&gt;
    &lt;/div&gt;</p>
