  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers two-component polysulfide sealing compounds for quick repair of integral fuel tanks and fuel cell cavities. The sealing compound shall be capable of being cured as low as 20 °F (-7 °C), and be resistant to long term exposures from -65 to 250 °F (-54 to 121 °C).&lt;/div&gt;&lt;/div&gt;</p>
