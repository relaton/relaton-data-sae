  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to a decorative lamp(s) installed on the front of motor vehicles. This lamp(s) is intended only to be decorative and is not to impair the effectiveness of any required lighting device. This recommended practice establishes uniformity in use guidelines for the performance, installation, activation, and switching of a front decorative lamp(s).&lt;/div&gt;&lt;/div&gt;</p>
