  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) considers the issue of power regeneration into the EPS of an aircraft. A series of options for dealing with this regenerative power are considered and arranged in categories. Advantages and disadvantages of each solution, including the existing solution, are included. Validated simulation results from representative Electrical Power systems are presented in order to demonstrate how some of the solutions may operate in practice and how power quality can be maintained during regeneration. The impact on changes to the electrical generation system are also highlighted in this AIR, as these changes may have an impact on the solution deployed and the wider impact on the design of engines and auxiliaries.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR reviews concepts and excludes detailed discussions on power system design. These concepts relate to the More Electric Aircraft, cover both AC and DC systems and can be applied to both normal operating conditions or as fault mitigation.&lt;/div&gt;
    &lt;/div&gt;</p>
