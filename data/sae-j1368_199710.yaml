  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide design guidelines to vehicle manufacturers by establishing characteristics of anchorages and attachment hardware provisions at the passenger front seat outboard seating location for securing a child seating system in vehicles equipped with automatic (passive) restraint systems that are not suitable for use with a child seating system. Further, it is intended to provide interface information to child restraint manufacturers. The anchorage and hardware configuration and location as well as interface parameters are described along with performance and identification requirements.&lt;/div&gt;&lt;/div&gt;</p>
