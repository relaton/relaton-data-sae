    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to recommend general design and performance characteristics for portable, hand-held emergency lighting systems intended for use by crew members of commercial aircraft during any emergency situation, within or outside of the aircraft cabin, where emergency lighting is required.&lt;/div&gt;&lt;/div&gt;</p>
