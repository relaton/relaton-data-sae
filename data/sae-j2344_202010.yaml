  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report identifies and defines the preferred technical guidelines relating to safety for vehicles that contain High Voltage (HV), such as Electric Vehicles (EV), Hybrid Electric Vehicles (HEV), Plug-In Hybrid Electric Vehicle (PHEV), Fuel Cell Vehicles (FCV) and Plug-In Fuel Cell Vehicles (PFCV) during normal operation and charging, as applicable. Guidelines in this document do not necessarily address maintenance, repair, or assembly safety issues.&lt;/div&gt;

    &lt;/div&gt;</p>
