    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances. It describes a body of tests which may be used as needed for abuse testing of electric or hybrid electric vehicle batteries to determine the response of such batteries to conditions or events which are beyond their normal operating range. This document is derived from a similar document originally developed by the U.S. Advanced Battery Consortium. (See &lt;span class="xref"&gt;2.2.1&lt;/span&gt;.)&lt;/div&gt;
    &lt;/div&gt;</p>
