  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice presents a method and example results for determining the Automotive Safety Integrity Level (ASIL) for automotive electrical and electronic (E/E) systems. This activity is required by ISO 26262-3:2011 [1], and it is intended that the process and results herein are consistent with ISO 26262:2011 [1]. The technical focus of this document is on vehicle motion control systems. It is limited to passenger cars weighing up to 3.5 metric tons. Furthermore, the scope of this recommended practice is limited to collision-related hazards. ISO 26262:2011 [1] has a wider scope than SAE J2980, covering other functions and accidents (not just motion control or collisions as in SAE J2980).&lt;/div&gt;


    &lt;/div&gt;</p>
