  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this guideline is to provide the essential design considerations for the metal “V” belt variator used in continuously variable transmissions. Information from SAE papers, transmission manufacturers, and component manufacturers is provided to aid engineers in understanding the function and design methodology of the major components within the variator system. Recommended design practices are given based on current practices.&lt;/div&gt;&lt;/div&gt;</p>
