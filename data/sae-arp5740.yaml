  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) addresses the information content for the electronic presentation of data linked weather Meteorological (MET) information used in the cockpit. It defines guidelines for the electronic presentation of MET information (including text, graphics, textures, icons, and symbology) to the flight crew.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP is applicable to certified equipment for the electronic display (whether installed or portable) of MET information in the cockpit. This ARP also provides a set of symbols that illustrate the depiction of data linked MET information on flight deck display systems such as Navigation Displays, Multi-function Displays, and Electronic Flight Bags. These recommendations complement standard symbology guidelines for airborne applications already in existence (see reference section for applicable documents).&lt;/div&gt;
    &lt;/div&gt;</p>
