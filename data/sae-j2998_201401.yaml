  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The Model Description Documentation Recommended Practice for Ground Vehicle System and Subsystem Simulation defines the recommended information content to be included for documenting dynamical models used for simulation of ground vehicle systems. It describes the information that should be compiled to describe a model for the following user applications or use cases: (1) exchange, promotion, and selection; (2) creation requests; (3) development process management; (4) compatibility evaluation, (5) testing-in-the-loop simulations with hardware and/or software; (6) simulation applications; and (7) development and maintenance. For each use case, a Model Description Documentation (MDD) template is provided in the appendices to facilitate model documentation. In addition, an example of a completed model documentation template is provided in the appendices.&lt;/div&gt;
    &lt;/div&gt;</p>
