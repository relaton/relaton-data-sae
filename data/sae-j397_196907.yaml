  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers characteristics and dimensions of a critical zone to prevent crushing of an operator during roll-over. It is intended to be used with SAE reports on minimum performance criteria for roll-over protective structure (SAE J320, J394, J395, J396).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The critical zone is dimensioned to enclose a large man (95th percentile) in arctic clothing.&lt;/div&gt;&lt;/div&gt;</p>
