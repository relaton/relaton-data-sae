  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The AS8050 master document contains general information for qualification of aerospace fiber optic, circular, modular, and rectangular connectors as part of a fiber optic interconnect assembly comprising of a connector, fiber optic cable, and fiber optic terminus. The product specifications (slash sheets) contain dimensional, mechanical, and operating performance requirements for aerospace fiber optic, circular, and rectangular connectors. The product specifications (slash sheets) reference associated aerospace fiber optic termini and cables suitable for use with AS8050 connectors.&lt;/div&gt;&lt;/div&gt;</p>
