  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the requirements to help prevent inadvertent and to discourage deliberate electrical connection at the starter motor solenoid or starter relay which may result in the starter pinion engaging the ring gear.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to off-road, self-propelled work machines, as identified in SAE J1116, which have the potential of powered movement as a direct result of the starter pinion engaging the ring gear.&lt;/div&gt;&lt;/div&gt;</p>
