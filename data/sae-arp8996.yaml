  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) applies to comprehensibility testing of aircraft markings, signs, and placards that are intended to provide information to passengers, crew, or ground personnel exclusively through pictorial symbols (pictograms).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Markings, signs, and placards where text is complemented by pictograms are not in the scope of this document. In case text and pictograms are used in a redundant manner, comprehension testing is not required.&lt;/div&gt;&lt;/div&gt;</p>
