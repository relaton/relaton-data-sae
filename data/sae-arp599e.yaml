  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes a procedure for determining the insoluble contamination level of the downstream side of cleanable filter elements. The results may be used for comparative evaluation of the effectiveness of various cleaning methods or the cleanliness of elements after cleaning or as received from manufacturers.&lt;/div&gt;
