  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the dynamic and static testing procedures required to evaluate the integrity of an equipment mount device or system when exposed to a frontal or side impact (i.e., a crash impact). Its purpose is to provide equipment manufacturers, ambulance builders, and end-users with testing procedures and, where appropriate, acceptance criteria that, to a great extent, ensure equipment mount devices or systems meet the same performance criteria across the industry. Prospective equipment mount manufacturers or vendors have the option of performing either dynamic testing or static testing. Descriptions of the test set-up, test instrumentation, photographic/video coverage, test fixture, and performance metrics are included.&lt;/div&gt;&lt;/div&gt;</p>
