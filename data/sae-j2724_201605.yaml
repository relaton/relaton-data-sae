    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure describes a method for measuring the fraction of underlayer (also referred to as backing layer) existing at any given height above the a disc brake friction materials shoe plate. Measuring underlayer distribution is useful for computing useable lining thickness and for friction material quality management.&lt;/div&gt;&lt;/div&gt;</p>
