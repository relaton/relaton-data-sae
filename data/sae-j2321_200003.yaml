    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers disposable hydraulic and lube oil filter elements. This document is a general performance specification for filter elements and identifies performance criteria and test methods. Associated specification sheets (SAE J2321-1, J2321-2, and J2321-3, etc.) define configuration and performance requirements for specific elements.&lt;/div&gt;&lt;/div&gt;</p>
