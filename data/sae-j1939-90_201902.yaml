abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This Information Report is intended to supplement the J1939 documents by offering the application of SAE RP J1939 to OBD data communications in a form that can be sorted and searched for easier use. It is NOT intended as a substitute for the actual regulations and standards documents, and any discrepancies between this document and the published documents must be resolved in favor of the published documents.&lt;/p&gt;


    &lt;p&gt;This spreadsheet outlines elements in ARB OBD II and HD OBD requirements and identifies which J1939 SPNs and messages may be used to satisfy the datastream, readiness, in-use ratio, and test results requirements.&lt;/p&gt;</p>
