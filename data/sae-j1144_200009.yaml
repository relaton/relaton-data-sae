  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a means for evaluating the drivetrain of the passenger car, van, or light-duty truck being towed under a variety of road conditions. The towing equipment used is explained in SAE J1142.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE—For the purpose of this document, the drivetrain refers to the combination of a specific transmission (make, model, size, type), a specific differential assembly (make, model, size, type), and a specific driveline, if required.&lt;/div&gt;&lt;/div&gt;</p>
