    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides laboratory test procedures for testing headlamp aim test machines to determine their ability to aim or to check the aim of headlamps, fog lamps, and auxiliary driving and lower beam lamps. This report does not apply to aiming devices of the kind covered by SAE J602.&lt;/div&gt;&lt;/div&gt;</p>
