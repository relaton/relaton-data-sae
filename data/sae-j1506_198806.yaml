  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report describes various dynamometer driving schedules currently in use in the world for measurement of exhaust emissions and fuel economy of passenger cars and light trucks. Issuance of this information report will allow driving schedules to be deleted from individual test procedures, thus reducing the amount of repeated information in the SAE Handbook.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This information report includes:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;1 - Descriptions of driving schedules.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;2 - Second-by second definition of speed versus time sequences.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
