abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report covers thin coatings of resinous based materials that can be placed on the metallic outer diameter of radial lip-type shaft seals to provide sealing when the mating bore finish is too rough to insure a proper seal (typically when finish exceeds 2.54 μm R&lt;sub&gt;a&lt;/sub&gt;, or in pressurized applications.)&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The coatings will have the following characteristics:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Material shall dry to a tough, flexible, and non-tacky film.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Thickness typically ranges from 0.005 to 0.076 mm.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;It shall not crack, flake, or powder when scraped.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Coating shall adhere to seal case as noted in text.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The sealer shall not show any evidence of peeling, blistering, softening, or dissolution when tested in media to be sealed.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
