  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides an overview of fire and overheat protection approaches that have been utilized for engine electronic units. While the electronic engine control (EEC) is the engine electronic unit specifically addressed in this document, the approaches presented can extend to any engine electronic unit, including monitoring units and other electronic based engine components.&lt;/div&gt;


    &lt;/div&gt;</p>
