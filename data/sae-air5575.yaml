    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) discusses the often overlooked relationship between hot stamp marking and the environmental conditions that contribute aircraft wiring problems and discusses current beliefs of military service experts, regulatory agencies and industry standard writing bodies about the potential hazards imposed by the hot stamping process.&lt;/div&gt;

