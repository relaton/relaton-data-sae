  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to all new production air brake and air accessory reservoirs used in automotive vehicles and off-road machines. This document defines an “air reservoir” as a reservoir having single or multiple compartments that is used for storage of compressed air. This document does not apply to accumulators or reservoirs for storage of gases other than compressed air.&lt;/div&gt;
    &lt;/div&gt;</p>
