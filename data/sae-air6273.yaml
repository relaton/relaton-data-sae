  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE Aerospace Information Report (AIR) provides standardized terms, definitions, and acronyms that may be used in the G-19 and G-21 documents, unless otherwise specified in those documents. The SAE International series of documents that address the mitigation of suspect and counterfeit parts will reference this document in their respective Applicable Documents sections.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR is for use by organizations that procure and/or use materiel or EEE parts. The terms and definitions of this AIR are intended to be used in conjunction with other G-19 and G-21 standards.&lt;/div&gt;&lt;/div&gt;</p>
