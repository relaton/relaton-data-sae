    &lt;div class="htmlview paragraph"&gt;The requirements for setting up and operating the machinery, the microphone array and hemispherical measurement surface are given in this document. This document shall be used in conjunction with manufacturer's recommendations pending finalization of ANSI documents on the subject of sound intensity procedures. The accompanying sound intensity procedure clarification is provided pending more widespread understanding of sound intensity.&lt;/div&gt;&lt;/div&gt;</p>
