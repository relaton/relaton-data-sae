  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to provide technicians with safe and efficient techniques and general equipment recommendations for servicing mobile air conditioning systems in off-road, self-propelled work machines as defined in SAE J1116 and tractors and machinery for agriculture and forestry as defined in ASABE standard ANSI/ASAE S390. Both refrigerants HFC-134a (R-134a) and HFO-1234yf (R-1234yf) are covered. Many service procedures are similar for both refrigerants, but recovery, recycling, charging, and electronic leak detection tools can be unique to each refrigerant.&lt;/div&gt;&lt;/div&gt;</p>
