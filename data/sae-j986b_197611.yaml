  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the test procedure, environment, and instrumentation for determining the exterior sound level for passenger cars, multipurpose vehicles, and light trucks having a gross vehicle weight rating (GVWR) of 4540 kg (10 000 lb) or less.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedure of this Standard is characterized by having fixed initial conditions (specified initial vehicle speed and gear selection at a fixed acceleration point on the test site) in contrast to the procedure of SAE Recommended Practice J1030, Maximum Sound Level For Passenger Cars and Light Trucks, which has fixed terminal conditions (attainment of rated engine speed at a fixed end point on the test site). Full-throttle acceleration and closed-throttle deceleration of the vehicle are included in both procedures.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Sound levels determined in accordance with this Standard are dependent on the performance capability of the test vehicle, as influenced by power-to-weight ratio and overall power train gear ratio. Thus, this Standard is particularly applicable to emphasize sound emission of vehicles with large power-to-weight ratio or high overall gear ratio within the overall vehicle population.&lt;/div&gt;&lt;/div&gt;</p>
