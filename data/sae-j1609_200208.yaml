    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes performance guidelines for the capacity of the air reservoir systems used on trucks, towing trucks, truck-tractors, trailers, and converter dollies, with GVWRs over 10 000 lb, designed to be used on the highway in commercial operations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE—At time of publication, vehicles complying with this document may not comply with the air reservoir requirements of FMVSS 121.&lt;/div&gt;
    &lt;/div&gt;</p>
