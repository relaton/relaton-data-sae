    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE recommended practice provides some procedure for determining shot peening coverage and relating coverage to part exposure to the media stream. Effectiveness of shot peening is directly dependent on coverage. Either incomplete or excessive coverage can be detrimental to fatigue strength and life.&lt;/div&gt;&lt;/div&gt;</p>
