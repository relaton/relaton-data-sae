  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following information covers engine accessory drive layout details and testing methods and includes test configurations, pulley diameters, power loads, and guidance for interpreting test data. This information has been prepared from existing literature, including standards and data supplied by both producers and users of V-ribbed belts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;When the engine is used to drive an external unit equipped with industrial type V-pulleys and belts, it is recommended that the power takeoff pulley on the engine be grooved according to the appropriate industrial standard. These standards are published by RMA-MPTA (Rubber Manufacturers Association - Mechanical Power Transmission Association); ISO (International Standards Organization) and ASAE (American Society of Agricultural Engineers). The grooves in those standards differ from each other in the reference dimensions, and they are not interchangeable with SAE grooves, which are standardized for engine accessory drives as covered in SAE J636 and J1459.&lt;/div&gt;
    &lt;/div&gt;</p>
