  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice is intended to serve as a procedure to verify the functional performance, design specifications or vendor claims of any PEM (Proton Exchange Membrane) type fuel cell stack sub-system for automotive applications. In this document, definitions, specifications, and methods for the functional performance characterization of the fuel cell stack sub-system are provided. The functional performance characterization includes evaluating electrical outputs and controlling fluid inputs and outputs based on the test boundary defined in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In this document, a fuel cell stack sub-system is defined to include the following:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Fuel cell stack(s) – An assembly of membrane electrode assemblies (MEA), current collectors, separator plates, cooling plates, manifolds, and a supporting structure.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Connections for conducting fuels, oxidants, cooling media, inert gases and exhausts.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Electrical connections for the power delivered by the stack sub-system.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Devices for monitoring electrical loads.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Devices for monitoring cell voltage.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Humidification devices.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Instrumentation for detecting normal and/or abnormal operating conditions.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Enclosures (that may qualify as pressure vessels), and ventilation systems for the enclosure.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;Not included in the sub-system are the following:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Fuel and air processors&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Thermal management system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Power conditioner and distributor&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Controllers&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;</p>
