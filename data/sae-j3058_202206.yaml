  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the dynamic testing procedures required to evaluate the integrity of patient compartment interior Storage Compartments such as cabinets, drawers, or refillable supply pouch systems when exposed to a frontal, side or rear impact (i.e., a crash impact). Its purpose is to provide component manufacturers, ambulance builders, and end-users with testing procedures and, where appropriate, acceptance criteria that, to a great extent, ensure interior Storage Compartments or systems meet the same performance criteria across the industry. Descriptions of the test set-up, test instrumentation, photographic/video coverage, test fixture, and performance metrics are included.&lt;/div&gt;&lt;/div&gt;</p>
