  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard, SAE1002, is a republication of FGDC-STD-011-2001, and defines a preferred USNG for mapping applications at scales of approximately 1:1000000 and larger. It defines how to present Universal Transverse Mercator (UTM) coordinates at various levels of precision. It specifies the use of those coordinates with the grid system defined by the Military Grid Reference System (MGRS). Additionally, it addresses specific presentation issues such as grid spacing. Together, the UTM coordinate representation, the MGRS grid, and the specific grid presentation requirements define the USNG.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Use of USNG grid coordinates may be useful, and even desirable, within some systems or enterprises. The decision to use USNG grid coordinates or some other coordinate system internal to geographic information systems or location service appliances is left to the discretion of the system developer as long as the human interface provides for USNG grid coordinate readout as one option.&lt;/div&gt;&lt;/div&gt;</p>
