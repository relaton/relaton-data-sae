    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes requirements for the function, characteristics, and installation of an aircraft On Board Weight and Balance System (OBWBS) for use on civil transport aircraft. This document is not intended to specify design methods, mechanisms, or material to accomplish the requirements set forth.&lt;/div&gt;&lt;/div&gt;</p>
