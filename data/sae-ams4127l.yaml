  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an aluminum alloy in the form of die forgings not over 4 inches (102 mm) in nominal thickness at time of heat treatment , hand forgings with as-forged thickness not exceeding 8 inches (203 mm) and the cross-sectional area not greater than 256 square inches (1652 cm&lt;sup&gt;2&lt;/sup&gt;), forged or rolled rings 3.5 inches (89 mm) and under in nominal thickness at time of heat treatment and having an OD-to-wall thickness ratio of 10:1 or greater, and stock of any size for forgings and rings (see &lt;span class="xref"&gt;8.6&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
