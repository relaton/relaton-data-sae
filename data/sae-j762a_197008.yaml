    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This information report is intended to establish an engineering approach to the selection and use of reinforced thermosetting plastic materials. A further purpose is to acquaint the engineer with the varied processes and fibrous reinforced thermosetting plastic materials available and their general range of properties and application for ground vehicles.&lt;/div&gt;&lt;/div&gt;</p>
