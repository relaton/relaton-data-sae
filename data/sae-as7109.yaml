  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for suppliers of coatings services to be accredited by the National Aerospace and Defense Contractors Accreditation Program (NADCAP) in accordance with SAE AS7003. The requirements contained herein may be supplemented by additional requirements specified by NADCAP Coatings Task Group. Using the audit checklist (AC7109) will ensure that accredited Coatings suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;&lt;/div&gt;</p>
