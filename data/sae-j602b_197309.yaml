  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification applies to the requirements of a device used in the field and inspection stations to aim the mechanically aim-able type of sealed beam headlamp units.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this specification is to provide a laboratory test procedure to determine whether the devices under test are capable of accurately positioning sealed beam headlamp units from their aiming pads and maintaining their accuracy in service within the tolerances designated in this specification.&lt;/div&gt;&lt;/div&gt;</p>
