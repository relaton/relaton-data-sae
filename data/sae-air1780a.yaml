abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is divided into five parts. The first part deals with flotation analysis features and definitions to acquaint the engineer with elements common to the various methods and the meanings of the terms used. The second part identifies and describes the various methods used. To accomplish the minimum intent of this document, techniques could be limited to those needed for flotation analysis only; however, because of the close relation between flotation analysis and runway design, methods for the latter are also included. In fact, runway design criteria are used for flotation and evaluation in some cases, and are periodically the governing procedure in specific, if isolated, instances. From time to time, it may be necessary to deal with runways built to obsolete criteria. Therefore, a listing of most of these constitutes the third part. The fourth part of this document tabulates the recommended documents, categorizing them for commercial and civil versus military usage, by military service to be satisfied, and by type of pavement. The document concludes with brief elaborations of some concepts for broadening the analyst’s understanding of the subject.&lt;/div&gt;
    &lt;/div&gt;</p>
