abstract:
- language: en
  script: Latn
  content: "<p>The final approval date for Fuels and Lubricants technical reports is shown following the J-report number. This approval date is the date of final approval by the Fuels and Lubricants Council. It is effective immediately subsequent to Council approval for newly issued Standards, Recommended Practices, and Information Reports, and also for revised Information Reports. In the case of revised or cancelled Standards or Recommended Practices (used to define product quality), an 18 month grace period is advised before they become fully effective.</p>"
