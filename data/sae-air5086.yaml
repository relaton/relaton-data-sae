    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Technical limitations of probabilistic methods&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Recommendations to help promote the use of probabilistic methods&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The document does not contain technical details of probabilistic methods, applications or benchmarking of specific approaches. These subjects are covered in other AIRs, referenced in &lt;span class="xref"&gt;Section 2&lt;/span&gt; and prepared by the Probabilistic Methods Committee of the G-11 Reliability, Maintainability, Supportability and Logistics (RMSL) Division of SAE.&lt;/div&gt;
