abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This compliance assessment tool supports the summary of requirements
    applicable to AS6500A, including potential documentation to demonstrate compliance
    along with tailoring options and company policies. The standard is applicable
    to all phases of the system acquisition life cycle. It is intended for use on
    all programs with manufacturing content. It requires proven manufacturing management
    practices with the goal of delivering affordable and capable systems to the extent
    that it is invoked contractually.&lt;/p&gt;</p>"
