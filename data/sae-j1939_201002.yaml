  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These Recommended Practices are intended for light, medium, and heavy duty vehicles used on or off road as well as appropriate stationary applications which use vehicle derived components (e.g. generator sets). Vehicles of interest include, but are not limited to: on and off highway trucks and their trailers; construction equipment; and agricultural equipment and implements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of these Recommended Practices is to provide an open interconnect system for electronic systems. It is the intention of these Recommended Practices to allow Electronic Control Units to communicate with each other by providing a standard architecture.&lt;/div&gt;

    &lt;/div&gt;</p>
