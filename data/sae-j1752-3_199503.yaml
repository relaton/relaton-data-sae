  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines a method for measuring the electromagnetic radiation from an integrated circuit. The method uses a standardized IC test board containing the IC being evaluated mounted to a mating port cut in the top or bottom of a 1 GHz TEM cell. The standardized test board controls the geometry and orientation of the operating IC relative to the TEM cell and eliminates any connecting leads within the cell (these are on the back side of the board which is outside the cell). One of the TEM cell feeds is terminated with a 50 Ω load and the other one is connected to the input of a spectrum analyzer which measures the RF emissions over the frequency range of 150 kHz to 1000 MHz emanating from the integrated circuit and impressed onto the septum of the TEM cell (see &lt;span class="xref"&gt;Figure 1&lt;/span&gt;).&lt;/div&gt;
    &lt;/div&gt;</p>
