  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice describes a method for conducting room temperature, contaminated fuel, endurance testing when the applicable specification requires nonrecirculation of the contaminants. The objective of the test is to determine the resistance of engine fuel system components to wear or damage caused by contaminated fuel operation. It is not intended as a test for verification of the component's filter performance and service life. ARP1827 is recommended for filter performance evaluation.&lt;/div&gt;&lt;/div&gt;</p>
