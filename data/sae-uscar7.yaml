    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard outlines test methods and practices which can detect embrittlement of steel parts. It is a process control or referee verification test. The risk of embrittlement of steel is minimized by using best practices in the finishing/coating process. One such practice is described in SAE/USCAR-5, Avoidance of Hydrogen Embrittlement of Steel.&lt;/div&gt;&lt;/div&gt;</p>
