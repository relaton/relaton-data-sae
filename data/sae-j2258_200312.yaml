  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines requirements relating to the elements of design, operation, and maintenance of light utility vehicles. The safety specifications in this document apply to any self-propelled, operator-controlled, off-highway vehicle 1828 mm (72 in) or less in overall width, exclusive of added accessories and attachments, operable on three or more wheels, primarily intended to transport material loads or people, with a gross vehicle weight of 2500 kg (5500 lb) or less, and a maximum design speed less than 40 km/h (25 mph).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is not intended to cover all terrain vehicles (ATVs) complying with ANSI/SVIA 1, American National Standard for Four Wheel All-Terrain Vehicles — equipment, configuration, and performance requirements.&lt;/div&gt;

    &lt;/div&gt;</p>
