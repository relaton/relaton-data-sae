abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) details the recommended process for correcting measured non-volatile Particulate Matter (nvPM) mass and number data for particle losses in the sampling and measurement system specified in ARP6320. This technique is only recommended for conditions where both nvPM mass and number concentration measurements are in the valid measurement ranges of the instruments which are discussed in the tool limitations section. This ARP also supplies an Excel® software tool with documentation to automate the process.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The body of the ARP details the recommended calculation method, uncertainties and limitations of the system loss correction factors. It explains, in detail, the required inputs and outputs from the supplied Excel® software tool (developed on Windows 7, Excel® 2016). Also included are:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The Excel® correction tools (Attachments I and V).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Installation instructions for a Windows based computer (Attachment II).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;A user technical manual (Attachment III) describing functions used within the tool and optional Excel® add-in (Attachment VI).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Multiple Sample Test Cases (Attachment IV).&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;The Excel® tools are intended to do the full calculation described in AIR6504. This ARP provides documentation for the Excel® spreadsheet system loss tool lite version (nvPM System Loss Tool v2_5_Lite.xlsm). The difference between the full tool and lite tool is described in &lt;span class="xref"&gt;Appendix C&lt;/span&gt;. Attachments III and VI are also described in &lt;span class="xref"&gt;Appendix C&lt;/span&gt;. If the user has produced her/his own software for the AIR6504 correction, comparison of results from this tool may be used to verify that software.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP does not contain the full description of the sampling and measurement system described in ARP6320. The correction technique is only briefly discussed in this ARP. More detailed information is provided in the AIR6054.&lt;/div&gt;
    &lt;/div&gt;</p>
