    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The static laboratory test will test the adequacy of the structures used to protect the operator during the following vehicle operation: Vehicle operating at 0-10 mph over hard clay where rollover would be limited to a maximum roll angle of 360 deg down a slope of 30 deg maximum. This criteria applies to loaders classified as construction equipment.&lt;/div&gt;&lt;/div&gt;</p>
