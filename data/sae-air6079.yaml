  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this report is to provide design, application and maintenance engineers with basic information on the use of metallic Spring Energized sealing devices when used as piston (OD) and rod (ID) seals in aircraft fluid power components such as actuators, valves, and swivel glands.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Spring Energized seal is defined and the basic types in current use are described. Guidelines for selecting the type of Spring Energized seal for a given design requirement are covered in terms of friction, leakage, service life, installation characteristics, and interchangeability.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Spring Energized seals can also be made in various forms and types, including face seals (internal and external pressure sealing types), and rotary variants too. These further types will not be discussed in this document, but many of the same principles apply for them as well.&lt;/div&gt;&lt;/div&gt;</p>
