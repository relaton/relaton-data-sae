abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This SAE Aerospace Standard (AS) covers miniature, composite,
    high density, threaded coupling, self-locking, circular, environment-resistant,
    electrical connectors utilizing removable crimp contacts, and associated hardware,
    which are capable of continuous operation within a temperature range of -65 to
    +175 °C (-85 to 347 °F). These connectors are supplied under an AS9100 reliability
    assurance program. See 6.1 for intended use and applications.&lt;/p&gt;</p>"
