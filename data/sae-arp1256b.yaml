    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) describes the continuous sampling and analysis of gaseous emissions from aircraft gas turbine engines and is intended to standardize the emission test procedures&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; and equipment for measuring carbon monoxide, carbon dioxide, nitric oxide, nitrogen dioxide, and total hydrocarbons. This ARP is not intended for in-flight testing, nor does it apply to engines operating in the afterburning mode.&lt;/div&gt;&lt;/div&gt;</p>
