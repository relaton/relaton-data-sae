  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is applicable to the marking of aerospace vehicle electrical wires and cables using ultraviolet (UV) lasers. This standard specifies the process requirements for the implementation of UV laser marking of aerospace electrical wire and cable and fiber-optic cable to achieve an acceptable quality mark using equipment designed for UV laser marking of identification codes on aerospace wire and cable. Wiring specified as UV laser markable subject to AS4373 and which has been marked in accordance with this standard will conform to the requirements of AS50881.&lt;/div&gt;&lt;/div&gt;</p>
