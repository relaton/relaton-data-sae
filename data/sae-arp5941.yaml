    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes the design conditions under which tests should be conducted to demonstrate satisfactory performance of a flight critical servo-actuator under the maximum allowable particulate contamination in the associated airplane hydraulic system. Additionally, this document also describes the recommended tests and the required acceptance criteria.&lt;/div&gt;&lt;/div&gt;</p>
