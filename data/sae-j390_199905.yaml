abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers a dual dimensioning practice that provides both U.S. customary inch-pound units and SI metric units for all dimensions on the field of the drawing. The scope does not include the various methods by which computer programs are used for dual dimensioning. In one method that has had some usage, drawings are dimensioned in SI (metric) units, with conversions to U.S. customary inch-pound units provided in a computer-generated chart on the drawing.&lt;/div&gt;

    &lt;/div&gt;</p>
