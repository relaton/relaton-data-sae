  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AS6324 specifies the requirements for comparative testing of new copper and copper alloy conductors to AS29606 qualified conductors. AS29606 approved conductors are used for the construction of insulated wire defined in SAE Aerospace wire standards (i.e., AS22759, AS81044, etc.). AS6324 defines testing which meets or exceeds the minimum test requirements of AS29606 and AS22759 and its detailed specification sheets.&lt;/div&gt;&lt;/div&gt;</p>
