abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies only to spark plugs used for ground vehicles and stationary engines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended to serve as a guide to dimensions common to the majority of current production spark plugs and future applications. It is not the intent of this document to prohibit the manufacture of spark plugs having dimensions differing from those presented. Many applications exist which require specialized or nonstandard spark plugs. It is recommended that this document be used in spark plug design and engine applications wherever possible. Whenever design situations arise that prevent the use of one of these standard spark plugs, a spark plug manufacturer should be contacted for guidance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Figures 1&lt;/span&gt; to &lt;span class="xref"&gt;13&lt;/span&gt; and &lt;span class="xref"&gt;Tables 1A&lt;/span&gt; to &lt;span class="xref"&gt;6&lt;/span&gt; show typical configurations of unshielded and shielded spark plug designs, their dimensional characteristics, installation, threaded hole, and spark plug thread sizes.&lt;/div&gt;
    &lt;/div&gt;</p>
