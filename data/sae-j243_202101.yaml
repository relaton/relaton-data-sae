  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice contains a series of test methods for use in measuring characteristics of automotive-type sealers, adhesives, and deadeners. The test methods which are contained in this document are as follows:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ADS-1—Methods of Determining Viscosity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ADS-2—Low Temperature Tests&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ADS-3—Weld-Through Tests&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ADS-4—Enamel, Lacquer, and Fabric Staining Test&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ADS-5—Wash-Off Resistance Test&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ADS-7—Solids Test&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ADS-8—Flash Point Test&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ADS-9—Sag and Bridging Tests&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ADS-10—Flow Test&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The intent of this document is to provide a series of test methods which can be used in testing the various qualities of sealers, adhesives, and deadener material. In later revisions of this document, attempts will be made to reduce the number of tests now presented. The specific temperatures and times at which some of these tests are to be conducted are not dictated in these test procedures, but they will be found in the material standards which govern each type of material to be tested.&lt;/div&gt;&lt;/div&gt;</p>
