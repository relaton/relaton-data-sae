  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The guidelines for operator and bystander protection in this recommended practice apply to towed, semi-mounted, or mounted mowers with one or more blade assemblies of 78 cm (30-1/2 in) blade tip circle diameter or over, mounted on a propelling tractor or machine of at least 15 kW (20 hp), intended for marketing as industrial mowing equipment and designed for cutting grass and other growth in public use areas such as parks, cemeteries, and along roadways and highways.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The use of the word "industrial" is not to be confused with "in-plant industrial equipment."&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This recommended practice does not apply to:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Turf care equipment primarily designed for personal use, consumption, or enjoyment of a consumer in or around a permanent or temporary household or residence.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Equipment designed primarily for agricultural purposes but which may be used for industrial use.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(c)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Self-powered or self-propelled mowers or mowing machines.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Where other standards are referenced such reference applies only to the document identified, not revisions thereof.&lt;/div&gt;&lt;/div&gt;</p>
