  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test code describes tests for determining characteristics of hydraulic positive displacement pumps as used on construction and industrial machinery as referenced in SAE J1116. In this code, metric equivalents are established according to SAE J916. These characteristics are to be recorded on data sheets similar to the ones shown herein. Two sets of data sheets are to be submitted: one at 120°F (49°C) and one at 180°F (82°C).&lt;/div&gt;&lt;/div&gt;</p>
