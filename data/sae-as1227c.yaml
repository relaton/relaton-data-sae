  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines the requirements for a convoluted polytetrafluoroethylene (PTFE) lined, metallic reinforced, hose assembly suitable for use in aerospace fluid systems at temperatures between -65 °F and 400 °F for Class 1 assembly, -65 °F and 275 °F for Class 2 assembly, and at operating pressures per &lt;span class="xref"&gt;Table 1&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The use of these hose assemblies in pneumatic storage systems is not recommended. In addition, installations in which the limits specified herein are exceeded, or in which the application is not covered specifically by this standard, shall be subject to the approval of the procuring activity.&lt;/div&gt;&lt;/div&gt;</p>
