  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines qualification requirements, and minimum documentation requirements for forward and aft facing seats in Advanced Air Mobility aircraft. The goal is to achieve occupant protection under normal operational loads and to define test and evaluation criteria to demonstrate occupant protection when the seat is subjected to statically applied ultimate loads and to dynamic test conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While this document addresses system performance, responsibility for the seating system is divided between the seat manufacturer and the installation applicant. The seat manufacturer’s responsibility consists of meeting all the seat system performance requirements. The installation applicant has the ultimate system responsibility in assuring that all requirements for safe seat installation have been met.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AS is dependent on AS8049D and cannot be used without it. This AS provides revisions to the corresponding sections of AS8049D to incorporate new material specific to AAM aircraft seats. Sections beginning “Modify…” change the current wording of AS8049D by incorporating text applicable to the new seat category. Sections beginning “Add…” incorporate new sections into AS8049D. All other sections of AS8049D are unmodified and are applicable, as appropriate. Test pulse evaluation shall use the method defined in AS8049D, Appendix A.&lt;/div&gt;&lt;/div&gt;</p>
