  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The original SAE J2727 “Leakage Chart” provided a rating system for comparing mobile A/C systems and was not intended to define mobile A/C system refrigerant leakage. It had been developed from industry experience of expected system refrigerant leakage based upon currently available technologies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The new “System Emissions Chart” now contained in this revision is intended to serve as a means of estimating the annual refrigerant emissions rate (grams per year) from new production A/C systems equipped with specified component technologies. It provides emission values for various component technologies that are currently available, and can be expanded as new technologies are commercialized. This document provides the information to develop an Excel file template “System Emissions Chart” for system emission analysis. The new chart includes automotive compressor technologies, for conventional mobile air conditioning systems as well as fully hermetic compressors.&lt;/div&gt;&lt;/div&gt;</p>
