  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines the requirements for developing a DMSMS Management Plan, hereinafter also called the Plan, to assure customers that the Plan owner is using a proactive DMSMS process for minimizing the cost and impact that part and material obsolescence will have on equipment delivered by the Plan owner. The technical requirements detailed in clause &lt;span class="xref"&gt;5&lt;/span&gt; ensure that the Plan owner can meet the requirement of having a process to address obsolescence as required by Industry Standards such as EIA-4899 “Standard for Preparing an Electronic Components Management Plan” and DoD Programs as required by MIL-STD-3018 “Parts Management”.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Owners of DMSMS Management Plans include System Integrators, Original Equipment Manufacturers (OEM), and logistics support providers.&lt;/div&gt;&lt;/div&gt;</p>
