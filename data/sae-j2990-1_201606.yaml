  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Electric and alternative fueled vehicles present different hazards for first and second responders than conventional gasoline internal combustion engines. Hydrogen vehicles (H2V) including Fuel Cell Vehicles (FCVs) involved in incidents may present unique hazards associated with the fuel storage and high voltage systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The electrical hazards associated with the high voltage systems of hybrid-electric vehicles and FCVs are already addressed in the parent document, SAE J2990. This Recommended Practice therefore addresses electric issues by reference to SAE J2990 and supplements SAE J2990 to address the potential consequences associated with hydrogen vehicle incidents and suggest common procedures to help protect emergency responders, tow and/or recovery, storage, repair, and salvage personnel after an incident has occurred. Industry design standards and tools were studied and where appropriate, suggested for responsible organizations to implement.&lt;/div&gt;
    &lt;/div&gt;</p>
