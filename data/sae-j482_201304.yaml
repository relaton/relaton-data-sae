  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Included herein are the detailed general and dimensional specifications applicable to high hex nuts. All general specifications not shown here shall conform with those applicable to hex thick nuts and hex thick slotted nuts appearing in ASME B18.2.2. High hex nuts are primarily intended for use in automotive and other ground-based vehicles and industrial equipment where a long length of hexagon is required for wrenching purposes.&lt;/div&gt;&lt;/div&gt;</p>
