  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to provide guidelines for the standardization of safe operating procedures to be used in performing the services and maintenance at Designated Deicing Facilities (Central Deicing Facilities/Remote Deicing Facilities) that are necessary for proper de-icing/anti-icing of aircraft on the ground and performing of associated checks in accordance with the various approved ground icing programs, while considering applicable local environmental, operational and economic requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document should be used by regulators and airport authorities to develop and standardize approvals and permits for the establishment and operation of a DDF.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Operating procedures must be agreed to, in writing, by all air operators, airport authorities, regulators and service providers prior to commencing deicing operations.&lt;/div&gt;&lt;/div&gt;</p>
