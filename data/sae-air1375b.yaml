    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to special purpose equipment, excluding fixed facilities, which is used in the ground handling, servicing, and maintenance of aircraft. Equipment covered under other sections of the Federal Register Part 1910 is excluded from this document. This document is to establish minimum safety requirements and should not be used for vehicle design criteria. Equipment existing prior to publication date is excluded from the requirements of this document.&lt;/div&gt;&lt;/div&gt;</p>
