    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is intended to document the status of U.S. Government Specifications and Part Standards used by SAE G-3 Committee. The contents are based on information provided by the Standard Preparing Activities of the U.S. Air Force, Army, Navy, and DSCC in support of Military Standards Reform. The data has been tabulated to show the current government status, the applicable superseding documents, and the G-3 committee document replacement decision.&lt;/div&gt;&lt;/div&gt;</p>
