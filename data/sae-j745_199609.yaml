  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test code describes tests for determining characteristics of hydraulic positive displacement pumps used on construction and industrial machinery as referenced in SAE J1116. These characteristics are to be recorded on data sheets similar to the ones shown in &lt;span class="xref"&gt;Figures 1&lt;/span&gt; to &lt;span class="xref"&gt;3&lt;/span&gt;. Two sets of data sheets are to be submitted: one at 49 °C (120 °F) and one at 82 °C (180 °F).&lt;/div&gt;
    &lt;/div&gt;</p>
