    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides the qualification test procedure requirements for low wattage halogen lamps (less than 35 Watts) intended for use primarily in aircraft applications. The purpose of these tests is to provide a laboratory means of determining the performance characteristics of lamps under airplane power and other environmental conditions and to verify the integrity of the lamp design and production processes.&lt;/div&gt;&lt;/div&gt;</p>
