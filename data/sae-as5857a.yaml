  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides standardized gland (groove) design criteria and dimensions for elastomeric seal glands for static applications. The glands have been specifically designed for applications using SAE AS568 size O-rings at pressures exceeding 1500 psi (10.3 MPa) utilizing one or two anti-extrusion (backup) rings and applications at pressures under 1500 psi (10.3 MPa) without backup rings. The glands have been sized to provide increased squeeze as compared to AS4716 for more effective sealing at low temperatures and low seal swell conditions. These glands are not recommended for dynamic use. Primary usage is for static external sealing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The rod dimensions are the same as AS4716. The cylinder bore dimensions are the same as AS4716 except for sizes -001 thru -011 and -104 thru -113.&lt;/div&gt;&lt;/div&gt;</p>
