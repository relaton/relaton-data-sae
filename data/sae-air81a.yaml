  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document discusses the relative merits of the properties of hydrocarbon-based hydraulic fluid in relation to the fluid formulation, aerospace hydraulic system design and the related materials compatibility. In some cases, numerical limits are suggested, but, in general, the effect of a property is noted qualitatively.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The properties of the fluid must be considered in the design of a hydraulic system, but it is possible to design a system to be less sensitive, or more robust, to a particular fluid property. For this reason, the property of the hydraulic fluid must be weighed for each individual hydraulic system, taking into account the system's basic design, function and environment, as well as the fluid toxicity and disposal issues. Besides the hydraulic system itself, ground handling and servicing needs of the system must also be considered.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The only absolute characteristic of a hydraulic fluid is that it be a liquid throughout the range of use. All other fluid properties must be considered in hydraulic system design. See MIL-HDBK-118.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Phosphate ester-based hydraulic fluids, not covered in this document, have some unique properties which need to be considered separately. See AS1241 for information on phosphate ester-based hydraulic fluids.&lt;/div&gt;&lt;/div&gt;</p>
