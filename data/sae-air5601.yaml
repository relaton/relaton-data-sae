  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is devoted to the challenges of applying optics to new advanced RF analog systems only; digital data link applications are covered elsewhere in protocol/architecture specific documents like Fibre Channel, ATM, Ethernet, Sonet, etc.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document has four main goals:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To completely cover today’s capabilities and limitations of fiber in meeting multiple types of advanced RF system requirements.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To discuss near term advancements being developed that will bring us closer to meeting all the capabilities of current copper coax systems.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To identify the benefits of fiber optics for RF systems&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;4&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To identify challenges for future development.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
