  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) is therefore intended to document the process of landing gear system development. Some of the steps covered are mandatory and others are elective, or dependent upon customer requirements or desires. Economics is a very significant factor and for each analysis or test performed, more confidence and assurance of success is gained, but at a price. Some of the steps are performed as a matter of “good engineering practice” and without special recognition. Others are unique to the particular landing gear system and all together comprise a complete development.&lt;/div&gt;&lt;/div&gt;</p>
