  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is intended as a guide to define the requirements for aerospace hydraulic relief valves, including details pertinent to the design, performance, fabrication, and testing of the relief valves.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 1: This ARP is for hydraulic system full-flow relief valves; ARP4835 has been developed to specifically cover thermal relief valves.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 2: This document does not cover the modification of cracking pressure by external input; either hydraulic, electric, or pneumatic.&lt;/div&gt;
    &lt;/div&gt;</p>
