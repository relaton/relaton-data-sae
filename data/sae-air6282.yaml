  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides a cross reference detailing current test methods used in the qualification processes of fiber optic connectors, termini and cables for aerospace, telecommunications and naval applications. The cross-reference allows the end user to select the test methods most suitable for qualifying a component, or to identify alternative test methods where a specific test is not defined in a referenced document. The standard also provides information on what area each type of referenced document has been developed for.&lt;/div&gt;&lt;/div&gt;</p>
