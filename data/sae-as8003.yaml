  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard covers all automatic pressure altitude code generating equipment manufactured under this standard and complying with the requirements specified herein up to the maximum range of pressure altitude as indicated on the equipment nameplate. In those cases where the code generating equipment forms part of an aircraft system, such as a pressure altimeter, an air data computer or an ATC Transponder, this standard applies only to the code generating equipment as defined in paragraph &lt;span class="xref"&gt;1.2&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
