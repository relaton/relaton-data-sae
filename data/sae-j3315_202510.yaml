  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes classes of Aftermarket V2X Devices (AVDs) intended to support particular services, provides their respective requirements (including RF performance requirements), and specifies their radio profiles. This document is targeted to enable near- and long-term deployments by supporting different classes of AVDs that could interact with other onboard units (OBUs) and roadside units (RSUs). Users of this document include manufacturers of vehicles and micro-mobility conveyances, developers of hardware and applications, as well as those interested in LTE-V2X system architecture, testing, and certification.&lt;/div&gt;

    &lt;/div&gt;</p>
