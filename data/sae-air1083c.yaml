  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides the hydraulic and flight-control system designer with the various design options and techniques that are currently available to enhance the survivability of military aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The AIR addresses the following major topics:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Design concepts and architecture (see &lt;span class="xref"&gt;3.2&lt;/span&gt;, &lt;span class="xref"&gt;3.5&lt;/span&gt;, and &lt;span class="xref"&gt;3.6&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Design implementation (see &lt;span class="xref"&gt;3.3&lt;/span&gt;, &lt;span class="xref"&gt;3.6&lt;/span&gt;, and &lt;span class="xref"&gt;3.7&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Means to control external leakage (see &lt;span class="xref"&gt;3.4&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Component design (see &lt;span class="xref"&gt;3.8&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;

    &lt;/div&gt;</p>
