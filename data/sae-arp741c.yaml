  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This paper describes a recommended practice and procedure for the correlation of test cells that are used for the performance testing of turbofan and turbojet engines. Test cell correlation is performed to determine the effect of any given test cell enclosure and equipment on the performance of an engine relative to the baseline performance of that engine. When baseline testing is performed in an indoor test cell, the baseline performance data are adjusted to open air conditions. Although no original equipment manufacturer (OEM) documents are actually referenced, the experience and knowledge of several OEMs contributed to the development of this document. Each engine Manufacturer has their own practices relating to correlation and they will be used by those OEMS for the purpose of establishing certified test facilities.&lt;/div&gt;&lt;/div&gt;</p>
