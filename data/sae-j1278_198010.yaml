  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Synchronous belt drives consist of a toothed belt which mates with grooved pulleys to provide a precise speed ratio between the driver and driven pulleys. This standard covers the synchronous belt and pulley sections currently in use in automotive applications such as camshaft, distributor, and other underhood drives that may require synchronization. It also provides for future sections to be added as usage develops. &lt;span class="xref"&gt;Table 1&lt;/span&gt; lists the sections currently in use.&lt;/div&gt;&lt;/div&gt;</p>
