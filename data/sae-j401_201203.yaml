  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE system of designating steels, described in SAE J402, classifies and numbers them according to chemical composition. In the case of the dent resistant, high strength and ultra high strength steels in SAE J2340, advanced high strength steels described in SAE J2745, and the high strength steels in SAE J1442 and the high-strength carbon and alloy die drawn steels in SAE J935, minimum mechanical property requirements have been included in the designations. In addition, hardenability data on most of the alloy steels and some of the carbon steels will be found in SAE J1268.&lt;/div&gt;&lt;/div&gt;</p>
