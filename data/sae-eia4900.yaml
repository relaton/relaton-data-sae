abstract:
- language: en
  script: Latn
  content: |-
    <p>This document prescribes processes for using semiconductor devices in wider temperature ranges than those specified by the device manufacturer.  It applies to any designer or manufacturer of equipment intended to operate under conditions tht require semiconductor devices to function in temperature ranges beyond those for which the devices are marketed.

    This document is intended for applications in which only the performance of the device is an issue.  Even though the device is used at wider temperatures, the wider temperatures will be limited to those that do not compromise the system performance or application-specific reliability of the device in the application.  Specifically, this document is not intended for applications that require the device to function at an operating or environmental stress level that significantly increases the risk of catastrophic device failure, loss of equipment function, or unstable operation of the device.</p>
