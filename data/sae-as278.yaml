  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The recommendations cover the type of flight instrumentation in use today or planned for use in the near future on transport category aircraft. Four instrument panel arrangements are shown based on the use of flight instruments presently available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Systems 1 &amp;amp; 2 show layouts adaptable to transport aircraft employing flight instruments in general use today.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The arrangements shown in Systems 3 &amp;amp; 4 using computer type instruments dictate the use of an instrument combining the Direction and ADF functions - the RMI. It was felt that this was necessary in order to arrive at a better all-around standard layout and to conserve instrument panel space.&lt;/div&gt;&lt;/div&gt;</p>
