  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides information on the various fiberboard products, which are available for automotive application. It is intended to give engineers and designers a better understanding of product usage, characteristics, properties and industry terminology.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following sections cover these topics:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;General Product Information&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Design Characteristics&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;4&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Physical/Mechanical Properties&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;5&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Fiberboard Definitions&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In &lt;span class="xref"&gt;sections 2&lt;/span&gt;, &lt;span class="xref"&gt;3&lt;/span&gt; and &lt;span class="xref"&gt;4&lt;/span&gt; the fiberboard products are categorized. These sections give an overview of product types, with general information about characteristics and properties. In cases where product categories encompass more than one material or material grade, ranges were established to cover all of the products in that category. The individual companies that supply fiberboard products should be consulted for specific information about a particular product or application.&lt;/div&gt;&lt;/div&gt;</p>
