  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AMS6885/5 is the Material Specification (MS) which defines the requirements of a unidirectional carbon fiber tape epoxy repair prepreg capable of curing under vacuum for repair of carbon fiber reinforced epoxy structures. It also defines the requirements of an epoxy film adhesive to be applied in a co-bonding process with the prepreg for solid laminate and sandwich bonding.&lt;/div&gt;
    &lt;/div&gt;</p>
