  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers hose intended for use with automatic transmission cooling system applications. Type A hoses are intended for original equipment or replacement applications while Type B hoses are intended for aftermarket auxiliary cooler applications only. The reference fluid for tests requiring the use of automatic transmission fluid (ATF) shall be Dexron III / Mercon 5 or equivalent ATF that is agreed to by hose manufacturer and customer.&lt;/div&gt;&lt;/div&gt;</p>
