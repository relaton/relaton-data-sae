  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to an overhead cover installed on a protective frame or enclosure conforming to SAE J2194 or alternately SAE J1194 and the following additional requirement of a drop test to verify the effectiveness of the overhead cover in protecting the operator from falling objects.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedures and performance requirements outlined in this document are based on currently available engineering data.&lt;/div&gt;
    &lt;/div&gt;</p>
