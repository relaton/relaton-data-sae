  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard applies to hydraulically operated backhoes (as defined in SAE J1116)&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard describes a uniform "over end" and "full swing arc" lifting capacity rating for backhoes. It is based on the actual capacity of the machine to lift and support a load under stable conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Rated lift capacities will be specified for both the boom and the dipperstick and will be shown on a lift capacity chart &lt;span class="xref"&gt;Figure 1&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
