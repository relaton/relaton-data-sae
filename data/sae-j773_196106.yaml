  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers two types of general purpose conical spring washers, designated as Type L and Type H, for use as loose washers over screws and bolts, and also for use as preassembled washers on washer and screw or bolt assemblies. The Type L series is for use on screw or bolt assemblies having an ultimate strength range of 50,000 to 69,000 psi, and the Type H series is for use on screw or bolt assemblies having an ultimate strength in the area of 120,000 psi.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specification of sizes and types in this SAE Standard does not necessarily indicate that all sizes and types are available from stock. Users should consult with manufacturers for availability.&lt;/div&gt;&lt;/div&gt;</p>
