  content: <p>Primarily for general use is light wall-thickness sections where minimum tensile strength up to 160,000 psi (1105 MPa) is required and parts may be welded during fabrication. This specification has been declared "Noncurrent" by the Aerospace Materials Division, SAE, as of April 19, 1988. It is recommended, therefore, that this specification not be specified for new designs.</p>
