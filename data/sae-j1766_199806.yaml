  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Electric and Hybrid Electric Vehicles contain many types of battery systems. Adequate barriers between occupants and battery systems are necessary to provide protection from potentially harmful factors and materials within the battery system that can cause injury to occupants of the vehicle during a crash. This SAE Recommended Practice is applicable to all Electric Vehicle and Hybrid Electric Vehicle battery designs, including those described in SAE J1797. The potentially harmful factors and materials addressed by this document include electrical isolation integrity, electrolyte spillage, and retention of the battery system.&lt;/div&gt;



    &lt;/div&gt;</p>
