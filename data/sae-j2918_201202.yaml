    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform test procedures and performance requirements for engine-off heating, ventilation, and air conditioning (HVAC) systems in order to achieve driver thermal comfort in both winter and summer rest periods. This specification will apply to heavy trucks with and without sleeper compartments, including but is not limited to Class 6, 7, and 8 powered vehicles.&lt;/div&gt;
    &lt;/div&gt;</p>
