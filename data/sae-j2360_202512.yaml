abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The gear lubricants covered by this standard exceed American Petroleum Institute (API) Service Classification API GL-5 and are intended for automotive units with the primary drive hypoid gears, operating under conditions of high-speed/shock load and low-speed/high-torque. These lubricants may be appropriate for other gear applications where the position of the shafts relative to each other and the type of gear flank contact involve a large percentage of sliding contact. Such applications typically require extreme pressure (EP) additives to prevent the adhesion and subsequent tearing away of material from the loaded gear flanks. These lubricants are not appropriate for the lubrication of worm gears.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The information contained within is intended for the demonstration of compliance with the requirements of this standard and for listing on the Qualified Products List (QPL) administered by the Lubricant Review Institute (LRI). A complete listing of qualification submission requirements and procedures can be found in the Program Document PD4000, available on the Performance Review Institute (PRI) website, &lt;a href="https://www.p-r-i.org/qpl/lubricant-review-institute" target="_blank"&gt;https://www.p-r-i.org/qpl/lubricant-review-institute&lt;/a&gt;.&lt;/div&gt;&lt;/div&gt;</p>
