  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines contamination classes and levels for particulate contamination of hydraulic fluids and includes methods of reporting related data (&lt;span class="xref"&gt;Appendix A&lt;/span&gt;). The contamination levels selected are based on the widely accepted NAS 1638 cleanliness classes. The conversion from NAS 1638 cleanliness class specifications to AS4059 class specifications is defined. The comparison of the NAS 1638 classes to AS4059 classes and levels is provided and are defined and the differences explained (&lt;span class="xref"&gt;Appendix B&lt;/span&gt;). NAS 1638 classes based on weight of particles are not applicable to these classes and are not included. A contamination code has been added to describe the contamination levels of the fluid at the specified particle size ranges.&lt;/div&gt;&lt;/div&gt;</p>
