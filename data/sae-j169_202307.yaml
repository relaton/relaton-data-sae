  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to establish air-conditioning design guidelines that will apply to most systems rather than the specific design of any particular system. Operating conditions and characteristics of the equipment will determine the design of any successful system; since these characteristics and conditions vary greatly from one application to another, the designer shall determine the goals expected to be reached under the conditions encountered. To determine the capacity of such items as blowers, condenser fans, condenser coils, evaporator coils, filters, compressors, etc., will require the adherence to several guidelines, some of which are outlined in the following paragraphs.&lt;/div&gt;&lt;/div&gt;</p>
