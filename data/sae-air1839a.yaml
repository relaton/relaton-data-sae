  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) is a general overview of typical airborne vibration monitoring (AVM) systems with an emphasis on system hardware design considerations. It describes AVM systems currently in use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this AIR is to provide information and guidance for the selection, installation, and use of AVM systems and their elements. This AIR is not intended as a legal document but only as a technical guide.&lt;/div&gt;&lt;/div&gt;</p>
