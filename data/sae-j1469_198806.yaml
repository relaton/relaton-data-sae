    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This practice provides procedures and methods for testing service, spring applied parking and combination brake actuators with respect to durability, function and environmental performance. A minimum of five test units designated A, B, C, D and E are to be used to perform all tests per paragraphs &lt;span class="xref"&gt;2.1&lt;/span&gt; and &lt;span class="xref"&gt;2.2&lt;/span&gt;.&lt;/div&gt;

    &lt;/div&gt;</p>
