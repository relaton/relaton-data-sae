abstract:
- language: en
  script: Latn
  content: "<p>This report describes standard practices for corrosion  testing of
    metals in methanol fuels, lists ASTM procedures considered to be unaffected by
    gasoline- methanol fuel  mixtures, and includes test fuel recipies for metals
    testing. Resulting from a SAE Cooperative Research Project undertaken by representatives
    from GM, Chrysler, and Ford, this report includes standard practices for: laboratory
    immersion corrosion testing; vibratory cavitation  erosion-corrosion testing;
    preparation and use of  stress-corrosion test specimens; and conducting and  evaluating
    galvanic corrosion tests. Issued June 1992.</p>"
