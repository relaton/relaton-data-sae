  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This method is designed to evaluate the micropitting performance of currently available and future aviation turbine oil formulations. Drawing on previously performed tests documented in AIR6989, the method comprises of three rings rotating against a rotating central roller configuration using the standard, commercially available PCS Instruments Micropitting Rig (MPR). A test profile has been developed between industry and academia that relies on standard, commercially available test specimens.&lt;/div&gt;&lt;/div&gt;</p>
