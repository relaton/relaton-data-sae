  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to all self-propelled machines with a gross vehicle mass greater than 5000 kg that are utilized to clean material from highways, parking lots, airfield runways, outside paved areas that are principally exposed to vehicular traffic. These machines can also be involved with road construction or repaving work. Primary methods for material removal and cleaning can be by mechanical, pneumatic, washing and flushing systems, or in a combination of any system.&lt;/div&gt;
    &lt;/div&gt;</p>
