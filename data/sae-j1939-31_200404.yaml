  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This series of SAE Recommended Practices was developed to provide an open interconnect system for on-board electronic systems. It is the intention of these documents to allow electronic devices to communicate with each other by providing a standard architecture. This particular document describes the Network Layer which defines the requirements and services needed for the electronic devices (Network Interconnection ECUs) providing intercommunications between different segments of the SAE J1939 Vehicle Network. It also defines the various types of Network Interconnection ECUs and the functions they provide. The information in this document applies only to ECUs that are intended to provide networking services. It is not necessary for an ECU to provide any of these services in order to be compliant with the SAE J1939 protocol.&lt;/div&gt;&lt;/div&gt;</p>
