  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this standard is to define and provide for the control of colors employed in motor vehicle external lighting equipment. The specification applies to the overall effective color of light emitted by the device and not to the color of the light from a small area of the lens. It does not apply to any pilot, indicator, or tell-tale lights.&lt;/div&gt;&lt;/div&gt;</p>
