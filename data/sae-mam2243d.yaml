abstract:
- language: en
  script: Latn
  content: "<p>This specification covers manufacturing tolerances applicable to seamless
    and welded tubing of corrosion and heat resistant steel ordered to metric dimension.
    These tolerances apply to all conditions and are based on individual measurements,
    unless otherwise noted. Tubing may be specified by two dimensions only (OD and
    wall thickness, ID and wall thickness, or OD and ID).</p>"
