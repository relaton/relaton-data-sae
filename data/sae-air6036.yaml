  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Currently, existing civil aviation standards address the design and certification of oxygen dispensing devices that utilize oxygen sources supplying at least 99.5% oxygen. This Aerospace Information Report discusses issues relating to the use in the passenger cabin of oxygen enriched breathing gas mixtures having an oxygen content of less than 99.5% and describes one method of showing that passenger oxygen dispensing devices provide suitable hypoxia protection when used with such mixtures.&lt;/div&gt;
    &lt;/div&gt;</p>
