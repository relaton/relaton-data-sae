  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) discusses past and present approaches for monitoring the landing gear structure and shock absorber, methods for transient overload detection, techniques for measuring the forces seen by the landing gear structure, and methods for determining the fatigue state of the landing gear structure. This AIR covers the landing gear structure and shock absorber. It does not include the landing gear systems or landing gear wheels, tires and brakes. Landing gear tire condition and pressure monitoring are detailed in AIR4830 and ARP6137, respectively.&lt;/div&gt;&lt;/div&gt;</p>
