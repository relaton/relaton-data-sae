    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) is intended to establish recommended installation torque value limits and test criteria for machined flared and flareless hose and tube end fitting connections. Assembly of bite-type MS21922 flareless sleeves is not included in this ARP (see MIL-F-18280).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP is applicable to two types of connections and two basic material classifications.&lt;/div&gt;
    &lt;/div&gt;</p>
