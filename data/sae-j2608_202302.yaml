  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes a uniform test procedure and performance requirements for off throttle steering and obstacle avoidance capabilities of personal watercraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Personal watercrafts intended to be operated by a single operator who either stands or kneels in a tray located behind a moveable handlepole are exempted from this SAE Standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard does not apply to outboard powered personal watercraft and jet powered surfboards.&lt;/div&gt;&lt;/div&gt;</p>
