  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to wheel and crawler loaders when equipped with log or material handling forks without vertical masts, taking only hydraulic lift capacity and operating stability into consideration.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recognized that specific operating conditions may allow larger, or require smaller loads than the rated operating load. Some conditions would require more careful or restricted operation with the rated operating load. This practice is not to be construed as setting up test procedures or conditions.&lt;/div&gt;
    &lt;/div&gt;</p>
