    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) presents flexure fatigue strength of tube fitting joints in the form of graphs showing applied deflection D and total calculated axial stress S versus number of cycles to failure N. The graphs have been prepared from data obtained by actual testing conducted in accordance with ARP1185.&lt;/div&gt;
