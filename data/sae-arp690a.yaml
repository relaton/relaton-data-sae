  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The thermocouple design recommended herein is presented as one for which the correction to the observed emf, because of thermal conduction along the stem and wires, is within the limits presented in the accompanying figure. On referring to the figure, it is seen that no restriction is placed upon the diameter of the thermocouple or stem, and the longitudinal dimensions are expressed in terms of wire and stem diameters. The type of stem, such as packed ceramic stock, refractory insulating tubing, etc., also is left open to choice. Thus the sizes of wires and supporting stems may be varied over wide ranges to match particular requirements where conduction errors are to be limited or controlled.&lt;/div&gt;&lt;/div&gt;</p>
