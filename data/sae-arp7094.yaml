  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this ARP is as follows:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Use of M&amp;amp;S for type certification of the Advanced Air Mobility (AAM) aircraft, product, or system. However, this does not preclude this ARP being used for certification of other aircraft types and associated products and systems.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP is not applicable to flight simulation training device (FSTD) qualifications or pilot certification. If a qualified FSTD is proposed for aircraft, product, or system certification, it must demonstrate sufficient M&amp;amp;S substantiation to meet the related requirement.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Structural design and modeling are not addressed by this document.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;EMI/EMC certification is not addressed by this document.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
