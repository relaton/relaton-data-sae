  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification and a detail pump specification establish the requirements for variable flow hydraulic pumps, for use in aircraft hydraulic systems conforming to and as defined in MIL-H-5440 and MIL-H-8891, as applicable. The general requirements for type I and type II hydraulic systems pumps are specified in MIL-H-8775 and for type III system pumps in MIL-H-8890.&lt;/div&gt;&lt;/div&gt;</p>
