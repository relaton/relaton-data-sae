abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides guidance concerning the maintenance and serviceability of oxygen cylinders beginning with the quality of oxygen that is required, supplemental oxygen information, handling and cleaning procedures, transfilling, and marking of serviced oxygen assemblies. This document attempts to outline in a logical sequence oxygen quality, serviceability, and maintenance of oxygen cylinders. Content of this document can also be used for refilling oxygen cylinders while installed on aircraft, directly or through an intermediate charging port.&lt;/div&gt;&lt;/div&gt;</p>
