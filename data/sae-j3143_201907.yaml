  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of SAE J3143 will cover non-metallic line assemblies intended for containing and circulating lubricant (PAG, POE compressor oils), liquid, and gaseous R-134a, R-152a, or R-1234yf refrigerant in automotive air-conditioning systems. SAE J3143 will also provide the necessary hose permeation values used in SAE J2727 mobile air-conditioning system refrigerant emission charts. The assembly shall be designed to minimize permeation of the refrigerant, contamination of the system, and to be functional over a temperature range of -30 to 125 °C. Specific construction details are to be agreed upon between user and supplier. &lt;span class="xref"&gt;Figure 1&lt;/span&gt; shows a typical A/C system with TXV.&lt;/div&gt;

    &lt;/div&gt;</p>
