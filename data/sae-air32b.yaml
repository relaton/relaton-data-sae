  content: |-
    <p>INTRODUCTION

    This report is intended to encourage more effort to be directed toWard improving
    the pilot's visibility from the cockpit of transport type aircraft wih the
    ultimate objective of improving safety.
    In the preparation of this Aeronautical Information Report, consideration Was
    given to pilot surveys made by the Civil Aeronautics Administration, studies made
    by manufacturers, and a review of the cockpit visibility provided in present day
    transport aircraf`t.
    It is recognized that a rigid specification is undesirable and may restrict development
    and utilization of initiative. For this reason the report is in general terms and
    offered as a guide.</p>
