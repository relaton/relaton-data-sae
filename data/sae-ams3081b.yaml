abstract:
- language: en
  script: Latn
  content: <p>This specification covers the engineering requirements for producing
    a graphite-varnish coating on parts.  Primarily for dry lubricant applications
    up to 350F degrees (175C degrees) and anti-scuffing or anti-seize applications
    up to 900F degrees (480C degrees).  This specification has been declared "Noncurrent"
    by the Aerospace Materials Division, SAE, as of April 31, 1987.  It is recommended
    that this specification not be specified for new designs.</p>
