  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is to be used as a guide in preparing specifications for maintenance and inspection of acme screw assemblies used in driven linear actuators. It is intended to cover Acme screw assemblies driven by electric, hydraulic, pneumatic, manual means, with or without gear case or speed reduction systems, and micro actuators.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Though the Acme screw is the most common thread form for sliding contact jackscrews this guideline is equally applicable to other sliding contact thread forms such as buttress, square, stub acme, and others including custom thread forms. The term Acme shall be used generally to address all sliding contact thread forms.&lt;/div&gt;

    &lt;/div&gt;</p>
