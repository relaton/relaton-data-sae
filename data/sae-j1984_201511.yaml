abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This document specifies the dimensional requirements necessary for the mounting and interchangeability of a type of fuel injector used in diesel engines.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Field of Application&lt;/b&gt; This document applies to a clamp-mounted fuel injector of an integral nozzle and nozzle holder design with a 9.5 mm (nominal) holder shank diameter and a 5.5 mm (nominal) nozzle body tip diameter and deals with the interface between the injector and the engine. The internal construction of the injector remains optional with the manufacturer.&lt;/p&gt;</p>
