  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends minimum requirements for antiskid brake control to provide total aircraft systems compatibility. Design and operational goals, general theory, and functions, which should be considered by the aircraft brake system engineer to attain the most effective skid control performance, are covered in detail. Methods of determining and evaluating antiskid system performance are discussed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While this document specifically addresses antiskid systems which are a part of a hydraulically actuated brake system, the recommended practices are equally applicable to brakes actuated by other means, such as electrically actuated brakes.&lt;/div&gt;
    &lt;/div&gt;</p>
