    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Information Report is to provide general information relative to the nature and use of infrared techniques for nondestructive testing. The document is not intended to provide detailed technical information, but will serve as an introduction to the theory and capabilities of infrared testing and as a guide to more extensive references.&lt;/div&gt;&lt;/div&gt;</p>
