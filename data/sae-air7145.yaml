  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR is limited to the testing of an extra-high strength copper alloy and benchmark conductors utilizing the test protocol of AS6324. All samples are 19 strand unilay conductors per AS29606 at 24 or 26 AWG, either nickel or silver coated. At 24 AWG, extra-high strength copper alloy is compared to high strength copper alloy conductors. At 26 AWG, extra-high strength copper alloy is compared to high strength copper alloy and ultrahigh strength copper alloy conductors.&lt;/div&gt;
    &lt;/div&gt;</p>
