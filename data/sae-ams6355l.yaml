abstract:
- language: en
  script: Latn
  content: "<p>This specification covers an aircraft-quality, low-alloy steel in the form of sheet, strip, and plate.  Primarily for use where welding and moderate mechanical properties are required.  Sheet and strip are extensively used where minimum tensile strength of 160,000 psi (1105 MPa) is required in sections up to 0.125 in. (3.12 mm) thick and proportionately lower strength in heavier thicknesses.</p>"
