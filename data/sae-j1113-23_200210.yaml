abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Recommended Practice covers the recommended testing  techniques for the determination of electric field immunity of an automotive electronic device. This technique uses a strip line{sup}1 from 10 kHz to 200 MHz and is limited to exposing the harnesses (and/or devices) which have a maximum height of equal to or less than 1/3 the strip line height.

    When J1113-23 was released in 1995, a note was included in the scope regarding the expected life of the document which stated: "This method is being replaced by the Tri-plate Line (SAE J1113-25) which is considered to be a superior method.  It will be retained for historical purposes for a period of five years where upon it will be considered to be withdrawn."

    The committee decided in August 2001 to ballot this document for cancellation.</p>
