    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The information in this SAE Recommended Practice has been compiled by Technical Committee 1 (Engine Lubrication) of the SAE Fuels and Lubricants Division. The intent is to provide those concerned with the design and maintenance of two-stroke-cycle engines with a better understanding of the properties of two-stroke-cycle lubricants. Reference is also made to test procedures which may be used to measure the chemical and physical characteristics of these lubricants.&lt;/div&gt;&lt;/div&gt;</p>
