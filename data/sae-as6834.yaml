  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to provide detailed requirements to preclude the acquisition and use of suspect counterfeit or counterfeit bearings and/or bearing components/materiel.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The term bearings referenced throughout this document includes bearings and/or bearing components/materiel (e.g., balls, races, lubricant, cage, seal).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this document supplement the requirements of a higher-level quality standard (e.g., AS/EN/JISQ9100, ISO 9001, ANSI/ASQ E4, ASME NQA-1, AS9120, AS9003, and IATF 16949 or equivalent) and other quality management system documents.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All appendices are provided for guidance and are not mandatory.&lt;/div&gt;&lt;/div&gt;</p>
