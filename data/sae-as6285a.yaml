  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the minimum requirements for ground based aircraft deicing/anti-icing methods and procedures to ensure the safe operation of aircraft during icing conditions on the ground. This document does not specify the requirements for particular aircraft models.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;The application of the procedures specified in this document are intended to effectively remove and/or prevent the accumulation of frost, snow, slush, or ice contamination which can seriously affect the aerodynamic performance and/or the controllability of an aircraft. The principal method of treatment employed is the use of fluids qualified to AMS1424 (Type I fluid) and AMS1428 (Type II, III, and IV fluids).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All guidelines referred to herein are applicable only in conjunction with the applicable documents. Due to aerodynamic and other concerns, the application of deicing/anti-icing fluids shall be carried out in compliance with engine and aircraft manufacturer's recommendations.&lt;/div&gt;&lt;/div&gt;</p>
