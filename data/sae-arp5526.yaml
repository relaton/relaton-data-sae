    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The goal of this SAE Aerospace Recommended Practice (ARP) is to promote a common understanding of terms, compliance issues and design criteria in order to facilitate certification of seat installations in an aircraft. This document does not specify specific designs or design methods for such certification.&lt;/div&gt;&lt;/div&gt;</p>
