  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes minimum tolerance requirements for pilot operated and mechanically actuated modulating type valves, and through type valves used in the service brake control system when tested in accordance with the test procedure outlined in SAE J1859. This document applies to the nominal input-output characteristics as specified by vehicle original equipment manufacturer and labeled by the valve manufacturer as outlined in SAE J1860. The tolerance requirements will include:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Crack (opening) pressure or force. Crack pressure may be measured at the initial output pressure or as the pressure differential before output pressure exceeds 14 kPa (2 psi). Crack force may be measured at initial output pressure or before output pressure exceeds 14 kPa (2 psi).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Pressure differential (input-output)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;/div&gt;</p>
