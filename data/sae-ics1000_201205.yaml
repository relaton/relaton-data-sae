  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies the format, content and parameters for a product identification numbering system for &lt;b&gt;off-road recreation vehicles&lt;/b&gt;, based on the PIN structure for earth-moving machinery in ISO 10261:2002E and is not applicable to the identification of components or attachments. This standard applies only to the off-road recreation vehicle industry and does not impose parameters for the marine, lawn and garden, silviculture, husbandry, construction or earth moving sectors.&lt;/div&gt;&lt;/div&gt;</p>
