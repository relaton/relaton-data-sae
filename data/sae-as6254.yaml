  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers ULDs utilized in finding submerged aircraft. Such ULDs are installed within the aircraft in a manner that they are unlikely to become separated during crash conditions. The low frequency ULD should be attached to the airframe in accordance with the manufacturer’s recommendations in order to maximize the underwater detection range.&lt;/div&gt;
    &lt;/div&gt;</p>
