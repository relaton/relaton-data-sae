abstract:
- language: en
  script: Latn
  content: |-
    <p>Nonmetallic flexible loom is recommended for use as an insulated covering giving mechanical protection over insulated wire, metal tubing, or other parts requiring a water-, oil-, and acid-proof covering  resistant to fire or abrasion. It is also recommended for use as a covering for copper or other metal tubing to prevent crystallization and to eliminate rattles.

    The rationale for cancellation is that it's been rendered obsolete by J2192 and is no longer necessary-6/1/2005</p>
