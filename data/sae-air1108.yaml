  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Groove designs presented herein are applicable for use with machined or formed metal seals which are similar in configuration to those shown in &lt;span class="xref"&gt;figure 3&lt;/span&gt;, which operate under internal pressure or in vacuum service and which have been specifically qualified or recommended by the purchaser or the manufacturer for use with this AIR. They are also applicable for use with metal o-rings (e.g., MS9142, MS202 thru MS9205) where interchangeability with machined or formed metal seals is desired. For metal o-ring groove designs where inter-changeability is not a requirement refer to ARP 674.&lt;/div&gt;&lt;/div&gt;</p>
