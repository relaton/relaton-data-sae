    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the minimum standard requirements for message boards (MBs) at designated deicing facilities.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The design of aircraft deicing facilities is covered by ARP4902.&lt;/div&gt;
