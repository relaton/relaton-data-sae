    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report represents an information report on a conceptual ITS architecture and its accompanying protocols from the perspective of Advanced Traveller Information Systems providers and users. While a specific logical and physical architecture for ITS is still in the development stages, this conceptual architecture provides a robust general view of ITS functions and interfaces.&lt;/div&gt;&lt;/div&gt;</p>
