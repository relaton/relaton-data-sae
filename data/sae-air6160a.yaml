abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides informational background, rationale and a technical case to allow consideration of the removal of the magnesium alloy restriction in aircraft seat construction as contained in AS8049B. The foundation of this argument is flammability characterization work performed by the FAA at the William J. Hughes Technical Center (FAATC), Fire Safety Branch in Atlantic City, New Jersey, USA. The rationale and detailed testing results are presented along with flammability reports that have concluded that the use of specific types of magnesium alloys in aircraft seat construction does not increase the hazard level potential in the passenger cabin in a post-crash fire scenario. Further, the FAA has developed a lab scale test method, reference DOT/FAA/TC-13/52, to be used as a certification test, or method of compliance (MOC) to allow acceptability of the use of magnesium in the governing TSO-C127 and TSO-C39C.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Other flammability studies are also cited in the AIR document to substantiate the FAA findings.&lt;/div&gt;&lt;/div&gt;</p>
