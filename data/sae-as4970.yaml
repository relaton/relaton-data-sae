  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides a method for protecting the navigable airspace around airports from unwanted laser illuminations and a procedure for proponents to seek approval from regulatory agencies for operations of various classes of laser devices and their applications within this volume of airspace. This document also provides a system of data disclosure deemed necessary for a regulatory agency to determine the potential safety effect of proposed outdoor laser activities upon flight operations within the defined airspace.&lt;/div&gt;
    &lt;/div&gt;</p>
