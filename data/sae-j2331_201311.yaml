abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard specifies a stationary test method for determining
    and documenting the masking effect caused by parts of the base machine with equipment
    as specified by the manufacturer within a visibility test circle around the eye
    position of a seated operator. It applies to earthmoving machinery which has a
    specific seated operator’s position.</p>"
