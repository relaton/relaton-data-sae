    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Because of the special circumstances under which these tests were conducted, it is necessary to carefully define the limitations on the validity of the results. The measurements and the comparisons reported here apply only to the specific locations of the noise sources and microphones and only for the specific weather and ground-surface conditions existing at the time of the tests. It cannot be assumed that these conditions are representative of most field measurements of aircraft exterior noise.&lt;/div&gt;&lt;/div&gt;</p>
