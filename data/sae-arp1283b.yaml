    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes design guidance and photometric values for adequate cargo compartment and cargo access lighting systems for ground handling. The adoption of a standard set of illuminance values, found appropriate for the performance of the task in specified areas should expedite ground handling.&lt;/div&gt;&lt;/div&gt;</p>
