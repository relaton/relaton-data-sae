abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure measures the resistance to radiant heat flow of insulating materials in sleeve, tubing, or tape (collectively referred to as “sleeve”) form. The sleeve’s effectiveness (S&lt;sub&gt;E&lt;/sub&gt;) is determined by measuring the difference in surface temperature of a flat black, single-diameter ceramic cylinder with and without the standard diameter sleeve at the specified temperature, position, and distance from the radiant heat source.&lt;/div&gt;



    &lt;/div&gt;</p>
