    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the design and application of primary on-board wiring distribution system harnesses to road vehicles. This document applies to any wiring system which contains one or more circuits operating between 50 V DC or AC RMS and 600 V DC or AC RMS excluding automotive ignition cable.&lt;/div&gt;&lt;/div&gt;</p>
