  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is a collection of comments on topics relevant to AMS powder feedstock production and procurement. In some instances, it provides explanation of characteristics not controlled in AMS-AM powder feedstock specifications and the rationale for exclusion (e.g., limitation of applicability or maturity of standardized inspection techniques). In other cases, it provides additional context on the reason for structuring requirements in AMS documents one way instead of other available options.&lt;/div&gt;&lt;/div&gt;</p>
