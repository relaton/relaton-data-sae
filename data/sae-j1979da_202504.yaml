abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;The SAE J1979 document set includes the communication between the vehicle's On-Board Diagnostic (OBD) systems and test equipment implemented across vehicles within the scope of regulated emissions and propulsion related OBD. The SAE J1979 Digital Annex supplements the J1979 base documents primarily by maintaining a global registry of regulated emissions and propulsion related data identifiers.&lt;/p&gt;</p>"
