  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard describes test methods for insulated, single conductor, electric wire intended for aerospace applications. Particular requirements for the wire being tested need to be specified in a procurement document or other detail specification. Suggested minimum requirements are included in the notes at the end of some of the test methods. SAE Performance Standard AS4372 uses some of the tests in this document for evaluating comparative performance of aerospace wires.&lt;/div&gt;

    &lt;/div&gt;</p>
