  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes head position contours and procedures for locating the contours in a vehicle. Head position contours are useful in establishing accommodation requirements for head space and are required for several measures defined in SAE J1100. Separate contours are defined depending on occupant seat location and the desired percentage (95 and 99) of occupant accommodation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is primarily focused on application to Class A vehicles (see SAE J1100), which include most personal-use vehicles (passenger cars, sport utility vehicles, pick-up trucks). A procedure for use in Class B vehicles can be found in &lt;span class="xref"&gt;Appendix B&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
