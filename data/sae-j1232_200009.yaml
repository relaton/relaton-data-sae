  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to set up a guide as to body, frame, and wheelhouse clearances required to accommodate tire traction devices (e.g., tire chains), and to provide a means of classifying these devices according to their maximum profile. In addition, it enables the vehicle manufacturer to specify the proper traction devices for each vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This report is intended to apply to passenger cars and light trucks up to 4535 kg (10 001 lb) GVW. This document is not to be construed as approving traction device operation at conditions exceeding manufacturer's specifications, although short periods of such operations may be required for test purposes.&lt;/div&gt;&lt;/div&gt;</p>
