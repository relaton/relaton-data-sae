  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this ARP is to identify selected electrical connectors, their general application characteristics, and associated configuration options recommended for new design, repair, and retrofit purposes (see &lt;span class="xref"&gt;6.1&lt;/span&gt;). It is acknowledged that those connectors listed herein will not completely satisfy all aerospace vehicle and equipment requirements but optimization of the use of these components will facilitate standardization in the form of maximum utilization of a minimum variety of connectors.&lt;/div&gt;&lt;/div&gt;</p>
