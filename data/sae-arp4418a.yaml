  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Aircraft propulsion engine and APU manufacturers shall demonstrate that air provided to the aircraft cabin is of acceptable quality. This ARP provides the basic information required to perform an engine bleed air quality certification test. This document provides the recommended levels and describes the measurement procedures required for the quantification of gaseous and particulate contaminants, which may be present in aircraft engine bleed air.&lt;/div&gt;
    &lt;/div&gt;</p>
