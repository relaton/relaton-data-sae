abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document collates the ways and means that existing sensors can identify the platform’s exposure to volcanic ash. The capabilities include real-time detection and estimation, and post flight determinations of exposure and intensity. The document includes results of initiatives with the Federal Aviation Administration (FAA), the European Aviation Safety Agency (EASA), the International Civil Aviation Organization (ICAO), Transport Canada, various research organizations, Industry and other subject matter experts. The document illustrates the ways that an aircraft can use existing sensors to act as health monitoring tools so as to assess the operational and maintenance effects related to volcanic ash incidents and possibly help determine what remedial action to take after encountering a volcanic ash (VA) event. Finally, the document provides insight into emerging technologies and capabilities that have been specifically pursued to detect volcanic ash encounters but are not yet a part of an airplane’s standard fit.&lt;/div&gt;
    &lt;/div&gt;</p>
