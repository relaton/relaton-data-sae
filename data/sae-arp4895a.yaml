  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides an algorithm aimed to analyse flight control surface actuator movements with the objective to generate duty cycle data applicable to hydraulic actuator dynamic seals.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This algorithm can be used to process digitally recorded actuator positions, generated either by pure simulation, or hardware-in-the-loop simulation, or flight test of full scale demonstrator of new aircraft, of new aircraft models in development, or of in-service aircraft, depending on what is available at different stages of the aircraft development and the purpose of the duty cycle investigation. This generated duty cycle data can be used as a basis for defining dynamic seal life requirements, dynamic seal life testing, or to assess the impact of control law or other changes to dynamic seal behavior.&lt;/div&gt;&lt;/div&gt;</p>
