abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice describes the performance requirements
    for abrasion resistance of webbing when used in adjustment hardware normally used
    to adjust the length of seat belt assemblies such as those described in SAE J140.
    These requirements are applicable to tests conducted according to the procedure
    described in SAE J339. Although adjustment hardware is normally the primary source
    of webbing abrasion in a seat belt assembly, consideration should be given to
    other areas of  normal webbing contact in the restraint system that may provide
    a more severe condition of webbing abrasion.</p>"
