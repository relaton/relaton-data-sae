    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice defines a method for determining the weldability of weld filler metal in continuous coil or cut length form. It is applicable to all solid (non flux-containing) wires. It is intended as a referee method for testing weld filler metals in case of dispute between purchaser and vendor.&lt;/div&gt;
