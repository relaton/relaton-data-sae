abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This Information Report relates to a special class of automotive adaptive equipment which consists of
    modifications to the power brake booster systems provided as original equipment of motor vehicles. These modifications are generically called "Reduced Effort Power Brakes" (REPB) The purpose of the
    modification is to lower the amount of driver effort required to apply the brakes. Retention of reliability,
    ease of use and maintainability for disabled drivers, passengers, and the general public is of primary
    concern. Reduced Effort Power Brake modifications should be qualified by the tests referenced in the
    Recommended Test Procedure. The tests set forth in that procedure should be applied, and failure of a
    Reduced Effort Power Brake modification to meet those tests should disqualify the modification from the
    claim of meeting the specifications of this Information Report. Because this is an Information Report, the
    numerical values for performance measurements presented in this report and in the accompanying Test
    Procedure, while based upon the best knowledge available at the time, have not been validated by a
    testing of the Test Procedure.&lt;/p&gt;</p>
