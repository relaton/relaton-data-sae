    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The static laboratory test will test the adequacy of the structures used to protect the operator during the following operation: Vehicle operating 0-10 mph over hard clay where roll-over would be limited to 360 deg down a slope of 30 deg maximum.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This criteria applies to graders classified as construction equipment.&lt;/div&gt;&lt;/div&gt;</p>
