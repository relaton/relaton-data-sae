  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the dimensional and operational requirements for pallet extension devices. It provides support for items of cargo beyond either the short or the long sides of a pallet, allowing increased volume to be achieved in conjunction with pallets meeting the requirements of AS1491 plus additional pallet sizes usable with extensions.&lt;/div&gt;

    &lt;/div&gt;</p>
