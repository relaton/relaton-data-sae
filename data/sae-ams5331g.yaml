    <p>&lt;p&gt;This specification has been declared "NONCURRENT" by the Aerospace Materials Division, SAE, as of September 1996. It is recommended, therefore, that this specification not be specified for new designs.&lt;/p&gt;
    &lt;p&gt;This specification covers a low-alloy steel in the form of sand castings. Primarily for cast parts requiring heat treatment to minimum yield strengths up to 180,000 psi (1240 MPa).&lt;/p&gt;</p>
