abstract:
- language: en
  script: Latn
  content: "<p>The purpose of these recommendations is to provide a guide to designers
    and users of electric equipment for the use of taper pins designed to make electrical
    connections. These recommendations cover the use of taper pins in taper pin terminal
    blocks, multi-contact electric connectors, and components designed to accept taper
    pins. Taper pins are intended to facilitate terminations of a wire and are not
    to be employed as a quick-disconnect device.</p>"
