  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The devices of this SAE Standard provide the means by which passenger compartment dimensions can be obtained using a deflected seat rather than a free seat contour as a reference for defining seating space. All definitions and dimensions used in conjunction with this document are described in SAE J1100. The devices described in this document are intended for applications concerning seated driver side or center occupant accommodation spaces only and are not to be construed as instruments which measure or indicate occupant capabilities or comfort. This document covers only one H-Point machine installed on a seat during each test. Certified H-Point templates and machines can be purchased from:&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Specific procedures are included in &lt;span class="xref"&gt;Appendix A&lt;/span&gt; for second seat measurements in short-coupled vehicles and in &lt;span class="xref"&gt;Appendix B&lt;/span&gt; for driver seat measurement of Cushion Angle.&lt;/div&gt;
    &lt;/div&gt;</p>
