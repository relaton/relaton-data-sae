    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines safety requirements relating to the elements of design, operation, and maintenance of light utility vehicles. The safety specifications in this document apply to any self-propelled, operator-controlled, off-highway vehicle 1828 mm (72 in) or less in overall width, exclusive of added accessories and attachments, operable on three or more wheels, primarily intended to transport material loads or people, with a gross vehicle weight of 2268 kg (5000 lb) or less, and a maximum design speed less than 40 km/h (25 mph).&lt;/div&gt;
    &lt;/div&gt;</p>
