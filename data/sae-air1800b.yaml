  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) covers the field of civilian, commercial and military airplanes and helicopters. This summary of tail bumper design approaches may be used by design personnel as a reference and guide for future airplanes and helicopters that require tail bumpers. Those described herein will consist of simple rub strips, structural loops with a wear surface for runway contact, retractable installations with replaceable shock absorbers and wear surfaces and complicated retractable tail landing gears with shock strut, wheels and tires. The information will be presented as a general description of the installation, its components and their functions.&lt;/div&gt;
    &lt;/div&gt;</p>
