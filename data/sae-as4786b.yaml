  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers variable speed, reversible battery powered drills with removable, rechargeable battery pack and either 3/8 inch or ½ inch chuck used for general maintenance and construction where a battery powered tool is required. This document also satisfies EMI requirements for driver drills, where EMI suppression is required by the purchaser.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document may involve hazardous materials, operations, or equipment and does not purport to address all of the safety considerations associated. It is the responsibility of the user of a piece of equipment to establish appropriate safety and health practices and to determine the applicability of regulatory limitations prior to its use. Users are cautioned to read all manufacturer’s instructions prior to use.&lt;/div&gt;
    &lt;/div&gt;</p>
