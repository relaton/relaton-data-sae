  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the minimum requirements for nonmetallic tubing as manufactured for use in gasoline or diesel fuel systems. It is not intended to cover tubing for any portion of the system which operates below -40 °C, above 115 °C, or above a maximum working gage pressure of 690 kPa.&lt;/div&gt;&lt;/div&gt;</p>
