    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers oxygen masks and breathing valves used with both panel mounted and mask mounted demand and pressure-demand oxygen regulators. Mask mounted oxygen regulators are covered under other standards, but when the mask mounted regulator incorporates an integral exhalation valve, the performance of this valve shall meet the requirements of this standard.&lt;/div&gt;&lt;/div&gt;</p>
