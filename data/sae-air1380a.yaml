  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The static mechanical stiffness properties of aircraft tires are fundamental to any computation of wheel and landing gear shimmy characteristics, and are important guides in anti-skid system and aircraft wheel design. While the mechanical stiffness properties of aircraft tires are frequency sensitive, the static or low frequency values are important because they are the ones most easily obtained by laboratory testing and are most commonly found in literature.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following recommended methods for measurement of such properties are believed to represent practices which will give reliable and repeatable measurements, either at one facility or among different facilities, using equipment which is commonly available in most tire testing installations.&lt;/div&gt;&lt;/div&gt;</p>
