    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification, in conjunction with the general requirements for steel heat treatment covered in AMS 2759, establishes the requirements for heat treatment of low-alloy steel parts to minimum ultimate tensile strengths of 220 ksi (1517 MPa) and higher. Parts are defined in AMS 2759.&lt;/div&gt;&lt;/div&gt;</p>
