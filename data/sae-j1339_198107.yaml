  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The testing technique outlined in this SAE Recommended Practice was developed as part of an overall program for testing and evaluating fuel consumption of heavy-duty trucks and buses. The technique outlined in this recommended practice provides a general description of the type of equipment and facility which is necessary to determine the power consumption of these engine-driven components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recommended that the specific operating condition suggested throughout the test be carefully reviewed on the basis of actual data obtained on the specific vehicle operation and the fan.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Because of the variation in size, shape, configuration, and mountings available in cooling fans, specific test devices have not been included.&lt;/div&gt;&lt;/div&gt;</p>
