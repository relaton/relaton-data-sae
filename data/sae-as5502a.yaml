    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes standard requirements for aerospace sealants, which may be incorporated as part of Aerospace Material Specifications (AMS) for such products. This document provides for commonality of methods and procedures for responsibility for inspection, source inspection, classification of tests, establishment of/and qualification to qualified products lists, approval, reports, resampling and retesting, packaging, and marking.&lt;/div&gt;
    &lt;/div&gt;</p>
