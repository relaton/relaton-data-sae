  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers specifications and performance requirements for 37° and 45° single and double flares for tube ends intended for use with SAE J512, SAE J513, SAE J514, and ISO 8434-2 connectors. The flares described in this document are intended for use with SAE metallic tube materials. Considerations such as the effects of wall thickness selection for specific working pressures, identifying appropriate length of thread engagements for specific applications with mating connectors and other associated criteria, shall be the responsibility of the user. For applicable nominal reference working pressures for hydraulic tubing, see SAE J1065 and ISO 10763.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In an effort to standardize within a global marketplace and ensuring that companies can remain competitive in an international market, it is the intent of this document to promote the use of metric tube and connector sizes which will:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;lead to one global system;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;guide users to a preferred system;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;reduce complexity;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;eliminate inventory duplications.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;</p>
