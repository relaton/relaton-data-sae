  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report establishes a set of “Utility Factor” (UF) curves and the method for generating these curves. The UF is used when combining test results from battery charge-depleting and charge-sustaining modes of a Plug-in Hybrid Electric Vehicle (PHEV). Although any transportation survey data set can be used, this document will define the included UF curves by using the 2001 United States Department of Transportation (DOT) “National Household Travel Survey” and a supplementary dataset.&lt;/div&gt;
    &lt;/div&gt;</p>
