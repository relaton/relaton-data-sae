  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The greases have been classified according to the operating conditions under which they are used, because the versatile nature of greases makes it impractical to classify them according to end use. It will therefore be necessary to consult the supplier to be certain that the grease can be used in, for example, rolling bearings or pumped supply systems, and also concerning the compatibility of products (see Remarks in &lt;span class="xref"&gt;Table 1&lt;/span&gt;).&lt;/div&gt;

    &lt;/div&gt;</p>
