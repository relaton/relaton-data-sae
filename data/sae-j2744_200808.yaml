  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document presents the requirements for a built-in service port to be used in vehicles intended to comply with Enhanced Evaporative Emissions Requirements. The primary function of the Service Port (Valve Assembly-Evaporative Emission Canister Purge Harness Service) is to provide non-destructive access to the evaporative emissions system to enable testing of the integrity of the system. The Service Port is used to introduce air pressure or fuel vapors into, or evacuates them out of, the system. This access may be used for the following evaluations:
    &lt;div class="table-wrap anchor " id="tu1-J2744_200808"&gt;
    &lt;div class="table-container"&gt;&lt;table class="br-none tbr-void " data-dataset-id=""&gt;
    &lt;tbody&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• Evaporative System Certifications&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Canister Loading and Purging&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• End-of-line Testing&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;System Integrity&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• Service (e.g. OBD MIL on)&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Leak Location and Repair Verification&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• In-Use Compliance Testing&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Canister Loading and Purging&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• Inspection/Maintenance Testing&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;System Integrity and Purge Check&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div/&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;/div&gt;</p>
