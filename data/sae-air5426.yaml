  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) includes the selection, installation, inspection, and maintenance of tube fittings and tube fitting assemblies used in aerospace plumbing applications. The user must determine the suitability of selected designs to meet the performance requirements of the system for which it is intended to be installed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Only fittings for which industry or government standards have been published are described in &lt;span class="xref"&gt;Section 3&lt;/span&gt; of this Aerospace Information Report. A variety of these tube fittings are shown in AIR310. Illustrations of some non-published proprietary designs are shown in &lt;span class="xref"&gt;Section 7&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
