  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a titanium alloy in the form of bars, wire, forgings, flash-welded rings, and drawn shapes up through 10.000 inches (254.00 mm), inclusive, in diameter or least distance between parallel sides and stock of any size for forgings or flash-welded rings. Bar over 6.000 inches (152.40 mm) in nominal thickness has a maximum cross-sectional area of 288 square inches (1858 cm&lt;sup&gt;2&lt;/sup&gt;). Forgings and flash-welded rings with nominal thicknesses over 6.000 inches (152.40 mm) have a maximum cross-sectional area of 79 square inches (509 cm&lt;sup&gt;2&lt;/sup&gt;) (see &lt;span class="xref"&gt;8.6&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
