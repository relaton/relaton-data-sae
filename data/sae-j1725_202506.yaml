  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report applies to structural integrity, performance, drivability, and serviceability of personally licensed vehicles not exceeding 10000 pounds GVWR such as sedans, crossovers, SUVs, MPVs, light trucks, and van-type vehicles that are powered by gas and alternative fuel such as electric, plug-in hybrid, or hybrid technologies. It provides engineering direction to vehicle modifiers in a manner that does not limit innovation, and it specifies procedures for preparing vehicles to enhance safety during vehicle modifications. It further provides guidance and recommendations for the minimum acceptable design requirements and performance criteria on general and specific structural modifications, thereby allowing consumers and third-party payers the ability to obtain and purchase equipment that meets or exceeds the performance and safety of the OEM production vehicle.&lt;/div&gt;&lt;/div&gt;</p>
