abstract:
- language: en
  script: Latn
  content: "<p>This SAE Information Report deals exclusively with the determination
    of sulfur compounds in automotive exhaust. Engine operating cycles and interpretation
    of results are not covered. Methods described in detail are those that have been
    or are being used by various laboratories. None are specifically recommended as
    superior to others. Since intensive measurement of automotive sulfur compounds
    is a relatively new activity, methods and practices have changed rapidly. Some
    methods are more experimental than others and are so noted in the test.</p>"
