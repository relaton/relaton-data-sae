abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a process for use by ADHP integrators of EEE parts and subassemblies (items) that may have been targeted by part manufacturers for other applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This methodology allows for existing data, such as manufacturer qualification test results, in-service use, and system qualification test data, to meet the application requirement and to identify gaps in data that require additional testing or analysis.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document describes a process to define and accomplish application-specific qualifications that provide confidence to both the ADHP integrators and the integrators’ customers that the item will perform its function(s) reliably in the ADHP application. It does not describe specific tests to be conducted, sample sizes to be used, or results to be obtained.&lt;/div&gt;&lt;/div&gt;</p>
