  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers plain spherical bearings which are self-aligning and self-lubricating by utilizing polytetrafluoroethylene (PTFE in a fabric composite or molded material that is bonded to the inner diameter surface of the race and when specified, to the bore diameter surface of the ball. These bearings are for use in the temperature range -65 to +325 °F (-54 to +163 °C).&lt;/div&gt;&lt;/div&gt;</p>
