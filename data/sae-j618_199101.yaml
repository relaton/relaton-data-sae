  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to flywheels for dry spring-loaded clutches used on internal combustion engines. &lt;span class="xref"&gt;Figure 1&lt;/span&gt; and &lt;span class="xref"&gt;Tables 1&lt;/span&gt;, &lt;span class="xref"&gt;2&lt;/span&gt;, and &lt;span class="xref"&gt;3&lt;/span&gt; report information currently used in the industry. Clutches requiring other dimensions are also manufactured. Dimensions given are primarily for single-plate clutches. Flywheels for two plate clutches have the same dimensions if an adaptor for the intermediate plate and second driven disc is supplied with the clutch. If instead the flywheel is to be extended to adapt the intermediate plate and second driven member, consult the clutch manufacturer for the required J dimension and drive arrangements for the intermediate plate. See SAE J1806 for flywheels for size 14 and 15.5 two plate pull-type clutches.&lt;/div&gt;
    &lt;/div&gt;</p>
