  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) provides insights on how to perform a cost versus benefit (C/B) analysis (CBA) to determine the return on investment that would result from implementing an integrated health management (HM) system on an air vehicle. The word “integrated” refers to the combination or “roll up” of sub-systems health management tools to create a platform-centric system. This document describes the complexity of features that can be considered in the analysis and the different tools and approaches for conducting a CBA, and it differentiates between military and commercial applications. This document is intended to help those who might not have a deep technical understanding or familiarity with HM systems but want to either quantify or understand the economic benefits (i.e., the value proposition) that an HM system could provide. Prognostics is a capability within some HM systems that provides an estimation of remaining useful life (RUL) or time to failure and so prognostic health management (PHM) is used where this predictive element exists. IVHM refers to an integrated vehicle level system deployed on a fleet of platforms and might, but not necessarily, include predictive elements.&lt;/div&gt;

    &lt;/div&gt;</p>
