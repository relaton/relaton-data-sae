    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification relates to Synchros, 60 and 400 Hz. It is not complete in itself, but shall be used in conjunction with MIL-DTL-81963, in which the latter shall be recognized as forming an inherent part of this specification. This standard requires a Qualified Products List (see &lt;span class="xref"&gt;6.4&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
