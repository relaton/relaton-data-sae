    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides minimum performance requirements and uniform procedures for fatigue testing of ferrous disc wheels intended for normal highway use on passenger cars, light trucks, and multipurpose passenger vehicles. For procedures and minimum performance requirements for wheels used on medium and heavy trucks, see SAE J267. For wheels used on trailers drawn by passenger cars, light trucks, or multipurpose vehicles, see SAE J1204. Wheels intended for temporary use and nonferrous road wheels are not included in this document.&lt;/div&gt;&lt;/div&gt;</p>
