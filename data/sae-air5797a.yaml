  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) describes the current process for performing comparative wear testing on aircraft tires in a laboratory environment. This technique is applicable to both radial and bias tires, and is pertinent for all aircraft tire sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR describes a technique based upon “wear” energy. In this technique, side wear energy and drag wear energy are computed as the tire is run through a prescribed test program. The specifics that drive the test setup conditions are discussed in &lt;span class="xref"&gt;Sections 4&lt;/span&gt; through &lt;span class="xref"&gt;7&lt;/span&gt;. In general, the technique follows this process:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;A test profile is developed from measured mechanical property data of the tires under study.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Each tire is repeatedly run to the test profile until it is worn to the maximum wear limit (MWL). Several tires, typically 5 to 10, of each tire design are tested.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Wear energy is computed for each test cycle and then summed to determine total absorbed wear energy.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;An index is calculated for each tire design. This is accomplished by dividing the total linear inches of wear at the most worn point into the total wear energy.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The indexes are then normalized to provide a comparative wear rate.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;The described technique is not meant to provide an absolute wear rate or wear index because the technique does not produce results that allow the user to say a tire will last for a specific number of landings. However, it does provide a comparative index. It will make a distinction from one tire design to another by indicating a percentage difference in abrasive wear rate under representative operational conditions. The technique has been demonstrated in a number of test programs and is shown to have an extremely high correlation to field data. Supporting data is included in &lt;span class="xref"&gt;Section 9&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
