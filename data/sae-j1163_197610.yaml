  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice establishes procedures for determining seat location relative to basic datum points or planes on agricultural and construction machines. Alternate procedures are specified including an H-Point procedure to evaluate compliance with standards or regulations related to the H-Point, determined with the device specified in SAE J826b and a Seat Index Point (SIP) procedure to provide for use of a simplified device. When a specific procedure is not designated, the H-Point and SIP are equivalent and can be used interchangeably within normal measurement tolerances.&lt;/div&gt;&lt;/div&gt;</p>
