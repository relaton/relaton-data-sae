  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers helical coil stud locking screw thread inserts made from formed wire in which the inner surface of the coil, after assembly provides threads of standard Unified 60° form as specified on the assembly drawing. This standard also covers the performance requirements of the locking feature of the insert which will retain Unified (UN) or MIL-S-8879 (UNJ) external threaded parts.&lt;/div&gt;
    &lt;/div&gt;</p>
