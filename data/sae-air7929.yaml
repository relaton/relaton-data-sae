    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is limited to information about evaluation of a new cadmium-free high-strength copper alloy. The testing described in this AIR was conducted prior to the publication of AS6324 and is intended to provide information regarding evaluation of this new copper alloy. It is recognized that a simple specification such as AS29606 can not cover all possible requirements for performance in every field application. To address this basic issue, the introduction of a new, but similar to already field proven, component requires comparative testing to verify the new component will perform at the same or above level as the already approved component in a broader set of relevant tests.&lt;/div&gt;
    &lt;/div&gt;</p>
