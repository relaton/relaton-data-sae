abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Recommended Practice establishes the test procedures, environment, and instrumentation for determining the maximum exterior sound level of passenger cars, multipurpose vehicles, and light trucks having a gross vehicle mass (weight) rating of 4540 kg (10 000 lb) or less.

    This document is intended for use when the maximum sound generating capability of any applicable vehicle is to be measured.  The test procedure is characterized by having fixed terminal conditions (attainment of rated engine speed at a fixed end point on the test site) in contrast to the procedure of SAE J986 NOV81, Sound Level for Passenger Cars and Light Trucks, which has fixed initial conditions (specified initial vehicle speed at a fixed acceleration point on the test site).  Full-throttle acceleration and closed-throttle deceleration of the vehicle are included in both procedures.

    Sound levels determined in accordance with this document are essentially independent of transmission and final-drive ratios for a vehicle family having otherwise identical characteristics.  Thus, this document is particularly applicable to development testing of vehicle families or to test development where vehicle performance differences are to be minimized.</p>
