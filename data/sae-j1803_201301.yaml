    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a Glossary of Terms commonly used to describe Seat Belt Restraint Systems Hardware and their function. These terms are currently defined in various SAE Recommended Practices but are sometimes inconsistent. It is intended for this document to supersede the definitions found in separate SAE Recommended Practices.&lt;/div&gt;&lt;/div&gt;</p>
