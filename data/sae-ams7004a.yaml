  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers preforms fabricated up through 22.0 inches (560 mm), inclusive, in deposition width thickness (see &lt;span class="xref"&gt;2.4&lt;/span&gt;) using a wire-fed plasma arc directed energy deposition (PA-DED) additive-manufacturing process on a Ti-6Al-4V substrate that are subjected to post-deposition stress-relief heat treatment. If required by the cognizant engineering organization (CEO), preforms may require subsequent machining to meet requirements for their intended final part application.&lt;/div&gt;&lt;/div&gt;</p>
