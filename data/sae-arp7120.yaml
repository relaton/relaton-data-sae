  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This method is used for determining the compatibility of a candidate lubricant with specific reference lubricants. The reference lubricants to be used will typically be mandated by the owner of the product specification against which the candidate lubricant is being compared. This method is split into two procedures (Procedure A and Procedure B) with a summary of each procedure contained in &lt;span class="xref"&gt;Section 4&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
