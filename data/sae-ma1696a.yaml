  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes the basic triangular profile for the MJB thread form, the design profiles, standard pitches, tolerance classes, formulae for tolerances and dimensions, tolerance tables, and a system of designations. Because of the specialized application for buttress threads, no preferred diameter-pitch series have been established for this standard and each application will require use of the thread formulae for dimensions and related tolerances given herein for deriving the thread dimensional requirements.&lt;/div&gt;
    &lt;/div&gt;</p>
