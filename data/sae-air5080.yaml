  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document discusses a recommended new approach to integrate probabilistic methodologies with design practices, procedures, and software codes currently being used. In addition to complementing design methods currently in use, this new procedure will permit the designer to quantify the amount of conservatism that exists for a particular design due to the large amount of additional information which is provided to the designer. This additional information will allow the designer to make better decisions when faced with tradeoffs between cost, reliability, performance, and weight. Although the methodologies described herein can be used heavily in the design process, their applicability is much more encompassing. They can be used from product concept to customer delivery.&lt;/div&gt;&lt;/div&gt;</p>
