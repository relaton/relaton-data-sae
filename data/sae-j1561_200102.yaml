    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a method for testing the speed performance of passenger car tires under controlled conditions in the laboratory on a test wheel. This procedure applies to “standard load,” “extra load,” and “T-type high-pressure temporary-use spare” passenger tires.&lt;/div&gt;&lt;/div&gt;</p>
