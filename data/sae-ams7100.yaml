  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for the production of reliable, repeatable, reproducible aerospace parts by fused filament fabrication but is not limited to such application. This specification establishes the requirements to approve new machines, processes, and materials. Specifically, this specification covers machine configuration, operating software, machine calibration, machine and build parameters, and testing methodology required to create aerospace parts. This specification also defines the user’s responsibility for following the specified requirements.&lt;/div&gt;


    &lt;/div&gt;</p>
