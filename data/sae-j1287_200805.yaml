  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the test procedure, environment, and instrumentation for determining the exhaust sound pressure levels of motorcycles under stationary conditions. Care must be taken not to confuse stationary sound pressure levels with total motorcycle sound pressure levels. This test does not evaluate total motorcycle sound during operation. For this purpose, SAE J331 or SAE J47 is recommended. Any allowable sound limits (dBA) set in relation to SAE J1287 for exhaust sound pressure level should not conflict with the allowable sound limits (dBA) for total sound pressure level per the EPA requirements specified in the US Code of Federal Regulations, 40 Part 205.&lt;/div&gt;&lt;/div&gt;</p>
