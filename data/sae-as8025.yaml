  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers oronasal type masks which use a continuous flow oxygen supply. Each such mask comprises a facepiece with valves as required, a mask suspension device, a reservoir, or rebreather bag (when used), a length of tubing for connection to the oxygen supply source, and a means for allowing the crew to determine if oxygen is being delivered to the mask. The assembly shall be capable of being stowed suitably to meet the requirements of its intended use.&lt;/div&gt;&lt;/div&gt;</p>
