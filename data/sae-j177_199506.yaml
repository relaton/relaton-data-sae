  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The method presented applies to the analysis of the indicated constituents in diesel engine exhaust, or vehicles using diesel engines, when operating at steady-state conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The measurements of carbon monoxide, carbon dioxide, and nitric oxide are based on continuous sampling and analysis by nondispersive infrared (NDIR) methods. Measurements of total oxides of nitrogen by chemiluminescence and NDIR methods is discussed.&lt;/div&gt;
    &lt;/div&gt;</p>
