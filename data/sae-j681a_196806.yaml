  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Recommended Practice is to establish uniform bumper height and projection requirements for passenger cars so that bumper contact surface is provided when the vehicle is in any attitude between curb and design height. The purpose in providing bumper contact is to minimize damage to sheet metal, lamps, or ornamentation during parking maneuvers.&lt;/div&gt;&lt;/div&gt;</p>
