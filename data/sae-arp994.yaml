  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is a compendium of recommended practices for the design of tubing systems for the transmission of liquid and gasses influid power systems for aerospace vehicles such as aircraft, missiles and boosters, and is considered applicable to the design of future space vehicles and other applications using aircraft technology. Primary emphasis is given to recommended practices for line sizing, tube routing, supports and clamping, stress considerations and permissible defects, and provisions for flexure through the use of flexible hoses, coiled tubes, swivel joints, and expansion glands. Fluid power systems are differentiated from the normal aircraft fuel and oil systems and the various fluid systems used for environmental control and air conditioning systems; however, the practices cited herein will in many cases be applicable to these other systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A &lt;span class="xref"&gt;section (3)&lt;/span&gt; regarding tubing materials and fitting types currently in use is included for reference, but particular recommendations are purposely avoided since their selection is dependent upon the specific requirements of each particular vehicle system and many other factors.&lt;/div&gt;&lt;/div&gt;</p>
