    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a high strength fluorosilicone (FVMQ) elastomer that can be used to manufacture product in the form of sheet, strip, tubing, extrusions, and molded shapes. This specification should not be used for molded rings, compression seals, molded O-ring cord, and molded in place gaskets for aeronautical and aerospace applications.&lt;/div&gt;&lt;/div&gt;</p>
