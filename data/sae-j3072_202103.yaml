  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE J3072 Standard establishes requirements for a grid support inverter system function which is integrated into a plug-in electric vehicle (PEV) which connects in parallel with an electric power system (EPS) by way of conductively coupled, electric vehicle supply equipment (EVSE). This standard also defines the communication between the PEV and the EVSE required for the PEV onboard inverter function to be configured and authorized by the EVSE for discharging at a site. The requirements herein are intended to be used in conjunction with IEEE 1547 and IEEE 1547.1. This standard shall also support interactive inverters which conform to the requirements of IEEE 1547-2003 and IEEE 1547.1-2005, recognizing that many utility jurisdictions may not authorize interconnection.&lt;/div&gt;

    &lt;/div&gt;</p>
