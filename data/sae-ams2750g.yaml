  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers pyrometric requirements for equipment used for the thermal processing of metallic materials. Specifically, it covers temperature sensors, instrumentation, thermal processing equipment, correction factors and instrument offsets, system accuracy tests, and temperature uniformity surveys. These are necessary to ensure that parts or raw materials are heat treated in accordance with the applicable specification(s).&lt;/div&gt;&lt;/div&gt;</p>
