  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The report shows how the methodology of measurement uncertainty can usefully be applied to test programs in order to optimize resources and save money. In doing so, it stresses the importance of integrating the generation of the Defined Measurement Process into more conventional project management techniques to create a Test Plan that allows accurate estimation of resources and trouble-free execution of the actual test. Finally, the report describes the need for post-test review and the importance of recycling lessons learned for the next project.&lt;/div&gt;

    &lt;/div&gt;</p>
