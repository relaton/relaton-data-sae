  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies minimum performance standards for airborne head-worn display (HWD) to be used as a head-up display (HUD) equivalent in fixed wing (14 CFR Parts 23 and 25) aircraft. While this document may be applied to rotorcraft using an HWD for piloting functions (14 CFR Parts 27 and 29), additional performance standards may be required. This AS covers basic display requirements but does not include specific application requirements. Specific applications can include flight instrumentation, navigation, engine and system status, alerting, surveillance, communication, terrain awareness, weather, enhanced vision, synthetic vision, and other formats.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers criteria for conformal HWD systems that are intended for use in the flight deck by the pilot or copilot. Display minimum performance characteristics are specified for standard and other environmental conditions for the purpose of product qualification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Figure 1&lt;/span&gt; defines the HWD System Scope for use within this document.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;This document does not address sensor imaging systems, imagery, symbology, installation, or integration.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended to be used in combination with other guidance material contained in current system specific, Technical Standard Orders (TSOs), Advisory Circulars (ACs), and other FAA-approved guidance material. This AS is applicable to HWDs used across multiple aircraft types.&lt;/div&gt;&lt;/div&gt;</p>
