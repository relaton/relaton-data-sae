  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides guidance for test facilities in identifying potential hazards, and safety risks, along with requirements and recommendations related specifically to testing of automated driving systems (ADS) and ADS-operated vehicles. Herein after, for the purposes of this document, utilization of the term “test facilities” implies those conducting testing of ADS or ADS-operated vehicles, unless otherwise noted.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;References made to safety within this recommended practice apply only to test method safety and driving safety on and during testing at an ADS test facility and do not apply to vehicle design or safety performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Safety practices for on-road testing, operation, and related deployment are not covered within this document.&lt;/div&gt;&lt;/div&gt;</p>
