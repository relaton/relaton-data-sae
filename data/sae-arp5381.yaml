  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Minimum Performance Document defines the testing required for wheels, brakes, and wheel and brake assemblies to be used on civil aircraft certified under 14 Code of Federal Regulations (CFR) Part 23, 27, and 29.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Compliance with this document is recommended to assure that the equipment supplied will meet the intended design function when installed on aircraft. Compliance with this document does not constitute authorization for installation on an aircraft. The combined recommendations of this document provide an acceptable practice, but not the only practice, for obtaining authorization to apply TSO markings on the equipment.&lt;/div&gt;

    &lt;/div&gt;</p>
