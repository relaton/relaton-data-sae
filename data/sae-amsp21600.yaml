  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for a high visibility, durable, exterior fluorescent paint system consisting of a pigmented fluorescent paint with a clear protective overcoating containing a weathering stabilizer. This paint system is capable of being removed without softening the permanent undercoats.&lt;/div&gt;&lt;/div&gt;</p>
