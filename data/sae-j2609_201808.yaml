  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method measures the system material properties of an insulated formed heat shield under in-vehicle conditions. While the material properties of the individual components can often be determined via existing test methods, the system properties of the entire composite is typically much harder to ascertain (especially for multi-layer shields). System material properties include thermal conductivity in the lateral or in-plane (x) direction, thermal conductivity through the thickness or perpendicular (y), surface emissivity on the top and bottom sides of the shield and specific heat of the shield material.&lt;/div&gt;







    &lt;/div&gt;</p>
