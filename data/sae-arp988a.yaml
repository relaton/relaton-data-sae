  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The recommendations contained herein are confined to the input and output characteristics of electrohydraulic mechanical feedback servoactuators. The information presented should be useful for standardizing the terminology and for specification of physical and performance parameters.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommendations do not restrict nor attempt to define the internal design characteristics of servoactuators. As such, the material is equally applicable to servoactuators having different internal functioning, different ratings, different physical size, etc. In certain instances, standards for actuator design are recommended to increase interchangeability as, for example, pigtail color-coding and actuator polarity.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specifications contained herein should be adequate to describe electrohydraulic mechanical feedback servoactuators used for position control. Additional specifications may be necessary to define special requirements for specific control systems. Certain dynamic compensation methods will be discussed.&lt;/div&gt;
    &lt;/div&gt;</p>
