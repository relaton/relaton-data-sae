    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers steel cleanliness requirements for premium aircraft-quality ferromagnetic steels by magnetic particle inspection methods. Applicable primarily to blooms, billets, tube rounds, stock for forging or flash welded rings, slabs, bars, plate, tubing, and extrusions used in fabricating highly-stressed parts where very strict magnetic particle inspection standards are used in final inspection of such parts.&lt;/div&gt;&lt;/div&gt;</p>
