  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This recommended practice specifies the conditions of testing marine engine configuration for the determination of the rated power (single point) or power curve, when declaring &lt;i&gt;crankshaft power&lt;/i&gt; or &lt;i&gt;propeller shaft power&lt;/i&gt;. This code is not intended as a complete laboratory test manual or for derating engines for site conditions. (The rated power should give satisfactory expected life in the intended application.) This code is composed of the following Sections:&lt;/div&gt;
