    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the test procedure to determine minimum performance and durability characteristics for master cylinder assemblies of current established designs, components of which conform to SAE Standards. It is applicable to new assemblies from commercial production and remanufacture (factory rebuild).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The minimum performance and durability requirements are specified in SAE J1154.&lt;/div&gt;
    &lt;/div&gt;</p>
