  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Standard is to provide methods to determine display optical performance in all typical automotive ambient light illumination - with focus on High Ambient Contrast Ratio, which is critical for display legibility in a sunshine environment. It covers indoor measurements and simulated outdoor lighting.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not the scope of this document to set threshold values for automotive compliance, however some recommended values are presented for reference.&lt;/div&gt;&lt;/div&gt;</p>
