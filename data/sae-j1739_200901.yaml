    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This FMEA Standard describes Potential Failure Mode and Effects Analysis in Design (DFMEA) and Potential Failure Mode and Effects Analysis in Manufacturing and Assembly Processes (PFMEA). It assists users in the identification and mitigation of risk by providing appropriate terms, requirements, ranking charts, and worksheets. As a Standard, this document contains requirements “must” and recommendations “should” to guide the user through the FMEA process. The FMEA process and documentation must comply with this Standard as well as any corporate policy concerning this Standard. Documented rationale and agreement with the customer is necessary for deviations in order to justify new work or changed methods during customer or third-party audit reviews.&lt;/div&gt;&lt;/div&gt;</p>
