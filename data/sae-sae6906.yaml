    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Human Systems Integration (HSI) Standard Practice identifies the Department of Defense (DoD) approach to conducting HSI programs as part of procurement activities. This Standard covers HSI processes throughout design, development, test, production, use, and disposal. Depending on contract phase and/or complexity of the program, tailoring &lt;b&gt;should&lt;/b&gt; be applied. The scope of this standard includes prime and subcontractor HSI activities; it does not include Government HSI activities, which are covered in the DoD HSI Handbook. HSI programs &lt;b&gt;should&lt;/b&gt; use the latest version of standards and handbooks listed below, unless a particular revision is specifically cited in the contract.&lt;/div&gt;&lt;/div&gt;</p>
