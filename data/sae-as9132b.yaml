  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard defines uniform quality and technical requirements relative to metallic parts marking performed using "data matrix symbology" within the aviation, space, and defense industry. ISO/IEC 16022 specifies general requirements (e.g., data character encodation, error correction rules, decoding algorithm). In addition to ISO/IEC 16022 specification, part identification with such symbology is subject to the requirements in this standard to ensure electronic reading of the symbol.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The marking processes covered by this standard are as follows:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Dot Peening&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Laser&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Electro-Chemical Etching&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;Further marking processes will be included, if required.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Unless specified otherwise in the contractual business relationship, the company responsible for the design of the part shall determine the location of the data matrix marking. Symbol position should allow optimum illumination from all sides for readability.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard does not specify information to be encoded.&lt;/div&gt;
    &lt;/div&gt;</p>
