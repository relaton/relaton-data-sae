  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the minimum functional requirements for quick connectors used in supply, return, and vapor/emissions lines for flexible-tubing systems. This document applies to automotive and light truck gasoline and diesel fuel systems with operating pressure or vacuum up to 500 kPa, 5 bar, (72 psig) and operating temperatures up to 115 °C (239 °F). These tests apply to new connectors in assembly operations. Connectors must be pushed onto a mating tube end then pulled back to assure complete connection. For service operations, the mating tube should be lubricated with SAE 30 weight oil before re-connecting.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Vehicle OEM fuel system specifications may impose additional requirements beyond the scope of this general SAE document. In those cases, the OEM specification takes precedence over this document.&lt;/div&gt;&lt;/div&gt;</p>
