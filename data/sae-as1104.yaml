  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers that gyroscopic instrument normally defined as a "subminiature rate gyro." The rate gyro, when subjected to an angular rate about its input axis, provides an AC output voltage proportional to the angular rate. The subminiature size category generally includes gyro instruments of one (1) inch diameter or less and three and one-half (3 1/2) inches length or less. This specification defines the requirements for a subminiature spring-restrained, single-degree-of-freedom rate gyro for aircraft, missile, and spacecraft applications.&lt;/div&gt;&lt;/div&gt;</p>
