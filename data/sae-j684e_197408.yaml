  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard includes couplings and hitches used with all types of nonpassenger carrying trailers whose gross weight does not exceed 10,000 lb (4540 kg). This includes such types as utility, boat, camping, travel, and special purpose trailers which are normally towed by the conventional passenger car, light-duty commercial vehicle, and multipurpose passenger vehicle. This standard is intended primarily for ball-and-socket type of couplings and hitches. It should not be construed as a limitation to this type alone, but should apply where appropriate to ring-and-pintle, clevis-and-pin, or any other draft means designed to serve this purpose.&lt;/div&gt;&lt;/div&gt;</p>
