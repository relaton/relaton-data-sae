  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice is derived from the Federal Motor Vehicle Safety Standard 135 vehicle test protocol as a single-ended inertia-dynamometer test procedure. It measures brake output, friction material effectiveness, and corner performance in a controlled and repeatable environment. The test procedure also includes optional sections for parking brake output performance for rear brakes. It is applicable to brake corners from vehicles covered by the FMVSS 135 when using the appropriate brake hardware and test parameters. This procedure is applicable to all passenger cars and light trucks up to 3500 kg of GVWR.&lt;/div&gt;
    &lt;/div&gt;</p>
