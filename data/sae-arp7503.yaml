  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AS21608 shield terminating, crimp-style ferrule applications on shielded cables require various piece parts in multiple combinations to ground the shield of non-environmental cables. This ARP provides the recommended methods to ensure the shield ground wire is terminated correctly and the shield is protected. Refer to AS83519 for shield grounding when eviornmental resistance is required.&lt;/div&gt;

    &lt;/div&gt;</p>
