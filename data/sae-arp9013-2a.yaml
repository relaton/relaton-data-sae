  content: <p>&lt;p&gt;The purpose of ARP9013/2 is to ensure conformance for each
    product characteristic being verified in each lot in the series.  ARP9013/2 document
    specifies a product acceptance system using either attribute or variable lot acceptance
    methods documented in ANSI/ASQC Z1.4, ANSI/ASQC Z1.9, and  "Zero Acceptance Number
    Sampling Plans " by Nicholas L. Squeglia.&lt;/p&gt;</p>
