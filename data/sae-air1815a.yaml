abstract:
- language: en
  script: Latn
  content: "<p>This AIR defines the major groups of impairments and disabilities among
    passengers who use aircraft as a transportation mode, and the types of safety
    problems which might be associated with each impairment. These impairments, and
    their safety-related problems, should be considered when referring to ARP's related
    to the design of cabin furnishings and equipment.</p>"
