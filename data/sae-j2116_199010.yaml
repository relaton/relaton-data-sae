    &lt;div class="htmlview paragraph"&gt;This SAE Standard was prepared by Technical Committee 6, Small Engine Lubricants, of the SAE Fuels and Lubricants Division. The intent is to improve communications among engine manufacturers, engine users, and lubricant marketers in describing lubricant performance characteristics. The key objective is to ensure that a correct lubricant is used in each two-stroke-cycle engine.&lt;/div&gt;
