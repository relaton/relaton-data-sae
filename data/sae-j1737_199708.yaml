  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended for the determination of the losses of hydrocarbon fluids, by permeation through component walls as well as through "microleaks" at interfaces of assembled components while controlling temperature and pressure independently of each other. This is achieved in a recirculating system in which liquids which are transported through walls and joints are collected by a controlled flow of nitrogen (dry) and adsorbed by activated charcoal.&lt;/div&gt;&lt;/div&gt;</p>
