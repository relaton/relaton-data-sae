  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the system and component functions, measurement metrics, and testing methodologies for evaluating the functionality and performance of ground vehicle central tire inflation systems (CTIS), also known as tire pressure management systems or tire pressure control systems (TPCS). Systems of this type allow the driver to select the operational tire pressure set point (TPSP) based on vehicle load and surface type (highway, off-highway, off-road, etc.) and maintain the inflation pressure to the vehicle specified level.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These systems are recommended to address all serviceable tires as originally installed on a vehicle by the OEM and/or specialty vehicle manufacturer, and for the aftermarket (including replacement or spare parts) are recommended (but optional) to address all tire/rim combinations installed after initial vehicle sale or in-use dates.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Systems for use by military and some other very rigorous off-road applications require such extreme performance requirements, particularly at very high and low temperature and other combat-based extremes that such applications may fall outside the recommended parameters of the subject document. In those cases, it is the responsibility of the procuring customer, vehicle OEM, and applicable component(s) OEM to determine what compromises might be required, and the suitability of design and performance solutions that may be outside of those recommended here.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is applicable to all axle and all wheel combinations for the following vehicle types, but does not preclude its use on other vehicle types—single unit powered vehicles exceeding 7257 kg (16000 U.S. pounds) gross vehicle weight rating (GVWR) and multi-unit vehicle combinations, up to three towed units, which use an SAE J560 connector for power and/or communication, or equivalent successor connector technology. For combination vehicles including two or more trailers, the dolly axles are also included. The included vehicles can be newly manufactured vehicles or existing vehicles, fitted with air or hydraulic braking systems.&lt;/div&gt;

    &lt;/div&gt;</p>
