    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an aluminum alloy in the form of extruded rods, bars, and profiles (shapes) 0.040 to 1.500 inches (1.02 to 38.10 mm), inclusive, in thickness, and produced with maximum cross sectional area of 23.25 in&lt;sup&gt;2&lt;/sup&gt; (15000 mm&lt;sup&gt;2&lt;/sup&gt;) and a maximum circumscribing circle diameter (circle size) of 15.5 inches (394 mm) (see &lt;span class="xref"&gt;8.4.1&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
