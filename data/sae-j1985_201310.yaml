    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended for all sizes of fuel filters, so a variety of test stands may be required depending upon flow rate. The low contamination level, downstream clean-up filter, and short duration of the test, ensures that the particle retention ability of the filter is measured in a single pass as no appreciable loading or regression will occur.&lt;/div&gt;
    &lt;/div&gt;</p>
