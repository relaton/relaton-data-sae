    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report describes results of testing of the SAE J1746 ISP-Vehicle Standard for the communication of spatial data references between central sites and mobile vehicles on roads. Testing was performed by the Oak Ridge National Laboratory and its contractors, resulting in a document from which this Information Report has been extracted. Tests were performed by computer analysis and corroborated by field tests with a mobile vehicle.&lt;/div&gt;&lt;/div&gt;</p>
