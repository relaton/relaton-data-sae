abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1978-2 specifies a complementary set of functions to be provided by an OBD-II scan tool. These functions provide complete, efficient access to all regulated OBD services on any vehicle that is compliant with SAE J1979-2 and SAE J1979-3&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The content of this document is intended to satisfy the requirements of an OBD-II scan tool as required by current U.S. OBD regulations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document specifies:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;A means of establishing communications between an OBD-equipped vehicle and an OBD-II scan tool.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;A set of diagnostic services to be provided by an OBD-II scan tool in order to exercise the services defined in SAE J1979-2.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The presentation of the SAE J1978 document family, where SAE J1978-2 covers second generation protocol functionality defined in SAE J1979-2, and SAE J1978-1 covers first generation protocol functionality defined in SAE J1979 and protocol determination for both SAE J1979 and SAE J1979-2.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE J1978 document family does not preclude the inclusion of additional capabilities or functions in an OBD-II scan tool. However, it is the responsibility of the OBD-II scan tool designer to ensure that no such capability or function can adversely affect either an OBD-equipped vehicle, which may be connected to the OBD-II scan tool, or an OBD-II scan tool itself.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Differences in the SAE J1978-2 requirements are highlighted by &lt;b&gt;&lt;i&gt;bold italic text&lt;/i&gt;&lt;/b&gt; in the technical requirements sections of this document.&lt;/div&gt;&lt;/div&gt;</p>
