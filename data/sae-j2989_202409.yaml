  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended for stakeholders of the automotive industry that are conducting emission testing on materials, parts, or components used in automotive interiors. Testing methods may specifically define the handling and packaging conditions for the material to be analyzed. In these cases, follow the method as closely as possible. Use this document as a guide where the protocol for handling and packaging the samples between production and testing may be undefined or ambiguous.&lt;/div&gt;
    &lt;/div&gt;</p>
