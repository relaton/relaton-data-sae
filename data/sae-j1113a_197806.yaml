    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform laboratory measurement techniques for the determination of the susceptibility to undesired electromagnetic sources of electrical, electronic, and electromechanical ground-vehicle components. It is intended as a guide toward standard practice but may be subject to frequent change to keep pace with experience and technical advances, and this should be kept in mind when considering its use.&lt;/div&gt;&lt;/div&gt;</p>
