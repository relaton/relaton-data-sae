abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Seat furnishings are installed around seats and are intended to enhance passenger privacy and comfort. They may have provisions for additional occupants to be seated when the aircraft is in-flight, but would not be occupied during taxi, take-off, and landing (TTL).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the minimum design, performance and qualification requirements for seat furnishings with and without upper attachments (see &lt;span class="xref"&gt;Figures 1&lt;/span&gt; and &lt;span class="xref"&gt;2&lt;/span&gt;) to be installed in large transport category airplanes. This standard excludes seat furnishing designs that are directly attached to the seat assembly, for which AS8049 is the applicable standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Integrated items (desk tops, cabinets, shelves, stowage areas, closeouts, dividers, etc.) connected to seat furnishings shall comply with the requirements of this AS as part of the seat furnishings.&lt;/div&gt;

    &lt;/div&gt;</p>
