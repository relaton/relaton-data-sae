    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice includes requirements for installations of adequate landing and taxiing lighting systems in aircraft of the following categories:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Single engine personal and/or liaison type.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Light twin engine.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Large multi-engine propeller.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;4&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Large multi-engine turbo-jet.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;5&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Military high performance fighter and attack.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;6&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Helicopter.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
