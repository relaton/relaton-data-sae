  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Information Report is an evaluation of the ports and tools used on automotive air-conditioning systems to evacuate and charge systems with approved refrigerants during vehicle service. A task force was formed in April 2021 to perform this evaluation and concluded its work in September 2021. The scope of the task force was to evaluate issues being reported from service repair shops with air-conditionings service ports and the tools being used to connect to these ports. The task force also evaluated published SAE J Standards and discovered many of these standards did not include the necessary requirements for service ports and tools. The task force published a final report of its findings and recommendations. The report includes recommendations to correct and publish new SAE Standards related to the scope of this project.&lt;/div&gt;&lt;/div&gt;</p>
