    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Included herein are general, dimensional, and performance specifications for those types, styles, and sizes of steel stamped Push-On Spring Nuts recognized as SAE standard. These nuts are intended for general use where the engagement on the mating metal or plastic studs and in some cases screw bolt threads is considered adequate for the fastening joint application. It should be noted that Push-On Spring Nuts having other characteristics and configurations are available and manufacturers should be consulted. For the inch equivalent of this document, see SAE J892.&lt;/div&gt;&lt;/div&gt;</p>
