    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides additional information and the rationale used for certain elements of AS6413. This AIR is provided to assist persons performing the tests described in AS6413 with an understanding of certain aspects of the test apparatus and the test criteria, such as the volume of the test chamber, cell heating rate, and the pass/fail criteria. It will be updated concurrently with AS6413 to explain changes, provide rationales, and cover future cell/battery technologies as they arise.&lt;/div&gt;&lt;/div&gt;</p>
