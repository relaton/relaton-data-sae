  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The power take-offs included in this SAE Standard are those which are attached to transmissions, auxiliary transmissions, or transfer cases of the type used in trucks, and include their use in construction equipment and for similar purposes where truck-type transmissions and transfer cases are used for transmitting power. These power take-offs are limited to those where attachment is made by means of the side opening provided by the transmission or transfer case manufacturer as described under SAE J704.&lt;/div&gt;&lt;/div&gt;</p>
