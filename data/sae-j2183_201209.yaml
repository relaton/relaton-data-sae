  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Standard specifies the test methods, dimensions, and requirements for single-core 60 V cables intended for use in road vehicle applications where the nominal system voltage ≤ 60 V DC (25 V AC). It also specifies additional test methods and/or requirements for 600 V cables intended for use in road vehicle applications where the nominal system voltage is &amp;gt; 60 V DC (25 V AC) to ≤ 600 V DC (600 V AC). Where practical, this standard uses ISO 6722 for test methods, dimensions, and requirements. This standard covers ISO conductor sizes which usually differ from SAE conductor sizes. It also covers the individual cores in multi-core cables. See ISO 6722 for “Temperature Class Ratings”.&lt;/div&gt;&lt;/div&gt;</p>
