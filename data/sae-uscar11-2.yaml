  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides a test method for determining the torque-tension relationship of a fastener finish as applied to a surrogate screw for the purpose of measuring the frictional characteristic of the fastener finish. The results obtained by this test shall be used as a process control attribute of the fastener finish and shall not be utilized for specific applications.&lt;/div&gt;&lt;/div&gt;</p>
