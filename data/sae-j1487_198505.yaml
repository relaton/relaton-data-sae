    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to establish uniform test procedures for measuring and rating air delivery and cooling capacity of truck cab air-conditioner evaporator assemblies. It is the intent to measure only the actual cooling capacity of the evaporator. It is not the intent of this recommended practice to rate and compare the performance of the total vehicle air-conditioning system.&lt;/div&gt;&lt;/div&gt;</p>
