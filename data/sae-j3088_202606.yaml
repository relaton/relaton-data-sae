abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;The current document is a part of an effort of the Active Safety Systems Committee, Active Safety Systems Sensors Task Force whose objectives are to:&lt;/p&gt;


    &lt;ol type="a"&gt;
    &lt;li&gt;Identify the functionality and performance you could expect from active safety sensors&lt;/li&gt;
    &lt;li&gt;Establish a basic understanding of how sensors work&lt;/li&gt;
    &lt;li&gt;Establish a basic understanding of how sensors can be tested&lt;/li&gt;
    &lt;li&gt;Describe an exemplar set of acceptable requirements and tests associated with each technology&lt;/li&gt;
    &lt;li&gt;Describe the key requirements/functionality for the test targets&lt;/li&gt;
    &lt;li&gt;Describe the unique characteristics of the targets or tests&lt;/li&gt;
    &lt;/ol&gt;


    &lt;p&gt;This document will cover items (a) and (b).&lt;/p&gt;</p>
