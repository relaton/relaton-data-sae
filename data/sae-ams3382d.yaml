    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers two classes (durometers) of tetrafluoroethylene/propylene rubber (FEPM) in the form of sheet, strip, tubing, extrusions, and molded shapes. For molded rings, compression seals, O-ring cord, and molded-in-place gaskets for aeronautical and aerospace applications, use the AMS7255 or AMS7256 specification, as appropriate.&lt;/div&gt;&lt;/div&gt;</p>
