    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice established uniform engineering nomenclature for extra wide single rims and wheels. This nomenclature and accompanying drawings are intended to define fundamental extra wide single rim and wheel terms. The dimensions given are those necessary to maintain serviceability and interchangeability of the demountable rims, disc wheels, and wheels for demountable rims.&lt;/div&gt;&lt;/div&gt;</p>
