    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes the physical item marking requirements for identification purposes for aluminum, magnesium, and titanium procured and issued for Government agencies. Compliance with this standard will insure positive identification of these metals. Shipment and inspection acceptance markings are not within the scope of this standard.&lt;/div&gt;&lt;/div&gt;</p>
