  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;In lieu of TSO-C135, this SAE Aerospace Standard (AS) prescribes the minimum performance standards for wheels, brakes, and wheel and brake assemblies using electric power actuation for transport category (14 CFR Part 25) airplanes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Testing is limited to that necessary to establish minimum performance related to strength, robustness, stopping capability, and energy absorption to ensure measurable, repeatable industry accepted standards for these aspects of wheel and brake performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test parameters associated with electric braking actuation are defined around the state of the technology at this time, typically comprised of an Electro-Mechanical Actuator (EMA) controlled by a control system delivering electric power and effecting motor control. This document does not address qualification of the EMAs or brake assembly to the landing gear environmental threats including, but not limited to, EMI/HIRF, failure mode operation or other application specific performance, or the qualification of software or of complex custom micro-coded components, including but not limited to, Programmable Logic Devices (PLD) and Application Specific Integrated Circuits (ASIC).&lt;/div&gt;

    &lt;/div&gt;</p>
