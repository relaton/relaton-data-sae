  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to all self-propelled machines with a gross vehicle mass up to 5000 kg that are utilized to clean material from outside paved areas, parkland, floors in non-residential buildings and areas principally exposed to pedestrian traffic. Primary methods for material removal can be by mechanical, pneumatic, washing and flushing systems, or in a combination of any system.&lt;/div&gt;
    &lt;/div&gt;</p>
