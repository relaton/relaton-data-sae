  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test procedure defines a laboratory procedure for generating and evaluating filiform corrosion on painted aluminum wheels and painted aluminum wheel trim.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While this test was developed specifically for the testing of painted aluminum wheels and wheel trim it may be applicable to other components. The application owner will need to assess if this test generates filiform similar to that found in the relevant usage to ensure it will provide accurate data for the application.&lt;/div&gt;

    &lt;/div&gt;</p>
