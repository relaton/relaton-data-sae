    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) is to establish criteria for design and installation of combination evacuation slide/raft devices for use both as ground and water escape devices in the event of emergency.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: This document is not intended to specify design methods, mechanisms, or equipment to be used in accomplishment of the objectives set forth herein.&lt;/div&gt;&lt;/div&gt;</p>
