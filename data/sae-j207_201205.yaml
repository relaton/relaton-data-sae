  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers requirements for several types and grades of electrodeposited nickel/chromium coatings on ferrous or copper alloy basis metals and copper/nickel/chromium on zinc or aluminum alloys for the finishing and corrosion protection of decorative ornamentation and hardware of motor vehicles and marine controls and fittings. Four grades of coatings are provided to correlate with the service conditions under which each is expected to provide satisfactory performance, namely: very severe, severe, moderate, and mild. Definitions and typical examples of these service conditions are provided in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; Information contained in this document generally conforms to the information contained in ASTM B 456, Specification for Electrodeposited Coatings of Nickel plus Chromium.&lt;/div&gt;&lt;/div&gt;</p>
