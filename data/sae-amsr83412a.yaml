    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers three types of rubber having good resistance to high and low temperature and hydrazine type propellants, but poor resistance to hydrocarbon oils or solvents. Hydrazines are hazardous chemicals. See “Dangerous Properties of Industrial Materials” by N. Irving Sax.&lt;/div&gt;&lt;/div&gt;</p>
