  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a method for determining the specific gravity of tubing, fabricated from polytetrafluoroethylene, after a controlled heating and cooling cycle. The specific gravity obtained by this method is a measure of relative molecular weight of the resin. The measure, termed relative specific gravity (RSG), increases with decreasing molecular weight (refer to Sperati and Starkweather, 1961).&lt;/div&gt;&lt;/div&gt;</p>
