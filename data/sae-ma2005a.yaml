  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes the basic performance and quality criteria for screw-together tube fitting assemblies and port connectors. It was prepared to standardize on the qualification test and procurement requirements for ISO standard tube fittings. The test requirements are intended to satisfy the most strenuous demands encountered in a high performance aircraft hydraulic system. The procurement requirements are intended to assure that fittings which are bought to this specification are of the same quality as the fittings used during the original qualification testing. Compliance with these test and procurement requirements is necessary for fittings which are used in control systems where a malfunction could affect the safety of flight.&lt;/div&gt;&lt;/div&gt;</p>
