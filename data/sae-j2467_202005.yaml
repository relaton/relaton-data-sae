  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers normalized electric resistance welded, cold-drawn, single-wall, SAE 1021 carbon steel pressure tubing intended for use as pressure lines and in other applications requiring tubing of a quality suitable for bending, single flaring, cold forming, welding, and brazing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The grade of material produced to this specification is higher in carbon content and manganese content than the grade of material specified in SAE J525 and is intended to service higher pressure applications than equivalent sizes of SAE J525. Due to the higher carbon and manganese content, the forming characteristics of the finished tube are diminished versus the SAE J525 product. Special attention to the overall forming requirements of the finished assembly shall be taken into consideration when specifying material produced to this specification. Refer to SAE J2551-1 for additional design and fabrication guidance associated with this material. Nominal working pressures for this material are listed in ISO 10763 and SAE J1065. When required, qualitication testing shall be in accordance with ISO 19879.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In an effort to standardize within a global marketplace and ensure that companies can remain competitive in an international market, it is the intent to convert to metric tube sizes, which will:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Lead to one global system.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Guide users to a preferred system.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Reduce complexity.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Eliminate inventory duplications.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
