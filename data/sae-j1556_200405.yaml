abstract:
- language: en
  script: Latn
  content: "<p>The intent of this SAE Recommended Practice is to provide guidelines for automotive vehicle glass replacement shops and their personnel in the correct replacement practices, materials, and procedures for stationary safety glazing components.  The design of today's automotive vehicles and the development of new technology can directly influence occupant safety and vehicle structural integrity.  The correct installation of stationary safety glazing components can contribute directly to occupant safety and structural integrity of the vehicle.</p>"
