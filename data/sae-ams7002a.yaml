  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification is to prescribe process requirements for production (from raw materials through preparation for shipment, see &lt;span class="xref"&gt;8.6&lt;/span&gt;) of metal powder feedstock for use in additive manufacturing of aerospace parts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification covers requirements for the production of metal powder for use as feedstock in additive manufacturing. Such powders may be pre-alloyed or commercially pure. This specification is not limited to a specific powder production method. It is intended to define those procedures and requirements necessary to achieve required cleanliness and performance of metal powder feedstock to be used in the manufacture of aerospace parts. This specification is intended to be used in conjunction with AMS powder specifications for additive manufacturing.&lt;/div&gt;

    &lt;/div&gt;</p>
