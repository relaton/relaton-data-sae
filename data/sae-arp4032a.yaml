  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Although this document is specifically intended for the application of color to cathode-ray-tube (CRT) instrumentation, most portions are also compatible with other emerging electronic display technologies, whether they are self-luminous or light modulating devices, such as liquid crystal displays. However, it is not intended to address the concerns brought about by the use of specialized equipment such as head-up displays and night vision goggles. Identifiable incompatibilities or special considerations for color display technologies other than the CRT have been noted in the recommendations.&lt;/div&gt;
    &lt;/div&gt;</p>
