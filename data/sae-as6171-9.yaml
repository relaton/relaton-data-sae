  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines capabilities and limitations of FTIR spectroscopy as it pertains to counterfeit electronic component detection and suggests possible applications to these ends. Additionally, this document outlines requirements associated with the application of FTIR spectroscopy including: operator training, sample preparation, various sampling techniques, data interpretation, computerized spectral matching including pass/fail criteria, equipment maintenance, and reporting of data. The discussion is primarily aimed at analyses performed in the mid-infrared (IR) from 400 to 4000 wavenumbers; however, many of the concepts are applicable to the near and far IR.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;If AS6171/9 is invoked in the contract, the base document, AS6171 General Requirements shall also apply.&lt;/div&gt;&lt;/div&gt;</p>
