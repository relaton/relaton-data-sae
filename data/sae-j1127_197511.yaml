    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers battery cables intended for use at 50 volts or less in surface vehicle wiring. Requirements for cable sizes 6 thru 4/0 previously contained in SAE Standard, Low Tension Cable SAE J558 are included. Cable sizes 20 through 4 previously specified in SAE J558 are now included in SAE J1128.&lt;/div&gt;&lt;/div&gt;</p>
