  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers sub-critically annealed electric resistance welded flash controlled single-wall high strength low alloy steel tubing intended for use in hydraulic pressure lines and in other applications requiring tubing of a quality suitable for bending, double flaring, cold forming, welding and brazing. Material produced to this specification is not intended to be used for single flare applications due to the potential leak path that would be caused by the ID weld bead.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The grade of material produced to this specification is of micro-alloy content and is considerably stronger and intended to service higher pressure applications than like sizes of the grades of material specified in SAE J356 and SAE J2435. Due to the alloy content of the material, the forming characteristics of the finished tube are equal to or better, when compared to SAE J356 and SAE J2435. Nominal reference working pressures for this tubing are listed in SAE J1065.&lt;/div&gt;&lt;/div&gt;</p>
