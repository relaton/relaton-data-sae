  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies the general requirements for data recording procedures, packaging, and storing of elastomeric seals and seal assemblies which include an elastomeric element prior to the seal being assembled into hardware components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The requirement for packaging is an integral part of the controlled storage procedure and provides a means of positive product identity from the time of manufacture to the time of assembly into a component.&lt;/div&gt;
    &lt;/div&gt;</p>
