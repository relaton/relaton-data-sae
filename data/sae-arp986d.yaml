  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines recommended analysis and test procedures for qualification of pneumatically, electrically, manually, and hydraulically actuated air valves. They may be further defined as valves that function in response to externally applied forces or in response to variations in upstream and/or downstream duct air conditions in order to maintain a calibrated duct air condition (e.g., air flow, air pressure, air temperature, air pressure ratio, or air shutoff).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Qualification testing performed on the airplane to verify compatibility of the valve function and stability as part of a complete system is outside the scope of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Refer to ARP1270 for design and certification requirements for cabin pressurization control system components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;As this document is only a guide, it does not supersede or relieve any requirements contained in detailed Customer specifications.&lt;/div&gt;
    &lt;/div&gt;</p>
