  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The requirements of 9100 apply with the following clarification for software.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document supplements the 9100 standard requirements for deliverable software and contains quality management system requirements for organizations that design, develop, and/or produce deliverable software for the aviation, space, and defense industry. This includes, as required, support software that is used in the development and maintenance of deliverable software. The deliverable software may be stand-alone, embedded, or loadable into a target computer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Where the use of Hardware Description Language (HDL) or high order language is utilized as the design source of electronic hardware [e.g., Application Specific Integrated Circuit (ASIC), Programmable Logic Device (PLD)], the organization and customer shall agree on the extent of applicability of this supplement.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 1: For airborne electronic hardware guidance, see RTCA/DO-254 or EUROCAE ED-80; and for product realization requirements, see 9100.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Where Commercial-off-the-Shelf (COTS) or non-developmental software is integrated into a deliverable product, the organization and customer shall agree on the extent of applicability of this supplement.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For the purposes of this document, the terms “product” and “software product” are considered synonymous.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 2: This document is independent of the life cycle models (e.g., waterfall, spiral, evolutionary, incremental) or methodology (e.g., objected oriented design, unified modeling language, agile).&lt;/div&gt;&lt;/div&gt;</p>
