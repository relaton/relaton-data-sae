  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the requirements for spherical, self-aligning, self-lubricating, bearings which are for use in the ambient temperature range of -65 to +160 °F (-54 to +71 °C) at high cyclic speeds 1400 cpm (15 fpm). The scope of this standard is to provide a liner system qualification procedure for helicopter sliding bearings defined and controlled by source control drawings. Once a liner system is qualified, the source-controlled bearings are further tested under application conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Under Department of Defense (DoD) Policies and Procedures, any qualification requirements and associated Qualified Products List (QPLs) are mandatory for DoD contracts. Any materials relating to QPLs have not been adopted by SAE and are not part of this SAE technical document.&lt;/div&gt;&lt;/div&gt;</p>
