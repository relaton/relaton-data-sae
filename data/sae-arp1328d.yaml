  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is intended to recommend:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Uniform criteria for determination of wind loads that aircraft ground support equipment can encounter and yet allow personnel to work safely,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Uniform systems for maintaining stability (i.e., stabilizers, outriggers, spring lockout devices),&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Standardization of specific types of interlock systems and actuation systems,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A standard formula with its associated design criteria for calculating the steady-state wind stability (i.e., tip point) for aircraft ground support equipment,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A standard method for testing these systems.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
