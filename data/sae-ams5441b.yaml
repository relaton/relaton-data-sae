  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion and heat-resistant nickel alloy in the form of bars, forgings, and flash welded rings 5 inches (127 mm) and under in nominal diameter or least distance between parallel sides and up to 50 in&lt;sup&gt;2&lt;/sup&gt; (323 cm&lt;sup&gt;2&lt;/sup&gt;) in cross-sectional area, and stock of any size for forging, flash welded rings, or heading (see &lt;span class="xref"&gt;8.5&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
