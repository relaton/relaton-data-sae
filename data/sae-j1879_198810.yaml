  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the general environmental, mechanical and quality requirements pertaining to IC's. It also describes the qualification and production acceptance procedures performed by the supplier.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is to be used as a guideline which device buyers can apply wholly or in part as appropriate for their needs and applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is essentially part number independent. The detail specification particular to a device part number will be given separately, containing all detailed electrical and mechanical parameters.&lt;/div&gt;
    &lt;/div&gt;</p>
