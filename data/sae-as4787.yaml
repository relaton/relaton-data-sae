    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes minimum requirements for eddy current inspection of circular holes in nonferrous, metallic, aircraft engine hardware with fasteners removed. The inspection is intended to be performed at maintenance and overhaul facilities on engine run hardware.&lt;/div&gt;&lt;/div&gt;</p>
