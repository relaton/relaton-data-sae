    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the practices and minimum standards for certification of personnel performing certain heat treating operations. It also establishes that only certified heat treaters may perform certain critical heat treating functions when conformance to this ARP is invoked by the applicable heat treating specification or by other contractural documentation.&lt;/div&gt;&lt;/div&gt;</p>
