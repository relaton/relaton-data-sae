  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is intended to recommend a minimum standard, for the design and manufacturer of a self-propelled, chassis mounted passenger boarding vehicle. The vehicle will permit safe operation while minimizing aircraft damage and personnel safety hazards associated with commercial aircraft boarding operations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The vehicle described is intended to be used for assisting wheelchair passengers and passengers with disabilities on and off aircraft with door sill heights of 60 in (152.4 cm) and above.&lt;/div&gt;&lt;/div&gt;</p>
