  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Information Report provides recommendations for alphanumeric messages that are supplied to the vehicle by external (e.g., RDS, satellite radio) or internal (e.g., infotainment system) sources &lt;i&gt;while the vehicle is in-motion&lt;/i&gt;. Information/design recommendations contained in this report apply to OEM (embedded) and aftermarket systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Ergonomic issues with regard to display characteristics (e.g., viewing angle, brightness, contrast, font design, etc.) should review ISO 15008.&lt;/div&gt;&lt;/div&gt;</p>
