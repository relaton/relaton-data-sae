  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Traditionally, cellular foam products have been checked for load deflection by determining the load required to cause a 25% deflection. In automotive seating, on the other hand, the load deflection is checked by determining the thickness under constant force conditions to (a) indicate the initial softness of the seat cushion, (b) measure how thick the seat cushion is under the average passenger load (a measurement of padding left for “ride” and seated height), and (c) determine a value to indicate resiliency. In this method these measurements are made by determining the thickness of the seat cushion under fixed loads of 4.5 N, 110 N, and 220 N with a 323 cm &lt;sup&gt;2&lt;/sup&gt; circular indentor foot.&lt;/div&gt;&lt;/div&gt;</p>
