    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;&lt;span class="xref"&gt;Section 6&lt;/span&gt;—Final Inspection&lt;/i&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;&lt;span class="xref"&gt;Section 7&lt;/span&gt;—Calculations and Formulas&lt;/i&gt;&lt;/div&gt;&lt;/li&gt;
