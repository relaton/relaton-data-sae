  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the requirements for rubber floor mats made from five types of rubber compounds as required by the physical property requirements of the application. The SAE Committee on Automotive Rubber Specifications has concluded that SAE J80 duplicates the information in ASTM D 925 and SAE J200/ASTM D 2000. Attempts to find any company using the specification have not been successful. In light of this fact SAE J80 will be cancelled in 2005.&lt;/div&gt;
    &lt;/div&gt;</p>
