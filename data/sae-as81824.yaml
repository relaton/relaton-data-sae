    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers environment resistant, permanent crimp type, splices having a heat shrinkable insulating sleeve and meltable environmental seals. They may be used with tin plated and silver plated conductors in applications where the total temperature of the wire insulation does not exceed 150°C.&lt;/div&gt;&lt;/div&gt;</p>
