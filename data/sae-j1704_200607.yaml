  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard covers motor vehicle brake fluids of the nonpetroleum type for use in the braking system of any motor vehicle such as a passenger car, truck, bus, or trailer. This standard covers different levels of performance properties compared to the SAE J1703 and J1705 documents on brake fluids. These fluids are not intended for use under arctic conditions or in braking systems requiring the use of mineral oil based hydraulic fluid.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These fluids are designed for use in braking systems fitted with rubber cups and seals made from styrene-butadiene rubber (SBR), or a terpolymer of ethylene, propylene, and a diene (EPDM).&lt;/div&gt;
    &lt;/div&gt;</p>
