  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The minimum performance values in this recommended practice are applicable to vehicles with brake systems having typical service pressure ranges 0-1800 psi (0-12.4 MPa) hydraulic or 0-120 psi (0-0.8 MPa) air &lt;i&gt;only.&lt;/i&gt; SAE J880 not only provides for determining maximum brake rating horsepower capability, but also permits verification of any desired or arbitrary level such as the requirement established herein. The determining criteria for deciding brake rating horsepower capability are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Cold brake stopping ability.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Fade as a result of horsepower absorption.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(c)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Hot brake stopping ability following horsepower absorption.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(d)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Brake system stability following horsepower absorption.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(e)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Functional and structural integrity of brake system following test.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
