  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide guides toward standard conditions for operating marine engine throttles (gasoline or diesel) where push-pull cable control is applicable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For control cable information see SAE J917.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Maximum desirable force required to make or maintain a throttle setting, 22 N (5 lb), as applied by the control cable.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Amount of travel required for the engine throttle lever is as follows:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Two holes in the engine throttle lever at radii to provide 44.5 mm (1-3/4 in) and 70 mm (2-3/4 in) linear travel, idle to full throttle.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The engine throttle lever may be adjustable in length.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The holes in the engine throttle lever for attaching the cable terminal should be 6.35 mm (1/4 in) diameter. The engine throttle lever at these holes should not be more than 6.35 mm (1/4 in) thick. Common cable terminals used are ball joints, clevises, and pivots.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Provide clear cable path to the engine throttle lever.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Provide choice of cable paths from different angles. This can be done by having the engine throttle lever repositionable on the engine throttle shaft.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Provide bracket support on or near the carburetor or governor. This can be a hub, bolt holes, bolts, or other means for use in attaching a cable anchor bracket.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A bolt pattern concentric with the engine throttle shaft is desirable.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
