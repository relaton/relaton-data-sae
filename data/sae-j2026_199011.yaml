  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines a guideline to help engineering users in workstation selection by specifying engineering workstation configurations in terms of vendor supported functionality for several levels of performance and capacity. These workstations will satisfy different engineering applications while maintaining interoperability. The objective is to specify a set of standards, not a single workstation, which must be addressed by the Engineering Workstation vendors to meet the hardware and operating environment needs of engineers in their CAD, CAM, CAE and other engineering activities.&lt;/div&gt;&lt;/div&gt;</p>
