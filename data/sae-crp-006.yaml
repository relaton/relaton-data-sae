abstract:
- language: en
  script: Latn
  content: "<p>This report, published as part of the SAE Cooperative Research Program,
    provides in-depth information on the  properties of lubricants that are candidates
    for mobile air  conditioning retrofits with HFC-134a. Numerous charts,  graphs
    and tables are included.  Property information reported includes hygroscopicity,
    miscibility, stability,  lubricity, desiccant compatibility and polymer  compatibility.
    A thorough reference for all working with  HFC-134a! Addendum to HFC-134a Lubricant
    Study is also  included.</p>"
