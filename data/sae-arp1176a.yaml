  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides recommended practices for cleaning aircraft oxygen equipment such as tubing, pieces, parts (including regulator and valve parts), cylinders and ground-based equipment that may be used to support aircraft oxygen systems. This revision introduces a cleanliness coding scheme that can be referenced as a requirement, and/or referenced to identify compliance to meeting such a requirement. These methods may apply to gaseous and liquid oxygen equipment. This document specifies work area details, methods to select suitable cleaning agents, cleaning methods, test methods to verify cleanliness level, and methods of packaging the components and parts after cleaning. Technicians designated to clean oxygen equipment must be qualified and trained to clean oxygen equipment. This ARP is applicable to metallic and non-metallic parts.&lt;/div&gt;
    &lt;/div&gt;</p>
