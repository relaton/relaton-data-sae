    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides performance and sampling requirements, test procedures, and marking requirements for aftermarket wheels intended for normal highway use on passenger cars, light trucks, and multipurpose passenger vehicles. For aftermarket wheels on trailers drawn by passenger cars, light trucks or multipurpose vehicles, see SAE J1204. These performance requirements apply only to wheels made of materials included in &lt;span class="xref"&gt;Table 1&lt;/span&gt; and &lt;span class="xref"&gt;Table 2&lt;/span&gt;. New nomenclature and terms are added to clarify wheel constructions typically not used in OEM applications. The testing procedures and requirements are based on SAE standards listed in the references.&lt;/div&gt;&lt;/div&gt;</p>
