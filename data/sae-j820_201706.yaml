  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies primarily to mobile cranes that lift loads by means of a drum and hoist line mechanism. It can be used to determine the hoist line speed and power of other hoist line mechanisms, if the load can be held constant and hoist line travel distance is sufficient for the accuracy of the line speed measurements prescribed. This recommended practice applies to all mechanical, hydraulic, and electric powered hoist mechanisms.&lt;/div&gt;
    &lt;/div&gt;</p>
