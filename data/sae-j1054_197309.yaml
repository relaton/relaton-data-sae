  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Flashers referred to in this SAE recommended engineering design practice are for nominal 12 V circuits and are required to operate the maximum design load per output terminal as stated by the flasher manufacturer. This design practice is intended for use in conjunction with a supplementary Service Performance Standard for Warning Lamp Flashers (under development).&lt;/div&gt;&lt;/div&gt;</p>
