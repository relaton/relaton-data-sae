abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;It is intended that the scope of this information report be limited to electrical heating of passenger, crew, and cargo compartments only.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;No attempt has been made to develop the complete electrical circuitry associated with the electrical heating components; however, the electrical circuitry required for heating component operation, safety, and monitoring will be included as available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Specific design information is given for various modern aircraft utilizing electrical heating. Each aircraft discussed will be identified by alphabetical letter designation and included in the appropriate appendix.&lt;/div&gt;
    &lt;/div&gt;</p>
