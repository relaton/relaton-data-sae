abstract:
- language: en
  script: Latn
  content: |-
    <p>Bond, as it relates to elastomeric seals, is defined as "The adhesion, established by vulcanization, between two cured elastomeric surfaces, or between one cured elastomeric surface and one nonelastomeric surface."  Vulcanization refers in this case to chemical bonding.  Good bond is essential to the function of elastomeric radial lip seals and other precision bonded parts.

    This SAE Recommended Practice describes a universal bond test fixture developed by the RMA that can be mounted to a conventional tensile test machine.  This will allow a quantitative evaluation of bond rather than a merely qualitative one.</p>
