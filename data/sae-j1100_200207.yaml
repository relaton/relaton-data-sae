  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines a set of measurements and standard procedures for vehicle dimensions. The dimensions are primarily intended to measure the design intent of a vehicle within a design environment (i.e., CAD). All dimensions in this practice can be measured this way.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In addition, some dimensions can be taken in an actual vehicle. If measurements are taken on physical properties, some differences in values should be expected. Also, care should be taken to not confuse design intent measurements with those taken on a physical property.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Unless otherwise specified, all dimensions are measured normal to the three-dimensional reference system (see SAE J182), except ground-related dimensions, which are defined normal to ground. All dimensions are taken with the vehicle at curb weight unless otherwise specified.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All dimensions are measured on the base vehicle and do not include Regular Production Options (RPO) or accessory parts, unless otherwise specified.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;Although many terms and dimensions use human body parts in their name, they should not be construed as measures that indicate occupant accommodation, capabilities, or comfort&lt;/b&gt;.&lt;/div&gt;&lt;/div&gt;</p>
