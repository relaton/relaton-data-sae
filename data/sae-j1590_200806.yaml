abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard establishes a classification of materials intended
    for the manufacture of piston rings based on mechanical properties and the stresses
    that these materials are capable of withstanding. This document applies to the
    manufacture of piston rings up to and including 200 mm diameter for reciprocating
    internal combustion engines. It also applies to piston rings for compressors working
    under similar conditions.</p>"
