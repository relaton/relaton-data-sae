  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers plain spherical bearings which are self-aligning and self-lubricating by incorporating polytetrafluoroethylene (PTFE) in a liner between the ball and race (outer ring). PTFE is incorporated in a fabric or composite material bonded to the ID of the outer ring, or in a composite material molded into a pre-formed cavity between the inner and outer ring. These bearings are for use in the temperature range -65°F to +325°F (-54°C to +163°C.)&lt;/div&gt;&lt;/div&gt;</p>
