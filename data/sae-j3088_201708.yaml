abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;The current document is a part of an effort of the Active Safety Systems Sensor Committee whose objectives are to:&lt;/p&gt;


    &lt;p&gt;a. Identify the functionality and performance you could expect from active safety sensors&lt;/p&gt;


    &lt;p&gt;b. Establish a basic understanding of how sensors work&lt;/p&gt;


    &lt;p&gt;c. Establish a basic understanding of how sensors can be tested&lt;/p&gt;


    &lt;p&gt;d. Describe an exemplar set of acceptable requirements and tests associated with each technology&lt;/p&gt;


    &lt;p&gt;e. Describe the key requirements/functionality for the test targets&lt;/p&gt;


    &lt;p&gt;f. Describe the unique characteristics of the targets or tests&lt;/p&gt;


    &lt;p&gt;This document will cover items (a) and (b)&lt;/p&gt;</p>
