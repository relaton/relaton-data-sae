  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines and establishes mechanical property ranges for seven grades of continuously cast high strength automotive sheet steels that can be formed, welded, assembled, and painted in automotive manufacturing processes. The grade of steel specified for an identified part should be based on part requirements (configuration and strength) as well as formability. Material selection should also take into consideration the amount of strain induced by forming and the impact strain has on the strength achieved in the finished part. These steels can be specified as hot-rolled sheet, cold-reduced sheet, uncoated, or coated by hot dipping, electroplating, or vapor deposition of zinc, aluminum, and organic compounds normally applied by coil coating. The grades and strength levels are achieved through chemical composition and special processing. Not all combinations of strength and coating types may be commercially available. Consult your steel supplier for details.&lt;/div&gt;&lt;/div&gt;</p>
