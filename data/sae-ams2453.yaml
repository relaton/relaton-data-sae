abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this specification is to establish requirements of a grinding method and to provide grinding parameters that will eliminate or minimize overheating, cracking, high residual tensile stresses, and/or other metallurgical changes that decrease structural integrity of steel parts or chrome plated steel parts (See &lt;span class="xref"&gt;8.2&lt;/span&gt;). This standard establishes requirements for low stress grinding of martensitic high strength steel heat-treated to 180 ksi (1241 MPa) minimum ultimate tensile strength (UTS) and above, and requirements for low stress grinding of chromium plating applied to such high strength steel.&lt;/div&gt;&lt;/div&gt;</p>
