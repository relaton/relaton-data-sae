  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The guidelines in this SAE Information Report are directed at laboratory engine dynamometer test procedures with alternative fuels, and they are applicable to four-stroke and two-stroke cycle spark ignition (SI) and diesel (CI) engines (naturally aspirated or pressure charged, with or without charge air cooling). A brief overview of investigations with some alternative fuels can be found in SAE J1297. Other SAE documents covering vehicle, engine, or component testing may be affected by use of alternative fuels. Some of the documents that may be affected can be found in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;. Guidelines are provided for the engine power test code (SAE J1349) in &lt;span class="xref"&gt;Appendix D&lt;/span&gt;. The principles of these guidelines may apply to other procedures and codes, but the effects have not been investigated.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The report is organized into four technical sections, each dealing with an important aspect of testing or reporting of results when using alternative fuels. The first (&lt;span class="xref"&gt;Section 3&lt;/span&gt;) deals with such issues as what is a "fuel" in the context of engine operation. The next (&lt;span class="xref"&gt;Section 4&lt;/span&gt;) is concerned with identifying fuel properties. The third technical section (&lt;span class="xref"&gt;Section 5&lt;/span&gt;) covers the testing considerations and calculations for alternative fuels. The final technical section (&lt;span class="xref"&gt;Section 6&lt;/span&gt;) provides some guidelines for reporting the results so that sufficient information is given in a form that allows convenient comparison of the results from different investigations.&lt;/div&gt;&lt;/div&gt;</p>
