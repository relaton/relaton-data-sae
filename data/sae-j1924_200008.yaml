abstract:
- language: en
  script: Latn
  content: |-
    <p>The purpose of the SAE Information Report is to address the method of loading vehicle electronic controllers with chassis and customer specific parameters.  This specification shall establish an interface definition.  The interface definition must be mutually agreeable to truck OEMs and vendors.  The purpose of this specification is not to answer the large protocol issues raised by systems such as GM's MAP.
    SAE Standard
    In the future, SAE may use this specification as a basis for an OEM/Vendor interface specification standard.</p>
