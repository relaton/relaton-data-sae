    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to direct acting vacuum power assist brake boosters only, exclusive of the master cylinder or other brake system prime mover devices for passenger cars and light trucks [4500 kg GVW (10 000 lb)]. It specifies the test procedure to determine minimum performance and durability characteristics which are specified in SAE J1902 (under development).&lt;/div&gt;
    &lt;/div&gt;</p>
