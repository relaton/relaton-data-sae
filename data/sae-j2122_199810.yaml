  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a systematic method for the identification of single diameter drills. It is intended to assist in the cataloging and supplying of these tools.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 1— Caution must be taken when assigning codes for designators to prevent specifying drills that cannot be physically or economically manufactured.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
