  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The terms included in the/Glossary are general in nature and usually apply to more than one manufacturer’s system. All terms in &lt;span class="xref"&gt;Section 3&lt;/span&gt; apply to automotive restraint systems in general 'which are initiated by an electric or mechanical stimulus upon receipt of a signal from a sensor. All terms in &lt;span class="xref"&gt;Section 4&lt;/span&gt; apply primarily to the initiator used in automotive restraint systems. In some cases, the same terms appear in both sections to allow for the general definition and for definitions applying specifically to initiators.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These terms are intended to reflect existing designs and the Glossary will be updated as information on other types of systems becomes available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Appendix A&lt;/span&gt; is included to identify terminology that is no longer in common use or specifically applicable to inflatable restraint systems, but was published in the April 1988 version of SAE J1538.&lt;/div&gt;&lt;/div&gt;</p>
