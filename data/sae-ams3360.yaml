abstract:
- language: en
  script: Latn
  content: '<p>This specification covers a room-temperature-vulcanizing, elastomeric
    silicone compound.  Primarily for potting and encapsulating electronic products
    for use at temperatures from -65 to +260 degrees C (-85 to +500 degrees F) where
    resistance to reversion is not required. This specification has been "Cancelled"
    by the Aerospace Materials Division, SAE, as of October 26, 1987. By this action
    subject specification number and title will be deleted from the active specification
    index of Aerospace Material Specifications. For those components previously requiring
    the use of AMS 3360, either of the following are recommended for use, as applicable:
    AMS 3358 or AMS 3359.</p>'
