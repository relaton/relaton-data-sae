    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report describes a concept of operations (CONOPS) for a Cooperative Driving Automation (CDA) Feature for infrastructure-based prescriptive cooperative merge. This work focuses on a Class D (Prescriptive; refer to J3216) CDA infrastructure-based cooperative merge Feature, supported by Class A (Status-Sharing) or Class C (Agreement-Seeking) messages among the merging cooperative automated driving system-operated vehicles (C-ADS-equipped vehicles). This document also provides a test procedure to evaluate this CDA Feature, which is suitable for proof-of-concept testing in both virtual and test track settings.&lt;/div&gt;
    &lt;/div&gt;</p>
