    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) discusses the terminology, types, method of manufacture and chemistry of the fine wire meshes used for filtration of hydraulic, lubrication fuel systems, and similar applications. Information contained herein may be used for quality assurance testing to insure that a high performance filter grade wire mesh is acceptable for use in an aerospace application.&lt;/div&gt;&lt;/div&gt;</p>
