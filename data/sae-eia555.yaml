  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Specification covers a statistical sampling plan for lot inspection by attributes. It verifies that the customer's specified quality level (SQL) is not being exceeded. The estimate of fraction nonconforming determined by EIA Interim Standard No. EIA-554 is used to select the optimum sample plan for verifying that a given lot meets the specified quality level (SQL).&lt;/div&gt;&lt;/div&gt;</p>
