  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is only applicable to 14 CFR part 25 Transport Airplane passenger seats. This document provides an approach for determining which parts on aircraft seats are required to meet the test requirements of 14 CFR part 25 Appendix F, Parts IV and V. Such materials are referred to as Heat Release Special Conditions (HRSC) compliant]. Additionally, it is recommended to use HRSC compliant materials in applications where not required.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Independent furniture related to seat installations is outside the scope of this document.&lt;/div&gt;&lt;/div&gt;</p>
