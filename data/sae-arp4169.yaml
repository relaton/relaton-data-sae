  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP discusses the desired characteristics of night vision goggle (NVG) filters that can be used with incandescent, electroluminescent (EL) and light emitting diode (LED) light sources to achieve NVG compatible lighting of aerospace crew stations. This ARP also discusses the parameters that need to be considered when selecting a night vision goggle/daylight viewing (NVG/DV) filter for proper contrast enhancement to achieve readability in daylight.&lt;/div&gt;&lt;/div&gt;</p>
