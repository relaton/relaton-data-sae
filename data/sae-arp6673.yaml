    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this ARP is to provide information on splices, and the definition of the preferred methods of splicing single core wires and multi-conductor cables supplied on reels by vendors, to facilitate their processing on automated wire processing systems to allow continued uninterrupted machine operation without requiring operator intervention.&lt;/div&gt;&lt;/div&gt;</p>
