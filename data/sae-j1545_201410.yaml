  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The practice applies to parts and materials used in vehicle manufacture which are intended to be acceptable color matches to a specified color standard. This practice is intended for use with parts or materials that are opaque or nearly so and does not apply to transparent materials. Materials covered by this practice include topcoat paint finishes, interior soft trim, interior and exterior hard trim, and exterior film.&lt;/div&gt;

    &lt;/div&gt;</p>
