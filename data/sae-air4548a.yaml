  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides a review of real-time modeling methodologies for gas turbine engine performance. The application of real-time models and modeling methodologies are discussed. The modeling methodologies addressed in this AIR concentrate on the aerothermal portion of the gas turbine propulsion system. Characteristics of the models, the various algorithms used in them, and system integration issues are also reviewed. In addition, example cases of digital models in source code are provided for several methodologies.&lt;/div&gt;

    &lt;/div&gt;</p>
