  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines a component-level test procedure to evaluate automotive electrical and electronic components for Conducted Emissions of transients, and for other electromagnetic disturbances, along battery feed (B+) or switched ignition inputs of a Device Under Test (DUT). Test apparatus specifications outlined in this procedure were developed for components installed in the 12-V passenger cars, light trucks, 12 V heavy-duty trucks, and vehicles with 24 V systems.&lt;/div&gt;&lt;/div&gt;</p>
