abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE J2521 procedure applies to high-frequency squeal noise occurrences for on-road passenger cars and light trucks below 4540 kg of GVWR. The procedure incorporates high-temperature and low-temperature test matrixes but does not fully account for the effects of the environment on brake squeal.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For this test procedure, squeal occurs when the peak noise level is at least 70 dB(A) between 1.25 kHz and 16 kHz for tests using full suspension corners or full axle assemblies or between 2 kHz and 16 kHz for brakes not using a full suspension corner.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Before using this recommended practice for chassis dynamometer testing, review in detail the specifics related to at least (a) instrumentation, including in-cabin microphones, (b) threshold levels for noise detection, (c) temperature control priority between the front and rear axles, (d) vehicle loading and load distribution, (e) cooling air and environmental conditioning, and (f) detailed nomenclature and labeling of channels and sensors.&lt;/div&gt;
    &lt;/div&gt;</p>
