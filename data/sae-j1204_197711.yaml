  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform procedures for fatigue testing ferrous wheels intended for normal highway use on travel, camping, boat and light utility trailers drawn by passenger cars and light trucks. For performance requirements, see SAE Jxxx. For procedures and minimum performance requirements for truck-type rims and wheels, see SAE J267a and for passenger car rims and wheels see SAE J328a. Mobile home service is also outside the scope of this recommended practice.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;There are two basic test procedures described, a cornering fatigue test and a radial fatigue test. The cornering test is directed at the wheel portion of the wheel/rim assembly; whereas the radial test will examine potential deficiencies in the rim portion of the structure. Both test procedures are required to obtain a thorough examination of the wheel/rim assembly.&lt;/div&gt;&lt;/div&gt;</p>
