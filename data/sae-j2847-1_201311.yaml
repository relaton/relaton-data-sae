    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the details of the Smart Energy Profile 2.0 (SEP2.0) communication used to implement the functionality described in the SAE J2836/1™ use cases. Each use case subsection includes a description of the function provided, client device requirements, and sequence diagrams with description of the steps. Implementers are encouraged to consult the SEP2.0 Schema and Application Specification for further details. Where relevant, this document notes, but does formally specify, interactions between the vehicle and vehicle operator.&lt;/div&gt;
    &lt;/div&gt;</p>
