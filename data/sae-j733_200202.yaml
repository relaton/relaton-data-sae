abstract:
- language: en
  script: Latn
  content: "<p>This Standard is to establish identification terminology for major
    components and parts used in the ripping operation on earthmoving machines. The
    components and parts illustrated are attached to certain self-propelled earthmoving
    machines and/or attachments as defined in SAE J326, J727, J729, J870 and J1193.</p>"
