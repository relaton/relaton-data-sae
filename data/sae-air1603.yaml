  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides a brief description of the auxiliary power equipment that is available with enough description and pertinent comments to enable an engineer to make logical preliminary selection of the appropriate equipment for advanced military aircraft programs. The information has been kept as brief as possible to include the maximum amount of equipment in a relatively short document. It is not intended to replace textbook design analysis or detailed information available from the equipment suppliers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The document describes auxiliary power equipment. Auxiliary power is defined as follows: "Those elements of secondary power [defined as all aircraft nonpropulsive power generation and transmission] related to main engine bleed air and shaft power extraction or power generation separate from the main engines. Included are engine bleed air systems, remote engine driven gearboxes, engine starting systems, auxiliary power units, and emergency power systems." Additional definitions may be found in ARP906A which is the source of this definition.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Some closely related systems which are not discussed in detail, include thermal management, environmental control, electrical, and hydraulic systems.&lt;/div&gt;&lt;/div&gt;</p>
