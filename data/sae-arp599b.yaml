  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes a procedure for determining the insoluble contamination level of the downstream side of filter elements. Results of this procedure represent the particulate released from the tested filter element under the prevailing conditions of the test. The results may be used for comparative evaluation of the effectiveness of various cleaning methods or the cleanliness of elements after cleaning or as received from manufacturers.&lt;/div&gt;
    &lt;/div&gt;</p>
