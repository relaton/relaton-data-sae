  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) describes the performance of plating’s and coatings for landing gear that potentially provide environmental compliance benefits versus the current baseline processes. The hazardous systems addressed in this version of the document include cadmium plating, chromated primers, and high VOC (volatile organic compounds) topcoats.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The AIR applies to landing gear structures and mechanisms for all types of civil and military aircraft. The potential replacements apply to both Original Equipment Manufacturer (OEM) hardware and overhaul of in-service landing gears.&lt;/div&gt;
    &lt;/div&gt;</p>
