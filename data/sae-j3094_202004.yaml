    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to define a common set of thermodynamic test conditions to evaluate internal heat exchangers for use with R-134a and R-1234yf refrigerants in mobile air-conditioning systems. This standard can be used to test actual vehicle IHX designs or standardized IHX samples, which can be used for comparison based on a common length and shape.&lt;/div&gt;&lt;/div&gt;</p>
