  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The terms included in the Glossary are general in nature and usually apply to more than one manufacturer's system. All terms apply to automotive restraint systems which are initiated by an electric squib upon receipt of a signal from a remotely mounted sensor.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These terms are intended to reflect existing designs and the Glossary will be updated as information on other types of systems becomes available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Two different formats are used to present the terms. A standard alphabetical approach is provided to allow a user to quickly find the definition of a particular term. The information is also repeated in a second format which groups the terms into functional areas. This technique will allow the Glossary user to develop a better understanding of the design and functioning of an automotive inflatable restraint system.&lt;/div&gt;&lt;/div&gt;</p>
