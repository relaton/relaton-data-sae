  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies the interface requirements for tow bar attachment fittings on the nose gear (when towing operations are performed from the nose gear) of conventional tricycle type landing gears of commercial civil transport aircraft with a maximum ramp weight higher than 50,000 kg (110,000 pounds), commonly designated as “main line aircraft”.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Its purpose is to achieve tow bar attachment fittings interface standardization by aircraft weight category (which determines tow bar forces) in order to ensure that one single type of tow bar with a standard connection can be used for all aircraft types within or near that weight category, so as to assist operators and airport handling companies in reducing the number of different tow bar types used.&lt;/div&gt;&lt;/div&gt;</p>
