abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice deals only with the definitions and terminology pertaining to the power shafts of agricultural tractors in which the power take-off rotational speed is proportional to the engine speed. This is the type that prevails in the United States, Canada, England, and generally throughout the world. The following recommendations will facilitate a clear understanding for engineering  discussions, comparisons, and the preparation of technical papers.</p>"
