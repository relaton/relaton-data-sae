    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a systematic method for the identification of End Mills. It is intended to assist in the cataloging and supplying of these tools.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 1— Caution must be taken when assigning codes for designation to prevent specifying cutting tools that cannot be physically or economically manufactured.&lt;/div&gt;
