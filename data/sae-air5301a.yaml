    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) was written because of the growing interest in aircraft installed outdoor engine testing by the Federal Aviation Administration, airlines, charter/commercial operators, cargo carriers, engine manufacturers and overhaul and repair stations. This document was developed by a broad cross section of personnel from the aviation industry and government agencies and includes information obtained from a survey of a variety of operators of fixed and rotary wing aircraft and research of aircraft and engine maintenance manuals.&lt;/div&gt;&lt;/div&gt;</p>
