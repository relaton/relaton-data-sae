  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform test procedures and minimum performance requirements for windshield wiping systems and wiper blades of trucks, buses, and multipurpose passenger vehicles. The evaluation procedures include those tests that can be conducted on uniform test equipment by commercially available laboratory facilities. Besides the terminology included in paragraph &lt;span class="xref"&gt;2&lt;/span&gt;, uniform terminology of windshield wiper system characteristics and phenomena may be found in SAE J903. Also included are guides for the use of engineering layout studies to evaluate system performance. The test procedures and minimum performance requirements, outlined in this recommended practice, are based on currently available engineering data. It is the intent that all portions of the recommended practice will be periodically reviewed and revised as additional data regarding windshield wiping system performance are developed.&lt;/div&gt;&lt;/div&gt;</p>
