    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes uniform laboratory techniques for employing the constant volume sampler (CVS) system in measuring various constituents in the exhaust gas of gasoline engines installed on passenger cars and light trucks. The techniques described relate particularly to CVS systems employing positive displacement pumps. In some areas of CVS practice, alternate procedures are given as a guide toward development of uniform laboratory techniques.&lt;/div&gt;
