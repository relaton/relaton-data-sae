  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report includes procedures for the analysis of a gas turbine engine start. It utilizes a standard form for the essential starting characteristics of the gas turbine engine and for the starting power capability of the aircraft battery. This report illustrates the format of the characteristic which is provided by the electric starter to transform the battery electric power (voltage and current) to the mechanical power (torque and speed) required to successfully start the engine.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;An aircraft engine start battery typically also serves as a backup source for emergency electrical energy. Guidelines are therefore provided for the determination of battery capacity to fulfill the emergency energy requirements of the aircraft.&lt;/div&gt;&lt;/div&gt;</p>
