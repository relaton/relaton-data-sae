    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to provide equipment specifications for CFC-12 (R-12) recycling and/or recovery, and recharging systems. This information applies to equipment used to service automobiles, light trucks, and other vehicles with similar CFC-12 systems. Systems used on mobile vehicles for refrigerated cargo that have hermetically sealed systems are not covered in this document.&lt;/div&gt;&lt;/div&gt;</p>
