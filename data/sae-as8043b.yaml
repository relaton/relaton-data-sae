  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies laboratory test procedures and minimum requirements for the manufacturer of restraint systems for use in civil aircraft. It is intended to establish a minimum level of quality which can be called upon by the designer of those systems. However, compliance with this standard alone may not assure adequate performance of the restraint system under normal and emergency conditions. Such performance requires consideration of factors beyond the scope of this standard, and must be demonstrated by a system evaluation procedure which includes the seat, the occupant, the specific restraint installation and the cabin interior configuration. This standard specifies the requirements for Type 1, Type 2, and Type 3 restraint systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Buckles that release automatically or through any means other than the direct action of the fingers or thumb on the buckle are beyond the scope of this standard.&lt;/div&gt;&lt;/div&gt;</p>
