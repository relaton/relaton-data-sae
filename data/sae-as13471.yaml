  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the general requirement for the preparation and production of multicolor microchart/map transparencies for use with optical projection viewing devices. It defines the physical and photographic characteristics of the output transparencies. These transparencies shall exhibit sufficient fidelity so that when projected back to the original size, the projected image shall be an acceptable facsimile of the original chart.&lt;/div&gt;&lt;/div&gt;</p>
