  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the critical controls and requirements for the production of reliable, repeatable, reproducible aerospace parts by the Stratasys Fortus 900mc Plus with Type 1, Class 1, Form 1, Grade 0, natural color material for fused filament fabrication system, but is not limited to such application. This procedure will establish the configuration of the machine and build parameters, the testing methodology, and mechanical specification minimum guidelines required to create aerospace part.&lt;/div&gt;

    &lt;/div&gt;</p>
