    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The recommended design approach is described in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;. The approach emphasizes the fundamental relationship between symbols, the information they encode, the context within which the symbols are displayed, and the tasks being supported. While this document is aimed at aircraft displays involving dynamic control or monitoring tasks, the methodology is applicable to a wide range of symbology development situations.&lt;/div&gt;&lt;/div&gt;</p>
