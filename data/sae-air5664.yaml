    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Information Report (AIR) is two-fold: to inform the reader of the extent of effort that went into the development of the Joint Architecture for Unmanned Systems (JAUS); and to capture for posterity the domain analysis that provides the underpinnings for the work by the AS-4 Committee (Unmanned Systems).&lt;/div&gt;

