  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This revision of AS6513 concerns conformance to the SAE Unmanned Systems (UxS) Control Segment (UCS) Architecture Revision A Library, designated AS6512A (or later). The superceded AS6513 concerned conformance to the original UCS Architecture Library, designated AS6512.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is the authoritative specification within the UCS Architecture for establishing conformance requirements for UCS products. The UCS products addressed by this specification are UCS software components and UCS software configurations that provide one or more UCS services, and UCS systems that employ one or more UCS services.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The conformance of UCS products is determined by assessing the conformance of the UCS product description to the UCS Architecture. The UCS product description includes test artifacts.&lt;/div&gt;


    &lt;/div&gt;</p>
