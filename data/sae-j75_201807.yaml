  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Motor vehicle brake fluid must conform to the requirements of SAE J1703 or J1704, not only when manufactured, but also after extended storage in any commercial packaging container. The purpose of this SAE Information Report is to generate an awareness of the major problems involved in the storage of brake fluids and, to some extent, provide means of circumventing them. It is also the purpose of this document to relate to experience and to test data accumulated and to list certain conclusions which should aid in the proper selection of containers for brake fluid.&lt;/div&gt;

    &lt;/div&gt;</p>
