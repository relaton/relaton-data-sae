  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the specific requirements for improved exfoliation resistant alclad aluminum alloy 7178-T76 sheet and -T7651 plate. The general requirements are covered in AMS-QQ-A-250. The plate and sheet covered by this specification shall be an integral composite product consisting of a heat-treatable aluminum alloy (7178) core with thin layers of an aluminum alloy (7072) anodic to the core and of approximately equal thickness, bonded to both surfaces.&lt;/div&gt;&lt;/div&gt;</p>
