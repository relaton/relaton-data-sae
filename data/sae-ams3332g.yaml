    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an extreme low-temperature-resistant Methyl Phenyl Vinyl Silicone(PVMQ) elastomer that can be used to manufacture product in the form of sheet, strip, extrusions, and molded shapes. For molded rings, compression seals, O-ring cord, and molded-in-place gaskets for aeronautical and aerospace applications, use the AMS7XXX specification.&lt;/div&gt;&lt;/div&gt;</p>
