  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) specifies pictographic symbols for ground support equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;They have been compiled for the benefit of those who deal with such equipment like airlines, airport authorities, manufacturers etc. in order to facilitate fast and accurate identification of controls, indicators, and decals of powered and unpowered equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document shall promote standardization of terms for controls, indicators etc. of ground support equipment and eliminate language problems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recommended to put these pictograms on all future equipment and to retrofit all existing equipment as far as possible.&lt;/div&gt;&lt;/div&gt;</p>
