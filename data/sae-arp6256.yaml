  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is a guide to the application of magnesium alloys to aircraft interior components including but not limited to aircraft seats. It provides background information on magnesium, its alloys and readily available forms such as extrusions and plate. It also contains guidelines for “enabling technologies” for the application of magnesium to engineering solutions including: machining, joining, forming, cutting, surface treatment, flammability issues, and designing from aluminum to magnesium.&lt;/div&gt;&lt;/div&gt;</p>
