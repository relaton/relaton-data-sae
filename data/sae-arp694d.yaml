  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is intended to cover all external lights on the tanker and fixed wing receiver airplanes used to accomplish aerial refueling.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP describes lights used for two basic types of aerial refueling: the probe and drogue, and the boom/receptacle method.&lt;/div&gt;
    &lt;/div&gt;</p>
