    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These recommended practices provide general recommendations for designing and fabricating metallic tubes and tube assemblies for fluid power applications utilizing commonly available manufacturing methods and general guidelines for tube selection and application. These documents are primarily intended for mobile/stationary industrial equipment and automotive applications. Aircraft and Aerospace applications were not considered during the preparation of this document.&lt;/div&gt;&lt;/div&gt;</p>
