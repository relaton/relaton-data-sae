    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice lists the recommended across flats limits for hexagon bar stock drawing callouts. This recommendation is based on the comparison of existing hexagon tolerance standards and minimum wrench openings. These callouts should be used when specifying fluid fitting dimensions in which the unmachined material hex dimension will appear on the finished part as a wrenching surface.&lt;/div&gt;

    &lt;/div&gt;</p>
