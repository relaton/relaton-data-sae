  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice (RP) applies to the validation process for test systems used to measure deflection (compressibility, creep, or swell and growth) of friction materials and friction material assemblies. The materials or assemblies can fit passenger cars, light trucks, and commercial vehicles equipped with hydraulic or air brake systems, using disc or drum brakes.&lt;/div&gt;&lt;/div&gt;</p>
