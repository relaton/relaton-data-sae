  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This recommended practice documents dimensional metric specifications for hydraulic brake system tubing with flared ends, threaded ports, and male tube nuts for the interconnection of major components in automotive hydraulic brake systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to recommend preferred metrically dimensioned components (including alternative choices), that are intended to be functionally compatible with International Organization for Standardization Specification, ISO 4038-1977 (E). Some applications may require sizes or forms other than those shown herein, and this document does not preclude such other details when they are required.&lt;/div&gt;&lt;/div&gt;</p>
