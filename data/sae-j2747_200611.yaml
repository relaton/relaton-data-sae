  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Communicate the process of accurately measuring sound power levels of positive displacement hydraulic pumps commonly used in ground vehicle steering systems. This recommended practice defines the pump mounting (pulley, belt tension, isolation), operating conditions (fluid, speed, temperature, pressure), room acoustics, instrumentation, noise measurement technique and data acquisition setup to be used. Included are recommendations for test sample size, and format for data presentation/reporting.&lt;/div&gt;
    &lt;/div&gt;</p>
