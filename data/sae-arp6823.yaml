  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) offers an overview of the many key processes that are being transformed as the aerospace industry is rapidly digitalizing. The G-31 Electronic Transactions in Aerospace committee has been established to develop standards related to these processes. This report, also known as the “cornerstone” document for the committee, is a comprehensive look at processes associated with commercial aviation. Because of universal convergence of these technologies, the technologies described here are applicable to other domains as well.&lt;/div&gt;
    &lt;/div&gt;</p>
