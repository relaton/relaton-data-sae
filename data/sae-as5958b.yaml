  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for externally swaged titanium tube fittings on titanium and CRES tubing with flareless separable fitting for use in hydraulic supply and return aerospace fluid systems up to a maximum operating pressure of 5080 psig (35 000 kPa) and a maximum operating temperature range of -65 to +275 °F (-54 to +135 °C).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification covers a common 5080 psi pressure titanium fitting that may be used for a range of operating pressures up to 5080 psi with different tubing materials and tubing wall thicknesses, and is assembled with the same tooling in accordance with AS5959. The fitting operating pressure is based on the fitting thread pitch. Extra fine pitch for 5080 psi operating pressure and fine pitch for operating pressures 3000 psi and less. &lt;span class="xref"&gt;Table 12&lt;/span&gt; shows applicable fitting number and tubing materials and operating pressures.&lt;/div&gt;&lt;/div&gt;</p>
