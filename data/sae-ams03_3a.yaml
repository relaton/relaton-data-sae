  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the requirements for the application of sprayed metal coatings of aluminum, zinc, or aluminum-zinc based alloys for the protection of aluminum alloys against corrosion. It does not cover the metal spraying of aluminumarmour materials, which should be treated in accordance with the requirements of Def Stan 08-39.&lt;/div&gt;&lt;/div&gt;</p>
