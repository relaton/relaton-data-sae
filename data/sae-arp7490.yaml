    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidelines for the creation of specifications for the Motor Control Electronics (MCE) that are used for operating electrically powered actuators including:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Electromechanical Actuators (EMAs)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Electrohydrostatic Actuators (EHAs)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Electric Back-Up Hydraulic Actuators (EBHAs)&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;

    &lt;/div&gt;</p>
