  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification prescribes process requirements for batch processing of used, metal powder originating from an existing additive manufacturing process workflow for reuse in subsequent additive manufacturing of aerospace parts in non-closed loop additive manufacturing machines. Such powders may be pre-alloyed or commercially pure. This specification is not limited to a specific additive manufacturing process workflow as the originating source of material to be reused. It is intended to define those procedures and requirements necessary to achieve required cleanliness and performance of metal powder feedstock to be reintroduced into the same additive manufacturing process from which such powder originated. This specification is intended to be used in conjunction with relevant AMS powder specifications and AMS process specifications for additive manufacturing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Unless otherwise specified, powder prepared for reuse following this specification is intended to be conforming in physical and chemical attributes as defined by the originating virgin powder specification for the purposes of producing aerospace parts, providing equivalent characteristics and properties as specified by the corresponding AMS material specification.&lt;/div&gt;&lt;/div&gt;</p>
