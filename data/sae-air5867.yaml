  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report revises ARD50015 document to the AIR format. This report, as was the original, is intended to complement ARP1420C and AIR1419C documents issued by the SAE S-16 Committee on spatial total-pressure distortion. These previous documents addressed only total-pressure distortion and excluded total temperature distortion.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The subject of inlet total temperature distortion is addressed in this report with some background and identification of the problem area. The status of past efforts is reviewed, and an attempt is made to define where we are today. Deficiencies, voids, and limitations in knowledge and test techniques for total temperature distortion are identified.&lt;/div&gt;

    &lt;/div&gt;</p>
