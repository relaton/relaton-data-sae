abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document will provide methodologies and procedures to validate active safety test targets and correlate them to the objects they are intended to represent. This process will be separated into three procedures. The correlation procedure will document a means of measuring representative object characteristics and how to calculate a correlation score for a test target using that objective characteristic measurement. The validation procedure will be utilized to determine the correlation score for the test target. A confirmation procedure will identify unacceptable characteristic deviations of the targets during use in the field. Test targets may include cars, pedestrians, motorcycles, bicycles, or any other object that may be encountered by a vehicle. This document relates only to the radar characteristics of these test targets.&lt;/div&gt;&lt;/div&gt;</p>
