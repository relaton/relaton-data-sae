  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines the requirements for a threadless, flexible, self-bonding coupling assembly which, when installed on machined fixed-cavity ferrules, provides a flexible connection for joining tubing and components in aircraft fuel, vent, or other systems. This assembled coupling, hereafter referred to as the assembly, is designed for use from -65 to +400 °F and at 125 psig nominal operating pressure.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;AS1650 was not designed for the new certification requirements for flammable leakage zones and fuel tanks for lightning protection and assembly redundancy. As such, their use and installation may require additional efforts and equipment to support new FAA CFR compliance. The AS7510 flexible coupling should be the preferred coupling for use in flammable leakage zones and fuel tanks that require service life and functionality for lightning protection and part redundancy.&lt;/div&gt;
    &lt;/div&gt;</p>
