  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended for qualification testing for brake drums used on highway commercial vehicles with air brakes using an inertia-dynamometer procedure.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This Recommended Practice consists of two distinct tests: Part A - durability and speed maintenance test, and Part B - heat check drag sequence test. Each test can be considered to be an independent evaluation of the brake drum which tests different properties.&lt;/div&gt;
    &lt;/div&gt;</p>
