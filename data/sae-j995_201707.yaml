  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the mechanical and material requirements for three grades of steel nuts suitable for use in automotive and related engineering applications, in sizes 1/4 to 1-1/2 inches, inclusive, and with dimensions conforming with the requirements of the latest issue of SAE J482 or ASME B18.2.2, except for machine screw nuts which are not covered in this standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not include limits for surface discontinuities. Where usage requires such control, limits may be specified separately. For sizes 1/4 through 1 inch, this may be done by the statement: “Surface discontinuities shall not exceed the limits specified in ASTM F812/F812M.”&lt;/div&gt;&lt;/div&gt;</p>
