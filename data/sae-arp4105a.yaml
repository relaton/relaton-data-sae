  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is intended to establish preferred abbreviations for terms used on panels, controls, displays, instruments, placards, and markings. The recommendations apply to equipment used by crew members in the flight deck of transport aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The abbreviations, acronyms, and symbols do not supersede those used in airworthiness regulations or aeronautical charts or other aircraft documents.&lt;/div&gt;&lt;/div&gt;</p>
