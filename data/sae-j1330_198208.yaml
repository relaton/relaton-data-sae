  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this information report is to list and explain major equipment, instrumentation, and procedure variables which can affect inter-laboratory differences and repeatability of photometric measurements of various lighting devices listed in SAE Standards and Recommended Practices. The accuracy guidelines listed in the report are for the purpose of controlling variables that are not a direct function of the lighting device being measured. The control of these individual variables is necessary to control the overall accuracy of photometric measurements. These accuracy guidelines apply to the measurement of the luminous intensities and reflected intensities of devices at the specified geometrically distributed test points and areas. These guidelines do not apply to photometric equipment used to measure license plate lamps.&lt;/div&gt;&lt;/div&gt;</p>
