abstract:
- language: en
  script: Latn
  content: "<p>These Rules and Regulations (the 'Rules') govern the operations of
    the Technical Standards Board, Councils/Divisions and Technical Committees.\n\nThe
    Technical Standards Board (the 'Board') is responsible to the SAE Board of Directors.
    \nIt is the duty of the Board to promote and supervise technical committee activities
    of SAE including participation in technical committees of other organizations
    to approve and issue technical reports including standards, recommended practices,
    and information reports (hereinafter collectively  referred to as 'Technical Reports')
    resulting from its activities.</p>"
