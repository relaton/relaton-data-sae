    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) describes the procedures for the flammability testing of aircraft firewall sealants in accordance with the requirements of FAR Part 25 Sections 25.865, 25.867, 25.1191, and 25.1193. This test method is intended to determine the capability of sealant materials to control the passage of and effects from fire.&lt;/div&gt;
    &lt;/div&gt;</p>
