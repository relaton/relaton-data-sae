  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes uniform requirements and procedures for the fire testing of flexible hose assemblies and rigid tube assemblies (including coiled tubes) to be used in aircraft or aerospace vehicle fluid systems. These procedures may also be followed for fire tests on other piping components as specified by the customer. It also refers to standard fire test equipment to be used in conducting "referee" fire tests.&lt;/div&gt;
    &lt;/div&gt;</p>
