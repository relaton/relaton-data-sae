    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended for equipment manufacturers in defining and recommending axle and manual transmission lubricants, for oil marketers in labeling such lubricants with respect to viscosity, and for users in following their owner’s manual recommendations. The SAE viscosity grades shown in &lt;span class="xref"&gt;Table 1&lt;/span&gt; constitute a classification for axle and transmission lubricants in terms of viscosity only; the change in viscosity with use, or other gear lubricant qualities, are not considered.&lt;/div&gt;
    &lt;/div&gt;</p>
