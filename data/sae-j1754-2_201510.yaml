  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers ordering information for steel wire reinforced rubber hose assemblies using connectors specified in SAE Standard J516 or all parts of ISO 12151 for use in hydraulic systems using petroleum based hydraulic fluids with maximum working pressures of 1.7 to 42 MPa. See SAE J1754-2, &lt;span class="xref"&gt;Table 8&lt;/span&gt; for hose operating temperature ranges and identification codes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Working pressure is defined as maximum system pressure.&lt;/div&gt;&lt;/div&gt;</p>
