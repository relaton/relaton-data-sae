  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides recommended practices for the cleaning of aircraft oxygen equipment, both metallic and non-metallic articles, such as oxygen lines (tubes, hoses, etc.), components (including regulator and valve parts), cylinders, and ground-based equipment that may be used to support aircraft oxygen systems. This document also specifies work area details, methods for selecting suitable cleaning agents, cleaning methods, and test methods for verifying levels of cleanliness. The cleanliness coding scheme specified in this document provides a method for documenting minimum cleanliness level requirements and for identifying compliance.&lt;/div&gt;
    &lt;/div&gt;</p>
