    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the test requirements for abrasion resistance of webbing when used in buckles or other manual adjusting devices normally used to adjust the length of seat belt assemblies such as those described in SAE J4. These requirements are applicable to tests conducted according to the procedure described in SAE J339.&lt;/div&gt;&lt;/div&gt;</p>
