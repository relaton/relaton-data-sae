  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies the minimum recommendations for Blind Spot Monitoring System (BSMS) operational characteristics and elements of the user interface. A visual BSMS indicator is recommended.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;BSMS detects and conveys to the driver via a visual indicator the presence of a target (e.g., a vehicle), adjacent to the subject vehicle in the “traditional” Adjacent Blind Spot Zone (ABSZ). The BSMS is not intended to replace the need for interior and exterior rear-view mirrors or to reduce mirror size. BSMS is only intended as a supplement to these mirrors and will not take any automatic vehicle control action to prevent possible collisions. While the BSMS will assist drivers in detecting the presence of vehicles in their ABSZ, the absence of a visual indicator will not guarantee that the driver can safely make a lane change maneuver (e.g., vehicles may be approaching rapidly outside the ABSZ area).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to original equipment and aftermarket BSMS systems for passenger vehicles. This document does not apply to installing a BSMS on either motorcycles or commercial vehicles. Finally, this document does not address Lane Change Warning systems, which monitor areas substantially farther back than the side blind spot areas monitored by the BSMS (See ISO FDIS 17387).&lt;/div&gt;&lt;/div&gt;</p>
