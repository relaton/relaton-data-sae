  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers the requirements for the types of glass to be utilized in the fabrication of cover glasses and lighting wedges used in aerospace instruments. It defines the maximum extent of physical defects and recommends standard methods of inspection and evaluation. Definitions of terminology used in this document are covered in &lt;span class="xref"&gt;2.2&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
