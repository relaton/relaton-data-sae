  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) describes the different aspects of corrosion on helicopter powerplants, on the components that are affected, and the subsequent consequences on the helicopter, engine durability, performance, and dependability.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Guidelines that minimize corrosion during the design stage and during service operation are also discussed.&lt;/div&gt;&lt;/div&gt;</p>
