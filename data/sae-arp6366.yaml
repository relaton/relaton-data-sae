  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;ARP6366 defines a comprehensive and widely-accepted set of specification guidelines to be considered by those seeking to use or design fiber optic sensors for aerospace applications. Some of the most common applications for fiber optic sensing within aerospace include inertial guidance and navigation (gyros) and structural monitoring (temperature, strain, and vibration sensing). Common sensor infrastructure elements include: transmitting and receiving opto-electronics (e.g., sources and receivers); multiplexing and demultiplexing optics; optical cabling; and signal processing (both hardware and firmware/software).&lt;/div&gt;&lt;/div&gt;</p>
