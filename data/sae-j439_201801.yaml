    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice covers methods for measuring or evaluating five properties or characteristics of sintered carbide which contribute significantly to the performance of sintered carbide tools. These properties are: hardness, specific gravity, apparent porosity, structure, and grain size. They are covered under separate headings below.&lt;/div&gt;&lt;/div&gt;</p>
