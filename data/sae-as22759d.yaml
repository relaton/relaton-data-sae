  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AS22759 specification covers fluoropolymer-insulated single conductor electrical wires made with tin-coated, silver-coated, or nickel-coated conductors of copper or copper alloy as specified in the applicable detail specification. The fluoropolymer insulation may be polytetrafluoroethylene (PTFE), fluorinated ethylene propylene (FEP), polyvinylidene fluoride (PVF&lt;sub&gt;2&lt;/sub&gt;), ethylene-tetrafluoroethylene copolymer (ETFE), or other Fluoropolymer resin. The fluoropolymer may be used alone or in combination with other insulation materials. These abbreviations shall be used herein. When a wire is referenced herein, it means an insulated conductor (see &lt;span class="xref"&gt;7.7&lt;/span&gt;).&lt;/div&gt;


    &lt;/div&gt;</p>
