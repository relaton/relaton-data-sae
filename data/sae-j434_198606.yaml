  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the hardness and microstructure requirements for ductile iron castings used in automotive and allied industries. Castings may be specified in the as-cast or heat treated condition.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Appendix provides general information on the application of ductile iron castings and their chemical composition to meet hardness microstructure and other properties needed for particular service conditions. The mechanical properties in the Appendix are provided for design purposes.&lt;/div&gt;&lt;/div&gt;</p>
