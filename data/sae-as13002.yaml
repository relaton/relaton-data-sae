  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the process to be applied to design characteristics (as defined in AS9102), parts or inspection processes as defined by the purchaser. Design characteristics not included within the scope include electronic, electromechanical or mechanical systems where alternative means of acceptance are approved such as through acceptance test procedures (ATPs). This document does not define processes for identifying or communicating the classification of the parts or design characteristics.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not define the procedure to qualify a supplier to undertake these requirements. It is expected that each purchaser will have a procedure to manage the flow-down of these requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to suppliers that demonstrate adequate proficiency in applicable process control methods as determined by the purchaser.&lt;/div&gt;
    &lt;/div&gt;</p>
