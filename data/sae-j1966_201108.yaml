    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the requirements for nondispersant, mineral lubricating oils to be used in four-stroke cycle piston aircraft engines. This document covers the same lubricating oil requirements as the former military specification MIL-L-6082. Users should consult their airframe or engine manufacturers manuals for the latest listing of acceptable lubricants.&lt;/div&gt;

    &lt;/div&gt;</p>
