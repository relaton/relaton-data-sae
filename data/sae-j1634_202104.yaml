  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform procedures for testing battery electric vehicles (BEVs) which are capable of being operated on public and private roads. The procedure applies only to vehicles using batteries as their sole source of power. It is the intent of this document to provide standard tests which will allow for the determination of energy consumption and range for light-duty vehicles (LDVs) based on the federal emission test procedure (FTP) using the urban dynamometer driving schedule (UDDS) and the highway fuel economy driving schedule (HFEDS) and provide a flexible testing methodology that is capable of accommodating additional test cycles as needed. Additionally, this SAE Recommended Practice provides five-cycle testing guidelines for vehicles performing supplementary testing on the US06, SC03, and cold FTP procedure. Realistic alternatives should be allowed for new technology. Evaluations are based on the total vehicle system’s performance and not on subsystems apart from the vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The range and energy consumption values specified in this document are the raw, test-derived values. Additional corrections are typically applied to these quantities when used for regulatory purposes (corporate average fuel economy, vehicle labeling, etc.).&lt;/div&gt;&lt;/div&gt;</p>
