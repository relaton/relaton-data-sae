  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The gaging practice established in this standard applies for final assessment of dimensional acceptability of the product complete thread (excluding the incomplete lead or runout thread). However, it is not the intent of this standard to preclude the use of other gaging systems or dimensional control systems provided they are properly correlated by the user and yield comparable results with respect to conformance with the requirements of ANSI B1.21M-1978, MJ metric screw threads.&lt;/div&gt;&lt;/div&gt;</p>
