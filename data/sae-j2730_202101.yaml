  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a test method for measuring the forces and moments generated at a high frequency response spindle when a rolling tire impacts a cleat. The cleat is configured either with its crest perpendicular, 90 degrees, to the path of the tire or optionally with its crest inclined at an angle to the path of the tire. The carriage to which the spindle is attached is rigidly constrained in position during each test condition to provide a good approximation to fixed loaded radius operation. The method discussed in this document provides impact force and moment time histories essentially free from variations due to tire non-uniformities. The method applies to any size tire so long as the equipment is properly scaled to conduct the measurements for the intended test tire. The data are suitable for use in determining parameters for road load models and for comparative evaluations of the measured properties in research and development.&lt;/div&gt;
    &lt;/div&gt;</p>
