  content: |-
    <p>The cautionary statements presented in this SAE Information Report  are to be included in all current and future SAE Standards involving service practices (J2211) and service equipment (J2210) for HFC-134a refrigerant.

    It is also intended that these cautionary statements (or equivalent  language) be recommended for inclusion in all publications dealing with the servicing of HFC-134a mobile air conditioning systems.</p>
