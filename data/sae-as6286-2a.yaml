  content: |-
    <p>&lt;p&gt;This document covers the standards of de-icing/anti-icing equipment.&lt;/p&gt;
    &lt;p&gt;In conjunction with the main document and other related slash sheets it will provide guidelines for the proper procedures to deice and anti-ice aircraft on the ground information to support this training program is provided to make the material a better tool for the preparation and execution of the training &amp;amp; qualification. It is intended to provide a common basis for de-icing/anti-icing training and qualification for de- icing providers and airlines. This material was compiled using various international documents with support from SAE documents and individually contributed editorial comments. Its purpose is to serve as a "Globalized Deicing Training Manual".&lt;/p&gt;</p>
