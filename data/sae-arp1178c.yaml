    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice recommends general criteria for the development and installation of an aircraft emergency signal system to permit any crew member (flight or cabin) to inform all other crew members that an emergency evacuation situation exists and that an evacuation has been or should be immediately started.&lt;/div&gt;
