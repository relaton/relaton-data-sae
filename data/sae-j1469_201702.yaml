    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides procedures and methods for testing service, spring applied parking, and combination brake actuators with respect to durability, function, and environmental performance. A minimum of six test units designated A, B, C, D, E, and F are to be used to perform all tests per &lt;span class="xref"&gt;1.1&lt;/span&gt; and &lt;span class="xref"&gt;1.2&lt;/span&gt;.&lt;/div&gt;


    &lt;/div&gt;</p>
