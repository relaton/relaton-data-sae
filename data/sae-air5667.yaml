  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to serve as a resource to aerospace designers who are planning to utilize Wavelength Division Multiplexed (WDM) interconnects and components. Many WDM commercial systems exist and they incorporate a number of existing, commercially supported, standards that define the critical parameters to guide the development of these systems. These standards ensure interoperability between the elements within these systems. The commercial industry is motivated to utilize these standards to minimize the amount of tailored development.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;However, since some of the aerospace parameters are not satisfied by the commercial devices, this document will also try to extend the commercial parameters to those that are necessary for aerospace systems. The document provides cross-references to existing or emerging optical component and subsystem standards. These parameter definitions, test methods, and procedures typically apply to telecommunications application and in some cases may require refining to adapt them to aerospace optical network and system applications.&lt;/div&gt;&lt;/div&gt;</p>
