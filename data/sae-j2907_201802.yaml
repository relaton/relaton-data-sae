  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document was developed to provide a method of obtaining repeatable measurements that accurately reflects the performance of a propulsion electric drive subsystem, whose output is used in an electrified vehicle regardless of complexity or number of energy sources. The purpose is to provide a familiar and easy-to-understand performance rating. Whenever there is an opportunity for interpretation of the document, a good faith effort shall be made to obtain the typical in-service performance and characteristics and avoid finding the best possible performance under the best possible conditions. Intentional biasing of operating parameters or assembly tolerances to optimize performance for this test shall not be considered valid results in the scope of this document.&lt;/div&gt;


    &lt;/div&gt;</p>
