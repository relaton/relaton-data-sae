  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes the factors which should be considered in the design and installation of a commercial transport rotorcraft hydraulic system, including the applicable airworthiness regulations that affect the hydraulic system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP also provides information and guidelines on the many factors that arise in the design process to provide cost effectiveness, reliability, maintainability and accepted design and installation practices.&lt;/div&gt;&lt;/div&gt;</p>
