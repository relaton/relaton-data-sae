  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Specific gravity is a nondestructive test used as a quality control check of the consistency of formulation and processing of brake lining. The specific gravity and the range of specific gravity are peculiar to each formulation and, therefore, the acceptable values or range must be established for each formulation by the manufacturer. Specific gravity alone shows nothing about a materials in use performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specific gravity of sintered metal powder friction materials, particularly those which have steel backing members, is usually determined somewhat differently. Reference ASTM B 376.&lt;/div&gt;
    &lt;/div&gt;</p>
