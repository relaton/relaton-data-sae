abstract:
- language: en
  script: Latn
  content: |-
    <p>This part of SAE J551 specifies Bulk Current Injection (BCI) test methods and procedures for testing the electromagnetic immunity of electronic components for passenger cars and commercial vehicles.  The electromagnetic disturbance, considered in this part of SAE J551, will be limited to continuous narrow band electromagnetic fields.
    SAE J551-1 specifies general, definitions, practical use, and basic principles of the test procedure.</p>
