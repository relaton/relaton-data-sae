  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aeronautical Standard covers two basic types of temperature indicators as follows:
    &lt;div class="table-wrap anchor "&gt;
    &lt;div class="table-container"&gt;&lt;table class="br-none tbr-void " data-dataset-id=""&gt;
    &lt;tbody&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;TYPE I&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;-&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Ratiometer type actuated by changes of electrical resistance of a temperature sensing electrical resistance element; the resistance changes being obtained by temperature changes of the temperature sensing resistance element.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;TYPE II&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;-&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Millivoltmeter type, operated and actuated by varying e.m.f. output of a thermocouple, the varying e.m.f. input to the instrument being obtained by temperature changes of the temperature sensing thermocouple.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div/&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;</p>
