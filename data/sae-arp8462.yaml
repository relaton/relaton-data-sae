  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The high-temperature deposition test (HTDT) method is designed to evaluate the deposition and degradation characteristics of turbine lubricants when stressed under mixed-phase flow conditions found in certain parts of aviation gas turbine engines. This method is applicable to lubricants that form deposits in the range of 0.1 to 100 mg during the course of a test.&lt;/div&gt;&lt;/div&gt;</p>
