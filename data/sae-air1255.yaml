  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR was prepared to inform the aerospace industry about the electromagnetic interference measurement capability of spectrum analyzers. The spectrum analyzers considered are of the wide dispersion type which are electronically tuned over an octave or wider frequency range. The reason for limiting the AIR to this type of spectrum analyzer is that several manufacturers produce them as general-purpose instruments, and their use for EMI measurement will give significant time and cost savings. The objective of the AIR is to give a description of the spectrum analyzers, consider the analyzer parameters, and describe how the analyzers are usable for collection of EMI data. The operator of a spectrum analyzer should be thoroughly familiar with the analyzer and the technical concepts reviewed in this AIR before performing EMI measurements.&lt;/div&gt;&lt;/div&gt;</p>
