  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines a method for evaluating the immunity of automotive electrical/electronic devices to radiated electromagnetic fields coupled to the vehicle wiring harness. The method, called bulk current injection (BCI), uses a current probe to inject RF onto the wiring harness in the frequency range of 1 to 400 MHz. BCI is one of a number of test methods that can be used to simulate the electromagnetic field.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test method refers to ISO 11452-4 (please refer to ISO 11452-4 for test procedures).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In addition to ISO 11452-4, this test method also includes a differential bulk current injection (DBCI) test. DBCI is described in &lt;span class="xref"&gt;Section 4&lt;/span&gt; of this document.&lt;/div&gt;&lt;/div&gt;</p>
