    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice is intended to outline the design, installation, testing, and field maintenance criteria for a high temperature metal pneumatic duct system, for use as a guide in the aircraft industry. These recommendations are to be considered as currently applicable and necessarily subject to revision from time to time, as a result of the rapid development of the industry.&lt;/div&gt;&lt;/div&gt;</p>
