abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes equipment and procedures for the evaluation of the effectiveness and other performance characteristics of spark arresters or turbochargers used on the exhaust system of large engines normally used in a railroad locomotive, stationary power plant, and other similar applications. This document does not cover applications requiring flame arresting, exhaust gas cooling, or isolation from explosive gases. Two test methods are presented: a laboratory test using ambient air (cold test) and an engine test using exhaust gases (hot test). The hot test is preferred.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Arresters tested by the provisions of this document can be expected to perform as tested when tilted no more than 45 degrees from their normal position. Test results from a spark arrester or turbocharger evaluated by the hot test can be applied to different engines of similar design, provided the data shows it to be effective in the applicable flow ranges.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Certain design and performance characteristics, which represent current requirements by regulatory agencies for qualification and approval under this document, are listed in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
