  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides recommended practices for the calibration and acceptance of icing wind tunnels to be used in testing of aircraft components and systems and for the development of simulated ice shapes. This document is not directly applicable to air-breathing propulsion test facilities configured for the purposes of engine icing tests, which are covered in AIR6189. This document also does not provide recommended practices for creating Supercooled Large Drop (SLD) or ice crystal conditions, since information on these conditions is not sufficiently mature for a recommended practice document at the time of publication of ARP5905A. Use of facilities as part of an aircraft’s ice protection Certification Plan should be reviewed and accepted by the applicable regulatory agency prior to testing. Following acceptance of a test plan, data generated in these facilities may be submitted to regulatory agencies for use in the certification of aircraft ice protection systems and components. Certain types of tests may be appropriate in facilities with capabilities that are not as rigorously characterized by the practices defined herein, and the acceptability of these tests should be coordinated with the applicable regulatory agency.&lt;/div&gt;
    &lt;/div&gt;</p>
