  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) discusses design philosophy, system and equipment requirements, environmental conditions, and design considerations for rotorcraft environmental control systems (ECS). The rotorcraft ECS comprises that arrangement of equipment, controls, and indicators which supply and distribute dehumidified conditioned air for ventilation, cooling and heating of the occupied compartments, and cooling of the avionics. The principal features of the system are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A controlled fresh air supply&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A means for cooling (air or vapor cycle units and heat exchangers)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A means for removing excess moisture from the air supply&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A means for heating&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A temperature control system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A conditioned air distribution system&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The ARP is applicable to both civil and military rotorcraft where an ECS is specified; however, certain requirements peculiar to military applications—such as nuclear, biological, and chemical (NBC) protection—are not covered. The integration of NBC protection into aircraft ECS is discussed in AIR4362.&lt;/div&gt;
    &lt;/div&gt;</p>
