abstract:
- language: en
  script: Latn
  content: |-
    <p>To subjectively evaluate engine starting behavior and driveability characteristics of a motor vehicle which has been soaked at ambient temperature for a given time period after attaining a stabilized engine coolant temperature. This SAE Recommended Practice also defines driveability defects and the rating system.

    This evaluation may be affected by ambient temperature, altitude, fuel, and the road system.

    The vehicle should be evaluated with all fuels recommended by the manufacturer. A partial list comprises reformulated gasoline, ethanol/gasoline and methanol/gasoline blends of various proportions, diesel #1, and diesel #2.</p>
