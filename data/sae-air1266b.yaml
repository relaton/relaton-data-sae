  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) outlines concepts for the design and use of fault isolation equipment that have general application. The specific focus is on fault isolation of environmental control systems (ECS) in commercial transports. Presented are general fault isolation purposes, design principles, and demonstration of compliance criteria. These are followed by three design examples to aid in understanding the design principles. Future trends in built-in-test-equipment (BITE) design are discussed, some of which represent concepts already being implemented on new equipment.&lt;/div&gt;
    &lt;/div&gt;</p>
