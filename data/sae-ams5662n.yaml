  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion and heat-resistant nickel alloy in the form of bars, forgings, flash welded rings, and stock for forging, flash welded rings, or heading 10.00 inches (254 mm) and under in nominal diameter or least distance between parallel sides, having a maximum cross-sectional area of 78 in&lt;sup&gt;2&lt;/sup&gt; (503 cm&lt;sup&gt;2&lt;/sup&gt;), and forging stock of any size (see 8.5).&lt;/div&gt;&lt;/div&gt;</p>
