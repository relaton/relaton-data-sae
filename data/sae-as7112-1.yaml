  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) is to be used as a supplement to SAE AS7112. In addition to the requirements contained in AS7112, the requirements contained herein shall apply to suppliers seeking NADCAP Fluid System Components Accreditation for Hose Manufacturer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Hose may be manufactured as a "Qualified" end item (bulk) or to be qualified as part of an assembly. The corresponding PRI Audit Criteria (AC) is to be applied to ensure the hose is manufactured to the applicable specification(s) and standard(s).&lt;/div&gt;&lt;/div&gt;</p>
