  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard specifies the dimensions and design requirements that are required to produce a typical bulkhead fitting used with aircraft oxygen equipment. This fitting may come in different configurations; however, the end design remains the same for all configurations. The purpose of fittings designed using this standard is to mate applicable oxygen equipment, e.g., an oxygen filling cart connection mated with an aircraft oxygen port for refilling of the oxygen system supply, mating two sensing lines, etc. Dimensions are developed from AND10089 and AS4377.&lt;/div&gt;
    &lt;/div&gt;</p>
