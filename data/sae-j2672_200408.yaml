  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Information Report relates to a special class of automotive adaptive equipment which consists of modifications to the hydraulic control mechanism of Original Equipment Manufacturer (OEM) power steering systems provided as original equipment on personally licensed vehicles. These modifications are generically called "reduced effort power steering". The purpose of the modification is to lower the amount of driver effort required to operate the steering system. Retention of reliability, ease of use for physically disabled drivers and maintainability are of primary concern. Because this is an Information Report, the numerical values for performance measurements presented in this report and in the accompanying Test Procedure, while based upon the best knowledge available at the time, have not been validated by a testing of the Test Procedure.&lt;/div&gt;&lt;/div&gt;</p>
