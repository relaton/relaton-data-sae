  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard defines FOD Prevention Program requirements for organizations that design, develop, and provide aviation, space, and defense products and services; and by organizations providing post-delivery support, including the provision of maintenance, spare parts, or materials for their own products and services.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is emphasized that the requirements specified in this standard are complementary (not alternative) to customer, and applicable statutory and regulatory requirements. Should there be a conflict between the requirements of this standard and applicable statutory or regulatory requirements, the latter shall take precedence.&lt;/div&gt;&lt;/div&gt;</p>
