    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides a method to obtain consistent force-deflection data of finished (or unfinished, when specified) cushioned components of seats for off-road work machines as listed in SAE J1116 JUN86. This data may be helpful in maintaining seat comfort characteristics and quality control. There is no intent to establish any acceptance criteria.&lt;/div&gt;&lt;/div&gt;</p>
