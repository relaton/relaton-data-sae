  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) covers the requirements for polytetrafluoroethylene (PTFE) hose assemblies for use in aerospace hydraulic, fuel, and lubricating oil systems at temperatures between -67°F and 450°F for Class I assemblies, -67°F and 275°F for Class II assemblies, and at nominal pressures up to 1500 psi. The hose assemblies are also suitable for use within the same temperature and pressure limitations in aerospace pneumatic systems where some gaseous diffusion through the wall of the PTFE liner can be tolerated.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The use of these hose assemblies in pneumatic storage systems is not recommended. In addition, installations in which the limits specified herein are exceeded, or in which the application is not covered specifically by this standard, for example oxygen, shall be subject to the approval of the purchaser.&lt;/div&gt;&lt;/div&gt;</p>
