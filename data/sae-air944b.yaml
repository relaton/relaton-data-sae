    &lt;div class="htmlview paragraph"&gt;The material contained in this report has been simplified to facilitate its use. Specific manufacturers should be contacted for more detailed information. Many of the basic power supplies are available in numerous configurations and some provide shaft power or electrical power in addition to the pneumatic capability. Vehicles for the ground transportation of the power supplies are also varied to fit specific requirements.&lt;/div&gt;&lt;/div&gt;</p>
