    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Differences, where they exist, are shown in the appendix with associated rationale.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the most commonly used terms for piston rings. These terms designate either types of piston rings or certain characteristics and phenomena of piston rings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The terms and definitions apply to piston rings for reciprocating internal combustion engines and compressors working under analogous conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;An &lt;span class="xref"&gt;addendum&lt;/span&gt; is included which lists equivalent terms in English, French, Russian, German, Spanish, Portuguese, Italian, and Japanese.&lt;/div&gt;&lt;/div&gt;</p>
