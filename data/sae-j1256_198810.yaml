    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure is a modification of the urban driving cycles noted in SAE J1082 and which is run on a suitable road or test track. The procedure yields cold start/warm-up fuel economy values indicative of consumer level at the ambient condition of the test. Within referenced limitations, the procedure can be utilized to determine the fuel economy differential among vehicles or between vehicle changes.&lt;/div&gt;&lt;/div&gt;</p>
