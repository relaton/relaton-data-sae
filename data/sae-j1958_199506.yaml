  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies dimensions and requirements for single-wall steel tubing intended for use as high-pressure fuel injection pipes on a wide range of engines (Class A), and for fuel injection pump testing (Class B, Reference SAE J1418). Tubing shall be cold drawn, annealed or normalized, seamless tubing suitable for cold swaging, cold upsetting, and cold bending.&lt;/div&gt;&lt;/div&gt;</p>
