    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to the anchorage or attachment of seat belts to the structure of motor vehicles. It specifies the type and location of anchorages for the seat belts when the anchorages are provided, the provisions for identifying the location of the attachment points for the seat belts when anchorages are not provided, and the strength requirements.&lt;/div&gt;&lt;/div&gt;</p>
