    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1362 presents graphical symbols for use on operator controls and other displays on construction, general purpose industrial, agricultural, forestry, and specialized mining categories of off-road self-propelled work machines, as defined in SAE J1116. Symbols for agricultural equipment other than the basic agricultural tractor (e.g., combine harvesters, cotton pickers, sprayers, forage harvesters, and balers) are covered by ASAE S304 and are therefore excluded from the scope of SAE J1362.&lt;/div&gt;&lt;/div&gt;</p>
