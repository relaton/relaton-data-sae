  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice provides a method, test set-up, and test conditions for brake hydraulic component flow rate measurement for high differential pressure (&amp;gt;5 bar) flow conditions. It is intended for hydraulic brake components which affect the brake fluid flow characteristics in a hydraulic brake circuit, that are part of a circuit for which the flow characteristics are important to system operation, and that are exposed to high operating pressure differentials (in the 5 to 100 bar range). Typical applications may include measurement of flow through chassis controls valve bodies, orifices in the brake system such as in flow bolts, junction blocks, and master cylinders, and through brake pipe configurations.&lt;/div&gt;&lt;/div&gt;</p>
