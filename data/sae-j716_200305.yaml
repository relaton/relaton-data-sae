abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard gives the specifications and dimensions for the assembly and clearances common to hydraulically-operated cylinders and to trailing-type farm implements.
    The specifications given permit the interchangeability of hydraulic operation between tractors equipped with a cylinder and trailing-type implements designed for this purpose, the tractor possessing enough power at its drawbar to operate the implement; and the transference of the hydraulic cylinder from one implement to another.
