    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report provides additional information and background in regard to the dimensional life of a heat-shrinkable sleeve. The term dimensional life is newly introduced in AS23053 to relate to the dimensional stability instead of the material stability often associated or referred to as the “shelf life.” When the material exceeds such shelf life, it becomes harmful or non-functional.&lt;/div&gt;
    &lt;/div&gt;</p>
