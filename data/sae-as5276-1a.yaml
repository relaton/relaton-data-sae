  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines minimum performance standards and related qualification criteria for add-on child restraint systems (CRS) which provide protection for small children in passenger seats of transport category airplanes. The AS is not intended to provide design criteria that could be met only by an aircraft-specific CRS. The goal of this standard is to achieve child-occupant protection by specifying a dynamic test method and evaluation criteria for the performance of CRS under emergency landing conditions.&lt;/div&gt;

    &lt;/div&gt;</p>
