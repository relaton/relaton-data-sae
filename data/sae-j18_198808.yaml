  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers flexible cellular rubber products known as sponge rubbers and expanded rubbers but does not apply to latex foam rubbers. The base material used in their manufacture may be natural rubber, reclaimed rubber, synthetic rubber or rubber-like materials, alone or in combination. Ebonite cellular rubbers are not included.&lt;/div&gt;&lt;/div&gt;</p>
