  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides recommendations for the function, design, construction, and testing of an on-aircraft Brake Temperature Monitoring System (BTMS), sometimes referred to as a Brake Temperature Indication System (BTIS).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: This ARP does not address:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Cockpit ergonomics and Aircraft operating procedures.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Various handheld methods of temperature sensing or readouts, as these are not associated with transport aircraft during normal operation.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Temperature sensitive paints as a means to indicate exceedance of a landing gear axle temperature threshold due to brake temperature.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;</p>
