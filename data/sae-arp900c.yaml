  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to present test methods that can be utilized to evaluate the filtration and operating characteristics of filters that will be utilized in a cryogenic system. The methods presented herein are intended to supplement standard filter testing specifications to allow evaluation of filter performance characteristics in areas that could be affected by extreme low temperatures.&lt;/div&gt;
