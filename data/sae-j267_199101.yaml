    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform laboratory procedures for fatigue testing certain production disc wheels, and demountable rims intended for normal highway use on trucks, buses, truck-trailers, and multipurpose passenger vehicles. This document does not cover bolt together divided wheels or other special application wheels and rims.&lt;/div&gt;&lt;/div&gt;</p>
