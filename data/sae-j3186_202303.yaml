  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides requirements to support applications for the maneuver sharing and coordinating service (MSCS) beyond broadcast of basic safety messages (BSMs). This is to improve road safety and traffic efficiency by sharing and coordinating vehicle maneuvers via vehicle-to-everything (V2X) communications. This document lays out use case scenarios and defines vehicle-to-vehicle (V2V) application protocols, system requirements and message sets for MSCS. The defined message sets for MSCS will result in identifying new message types, data frames, and data elements for SAE J2735.&lt;/div&gt;&lt;/div&gt;</p>
