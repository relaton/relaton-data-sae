  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The information contained in this report has been simplified to facilitate its use. Specific manufacturers should be contacted for more detailed information. Many of the basic power plants are available in numerous configurations to provide shaft power or electrical power in addition to the pneumatic capability. Vehicles for the ground transportation of the power supplies are also varied to fit specific requirements. The state-of-the-art in small gas turbines has advanced to a point where they are competitive with the more conventional ground power supplies in practically all areas.&lt;/div&gt;&lt;/div&gt;</p>
