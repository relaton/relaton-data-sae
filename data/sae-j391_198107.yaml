abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;"Effective particle or domain size" is a phrase used in X-ray diffraction literature to describe the size of the coherent regions within a material which are diffracting. Coherency in this sense means diffracting as a unit. Small particle size causes X-ray line broadening and as such can be measured. It has been shown related to substructure as observed in transmission electron microscopy. Particle size is affected by hardening, cold working, and fatigue; conversely, there is increasing evidence that particle size, per se, affects both static and dynamic strength.&lt;/div&gt;&lt;/div&gt;</p>
