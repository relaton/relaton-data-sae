  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies the procedure to be used for a manufacturer to certify the net power and torque rating of a production engine according to SAE J1349 (Rev. 8/04) or the gross engine power of a production engine according to SAE J1995.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Manufacturers who advertise their engine power and torque ratings as Certified to SAE J1349 or SAE J1995 shall follow this procedure. Certification of engine power and torque to SAE J1349 or SAE J1995 is voluntary, however, this power certification process is mandatory for those advertising power ratings as “Certified to SAE J1349”.&lt;/div&gt;


    &lt;/div&gt;</p>
