    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard includes hydraulic backhoes which have no more than 190 deg of rotational swing, and are mounted on wheel tractors and crawler tractors. Illustrations used are not intended to include all existing commercial machines or to be exact descriptions of any particular machine. The illustrations have been chosen to describe the principles to be used in applying this standard.&lt;/div&gt;
