  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the minimum performance requirements for pelvic restraint systems (seat belts, anchorages, and the fastening elements of seat belts) necessary to restrain an operator or rider within a roll-over protective structure (ROPS) in the event of a machine roll-over, as defined in ISO 3471, ISO 8082-1, ISO 8082-2, ISO 12117-2, and ISO 13459, or tip-over protection structure (TOPS), in the event of a machine tip over as defined in ISO 12117. This standard provides guidance and recommendations for information included in the machine operator manual.&lt;/div&gt;
    &lt;/div&gt;</p>
