  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The range of test conditions on the dynamometer shall be sufficient to determine the primary operating characteristics corresponding to the full range of vehicle operations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The characteristics to be determined are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Torque ratio versus speed ratio and output speed.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Input speed versus speed ratio and output speed.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Efficiency versus speed ratio and output speed.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Capacity factor versus speed ratio and output speed.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Input torque versus input speed.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: For more information about these characteristics and the design of hydrodynamic drives, see "Design Practices--Passenger Car Automatic Transmissions," SAE Advances in Engineering, Vol. 5.&lt;/div&gt;&lt;/div&gt;</p>
