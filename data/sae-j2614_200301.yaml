  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers sub-critically annealed electric resistance welded and cold-drawn single-wall high strength low alloy steel tubing intended for use in hydraulic pressure lines and in other applications requiring tubing of a quality suitable for bending, flaring, cold forming, welding and brazing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The grade of material produced to this specification is of micro-alloy content and is considerably stronger and intended to service higher pressure applications than like sizes of the grades of material specified in SAE J525 and SAE J2467. Due to the alloy content of the material, the forming characteristics of the finished tube are equal to or better, when compared to SAE J525 and SAE J2467. Nominal reference working pressures for this tubing are listed in SAE J1065.&lt;/div&gt;&lt;/div&gt;</p>
