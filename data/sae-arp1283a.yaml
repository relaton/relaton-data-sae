    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes design guidance for adequate and safe cargo compartment and cargo access lighting systems. The adoption of a standard set of illumination values, found appropriate for the performance of the task in specified areas, should expedite ground handling and improve flight and ground safety.&lt;/div&gt;&lt;/div&gt;</p>
