  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to 12 V, flooded lead acid automotive storage batteries of 180 minutes or less reserve capacity using cast positive grid technology only. This life test simulates automotive service when the battery operates in a voltage regulated charging system. It subjects the battery to charge and discharge cycles comparable to those encountered in automotive service. Other performance and dimensional information is contained in the latest issue of SAE J537.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended as a guide toward standard practice, but may be subject to change to keep pace with experience and technical advances.&lt;/div&gt;
    &lt;/div&gt;</p>
