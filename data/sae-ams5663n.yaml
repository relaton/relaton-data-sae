  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion and heat-resistant nickel alloy in the form of bars, forgings, flash welded rings up to 10 inches (254 mm) in least cross-sectional dimension, having a maximum cross-sectional area of 78 in&lt;sup&gt;2&lt;/sup&gt; (503 cm&lt;sup&gt;2&lt;/sup&gt;), and stock of any size for forging or flash welded rings (see &lt;span class="xref"&gt;8.5&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
