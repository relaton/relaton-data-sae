  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report is the listing of recommendations for shelf storage for hydraulic brake components. Included in brake components are wheel cylinders, master cylinders, combination valves, and disc brake caliper assemblies. This document is not a specification. This document embodies the analyses and experiences of many users and manufacturers. Where specific manufacturers' recommendations are made, those recommendations shall supersede the recommendations of this document. This document lists the successful procedures and practices associated with brake components based on long experience of a wide cross section of manufacturers and users. The practices are expected to be applied to all brake components where SAE standards are applicable.&lt;/div&gt;
    &lt;/div&gt;</p>
