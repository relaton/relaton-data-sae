  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This metric SAE Aerospace Information Report (AIR) details a ball-on-cylinder (BOC) test device and specifies a method of rating the relative lubricity of aviation turbine fuel samples. The BOC produces a wear scar on a stationary steel ball by forcing it with a fixed load against a fuel wetted steel test ring in a controlled atmosphere. The test ring is rotated at a fixed speed so its surface is wetted by a momentary exposure to the fluid under test. The size of the wear scar is a measure of the test fluid lubricity and provides a basis for predicting friction or wear problems.&lt;/div&gt;&lt;/div&gt;</p>
