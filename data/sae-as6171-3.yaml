  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;XRF technique for counterfeit detection is applicable to electrical, electronic and electromechanical (EEE) parts as listed in AS6171 General Requirements. In general, the detection technique is meant for use on piece parts prior to assembly on a circuit board or on the parts that are removed from a circuit board. The applicability spans a large swath of active, passive and electromechanical parts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;If AS6171/3 is invoked in the contract, the base document, AS6171 General Requirements shall also apply.&lt;/div&gt;
    &lt;/div&gt;</p>
