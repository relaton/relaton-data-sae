  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The specific performance requirements preceding each test in &lt;span class="xref"&gt;Section 9&lt;/span&gt; have been written to define certain characteristics of the machine. Conformance with the tests constitutes what is considered minimum proof that the machine will meet these requirements. The test procedures will not prove conformance with all requirements over the full range of all variables, neither will they measure nor define the exact reasons for nonconformance in a given test.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Failure of a machine to conform may be due to shortcomings in specific components or to more general reasons such as lack of ruggedness, improper leveling or anchoring to the floor, etc.&lt;/div&gt;&lt;/div&gt;</p>
