abstract:
- language: en
  script: Latn
  content: "<p>This specification covers an aluminum alloy in the form of die forgings,
    hand forgings, rolled rings, and stock for forgings on rolled rings. Primarily
    for applications, such as aircraft structural members, requiring material with
    moderately high strength.  Certain design and processing procedures may cause
    these forgings to become susceptible to stress corrosion cracking; ARP 823 recommends
    practices to minimize such conditions.</p>"
