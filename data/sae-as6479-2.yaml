    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This detail specification defines fiber optic fusion splicers acceptable for the installation and repair of a wide range of optical fibers and cables with virtually no insertion loss, particularly in aerospace applications, but not in flammable or explosive atmospheres (Type II). The requirements for acquiring the splicer described herein shall consist of this specification and the latest issue of AS6479.&lt;/div&gt;&lt;/div&gt;</p>
