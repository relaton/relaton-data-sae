  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) is a historical technical record describing procedures, required continuous sampling conditions, and instrumentation for the measurement of non-volatile particle number and mass concentrations from the exhaust of aircraft gas turbine engines. Procedures are included to calculate sampling loss performance. This AIR is not intended for in-flight testing, nor does it apply to engine operating in the afterburning mode.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report is a historical technical record of the initial document detailing the measurement of non-volatile particle emissions at the exit plane of aircraft gas turbine engines. This methodology was adopted by ICAO into Annex 16 Vol II and updated into Aerospace Recommended Practice ARP6320.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Future updates of this document may include explanations of the reasoning and assumptions used to develop this measurement methodology.&lt;/div&gt;&lt;/div&gt;</p>
