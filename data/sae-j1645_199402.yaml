  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Information Report is to provide a summary of the electrostatic charge phenomenon (as it relates to an automotive fuel system) and how that phenomenon could be handled if it develops. The "fuel system" that is the subject of this document is the group of components used during the operation of the vehicle (tank, filler neck, pump, filter, lines, connectors, etc.). Electrostatic charge that may arise during refueling is also included.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is very important to note that this is a collection of ideas and generalities that are summarized from literature and presentations, inferred from some laboratory experimentation, and interpreted by the Electrostatics Subcommittee of the SAE Fuel Lines and Fittings Standards Committee. Some of the discussions are simplified. If more technical information is needed by users of this document, experts should be consulted or literature should be examined directly.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Any questions that arise concerning a specific fuel system should be handled by direct testing or other experimentation involving the system or individual components. This document may be useful for providing guidelines on how to proceed.&lt;/div&gt;&lt;/div&gt;</p>
