abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The task of chemical process operator in the parts cleaning area is generally considered unskilled labor and in the past, little or no training had been provided or recommended. Since overhaul cleaning is a critical process step prior to visual and fluorescent penetrant inspection processes, consideration must be given to minimum levels of training for these process operators. It is the responsibility of the department supervisor to ensure that all personnel within the department are trained to acceptable level in all general aspects of health and safety and basic operating procedures.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended to augment the local quality control system which will control the application and frequency of the guidelines stated within.&lt;/div&gt;
    &lt;/div&gt;</p>
