    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion- and heat-resistant nickel alloy in the form of bars, forgings, flash-welded rings under 4 inches (102 mm) in least cross-sectional dimension, and stock of any size for forging or flash-welded rings (see &lt;span class="xref"&gt;8.3&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
