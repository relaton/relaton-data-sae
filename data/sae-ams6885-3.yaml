  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Purchasing Specification, AMS6885/3, specifies the batch release and delivery requirements for unidirectional carbon fiber tape epoxy prepreg used for repair. This specification is applicable only when the unidirectional carbon fiber tape epoxy prepreg is used as part of the repair system defined in AMS6885 and AMS6885/1.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification also defines the procedure and requirements for storage life extension of materials purchased against this specification. It is only applicable for materials qualified against AMS6885 (refer to PRI-QPL-AMS6885) and shall be carried out within the responsibility of the purchaser and under control of its Quality organisation.&lt;/div&gt;
    &lt;/div&gt;</p>
