  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides a comprehensive overview of primary water content measurement instrumentation, for both facility-based icing research and in-flight icing research, over the range of commonly used aircraft certification icing envelopes. It includes information on the theory of operation of the instruments, system errors and limitations, and practical considerations when using them for cloud characterization. This document does not address other icing cloud measurements of interest, such as particle sizing, or measurement of phenomena such as snow, sleet, or hail.&lt;/div&gt;
    &lt;/div&gt;</p>
