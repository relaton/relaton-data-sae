  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the minimum requirements for nonmetallic tubing as manufactured for use in air brake systems. Non-reinforced products are designated type A and reinforced products, type B. It is not intended to cover tubing for any portion of the system which operates below −40 °C, above +93 °C, above a maximum working gage pressure of 1.0 MPa, or in an area subject to attack by battery acid. This tubing is intended for use in the brake system for connections, which maintain a basically fixed relationship between components during vehicle operation. Coiled tube assemblies required for those installations where flexing occurs are covered by this document, SAE J1131, and SAE J2494-3 to the extent of setting minimum requirements on the essentially straight tube and tube fitting connections which are used in the construction of such assemblies&lt;span class="xref"&gt;&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
