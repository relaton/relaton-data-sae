  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice provides a procedure for measuring quantitatively the physical characteristics of linear impactors that are believed to effect impact test accuracy, repeatability, and reproducibility. Suggested values and tolerance are also provided for specific applications of linear impactor testing (i.e. Ejection Mitigation tests, Head form Impact tests, Body Block tests). Two functional groups of linear impactors are considered, those whose function is related primarily to displacement and those related to measuring acceleration or force.&lt;/div&gt;

    &lt;/div&gt;</p>
