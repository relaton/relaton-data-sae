  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The primary purpose of the shipping closure is to protect the aircraft parts or system from damage and foreign material ingress/egress (e.g., dust, dirt or other contaminants) during transport and storage. Shipping closures are not airworthy items. Therefore, their usage is defined as preventative for the parts to be protected as opposed to operational.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Military and commercial customer requirements for the prevention of damage or contamination to stored parts are generally limited to the generic instructions “all openings should be sufficiently covered to prevent the entrance of dust, dirt, moisture or other foreign contaminants”. This recommended practice outlines basic minimum parameters for suggested item construction and usage. Additionally, this recommended practice provides instruction on how to apply these closures to various openings.&lt;/div&gt;&lt;/div&gt;</p>
