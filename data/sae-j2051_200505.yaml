  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the requirements necessary for four-way subbase mounted, directional air-control valves to be used in automotive manufacturing applications. It includes minimum performance, operation, and physical requirements to qualify the valves for service in automotive manufacturing applications. Included are spool, poppet, and sliding disc types of air valves for pressures in a range of vacuum to 1034 kPa (150 lb/in&lt;sup&gt;2&lt;/sup&gt;) gage, and temperatures from −18 to 60 °C (0 to 140 °F).&lt;/div&gt;
    &lt;/div&gt;</p>
