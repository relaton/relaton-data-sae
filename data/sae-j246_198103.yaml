  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers complete general and dimensional specifications for tube fittings of the spherical and flanged sleeve compression types for use in the piping of air brake systems on automotive vehicles. The spherical sleeve compression type &lt;span class="xref"&gt;Figs. 1A&lt;/span&gt;-&lt;span class="xref"&gt;5&lt;/span&gt; and &lt;span class="xref"&gt;Tables 3&lt;/span&gt;-&lt;span class="xref"&gt;5&lt;/span&gt; is intended for use with annealed copper alloy tubing per SAE J1149 (July, 1976), Type 1. The flanged sleeve compression type &lt;span class="xref"&gt;Figs. 6A&lt;/span&gt;-&lt;span class="xref"&gt;11&lt;/span&gt; and &lt;span class="xref"&gt;Tables 6&lt;/span&gt;-&lt;span class="xref"&gt;8&lt;/span&gt; is intended for use with nylon tubing per SAE J844 (July, 1976). It is not intended to restrict or preclude other designs of a tube fitting for use with SAE J844 (July, 1976), air brake tubing. Performance requirements for SAE J844 (July, 1976), Nonmetallic Tubing and Fittings Assemblies, are covered in J1131 (January, 1976).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;C&lt;span class="small-caps"&gt;aution&lt;/span&gt;: To assure satisfactory performance, tapered sleeve compression type fitting components (SAE J512 (July, 1976)) should not be intermixed with the spherical or flanged sleeve components, nor should the spherical sleeve compression type components be intermixed with the flanged sleeve compression type components when assembling connection in areas where the three types are available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data contained in &lt;span class="xref"&gt;Tables 1&lt;/span&gt;-&lt;span class="xref"&gt;8&lt;/span&gt; with respect to all unspecified details.&lt;/div&gt;&lt;/div&gt;</p>
