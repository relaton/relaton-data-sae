  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP defines recommended flight crew interface design processes and methods for new flight deck designs as well as modifications to the flight crew interface of existing flight decks of transport category aircraft (Part 25), which includes commercial transport aircraft, regional and business aircraft. These processes and methods are intended to be utilized by the design engineers of manufacturers of transport category aircraft or any modifiers to the flight deck system. Modifiers include equipment suppliers, avionics manufacturers, aircraft operators, original equipment manufacturers (OEM), regulatory authorities, or anyone seeking a supplemental type certificate (STC), type certificate (TC), amended TC, field approval, or equivalent approval.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The processes and methods described in this ARP address the integration of human factors/ergonomics, engineering, and flight operations in the design and/or modification of flight crew interfaces. These interfaces provide the flight crew access to the installed systems, using controls, indications and displays, in order to allow them to accomplish the tasks of aviate, navigate, communicate, and manage systems. Included in these processes and methods are considerations for flight crew training, the use and integration of automation, error tolerant designs, and task management.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These processes and methods are designed to yield flight deck designs that are both safe and efficient, in that order of priority. These processes and methods address the issue of creating modifications to existing designs that are compatible with the original intent of the flight deck design.&lt;/div&gt;&lt;/div&gt;</p>
