  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The Measurement of Coolant Hose task group conducted a round-robin study to determine the measuring capability of automotive suppliers and users to measure Inside Diameter (ID), Outside Diameter (OD), Wall Thickness (Wall) and wall thickness variation of hose using traditional measuring devices and techniques. Seven companies (five suppliers and two end users) participated in this testing. Based upon the round-robin study this information report will detail procedures, test measuring devices, results and recommendations.&lt;/div&gt;
    &lt;/div&gt;</p>
