  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidance for the design and location of flight attendant stations, including emergency equipment installations at or near such stations, so as to enable the flight attendant to function effectively in emergency situations, including emergency evacuations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Recommendations regarding design of flight attendant stations apply to all such stations; recommendations regarding location apply to those stations located near or adjacent to floor level exits.&lt;/div&gt;&lt;/div&gt;</p>
