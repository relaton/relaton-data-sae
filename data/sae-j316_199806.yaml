abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice covers the mechanical, chemical, and
    dimensional requirements of oil-tempered carbon-steel spring wire used in the
    automotive and related industries. It is especially intended for the manufacture
    of mechanical springs and wire forms which are not subjected to a large number
    of high stress cycles. Class I wire is intended for moderate stress and Class
    II for higher stress level applications. This document also covers the processing
    requirements for springs fabricated from this wire.</p>"
