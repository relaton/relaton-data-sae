  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers specifications and performance requirements for 37° and 45° single and double flares for tube ends intended for use with SAE J512, SAE J513, SAE J514, and ISO 8434-2 connectors. Considerations such as the effects of wall thickness selection for specific working pressures, identifying appropriate length of thread engagements for specific applications with mating connectors and other associated criteria, shall be the responsibility of the user. For applicable nominal reference working pressures for hydraulic tubing see SAE J1065 and ISO 10763.&lt;/div&gt;
    &lt;/div&gt;</p>
