  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform laboratory procedures for fatigue testing of spoke wheels and hubs intended for normal highway use on trucks, buses, truck trailers, and multipurpose passenger vehicles. The hubs included have bolt circle diameters from 165.1 to 335.0 mm (6.50 to 13.19 in). The tests described in this document are not to be construed as the only tests required or permitted to ensure that a spoke wheel or a hub will perform satisfactorily for its intended use.&lt;/div&gt;&lt;/div&gt;</p>
