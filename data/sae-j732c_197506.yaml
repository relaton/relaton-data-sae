abstract:
- language: en
  script: Latn
  content: "<p>This SAE standard provides uniform definitions of specification terms
    peculiar to loaders as defined in SAE J1057. The specifications must be qualified
    by stating the track shoe type, width or the tire type, size, ply, and specified
    inflation pressure; the model number or type of bucket disregarding teeth; and
    the type and amount of counterweight and/or ballast, if any, with which the machine
    is equipped. Paragraphs 4.1 and 4.16 are further defined by Figures 1 to 4. The
    figures are not intended to be exactly descriptive of any particular machine.</p>"
