- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Recommended Practice establishes methods to determine grade parking performance with respect to:&lt;/p&gt;
    &lt;p&gt;a. Ability of the parking brake system to lock the braked wheels.&lt;/p&gt;
    &lt;p&gt;b. The vehicle holding or sliding on the grade, fully loaded or unloaded.&lt;/p&gt;
    &lt;p&gt;c. Applied manual effort.&lt;/p&gt;
    &lt;p&gt;d. Unburnished or burnished brake lining friction conditions.&lt;/p&gt;
    &lt;p&gt;e. Down and up grade directions.&lt;/p&gt;</p>
