  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard defines the normal dimensions, dimensioning practice, tolerances, specialized measurement techniques, and glossary of terms for bearing inserts commonly used in reciprocating machinery.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The standard sizes cover a range which permits a designer to employ, in proper proportion, the durability and lubrication requirements of each application, while utilizing the forming and machining practices common in manufacture of sleeve type half bearings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Not included are considerations of hydrodynamic lubrication analysis or mechanical stress factors of associated machine structural parts which determine the nominal sizes to be used, selection of bearing material as related to load carrying capacity, and economics of manufacture. For information concerning materials, see SAE J459 (July, 1974) and SAE J460e (October, 1974).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These suggested sizes provide guidelines which may result in minimal costs of tooling but do not necessarily represent items which can be ordered from stock.&lt;/div&gt;&lt;/div&gt;</p>
