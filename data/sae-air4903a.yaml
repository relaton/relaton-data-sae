    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;information for IC designers: &lt;span class="xref"&gt;Sections 3&lt;/span&gt;, &lt;span class="xref"&gt;4&lt;/span&gt;, &lt;span class="xref"&gt;5&lt;/span&gt;, &lt;span class="xref"&gt;8&lt;/span&gt;, and &lt;span class="xref"&gt;9&lt;/span&gt;&lt;/div&gt;&lt;/li&gt;
