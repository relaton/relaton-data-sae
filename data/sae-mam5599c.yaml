  content: |-
    <p>&lt;p&gt;This specification covers a corrosion and heat resistant nickel alloy in the form of sheet, strip, and plate procured in SI (metric) units.&lt;/p&gt;
    &lt;p&gt;AMS 5599, specified in inch/pound version of this MAM.&lt;/p&gt;
    &lt;p&gt;These products have been used typically for parts requiring corrosion and oxidation resistance up to 1095 degrees C, particularly where such parts may require welding during fabrication, but usage is not limited to such applications.&lt;/p&gt;</p>
