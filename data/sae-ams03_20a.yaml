  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the requirements for the electro-deposition of zinc on non-corrosion resisting steel items for protection against corrosion, and on copper-base alloy items and corrosion resisting steel items for the reduction of contact corrosion of less noble metallic materials. Zinc coatings shall not be used on items which are liable to be subjected to temperatures exceeding 350 °C.&lt;/div&gt;&lt;/div&gt;</p>
