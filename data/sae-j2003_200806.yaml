abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard is equivalent to ISO Standard 6626.

    Differences, where they exist, are shown in the appendix with associated rationale.

    This document specifies the essential dimensions of piston ring types DSF-C, DSF-CNP, SSF, GSF, DSF, DSF-NG, and SSF-L coil spring loaded oil control rings.

    For the cast iron part the recommended material is class 10 according to SAE J1590. For special applications material classes 20 to 50 may be used.

    Variation in face design and spring groove from these may be used, as recommended by individual manufacturers, in plain or chromed versions.

    The tangential forces of coil spring loaded oil control rings can be varied over a wide range. Explanations and recommendations are given in Section 6.

    The normal range for axial width of coil spring loaded oil control rings (3 to 8 mm inclusive) is divided into 0.5 or 1.0 mm steps. In Tables 9 to 14 dimensions are given for coil spring loaded oil control rings within an axial width of 4.75 mm (i.e., 3/16 in) for existing applications in inch units.

    This document applies to coil spring loaded oil control rings up to 200 mm inclusive for reciprocating internal combustion engines. It may also be used for piston rings of compressors working under similar conditions.</p>
