    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this procedure is to establish a technique for reliably and repeatedly measuring the RF shielding characteristics of EMI gasket materials and EMI gaskets against various joint surfaces. The procedure is also used to test the reliability of the gasketed joint combinations after being subjected to hostile environments.&lt;/div&gt;&lt;/div&gt;</p>
