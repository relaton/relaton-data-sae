    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the test procedures for conducting quasi-static modular body strength tests for ambulance applications. Its purpose is to establish recommended test practices which standardize the procedure for Type I and Type III bodies, provide ambulance builders and end-users with testing procedures and, where appropriate, provide acceptance criteria that, to a great extent, ensures the ambulance structure meets the same performance criteria across the industry. Descriptions of the test set-up, test instrumentation, photographic/video coverage, and the test fixtures are included.&lt;/div&gt;&lt;/div&gt;</p>
