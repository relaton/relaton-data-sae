abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard provides the acceptance criteria for a lift arm support
    device to prevent lowering of the loader lift arms when the lift arms are required
    to be held in an elevated position for maintenance. It establishes structural,
    mounting, and test requirements for a lift arm support device for loaders as defined
    in SAE J1057 JUN81.</p>"
