  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this standard is to provide uniform physical item identification marking, in constantly recurring symbols, of nickel and nickel alloy mill products procured and issued for government agencies and their contractors. applicability shall be by specific reference to this standard in specification, contract, or purchase order. shipment and inspection acceptance markings are not within the scope of this standard.&lt;/div&gt;&lt;/div&gt;</p>
