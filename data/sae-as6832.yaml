  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to provide detailed requirements to preclude the use of suspect counterfeit or counterfeit fasteners.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this document are intended to supplement the requirements of a higher-level quality standard (e.g., AS/EN/JISQ9100, ISO 9001, ANSI/ASQC E4, ASME NQA-1, AS9120, AS9003, and ISO/TS 16949 or equivalent) and other quality management system documents.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Fasteners are defined as United States Federal Supply Classification Group codes as shown in the following list:&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;This document applies to metallic and non-metallic components that mechanically attach two or more objects: fasteners, screws, bolts, rivets (blind, solid, tubular), inserts, washers, nuts, latching handles, clamps, pins, nails, retainers, etc. If locking or treatment elements such as glue, adhesives, anti-galling, lubricant, or other materials are part of the fastener specifications, then those items are within the scope of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For metallic raw materials used in the manufacturing of fasteners, refer to AS6279.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not apply to connectors such as pneumatic or hydraulic fittings and electrical connectors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Appendices A&lt;/span&gt;, &lt;span class="xref"&gt;B&lt;/span&gt;, &lt;span class="xref"&gt;C&lt;/span&gt;, and &lt;span class="xref"&gt;D&lt;/span&gt; are guidance.&lt;/div&gt;&lt;/div&gt;</p>
