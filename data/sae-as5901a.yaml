  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the minimum requirements for an environmental test chamber, and test procedures to carry out anti-icing performance tests according to the current materials specification for aircraft deicing/anti-icing fluids. The primary purpose for such a test method is to determine the anti-icing endurance under controlled laboratory conditions of AMS1424 Type I and AMS1428 Type II, III, and IV.&lt;/div&gt;&lt;/div&gt;</p>
