    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides an orientation to fusion splicing technology for optical fibers and fiber optic cable. It is intended for managers, designers, installers, and repair and maintenance personnel who need to understand the process of fusion splicing. This technology is widely used in telecommunications and industrial applications, and is finding acceptance in aerospace applications.&lt;/div&gt;&lt;/div&gt;</p>
