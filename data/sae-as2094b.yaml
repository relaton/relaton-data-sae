  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies test methods for tube-fitting assemblies used in aircraft fluid systems in the following pressure classes: B (1500 psi or 10500 kPa), D (3000 psi or 21000 kPa), E (4000 psi or 28000 kPa), and J (5000 psi or 35000 kPa) and in temperature types I (-65 to 160 °F or -55 to 70 °C), II (-65 to 275 °F or -55 to 135 °C), and III (-65 to 400 °F or -55 to 200 °C) of AS2001.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies each time that it is referred to in a procurement specification or other definition document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Fluids and materials used for the tests are listed in &lt;span class="xref"&gt;Section 2&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
