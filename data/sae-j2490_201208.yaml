  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended as the definition of a standard test, which may be subject to frequent change to keep pace with experience and technical advances. This should be kept in mind when considering its use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE No. 2 Friction Test Machine is used to evaluate the friction characteristics of automatic transmission plate clutches with automotive transmission fluids. It can also be used to conduct durability tests on wet friction systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specific purpose of this document is to define a µPVT Test for the evaluation of the variation of wet friction system performance as a function of speed, temperature, and pressure. This procedure is intended as a standard for both suppliers and end users.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The only variables selected by the supplier or user of the friction system are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Friction Material&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Fluid&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Reaction Plates&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;These three variables must be clearly identified when reporting the results of this test. If any of the test parameters or system hardware as described in this document are changed, other than the friction material, test fluid, or reaction plates, the data may not be reported as having been obtained using this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure is intended to evaluate the endpoint/midpoint ratios, midpoint and breakaway coefficients. The procedure can be used to demonstrate changes that occur between the different levels of engagement speed, sump temperature and apply pressure. Refer to SAE J2487, SAE J2488, or SAE J2489 for coefficient variations due to changes in power level.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The procedure, as described in detail in &lt;span class="xref"&gt;Table 1&lt;/span&gt;, consists of four 50 cycle break-in levels at 3500 r/min with increasing steps of apply pressure, followed by 16 levels consisting of 25 dynamic engagements and one breakaway following completion of the 25th dynamic cycle. The 16 levels are achieved by varying initial engagement speed, apply pressure and oil sump temperature while the inertia is kept constant at 0.701 kg-m&lt;sup&gt;2&lt;/sup&gt;.&lt;/div&gt;&lt;/div&gt;</p>
