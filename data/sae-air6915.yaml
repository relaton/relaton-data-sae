  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) offers information on how human factors should be considered when developing and implementing IVHM capabilities for both military and civil fixed wing aircraft. These considerations will cover the perception, analysis, and action taken by the flight crew and the maintenance personnel in response to outputs from the IVHM system. These outputs would be onboard realtime for the flight crew and post flight for maintenance. This document is not intended to be a guideline; it is intended to provide information that should be considered when designing and implementing future IVHM systems.&lt;/div&gt;
    &lt;/div&gt;</p>
