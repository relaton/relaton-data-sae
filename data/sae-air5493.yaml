    &lt;div class="htmlview paragraph"&gt;This document shall be applied by accreditation bodies, registrars and other providers of training for the instruction of auditors or other professionals for specialization for the aerospace industry per the requirements of AIR5359. Additionally, this document applies to all organizations qualifying Aerospace Auditors in support of Aerospace Quality Systems standards AS9000 and AS9100.&lt;/div&gt;
