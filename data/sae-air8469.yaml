    &lt;div class="htmlview paragraph"&gt;This information report covers all known aircraft with respect to deicing operations, especially with regard to OEM pressure and temperature limitations on the airframe. It provides data for airlines/operators on compliance with OEM limits and confirms that OEM limits are not exceeded during deicing operations.&lt;/div&gt;&lt;/div&gt;</p>
