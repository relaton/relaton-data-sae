abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Standard specifies the dimensional requirements necessary for the mounting and interchangeability of four types of fuel injectors in diesel engines. Two of the types specified are flats-located injectors.&lt;/p&gt;
    &lt;p&gt;The location and dimensions of the fuel inlet, leak-off connections, and type of attachment are not defined since they may vary according to the particular application.&lt;/p&gt;
    &lt;p&gt;&lt;b&gt;Field of Application&lt;/b&gt; This document is applicable to nozzle holder types 8 and 10 of an unspecified means of angular location and flats-located types 9 and 11 with a 17.0 mm (nominal) shank diameter. The internal construction of the fuel injector remains optional with the manufacturer.&lt;/p&gt;</p>
