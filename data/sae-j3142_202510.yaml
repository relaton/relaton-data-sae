  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Information Report is to define common industry terminology and nomenclature relative to thermal flow control valves and to describe common thermal flow control valve applications in automotive, highway truck, mobile construction equipment, and industrial applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is primarily directed at internal combustion engine or electric powered applications and the downstream systems to which power is provided, such as transmissions, hydraulics, air compression, etc. The information contained herein does not constitute an SAE Standard.&lt;/div&gt;&lt;/div&gt;</p>
