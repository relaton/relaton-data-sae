  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This guide provides detailed information, guidance, and methods related to the Federal Aviation Administration (FAA) Advisory Circular (AC) 20-158 and European Aviation Safety Agency (EASA) draft Advisory Material Joint (AMJ), both titled "The Certification of Aircraft Electrical and Electronic Systems for Operation in the High-Intensity Radiated Fields (HIRF) Environment". The AC provides acceptable means, but not the only means, of compliance with Title 14, Code of Federal Regulations (14 CFR) 23.1308, 25.1317, 27.1317, and 29.1317, High-Intensity Radiated Fields (HIRF) protection for Aircraft Electrical and Electronic Systems, and applicable FAA HIRF Special Conditions to prevent hazards to aircraft electrical and electronic systems due to HIRF produced by external transmitters. It is also intended for this guide to provide the same information, guidance, and methods to the European Aviation Safety Agency (EASA) interim HIRF policies certification requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This guide is neither mandatory nor regulatory in nature and does not constitute a regulation or legal interpretation of the regulation. The information in this guide represents a collection of best engineering practices that have been used to certify aircraft HIRF protection. An applicant may elect to establish an alternative method of compliance that is acceptable to the cognizant airworthiness authorities.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is consistent with the guidance in FAA AC 20-158. The AC 20-158 and draft HIRF AMJ may be referenced in aircraft certification requirements such as JAA/EASA certification review items. While this document is generally consistent with AC 20-158 and draft HIRF AMJ, users of this document should verify that the guidance in this document is acceptable to the cognizant airworthiness authorities.&lt;/div&gt;

    &lt;/div&gt;</p>
