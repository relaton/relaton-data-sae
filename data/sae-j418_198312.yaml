  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This classification for grain size comprises three sets of comparison charts to be used for determining grain size. These charts are presented in three categories as follows:&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Plate I - Untwinned grains (flat etch)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Plate II - Twinned grains (flat etch)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Plate IV - Austenite grains in steel (McQuaid-Ehn test or other test)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Table 1&lt;/span&gt; lists a number of materials and the comparison charts that are suggested for use in estimating their grain size by the comparison method.&lt;/div&gt;


    &lt;/div&gt;</p>
