abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Accelerometers are transducers, or sensors, that convert acceleration into an electrical signal that can be used for airframe, drive, and propulsion system vibration monitoring and analysis within vehicle health and usage monitoring systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document defines interface requirements for accelerometers and associated interfacing electronics for use in a helicopter Health and Usage Monitoring System (HUMS). The purpose is to standardize the accelerometer-to-electronics interface with the intent of increasing interchangeability among HUMS sensors/systems and reducing the cost of HUMS accelerometers. Although this interface was specified with an internally amplified piezoelectric accelerometer in mind for Airframe and Drive Train accelerometers, this does not preclude the use of piezoelectric accelerometer with remote charge amplifier or any other sensor technology that meets the requirements given in this specification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE HUMS Accelerometer Interface Specification includes the minimal interface and performance requirements for commonality. Compliance with this Interface Specifications can be referenced in more comprehensive procurement and device specifications.&lt;/div&gt;

    &lt;/div&gt;</p>
