  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for suppliers of Shot Peening Services to be accredited by the National Aerospace and Defense Contractors Accreditation Program (NADCAP). NADCAP accreditation is granted in accordance with SAE AS7003 after demonstration of compliance with the requirements herein. The requirements may be supplemented by additional requirements specified by the NADCAP Nonconventional Machining and Surface Enhancement (NMSE) Task Group. Using the corresponding Audit Criteria (PRI AC7117) will ensure that accredited Shot Peening suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this audit program is to assess a supplier's ability to consistently provide a product or service that conforms to the technical specifications and customer requirements. The corresponding audit criteria are also structured to obtain information relevant to management practices and processes that directly or indirectly affect the product or service. This information will be used in the determination of accreditation status and may be used by the supplier to guide improvements in the product or service and the associated processes.&lt;/div&gt;&lt;/div&gt;</p>
