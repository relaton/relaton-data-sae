    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines the requirements for heavy-duty hose assemblies suitable for use in 400 °F, 3000 psi aircraft hydraulic systems. Assemblies are suitable where rapid rate pressure pulsing and torsional/longitudinal flexing may occur, in addition to normal hydraulic system loads.&lt;/div&gt;&lt;/div&gt;</p>
