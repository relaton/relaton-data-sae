    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines minimum performance standards (MPS) for fuel flowmeters, fuel flow indicators, and fuel flow transmitters. The fuel flow indicators and transmitters are intended for use in 14 CFR Part 23, 25, 27, and 29 aircraft equipped with reciprocating and turbine engines. Multiple function displays are not within the scope of this SAE Aerospace Standard (refer to AS6296).&lt;/div&gt;
    &lt;/div&gt;</p>
