  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the information required to repair the various types of plastics found on modern light-duty highway vehicles. Information is included for the repair and refinishing of most plastic body parts, both interior and exterior. Repair information is described for all commonly used plastics including, but not limited to, polyurethanes, polycarbonate blends, modified polypropylenes, polyethylenes and nylons. Repairs can be made to these types of plastics using two-part (2K) repair adhesives, plastic welding, and other materials available from body shop suppliers. When a new type of plastic is being introduced to the market through a new vehicle program, specific repair and refinishing procedures should be provided, following the format in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Sheet-molded compounds (SMC), fiber-reinforced plastics (FRP) and carbon fiber reinforced plastics can also be repaired using slightly different procedures and repair materials.&lt;/div&gt;
    &lt;/div&gt;</p>
