abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard defines a method for the measurement of the whole
    body vibration to which the seated operator of off-highway self-propelled work
    machines is exposed while performing an actual or simulated operation.  It applies
    to vibration transmitted to the operator through the seat.  There are not equivalent
    ISO Standards.  In the main body of this document, conditions are defined for
    measuring and recording whole body vibration of the seated operator of off-highway
    self-propelled work machines.  The specification of instruments, analytic methods,
    and description of site and operating conditions allows the measurements to be
    made and reported with an acceptable precision. The procedure includes means of
    weighing the vibration level at different frequencies as specified in ISO2631.
    \ A standard format for reporting spectral data is recommended.  The definitions,
    instruments, and analytic methods also apply to simulated tests for operator vibration
    as performed in laboratories. This procedure is a measuring method only and is
    not intended for the evaluation or selection of seating systems.</p>"
