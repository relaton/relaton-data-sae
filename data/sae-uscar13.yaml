  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the operational characteristics, environment, durability procedures, and test procedures for in-tank electric fuel pumps for automotive gasoline applications. Specific performance and test criteria used in conjunction with this procedure are specified on the pump drawing. Particular sections of this document may be required for all applications. This standard is intended to evaluate specific characteristics as a supplement to normal material inspections, dimensional checking, and in-process controls, and should in no way adversely influence other inspection operations.&lt;/div&gt;
    &lt;/div&gt;</p>
