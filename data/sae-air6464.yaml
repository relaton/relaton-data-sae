  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines the technical guidelines for the safe integration of Proton Exchange Membrane (PEM) Fuel Cell Systems (FCS), fuel (considered to be liquid and compressed hydrogen storage types only), fuel storage, fuel distribution and appropriate electrical systems into the aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Editorial Note: Today PEM systems and fuel storage represent the most mature FCS technology and currently forms the basis for this standard. Other types of fuel cell systems and fuels (including reforming technologies and electrolyzers), may be covered by a further update to this document.&lt;/div&gt;

    &lt;/div&gt;</p>
