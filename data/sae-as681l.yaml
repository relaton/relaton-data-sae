  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides the method for presentation of gas turbine engine steady-state and transient performance calculated using computer programs. It also provides for the presentation of parametric gas turbine data including performance, weight, and dimensions computed by computer programs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard is intended to facilitate calculations by the program user without unduly restricting the method of calculation used by the program supplier. This standard is applicable, but not limited to, the following program types: data reduction, steady-state, transient, preliminary design, study, specification, status, and parametric programs.&lt;/div&gt;&lt;/div&gt;</p>
