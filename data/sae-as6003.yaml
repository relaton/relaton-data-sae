  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the specification for TTP communication protocol functionality as a core networking component for design of synchronous, time-triggered distributed real-time communication networks.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is referred to as the “base” specification, containing the generic specification of TTP communication protocol functionality, and frame formats, communication services and protocol state machines with transitions, TTP node operation, TTP network operation, distributed clock synchronization and error detection on the network layer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The details described in this standard enable interoperable TTP controller implementations.&lt;/div&gt;


    &lt;/div&gt;</p>
