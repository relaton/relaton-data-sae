    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP is to describe key features for the lavatory smoke detector. Consideration has been given to existing requirements of the FAA, to recommendations of aircraft operators and manufacturers. The ARP is deliberately not specific in all areas in order to maximize potential supplier's freedom to use the state-of-the-art design and manufacturing technologies. Safe, reliable, and effective lavatory smoke detectors remain the primary goal of the ARP.&lt;/div&gt;&lt;/div&gt;</p>
