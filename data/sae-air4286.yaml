  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following are suggested policies, procedures, and practices required to maintain mobile and fixed ground support equipment at airport passenger and cargo terminals.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The principal purpose for ground support equipment maintenance is to provide the owner/user with safe, serviceable equipment, in good appearance, at minimal cost, and with minimum downtime. Maintenance programs initiated on ground support equipment must also conform to regulations controlling airport operations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document has been divided into three sections corresponding to the three stages of equipment life; acquisition, maintenance, and disposal.&lt;/div&gt;&lt;/div&gt;</p>
