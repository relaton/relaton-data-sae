    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Standard provides a method for the application of surface finish control to aircraft engine parts. Recommendations for a Surface Roughness Standard are contained in A.S.A. publication B46 and this S.A.E. Aeronautical Standard contains a summary of information therein plus other information which has been compiled from current manufacturing practice.&lt;/div&gt;&lt;/div&gt;</p>
