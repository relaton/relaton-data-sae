    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) is limited in scope to the general consideration of environmental control system noise and its effect on occupant comfort. Additional information on the control of environmental control system noise may be found in the bibliography and in the documents referenced throughout the text. This document does not contain sufficient direction and detail to accomplish effective and complete acoustic designs.&lt;/div&gt;&lt;/div&gt;</p>
