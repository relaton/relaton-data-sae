  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a single bolt pattern for the No. 1 clutch housing (see &lt;span class="xref"&gt;Figure 1&lt;/span&gt;) and the No. 2 clutch housing (see &lt;span class="xref"&gt;Figure 2&lt;/span&gt;).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These four bolt patterns are designated to give commonality of mounting brackets in existing frame rails.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The 420 mm (16.5 in) span, pad face to pad face, allows the ease of installation in existing frame rail widths. This is also the minimum spacing which will accommodate commonly used clutches.&lt;/div&gt;&lt;/div&gt;</p>
