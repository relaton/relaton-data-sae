  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Fixed rigid barrier collisions can represent severe automotive impacts. Deceleration conditions during fixed rigid barrier collisions are more readily reproducible than those occurring during impacts with yielding barriers. Barrier collision tests are conducted on automotive vehicles to obtain information of value in reducing occupant injuries and in evaluating structural integrity. The purpose of this SAE Recommended Practice is to establish sufficient standardization of barrier collision methods so that results of similar tests conducted at different facilities can be compared. The barrier device may be of almost any configuration, such as flat, round, offset, etc.&lt;/div&gt;
    &lt;/div&gt;</p>
