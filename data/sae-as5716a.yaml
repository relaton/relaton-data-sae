abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This interface standard applies to fuzes/fuzing systems (referred to as fuzing system hereafter) in airborne weapons that use a MIL-STD-1760 type interface. It defines the powers, the discrete signals and the serial data interface for the communications at the interface between the fuzing system and the remainder of the weapon, including the weapon control unit.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Class 1 interface is an electrical only interface that facilitates use of MIL-STD-1760 type platform store interfaces for the fuze to monitor intentional release and defines the fuze interface bus communications protocol to allow sending and receiving data from fuzing systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Class 2 interfaces add a defined connector and additional interfaces to facilitate the exchange of compatible fuzing systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Class 3 interfaces add further interface definitions to facilitate the exchange of AS5680A compatible fuzing systems components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The bus communications protocol provides a means by which the weapon may set mission parameters within the fuzing system main housing and in other devices external to the fuzing system main housing. The standard also defines the target detection signal to be provided by a target detection device external to the fuzing system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard does not address the mechanical interfaces to target detection devices or to other sensors that are external to the fuzing system main housing.&lt;/div&gt;


    &lt;/div&gt;</p>
