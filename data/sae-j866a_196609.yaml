  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to provide a uniform means of identification which may be used to describe the initial friction characteristics of brake linings and brake blocks (see SAE J660) for use on motor vehicles.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;The basis for determining the friction coefficients for brake linings and brake blocks are tests conducted in accordance with SAE J661.&lt;/div&gt;&lt;/div&gt;</p>
