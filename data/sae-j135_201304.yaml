    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice presents service brake performance requirements for brake systems of all combinations of new passenger cars and new trailers (braked or unbraked) intended for roadway use (excluding special-purpose vehicles such as ambulances, hearses, etc.).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Acceptable performance requirements are based on data obtained from SAE J134.&lt;/div&gt;
