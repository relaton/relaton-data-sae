    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides an overview of results and requirements needed to remove refrigerant from a mobile air-conditioning system for determining refrigerant emissions (leakage).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This reclaim procedure for use on fleet vehicles in a field service environment should produce an accuracy and repeatability sufficient to determine refrigerant loss within 2 g.&lt;/div&gt;&lt;/div&gt;</p>
