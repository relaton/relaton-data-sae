    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The document provides clarity related to multiple temperature coolant circuits used in on- and off-highway, gasoline, and light- to heavy-duty diesel engine cooling systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Out of scope are the terms and definitions of thermal flow control valves used in either low- or high-temperature coolant circuits. This subject is covered in SAE J3142.&lt;/div&gt;&lt;/div&gt;</p>
