  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this Aerospace Standard shall cover the methodology of defining and determining the "Internal Volumes" of both the main deck and lower deck aircraft cargo compartments. The minimum required clearance between the compartment envelope and the unit load devices (ULD's) shall also be stated in order to provide the maximum OLD external contour and the methodology to define the OLD internal volumes. The methodology of defining and determining "maximum package sizes charts" for the cargo compartments shall also be included.&lt;/div&gt;&lt;/div&gt;</p>
