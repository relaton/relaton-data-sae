  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;A general method for the preliminary design of a single, straight-sided, low subsonic ejector is presented. The method is based on the information presented in References 1, 2, 3, and 4, and utilizes analytical and empirical data for the sizing of the ejector mixing duct diameter and flow length. The low subsonic restriction applies because compressibility effects were not included in the development of the basic design equations. The equations are restricted to applications where Mach numbers within the ejector primary or secondary flow paths are equal to or less than 0.3.&lt;/div&gt;&lt;/div&gt;</p>
