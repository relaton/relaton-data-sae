  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Create and publish a list of terms relevant to electrified propulsion aircraft with summary text descriptions. The terms and descriptions will not provide full explanations, diagrams, and other detailed technical descriptions. These deeper descriptions will be addressed in other documents.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document defines the relevant terms and abbreviations related to the design, development, and use of electrified propulsion in aircraft. This definition is provided to enable a consistent use of technical language throughout the standards developed by the E-40 committee.&lt;/div&gt;
    &lt;/div&gt;</p>
