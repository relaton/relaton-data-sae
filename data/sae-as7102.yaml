    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the minimum requirements for suppliers of heat treat services to be accredited by the National Aerospace and Defense Contractors Accreditation Program (NADCAP). These requirements may be supplemented by additional requirements as determined by NADCAP, but the audit checklist shall, at a minimum, assure that NADCAP Accredited Heat Treat Suppliers meet all of the requirements contained in this standard.&lt;/div&gt;&lt;/div&gt;</p>
