    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a premium aircraft-quality corrosion-resistant steel in the form of bars, wire, forgings, mechanical tubing, flash welded rings up to 8.0 inches (203 mm) in diameter or least distance between parallel sides in the solution heat treated condition (see &lt;span class="xref"&gt;8.4&lt;/span&gt;), and stock of any size for forging, flash welded rings, or heading (see &lt;span class="xref"&gt;8.8&lt;/span&gt;).&lt;/div&gt;
    &lt;/div&gt;</p>
