    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice describes the physical and chemical characterization techniques for identification of epoxy adhesive and prepreg resin systems in order to verify the chemical formulation, resin B-staging (See &lt;span class="xref"&gt;8.1&lt;/span&gt;), cure reaction rates, adhesive moisture content, and resin component mix ratios, as necessary to achieve manufacturing and quality producibility and engineering performance.&lt;/div&gt;&lt;/div&gt;</p>
