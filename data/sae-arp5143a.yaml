  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) describes methods of vacuum bagging, a process used to apply pressure in adhesive bonding and heat curing of thermosetting composite materials and metalbond for commercial aircraft parts. If this document is used for the vacuum bagging of other than thermosetting composite materials and metalbond, the fitness for this purpose must be determined by the user.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The methods shall only be used when specified in an approved Repair Document or with the agreement of the Original Equipment Manufacturer (OEM).&lt;/div&gt;
    &lt;/div&gt;</p>
