abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard specifies the test requirements in addition to those given in ISO 3046-1 for determining the power, at a single point or as a power curve, of marine propulsion engines or systems for recreational craft and other small craft using similar propulsion equipment of less than 24 m length of the hull.

    It also provides the means for documenting and checking the declared (rated) power published by the manufacturer.</p>
