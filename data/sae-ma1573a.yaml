  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for the following types of self-locking nuts:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wrenching nuts: that is, hex, double hex, spline drive&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Anchor nuts: that is, plate nuts, gang channel nuts, shank nuts&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The wrenching nuts and shank nuts are made of low alloy steels, and the nut elements of plate and gang channel nuts are made of carbon steels or low alloy steels and having MJ threads to ISO 5855/2. Nuts have 1100 MPa tensile strength class at room temperature. Maximum test temperature of parts at 235 °C.&lt;/div&gt;&lt;/div&gt;</p>
