  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE RP provides a set of test methods and practices for the characterization of the properties of Li-battery cathode active material.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not within the scope of this document to establish criteria for the test results, as these are usually established between the vendor and customer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not within the scope of this document to examine the rheological properties of the cathode material in slurry since such properties are influenced by the conductive additive and the solid loading, which are determined through discussion between the manufacturer and user.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not within the scope of this document to examine the electrochemical properties of cathode materials since these are influenced by electrode design. The committee considers that it is impossible to establish an electrode design that would be appropriate for all cathode active materials.&lt;/div&gt;&lt;/div&gt;</p>
