  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to cover current safety glazing practice and usage of safety glazing materials in motor vehicles. Nominal specifications for thickness, flatness, curvature, size, and fabrication details are included principally for the guidance of body engineers and designers. Because of the limited usage and experience with plastic safety glazing materials in motor vehicles, this recommended practice has been confined to safety glass glazing. For additional information on safety glazing materials for motor vehicles, see SAE J674.&lt;/div&gt;&lt;/div&gt;</p>
