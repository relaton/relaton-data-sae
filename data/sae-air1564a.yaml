  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) summarizes the materials referenced in specifications for components used in USA fluid systems and, where available, the equivalent materials of France, Germany, United Kingdom, and USSR. (See &lt;span class="xref"&gt;Figures 1&lt;/span&gt; through &lt;span class="xref"&gt;8&lt;/span&gt;.)&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The data in this document compares ISO and NATO materials equivalents to AIR1564, Materials for Fluid Systems Components and Their International Equivalents.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The equivalent material information was obtained from periodicals, books, and data supplied by individual contributors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;No attempt has been made to obtain samples of the materials or conduct physical and chemical analyses to determine if they are equivalent. Anyone using this AIR, therefore, is cautioned to verify for themselves the interchangeability of the specific materials.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Additional contributions of missing or supplemental data should be directed to SAE marked for the attention of Committee G-3.&lt;/div&gt;







    &lt;/div&gt;</p>
