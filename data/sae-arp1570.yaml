abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this document is to describe the recommendations of
    SAE Committee S-7 for a Flight Management Computer System (FMCS) capable of providing
    the functions and displays listed below to permit completion of a desired flight
    plan in an energy efficient and/or cost effective manner while meeting the requirements
    of Air Traffic Control. The recommendations of this document apply to transport
    aircraft and describe the operational objectives of the FMCS and related controls
    and displays.</p>"
