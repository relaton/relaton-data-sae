  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to discuss the differences between electromechanical and proximity position sensing devices when used on landing gears. It also contains information, which may be helpful, when applying either type of technology after the selection has been made. The purpose is to help the designer make better choices when selecting a position-sensing device. Once that choice has been made, this document includes information to improve the reliability of new or current designs. It is not intended to replace recommendations from sensor manufacturers or actual experience, but to provide a set of general guidelines.&lt;/div&gt;&lt;/div&gt;</p>
