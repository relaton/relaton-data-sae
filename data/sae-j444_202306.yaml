  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice pertains to blast cleaning and shot peening and provides for standard cast shot and grit size numbers. For shot, this number corresponds with the opening of the nominal test sieve, in ten thousandths of inches&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;, preceded by an S. For grit, this number corresponds with the sieve designation of the nominal test sieve with the prefix G added. These sieves are in accordance with ASTM E11.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The accompanying shot and grit classifications and size designations were formulated by representatives of shot and grit suppliers, equipment manufacturers, and automotive users.&lt;/div&gt;&lt;/div&gt;</p>
