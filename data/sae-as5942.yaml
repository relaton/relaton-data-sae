  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the performance requirements for the identification of wire and cable by indirect markings that have been applied to electrical insulating materials including heat shrink sleeving, wrap around labels and “tie-on” tags as well as any other types of materials used for indirect marking. This specification covers the processes used to mark these materials, including impact ink marking, thermal transfer, hot stamp, and lasers, etc. This specification does not cover the direct marking on insulated electrical wires and cables.&lt;/div&gt;&lt;/div&gt;</p>
