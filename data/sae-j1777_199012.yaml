    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Hydrospace Information Report (HIR) identifies the general environmental considerations for the design, development, evaluation, and testing of advanced surface craft, submersible vehicles, and other marine craft. This HIR provides criteria on the environmental limits within which marine vehicles, related components, and associated equipment should operate satisfactorily and reliably.&lt;/div&gt;&lt;/div&gt;</p>
