    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines a procedure for the construction and testing of glass to metal lap shears for determining shear strength of sealant adhesives for automotive stationary glass bonding. This procedure can also be used for fiber reinforced plastic (FRP) when used in place of metal.&lt;/div&gt;&lt;/div&gt;</p>
