    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides a summary of the activities to-date of Task Force #1 - Research Foundations – of the SAE’s Driver Vehicle Interface (DVI) committee. More specifically, it establishes working definitions of key DVI concepts, as well as an extensive list of data sources relevant to DVI design and the larger topic of driver distraction.&lt;/div&gt;&lt;/div&gt;</p>
