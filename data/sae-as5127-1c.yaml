    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) describes test methods to determine the application and performance properties of two-component sealing compounds. It shall be used in conjunction with AS5127 and the applicable material specification. When modifications to these test methods are called out in material specifications, the material specification shall take precedence.&lt;/div&gt;&lt;/div&gt;</p>
