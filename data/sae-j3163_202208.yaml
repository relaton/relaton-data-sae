abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This Recommended Practice provides a taxonomy and definitions
    for terms related to shared mobility and enabling technologies. Included are functional
    definitions for shared modes (e.g., carsharing, bikesharing, ridesourcing, etc.).
    Public transit services and other incumbent services—such as car rentals, shuttles,
    taxis, paratransit, ridesharing (carpooling/vanpooling), and pedicabs—are also
    included in the ecosystem of shared mobility services. This Recommended Practice
    also provides a taxonomy of related terms and definitions (e.g., station-based
    roundtrip, free-floating one-way, etc.). This Recommended Practice does not provide
    specifications or otherwise impose requirements on shared mobility.&lt;/p&gt;</p>"
