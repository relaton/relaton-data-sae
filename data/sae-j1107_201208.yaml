  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Information Report presents background and rationale for SAE Recommended Practice J1106, Laboratory Testing Machine and Procedures for Measuring the Steady Force and Moment Properties of Passenger Car Tires. The purpose of SAE J1106 is to define standards for equipment design and test procedures so that data from different laboratories can be directly compared. Whereas such standardization is not a requirement for testing associated with tire development, it is necessary in the context of vehicle design and tire selection problems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The basic approach employed in developing SAE J1106 was to consolidate and document existing technology as embodied in equipment and procedures currently employed for routine tire evaluations. Equipment and procedures whose current use is restricted to research applications were not considered. Research experience is discussed in this Information Report, however, to the extent deemed necessary to provide background and rationale for SAE J1106. Material is therefore included on speed effects, contaminants dynamic testing, traction, surface geometry, and other subjects not considered in SAE J1106. The scope was expanded in an effort to anticipate questions raised by SAE J1106.&lt;/div&gt;


    &lt;/div&gt;</p>
