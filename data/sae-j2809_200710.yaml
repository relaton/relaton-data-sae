  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Technical Information Report defines the proprietary diagnostic communication protocol for ABS or VSA ECU (Electronic Control Unit) implemented on some Honda vehicles. This protocol does not apply to all Honda vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document should be used in conjunction with SAE J2534-2 in order to fully implement the communication protocol in an enhanced SAE J2534 interface.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to specify the requirements necessary to implement the communication protocol in an enhanced SAE J2534 interface.&lt;/div&gt;&lt;/div&gt;</p>
