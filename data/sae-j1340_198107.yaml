  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The testing techniques outlined in this SAE Recommended Practice were developed as part of an overall program for testing and evaluating fuel consumption of heavy-duty trucks and buses. The technique outlined in this recommended practice provides a general description of the type of equipment and facility which is necessary to determine the power consumption of these engine-driven components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recommended that the specific operating conditions suggested throughout the test be carefully reviewed on the basis of actual data obtained on the specific vehicle operation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;If specific vehicle application is not known, see SAE J1343, “Information Relating to Duty Cycles and Average Power Requirements of Truck and Bus Engine Accessories,” &lt;span class="xref"&gt;Section 3&lt;/span&gt;, Air Brake Compressors and &lt;span class="xref"&gt;Section 5&lt;/span&gt;, Air Conditioning Compressor.&lt;/div&gt;&lt;/div&gt;</p>
