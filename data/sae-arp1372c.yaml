  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The requirements of this SAE Aerospace Recommended Practice (ARP) are applicable to ground handling and transport systems equipment which is designated to accommodate main deck unitized cargo in the form of intermodal containers and other compatible unitized load devices. Intermodality in the context of this document concerns primarily air and land modes but does not exclude the marine mode. Equipment with compatibility features for other than main deck cargo is likewise not excluded.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not the intent of this document to specify equipment design but rather to ensure interface compatibility of the various elements which might make up a total ground handling and transport system developed within a number of different operational schemes. It is the intent of this document to specify minimum ULD handling and restraint features to ensure future interchange capability.&lt;/div&gt;
    &lt;/div&gt;</p>
