    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Waste heat recovery (WHR) systems are used in vehicles and machines powered by internal combustion (IC) engines to capture unused and therefore wasted heat and utilize it. This reduces fuel consumption and emissions by improving efficiency. This information report is a survey of the waste heat recovery methods that include the use of heat exchangers.&lt;/div&gt;&lt;/div&gt;</p>
