abstract:
- language: en
  script: Latn
  content: "<p>This part of SAE J551 specifies on-board transmitter simulation test methods and procedures for testing passenger cars and commercial  vehicles. The electromagnetic disturbances considered in this part of SAE J551 are limited to continuous narrow band electromagnetic fields. SAE J551/1 specifies general, definitions, practical use, and basic  principles of the test procedure.</p>"
