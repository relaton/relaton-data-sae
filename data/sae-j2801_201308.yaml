  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to 12 V, flooded and absorptive glass mat lead acid automotive storage batteries of 200 minutes or less reserve capacity and cold crank capacity greater than 200 amperes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This life test is considered to be comprehensive in terms of battery manufacturing technology; applicable to lead-acid batteries containing wrought or cast positive grid manufacturing technology and providing a reasonable correlation for hot climate applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended as a guide toward standard practice, but may be subject to change to keep pace with experience and technical advances.&lt;/div&gt;
    &lt;/div&gt;</p>
