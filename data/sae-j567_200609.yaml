    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard references the performance and functional requirements of the International Electrotechnical Commission (IEC) and its U.S. member, the American National Standards Institute (ANSI). By referring to IEC/ANSI and its standards concerning bulb sockets, lamp holders, and gages, this document recognizes the need for harmonized standards world-wide for what are typically commodity items. Additional requirements are noted.&lt;/div&gt;&lt;/div&gt;</p>
