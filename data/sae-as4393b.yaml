abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for the following types of self-locking nuts:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wrenching Nuts: i.e., hexagon and double hexagon nuts.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Anchor Nuts: i.e., plate nuts, gang channel nuts, and shank nuts.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The wrenching nuts, shank nuts, and nut elements of plate and gang channel nuts are made of corrosion and heat resistant precipitation hardenable iron base alloy of the type identified under the Unified Numbering System as UNS S66286 and of 160 000 psi axial tensile strength at room temperature, with maximum conditioning temperature of parts at 1200 °F prior to room temperature testing.&lt;/div&gt;&lt;/div&gt;</p>
