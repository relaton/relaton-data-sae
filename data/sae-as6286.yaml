  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the minimum training and qualification requirements for ground based aircraft deicing/anti-icing methods and procedures.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All guidelines referred to herein are applicable only in conjunction with the applicable documents. Due to aerodynamic and other concerns, the application of deicing/anti-icing fluids shall be carried out in compliance with engine and aircraft manufacturers’ recommendations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The scope of training should be adjusted according to local demands. There are a wide variety of winter seasons and differences of the involvement between deicing operators and the level and length of training should therefore be adjusted accordingly. However, the minimum level of training shall be covered in all cases. As a rule of thumb, each hour of classroom training should at least equal the same amount (or include more) of practical training wherever this is relevant. Both basic and recurrent practical training shall be performed and documented periodically.&lt;/div&gt;&lt;/div&gt;</p>
