    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Pertinent information to provide design guidance in avoiding fatigue failures is outlined in this SAE Information Report. Of necessity, it is brief, but it does provide a basis for approaching complex fatigue problems. The information provided here can be used in preliminary design estimates of fatigue life, the selection of materials and the analysis of service load and/or strain data.&lt;/div&gt;&lt;/div&gt;</p>
