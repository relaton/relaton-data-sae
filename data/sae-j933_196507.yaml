  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the mechanical and quality requirements for steel tapping screws used in automotive and related industries. It does not apply to corrosion resistant (stainless) steel screws. It is intended to cover only tapping screws of the type and dimensions covered in SAE J478. Requirements for other types of tapping screws are not covered in this recommended practice.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The primary objective of the specification is to insure that screws form or cut mating threads in materials of construction into which they are normally driven, without deforming their own thread and without breaking during assembly or service.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Certain limitations on basic material and manufacturing processes have been incorporated because the size and configuration of the parts under consideration make them vulnerable to relatively small variations in chemistry, heat treatment, etc., and because experience has shown that in processing, it is difficult to keep these variables consistently “in balance.” Until improved performance tests are developed these limitations will supplement the “performance” features of the specification.&lt;/div&gt;&lt;/div&gt;</p>
