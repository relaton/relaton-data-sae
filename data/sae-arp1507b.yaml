  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides a guide for the preparation of a helicopter engine/airframe interface document and checklist. This document and checklist should identify the information needed by the engine manufacturer and the aircraft manufacturer to integrate the engine design with the aircraft design and either provide this information or give reference to where this information is located. The intent is to assure that the engine manufacturer and the airframe manufacturer identify and make provision for this information so it can be easily accessible to either manufacturer as needed in the development stages of an engine-airframe integration project.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A related document, SAE Aerospace Information Report AIR6181, provides guidance on creating an interface control document (ICD) which addresses a subset of the aircraft-engine interface information concerning the physical and functional interfaces of the electronic engine control system (EECS) with the aircraft systems. This would include signal interfaces, digital data busses and integrated functionality with the aircraft electronic systems and avionics displays. The engine/airframe interface document should reference this EECS ICD rather than duplicate its information. Similarly, as information is documented in the engine installation manual or engine installation drawings, the engine/airframe interface document should make references to the engine installation manual or engine installation drawings, rather than duplicate the information. Typically, the engine/airframe interface document will be the initial document in the project to capture the interface information which can then transition to referenced information as the engine installation manual, EECS ICD, and engine installation drawings are developed.&lt;/div&gt;&lt;/div&gt;</p>
