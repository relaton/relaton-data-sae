abstract:
- language: en
  script: Latn
  content: "<p>The Automotive Lubricant Performance and Service Classification Maintenance
    Procedure is designed to keep abreast of changing requirements by redefining existing,
    adding new, or declaring as obsolete lubricant categories (Unless otherwise specified,
    the words categories or category shall also imply classifications or classification.)
    with automotive application. To accomplish such action expeditiously requires
    close coordination among the appropriate societies (i.e. API or NLGI,  ASTM and
    SAE) (The following committees are responsible within the respective societies:
    API - Marketing Department Fuels and Lubricants Committee; ASTM - Committee D02,
    Subcommittee B, G, or 07 (as appropriate) In the case of automotive greases, ASTM
    Subcommittee B develops performance criteria while Subcommittee G develops the
    test techniques.; CEC - Engine Fuel, Engine Lubricants or Transmission Lubricants
    Technical Committee; NLGI - Board of Directors; SAE - Fuels and Lubricants Division).
    This procedure is to be used for lubricants as currently defined in various SAE
    documents; i.e. engine oils (J183, J1423), transmission fluids (J311, J1285),
    axle/manual transmission lubricants (J306), and lubricating greases (J310).</p>"
