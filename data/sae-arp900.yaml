  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this test procedure is to present test methods that can be utilized to evaluate the filtration and operating characteristics of filters that will be utilized in a cryogenic system. The methods presented herein are intended to supplement standard filter testing specifications to allow evaluation of filter performance characteristics in areas that could be affected by extreme low temperatures. The test methods can be utilized to evaluate filters up to and including 60 GPM (330 liters per minute) capacity. If higher flow rate filters are to be evaluated in accordance with the test methods presented herein, it will be necessary to increase the system flow capacity and the size of effluent sampling system.&lt;/div&gt;&lt;/div&gt;</p>
