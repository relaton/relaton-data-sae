    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The requirements for setting up and operating the machinery, the microphone array and the size of the hemispherical measurement surface are given in this recommended practice. This recommended practice shall be used in conjunction with ISO 4872-1978, which gives the basic criteria for the acoustic environment, instrumentation, microphone positions, procedures for the measurement of the A-weighted sound pressure levels and the calculation of the A-weighted sound power levels.&lt;/div&gt;&lt;/div&gt;</p>
