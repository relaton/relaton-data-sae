  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard includes complete general and dimensional specifications for those types of pipe fittings commonly used in the automotive and other mass production industries where the use of lubricants or sealers is objectionable. The automotive pipe fittings shown in &lt;span class="xref"&gt;Figures 1&lt;/span&gt; to &lt;span class="xref"&gt;17&lt;/span&gt; and &lt;span class="xref"&gt;Tables 1&lt;/span&gt; to &lt;span class="xref"&gt;6&lt;/span&gt; are intended for general automotive and similar applications involving low or medium pressures or in conjunction with automotive tube fittings in piping systems.&lt;/div&gt;&lt;/div&gt;</p>
