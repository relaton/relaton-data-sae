abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This standard establishes uniform physical item identification marking in constantly recurring symbols for selected iron and steel products which are procured and issued for Government agencies. Shipment and inspection acceptance marking are not within the scope of this standard.&lt;/p&gt;
    &lt;p&gt;The marking requirements of this standard are applicable when included in the item specification or individual contract. Government decision to include the marking requirements of this standard in a Government specification for iron and steel products shall be subject to coordination between the Government and the iron and steel industry.&lt;/p&gt;</p>
