abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The primary objective of this recommended practice is to confirm that vehicles can communicate a minimum set of information in accordance with diagnostic test services specified in SAE J1979-2, or the equivalent ISO 14229-1:2013 (Ed. 2) and SAE J1979-3 documents. A successful result using the SAE J1699-5 Automotive Alliance for Innovation (AAI) software for OBD-II testing indicates that the main aspects of UDS communication have been examined, but it does not provide assurance of complete compliance with all aspects of SAE J1979-2 or SAE J1979-3.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1699-5 tests run with a SAE J2534 device hardware and API that is not fully compliant will result in a test failure.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification takes precedence over all conflicts in the documents cited in this section.&lt;/div&gt;&lt;/div&gt;</p>
