  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard identifies earthmoving machines which are intended for use on unimproved surfaces. The machines are used for moving earth and other materials on projects such as road building, dams, open pit excavation, trenching, and buildings. Excluded are machines intended for use on improved surfaces such as “in-plant” material handling, highways, water, air transport, and for agricultural purposes.&lt;/div&gt;&lt;/div&gt;</p>
