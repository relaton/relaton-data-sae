abstract:
- language: en
  script: Latn
  content: "<p>This study addresses the adequacy of sockets, wrenches, and torque
    \ adapters conforming to AS954 to wrench 12 point fasteners with wrenching configurations
    conforming to AS870C. Reported wrenching problems with smaller sizes are investigated
    through examining the combined tolerances on the fasteners and wrenches, conducting
    torque testing on typical high strength lock nuts. Possible solutions to correct
    these wrenching problems are presented.</p>"
