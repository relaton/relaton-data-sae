  content: "<p>This SAE Standard outlines physical dimensions and nomenclature for the sizes of seals commonly used in engine coolant pumps of automotive type engines.  Its purpose is to define a standard envelope to accommodate installation of various seal designs and to promote uniformity in seal nomenclature.  (See Figures 1 to 5.)</p>"
