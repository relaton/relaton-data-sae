abstract:
- language: en
  script: Latn
  content: "<p>This specification covers accelerated curing synthetic rubber compounds
    with corrosion inhibitors and low adhesive strength supplied as a two-component
    system.  This product has been used typically for sealing aircraft access doors
    and accessories where gaskets are required, but usage is not limited to such applications.
    \ Compound is classified as an A-2 sealing compound; the compound being suitable
    for brush application with a minimum of two hours application time after mixing.</p>"
