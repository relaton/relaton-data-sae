    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is a guideline for format, structure and content for ground support equipment (GSE) technical manuals. This document focuses on requirements specific to the GSE industry and does not cover general technical publication practices. Additional standards for GSE and for manufacturer’s publications exist and may add requirements beyond what is covered in this standard. This may include EU Directive 2006/42/EC.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is written in specific terms by intention, and conforms to recognized practices in the industry. When the word SHALL is used in this standard, it indicates a requirement that must be adhered to in total and does not allow for variance. When the word SHOULD is used, it indicates a recommended practice which allows the manual writer to use discretionary judgment. This document does not apply to electronic test equipment.&lt;/div&gt;&lt;/div&gt;</p>
