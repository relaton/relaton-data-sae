  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This code specifies the conditions of testing and engine configuration which must be satisfied in order to qualify for the designation “SAE net” horsepower or “SAE gross” horsepower or in any way to indicate power capability conforming to SAE standards or requirements. It is applicable to all 4-stroke cycle and 2-stroke cycle diesel engines, naturally aspirated, mechanically supercharged turbocharged. This code is not intended as a complete laboratory test manual or for the derating of engines for altitude.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This code is composed of the following sections:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
