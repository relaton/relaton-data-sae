  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document contains the recommended practices for the traceability of civil aircraft life-limited parts (LLPs) applicable to landing gears. A unified means of tracking flight cycles, flight hours, and calendar time is provided, which will ease the interchange of parts between companies and through the component’s life cycle. A harmonized means of defining “back-to-birth” (BtB) traceability is provided to ensure airworthiness of service LLPs.&lt;/div&gt;

    &lt;/div&gt;</p>
