  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP provides symbols to schematically represent aerospace vehicle environmental system components on functional flow schematic drawings and graphical computerized output. The symbols are for use on simplified diagrams that provide basic information about an environmental system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Symbols are provided to represent basic types of components used in environmental systems. Simple variations of basic symbol types are provided. Words on the schematic diagram, special symbol codes, or symbols that combine basic symbol types (&lt;span class="xref"&gt;Section 5&lt;/span&gt;) can be used to augment the basic symbols when appropriate. Special or combined symbols not contained in this document should be defined on the schematic diagram.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;An example of a complete schematic is given in &lt;span class="xref"&gt;Section 6&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A bibliography of other documents on environmental system symbols is found in &lt;span class="xref"&gt;Section 7&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
