  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides a general method for defining the acceptable function performance status classification for the functions of automotive electronic devices upon application of the test conditions specified as described in appropriate EMC immunity test standards (for example, SAE J1113 and SAE J551). Testing of devices could be performed either on or off vehicles. Appropriate test signal and methods, Function Performance status, and test signal severity level would have to be specified in the individual cases.&lt;/div&gt;&lt;/div&gt;</p>
