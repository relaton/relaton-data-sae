  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Standard describes methods to understand the risks associated with vehicle mobile air conditioning [MAC] systems in all aspects of a vehicle’s lifecycle including design, production, assembly, operation and end of life. Information for input to the risk assessment is provided in the Appendices of this document. This information should not be considered to be complete, but only a reference of some of the data needed for a complete analysis of the risk associated with the use of refrigerants in MAC systems.&lt;/div&gt;&lt;/div&gt;</p>
