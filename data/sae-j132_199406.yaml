    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the mechanical and chemical requirements of oil-tempered chromium-vanadium valve spring quality wire used for the manufacture of engine valve springs and other springs used at moderately elevated temperatures and requiring high fatigue properties. It also covers the processing requirements of spring fabricated from this wire.&lt;/div&gt;&lt;/div&gt;</p>
