abstract:
- language: en
  script: Latn
  content: |-
    <p>This standard establishes procedures for conducting tests to determine the mechanical properties of externally and internally threaded fasteners.

    Property requirements and the applicable tests for their determination are specified in individual product standards.  In those instances where the testing requirements are unique or at variance with these standard procedures, the product standard shall specify the controlling testing requirements.

    This standard describes mechanical tests for determining the following properties:

    For externally threaded fasteners:
    Product hardness (Section 4.1)
    Surface hardness (Section 4.2)
    Proof load (Section 4.3)
    Yield strength (Section 4.4)
    Axial tensile strength (Section 4.5)
    Wedge tensile strength (Section 4.6)
    Elongation (Section 4.7)
    Reduction of area (Section 4.7)

    For internally threaded fasteners:
    Product hardness (Section 5.1)
    Proof load (Section 5.2)</p>
