  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard defines the data interfaces between a host aircraft (“platform”) and an Electro-Optic/Infrared (EO/IR) sensor. These data interfaces cover various types of data including: imagery, metadata, command, status, and responses (CSR), geospatial postion, time, test and maintenance, and hand-controller. This standard does not cover mechanical or electrical interfaces.&lt;/div&gt;


    &lt;/div&gt;</p>
