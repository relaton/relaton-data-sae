  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides a method for gas turbine engine performance computer programs to be written using Fortran COMMON blocks. If a “function-call application program interface” (API) is to be used, then ARP4868 and ARP5571 are recommended as alternatives to that described in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;When it is agreed between the program user and supplier that a particular program shall be supplied in Fortran, this document shall be used in conjunction with AS681 for steady-state and transient programs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document also describes how to take advantage of the Fortran CHARACTER storage to extend the information interface between the calling program and the engine subroutine.&lt;/div&gt;&lt;/div&gt;</p>
