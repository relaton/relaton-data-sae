abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;Este documento se ha preparado y emitido para proporcionar información y orientación sobre la aplicación de la PECAL 2110 cuando el suministrador se adhiere a las disposiciones de la norma 9100. Este documento se publica como anexo a la AQAP-2110-SRD.2 e IA9137. Ha sido desarrollado conjuntamente por la OTAN y los representantes de la industria para utilizarlo en la OTAN y en la industria a fin de facilitar el uso y la comprensión de la relación entre la PECAL 2110 y la norma 9100. Las PECAL pueden ser necesarias cuando una nación compradora utiliza el programa Foreign Military Sales (FMS) como método de adquisición.&lt;/p&gt;


    &lt;p&gt;Pretende contribuir a una interpretación unificada de los requisitos de la PECAL 2110 por parte del comprador y de su suministrador 9100.&lt;/p&gt;


    &lt;p&gt;Su contenido no tiene estatus legal ni contractual, ni sustituye, añade ni cancela ningún requisito de la PECAL 2110 o la norma 9100.&lt;/p&gt;


    &lt;p&gt;Debido a la multitud de condiciones que pueden existir (en función de factores tales como el tipo de trabajo o proceso, los dispositivos utilizados y las habilidades del personal implicado), esta guía no debería considerarse como exhaustiva, ni tampoco debería considerarse que impone medios o métodos específicos para cumplir los requisitos contractuales. Los grupos de interés deberían ser conscientes de que pueden utilizarse otros medios o métodos para cumplir estos requisitos.&lt;/p&gt;


    &lt;p&gt;Los usuarios de esta guía deberían tener en cuenta en todo momento que los requisitos de la PECAL 2110 son obligatorios, según se menciona en el contrato, para los suministradores y subsuministradores.&lt;/p&gt;</p>
