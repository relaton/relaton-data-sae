    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The objective of this glossary is to establish uniform definitions of parts and terminology for engine cooling systems. Components included are all those through which engine coolant is circulated: water pump, engine oil cooler, transmission and other coolant-oil coolers, charge air coolers, core engine, thermostat, radiator, external coolant tanks, and lines connecting them.&lt;/div&gt;&lt;/div&gt;</p>
