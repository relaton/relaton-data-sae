  content: |-
    <p>This product includes information on the manufacturer, engine, applications, testing location, certified maximum horsepower, certified maximum torque along with the certified curves of horsepower and torque over a wide range of engine RPM speeds.

    In addition, this product contains complete engine information such as displacement, cylinder configuration, valve train, combustion cycle, pressure charging, charge air cooling, bore, stroke, cylinder numbering  convention, firing order, compression ratio, fuel system, fuel system pressure, ignition system, knock control, intake manifold, exhaust manifold, cooling system, coolant liquid, thermostat, cooling fan, lubricating oil, fuel, fuel shut off speed, etc.  Also included are all measured test parameters outlined in J2723.</p>
