    &lt;div class="htmlview paragraph"&gt;This specification covers a premium aircraft-quality corrosion-resistant steel in the form of bars, wire, forgings, mechanical tubing, flash welded rings, and extrusions 7.00 inches (177.8 mm) and under in nominal diameter or least distance between parallel sides, and stock of any size for forging, flash welded rings, or extruding (see &lt;span class="xref"&gt;8.8&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
