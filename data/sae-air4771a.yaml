abstract:
- language: en
  script: Latn
  content: "<p>This SAE Aerospace Information Report (AIR) contains information that
    can be used by the air transportation industry to provide passengers in forward
    facing seats, using lap belt restraints only, with consistent  'brace for impact'
    positions. This information is intended to reduce the potential confusion passengers
    may experience upon being presented with different 'brace for impact' positions
    as they travel on different aircraft or on different carriers. This document does
    not address child restraint, situations where adult passengers are seated behind
    fixed tables, or who are using upper-torso restraint, or where passengers are
    not seated in forward facing seats.</p>"
