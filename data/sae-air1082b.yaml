  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The importance of adequate component procurement specifications to the success of a hardware development program cannot be overemphasized. Specifications which are too stringent can be as detrimental as specifications which are too lax. Performance specifications must not only identify all of the component requirements, but they must also include sufficient quality assurance provisions so that compliance can be verified. It should be understood that in almost every case specifications for components will ultimately become part of a BINDING, WRITTEN CONTRACT (PO).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to describe types of specifications, provide guidance for the preparation of fluid component specifications, and identify documents commonly referenced in fluid component specifications.&lt;/div&gt;&lt;/div&gt;</p>
