  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides test protocols with performance requirements for camera monitor systems (CMSs) to replace existing statutorily required inside and outside rear-view mirrors for U.S. market road vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This practice expands specific technical content while retaining harmonization with the FMVSS 111 rear visibility standard and other international standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This is accomplished by defining required roadway fields of view as specific fields of view (FOV) displayed inside the vehicle. Specific testing protocols and/or specifications are added to enhance ease of use using straightforward language, and any specifications are intended to be independent of different camera and display technologies unless otherwise explicitly stated.&lt;/div&gt;&lt;/div&gt;</p>
