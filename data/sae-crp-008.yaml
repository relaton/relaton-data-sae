abstract:
- language: en
  script: Latn
  content: "<p>This document consists of procedures which are designed to evaluate
    the performance of polymeric materials when they  are exposed to variable methanol
    content fuels.  Covered  are: the determination of worst case fuel; the procedure
    \ for conditioning actual test specimens in fuel prior to measuring their physical
    properties; and test methods for  evaluating polymeric materials for use in methanol
    fuels.</p>"
