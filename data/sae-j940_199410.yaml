  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This glossary is intended to provide engineers, metallurgists, and production personnel with uniform definitions of commonly used carbon sheet and strip terms. The glossary serves to supplement information and photographs reported in SAE J810, J763, J877, J863, and J403.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Many of the terms listed apply only to hot-dipped zinc-coated products or to uncoated products. The letter C following the term identifies a term applying to coated materials, while the letters NC identify a term applying to uncoated materials. Where no identification is provided, the term is common to both.&lt;/div&gt;&lt;/div&gt;</p>
