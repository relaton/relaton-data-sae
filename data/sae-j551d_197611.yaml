  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the measurement of impulsive electromagnetic radiation over the frequency range of 20 to 1(100 MHz from a motor vehicle or other device powered by an internal combustion engine. Operation of all engines (main and auxiliary) on a vehicle or other device is included. All equipment normally operating when the engine is running is also included, except operator-controlled equipment, which is excluded. The recommended limit applies only to complete vehicles or devices in their final manufactured form.&lt;/div&gt;&lt;/div&gt;</p>
