abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This set of Abstract Syntax Notation (ASN.1) modules contains the precise definitions of data structures used in the SAE J2735 standard. Using the ASN.1 specification, a compiler tool can produce libraries that enable software applications to use the data structures and produce corresponding encodings (UPER is typically used to encode J2735 messages).&lt;/p&gt;
    &lt;p&gt;The J2735 Standard specifies a message set, data frames and data elements, specifically for use by V2X applications. Although the scope of the standard is focused on V2X, the message set may also be used in other types wireless communications systems. In some cases the specific requirements for use of messages, data frames and data elements are defined in other standards. Refer to the SAE J2735 standard for more information.&lt;/p&gt;
    &lt;p&gt;You may also be interested in:&lt;/p&gt;
    &lt;p&gt;&lt;a href="https://www.sae.org/standards/content/j2735_202409/"&gt;V2X Communications Message Set Dictionary™ the J2735 PDF.&lt;/a&gt;&lt;/p&gt;
    &lt;p&gt;&lt;a href="https://www.sae.org/standards/content/j2735_202409/"/&gt;&lt;a href="https://www.sae.org/standards/content/j2735set_202409/"&gt;V2X Communications Message Set Dictionary™ SET File that includes the J2735 ASN File and the J2735 PDF (ZIP format) - download purchase only.&lt;/a&gt;&lt;/p&gt;</p>
