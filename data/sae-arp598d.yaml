abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Aerospace Recommended Practice (ARP) defines the materials, apparatus and procedure for sizing and counting of particulate contamination, 5 μm or greater, in hydraulic fluid samples by membrane filtration iwth microscopic counting.&lt;/p&gt;


    &lt;p&gt;It is capable of counting particulate matter in samples withdrawn from fluid power systems as identified by the 12 classes of SAE AS 4059 or NAS 1638 and projected beyond these for the five standard ranges specified and can thus serve as the primary document to determine acceptability.&lt;/p&gt;


    &lt;p&gt;It is also capable of revealing but not measuring evidence of abnormal amount of water, other fluids, fine particulate and other materials, especially fibers and metals.&lt;/p&gt;


    &lt;p&gt;It is applicable to all military, civil, space vehicles and test equipment.&lt;/p&gt;</p>
