  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Collision tests are conducted on automotive vehicles to obtain information of value in evaluation of structural integrity and in reducing the risk of occupant injuries. The deformation resulting from a moving rigid barrier impact is more severe at a given speed than that produced by using an actual vehicle, but is more readily reproducible than that occurring during vehicle to vehicle impacts. The purpose of this SAE Recommended Practice is to establish sufficient standardization of such moving barriers and moving barrier collision methods so that results of tests conducted at different facilities may be compared.&lt;/div&gt;&lt;/div&gt;</p>
