  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Hardness measurements are used as a quality control check of the consistency of formulation and processing of brake linings. This hardness method is nondestructive.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;The hardness and the range of hardness are characteristic of each formulation; therefore, the acceptable values and ranges must be established for each formulation and may be affected by processing.&lt;/div&gt;

    &lt;/div&gt;</p>
