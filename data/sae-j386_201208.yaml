  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the minimum performance requirements for pelvic restraint systems (seat belts, anchorages, and the fastening elements of seat belts) necessary to restrain an operator or rider within a roll-over protective structure (ROPS) in the event of a machine roll-over, as defined in ISO 3471, or tip-over protection structure (TOPS), in the event of a machine tip over as defined in ISO 12117.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to off-road, self-propelled work machines fitted with ROPS as specified in ISO 3471, TOPS as specified in ISO 12117 and operator restraint.&lt;/div&gt;&lt;/div&gt;</p>
