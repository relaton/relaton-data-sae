  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This technical information report (IR) presents a methodology to evaluate battery pack liquid leak tightness attributes to be used in a production line to satisfy the functional requirement for IPX7, water ingress requirement, and no sustainable coolant leakage for coolant circuits. The Equivalent Channel Method is used as a suggested production leak tightness requirement for a given battery pack design that will correlate and assure that the battery pack meets or exceeds its functional requirement. Obtaining the specific geometry of the Equivalent Channel (EC) for a given battery pack is done analytically and empirically in consideration of the product design limitations. This document is a precursor to J3277-1, which will present the practices to qualify that product leak tightness is equal or better than the maximum allowed EC for that product using applicable and commercially available leak test technologies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document may be applied to EV and HEV battery packs as tested during production, without harnesses or other accessories installed by the OEM during vehicle assembly.&lt;/div&gt;&lt;/div&gt;</p>
