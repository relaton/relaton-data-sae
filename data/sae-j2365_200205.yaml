  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to both Original Equipment Manufacturer (OEM) and aftermarket route-guidance and navigation system functions for passenger vehicles. This recommended practice provides a method for calculating the time required to complete navigation system-related tasks. These estimates may be used as an aid to assess the safety and usability of alternative navigation and route guidance system interfaces to assist in their design. This document does not consider voice-activated controls, voice output from the navigation system, communication between the driver and others, or passenger operation.&lt;/div&gt;&lt;/div&gt;</p>
