abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Highly integrated electrical and electronic systems that perform functions within an aircraft may have potential failure conditions during and after exposure to the High-Intensity Radiated Fields (HIRF) or lightning environments. It is therefore necessary to conduct an HIRF and Lightning Safety Assessment (HLSA) that can identify potential failure conditions resulting from exposure to the aircraft HIRF and lightning environments. The failure conditions, failure conditions classifications, and independence principles identified by Aircraft Functional Hazard Assessment (AFHA), Preliminary Aircraft Safety Assessment (PASA), System Functional Hazard Assessment (SFHA), and Preliminary System Safety Assessment (PSSA), and lessons learned from previous experience, are used to identify proposed requirements during the development process. Ultimately, these requirements will result in a design capable of demonstrating that exposure to the HIRF and lightning environments will not result in adverse effects to the operation of the aircraft. This document provides guidance for conducting the HLSA process to classify the system and its equipment to the appropriate HIRF and Lightning Certification Levels (HLCLs).&lt;/div&gt;
    &lt;/div&gt;</p>
