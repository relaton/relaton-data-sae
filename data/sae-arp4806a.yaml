abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This document specifies the general functional and performance requirements for a self-propelled, boom type aerial device equipped with an aircraft deicing/anti- icing fluid (ADF) spraying system. The unit shall be highly maneuverable for deicing and anti-icing all exterior surfaces of wide-body and narrow-body aircraft, e.g., B747 and DC9. The vehicle shall be suitable for day and night operations. The vehicle and all associated systems shall operate satisfactorily under the temperature conditions between -40 and 50 degrees C (-40 and 122 degrees F) and in continuous humidity of up to 100%.&lt;/p&gt;
    &lt;p&gt;It is not within the scope of this document to specify a comprehensive set of technical design criteria for aircraft deicing/anti-icing vehicles but only those relating to functional and  performance requirements.&lt;/p&gt;</p>
