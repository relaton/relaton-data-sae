  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to provide minimum performance and operating feature requirements for the recovery of HFC-134a (R-134a) refrigerant to be returned to a refrigerant reclamation facility that will process it to the appropriate AHRI 700 Standard or allow for on-site recycling of the recovered refrigerant to SAE J2788 specifications by using SAE J2788 or SAE J3030 -certified equipment. It is not acceptable that the refrigerant removed from a mobile air-conditioning (A/C) system with this equipment be directly returned to a mobile A/C system. An identifier certified to SAE J2912 is to be used to identify the contents of the system prior to recovery of the refrigerant.&lt;/div&gt;

    &lt;/div&gt;</p>
