  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard sets forth the instrumentation and procedure to be used in measuring the exterior sound pressure levels for self-propelled off-road work machines as defined in sections 1, 3, 5 and 6 of SAE J1116. This document does not address the operation of safety devices such as backup alarms, horns, or accessories. The sound levels obtained by using the test procedures set forth in this document are repeatable and are representative of the higher range of sound levels generated by machines under actual field operating conditions. Due to the variability of field operating conditions, this data is not intended to be used for construction site boundary noise evaluations.&lt;/div&gt;&lt;/div&gt;</p>
