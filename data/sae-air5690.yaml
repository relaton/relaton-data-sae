  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is intended to promote awareness of the dangers associated with the carriage and use of pyrotechnic signaling devices in multi-place life rafts and slide/rafts on transport category aircraft. Also included is background information and a rationale for replacing these devices with alternative signaling devices, which offer effective signaling and reduced flammability, yielding an “equivalent level of safety,” as required by the FAA for replacement of the required pyrotechnic signaling device.&lt;/div&gt;&lt;/div&gt;</p>
