  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the tests for three basic categories of pump characteristics. These are the basic functional performance tests, the pump limitation tests and the pump integrity tests. The basic functional tests included are three individual tests, with the first being for pump speed, current draw, and electrical resistance. The other two individual tests are for the deadhead pressure and the delivered fuel flow rate at the rated delivery pressure and voltage. The included tests for pump limitations are individual tests for hot fuel handling, cold magnet knockdown, load dump transient, electrical interference, and reverse flow leak. The testing for pump integrity includes individual tests for vibration, temperature cycling, internal fluid compatibility, and operational durability. These 12 individual tests provide a characterization of the particular pump. This document only addresses the in-tank-mounted, electric-motor-driven, low-pressure fuel pump itself, and does not address in-tank pump modules, as these modules may include other devices. The pumps that are to be tested are intended for the pumping of liquid fuels that are applicable to fuel-injected, spark-ignition engines.&lt;/div&gt;
    &lt;/div&gt;</p>
