  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) discusses the sources of Copper in aviation jet fuels, the impact of Copper on thermal stability of jet fuels and the resultant impact on turbine engine performance, and potential methods for measurement and reduction of the catalytic activity of Copper contamination in jet fuels. This document is an information report and does not provide recommendations or stipulate limits for Copper concentrations in jet fuels.&lt;/div&gt;
    &lt;/div&gt;</p>
