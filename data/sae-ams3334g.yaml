    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a silicone (MQ/VMQ/PVMQ) elastomer that can be used to manufacture product in the form of sheet, strip, tubing, extrusions, and molded shapes. This specification should not be designated for use in molded O-rings and molded O-ring cord, molded rings, compression seals, molded-in-place gaskets, and plate seals for aeronautical and aerospace applications.&lt;/div&gt;&lt;/div&gt;</p>
