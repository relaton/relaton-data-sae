  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers four types of hose for use with automatic transmission fluid: A, B, AT, and BT. Type A and Type B are for use within a temperature range of -40 to 125 °C (-40 to 257 °F) while types AT and BT are for use within a temperature range of -40 to 150 °C (-40 to 302 °F). Recommended maximum operating pressure for Type A and Type AT hose is 1.7 MPa (250 psi) while recommended maximum operating pressure for Type B and Type BT hose is 1.0 MPa (150 psi). The lower pressure (Types B and BT) hose is for auxiliary cooler applications only. The reference fluid for tests requiring the use of automatic transmission fluid shall be Dexron-II E/Mercon or equivalent.&lt;/div&gt;&lt;/div&gt;</p>
