abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is applicable to all light-duty gasoline and diesel passenger vehicles and trucks, and to heavy-duty gasoline vehicles. Specific applications of this document include diagnostic, service and repair manuals, bulletins and updates, training manuals, repair data bases, underhood emission labels, and emission certification applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document focuses on diagnostic terms applicable to electrical/electronic systems, and therefore also contains related mechanical terms, definitions, abbreviations, and acronyms.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Even though the use and appropriate updating of this document is strongly encouraged, nothing in this document should be construed as prohibiting the introduction of a term, abbreviation, or acronym not covered by this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Certain terms have already been in common use and are readily understood by manufacturers and technicians, but do not follow the methodology of this document. To preserve this understanding, these terms were included and have been identified with the footnote (2), “historically acceptable common usage”, so they will not erroneously serve as a precedent in the construction of new names. These terms fall into three categories:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Acronyms that do not logically fit the term.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Acronyms existing at the component level, i.e., their terms contain the base word or noun that describes the generic item that is being further defined.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Acronyms for terms that appear to contain the base word, but are frequently used as a modifier to another base word. (This use may possibly be thought of as following the methodology since the acronym is normally used as a modifier.)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
