  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard applies to machines which are designed to raise, lower, and carry pipe and loads of similar nature.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The term &lt;i&gt;pipelayer&lt;/i&gt; does not include tractors or loaders with side booms which are optional attachments, manufacturer or dealer-installed, to machines as defined in SAE J1057.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Note: Some related standards will apply equally to pipelayers and to tractors and loaders with side boom. Two such standards are SAE J743 and ANSI B30.14.&lt;/div&gt;&lt;/div&gt;</p>
