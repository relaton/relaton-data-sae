  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion resistant steel in the form of bars, wire, forgings, flash welded rings, and extrusions in the solution heat treated condition (see &lt;span class="xref"&gt;8.3&lt;/span&gt;), 12 inches (305 mm) and under in nominal diameter, thickness or for hexagons, least distance between parallel sides, and having a maximum cross-sectional area of 144 in&lt;sup&gt;2&lt;/sup&gt; (930 cm&lt;sup&gt;2&lt;/sup&gt;), and stock of any size for forging, flash welded rings, or extruding.&lt;/div&gt;
    &lt;/div&gt;</p>
