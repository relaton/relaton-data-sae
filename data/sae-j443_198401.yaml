  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform procedures for using the standard shot peening test strips reported in SAE Standard J442, Test Strip, Holder and Gage for Shot Peening. Standard test strips are used to control repeatability of the shot peening machine operations, and to specify a desired result on a part. It is recommended that the standard test strip A be used for intensities that produce arc heights of 6A to 24A. For intensities below 6A, the standard N strip is recommended, and for intensities above 24A, the standard C strip is recommended.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Shot peening is intended to induce surface compressive stresses in metal parts for the purpose of improving resistance to fatigue and stress corrosion cracking. Springs, axles, and aircraft landing gears are typical examples of such parts. To have the desired effect, shot peening requires that specified intensity and coverage be achieved on critical areas, where the high tension stresses or stress ranges are most likely to cause fatigue or stress corrosion failures in service. Actual experience with service failures or fatigue tests may sometimes be required to discover or confirm the location of areas subject to critical stressing, as a result of service, design, and/or manufacturing conditions.&lt;/div&gt;&lt;/div&gt;</p>
