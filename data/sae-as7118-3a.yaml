abstract:
- language: en
  script: Latn
  content: |-
    <p>This Aerospace Standard (AS) establishes the requirements for suppliers of Composites to be accredited by Nadcap. Nadcap accreditation is granted in accordance with SAE AS7003 after demonstration of compliance with the requirements herein. The requirements may be supplemented by additional requirements specified by the Nadcap Composites Task Group. Using the corresponding Audit Criteria (PRI AC7118) will ensure that accredited Composites suppliers meet all of the requirements in this standard and all applicable supplementary standards.

    The purpose of this audit program is to assess a supplier's ability to consistently provide a product or service that conforms to the technical specifications and customer requirements. The corresponding audit criteria is also structured to obtain information relevant to management practices and processes that directly or indirectly affect the product or service. This information will be used in the determination of accreditation status and may be used by the supplier to guide improvements in the product or service and the associated processes.</p>
