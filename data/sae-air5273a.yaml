    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides descriptions of aircraft flight control actuation system failure-detection methods. The fault-detection methods are those used for ground and in-flight detection of failures in electrohydraulic actuation systems for primary flight controls.&lt;/div&gt;

