  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a method to be used for the static deployment of airbag module assemblies. The results obtained from the deployment tests will be used to verify compliance with design requirements and/or specifications. The intent of this procedure is to describe recommended test methods to evaluate performance characteristics of driver airbag modules, passenger airbag modules, or other airbag modules (e.g., side airbags (door or seat mounted), roof rail airbags, knee bolster airbags, etc.). Performance limits or acceptance criteria are not established as they are typically defined based on specific vehicle design requirements. It is intended to be a general procedure for repetitive testing and suggests only general guidelines for the safe conduct of tests and reliable data correlation.&lt;/div&gt;&lt;/div&gt;</p>
