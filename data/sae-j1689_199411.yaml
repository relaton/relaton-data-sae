  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines the expectations for free-standing, nonintegral, nonpressurized reservoir, flooded inlet type, industrial hydraulic power units used on machine tools and equipment for the automotive industry.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These exclude power units used for intermittent and/or noncontinuous duty cycle and pressurized vessels, such as accumulators and air over oil systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Objectives were set and accomplished to develop a consensus of common features which enhance the power unit performance, manufacturing quality, and maintainability. Some of those features are:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Identification&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Common sizes and construction&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Conductors and connectors&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Pump/motor groups&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Filters&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
