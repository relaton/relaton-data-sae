  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to wheel and crawler loaders taking only hydraulic lift capacity and tipping capacity into consideration.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recognized that specific operating conditions may allow larger, or require smaller loads than the rated operating load. Some conditions could require more careful or restricted operation with the rated operating load. This standard is not to be construed as setting up test procedures or conditions.&lt;/div&gt;
    &lt;/div&gt;</p>
