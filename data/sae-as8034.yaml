  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AS covers all types of electronic display systems, as qualified in "Purpose", both panel mounted (head down) and electro-optical (head up), monochromatic and color which are used in the cockpit by flight personnel.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Three basic types of displays are covered as follows:&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Airborne Multipurpose Electronic Displays can include one or more of the following interconnected components. An example is shown in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;. Other configurations are possible.&lt;/div&gt;



    &lt;div class="htmlview paragraph"&gt;Electronic display systems covered by this AS are multifunction and/or multipurpose displays, whose failure can lead to loss of critical displayed information. System design or installation must recognize this characteristic and include appropriate redundancy criteria where applicable.&lt;/div&gt;

    &lt;/div&gt;</p>
