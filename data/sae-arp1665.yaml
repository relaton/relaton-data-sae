  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The test procedure applies to the refueling manifold system connecting the receiver aircraft fuel tanks to the refueling source fuel pump(s) for both ground and aerial refueling. The test procedure is intended to verify that the limit value for surge pressure specified for the receiver fuel system is not exceeded when refueling from a refueling source which meets the requirements of AS 1284 (reference 2). This recommended practice is not directly applicable to surge pressure developed during operation of an aircraft fuel system, such as initiating or stopping engine fuel feed or fuel transfer within an aircraft, or the pressure surge produced when the fuel pumps are first started to fill an empty fuel manifold.&lt;/div&gt;&lt;/div&gt;</p>
