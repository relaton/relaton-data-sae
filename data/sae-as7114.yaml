  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for suppliers of nondestructive testing (NDT) to be accredited by the National Aerospace and Defense Contractors Accreditation Program (NADCAP) in accordance with the current revision of SAE AS7003. Using the audit checklist and the applicable supplementary checklists will ensure that accredited NDT suppliers meet the requirements of this standard and all applicable supplementary standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;When customer requirements differ from those specified herein, the customer requirements shall take precedence.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The NADCAP Nondestructive Testing Task Group recognizes SAE AS7004, SAE AS7106, SAE AS7107 or other quality systems documents approved by the NADCAP NDT Task Group as equivalent to portions of this document as noted in the audit checklist.&lt;/div&gt;&lt;/div&gt;</p>
