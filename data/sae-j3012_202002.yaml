  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE recommended practice applies to 12 V lead-acid storage batteries that are designed specifically for start-stop operations in on-road passenger vehicles or light trucks. Included are definitions of terms, general testing requirements, key performance characteristics, and life testing. Properties not unique to start-stop batteries should be tested according to SAE J537 or other applicable testing protocols.&lt;/div&gt;&lt;/div&gt;</p>
