  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this document is to develop a recommended practice for PEV chargers, whether on-board or off-board the vehicle, that will enable equipment manufacturers, vehicle manufacturers, electric utilities, and others to make reasonable design decisions regarding power quality. The three main purposes are as follows:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To identify those parameters of PEV battery charger that must be controlled in order to preserve the quality of the AC service.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To identify those characteristics of the AC service that may significantly impact the performance of the charger.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To identify values for power quality, susceptibility, and power control parameters which are based on current U.S. and international standards. These values should be technically feasible and cost effective to implement into PEV battery chargers.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J2894/2 will describe the test methods for the parameters/requirements in this document.&lt;/div&gt;&lt;/div&gt;</p>
