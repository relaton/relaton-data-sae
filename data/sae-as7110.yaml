    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for suppliers of Welding Services to be accredited by the National Aerospace and Defense Contractors Accreditation Program (NADCAP). These requirements may be supplemented by additional requirements specified by NADCAP Welding Task Group. Using the audit checklist (AC7110) will ensure that accredited Welding suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;&lt;/div&gt;</p>
