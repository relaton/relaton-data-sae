  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the special treatments and precautions that are to be observed when protective and other surface treatments are applied to items, including springs, made from steel of specified maximum tensile strength exceeding 1450 MPa. The requirements of this Standard qualify those in process specifications and override the latter where there is conflict. The Standard also gives advice on design, manufacture, and preparation of items prior to cleaning and protection.&lt;/div&gt;&lt;/div&gt;</p>
