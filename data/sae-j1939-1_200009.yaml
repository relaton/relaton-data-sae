  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This series of recommended practices are intended for heavy duty vehicles used on roads (on-highway). It is recognized that these recommended practices or portions may be utilized for other applications such as stationary applications which use vehicle derived components (e.g., generator sets). Such alternative applications are allowed even though they are not the primary intent of this SAE recommended practice.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of these recommended practices is to provide an open interconnect system for electronic systems. It is the intention of these recommended practices to allow electronic devices to communicate with each other by providing a standard architecture.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Vehicles covered include all on-highway straight trucks and road trains. A road train consists of one towing vehicle (tractor), and one or more towed vehicle(s) (trailers and dollies). Dolly axles within the road train are considered to be towed vehicles.&lt;/div&gt;
    &lt;/div&gt;</p>
