  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) is a general overview of typical airborne engine vibration monitoring (EVM) systems applicable to fixed or rotary wing aircraft applications, with an emphasis on system design considerations. It describes EVM systems currently in use and future trends in EVM development. The broader scope of Health and Usage Monitoring Systems, (HUMS) is covered in SAE documents AS5391, AS5392, AS5393, AS5394, AS5395, AIR4174. This ARP also contains the essential elements of AS8054 which remain relevant and which have not been incorporated into Original Equipment Manufacturers (OEM) specifications.&lt;/div&gt;
    &lt;/div&gt;</p>
