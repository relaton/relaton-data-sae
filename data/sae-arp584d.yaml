  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) addresses the design, installation, and testing of coiled tube assemblies ranging from 1/4 inch (6.3 mm) to 1.0 inch (25 mm) diameter using CRES tubing per AMS-T-6845, unless otherwise approved by the Procuring Activity.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP specifically details three different configurations of coiled tubing. These configurations should be compatible with pressure levels up to 3000 psi (20.7 MPa) upon the completion of the analysis for the actual stress and life requirement of the intended application. However, formal qualification tests are recommended to verify the satisfactory installation, clamping, and the life of each unique design.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Refer to ARP4146 for information on design of coiled tube assemblies using Titanium tubing.&lt;/div&gt;

    &lt;/div&gt;</p>
