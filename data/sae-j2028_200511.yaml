  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice outlines the qualification testing and performance related criteria of elastomeric boot seals used in constant velocity joint applications. These applications are referred to as front- wheel-drive halfshafts or axles, but can also be utilized in rear-wheel-drive halfshaft applications. For additional information regarding CV joint systems and their applications refer to SAE AE-7 “Universal Joint and Driveshaft Design Manual.”&lt;/div&gt;&lt;/div&gt;</p>
