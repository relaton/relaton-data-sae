abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this standard is to provide uniform methods for defining, quantifying, and classifying the residual stress in metallic structural alloy products and finished parts. These stresses may exist within a single element, or they may be the result of a joining process. Such quantification and classification may be required when residual stresses within mill stock or preforms can impact further in-process distortion during machining or other processes, and when residual stresses within finished components can impact final mechanical properties and performance (especially strength, durability, and fracture performance).&lt;/div&gt;&lt;/div&gt;</p>
