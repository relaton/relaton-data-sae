  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice applies to floodlamp, headlamp and general service lamp units intended for use on off-road self-propelled work machines classified as construction (1.1 and 1.2), general purpose industrial (2) and forestry machines (4), as noted on SAE J1116. Construction and Industrial Machinery is normally operated off highways, therefore, this SAE Recommended Practice is not intended to be used as a basis for regulations by those having authority over motor vehicles used on public highways. Other performance and dimensional information is contained in SAE J572 and J760.&lt;/div&gt;&lt;/div&gt;</p>
