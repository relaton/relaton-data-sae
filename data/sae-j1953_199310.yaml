  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice shall cover mechanical- and electrical-stroke indicators for air cam or disc brakes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This device shall indicate the brake system may require adjustment or service when inspected per vehicle manufacturer's procedures. A measurement shall be made to determine actual stroke measurement.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Stroke indication accuracy of an air-brake actuator can be assured only when all of its components are supplied by the original brake actuator manufacturer.&lt;/div&gt;
    &lt;/div&gt;</p>
