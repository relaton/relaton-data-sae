abstract:
- language: en
  script: Latn
  content: "<p>This SAE Aerospace Standard (AS) sets forth the minimum quality required for aircraft wheel and brake castings.  Its use will establish minimum acceptable requirements for internal structure and surface conditions and is predicated on the use of a casting factor for the ultimate load of more than 1.51 through 2.00.  When casting factors of 1.25 through 1.50 are used, visual, penetrant, and radiographic or other approved equivalent nondestructive inspection methods shall all be required on each production casting.  Where specific parts, or areas of parts, require a quality level exceeding that described by this document, the requirements shall be established by negotiation between the purchaser and vendor.</p>"
