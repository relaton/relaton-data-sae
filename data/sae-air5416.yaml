  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a life cycle cost model for commercial aircraft composite structure. The term life cycle cost used herein, refers to the airline costs for maintenance, spares support, fuel, repair material and labor associated with composites after introduction into service and throughout its useful life. This document contains the equations that can be programmed into software which is used to estimate the total cost of ownership aircraft, including structure. Modification costs and operating costs are estimated over a specified life (any period up to 30 years). Modification costs include spares holding, training, support equipment, and other system related costs. Annual operating costs include: Schedule interruption, fuel, spares, insurance, and maintenance. Maintenance costs are separated by scheduled maintenance or unscheduled damage, or can by grouped into the typical organizations of line, shop, and hangar maintenance. This Lifecycle Cost allows users to evaluate the impact of Service Bulletins, potential design changes, changes in maintenance programs, or effectiveness of maintenance operations.&lt;/div&gt;

    &lt;/div&gt;</p>
