  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Information Report (AIR) is to provide rotorcraft and engine designers with a better understanding of turboshaft engine idle power characteristics and objectives to be considered in the design and integration process. For the purpose of this document, idle is the lowest suitable steady-state power setting, most commonly corresponding to a gas generator speed setting or range. In general, a lower engine idle setting is desired by the airframer to reduce noise, fuel consumption, and main rotor downwash when on the ground and to reduce the size requirement of a rotor brake system. In contrast, the engine manufacturer generally prefers a higher engine idle setting, as operation further away from the engine design speed involves more challenges in operability and mechanical design. A variety of rotorcraft and engine factors are described for consideration. Some typical engine power and torque trends are presented for illustrative purposes. The information contained herein may assist in the early design phase to result in a more optimum match between engine and rotorcraft requirements.&lt;/div&gt;&lt;/div&gt;</p>
