  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers the general requirements for the design, manufacture, and test of Solid State Power Controllers (SSPCs) of both dc and ac ratings for use in electrical power systems. SSPCs conforming to this standard are intended for use in controlling the making and breaking of power circuits for electrically operated equipment and devices, and for providing overload and short-circuit protection.&lt;/div&gt;&lt;/div&gt;</p>
