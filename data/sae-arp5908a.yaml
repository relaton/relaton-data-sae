  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The present document addresses gas and hydraulic fluid servicing required on commercial and military aircraft landing gears, for both single and dual chamber (also known as dual stage and two stage) shock struts. This document should be considered as landing gear industry recommended practice but in no way is meant to supersede the shock strut OEM’s published procedures.&lt;/div&gt;&lt;/div&gt;</p>
