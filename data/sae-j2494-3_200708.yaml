  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended to establish uniform performance criteria and methods of testing push to connect tube fittings, with SAE J844 air brake tubing as used in vehicular air brake systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specific tests and performance criteria applicable to the tubing are set forth in SAE J844. The test values contained in this performance standard are for test purposes only. For environmental and usage limitations, see SAE J844.&lt;/div&gt;
    &lt;/div&gt;</p>
