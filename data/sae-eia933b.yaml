  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to the development of Plans for integrating and managing COTS assemblies in electronic equipment and Systems for the commercial, military, and space markets; as well as other ADHP markets that wish to use this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For purposes of this document, COTS assemblies are viewed as small electronic assemblies such as printed wiring assemblies, relays, disk drives, LCD matrices, VME circuit cards, servers, printers, laptop computers, etc. There are many ways to categorize COTS assemblies&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;, including the following spectrum:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;At one end of the spectrum are COTS assemblies whose design, internal parts&lt;span class="xref"&gt;&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;, materials, configuration control, and qualification methods are at least partially controlled, or influenced, by aerospace customers (either individually or collectively). An example at this end of the spectrum is a VME circuit card assembly. While the design, internal parts, materials, configuration control, and qualification methods are controlled by the assembly suppliers, the assemblies are targeted for ADHP applications, and thus the manufacturers expend considerable effort to understand their customers’ needs; and they design, produce, and qualify their products accordingly. VME assembly suppliers are sensitive to feedback from their customers, and are willing to make changes in response to that feedback. The response is only general, however, and it is not likely that a specific change will be made unless the supplier determines it to be beneficial to the product’s market performance.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;At the other end of the spectrum are COTS assemblies whose design, internal parts, materials, configuration control, and qualification methods are not controlled, or controllable, in any way by ADHP customers (either individually or collectively). An example is a disk drive targeted for an industry other than aerospace. Aerospace customers are not likely to obtain any information beyond the published data sheet; furthermore, the data sheet, and other important information, may be changed without notice. Typically, it is not possible for aerospace customers to purchase these assemblies to a specific issue of a data sheet.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;It is critical for the Plan owner to (1) review and understand the design, internal parts, materials, configuration control, and qualification methods of all “as-received” COTS assemblies&lt;span class="xref"&gt;&lt;sup&gt;3&lt;/sup&gt;&lt;/span&gt;, and their capabilities with respect to their application in the System; (2) identify risks, and where necessary, (3) take additional action to mitigate the risks associated with the performance and reliability of the COTS assembly in the ADHP system.&lt;/div&gt;&lt;/div&gt;</p>
