  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines the requirements for a plug and receptacle used in an auxiliary starting system. The connector facilitates the application of supplemental electrical power for starting or charging a machine from another machine or suitable external source.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This system provides: proper polarity during connector mating, secure electrical connections, and standard circuit color coding.&lt;/div&gt;
    &lt;/div&gt;</p>
