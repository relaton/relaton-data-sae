    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report develops a concept of operations (ConOps) to evaluate a cooperative driving automation (CDA) Feature for occluded pedestrian collision avoidance using perception status sharing. It provides a test procedure to evaluate this CDA Feature, which is suitable for proof-of-concept testing in both virtual and test track settings.&lt;/div&gt;
