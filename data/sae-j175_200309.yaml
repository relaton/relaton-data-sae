    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE Recommended Practice establishes minimum performance requirements and related uniform laboratory test procedures for evaluating axial (lateral) curb impact collision properties of all wheels intended for use on passenger cars and light trucks. It is equivalent to ISO 7141-1981 with the exception of the Definitions section which cites SAE J393.&lt;/div&gt;&lt;/div&gt;</p>
