    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AMS6885/1 gives information about the technical requirements and qualification procedure for unidirectional carbon fiber tape epoxy repair prepreg capable of curing under vacuum for repair of carbon fiber reinforced epoxy structures. The repair system includes an epoxy film adhesive to be applied in a co-bonding process with the prepreg for solid laminate and sandwich bonding.&lt;/div&gt;
