abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies the interface and the behavior of the VHDL-AMS packages for use in modeling statistical behavior. These packages are useful in defining the statistical variation of parameters of electrical, electronic, and mechatronic components and sub-systems. These can then be used with simulation tools to analyze the performance and reliability of systems composed of these components and sub-systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Providing a standard definition of the package interfaces and their behavior is intended to facilitate the exchange of models between component and system manufacturers and the use of different CAE simulation tools.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE statistical package supports the statistical modeling of design parameters subject to tolerances for designs described using the VHDL or VHDL-AMS languages. The performance of a design that uses this package to model parameter tolerances may be analyzed by a Monte Carlo simulation, which consists of multiple simulation runs of the design, each run with a different set of parameter values according to their statistical distributions. The Monte Carlo simulation will yield an estimate of the behavior of the design subject to the parameter tolerances. Additionally, the package may be used to perform an Extreme Value Analysis of a design, that is, an analysis that computes the worst case behavior of the design.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE statistical package does not support other statistical modeling needs, for example the modeling of statistical variations of the arrival of events in a queue, or any other situation where a value exhibits a statistical behavior during a single simulation.&lt;/div&gt;
    &lt;/div&gt;</p>
