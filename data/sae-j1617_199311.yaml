  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The mechanism of automotive body corrosion is scientific, based on established laws of chemistry and physics. Yet there are many opinions related to the cause of body corrosion, not always based on scientific axioms. The purpose of this SAE Information Report is to present a basic understanding of the types of body corrosion, the factors that contribute to body corrosion, the testing procedures, evaluation of corrosion performance, and glossary of related terms.&lt;/div&gt;
    &lt;/div&gt;</p>
