  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This is a joint SAE/EUROCAE development. This document will be released as both an SAE Aerospace Specification (AS) and a EUROCAE Minimum Aviation System Performance Standard (MASPS).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document defines the technical requirements for the safe integration of gaseous hydrogen fueled Proton Exchange Membrane (PEM) Fuel Cell Systems (FCS) within the aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Most of the technical concepts and approaches covered by this document represent current industry "best practice". Others require specific approval from the procuring activity before use. This requirement for approval is not intended to prohibit their use; but rather to ensure that the prime contractor has fully investigated their capability to perform reliably and to be sufficiently durable under the required conditions and that the prime contractor can present substantiating evidence for approval before the design is committed to.&lt;/div&gt;&lt;/div&gt;</p>
