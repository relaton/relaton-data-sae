    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines the minimum performance requirements and test parameters for air cargo unit load devices requiring approval of airworthiness for installation in an approved aircraft cargo compartment and restraint system that complies with the cargo restraint requirements of Title 14 CFR Part 25, except for the 9.0g forward ultimate inertia force of § 25.561 (b)(3)(ii).&lt;/div&gt;

    &lt;/div&gt;</p>
