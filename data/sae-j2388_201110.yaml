    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a uniform procedure for assuring the manufactured quality, installed utility and performance of automotive products to the relocation, alteration, replacement and/or extension of secondary controls and systems other than those provided by the vehicle manufacturer (OEM). These products are intended to provide driving capability to persons with physical disabilities. These products function as adaptive modifications to compensate for lost or reduced function in the extremities of the driver. These include, but are not limited to the following:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Cruise Control; Door Locks; Gear Selector; Hazard Flasher; Headlight Beam Selector; Heater/Vent/Air Conditioner (HVAC); Horn; Ignition/Starter; Light controls; Mirrors; Parking Brake; Power Seats; Turn Signals; Power Window Controls; and Windshield Wiper/Washer and defogger; Rear Accessories (Defogger, Wiper/Washer).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of any secondary control adaptation is to provide the effective use of the motor vehicle operating systems to a driver with a disability, so that he or she may drive and operate that motor vehicle with the same degree of safety as a non-disabled driver. Thus, the adaptive equipment must be (1) accessible to the driver with a disability for whom it is designed, (2) not susceptible to inadvertent operation which may be inconvenient or dangerous for the driver and other users of the roadway, and (3) suitable by non-disabled drivers who may have a need to operate the motor vehicle whenever possible.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For purpose of this document, the secondary controls listed previously have been classified according to the following protocols. The categorization of these controls, while different from other SAE publications, is reflective of the manner in which driver rehabilitation specialists determine appropriate vehicle modifications. These categories are arranged to assign priorities that allow the user to operate a vehicle in the most efficient manner possible.
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Mode A - These controls shall be operable by the driver while the vehicle is in operating mode. They must be accessible to the driver for which they were intended while being able to maintain control of the vehicle steering, brake and accelerator functions. Included in this group are: Cruise control “Set;” Headlight Beam Selector; Horn; Turn Signals; and, Windshield Washer/Momentary Wipe.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Mode B - These controls shall be operable by the driver while maintaining control of the vehicle brake function with the vehicle not in motion, as in the case of vehicle start-up or re-start necessitated by engine stall. Included in this group are: Gear Selector and Ignition/Starter.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Mode C - These controls shall be at least operable by the driver when the vehicle is stationary, either temporarily or parked. Included in this group are: Cruise control “On” and “Off;” Door Locks; Hazard Flashers; Heater/Vent/Air Conditioner (HVAC); Light Controls; Mirrors; Parking Brake; Power Seats; Windshield Wiper; and Power Window Controls; Rear Accessories (Defogger, Wiper/Washer).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;




    &lt;/div&gt;</p>
