  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines the overall requirements applicable to oxygen flow indication as required by Airworthiness Requirements of CS/FAR 25.1449 to show that oxygen is being delivered to the dispensing equipment. Requirements of this document shall be applicable to any type of oxygen system technology and encompass “traditional” pneumatic devices, as well electric/electronic indication.&lt;/div&gt;&lt;/div&gt;</p>
