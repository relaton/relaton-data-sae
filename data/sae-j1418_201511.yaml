abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Standard specifies the dimensional requirement of a range of high pressure pipes for use in the bench testing and setting of fuel injection pumps.  &lt;/p&gt;


    &lt;p&gt;Only dimensions and requirements affecting the hydraulic characteristic of the pipes are defined.  Other requirements, such as the type of end connections and shape of the pipes when bent, are not included.  These depend on the connections provided at pump outlets and injector inlets, and on the design features of individual pumps and test benches.&lt;/p&gt;</p>
