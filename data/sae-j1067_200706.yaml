  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard establishes the minimum construction and performance requirements for seven conductor 1/8-1/10-5/12 cable for use on trucks, trailers and converter dollies. Where appropriate, the standard refers to two types of cables, (Type F and S, described later in the standard), due to the variation in the performance demands of cables used in flexing and stationary applications.&lt;/div&gt;&lt;/div&gt;</p>
