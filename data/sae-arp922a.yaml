  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this ARP is to provide general requirements for application of electroluminescence to Aerospace Vehicle Crew Station Area instruments and control panels. The design brightness and color recommendations stated in this ARP are intended to apply where a crew station has multiple usage of electroluminescence in both instruments and control panels and when different manufacturers may be involved. These recommendations may also be helpful for the design of individually used displays incorporating electroluminescence, however, this light source has extensive design versatility through variance of manufacturing and operating parameters and the numerous acceptable design recommendations will not be stated herein. Electroluminescence will herein be referred to as EL.&lt;/div&gt;&lt;/div&gt;</p>
