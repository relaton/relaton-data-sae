  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method describes a procedure for determining the insoluble contamination level of the downstream side of filter elements. Results of this procedure are intended to be used only for evaluation of the effectiveness of various cleaning treatments, or cleanliness of element as received from manufacturers. The data obtained by this procedure do not necessarily indicate, qualitatively or quantitatively, the contamination which may be released by a filter element into a fluid during service use. Because of the wide variety of conditions which may exist in service applications, it is recommended that the user design and conduct his own particular service performance test. (See paragraph &lt;span class="xref"&gt;10.1&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
