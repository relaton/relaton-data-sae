  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard encompasses the recommended minimum requirements for non-metallic tubing and/or combinations of metallic tubing to non-metallic tubing assemblies manufactured as liquid- and/or vapor-carrying systems designed for use in gasoline, alcohol blends with gasoline, or diesel fuel systems. This SAE Standard is intended to cover tubing assemblies for any portion of a fuel system which operates above −40 °C (−40 °F) and below 115 °C (239 °F), and up to a maximum working gage pressure of 690 kPa (100 psig). The peak intermittent temperature is 115 °C (239 °F). For long-term continuous usage, the temperature shall not exceed 90 °C (194 °F). It should be noted that temperature extremes can affect assemblies in various manners and every effort must be made to determine the operating temperature to which a specific fuel line assembly will be exposed, and design accordingly.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The applicable SAE standards should be referenced when designing liquid-carrying and/or vapor-carrying systems which are described in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Wherever possible or unless stated otherwise, systems tested to this document shall be in the final design intent configuration.&lt;/div&gt;&lt;/div&gt;</p>
