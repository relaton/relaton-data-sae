  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) specifies guidelines for calculating and performing shoring (load spreading) required on board civil transport aircraft whenever a piece of cargo to be carried exceeds the aircraft's maximum allowable limits in area load, running load, or both. It provides both the engineering methods needed to properly design a shoring arrangement, and the main practical dos and donts known from experience to ensure its effectiveness in protecting the aircraft's structure against overload.&lt;/div&gt;&lt;/div&gt;</p>
