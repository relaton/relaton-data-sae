abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This SAE Aerospace Recommended Practice (ARP) establishes
    the general requirements when implementing any of the statistical product acceptance
    methods as defined in ARP9013/1, ARP9013/2, ARP9013/3, and ARP9013/4.  This recommended
    practice also establishes the minimum content required to be covered in an organization's
    documented procedures that govern their application of statistical product acceptance
    methods.  These general requirements and documented procedures apply the requirements
    of AS9100 plus requirements for retrievability, safety/critical characteristics,
    quality parameters, and that these parameters protect the customer.  This recommended
    practice is to be used in conjunction with the variety of sampling strategies,
    statistical techniques, and process control methods of the ARP9013/1 through ARP9013/4
    recommended practices as chosen by the organization.&lt;/p&gt;</p>"
