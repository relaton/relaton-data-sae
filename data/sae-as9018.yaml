    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is applicable to AQMS COs listed in the Online Aerospace Supplier Information System (OASIS) database. This standard is intended for the management and resolution of AQMS CO’s major QMS nonconformities. This standard is not intended to address QMS nonconformities classified as minor or nonconformities related to the products or services provided by the CO.&lt;/div&gt;&lt;/div&gt;</p>
