  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report supplies data on various survivability design approaches and techniques to provide a broad frame of reference for future fluid power designers. Before the designer embarks on the overall system design, a comprehensive understanding of the total hostile environment in which the air vehicle is to operate is mandatory. The overall approach is heavily dependent upon the level of threat, small arms versus medium, or heavy caliber antiaircraft projectiles, missile, single or multiple hit survivability and the projected angle of fire. Overall aircraft stability is a factor which dictates recovery speed from any given failure and limits the magnitude of transient disturbances in the control system. The designer should strive to achieve at a minimum a system which allows high performance type aircraft to obtain a quasi-stable period following total control loss to allow safe ejection of the air crew.&lt;/div&gt;&lt;/div&gt;</p>
