    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the procedure for measuring the sound level of recreational motorboats in the vicinity of a shore bordering any recreational boating area during which time a boat is operating under conditions other than stationary mode operation. It is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances.&lt;/div&gt;
