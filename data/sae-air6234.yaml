  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Handbook is intended to provide useful information on the application of AS5716A. It is for use by System Program Offices, aircraft prime contractors, avionics and store system designers, system integrators and equipment manufacturers and users.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This Handbook was prepared to provide users of the standard of the rationale and principles considered during the development of the standard. It is anticipated that the handbook will serve to assist developers in introducing new technology to achieve compliance with the standard and the underlying principles of the standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is intended that the Handbook be used alongside the standard, as it does not contain significant extracts of the standard.&lt;/div&gt;&lt;/div&gt;</p>
