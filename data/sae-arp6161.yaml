    &lt;div class="htmlview paragraph"&gt;This document is a tool for the certifying authority, cockpit designers, instrument suppliers, lighting suppliers, and component suppliers. It is an aid to understanding and meeting relavant regulatory requirements, particularly those relating to pilot compartment view {CFR 25.773(a)(2)} and instrument lights {25.1381(a)(2)} for glare arising from visible eletromagnetic radiation.&lt;/div&gt;

