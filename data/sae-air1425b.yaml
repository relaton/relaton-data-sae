abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Aerospace Information Report (AIR) is a description of methods to be employed to achieve Electromagnetic Compatibility (EMC) of gas turbine engine accessories. Its primary objectives are to aid those system designers of gas turbine assemblies who are employing commercial accessories, which are not always EMC employing readily available test instrumentation.&lt;/p&gt;
    &lt;p&gt;Electromagnetic Compatibility (EMC) as defined for this AIR is the ability of all engine accessories to perform within their specified capabilities when subjected to an electromagnetic environment generated by adjacent engine accessories.&lt;/p&gt;</p>
