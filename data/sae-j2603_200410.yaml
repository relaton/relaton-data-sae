  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report (IR) establishes a uniform procedure for assuring the manufactured quality, installed utility and performance of automotive powered gas/brake controls other than those provided by the vehicle manufacturer (OEM). These products are intended to provide driving capability to persons with physical disabilities. These products function as adaptive modifications to compensate for lost or reduced function in the extremities of the driver. Powered gas/brake control systems are not only designed to transfer foot functions to the hands or from one side of the body to the other, but to supplement by power, other than by the driver’s own muscular efforts, the force output of the driver. Because this is an Information Report, the numerical values for performance measurements presented in this report and in the accompanying Test Procedure, while based upon the best knowledge available at the time, have not been validated by a testing of the Test Procedure.&lt;/div&gt;


    &lt;/div&gt;</p>
