  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies minimum operation performance requirements for helicopter hoists. This document covers criteria for hoist systems that are intended for use on helicopter platforms for a variety of missions, including but not limited to, search and rescue (SAR) operations, fire control/support, offshore windfarm maintenance, transferring harbor pilots, and power line maintenance. Helicopter hoist minimum performance characteristics are specified for standard and other environmental conditions for the purpose of product qualification. Compliance with this standard is not considered approval for installation on any aircraft.&lt;/div&gt;
    &lt;/div&gt;</p>
