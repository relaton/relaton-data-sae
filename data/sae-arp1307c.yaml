abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Test procedures are described for measuring noise at specific receiver locations (passenger and cargo doors, and servicing positions) and for conducting general noise surveys around aircraft. Procedures are also described for measuring noise level at source locations to facilitate the understanding and interpretation of the data.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Requirements are identified with respect to instrumentation; acoustic and atmospheric environment; data acquisition, reduction and presentation, and such other information as is needed for reporting the results.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document makes no provision for predicting APU or component noise from basic engine characteristics or design parameters, nor for measuring noise of more than one aircraft operating at the same time.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;No attempt is made to suggest acceptable levels of noise or suitable subjective criteria for judging acceptability. ICAO Annex 16 Volume I Attachment C provides guidance on recommended maximum noise levels.&lt;/div&gt;
    &lt;/div&gt;</p>
