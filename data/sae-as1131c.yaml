  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides dimensional, structural and environmental requirements for pallet nets to be used in conjunction with 2.44 m (8 ft) wide pallets described in AS1130. The pallet/net combination are used in freighter versions of certificated aircraft equipped to provide restraint to pallets tested to the requirements of NAS 3610 Class II restraint system. The minimum essential criteria are identified by use of the key word "shall". Recommended criteria are identified by use of the key word "should", and while not mandatory, are considered to be primary importance in providing serviceable, economical, and practical air transport pallet nets. Deviation from recommended criteria should occur only after careful consideration, extensive testing, and thorough service evaluation have shown alternate methods to be satisfactory.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document establishes five sizes of basic pallet nets as follows:&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Size F (10 ft) (NAS 3610-2F1N): To restrain a 2.44 mm × 2.99 m × 3 m (96 in × 117.75 in × 118 in) high (max) load&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Size R (16 ft) (NAS 3610-2R1N): To restrain a 2.44 m × 4.98 m × 3 m (96 in × 196 in × 118 in) high (max) load&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Size G (20 ft) (NAS 3610-2G1N): To restrain a 2.44 m × 6.06 m × 3 m (96 in × 238.5 in × 118 in) high (max) load&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Size H (30 ft) (NAS 3610-2H1N): To restrain a 2.44 m × 9.12 m × 3 m (96 in × 359.25 in × 118 in) high (max) load&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Size J (40 ft) (NAS 3610-2J1N): To restrain a 2.44 m × 12.19 m × 3 m (96 in × 480 in × 118 in) high (max) load&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
