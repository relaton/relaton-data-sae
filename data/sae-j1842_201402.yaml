    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended for hubs and spoke wheels used on Class 6, 7, and 8 truck/truck-tractor non-powered front axles, powered and non-powered rear axles and trailer axles, for which bearing setting is manually adjusted.  Assemblies using spacers to control bearing preload and endplay may differ in geometry and bearing componentry.&lt;/div&gt;
