    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) defines the requirements for a lightweight polytetrafluoroethylene (PTFE) lined, metallic reinforced, hose assembly suitable for use in high temperature, 204 °C, high pressure, 21,000 kPa (210 bar), aircraft hydraulic systems, also for use in pneumatic systems which allow some gaseous diffusion through the PTFE wall.&lt;/div&gt;&lt;/div&gt;</p>
