  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice incorporates dynamometer test procedures that produce riding range estimates for electric motorcycles during stop-and-go urban riding on surface streets and commuting trips in urban areas that include operation on freeways. This is typically done using a “coastdown” approach by disengaging the engine and assuming all losses are aerodynamic. However, with inherent losses in an electric motor, and no way to fully disengage the motor, another approach is to use a “on-road, constant speed” (&lt;span class="xref"&gt;Appendix B&lt;/span&gt;) method for fully electric vehicles to develop dynamometer coefficients.&lt;/div&gt;
    &lt;/div&gt;</p>
