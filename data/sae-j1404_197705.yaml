    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice presents requirements for the structural integrity of the brake system of all new trucks, buses, and combination of vehicles designed for roadway use and falling into the following classifications:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Truck and Bus: Over 10 000 lb (4500 kg) GVWR.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Combination of Vehicles: Towing vehicle over 10 000 lb (4500 kg) GVWR.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements are based on data obtained from SAE Recommended Practice J294.&lt;/div&gt;&lt;/div&gt;</p>
