    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;MIL-STD-1290, 14 CFR 27.952, and 14 CFR 29.952 provide crash resistant fuel system design and test criteria that significantly minimize fuel leaks and occurrence of post-crash fire in survivable impacts. This document does not change and does not authorize changes in or deviations from MIL-Standard or regulatory requirements. This document provides guidance for the design, performance, and test criteria for self-sealing breakaway valves.&lt;/div&gt;&lt;/div&gt;</p>
