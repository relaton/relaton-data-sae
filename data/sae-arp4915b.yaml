    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes a procedure for disposition of landing gear components that have been involved in accidents/incidents. The recommendations in this document apply to components made of ferrous and non-ferrous alloys. The recommendations in this document do not apply to components made of non metallic composite materials.&lt;/div&gt;&lt;/div&gt;</p>
