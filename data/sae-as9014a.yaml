abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These requirements are applicable to IAQG sector schemes when making use of ABs, CRBs and their auditors, for the assessment and certification/registration of supplier quality systems in accordance with the requirements of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The quality management system standard used by the CRB shall be 9100/9110/9120, as appropriate to the supplier’s activities. It shall be applied to the supplier’s complete Quality System that covers aerospace products. Sectors may use these requirements for other standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;IAQG members have committed to recognize the equivalence of certification/registration of a suppliers quality management system to either of the AS, EN or JISQ/SJAC standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;&lt;i&gt;This AS provides the approval process for Auditor Authentication Bodies (AAB), training course providers, trainers and auditors who meet the requirements of AIR5493 and outlines the America’s sector specific process to implement AS9104. This document is created to be in conformance with AS9104.&lt;/i&gt;&lt;/b&gt;&lt;/div&gt;

    &lt;/div&gt;</p>
