  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Part Standard covers selected metric screws, hex bolts, and nuts manufactured in accordance with American Society for Testing and Materials (ASTM) and SAE fastener standards. This document covers fastener materials often used in ship systems and equipment but its use may be applied wherever fasteners of the covered materials are used. This document permits the fasteners to be identified and ordered by a part or identifying number (PIN) as defined in this document.&lt;/div&gt;


    &lt;/div&gt;</p>
