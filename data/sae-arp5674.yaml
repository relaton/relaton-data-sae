  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is intended to be used for laser systems mounted on aircraft and intended for use in the navigable airspace. This does not include lasers onboard aircraft where the beam is contained within an enclosure so that the beam cannot enter into airspace, nor does it include lasers from satellites and spacecraft in outer space. It may be used in conjunction with: AS4970, ARP5535, ARP5572, ARP5293, and the ANSI Z136 laser safety standards.&lt;/div&gt;
    &lt;/div&gt;</p>
