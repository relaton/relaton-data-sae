  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a taxonomy of terms related to local and regional on-demand and shared mobility services (including ground, aviation, and maritime) and their enabling technologies. Functional definitions for shared modes (both fleet sharing and ride services), services, business models, and mobility applications are defined in this SAE Recommended Practice. This SAE Recommended Practice also provides a taxonomy of related terms and definitions. Though public transport is part of shared mobility, it is not included in this SAE Recommended Practice because its definition is well-established and documented. This document does not provide specifications or otherwise impose requirements on on-demand and shared mobility.&lt;/div&gt;&lt;/div&gt;</p>
