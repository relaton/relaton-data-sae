    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard serves as a guide for testing procedures of automotive 12 V storage batteries. The information contained herein was originally developed based on traditional ICE operation but can be more broadly applicable to other vehicle architectures. Although the test procedures contained herein are written from the standpoint of a 12 V nominal battery, they can be scaled for batteries with different nominal voltages.&lt;/div&gt;

    &lt;/div&gt;</p>
