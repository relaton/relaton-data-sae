abstract:
- language: en
  script: Latn
  content: "<p>To provide a method for determining the capability of a wiper seal
    \ used on hydraulic cylinders, to withstand cyclic movement of the sealing surface
    in a contaminated environment and restrict the passage of particulate contaminant
    under conditions of zero side load. To verify whether or not a wiper seal will
    exhibit a given service life in a contaminated environment and maintain its capability
    of restricting the passage of particulate contamination.</p>"
