    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document, the &lt;i&gt;JAUS Compliance and Interoperability Policy&lt;/i&gt; (ARP6012), recommends an approach to documenting the complete interface of an unmanned system or component in regard to the application of the standard set. While non-SAE AS-4 JAUS documents are referenced in this ARP they are not within the scope of this document and should be viewed as examples only.&lt;/div&gt;&lt;/div&gt;</p>
