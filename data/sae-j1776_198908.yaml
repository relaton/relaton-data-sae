    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This HIR provides guidance defining the hydraulic system requirements and for preparing a detailed specification for a pumping component. The user can follow this document to set forth the pump environmental and performance considerations, establish service life and reliability goals, and define specific evaluation tests in order to qualify it for advanced marine vehicle applications.&lt;/div&gt;
