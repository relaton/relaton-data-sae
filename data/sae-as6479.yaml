  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines fiber optic fusion splicers acceptable for the installation and repair of fiber optic interconnects in aerospace applications. Two different application environments are defined, depending on whether there is risk of flammable vapor or hazardous atmosphere being present. Equipment suited to flammable or hazardous environments may be over specified for factory, depot, or other relatively safe environments. To address these different application environments, two types of fusion splicer will be specified in applicable detail specifications:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Type I. For hazardous environments specifically including potentially flammable or explosive atmospheres.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Type II. For environments in which it is established that there is no risk of flammable or explosive vapors being present.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
