  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers complete general and dimensional specifications for refrigeration flare type tube fittings intended for general use with flared annealed copper tubing in refrigeration applications. Also included is an appendix covering the coding system for identification of fittings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The inclusion of dimensional data in this standard is not intended to imply that all of the fittings described are stock production items. Consumers are requested to consult with manufacturers concerning availability.&lt;/div&gt;&lt;/div&gt;</p>
