    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the general requirements for conventional AC and/or DC current carrying filter networks for the reduction of electromagnetic interference. A conventional filter is defined herein as a component containing definitive, lumped, R-L-C components and not employing distributed parameters as a required characteristic.&lt;/div&gt;&lt;/div&gt;</p>
