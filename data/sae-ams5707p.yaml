  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion- and heat-resistant nickel alloy in the form of bars, forgings, flash welded rings. Product covered by this specification is limited to a nominal 3.25 inches (82.6 mm) and under in diameter or maximum cross-sectional dimension between parallel sides (thickness) and stock of any size for forging and for flash welded rings.&lt;/div&gt;&lt;/div&gt;</p>
