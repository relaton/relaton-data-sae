  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard includes worm gear, spur gear, or other positive reduction driven winches. These winches may be driven by any power source within the limits of the manufacturer’s recommendations. Power shall be supplied in both directions for hoisting or lowering. The winches are equipped with safety brakes to hold the load positively or to control it when lowering under power. The winch load may also be powered down against hydraulic flow control devices with the automatic safety brake released.&lt;/div&gt;&lt;/div&gt;</p>
