    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides minimum performance and design standards to be applied to an Aviation Distress Signal, a handheld, high-intensity, stroboscopic light source designed to facilitate location and rescue of aviation accident/ditching survivors by ground, sea or airborne search and rescue resources.&lt;/div&gt;
