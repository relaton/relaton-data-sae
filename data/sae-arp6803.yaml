  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) examines a comprehensive construct of an Integrated Vehicle Health Management (IVHM) capability. This document provides a top-level view of the concepts, technology, and implementation practices associated with IVHM. This keystone document of the SAE HM-1 Committee is not intended as a legal document and does not provide detailed implementation steps, but does address general implementation concerns and potential benefits. &lt;span class="xref"&gt;Figure 1&lt;/span&gt; provides a document flow map of the documents currently in work or planned by the Committee. The documents shown below will provide the recommended practices for IVHM implementation. This document map reflects the current SAE IVHM document configuration as of the date of publication. Future documents that are released will be included in the flow map in future updates of this document.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;An indication of the scope of IVHM is diagrammed in &lt;span class="xref"&gt;Figure 2&lt;/span&gt;. When an organization decides to implement an IVHM capability as part of their product sustainment strategy, the decision must consider the business objectives and user perspectives driving the decision, the system architecture and design to support the impetus, the Technology Readiness Level (TRL) or maturity of the technologies involved, the unique aspects of the operational environment and infrastructure, and the tools required to support the IVHM life cycle. This document discusses significant aspects and considerations of the interrelated IVHM elements listed in this diagram.&lt;/div&gt;

    &lt;/div&gt;</p>
