  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the general requirements for crimping tools, accessories and inspection gages used for connecting removable contacts (such as; signal, power, coaxial, shielded, thermocouple, and filter pin contacts) coaxial connectors, shielded connectors, ferrules, terminals, end caps and splices to wire conductors for use in electric connectors, terminal junction systems, and other electric or electronic components.&lt;/div&gt;&lt;/div&gt;</p>
