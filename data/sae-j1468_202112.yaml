  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is applicable to oil-to-air and oil-to-coolant oil coolers installed on mobile or stationary equipment and provides a glossary of oil cooler nomenclature. Such oil coolers may be used for the purpose of cooling automatic transmission fluid, hydraulic system oil, retarder system fluid, engine oil, etc. This document outlines the methods of procuring the test data to determine the operating characteristics of the oil cooling system and the interpretation of the results.&lt;/div&gt;
    &lt;/div&gt;</p>
