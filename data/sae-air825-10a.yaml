  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides general information to aircraft engineers, regarding the types of Protective Breathing Equipment (PBE) configurations which are available, the intended functions of such equipment, and the technical approaches which may be used in accomplishing these functions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The term "PBE" or "Protective Breathing Equipment" has been used to refer to various types of equipment, which are used in a variety of applications. This way of using the terminology has been a source of confusion in the aviation industry. One objective of this AIR is to assist the reader in distinguishing between the types of PBE applications. A further objective is to assist in understanding the technical approaches which can be used in each of the major applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Principles of PBE design are reviewed briefly. However, discussion of specific performance specifications and information regarding the details of manufacture and testing of such equipment is beyond the scope of this document.&lt;/div&gt;&lt;/div&gt;</p>
