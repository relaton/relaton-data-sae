  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Differences, where they exist, are shown in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the dimensional features of S, G, D, and DV oil control piston ring types.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The normal range for the axial width of oil control rings (2.5 to 8 mm inclusive) is divided into 0.5 or 1.0 increments. In &lt;span class="xref"&gt;Table 7&lt;/span&gt;, dimensions in inch units are given for oil control rings with axial width 4.75 mm (equal to 3/16 in) for existing applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this document apply to oil control rings for reciprocating internal combustion piston engines up to and including 200 mm in diameter. They may also be used for piston rings of compressors working under similar conditions.&lt;/div&gt;&lt;/div&gt;</p>
