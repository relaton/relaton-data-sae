  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Technical Information Report (TIR) will review the global industry battery size standards for xEV vehicles to provide guidance on available cell sizes for engineers developing battery powered vehicles. The TIR will include a review of the sizes and standards that are currently being developed or used for cylindrical cells, pouch (or polymer) cells, and for prismatic can cells. The lithium-ion cell will be the focus of this survey, but module and pack level size standards, where available, will also be included.&lt;/div&gt;

    &lt;/div&gt;</p>
