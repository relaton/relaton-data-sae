  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the measurement of impulsive electromagnetic radiation over the frequency range of 20–1000 MHz from a vehicle or other device powered by an internal combustion engine or electric motor. Operation of all engines (main and auxiliary) on a vehicle or other device is included. All equipment normally operating when the engine is running is also included, except operator-controlled equipment, which is excluded. The recommended limit applies only to complete vehicles or devices in their final manufactured form. Vehicle mounted rectifiers used for battery charging in electric vehicles are included in this specification when operated in their charging mode.&lt;/div&gt;&lt;/div&gt;</p>
