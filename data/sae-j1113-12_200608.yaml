  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes a common basis for the evaluation of devices and equipment in vehicles against transient transmission by coupling via lines other than the power supply lines. The test demonstrates the immunity of the instrument, device, or equipment to coupled fast transient disturbances, such as those caused by switching of inductive loads, relay contact bouncing, etc. Four test methods are presented – Capacitive Coupling Clamp, Chattering Relay, Direct Capacitor Coupling, and Inductive Coupling Clamp.&lt;/div&gt;
    &lt;/div&gt;</p>
