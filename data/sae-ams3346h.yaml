    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a phenyl vinyl silicone rubber material that can be used to manufacture product in the form of sheet, strip, tubing, molded shapes, and extrusions. This specification should not be used for molded rings, compression seals, O-ring cord, and molded in place gaskets for aeronautical and aerospace applications without complete consideration of the end use prior to the selection of this material.&lt;/div&gt;&lt;/div&gt;</p>
