  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to provide equipment specifications for CFC-12 (R-12) recovery for return to a refrigerant reclamation facility that will process it to the appropriate ARI Standard (Air Conditioning and Refrigerant Institute) or allow for recycling of the recovered refrigerant in equipment that is certified to meet the requirements of SAE J1991. Under the existing rule, the U.S. EPA requires refrigerant removed from a mobile air-conditioning (A/C) system using recovery equipment certified to meet SAE J2209 can only be recycled using equipment meeting SAE J1991 that is owned by the same company or individual.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not acceptable that the refrigerant removed from a mobile A/C system, with this equipment, be directly returned to a mobile A/C system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This information applies to equipment used to service automobiles, light trucks, and other vehicles with similar CFC-12 (R-12) systems.&lt;/div&gt;&lt;/div&gt;</p>
