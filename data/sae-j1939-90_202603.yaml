  content: "<p>&lt;p&gt;This Information Report is intended to supplement the J1939 documents by offering the application of SAE RP J1939 to OBD data communications in a form that can be sorted and searched for easier use. It is NOT intended as a substitute for the actual regulations and standards documents, and any discrepancies between this document and the published  documents must be resolved in favor of the published documents.  Regulatory Version(s):  CARB 1971.1 OCTOBER 3, 2019 ; CARB 1968.2 OCTOBER 3, 2019; “CALIFORNIA GREENHOUSE GAS EXHAUST EMISSION STANDARDS AND TEST PROCEDURES FOR 2014 AND SUBSEQUENT MODEL HEAVY-DUTY VEHICLES” As Amended: September 9, 2021; “CALIFORNIA STANDARDS AND TEST PROCEDURES FOR NEW 2021 AND SUBSEQUENT MODEL HEAVY-DUTY ZERO-EMISSION POWERTRAINS.”  As Adopted: June 27, 2019; EPA 40 CFR Part 1036 Subpart B (up to date as of 10/10/2024)&lt;/p&gt;</p>"
