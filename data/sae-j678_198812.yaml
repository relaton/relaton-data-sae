  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to speedometers, odometers, and speedometer drives typical of passenger vehicles, buses, and trucks used for personal or commercial purposes. The method of determining wheel revolutions per unit distance (&lt;span class="xref"&gt;3.1&lt;/span&gt;) and overall system design variation (&lt;span class="xref"&gt;3.3.3&lt;/span&gt;) are applicable to passenger cars only. Comparable recommendations for trucks and buses are under development. The data of tachometers is applicable to vehicular use, as previously described, and also to stationary and marine engines and special vehicles.&lt;/div&gt;&lt;/div&gt;</p>
