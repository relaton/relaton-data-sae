  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Automotive and railroad diesel fuels, in general, are derived from petroleum refinery products which are commonly referred to as middle distillates. Middle distillates represent products which have a higher boiling range than gasoline and are obtained from fractional distillation of the crude oil or from streams from other refining processes. Finished diesel fuels represent blends of middle distillates.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The properties of commercial distillate diesel fuels depend on the refinery practices employed and the nature of the crude oils from which they are derived. Thus, they may differ both with and within the region in which they are manufactured. Such fuels generally boil over a range between 163 and 371 °C (325 to 700 °F). Their makeup can represent various combinations of volatility, ignition quality, viscosity, sulfur level, gravity, and other characteristics. Additives may be used to impart special properties to the finished diesel fuel.&lt;/div&gt;&lt;/div&gt;</p>
