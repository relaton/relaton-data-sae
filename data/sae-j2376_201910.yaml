    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the various types of information required by the collision repair industry to properly restore light-duty, highway vehicles to their pre-accident condition. Procedures and specifications are defined for damage-related repairs to body, mechanical, electrical, steering, suspension, and safety systems. The distribution method and publication timeliness are also considered.&lt;/div&gt;
