    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidelines for the format and content of documents defining the interface between electronic propulsion control systems and aircraft systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The scope includes civilian aircraft powered by turbofan, turboprop, and turboshaft engines equipped with electronic engine controls.&lt;/div&gt;&lt;/div&gt;</p>
