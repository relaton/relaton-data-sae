  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE ARP provides guidance for (1) ensuring passenger suitability for being seated in an exit row and (2) the standardization of safety briefings for passengers, seated at exits, who may be responsible for opening exits on transport airplanes during an emergency. This recommendation is primarily for briefing passengers seated in the Type III overwing exit row, but may be applied to briefing passengers responsible for other exit types. In addition, these recommendations pertain to briefings on airplanes on which the flight attendants would conduct the exit row briefing, &lt;i&gt;and&lt;/i&gt; to briefings on airplanes without flight attendants, on which pilots would conduct the briefing.&lt;/div&gt;&lt;/div&gt;</p>
