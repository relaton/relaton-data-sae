abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This document is an extension of the current B92.1 standard. It does not supersede the B92.1 standard. All splines currently meeting the requirements of the B92.1 standard are still in compliance with that standard. A table of the variables and the formula that calculates its value is included. Splines conforming to B92.1 will mate with splines conforming to B92.1b. Splines conforming to B92.1 shall be used unless B92.1b is specified or otherwise agreed to by the purchaser and the supplier. This addendum does not apply to major diameter fit splines.&lt;/p&gt;
    &lt;p&gt;Units of Measurement&lt;/p&gt;
    &lt;p&gt;Linear dimensions are expressed in inches, and angular dimensions are expressed in degrees.&lt;/p&gt;</p>
