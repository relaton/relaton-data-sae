  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide considerations, guidelines, and best practices for extracting knowledge from long-term archival data. The document is intended to cover the data generated across all life cycle stages of an aircraft starting from concept to disposal. This document does not standardize the process, nor does it allow regulatory authorities to recognize the document as an acceptable means of compliance. It is only a guideline document to discover, capture, store, retrieve, process, and consume knowledge.&lt;/div&gt;


    &lt;/div&gt;</p>
