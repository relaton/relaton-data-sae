  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes design, manufacturing performance and test requirements for linear mechanical actuators intended to be used for linear motion applications in response to manual or automatic power control system inputs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is applicable, but not confined to, ball screws, sliding contact screws, roller screws, helical splines, rack and pinion assemblies, and skewed roller actuators.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is a reference for preparing detail specifications for mechanical actuators compatible and applicable to military or commercial aircraft systems.&lt;/div&gt;&lt;/div&gt;</p>
