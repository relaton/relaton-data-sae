    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the various scuffing failure modes of the power cylinder system in an internal combustion engine. The causes and preventative measures for each failure mode are discussed. It should be noted that many remedies for scuff can lead to NVH (noise vibration and harshness) issues. However, NVH is not considered in this document.&lt;/div&gt;
    &lt;/div&gt;</p>
