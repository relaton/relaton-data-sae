  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This guide provides detailed information, guidance, and methods related to the Federal Aviation Administration Advisory Circular (AC)/Joint Airworthiness Authorities Advisory Material Joint (AMJ) 20-XXX, "Certification of Aircraft Electrical/Electronic Systems for Operation in the High Intensity Radiated Fields (HIRF) Environment" (draft). The AC/AMJ provides acceptable means, but not the only means, of compliance with Parts 23, 25, 27, and 29 of the Federal Aviation Regulations (FAR)/Joint Aviation Regulations (JAR) to prevent hazards to aircraft electrical and electronic systems due to HIRF produced by external transmitters.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This guide is neither mandatory nor regulatory in nature and does not constitute a regulation or legal interpretation of the regulation. The information in this guide represents a collection of best engineering practices that have been used to certify aircraft HIRF protection. An applicant may elect to establish an alternative method of compliance that is acceptable to the Federal Aviation Administration (FAA) or Joint Aviation Authorities (JAA).&lt;/div&gt;

    &lt;/div&gt;</p>
