  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Recent field experience has indicated significant problems with some types of wire and cables as routed on aircraft landing gear. This SAE Aerospace Information Report (AIR) is intended to identify environmental concerns the designer should consider, materials that appear to be most suitable for use in these areas, routing, clamping, and other protection techniques that are appropriate in these applications. In recent years aircraft certification regulatory agencies introduced new regulations regarding Electrical Wiring Interconnection Systems (EWIS) to further enhance safety of the associated systems and aircraft overall.&lt;/div&gt;
    &lt;/div&gt;</p>
