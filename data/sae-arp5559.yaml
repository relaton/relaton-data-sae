  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This equipment specification covers requirements for airfield liquid anti-icing/deicing equipment for airfield snow removal purposes. The unit shall include a combination of a carrier vehicle, liquid product tank, and dispensing system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This vehicle as a unit shall be an integrated chemical dispensing deicing/anti-icing application system. Primary application is for the liquid chemical application for cleaning of ice and snow from airfield operational areas such as runways, taxiways, and ramp aprons.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The term “carrier vehicle” represents the various self-propelled prime movers that provide the motive power necessary to move snow and ice control equipment during winter operations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The airport operator may require this specified piece of equipment in order to maintain the airfield during large and small snow events. When necessary, the airfield liquid anti-icing/deicing chemical applicator (ALAD) shall be a central and critical element in the winter pavement maintenance fleet in the effort to accomplish the airport’s published snow plan.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP defines the minimum functionality for a vehicle to be classified as an ALAD specifically as an integrated snow and ice removal system capable of performing multiple and simultaneous functions requiring no more than one operator. ALADs may be utilized to perform additional pavement maintenance tasks such as deicing or anti-icing, rubber removal, or others. If additional features are required, they must be defined by the airport operator as part of their ALAD specification. The airport operator may add to or delete from any item of this specification to meet its requirements providing there is no compromise in safety.&lt;/div&gt;&lt;/div&gt;</p>
