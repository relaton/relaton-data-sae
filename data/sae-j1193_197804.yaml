  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice applies to hydraulic excavators as defined in SAE J1057.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This recommended practice includes the nomenclature peculiar to and most commonly used to describe this type of equipment. The illustrations are not intended to be descriptive of any existing machine and are used only to clarify the meaning of this recommended practice.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The numbered terms are nomenclature and apply to &lt;span class="xref"&gt;Figs. 1&lt;/span&gt;-&lt;span class="xref"&gt;6&lt;/span&gt; as applicable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The single letter dimensions apply to &lt;span class="xref"&gt;Figs. 1&lt;/span&gt;, &lt;span class="xref"&gt;2&lt;/span&gt;, and &lt;span class="xref"&gt;3&lt;/span&gt; and are primarily to define vehicle size.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The double letter dimensions apply to &lt;span class="xref"&gt;Figs. 4&lt;/span&gt;, &lt;span class="xref"&gt;5&lt;/span&gt;, and &lt;span class="xref"&gt;6&lt;/span&gt; which illustrate the functional range of the common types of hydraulic excavators.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For dimensions relative to turning radius of rubber tired vehicles, refer to SAE J695.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All dimensions are based on machines setting on a groundline that provides firm level support. Rubber tired vehicles are on manufacturers specified tires inflated to specified pressure, crawler track shoes do not penetrate groundline.&lt;/div&gt;








    &lt;/div&gt;</p>
