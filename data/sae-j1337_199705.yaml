  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report covers the important fundamental maintenance and service precautions for all off-road single-piece and multi-piece rims. Detailed information on specific procedures concerning mounting, demounting, maintenance and service of a particular type, style, or design of off-road rim assembly can be obtained by consulting rim or tire manufacturers or distributors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recommended that these procedures and service precautions are considered in preparation of the machine service manual and operator's manual.&lt;/div&gt;&lt;/div&gt;</p>
