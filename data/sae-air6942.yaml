  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document outlines the current state of the art in the understanding of gas in solution in shock absorber oils (hydraulic fluid, referred to hereafter as oil or fluid [refer to AIR5358B]) in unseparated shock absorbers. A literature review, overview of Henry’s law, Henry’s law coefficients for known gas and oil couples, in-service operational problems, lessons learned, and potential future work are discussed in the document.&lt;/div&gt;&lt;/div&gt;</p>
