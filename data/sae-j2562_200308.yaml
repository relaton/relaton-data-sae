    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform laboratory procedures for biaxial fatigue testing of wheels intended for normal highway use and temporary use on passenger car vehicles. The appendix provides a scaleable load file that is applicable to ballasted passenger cars. Load files for unballasted passenger cars and light trucks will be added to this document.&lt;/div&gt;&lt;/div&gt;</p>
