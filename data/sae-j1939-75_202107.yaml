  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1939-75 defines the set of data parameters (SPs) and messages (PGs) for information predominantly associated with monitoring and control generators and driven equipment in electric power generation and industrial applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The data parameters (SPs) and messages (PGs) previously published within this document are published in SAE J1939DA. Applications using the SAE J1939-75 document must refer to SAE J1939DA for the SAE J1939 parameters and messages for monitoring and controlling the power units, e.g., engines and turbines, that power the generators and driven industrial equipment.&lt;/div&gt;&lt;/div&gt;</p>
