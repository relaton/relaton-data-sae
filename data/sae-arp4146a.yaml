  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) specifically discusses five configurations of flexible tubing. The design data given will aid in design of coiled tube assemblies using Ti-3Al-2.5V cold worked, stress relieved (CWSR) tubing per AMS 4945. The configurations discussed should be compatible with pressure levels up to 8000 psi (55.2 MPa) upon completion of analysis for the actual stress and life requirement of the intended application. Formal qualification tests are recommended to verify satisfactory installation, clamping, and life of each unique design.&lt;/div&gt;
    &lt;/div&gt;</p>
