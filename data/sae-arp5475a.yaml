  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidelines for abuse load testing of a deployable Individual Video System (IVS).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The abuse load testing defined in this ARP is intended to only address the evaluation of the deployable IVS regarding stowage of the system and injurious projections/protrusions as a result of passenger interaction with the video system. Other aspects of the video system design or qualification may require additional testing or analysis and are outside the scope of this ARP.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP is not intended to address customer satisfaction or reliability aspects of individual designs.&lt;/div&gt;
    &lt;/div&gt;</p>
