  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AS defines maximum free opening dimensions for airframe refueling ports on civil aircraft that require the exclusive use of aviation gasolines, and minimum free opening dimensions for airframe refueling ports on civil aircraft that operate with turbine fuels as a primary fuel type.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In addition, this document defines the minimum refueling nozzle tip dimensions for turbine fuels ground service equipment, and the maximum refueling nozzle tip diameter dimension for aviation gasolines ground service equipment.&lt;/div&gt;&lt;/div&gt;</p>
