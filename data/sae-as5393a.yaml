  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Blade trackers measure: (a) rotor blade height and (b) lead-lag for use in a Rotor Track and Balance (RT&amp;amp;B) function in a Health and Usage Monitoring System (HUMS). HUMS is a generic term for a system used to measure, monitor, process, and store information relating to the functioning and usage of an aircraft's on-board primary systems, including the engine(s).&lt;/div&gt;

    &lt;/div&gt;</p>
