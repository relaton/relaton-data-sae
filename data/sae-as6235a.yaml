abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies standardized gland design criteria and dimensions for static face seals for internal pressure and external pressure applications for aerospace hydraulic and pneumatic applications using the same size range as AS4716 and AS5857 where applicable. Some small diameter sizes are excluded because they are not practical.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The glands have been specifically designed for applications using AS568 size elastomeric O-rings with related Class 2 tolerances at nominal system operating pressures up to 3,000 psi (20,680 kPa) utilizing no anti-extrusion (backup) rings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While the gland dimensions herein have been designed for pressures up to 3,000 psi (20,680 kPa) these glands may be used for higher pressures, but extra precautions need to be taken and testing should be performed to ensure integrity of performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification covers the basic design criteria and recommendations for use with standard size elastomeric O-rings, however, these glands are also suitable for use with other elastomeric and polytetrafluoroethylene (PTFE) based seal geometries.&lt;/div&gt;&lt;/div&gt;</p>
