  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method provides performance data on candidate insulation systems as a function of time and temperature. These data give engineering information on the wire insulation candidate relative to the performance of materials already in use with a backlog of experience. These tests expose candidate insulation systems to a wide range of temperatures for short and long periods of time, while measuring the degradation of its physical properties. For aerospace use, end-point proof tests include mandrel bend, water soak, and dielectric integrity.&lt;/div&gt;&lt;/div&gt;</p>
