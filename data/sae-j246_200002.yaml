  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers complete general and dimensional specifications for tube fittings of the spherical and flanged sleeve compression types for use in the piping of air brake systems on automotive vehicles. The spherical sleeve compression type &lt;span class="xref"&gt;Figures 1A&lt;/span&gt; to &lt;span class="xref"&gt;5&lt;/span&gt; and &lt;span class="xref"&gt;Tables 1&lt;/span&gt; to &lt;span class="xref"&gt;3&lt;/span&gt; is intended for use with annealed copper alloy tubing per SAE J1149, Type 1. The flanged sleeve compression type &lt;span class="xref"&gt;Figures 6A&lt;/span&gt; to &lt;span class="xref"&gt;11&lt;/span&gt; and &lt;span class="xref"&gt;Tables 4&lt;/span&gt; to &lt;span class="xref"&gt;6&lt;/span&gt; is intended for use with nylon tubing per SAE J844. It is not intended to restrict or preclude other designs of a tube fitting for use with SAE J844, air brake tubing. Performance requirements for SAE J844 are covered in SAE J1131. See SAE J1131 for the Performance Requirements of Reusable (Push to Connect) Fittings Intended for Use in Automotive Air Brake Systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;CAUTION—To assure satisfactory performance, tapered sleeve compression type fitting components (SAE J512) should not be intermixed with the spherical or flanged sleeve components, nor should the spherical sleeve compression type components be intermixed with the flanged sleeve compression type components when assembling connection in areas where the three types are available.&lt;/div&gt;&lt;/div&gt;</p>
