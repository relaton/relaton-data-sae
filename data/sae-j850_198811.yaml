  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Barrier collisions represent the most severe type of automotive impacts. Deceleration conditions during barrier collisions are more readily reproducible than those occurring during other types of impacts. Barrier collision tests are conducted on automotive vehicles to obtain information of value in reducing occupant injuries and in evaluating structural integrity. The purpose of this SAE Recommended Practice is to establish sufficient standardization of barrier collision methods that results of tests conducted at different facilities may be compared.&lt;/div&gt;&lt;/div&gt;</p>
