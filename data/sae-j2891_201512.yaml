    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the design and application of a 120 VAC single phase engine based auxiliary power unit or GENSET. This document is intended to provide design direction for the single phase nominal 120 VAC as it interfaces within the truck architecture providing power to truck sleeper cab hotel loads so that they may operate with the main propulsion engine turned off.&lt;/div&gt;
    &lt;/div&gt;</p>
