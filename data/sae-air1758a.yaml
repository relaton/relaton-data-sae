  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This information report provides guidance when the ISO International metric tolerance system for limits and fits per ISO/R286 or ANSI B4.2-1978 is applied on a standard, and also provides a selected series of limits and fits for powerplant construction suitable for holes and shafts up to 500 mm. For holes or shafts over 500 mm or for limits and fits not shown, ISO/R286 should be consulted.&lt;/div&gt;&lt;/div&gt;</p>
