    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Status programs are neither preliminary design nor specification programs (as covered by SAE Standard AS 681C) but represent an additional category: They are intended to provide the best estimate of performance for an engine or group of engines at the time of program preparation and will normally include greater test experience than a specification program.&lt;/div&gt;&lt;/div&gt;</p>
