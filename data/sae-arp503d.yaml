    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP provides criteria for design and location of power supplies, controls, light fixtures, and associated equipment which are used to provide emergency illumination in transport aircraft, designed to FAR 25 for operation under FAR 91 and FAR 121.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not the purpose of ARP to specify design methods to be followed in the accomplishment of the stated objectives.&lt;/div&gt;&lt;/div&gt;</p>
