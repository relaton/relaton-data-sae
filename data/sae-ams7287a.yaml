  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a high temperature, compression set, and fluid resistant fluorocarbon (FKM) elastomer in the form of molded O-rings, molded compression seals, molded O-ring cord, and molded-in-place gaskets for aeronautical and aerospace applications. For sheet, strip, tubing, extrusions, and molded shapes, use the AMS3384 specification.&lt;/div&gt;&lt;/div&gt;</p>
