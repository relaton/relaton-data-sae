  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers all metal, self-locking wrenching nuts, plate nuts, shank nuts, and gang channel nuts made of a corrosion and heat resistant nickel-base alloy of the type identified under the Unified Numbering System as UNS N07001. Axial tensile strength 180 000 psi at room temperature. Maximum test temperature of parts is 1400 °F.&lt;/div&gt;&lt;/div&gt;</p>
