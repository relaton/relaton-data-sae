  content: |-
    <p>&lt;p&gt;Enhanced License and UML Model for Data Dictionary for Quantities Used in Cyber Physical Systems (AS6969) allowing for greater usage as outlined in the terms of the Enhanced License.&lt;/p&gt;


    &lt;p&gt;&lt;a href="https://www.sae.org/standards/content/as6969a/"&gt; Data Dictionary for Quantities Used in Cyber Physical Systems (AS6969A)&lt;/a&gt; This data dictionary provides definitions for quantities commonly used in the command and control of cyber physical systems. It defines mathematical and logical terms, quantities, measurement units, reference systems, measurands, and measurements. It also defines common quantity modalities. The dictionary is structured to be convenient to data modelers. It is also extendable so that users can create their own quantity domains.&lt;/p&gt;</p>
