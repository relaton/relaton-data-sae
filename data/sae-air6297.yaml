  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a method to calculate noise level adjustments at locations behind an airplane (described by an angular offset or directivity) at the start of takeoff roll (SOTR). This method is derived from empirical data from jet aircraft (circa 2004), most of which are configured with wing-mounted engines with high by-pass ratios (Lau, et al., 2012). Methods are also described which apply to modern turboprop aricraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Calculations of other propagation-related adjustments required for aircraft noise prediction models are described in AIR1845A, ARP5534, ARP866A, and AIR5662.&lt;/div&gt;&lt;/div&gt;</p>
