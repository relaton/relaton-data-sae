    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines procedures for testing aircraft engine fuel pumps for the purpose of determining their resistance to deterioration, during steady state endurance test, while receiving MIL-T-5624 Grade JP-4 fuel as a homogenous mixture of gas and liquid expressed as a ratio of vapor volume to liquid volume (V/L).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;If any of the above conditions do not apply, refer to &lt;span class="xref"&gt;Section 2&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
