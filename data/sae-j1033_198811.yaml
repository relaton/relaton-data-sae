    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice applies to any internal combustion engine which can utilize SAE No. 6 thru SAE No. 00 size flywheel housing. It provides instructions for correcting flywheel housing bore runout readings which are influenced by crankshaft bearing clearance. Limits for bore and face runout are specified in the various SAE Standards and Recommended Practices covering flywheels and flywheel housings.&lt;/div&gt;&lt;/div&gt;</p>
