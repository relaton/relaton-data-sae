  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) outlines a recommended procedure for evaluation of the vibration environment to which the gas turbine engine powerplant is subjected in the helicopter installation. This analysis of engine vibration is normally demonstrated on a one-time basis upon initial certification, or after a major modification, of an engine/helicopter configuration.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR deals with linear vibration as measured on the basic case structure of the engine and not, for example, torsional vibration in drive shafting or vibration of a component within the engine such as a compressor or turbine airfoil.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In summary, this AIR discusses the engine manufacturer’s "Installation Test Code" aspects of engine vibration and proposes an appropriate measurement method.&lt;/div&gt;&lt;/div&gt;</p>
