  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides recommendations concerning the minimum knowledge and analytical skill guidelines for a composite and metal bond repair design engineer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Teaching levels have been assigned to this curriculum to define the knowledge, skills and abilities needed to design appropriate repairs. Minimum hours of instruction have been provided to ensure adequate lecture and laboratory coverage of all subject matter. These minimums may be exceeded, and may include an increase in the total number of training hours and/or increases in the teaching levels.&lt;/div&gt;&lt;/div&gt;</p>
