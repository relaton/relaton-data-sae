  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) presents preferred practices for sealing and repairing integral fuel tanks. It addresses several basic fuel tank designs as they are currently found in practice and discusses the most practical and conservative methods for producing a reliable, sealed system. Design preferences for optimum sealing are not within the scope of this document. Such discussions can be found in the Air Force sponsored handbook entitled &lt;u&gt;Aircraft Integral Fuel Tank Design Handbook&lt;/u&gt;, AFWAL-TR-87-3078.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The basic goal in sealing an integral fuel tank is to produce a system that is leak-free for the long term under the environmental and operational conditions expected. Factors that can influence the outcome are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;How well the basic design lends itself to good sealing (accessibility; minimal movement; other design factors)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The choice of sealant; where it is applied; how it is applied&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;How well the substrate surface is prepared&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Whether the thickness and contour of sealant fillets and coatings are optimum for the configuration and flight dynamics&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The degree of resistance of the sealant to the fluid and thermal environment&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The degree of "insurance" employed (adhesion promoters, top coats over sealants, etc.)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Sealing the tank is a prime consideration. Sealant fillets inside the tanks are considered to be primary seals. Of nearly equal importance is corrosion control. Sealants are used for both, but the purpose of use should never be confused. It is generally accepted, for example, that a major purpose of faying-surface sealing is corrosion control. The faying-surface seal is not considered to be a primary seal except in adhesively sealed systems. It indeed plays an extremely important role as a secondary seal. It limits the length of a leak path and is a permanent, stable, and essentially dislodgeable, protected seal sandwiched between two surfaces. Extensive use is highly recommended.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Sealing philosophies differ within industry and government. There is, however, far more agreement than dispute. Where serious differences in philosophy prevail, they will be noted. If a particular approach appears to be clearly more protective, keeping time and costs in mind, it will be identified as a preferred method.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is a distillation of the considered opinions of a broad cross-section of experts in the private and public sector. The user is free to consider the options and plot his individual course from, perhaps, a somewhat more informed position.&lt;/div&gt;&lt;/div&gt;</p>
