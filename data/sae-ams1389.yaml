  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers polythioether rubber fuel resistant sealing compounds, supplied as a two-component system, which cure rapidly when exposed to a cure on demand (CoD) light source used to initiate a reaction that generates crosslinking of sealant polymers. Type 2 compounds also cure at ambient conditions, without light exposure.&lt;/div&gt;&lt;/div&gt;</p>
