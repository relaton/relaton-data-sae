  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is applicable to civil aerospace airframe structural applications where stakeholders are seeking guidance on the definition, development, and certification of structural health monitoring (SHM) technologies for aircraft health management applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Inputs to the structural health management are obtained from SHM equipment and/or from onboard sensors, delivering the detection and characterization of damage, load, or environmental parameters for operational and damage monitoring.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For the purpose of this document, SHM is defined as “the process of acquiring and analyzing data from on-board sensors to characterize the health of a structure.” The suite of on-board sensors could include any presently installed aircraft sensors, as well as new sensors to be defined in the future.&lt;/div&gt;


    &lt;/div&gt;</p>
