  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for a V-band grooved clamp couplings that are intended for use on fluid-line tubing joints, tailpipe joints, and accessory mount joints, on flight vehicles or other attachments. The semi-rigid coupling joint assemblies, hereafter referred to as “the joint”, shall operate within the temperature range of −65 to +1200 °F.&lt;/div&gt;&lt;/div&gt;</p>
