  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This performance standard specifies a universal method of measuring the dimensional change of friction materials to determine the effects of temperature. The test applies to both, disc and drum type linings commonly used in hydraulic and air brake systems for automotive or commercial vehicle applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard describes two main test procedures. Method A, where the friction material is in contact with a heated surface to simulate the heat input to the pad that occurs during actual usage. Method B uses an oven to heat the freestanding material and is an approximate procedure requiring less instrumentation. Method A is recommended for disc brake pad assemblies, noise insulators, or flat coupons; while Method B is recommended for curved drum brake linings.&lt;/div&gt;
    &lt;/div&gt;</p>
