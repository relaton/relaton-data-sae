    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended to serve as a guide for the collection of physical, mechanical, and thermal properties of fiber-reinforced polymer composite materials for automotive structural applications. This document attempts to utilize test methods applicable to the widest range of structural materials and processes without compromising the integrity of the data being sought. A summary of the material characterization is shown in &lt;span class="xref"&gt;Section 15&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
