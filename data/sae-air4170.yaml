  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the initial development, evolution, and use of reticulated polyurethane foam as an explosion suppression material in fuel tanks and dry bays. It provides historical data, design practice guidelines, references, laboratory test data, and service data gained from past experience.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The products discussed in this document may be referred to as "Safety Foam," "Reticulated Polyurethane Foam," "Baffle and Inerting Material," "Electrostatic Suppression Material," or "SAFOAM." These generic terms for the products discussed in this document are not meant to imply any safety warranty. Each individual design application should be thoroughly proof tested prior to production installation.&lt;/div&gt;&lt;/div&gt;</p>
