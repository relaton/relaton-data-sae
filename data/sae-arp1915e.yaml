  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) specifies dimensional and physical requirements of tow bar connections to tractor and aircraft (see &lt;span class="xref"&gt;Figure 1&lt;/span&gt;). It is applicable to all types of commercial transport category aircraft tow bar.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to standardize tow bar attachments to airplane and tractor according to the mass category of the towed aircraft, so that one tow bar head with different shear levels can be used for all aircraft that are within the same mass category and are manufactured in compliance with AS1614 or ISO 8267.&lt;/div&gt;
    &lt;/div&gt;</p>
