    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This guide is intended to cover specifications applicable to MAP transducers. It is also applicable to transducers such as Barometric (Ambient) Absolute Pressure transducers, Manifold Vacuum transducers, and similar pressure transducers used in automotive systems. Although this guide is oriented towards active devices (those using internal signal conditioning), it can be applied to passive devices with minor modifications.&lt;/div&gt;
