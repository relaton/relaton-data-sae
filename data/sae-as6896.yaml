  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to provide a standard for aircraft fuselage markings located at the doors used for ground servicing operations. These markings can be used by all GSE that will dock at the aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These markings may be used for one or several phases of the GSE positioning relative to the aircraft process: GSE alignment during approach, GSE final docking, and GSE auto leveling.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not the purpose of this standard to describe the different technologies, cameras, or other equipment that can be mounted on GSE to utilize these markings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The aircraft that may use these markings will have a fuselage diameter of 3 m or more.&lt;/div&gt;&lt;/div&gt;</p>
