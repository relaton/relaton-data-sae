  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides a method/procedure for specifying the properties of vulcanized elastomeric materials (natural rubber or synthetic rubbers, alone or in combination) that are intended for, but not limited to, use in rubber products for automotive applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers materials that do not contain any re-use, recycled, or regrind materials unless otherwise agreed to by manufacturer and end user. The use of such materials, including maximum percent, must be specified using a “Z” suffix.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This classification system covers thermoset High Consistency Elastomers (HCEs) only. Thermoplastic Elastomer (TPE) materials are classified using SAE J2558. Silicone Formed In Place Gasket (FIPG) systems such as Room Temperature Vulcanized (RTV) Silicones, and Liquid Silicone Rubber (LSR) systems are classified using ASTM F2468.&lt;/div&gt;



    &lt;/div&gt;</p>
