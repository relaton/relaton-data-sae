  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes requirements for coating systems having high durability for use as aircraft exterior surface finishes. These coating systems normally are comprised of a surface treatment, a primer, and a topcoat. Alternatively, a coating system may be comprised of a surface treatment and a unicoat. Testing includes use of a chemical stripper for removal and a cleaning compound for topcoat washing, but these components are not a part of the coating system.&lt;/div&gt;&lt;/div&gt;</p>
