  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers helical coil stud locking screw thread inserts made from formed wire in which the inner surface of the coil, after assembly provides threads of standard Unified 60° form as specified on the assembly drawing. This document also covers the performance requirements of the locking feature of the insert which will retain Unified ANSI B1.1 (UN Profile) or AS8879 (UNJ Profile) external threaded parts.&lt;/div&gt;
    &lt;/div&gt;</p>
