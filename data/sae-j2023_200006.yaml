    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These general operator precautions apply to horizontal earthboring machines as defined in SAE J2022. These should not be considered as all-inclusive for all specific uses and unique features of each particular type of machine. Other more specific operator precautions not mentioned herein should be covered by users of this SAE Recommended Practice for each particular machine application.&lt;/div&gt;
