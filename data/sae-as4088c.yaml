  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines gland details for rod diameters from 1/4 to 15-1/2 in. inclusive corresponding to AS568 O-Ring Dash No. sizes -108/-111, -206/-222, -325/-349 and -425/-460.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The gland details herein provide more space than MS33675 and sufficient to fit more efficient and reliable excludion devices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Exclusion device configurations are not specified in this document.&lt;/div&gt;&lt;/div&gt;</p>
