  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;CPs are a process that is executed on a critical landing gear (or undercarriage) part, assembly or equipment that if performed incorrectly or omitted would cause:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;An operational failure of the aircraft; or&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;An unacceptable risk of injury&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;This document identifies CPs that have either caused operational failure or that can be reasonably expected to cause operational failures based on experience. Note that in the interest of brevity, that this document is not intended to be a definitive listing, only an introduction and a consideration of common processes.&lt;/div&gt;
    &lt;/div&gt;</p>
