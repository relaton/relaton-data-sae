    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a butyl rubber in the form of molded rings, compression seals, o-ring cord, and molded-in-place gaskets for aeronautical and aerospace applications. As AMS3238 is no longer valid for O-rings. For O-rings, the requirements of AMS7338 shall be met wherever AMS3238 is specified.&lt;/div&gt;&lt;/div&gt;</p>
