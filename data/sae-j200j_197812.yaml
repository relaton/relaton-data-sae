  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This classification system tabulates the properties of vulcanized rubber materials (natural rubber, reclaimed rubber, synthetic rubbers, alone or in combination) that are intended for, but not limited to, use in rubber products for automotive applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Note 1–This classification system may serve many of the needs of other industries in much the same manner as SAE numbered steels. It must be remembered, however, that this system is subject to revision when required by automotive needs. It is recommended that the latest revision always be used.&lt;/div&gt;&lt;/div&gt;</p>
