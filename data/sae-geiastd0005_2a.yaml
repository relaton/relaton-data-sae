    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Standard establishes processes for documenting the mitigating steps taken to reduce the harmful effects of Pb-free tin finishes in electronic systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This Standard is applicable to Aerospace, Defense, and High Performance (ADHP) electronic applications which procure equipment that may contain Pb-free tin finishes.&lt;/div&gt;&lt;/div&gt;</p>
