    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) presents a review of the types and general characteristics of power sources that may be used to provide the power for gaseous or liquid fluidic control systems. Fluidic definitions, terminology, units and symbols are defined in Reference &lt;span class="xref"&gt;2.1.1&lt;/span&gt;.&lt;/div&gt;


