    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Information Report is to provide general information relative to the nature and use of eddy current techniques for nondestructive testing. The document is not intended to provide detailed technical information but to serve as an introduction to the principles and capabilities of eddy current testing, and as a guide to more extensive references listed in &lt;span class="xref"&gt;Section 2&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
