  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice presents recommendations for test fluids that can be used to simulate real world fuels. The use of standardized test fluids is required in order to limit the variability found in commercial fuels and fluids. Commercial fuels can vary substantially between manufacturers, batches, seasons, and geographic location. Further, standardized test fluids are universally available and will promote consistent test results for materials testing. Therefore, this document&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Explains commercial automotive fuel components&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Defines standardized components of materials test fluids&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Defines a nomenclature for test fluids&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Describes preparations for test fluids and&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Recommends fluids for testing fuel system materials&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The test fluid compositions specified in &lt;span class="xref"&gt;Section 7&lt;/span&gt; of this document are recommended solely for evaluating materials. They are not intended for other activities, such as engine development, design verification, or process validation unless agreed upon by the contracting parties. The marketplace test fuels listed in &lt;span class="xref"&gt;Appendix B&lt;/span&gt; of this document can be used for engine, vehicle, or component testing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Most marketplace fuels contain additives for such purposes as oxidation stability, intake and combustion chamber deposit control, anti-foaming, electrostatics, octane, etc., applied at a parts per million basis. It is not the intention of this document to include a surrogate for the potential effects of these additives. As far as this committee is aware, current additives do not adversely effect fuel system materials. Those contemplating new or improved additives for future application could use the basic test fluids or fuels from this document, inject such additives and use the resulting mixtures to assess whether these new additives might effect fuel system materials.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For the purposes of this document, the term FUEL is used in conjunction with fully blended hydrocarbon or hydrocarbon oxygenate mixtures for use in commercial automotive engines. The term FLUID is applied to mixtures of specific controlled components used to simulate the effects of fuels.&lt;/div&gt;
    &lt;/div&gt;</p>
