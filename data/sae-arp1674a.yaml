  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a manufacturing method for processing unidirectional carbon fiber/epoxy resin impregnated sheet and tape into multi-ply broadgoods and tape produced on an automated cross-plying machine. Broadgoods or tape of two or more ply configurations may be processed, where ply orientations of 0°, 45°, 90°, and 135° (as examples) may be automatically layed in a programmed sequence. In all configurations, the 0° ply direction is parallel to the length of the broadgoods roll or sheet, or tape.&lt;/div&gt;&lt;/div&gt;</p>
