  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes a two-pole electric connector for use in battery powered ground support equipment, i.e., traction batteries. Alternatively, the connector can have two or more auxiliary contacts for auxiliary circuits. A handle may be added as an option to assist in connecting and disconnecting.&lt;/div&gt;&lt;/div&gt;</p>
