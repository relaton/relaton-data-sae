abstract:
- language: en
  script: Latn
  content: "<p>This specification covers an aluminum alloy in the form of hand forgings and rolled rings procured to metric (SI) dimensions. These products have been used typically for complex shaped parts requiring moderate strength and good forgeability of the alloy and where stability is required during machining, but usage is not limited to such applications.  Corrosion resistance of this alloy is superior to that of aluminum alloys having copper as the principal alloying element.</p>"
