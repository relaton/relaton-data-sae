    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard test code has been adopted by SAE to specify:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A laboratory engine dynamometer test procedure.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A basis for engine power rating.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(c)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A method for correcting observed power to standard inlet air conditions.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The pressure and temperature correction formulas contained herein should be used only within the specified range of conditions (see paragraph &lt;span class="xref"&gt;8.4.1&lt;/span&gt;) and are not intended for altitude derating.&lt;/div&gt;&lt;/div&gt;</p>
