abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard describes a test method for evaluating the susceptibility of uncoated cold rolled and hot rolled Ultra High Strength Steels (UHSS) to hydrogen embrittlement. The thickness range of materials that can be evaluated is limited by the ability to bend and strain the material to the specified stress level in this specification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Hydrogen embrittlement can occur with any steel with a tensile strength greater than or equal to 980 MPa. Some steel microstructures, especially those with retained austenite, may be susceptible at lower tensile strengths under certain conditions. The presence of available hydrogen, combined with high stress levels in a part manufactured from high strength steel, are necessary precursors for hydrogen embrittlement.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Due to the specific conditions that need to be present for hydrogen embrittlement to occur, cracking in this test does not indicate that parts made from that material would crack in an automotive environment. Results from this test should be considered in conjunction with the strain state of the material and the operating environment of the part when selecting any UHSS. Since this test method is comparative, the most information can be gained if a control sample of known performance is evaluated along with the material being studied.&lt;/div&gt;


    &lt;/div&gt;</p>
