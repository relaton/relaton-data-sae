  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the basic requirements for the specification and testing of air surface (intermodal) 8 ft x 8 ft (2.44 m x 2.44 m) cross-section containers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The basic requirements for the air/surface (intermodal) container are presented in &lt;span class="xref"&gt;Sections 3&lt;/span&gt; to &lt;span class="xref"&gt;6&lt;/span&gt; while the detailed design requirements are in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;. &lt;span class="xref"&gt;Appendix B&lt;/span&gt; describes the sections of other standards that apply to air/surface containers. &lt;span class="xref"&gt;Appendix C&lt;/span&gt; describes uniformity of test apparatus and methods. These appendices shall be referred to for important supplemental requirements and procedures for this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;AS4041 presents the requirements for air mode general purpose containers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Requirements for containers to be transported by rotary-wing aircraft are excluded from this document.&lt;/div&gt;

    &lt;/div&gt;</p>
