  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AS covers subsonic and supersonic Mach meter instruments which, when connected to sources of static (Ps), and total (Pt), or impact (Pt-Ps), pressure provide indication of Mach number. These instruments are known as Type A. This AS also covers servo-operated repeater or digital display instruments which indicate Mach number when connected to the appropriate electrical output of a Mach transducer of Air Data Computer. These instruments are known as Type B.&lt;/div&gt;
    &lt;/div&gt;</p>
