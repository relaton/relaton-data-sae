  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard applies to pressure reducers for gaseous breathing oxygen systems and for all performance profiles without regard to particular inlet or outlet pressures. Attention is given, however, to construction requirements for reducers with maximum supply pressures to 2250 psig (155 bar) and reduced pressures of 50 to 150 psig (3.4 to 10.5 bar).&lt;/div&gt;&lt;/div&gt;</p>
