  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a dynamic test procedure for evaluating Type 1 lap belt assemblies for pelvic restraints and Type 2 assemblies for combination pelvic and upper torso restraints, as defined in SAE J4c. Uniform test requirements, test procedures, a seat belt assembly loading device, and data recording requirements are specified.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The intent of the recommended practice is to provide an acceptance procedure employing a dynamic test method for determining the ability of seat belt assemblies to meet minimal requirements for restraining a seat belt assembly loading device. A simple dynamic test is described which will yield repeatable and comparable results while simulating the loading condition a seat belt assembly is subjected to in a frontal accident. The impact conditions generate belt loads representative of those obtained in a motor vehicle striking a rigid barrier head on at 30 mph as stated in SAE J850.&lt;/div&gt;&lt;/div&gt;</p>
