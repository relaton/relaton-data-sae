  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Metric (SI and CGS) and English units related to aerospace hydraulics are summarized. Conversion of units is provided as required. Fundamental fluid properties and physical laws governing fluid motion, pressure and other significant aspects are described in SI metric units. Examples of application to typical aerospace hydraulic system components are demonstrated.&lt;/div&gt;&lt;/div&gt;</p>
