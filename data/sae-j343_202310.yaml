  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard gives methods for testing and evaluating performance of the SAE 100R series of hydraulic hose and hose assemblies (hose and attached end fittings) used in hydraulic fluid power systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Specific tests and performance criteria for evaluating hose assemblies used in hydraulic service are in accordance with the requirements for hose in the respective specifications of SAE J517.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document further establishes a uniform means of testing and evaluating performance of hydraulic hose assemblies.&lt;/div&gt;&lt;/div&gt;</p>
