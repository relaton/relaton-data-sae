    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice sets forth the guidelines for the use of non-black O-ring seals. Black is the preferred color for polymer types other than Silicone and Fluorosilicone. When a color other than black is to be used, those established by this document are the preferred.&lt;/div&gt;&lt;/div&gt;</p>
