abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard is equivalent to ISO Standard 6625.

    Differences, where they exist, are shown in Appendix A.

    This SAE Standard specifies the dimensional features of S, G, D, and DV oil control piston ring types.

    The normal range for the axial width of oil control rings (2.5 to 8 m inclusive) is divided into 0.5 or 1.0 increments.  In Table 7, dimensions in inch units are given for oil control rings with axial width 4.75 m (equal to 3/16 in) for existing applications.

    The requirements of this document apply to oil control rings for reciprocating internal combustion piston engines up to and including 200 mm in diameter.  They may also be used for piston rings of compressors working under similar conditions.</p>
