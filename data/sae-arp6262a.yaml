abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;It is recognized that the structural integrity of repaired composite structures depends upon the capabilities of the individuals who are responsible for performing the repairs. This document is intended to address repairs of composite structure regardless of the type of structure such as marine, wind turbine, automotive, aircraft, or other applications.&lt;/p&gt;
    &lt;p&gt;This certification standard establishes the minimum requirements for training, examining, and certifying composite structure repair personnel. It establishes criteria for the certification of personnel requiring appropriate knowledge of the technical principles underlying the composite structural repairs they perform. Persons certified under this document may be eligible for licensing or certification/ qualification by an appropriate authority, in addition to this industry accepted basic composite repair technician certification.&lt;/p&gt;
    &lt;p&gt;Persons who successfully complete the requirements of this certification standard are considered to be able to perform basic composite repairs to composite structures in compliance with the manufacturers’ repair documentation or other acceptable repair methods.&lt;/p&gt;
    &lt;p&gt;This document is not intended to include structure specific repairs that are in manufacturer’s maintenance or repair manuals. Additional specific training may be required by the maintenance organization.&lt;/p&gt;</p>
