    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides the minimum requirements (Body of Knowledge) for AQMS auditors who will participate in AQMS certification/registration activities, including the auditor authentication process and requirements for a training organization. It is applicable to auditors seeking formal approval to conduct audits of the AQMS in support of the IAQG, and those who manage the competency element of an AQMS audit program and/or training organizations.&lt;/div&gt;&lt;/div&gt;</p>
