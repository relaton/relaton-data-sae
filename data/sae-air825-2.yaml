  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this SAE Aerospace Information Report (AIR) is to describe the effects of the environmental changes on human physiology and the protection required to avoid negative consequences resulting from altitude exposure. A brief presentation of basic terms and considerations required to discuss the topic of human physiology at altitude are followed by an overview of the cardiovascular and respiratory systems. Issues specifically related to human exposure to altitude are then discussed. Hypoxia, hyperventilation, barotrauma, and decompression sickness (DCS) are each addressed: hypoxia is defined as an insufficient supply of oxygen to the tissues, hyperventilation is an excessive rate of ventilation with ultimate consequences on acido-basic equilibrium, barotrauma is injury caused by pressure: most commonly referencing injury to the walls of the Eustachian tube and the ear drum due to the difference between atmospheric and intratympanic pressures, and DCS is related to an excess of nitrogen in the body tissues. One goal of this AIR is to demonstrate the necessity of oxygen use for prevention of physical and psychological problems, or loss of consciousness in an aircraft pilot, flight crew, or passengers. Hopefully, this will provide a clear understanding as to why the use of supplemental oxygen is required for flight crew and passengers at altitudes greater than 12,000 ft (3650 m).&lt;/div&gt;
    &lt;/div&gt;</p>
