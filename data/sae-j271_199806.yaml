abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice covers the mechanical and chemical requirements
    of special quality high tensile, hard-drawn carbon-steel spring wire with restricted
    size tolerances. This material is used where such restricted dimensional requirements
    are necessary for the manufacture of highly stressed mechanical springs and wire
    forms. It is generally employed for applications subject to static loads or infrequent
    stress repetitions. This document also covers the processing requirements of springs
    and forms fabricated from this wire.</p>"
