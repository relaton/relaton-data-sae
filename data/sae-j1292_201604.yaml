  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the application of primary wiring distribution system harnesses to automotive, and Motor Coach vehicles. This is written principally for new vehicles but is also applicable to rewiring and service. It covers the areas of performance, operating integrity, efficiency, economy, uniformity, facility of manufacturing and service. This practice applies to wiring systems of less than 50 V.&lt;/div&gt;&lt;/div&gt;</p>
