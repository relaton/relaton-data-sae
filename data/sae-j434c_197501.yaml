abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE standard covers the minimum mechanical properties measured on separately cast test pieces
    of varying thickness and microstructural requirements for ductile iron castings used in automotive and allied industries. Castings may be specified in the as-cast or heat-treated condition. If castings are heattreated, prior approval from the customer is required.
    The appendix provides general information on chemical composition, microstructure and casting
    mechanical properties, as well as other information for particular service conditions.
    In this standard SI units are primary and in-lb units are derived.</p>
