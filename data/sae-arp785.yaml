    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure describes a gravimetric method for the determination of particulate contaminant in hydraulic fluids by the control filter technique. With this method detectable contamination levels down to 0.2 mg per sample can be obtained with a standard deviation of ± 0.1 mg.&lt;/div&gt;&lt;/div&gt;</p>
