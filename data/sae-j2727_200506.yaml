  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Current industry standards do not exist for determining refrigerant emissions from mobile air conditioning systems. Test procedures are not common between production component suppliers in establishing leakage values. This “System Leakage Chart” has been developed from industry experience of expected refrigerant leakage gains from system design resulting from technology changes. It provides a rating value of various technologies that are currently available. The “Leakage Chart” can be expanded as new technologies are offered and/or developed. This document provides the information to develop an Excel file template “Leakage Chart” for making system analysis. It is not the intent of this Standard to define the refrigerant emissions from a mobile air conditioning system. It is to only define a system rating based upon the technology used. Future development of SAE Standards for determining mobile air conditioning refrigerant emissions such as system static and dynamic min-shed test procedures will provide a procedure for determining system emissions.&lt;/div&gt;
    &lt;/div&gt;</p>
