abstract:
- language: en
  script: Latn
  content: <p>This specification covers a corrosion and heat resistant nickel alloy
    powder-metallurgy product in the form of billets and preforms for forgings. Primarily
    for parts requiring high strength up to 1500 degrees F (815 degrees C) and corrosion
    and oxidation resistance up to 1700 degrees F (925 degrees C). This specification
    has been declared "Noncurrent" by the Aerospace Materials Division, SAE, as of
    October 16, 1986.  It is recommended that this specification not be specified
    for new designs.</p>
