  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Gas compressors (air and other compressible fluids) have been used sporadically since the 1940's for various utility functions in aerospace applications. They have been used to provide power to gun purge and drive systems, engine or APU starters (recharge accumulators), reservoir pressurization, cockpit pressurization, braking systems, canopy seals, engine control devices, landing gear activation, and boosted flight controls (see &lt;span class="xref"&gt;Table 1&lt;/span&gt;). In current state-of-the-art aircraft, most pneumatic system power is extracted from a stage of compression in the turbo-jet engine. As more and more demands are put on new generation engines for fuel economy and performance there is an increasing need for a new source of pneumatic power. This document is intended to describe current state-of-the-art technology in compressors, define the limitations, discuss enhancements needed and attempt to predict the needs of the future.&lt;/div&gt;




    &lt;/div&gt;</p>
