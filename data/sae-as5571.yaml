  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides standards for several aspects of aero-thermal system performance modeling using object-oriented programming systems. Nomenclature, application program interface, and user interface are addressed with the emphasis on nomenclature. The Numerical Propulsion System Simulation (NPSS) modeling environment is frequently used in this document as an archetype. Many of the standards are derived from NPSS common practice. NPSS was chosen because it is an available product. The standards described herein may be applied to other object-oriented systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While this document applies broadly to any gas turbine engine, the great majority of engine performance computer programs have historically been written for aircraft propulsion systems. Aircraft and propulsion terminology and examples appear throughout.&lt;/div&gt;

    &lt;/div&gt;</p>
