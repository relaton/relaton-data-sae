  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP discusses design philosophy, system and equipment requirements, installation environment and design considerations for systems within the ATA 100 specification, Chapter 36, Pneumatic (reference 1). This ATA system/chapter covers equipment used to deliver compressed air from a power source to connecting points for other systems such as air conditioning, pressurization, anti-icing, cross-engine starting, air turbine motors, air driven hydraulic pumps, and other pneumatic demands.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The engine bleed air system includes components for preconditioning the compressed air (temperature, pressure or flow regulation), ducting to distribute high or low pressure air to the using systems, and sensors/instruments to indicate temperature and pressure levels within the system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The engine bleed air system interfaces with the following ATA 100 systems:&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;The interface with these systems/chapters is at the inlet of the shutoff/control valve of each associated system. This boundary definition aligns with that in the ATA 100 specification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The primary emphasis of this ARP is on systems which use the aircraft engine as the source of the pneumatic supply. Alternate supply systems are discussed in &lt;span class="xref"&gt;Section 7.0&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
