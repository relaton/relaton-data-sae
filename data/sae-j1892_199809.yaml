    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the basic content requirements, bar-code specifications, and functional test specifications of a vehicle emission configuration (VEC) label. On the vehicle, the VEC label is to be mounted under the hood in a readily accessible location for use of a bar-code scanning device.&lt;/div&gt;
