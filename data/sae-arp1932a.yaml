abstract:
- language: en
  script: Latn
  content: "<p>This recommended practice describes the engineering requirements for
    producing a voltage-resistant, non-powdery anodic coating on titanium and titanium
    alloys and the properties of such coatings.  Primarily to increase resistance
    to galvanic and high temperature corrosion and high voltages and to form a receptive
    base for the application of lubricants and paints on titanium and titanium alloys.</p>"
