  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides a standardized test procedure that can be used to evaluate material capability in a dynamic sealing application. This procedure will be utilized by applicable elastomer material specifications which are used for production of O-rings and other seals.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification is applicable to the dynamic testing requirements for aerospace elastomer parts utilizing materials conforming to AMS7XXX series specifications, user specifications, or print on a Purchase Order (PO) that calls out this document for aerospace applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure is intended for testing NBR. Other elastomers may have different requirements which will require a separate procedure.&lt;/div&gt;
    &lt;/div&gt;</p>
