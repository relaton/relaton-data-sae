  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers solid, uncut polytetrafluoroethylene (PTFE) retainers (backup rings) for use in glands in accordance with AS4716. They are for use in hydraulic and pneumatic system components as anti-extrusion devices in conjunction with O-rings, packings and other elastomeric seals for static and dynamic applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Because of the construction of groove dimensions, backup rings specific to rod applications are designated “R” - Rod (Female), backup rings specific to piston applications are designated “P” - Piston (Male). Piston and rod types of virgin pigmented PTFE are also identified by color code which also distinguishes parts to this standard from those made from virgin PTFE to other standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Backup rings specified herein have been designed for a temperature range of -65 to 275 °F (-54 to 135 °C) and a nominal operating pressure of 3000 psi (20.7 MPa) for code 09 material (AMS 3678/9). Alternate materials to AMS 3678 are offered for more arduous operating conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification includes material tests but does not include hydraulic or pneumatic performance tests.&lt;/div&gt;
    &lt;/div&gt;</p>
