    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The final approval date for Fuels and Lubricants technical reports is shown following the J-report number. This approval date is the date of final approval by the Fuels and Lubricants Council. It is effective immediately subsequent to Council approval for &lt;i&gt;newly issued Standards, Recommended Practices&lt;/i&gt;, and &lt;i&gt;Information Reports&lt;/i&gt;, and also for &lt;i&gt;revised Information Reports.&lt;/i&gt; In the case of &lt;i&gt;revised&lt;/i&gt; or &lt;i&gt;cancelled Standards&lt;/i&gt; or &lt;i&gt;Recommended Practices&lt;/i&gt; (used to define product quality), an 18 month grace period is advised before they become fully effective.&lt;/div&gt;&lt;/div&gt;</p>
