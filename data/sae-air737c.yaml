  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report lists military and industry specifications and standards which are used in aerospace hydraulic and pneumatic systems. It is intended as a supplement to specifications MIL-H-5440 and MIL-P-5518. Only those hardware standards which have been specifically designed for hydraulic or pneumatic use are listed. Revisions and amendments which are current for these specifications and standards are not listed. Order of procedure for the selection of specifications and standards is covered by MIL-STD-143.&lt;/div&gt;
    &lt;/div&gt;</p>
