  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These formulae shall be used to determine drop dimensions for simple bend tube fittings utilizing flare and flareless end connection designs from 0° to 90° used in aircraft and aerospace applications. Individual design standards shall specify parameters, such as centerline bend radius (R), straight tangent length to accommodate bending equipment (X&lt;sub&gt;1&lt;/sub&gt; and X&lt;sub&gt;2&lt;/sub&gt;), and nut to be used.&lt;/div&gt;
    &lt;/div&gt;</p>
