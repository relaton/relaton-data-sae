  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers un-shielded (JUTP) and shielded (STP) balanced single twisted pair jacketed data cable intended for use in surface vehicle cables for 1 Gb/s ethernet applications. The tests in this standard are intended to qualify cables for normal operation in an automotive environment while maintaining the necessary electrical properties for reliable data transmission.&lt;/div&gt;
    &lt;/div&gt;</p>
