  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report describes a mathematical model which can be used to analyze particle count data. Particle counts which fit the model can be graphically displayed. converted from one counting size-frequency range to another, and extrapolated to estimate counts beyond the measured range. Derivation, applications and calculations are described.&lt;/div&gt;&lt;/div&gt;</p>
