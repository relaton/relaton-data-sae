  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The main purpose of this Recommended Practice is to verify that vehicles are capable of communicating a minimum subset of information, in accordance with the diagnostic test services specified in SAE J1979: &lt;i&gt;E/E Diagnostic Test Modes&lt;/i&gt;, or the equivalent document ISO 15031-5: &lt;i&gt;Communication Between Vehicle and External Equipment for Emissions-Related Diagnostics – Part 5: Emissions-related diagnostic services&lt;/i&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Any software meeting these specifications will utilize the vehicle interface that is defined in SAE J2534, &lt;i&gt;Recommended Practice for Pass-Thru Vehicle Programming&lt;/i&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
