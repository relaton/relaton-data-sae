  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines a method for evaluating the immunity of automotive electrical/electronic devices to radiated electromagnetic fields coupled to the vehicle wiring harness. The method, called Bulk Current Injection (BCI), uses a current probe to inject RF onto the wiring harness in the frequency range of 1 to 400 MHz. BCI is one of a number of test methods that can be used to simulate the electromagnetic field.&lt;/div&gt;&lt;/div&gt;</p>
