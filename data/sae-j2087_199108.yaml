    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides test procedures, requirements, and guidelines for daytime running lamps that are mounted on the exterior of a vehicle. It is applicable to daytime running lamps that are combined with or use headlamps, parking lamps, turn signal lamps, fog lamps, or other lamps on the front of the vehicle, as well as to daytime running lamps that use dedicated lamps.&lt;/div&gt;&lt;/div&gt;</p>
