    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice covers service performance tests, test methods, and requirements applicable to sealed beam headlamp units covered by SAE J579 and J571. It is intended to supplement the dimensional requirements and engineering design test procedures and requirements, and is the means for service evaluation of sealed beam headlamp units.&lt;/div&gt;&lt;/div&gt;</p>
