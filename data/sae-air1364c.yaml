  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) summarizes data and background relative to age control of specific classes of those nitrile type synthetic elastomers used in sealing devices which are resistant to petroleum base hydraulic fluids, lubricating oils, and aircraft fuels. This includes, but is not limited to, those nitrile (NBR or BUNA-N) elastomers previously covered by Section I of MIL-STD-1523.&lt;/div&gt;
    &lt;/div&gt;</p>
