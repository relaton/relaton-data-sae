    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines minimum requirements for an aircraft transport ULD to transport horses properly and safely by air, to protect the horse(s) from injuries, and to protect the aircraft from corrosion created by waste spill. The ULD is designed to accommodate one horse or several.&lt;/div&gt;
