  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice presents service brake performance requirements for the brake systems of motor vehicles intended for roadway use and falling in the following classifications:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Light Truck (10,000 lb gvw or less—Uniform Vehicle Code—Class B-2).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Truck and Bus (over 10,000 lb gvw—Uniform Vehicle Code—Class C-1 and C-3).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Combination of Vehicles (Uniform Vehicle Code—Class D).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Acceptable performance requirements are based on data obtained from applicable sections of SAE J786.&lt;/div&gt;&lt;/div&gt;</p>
