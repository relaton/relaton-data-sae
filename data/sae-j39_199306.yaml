abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard is to provide a means of securement in shipment of
    agricultural equipment on railroad flat cars and flatbed trucks by utilizing a
    T-hook and slot method. This SAE Standard is to provide standardized restraining
    slots, in accordance with product weight category and test requirements, to be
    incorporated in agricultural equipment that will be shipped, utilizing a T-hook
    and slot method of  tiedown.</p>"
