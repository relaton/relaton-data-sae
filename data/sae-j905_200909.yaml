  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this fuel filter test method is to provide standardized methods for evaluating the performance characteristics of fuel filters by bench test methods. This, combined with data obtained from application tests, may be used to establish standards of performance for filters when tested by these standard methods. Many variations in requirements of filtration to protect fuel supply equipment on engines and variations in operating conditions make it difficult to specify meaningful "in-service" performance standards by which a filter may be judged. By the use of these standard test methods, test conditions are always the same, and comparisons of the laboratory performance of filters may be made with a high degree of confidence. Once the requirements of a particular application are known, performance standards for suitable filters may be established by these test methods, and adequacy of performance of filters for the job may be determined.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In order to achieve the highest degree of reliability of test results, the procedures and equipment must conform to those specified in this code. No minimum performance requirements for filters have been specified, since these are the responsibility of the user and manufacturer. Only the methods of determining, interpreting, and reporting performance characteristics are the proper province of this SAE Standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Separate chapters cover the test methods necessary to evaluate the several functional capabilities and mechanical properties of the filter. Each chapter is complete with recommended materials, apparatus, and procedures for testing and evaluation. The chapters are:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Chapter 1—Resistance to Flow (Section &lt;span class="xref"&gt;3&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Chapter 2—Filter Capacity and Contaminant Removal Characteristics (Section &lt;span class="xref"&gt;4&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Chapter 3—Media Migration Test (Section &lt;span class="xref"&gt;5&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Chapter 4—Collapse Test (Section &lt;span class="xref"&gt;6&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Chapter 5—Ability to Meet Environmental Conditions (Section &lt;span class="xref"&gt;7&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Chapter 6—Installation and Removal (Section &lt;span class="xref"&gt;8&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;g&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Chapter 7—Mechanical Tests (Section &lt;span class="xref"&gt;9&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;h&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Chapter 8—Material Compatibility (Section &lt;span class="xref"&gt;10&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;To simplify the chapters covering test methods, information of importance but not directly involved in test methods is covered in appendices as follows:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
