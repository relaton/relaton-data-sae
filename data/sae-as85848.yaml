  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for various types of identification sleeving that will shrink to a predetermined size upon the application of heat after it has been marked. Continuous operating temperature ratings range from -55° to 175°C (-67° to 347°F). (See &lt;span class="xref"&gt;6.1&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
