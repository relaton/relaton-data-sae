    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To create a standard that instructs both supplier and user in the testing and characterization of initial build fiber optic cable assemblies for avionics/aerospace applications. This can be in the plant or in the avionics “box.” It includes specification of jumpers (aerospace measurement quality jumpers), end faces, link loss requirements and inspection.&lt;/div&gt;&lt;/div&gt;</p>
