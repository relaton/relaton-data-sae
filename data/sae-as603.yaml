    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements and procedures for impulse testing of hose, tubing, and fitting assemblies for use in aerospace hydraulic systems of 8000 psi nominal operating pressure or less. It also refers to standard impulse test equipment to be used in conducting these impulse tests.&lt;/div&gt;&lt;/div&gt;</p>
