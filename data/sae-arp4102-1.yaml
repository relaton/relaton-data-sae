  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends criteria for the flight deck display of an On Board Weight and Balance System. The system may have the capability of a primary operational device or be a secondary advisory source of information of weight and center of gravity position.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommendations apply to transport aircraft and describe the operational and functional requirements for the display of an On Board Weight and Balance System.&lt;/div&gt;&lt;/div&gt;</p>
