  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This data dictionary provides definitions for quantities, measurement units, reference systems, measurands, measurements and quantity modalities commonly used on the command and control of cyber physical systems. A cyber physical system as an engineered system that is built from, and depends upon, the seamless integration of computational algorithms and physical components. Cyber physical systems are often interconnected via data links and networks. The term encompasses intelligent vehicles and devices that operate in any environment, including robotic and autonomous systems.&lt;/div&gt;


    &lt;/div&gt;</p>
