abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the major design drivers and considerations when designing a fuel system for a large commercial aircraft. While not intended as a design manual for individual system components, it does refer out to other SAE specifications where more detail on specific components and subsystems is given. It does include examples of a number of calculations associated with sizing of fuel systems, based on those given in NAVAIR 06-5-504, as well as an appendix summarizing basic fluid mechanical equations that are key for fuel system design. It is acknowledged that most of these calculations would today be performed by modeling tools rather than by hand, but it is considered important for the designer to understand the principles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Some details specific to military aircraft are included, but it is intended that later issues of this document will include appendices that give specific considerations for military aircraft, smaller commercial aircraft, and rotorcraft. Features unique to these types of vehicle are generally not included in this issue.&lt;/div&gt;
    &lt;/div&gt;</p>
