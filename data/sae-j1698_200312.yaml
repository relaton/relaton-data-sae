abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice aims to establish a common format for displaying and presenting crash-related data recorded and stored within certain electronic components currently installed in many light-duty vehicles. This Recommended Practice pertains only to the post-download format of such data and is not intended to standardize the format of the data stored within any on-board storage unit, or to standardize the method of data recording, storing, or extraction.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Historically, crash data recording technology in light-duty vehicles has developed and evolved based on differing technical needs of manufacturers and their customers without industry standards or government regulation. As a result, wide variations currently exist among vehicle manufacturers regarding the scope and extent of recorded data. For this reason, this Recommended Practice is not intended to standardize or mandate the recording of any specific data element or to specify a minimum data set. Rather, it is intended to be a compilation of data elements and parameters that various manufacturers are currently recording, as well as those elements reasonably predicted to be recorded in the foreseeable future, and to establish a common format for display and presentation of that data so recorded.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This version of the Recommended Practice is limited in application to vehicular data recorded in single frontal impact events. Provisions for multiple-impact events may be included in the next version. Side-impact and rollover events may be addressed at a later time.&lt;/div&gt;
    &lt;/div&gt;</p>
