  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes requirements when implementing statistical product acceptance methods to meet defined risk requirements. This standard also establishes the minimum content required to be covered in an organization’s documented procedures that govern their application of statistical product acceptance methods.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These general requirements and documented procedures apply the requirements of the 9100/9110/9120 quality management system standards, in addition to establishing requirements for retrievability, safety/critical characteristics, and quality parameters that protect the customer.&lt;/div&gt;&lt;/div&gt;</p>
