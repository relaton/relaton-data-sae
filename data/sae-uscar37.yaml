  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Procedures included within this specification supplement are, when used in conjunction with SAE/USCAR 2, intended to cover performance testing at all phases of development, production, and field analysis of electrical terminals, connectors, and components that constitute the electrical connection systems in high voltage (60~600V) road vehicle applications. These procedures are applicable to terminals used for In-Line, Header, and Device Connector systems with and without Shorting Bars.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This supplement applies to both sealed and unsealed connection systems.&lt;/div&gt;
    &lt;/div&gt;</p>
