  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP defines a recommended placard for readily identifying equipment with aircraft phosphate ester fluid to be used in the aircraft hydraulic systems to assure compatibility between the internal seals/materials and the system fluid.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A definition is provided for a durable type and semipermanently attached placard with prescribed text for the permissible fluid are included in the document.&lt;/div&gt;&lt;/div&gt;</p>
