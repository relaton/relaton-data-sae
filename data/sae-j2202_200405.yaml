  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to describe the application of the primary wiring distribution system of less than 50 V and includes cable sizes 0.5 to 19 mm&lt;sup&gt;2&lt;/sup&gt; on heavy-duty on-highway trucks. The document identifies appropriate operating performances requirements. This document excludes the male to female connection of the SAE J560 and ISO 3731 connectors.&lt;/div&gt;&lt;/div&gt;</p>
