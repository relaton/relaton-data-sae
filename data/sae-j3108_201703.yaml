  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice prescribes clear and consistent labeling methodology for communicating important xEV high voltage safety information. Examples of such information include identifying key high voltage system component locations and high voltage disabling points. These recommendations are based on current industry best practices identified by the responder community. Although this recommended practice is written for xEVs with high voltage systems, these recommendations can be applied to any vehicle type.&lt;/div&gt;&lt;/div&gt;</p>
