  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This TIR establishes high-flow fueling protocols, including their process limits for fueling of compressed gaseous hydrogen vehicles at peak flow rates from 60 to 300 g/s with compressed hydrogen storage system (CHSS) volume capacities between 248.6 and 7500 L which have been qualified to UN GTR #13. This document is initially being published as a TIR due to limited field testing of the fueling protocols. Once the fueling protocols have been field tested, the SAE Fuel Cell Standards Committee Interface Task Force intends to publish a revision to this document as an SAE Standard.&lt;/div&gt;

    &lt;/div&gt;</p>
