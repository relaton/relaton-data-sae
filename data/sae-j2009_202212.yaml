  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to motor vehicle forward illumination systems and subsystems generated by discharge sources. It provides test methods, requirements, and guidelines applicable to the special characteristics of gaseous discharge lighting devices which supplement those required for forward illumination systems using incandescent light sources. The document is applicable to both discharge forward lighting systems, subsystems and components. This document is intended to be a guide to standard practice and is subject to change to reflect additional experience and technical advances.&lt;/div&gt;&lt;/div&gt;</p>
