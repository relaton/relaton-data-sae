  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the dimensional requirement of a range of high pressure pipes for use in the bench testing and setting of fuel injection pumps.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Only dimensions and requirements affecting the hydraulic characteristic of the pipes are defined. Other requirements, such as the type of end connections and shape of the pipes when bent, are not included. These depend on the connections provided at pump outlets and injector inlets, and on the design features of individual pumps and test benches.&lt;/div&gt;&lt;/div&gt;</p>
