  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) considers the issue of proper design guidance for high voltage electrical systems used in aerospace applications. This document is focused on electrical discharge mechanisms including partial discharge and does not address personnel safety. Key areas of concern when using high voltage in aerospace applications are power conversion devices, electrical machines, connectors and cabling/wiring. The interaction between components and subsystems will be discussed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The AIR is intended for application to high voltage systems used in aerospace vehicles operating to a maximum altitude of 30000 m (approximately 100000 feet), and maximum operating voltages of below 1500 VRMS (AC)/1500 V peak (DC). These upper voltage limits have been incorporated because this report focuses on extending the operating voltage of non-propulsive electrical systems beyond that of existing aerospace systems. It is noted that electrical systems for electrical propulsion may consider operating voltages beyond 1500 VAC/DC.&lt;/div&gt;&lt;/div&gt;</p>
