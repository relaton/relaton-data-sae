    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is to delineate the symbols used to identify controls, indicators, and tell-tales for automotive vehicles, trucks, off-the-road vehicles, construction equipment, industrial and recreational transportation and is for reference purposes only. The symbol application is to be found within the appropriate standards listed.&lt;/div&gt;

