  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is for establishing and addressing anomalies on appearance of new and newly retreaded tires prior to installation on aircraft. It is intended to use cosmetics as well as functionality to make a determination of acceptability. However, if cosmetic appearance is not a requirement, use the inspection criteria from ARP6225, Aircraft Tire Removal Criteria. This ARP does not supersede (E)TSO-C62 minimum requirements including marking requirements.&lt;/div&gt;&lt;/div&gt;</p>
