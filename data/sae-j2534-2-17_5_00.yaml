  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is part of the SAE J2534-2/X_0500 set of documents that extends the SAE J2534-1_0500 API (version 05.00) specification, and defines how to implement user datagram protocol (UDP) within the SAE J2534 API framework. This document details only the changes from SAE J2534-1_0500 and items not specifically detailed in this document are assumed to have not changed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;An SAE J2534-2/17_0500 interface shall be compliant to the UDP feature only when all the required functionality in this SAE Recommended Practice is implemented. Any functionality not required for compliance will be specifically marked as “optional” in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document must be used in conjunction with the SAE J2534-2/13_0500 (ethernet), SAE J2534-2/16_0500 (IPv4), SAE J2534-2/15_0500 (IPv6), SAE J2534-2/BA_0500, and SAE J2534-2/RE_0500 documents.&lt;/div&gt;&lt;/div&gt;</p>
