  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These recommendations cover the use of taper pins in taper pin terminal blocks, multi-contact electric connectors, and components designed to accept taper pins. Taper pins are intended to facilitate termination of a wire and are not to be employed as a quick-disconnect device. The mating portions of taper pins and taper pin receptacles shall be in accordance with &lt;span class="xref"&gt;Figure 1&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
