abstract:
- language: en
  script: Latn
  content: "<p>Included herein are complete general and dimensional data for the types
    of slotted and recessed head machine, tapping, and wood screws, and slotted capscrews
    recognized as SAE Standard.  Also included are performance data for tapping screws
    and appendixes which provide instructions for protrusion gaging flat heads, penetration
    gaging of recessed heads, across corners gaging of hexagon heads, recommended
    hole sizes for tapping screws, and a cross reference of tapping screw type designations.
    The inclusion of dimensional data in this standard is not intended to imply that
    all of the products described are stock production sizes. Consumer interests are
    requested to consult with manufacturers concerning lists of stock production sizes.</p>"
