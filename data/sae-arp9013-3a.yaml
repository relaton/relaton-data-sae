abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;ARP9013/3 recommended practice specifies a product acceptance system using process control methods.  Its purpose is to assure conformance for specified characteristics.  Use of process control techniques for product acceptance requires maintaining process stability and capability.  A stable and capable process is the best assurance of conforming hardware for the customer.  There can be lower inspection costs associated with a process control acceptance approach.&lt;/p&gt;</p>"
