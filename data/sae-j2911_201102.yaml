  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides manufacturers, testing facilities and providers of technician training with a procedure for certifying compliance with the appropriate standards. Manufacturers who advertise their products as Certified to an SAE J standard shall follow this procedure. Certification of a product is voluntary, however, this certification process is mandatory for those advertising meeting SAE Standard(s) requirements. Only certifying to this standard allows those claiming compliance to advertise that their product (unit), component, or service meets all requirements of the specific SAE standard. Certification of compliance to this and the appropriate standard and use of the SAE label on the product shall only be permitted after all the required information has been submitted to SAE International and it has been posted on the SAE web site. This process is mandatory for those advertising as being “Certified to SAE JXXXX [appropriate SAE Standard] requirements or any advertising or labeling language that implies such certification. SAE International will post the results in the official SAE on-line database. SAE J2911 provides manufacturers, testing facilities, and technician training providers with a procedure for certifying compliance with the appropriate SAE standard. Regulatory agencies will also have access to the SAE International public posting of the results in the official SAE database.&lt;/div&gt;

    &lt;/div&gt;</p>
