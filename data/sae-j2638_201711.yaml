    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes minimum performance criteria and definition of terms for the towing interface between a towing vehicle and fifth wheel or gooseneck trailer at or below 13608 kg (30000 pounds) gross trailer weight. This establishes criteria for the hitch, tow vehicle attachment structure, trailer attachment structure, and coupler.&lt;/div&gt;
