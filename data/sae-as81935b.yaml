  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers plain rod end bearings, corrosion resistant steel (CRES) or alloy steel, which are self-aligning and self-lubricating by incorporating polytetrafluoroethylene (PTFE) in a liner between the ball and race for use in the temperature range -65 to +325 °F (-54 to +163 °C).&lt;/div&gt;&lt;/div&gt;</p>
