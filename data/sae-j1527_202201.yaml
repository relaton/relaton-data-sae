  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies requirements for two types, three classes, and four styles of reinforced hose and non-reinforced tubing for conveying gasoline or diesel fuel aboard small craft including pleasure craft whose fuel systems are regulated under 33 CFR 183 Subpart J. SAE J1527 contains requirements for a Type A fire test of 2.5 minutes and defines a type B hose that is not fire resistant.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Refer to SAE J1942 for commercial marine non-metallic flexible hose or hose assemblies used in systems on board commercial vessels inspected and certified by the U.S. Coast Guard. SAE J1942 defines a type A fire resistance test of 2.5 minutes and a type B test of 30 minutes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Refer to SAE J2046 for fuel hose used on personal watercraft.&lt;/div&gt;



    &lt;/div&gt;</p>
