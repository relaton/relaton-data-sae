  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of these compliance procedures is to generate one or more test documents that outline the tests needed to assure that an ECU that is designed to operate as a node on a SAE J1939 network would do so correctly. SAE does not certify devices and these tests and their results do not constitute endorsement by SAE of any particular device. These tests are presented to allow testing of a Device to determine self-compliance by the manufacturer of a device. The manufacturer can use its record of what procedures were run successfully to show the level of compliance with SAE J1939.&lt;/div&gt;&lt;/div&gt;</p>
