  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Incidents where a piece of ground support equipment or personnel damages an aircraft under the control of ground or maintenance operations that requires corrective action by aircraft maintenance personnel. Operations include, but are not limited to servicing, line maintenance, heavy maintenance, and aircraft movement, e.g., marshalling/pushback/tow/reposition/taxi.&lt;/div&gt;
    &lt;/div&gt;</p>
