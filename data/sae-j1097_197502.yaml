    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard applies to hydraulic excavators which are either crawler or rubber-tire mounted, with or without outrigger members. (An excavator is defined as "a self-propelled machine with an upper structure capable of continuous rotation and which digs, elevates, swings, and dumps material by action of the boom and arm or telescoping boom with bucket.")&lt;/div&gt;&lt;/div&gt;</p>
