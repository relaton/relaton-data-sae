  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The terms included in the Glossary are general in nature and may not apply to all manufacturers’ systems. All terms in &lt;span class="xref"&gt;Section 3&lt;/span&gt; apply to automotive inflatable restraint systems in general which are initiated by an electric or mechanical stimulus upon receipt of a signal from a sensor.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These terms are intended to reflect existing designs and the Glossary will be updated as information on other types of systems becomes available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Appendix A is included to identify terminology that is no longer in common use or specifically applicable to inflatable restraint systems, but was published in the December 2001 version of SAE J1538.&lt;/div&gt;&lt;/div&gt;</p>
