  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines a recommended practice for addressing metal additive manufacturing (AM) machine requalification for all fusion-based metal AM machines. In general, this applies to powder bed fusion (PBF) and wire- or powder-fed directed energy deposition (DED) technologies. Plasma, electron beam, or lasers are applicable energy source(s).&lt;/div&gt;
    &lt;/div&gt;</p>
