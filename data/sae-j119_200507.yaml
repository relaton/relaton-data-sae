  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method is designed to determine the suitability of a painted or unpainted fiberboard for application involving creasing and bending. The specific purpose of the test is to determine whether a given material, properly creased, can be bent along the impressed crease without objectionable failure on the surface of the bend.&lt;/div&gt;
    &lt;/div&gt;</p>
