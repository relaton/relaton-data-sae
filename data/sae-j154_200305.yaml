abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard defines the minimum normal operating space envelope for clothed seated (SAE J899 seat configuration) and standing operators (95th percentile operator, SAE J833).
    This document applies to off-road, self-propelled work machines used in construction, general purpose industrial, agricultural, and forestry as identified in SAE J1116.
    Purpose
    This document defines dimensions for the minimum normal operating space envelope around the operator for operator enclosures (cabs, ROPS, FOPS) on off-road machines.</p>
