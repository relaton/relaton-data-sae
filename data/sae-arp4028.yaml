  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure is intended to apply to all engine or airframe mounted fuel pumps and controls when required by the applicable specification. The procedure recommends a recirculation system similar to ARP492 to control the fuel properties affecting the fluid and its ability to "release" fuel vapors and dissolved air and have these "re-entrained or dissolved" during the fluid recovery process back to the tank and the original starting conditions.&lt;/div&gt;&lt;/div&gt;</p>
