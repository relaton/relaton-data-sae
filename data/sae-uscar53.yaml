  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The provisions of this document, attachments, and supplements apply to the creation of a universal methodology for data communication, machine language, and reporting to and from manufacturing devices in the automotive production (Smart Manufacturing) environment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Universal connectivity is one of the foundational technologies enabling data sharing among participating components of an Industrial Internet of Things (IIoT) system. Connectivity provides the ability to exchange data among participants within a functional domain, across functional domains within a system, and across systems. The data exchanged may include sensor updates, events, alarms, status changes, commands, and configuration updates. Connectivity is a crosscutting function in the Industrial Internet Reference Architecture. It provides the ability to exchange data between participants within and across functional domains (control, operations, information, applications, and business).&lt;/div&gt;&lt;/div&gt;</p>
