  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard covers fuel, oil, or emission hose for use in coupled and uncoupled applications, for use with gasoline, oil, diesel fuel, lubrication oil, or the vapors present in either the fuel system or in the crankcase of internal combustion engines in mobile or stationary applications. This standard covers the hose portion only. If assembly / coupling is required, that is to be agreed to between the customer and assembler, along with the specific requirements.&lt;/div&gt;&lt;/div&gt;</p>
