  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The allowable leakage for hydraulic components has been documented in various military specifications concerning components. The leakage requirements given in the military specifications are intended in part to control the quality, assembly and proper functioning of the components. However, components that are in service sometimes develop leakage rates in excess of the specified amount. &lt;u&gt;This does not necessarily imply that the components have degraded to a degree that they no longer provide reliable operation or that they would be detrimental to the system&lt;/u&gt;. The intent of this ARP is to establish a level of allowable leakage that will be applicable only to in-service hydraulic components. It is hoped that this will result in minimizing what is often the unnecessary removal of hydraulic components from an aircraft.&lt;/div&gt;&lt;/div&gt;</p>
