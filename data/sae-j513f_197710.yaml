  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers complete general and dimensional specifications for refrigeration tube fittings of the flare type specified in &lt;span class="xref"&gt;Figs. 1&lt;/span&gt;-&lt;span class="xref"&gt;42&lt;/span&gt; and &lt;span class="xref"&gt;Tables 1&lt;/span&gt;-&lt;span class="xref"&gt;16&lt;/span&gt;. These fittings are intended for general use with flared annealed copper tubing in refrigeration applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensions of single and double 45 deg flares on tubing to be used in conjunction with these fittings are given in Fig. 2 and Table 1 of SAE J533.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data contained in &lt;span class="xref"&gt;Tables 1&lt;/span&gt;-&lt;span class="xref"&gt;16&lt;/span&gt; with respect to all unspecified detail.&lt;/div&gt;&lt;/div&gt;</p>
