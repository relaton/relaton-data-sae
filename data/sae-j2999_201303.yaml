    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides a method for determining the Effective Projected Luminous Lens Area (EPLLA) of a lamp function using design analysis. This standard was created to clarify and address how to determine EPLLA with traditional and new technologies. Lamps can be evaluated using the method described in SAE J3333; however, no lamp is subjected to both methods.&lt;/div&gt;&lt;/div&gt;</p>
