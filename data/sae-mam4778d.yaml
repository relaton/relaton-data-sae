abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This specification covers a nickel alloy in the form of wire, rod, strip, foil, and powder and a viscous mixture (paste) of the powder in a suitable binder and procured in metric units.&lt;/p&gt;
    &lt;p&gt;AMS 4778 is the inch/pound version of this MAM.&lt;/p&gt;
    &lt;p&gt;This filler metal has been used typically for joining corrosion and heat resistant steels and alloys requiring corrosion and oxidation resistant joints with good strength at elevated temperatures, but usage is not limited to such applications. Also may be used as a corrosion and oxidation resistant hard coating.&lt;/p&gt;</p>
