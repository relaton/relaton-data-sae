    &lt;div class="htmlview paragraph"&gt;Included in this SAE Standard are the detailed general and dimensional specifications applicable to flanged 12-point screws recognized as SAE Standard and intended for general use in automotive and other ground-based vehicles and industrial equipment.&lt;/div&gt;
