abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for the following types of self locking nuts:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wrenching nuts: i.e., hex, double hex, spline drive.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Anchor nuts: i.e., plate nuts, gang channel nuts, shank (clinch) nuts.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The wrenching nuts, shank nuts, and nut elements of plate and gang channel nuts are made of corrosion and heat resistant nickel alloy of the type identified under the Unified Numbering System as UNS N07001.&lt;/div&gt;&lt;/div&gt;</p>
