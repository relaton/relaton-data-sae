  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines the method for voltage identification by use of color coded insulators at the base of the lamp. &lt;span class="xref"&gt;Table 1&lt;/span&gt; shows lamp part numbers and corresponding insulator colors. Insulator colors are to be easily distinguishable as red, yellow, and green. &lt;span class="xref"&gt;Tables 2&lt;/span&gt; and &lt;span class="xref"&gt;3&lt;/span&gt; show complete descriptions of the lamps involved for the T1-3/4 and T1 lamps respectively. New lamp part numbers may be added by a revision process as required.&lt;/div&gt;&lt;/div&gt;</p>
