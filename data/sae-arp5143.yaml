  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) describes methods of vacuum bagging, a process used to apply pressure in adhesive bonding and heat curing of thermosetting epoxy and polyester matrix fabrications for commercial aircraft composite parts. If this document is used for the vacuum bagging of other than thermosetting epoxy and polyester materials, the fitness for this purpose must be determined by the user.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The methods shall only be used when specified in an approved repair document or with the agreement of the Original Equipment Manufacturer (OEM) or regulatory authority.&lt;/div&gt;
    &lt;/div&gt;</p>
