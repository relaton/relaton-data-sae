  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established manufacturing tolerances applicable to aluminum-base and magnesium-base alloy extruded bar, rod, wire, shapes, and tubing. Tolerances greater than standard may be necessary for some shapes; tolerances closer than standard may be possible for others. Tolerances shown herein, however, apply unless otherwise agreed upon by purchaser and vendor and apply to all tempers, unless otherwise noted. The term "excl" is used to apply only to the higher figure of the specified range. The general temper designations "-TX510" and "-TX511" are used for brevity and denote the full temper designations -T3510, -T4510, -T6510, -T8510, -T73510, -T76510, -T3511, -T4511, -T6511, -T8511, -T73511, and -T76511, the "X" representing one or more digits preceding the "510" or "511". Dimensions in U.S. conventional units are primary; dimensions in SI units are shown as the equivalent of the inch/foot/degree dimensions and are not to be construed as standard for product produced to SI dimensions.&lt;/div&gt;&lt;/div&gt;</p>
