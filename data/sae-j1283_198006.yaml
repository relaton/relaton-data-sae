  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the details, dimensions, and design of the parts of both &lt;i&gt;plug&lt;/i&gt; and &lt;i&gt;receptacle&lt;/i&gt; which must mate properly to permit interchangeable use of different makes of connectors. It provides the auxiliary starting circuit of the machine with a universal connecting device, fool-proof polarity, standard circuit coding, and protection for the wiring and equipment from electrical shorts.&lt;/div&gt;&lt;/div&gt;</p>
