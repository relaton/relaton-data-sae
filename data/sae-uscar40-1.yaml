  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This guideline is applicable to existing lead solder production products that will change to lead-free solder processes to meet the ELV Directive 2000/53/EC Annex II, exemption 8B requirements. This guideline is applicable to similar products used by multiple OEM's that have the same manufacturing processes / equipment. The intent is to streamline the supplier’s environmental testing via common qualification to reduce timing, quantities, and costs.&lt;/div&gt;&lt;/div&gt;</p>
