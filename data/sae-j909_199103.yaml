    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard sets forth the dimensions for the attachment of standard three-point hitch implements or equipment to the rear of agricultural wheeled tractors equipped with a standard three-point free-link hitch and quick-attaching coupler. It does not provide for interchangeability between tractors and couplers.&lt;/div&gt;


