  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the performance test procedures and requirements of a plastic reservoir assembly suitable for use on a Hydraulic Brake Master Cylinder (reference SAE J1153). Intended usage is for on-road vehicles using brake fluid conforming to FMVSS 116 (DOT 3), SAE J1703, and SAE J1704 specifications. This document includes the cap/cover and diaphragm as integral parts of the reservoir assembly. The fluid level sensor (FLS) is also included as an integral part of the assembly. However, additional FLS standards and/or requirements are applicable and necessary which are not covered in this document.&lt;/div&gt;
    &lt;/div&gt;</p>
