  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard(AS) provides general information for the interpretation and clarification ofengineering drawing requirements relating to the manufacture and inspection of fluid system couplings, tube fittings, and hose ends. Because it is impractical to define every minute detail of the part on the face of the drawing, this standarddescribes interpretations of dimensioning of general machining features and otherwise undefined tolerances that fall under the heading of “good shop practice”. This standard is supplemental to ASME Y14.5M-1994 and explains, defines and interprets drawing terms or practices that are not addressed by, ASME Y14.5M-1994. Unless otherwise specified in this standard, drawing interpretations contained in ASME Y14.5M-1994 shall apply.&lt;/div&gt;&lt;/div&gt;</p>
