    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This technical report provides design parameters, performance requirements, and general installation recommendations for supplemental high-mounted stop and/or rear turn-signal lamps, intended to supplement stop and/or rear turn-signal lamps described in SAE J586 SEP77 and SAE J588 NOV78, for use on vehicles less than 2032 mm in overall width. It is intended that a separate technical report will be prepared for motor vehicles 2032 mm or more in overall width.&lt;/div&gt;&lt;/div&gt;</p>
