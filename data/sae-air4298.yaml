  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) describes equivalent type equipment and operational guidelines for a standard sine wave impulse test machine. The machine may be used for testing hydraulic tubing, fittings, hose assemblies, and similar fluid system components, if desired.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The standard sine wave impulse test machine is established for the following purposes:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A design guide for future machines being built by manufacturers and users.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;As a referee in the event of conflicting data from two or more nonstandard impulse machines. Such a referee machine might be built by an impartial testing activity.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
