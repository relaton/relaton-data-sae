    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide a glossary of radial seal terms and nomenclature which are normally encountered in the design, manufacture, installation, testing, inspection, and failure mode analysis of radial seals. The information will aid in the understanding and communication of hose people associated with radial seals.&lt;/div&gt;&lt;/div&gt;</p>
