    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a titanium alloy in the form of preforms and parts produced by electron beam-powder bed fusion (EB-PBF) that are subjected to post-deposition hot isostatic press (HIP). Preforms may require subsequent machining or surface finishing to meet requirements for their intended final part application.&lt;/div&gt;&lt;/div&gt;</p>
