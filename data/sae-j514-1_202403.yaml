  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This part of SAE J514 covers general and dimensional specifications for 37 degree flared tube fittings. Also included are 37 degree flared fittings with NPTF pipe threads in &lt;span class="xref"&gt;Appendix B&lt;/span&gt;. These fittings are intended for general application in hydraulic systems on industrial equipment and commercial products.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These fittings are capable of providing leak-proof, full flow connections in hydraulic systems operating at working pressures as specified in &lt;span class="xref"&gt;Table 6&lt;/span&gt;. Since many factors influence the pressure at which a hydraulic system will or will not perform satisfactorily, the values shown in &lt;span class="xref"&gt;Table 6&lt;/span&gt; should not be construed as a guaranteed minimum.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For any application, it is recommended that sufficient testing be conducted and reviewed by both the user and fitting manufacturer to assure that performance levels will be safe and satisfactory.&lt;/div&gt;&lt;/div&gt;</p>
