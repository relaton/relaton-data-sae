abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following off-highway vehicles commonly used in earth- moving, construction, logging, and industrial applications are included (pneumatic-tired agricultural vehicles and vehicles whose use is predominantly, or entirely, in manufacturing plants and/or warehouses are specifically excluded):&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Track-type tractors of mass greater than 700 kg (1540 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Pneumatic-tired, self-propelled motor graders of mass greater than 700 kg (1540 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(c)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Pneumatic-tired front-end loaders and dozers of mass greater than 700 kg (1540 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(d)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Pneumatic-tired prime movers of mass greater than 700 kg (1540 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(e)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Pneumatic-tired, off-highway, nontrailed hauling units, with rear or side dump bodies, of mass greater than 700 kg (1540 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(f)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Four-wheel drive, skid steer, front-end loaders of mass greater than 700 kg (1540 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(g)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Industrial-type, wheeled front-end loaders and dozers of mass greater than 700 kg (1540 lb).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
