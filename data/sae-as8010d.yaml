  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines the minimum degree of purity and maximum levels of certain deleterious impurities allowable for aviator's breathing oxygen at the point of manufacture or generation. It covers gaseous, liquid, and chemically generated oxygen, and oxygen supplied by in situ concentration and in situ electrolysis.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Different limits are established for oxygen from different sources, in recognition of differences in the ways the oxygen is stored, dispensed, and utilized, taking into account the safety of the user. These limits are not intended to specifically reflect upon the relative capabilities or merits of various technologies. Procurement documents may specify more stringent limits, where required for specific applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Medical oxygen is not covered by this standard. In the United States, medical oxygen is a prescription drug and complies with the United States Pharmacopoeia (USP). In Europe, medical oxygen specification compiles with the European Pharmacopoeia monograph (Ph Eur 0417).&lt;/div&gt;&lt;/div&gt;</p>
