    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice outlines the static test procedure for the evaluation of the performance of seat belt anchorages attached to vehicle structure or to seat assemblies installed in the vehicle. (This SAE Recommended Practice supersedes the Test Procedure Section of SAE J787b.) Design recommendations and performance requirements are specified in the Recommended Practices SAE J383 and SAE J385, respectively.&lt;/div&gt;&lt;/div&gt;</p>
