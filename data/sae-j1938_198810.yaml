    &lt;div class="htmlview paragraph"&gt;The following subjects reflect the automotive environment and are based on good engineering practices and past ("lessons learned") experiences. Since it is impossible to be all inclusive and cover every aspect of quality and reliability, this document should be used as a guide for preparation of a checklist that reflects the accumulated "lessons learned" at a particular company.&lt;/div&gt;&lt;/div&gt;</p>
