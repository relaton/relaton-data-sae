  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following schematic diagrams exemplify the SAE recommended method of illustrating automotive transmission arrangements. They were developed to standardize industry practice and facilitate a clear understanding of the functional interrelations of the gearing, clutches, hydrodynamic drive unit, and other transmission components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Two variations of diagrams are used: Transmission in neutral and in gear. For illustrative purposes, some typical transmissions are shown.&lt;/div&gt;&lt;/div&gt;</p>
