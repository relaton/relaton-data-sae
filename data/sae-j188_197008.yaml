abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This specification covers two types of hose fabricated from fabric braid and synthetic rubber, assembled with end fittings for use in automotive power steering applications as flexible connections within the temperature range of –40 to +121 C (–40 to +250 F) average, + 149 C (+ 300 F) maximum peaks.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These hoses are intended for use in applications where reduction in amplitude of pump pressure pulsations is required.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Type 1 hose shall be suitable for 1500 psi maximum working pressure.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Type 2 hose shall be suitable for 1300 psi maximum working pressure.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
