  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP is a system guide for Engine Monitoring System (EMS) definition and implementation. This keystone document addresses EMS benefits, capabilities and requirements. It includes EMS in-flight and ground applications of people and equipment, and recommends EMS requirements that are a balance of selected benefits and available capabilities. This ARP purposely addresses a comprehensive EMS. The intent is to provide an extensive list of possible EMS design options.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;-&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 3&lt;/span&gt; describes an EMS.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;-&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Sections 4&lt;/span&gt; and &lt;span class="xref"&gt;5&lt;/span&gt; outline benefits and capabilities that should be considered for study purposes to define EMS baselines for how much or how little engine monitoring might be required.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;-&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 6&lt;/span&gt; provides implementation requirements that should be considered for an EMS after study baseline levels of EMS complexity are selected.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
