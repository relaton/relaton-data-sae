abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The fluid flow treated in this section is isothermal, subsonic, and incompressible. The effects of heat addition, work on the fluid, variation in sonic velocity, and changes in elevation are neglected. An incompressible fluid is one in which a change in pressure causes no resulting change in fluid density. The assumption that liquids are incompressible introduces no appreciable error in calculations, but the assumption that a gas is incompressible introduces an error of a magnitude that is dependent on the fluid velocity and on the loss coefficient of the particular duct section or piece of equipment. &lt;span class="xref"&gt;Fig. 1A-1&lt;/span&gt; shows the error in pressure drop resulting from assuming that air is incompressible.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;With reasonably small loss coefficients and the accuracy that is usually required in most calculations, compressible fluids may be treated as incompressible for velocities less than Mach 0.2. At higher velocities and for large loss coefficients (&lt;i&gt;K&lt;/i&gt;&lt;sub&gt;&lt;i&gt;t&lt;/i&gt;&lt;/sub&gt; and 4&lt;i&gt;fL&lt;/i&gt;/&lt;i&gt;D&lt;/i&gt;), compressible flow analysis should be used.&lt;/div&gt;
    &lt;/div&gt;</p>
