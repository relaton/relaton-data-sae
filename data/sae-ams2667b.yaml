  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the engineering requirements for production of brazed joints between flexible metal hose, and similar parts such as bellows, and rigid end fittings and the properties of such joints. Parts are usually made of austenitic corrosion and heat resistant steels but may be carbon or low-alloy steels.&lt;/div&gt;&lt;/div&gt;</p>
