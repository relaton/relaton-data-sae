abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test procedure is intended to apply to hydraulic pump suction filters and strainers used in automotive automatic transmissions that include hydraulic power pumps. The various paragraphs of &lt;span class="xref"&gt;Section 5&lt;/span&gt; include a variety of tests and alternative tests that are not applicable to all filters and applications, so the engineer must specify which tests are to be performed for a particular application. These test procedures are intended to evaluate filter functional performance characteristics only, durability is not evaluated under this standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Filter design requirements must be specified by the engineer on the filter assembly drawing, an applicable engineering specification, or summarized on an application data sheet similar to that found in this recommended practice. See &lt;span class="xref"&gt;Figure 6&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Pressure circuit filters, both barrier and system contamination control types, are not covered under this standard. They are similar in design and construction to filters used in many hydraulic and lubricating applications. Testing for pressure filters are covered by the ISO and SAE standards listed under references in &lt;span class="xref"&gt;Section 2&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
