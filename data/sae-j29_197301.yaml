  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides test methods and requirements to evaluate the suitability of plastic materials intended for use in housings of motor vehicle lighting devices including reflex reflectors. These tests are not intended to cover the performance of plastics when molded and installed in a finished assembly. Performance expectations of such a finished assembly, including its plastics components, are to be based on tests of devices as specified in SAE Standards and Recommended Practices for motor vehicle lighting devices.&lt;/div&gt;&lt;/div&gt;</p>
