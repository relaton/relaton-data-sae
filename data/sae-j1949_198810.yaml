  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the dimensional requirements for the assembly of high-pressure pipe connections for compression-ignition (diesel) engine fuel injection equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It applies to 60 degrees female cones with external threaded connectors types 1 and 2 (see &lt;span class="xref"&gt;Figures 1&lt;/span&gt;, &lt;span class="xref"&gt;2&lt;/span&gt;, and &lt;span class="xref"&gt;3&lt;/span&gt;), and to the internal threaded tube nuts and male cone type end assembly (see &lt;span class="xref"&gt;Figure 4&lt;/span&gt;) of high-pressure pipe connections for tubes with diameters up to 12 mm inclusive.&lt;/div&gt;&lt;/div&gt;</p>
