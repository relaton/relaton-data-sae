  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Included herein are general, dimensional, and performance specifications for those types, styles, and sizes of stamped nuts of one pitch thread design recognized as SAE Standard. These nuts are intended for general use where the engagement of a single thread on the mating screw or unthreaded stud is considered adequate for the application.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It should be noted that stamped nuts having other sizes and configurations are available and manufacturers should be consulted.&lt;/div&gt;&lt;/div&gt;</p>
