  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document includes the initial recommendations for a V2X-equipped host vehicle (eHV) or Roadside Equipment (RSE) that can broadcast a surrogate basic safety message (SBSM) on behalf of an unequipped remote vehicle (uRV). This document is published for testing only, using a Test PSID (e.g., 0x7f) and not the PSID used by SAE J2945/1 and SAE J3161/1 for standard basic safety message (BSM) transmission (0x20).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The basic principle is that the host system of the V2X capable device, whether on a host vehicle or an RSE, can determine whether detected vehicles are V2X enabled or not, and if not, formulate and broadcast messages on their behalf that describe their status to other V2X enabled devices. This document is based extensively on the V2V safety communication requirements in SAE J2945/1 and SAE J3161/1 and the supporting message set details in SAE J2735.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The initial version of this document is an information report. If feedback from implementations, testing, and simulation becomes available, this report may be updated to a recommended practice or standard. The performance, data quality, and corresponding population of message data fields need more consideration.&lt;/div&gt;&lt;/div&gt;</p>
