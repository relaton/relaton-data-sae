    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended to be used for the communication of spatial data references between central sites and mobile vehicles on roads. References can be communicated from central site to vehicles, or from vehicles to central sites. The document may also be used where appropriate by other ITS applications requiring location references between data sets.&lt;/div&gt;&lt;/div&gt;</p>
