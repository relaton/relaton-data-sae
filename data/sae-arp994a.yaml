  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides recommended practices for the design of tubing systems that are used for the transmission of liquid and gasses in fluid power systems for aerospace vehicles such as aircraft, missiles and boosters. The primary emphasis is given to recommended practices for line sizing, tube routing, supports and clamping, stress considerations and permissible defects, and provisions for flexure through the use of flexible hoses, coiled tubes, swivel joints, and expansion glands.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The sections regarding tubing materials and fitting types are included for reference, but particular recommendations are purposely avoided since their selection is dependent upon the specific requirements of each particular vehicle system and many other factors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Fluid power systems are differentiated from the normal aircraft fuel and oil systems and the various fluid systems used for environmental control and air conditioning systems; however, the practices cited herein will in many cases be applicable to these other systems.&lt;/div&gt;&lt;/div&gt;</p>
