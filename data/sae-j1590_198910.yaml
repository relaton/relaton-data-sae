    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Differences, where they exist, are shown in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document establishes a classification of materials intended for the manufacture of piston rings based on mechanical properties and the stresses that these materials are capable of withstanding.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to the manufacture of piston rings up to and including 200 mm diameter for reciprocating internal combustion engines. It also applies to piston rings for compressors working under similar conditions.&lt;/div&gt;&lt;/div&gt;</p>
