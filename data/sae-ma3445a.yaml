  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These products have been used in contact with air and a wide variety of fuels, lubricants, specific hydraulic fluids, and a variety of gas turbine engine lubricants, including higher thermo-oxidative stability (HTS) lubricants, including those conforming to MIL-PRF-23699 Class HTS, MIL-PRF-7808 Grade 4, and AS5780 Class HPC; however, usage is not limited to such applications. This material type has a typical service temperature range of -20 to +400 °F (-28 to +204 °C). These products are not suitable for use in phosphate ester based hydraulic fluids. Each application should be considered individually.&lt;/div&gt;&lt;/div&gt;</p>
