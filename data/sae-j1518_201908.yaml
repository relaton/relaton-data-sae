  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to three-point hitch (Type A) backhoes as defined in SAE J326 when mounted on either an agricultural tractor as defined in ANSI/ASAE S390 or other off-road self-propelled work machine as defined in SAE J1116. This criterion is intended for the manufacturer of the backhoe, whether or not the backhoe is manufactured or marketed by the same company that manufactures or markets the propelling machine.&lt;/div&gt;
    &lt;/div&gt;</p>
