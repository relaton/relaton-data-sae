    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers one type of copper in the form of bars, rods, and shapes. Requirements are provided for bar and rods up to 3.000 inches (mm) in nominal diameter, squares and rectangles with up to 4.000 inches (mm) least distance between parallel sides and shapes of any size (see &lt;span class="xref"&gt;8.6&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
