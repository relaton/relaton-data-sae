  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers high strength thin wall ratcheting box wrenches which possess the strength, clearances, and internal wrenching design so configured that, when mated with bihexagonal (12 point) fasteners conforming to the requirement of AS870 for inch sizes and ISO 4095 for metric sizes, they shall transmit torque to the fastener without bearing on the outer 5% of the fastener’s wrenching points.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Inclusion of dimensional data in this document is not intended to imply that all products described herein are stock production sizes. Consumers are requested to consult with manufacturers concerning lists of stock production sizes. The dimensional limits of box and combination wrench lengths have been established to provide configuration control for tool storage applications.&lt;/div&gt;
    &lt;/div&gt;</p>
