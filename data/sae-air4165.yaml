  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) serves a dual purpose. It enables the user (aircraft manufacturer/airline) to do the following:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To make a positive decision for the installation of a powered drive system in the cargo loading system during the definition of the aircraft on-board cargo loading system to be developed/procured.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To provide the user with general requirements to be taken into consideration during the preparation of component specifications for powered drive units (PDUs) to be used in aircraft cargo systems. This is to provide the author of such a component specification with a selection of criteria in order to obtain an optimum component suitable for the users’ applications.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
