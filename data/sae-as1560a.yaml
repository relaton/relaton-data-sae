  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the standard modules for aerospace metric involute gear teeth and establishes the tooth dimensions of aerospace metric involute gear teeth in terms of the conjugate rack type cutter whose counterpart reference profile is called the basic rack profile of the generated gear, having the tooth dimensions expressed in terms proportional to the module.&lt;/div&gt;&lt;/div&gt;</p>
