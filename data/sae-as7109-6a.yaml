    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) is to be used as a supplement to AS7109. In addition to the requirements contained in AS7109, the requirements contained herein shall apply to suppliers seeking Nadcap Coatings accreditation who are engaged in plating of coated parts. Demonstrated compliance (as described in AS7003) to AS7108 satisfies the requirements contained herein.&lt;/div&gt;&lt;/div&gt;</p>
