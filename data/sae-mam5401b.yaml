  content: |-
    <p>&lt;p&gt;This specification covers a corrosion and heat resistant, vacuum melted, nickel alloy in the form of investment castings.&lt;/p&gt;
    &lt;p&gt;AMS 5401 is the inch/pound version of this MAM.&lt;/p&gt;
    &lt;p&gt;These castings have been used typically for structural parts requiring moderate strength up to 870 degrees C and oxidation and corrosion resistance up to 980 degrees C, but usage is not limited to such applications.&lt;/p&gt;</p>
