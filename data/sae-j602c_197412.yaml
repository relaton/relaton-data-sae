abstract:
- language: en
  script: Latn
  content: |-
    <p>This document applies to the requirements of a device used in the field and inspection stations to aim and check aim of mechanically aimable headlamp units.

    The purpose of this document is to provide a  laboratory test procedure to determine whether the devices under test are capable of accurately positioning headlamp units from their aiming pads and maintaining their accuracy in service within the tolerances designated in this document.</p>
