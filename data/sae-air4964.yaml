  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Long wave ultraviolet or UV-A radiation (between 320 to 400 nm) is used for fluorescent inspections in magnetic particle and liquid penetrant examinations. The UV-A radiation is obtained from either fluorescent or high intensity discharge lamps that are stationary or portable. The commercially available UV-A lamps possess a large variation in intensity output that can cause a legitimate concern for possible health hazard. This draft reviews the nature of UV-A radiation emitted by these lights, blacklight equipment, acceptable UV dosage limits adopted by the American Conference of Governmental Industrial Hygienists (ACGIH) and the European Standards Committee for Nondestructive Testing, and recommendation of proper practices when working with UV-A radiation.&lt;/div&gt;&lt;/div&gt;</p>
