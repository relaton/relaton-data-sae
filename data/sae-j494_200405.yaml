abstract:
- language: en
  script: Latn
  content: "<p>Material-Cold drawn SAE 1112 or 1113 steel, alloy steel or copper alloy
    as specified by purchaser. Unless otherwise specified, steel pins shall have a
    flash plate of cadmium or zinc for protection of pins in  transit or storage.
    Grooved Straight Pins must be free from burrs and all other defects that might
    affect their use and serviceability.</p>"
