  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is applicable to the engineering or the reengineering of:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Commercial or non-commercial systems, or portions thereof;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Any system, small or large, simple or complex, software-intensive or not, precedented or unprecedented;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Systems made up of hardware, software, firmware, personnel, facilities, data, materials, services, techniques, or processes (or combinations thereof);&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A new system or a legacy system, or portions thereof.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;

    &lt;div class="htmlview paragraph"&gt;The requirements of this standard, or a designated subset, are intended to be applied by projects establishing policies and procedures for project implementation of the adopted process and process elements of this standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this standard may be tailored as follows:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Processes – Processes may be tailored to be applicable for a given type of project or system. For example, the System Utilization Processes typically don’t apply for conceptual or prototype systems in the same manner as for full-volume production systems.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Activities – Activities may be tailored to reflect the specific approach established by a project, where the modified Activities still achieve the intended Process Purpose and Process Outcomes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Tasks, Inputs, and Outputs – Tasks, Inputs, and Outputs may be tailored to reflect the specific approach or methods established by a project, including different life cycle approaches for a given project or system, where the modifications still achieve the intended purpose of the Activity.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
