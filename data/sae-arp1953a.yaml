    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To describe general guidelines for achieving selected levels of cleanliness in gas turbine engine fuel system components and to describe laboratory type methods for measuring and reporting the contamination level of the wetted portion of fuel system components. As in SAE J1227 (covering hydraulic components) this practice includes guidelines for levels of acceptance but does not attempt to set those levels.&lt;/div&gt;
