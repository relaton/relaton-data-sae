  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this Aerospace Recommended Practice (ARP) is to provide design recommendations for passenger cabin entry doors, service doors, and emergency exits. The objective is to have a reliable system standardized to make operation of the exits simple, quick and obvious to all occupants under normal and emergency conditions and facilitate qualification of cabin attendants for different airplanes.&lt;/div&gt;
    &lt;/div&gt;</p>
