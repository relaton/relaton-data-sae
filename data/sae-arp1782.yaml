    &lt;div class="htmlview paragraph"&gt;This ARP describes methods for measuring the visual performance of direct view cathode ray tube displays used in aircraft flight decks and cockpits. Procedures may vary depending upon the type of display (for example, monochrome, color shadowmask, beam index, etc.), but all types are considered.&lt;/div&gt;


