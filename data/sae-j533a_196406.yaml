  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers specifications for 37 deg and 45 deg single and double flares for tube ends intended for use with standard types of 37 deg flared tube fittings and 45 deg flared or inverted flared tube fittings, respectively.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensions for single and double 45 deg tubing flares are given in &lt;span class="xref"&gt;Fig. 1&lt;/span&gt; and &lt;span class="xref"&gt;Table I&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensions for single and double 37 deg tubing flares are given in &lt;span class="xref"&gt;Fig. 2&lt;/span&gt; and &lt;span class="xref"&gt;Table 2&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data with respect to unspecified detail and apply to both 37 deg and 45 deg tubing flares.&lt;/div&gt;&lt;/div&gt;</p>
