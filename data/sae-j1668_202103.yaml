  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The correct setting and adjustment of fuel injection pumps requires standardized testing conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard summarizes the design and operating parameters for test benches so that, using certain information supplied by the pump manufacturer, the pump test schedule, and certain information supplied by the test bench manufacturer, it can be determined whether a particular test bench is suitable for driving a particular injection pump.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is in most cases a summary of the ISO Standard 4008, Parts 1, 2, and 3 and is intended to provide its critical aspects. Standard ISO 4008 should be referred to for more details.&lt;/div&gt;
    &lt;/div&gt;</p>
