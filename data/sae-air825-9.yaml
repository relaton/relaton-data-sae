  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) describes the general operating principles of demand oxygen equipment, including variant types such as diluter-demand and pressure breathing equipment. The sources of oxygen supply that can be used in connection with a demand oxygen mask are in principle the same as those used for other oxygen dispensing devices. Except for mention of a few features specifically related to demand equipment, this document does not discuss oxygen sources in detail and the reader is advised to consult other applicable documents that describe the operation of oxygen sources for additional information.&lt;/div&gt;&lt;/div&gt;</p>
