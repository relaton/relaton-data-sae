    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established manufacturing tolerances applicable to sheet, strip, and plate of corrosion and heat resistant steels, iron alloys, titanium, and titanium alloys ordered to inch dimensions. These tolerances apply to all conditions, unless otherwise noted. The term “excl” is used to apply only to the higher figure of the specified range.&lt;/div&gt;&lt;/div&gt;</p>
