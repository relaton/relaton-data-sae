  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) describes the design approaches used for current applications of aircraft Brake-by-Wire (BBW) control systems. The document also discusses the experience gained during service, and covers system, ergonomic, hardware, and development aspects. The document includes the lessons that have been learned during application of the technology.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Although there are a variety of approaches that have been used in the design of BBW systems, the main focus of this document is on the current state of the art systems.&lt;/div&gt;
    &lt;/div&gt;</p>
