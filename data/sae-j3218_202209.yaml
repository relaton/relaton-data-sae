  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers beam axles utilizing hypoid gear final drives. It is a component level test, performed with three dynamometers in a “T-cell” arrangement. It includes both an efficiency characterization method, as well as a break-in method to support efficiency characterization. It was developed for beam axles used in light truck applications but may be extended to other hypoid gear drive systems.&lt;/div&gt;
    &lt;/div&gt;</p>
