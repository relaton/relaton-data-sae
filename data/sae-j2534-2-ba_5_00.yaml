  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J2534-1_0500 defines the pass-thru interface requirements for the reprogramming of emission related control modules.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE J2534-2/X_0500 document set adds extensions to the SAE J2534-1_0500 API (version 05.00) specification so that the API can be used for features not covered in the SAE J2534-1_0500 specification. Together, these features provide a comprehensive framework for a common standard, to protect the software investment of the vehicle OEMs and scan tool manufacturers. There is no required for an SAE J2534-2/X_0500 pass-thru interface to be fully compliant with SAE J2534-1_0500. SAE J2534-2/X_0500 interfaces can implement some or all of the features specified in the SAE J2534-2/X_0500 document set.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document must be used in conjunction with the SAE J2534-2/RE_0500 document.&lt;/div&gt;
    &lt;/div&gt;</p>
