    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This practice provides a method for evaluating microhardness and microstructure very close (0.002 inch (0.051 mm) or less) to the surface of a disk specimen. Specific accept/reject criteria for partial decarburization (&lt;span class="xref"&gt;3.7.1&lt;/span&gt;), inadvertent carburization/nitriding (3.7.3), total decarburization/intergranular oxidation (&lt;span class="xref"&gt;3.8&lt;/span&gt;), and other characteristics evaluated are to be found in the applicable specification where this ARP is referenced.&lt;/div&gt;&lt;/div&gt;</p>
