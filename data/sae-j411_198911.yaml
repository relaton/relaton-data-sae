abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the processing and fabrication of carbon and alloy steels. The basic steelmaking process including iron ore reduction, the uses of fluxes, and the various melting furnaces are briefly described. The various types of steels: killed, rimmed, semikilled, and capped are described in terms of their melting and microstructural differences and their end product use. This document also provides a list of the commonly specified elements used to alloy elemental iron into steel. Each element's structural benefits and effects are also included. A list of the AISI Steel Products Manuals is included and describes the various finished shapes in which steel is produced.&lt;/div&gt;&lt;/div&gt;</p>
