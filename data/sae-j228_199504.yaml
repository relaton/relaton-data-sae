    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to establish reference standards for airflow measurements in the ranges required for testing automotive engine induction systems and to describe equipment that will facilitate the use of such standards to check the accuracy of various equipment and methods.&lt;/div&gt;&lt;/div&gt;</p>
