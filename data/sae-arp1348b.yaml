  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) applies to airline trailer equipment with four wheel running gear pulled and steered through an integral tow bar, for use on airport ramps and other airport areas for transporting baggage, freight, and other materials. This ARP can apply to any airline/airport trailer chassis regardless of its equipment; the trailer bed can be designed to carry either bulk baggage/cargo, or a cargo unit load device by means of a rollerized conveyor system, or a piece of aircraft servicing equipment (e.g., ground power unit, air start unit, etc.).&lt;/div&gt;
    &lt;/div&gt;</p>
