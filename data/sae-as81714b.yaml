  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers Terminal Junction System (TJS) components which are used for interconnection of wiring and incorporation of passive components (see &lt;span class="xref"&gt;6.1&lt;/span&gt;). These environment resistant components have in common the use of crimp type external pin contacts in accordance with AS39029/1 for Series I or crimp type external socket contacts in accordance with AS39029/22 for Series II. This family of TJS components is designed to operate continuously over a temperature range of -65 to 200 °C, using any combination of temperatures generated by the electrical load and ambient temperature so that the maximum internal hot spot, combined temperature, will not exceed the maximum specified for the class of TJS component, unless otherwise specified (&lt;span class="xref"&gt;1.2&lt;/span&gt;, &lt;span class="xref"&gt;3.1&lt;/span&gt;). The components making up the system and covered by this specification include:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Terminal junction bussing blocks (6.8.2)
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(1)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Feedback type (6.8.2.1)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(2)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Feedthrough type (6.8.2.2)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Racks (mounting holders) for blocks (6.8.3)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Brackets, block mounting (6.8.4)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wire in-line junctions (6.8.5)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Grounding terminal (6.8.6)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Grounding blocks (6.8.7)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;g&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Electronic blocks (6.8.8)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;h&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Electronic in-line junctions (6.8.9)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;



    &lt;/div&gt;</p>
