    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procurement specification covers retaining rings of the spiral wound type with uniform rectangular cross-section, made of a corrosion and heat resistant age hardenable iron base alloy of the type identified under the Unified Numbering System as UNS S66286, work strengthened and heat treated to a tensile strength of 185 to 240 ksi at room temperature.&lt;/div&gt;&lt;/div&gt;</p>
