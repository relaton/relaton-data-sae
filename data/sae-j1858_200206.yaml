abstract:
- language: en
  script: Latn
  content: "<p>This standard establishes a multipass filtration performance test with
    continuous contaminant injection for lubricating oil filter  elements. It also
    includes a procedure for determining the contaminant capacity, particulate removal
    characteristics, and pressure loss. It also includes a test currently applicable
    to lubricating oil filter elements which exhibit a 10 µm filtration ratio of less
    than 75 and a rated flow between 4 and 600 L/min. This standard provides a test
    procedure which yields reproducible test data for evaluating the filtration performance
    of a lubricating oil filter element.</p>"
