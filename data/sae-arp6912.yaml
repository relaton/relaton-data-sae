  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) identifies and defines methods of compliance with power available and inlet distortion requirements for rotorcraft with inlet barrier filter (IBF) installations. The material developed herein is intended to provide industry-recommended methods of compliance with civil airworthiness regulations. It is intended to serve as a basis for new or revised FAA advisory material describing acceptable methods for determining power assurance, establishing power available, and for substantiating acceptable engine inlet distortion for IBF installations. The ARP does not address other types of inlet protection systems such as inertial separator, electrostatic precipitators, or foreign object debris (FOD) screens. It is agreed to treat dust, ice, salt, water, and snow as contaminants to the IBF for the purpose of establishing power available and assessing inlet distortion, but any other effects of ice and snow on inlet airworthiness are outside the scope of this ARP.&lt;/div&gt;&lt;/div&gt;</p>
