  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for suppliers of coatings services to be accredited by Nadcap in accordance with AS7003. The requirements contained herein may be supplemented by additional requirements specified by Nadcap Coatings Task Group. Using the audit checklist (PRI AC7109) will ensure that accredited Coatings suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;&lt;/div&gt;</p>
