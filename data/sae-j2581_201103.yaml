  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information report defines the thermal transport properties important in the assessment of heat management capability of brake lining, shoe, disc and drum materials. The report discusses thermal diffusivity, specific heat capacity, thermal conductivity and thermal expansion. Measurement techniques for the appropriate ASTM standards are identified. The thermal transport properties discussed are material sample properties, not the properties of entire components such as pad assemblies.&lt;/div&gt;&lt;/div&gt;</p>
