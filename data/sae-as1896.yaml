    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for aircraft, hydraulic couplings, self sealing one side only, for use in Type II hydraulic systems (-65°F to +275° temperature range) as defined by MIL-H-5440. The purpose being to connect a hose or tube to a standard MS33656, MS33514 or MIL-F-85421 fitting and provide the self sealing feature on that side only.&lt;/div&gt;&lt;/div&gt;</p>
