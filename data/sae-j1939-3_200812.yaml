  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1939-03 provides requirements and guidelines for the implementation of On Board Diagnostics (OBD) on heavy-duty vehicles (HDV) using the SAE J1939 family of standards. The guidelines identify where the necessary information to meet OBD regulations may be found among the SAE J1939 document set. Key requirements are identified here to insure the interoperability of OBD scan tools across individual OBD compliant vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Market-defined regulations permit the use of SAE J1939 to meet OBD requirements. Implementers are cautioned to obtain and review the specific regulations for the markets where their products are sold. This document is focused on guidelines and requirements to satisfy the State of California Air Resources Board (ARB), the authors of 13 CCR 1971.1, United States Environmental Protection Agency, Euro IV and V requirements from European Commission directives, and UN/ECE WP 29 GRPE WWH OBD Global Technical Regulation (GTR)&lt;/div&gt;&lt;/div&gt;</p>
