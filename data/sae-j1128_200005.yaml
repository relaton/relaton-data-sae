    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers low tension primary cable intended for use at a nominal system voltage of 60 V DC (25 V AC) or less in surface vehicle electrical systems. The tests are intended to qualify cables for normal applications with limited exposure to fluids and physical abuse.&lt;/div&gt;&lt;/div&gt;</p>
