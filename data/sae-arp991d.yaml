  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the recommended lighting performance and design criteria for:&lt;/div&gt;
    &lt;ul class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Left Forward Navigation Position Lights (Red)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Right Forward Navigation Position Lights (Green)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Rear Navigation Position Lights (White)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Anticollision Lights. AS8017 provides for the following classes: Class I Rotorcraft, Class II Fixed Wing, and Class III Fixed Wing and Rotorcraft. Possible design requires include but are not limited to:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Red Flashing Lights Top and Bottom Fuselage&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;White Flashing Strobe Lights Wing Tips and/or Tail&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Red Flashing Beacon Light on Top of Vertical Tail&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;</p>
