    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard includes only those towing winches commonly used on skidders and crawler tractors. These winches are used on self-propelled machines described in SAE J1057, J1116, and J1209. Specifically excluded are those winches used for hoisting operations.&lt;/div&gt;
