  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The reader of specifications sometimes needs some help understanding the format of an AMS and reasoning behind certain usage of terms. The scope of this AIR is to explain the functions of the various sections of the specifications, why some of the terms in AMS specifications are used, and how the specification system works. After the introduction (&lt;span class="xref"&gt;Section 3&lt;/span&gt; of this document), the topics are presented in the order they usually appear in specifications.&lt;/div&gt;&lt;/div&gt;</p>
