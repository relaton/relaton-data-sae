    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intention of this standard is to establish a framework to measure the efficiency of PWM HVAC Blower Controllers and Brushless DC Motor Controllers and define a usage based overall efficiency. This result can then be used by vehicle OEMs to demonstrate compliance towards requirements or benchmarks established by regulatory agencies.&lt;/div&gt;&lt;/div&gt;</p>
