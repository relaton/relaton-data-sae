  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this test procedure is to provide a uniform method of testing ball stud and socket assemblies to determine their performance characteristics. This procedure is an extension of the dimensional requirements for ball stud assemblies as used in integral assembly. Parts should meet all provisions of this procedure which are applicable to the end use of the socket assembly being tested. All tests, except ball stud yield load, may be run using complete integral assemblies representing the application.&lt;/div&gt;&lt;/div&gt;</p>
