    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended for use only in characterizing test surfaces used in motorcycle side stand retraction testing (SAE J1578). The equipment and procedure described in this document yields repeatable results in characterizing test surfaces in a way found to be related to retraction performance. The test results obtained with this procedure do not necessarily correlate with measurements obtained with other friction measurement procedures which have been developed for other purposes.&lt;/div&gt;
    &lt;/div&gt;</p>
