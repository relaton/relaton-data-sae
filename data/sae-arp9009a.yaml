  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) specifies for quality requirements that are additive to a procurement document or contract, where an organization:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;needs to provide additional guidance for suppliers and other organizations in the delivery of products, goods and services in accordance with stated quality demands, and&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;needs to provide information in addition or in absence of existing quality system requirements to provide the assurance of conformity to customer and applicable regulatory requirements.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: In this ARP, the term ‘product’ applies only to the product intended for, or required by, a customer.&lt;/div&gt;&lt;/div&gt;</p>
