  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers permanent marking intended to be easily and accurately read during the normal service life of the item and also covers temporary marking intended to provide legible identification and/or record of inspection up to the time of initial assembly or use. It defines and controls marking of finished, semi-finished, and rough items but does not attempt to establish identification for raw materials such as bar, tube, plate, sheet, and strip stock.&lt;/div&gt;&lt;/div&gt;</p>
