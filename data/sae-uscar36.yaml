  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification defines the dimensional and performance requirements for aftermarket spin-on oil filters intended for use on gasoline engines. Filters meeting this specification may also be suitable for use on some diesel applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Filters meeting these dimensional limits are intended to meet the oil filter fit and package requirements for engine and vehicle designs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Filters meeting the performance requirements are intended to maintain sufficient durability to support many of the OEM's recommended oil change intervals. Some OEM engines may require special filters for which this specification would not support.&lt;/div&gt;&lt;/div&gt;</p>
