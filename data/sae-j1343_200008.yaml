  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report is intended to provide the information to estimate the accessory load of a typical heavy truck or bus. The components covered include: air compressors, alternators, refrigerant compressors, engine cooling fans and power steering pumps. The values show an estimate of the average power requirements and duty cycles for these accessories.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This report does not address loads required for engine operation. Required systems include those needed for engine performance such as fuel pumps and electronic control modules (ECM).&lt;/div&gt;&lt;/div&gt;</p>
