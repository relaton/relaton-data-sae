abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The test procedure per the applicable Engine Manual does require a vibration check for the low/intermediate and high speed rotor systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Release of an engine with high vibrations can result in:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;On-wing vibration complaints, with subsequent troubleshooting&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Rotor system failures&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Premature engine removals&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;Limits are provided for transient conditions and steady state data points.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Troubleshooting recommendations are limited to verification of the proper signal input and tracking.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This practice provides recommendations for:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Correct cable and transmitter installation and connections&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Calibration&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Recorded data interpretation and data analysis&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
