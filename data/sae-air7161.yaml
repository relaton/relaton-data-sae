    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide an overview and guidance to enable and monitor the use of Digital Thread data standards and the quantification of digital tread efficacy with the Digital Thread Qualitative Index. This document does not standardize the process. However, it does provide a methodology to determine efficiencies and inefficiencies of Digital Thread utilization across various phases of the product lifecycle.&lt;/div&gt;


    &lt;/div&gt;</p>
