  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To document test procedures and set-ups that address known failure modes for mechanical rotary tensioners and establish minimum acceptance criteria. This SAE Standard does not encompass the pulley or pulley bearing. The sample sizes should be determined by agreement between the original equipment manufacturer (OEM) and the supplier.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The failure modes to be addressed are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Durability
    &lt;div class="table-wrap anchor "&gt;
    &lt;div class="table-container"&gt;&lt;table class="br-none tbr-void " data-dataset-id=""&gt;
    &lt;tbody&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Corrosion&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Contamination&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Structural&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Wear&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Temperature&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Alignment&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div/&gt;&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Functional
    &lt;div class="table-wrap anchor "&gt;
