  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) presents a system of graphic symbols intended primarily for usage in hydraulic and pneumatic system schematic diagrams for all types of aircraft. It is also considered suitable for marine vehicles and other applications and for ancillary documents where schematics are required. Individual graphic symbols shown herein are also considered suitable for use in conjunction with other types of symbols.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AS is intended to promote industry-wide acceptance and understanding of uniform standards and employs, where possible, symbols which are internationally recognized.&lt;/div&gt;&lt;/div&gt;</p>
