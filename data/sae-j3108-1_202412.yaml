  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J3108 Recommended Practice (RP) provides fuel and hazard guidance for first and second responders of incidents associated with alternative fueled vehicles. The intent of SAE J3108-1 is to present responders with a limited number of intuitive letters and colors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The International community is in the process of adopting International Standards Organization (ISO) 17840, which provides first and second responders with a standardized format for emergency information. While the ISO 17840 format in coloring and lettering can be adopted and should be encouraged when possible, it is intended for large and heavy vehicles. SAE J3108-1 provides a means for responders to recognize fuel and vehicle type on North American light duty vehicles due to size constraints preventing use of ISO 17840 labels.&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While encouraged to be adopted or referenced by vehicle manufacturers, this RP has been developed for the use of States and other Governmental bodies. The RP is not intended to replace the standards for SAE J2990 format emergency response guide (ERG) created by automotive manufacturers for use at the scene of an emergency. This coding should be consistent with other vehicle badging with the goal of providing additional clarity.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This RP does not include detailed equipment and procedures such as tools, personal protective equipment, or other aspects required for addressing vehicles which have been involved in accidents or incidents. Other documents providing those aspects are contained in the list of references.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This RP is independent of existing U.S. Department of Transportation (DOT) hazardous labeling and nomenclature provided by Code of Federal Regulations Title 49. The ten hazard symbols and four levels of severity rating are insufficient to identify the unique aspects of configurations which may be specific to various vehicles designs. Those symbols are typically not used on the passenger types of vehicles this RP is meant for. This RP also does not supersede current DOT requirements, U.S. Federal Regulations, or other regional regulations for identifying vehicle fuel and critical first responder information.&lt;/div&gt;&lt;/div&gt;</p>
