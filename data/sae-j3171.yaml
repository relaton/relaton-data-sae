  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;It is expected that Level 4 and 5 automated driving systems-dedicated vehicles (ADS-DVs) will eventually enable persons to travel at will who are otherwise unable to obtain a driver’s license for a conventional vehicle, namely, persons with certain visual, cognitive, and/or physical impairments. This information report focuses on these disabilities but also provides guidance for those with other disabilities. This report is limited to fleet-operated, on-demand, shared mobility scenarios, as this is widely considered to be the first way people will be able to interact with ADS-DVs. To be more specific, this report does not address fixed-route transit services or private vehicle ownership. Similarly, this report is focused on motor vehicles (refer to SAE J3016), not scooters, golf carts, etc. Lastly, this report does not address the design of chair lifts, ramps, or securements for persons who use wheeled mobility devices (WHMD) (e.g., wheelchair, electric cart, etc.), as these matters are addressed by other committees within SAE International.&lt;/div&gt;&lt;/div&gt;</p>
