abstract:
- language: en
  script: Latn
  content: |-
    <p>There is no standard equivalent to this SAE Standard. However, SAE J2226 is similar to and represents an extension of SAE J1998 (equivalent to ISO Standard 6622/2 TR).

    This SAE Standard specifies the essential dimensional features of Type B barrel faced steel rectangular piston rings. Only fully faced and inlaid coated rings are included, consistent with current U.S. practice.

    The requirements of this SAE Standard apply to steel piston rings of reciprocating internal combustion engines, up to and including 200 mm diameter and 4.5 mm width.

    Tolerances specified in this document represent a six sigma quality level.</p>
