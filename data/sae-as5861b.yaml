  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies solid polytetrafluoroethylene (PTFE) retainers (backup rings) for use in static glands in accordance with AS5857. They are usually for use in hydraulic and pneumatic systems as anti-extrusion devices in conjunction with O-rings and other seals.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: This specification includes material tests but does not include hydraulic or pneumatic performance tests.&lt;/div&gt;
    &lt;/div&gt;</p>
