    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Standard is the definition of the functional, environmental, and life cycle test requirements for electrically operated, operator controlled forward warning horn devices, primarily intended for use on self-propelled, work machines as defined by J1116 (limited to categories of 1) construction, and 2) general purpose industrial).&lt;/div&gt;
