  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines conditions to which bonded assemblies can be exposed to simulate environmental aging. These recommendations are generally based on existing Original Equipment Manufacturer requirements at this time. (Environmental specifications used for this proposal were from General Motors, Ford, and Chrysler.) The substrate type, dimension, and number are described by the standard for materials being tested and should include control specimens which receive no environmental aging.&lt;/div&gt;&lt;/div&gt;</p>
