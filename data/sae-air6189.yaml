    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides descriptions of test procedures and established practices for the application, use, and administration of the conduct of icing testing for all types of turbine engines in conventional supercooled liquid (14 CFR Part 25 Appendix C) environmental conditions in ground test facilities (sea-level and altitude) for icing certification purposes.&lt;/div&gt;

