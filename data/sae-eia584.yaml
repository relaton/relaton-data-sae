  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Conventional attribute sampling plans based upon nonzero acceptance numbers are no longer desirable. In addition, emphasis is now placed on the quality level that is received by the customer. This relates directly to the Lot Tolerance Percent Defective (LTPD) value or the Limiting Quality Protection of MIL-STD-105. Measuring quality levels in percent nonconforming, although not incorrect, has been replaced with quality levels measured in parts per million (PPM). As a result, this standard addresses the need for sampling plans that can augment MIL-STD-105, are based upon a zero acceptance number, and address quality (nonconformance) levels in the parts per million range. This document does not address minor nonconformances, which are defined as nonconformances that are not likely to reduce materially the usability of the unit of product for its intended purpose.&lt;/div&gt;&lt;/div&gt;</p>
