  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AMS3970/2B gives specific information about the qualification program for carbon fiber fabric reinforced epoxy structural repair prepreg systems, curing under vacuum at 120 °C (250 °F), and a companion non-structural glass fabric prepreg used for repair of carbon fiber reinforced epoxy structures. The prepreg system shall include an epoxy film adhesive to be applied in a co-curing process with the prepreg for joint solid laminate and sandwich bonding.&lt;/div&gt;&lt;/div&gt;</p>
