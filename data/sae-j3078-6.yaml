  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J3078/6 specifies a test method for simulating solar heating in the laboratory and measuring the radiant heat energy from a natural or simulated source. It is applicable to off-road self-propelled work machines as defined in SAE J1116 and tractors and machinery for agriculture and forestry as defined in ANSI/ASAE S390.&lt;/div&gt;&lt;/div&gt;</p>
