  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers the design, construction, performance and testing requirements for hand held aircraft tire inflation pressure gauges with valve stem attachment chuck to be used with all aircraft types. The gauges in this specification are those which are designed to read the tire inflation pressure from a position adjacent to the tire.&lt;/div&gt;&lt;/div&gt;</p>
