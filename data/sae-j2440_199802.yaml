    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Draft Technical Report is to establish dimensional standards for high-performance domestic torque converter manufacturers. Many torque converter manufacturers build converters to their own standards. Some of these standards may be outside of the specifications that define a quality performance torque converter.&lt;/div&gt;
