  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The main purpose of this test was to determine the application advantages of cushion tow hitches in comparison to the commonly used rigid tow hitch type fitted on heavy aircraft towing tractors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;As diverse opinions emerged about its suitability since the introduction on the market of this new tow hitch type, it was intended to physically measure and evaluate the damping capability of this cushioned tow link when applied in practice.&lt;/div&gt;&lt;/div&gt;</p>
