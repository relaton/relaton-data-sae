  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Standard aims at identifying the design criteria and testing methods adequate to guarantee the ultimate load and operational dependability of cargo restraint strap assemblies with a typical 22,250 N (5,000 lbf) rated ultimate tension load capability, as used by the airline industry in order to restrain on board civil transport aircraft during flight:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;cargo loaded and tied down onto airworthiness certified air cargo pallets, themselves restrained into aircraft lower deck or main/upper deck cargo systems and meeting the requirements of NAS 3610 or AS36100, or&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;non-unitized individual pieces of cargo, or pieces of, cargo placed onto an unrestrained (“floating”) pallet into either lower deck or main deck containerized cargo compartments of an aircraft.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
