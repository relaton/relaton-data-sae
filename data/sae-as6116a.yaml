  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for externally swaged aluminum tube fittings on aluminum tubing with flareless separable fitting ends for use in hydraulic supply and return aerospace fluid systems including pneumatic, coolants, and fire extinguishers up to a maximum operating pressure of 1500 psig (10340 kPa) and a maximum operating temperature range of -65 to +225 °F (-54 to +107 °C).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification covers a common aluminum fitting that may be used for a range of operating pressures up to 1500 psi with different tubing materials and tubing wall thicknesses, and is assembled with the same tooling in accordance with AS6124. &lt;span class="xref"&gt;Table 12&lt;/span&gt; shows applicable aerospace fitting part number standard and tubing materials and operating pressures.&lt;/div&gt;&lt;/div&gt;</p>
