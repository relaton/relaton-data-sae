  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document will primarily address intrinsic reliability of electronic components for use in automotive electronics. Where practical, methods of extrinsic reliability detection and prevention will also be addressed. This document primarily deals with integrated circuit issues, but can easily be adapted for use in discrete or passive component qualification with the generation of a list of failure mechanisms relevant to those devices. Component qualification is the main scope of this document. Other procedures addressing extrinsic defects are specifically addressed in the monitoring chapter. This document is to be used within the context of achieving Zero Defect in component manufacturing and product use.&lt;/div&gt;

    &lt;/div&gt;</p>
