  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides the user with standardized guidelines for the measurement of effective intensity of short pulse width strobe anticollision lights for aircraft in the laboratory, in maintenance facilities, and in the field. A common source of traceability for calibration of the measurement systems, compensation for known causes of variation in light output such as the use of colored lenses, and recommendations which minimize sources of errors and uncertainties are included in this document. Estimates of uncertainty and error sources for each class of measurement are discussed.&lt;/div&gt;




    &lt;/div&gt;</p>
