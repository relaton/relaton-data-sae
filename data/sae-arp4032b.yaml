  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is intended for the application of color to cathode-ray-tube (CRT) displays, liquid crystal displays (LCD) and other types of display technologies such as projection displays. Emerging color display technologies other than those noted above, may not be adequately covered by these recommendations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Color recommendations will not address Night Vision Devices (NVD), Head-Up Displays (HUD) or Head or Helmet Mounted Displays (HMD).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is applicable to aircraft as understood in 14 CFR Parts 23, Part 25, Part 27 and Part 29, and EASA CS-23, CS-25. CS-27 and CS-29 certification standards.&lt;/div&gt;
    &lt;/div&gt;</p>
