  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides guidance for oxygen cylinder installation on commerical aircraft based on airworthiness requirements, and methods practiced within aerospace industry.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It covers considerations for oxygen systems from beginning of project phase up to production, maintenance, and servicing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The document is related to requirements of DOT-approved oxygen cylinders, as well to those designed and manufactured to standards of ISO 11119. However, its basic rules may also be applicable to new development pertaining to use of such equipment in an oxygen environment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For information regarding oxygen cylinders itself, also refer to AIR825/12.&lt;/div&gt;&lt;/div&gt;</p>
