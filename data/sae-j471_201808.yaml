  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Powder metal (P/M) parts are manufactured by pressing metal powders to the required shape in a precision die and sintering to produce metallurgical bonds between the particles, thus generating the appropriate mechanical properties. The shape and mechanical properties of the part may be subsequently modified by repressing or by conventional methods such. as machining and/or heat treating.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While powder metallurgy embraces a number of fields wherein metal powders may be used as raw materials, this standard is concerned primarily with information relating to mechanical components and bearings produced from iron-base materials.&lt;/div&gt;&lt;/div&gt;</p>
