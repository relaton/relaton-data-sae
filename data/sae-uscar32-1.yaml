  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard lists variables that shall be investigated and reported as an initial investigation into new or revised surface finishes intended for use on fasteners. This standard provides instruction for producing a final report that will be used to determine if further investigation of a surface finish is justified. Further investigation may include tests and evaluations specific to an individual OEM prior to introduction/approval of the surface finish. The final report shall include the results, observations, and conclusions for all of the variables. The final report may be made up of several individual reports covering each variable. In all cases the laboratory performing the test, the test date and the report approver shall be included in the final report.&lt;/div&gt;&lt;/div&gt;</p>
