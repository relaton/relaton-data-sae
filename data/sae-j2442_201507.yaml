  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to road vehicles except motorcycles. It describes the commonalities of installation requirements for lighting and light signaling devices contained in the regulatory requirements and industry standards of North America, Japan, and the widely-adopted UNECE ("European") Regulations. It does not apply to installation of lighting and light signaling devices specific to special purpose vehicles, including but not limited to police, medical and other emergency or public service vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not carry force of law and does not replace regulatory requirements in effect at the time of application. It is subject to change to reflect additional experience, technical advances, and especially changes in government and industry documents used as references. Users of this document are advised to mind the applicable legal requirements in effect where their vehicles will be sold and registered.&lt;/div&gt;&lt;/div&gt;</p>
