  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers hose fabricated from textile reinforcement and synthetic rubber, assembled with clamps and/or end fittings for use in high-temperature automotive power steering applications as flexible connections within the temperature range of −40 to +150 °C (−40 to +302 °F) maximum and 1.21 MPa (175 psi) maximum working pressure. This specification defines the minimum performance levels of a flexible connector in the hydraulic steering system to convey power steering fluid from the steering gear back to the pump/reservoir.&lt;/div&gt;&lt;/div&gt;</p>
