  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes the continuous sampling and analysis of gaseous emissions from aircraft gas turbine engines. The measured gas species include carbon monoxide (CO), carbon dioxide (CO&lt;sub&gt;2&lt;/sub&gt;), nitric oxide (NO), nitrogen dioxide (NO&lt;sub&gt;2&lt;/sub&gt;), total hydrocarbons (CH&lt;sub&gt;α&lt;/sub&gt; where “α” is the hydrogen to carbon ratio of the fuel) and water vapor (H2O). This ARP excludes engine operating procedures and test modes, and is not intended for in-flight testing, nor does it apply to engines operating in the afterburning mode.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recognized that there will probably be major advances in the gas analysis measurement technology. It is not the intent of this ARP to exclude other analysis techniques, but to form the basis of the minimum amount of conventional instruments (those in common industry usage over the last fifteen years) required for the analysis of aircraft engine exhaust. It is the responsibility of the analyst to demonstrate the alternative measurement technology has comparable (or better) performance, than the techniques described in this ARP.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The measurement of other exhaust gas species is beyond the scope of this ARP.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It should be noted the measurement of oxygen (O&lt;sub&gt;2&lt;/sub&gt;) is generally accepted as essential for assessing data quality, but is not covered by this ARP. Sulfur dioxide (SO&lt;sub&gt;2&lt;/sub&gt;) is normally not measured using conventional systems but is calculated from fuel sulfur content. Again this is not covered by this ARP.&lt;/div&gt;&lt;/div&gt;</p>
