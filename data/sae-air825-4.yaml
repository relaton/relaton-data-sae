    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides an orientation regarding the general technology of chemical oxygen generators to aircraft engineers for assistance in determining whether chemical oxygen generators are an appropriate oxygen supply source for hypoxia protection in a given application and as an aid in specifying such generators. Information regarding the details of design and manufacture of chemical oxygen generators is generally beyond the scope of this document.&lt;/div&gt;&lt;/div&gt;</p>
