  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers specification requirements for a rotary plow with carrier vehicle. The primary use is to cast heavy concentrations of snow approximately perpendicular to carrier vehicles across and away from airport operational areas, such as runways and taxiways. Rotary plows equipped with spot casting, or loading chutes are also used to cast snow in directions through approximately 100 degrees to the left or right of directly in front of the carrier vehicle, and also to load trucks or trailers used to haul snow away from removal area. The term “carrier vehicle” represents the various self-propelled prime movers that provide the power necessary to move snow and ice control equipment during winter operations.&lt;/div&gt;&lt;/div&gt;</p>
