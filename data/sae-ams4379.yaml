    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a discontinuously reinforced aluminum alloy (DRA) made by mechanical alloying 2124A aluminum powder and SiC particulate. It is produced in the form of extruded bar, rod, wire and shapes with cross section inclusive of 1 inch (25.4 mm) diameter or less.&lt;/div&gt;&lt;/div&gt;</p>
