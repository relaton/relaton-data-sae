  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP provides performance criteria for Altitude Alerting Devices and Systems. These devices can be self-contained or receive remote altitude information and can have integral or remote barometric corrections. Only the generation of the alerting signals is covered by this recommended practice and not the details of the visual or audio alerts operated by these signals. It is recommended that the system's operational correspondence between the selected altitude settings of the Altitude Alerting Device and the Altitude Level Indication normally used to control the aircraft should not exceed ±250 ft RSS throughout the operating range of the device.&lt;/div&gt;&lt;/div&gt;</p>
