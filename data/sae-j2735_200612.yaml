  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances. This SAE Recommended Practice specifies standard message sets, data frames and data elements for use by applications intended to utilize the 5.9 GHz Dedicated Short Range Communications for Wireless Access in Vehicular Environments (DSRC/WAVE, referenced in this document simply as “DSRC”), communications systems. The scope is limited to specifying initial representative message structure and providing sufficient background information to allow readers to properly interpret the DSRC standards and message definitions from the point of view of an application developer.&lt;/div&gt;
    &lt;/div&gt;</p>
