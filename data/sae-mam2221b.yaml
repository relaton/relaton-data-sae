    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established metric manufacturing tolerances applicable to bars and rods of copper and copper alloys ordered to metric dimensions. These tolerances apply to all conditions, unless otherwise noted. The term "exclusive" is used to apply only to the higher figure of a specified range.&lt;/div&gt;

