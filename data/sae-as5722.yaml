  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers minimum performance standards for protective equipment used on the flight deck during rapid decompression (5 to 30 seconds) up to a maximum pressure altitude of 45000 feet. Equipment with the capability to adequately protect flight deck crew from hypoxia up to FL450 is anticipated to provide sufficient protection at lower altitudes.&lt;/div&gt;
    &lt;/div&gt;</p>
