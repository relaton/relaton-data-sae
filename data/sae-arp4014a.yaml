  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes a method of conducting an endurance test using contaminated air when the applicable specification requires non-recirculation of the contaminants. The objective of the test is to determine the resistance of the engine mounted components to wear or damage caused by the contaminated air.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The method described herein calls for non-recirculation of the contaminants and is intended to provide a uniform distribution of the contaminant at the inlet to the Unit Under Test (UUT).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The UUT may require the use of a hydraulic fluid for actuation of components within the test unit. Contamination of the test hydraulic fluid is not part of this recommended practice. If contaminated hydraulic fluid is required by the applicable test specification, refer to MAP749.&lt;/div&gt;&lt;/div&gt;</p>
