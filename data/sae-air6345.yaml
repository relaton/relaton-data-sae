  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The processes addressed in this Aerospace Information Report (AIR) apply to the acquisition and validation of dynamic total-pressure and distortion data from CFD models simulating turbulent flows in inlets. The results of these processes can be used in the formation of an inlet-flow-distortion methodology that addresses turbine-engine operability assessments.&lt;/div&gt;
    &lt;/div&gt;</p>
