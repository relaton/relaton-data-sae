  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes requirements, test procedures, and acceptance criteria for the fire testing of fluid handling components and materials used in aircraft fluid systems. It is applicable to fluid handling components other than those prescribed by AS1055 (e.g., hoses, tube assemblies, coils, fittings).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It also is applicable to materials, wiring, and components such as reservoirs, valves, gearboxes, pumps, filter assemblies, accumulators, fluid-cooled electrical/electronic components, in-flight fluid system instrumentation, hydromechanical controls, actuators, heat exchangers, and manifolds. These components may be used in fuel, lubrication, hydraulic, or pneumatic systems.&lt;/div&gt;


    &lt;/div&gt;</p>
