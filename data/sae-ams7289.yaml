    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a nitrile rubber (NBR) in the form of molded compression seals such as O-rings, T-seals, and molded-in-place gaskets for aeronautical and aerospace applications. For sheet, strip, tubing, extrusions, and molded shapes, use the AMS3786 specification, which is intended for that use.&lt;/div&gt;&lt;/div&gt;</p>
