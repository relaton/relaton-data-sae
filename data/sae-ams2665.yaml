abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This specification covers the engineering requirements for producing brazed joints in parts fabricated from steels, iron alloys, nickel alloys, cobalt alloys, and copper alloys by use of silver alloys, and the properties of such joints.&lt;/p&gt;
    &lt;p&gt;This procedure has been used typically for joints requiring high strength up to 400 degrees F (204 degrees C), but usage is not limited to such applications.&lt;/p&gt;</p>
