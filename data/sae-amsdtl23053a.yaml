abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This specification establishes the requirements for various types and colors of electrical insulating sleeving that will shrink to a predetermined size upon the application of heat.  This specification includes provisions for demonstrating compliance with requirements through in process inspection and statistical process control (see 4.4.3.1).  Continuous operating temperature ratings range from-80° to +250°C (-112° to +482°F) (see 6.1).&lt;/p&gt;</p>"
