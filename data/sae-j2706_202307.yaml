  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This user’s manual covers the Hybrid III 6-year-old child test dummy, including changes specified in 49 CFR Part 572, Subpart N in the final rule dated December 9, 2010. It is intended for technicians who work with this device. It covers the construction and clothing, disassembly and reassembly, available instrumentation, external dimensions and segment masses, as well as certification and inspection test procedures. &lt;span class="xref"&gt;Appendix A&lt;/span&gt; contains guidelines for safe handling of instrumented dummies. &lt;span class="xref"&gt;Appendix B&lt;/span&gt; contains instructions for repairing dummy flesh. &lt;span class="xref"&gt;Appendix C&lt;/span&gt; includes procedures for adjusting the joints throughout the dummy.&lt;/div&gt;&lt;/div&gt;</p>
