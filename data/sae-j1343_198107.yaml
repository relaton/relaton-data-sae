    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The accessory components covered by this information report include: air brake compressors, alternators, air conditioning compressors, engine cooling fans and drives, and power steering pumps. The values show an estimate of the average power requirements of known duty cycles of these engine drive accessories.&lt;/div&gt;&lt;/div&gt;</p>
