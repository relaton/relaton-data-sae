    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The requirements presented in this document address the key considerations for mechanical and electrical safety in aircraft fuel pump design. Document sections focus on understanding safety relative to an electrically motor driven fuel pump assembly acting as an ignition source for explosive fuel vapors within the airplane tank.&lt;/div&gt;
