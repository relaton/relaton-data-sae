  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This section relates the engineering fundamentals and thermophysical property material of the previous sections to the airborne equipment for which thermodynamic considerations apply. For each generic classification of equipment, information is presented for the types of equipment included in these categories, and the thermodynamic design considerations with respect to performance, sizing, and selection of this equipment.&lt;/div&gt;&lt;/div&gt;</p>
