    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes a procedure for the evaluation of operator seats which may be fitted to agricultural wheeled tractors per SAE J1150 and/or earthmoving machines per SAE J1057. This procedure evaluates only the vertical vibration performance and should not be considered a comprehensive seat evaluation procedure.&lt;/div&gt;
