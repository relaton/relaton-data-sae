  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;An industry-wide interest has arisen with regards to the properties and capabilities of investment cast PH 13-8Mo corrosion resistant steel. Specifically of interest are the structural applications in the aerospace industry for this product heat treated to the H1000 condition.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The objective of this AMEC cooperative test program was to generate and compile useful data for aerospace structural evaluation of investment cast PH 13-8Mo heat treated to H1000. The focus of the test program was the determination of overall mechanical properties, fatigue, fracture toughness, and crack growth data along with basic microstructural evaluation of the investment cast material.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Additional objectives included the evaluation of mechanical property variations between cast and machined tensile specimens and evaluation of microstructural constituents. All testing was performed to determine the suitability of PH 13-8Mo, H1000 investment castings for use in the aerospace industry.&lt;/div&gt;&lt;/div&gt;</p>
