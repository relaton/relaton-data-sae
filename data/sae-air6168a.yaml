  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) discusses past and present approaches for monitoring the landing gear structure and shock absorber (servicing), opportunities for corrosion detection, methods for transient overload detection, techniques for measuring the forces seen by the landing gear structure, and methods for determining the fatigue state of the landing gear structure. Landing gear tire condition and tire pressure monitoring are detailed in ARP6225, AIR4830, and ARP6137, respectively. Aircraft Brake Temperature Monitoring Systems (BTMS) are detailed in AS1145.&lt;/div&gt;&lt;/div&gt;</p>
