  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Mercury capsules have been used in the automotive industry in various switching applications. The basic design and performance characteristics of mercury switches (or capsules) make these components particularly suited to underhood light and trunk light applications. The processes described in this SAE Standard deal with the location, removal, storage, and recycling of mercury switches and capsules associated with these underhood and trunk light applications.&lt;/div&gt;

    &lt;/div&gt;</p>
