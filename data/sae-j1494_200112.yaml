  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to establish minimum performance and user information requirements for battery booster cable sets used with 6 OR 12-VOLT BATTERIES. Such sets may be used to provide a temporary connection of a surface vehicle battery to another similar battery to provide emergency power when required. This document DOES NOT ENDORSE NOR RECOMMEND the potentially hazardous procedure of jump-starting a vehicle.&lt;/div&gt;&lt;/div&gt;</p>
