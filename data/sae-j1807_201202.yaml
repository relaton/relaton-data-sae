    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to direct acting hydraulic power assist brake boosters only, of the type which provide "push through" manual braking of the static brake circuit(s) via a separate master cylinder, in event of inoperative power assistance similar to existing vacuum boosters (SAE J1808), for passenger cars and light trucks [4500 kg GVW (10 000 lb)].&lt;/div&gt;
