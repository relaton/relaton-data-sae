  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice presents requirements for the structural integrity of the brake system of all new trucks, buses, and combinations of vehicles designed for roadway use and falling into the following classifications:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Truck and Bus—Over 4500 kg (10 000 lb) GVWR&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Combination Vehicles—Towing vehicle over 4500 kg (10 000 lb) GVWR&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements are based on data obtained from SAE J294.&lt;/div&gt;
    &lt;/div&gt;</p>
