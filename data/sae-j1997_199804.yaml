  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Differences, where they exist, are shown in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the essential dimensional features of R, B, and M rectangular piston ring types.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensional &lt;span class="xref"&gt;Tables 8&lt;/span&gt; and &lt;span class="xref"&gt;9&lt;/span&gt; offer the choice of two radial wall thicknesses:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Radial wall thickness "regular" (&lt;span class="xref"&gt;Table 8&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Radial wall thickness "D/22" (&lt;span class="xref"&gt;Table 9&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this document apply to rectangular rings for reciprocating internal combustion piston engines up to and including 200 mm diameter. They may also be used for piston rings of compressors working under similar conditions.&lt;/div&gt;&lt;/div&gt;</p>
