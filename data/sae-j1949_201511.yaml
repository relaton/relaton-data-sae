abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Standard specifies the dimensional requirements for the assembly of high-pressure pipe connections for compression-ignition (diesel) engine fuel injection equipment. &lt;/p&gt;


    &lt;p&gt;It applies to 60 deg female cones with external threaded connectors types 1 and 2, and to the internal threaded tube nuts and male cone type end assembly of high- pressure pipe connections for tubes with diameters up to 12 mm inclusive.&lt;/p&gt;</p>
