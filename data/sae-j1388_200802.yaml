    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended to provide personnel protection guidelines for skid steer loaders. This document is intended as a guide towards standard practice, but may be subject to frequent change to keep pace with experience and technical advances. This should be kept in mind when considering its use. This document provides performance criteria for newly manufactured loaders and it is not intended for in-service machines.&lt;/div&gt;&lt;/div&gt;</p>
