  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to establish the specific minimum equipment performance requirements for recovery and recycling of HFC-134a that has been directly removed from, and is intended for reuse in, mobile air-conditioning (A/C) systems. It also is intended to establish requirements for equipment used to recharge HFC-134a to an accuracy level that meets &lt;span class="xref"&gt;Section 9&lt;/span&gt; of this document and SAE J2099. The requirements apply to the following types of service equipment and their specific applications.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Recovery/Recycling Equipment,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Recovery/Recycling-Refrigerant Charging,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Refrigerant Recharging Equipment Only.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;



    &lt;/div&gt;</p>
