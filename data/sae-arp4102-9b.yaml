  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends criteria and requirements for a flight management system (FMS) for transport aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The FMS shall provide the functions of lateral navigation, vertical navigation, and performance management and may include time of arrival control. The FMS design shall take human factors considerations into account to produce a fault tolerant system.&lt;/div&gt;&lt;/div&gt;</p>
