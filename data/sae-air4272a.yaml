abstract:
- language: en
  script: Latn
  content: |-
    <p>This AIR is applicable to SSPCs, EMPCs, and hybrid power controllers. It covers the control, status, BIT, etc., interfaces, other than electrical power. For the purpose of this document, a power controller shall have, as a minimum, the following characteristics:

    a. Power switching function
    b. Control input
    c. Overload protection
    d. Status feedback

    To accomplish the goals set forth in the Foreword, the interfaces are first categorized by function. Next, examples of actual implementations are given.</p>
