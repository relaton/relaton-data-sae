    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers minimum requirements for skid control equipment for use on all types and models of civil aircraft. It shall be the responsibility of the applicant (See Paragraph &lt;span class="xref"&gt;5.1&lt;/span&gt;) to determine the compatibility of these requirements with the applicable aircraft and to specify requirements in excess of these minimums as necessary.&lt;/div&gt;&lt;/div&gt;</p>
