  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard sets forth the instrumentation and procedure to be used in measuring sound pressure levels at the operator position for self-propelled off-road work machines as defined in SAE J1116. This document does not address the operation of safety devices such as backup alarms, horns, or accessories. This SAE document is applicable to machines that have operator stations where the operator can either stand or sit and will be either transported by, or walk with the machine during its operation. The sound levels obtained using this procedure are repeatable and representative of the higher range of sound levels generated by machines under actual field operating conditions. Due to variability of field operating conditions, this data is not intended to be used for operator noise exposure evaluations.&lt;/div&gt;&lt;/div&gt;</p>
