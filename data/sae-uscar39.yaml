  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard describes a requirement for automotive tire traceability. It includes a definition of the RFID tag and the associated tire data set that can be accessed using the RFID tag as an identifier. The standard describes a unique identification and the associated data set for each tire produced by the tire fabricator. This data will either be provided or transmitted at the time of shipment to retailers, wholesalers or original equipment vehicle manufacturers. Tire identification code and data may be used for error proofing, determining the tire specifications or supporting any inquiries that occur for the duration of its automotive life.&lt;/div&gt;&lt;/div&gt;</p>
