  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the test stand and procedure for evaluating radial impacts of all wheels intended for passenger cars and light trucks. A minimum performance requirement is intentionally not provided. The intent is to establish a uniform method and test stand for imparting damage and evaluating radial impacts. A minimum performance requirement will be a proposed change when users determine what is of most value.&lt;/div&gt;
    &lt;/div&gt;</p>
