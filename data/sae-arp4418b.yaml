  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP outlines recommended practices to quantify the concentrations of a subset of bleed air contaminant marker compounds on an aircraft propulsion engine or APU prior to delivery and installation on civil and military aircraft. Testing is specified during steady state (non-transient) operation only, in a ground level test bed. Included are recommended test setup, test procedures, techniques for sampling ambient air and bleed air, and one or more specific analytical methodologies for each of the suggested bleed air contaminant marker compounds at quantification levels, given practical constraints.&lt;/div&gt;
    &lt;/div&gt;</p>
