  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard will apply primarily to the vehicle classes identified in SAE J3194. It provides a schema for utilizing alphanumeric values to represent identifying information such as the manufacturer or vehicle provider, year of manufacture, model, vehicle type, weight, width, speed, and power source. Although conceptually similar to a Vehicle Identification Number (VIN), this standard does not classify or intend to suggest classification of these vehicles as motor vehicles for regulatory or safety data purposes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The location for placement of these identifiers on the vehicle, type of label, permanence, and visibility are out of scope for this document.&lt;/div&gt;&lt;/div&gt;</p>
