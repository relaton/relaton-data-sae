abstract:
- language: en
  script: Latn
  content: "<p>This Aeronautical Recommended Practice provides a standard method for
    locating and dimensioning the airfoil portions of parts such as blades, and vanes.
    \ This method will apply to blades, or vanes with or without a base.  The forms
    of attachment are varied; therefore, the blade bases shown in the following figures
    are for illustration only. All dimensions and notes shown pertaining to the common
    functional point, line or plane are considered to be applied to a datum, on or
    off the part, irrespective of the form of attachment.</p>"
