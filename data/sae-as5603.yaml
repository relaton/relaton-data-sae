    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Technical Report is an Aerospace Standard, compliant with the Organization and Operating Guide for the Aerospace Council of the SAE Technical Standards Board.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is consistent with the category (5) definition of an Aerospace Standard under Section 6.0, Technical Reports, in Paragraph 6.1.2.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document draws from, summarizes, and explains existing broadly accepted engineering best practices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document defines the process and procedure for application of various best practice methods.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is, specifically, intended as a standard for the engineering practice of development and execution of a link loss power budget for a general aerospace system related digital fiber optic link.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not intended to specify the values associated with specific categories or implementations of digital fiber optic links.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended to address both existing digital fiber optic link technology and accommodate new and emerging technologies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The proper application of various calculation methods is provided to determine link loss power budget(s), that depend on differing requirements on aerospace programs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A list of parameters is provided as guidance for aerospace fiber optics applications along with a check list to help assure that appropriate parameters and impairments have been accounted for in the link budget.&lt;/div&gt;


    &lt;/div&gt;</p>
