  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard sets forth the procedures to be used in measuring sound levels and determining the time weighted sound level at the operator's station(s) of specified off-road self-propelled work machines. This document applies to the following work machines which have operator stations as specified in SAE J1116:
    &lt;div class="table-wrap anchor "&gt;
    &lt;div class="table-container"&gt;&lt;table class="br-none tbr-void " data-dataset-id=""&gt;
    &lt;tbody&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• Crawler Loader&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;• Grader&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;• Log Skidder&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• Wheel Loader&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;• Crawler Tractor with Dozer&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;• Pipelayer&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• Dumper&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;• Wheel Tractor with Dozer&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;• Trencher&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• Tractor Scraper&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;• Backhoe&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;• Sweeper&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• Roller/Compactor&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;• Hydraulic Excavator&lt;/td&gt;
    &lt;td class="va-top ta-left "/&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• Pad Foot Wheel Compactor with Dozer&lt;/td&gt;
    &lt;td class="va-top ta-left "/&gt;
    &lt;td class="va-top ta-left "/&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;• Excavator and Wheel Feller-Buncher&lt;/td&gt;
    &lt;td class="va-top ta-left "/&gt;
    &lt;td class="va-top ta-left "/&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div/&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The instrumentation requirements and specific work cycles for these machines are described. The method used to calculate the time weighted average sound level at the operator station(s) is specified for L&lt;sub&gt;eq(5)&lt;/sub&gt;, or optional exchange rates, during continuous operation in a work cycle representing continuous medium to heavy work. The work cycles provide a repeatable reproduceable means to uniformly measure working machines against a “yard stick. A method to relate the time weighted average sound level at the operator station(s) to estimate operator sound exposure with part load work, supervision, and rest breaks is also provided.&lt;/div&gt;&lt;/div&gt;</p>
