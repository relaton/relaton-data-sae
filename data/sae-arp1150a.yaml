abstract:
- language: en
  script: Latn
  content: "<p>The pilot's seat is the basic link that supports and ties the pilot to the aircraft structure.  It is essential that this function be accomplished in a manner that will provide the maximum safety and security during all normal and emergency flight conditions.  The recommendations listed in Section 3 shall apply to all regularly assigned flight crew member's seats located on the flight deck</p>"
