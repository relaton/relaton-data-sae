  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides guidelines for the development of landing gear fatigue spectra for the purpose of designing and certification testing of Part 25 landing gear. Many of the recommendations herein are generalizations based on data obtained from a wide range of landing gears. The aircraft manufacturer or the landing gear supplier is encouraged to use data more specific to their particular undercarriage whenever possible.&lt;/div&gt;
    &lt;/div&gt;</p>
