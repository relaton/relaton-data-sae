  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines a means of assessing the credibility of computer models of aircraft seating systems used to simulate dynamic impact conditions set forth in Title 14, Code of Federal Regulations (14 CFR) Parts 23.562, 25.562, 27.562, and 29.562. The ARP is applicable to lumped mass and detailed finite element seat models. This includes specifications and performance criteria for aviation specific virtual anthropomorphic test devices (v-ATDs). This document provides a recommended methodology to evaluate the degree of correlation between a seat model and dynamic impact tests. This ARP also provides best practices for testing and modeling designed to support the implementation of analytical models of aircraft seat systems. Supporting information within this document includes procedures for the quantitative comparison of test and simulation results, as well as test summaries for data generated to support the development of v-ATDs and a sample v-ATD calibration report.&lt;/div&gt;


    &lt;/div&gt;</p>
