abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers sub-critically annealed or normalized electric resistance welded and cold-drawn single-wall high strength steel tubing intended for use in hydraulic pressure lines and in other applications requiring tubing of a quality suitable for bending, flaring, cold forming, welding and brazing. Nominal reference working pressures for this tubing are listed in ISO 10763 for metric tubing and SAE J1065 for inch tubing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification also covers SAE J2614 Type-A tubing. The mechanical properties and performance requirements of standard SAE J2614 and SAE J2614 Type-A are the same. The designated differences of Type-A tubing do not imply that Type-A tubing is in anyway inferior to standard SAE J2614. The Type-A designation is meant to address unique manufacturing differences between sub-critically annealed and normalized tubing.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Tube assembly configurations made to specific geometry and components requiring thermal attachment methods in association with the sub-critically annealed material, may require qualification testing in accordance with ISO 19879. The use of Type-A material avoids this systemic testing as thermal processes will not compromise the structural integrity of the Type-A tube material.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In an effort to standardize within a global marketplace and ensure that companies can remain competitive in an international market, it is the intent to convert to metric tube sizes which will:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Lead to one global system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Guide users to preferred system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Reduce complexity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Eliminate inventory duplications&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
