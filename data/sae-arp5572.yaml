  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides information and guidance for the control of hazardous laser energy in the navigable airspace. This document provides guidance to all laser proponents and the FAA on the optimal use of control measures during propagation of a laser beam in the navigable airspace. This document does not cover control measures already set forth in federal, state, and local regulations for the safe operations of lasers. FAA will review control measures in their aeronautical study of proposed outdoor laser operations.&lt;/div&gt;

    &lt;/div&gt;</p>
