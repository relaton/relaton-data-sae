    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) lists military and industry specifications, standards, recommended practices and information reports used in the design of aerospace hydraulic and pneumatic components and systems. It is intended as a supplement to specifications ARP4752, AS5440, and MIL-P-5518. Only those hardware standards specifically applicable to hydraulic or pneumatic components or systems are listed in this document.&lt;/div&gt;
    &lt;/div&gt;</p>
