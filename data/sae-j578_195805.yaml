  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;The purpose of this specification is to provide standards for colors employed in motor vehicle lighting equipment. It is intended to cover the colors of red, amber (yellow), and uncolored (white) transmitting media. Color applies to the overall effective signal color and not to the color from a small area of the lens.&lt;/div&gt;


    &lt;/div&gt;</p>
