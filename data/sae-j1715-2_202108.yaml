  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document contains definitions currently used in the automotive industry as they relate to energy storage and batteries for starting, lighting, and ignition applications, as well as for hybrid electric vehicles (HEV) and electric vehicles (EVs). It is intended that this document be a resource for those writing other battery, HEV, and EV documents, specifications, standards, or recommended practices. The use of the term “battery” in this document can be assumed to be a rechargeable battery (secondary battery). The terminology may be applied to other industries if desired.&lt;/div&gt;&lt;/div&gt;</p>
