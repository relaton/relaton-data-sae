  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report describes the deployment profile and radio parameters for a 10 MHz channel (i.e., LTE band 47 using EARFCN 54990 with a 10 MHz channel width, also known as Channel 180) based on LTE-V2X PC5 Sidelink (Mode 4) that can be used to support truck platooning applications. The content provided in this document is complementary to the content provided in SAE J3161 (which defines deployment profile and radio parameters for a 20 MHz channel).&lt;/div&gt;
    &lt;/div&gt;</p>
