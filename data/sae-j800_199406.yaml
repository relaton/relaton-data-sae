    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides general installation instructions for aftermarket, universal type seat belt assemblies for installation in passenger cars, trucks, buses, and multipurpose passenger vehicles. It applies only to seat belt assemblies which are not identified by a vehicle manufacturer part number or which are not designed for a specific vehicle application.&lt;/div&gt;

