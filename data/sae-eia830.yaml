    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This model is designed to enhance insight into the application of meaningful metrics. The emphasis is on business processes which may best provide indication of the level of risk to the customer when contemplating or continuing business with the supplier base. (E.g., the RFP/RFQ, proposal, supplier selection, and performance).&lt;/div&gt;&lt;/div&gt;</p>
