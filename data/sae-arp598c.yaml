  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines the materials, apparatus and procedure for sizing and counting of particulate contamination, 5 µm or greater, in hydraulic fluid samples by membrane filtration with microscopic counting.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is capable of counting particulate matter in samples withdrawn from fluid power systems as identified by the 12 classes of AS4059 or NAS 1638 and projected beyond these for the five standard ranges specified and can thus serve as the primary document to determine acceptability.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is also capable of revealing but not measuring evidence of abnormal amount of water, other fluids, fine particulate and other materials, especially fibers and metals.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is applicable to all military, civil, space vehicles and test equipment.&lt;/div&gt;&lt;/div&gt;</p>
