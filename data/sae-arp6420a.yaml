abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The turbine-engine-inlet flow distortion descriptors summarized in this document apply to the effects of inlet total-pressure, planar-wave, and total-temperature distortions. Guidelines on stability margin, destabilizing influences, types and purposes of inlet data, AIP definition, and data acquisition and handling are summarized from AIR5866, AIR5867, ARP1420, and AIR1419. The degree to which these recommendations are applied to a specific program should be consistent with the complexity of the inlet/engine integration. Total-pressure distortion is often the predominant destabilizing element that is encountered and is often the only type of distortion to be considered, i.e., not all types of distortion need to be considered for all vehicles.&lt;/div&gt;&lt;/div&gt;</p>
