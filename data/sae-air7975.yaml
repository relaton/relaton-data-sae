  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the major design drivers and considerations when designing a fuel system for a large commercial aircraft. It discusses the design at a system/aircraft level, and is not intended as a design manual for individual system components, though it does refer out to other SAE specifications where more detail on specific components and sub-systems is given. It does include examples of a number of calculations associated with sizing of fuel systems, based on those given in NAV-AIR-06-5-504, as well as an appendix summarizing basic fluid mechanical equations which are key for fuel system design. It is acknowledged that most of these calculations would today be performed by modelling tools, rather than by hand, but it is considered important for the designer to understand the principles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is intended that later issues of this document will include appendices which give specific considerations for military aircraft, smaller commercial aircraft, and rotorcraft.&lt;/div&gt;
    &lt;/div&gt;</p>
