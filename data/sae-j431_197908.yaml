  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the hardness and microstructural requirements for gray iron sand mold castings used in automotive and allied industries. The chemical requirements for alloy gray iron automotive camshafts are included in the standard under &lt;i&gt;casting for special application with controlled composition and microstructure.&lt;/i&gt; The &lt;span class="xref"&gt;Appendix&lt;/span&gt; provides general information on application of gray iron in automotive castings and chemical composition to meet hardness, microstructural, and other properties needed for particular service conditions. The mechanical properties in the &lt;span class="xref"&gt;Appendix&lt;/span&gt; are provided for design purposes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Note: This document was rewritten in June 1970. The materials described by the grade numbers are different than in the former writing.&lt;/div&gt;&lt;/div&gt;</p>
