    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The process described in this document is generally applicable to provide a means to classify the function performance status of automotive electronic devices. Testing of devices could be performed either on or off vehicles. Appropriate test pulse and methods, functional status classification, region of performance, and test pulse severity level would have to be specified in the individual cases.&lt;/div&gt;&lt;/div&gt;</p>
