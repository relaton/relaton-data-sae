  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification defines the requirements for a grooved clamp coupling and flanges suitable for joining intermediate pressure and temperature ducting in aircraft air systems. The rigid coupling joint assembly, hereafter referred to as "the joint", shall operate within the temperature range of -65 °F to +800 °F.&lt;/div&gt;&lt;/div&gt;</p>
