  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides design data reliability information relative to the long-term storage of gas containers or pressure vessels charged with nitrogen or helium at pressures ranging from 6000 to 12 000 psi. The gas containers are cylindrical, spherical, or toroidal in shape. Internal volumes range up to 1385 in&lt;sup&gt;3&lt;/sup&gt;. Applications for this type cold gas actuation system include tactical missiles, guided projectiles, and smart bombs. A typical system is described.&lt;/div&gt;&lt;/div&gt;</p>
