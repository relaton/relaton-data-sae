    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure incorporates driving cycles that produce fuel consumption data relating to urban, suburban, and interstate driving patterns. The procedure is intended to be used to determine the relative fuel economy among vehicles and driving patterns under warmed-up conditions on a test track or on suitable roads.&lt;/div&gt;&lt;/div&gt;</p>
