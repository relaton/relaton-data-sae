abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This test method provides stakeholders (runway deicing chemical manufacturers, users, regulators, and airport authorities) with relative ice melting capacity of runway deicing chemicals, by measuring the amount of ice melted as a function of time. Such runway deicing chemicals are often also used on taxiways and other paved areas.&lt;/p&gt;\n \n&lt;p&gt;This test method does not quantitatively measure the theoretical or extended time ice melting capability of ready-to-use runway deicing/anti-icing chemicals in liquid or solid form.&lt;/p&gt;</p>"
