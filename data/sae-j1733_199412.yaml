  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;In order to compare test results obtained from different crash test facilities, standardized coordinate systems need to be defined for crash test dummies, vehicle structures, and laboratory fixtures. In addition, recorded polarities for various transducer outputs need to be defined relative to positive directions of the appropriate coordinate systems. This SAE Information Report describes the standardized sign convention and recorded output polarities for various transducers used in crash testing.&lt;/div&gt;&lt;/div&gt;</p>
