  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard defines a color index system used by, but not limited to, Government activities in a format suitable for color identification, color selection, color matching, and quality control inspection. It also describes the designation and use of color media that is available to conduct these activities. Use of the color index referenced in this standard is intended to promote standardization and consistency in the color of items produced for Government use. Color media is described as follows:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Color Chip Representation, Fan Deck: Suitable for color identification and selection.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Color Chip Representation, Color Book: Suitable for color identification and selection.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Precise Color Matching, Individual Color Chips: Suitable for color matching and quality control inspection purposes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Precise Color Matching, Set of Color Chips: Suitable for color matching and quality control inspection purposes.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
