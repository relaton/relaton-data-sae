  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope includes determination of frequency response characteristics for the entire measurement system except the microphone. However, the procedure described herein prescribes inclusion of the manufacturer’s frequency response calibration data for the microphone in order to determine if the overall system is within required tolerances. The scope also includes determination of certain dynamic performance characteristics of the sound level indication devices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The scope of this document does not encompass qualifying components for harmonic distortion, signal-to-noise ratio, tape recorder flutter and wow, etc. The references listed in &lt;span class="xref"&gt;section 6&lt;/span&gt; should be consulted for general performance requirements and precautions regarding instrumentation for acoustical measurements.&lt;/div&gt;&lt;/div&gt;</p>
