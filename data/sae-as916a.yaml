    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes the general material and design requirements for oxygen flow indicating devices intended to operate in conjunction with an oxygen regulator and mask system. Flow indicators covered by this standard are for use with demand, diluter-demand and continuous flow oxygen systems.&lt;/div&gt;&lt;/div&gt;</p>
