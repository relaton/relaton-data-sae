    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;All glazing materials used in motor vehicles operating on land highways should comply with the requirements of the American National Standard ANSI Z26.1-1966(R-1973). Safety Code for Safety-Glazing Materials for Glazing Motor Vehicles Operating on Land Highways, including its supplement ANSI Z26.1a-1969 (R-1973) or subsequent revisions. This is referred to hereafter as “the safety code.”&lt;/div&gt;&lt;/div&gt;</p>
