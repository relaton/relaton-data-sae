    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) applies to survival kits to be carried with life rafts or slide/rafts on transport category airplanes flying extended over-water routes and equipped with approved satellite alerting devices (e.g., 406 MHz Emergency Locator Transmitter (ELT)), available for deployment after an emergency landing.&lt;/div&gt;
