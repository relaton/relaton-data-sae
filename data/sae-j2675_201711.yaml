  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a test method for determination of heavy truck (Class VI, VII, and VIII) tire force and moment properties under combined cornering and braking conditions. The properties are acquired as functions of slip angle, normal force, and slip ratio. Slip angle and normal force are changed incrementally using a sequence specified in this document. At each increment, the slip ratio is continually changed by application of a braking torque ramp. The data are suitable for use in vehicle dynamics modeling, comparative evaluations for research and development purposes, and manufacturing quality control.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended to be a general guideline for testing on an ideal machine, and modifications to the protocols recommended within are expected depending on the requirements of each customer. Due care is necessary when modifying protocols to ensure that the integrity of the data is maintained.&lt;/div&gt;


    &lt;/div&gt;</p>
