    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Included herein are general, dimensional, and performance specifications for those types, styles, and sizes of stamped nuts of one pitch thread design recognized as SAE standard. These nuts are intended for general use where the engagement of a single thread on the mating screw or unthreaded stud is considered adequate for the application. For the inch equivalent of this document, see SAE J1053.&lt;/div&gt;&lt;/div&gt;</p>
