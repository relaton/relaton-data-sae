  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The procedures contained in this specification cover the laboratory testing of Exterior Lamps for use in automotive road illumination. The following tests are intended to be run under the following conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document shall be applied to systems that meet the requirements for design, performance and validation established by government standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;If other manufacture’s components are intended to be approved for use in the lamp assembly, then those possible combinations of components shall be considered a new lamp assembly and shall also be tested&lt;/i&gt;.&lt;/div&gt;&lt;/div&gt;</p>
