    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document sets forth design and operational recommendations concerning the human factors issues and criteria for airborne collision and avoidance systems. The visual and aural characteristics are covered for the display of traffic information as well as the escape maneuver display on conventional and electronic flight decks. System utilization philosophy and flight deck integration considerations are also presented.&lt;/div&gt;&lt;/div&gt;</p>
