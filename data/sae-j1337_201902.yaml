    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the important fundamental maintenance and service precautions for all off-road single-piece and multi-piece rims. Detailed information on specific procedures concerning mounting, demounting, maintenance, and service of a particular type, style, or design of off-road rim assembly can be obtained by consulting rim or tire manufacturers or distributors. These procedures and service precautions should be considered in preparation of the machine service manual, the operator's manual, and workplace procedures.&lt;/div&gt;&lt;/div&gt;</p>
