  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Provide a requirements document for RFID Tag Manufacturers to produce active RFID tags for the Aerospace industry.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Identify the minimum performance requirements for active RFID tags to be used on or in close proximity to aircraft.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Specify the test requirements specific to active RFID tags for aircraft use, in addition to RTCA DO-160 compliance requirements separately called out in this document.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Identify existing standards applicable to active RFID Tag.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Provide a certification standard for RFID tags which will use permanently-affixed installation on aircraft and aircraft parts.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Battery standards are separately captured and not included in this document.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;</p>
