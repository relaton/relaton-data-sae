  content: |-
    <p>&lt;div class="section abstract"&gt;



    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines minimum performance standards, qualification requirements, and minimum documentation requirements for passenger and crew seats in civil rotorcraft, transport aircraft, and general aviation aircraft. The goal is to achieve comfort, durability, and occupant protection under normal operational loads and to define test and evaluation criteria to demonstrate occupant protection when a seat/occupant/restraint system is subjected to statically applied ultimate loads and to dynamic impact test conditions set forth in Title 14, Code of Federal Regulations (14 CFR) parts 23, 25, 27, or 29 (as applicable to the seat type). Two formats of this standard (MS Excel and Adobe PDF) are available. The standards provided in both formats (MS Excel and Adobe PDF) contain the same text.&lt;/div&gt;

    &lt;/div&gt;</p>
