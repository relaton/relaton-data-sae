  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report covers engine tests performed in Altitude Test Facilities (ATFs) with the primary purpose of determining steady state thrust at simulated altitude flight conditions as part of the in-flight thrust determination process. As such it is complementary to AIR1703 and AIR5450, published by the SAE E-33 Technical Committee. The gross thrust determined using such tests may be used to generate other thrust-related parameters that are frequently applied in the assessment of propulsion system performance. For example: net thrust, specific thrust, and exhaust nozzle coefficients.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The report provides a general description of ATFs including all the major features. These are:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Test cell air supply system. This controls the inlet pressure and includes flow straightening, humidity and temperature conditioning.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Air inlet duct and slip joint. Note that the report only covers the case where the inlet duct is connected to the engine, not free jet testing.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Thrust stand force measurement system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Test cell&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Cell exhaust system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Measurement system&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;The report provides detailed technical information on how the facilities are operated, including:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Program planning guidelines&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Optimization of the tests&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Setting and control of flight conditions&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Assessment of the data&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;A technical discussion provides the underlying physics for:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Air mass flow determination&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Determination of the conditions in the inlet duct and slip joint&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Derivation of thrust and related parameters&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Correction of data to nominal flight conditions&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Measurement uncertainty&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;The initial issue of this report primarily address ATF testing of engines intended for use on subsonic, transport aircraft. Future revisions to the report will include greater content relevant to the testing of engines for supersonic aircraft, including the wider and higher flight envelopes associated with such aircraft and the technical issues raised by these flight conditions.&lt;/div&gt;&lt;/div&gt;</p>
