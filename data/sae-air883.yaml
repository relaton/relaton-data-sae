abstract:
- language: en
  script: Latn
  content: "<p>(This document supersedes and cancels AIR 12) 'Ground resonance' is
    a term which originated in the early days of autogiro development in this country.
    It is a somewhat ambiguous term as the conditions it describes usually occur at
    the ground but do not have any association with the common expression 'ground
    effect'. However, the troubles usually associated with 'ground resonance' do occur
    when the ship is on or near the ground.</p>"
