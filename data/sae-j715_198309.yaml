  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification sets forth requirements for the attachment of three-point hitch implements or equipment to the rear of agricultural wheeled tractors by means of a three-point free-link in association with a power lift.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In order to assure proper performance of certain implements, standard dimensions for mast height, mast pitch adjustment, and implement leveling adjustment are included. Location of link attachment points is not restricted and is, therefore, left to the discretion of the tractor designer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;If draft links are used for trailing power take-off implements, a means shall be included for locking the draft links in a fixed position, and a draw-bar hitch point shall be positioned in conformance with power takeoff standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensions comprising the standard specifications are divided into four categories:&lt;/div&gt;
    &lt;/div&gt;</p>
