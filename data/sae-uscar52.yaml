  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the DV/PV performance and validation requirements for frontal airbag modules, namely driver, passenger, and knee airbags. In cases where airbag designs fall outside the scope of this standard, the Responsible Vehicle Engineering Organization (RVEO) is the final arbiter of all performance requirements within this specification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Additional system level requirements may be introduced by the RVEO but are outside the scope of this specification.&lt;/div&gt;&lt;/div&gt;</p>
