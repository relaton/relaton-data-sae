    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides headlamp beam pattern test points for harmonized low and high beam headlamp beam patterns that incorporate elements of European, Asian, and U.S. photometric tables. These photometric tables are optional to those found in SAE J1383.&lt;/div&gt;&lt;/div&gt;</p>
