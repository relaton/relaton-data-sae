    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes requirements for plastic convoluted tubing that provides mechanical protection and support for electric wire bundles. The continuous operating temperatures range from -67°F (-55°C) to 500°F (260°C) (see &lt;span class="xref"&gt;6.1&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
