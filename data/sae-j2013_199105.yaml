  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This glossary of tire military/industry terminology is a direct result of many months of planned and coordinated work by the SAE Military/Industry Tire Technology Nomenclature Task Force. This effort was put forth with the hope of leading the military and industry towards standardization of terminology. This glossary represents the latest state-of-the-art terms and definitions for military use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice shall remain open for comments from the reader and shall also be reviewed and updated periodically. Many similar terms and definitions were reviewed from which the ones best applied to military use were selected. It is the purpose of this task force to provide technical definitions in present day use. Please do not hesitate to inform the task force of any improvements which may be required.&lt;/div&gt;&lt;/div&gt;</p>
