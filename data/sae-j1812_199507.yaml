  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a general method for defining the function performance status classification for the functions of automotive electronic devices upon application of the test conditions specified as described in appropriate EMC test standards (for example, the SAE J1113 series and the SAE J551 series). Testing of devices could be performed either on or off vehicles. Appropriate test signal and methods, region of performance, and test signal severity level would have to be specified in the individual cases.&lt;/div&gt;&lt;/div&gt;</p>
