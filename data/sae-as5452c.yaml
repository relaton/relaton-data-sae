abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) will specify what type of NVGs are required and minimum requirements for compatible crew station lighting, aircraft exterior lighting such as anti-collision lights, and position/navigation lights that are “NVG compatible.” Also, this document is intended to set standards for NVG utilization for aircraft so that special use aircraft such as the Coast Guard, Border Patrol, Air Rescue, Police Department, Medivacs, etc., will be better equipped to chase drug smugglers and catch illegal immigrants, rescue people in distress, reduce high-speed chases through city streets by police, etc. Test programs and pilot operator programs are required.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For those people designing or modifying civil aircraft to be NVG compatible, the documents listed in &lt;span class="xref"&gt;2.1.3&lt;/span&gt; are essential.&lt;/div&gt;&lt;/div&gt;</p>
