    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report approaches the material selection process from the designer’s viewpoint. Information is presented in a format designed to guide the user through a series of decision-making steps. “Applications criteria” along with engineering and manufacturing data are emphasized to enable the merits of aluminum for specific applications to be evaluated and the appropriate alloys and tempers to be chosen.&lt;/div&gt;&lt;/div&gt;</p>
