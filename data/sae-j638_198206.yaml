    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice, limited to liquid coolant systems, establishes uniform vehicle heater test procedures. Both laboratory and complete vehicle tests are specified in this recommended practice. Required test equipment, facilities and definitions are included.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Defrosting and defogging procedures and requirements can be found in SAE J902b, J381, J382, and J953.&lt;/div&gt;&lt;/div&gt;</p>
