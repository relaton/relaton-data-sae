  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers chemical check (product or verification) analysis limits for corrosion and heat resistant steels and alloys, maraging and other highly-alloyed steels, and iron alloys as established by AMS or AISI usage. The chemical check analysis limits shown herein shall apply when this specification is referenced in the material specification. Check analysis limits for elements or ranges of elements not listed herein shall be as specified in the material specification or as agreed upon by purchaser and vendor.&lt;/div&gt;&lt;/div&gt;</p>
