  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this AIR is to provide a comprehensive description document that displays various examples of transport and business aircraft systems driving Trimmable Horizontal Stabilizers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The main focus is on mechanical systems which may be actuated hydraulically or electrically. The document is intended as an overview for those specifying or designing Horizontal Stabilizer Trim Actuators in order to compare existing solutions as reference for implementation in new aircraft programs.&lt;/div&gt;&lt;/div&gt;</p>
