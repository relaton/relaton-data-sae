  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides information and recommended guidelines for handling carry-on baggage prior to emergencies and during the emergency evacuation of transport category aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Recommendations are provided on limiting the size, amount, and weight of carry-on baggage brought into the cabin, improved stowage of carry-on baggage to minimize hazards to passengers in flight and during emergency evacuations, and procedures to ensure carry-on baggage is not removed during an emergency evacuation.&lt;/div&gt;&lt;/div&gt;</p>
