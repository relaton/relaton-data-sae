  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes two procedures for sampling particles in dust controlled spaces. One procedure covers airborne dust above 5 μm. The other (and newly added procedure) covers particles of 25 μm and larger that “fall out” of the environment onto surfaces. In each case the particles are sized in the longest dimension and counted. Airborne particles are reported as particles per cubic meter (cubic foot) whereas particles collected in fall out samples are reported as particles per 0.1 square meter (square foot). This document includes English units in parentheses as referenced information to the SI units where meaningful.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These procedures may also be used for environmental analysis where the quality of the particles by visual or chemical analysis is intended.&lt;/div&gt;&lt;/div&gt;</p>
