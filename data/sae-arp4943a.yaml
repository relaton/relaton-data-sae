  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers the design and installation requirements for hydraulic systems (up to 8000 psig [56 MPa]) for ground support equipment (GSE). This ARP is derived from AS5440, which provides hydraulic system requirements for aircraft. The recommendations herein are primarily intended for GSE that exchange hydraulic fluid with the aircraft, such as hydraulic service carts, rather than GSE with non-interfacing hydraulic systems. The GSE may be mobile, portable, or stationary.&lt;/div&gt;
    &lt;/div&gt;</p>
