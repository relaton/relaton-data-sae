  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method establishes a standard procedure for using plug gages to evaluate dimensional conformance of lined inside diameters of bearings. Bearings covered by this test method include sleeve bearings and lined bore spherical bearings. Note that this method gives no indication of true cylindricity.&lt;/div&gt;&lt;/div&gt;</p>
