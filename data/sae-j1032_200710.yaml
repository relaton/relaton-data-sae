abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this SAE Recommended Practice is to provide a set of
    recognized definitions as a universally understood means of communication among
    all people interested in the inherent availability of off-Road Work machines.
    \ It is not the intent of this document to provide an absolute measure of unit
    availability.  The intent is to provide common definitions for classifying and
    evaluating operation, repair, and maintenance data.  This recommended practice
    applies to construction and general purpose industrial machines as categorized
    in SAE J1116. It describes the parameters related to the inherent availability
    of the covered classes of Off-Road Self-Propelled Work Machines.</p>"
