    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) provides instructions for intended proper use of Aerospace Standard AS36100 published 2005-02, as the technical reference for airworthiness approval of air cargo unit load devices (pallets, nets and containers) to be loaded on board civil transport aircraft. For consistency and cross-checking purposes, it also includes instructions for proper use of previous NAS 3610 [Revision 10, 1990, referenced in TSO C90c], as commonly understood by the industry.&lt;/div&gt;&lt;/div&gt;</p>
