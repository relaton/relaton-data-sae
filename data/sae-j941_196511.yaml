  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes two dimensional eye ranges, representative of several percentile increments of the driving population, for use in defining the driver's visual requirements to interior and exterior environments in passenger cars and station wagons. It is to be used in conjunction with the two-dimensional manikin specified in report SAE J826. Complete definitions for the interior dimensions used in this SAE Recommended Practice are specified in the SAE Aerospace-Automotive Drawing Standards, Section El.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Reproductions of the passenger car driver's eye range contours may be obtained from SAE by ordering drawings supplementary to SAE J941.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This recommended practice is intended as a guide toward standard engineering paratice. Its use is not recommended as a basis for legal regulation.&lt;/div&gt;&lt;/div&gt;</p>
