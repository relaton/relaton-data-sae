  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to the development of Plans for integrating and managing electronic components in equipment for the military and commercial aerospace markets; as well as other ADHP markets that wish to use this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Examples of electronic components, as described in this document, include resistors, capacitors, diodes, integrated circuits, hybrids, application specific integrated circuits, wound components, and relays.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is critical for the Plan owner to review and understand the design, materials, configuration control, and qualification methods of all “as-received” electronic components, and their capabilities with respect to the application; identify risks, and where necessary, take additional action to mitigate the risks.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The technical requirements are in &lt;span class="xref"&gt;Clause 3&lt;/span&gt; of this standard, and the administrative requirements are in &lt;span class="xref"&gt;Clause 4&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
