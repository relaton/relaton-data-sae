  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides recommendations for the best practices to be followed in the molding of rigid thermoplastic and thermosetting molding compounds. The molding processes covered in this document are injection, transfer and compression molding. Recommendations are made on the design details of the part such as draft angles and processing considerations such as gate location in order to yield an easily producible, high quality, functional part.&lt;/div&gt;&lt;/div&gt;</p>
