  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) 5659/4 Physical Layer Specification provides guidance for the physical layer of optical networks which use Wavelength Division Multiplexing (WDM), within the AS5659 WDM LAN specification document family. The physical layer consists of the optical interconnections between the functional components of the network. Performance requirements for general interconnections are described. For guidance, standards are identified, corresponding to each of several environments, which describe physical layer design, installation, maintenance, and training.&lt;/div&gt;&lt;/div&gt;</p>
