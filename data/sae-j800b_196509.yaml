  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;It is the purpose of this SAE Recommended Practice to define minimum requirements for content of the installation instruction sheet intended to accompany a seat belt assembly offered for installation in a motor vehicle at other than the vehicle manufacturer’s plant. Its primary intent is to provide guidance in the installation of seat belt assemblies meeting the requirements of SAE J4. These minimum instruction requirements may be supplemented by more specific manufacturer’s instructions, if they are necessary to provide proper installation in a particular vehicle.&lt;/div&gt;&lt;/div&gt;</p>
