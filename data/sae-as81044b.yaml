  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AS81044 covers single conductor electric wires made as specified in the applicable detail specification with tin-coated, silver-coated, or nickel-coated copper or copper alloy conductors insulated with crosslinked polyalkene, crosslinked alkane-imide polymer, or polyarylene. The crosslinked polyalkene, crosslinked alkane-imide polymer, or polyarylene may be used alone or in combination with other insulation materials as specified in the detail specification.&lt;/div&gt;&lt;/div&gt;</p>
