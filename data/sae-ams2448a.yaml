  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers engineering requirements for applying tungsten carbide thermal spray coatings to ultra high strength steels (220 ksi and above) utilizing high velocity oxygen fuel (HVOF) combustion driven processes and the properties for such coatings. The processes and procedures herein apply only to the properties of the as-deposited coating.&lt;/div&gt;&lt;/div&gt;</p>
