    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The primary function of this specification is to cover the general requirements for 28 VDC manual reset trip-free arc fault/thermal circuit breakers for use in aircraft electrical systems conforming to MIL-STD-704. As a secondary function, this specification may possibly cover the general requirements for AFCBs for use in primary vehicles, other than aircraft, when mounted directly to the structure.&lt;/div&gt;&lt;/div&gt;</p>
