    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This index provides a overview of lubricants and symbols for the purpose of assisting the user in the identification of the appropriate product and relevant SAE specification. The aim is to better determine he best lubricant to be used for a particular application.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;If containers used for shipping lubricants are also to be marked, the same identification and symbols should be used.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;See also ISO 5169 Machine tools - Presentation of lubrication instructions.&lt;/div&gt;
    &lt;/div&gt;</p>
