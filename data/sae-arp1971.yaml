  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers requirements for a self-propelled, boom type aerial device, equipped with an aircraft deicing fluid spraying system. The unit shall be highly maneuverable for deicing all exterior surfaces of wide-body and intermediate size aircraft, e.g., B-747 and B-737. The vehicle will also be used for aircraft maintenance and inspection. The vehicle shall be suitable for day and night operations.&lt;/div&gt;&lt;/div&gt;</p>
