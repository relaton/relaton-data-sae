abstract:
- language: en
  script: Latn
  content: |-
    <p>이 문서는 공급자가 9100의 조항을 준수하고자 할 때 AQAP-2110을 적용하는 것에 관한 정보와 지침을 제공하기 위해 작성 및 발행된 것이다. 이 문서는 AQAP-2110-SRD.2 및 IA9137로 간행된다. 이는 NATO와 산업계에서 AQAP-2110과 9100 간의 관계에 대한 이해와 활용을 촉진하기 위해 NATO와 산업계 대표들이 공동으로 작성한 것이다. 획득 국가가 자국의 조달 방법으로 대외군사판매(FMS)를 이용할 때는 AQAP가 필요할 수 있다.

    이 문서는 획득 국가와 9100을 준수하고자 하는 공급 국가의 AQAP-2110 요구사항 해석에 있어 공통성을 제공하는 데에 목적을 두고 있다.

    이 문서의 내용은 법적 또는 계약상의 지위를 갖지 않으며, 일체의 AQAP-2110 또는 9100 요구사항을 대체하거나 그 요구사항에 추가되는 것도 아니다.

    있을 수 있는 조건의 다양성(작업 또는 공정의 유형, 사용 기기 및 관련 인원의 역량에 따르는) 때문에, 이 지침이 모든 것에 적용되는 것으로 간주하거나, 계약 요구사항 충족에 필요한 특정 수단 또는 방법을 강요하는 것으로 간주해서는 안 된다. 이해당사자들은 이러한 요구사항을 충족하기 위해 다른 수단 또는 방법을 사용할 수도 있다는 점을 알고 있어야 한다.

    이 지침 사용자는 계약서에 명시되는 바와 같이 AQAP 2110 요구사항이 공급자와 하청업체가 지켜야 하는 의무사항임을 명심해야 한다.</p>
