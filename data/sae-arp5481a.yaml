    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides the recommended procedure for obtaining desired preloads in aircraft wheel tie bolts when mounting tires and assembling the wheel. It is generally referred to as the snug-angle bolted joint assembly procedure. It is also known as the “torque-turn” procedure in the heavy equipment ground vehicle industry.&lt;/div&gt;
    &lt;/div&gt;</p>
