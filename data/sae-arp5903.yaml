  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides information, guidelines, and practices for the application, use, and administration of two-dimensional and three-dimensional droplet impingement and ice accretion computer codes. The codes provide computational simulations of inflight icing that predict droplet trajectory, water loading, and ice accretion on aircraft components. These ice accretion characteristics are used during the aircraft design and certification process.&lt;/div&gt;

    &lt;/div&gt;</p>
