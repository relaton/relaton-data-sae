    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report lists military and industry specifications and standards which are used in Aero/Space Hydraulic and Pneumatic Systems. It is intended as a supplement to Specifications MIL-H-5440 and MIL-P-5518. Only those hardware standards which have been specifically designed for hydraulic or pneumatic use are listed. Revisions and amendments which are current for these specifications and standards are not listed.&lt;/div&gt;&lt;/div&gt;</p>
