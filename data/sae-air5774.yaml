    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is a compilation of engineering references and data useful to the technical community that can be used to ensure fuel system compatibility with composite structure. This AIR is not a complete detailed design guide and is not intended to satisfy all potential fuel system applications. Extensive research, design, and development are required for each individual application.&lt;/div&gt;


