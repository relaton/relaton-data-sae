  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This handbook details the TechAmerica Technical Fellowship Selection Process. It identifies the tasks to be performed and associates them with participants in the process. The focus is intended to keep the process implementation as uniform as possible.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;There are three types of information in this handbook:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Process details&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Candidate Application Package format&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Process infrastructure and description&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;Each Section of this handbook describes a significant segment of the selection process. There are also appendices that contain a variety of supporting material relevant to the different process participants.&lt;/div&gt;&lt;/div&gt;</p>
