  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommend Practice specifies a method for measuring the deflection of friction materials and disc brake pad assemblies in a manner more consistent with classical material compressive strain testing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE test method differs from SAE J2468 in the preload and maximum load applied to the test sample when deflection is measured. It adopts the material applied stress levels found in ISO 6310 (0.5 to 8.0 MPa) using a 25 mm diameter flat plunger.&lt;/div&gt;&lt;/div&gt;</p>
