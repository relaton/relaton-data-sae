    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes performance guidelines for the threshold pressure and brake force output of the brakes on the axles of air-braked towing trucks, truck-tractors, truck-trailers, and converter dollies with GVWRs over 4536 kg (10 000 lb) designed to be used on the highway in combination with other air-braked vehicles of this type in commercial operations.&lt;/div&gt;
