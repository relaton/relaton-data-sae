  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure establishes a recommended practice for performing a Low Speed Thorax Impact Test to the Hybrid III Small Female Anthropomorphic Test Device (ATD or crash dummy). This test was created to satisfy the demand by the industry to have a certification test which results in peak chest deflection similar to current full vehicle, frontal impact tests. An inherent problem exists with the current certification procedure because the normal (6.7 m/s) thorax impact test has test results for peak chest deflection that are greater than those currently seen in full vehicle, frontal tests.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The intent of this document is to develop a low speed thorax certification procedure for the H-III5F dummy with a 3.0 m/s impact similar to the SAE J2779 procedure for the H-III50M dummy.&lt;/div&gt;&lt;/div&gt;</p>
