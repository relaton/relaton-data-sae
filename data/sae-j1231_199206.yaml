    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers complete general and dimensional specifications for beaded tube hose fittings. These fittings are intended for general applications in low pressure automotive and hydraulic systems on automotive, industrial, and commercial products. The fittings shown in &lt;span class="xref"&gt;Figures 1&lt;/span&gt; to &lt;span class="xref"&gt;3&lt;/span&gt; and &lt;span class="xref"&gt;Table 1&lt;/span&gt; are intended for use with low pressure hose and shall be retained by hose clamps as specified in SAE J536.&lt;/div&gt;&lt;/div&gt;</p>
