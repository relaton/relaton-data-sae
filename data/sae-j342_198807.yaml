  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice establishes equipment and procedures for the evaluation of the effectiveness and other performance characteristics of spark arresters or turbochargers used on the exhaust system of large engines normally used in railroad locomotives, stationary power plants, and other similar applications. This recommended practice does not cover applications requiring flame arresting, exhaust gas cooling, or isolation from explosive gases. Two testing methods are presented; a laboratory test using ambient air (cold test) and an engine test using exhaust gases (hot test). The engine test (hot test) is preferred. Arresters tested by this recommended practice can be expected to perform as tested when tilted no more than 45 deg from their normal position. Test results from a spark arrester or turbocharger evaluated by an engine test can be applied to different engines of similar design, provided the data shows it to be effective in the applicable flow ranges.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Certain design and performance characteristics, which represent current requirements by regulatory agencies for qualification and approval under this recommended practice, are listed in the &lt;span class="xref"&gt;Appendix&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Note: This illustration is intended to be general in nature, and does not represent any particular brand or manufacturer to the exclusion of others.&lt;/div&gt;&lt;/div&gt;</p>
