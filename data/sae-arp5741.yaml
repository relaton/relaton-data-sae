    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) defines a series of test procedures to determine the temperature conditioning performance of air mode containers with active conditioning systems, a classification system for air mode containers with active condition systems, a standard means of expressing conditioning performance within each classification and a standard means of documenting test results.&lt;/div&gt;&lt;/div&gt;</p>
