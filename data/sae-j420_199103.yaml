    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Information Report is to provide general information relative to the nature and use of magnetic particles for nondestructive testing. The document is not intended to provide detailed technical information, but will serve as an introduction to the theory and capabilities of magnetic particle testing, and as a guide to more extensive references.&lt;/div&gt;&lt;/div&gt;</p>
