    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Included in this SAE Recommended Practice are complete general and dimensional data for the high and low types of crown nuts recognized as SAE Standard. These nuts are primarily intended for application in automotive and other ground-based motor vehicles and industrial equipment to provide an ornamental or protective closure over end of bolts, studs, or screws.&lt;/div&gt;&lt;/div&gt;</p>
