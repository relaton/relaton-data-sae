    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following definitions and illustrations are intended to establish common nomenclature and terminology for universal joints and driveshafts used in various driveline applications. In addition, useful guidelines are included for the application of universal joints and driveshafts. For more specific details, see Universal Joint and Driveshaft Design Manual, AE-7.&lt;/div&gt;&lt;/div&gt;</p>
