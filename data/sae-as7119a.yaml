  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for suppliers of Electronics Printed Circuit Boards to be accredited by Nadcap. Nadcap accreditation is granted in accordance with SAE AS7003 after demonstrating compliance with the requirements herein. These requirements may be supplemented by additional requirements specified by Nadcap Electronics Task Group. Using the audit checklist (AC7119) will ensure that accredited Electronics Printed Circuit Boards suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;&lt;/div&gt;</p>
