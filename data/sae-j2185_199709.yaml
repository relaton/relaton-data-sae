  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to 12 V storage batteries which operate in a voltage regulated charging system. It simulates heavy-duty applications by subjecting the battery to deeper discharge and charge cycles than those encountered in starting a vehicle. The deeper discharge and charge cycles in service may come from a combination of the following conditions:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Frequent occurrences of total electrical load exceeding the alternator output.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Frequent occurrences of battery system supplying the electrical loads when the engine is not operating.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Frequent occurrences of prolonged vehicle storage combined with high vehicle key-off loads.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Batteries will be classified into two types for this life test. Type 1 applies to batteries with reserve capacity of 200 min or less. Type 2 applies to batteries with reserve capacity greater than 200 min. (“C” value for Type 1 equals 25.0; “C” value for Type 2 equals 50.0.)&lt;/div&gt;&lt;/div&gt;</p>
