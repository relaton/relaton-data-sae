abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to the development of Plans for integrating and managing COTS assemblies in electronic equipment and Systems for the commercial, military, and space markets; as well as other ADHP markets that wish to use this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For purposes of this document, COTS assemblies are viewed as electronic assemblies such as printed wiring assemblies, relays, disk drives, LCD matrices, VME circuit cards, servers, printers, laptop computers, etc. There are many ways to categorize COTS assemblies&lt;sup&gt;&lt;span class="xref"&gt;1&lt;/span&gt;&lt;/sup&gt;, including the following spectrum:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;At one end of the spectrum are COTS assemblies whose design, internal parts&lt;sup&gt;&lt;span class="xref"&gt;2&lt;/span&gt;&lt;/sup&gt;, materials, configuration control, traceability, reliability, and qualification methods are at least partially controlled, or influenced, by ADHP customers (either individually or collectively). An example at this end of the spectrum is a VME circuit card assembly.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;At the other end of the spectrum are COTS assemblies whose design, internal parts, materials, configuration control, and qualification methods are not controlled, or controllable, in any way by ADHP customers (either individually or collectively). An example is a disk drive targeted for an industry other than ADHP use. It is critical for the Plan owner to (1) review and understand the design, internal parts, materials, configuration control, reliability and qualification methods of all “as-received” COTS assemblies&lt;sup&gt;&lt;span class="xref"&gt;3&lt;/span&gt;&lt;/sup&gt;, and their capabilities with respect to their application in the intended System and environment; (2) identify risks, and where necessary, (3) take additional action to mitigate the risks associated with the performance and reliability of the COTS assembly in the ADHP system.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
