abstract:
- language: en
  script: Latn
  content: "<p>The SAE J2214 specification describes the application of the  MS-DOS(TM) computer between the OEM and component vendors, defines the required elements comprising a Vehicle Electronics Programming Station, and identifies software interfaces needed between OEM-supplied elements and vendor-supplied elements. The software interfaces are described in SAE J2286 and SAE J1683. By maintaining common elements with J1924, the orderly transition from vendor Communication Programs to Vendor  Component Programs will be assured. Beyond clarification of the J1924  document, the changes to VEPS and Vendor Communications Programs are focused on the implementation of a common method for communicating with the vehicle's network for all vendor communications. The SAE J2214 specification describes the application of the MS-DOS(TM) computer between the OEM and component vendors, defines the required elements comprising a Vehicle Electronics Programming Station, and identifies software interfaces needed between O component vendors.</p>"
