  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies a method for testing and measuring elastic constants in friction materials by precise ultrasonic velocity measurements. Measurement methods are also described for measurement of the out-of-plane modulus as a function of pre-load as well as the measurement of engineering constants as a function of temperature. Finally, methods are formulated to produce all engineering constants as a function of pre-load and temperature.&lt;/div&gt;&lt;/div&gt;</p>
