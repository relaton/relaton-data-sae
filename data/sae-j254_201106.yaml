  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform laboratory techniques for the continuous and bag-sample measurement of various constituents in the exhaust gas of the gasoline engines installed in passenger cars and light-duty trucks. The report concentrates on the measurement of the following components in exhaust gas: hydrocarbons (HC), carbon monoxide (CO), carbon dioxide (CO&lt;sub&gt;2&lt;/sub&gt;), oxygen (O&lt;sub&gt;2&lt;/sub&gt;), and nitrogen oxides (NO&lt;sub&gt;x&lt;/sub&gt;). NO&lt;sub&gt;x&lt;/sub&gt; is the sum of nitric oxide (NO) and nitrogen dioxide (NO&lt;sub&gt;2&lt;/sub&gt;). A complete procedure for testing vehicles may be found in SAE J1094.&lt;/div&gt;
