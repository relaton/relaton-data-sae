  content: |-
    <p>&lt;p&gt;This Technical Bulletin covers the following areas of concern.&lt;/p&gt;
    &lt;p&gt;Prevention: Actions recommended for procuring parts and materials with a full warranty; Actions recommended for minimizing risks and protecting your Program from counterfeiting; Actions recommended when buying from a non-authorized supplier.&lt;/p&gt;
    &lt;p&gt;Detection: Actions recommended when procuring parts from an unauthorized supplier or otherwise suspect that a part or material at risk of being counterfeit has been procured.&lt;/p&gt;
    &lt;p&gt;Risk Mitigation: Actions recommended when no reasonable alternatives exist (e.g., a redesign is required, an unacceptable schedule delay will result, the program or customer cannot bear the additional cost) and the decision has been made to procure from a non-authorized supplier.&lt;/p&gt;</p>
