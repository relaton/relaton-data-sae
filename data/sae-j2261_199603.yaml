    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides test procedures, requirements, and guidelines for stop lamps and turn signal lamps intended for use on vehicles 2032 mm or more in overall width. Stop lamps and front- and rear-turn signal lamps conforming to the requirements of this document may be used on vehicles less than 2032 mm in overall width.&lt;/div&gt;&lt;/div&gt;</p>
