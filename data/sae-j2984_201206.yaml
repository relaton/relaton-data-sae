  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The chemistry identification system is intended to support the proper and efficient recycling of rechargeable battery systems used in transportation applications with a maximum voltage greater than 12V (including SLI batteries). Other battery systems such as non-rechargeable batteries, batteries contained in electronics, and telecom/utility batteries are not considered in the development of this specification. This does not preclude these systems from adapting the format proposed if they so choose.&lt;/div&gt;
    &lt;/div&gt;</p>
