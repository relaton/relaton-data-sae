  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification applies to a communication protocol for networked control systems. The protocol provides peer-to-peer communication for networked control and is suitable for implementing both peer-to-peer and master-slave control strategies. This specification describes services for all seven protocol layers. In the layer 7 specification, it includes a description of the types of messages used by applications to exchange application and network management data.&lt;/div&gt;&lt;/div&gt;</p>
