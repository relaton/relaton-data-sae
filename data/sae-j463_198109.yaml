abstract:
- language: en
  script: Latn
  content: "<p>This standard describes the chemical, mechanical, and dimensional requirements
    for a wide range of wrought copper and copper alloys used in the automotive and
    related industries. Wrought forms covered by this standard include sheet, strip,
    bar, plate, rod, wire, tube, and shapes; however, form required must be specified
    by purchaser.</p>"
