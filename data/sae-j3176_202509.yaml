    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the minimum circuit identification and requirements for Multi-Voltage Power Distribution Systems (MVPDS) for use on trucks and buses. A Multi-Voltage Power Distribution System is one that distributes two or three voltages, up to 60 VDC, to power the controls, instruments, and devices.&lt;/div&gt;&lt;/div&gt;</p>
