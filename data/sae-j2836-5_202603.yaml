abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report establishes the Use Cases for communications and customer-focused Key Performance Indicators (KPI) between plug-in electric vehicles (PEVs) and their customers. The Use Case Scenarios define the information to be communicated related to customer convenience features for charge on/off control, charge power curtailment, customer preference settings, charging status, electric vehicle supply equipment (EVSE) availability/access, and electricity usage, plus customer information resulting from conflicts to charging preferences. It also addresses the KPI that can provide a uniform set of metrics to quantitively assess the charging experience. This document only provides the Use Cases that define the communications requirements to enable customers to interact with the PEV and the KPI to optimize their experience with charging a PEV. Specifications such as protocols and physical transfer methods for communicating information are not within the scope of this document.&lt;/div&gt;
    &lt;/div&gt;</p>
