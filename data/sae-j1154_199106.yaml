    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies minimum performance and durability requirements for master cylinder assemblies of current established designs, components of which conform to SAE Standards. It is applicable to new assemblies from commercial production and remanufacture (factory rebuild). These performance requirements are based on those generally used by individual companies in the industry and have demonstrated satisfactory component field performance.&lt;/div&gt;
