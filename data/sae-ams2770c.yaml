  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the engineeing requirements for heat treatment of wrought aluminum alloy parts (See 8.1.6) by users or their vendors or subcontractors. It does not cover heat treatment by material producers, forge shops, or foundries except that the conditions (temperatures, soaking times, cooling rates) used by material producers and forge shops for qualification of response to heat treatment of their products shall conform to those specified herein. Castings and parts made from castings shall be heat treated in accordance with the procurement specification or MIL-H-6088.&lt;/div&gt;&lt;/div&gt;</p>
