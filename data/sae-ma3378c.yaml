    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers metric bolts and screws made from a corrosion and heat resistant, nickel-base alloy of the type identified under the Unified Numbering System as UNS N07001. The following specification designations and their properties are covered:
    &lt;div class="table-wrap anchor " id="tu1-MA3378C"&gt;
    &lt;div class="table-container"&gt;&lt;table class="br-none tbr-void " data-dataset-id=""&gt;
    &lt;tbody&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left " rowspan="2"&gt;MA3378&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;1210 MPa minimum ultimate tensile strength at room temperature&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;520 MPa stress-rupture strength at 730 °C&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left " rowspan="2"&gt;MA3378-1&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;1210 MPa minimum ultimate tensile strength at room temperature&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;726 MPa minimum ultimate shear strength at room temperature&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div/&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;</p>
