    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the test procedure for conducting a rollover test using a dolly fixture designed to laterally trip a vehicle into a roll. Its purpose is to establish a recommended test procedure which will standardize the procedure between different test facilities. A description of the test procedure, test instrumentation, photographic/video coverage, and the rollover fixture is included.&lt;/div&gt;&lt;/div&gt;</p>
