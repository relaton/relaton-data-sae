  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides information on the subject of Air Mode containers used for transporting "Hanging Loads" such as Garment-On-Hangers (GOH), or other roof supported cargo. It suggests considerations and recommendations for roof loaded containers to transport hanging loads efficiently and safely by air and to protect the aircraft floor and cargo system from damage due to overload conditions.&lt;/div&gt;

    &lt;/div&gt;</p>
