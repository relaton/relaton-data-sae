  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice is intended to provide industry technical personnel with an overview of vehicle speedometer system accuracy and offset requirements and odometer system accuracy requirements. Speedometer and odometer systems covered by this document are integrated into a vehicle's electrical and electronics system, assembled directly into the vehicle by the OEM, and use rotational data from at least one vehicle wheel that is appropriately converted into longitudinal vehicle speed and distance traveled information. This standard is limited to radial ply tires on new (as manufactured) cars, light trucks, and medium duty trucks. Other methods for measuring vehicle speed and distance traveled may be used provided they meet the performance recommendations herein. Any local market regulatory requirements must be met and shall supersede this document. Service parts are beyond the scope of this recommended practice.&lt;/div&gt;&lt;/div&gt;</p>
