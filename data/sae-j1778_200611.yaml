    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice identifies general requirements for hydraulic fluids to be used for ship systems and equipment with respect to power transmission, lubrication, and passive applications. It also indicates the environmental limits within which the fluids shall perform their intended purpose satisfactorily and reliably. Characteristics of particular importance to ship systems and equipment are discussed.&lt;/div&gt;

    &lt;/div&gt;</p>
