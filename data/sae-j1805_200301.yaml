  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is used to determine the exterior A-weighted equivalent sound power level of static and in-place dynamic machines (dozer, loader, excavator, and backhoe) similar to the sound power obtained in ISO 6393 static and ISO 6395 dynamic sound power test procedures. Additional machine types, specifically sweepers and scrubbers, covered by SAE J2130 have been added, and other work machine types covered by SAE J1116 may be added with appropriate cycle descriptions and machine preparation. The recommended test procedures include conventional integrating sound pressure level methods or the sound intensity method using paired microphones. The sound intensity methodology provides a practical indoor alternative and permits measurement in the factory environment. The procedures in this document assume that the dominant sources are not highly sensitive to load (i.e., cooling fan, engine, track system). This test can be used as a substitute for the ISO 6393 static and ISO 6395 dynamic sound power tests for many machine types.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements for the machine setup and operation, and the microphone array and hemispherical measurement surface are given in this document. This document shall be used in conjunction with instrumentation manufacturer's recommendations and SAE J/ISO 9614-1. The accompanying sound intensity procedure clarification is provided pending more widespread understanding of sound intensity.&lt;/div&gt;&lt;/div&gt;</p>
