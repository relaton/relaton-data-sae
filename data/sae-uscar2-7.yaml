  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Procedures included within this specification are intended to cover performance testing at all phases of development, production, and field analysis of electrical terminals, connectors, and components that constitute the electrical connection systems in low voltage (0 to 20 VDC) road vehicle applications. These procedures are only applicable to terminals used for In-Line, Header, and Device Connector systems. They are not applicable to Edge Board connector systems, twist lock connector systems, &amp;gt;20 VAC or DC, or to eyelet terminals.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;No electrical connector, terminal, or related component may be represented as having met USCAR/EWCAP specifications unless conformance to all applicable requirements of this specification have been verified and documented. All required verification and documentation must be done by the supplier of the part or parts. If testing is performed by another source, it does not relieve the primary supplier of responsibility for documentation (DVP&amp;amp;R) of all test results and for verification that all samples tested met all applicable Acceptance Criteria. See &lt;span class="xref"&gt;4.3&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
