  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is intended to assist the user (aircraft manufacturer/airline) in the following areas:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;In the decision of whether or not to plan for the installation of a powered drive system in the cargo loading system (CLS) during the definition of the aircraft on-board cargo loading system.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;If a powered drive system is decided upon, to provide general requirements to be considered during the preparation of component specifications for the powered drive units (PDUs) to be used. This provides a selection of criteria in order to obtain an optimum PDU for the application considered.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
