  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers all types of manually operated high pressure oxygen line shut off valves utilizing either metallic or nonmetallic valve seats for use in general and commercial type aircraft. It is intended that the line valve should be installed in a position accessible in flight, when the cylinder mounted oxygen valves are not. The line shutoff valve may also be used optionally in large systems as a maintenance aid where only a portion of the system need be opened up and purged after repair or replacement of one or more parts.&lt;/div&gt;&lt;/div&gt;</p>
