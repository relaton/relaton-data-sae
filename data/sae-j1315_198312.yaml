  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice applies to the selection of tires and rims for load carrying ability as related to size, inflation pressure, and speed for machines in SAE J1116 Category 1, Construction. Included are off-road tires of categories E, L, G, and C only, together with rims commonly used to mount them (Ref. J751 APR80). Consideration of tire characteristics such as flotation, cut and bruise resistance, ride quality, wear, and tractive ability are not covered herein.&lt;/div&gt;&lt;/div&gt;</p>
