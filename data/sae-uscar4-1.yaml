  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is intended to cover cigar or cigarette lighters as well as power outlets based on the form and dimensions of the cigar lighter. This standard is a full performance specification, it includes dimensional and operational parameters as well as performance characteristics which must be met when submitting a cigar lighter assembly or power outlet assembly for production approval. This standard constitutes an acceptance specification for a surface mounted, front-loaded cigar lighter or power outlet.&lt;/div&gt;&lt;/div&gt;</p>
