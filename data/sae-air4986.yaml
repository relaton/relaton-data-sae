  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Turbine engine malfunctions account for a substantial portion of the maintenance actions required to keep both fixed and rotary wing aircraft operational. Undetected incipient component failures can result in secondary engine damage and expensive unscheduled maintenance actions. Recent developments of electrostatic methods now provide the potential for the detection of foreign object ingestion and early detection of distress in gas path components. This SAE Aerospace Information Report (AIR) seeks to outline the history of the electrostatic technique and provides examples of state-of-the-art systems for both inlet and exhaust gas debris monitoring systems along with examples of most recent testing.&lt;/div&gt;&lt;/div&gt;</p>
