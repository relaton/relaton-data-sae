    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice promotes uniformity in the evaluation and qualification tests conducted on gasoline direct injection (GDI) fuel injectors used in gasoline engine applications, where fuel pressures are typically well above 10 MPa. The document scope is limited to electrically actuated gasoline fuel injection devices used in automotive GDI systems and is primarily restricted to bench tests.&lt;/div&gt;
    &lt;/div&gt;</p>
