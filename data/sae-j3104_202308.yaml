    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document will apply to the most common applications of electric motors, used for activating all-wheel drive (AWD) and four-wheel drive (4WD) disconnect systems as used in passenger (car and light truck) vehicles. The standard will provide consistent definition, terminology, tests, and reporting methods.&lt;/div&gt;&lt;/div&gt;</p>
