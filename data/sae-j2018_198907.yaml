    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Recommended Practice is to guide the service technician and any organization planning training for the technician in selecting and using training programs. The overall objective is to improve the servicing of automotive vehicles by increasing the abilities of service technicians to troubleshoot, diagnose, repair, and service as required.&lt;/div&gt;&lt;/div&gt;</p>
