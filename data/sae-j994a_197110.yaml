  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The job requirements, along with local, state, or national codes, should dictate whether a backup alarm device shall be used on construction and mobile outdoor industrial machinery. In the cases of those machines which do not distinguish in direction of working travel and where the machine is equipped so the operator can face the direction of travel each time (for example, certain compactors, loaders, and dozers), the use of a backup alarm device may not be applicable.&lt;/div&gt;&lt;/div&gt;</p>
