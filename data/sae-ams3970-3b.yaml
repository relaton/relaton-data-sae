  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Purchasing Specification (PS), AMS3970/3, specifies the batch release and delivery requirements for carbon fiber fabric epoxy prepreg used for repair. This specification is applicable only when the carbon fiber fabric epoxy prepreg is used as part of the repair system defined in AMS3970 and AMS3970/1.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification also defines the procedure and requirements for storage life extension of materials purchased against this specification. It is only applicable for materials that are qualified against AMS3970 (refer to PRI QPL AMS3970) and shall be carried out within the responsibility of the purchaser and under control of its Quality organization.&lt;/div&gt;
    &lt;/div&gt;</p>
