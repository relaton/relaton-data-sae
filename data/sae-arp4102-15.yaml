  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends criteria for an Electronic Library System (ELS) for use on the flight deck of transport aircraft. The ELS may be the primary, and in some cases sole, on board source of documentation and information for flight operations, engineering, aircraft maintenance and training. This document addresses flight operations applications only.&lt;/div&gt;&lt;/div&gt;</p>
