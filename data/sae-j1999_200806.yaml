abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard specifies the essential dimensional features of N, NM, E, and EM scraper piston ring types.
    Dimensional Tables 7 and 8 offer the choice of two radial wall thicknesses:
    Radial wall thickness 'regular' (Table 7)
    Radial wall thickness 'D/22' (Table 8)
    The requirements of this document apply to scraper rings for reciprocating internal combustion piston engines up to and including 200 mm diameter. They may also be used for piston rings of compressors working under similar conditions.</p>
