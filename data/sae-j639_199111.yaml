    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is restricted to mechanical vapor compression refrigerant systems driven by the vehicle or auxiliary engine, which provides cooling for the passenger compartment. This document provides guidelines for refrigerant containment and safety for a mobile air-conditioning system. It is not intended to restrict the use of, or further development of, other types of refrigeration systems for passenger compartment cooling. Should other systems be found practical at some future time, this document may be amended or an additional recommended safety practice drawn up for such other systems.&lt;/div&gt;&lt;/div&gt;</p>
