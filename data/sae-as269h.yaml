  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides material identification codes for aluminum alloys, copper alloys, carbon steels, alloy steels, titanium alloys, corrosion resistant materials, and heat resistant materials that are used to make AN, MS, and AS engine and propeller standard utility parts. This document also provides similar material codes for company parts (such as nuts, bolts, etc.) having design configuration similar to other company parts or the engine and propeller standard utility parts (AN, MS, and AS) that are not of the same material.&lt;/div&gt;&lt;/div&gt;</p>
