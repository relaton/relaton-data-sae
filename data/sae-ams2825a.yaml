  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes requirements for the preparation of Material Safety Data Sheets which will provide information concerning the harmful or hazardous nature of materials to facilitate purchasers’ compliance with regulations of the U.S. Department of Labor, Occupational Safety and Health Administration. Requirements for submission of such data sheets will be specified in individual material and process specifications.&lt;/div&gt;&lt;/div&gt;</p>
