  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The code provides test procedures and methods of calculating a brake rating from the data obtained. At this time, the procedure has been developed to cover only brakes of the sizes and types generally used on commercial vehicles. Some general correlation may be expected between brake ratings established by this means and those obtained from vehicle tests such as outlined in SAE J880. However, the effects of brake environment as installed in various vehicles are not considered in this laboratory procedure.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The code may be used as a supplement to SAE J667, or it may be used independently.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Other methods of measuring energy absorption capacity and establishing a brake rating other than those described herein may be equally valid.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The user of this SAE Recommended Practice should also take note that the brake rating horsepower (brhp) calculated by conduct of this code is an arbitrary index of performance of the brake (and drum) when tested by this procedure and may be appreciably different from the values obtained by other techniques.&lt;/div&gt;&lt;/div&gt;</p>
