  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The recommendations of this ARP are primarily intended to be applicable to temperature control of compartments, occupied or unoccupied, of civil aircraft whose prime function is the transporting of passengers or cargo. The recommendations will apply, however, to a much broader category of civil and military aircraft where automatic temperature control systems are applicable.&lt;/div&gt;&lt;/div&gt;</p>
