  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidance for the design and installation of a commercial aircraft hydraulic system to meet the applicable requirements, including the applicable airworthiness regulations that affect the hydraulic system design.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP also provides information and guidelines on the many factors that arise in the design process to provide cost effectiveness, reliability, maintainability and accepted design and installation practices.&lt;/div&gt;&lt;/div&gt;</p>
