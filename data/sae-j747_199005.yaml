  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to hydraulic directional control valves as applied to self-propelled work machines referenced in SAE J1116. It describes a laboratory test procedure for evaluating:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Flow versus pressure drop&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Leakage rate&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Operating effort&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Metering characteristics versus spool travel, pilot pressure, or electrical current&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Relief valve characteristics&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The document applies to single and multiple section hydraulic directional control valves.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document illustrates axial, manually operated valves although the test procedure is applicable to other input forms such as rotary actuation, electric current, hydraulic or pneumatic pressure.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE—Performance characteristics such as metering hysteresis or dynamic response may have a significant effect on some of these tests.&lt;/div&gt;
    &lt;/div&gt;</p>
