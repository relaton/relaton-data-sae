  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Hose (also includes hose assemblies) has a finite life and there are a number of factors which will reduce its life.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This recommended practice is intended as a guide to assist system designers and/or users in the selection, installation, and maintenance of hose. The designers and users must make a systematic review of each application and then select, install, and maintain the hose to fulfill the requirements of the application. The following are general guidelines and are not necessarily a complete list.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;WARNING: IMPROPER SELECTION, INSTALLATION, OR MAINTENANCE MAY RESULT IN PREMATURE FAILURES, BODILY INJURY, OR PROPERTY DAMAGE.&lt;/div&gt;&lt;/div&gt;</p>
