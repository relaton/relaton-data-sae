  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this AIR is to provide recommendations for the minimum dimensions of characters and symbols used in aircraft instrument dials and panel displays as related to the conditions stated in para. &lt;span class="xref"&gt;3&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Numerous variables influence the legibility of aircraft instrument dial characters. This situation makes it very difficult, if not impossible, to establish an exact act of rules for optimizing all installations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Character size, one of the important considerations, can be optimized where adequate dial space exists. Usually this is not the case and the designer is faced with placing the information in a limited space while continuing to strive for error-free legibility. Appropriate minimum size requirements have been stated herein for guidance in air transport use.&lt;/div&gt;&lt;/div&gt;</p>
