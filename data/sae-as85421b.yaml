  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the design requirements and test procedures for separable beam seal fittings which includes end fittings (see &lt;span class="xref"&gt;2.3.4&lt;/span&gt;), fitting bodies (see &lt;span class="xref"&gt;2.3.7&lt;/span&gt;), and boss fittings (see &lt;span class="xref"&gt;2.3.2&lt;/span&gt;) for use in aerospace fluid systems. Design requirements are for class 3000 in corrosion resistant steel (15-5 PH, 17-4 PH CRES) only and for class 4000 in titanium alloy (Ti) and corrosion and heat-resistant steel (Nickel Alloy 718 CRES) only. Definition of fittings and related terms are defined in &lt;span class="xref"&gt;2.3&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
