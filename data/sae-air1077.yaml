    &lt;div class="htmlview paragraph"&gt;An attempt has been made to consider all features of seal ring design including configuration, materials, hardness, dimensions, surface finishes, surface treatment, leak testing, and general quality. In addition to this, allowable cylinder breathing and general quality requirements of mating hardware are discussed. Also, at the end of this report, there is a brief paragraph on other types of seal rings.&lt;/div&gt;&lt;/div&gt;</p>
