  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report establishes use cases for a Plug-in Electric Vehicle (PEV) communicating with an Energy Management System (EMS) as a Distributed Energy Resource (DER). The primary purpose of SAE J2836/3™ is to define use cases which must be supported by SAE J2847/3. This document also provides guidance for updates to SAE J2847/2 to allow an inverter in an EVSE to use the PEV battery when operating together as a distributed energy resource (DER).&lt;/div&gt;
    &lt;/div&gt;</p>
