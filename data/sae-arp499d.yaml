  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to provide recommendations which will lead to the standardization of interior door design and operation in all transport aircraft. Interior doors are broadly classified into two main categories which include egress path doors and non-egress path doors. The scope of this ARP does not include crew rest doors, secondary barriers to the flight deck, or doors incorporated in furniture surrounding passenger seats as defined in AS6960.&lt;/div&gt;&lt;/div&gt;</p>
