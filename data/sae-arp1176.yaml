  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides recommended practices for cleaning aircraft oxygen equipment such as tubing, pieces parts (including regulator and valve parts), cylinders and ground-based equipment that may be used to support aircraft oxygen systems. These methods may apply to gaseous and liquid oxygen equipment. This document specifies work area details, methods to select suitable cleaning chemicals, cleaning methods, test methods to verify cleanliness level, and methods of packaging the components and parts after cleaning. Person designated to clean oxygen equipment should be qualified and trained to clean oxygen equipment. Cleanliness levels achieved are strongly dependent on the capabilities of the persons performing the cleaning operation.&lt;/div&gt;
    &lt;/div&gt;</p>
