    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Information Report is to acquaint and inform those concerned with cold weather operation of diesel-powered machines and vehicles with the selection and application of electrically powered starting aids currently available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It deals specifically with the design, function, and application of line voltage electrically powered engine preheaters and battery warmers.&lt;/div&gt;&lt;/div&gt;</p>
