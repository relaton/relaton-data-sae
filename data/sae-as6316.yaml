  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) documents a common understanding of terms, compliance issues, and occupant injury criteria to facilitate the design and certification of oblique facing passenger seat installations specific to Part 25 aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The applicability of the criteria listed in this current release is limited to seats with an occupant facing direction greater than 18° and no greater than 45° relative to the aircraft longitudinal axis. Seats installed at angles greater than 30° relative to the aircraft longitudinal axis must have an energy absorbing rest or shoulder harness and must satisfy the criteria listed in &lt;span class="xref"&gt;Table 2&lt;/span&gt;. Later revisions are intended to provide criteria for other facing directions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Performance criteria for forward and aft facing seats are provided in AS8049 and for side facing seats in AS8049/1.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document contains the same content as superseded ARP6316 with additional information included to align this Aerospace Standard with AS8049/1 regarding the use of the femur angular rotation sensor.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Although the issues and criteria presented in this document are common with oblique facing seats installed in Part 23 aircraft and Parts 27 and 29 rotorcraft, these standards have not been validated for these types of aircraft.&lt;/div&gt;&lt;/div&gt;</p>
