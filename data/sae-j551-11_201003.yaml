abstract:
- language: en
  script: Latn
  content: |-
    <p>This part of SAE J551 specifies off-vehicle radiation source test methods and procedures for testing passenger cars and
    commercial vehicles.

    Two methods for calibrating electromagnetic fields are defined in the document: a substitution method and a closed-loop
    method. The substitution method is the method most commonly used.

    SAE J551-1 specifies general, definitions, practical use, and basic principles of the test procedure.</p>
