  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) provides general requirements for a generic, integrated rudder and brake pedal unit, incorporating a passive force-feel system that could be used for fixed-wing fly-by wire transport and business aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP addresses the following:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The functions to be implemented&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The mechanical interconnection between captain and F/O station&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The geometric and mechanical characteristics&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The mechanical, electrical, and electronic interfaces&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The safety and certification requirements&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
