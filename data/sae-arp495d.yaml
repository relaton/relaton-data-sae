abstract:
- language: en
  script: Latn
  content: "<p>This Aerospace Recommended Practice (ARP) establishes criteria for design and installation of devices which will ensure rapid and effective occupant evacuation in the event of an emergency. \nThis ARP deals with  emergency evacuation devices installed for the purpose of rapidly assisting the occupants to the ground or water from emergency exits and/or wings.\n\nNOTE: This document is not intended to specify design methods, mechanisms or equipment to be used in accomplishment of the objectives set forth herein.</p>"
