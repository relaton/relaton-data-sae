  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the engineering requirements for producing brazed joints between flexible metal hose, pressure fittings, pipe and tube joints, and similar parts, such as bellows and rigid end fittings where one end of the joint is not accessible for inspection, and the properties of such joints. Parts are usually made of austenitic corrosion and heat resistant steels but may be carbon or low-alloy steels or copper alloys.&lt;/div&gt;&lt;/div&gt;</p>
