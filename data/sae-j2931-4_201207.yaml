  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Technical Information Report SAE J2931/4 establishes the specifications for physical and data-link layer communications using broadband Power Line Communications (PLC) between the Plug-In Vehicle (PEV) and the Electric Vehicle Supply Equipment (EVSE) DC off-board-charger. This document deals with the specific modifications or selection of optional features in HomePlug Green PHY v1.1 necessary to support the automotive charging application over Control Pilot lines as described in SAE J1772™. PLC may also be used to connect directly to the Utility smart meter or Home Area Network (HAN), and may technically be applied to the AC mains, both of which are outside the scope of this document.&lt;/div&gt;
    &lt;/div&gt;</p>
