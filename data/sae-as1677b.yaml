    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers the requirements for three sizes of compartment restrained lower deck containers (unit load devices) for the 767 airplane and which do not require airworthiness certification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: IATA Specification 50/0, General Technical Requirements and Serviceability limits, should also be taken into account when designing and making equipment according to this specification as certain provisions contained therein will also be applicable.&lt;/div&gt;
