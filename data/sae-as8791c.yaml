  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification and part standard covers polytetrafluoroethylene (PTFE) resin material and the dimensional requirements for scarf-cut retainers (back-up rings) previously covered by MIL-R-8791 and MIL-R-8791/1. The retainers are intended for use in hydraulic and pneumatic system components as anti-extrusion devices in conjunction with seals and O-rings.&lt;/div&gt;
    &lt;/div&gt;</p>
