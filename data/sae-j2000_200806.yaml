  content: |-
    <p>This SAE Standard is equivalent to ISO Standard 6624/1.

    Differences, where they exist, are shown in Appendix A.

    This SAE Standard specifies the essential dimensional features of T, TB, TM, K, KB, and KM keystone piston ring types.

    The requirements of this document apply to compression rings for reciprocating internal combustion engines up to and including 200 mm diameter.</p>
