  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the vibration durability testing of a single battery (test unit) consisting of either an electric vehicle battery module or an electric vehicle battery pack. For statistical purposes, multiple samples would normally be subjected to such testing. Additionally, some test units may be subjected to life cycle testing (either after or during vibration testing) to determine the effects of vibration on battery life. Such life testing is not described in this procedure; SAE J2288 may be used for this purpose as applicable.&lt;/div&gt;&lt;/div&gt;</p>
