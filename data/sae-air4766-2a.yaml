    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides information on aircraft cabin air quality, including:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Origins of chemical airborne contaminants during routine operating and failure conditions.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Exposure control measures, including design, maintenance, and worker training/education.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR does not deal with airflow requirements.&lt;/div&gt;&lt;/div&gt;</p>
