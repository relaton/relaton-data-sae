  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers complete general and dimensional specifications for the various types of tube fittings intended for general application in the automotive, appliance, and allied fields.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Flare type fittings shall be as specified in &lt;span class="xref"&gt;Figs. 1&lt;/span&gt;-&lt;span class="xref"&gt;4&lt;/span&gt; and &lt;span class="xref"&gt;Tables 1&lt;/span&gt;-&lt;span class="xref"&gt;3&lt;/span&gt;. NOTE: For sizes 3/16-3/8 and 1/2-3/4 the flare type fittings depicted in &lt;span class="xref"&gt;Figs. 1A&lt;/span&gt;-&lt;span class="xref"&gt;3C&lt;/span&gt; are identical with the corresponding refrigeration tube fittings specified in SAE J513 (October, 1977). Special size combination fittings 3/16-3/8 and 1/2-3/4 shall be as specified in J513 (October, 1977).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Inverted flared type fittings shall be as specified in &lt;span class="xref"&gt;Figs. 5&lt;/span&gt;-&lt;span class="xref"&gt;11&lt;/span&gt; and &lt;span class="xref"&gt;Tables 1&lt;/span&gt;, &lt;span class="xref"&gt;4&lt;/span&gt;-&lt;span class="xref"&gt;7&lt;/span&gt;. Gages and gaging procedures pertaining to inverted flared tube fittings are given in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;. NOTE: The seat dimensions specified in &lt;span class="xref"&gt;Table 4&lt;/span&gt; are predicated on practical threading limitations in steel fittings and use of these fittings with double flared tubing. Therefore, wherever purchasers contemplate using these fittings with single flared tubing, it is recommended fitting manufacturers be consulted even though it has been common practice to provide slightly deeper threads in brass fittings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Tapered sleeve compression type fittings intended for general use with annealed copper alloy tubings shall be as specified in &lt;span class="xref"&gt;Figs. 12&lt;/span&gt;-&lt;span class="xref"&gt;17&lt;/span&gt;, and &lt;span class="xref"&gt;Tables 1&lt;/span&gt;, &lt;span class="xref"&gt;8&lt;/span&gt;-&lt;span class="xref"&gt;10&lt;/span&gt;. To assure satisfactory performance, spherical sleeve compression type fitting components (SAE J246 (July, 1977)) should not be intermixed with tapered sleeve compression type fitting components when assembling connections in areas where both types are available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensions of single and double 45 deg flares on tubing to be used in conjunction with flared and inverted flared fittings are given in Fig. 2 and Table 1 of SAE J533 (January, 1972).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data for all types of fittings contained in &lt;span class="xref"&gt;Tables 1&lt;/span&gt;-&lt;span class="xref"&gt;11&lt;/span&gt; with respect to all unspecified detail.&lt;/div&gt;&lt;/div&gt;</p>
