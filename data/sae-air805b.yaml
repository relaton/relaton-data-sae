  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this information report is to present factors which affect the design and development of jet blast windshield rain removal systems for commercial transport aircraft. A satisfactory analytical approach to the design of these systems has not yet been developed. Although detailed performance data are available for some test configurations, rain removal systems will generally be unique to specific aircraft. This, then, requires a preliminary design for the system based on available empirical data to be followed with an extensive laboratory development program.&lt;/div&gt;&lt;/div&gt;</p>
