  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report is provided as an advisory guide and is not intended to be made a procurement requirement. Individual application discretion is recommended. The content has been presented as accurately as possible, but responsibility for its application lies with the user. The document covers a number of the variables in the torque-tension relationship: friction, materials, temperature, humidity, fastener and mating part finishes, surfaces, and the kind of tightening tools or equipment used. With an understanding of the variables to be considered, several methods to determine and tighten fasteners using the torque-tension relationship are identified.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This guide is limited in application to fasteners with ISO-metric or UN series threads. Other thread types, such as self-tapping or thread forming, may apply to some aspects of this standard but are not specifically covered.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The procedures described in this document are based on general factors for the determination of the torque-tension relationship for the use of end users. For critical joint design, the assembly torque values should be determined by experimentation using the exact assembly components.&lt;/div&gt;&lt;/div&gt;</p>
