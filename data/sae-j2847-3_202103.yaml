  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to a plug-in electric vehicle (PEV) which is equipped with an onboard inverter and communicates using IEEE 2030.5-2018. It is a supplement to the SEP2 standard, which supports the use cases defined by SAE J2836/3. It provides guidance for the use of the SEP2 distributed energy resource function set with a PEV. It also provides guidance for the use of the SEP2 flow reservation function set, when used for discharging. It is not intended to be a comprehensive guide to the use of SEP2 in a PEV.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Note that in this document, SEP2 is used interchangeably with IEEE 2030.5-2018.&lt;/div&gt;
    &lt;/div&gt;</p>
