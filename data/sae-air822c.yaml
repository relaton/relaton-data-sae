    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides a general overview of oxygen systems for general aviation use. Included are a brief review of the factors and effects of hypoxia, system descriptions, and mission explanations for system or component selection, and techniques for safe handling of oxygen distribution systems.&lt;/div&gt;&lt;/div&gt;</p>
