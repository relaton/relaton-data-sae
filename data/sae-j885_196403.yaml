  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report provides data regarding human tolerance to impact conditions. It is intended that this information will aid those having to do with the planning or designing of motor vehicles in which people may experience high forces, to so design various components to reduce the likelihood or severity of injury.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This information is based on currently available knowledge and experience in the biomechanical field. However, in utilizing the information set forth, it must be recognized that both experience and data in the field of biomechanics are extremely limited and, in some cases, unrefined.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is intended that all portions of the paper be subjected to continuing review and that it be revised as additional knowledge and experience would warrant.&lt;/div&gt;&lt;/div&gt;</p>
