abstract:
- language: en
  script: Latn
  content: "<p>This standard gives the general physical, electrical and  chemical
    methods for testing fiber optics cables for conformance  with the requirements.
    \ It was prepared in order to eliminate  unnecessary of undesirable variation
    in testing procedures.  This  standard does not include special test methods applicable
    to  certain fiber optics cables which are described in the  appropriate specifications,
    nor does it include all the test  methods for fiber optics cable used in industry.
    \ In instance of  conflict between the provisions of those test methods and those
    \ of the individual test procedures or specifications for  particular material,
    the latter shall take precedence.</p>"
