    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides guidance in performing Failure/Fault Analyses in relatively low complexity systems. Methodologies and processes are presented and described for accomplishing Failure/Fault Analyses.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;ARP4761 provides updated methods and processes for use on civil aircraft safety assessment. When analyzing these types of systems, ARP4761 should be used in lieu of this ARP.&lt;/div&gt;&lt;/div&gt;</p>
