  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers high temperature, compression set and fluid resistant fluorocarbon elastomer material to be used in the form of sheet, strip, tubing, extrusions and molded shapes for aeronautical and aerospace applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification should not be used to address products such as O-rings, compression seals, O-ring cord, and molded-in-place gaskets. For those applications AMS7379 should be used.&lt;/div&gt;&lt;/div&gt;</p>
