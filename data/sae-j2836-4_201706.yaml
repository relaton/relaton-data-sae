  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Surface Vehicle Technical Information Report, J2836/4, establishes diagnostic use cases between Plug-in Electric Vehicles (PEV) and the Electric Vehicle Supply Equipment (EVSE). As PEVs are deployed and include both Plug-In Hybrid Electric (PHEV) and Battery Electric (BEV) Vehicle variations, failures of the charging session between the EVSE and PEV may include diagnostics particular to the vehicle variations. This document describes the general information required for diagnostics and J2847/4 will include the detail messages to provide accurate information to the customer and/or service personnel to identify the source of the issue and assist in resolution. Existing vehicle diagnostics can also be added and included during this charging session regarding issues that have occurred or are imminent to the EVSE or PEV, to assist in resolution of these items.&lt;/div&gt;

    &lt;/div&gt;</p>
