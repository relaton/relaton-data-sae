  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the requirements for ethernet physical layer (PHY) qualification. Requirements stated in this document provide a minimum standard level of performance for the PHY in the IC to which all compatible ethernet communications PHY shall be designed. When the communications chipset is an ethernet switch with an integrated automotive PHY (xBASE-T1), then the testing shall include performance for all switch PHY ports as well as each controller interface. No other features in the IC are tested or qualified as part of this SAE Recommended Practice. This assures robust serial data communication among all connected devices regardless of supplier.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The goal of SAE J2962-3 is to commonize approval processes of ethernet PHYs across OEMs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The intended audience includes, but is not limited to, ethernet PHY suppliers, component release engineers, and vehicle system engineers.&lt;/div&gt;&lt;/div&gt;</p>
