    &lt;div class="htmlview paragraph"&gt;This SAE Standard has been adopted to provide a basis for dynamometer determination of gross engine power and torque under reference conditions. It is intended for use primarily by engine manufacturers who supply engines for installation by others in applications where the engine manufacturer may not control the induction and exhaust system design or the speed at which the engine is run.&lt;/div&gt;




