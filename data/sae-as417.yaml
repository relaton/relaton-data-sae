  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard covers an air data computer characterized by the concept of transducing and computing the majority of air data requirements for an aircraft. The display instruments and other using subsystems are not considered in this scope except where they perform computing operations for output parameters as covered by this specification. The computer may accept the inputs and provide the outputs listed in paragraphs &lt;span class="xref"&gt;2.1&lt;/span&gt; and &lt;span class="xref"&gt;2.2&lt;/span&gt; respectively. The computer may also provide an altitude encoder output for IFF Mark &lt;span class="formula inline"&gt;
    &lt;math display="inline"&gt;
    &lt;mrow&gt;
    &lt;mover accent="true"&gt;
    &lt;munder accentunder="true"&gt;
    &lt;mi mathvariant="normal"&gt;X&lt;/mi&gt;
    &lt;mo&gt;¯&lt;/mo&gt;&lt;/munder&gt;
    &lt;mo stretchy="true"&gt;¯&lt;/mo&gt;&lt;/mover&gt;&lt;/mrow&gt;&lt;/math&gt;&lt;/span&gt; (SIF)/Air Traffic Control Radar Beacon System SIF/ATCRBS; in which case AS 855&lt;span class="xref"&gt;*&lt;/span&gt; "Altitude Device Providing Outputs for Automatic Pressure Altitude Reporting" shall be referred to for applicable minimum standards. (Note - Reference to air data computer in subsequent paragraphs will be designated as "instrument".)&lt;/div&gt;



    &lt;/div&gt;</p>
