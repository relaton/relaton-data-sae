  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes the recommended performance levels for equipment located on the aircraft exterior which produces radiant energy which will provide desired information when viewed with NVIS goggles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These performance intensities, normally stated in candelas for visible light, are modified to consider the goggle spectral response range. Where necessary, location of the equipment on the airplane is specified.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The spectral emission characteristics may or may not include visible light. Whether or not visible energy is emitted, this document will refer to these items of equipment as "lights".&lt;/div&gt;

    &lt;/div&gt;</p>
