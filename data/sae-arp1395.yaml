abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The dedicated aircraft addressed herein is to be an uncompromised all-freighter aircraft developed primarily for use in the civil transport industry.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this document are applicable but not limited to airborne equipment which is subject to the airworthiness directives of FAR Part 25 and which is designed to accommodate unitized cargo in the form of intermodal containers and other compatible unitized load devices. Intermodability in the context of this ARP encompasses the air-truck-rail-sea modes, and considers uncertificated as well as certificated Unit Load Devices (ULDs). This ARP covers the fundamental prerequisites for the aircraft cargo compartment and the onboard cargo handling and restraining system. The cargo system and compartment considers primarily 96-in (2.44 m) wide, multiple bottom configuration ULDs. The cargo system and compartment should handle outsize cargo and should consider Civil Reserve Air Fleet (CRAF) requirement compatibility. The cargo system, compartment, and the cargo-related aircraft physical features should be sufficiently defined to establish specifications for ground interface mobile and/or fixed loading equipment and facilities with a goal of standardization thereof. This ARP is intended to assist air carriers in standardizing to the degree necessary to insure the smooth flow of cargo between ground and aircraft and between various aircraft in the future. This document is not intended to inhibit the development of new systems, but rather to establish a solid interface for the introduction of such systems.&lt;/div&gt;

    &lt;/div&gt;</p>
