  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is intended to establish preferred abbreviations for use on panels, controls, instruments, displays, placards and markings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommendations apply to terms used in the flight deck of transport aircraft. The abbreviations, symbols and codes do not supersede those used in airworthiness regulations or aeronautical charts and documents. Where conflict is possible, the operational context must be such as to resolve any ambiguity. If doubt exists, an alternative abbreviation or less truncated abbreviation should be used.&lt;/div&gt;&lt;/div&gt;</p>
