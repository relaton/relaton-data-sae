  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this Recommended Practice is to verify that vehicles and/or components are capable of communicating a minimum subset of information, in accordance with the diagnostic test modes specified in SAE J1939-73: Diagnostic Services.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document describes the tests, test methods, and results for verifying diagnostics communication from an off board device to a vehicle and/or component.&lt;/div&gt;&lt;/div&gt;</p>
