    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) supplements ARP4754A by identifying the crucial elements to be considered when constructing the development assurance plans described in Chapter 3 (Development Planning) of ARP4754A for integrated systems. This AIR presents a collection of lessons learned from past certification programs involving integrated systems. This AIR is not guidance for system integration technologies.&lt;/div&gt;&lt;/div&gt;</p>
