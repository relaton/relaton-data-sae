    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is a modification of SAE J843b to establish a uniform procedure for the level road test of the brake systems of all combinations of new passenger cars and new trailers (braked or unbraked). For the purposes of this test, adherence to each manufacturer’s recommendations is mandatory.&lt;/div&gt;&lt;/div&gt;</p>
