  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;An oil sample is placed into an open top glass vial which is then inserted into a stainless steel pressure vessel. The vessel is then sealed, pressurized, and placed into a heated aluminum block bath for 18 hours. At the end of the 18 hour time period, the vessel is removed from the heat source and allowed to cool to room temperature at which time the contents of the vial are filtered and the total sediment is reported as milligrams of sediment per 20 mL of oil.&lt;/div&gt;&lt;/div&gt;</p>
