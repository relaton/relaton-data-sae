  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Male pipe threads, including male dryseal pipe threads, when made into assemblies or installed into ports, will generally leak if not covered with a sealant.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended as a guide to assist designers and/or users in the selection and application of various types of thread sealants. The designers and users must make a systematic review of each type and application and then select the sealant to fulfill the requirements of the application. The following are general guidelines and are not necessarily a complete list.&lt;/div&gt;&lt;/div&gt;</p>
