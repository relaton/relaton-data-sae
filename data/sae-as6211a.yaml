abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes a standardized test method designed to provide stakeholders—including runway deicing/anti-icing product manufacturers, users, regulators, and airport authorities—with a means of evaluating the &lt;i&gt;relative ice penetration capacity&lt;/i&gt; of runway deicing and anti-icing products over time. The method measures ice penetration as a function of time, thereby enabling comparative assessments under controlled conditions. While commonly applied to runway treatments, these products may also be used on taxiways and other paved surfaces. The test is not intended to provide a direct measurement of the theoretical or extended ice penetration time of liquid or solid deicing/anti-icing products. Instead, it offers a practical and reproducible basis for performance evaluation, supporting operational decision-making and regulatory compliance.&lt;/div&gt;


    &lt;/div&gt;</p>
