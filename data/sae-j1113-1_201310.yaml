  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the measurement of voltage transient immunity and within the applicable frequency ranges, audio (AF) and radio frequency (RF) immunity, and conducted and radiated emissions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;By reference, ISO 11452-3, ISO 11452-7, ISO 11452-8, ISO 11452-10, ISO 11452-11, ISO 11452-2 and the emissions portion of ISO 7637-2 are adopted in place of SAE J1113-24, SAE J1113-3 , SAE J1113-22, SAE J1113-2, SAE J1113-28, SAE J1113-21 and SAE J1113-42, respectively. In the event that an amendment is made or a new edition is published, the new ISO document shall become part of this standard six months after the publication of the ISO document. SAE reserves the right to identify exceptions to the published ISO document with the exceptions to be documented in SAE J1113-24, SAE J1113-3, SAE J1113-22, SAE J1113-2, SAE J1113-28, SAE J1113-21 and SAE J1113-42 respectively.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;By reference, IEC CISPR 25 is adopted as the standard for the measurement of component emissions. In the event that an amendment is made or a new edition is published, the new IEC document shall become part of this standard six months after the publication of the IEC document. SAE reserves the right to identify exceptions to the published IEC document with the exceptions to be documented in SAE J1113-41.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Emissions from intentional radiators are not controlled by this document. (See applicable appropriate regulatory documents.) The immunity of commercial mains powered equipment to over voltages and line transients is not covered by this document.&lt;/div&gt;&lt;/div&gt;</p>
