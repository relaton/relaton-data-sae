  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the system requirements for vehicle-to-vehicle (V2V) safety system for Federal Highway Administration (FHWA) vehicle classes 1 (motorcycles) and 6 through 13 (non-light-duty vehicles), including functional requirements and performance requirements. The system can transmit and receive the SAE J2735-defined Basic Safety Message (BSM) over a wireless communications interface; the communications interface itself is outside the scope of this document. This document provides the specifications necessary to build interoperable systems that support V2V safety applications for non-light-duty vehicles, as well as motorcycles which rely on the exchange of BSMs. The document covers vehicle classes not addressed in SAE J2945/1 and SAE J3161/1.&lt;/div&gt;&lt;/div&gt;</p>
