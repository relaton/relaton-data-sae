  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines minimum requirements for an aircraft transport ULD to transport horses properly and safely by air, to protect the horse(s) from injuries, and to protect the aircraft from corrosion created by waste spill. The ULD is designed to accommodate one horse or several.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;There are two types of ULDs for aircraft transportation of horses:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Type 1: The ULD is an airworthiness certified structural container, satisfying the requirements of NAS 3610 for the appropriate base size.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Type 2: The ULD consists of a self-contained stall which is positioned on a standard aircraft pallet and restrained to the pallet by means of a cargo pallet net or by straps.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;WARNING: It is the carrier’s responsibility to obtain airworthiness approval for a Type 2 unit using strap-restraint. Refer to &lt;span class="xref"&gt;7.1&lt;/span&gt; b (Documentation).&lt;/div&gt;
    &lt;/div&gt;</p>
