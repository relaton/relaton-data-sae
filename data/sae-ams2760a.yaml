abstract:
- language: en
  script: Latn
  content: "<p>This specification covers the procedure for through-hardening and related
    heat treatments of carbon, low-alloy, and specialty steel parts to produce specified
    mechanical properties within the capability of each respective steel.  Heat treating
    processes such as induction hardening, flame hardening, carburizing, nitriding,
    austempering, and martempering are recognized processes but are not covered by
    this specification.</p>"
