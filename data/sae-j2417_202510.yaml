  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides a uniform method to calculate the lift capacity of knuckle-boom log loaders and certain forestry equipment. It establishes definitions and specifies machine conditions for calculations. This document applies to knuckle-boom log loaders as defined in ISO 6814 and ISO 17591 and certain forestry equipment defined in ISO 6814 that have a rotating upper-structure such as feller bunchers, forwarders, harvesters, and behind the cab or rear-mounted knuckle-boom log loaders not having their own power supply. It does not apply to harvesters that are incapable of lifting a tree or log completely off the ground. This document applies to those machines that are crawler, rubber-tired, and pedestal or stationary mounted.&lt;/div&gt;

    &lt;/div&gt;</p>
