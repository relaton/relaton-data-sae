  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) provides a means for establishing a uniform method for specifying ultrasonic transducer performance, standardizing the measurement of transducer performance, and controlling allowable tolerances of transducer performance for the level specified on a purchase order or in a procurement specification. This standard identifies and defines transducer performance parameters and the method for measuring each parameter.&lt;/div&gt;&lt;/div&gt;</p>
