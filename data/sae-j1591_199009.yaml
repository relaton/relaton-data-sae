    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Differences, where they exist, are shown in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice specifies the general characteristics of piston rings and individual dimensional criteria, which are specified as appropriate in the documents in &lt;span class="xref"&gt;Section 2&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document also provides a system for coding, designation, and marking of piston rings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to the manufacture of piston rings up to and including 200 mm diameter for reciprocating internal combustion engines. It also applies to piston rings for compressors working under similar conditions.&lt;/div&gt;&lt;/div&gt;</p>
