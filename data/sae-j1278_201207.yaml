abstract:
- language: en
  script: Latn
  content: "<p>Synchronous belt drives consist of a toothed belt which mates with  grooved pulleys to provide a precise speed ratio between the driver and driven pulleys. This SAE Standard covers the synchronous belt and pulley sections currently in use in automotive applications such as camshaft, distributor, and other underhood drives that may require synchronization. It also provides for future sections to be added as usage develops.</p>"
