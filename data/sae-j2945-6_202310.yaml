  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides the guideline for enhancements to adaptive cruise control (ACC) by the addition of wireless communication from relevant vehicles (V2V) and/or the infrastructure (I2V) to augment the ACC active sensing capability. The CACC system operates under driver responsibility and supervision and is limited to the following:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Does only longitudinal control of the vehicle.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Uses time gap control strategy similar to ACC.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;Motor vehicles covered in the scope of this document include light and heavy vehicles. The message elements to realize CACC and platooning are part of the scope.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The initial release covers definitions for CACC and platooning and requirements for CACC, while a subsequent release will cover the platooning requirements.&lt;/div&gt;&lt;/div&gt;</p>
