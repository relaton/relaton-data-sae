  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice provides minimum requirements for testing components or systems of the type which can be switched from one truck to another with relative ease; i.e., aerodynamic devices, clutch fans, radial tires, and the like. The test utilizes in-service fleet vehicles, operated over representative routes. The relative fuel effectiveness of the component or system under test is determined as a percentage improvement factor. This factor is calculated using the relative fuel usage of like vehicles operating with and without the specific component or system under evaluation. Accuracy capability employing this test technique is either ±1% or ±2%, depending upon the method of fuel measurement. (See paragraph &lt;span class="xref"&gt;6.4&lt;/span&gt;.)&lt;/div&gt;&lt;/div&gt;</p>
