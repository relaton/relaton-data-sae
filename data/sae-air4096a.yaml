  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Information Report (AIR) is to disseminate qualitative information regarding foreign object debris (FOD) damage to the gas path of rotorcraft gas turbine engines and to discuss methods of FOD prevention. Although turbine-powered fixed-wing aircraft are also subject to FOD, the unique ability of the rotorcraft to hover above, takeoff from, and land on unprepared surfaces creates a special need for a separate treatment of this subject.&lt;/div&gt;&lt;/div&gt;</p>
