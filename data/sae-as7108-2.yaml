    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for suppliers for Etching Processes to be accredited by the National Aerospace and Defense Contractors Accreditation Program (NADCAP). These requirements may be supplemented by additional requirements specified by NADCAP Chemical Processing Task Group. Using the audit checklist (AC7108/2) will ensure that accredited Chemical Processing suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;&lt;/div&gt;</p>
