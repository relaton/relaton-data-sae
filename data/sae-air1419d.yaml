  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) addresses many of the significant issues associated with effects of inlet total-pressure distortion on turbine-engine performance and stability. It provides a review of the development of techniques used to assess engine stability margins in the presence of inlet total-pressure distortion. Specific performance and stability issues that are covered by this document include total-pressure recovery and turbulence effects and steady and dynamic inlet total-pressure distortion.&lt;/div&gt;
    &lt;/div&gt;</p>
