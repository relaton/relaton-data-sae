    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This international standard establishes flexure and pressure impulse test procedures for determining and classifying the fatigue strengths of bent aircraft hydraulic tubing. The procedures are intended for use with high- and low-pressure system assemblies for evaluation of new materials or for qualification purposes.&lt;/div&gt;&lt;/div&gt;</p>
