  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This paper contains RF radiated emission and susceptibility data from passive Radio Frequency Identification (RFID) tags and readers operating at 13.56 MHz, 915 MHz, and 2.45 GHz. Laboratory test procedures incorporated the methods of RTCA DO-160D (test procedures for aviation electrical/electronic equipment) and DO-233 (test procedures for consumer portable electronic devices (PEDs)). Only one commercially available system was evaluated per established operating frequencies.&lt;/div&gt;
    &lt;/div&gt;</p>
