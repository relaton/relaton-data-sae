  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) defines helicopter turboshaft engine power assurance theory and methods. Several inflight power assurance example procedures are presented. These procedures vary from a very simple method used on some normal category civil helicopters, to the more complex methods involving trend monitoring and rolling average techniques. The latter method can be used by small operators but is generally better suited to the larger operator with computerized maintenance record capability.&lt;/div&gt;
    &lt;/div&gt;</p>
