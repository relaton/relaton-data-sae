  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Part Standard covers selected inch screws, bolts, structural bolts, and nuts manufactured in accordance with ASTM International and SAE fastener standards. &lt;span class="xref"&gt;Appendix A&lt;/span&gt; covers bolt blanks to manufacture fitted bolts of specific materials. This document covers fastener materials often used in ship systems and equipment but its use may be applied wherever fasteners of the covered materials are used. This document permits the fasteners to be identified and ordered by a part identification number (PIN) as defined in this document.&lt;/div&gt;


    &lt;/div&gt;</p>
