    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides laboratory test procedures for testing headlamp aim test machines to verify their ability to aim or to inspect the aim of headlamps, fog lamps, and auxiliary high beam lamps. This specification does not apply to aiming devices of the kind covered by SAE J602. This specification does not apply to motorcycle headlamps.&lt;/div&gt;&lt;/div&gt;</p>
