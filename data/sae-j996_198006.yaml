    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a standardized test procedure to obtain as closely as possible deformation of a vehicle roof or roll bar structure which occurs in a vehicle roll-over. The procedure is intended to provide reliable and repeatable results and to permit valid comparisons between various vehicle models and various roof or roll bar designs.&lt;/div&gt;&lt;/div&gt;</p>
