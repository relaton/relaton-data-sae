  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the physical and performance requirements for electrodeposited copper, nickel, and chromium deposits on exterior ornamentation fabricated from die cast zinc alloys (SAE J468 alloys 903 and 925), and wrought zinc strip (ASTM B 69). This type of coating is designed to provide a high degree of corrosion resistance for automotive, truck, marine, and farm usage where a bright, decorative finish is desired.&lt;/div&gt;
    &lt;/div&gt;</p>
