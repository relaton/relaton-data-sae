    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The procedures contained in this SAE Recommended Practice have been developed to establish uniform methods for impulse and high temperature circulation testing of hydraulic hose assemblies under special conditions not specified in SAE J343 for SAE J517 hoses.Basic test procedures are to be in accordance with SAE J343 except as modified in this document.&lt;/div&gt;&lt;/div&gt;</p>
