    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers steel cleanliness requirements in inch/pound units for aircraft-quality, ferromagnetic, hardenable, corrosion-resistant steels as determined by magnetic particle inspection methods. This specification contains sampling, specimen preparation, and inspection procedures and cleanliness rating criteria (see &lt;span class="xref"&gt;8.2&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
