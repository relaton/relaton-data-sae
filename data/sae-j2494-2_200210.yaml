    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers general dimensional specifications for non-metallic body reusable push to connect tube fittings for use in the piping of air brake systems on automotive vehicles. This type of fitting is intended for use with nylon tubing per SAE J844. It is not intended to restrict or preclude other designs of a tube fitting for use with SAE J844. Performance requirements for SAE J844 are covered in SAE J1131. See SAE J2494-3 for the performance requirements of Reusable (push-to-connect) fittings intended for use in Automotive Air Brake Systems and U.S. Department of Transportation FMVSS 571.106.&lt;/div&gt;&lt;/div&gt;</p>
