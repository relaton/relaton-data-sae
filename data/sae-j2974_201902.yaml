  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document will focus on the language used to describe batteries at the end of battery or vehicle life as batteries are transitioned to the recycler, dismantler, or other third party. This document also provides a compilation of current recycling technologies and flow sheets, and their application to different battery chemistries at the end of battery life. At the time of document authorship, the technical information cited is most applicable to Li-ion battery type rechargeable energy storage systems (RESS), but the language used is not to be limited by chemistry of the battery systems and is generally applicable to other RESS.&lt;/div&gt;&lt;/div&gt;</p>
