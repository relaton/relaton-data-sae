    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines flywheel configuration to promote standardization of flywheels for engine flywheel mounted torque converters.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Table 1&lt;/span&gt; and &lt;span class="xref"&gt;Fig. 1&lt;/span&gt; give dimensions for flywheel mounted-type torque converters. For torque converters using drive ring overcenter type disconnect clutch, see SAE J620.&lt;/div&gt;&lt;/div&gt;</p>
