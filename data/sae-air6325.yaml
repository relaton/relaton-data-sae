  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report is intended to identify the various existing technologies used for a fuel level sensing system. In addition to sensing technologies, it describes the basic architecture of fuel level sensing systems and their association with fuel gauging system to increase integrity of fuel measurement and management.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;As the fuel level sensing system is generally based on electrical components within fuel tanks, a specific focus is made on fuel tank explosion safety protection.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;An overview of the capacitive fuel gauging operation can be found in AIR5691.&lt;/div&gt;&lt;/div&gt;</p>
