    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard pertains to off-road, self-propelled work machines as defined in categories one through five of SAE J1116. It is intended to provide engineers and designers with information in order that access openings provided in equipment and machinery for purposes of inspection, adjustment, and maintenance are made large enough for the intended function by the person in the field or shop.&lt;/div&gt;
