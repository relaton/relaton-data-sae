  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report lists engine and laboratory tests for service fill engine oils which are associated with specifications and classifications established outside of SAE J304 and SAE J183. These specifications and classifications include those developed prior to April 1, 2017, by international technical societies, as well as individual original equipment manufacturers. The information contained within this report applies to engine oils utilized in gasoline- and diesel-powered automotive vehicles.&lt;/div&gt;&lt;/div&gt;</p>
