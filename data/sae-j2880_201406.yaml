  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These Protocols can be used for all forms of motorsports; however, only certain combinations of Green Racing Elements will result in motorsport competitions that are recognized as Green Racing events. As new information, fuels and technologies emerge, addendums or new protocols will be developed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE International (SAE) Motorsports Engineering Activity is also an invaluable source of reference materials and ongoing technical advice providing access to the constantly evolving set of best safety and operational practices for current and emerging technologies. This is especially true with regard to high voltage safety and the adoption of other advanced propulsion and fuel system technologies.&lt;/div&gt;&lt;/div&gt;</p>
