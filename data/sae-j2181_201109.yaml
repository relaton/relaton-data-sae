  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test procedure is used to determine the steady-state directional control response of vehicles by measuring steady-state cornering behavior. Due to the wide range of operational conditions to which a vehicle can be subjected, the results of this testing do not provide a complete description of a vehicle's total dynamic behavior; in particular, the procedure does not test the vehicle's response during transient maneuvers. To fully assess a vehicle's total dynamic behavior, it would be necessary to conduct other test procedures in order to evaluate the vehicle's performance as a whole.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The extent of instrumentation and the required accuracy of the measurement will be dependent on the goals of the personnel conducting the test. If it is desired simply to determine the general performance characteristics of a vehicle, then this test can be conducted with minimal instrumentation and test item preparation.&lt;/div&gt;
    &lt;/div&gt;</p>
