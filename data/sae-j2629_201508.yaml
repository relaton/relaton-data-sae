  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE developed this document and associated spreadsheets at the request of automobile manufacturers to help compare products from multiple suppliers using standard data presentation formats. This document includes several preferred formats for presenting acoustical data on materials, components, systems, or vehicles. These formats cover the range of acoustical tests commonly conducted in the automotive industry. These tests follow SAE and ASTM test practices as well as vehicle specific test methods.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For each test, the details of samples and test conditions can be entered into an applicable electronic spreadsheet together with the acoustical results data. These data are then linked to standard graphical display(s) for each test. All manufacturers and suppliers in this industry are encouraged to present data and results in these formats.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Although this practice was developed specifically for use in the automotive industry, the formats may be usable in other industries and applications as well.&lt;/div&gt;
    &lt;/div&gt;</p>
