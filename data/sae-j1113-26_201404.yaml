    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the recommended testing techniques for the determination of electric field immunity of an automotive electronic device when the device and its wiring harness is exposed to a power line electric field. This technique uses a parallel plate field generator and a high voltage, low current voltage source to produce the field.&lt;/div&gt;&lt;/div&gt;</p>
