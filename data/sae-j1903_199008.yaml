  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a uniform procedure for assuring the manufactured quality, installed utility, and service performance of certain automotive adaptive products, other than those provided by the vehicle manufacturer, intended to provide driving capability to persons with physical disabilities. These devices function as adaptive appliances to compensate for lost or reduced performance in the arms or legs or both, of the driver. Some of the devices are designed to transfer foot functions to the hands, hand functions to the feet, or functions from one side of the body to the other.&lt;/div&gt;




    &lt;/div&gt;</p>
