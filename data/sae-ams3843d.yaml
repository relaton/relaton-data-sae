abstract:
- language: en
  script: Latn
  content: "<p>This specification covers polytetrafluoroethylene resin in the form of asbestos-fiber-reinforced sheet.  Primarily for gaskets requiring a minimum variation in thickness and compatibility with liquid oxygen. This product contains asbestos fiber.  Abrasion or other fiber-releasing operations require special control techniques.  Review procedures with responsible safety personnel before initiating manufacturing operations.</p>"
