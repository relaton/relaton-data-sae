  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document identifies the basic elements and provides a standard for structuring operator self-verification programs within the aviation, space, and defense industry for producers of commercial and military aircraft and weapons platforms, space vehicles, and all related hardware, software, electronics, engines, and composite components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements specified in this standard are complementary (not alternative) to contractual and applicable statutory and regulatory requirements. Should there be a conflict between the requirements of this standard and applicable statutory or regulatory requirements, the latter shall take precedence.&lt;/div&gt;&lt;/div&gt;</p>
