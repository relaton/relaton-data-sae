  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a method to determine the performance characteristics of the hydraulic oil pumps used in automatic transmissions and automatic transaxles. This document outlines the specific tests that describe the performance characteristics of these pumps over a range of operating conditions and the means to present the test data. This document is not intended to assess pump durability.&lt;/div&gt;&lt;/div&gt;</p>
