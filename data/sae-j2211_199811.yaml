    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Refrigerant containment is an important part of servicing mobile air-conditioning (A/C) systems. This procedure provides guidelines for technicians for servicing mobile A/C systems and operating refrigerant recycling equipment designed for HFC-134a (R-134a) (described in SAE J2210).&lt;/div&gt;&lt;/div&gt;</p>
