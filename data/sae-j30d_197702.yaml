  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers hose which may be supplied either coupled or uncoupled for use with gasoline, diesel fuel, lubricating oil, or the vapor present in either the fuel system or in the crankcase of internal combustion engines in mobile, stationary, and marine applications. The hose may be furnished in long lengths, specific cut lengths, or as a part preformed to a specific configuration.&lt;/div&gt;&lt;/div&gt;</p>
