    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes general gland design criteria for static and dynamic O-ring seal applications used in fluid systems and at fluid pressures common to the aerospace industry. Detailed discussion of design criteria and tables of recommended gland dimensions are contained in the documents listed in &lt;span class="xref"&gt;Table 1&lt;/span&gt;. S.I. unit conversions for U.S. customary units have been provided for reference purposes.&lt;/div&gt;
