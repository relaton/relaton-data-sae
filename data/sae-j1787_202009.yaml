  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes an empirical method for determining the theoretical ash content of aviation piston engine lubricating oils by calculating the equivalent weight of metallic oxides formed at 775 °C based on the metallic elemental concentration.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The calculation method of ash determination may be used as an alternate to ASTM D 482 for application to the standards for aviation piston engine lubricating oils.&lt;/div&gt;

    &lt;/div&gt;</p>
