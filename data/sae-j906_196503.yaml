  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;In this study the subgroup concentrated on the windshield, the major factor in driver forward visibility. Certain areas of the windshield are used more frequently than others in traffic situations to observe signal lights, traffic signs, street markings, other traffic and pedestrians. These are defined as the areas of primary forward driver visibility.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This study was limited to passenger cars. Variations in configuration and driver operating conditions indicate desirability of a separate and later study for trucks and buses.&lt;/div&gt;&lt;/div&gt;</p>
