  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procurement specification covers aircraft quality self-locking nuts for wrenching (hex, spline) and anchor (plate, gang channel, shank) types of nuts made from a corrosion and heat-resistant nickel-base alloy of the type identified under the Unified Numbering System as UNS N07001. Tension height nuts having overall length of threaded portion not less than 1.2 times the nominal thread diameter have 1210 MPa minimum tensile strength at room temperature. Shear height nuts having shorter threaded portion have 1100 MPa minimum tensile strength at room temperature. Maximum test temperature of parts is 730 °C.&lt;/div&gt;
    &lt;/div&gt;</p>
