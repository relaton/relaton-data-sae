abstract:
- language: en
  script: Latn
  content: "<p>This SAE Document specifies DSRC interface requirements for V2V Safety Awareness applications, including detailed Systems Engineering documentation (needs and requirements mapped to appropriate message exchanges). These applications include: Emergency Vehicle Alert, Roadside Alert, and Safety Awareness Alerts for Objects and Adverse Road Conditions. This document extends the V2V Communications capabilities defined in J2945/1 to support these applications, and the National ITS Architecture. The purpose of this SAE Document is to enable interoperability for V2V Safety Awareness communications.</p>"
