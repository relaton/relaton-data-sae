    &lt;div class="htmlview paragraph"&gt;This recommended practice covers a stand that may be used for assembly, disassembly, and maintenance. The stand incorporates the following design criteria: complete interchangeability of any and all components, collapsible frame construction, envelope dimensions (marked with an asterisk on the attached drawings), attachment pad configuration, and gearbox and caster specifications.&lt;/div&gt;
