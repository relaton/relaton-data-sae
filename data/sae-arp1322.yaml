  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP specifies the minimum design and test recommendations for aircraft tubeless tire and wheel overpressurization release devices to protect from possible explosive failure of the contained air chamber due to overinflation. This device will not protect against flash fire explosive conditions within the air chamber which may occur due to extremely overheated brakes. To protect against this condition, nitrogen or other inert gas should be used for inflation.&lt;/div&gt;&lt;/div&gt;</p>
