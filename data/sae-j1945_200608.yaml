abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard specifies the nominal dimensions and tolerances which
    affect interchangeability between cross-tooth companion flanges type T and mating
    parts.  Dimensions and tolerances of the mating parts, other than those occurring
    at the interface of the two flanges, are left to the discretion of the manufacturer
    of that component.  This document is equivalent to ISO 8667-1992.</p>"
