    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a standard method to perform screening test sequences that identify a brake friction material’s effectiveness under various test conditions. The result is an evaluation of brake friction material effectiveness under a set of defined braking conditions considered most relevant to automobile braking system development.&lt;/div&gt;
