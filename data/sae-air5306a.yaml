    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) has been written for individuals associated with the ground-level testing of gas turbine engines and particularly for those who might be interested in upgrading their existing engine test facility to meet the airflow requirements for higher thrust engine models. The intellectual property rights on the material contained in this document are protected by US Patent Number 5,293,775 dated March 15, 1994 assigned to United Technologies Corporation, Hartford, Connecticut, USA. Any individual, or organization, attempting to use the system described in this document should get a clearance from United Technologies Corporation, to avoid any potential liability arising from patent infringement.&lt;/div&gt;
