    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this information report is battery packs containing lithium-ion battery cells with liquid electrolyte, focusing on automotive applications like passenger cars and trucks. Considering different operating conditions as well as durability and safety requirements, some of its contents might provide guidance for other applications. The same applies to battery cell chemistries not covered in this report (e.g., sodium-ion or solid-state battery cells).&lt;/div&gt;&lt;/div&gt;</p>
