  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document proposes a method to demonstrate compliance to engine certification rules requiring tolerance of the control system to single failures leading to Loss of Power Control (LOPC) or Loss of Thrust Control (LOTC) for electric or hybrid engines. At issue 1, the document was developed to address only fully electric engine configurations targeting single engine CS/part 23 level 1 and 2 aircraft applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The methodology proposed herein is based on an alternative definition of Loss of Power Control (LOPC) proposed by EASA, the FAA, TCCA, and ANAC in a joint Decision Document. It is therefore only applicable to projects which elect to implement this authority-proposed alternative definition. Other approaches for the demonstration of compliance of electric engines to control system single fault tolerance requirements, including approaches based on legacy practices applicable to piston engines, remain possible. They are, however, outside of the scope of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Future issues of this report are expected to provide additional guidance for the application of the proposed method to other engine and aircraft applications.&lt;/div&gt;&lt;/div&gt;</p>
