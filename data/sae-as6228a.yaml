  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers the requirements and technical guidance for evaluation of life-cycle cost, productivity, and safety/health factors related to power hand tool selection. It applies approaches to selection of quieter and lower vibration handheld powered tools, with optimal ergonomic features, for the prevention of hand-arm vibration syndrome (HAVS), hearing loss, and repetitive motion injuries. Equipment selection for control of physical safety and electrical safety hazards are essential components of a tool safety program. It suggests use of noise and vibration data provided by vendors to be verified and supplemented by information available through the National Institute for Occupational Safety and Health (NIOSH) and European Union (EU) databases.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AS has been updated to better address physical safety hazards. An appendix (&lt;span class="xref"&gt;APPENDIX D&lt;/span&gt;) on dust control has been included. A supporting SAE Aerospace Information Report (AIR6916) has been developed to facilitate use of the standard’s approach by industrial users who require a terse guide, but may not need the level of technical detail required by the SAE standard process.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Inclusion/exclusion of data in this document is not intended to imply that all the products described herein are the only production models that meet this standard. Consumers are requested to consult with manufacturers concerning lists of stock production models that meet this standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Guidance for selection, procurement, and maintenance of power hand tools should be one component of management processes supporting productivity, reliability, and product quality while safeguarding the safety and health of employees. Workplace design, procurement of safest available products, and periodic evaluation is integral to risk/cost management and promotion of personnel morale and efficient operations. An ergonomics program should be an integral part of occupational health and management systems, such as those outlined in ANSI Z10.0-2019.&lt;/div&gt;
    &lt;/div&gt;</p>
