  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The turbine-engine inlet flow distortion methodology addressed in this document applies only to the effects of inlet total-pressure distortion. Practices employed to quantify these effects continue to develop and, therefore, periodic updates are anticipated. The effects of other forms of distortion on flow stability and performance, and of any distortion on aeroelastic stability are not addressed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The guidelines can be used as necessary to create a development method to minimize the risk of inlet/engine compatibility problems. The degree to which guidelines for descriptor use, assessment techniques, and testing outlined in this document are applied to a specific program should be consistent with the expected severity of the compatibility problem.&lt;/div&gt;&lt;/div&gt;</p>
