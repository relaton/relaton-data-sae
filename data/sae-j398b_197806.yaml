  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice defines conditions for evaluating the compatibility of vehicle fuel tanks and filler pipes with fuel dispensing facilities equipped with standard (non-vapor recovery) configuration as well as vapor recovery type nozzles. It applies to passenger cars, multipurpose passenger vehicles, and light-duty trucks (10 000 lb (4536 kg) maximum gvw), (Ref. J1100a, Motor Vehicle Dimensions (September, 1975)). It includes a technique for filling a tank &lt;i&gt;full&lt;/i&gt; that can be used to establish a reference condition for other tests which require starting with a &lt;i&gt;full&lt;/i&gt; tank.&lt;/div&gt;&lt;/div&gt;</p>
