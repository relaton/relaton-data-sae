  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard encompasses connectors between two cables or between a cable and an electrical component and focuses on the connectors external to the electrical component. This document provides performance requirements based upon the mechanical and electrical environment and covers applications of connectors for direct current electrical systems of 50 V or less in heavy-duty applications typically used in off-highway machinery.&lt;/div&gt;&lt;/div&gt;</p>
