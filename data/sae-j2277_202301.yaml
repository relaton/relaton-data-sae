    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides procedures for determining shot peening coverage and relating coverage to part exposure to the media stream. Effectiveness of shot peening is directly dependent on coverage. Inadequate or excessive coverage can be detrimental to fatigue strength and component life.&lt;/div&gt;&lt;/div&gt;</p>
