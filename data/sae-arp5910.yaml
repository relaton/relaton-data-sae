  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) outlines recommended ramp pavement marking standards for proper guidance and positioning of GSE on commercial transport aircraft parking and handling stands (gates), in line with International Civil Aviation (ICAO) recommendations applicable to airport aprons.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Throughout this document, the minimum essential criteria are identified by use of the key word "shall". Recommended criteria are identified by use of the key word "should" and, while not mandatory, are considered to be of primary importance in providing safety effective ramp markings. Deviation from recommended criteria should only occur after careful consideration and thorough service evaluation have shown alternate methods to provide an equivalent level of safety.&lt;/div&gt;

    &lt;/div&gt;</p>
