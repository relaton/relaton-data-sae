    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice applies to the rotating equipment in the electrical propulsion systems on electrically propelled dumpers. It also applies to the rotating equipment installed on trailers connected to electrically propelled dumpers. The recommended practice does not apply to rotating equipment such as windshield wiper motors, battery charging generators, etc. that may be used on dumpers.&lt;/div&gt;
    &lt;/div&gt;</p>
