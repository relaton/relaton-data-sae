  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is only applicable to 14 CFR Part 25 transport airplane passenger and flight attendant seats. This document provides an approach for determining which parts on aircraft seats are required to meet the test requirements of 14 CFR Part 25 Appendix F, Parts IV and V. Additionally, it is recommended to use materials that meets the requirements of 14 CFR Part 25 Appendix F, Parts IV and V in applications where not required.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Independent furniture installations related to seat installations are outside the scope of this document.&lt;/div&gt;&lt;/div&gt;</p>
