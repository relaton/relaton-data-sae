abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard applies to all products and services produced for Aeronautics and Space enterprises and regulatory environments, including those produced by component facilities and technical and service support centers. If applied, this standard must be cited in the CM requirements of Enterprise Planning, Facilities Programs, Projects, and Supplier agreements.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;This standard applies throughout all phases of the program and project life cycle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;CM is about the truth, trust, and traceability of products, data used to produce products, and processes throughout their life cycle and should be applied across the Enterprise at the process and product level. The significant data to which CM is applied includes scientific and engineering data; data that drives mission success; data that ensures IT security; and data used to make technical, programmatic, and business decisions. Proper application of CM is essential for product integrity and overall effectiveness. Acquirers complying with the principles in SAE/EIA-649 can tailor the specific “shall” statements in this standard and incorporate the tailored requirements into agreements to ensure the rigor required for Aeronautics, Space, and Ground Systems as discussed in the sections below.&lt;/div&gt;

    &lt;/div&gt;</p>
