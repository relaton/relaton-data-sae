  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines and provides a means for the control of colors employed in motor vehicle external lighting equipment, including lamps and reflex reflectors. The document applies to the overall effective color of light emitted by the device in any given direction and not to the color of the light from a small area of the lens. It does not apply to pilot, indicator, or tell-tale lights.&lt;/div&gt;&lt;/div&gt;</p>
