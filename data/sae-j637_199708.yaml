  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following information is intended as a guide to be used for evaluating belt construction, source approval, and quality audit. This recommendation has been prepared from existing literature, including standards, specifications, and data supplied by both producers and users.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These recommendations cover drive layout details and V-belt testing methods, including test layout, pulley diameters, torque loads, and guidance for interpreting test data. The application of these automotive V-belts is to power engine or vehicle accessories that are physically attached to the engine.&lt;/div&gt;&lt;/div&gt;</p>
