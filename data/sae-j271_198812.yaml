  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice covers the mechanical and chemical requirements of special quality high tensile, hard drawn carbon steel spring wire with restricted size tolerances. This material is used where such restricted dimensional requirements are necessary for the manufacture of highly stressed mechanical springs and wire forms. It is generally employed for applications subject to static loads or infrequent stress repetitions. This recommended practice also covers basic materials and processing requirements of springs and forms fabricated therefrom.&lt;/div&gt;&lt;/div&gt;</p>
