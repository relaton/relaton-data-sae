abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;Benchmarking is used to discover the design intent measurements for seating compartments in vehicles when these measurements are either unknown or are specified using differing measurement procedures.&lt;/p&gt;
    &lt;p&gt;This document provides the specifications and procedures to establish consistent measurements for benchmarking vehicle seating positions using the H-Point Machine (HPM-II1) described in SAE J4002 and the H-Point Design tool (HPD) described in SAE J4004. The HPM-II is a physical tool used to establish key reference points and measurements in a vehicle (Figure 1). The HPD is a CAD tool that aids in the benchmarking process (see Appendix A and SAE J4004).&lt;/p&gt;</p>
