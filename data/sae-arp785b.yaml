    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP describes a gravimetric method for the determination of particulate contaminant in hydraulic fluids by the control filter technique.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: With this method, detectable contamination levels down to 0.2 mg (7.0 × 10&lt;sup&gt;-6&lt;/sup&gt; ounces) per sample can be obtained with a standard deviation of ±0.1 mg (±3.5 × 10&lt;sup&gt;-6&lt;/sup&gt; ounces).&lt;/div&gt;&lt;/div&gt;</p>
