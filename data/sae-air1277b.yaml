    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) contains information on the thermal design requirements of airborne avionic systems used in military airborne applications. Methods are explored which are commonly used to provide thermal control of avionic systems. Both air and liquid cooled systems are discussed.&lt;/div&gt;

    &lt;/div&gt;</p>
