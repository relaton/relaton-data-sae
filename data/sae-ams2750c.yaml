  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers temperature sensors, instrumentation, thermal processing equipment, system accuracy tests, and temperature uniformity tests. These are necessary (See &lt;span class="xref"&gt;8.2&lt;/span&gt;) to ensure that parts or raw materials (See &lt;span class="xref"&gt;8.3.7&lt;/span&gt;) are heat treated in accordance with the applicable specification(s). It is applicable to all heat treatment of parts and to those heat treatments by producers of raw material which could affect fabrication or properties of parts.&lt;/div&gt;


    &lt;/div&gt;</p>
