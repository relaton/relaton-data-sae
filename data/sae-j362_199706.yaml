abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice establishes uniform test procedures for
    evaluating vehicle hood latch systems. It specifically pertains to those latch
    systems on hoods, which when the hood is fully opened (assuming the absence of
    hood stops) extend at any point above a horizontal plane  through the uppermost
    edge of the steering wheel in the straight ahead driving position with the vehicle
    in a horizontal position. The test procedures outlined in this recommended practice
    are based on current engineering test methods. It is intended that all portions
    of this report will be periodically reviewed and revised as additional knowledge
    regarding vehicle hood latch system performance under dynamic conditions is developed.</p>"
