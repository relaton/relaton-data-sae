  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Connected Transportation Interoperability (CTI) 4501 establishes requirements for SAE J2735 MAP Message node point accuracy supporting in-vehicle Red Light Violation Warning (RLVW) applications. These requirements are specified in relation to pavement markings defining ingress and egress lane boundaries for mapped intersections. Commercial mobile mapping services typically use a combination of scanning Light Detection and Ranging (LiDAR) technology in conjunction with high-accuracy positioning and multi-axis high-resolution photography to create three-dimensional (3D) models of roadways which include the locations of lane markings, curbs, stop lines, and crosswalks. This document describes testing and assessment methodologies using this information to verify the accuracy of MAP node point data focusing on through movement ingress lanes to support basic in-vehicle RLVW applications.&lt;/div&gt;&lt;/div&gt;</p>
