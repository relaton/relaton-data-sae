  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) establishes flexure test procedures to determine and classify the fatigue strengths of reconnectable or permanent hydraulic tube joints.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The procedure is intended for conducting flexure tests of fittings and joints for hydraulic tubing materials such as AMS 5561 steel, AMS 4944 titanium and MIL-T-7081 aluminum alloy, mounted as free-free resonant beams.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Of particular advantage are the inherent simplicity of test setup, minimum restraint from a test fixture, low power requirements, short test duration, and ease of varying stress level.&lt;/div&gt;&lt;/div&gt;</p>
