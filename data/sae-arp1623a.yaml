abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this recommended practice is to provide aircraft industry
    with guidelines as to the pertinent information which should be contained in a
    user's manual for an environmental control system (ECS) computer program.  This
    recommended practice is intended to facilitate the preparation  of a user's manual
    without unduly restricting its format or content.</p>"
