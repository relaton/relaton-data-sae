  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to establish the requirements for sensor/video interconnect subsystems. These requirements have been driven predominantly, but not exclusively, by aerospace-type military platforms and commercial aircraft. These requirements are intended to be used as the criteria to establish a sensor/video interconnection standard that will foster the development of common hardware to simplify the total interconnectivity of future avionics platforms.&lt;/div&gt;
    &lt;/div&gt;</p>
