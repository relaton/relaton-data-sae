abstract:
- language: en
  script: Latn
  content: "<p>This ARP is intended to make recommendations for flight crew and cabin
    attendant restraint systems in aircraft. A properly designed crew restraint system
    will avoid injury or debilitation during a survivable crash and enable post crash
    assistance to occupants and escape from the aircraft. Consideration is given to
    existing requirements of the FAA and to the recommendations of aircraft operators
    and those involved in the manufacture or use of restraining devices. Crew member
    safety is the  primary objective, with appropriate provisions for crew comfort
    taken  into consideration. The criteria established herein are designed to standardize
    restraining systems without hindering the development of new, improved systems.</p>"
