  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The test method describes the procedure for the direct determination of water concentration in polyol ester and diester based aerospace lubricants by commercially available automated coulometric Karl Fischer titration instruments. The method was validated to cover the water concentration range of 150 to 3500 µg/g. The method may also be suitable for the determination of water concentrations outside this range and for other classes of fluids; however, the precision statement shall not be applicable for such uses.&lt;/div&gt;
    &lt;/div&gt;</p>
