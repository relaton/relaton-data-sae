  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides uniform definitions of specification terms peculiar to loaders as defined in SAE J1057. The specifications must be qualified by stating the track shoe type, width or the tire type, size, ply, and specified inflation pressure; the model number or type of bucket disregarding teeth; and the type and amount of counterweight and/or ballast, if any, with which the machine is equipped. Paragraphs &lt;span class="xref"&gt;4.1&lt;/span&gt; to &lt;span class="xref"&gt;4.16&lt;/span&gt; are further defined by &lt;span class="xref"&gt;Figures 1&lt;/span&gt; to &lt;span class="xref"&gt;4&lt;/span&gt;. The figures are not intended to be exactly descriptive of any particular machine.&lt;/div&gt;&lt;/div&gt;</p>
