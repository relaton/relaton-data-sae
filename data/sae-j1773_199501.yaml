    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the minimal physical, electrical, and performance requirements for the electric vehicle inductive charge coupling in the United States. The intent of the Recommended Practice is to define a common electric vehicle inductive charging inlet and its mating coupler. Application and compatibility requirements for the coupler and vehicle inlet are stated herein.&lt;/div&gt;
