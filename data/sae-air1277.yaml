abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document contains information on the cooling of modern airborne electronics, emphasizing the use of a heat exchange surface which separates coolant and component. It supplements the information contained in AIR 64 for the draw through method and in AIR 728 for high Mach Number aircraft. Report contents include basic methods, characteristics of coolants, application inside and outside of the "black box" use of thermostatic controls to improve reliability and system design. Characteristics of typical cooling components are treated sufficiently to permit selection and to estimate size and weight.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While emphasis is placed herein on equipment cooling, &lt;span class="xref"&gt;section 9&lt;/span&gt; dealing with thermal control of the environment, reminds the reader that some equipment will require heating for start up from a cold condition or as a means to control temperature within narrow limits (e.g. in a crystal oven).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Property data and constants are also tabulated. All numerical values are given in British and SI units.&lt;/div&gt;&lt;/div&gt;</p>
