  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document details one of the connections of the SAE J3105 document. The connections are referenced in the scope of the main document SAE J3105. SAE J3105/1 details the infrastructure-mounted pantograph, or cross-rail connection. All the common requirements are defined in the main document; the current document provides the details of the connection.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers the connection interface relevant requirements for an electric vehicle power transfer system using a conductive automated connection device (ACD) based on a cross-rail design. To allow interoperability for on-road vehicles (in particular, buses and coaches), one configuration is described in this document. Other configurations may be used for non-standard applications (for example, mining trucks or port vehicles).&lt;/div&gt;&lt;/div&gt;</p>
