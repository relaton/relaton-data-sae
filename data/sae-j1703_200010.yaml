  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers motor vehicle brake fluids of the nonpetroleum type for use in the braking system of any motor vehicle such as a passenger car, truck, bus, or trailer. These fluids are not intended for use under arctic conditions. These fluids are designed for use in braking systems fitted with rubber cups and seals made from natural rubber (NR), styrene-butadiene rubber (SBR), or a terpolymer of ethylene, propylene, and a diene (EPDM).&lt;/div&gt;&lt;/div&gt;</p>
