    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended to establish uniform methods for the testing and performance evaluation of the SAE 100R series of hydraulic hose and hose assemblies. The specific tests and performance criteria applicable to each variety of hose and/or assemblies made therefrom are set forth in the respective specifications of SAE J517.&lt;/div&gt;&lt;/div&gt;</p>
