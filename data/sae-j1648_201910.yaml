  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report is provided as an advisory guide. Careful discretion as to application is recommended. The content has been presented as accurately as possible, but responsibility for its application lies with the user. It covers finishes applied to fasteners and related topics, corrosion resistance, lubricity, electrical grounding, ultraviolet light, and embrittlement.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Table 1&lt;/span&gt; lists these coatings and their properties so that finish selection can be reasonably made in accordance with known and anticipated fastener assembly applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Application of protective coatings will affect fastener dimensions. This is especially critical for the thread fit of mating parts because the pitch diameter increases by four times the coating thickness. Explanation is covered in &lt;span class="xref"&gt;Section 5&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
