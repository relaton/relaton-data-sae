  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The document is a recommended guide for evaluating new or replacement test methods. It considers applicability, suitability, accessibility, and return on effort.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Particular emphasis should be placed on completing the “strategy definition” portion of this document (Stage 2), to capture all relevant process stages and complete in a recognizable order for any specific development project.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The overall process should:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;address the rationale behind testing;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;result in a thorough review of whether a test is fit for purpose;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;act as a pathway for vetting if a test should be added to AS5780.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;If, in any project, this process is not an exact fit, users should feel free to adjust, as necessary.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The process provides the following stages:&lt;/div&gt;
    &lt;/div&gt;</p>
