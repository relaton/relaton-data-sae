    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report provides information applicable to production Original Equipment Manufacturer antilock braking systems found on some past and current passenger cars and light trucks. It is intended for readers with a technical background.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It does not include information about aftermarket devices or future antilock brake systems.&lt;/div&gt;
