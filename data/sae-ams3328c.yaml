    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a fluorosilicone (FVMQ) rubber in the form of sheet, strip, tubing, extrusions, and molded shapes. This specification is not recommended for use in the manufacture of O-rings, O-ring Cord, or Molded in Place gaskets. For the manufacture of O-rings, O-ring Cord, or Molded in Place gasketsthe use of AMS-R-25988, Type I, Class 1, Grade 40 is recommended.&lt;/div&gt;&lt;/div&gt;</p>
