    &lt;div class="htmlview paragraph"&gt;This specification covers a titanium alloy in the form of bars up through 3.000 inches (76.20 mm) in nominal diameter or least distance between parallel sides, inclusive, forgings of thickness up through 3.000 inches (76.20 mm), inclusive, with bars and forgings having a maximum cross-sectional area of 16 in&lt;sup&gt;2&lt;/sup&gt; (103.23 cm&lt;sup&gt;2&lt;/sup&gt;), and stock for forging of any size.&lt;/div&gt;&lt;/div&gt;</p>
