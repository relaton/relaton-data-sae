  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) describes procedures for calculating fuel consumption for civil jet airplanes through all modes of operation for all segments of a flight. Turboprop and piston airplanes, as well as helicopters or unconventional aircraft, are not included in this AIR. The principle purpose of these procedures is to assist model developers in calculating airplane fuel consumption in a consistent and accurate manner that can be used to address various environmental assessments including those related to policy decisions and regulatory requirements. This AIR is intended to directly support the emission calculations documented in AIR5715. The models described in this AIR are intended to be used from the start of the takeoff roll to the end of the ground roll; taxi fuel consumption models are not included. If modelers have access to higher fidelity methods, they should use those methods in lieu of the ones in this AIR.&lt;/div&gt;&lt;/div&gt;</p>
