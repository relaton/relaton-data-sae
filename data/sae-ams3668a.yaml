    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers one grade of polytetrafluoroethylene in the form of molded rods, tubes, and shapes. This specification does not apply to rods and tubes over 12 in. (305 mm) in dimension parallel to the direction of applied molding pressure, rods less than 0.750 in. (19.05 mm in diameter, and tubes having wall thickness less than 0.500 in. (12.70 mm).&lt;/div&gt;&lt;/div&gt;</p>
