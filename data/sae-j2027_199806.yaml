  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard includes performance requirements for protective covers for flexible, non-metallic fuel tubing. Ultimate performance of the protective cover may be dependent on the interaction of the fuel tubing and protective cover. Therefore, it is recommended that tubing and cover combinations be tested as an assembly, where appropriate, to qualify to this document.&lt;/div&gt;


    &lt;/div&gt;</p>
