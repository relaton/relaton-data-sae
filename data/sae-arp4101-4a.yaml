    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is intended to specify the environmental conditions for transport aircraft necessary to permit the crew to perform their duties and functions in comfort, with minimum fatigue and no distraction. Environmental conditions should cause no short or long-term effects deleterious to health or physical well-being, nor significantly impair ability to perform normal or abnormal crew functions.&lt;/div&gt;&lt;/div&gt;</p>
