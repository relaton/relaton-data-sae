  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes the minimum requirements for training, examination, and certification of aerospace coatings application personnel applying liquid organic coatings to interior structural or exterior substrates. It establishes criteria for the certification of personnel requiring appropriate knowledge of the technical principles underlying aircraft surface preparation and coatings application for both protective and decorative purposes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Persons who successfully complete the requirements of this certification standard are considered to be able to successfully and consistently perform a broad spectrum of aerospace coatings application tasks to achieve the desired engineering purposes. This certification is not intended to determine or replace any aerospace coating operation’s proprietary engineering for the depainting, preparation, or subsequent application of organic coatings materials to aircraft surfaces.&lt;/div&gt;&lt;/div&gt;</p>
