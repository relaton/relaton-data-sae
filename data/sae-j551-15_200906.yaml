  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the ESD test methods and procedures necessary to evaluate electronic modules intended for vehicle use. It describes test procedures for evaluating electronic modules in complete vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A procedure for verifying the simulator that is used to generate the electrostatic discharges is given in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Functional status classifications for immunity to ESD are given in &lt;span class="xref"&gt;Appendix B&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
