abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard establishes the specifications and dimensions that are essential in order that 540 r/min and 1000 r/min power  take-off-driven machines may be operated with any make of tractor equipped with the corresponding power take-off drive. This document does not, in itself, insure adequate telescoping of the power line or safety shielding. This document provides dimensions relating to the tractor power take-off shield.</p>"
