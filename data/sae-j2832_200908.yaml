  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers stress relieved electric resistance welded flash controlled single wall high strength low alloy steel tubing intended for use in high pressure hydraulic lines and in other applications requiring tubing of a quality suitable for bending, double flaring and cold forming. Material produced to this specification is not intended to be used for single flare applications due to the potential leak path that would be caused by the ID weld bead.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The grade of material produced to this specification is of micro-alloy content and is considerably stronger and intended to service higher pressure applications using thinner walls than like sizes of the grades of material specified in SAE J356, SAE J2435 and SAE J2613. Due to the alloy content of the material, the forming characteristics of the finished tube are equal to or better, when compared to SAE J356, SAE J2435 and SAE J2613. Nominal reference working pressures for this tubing are listed in ISO 10763 and SAE J1065.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Brazed and/or welded tube assembly configurations made to specific geometry and components bill of material in association with this material, may require qualification testing in accordance with ISO 19879 Test Methods for Hydraulic Fluid Power Connections. Cold forming the tube end configurations avoids this systemic testing by not compromising the tube material structural integrity.&lt;/div&gt;&lt;/div&gt;</p>
