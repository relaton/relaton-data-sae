    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion- and heat-resistant steel in the form of bars, wire, forgings, mechanical tubing, and flash welded rings up to 5.00 inches (127 mm), inclusive, in nominal diameter or least distance between parallel sides (thickness), and stock for forging, flash welded rings, or heading of any size.&lt;/div&gt;&lt;/div&gt;</p>
