  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification describes a method and acceptance criteria for testing automotive wire harness retainer clips. Retainer clips are plastic parts that hold a wire harness or electrical connector in a specific position. Typical plastic retainers work by having a set of “branches” that can be inserted into a hole sized to be easy to install but provide acceptable retention. This specification tests retainer clips for mechanical retention when exposed to the mechanical and environmental stresses typically found in automotive applications over a 15-year service life. This specification has several test options to allow the test to match to the expected service conditions. The variability of applications typically arises from different ambient temperatures near the clip, different proximity to automotive fluids, different exposure to standing water or water spray, and different thicknesses of the holes that the clip is inserted into. Clips are typically inserted into sheet or rolled metal from 0.6 to 8 mm thick, so this specification focuses on that range. Outside of this range requires a custom test.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The procedures described in this document have been evaluated for the design types shown in &lt;span class="xref"&gt;Table 2&lt;/span&gt;. Use of USCAR-44 for other than a design shown in &lt;span class="xref"&gt;Table 2&lt;/span&gt; may or may not produce acceptable test correlation to actual experience, but USCAR has not reviewed any data. USCAR-44 can be used at all phases of development, production, and field analysis since it is a performance test and not a process validation or quality assessment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;No retainer may be represented as having met USCAR/EWCAP specifications unless conformance to all applicable requirements of this specification have been verified and documented. All required verification and documentation must be provided by the supplier of the part. If testing is performed by another source, it does not relieve the primary supplier of responsibility for documentation (DVP&amp;amp;R) of all test results and for verification that all samples tested met all applicable acceptance criteria.&lt;/div&gt;&lt;/div&gt;</p>
