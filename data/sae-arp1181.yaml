  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP presents definitions of terminology used in conjunction with redundant flight control systems. No details of specific redundant system design approaches are given. Likewise, no recommendations are included for system performance and design requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Redundancy may be provided within individual components of a flight control system, or it may be used for the system in total. The scope of this ARP is sufficiently broad to include both of these extremes.&lt;/div&gt;&lt;/div&gt;</p>
