  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard outlines general and dimensional specifications for flange clamps for use in low pressure applications with SAE J518-1 connections. For port dimensions, port design considerations, and flange head dimensions, please refer to SAE J518-1.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The rated working pressure of an assembly shall not exceed the least of all the component working pressure rated values.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data contained in the tables with respect to all unspecified detail. Parts manufactured to this standard are also compatible with ISO 6162-1 port connections and flange heads.&lt;/div&gt;&lt;/div&gt;</p>
