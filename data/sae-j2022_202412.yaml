  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to horizontal earthboring machines of the following types:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Auger boring machines&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Rod pushers&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Rotary rod machines&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Impact machines&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Horizontal directional drilling (HDD) machines (tools only)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The illustrations used are for classification and are not intended to resemble a particular machine. Only basic working dimensions are given. They may be supplemented by the machine manufacturer. This document is based on existing commercial horizontal earthboring machines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not apply to HDD machines as defined in ISO 21467. It only covers tools used with HDD machines. It also does not apply to specialized mining machinery covered in SAE J1116, Table 1, nor does it apply to conveyors, tunnel boring machines, pipe jacking systems, microtunnelers, or well-drilling machines.&lt;/div&gt;
    &lt;/div&gt;</p>
