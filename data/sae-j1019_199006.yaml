  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended to establish uniform methods for testing and evaluation of hose and hose assemblies for use in high temperature transmission oil systems and high temperature lubricating oil systems using petroleum base oils within a temperature range of −40 ° to 150 °C (−40 ° to 302 °F) and a maximum working pressure of 1.5 MPa (217 psi). Hose construction, dimensions, identification, and hose fitting configurations shall be agreed upon by the supplier and user.&lt;/div&gt;&lt;/div&gt;</p>
