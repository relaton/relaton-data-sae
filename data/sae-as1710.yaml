    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification defines the requirements for a threaded flexible coupling assembly, which utilizes ferrules or machined tube end fittings, to join tubing and components in aircraft fuel, vent or other systems. This coupling assembly is designed for use from -65 to 200 degrees F and at 125 psi operating pressure.&lt;/div&gt;&lt;/div&gt;</p>
