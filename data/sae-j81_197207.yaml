  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers requirements for thread rolling screws suitable for use in general engineering applications. (It is intended that “thread rolling” screws have performance capabilities beyond those normally expected of other standard types of tapping screws.)&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;N&lt;span class="small-caps"&gt;ote:&lt;/span&gt; The performance requirements covered in this standard apply only to the combination of laboratory conditions described in the testing procedures. If other conditions are encountered in an actual service application (such as different materials, thicknesses, hole sizes, etc.), values shown herein for drive torque, torque-to-clamp load, and proof torque may require adjustment.&lt;/div&gt;&lt;/div&gt;</p>
