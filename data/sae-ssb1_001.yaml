  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is an annex to EIA Engineering Bulletin &lt;i&gt;SSB-1, Guidelines for Using Plastic Encapsulated Microcircuits and Semiconductors in Military, Aerospace and Other Rugged Applications&lt;/i&gt; (the latest revision).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The scope of this document is to establish the recommended minimum qualification and monitoring testing of plastic encapsulated microcircuits and discrete semiconductors suitable for potential use in many rugged, military, severe, or other environments.&lt;/div&gt;

    &lt;/div&gt;</p>
