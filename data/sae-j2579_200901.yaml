abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to define design, construction, operational, and maintenance requirements for hydrogen fuel storage and handling systems in on-road vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Performance-based requirements for verification of design prototype and production hydrogen storage and handling systems are also defined in this document. Complementary test protocols (for use in type approval or self-certification) to qualify designs (and/or production) as meeting the specified performance requirements are described.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Crashworthiness of hydrogen storage and handling systems is beyond the scope of this document. SAE J2578 includes requirements relating to crashworthiness and vehicle integration for fuel cell vehicles. It defines recommended practices related to the integration of hydrogen storage and handling systems, fuel cell system, and electrical systems into the overall Fuel Cell Vehicle.&lt;/div&gt;

    &lt;/div&gt;</p>
