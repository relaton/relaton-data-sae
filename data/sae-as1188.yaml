    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers minimum design and test requirements for aircraft tire inflation-deflation equipment for use on all types of aircraft. It shall be the responsibility of the airframe manufacturer to determine the compatibility of the requirement with the applicable aircraft and to specify requirements in excess of these minimums as necessary.&lt;/div&gt;&lt;/div&gt;</p>
