    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is intended to document and provide access to information obtained by an industry survey. It summarizes and documents data regarding possible alternatives to the use of cadmium plating on general connectors and connector accessories typically used in aerospace and military defense electrical interconnect systems.&lt;/div&gt;&lt;/div&gt;</p>
