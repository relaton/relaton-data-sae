  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to electrically powered hydraulic or mechanically operated platform devices which permit a person seated in a manual or powered wheelchair to enter or exit a personally licensed vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The minimum performance and durability requirements are specified for satisfactory installation of wheelchair lifting devices in a personally licensed vehicle to be used by a person seated in a wheelchair to be lifted from the ground plane to the vehicle floor level in a reliable and safe manner.&lt;/div&gt;
    &lt;/div&gt;</p>
