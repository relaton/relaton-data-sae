  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice promotes uniformity in the characterization tests conducted on sprays generated by automotive fuel injectors used in both port fuel injection and gasoline-direct injection engine applications. SAE J2715 contains the detailed background, procedures and data reduction protocols for nearly all fuel spray characterization metrics that are applicable to automotive applications. It is intended to be utilized in conjunction with other SAE J documents that address injector performance metrics. These are SAE J1832 for Port Fuel Injection and the forthcoming SAE J2713 for Gasoline Direct Injectors.&lt;/div&gt;
    &lt;/div&gt;</p>
