  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) addresses the general procedure for the best practices for minimizing uncertainty when calibrating thermal conductivity and cold cathode vacuum gauges, which includes the vacuum sensor(s) and accompanying electronics necessary for a pressure measurement to be made. It also includes the best practices for an in-process verification where limitations make it impossible to follow the best practices for minimizing uncertainty.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Verifying the accuracy and operation of vacuum gauges is critical to ensure the maintenance of processes while under vacuum.&lt;/div&gt;&lt;/div&gt;</p>
