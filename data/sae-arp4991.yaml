    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes standard methods for restoring damaged core on commercial aircraft sandwich structures. It currently applies to wet lay up repairs only. The methods shall only be used when specified in an approved repair procedure or with the agreement of the Original Equipment Manufacturer (OEM) or regulatory authority. The repair materials shall be defined in the approved repairs referencing these methods.&lt;/div&gt;
    &lt;/div&gt;</p>
