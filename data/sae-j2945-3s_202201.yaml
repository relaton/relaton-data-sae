abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This Abstract Syntax Notation (ASN.1) file precisely specifies the structure of the data used to support implementation of SAE International Standard J2945/3. As part of an international treaty, data defined in US ITS standards are expressed in "ASN.1 syntax". ASN.1 Syntax is used to define the data entities or "ASN specifications". Using the ASN.1 specification, a compiler tool can be used used to produce encodings as required by the encoding rules identified in the standard (SAE J2945/3 messages are encoded with UPER or JER encoding). Both this file and the SAE J2735 ASN.1 files are necessary to collectively implement the data exchanges described in the J2945/3. The combined library can be used by any application (along with the additional logic of that application) to exchange the data over interfaces conformant to J2945/3.&lt;/p&gt;
    &lt;p&gt;SAE J2945/3 specifies interface requirements for weather data collection and distribution using V2X communications, including detailed systems engineering documentation (needs and requirements mapped to appropriate data exchanges). The weather data can be used for traffic management, vehicle safety and other roadway applications that are represented within the National ITS Architecture.&lt;/p&gt;
    &lt;p&gt;You may also be interested in:&lt;/p&gt;
