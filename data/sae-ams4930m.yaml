    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a titanium alloy in the form of wire, forgings, flash-welded rings 4.000 inches (101.60 mm), inclusive, and under in nominal diameter or distance between parallel sides, bars up through 10.000 inches (254 mm), inclusive, and under in nominal diameter with a maximum cross-sectional area for bars over 4.000 to 10.000 inches (101.60 to 254 mm) in diameter of 79 square inches (509.7 cm&lt;sup&gt;2&lt;/sup&gt;), and stock for forging or flash-welded rings of any size (see &lt;span class="xref"&gt;8.6&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
