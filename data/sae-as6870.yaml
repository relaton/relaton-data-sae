  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard defines the requirements for establishing a Nondestructive Inspection (NDI) program for aerospace systems to include but not not be limited to aircraft structure, aircraft stores (external structures such as antennas, pods, fuel tanks, weapons, radomes, etc.) and missile/rocket structural components when an NDI Program Plan is required by contract. NDI Programs are essential to ensuring NDI processes are implemented to support the lifecycle design requirements of the system and its components. NDI Programs are applicable to all phases of the system life cycle, including acquisition, modification, and sustainment. This standard may also be applicable to mechanical equipment, subsystems, and propulsion systems, but the requirements defined by the NDI Program Plan should be tailored by the contracting agency for such use. An NDI Program Plan shall be developed at the beginning of the technology development phase and shall define all NDI requirements to be adhered to throughout the system life cycle.&lt;/div&gt;&lt;/div&gt;</p>
