    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aeronautical Standard covers two basic types of instruments as follows:
    &lt;div class="table-wrap anchor "&gt;
    &lt;div class="table-container"&gt;&lt;table class="br-none tbr-void " data-dataset-id=""&gt;
    &lt;tbody&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Type I&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;-&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Range 35,000 feet. Barometric Pressure. Scale range at least 28.1 - 30.99 inches of mercury (946 - 1049 millibars). May include markers working in conjunction with the Barometric Pressure Scale to indicate pressure-altitude.&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Type II&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;-&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Range 50,000 feet. Barometric Pressure. Scale range at least 28.1 - 30.99 inches of mercury (946 - 1049 millibars). May include markers working in conjunction with the Barometric Pressure Scale to indicate pressure-altitude.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div/&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;</p>
