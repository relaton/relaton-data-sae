  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice describes common definitions and operational elements of Event Data Recorders. The SAE J1698 series of documents consists of the following:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1698-1 - Event Data Recorder - Output Data Definition; Provides common data output formats and definitions for a variety of data elements that may be useful for analyzing vehicle crash and crash-like events that meet specified trigger criteria.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1698-2 - Event Data Recorder - Retrieval Tool Protocol; Utilizes existing industry standards to identify a common physical interface and define the protocols necessary to retrieve records stored by light duty vehicle Event Data Recorders (EDRs).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1698-3 - Event Data Recorder - Compliance Assessment; Defines procedures that may be used to validate that relevant EDR output records conform with the reporting requirements specified in Part 563, &lt;span class="xref"&gt;Table 1&lt;/span&gt; during the course of FMVSS-208, FMVSS-214 and other applicable vehicle level crash testing.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
