    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes a Generic Open Architecture (GOA) Framework for application independent hardware/software systems. This document defines the interface classes for the GOA Framework. Supplemental documents define the guidelines for applying the GOA Framework to specific applications.&lt;/div&gt;&lt;/div&gt;</p>
