  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to equipment to be used with R-1234yf refrigerant only. It establishes requirements for equipment used to recharge R-1234yf to an accuracy level that meets &lt;span class="xref"&gt;Section 9&lt;/span&gt; of this document and purity levels defined in SAE J2099. Refrigerant service equipment is required to ensure adequate refrigerant recovery to reduce emissions and provide for accurate recharging of mobile air conditioning systems. Equipment shall be certified to meet all performance requirements outlined in this document and international/regional construction and safety requirements as outlined in this document.&lt;/div&gt;
    &lt;/div&gt;</p>
