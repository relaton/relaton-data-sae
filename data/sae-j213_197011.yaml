    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform definitions for various types of motorcycles, their components, and basic characteristics. The various classes of vehicles defined in this report include only those which are intended at least partially for public road use and excludes vehicles which do not meet common legal requirements for public road use.&lt;/div&gt;&lt;/div&gt;</p>
