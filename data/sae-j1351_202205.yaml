  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test can be used to evaluate odor characteristics of non-metallic materials used in the interior cabin of a vehicle. The test conditions, odor panel requirements, scale for odor intensity and reporting of results are specified.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The data from this test are useful when compared to data obtained from samples with known odor characteristics.&lt;/div&gt;&lt;/div&gt;</p>
