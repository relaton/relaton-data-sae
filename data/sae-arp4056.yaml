  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Turbine engines installed in rotorcraft have an exhaust system that is designed and produced by the aircraft manufacturer. The primary function of the exhaust system is to direct hot exhaust gases away from the airframe. The exhaust system may consist of a tailpipe, which is attached to the engine, and an exhaust fairing, which is part of the rotorcraft. The engine manufacturer specifies a baseline "referee" tailpipe design, and guaranteed engine performance is based upon the use of the referee tailpipe and tailpipe exit diameter. The configuration used on the rotocraft may differ from the referee tailpipe, but it is intended to minimize additional losses attributed to the installation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) describes the physical, functional, and performance interfaces to be considered in the design of the aircraft exhaust system.&lt;/div&gt;&lt;/div&gt;</p>
