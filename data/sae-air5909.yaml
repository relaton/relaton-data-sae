  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) presents metrics for assessing the performance of prognostic algorithms applied for Engine Health Management (EHM) functions. The emphasis is entirely on prognostics and as such is intended to provide an extension and complement to such documents as AIR5871, which offers information and guidance on general prognostic approaches relevant to gas turbines, and AIR4985 which offers general metrics for evaluating diagnostic systems and their impact on engine health management activities.&lt;/div&gt;
    &lt;/div&gt;</p>
