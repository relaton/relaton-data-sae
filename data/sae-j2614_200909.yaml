  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers sub-critically annealed electric resistance welded and cold-drawn single-wall high strength low alloy steel tubing intended for use in hydraulic pressure lines and in other applications requiring tubing of a quality suitable for bending, flaring, cold forming, welding and brazing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The grade of material produced to this specification is of micro-alloy content and is considerably stronger and intended to service higher pressure applications than like sizes of the grades of material specified in SAE J525 and SAE J2467. Due to the alloy content of the material, the forming characteristics of the finished tube are equal to or better, when compared to SAE J525 and SAE J2467. Nominal reference working pressures for this tubing are listed in ISO 10763 for metric tubing and SAE J1065 for inch tubing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;CAUTION: When brazing or welding is used as a tube end joining method, the structural integrity of the tube material can potentially be compromised due to the degradation of the areas affected by the thermal effect applied to the tubing; therefore, the ISO 10763 and SAE J1065 nominal reference working pressures may not be applicable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Brazed and/or welded tube assembly configurations made to specific geometry and components bill of material in association with this material, may require qualification testing in accordance with ISO 19879 Test Methods for Hydraulic Fluid Power Connections. Cold forming the tube end configurations avoids this systemic testing by not compromising the tube material structural integrity.&lt;/div&gt;&lt;/div&gt;</p>
