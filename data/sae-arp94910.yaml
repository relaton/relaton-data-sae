  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes recommended practices for the specification of general performance, design, test, development, and quality assurance requirements for the flight control related functions of the Vehicle Management Systems (VMS) of military Unmanned Aircraft (UA), the airborne element of Unmanned Aircraft Systems (UAS), as defined by ASTM F 2395-07. The document is written for military unmanned aircraft intended for use primarily in military operational areas. The document also provides a foundation for considerations applicable to safe flight in all classes of airspace.&lt;/div&gt;




    &lt;/div&gt;</p>
