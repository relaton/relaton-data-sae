abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a systematic method for the identification of ground thread taps for inch sizes up to 9.999 in with a Maximum Thread-per-Inch of 99.9, and Metric sizes up to 99.9 mm with a Maximum pitch of 9.99 mm. It is intended to assist in the cataloging and supplying of these tools. It is not intended for ACME, Buttress, or similar type thread forms.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 1— Caution must be taken when assigning codes to prevent specifying taps that cannot be physically or economically manufactured.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 2— The Code Number coming from the manufacturer MUST reflect the actual tool construction.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 3— In particular without limitation, SAE disclaims all responsibility for the accuracy or completeness of information contained within this report if the standards of this report are retrieved, combined, or used in connection with any software.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
