abstract:
- language: en
  script: Latn
  content: "<p>This laboratory test method applies to air filters that improve air
    quality by reducing concentrations of gaseous, odorous, or hazardous components
    from ambient and/or re-circulated air in vehicle cabins. The test method provides
    information on pressure drop, as well as gas and/or vapor removal characteristics.
    \n\nThe purpose of the test method is to describe and establish test criteria
    to enable comparisons of filters and filter components that remove or reduce the
    levels of containment gases or vapors from air streams under specified laboratory
    conditions.</p>"
