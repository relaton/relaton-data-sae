  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies instructions to verify proper calibration of all balancing machines used for processing gas turbine rotors. Detailed test procedures and test log samples are provided to evaluate the condition of the machine under test. These performance and test requirements may be used for new installations, periodic surveillance, or following repairs that may have affected machine performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Calibration of the balancing machine is an activity done prior to verification testing and is outside the scope of this document. Troubleshooting of difficulties during the verification tests is also outside the scope of this document; this document is purely an instructive procedure.&lt;/div&gt;&lt;/div&gt;</p>
