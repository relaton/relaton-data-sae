abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard lays down the vocabulary and specifies performance
    test methods and criteria to enable uniform assessment of the service, secondary,
    and parking brake systems of wheeled specially designed  forestry machines. This
    document applies to self-propelled, rubber-tired special  forestry machines defined
    in SAE J1209 or ISO 6814 as skidders, fellers, forwarders, and the various combinations
    of these machines.</p>"
