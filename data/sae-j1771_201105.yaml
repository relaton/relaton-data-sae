  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to refrigerant identification equipment to be used for identifying refrigerant CFC-12 (R-12) and HFC-134a (R-134a) refrigerant when servicing a mobile A/C system or for identifying refrigerant in a container to be used to charge a mobile A/C system. Identification or other refrigerants are the option of the equipment manufacturer.&lt;/div&gt;&lt;/div&gt;</p>
