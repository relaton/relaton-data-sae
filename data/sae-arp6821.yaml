abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document contains information and guidance necessary for the development of a representative, repeatable validation program that may be utilized to assess the capability of SHM systems. The nature of SHM data differs from that seen in traditional nondestructive evaluation (NDE) applications in that the position of SHM sensors is fixed and SHM data can be available much more frequently (if not continuously) over time. This document presents methodologies that can be used to arrive at SHM capability while considering the unique nature of SHM deployment. Each SHM system must be considered independently to determine the applicability and limitations of the guidance contained here for each SHM system being assessed.&lt;/div&gt;


    &lt;/div&gt;</p>
