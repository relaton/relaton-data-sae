    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a premium aircraft-quality, corrosion-resistant steel in the form of bars, wire, forgings, mechanical tubing, and flash welded rings in the solution heat-treated condition, 12 inches (305 mm) and under in nominal diameter, thickness or, for hexagons, least distance between parallel sides (thickness), and stock of any size for forging or flash welded rings.&lt;/div&gt;&lt;/div&gt;</p>
