  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies a method for measuring the deflection of friction materials, noise insulators, and disc brake pad assemblies to be used in road vehicles with a Gross Vehicle Weight Rating below 4336 kg.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This part of the SAE J3079 includes the test for deflection and creep at various pressures under ambient temperature conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE test method differs from SAE J2468 and ISO 6310 in the preload and maximum load applied to the test sample when deflection is measured. It also introduces additional measurements such as for deflection offset, hysteresis, and creep.&lt;/div&gt;&lt;/div&gt;</p>
