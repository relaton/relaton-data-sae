abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides vehicle-level data collection, data analysis, and data verification procedures that may be used to verify that an instrument under test (IUT) satisfies the vehicle-level requirements specified in the SAE International (SAE) J2945/1 standard. For the purposes of this recommended practice, “vehicle-level requirements” primarily consist of those requirements which can be verified external to the vehicle. The IUT for these procedures is a configured dedicated short range communications (DSRC) vehicle-to-vehicle (V2V) device as defined in SAE J2945/1 and is installed on a light vehicle. While the IUT is conceptually separated from the vehicle it is installed on, the tests outlined in this document are primarily vehicle-level so the terms “vehicle” and “IUT” can generally be considered interchangeable. Additionally, non-vehicle-level complementary tests, not included in this document, are required to verify that the entire set of requirements specified in SAE J2945/1 is satisfied.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document also includes a traceability matrix to provide traceability between SAE J2945/1 sections and the test procedures. This can be used to ensure thoroughness of testing coverage.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE J2945/1 sections that are included in the scope of this revision in this document are indicated in &lt;span class="xref"&gt;Table 1&lt;/span&gt;. SAE J2945/1 major section numbers that are indicated as N/A do not contain any requirements (subsections may include requirements). Sections that are not in scope, such as standards profiles, are expected to be tested and verified as part of device-level certification, prior to vehicle-level testing, which is the primary focus of this document.&lt;/div&gt;

    &lt;/div&gt;</p>
