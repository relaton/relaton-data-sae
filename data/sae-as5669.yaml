    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines a data communications Transport Layer for the Joint Architecture for Unmanned Systems (JAUS). This Transport Specification defines the formats and protocols employed for the transport of JAUS messages between compliant entities for all supported link-layer protocols and media.&lt;/div&gt;


