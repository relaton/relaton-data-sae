  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies minimum performance standards for airborne binocular Head Up Displays (HUDs) in fixed wing aircraft. This document covers criteria for conformal and non-conformal HUD systems that are intended for use in the cockpit by the pilot or copilot. Display minimum performance characteristics are specified for standard and other environmental conditions for the purpose of product qualification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not address sensor imaging systems, displays worn by the pilot (goggles, helmet mounted displays) or specific symbology to be displayed.&lt;/div&gt;&lt;/div&gt;</p>
