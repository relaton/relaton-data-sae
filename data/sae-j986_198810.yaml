  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the test procedure, environment, and instrumentation for determining the exterior sound level for passenger cars, multipurpose vehicles, and light trucks having a gross vehicle mass (weight) rating of 4540 kg (10 000 lb) or less.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedure of this standard is characterized by having fixed initial conditions (specified initial vehicle speed and gear selection at a fixed start point on the test site) in contrast to the procedure of SAE J1030 FEB87, Maximum Sound Level for Passenger Cars and Light Trucks, which has fixed terminal conditions (attainment of rated engine speed at a fixed end point on the test site). Full-throttle acceleration and closed-throttle deceleration of the vehicle are included in both procedures.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Sound levels determined in accordance with this standard are dependent on the performance capability of the test vehicle, as influenced by power-to-mass ratio and overall power train gear ratio.&lt;/div&gt;&lt;/div&gt;</p>
