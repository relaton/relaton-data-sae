  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide guidelines for selection and application of instrumentation for measuring sound pressure and body cavity over-pressure inside a passenger car, as typified by that generated during the deployment of a passive passenger restraint system(s). The objective is to achieve uniformity in instrumentation practice and reporting of test measurements. Use of this recommended practice will provide a basis for meaningful comparisons of test results from different sources.&lt;/div&gt;&lt;/div&gt;</p>
