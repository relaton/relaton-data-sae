  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The minimum performance values in this SAE Recommended Practice are applicable to vehicles with brake systems having typical service pressure ranges 0 to 16.6 MPa (0 to 2400 psi) hydraulic or 0 to 945 kPa (0 to 135 psi) air only. SAE J880 not only provides for determining maximum brake rating power capability, but also permits verification of any desired or arbitrary level such as the requirement established herein. The determining criteria for deciding brake rating power capability are:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Cold brake stopping ability.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Fade as a result of brake power absorption.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Hot brake stopping ability following brake power absorption.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Brake system stability following brake power absorption.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Functional and structural integrity of brake system following test.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;/div&gt;</p>
