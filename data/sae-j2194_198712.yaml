abstract:
- language: en
  script: Latn
  content: |-
    <p>Any ROPS meeting the performance requirement of ISO 5700 (Static ROPS Test Standard) or ISO 3463 (Dynamic ROPS Test Standard) meets the performance requirements of this SAE Standard if the ROPS temperature/material and seat belt requirements of this document are also met.

    Fulfillment of the intended purpose requires testing as follows:

    A temperature-material requirement (6.9).  This can be satisfied by using the appropriate materials or by performing any of the structural performance tests (Sections 7, 8, or 9) at -18 °C.

    A laboratory test, under repeatable and controlled loading, to permit analysis of the ROPS for compliance with the performance requirements of this document.  Either the static test sequence (Section 7) or the impact test sequence (Section 8 ) shall be conducted.  See Figure 1.

    A seat belt anchorage test (Section 10).

    The test procedures and performance requirements outlined in this document are based on currently available engineering data.</p>
