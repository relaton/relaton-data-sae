  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The utilities defined for J2037 are designed to facilitate manufacturing and service diagnosis requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Definition of the capability includes definition of standard messages and the dialogue necessary to provide the capability. The standard messages will be distinguished by the contents of the first data byte which specifies the diagnostic operation. Note that some vehicle applications will not require the implementation of all the defined diagnostic capabilities, and consequently, these applications will not support all message modes.&lt;/div&gt;&lt;/div&gt;</p>
