  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform procedures for testing BEVs that are capable of being operated on public and private roads. The procedure applies only to vehicles using batteries as their sole source of power. It is the intent of this document to provide standard tests that will allow for the determination of energy consumption and range for light-duty vehicles (LDVs) based on the federal test procedure (FTP) using the urban dynamometer driving cycle (UDDS) and the highway fuel economy driving schedule (HFEDS) and provide a flexible testing methodology that is capable of accommodating additional test cycles as needed. Additionally, this SAE Recommended Practice provides five-cycle testing guidelines for vehicles performing supplementary testing on the US06, SC03, and cold FTP procedures. Realistic alternatives should be allowed for new technology. Evaluations are based on the total vehicle system’s performance and not on subsystems apart from the vehicle.&lt;/div&gt;
    &lt;/div&gt;</p>
