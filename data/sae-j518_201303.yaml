  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers complete general and dimensional specifications for the flanged heads and split flange clamp halves applicable to four-bolt split flange type tube, pipe, and hose connections with appropriate references to the O-ring seals and attaching components used in their assembly. (See &lt;span class="xref"&gt;Figures 1&lt;/span&gt; and &lt;span class="xref"&gt;2&lt;/span&gt;.) Also included are recommended port dimensions and port design considerations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The flanged heads specified are incorporated into fittings having suitable means for attachment of tubes, pipes, or hoses to provide connection ends. These connections are intended for application in hydraulic systems, on industrial and commercial products, where it is desired to avoid the use of threaded connections.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;THE RATED WORKING PRESSURE OF A HOSE ASSEMBLY COMPRISING SAE J518 HOSE CONNECTIONS AND SAE J517 HOSE SHALL NOT EXCEED THE LOWER OF THE TWO WORKING PRESSURE RATED VALUES.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Flanged heads shall be as specified in &lt;span class="xref"&gt;Figure 3&lt;/span&gt; and &lt;span class="xref"&gt;Table 1&lt;/span&gt;. Split flange clamp halves shall be as specified in &lt;span class="xref"&gt;Figure 4&lt;/span&gt; and &lt;span class="xref"&gt;Table 1&lt;/span&gt;. Port dimensions and spacing shall be as specified in &lt;span class="xref"&gt;Figure 5&lt;/span&gt; and &lt;span class="xref"&gt;Table 2&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;O-ring seals, having nominal dimensions as indicated in &lt;span class="xref"&gt;Table 1&lt;/span&gt;, are used in conjunction with these connections. They shall conform to the seals specified in SAE J120, Table on Dimensions and Tolerances.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Bolts for use with these connections shall be of the sizes and lengths indicated in &lt;span class="xref"&gt;Table 1&lt;/span&gt;. They shall be of SAE Grade 5 material or better as specified in SAE J429. Socket head cap screws of SAE Grade 5 material or better are acceptable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Lock washers, if used, shall be in accordance with the light spring lock washers specified in SAE J489, Dimensions of Light, Medium, Heavy, Extra Heavy, and Hi Collar Spring Lock Washers, and of sizes applicable to the corresponding bolts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data contained in &lt;span class="xref"&gt;Table 1&lt;/span&gt; with respect to all unspecified detail.&lt;/div&gt;&lt;/div&gt;</p>
