  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Ultraviolet (UV) laser marking for aerospace wire and cable is now a well established and accepted process. The purpose of this report is to provide general information on the technical basis of marking systems that apply UV laser energy to the wire surface. This includes materials for UV laser marking; the key characteristics of UV lasers suitable for this application, in terms of the mark process requirements and operational requirements; the various types of UV lasers which meet the general requirements for wire marking; and the generic components of UV laser marking systems. Subjects beyond the scope of this report include other wire marking systems not utilizing UV lasers; legibility; and contrast measurement.&lt;/div&gt;&lt;/div&gt;</p>
