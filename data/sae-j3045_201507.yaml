  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE recommended practice establishes a uniform, powered vehicle T.P. for lane departure warning systems used in highway trucks and buses greater than 4,546 kg (10,000 lb) GVW. Systems similar in function but different in scope and complexity, including Lane Keeping/Lane Assist and Merge Assist, are not included in this T.P. This T.P. does not apply to trailers, dollies, etc. This T.P. does not intend to exclude any particular system or sensor technology.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specification will test the functionality of the LDWS (e.g., ability to detect lane presence, and ability to detect an unintended lane departure), its ability to indicate LDWS engagement, its ability to indicate LDWS disengagement, and determine the point at which the LDWS notifies the Human Machine Interface (HMI) or vehicle control system that a lane departure event is detected. The HMI is not addressed herein, but is considered in SAE Standard J2808.&lt;/div&gt;&lt;/div&gt;</p>
