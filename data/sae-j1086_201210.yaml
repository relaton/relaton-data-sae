abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a unified numbering system (UNS) for metals and alloys which have a "commercial standing" (see &lt;span class="xref"&gt;6.1&lt;/span&gt;), and covers the procedure by which such numbers are assigned.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Section 2 describes the system of alphanumeric designations or "numbers" established for each family of metals and alloys.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Section 3 outlines the organization established for administering the system.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Section 4 describes the procedure for requesting number assignment to metals and alloys for which UNS numbers have not previously been assigned.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
