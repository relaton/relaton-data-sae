  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is intended to give guidance to users, regulators and persons in the aviation field who may be affected by the potential visual interference effects of lasers aimed at aircraft by the general public. The potential effects include startle (distraction, disruption, disorientation, and operational incapacitation), glare, and flashblindness. This document provides mitigation strategies against such effects, including operational procedures, pilot education, and the use of Laser Glare Protection.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Prevention of harm from laser eye injuries is discussed but is not a focus of this document, due to the extremely low likelihood of injurious levels of laser light in typical aircraft illumination scenarios.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Devices for detecting and reporting hazardous laser illuminations are briefly described in &lt;span class="xref"&gt;Appendix D&lt;/span&gt;, but are not a focus of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Some information in this document may also be useful for non-aviation users, such as persons driving vehicles. Additional information can be found in ANSI Z136.6, “Safe Use of Lasers Outdoors”.&lt;/div&gt;
    &lt;/div&gt;</p>
