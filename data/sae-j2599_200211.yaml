  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers design and evaluation of the entire gasoline filler pipe assembly used on cars and light trucks with respect to compliance with CARB (California Air Resources Board) LEV II (meeting or exceeding EPA Tier 2 and EU Stage-5 evaporative emissions requirements). It is limited to an assembly which is joined to the fuel tank using either a hose, Quick Connect Coupling, or a grommet type sealing device.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Design Practice covers the filler cap, filler pipe, filler pipe assembly to tank hose, and filler pipe assembly to tank grommet or spud. It includes recommendations for design of components and assemblies intended to perform successfully in evaporative emission SHED (Sealed Housing for Evaporative Determination) tests, based on best practices known at the time of release.&lt;/div&gt;&lt;/div&gt;</p>
