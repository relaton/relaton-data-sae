  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this recommended practice is to establish test procedures and minimum performance standards for kingpins and their supporting structure manufactured to SAE specifications. The dimensions shown in SAE J700 will permit the establishment of standard clearances in the installed condition which, in turn, will permit fifth wheel manufacturers to design their products to establish interchangeability with any kingpin made and installed to the SAE specification.&lt;/div&gt;&lt;/div&gt;</p>
