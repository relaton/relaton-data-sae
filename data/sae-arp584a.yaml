  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice encompasses design, analysis, fabrication, and installation of pressurized plain metal tubing used in fluid power systems to provide relative motion.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Specific data given are for MIL-T-6845 tubing ranging from 1/4 inch to 1 inch dia. used in 3000 psi hydraulic or pneumatic systems, Types I, II, III or IV applied to any type of vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The flexible configurations of plain metal tubing are intended for application to actuators that oscillate about a pivot, to areas of large structural deflection such as reservoirs installation, and to areas of extreme environment where flexible hose could not survive.&lt;/div&gt;&lt;/div&gt;</p>
