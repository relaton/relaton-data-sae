  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard establishes the requirements for a grooved clamp coupling, flanges, and seal suitable for joining high pressure and high temperature ducting in aircraft bleed air systems. The rigid coupling joint assembly, hereafter referred to as "the joint", shall operate within the temperature range of -65 to +1200 °F.&lt;/div&gt;&lt;/div&gt;</p>
