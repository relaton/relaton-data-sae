abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is derived from the FMVSS 105 vehicle test and applies to two-axle multipurpose passenger vehicles, trucks, and buses with a GVWR above 4540 kg (10000 pounds) equipped with hydraulic service brakes. There are two main test sequences: the Development Test Sequence for generic test conditions when not all information is available or when an assessment of brake output at different inputs is required, and the FMVSS Test Sequence when vehicle parameters for brake pressure as a function of brake pedal input force and vehicle-specific loading and brake distribution are available. The test sequences are derived from the Federal Motor Vehicle Safety Standard 105 (and 121 for optional sections) as single-ended inertia-dynamometer test procedures when using the appropriate brake hardware and test parameters. This recommended practice provides Original Equipment Manufacturers (OEMs), brake and component manufacturers, and aftermarket suppliers with results related to brake output, friction material effectiveness, and corner performance in a laboratory-controlled test environment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test sequences include dynamic conditions (braking speeds, temperature, and braking history as outlined in FMVSS 105), inertia loads equivalent to the vehicle’s LLVW and GVWR, and fully operational, partial failure, and failed system conditions. All applicable sections of FMVSS 105 are included. Optional sections include parking brake output, water recovery, TP-121D dynamometer retardation, and 32 km/h (20 mph) stops to simulate Federal Motor Carrier Safety Administration (FMCSA) requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This recommended practice does not evaluate or quantify other brake system characteristics such as wear, noise, judder, ABS performance, or braking under extreme temperatures or speeds. Minimum performance requirements are not part of this recommended practice. Consistency and margin of pass/fail of the minimum requirements related to stopping distance or equivalent deceleration levels of the FMVSS 105 vehicle test can be assessed as part of the project in coordination with the test requestor when using the appropriate vehicle information and vehicle dynamics modeling. Nevertheless, this procedure and its results do not replace the vehicle-level test to demonstrate compliance with FMVSS (105 for hydraulic brake systems or 121 for air-over-hydraulic brake systems) or other mandatory regulations (like ECE R13 or equivalents).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Towing and trailering applications are not part of this document and require a separate assessment per SAE J2807.&lt;/div&gt;
    &lt;/div&gt;</p>
