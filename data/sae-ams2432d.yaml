  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for computer monitored shot peening of part surfaces by impingement of media, including metallic, glass, or ceramic shot. Computer monitored peening is intended to provide a method of process observation, traceability, and response for all process input settings, in real time, during the entire peening process to ensure with objective evidence, the desired process outputs. Shot peening in accordance with AMS2432 meets or exceeds the requirements of AMS2430.&lt;/div&gt;&lt;/div&gt;</p>
