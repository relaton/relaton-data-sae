    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) is to be used as a supplement to AS7109. In addition to the requirements contained in AS7109, the requirements contained herein shall apply to suppliers seeking Nadcap Coatings accreditation who are engaged in evaluation of coatings. Suppliers accredited to AS7101 that perform evaluations of coating shall demonstrate compliance to the applicable portions of the Standard as described in the Nadcap Auditor Handbook.&lt;/div&gt;&lt;/div&gt;</p>
