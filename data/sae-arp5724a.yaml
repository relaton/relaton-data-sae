    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) provides recommended requirements for the testing of electromechanical actuators (EMAs). General test considerations are also provided. While many EMA configurations include motor control electronics, the specific tests required for the electronic hardware, software, or firmware are outside the scope of this document.&lt;/div&gt;

