  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This paper describes a recommended practice and procedure for the correlation of test cells that are used for the performance testing of turboprop and turboshaft engines. This Aerospace Recommended Practice (ARP) shall apply to both dynamometer and propeller based testing. Test cell correlation is performed to determine the effect of any given test cell enclosure and equipment on the performance of an engine relative to the baseline performance of that engine. Although no original equipment manufacturer (OEM) documents are actually referenced, the experience and knowledge of several OEMs contributed to the development of this document. Each engine manufacturer has their own practices relating to correlation and they will be used by those OEMS for the purpose of establishing certified test facilities.&lt;/div&gt;&lt;/div&gt;</p>
