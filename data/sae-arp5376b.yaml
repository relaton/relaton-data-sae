  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides procedures for assuring cleanliness of sampling equipment, for performing the sampling process, and for measuring and reporting the sample particle count.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The ARP gives procedures for cleaning sample bottles, when used, and recommends the solvents to be applied and how these solvents should be prepared.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Requirements for the selection of the sampling point, sampling method, and sampling frequency are also specified.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP also recommends three measuring methods for determining the level of solid particle contamination of hydraulic fluids used in aerospace hydraulics. These are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;on-line automatic particle counting;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;automatic particle counting method using bottle samples;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;microscopic particle count method using bottle samples.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
