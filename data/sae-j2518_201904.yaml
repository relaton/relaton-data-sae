  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides a uniform method to calculate the lift capacity of scrap and material handlers, establishes definitions and specifies machine conditions for the calculations. This document applies to scrap and material handlers as defined in SAE J2506 that have a 360 degrees continuous rotating upper structure. It does not apply to equipment that is incapable of lifting a load completely off the ground. This document applies to those machines that are crawler, wheel, rail and pedestal or stationary mounted.&lt;/div&gt;

    &lt;/div&gt;</p>
