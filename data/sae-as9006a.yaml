  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The basic requirements of AS9100A apply with the following clarifications.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;This document supplements the requirements of AS9100A for deliverable software.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;This supplement contains Quality System requirements for suppliers of products that contain deliverable embedded or loadable airborne, spaceborne or ground support software components that are part of an aircraft Type Design, weapon system, missile or spacecraft operational software and/or support software that is used in the development and maintenance of deliverable software. This includes the host operating system software including assemblers, compilers, linkers, loaders, editors, code generators, analyzers, ground simulators and trainers, flight test data reduction, etc., that directly support creation, test and maintenance of the deliverable software. Where Commercial-Off-The-Shelf (COTS) or non-developmental components are integrated into a deliverable product, the organization and the customer shall agree on the extent of applicability of this supplement. The organization shall demonstrate that the software development infrastructure is in compliance with AS9100.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;This document also applies to firmware as defined herein. It does not apply to programmable logic devices, including fuse-link or reconfigurable parts such as Application Specific Integrated Circuits, (ASIC) or Field Programmable Gate Arrays (FPGA). ASICS AND FPGA’S are addressed by RTCA/DO-254.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
