  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a uniform guide for defining the degree of external leakage on a hydraulic system. The leakage classifications include dustry and dust-free conditions. The choice of classification is intended to be by visual means rather than with the aid of instruments. It describes the leakage state at the observed time, considering that the state may change over a period of time.&lt;/div&gt;
    &lt;/div&gt;</p>
