  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The UCS technical governance comprises a set of policies, processes, and standard definitions to establish consistency and quality in the development of architecture artifacts and documents. It provides guidance for the use of adopted industry standards and modeling conventions in the use of Unified Modeling Language (UML) and Service Oriented Architecture Modeling Language (SoaML), including where the UCS Architecture deviates from normal UML conventions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document identifies the defining policies, guidelines, and standards of technical governance in the following subjects:
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;Industry standards adopted by the AS-4UCS Technical Committee:&lt;/i&gt; These are the industry standards and specifications adopted by AS-4UCS in the generation and documentation of the architecture.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;UCS Architecture Development&lt;/i&gt;: UCS specific policies on the development of the UCS Architecture.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The AS-4UCS Technical Committee governance policies are intentionally minimal. The object is to provide direction specific to the intent and scope of developing architecture artifacts that follow a consistent set of specifications and industry best practices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Standards are referenced within policies. Standards may place constraints on policies that are implemented by processes. Each process is intended to guide the development of architecture artifacts. For example, a standard may dictate that a UML diagram be modeled in a particular methodology using only approved stereotypes from the SoaML UML profile.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;UCS technical governance applies to the following technical work products that are generated within the AS-4UCS Technical Committee. It is not applicable to third party developers, programs, or any other consumer of the UCS Architecture.
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The technical governance applies to the following item:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;○&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;UxS Control Segment (UCS) Architecture: Model AS6518&lt;/i&gt;: Structure, diagrams, packages, and artifacts shall be defined in individual policies.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Examples in this document are correct per &lt;i&gt;UxS Control Segment (UCS) Architecture: Architecture Technical Governance&lt;/i&gt; AS6522 content but may not necessarily reflect the latest revision of the UCS Architectural Model.&lt;/div&gt;&lt;/div&gt;</p>
