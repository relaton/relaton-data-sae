    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) shall be limited to information about corrosion caused by fluoride offgassing of fluoropolymer-based wire insulation. It reviews published reports of corrosion caused by this phenomenon, describes scenarios where this may be a concern, mitigation options, and references a test method which can be used to evaluate wire insulations where needed.&lt;/div&gt;
