    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines diagnostic test modes, and request and response messages, necessary to be supported by vehicle manufacturers and test tools to meet the requirements of the California OBD II regulations, which pertain to vehicle emission-related data only. These messages are intended to be used by any service tool capable of performing California OBD II mandated diagnostics.&lt;/div&gt;
