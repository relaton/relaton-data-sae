  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice sets forth accepted definitions and terminology of major components and parts peculiar to snowmobiles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Illustrations have been selected to identify functional characteristics and to identify common mechanisms. They are not intended to show all existing commercial machines or to be exactly descriptive of any particular machine. These criteria were prepared to facilitate clear understanding and promote uniformity in snowmobile nomenclature.&lt;/div&gt;&lt;/div&gt;</p>
