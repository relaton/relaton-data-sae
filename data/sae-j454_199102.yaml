    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE Standards for wrought aluminum alloys cover materials with a considerable range of properties and other characteristics, but do not include all of the commercially available materials. If none of the materials listed in &lt;span class="xref"&gt;Tables 1&lt;/span&gt; through &lt;span class="xref"&gt;7&lt;/span&gt; provides the characteristics required by a particular application, users may find it helpful to consult with the suppliers of aluminum alloy products. See companion document, SAE J1434.&lt;/div&gt;&lt;/div&gt;</p>
