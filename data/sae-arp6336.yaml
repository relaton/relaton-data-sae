  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides technical recommendations for the lighting applications for Unmanned Aircraft Systems (UAS). The technical content of this ARP discusses the unique trade-offs that are necessary to maintain commonality to the U.S. Federal Aviation Regulations (FARs)&lt;sup&gt;&lt;span class="xref"&gt;1&lt;/span&gt;&lt;/sup&gt; for aerospace lighting. The recommendations set forth in this document are to aid in the design of Unmanned Aircraft (UA) lighting for the size of aircraft and operation for which the aircraft is intended. In addition, certain concepts of operation for which UASs are suited will require unique lighting solutions.&lt;/div&gt;
    &lt;/div&gt;</p>
