  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE GEIA-STD-0007C defines logistics product data generated during the requirement definition and design of an industry or government system, end item, or product. It makes use of the Extensible Markup Language (XML) through the use of entities and attributes that comprise logistics product data and their definitions. The standard is designed to provide users with a uniform set of data tags for all or portions of logistics product data. The standard can be applied to any industry or government product, system or equipment acquisition program, major modification program, and applicable research and development projects. This standard is for use by both industry and government activities. As used in this standard, the requiring authority is generally the customer and the customer can be a government or industry activity. The performing activity may be either a industry or government activity. The use of the term “contract” in this standard includes any document of agreement between organizations.&lt;/div&gt;&lt;/div&gt;</p>
