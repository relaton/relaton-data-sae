  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides a uniform method for determining rated and struck capacity for buckets used on excavators, mini-excavators, and backhoes as defined in SAE J1057 and equipped with hoe attachment. Calculations are based on the inside physical dimensions of the bucket only, without use of optional side cutters, spill guards, teeth, or other accessories and without regard to bucket action provided by any specific machine. This document does not cover shovel, clam, or dragline buckets described in SAE J67 or loader buckets described in SAE J742.&lt;/div&gt;&lt;/div&gt;</p>
