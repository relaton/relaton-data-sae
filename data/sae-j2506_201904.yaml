  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes terminology and the content of commercial literature specifications for self-propelled crawler and wheeled material handlers, pedestal mounted material handlers and their equipment as defined in &lt;span class="xref"&gt;3.1&lt;/span&gt;. Illustrations used here are not intended to include all existing commercial machines or to be exactly descriptive of any particular machine. They have been provided to describe the principles to be used in applying this document. (Material handlers share many design characteristics with hydraulic excavators and log loaders; primarily 360 degree continuous rotation of the upperstructure relative to the undercarriage or mounting. They differ in their operating application. Material handlers are used for the handling of scrap material and normally utilize grapples or magnets. Hydraulic excavators are used for the excavation of earth, gravel and other loose material utilizing a bucket. Log loaders are used for the handling of logs and trees and normally utilize grapples.)&lt;/div&gt;
    &lt;/div&gt;</p>
