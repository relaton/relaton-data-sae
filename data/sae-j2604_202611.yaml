  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test procedure is for qualification testing of powered gas/brake control systems to assure compliance with the recommended practices for these assistive devices. A powered gas/brake control system which passes all of the tests shall be considered to be in compliance with the recommended practices. The control shall pass all tests denoted by a “shall” in the recommended practice or the recommended test procedure (RTP). All the results of all tests and requirements denoted by a “should” shall be noted, but failure to comply will not constitute failure to pass the test.&lt;/div&gt;
    &lt;/div&gt;</p>
