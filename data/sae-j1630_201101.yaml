  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a method to be used for the static deployment of airbag module assemblies. The results obtained from the deployment tests will be used to verify compliance with design requirements and/or specifications, and for other engineering purposes such as module performance comparisons, and/or CAE input or validation. The purpose for this procedure is to describe recommended test methods to ensure, to the extent possible, reliable and reproducible test results for driver airbag modules, passenger airbag modules, or other airbag modules (e.g., side airbags, roof rail airbags, knee bolster airbags, etc.). Performance limits or acceptance criteria are not established as they are typically defined based on specific vehicle design requirements and/or manufacturer specifications. It is intended to be a general procedure for repetitive testing and suggests only general guidelines for the safe conduct of tests and reliable data correlation.&lt;/div&gt;&lt;/div&gt;</p>
