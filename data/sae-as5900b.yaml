  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the aerodynamic flow-off requirements for SAE AMS 1424 Type I and SAE AMS 1428 Type II, III and IV fluids used to deice and/or anti-ice aircraft:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;with takeoff rotation speeds exceeding approximately 100 knots, with time from brake release to rotation speed greater than 20 s, typical for large transport type jet aircraft. This procedure is referred to as the High Speed Ramp Test.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;and/or&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;with takeoff rotation speeds exceeding approximately 60 knots, with time from brake release to rotation speed greater than 15 s typical for commuter type aircraft. This procedure is referred to as the Low Speed Ramp Test.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: When compensating measures, such as increase in rotation speed, are used in the aircraft takeoff procedure, the High Speed Ramp can apply.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The objective of this standard is to ensure acceptable aerodynamic characteristics of the deicing/anti-icing fluids as they flow off aircraft lifting and control surfaces during the takeoff ground acceleration and climb.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: These test methods are based on glycol-based fluids, additional testing may be required for non-glycol-based fluids.&lt;/div&gt;&lt;/div&gt;</p>
