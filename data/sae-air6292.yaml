    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is a process verification guide for evaluating implementation of key factors in repair of fiber reinforced composite bonded parts or assemblies in a repair shop, hangar, or on-wing environment. This guide is to be used in conjunction with a regulatory approved and substantiated repair and is intended to promote consistency and reliability.&lt;/div&gt;
