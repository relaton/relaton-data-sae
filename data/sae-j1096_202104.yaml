  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the test procedure, environment, and instrumentation for determining the maximum exterior sound level of highway motor trucks and truck tractors over 4540 kg gross vehicle weight rating (GVWR) with governed engines under stationary vehicle conditions. The basic procedure involves a full throttle engine acceleration and a closed throttle deceleration with the engine inertia as the load.&lt;/div&gt;&lt;/div&gt;</p>
