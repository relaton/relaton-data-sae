    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a heat-resistant iron-nickel alloy in the form of bars, wire, forgings, flash welded rings. Product covered by this specification is limited to 8.0 inches (203 mm) and under in nominal diameter or maximum cross sectional dimension between parallel sides (thickness), and stock of any size for forging or flash welded rings.&lt;/div&gt;&lt;/div&gt;</p>
