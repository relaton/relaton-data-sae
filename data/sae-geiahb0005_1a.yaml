  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This handbook is designed to assist a program in assuring the performance, reliability, airworthiness, safety, and certifiability of product(s), in accordance with GEIA-STD-0005-1, “Performance Standard for Aerospace and High Performance Electronic Systems Containing Pb-free Solder”. Please note that the program manager, and managers of systems engineering, Supply Chain and Quality Assurance (along with their respective organizations), and the appropriate enterprise authority need to work together in ensuring that all impacts of Pb-free technology insertion are understood and risks mitigated accordingly. Herein “program management (or manager), supplier chain management (or manager), quality assurance management (or manager) and systems engineering management (or manager) and/or the appropriate enterprise authority” shall be defined as “responsible manager” throughout the remaining document (see &lt;span class="xref"&gt;Section 3&lt;/span&gt;, Terms and Definitions).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The basic principles delineated in this handbook can be used for program management, system engineering, supply chain management and quality assurance management of any aerospace and/or high performance program. &lt;span class="xref"&gt;Appendix A&lt;/span&gt; contains a General Responsible Manager Checklist for Dealing with Pb-free Issues. The checklist can be used to identify potential issues related to the content in &lt;span class="xref"&gt;sections 5&lt;/span&gt; through 15 of this handbook.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Pb-free technology can impact any program regardless of whether the program itself is exempt or bound by environmental regulations. The industry conversion to Pb-free solder technology may affect manufacturers and consumers of ADHP electronics in one or combinations of the following three ways: (1) If the program is required to implement Pb-free technology (contract requirement, environmental regulation, etc), then the managers of organizations responsible for program execution will need to assess the impact of in-house transition with respect to design (e.g., performance of products using Pb-free) and process (e.g., processes to build Pb-free products). (2) If the program purchases COTS (Commercial-off-the-Shelf) items for its products/systems, then there is a very good chance that these items will contain Pb-free solder or Pb-free finishes on parts, PWBs, or PBAs. (3) Manufacturers of ADHP electronics may inadvertently introduce Pb-free parts or assemblies (including component finish, Printed Wiring Board (PWB) finish, or assembly solder) if careful coordination between buyer and supplier is not exercised.&lt;/div&gt;&lt;/div&gt;</p>
