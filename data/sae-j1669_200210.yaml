abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Recommended Practice describes laboratory test methods to  measure filter performance. Performance includes, but is not limited to, air flow restriction or pressure drop, overall and fractional efficiency, holding capacity for airborne particles, and air filter structural integrity.

    The purpose of this test code is to establish and specify consistent test procedures, conditions, equipment, and performance reports to enable comparison of filter performance of particulate air filters used in automotive interior ventilation systems.</p>
