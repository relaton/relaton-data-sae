    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;CLARA identifies four functions: Data Space Generator, Truth Data Generator, Coefficient Generator, and Reconstructor. Together these four functions standardize the solution to the LAR problem. This ICD defines the logical interfaces of the four functions.&lt;/div&gt;&lt;/div&gt;</p>
