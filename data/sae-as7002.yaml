    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes rules for the implementation of the National Aerospace and Defense Contractors Accreditation Program (NADCAP) to accredit the capability of suppliers furnishing processes, products, and services for the aerospace and defense industries as provided for in specific programs. These rules shall be in compliance with the latest issue of Aerospace Standard AS7003.&lt;/div&gt;&lt;/div&gt;</p>
