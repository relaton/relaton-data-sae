  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes an evaluation procedure for validating tire models for use in road load simulations and assesses the relevant dynamic behavior of tires.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The laboratory test utilized is a “cleat” test, where a rolling tire on a drum encounters a cleat and the resulting dynamic forces and moments are measured. This test is described in SAE J2730, “Dynamic Cleat Test with Perpendicular and Inclined Cleats”. The test is commonly used to identify tire model parameters.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In this recommended practice, requirements for the measurement of the tire’s response are described along with data processing techniques and calculations used to quantitatively compare the tire model’s calculated response to the tire’s response measured on test. This recommended practice addresses both the tire model structure and its parameters.&lt;/div&gt;
    &lt;/div&gt;</p>
