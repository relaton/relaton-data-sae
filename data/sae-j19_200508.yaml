abstract:
- language: en
  script: Latn
  content: |-
    <p>These specifications cover dipped goods and coatings made from compounded latex. Products manufactured from this material include boots, coated clips, coated sponge parts, and coated fabrics for automotive applications.

    The compounds listed in Tables 1 and 2 are grouped into classifications based primarily on physical properties which are prescribed in the tables. These values, together with any additional requirements, indicated by suffix letters in the grade designations as described in Section 3, define the properties of the compounds after vulcanization. These values apply to test specimens obtained from standard laboratory dipped films prepared in accordance with procedures described in the applicable ASTM test methods. Test results from finished products may not duplicate the values obtained from standard test films. When differences due to the difficulty in obtaining suitable test specimens from the finished part arise, the purchaser and the supplier may agree on acceptable deviations. This can be done by comparing results obtained on standard test films with those obtained on actual parts.</p>
