    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard is to be used as a supplement to SAE AS7109. In addition to the requirements contained in AS7109, the requirements contained herein shall apply to suppliers seeking NADCAP Coatings accreditation who are engaged in evaluation of coatings. Suppliers accredited to SAE AS7101 that perform evaluations of coatings shall demonstrate compliance to the applicable portions of this Standard as described in the NADCAP Auditor Handbook.&lt;/div&gt;&lt;/div&gt;</p>
