  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method specifies the operating procedures for a controlled-irradiance, xenon-arc apparatus used for the accelerated exposure of various automotive interior trim components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Test duration, as well as any exceptions to the specimen preparation and performance evaluation procedures contained in this document, are covered in material specifications of the different automotive manufacturers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Any deviation to this test method, such as the use of optical filter combinations, is to be agreed upon by contractual parties.&lt;/div&gt;&lt;/div&gt;</p>
