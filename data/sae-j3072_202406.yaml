  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J3072 establishes requirements for a grid support inverter system function that is integrated into a plug-in electric vehicle (PEV), which connects in parallel with an electric power system (EPS) by way of conductively coupled, electric vehicle supply equipment (EVSE). This standard also defines the communication between the PEV and the EVSE required for the PEV onboard inverter function to be configured and authorized by the EVSE for discharging at a site. The requirements herein are intended to be used in conjunction with IEEE 1547-2018 and IEEE 1547.1-2020 or later versions.&lt;/div&gt;

    &lt;/div&gt;</p>
