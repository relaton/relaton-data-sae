  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice will serve as a practical resource that offers guidance to both the machine operator and process engineer for isolating the source(s) of non-repeatability in measured unbalance data. The content of this standard addresses:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Machine capability to achieve the specified unbalance tolerances and repeat within those tolerances.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Tooling capability to repeat within the specified unbalance tolerances.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Rotor characteristics that may preclude repeating within the required unbalance tolerances.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
