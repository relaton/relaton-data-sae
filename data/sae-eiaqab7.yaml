  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document has been formulated as a suggested guide in assisting EIA Engineering Department Panels and JEDEC Councils in cooperating with the Defense Department and other Federal agencies in the preparation of suggested reliability requirements for various types of electronic products as part of a program designed to enhance the reliability of defense and related equipment. The document is to be followed merely as a guide and is not intended to limit technical groups in the consideration of the factors to be taken into account in the development of reliability specifications for recommendation to the Government. The document is prepared as a guide to the following EIA Engineering Department Panels and JEDEC Councils:&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;This document is designed to implement the important specification features recommended by the PSMR-1 Report issued by DOD in 1960, and to guide specification writers toward the over-all objectives of making reliability information available in a consistent and orderly form.&lt;/div&gt;&lt;/div&gt;</p>
