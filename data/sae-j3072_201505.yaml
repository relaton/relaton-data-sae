  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard J3072 establishes interconnection requirements for a utility-interactive inverter system which is integrated into a plug-in electric vehicle (PEV) and connects in parallel with an electric power system (EPS) by way of conductively-coupled, electric vehicle supply equipment (EVSE). This standard also defines the communication between the PEV and the EVSE required for the PEV onboard inverter to be configured and authorized by the EVSE for discharging at a site. The requirements herein are intended to be used in conjunction with IEEE 1547 Standard for Interconnecting Distributed Resources with Electric Power Systems and IEEE 1547.1 Standard for Conformance Test Procedures for Equipment Interconnecting Distributed Resources with Electric Power Systems.&lt;/div&gt;

    &lt;/div&gt;</p>
