    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This material type has resistance to hot air, but generally has poor resistance to fuels and lubricants, but usage is not limited to such applications. Each application should be considered separately. This material type has a typical service temperature range of -85 to 500 °F (-65 to 260 °C). The operating temperature range of the material is a general temperature range, but the presence of particular fluids and design parameters may modify this range. Recommendations on the material selection are based on available technical data and are offered as suggestions only. Each user should make his own tests to determine the suitability for his own particular use.&lt;/div&gt;&lt;/div&gt;</p>
