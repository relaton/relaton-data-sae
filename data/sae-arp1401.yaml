  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) covers a brief discussion of the icing problem in aircraft fuel systems and different means that have been used to test for icing. Fuel preparation procedures and icing tests for aircraft fuel systems and components are proposed herein as a recommended practice to be used in the aircraft industry for fixed wing aircraft and their operational environment only. In the context of this ARP, the engine is not considered to be a component of the aircraft fuel system, for the engine fuel system is subjected to icing tests by the engine manufacturer for commercial and particular military applications.&lt;/div&gt;&lt;/div&gt;</p>
