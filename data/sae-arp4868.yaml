  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) specifies a set of functions and their expected behavior that constitute an Application Programming Interface (API) for gas turbine engine customer programs. The main body of this document contains a description of each of the API function calls and of the data that passes through these functions. Implementations of this API in specific programming languages are contained in separate appendices. These appendices include language specific details and the definitions for each function as required for the given language.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;AS681 is the parent document of ARP4868. All of AS681 applies to customer engine programs written to conform to this document.&lt;/div&gt;
    &lt;/div&gt;</p>
