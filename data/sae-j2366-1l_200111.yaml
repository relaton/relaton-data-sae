  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the Low Impedance Stereo Audio (LISA) bus, which may be used in conjunction with the Physical Layer of the IDB-C, as described in SAE J2366-1. The audio arbitration messages used to control access to the LISA bus are specified in SAE J2366-7.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The IDB-C is a non-proprietary virtual token passing bus, designed to allow disparate consumer, vehicle, and commercial electronic components to communicate and share information.&lt;/div&gt;&lt;/div&gt;</p>
