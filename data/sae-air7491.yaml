abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Increased use of advanced composite structural materials on aircraft has resulted in the need to address the more demanding quality and nondestructive testing procedures. Accordingly, increased utilization of solid laminate composites is driving changes to airline NDI/NDT training requirements and greater emphasis on the application of accurate NDI/NDT methods for composite structures. Teaching modules, including an introduction to composite materials, composite NDI/NDT theory and practice, special cases and lessons learned, are included in this document as well as various hands-on NDI/NDT exercises. A set of proficiency specimens containing realistic composite structures and representative damage are available to reinforce teaching points and evaluate inspector’s proficiency. Extensive details of the guidance modules, hands-on exercises, and proficiency specimens are all presented in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not replace OEM guidance as may be specific to material, process, and configuration for any particular product. This document is meant to be complementary to the OEM composite inspection training classes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Some NDI/NDT equipment is shown to provide example inspection results for educational purposes. This does not represent an endorsement of a particular piece of NDI/NDT equipment. Other NDI/NDT equipment may be used to produce acceptable inspection results.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This training guidance is only intended to provide specific assistance for inspectors who conduct NDI/NDT tasks on composite structures. Overall inspector training guidance should also be consulted for setting up comprehensive inspector training and qualification programs. This guidance includes, but is not limited to, the following documents: ATA 105, NAS 410, AC 65-31A, and AC 65-33.&lt;/div&gt;&lt;/div&gt;</p>
