    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice presents standardized test methods developed for use in testing with hydrocarbon fuels or their surrogates and those same fuels when blended with oxygenated fuel additives. Hydrocarbon fuels include Gasoline and Diesel fuel or their surrogates described in SAE J1681. Oxygenated additives include Ethanol, Methanol Methyl Tertiary Butyl Ether (MTBE) and Fatty Acid Methyl Esters (FAME or Biodiesel).&lt;/div&gt;
    &lt;/div&gt;</p>
