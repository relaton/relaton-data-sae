  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of the SAE Aerospace Recommended Practice (ARP) is to provide a process for users to identify the part number of AS7928 terminal lugs installed in civilian or military applications, although it can also can be used to identify terminals that have been stored incorrectly. This ARP is subject to change to keep pace with experience and technical advances of AS7928 terminals. A current set of tables are provided to list and identify current AS7928 terminal lug configurations per the associated specification detail sheet and terminal lug configuration. Specific configuration details, graphic, size and marking information for each individual terminal lug is provided to assist the product user with accurate selection for replacement or identification.&lt;/div&gt;
    &lt;/div&gt;</p>
