abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This document focuses on the latest in-force regulations.
    \ However, in addition to latest information, the report may include historical
    information.  As regulations are superseded, the previous entry will remain to
    help understand the change in requirements over time.  The initial focus of the
    document includes light-, medium-, and heavy-duty on-road vehicles with all propulsion
    systems.  The document will include information from the United States and Canada,
    with later publications expanding to other regions.  Forecasts for future regulations
    will not be included in the spreadsheet but be kept in a separate document.  The
    document may be expanded to other types of applications/vehicles as information
    becomes available.&lt;/p&gt;</p>"
