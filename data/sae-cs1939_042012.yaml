  content: |-
    <p>The J1939 Companion Spreadsheet is an easy-to-use Excel document which supplements the J1939 standards family. It consists of parameters and parameter groups contained in J1939 standards, including J1939-71, which can be easily searched and sorted. 
    			
    			
    &lt;ul&gt;&lt;li&gt;Data fields include:&lt;/li&gt;&lt;ul&gt;&lt;li&gt;PGN&lt;/li&gt;&lt;li&gt;Parameter Group Label&lt;/li&gt;&lt;li&gt;PNG Length&lt;/li&gt;&lt;li&gt;Transmission Rate&lt;/li&gt;&lt;li&gt;SPN&lt;/li&gt;&lt;li&gt;SPN Length&lt;/li&gt;&lt;li&gt;Description&lt;/li&gt;&lt;li&gt;Status of SPN&lt;/li&gt;&lt;/ul&gt;&lt;/ul&gt;</p>
