  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the design requirements and test procedures for separable beam seal fittings which include end fittings (see &lt;span class="xref"&gt;2.4.2&lt;/span&gt;), connectors (see &lt;span class="xref"&gt;2.4.3&lt;/span&gt;), and boss fittings for use in aerospace fluid systems. Design requirements are for Class 5000 and 8000 in titanium, and corrosion resistant steel (CRES). Definition of fittings and related terms are defined in &lt;span class="xref"&gt;2.4&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
