    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to define a test method for performing the Compression Stress Relaxation (CSR) Test with the Automotive Standard (ASD) CSR Jig using the appropriate test fixtures, configurations and procedures. This standard defines the equipment needed, guidelines for running the test, and the format for generating the results and analyzing the data.&lt;/div&gt;
