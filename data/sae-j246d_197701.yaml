  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers complete general and dimensional specifications for tube fittings of the spherical and flanged sleeve compression types for use in the piping of air brake systems on automotive vehicles. The spherical sleeve compression type &lt;span class="xref"&gt;Figs. 1A&lt;/span&gt;-&lt;span class="xref"&gt;5&lt;/span&gt; and &lt;span class="xref"&gt;Tables 3&lt;/span&gt;-&lt;span class="xref"&gt;5&lt;/span&gt; is intended for use with annealed copper alloy tubing per SAE J844, Type 1. The flanged sleeve compression type &lt;span class="xref"&gt;Figs. 6A&lt;/span&gt;-&lt;span class="xref"&gt;11&lt;/span&gt; and &lt;span class="xref"&gt;Tables 6&lt;/span&gt;-&lt;span class="xref"&gt;8&lt;/span&gt; is intended for use with nylon tubing per SAE J844, Type 3. It is not intended to restrict or preclude other designs of a tube fitting for use with SAE J844, Type 3 air brake tubing.&lt;/div&gt;
    &lt;/div&gt;</p>
