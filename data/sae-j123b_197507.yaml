  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice defines, illustrates, and specifies allowable limits for various types of surface discontinuities that may occur or become apparent during the manufacture and processing of bolts, screws, and studs which are primarily intended for use in automotive assemblies subjected to severe dynamic stresses and necessitating use of high strength fasteners having appropriate fatigue resistant properties.&lt;/div&gt;
    &lt;/div&gt;</p>
