    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides a description of a process for development of fly-by-wire actuation systems. Included are (1) the development of requirements for the servo-actuator hardware and the electronics hardware and software, (2) actuator and servo-electronics interface definitions and, (3) the required communications and interactions between the servo-actuator and the servo-electronics designers.&lt;/div&gt;
