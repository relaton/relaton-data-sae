    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides the general performance, design, installation, test, development, and quality assurance requirements for the flight control related functions of the Vehicle Management Systems (VMS) of military piloted aircraft. It also provides specification guidance for the flight control interfaces with other systems and subsystems of the aircraft.&lt;/div&gt;&lt;/div&gt;</p>
