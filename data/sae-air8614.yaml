abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The proposed Digital Mesh/Fabric concept builds upon the Digital Thread Framework (refer to AIR7161) by representing the interconnection of multiple digital threads across multiple data stores, logical organizing segments, and product life-cycle stages. Unlike a single digital thread, which follows a linear or sequential flow of data utilization through a product life cycle, the Digital Mesh/Fabric forms a complex mesh of n-dimensional interconnected digital threads, allowing for greater value creation, flexibility in data utilization, scalability, and integration.&lt;/div&gt;

    &lt;/div&gt;</p>
