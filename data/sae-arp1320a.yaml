  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP covers a procedure to be used in the determination of 0.05 to 0.3 ppm of chlorine in oxygen from any type of generator used for emergency or other life-support systems. The methyl orange method described can be considered as a referee technique. Instrumental analysis is also given in &lt;span class="xref"&gt;Section 8&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
