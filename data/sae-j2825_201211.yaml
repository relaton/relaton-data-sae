  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes test procedures, test conditions, environment, and instrumentation for determining the exhaust sound pressure levels of stationary motorcycles. These are based on a comprehensive study of a wide variety of on-highway motorcycles, and therefore are intended to be applied to on-highway motorcycles. For off-highway motorcycles, SAE J1287 continues to be the recommended practice.&lt;/div&gt;
    &lt;/div&gt;</p>
