  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The goal of the Bicyclist Test Mannequin Task Force is to develop standard specifications/requirements for bicyclist test mannequins (one adult and one child) that are representative of real bicyclists to the sensors used in Bicyclist Detection systems and can be used for performance assessment of such in-vehicle systems (including warning and/or braking) in real world test scenarios/conditions. This version of the document only includes the recommended bicyclist mannequin characteristics for vision, Lidar, and/or 76 to 78 GHz radar-based Bicyclist Pre-Collision systems.&lt;/div&gt;&lt;/div&gt;</p>
