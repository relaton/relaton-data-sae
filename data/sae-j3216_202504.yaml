  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes machine-to-machine (M2M)&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; communication to enable cooperation between two or more traffic participants or CDA devices hosted or controlled by said traffic participants. The cooperation supports or enables performance of the dynamic driving task (DDT) for a subject vehicle equipped with an engaged driving automation system feature and a CDA device. Other participants may include other vehicles with driving automation feature(s) engaged, shared road users (e.g., drivers of conventional vehicles or pedestrians or cyclists carrying compatible personal devices), or compatible road operator devices (e.g., those used by personnel who maintain or operate traffic signals or work zones).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Cooperative driving automation (CDA) aims to improve the safety and flow of traffic and/or facilitate road operations by supporting the safer and more efficient movement of multiple vehicles in proximity to one another. This is accomplished, for example, by sharing information that can be used to influence (directly or indirectly) DDT performance by one or more nearby road users. Vehicles and infrastructure elements engaged in cooperative automation may share information, such as state (e.g., vehicle position, signal phase), intent (e.g., planned vehicle trajectory, signal timing), or seek agreement on a plan (e.g., coordinated merge). Cooperation among multiple participants and perspectives in traffic can improve safety, mobility, situational awareness, and operations. However, nothing in this document is intended to suggest that driving automation requires such cooperation in order to be performed safely.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Cooperative strategies may be enabled by the sharing of information in a way that meets the needs of a given CDA Feature. The needs may be expressed in terms of performance characteristics, such as latency, information flow, range, privacy and security, and information content and quality. There are several potential technologies for communicating information between a subject vehicle(s) and other traffic participants.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;When referring to a CDA Feature, the word “feature” here varies from its common English definition. To emphasize this variance and to avoid confusion, “Feature” is capitalized when modified by the adjective “CDA” or “C-ADS.”&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document focuses on CDA Feature-oriented functionality and does not imply use of any specific communications protocols. This document addresses the performance of functions and actions in conducting the DDT (refer to the current version of ISO/SAE PAS 22736/SAE J3016) by the ADS. This information report is intended to facilitate communication and awareness for the design and anticipated development and validation of CDA Features.&lt;/div&gt;&lt;/div&gt;</p>
