  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the determination of passenger car and light truck tire force and moment properties on a belt-type flat surface test machine. It is suitable for accurately determining five tire forces and moments in steady-state under free-rolling conditions as a function of slip angle and normal force which are incrementally changed in a given sequence.&lt;/div&gt;&lt;/div&gt;</p>
