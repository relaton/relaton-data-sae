    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is an application guide for fixed and variable displacement hydraulic motors. It provides details of the characteristics of fixed and variable displacement hydraulic motors, architectures, circuit designs, controls, and typical applications. The applications include airborne and defense vehicles with emphasis on high performance applications.&lt;/div&gt;
