  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers the requirements for lower deck containers in wide body and standard body aircraft which do not require airworthiness certification under the condition of compartment restraint and/or, where applicable according to aircraft type, NAS3610 equivalent baseplate-restraint for these containers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: IATA 50/0, “Requirements for interlining of ULDs”, should also be taken into account when designing and making equipment.&lt;/div&gt;
    &lt;/div&gt;</p>
