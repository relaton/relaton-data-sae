abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the location of drivers’ eyes inside a vehicle. Elliptical (eyellipse) models in three dimensions are used to represent tangent cutoff percentiles of driver eye locations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Procedures are provided to construct 95 and 99% tangent cutoff eyellipses for a 50/50 gender mix, United States user population.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Neck pivot (P) points are defined in &lt;span class="xref"&gt;Section 6&lt;/span&gt; to establish specific left and right eye points for direct and indirect viewing tasks described in SAE J1050. These P Points are defined only for the adjustable seat eyellipses defined in &lt;span class="xref"&gt;Section 4&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to Class A Vehicles (Passenger Cars, Multipurpose Passenger Vehicles, and Light Trucks) as defined in SAE J1100. It also applies to Class B vehicles (Heavy Trucks), although these eyellipses have not been updated from previous versions of SAE J941.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The appendices are provided for information only and are not a requirement of this document.&lt;/div&gt;&lt;/div&gt;</p>
