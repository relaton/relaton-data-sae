  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers complete general and dimensional specifications for refrigeration tube fittings of the flare type specified in &lt;span class="xref"&gt;Figures 1&lt;/span&gt; to &lt;span class="xref"&gt;42&lt;/span&gt; and &lt;span class="xref"&gt;Tables 1&lt;/span&gt; to &lt;span class="xref"&gt;15&lt;/span&gt;. These fittings are intended for general use with flared annealed copper tubing in refrigeration applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensions of single and double 45 degree flares on tubing to be used in conjunction with these fittings are given in Figure 2 and Table 1 of SAE J533.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data contained in &lt;span class="xref"&gt;Tables 1&lt;/span&gt; to &lt;span class="xref"&gt;15&lt;/span&gt; with respect to all unspecified details.&lt;/div&gt;&lt;/div&gt;</p>
