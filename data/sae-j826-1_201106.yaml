    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the CAD model data available from SAE for the HPM-1 three-dimensional H-point machine. The elements of the CAD model include the outer surfaces of the cushion and back pans, datum points and lines, and calibration references. The intended purpose for this information is to provide a CAD reference for design and benchmarking as well as a calibration reference for the physical HPM-1 audits. The content and format of the data files that are available are also described.&lt;/div&gt;&lt;/div&gt;</p>
