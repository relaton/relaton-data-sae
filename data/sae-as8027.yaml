    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) is intended to apply to those oxygen regulators which supply gaseous oxygen at breathing pressures to meet physiological requirements of aircraft flight crew members. It defines the minimum performance requirements and testing for aircraft demand type breathing oxygen regulators.&lt;/div&gt;&lt;/div&gt;</p>
