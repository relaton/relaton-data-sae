abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a systematic and rigorous process to: (1) identify and evaluate standard names and definitions for driving automation system features, and (2) identify a “user vocabulary” of terms and descriptions that [human] drivers use to describe driving automation system features.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The process described in this document includes selection criteria and trade-offs that can be used to select an approach to testing that matches the constraints and objective of a particular evaluation. The data from this process are analyzed to determine users’ name preferences for driving automation system features and what they would expect a specific feature to do, based on the name given to the features. The data generated by this naming methodology can provide guidance regarding the names that may support accurate understanding of the feature’s capabilities and limitations. Although the process described in this document emphasizes the use of large-scale electronic surveys for data collection, an in-person approach to administer the test (either paper-and-pencil or electronic) could be used instead.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The development of this SAE Recommended Practice for developing standard names for driving automation system features was greatly aided by a large-scale pilot test that was used to assess and refine the individual test procedures described below. A summary of this pilot test is provided in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
