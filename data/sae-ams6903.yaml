  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a titanium alloy in the form of bars, forgings, and flash-welded rings up through 12.000 inches (304.80 mm), inclusive, in diameter or least distance between parallel sides, and stock of any size for forging or flash-welded rings. Bars, forgings, and flash-welded rings with a nominal thickness of 3.000 inches (79.20 mm) or greater shall have a maximum cross-sectional area of 113 square inches (729 cm&lt;sup&gt;2&lt;/sup&gt;) (see &lt;span class="xref"&gt;8.5&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
