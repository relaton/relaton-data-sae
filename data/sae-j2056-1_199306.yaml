  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice will focus on the requirements of Class C applications. The requirements for these applications are different from those required for either Class A or Class B applications. An overall example system is provided for consistency of discussion.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Figure 1&lt;/span&gt; is a block diagram of a typical network node. The hardware and software for both the communication interface and the application itself are shown. For the purposes of this discussion the communication hardware and software will be considered as the communication interface. This paper will discuss the requirements for the communication interface (both hardware and software) without necessarily determining whether it will be accomplished by hardware or software. This choice is left as a subsequent trade-off. Thus requirements are presented from the perspective of the application.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The examples provided are for discussion purposes only and are in no way intended to be an endorsement or recommendation of how a specific application should be designed.&lt;/div&gt;
    &lt;/div&gt;</p>
