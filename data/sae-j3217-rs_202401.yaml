  content: |-
    <p>&lt;p&gt;This Abstract Syntax Notation (ASN.1) file precisely specifies the structure of the data used to support implementation of SAE International Standard J3217/R. Using the ASN.1 specification, a compiler tool can be used to produce encodings as required by the encoding rules identified in the standard (SAE J3217/R messages are encoded with UPER encoding). Both this file and the SAE J2735 ASN.1 files are necessary to collectively implement the data exchanges described in SAE J3217/R. The combined library can be used by any application (along with the additional logic of that application) to exchange the data using interfaces conformant to J3217/R.&lt;/p&gt;


    &lt;p&gt;SAE J3217/R specifies interface requirements and message exchanges for configuration and reporting in road use charging systems.&lt;/p&gt;</p>
