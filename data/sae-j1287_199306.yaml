    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the test procedure, environment, and instrumentation for determining the sound levels of motorcycles under stationary conditions. This test will measure primarily exhaust noise and does not represent the optimum procedure for evaluating total vehicle noise. For this purpose, SAE J331 or SAE J47 is recommended.&lt;/div&gt;&lt;/div&gt;</p>
