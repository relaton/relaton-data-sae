  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This technical report applies to motor vehicle signalling and marking lighting devices which use light emitting diodes (L.E.D.) as light sources. This report provides test methods, requirements, and guidelines applicable to the special characteristics of L.E.D. lighting devices. These are in addition to those required for devices designed with incandescent light sources. This report is intended as a guide to standard practice and is subject to change to reflect additional experience and technical advances.&lt;/div&gt;&lt;/div&gt;</p>
