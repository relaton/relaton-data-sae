abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This aerospace information report (AIR) provides historical design information for various aircraft landing gear and actuation/control systems that may be useful in the design of future systems for similar applications. It presents the basic characteristics, hardware descriptions, functional schematics, and discussions of the actuation mechanisms, controls, and alternate release systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The report is divided into two basic sections:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Landing gear actuation system history from 1876 to the present. This section provides an overview and the defining examples that demonstrate the evolution of landing gear actuation systems to the present day.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;This section of the report provides an in depth review of various aircraft. A summary table of aircraft detail contained within this section is provided in paragraph &lt;span class="xref"&gt;4.1&lt;/span&gt;.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The intent is to add new and old aircraft retraction/extension systems to this AIR as the data becomes available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTES
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;For some aircraft, the description is incomplete, due to difficulties in obtaining the data.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
