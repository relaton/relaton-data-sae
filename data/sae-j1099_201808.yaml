  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Information that provides design guidance in avoiding fatigue failures is outlined in this SAE Information Report. Of necessity, this report is brief, but it does provide a basis for approaching complex fatigue problems. Information presented here can be used in preliminary design estimates of fatigue life, the selection of materials and the analysis of service load and/or strain data. The data presented are for the “low cycle” or strain-controlled methods for predicting fatigue behavior. Note that these methods may not be appropriate for materials with internal defects, such as cast irons, which exhibit different tension and compression stress-strain behavior.&lt;/div&gt;&lt;/div&gt;</p>
