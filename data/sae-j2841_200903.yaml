  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report establishes a “Utility Factor” (UF) curve and the method of generating this curve. The UF is used when combining test results from battery charge-depleting and charge-sustaining modes of a Plug-in Hybrid Electric Vehicle (PHEV). This document will define the UF curve(s) by using 2001 United States Department of Transportation (DOT) “National Household Travel Survey” data. The input is daily vehicle miles traveled, and the UF curve output is a percentage fraction that is applied to the charge-depleting mode results.&lt;/div&gt;
    &lt;/div&gt;</p>
