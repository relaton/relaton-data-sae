abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to regulatory/approving authorities involved with decisions regarding the use of high-intensity light (HIL) directed into the navigable airspace. For the purpose of this document, lights greater than 0.25 million candlepower meet the minimum threshold of an HIL. Lights not directed or reflected into the navigable airspace are not usually considered to interfere with aircraft operations. HILs include laser-derived light sources; other laser systems are beyond the scope of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document addresses adverse effects of HILs on humans, such as visual interference. HIL effects on Unmanned Aircraft Systems (UASs) are beyond the scope of this document.&lt;/div&gt;
    &lt;/div&gt;</p>
