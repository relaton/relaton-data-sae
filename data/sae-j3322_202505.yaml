    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifically pertains to cybersecurity for vehicles. It has been developed by SAE International (SAE) Committee Technical Committee on Vehicle Electrical and Electronic Systems, “Cybersecurity Testing Task Force,” a subcommittee of SAE Committee, “Vehicle Cybersecurity Systems Engineering Committee.” This committee is authorized under the scope and authority of the SAE Electronic Design Automation Steering Committee, which is organized under the scope and authority of the SAE Electrical Systems Committee (also known as the Electrical Systems Group), which is directly under the scope and authority of the SAE Motor Vehicle Council.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE Motor Vehicle Council’s stated scope of influence and authority, as defined by SAE, includes, “passenger car and light truck.” By definition, this excludes motorcycles, certain trailers, heavy trucks, buses, snowmobiles, watercraft, marine vessels, off-road, multi-purpose vehicles, certain other specialty vehicles, and aircraft.&lt;/div&gt;
