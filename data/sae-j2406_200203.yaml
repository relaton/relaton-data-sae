    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides guidance for the construction, operation, and maintenance of CNG powered medium and heavy-duty trucks. The intent of this document is to cover TRUCKS (6350 kg (14 001 gvw pounds) and above) and specifically excludes passenger vehicles such as: buses, recreational vehicles, motor homes and/or passenger vehicles which may incorporate a truck chassis in their construction.&lt;/div&gt;
    &lt;/div&gt;</p>
