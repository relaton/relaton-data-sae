  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice summarizes the conformance requirements for digital communication between the PEV and EVSE and establishes the interoperability requirements for successful charging sessions. This first version includes charging conformance summary for both the vehicle and EVSE and updates from CharIN with modifications, additions, and deletions to improve successful charging sessions. The summary of all existing charging/discharging standards, conformance, and functional categories will be updated in subsequent updates, and message/signal/values that would cause an interoperability issue will be clarified as this leads to diagnostic codes the vehicle/EVSE/Charge Point Operator and others can view to let the customer know what specific issue led to a failure to charge or discharge. This additional effort is ongoing and will be expanded in the next version update as this becomes more mature.&lt;/div&gt;

    &lt;/div&gt;</p>
