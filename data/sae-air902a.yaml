abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a practical system for a user to determine observer-to-aircraft distances. These observer-to-aircraft distances can be either closest point of approach (CPA) distances during field measurements or overhead distances during acoustic certification tests. The system uses a digital camera to record an image of the subject aircraft. A method of using commercial software to obtain the distance from such an image is presented. Potential issues which may affect accuracy are discussed.&lt;/div&gt;&lt;/div&gt;</p>
