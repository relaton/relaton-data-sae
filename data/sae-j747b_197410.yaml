abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard applies to hydraulic directional control valves as
    applied to self-propelled work machines referenced in SAE J1116. It describes
    a laboratory test procedure for evaluating:\n\n a.) Flow versus  pressure drop,\n
    b.) Leakage rate,\n c.) Operating effort, \n d.) Metering characteristics versus
    spool travel, pilot pressure, or electrical current, \n e.) Relief valve characteristics.
    \n\nThis document applies to single and multiple section hydraulic directional
    control valves. This document illustrates axial, manually operated valves although
    the test procedure is applicable to other input forms such as rotary actuation,
    electric current, hydraulic or pneumatic pressure.</p>"
