  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines requirements relating to the elements of design, operation, and maintenance of light utility vehicles (LUVs). The safety specifications in this document apply to any self-propelled, operator-controlled, off-highway vehicle 1829 mm (72 inches) or less in overall width, exclusive of added accessories and attachments, operable on three or more wheels or tracks, primarily intended to transport material loads or people, with a gross vehicle weight of 2500 kg (5500 pounds) or less, and a maximum design speed less than or equal to 40.23 km/h (25 mph).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is not intended to cover go-karts (ASTM F2007-07a), fun-karts (ASTM F2011-02e1), dune buggies, and all terrain-vehicles (ATVs) complying with ANSI/SVIA 1.&lt;/div&gt;

    &lt;/div&gt;</p>
