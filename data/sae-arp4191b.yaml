  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides a method for digital computer programs for gas turbine engine performance, steady-state or transient, performance to be written using the FORTRAN 77 Language.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;When it is agreed between the program User and Supplier that a particular program shall be supplied in FORTRAN 77, it is recommended that this ARP be used in conjunction with AS681 for steady-state and transient programs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP also describes how to take advantage of the FORTRAN 77 CHARACTER storage to extend the information interface between the calling program and the engine subroutine.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The ARP has the same major section numbers as AS681 to facilitate its use with this document. The information given in each section of this ARP is additional to that given in AS681.&lt;/div&gt;&lt;/div&gt;</p>
