  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides processes for achieving the required cleanliness standards during the fabrication, assembly, and functional test of aircraft hydraulic systems. It covers exclusion and removal of solid and liquid contaminants from tubing during manufacture and final assembly, flushing of the installed system, and final checks to ensure cleanliness requirements are met.&lt;/div&gt;&lt;/div&gt;</p>
