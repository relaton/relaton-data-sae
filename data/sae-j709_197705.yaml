  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes loadings, tangential pull values, and inflation pressure relationships for tire sizes and ply ratings currently used on agricultural tractors. Primary purpose of this recommendation is for use with SAE J708 MAY59.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The performance of the tractor is materially affected by tire loadings, tire tangential pull values, and inflation pressure; therefore, it becomes desirable to publish this information.&lt;/div&gt;&lt;/div&gt;</p>
