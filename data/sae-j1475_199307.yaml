  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers general and performance specifications for hydraulic hose fittings of the styles, types, and classes defined in &lt;span class="xref"&gt;2.2&lt;/span&gt; and used in conjunction with nonmetallic flexible hose used in marine applications. In addition to the requirements of this document, the hose fittings shall meet the general and dimensional requirements of SAE J516. Other styles, types, and classes of fittings may be used provided they meet the general requirements of &lt;span class="xref"&gt;Sections 3&lt;/span&gt; through &lt;span class="xref"&gt;9&lt;/span&gt;. Four-bolt split flange type clamp halves are not within the scope of this document and are covered under SAE J518. This document does not insure compatibility between manufacturers of hydraulic hose and hydraulic hose fittings. Compatibility is the responsibility of the hydraulic hose assembly manufacturer.&lt;/div&gt;&lt;/div&gt;</p>
