  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Purchase Specification (PS), AMS3970/5, specifies the batch release and delivery requirements for the companion non-structural glass fiber fabric prepreg.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification also defines the procedure and requirements for storage life extension of materials purchased against this specification. It is only applicable for materials which are qualified and shall be carried out within the responsibility of the purchaser and under control of its Quality organization.&lt;/div&gt;
    &lt;/div&gt;</p>
