  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR is applicable to components fabricated using additive manufacturing (AM) processes. The discussion is generic with respect to specific additive processes as much as possible. Each additive process has unique considerations that should be addressed in any effort to substantiate additively manufactured components, This specification is written for metallics but conceptually could be applied to non-metallics.&lt;/div&gt;&lt;/div&gt;</p>
