abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification covers the requirements for solid-state frequency converters with 480 (or 380) V 3-phase, 60 (or 50) Hz input and 115/200V, 3-phase, 400 Hz output capable of powering aircraft type loads requiring MIL-STD-704D quality power.

    The frequency converter shall be a  self-contained unit suitable for the environment of intended use. Typical applications include dedicated use at passenger loading bridges (mounted under the bridge in telescoping bridge applications or fixed installation at base of stationary type loading bridges) with weatherproof enclosures or hangar/lab use where indoor fixed or portable units can be used.</p>
