  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report provides a list of those SAE steels which, because of decreased usage, have been deleted from the standard SAE Handbook listings. Included are alloy steels from SAE J778 deleted since 1936, carbon steels from SAE J118 deleted since 1952, and all EX-steels deleted from SAE J1081. Information concerning SAE steels prior to these dates may be obtained from the SAE office on request. With the issuance of this report, SAE J778, Formerly Standard SAE Alloy Steels, and SAE J118, Formerly Standard SAE Carbon Steels, will be retired since they are now combined in SAE J1249. In the future, new assignments to SAE J1081, Chemical Compositions of SAE Experimental Steels, will be given “PS” (Potential Standard) numbers rather than “EX” numbers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The steels listed in &lt;span class="xref"&gt;Tables 1&lt;/span&gt; and &lt;span class="xref"&gt;2&lt;/span&gt; are no longer considered as standard steels. Producers should be contacted concerning availability. Steel grades can be reinstated based on usage according to the critieria indicated in SAE J403 and J404.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The last column lists the date a steel was last listed as standard in the SAE Handbook. Where applicable, the corresponding AISI and UNS numbers are given.&lt;/div&gt;&lt;/div&gt;</p>
