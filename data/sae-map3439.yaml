    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice provides the design criteria for static elastomeric O-ring seal applications, axial compression (face type) groove dimensions for aerospace metric O-ring sizes specified in MA2010. The conditions considered to formulate the design criteria are also described, e.g., seal squeeze and groove volume to accommodate O-ring swell.&lt;/div&gt;&lt;/div&gt;</p>
