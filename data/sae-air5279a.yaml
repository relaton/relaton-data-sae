  content: |-
    <p>&lt;p&gt;This document provides recommendations concerning the minimum knowledge and skill guidelines for a composite and metal bond repair inspector.&lt;/p&gt;


    &lt;p&gt;Teaching levels have been assigned to this curriculum to define the knowledge, skills and abilities needed to inspect repairs. Minimum hours of instruction have been provided to ensure adequate lecture and laboratory coverage of all subject matter. These minimums may be exceeded, and may include an increase in the total number of training hours and/or increases in the teaching levels.&lt;/p&gt;</p>
