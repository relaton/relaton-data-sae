    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides the minimum requirements for automotive or RV, seven position, self-draining trailer tow connector interface. The procedures included within this specification are intended to cover the test methods, design, and performance requirements of the electrical interface of the seven-position trailer tow connector in low voltage (0 to 20) road vehicle applications.&lt;/div&gt;
    &lt;/div&gt;</p>
