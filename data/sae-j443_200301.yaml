  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform procedures for using the standard shot peening test strips reported in SAE J442. Standard test strips are used to establish saturation, determine intensity, monitor repeatability of the shot peening machine operations, and can be used to predict a desired result on a part. It is recommended that the standard test strip A be used for intensities that produce arc heights of 0.10mm A (0.004 inch A) to 0.60 mm A (0.024 inch A). For intensities below 0.10 mm A (0.004 inch A), the standard N strip is recommended, and for intensities above 0.60 mm A (0.024 inch A), the standard C strip is recommended.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The process of shot peening, in common with many other processes, cannot at present be adequately controlled by nondestructive inspection of the peened parts, therefore, it is necessary to control the process itself to achieve consistent, reliable results.&lt;/div&gt;&lt;/div&gt;</p>
