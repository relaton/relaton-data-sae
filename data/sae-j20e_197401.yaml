  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This type of hose is primarily for severe, critical, and heavy-duty service of which the diesel-locomotive application is a typical example. The hose is intended to withstand the effects of pressure systems, various present types of coolants, cold temperatures down to −40°F (−40°C), and unskilled application to connections not particularly designed for ease of assembly with the hose.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;When desired, hose with one class of material in the tube and another in the cover may be obtained. In such cases, the physical properties specified for respective parts shall apply. Adhesion requirements shall be based on the class of material for which the lower value is specified.&lt;/div&gt;&lt;/div&gt;</p>
