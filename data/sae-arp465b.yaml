    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidance for the design of flanges on temperature sensors intended for use in gas turbine engines. Three figures detail the configuration of standard size flange mounts with bolt holes, slotted flanges, and miniaturized flanges for small probes.&lt;/div&gt;&lt;/div&gt;</p>
