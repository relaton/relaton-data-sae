    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform laboratory procedures for fatigue testing certain production disc wheels, wheels for demountable rims, and demountable rims intended for normal highway use on trucks, buses, truck-trailers, and multipurpose passenger vehicles. Standardized fatigue tests are yet to be developed for wheels and rims not covered in this recommended practice.&lt;/div&gt;&lt;/div&gt;</p>
