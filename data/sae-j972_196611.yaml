  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Collision tests are conducted on automotive vehicles to obtain information of value in evaluating structural integrity and in reducing occupant injuries. Deceleration conditions during a moving barrier impact are more severe at a given speed than those produced by using a crushable vehicle but are more readily reproducible than those occurring during impacts of two vehicles. The purpose of this SAE Recommended Practice is to establish sufficient standardization of moving barriers and moving barrier collision methods so that results of tests conducted at different facilities may be compared.&lt;/div&gt;&lt;/div&gt;</p>
