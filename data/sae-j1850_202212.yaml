  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the requirements for a Class B Data Communication Network Interface applicable to all On-and OffRoad Land-Based Vehicles. It defines a minimum set of data communication requirements such that the resulting network is cost effective for simple applications and flexible enough to use in complex applications. Taken in total, the requirements contained in this document specify a data communications network that satisfies the needs of automotive manufacturers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification describes two specific implementations of the network, based on media/Physical Layer differences. One Physical Layer is optimized for a data rate of 10.4 Kbps while the other Physical Layer is optimized for a data rate of 41.6 Kbps (see &lt;span class="xref"&gt;Appendix A&lt;/span&gt; for a checklist of application-specific features). The Physical Layer parameters are specified as they would be detected on the network media, not within any particular module or integrated circuit implementation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Although devices may be constructed that can be configured to operate in either of the two primary implementations defined herein, it is expected that most manufacturers will focus specifically on either the 10.4 Kbps implementation or the 41.6 Kbps implementation depending on their specific application and corporate philosophy toward network usage. However, low-volume users of network-interface devices are expected to find it more effective to use a generic interface capable of handling either of the primary implementations specified in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE document is under the control and maintenance of the Vehicle Networks for Multiplexing and Data Communications (Multiplex) Committee. This committee will periodically review and update this document as needs dictate.&lt;/div&gt;
    &lt;/div&gt;</p>
