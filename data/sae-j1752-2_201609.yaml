  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines a method for evaluating the near field electric or magnetic component of the electromagnetic field at the surface of an integrated circuit (IC). This technique is capable of providing a detailed pattern of the RF sources internal to the IC. The resolution of the pattern is determined by the characteristics of the probes used and the precision of the mechanical probe positioner. The method is usable over the 10 MHz to 3 GHz frequency range with existing probe technology. The probe is mechanically scanned according to a programmed pattern in a plane parallel or perpendicular to the IC surface and the data is computer processed to provide a color-enhanced representation of field strength at the scan frequency. This procedure is applicable to measurements from an IC mounted on any circuit board that is accessible to the scan probe. For comparisons, the standardized test board shall be used. This diagnostic procedure is intended for IC architectural analysis including functional floor plan and power distribution.&lt;/div&gt;
    &lt;/div&gt;</p>
