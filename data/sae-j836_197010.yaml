  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report is an abbreviated summary of metallurgical joining by welding, brazing, and soldering. It is generally intended to reflect current usage in the automotive industry; however, it does include some of the more recently developed processes. More comprehensive coverage of materials, processing details, and equipment required may be found in the Welding Handbook, Soldering Manual, and other publications of the American Welding Society and the American Society for Testing and Materials. AWS Automotive Welding Committee publications on Recommended Practices are particularly recommended for the design or product engineer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This report is not intended to cover mechanical joining such as rivets or screw fasteners, or chemical joining processes such as adhesive joining.&lt;/div&gt;


    &lt;/div&gt;</p>
