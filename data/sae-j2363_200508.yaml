    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes lubricating oils meeting the physical, chemical and performance requirements of American Petroleum Institute (API) performance categories CF and CF-2, CI-4, supplement CI-4 PLUS, and SAE J300. These oils are suitable for the lubrication of wheeled vehicles with compression-ignition (diesel) engines. This document supersedes the military’s Commercial Item Description (CID) A-A-52306.&lt;/div&gt;&lt;/div&gt;</p>
