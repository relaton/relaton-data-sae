abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The objective of this ARP is to provide a set of user-centered design guidelines for the implementation of data driven electronic aeronautical charts, which dynamically create charts from a database of individual elements. The data driven chart is intended to provide information required to navigate, but it is not intended to supplant the aircraft’s primary navigation display. These guidelines seek to provide a balance between standardization of equipment with similar intended functions and individual manufacturer innovation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP provides guidelines for the display of an electronic chart that can replace existing paper. This document addresses what information is required, when it is required, and how it should be displayed and controlled. This document does not include all the detailed specifications required to generate an electronic aeronautical chart. This document primarily addresses the human factors aspects of electronic chart display, and does not address the software, hardware or system integrity/availability issues associated with certification of an electronic chart system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;During the transition to data driven charts, the guidelines of this document should be applied to interim electronic chart products that may be pre-composed, such as vector or raster based electronic charts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is designed primarily for IFR Aeronautical Charts. There is a limited discussion of its applicability to VFR charts.&lt;/div&gt;


    &lt;/div&gt;</p>
