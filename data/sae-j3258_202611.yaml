  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard specifies the requirements and design to meet the Radio Technical Commission for Maritime Services (RTCM) corrections user needs provided in CTI 4501. It can also be used to support implementation of Global Navigation Satellite System (GNSS) corrections at locations other than intersections. The approach defined herein enables interoperability and consistent implementations in support of lane-level vehicle positioning for V2X infrastructure applications using SAE J2735 and RTCM standards.&lt;/div&gt;
    &lt;/div&gt;</p>
