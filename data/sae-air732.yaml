  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The discipline of heat transfer concerns itself basically with the three modes of transferring thermal energy (convection, conduction, and radiation) and their inter-relations. In any phase of aerospace vehicle design, the importance of any of these basic modes will vary depending upon the natural and induced environment the mission imposes as well as the vehicle configuration.&lt;/div&gt;&lt;/div&gt;</p>
