  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The accompanying mounting and gear locations are applicable for all general installations of power take-off on the transmission gear box of motor trucks and tractors where the size of the transmission permits.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The heavy-duty type opening can be adapted to the regular-duty type by the use of an adapter with 6.35 mm (0.25 in) flange thickness with appropriate bolt pattern and thread engagement. (See &lt;span class="xref"&gt;Figures 1&lt;/span&gt; and &lt;span class="xref"&gt;2&lt;/span&gt;.)&lt;/div&gt;&lt;/div&gt;</p>
