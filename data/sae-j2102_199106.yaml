  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes a method for determining the exterior noise emitted by earthmoving machinery in terms of the A-weighted sound power level while the machine is in a stationary test condition. At six positions on a hemispherical surface, the equivalent continuous A-weighted sound pressure levels are measured. The A-weighted sound power level of the machinery is calculated from the measured values.&lt;/div&gt;&lt;/div&gt;</p>
