  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) discusses physical and functional integration of main engine and auxiliary power unit (APU) monitoring with other on-board systems. It includes General Considerations, Parameter Selection and Requirements, Signal Sources, Signal Conditioning, Data Processing, Data Storage, and Data Retrieval.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Engine monitoring hardware and software are discussed so that they may be properly considered in an integrated design.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Civil and military aviation applications are included and delineated where requirements differ.&lt;/div&gt;&lt;/div&gt;</p>
