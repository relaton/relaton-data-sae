    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the general requirements for pneumatic deicing systems for wings, empennages, radomes, radio masts, air induction system entrance cones, and ducts of aircraft. Deicing boots shall be of one type, operating at 15 to 22 psig pressure.&lt;/div&gt;&lt;/div&gt;</p>
