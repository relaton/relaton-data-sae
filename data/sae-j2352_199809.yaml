  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report is a summary of information obtained by way of survey conducted during the 2Q and 3Q of 1997 of MAYDAY system manufacturers. The data represented here has been condensed from the original survey that was conducted by telephone interviews and faxes. The information contained within is limited to technical data as it pertains to vehicle and on-board MAYDAY system operations. It does not contain business, marketing, or any proprietary technical information. The complete survey results are in the possession of the SAE.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this survey was to determine whether the general concept and architecture on which the SAE J2313 MAYDAY Message Set was being developed is consistent with those of current MAYDAY system hardware manufacturers. The survey was not intended for MAYDAY service providers or public service answer points and emergency service providers. Further studies, perhaps by organization such as NENA or APCO, may be necessary to develop a complete vision of how complete MAYDAY response centers and systems may be implemented.&lt;/div&gt;&lt;/div&gt;</p>
