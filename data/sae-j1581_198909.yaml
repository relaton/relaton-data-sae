  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to specify dimensions for loader straight cutting edge cross sections without holes and with bolt holes for mounting bolt-on teeth and tooth adaptors on loader buckets described by SAE J731. This recommended practice is intended to supplement SAE J1303 and SAE J1304 with cross sections for heavier duty applications, by identifying larger blunts, greater bevel angles, larger bolt holes, and greater bolt spacing.&lt;/div&gt;

    &lt;/div&gt;</p>
