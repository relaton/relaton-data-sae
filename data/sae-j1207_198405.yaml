  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice sets forth the instrumentation, environment, and test procedures to be used in measuring the silencer system effectiveness in reducing intake or exhaust sound level of internal combustion engines. The system shall include the intake or exhaust silencer, related piping, and components. This procedure is intended for engine-dynamometer testing and is not necessarily applicable to vehicle testing (see &lt;span class="xref"&gt;Appendix A&lt;/span&gt;). The effect of the exhaust or intake system on the sound level of the overall machine must be determined using other procedures. This procedure may be successively applied to various silencer configurations to determine relative effectiveness for that engine. Insertion loss for individual silencers may be calculated through measurement of the silenced and unsilenced system.&lt;/div&gt;&lt;/div&gt;</p>
