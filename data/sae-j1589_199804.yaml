    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Differences, where they exist, are shown in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines the measuring principles to be used for measuring piston rings. It applies to piston rings up to and including 200 mm diameter for reciprocating combustion engines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These inspection measuring principles may also be used for piston rings for compressors working under analogous conditions.&lt;/div&gt;&lt;/div&gt;</p>
