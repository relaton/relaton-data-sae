    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this Aerospace Information Report is to provide the industry with methodologies for measuring tire/wheel gear alignment and the range of acceptable alignment settings for various types of non-military landing gear. This AIR will focus on the general aviation, corporate, and regional aircraft landing gear but could have applicability to commercial aircraft.&lt;/div&gt;&lt;/div&gt;</p>
