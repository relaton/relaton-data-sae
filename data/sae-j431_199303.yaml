  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the hardness, tensile strength, and microstructural requirements for gray iron sand mold castings used in automotive and allied industries. The chemical requirements for alloy gray iron automotive camshafts are included in the document under castings for special application with controlled composition and microstructure. &lt;span class="xref"&gt;Appendix A&lt;/span&gt; provides general information on application of gray iron in automotive castings and chemical composition to meet hardness, microstructural, and other properties needed for particular service conditions. Casting tensile strength estimates are provided in &lt;span class="xref"&gt;Appendix A&lt;/span&gt; for design reference.&lt;/div&gt;
    &lt;/div&gt;</p>
