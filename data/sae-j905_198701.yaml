  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The resistance to flow test determines the pressure loss which will result when standard test fluid is passed through the filter under standard conditions of flow and fluid viscosity. This procedure may be used to establish flow capacities, and is the method for measuring resistance to flow of sample filters against an established performance standard.&lt;/div&gt;&lt;/div&gt;</p>
