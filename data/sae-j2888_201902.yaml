  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers fittings, couplers, and hoses intended for connecting service hoses from mobile air-conditioning Systems to service equipment such as charging, recovery and recycling equipment. (&lt;span class="xref"&gt;Figure 1&lt;/span&gt;) This specification covers service hose fittings and couplers for MAC service equipment service hoses, per SAE J2843 and SAE J2851, from mobile air-conditioning systems to service equipment such as manifold gauges, vacuum pumps, and air-conditioning charging, recovery and recycling equipment.&lt;/div&gt;
    &lt;/div&gt;</p>
