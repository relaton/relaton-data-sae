    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report studies the present transmission media axioms and takes a fresh look at the Class C transmission medium requirements and also the possibilities and limitations of using a twisted pair as the transmission medium.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The choice of transmission medium is a large determining factor in choosing a Class C scheme.&lt;/div&gt;



    &lt;/div&gt;</p>
