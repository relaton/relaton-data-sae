    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard is to be used as a supplement to either PRI AC7106 or PRI AC7107 by suppliers that have customer approval for self-release of finished product. This standard applies to suppliers seeking NADCAP General Quality Systems accreditation who are required by contract to conform to the requirements of Self-Release Agreements.&lt;/div&gt;&lt;/div&gt;</p>
