  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to engine coolant concentrate, low silicate ethylene glycol base, for use in cooling systems of heavy-duty engines. An initial charge of supplemental coolant additive (SCA) is required when using this type of coolant concentrate.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to engine coolant concentrates for heavy-duty engine requirements. SAE J1034 applies to coolant concentrates for automobile and light truck applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For further information on engine coolants, see SAE J814.&lt;/div&gt;&lt;/div&gt;</p>
