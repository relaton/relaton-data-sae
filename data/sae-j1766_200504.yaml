  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Electric, Fuel Cell and Hybrid vehicles may contain many types of high voltage systems. Adequate barriers between occupants and the high voltage systems are necessary to provide protection from potentially harmful electric current and materials within the high voltage system that can cause injury to occupants of the vehicle during a crash. This SAE Recommended Practice is applicable to all Electric, Fuel Cell and Hybrid vehicle designs that are comprised of at least one voltage bus with a nominal voltage greater than or equal to 60 Volts DC or 30 VAC. This Recommended Practice addresses electrical isolation integrity, electrolyte spillage, and retention of the battery system.&lt;/div&gt;




    &lt;/div&gt;</p>
