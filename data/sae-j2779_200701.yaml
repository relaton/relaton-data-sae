  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure establishes a recommended practice for performing a Low Speed Thorax Impact Test to the Hybrid III 50th Male Anthropomorphic Test Device (ATD or crash dummy). This test was created to satisfy the demand by the industry to have a calibration test which resulted in similar results to an actual low energy automotive impact test. An inherent problem exists with the current calibration procedure because the normal (6.7 m/s) thorax impact test has test corridors that are not representative to these low energy impact tests. The normal test corridors specify a displacement range of around 68 mm and the low speed displacement corridor needs to be around 25 mm.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The intent of this recommended practice is to develop a low speed thorax calibration procedure for the H-III50M dummy in 25 to 30 mm deflection range.&lt;/div&gt;&lt;/div&gt;</p>
