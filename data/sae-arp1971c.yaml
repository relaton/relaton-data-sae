  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers requirements for a self-propelled, boom type aerial device, equipped with an aircraft deicing/anti-icing fluid spraying system. The unit shall be highly maneuverable for deicing all exterior surfaces of commercial aircraft, of sizes agreed upon between purchaser and manufacturer, in accordance with SAE ARP4737. The vehicle will also be used for aircraft maintenance and inspection. The vehicle shall be suitable for day and night operations.&lt;/div&gt;&lt;/div&gt;</p>
