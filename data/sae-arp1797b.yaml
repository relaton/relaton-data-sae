  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure is intended to apply to fuel pumps.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure will be defined in terms of recommended test fluid, test setup, test conditions, and test method.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure may be used for other fuel system components, by testing in conjunction with the pump, which normally supplies the component inlet flow, or a substitute test pump of similar capacity.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure may be used, with variations in test conditions and test fluid, for performing pump evaluation tests. Tests at progressively increasing pump speeds and pressures will provide design limitation data. Alternate test periods on a test pump and another pump, of a design for which actual service durability is known, will provide useful comparison data.&lt;/div&gt;
    &lt;/div&gt;</p>
