    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers requirements for material used in electrical insulating heat shrinkable components. The continuous operating temperature of these materials shall range from -75°C to +200°C (-103°F to +392°F). (See &lt;span class="xref"&gt;6.1&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
