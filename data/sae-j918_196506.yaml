    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides minimum performance requirements and accompanying uniform laboratory test procedures for evaluating certain essential characteristics of new tires intended for use on passenger cars.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;(The requirements published in this SAE Recommended Practice pertain to tire sizes currently used on American passenger cars. For related information on older tire sizes and for those sizes used on import vehicles, contact Society of Automotive Engineers, Detroit Branch Office, 724 New Center Building, Detroit, Michigan 48202.)&lt;/div&gt;&lt;/div&gt;</p>
