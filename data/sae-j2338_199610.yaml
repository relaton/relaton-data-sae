  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The Society of Automotive Engineers task force on headlamp mounting height has considered the ramifications of reducing the maximum mounting height of headlamps on highway vehicles. The task force has concluded that it is in the best interest of the driving public to make a significant reduction in the recommended maximum height at which headlamps, particularly lower beam headlamps, may be mounted. Heights as low as 36 to 40 in (0.9 to 1.0 m) have been considered. New tractor vehicles are in fact being designed with headlamps mounted in this range. Further recommendations were withheld in anticipation of tests to demonstrate the effect of mounting height on the legibility of certain overhead signs.&lt;/div&gt;

    &lt;/div&gt;</p>
