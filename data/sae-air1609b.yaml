  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) covers the design parameters for various methods of humidification applicable to aircraft, the physiological aspects of low humidities, the possible benefits of controlling cabin humidity, the penalties associated with humidification, and the problems which must be solved for practical aircraft humidification systems. The design information is applicable to commercial and military aircraft. The physiological aspects cover all aircraft environmental control applications.&lt;/div&gt;
    &lt;/div&gt;</p>
