abstract:
- language: en
  script: Latn
  content: "<p>This SAE Aerospace Recommended Practice (ARP) provides guidelines for
    the format and content of documents defining the interface between electronic
    propulsion control systems and aircraft systems.  The scope includes civilian
    aircraft powered by turbofan, turboprop, and turboshaft engines equipped with
    electronic engine controls.</p>"
