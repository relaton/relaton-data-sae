  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines interface configurations for the ground air conditioning service connection on commercial transport aircraft. In addition, it defines the clearances required to accommodate the connection of ground air conditioning hose couplings. Two types of service connections are included. The Type A connection (&lt;span class="xref"&gt;Figure 1&lt;/span&gt;) is a slotted ring with integral locking pads and is comparable to the MS33562 connection. The Type B connection (&lt;span class="xref"&gt;Figure 2&lt;/span&gt;) is a flanged tube with external locking lugs (&lt;span class="xref"&gt;Figure 3&lt;/span&gt;). The Type B connection has the same interface dimensional requirements as the Type A connection.&lt;/div&gt;
    &lt;/div&gt;</p>
