    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is established for the purpose of providing average weight values for water or calcium chloride liquid filling solutions in SAE recommended drive tire sizes. It is recommended that tires be filled to valve stem level while the valve is located in the highest position (see &lt;span class="xref"&gt;Tables 1A&lt;/span&gt; and &lt;span class="xref"&gt;1B&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
