  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the basic requirements for the design, construction and testing of air mode 2.44 m × 2.44 m (8 ft × 8 ft) cross-section containers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These containers are to be used exclusively in conjunction with the air mode in freighter versions of wide-body commercial transport aircraft. Air mode containers will normally be on aircraft roller conveying systems and/or on similarly equipped ancillary ground handling devices. Similar requirements for air/surface (intermodal) containers are provided in AS832.&lt;/div&gt;&lt;/div&gt;</p>
