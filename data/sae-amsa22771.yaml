  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for heat treated aluminum alloy die forgings, hand forgings, and ring forgings, produced under additional mechanical property control to ensure known mechanical properties for parts used in aerospace critical applications. This specification also covers the requirements for forgings furnished in the F or 01 conditions which will ultimately be used in the heat treated condition.&lt;/div&gt;&lt;/div&gt;</p>
