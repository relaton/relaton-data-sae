    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) provides recommended design guidelines for composition formation, performance, testing and reliability of metal-chlorate-perchlorate class solid chemical oxygen generators, supplying oxygen at essentially ambient pressure, for aircraft whose cabin pressure altitude does not exceed 40,000 feet (12,192 m).&lt;/div&gt;&lt;/div&gt;</p>
