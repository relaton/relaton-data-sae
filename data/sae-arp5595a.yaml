  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice aims at providing general utilization guidelines and calculation methods adequate to guarantee the effectiveness and ultimate load strength of tie-down / lashing arrangements performed to restrain cargo on board civil transport aircraft during flight:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;cargo loaded and tied down onto airworthiness approved air cargo pallets, themselves restrained into aircraft lower deck, main deck or upper deck cargo systems meeting the restraint requirements of air cargo pallets approved in accordance with NAS3610 or AS36100A, or&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;additional tie-down on aircraft structure when necessitated by pallet maximum gross mass or CG, or&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;individual pieces of cargo, or pieces of cargo placed onto an unrestrained (“floating”) pallet into either lower deck, main deck or upper deck containerized cargo compartments of an aircraft, or&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;individual pieces of load loaded in non containerized (bulk loaded) baggage or cargo compartments.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
