  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AIR5933 provides an overview of contemporary technologies (i.e., sensors) that measure the proportion of oxygen in a gas. The use of these sensors in the aerospace environment, with its special constraints, is discussed and papers/reports with detailed information are summarized and referenced.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The sensors are divided into expendable and non-expendable sensors. Expendable sensors are based on electrochemical properties, whereas non-expendable sensors rely on paramagnetic, photo-acoustic, electromagnetic, and laser spectroscopy properties.&lt;/div&gt;&lt;/div&gt;</p>
