  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice was developed primarily for gasoline-powered passenger car and truck applications to interface vapor recovery systems, but it may be used in diesel, marine, industrial, and similar applications where a nozzle is required for filling. The zones cover nozzle spout access and handle clearance to a refilling port. In addition, this recommended practice includes a design window for nozzle manufacturers to develop with.&lt;/div&gt;
    &lt;/div&gt;</p>
