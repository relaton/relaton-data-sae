abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this Aerospace Recommended Practice is to establish criteria for the provision of crew escape facilities from the flight deck area of commercial transport aircraft.  This Aerospace Recommended Practice applies to all transport category aircraft certificated under FAR 25, regardless of means of propulsion, design speed regime, or kind of payload carried.</p>"
