  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE performance standard is to provide a simple, practical, and broadly applicable test procedure for appraising luminous Illuminant A reflectance of reflecting safety glazing materials for road vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE performance standard, which provides a simple test procedure widely used in the optics field, may be used to measure the reflectivity which films applied to safety glazing materials for road vehicles may enhance. This test procedure applies to conditions where feasibility, rather than accuracy of measurement, is of prime importance. Measurements can be made outside laboratories in a quality control environment and in similar applications, when glazings, instead of small test specimens, have to be tested.&lt;/div&gt;&lt;/div&gt;</p>
