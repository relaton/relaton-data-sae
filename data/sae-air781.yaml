  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;A general discussion is presented herein, to outline the starter functions which are necessary for a successful engine start. In addition, sample calculations are included to illustrate an accepted method of determining the engine starting time from known data. Further consideration is then given to the relationship between starter torque output and engine pad strength and a generalized formula is presented for calculating the theoretical transient torque peaks for a simplified starter-engine system. Sample calculations for actual tests are included, and the results of these calculations are compared with measured values.&lt;/div&gt;&lt;/div&gt;</p>
