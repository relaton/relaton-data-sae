    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The force, torque, and energy methods of measurement are all in common use and should yield the same test results. Effects of steering, traction, and non steady-state tire operations are excluded from the recommended practice because they are still in the research stage. Methods of correcting laboratory data to road conditions are being developed.&lt;/div&gt;


