  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes consistent test procedures for determination of steady-state directional control properties for passenger cars and light trucks with two axles. These properties include the steering-wheel angle gradient, reference steer angle gradient, sideslip angle gradient, vehicle roll angle gradient, and steering-wheel torque gradient with respect to lateral acceleration. They also include the yaw velocity gain, lateral acceleration gain, and sideslip angle gain with respect to steering-wheel angle. Additionally, the characteristic or critical speed and the front and rear wheel steer compliances may be determined.&lt;/div&gt;&lt;/div&gt;</p>
