    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers the recommended criteria and performance requirements for the design and installation of land-based aircraft emergency and operational arresting hooks for use on runway arresting systems. Design criteria for fully operational hooks and for carrier-based aircraft hook installations are contained in specification MIL-A-18717.&lt;/div&gt;&lt;/div&gt;</p>
