  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Procedures included within this specification are intended to cover performance testing at all phases of development, production, and field analysis of any USB cable assemblies and associated connections that constitute the electrical connection systems between the consumer peripheral interface and the USB computer source in road vehicle applications. These procedures are only applicable to the USB connector and the cable. Unless otherwise specified, all of the tests listed in this specification are for both consumer and nonconsumer interface connectors.&lt;/div&gt;
    &lt;/div&gt;</p>
