    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a silicone rubber material that can be used to manufacture product in the form of sheet, strip, tubing, molded shapes, and extrusions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification should not be used to address products such as O-rings, compression seals, O-ring cord, and molded-in-place gaskets.For these applications AMS specifications in the AMS7XXX series should be used.&lt;/div&gt;&lt;/div&gt;</p>
