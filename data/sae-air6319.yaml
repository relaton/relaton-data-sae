  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;ATP360 air carrier training applies to pilots holding a commercial certificate with instrument and multi-engine ratings. This document describes how the ATP360 program achieves its objectives: to educate and train qualified pilots for First Officer and eventually Captain positions with the regional and/or the major airlines. This document also provides an overview of a selection process, an academic curriculum, a flight training program, faculty preparation, and program evaluation. The focus of ATP360 is to develop industry-recognized competencies and instill the knowledge, skills and attitudes required to bring persons up to professional air carrier standards.&lt;/div&gt;
    &lt;/div&gt;</p>
