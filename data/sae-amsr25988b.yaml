abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This material has resistance to diester-based engine oil (MIL-PRF-7808) and fuel, but usage is not limited to such applications. This material is not suitable for use in synthetic phosphate ester based hydraulic fluids (AS1241) or helicopter transmission lubricating oils (DOD-PRF-85734, MIL-PRF-32538). For gas turbine engine lubricating oils (AS5780, MIL-PRF-23699), resistance varies by class and should be evaluated individually (see Note regarding high performance oils). This material has a typical service temperature range of -70 to +392 °F (-56.7 to +200 °C) for Class 1 and Class 2 and -70 to +437 °F (-56.7 to +225 °C) for Class 3. The service temperature range of the material is a general temperature range, but the presence of particular fluids and specific design requirements may modify this range. Each application should be considered separately. It is the responsibility of the user to determine that this specification is appropriate for the environments (temperature range, fluids exposure, etc.) in which it is sought to be used.&lt;/div&gt;
    &lt;/div&gt;</p>
