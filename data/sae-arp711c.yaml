  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers the general design and performance characteristics of illuminated information signs for service in the passenger compartment of passenger transport aircraft. Relating to regulations, this ARP covers regulations that have been harmonized with the Federal Aviation Administration (FAA) and European Aviation Safety Agency (EASA); if there are any differences, the applicant should review the appropriate regulations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;"Illuminated information signs" are lighted signs used to inform occupants of the passenger compartment. Signs may use symbols or letters to convey messages.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP does not apply to "EXIT" signs, which are the subject of ARP503.&lt;/div&gt;&lt;/div&gt;</p>
