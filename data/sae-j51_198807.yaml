  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers reinforced rubber and reinforced thermoplastic hose, or hose assemblies, intended for conducting liquid and gaseous dichlorodifluoromethane (refrigerant 12) in automotive air conditioning systems. The hose shall be designed to minimize permeation of refrigerant 12 and contamination of the system and to be serviceable over a temperature range of -30 to 120°C (-22 to 248°F). Specific construction details are to be agreed upon between user and supplier.&lt;/div&gt;&lt;/div&gt;</p>
