  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for two classes of chemical conversion coatings formed by the reaction of chemical conversion materials and the surfaces of aluminum and aluminum alloys. This specification is intended specifically to provide components of military weapon systems with maximum corrosion resistance. The coating also provides a surface having better paint adhesion than uncoated aluminum. It is not intended as a general purpose coating for commercial and decorative applications, (see &lt;span class="xref"&gt;6.1&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
