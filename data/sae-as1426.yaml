  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification (Part I) covers the performance, design, development and test requirements for the standard galley system. The galley equipment comprising the standard system includes standard containers, carts (trolleys), modules, ovens, refrigerators, coffee makers, water boilers, hot jugs, and related items; and several standard configurations and sizes of galley shell structures with internal arrangement options. Standard tray and entree dish envelopes are also defined, allowing variations for user styling and shape within related equipment space provisions.&lt;/div&gt;&lt;/div&gt;</p>
