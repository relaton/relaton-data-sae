  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines a method for evaluating the near field magnetic component of the electromagnetic radiation from an integrated circuit. The method uses a shielded, single turn loop as a probe to measure magnetic emissions from 1 to 1000 MHz at a controlled distance and orientation from an integrated circuit. The method primarily measures the magnetic field generated by IC current loops perpendicular to the IC surface in the lead frame. This document is applicable to measurements from an individual IC mounted on a standardized test board or in-situ on a circuit board. Comparisons using the IC emissions reference levels require using identical circuit boards or the standardized IC test board.&lt;/div&gt;
    &lt;/div&gt;</p>
