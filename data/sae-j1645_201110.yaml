  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Surface Vehicle Recommended Practice deals with electrostatic charge phenomena that may occur in automotive fuel systems and applies to the following:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Fuels that are in a liquid state at ambient temperatures and atmospheric pressures and are contained in vehicle fuel tanks that operate at or near atmospheric pressure. This includes gasoline and diesel fuels as well as their blends with additives such as alcohols, esters and ethers whether the additives are petroleum based or bio-fuel based.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The group of components that comprise the fuel system (in contact and not in contact with fuels).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Other components in proximity to the fuel system that may be affected by electrostatic fields caused by the fuel system.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Electrostatic phenomena that arise from or are affected by the following aspects of vehicle or fuel system operation:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;○&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Flowing fuel in the fuel delivery system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;○&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Flowing fuel being dispensed to the vehicle while it is being fueled&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;</p>
