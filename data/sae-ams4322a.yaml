  content: |-
    <p>&lt;p&gt;This specification covers an aluminum alloy in the form of die forgings and forging stock.&lt;/p&gt;
    &lt;p&gt;These forgings have been used typically for applications requiring moderate triaxial strength, low density, high modulus, and good resistance to a combination of stress-corrosion cracking, but usage is not limited to such applications.&lt;/p&gt;</p>
