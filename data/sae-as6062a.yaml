  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines a set of standard application layer interfaces called JAUS Mission Spooling Services. JAUS Services provide the means for software entities in an unmanned system or system of unmanned systems to communicate and coordinate their activities. The Mission Spooling Services represent the physical platform-independent capabilities commonly found across all domains and types of unmanned systems. At present, one service is defined in this document (more services are planned for future versions of this document):&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Mission Spooler: Stores, manages, and executes lists of tasks&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;The Mission Spooler service is described by a JAUS Service Definition (JSD) which specifies the message set and message protocol required for compliance. The JSD is fully compliant with the JAUS Service Interface Definition Language (JSIDL).&lt;/div&gt;



    &lt;/div&gt;</p>
