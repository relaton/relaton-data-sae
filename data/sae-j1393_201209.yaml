  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document supersedes SAE J819 - Engine Cooling System Field Test. The purpose of this SAE Recommended Practice is to establish a testing procedure to determine the performance capability of engine cooling systems, including charge air coolers, on heavy-duty vehicles with liquid-cooled internal combustion engines. The definition of heavy vehicles for this document includes, but is not limited to, on- and off-highway trucks, cranes, drill rigs, construction, forestry and agricultural machines. Vehicles equipped with side or rear-mounted radiators may require an alternate procedure of a towing dynamometer because of peculiar aerodynamics.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Testing is generally conducted to determine compliance with cooling criteria established by the engine manufacturer or the end product user to meet a desired engine reliability goal.&lt;/div&gt;&lt;/div&gt;</p>
