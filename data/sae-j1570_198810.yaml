  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers molded rubber boots used on disc brake pistons to prevent the entrance of dirt and moisture which could cause corrosion and otherwise impair caliper operation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specification includes performance tests of brake piston boots of both plain and insert types under specified conditions and does not include requirements relating to chemical composition or physical properties of the rubber compound. Further, it does not cover the strength of the adhesion of rubber to the insert material where an insert is used.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The rubber material used in these boots is classified as suitable for operating in a temperature range of -40 to +120 ±2°C (-40 to +248 ±3.6°F).&lt;/div&gt;&lt;/div&gt;</p>
