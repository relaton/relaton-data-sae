    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides for common battery designs through the description of dimensions, termination, retention, venting system, and other features required in an electric vehicle application. The document does not provide for performance standards. Performance will be addressed by SAE J1798. This document does provide for guidelines in proper packaging of battery modules to meet performance criteria detailed in J1766.&lt;/div&gt;



    &lt;/div&gt;</p>
