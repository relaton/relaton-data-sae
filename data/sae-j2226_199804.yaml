  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;There is no standard equivalent to this SAE Standard. However, SAE J2226 is similar to and represents an extension of SAE J1998 (equivalent to ISO Standard 6622/2 TR).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the essential dimensional features of Type B barrel faced steel rectangular piston rings. Only fully faced and inlaid coated rings are included, consistent with current U.S. practice.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this SAE Standard apply to steel piston rings of reciprocating internal combustion engines, up to and including 200 mm diameter and 4.5 mm width.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Tolerances specified in this document represent a six sigma quality level.&lt;/div&gt;&lt;/div&gt;</p>
