  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure establishes recommendations on the measurement of diesel engine intake air flow under steady-state test conditions. The measurement methods discussed have been limited to metering systems and associated equipment found in common usage in the industry, specifically, nozzles, laminar flow devices, and vortex shedding. The procedure establishes accuracy goals as well as explains proper usage of equipment. The recommendations concerning diesel engine exhaust mass flow measurements are minimal in scope.&lt;/div&gt;
    &lt;/div&gt;</p>
