  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Common or obvious surface imperfections are normally visible to the naked eye before or after fabrication or processing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Illustrations and definitions of these imperfections are contained in this SAE Information Report. The identifying names are those commonly used throughout the steel industry. The imperfections identified include the major and most often encountered imperfections known to exist at this time. These imperfections are variable in appearance and severity. Extreme conditions have been selected in some instances in order to obtain suitable photographs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Photographs are courtesy of the American Iron and Steel Institute, Kaiser Aluminum, U.S. Steel, Nucor Steel, Samuel Steel, Steel Dynamics, Worthington Steel, and companies no longer in existence: LTV Steel, National Steel, and The Budd Company.&lt;/div&gt;&lt;/div&gt;</p>
