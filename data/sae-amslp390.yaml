  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers low, medium, and high density polyethylene and copolymers molding and extrusion material for general purpose use, for use as dielectric material, and for weather-resistant applications (see &lt;span class="xref"&gt;6.1&lt;/span&gt;). For the purpose of this specification, the term polyethylene is used when referring to any of the types, classes, grades, and categories.&lt;/div&gt;
    &lt;/div&gt;</p>
