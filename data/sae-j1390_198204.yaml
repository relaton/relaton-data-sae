  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;It is necessary to identify and attempt to evaluate the characteristics of an application which can have an effect on fan durability. Failures almost always occur in fatigue, so careful attention should be paid to avoid resonance or forced vibration of the fan. This section considers vibrational inputs, fan natural frequencies, and operating speed as part of the initial structural integrity analysis. A fan application fact sheet (&lt;span class="xref"&gt;Table 1&lt;/span&gt;) is recommended as a form to communicate between user and fan supplier.&lt;/div&gt;
    &lt;/div&gt;</p>
