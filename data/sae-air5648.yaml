  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Specific Federal Aviation Regulations (FAR) define oxygen system requirements for an in-flight decompression incident. This AIR addresses the oxygen system requirements for a decompression incident that may occur at any point during a long-range flight, with an emphasis for a decompression at the equal time point (ETP). This AIR identifies fuel and oxygen management contingencies, and presents a possible solution for the most efficient, safe, and optimum flight continuation.&lt;/div&gt;&lt;/div&gt;</p>
