abstract:
- language: en
  script: Latn
  content: "<p>Certain techniques involved in determining the dirt or abrasive content
    of aircraft greases are considered inadequate. It is desirable to develop a method
    of analysis which will definitely identify the quantity, size, and degree of abrasiveness
    of foreign substances in lubricating greases.</p>"
