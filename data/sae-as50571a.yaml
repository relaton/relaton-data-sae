  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the general requirements for red and white individual instrument lights. This document has been streamlined. Appendix A to MIL-L-5057F lists those documents required for MIL-L-5057F acquisition and is a mandatory part of MIL-L-5057F. Those documents listed in Appendix A have the same status as those referenced directly in MIL-L-5057F (first tier documents). All other documents, referenced through tiering, may be used as guidance and information to supplement MIL-L-5057F. This document’s scope is limited to lamp source designs solely. Furthermore, the use of red lighting should not be considered for new design and included within this document to support requirements for existing military aircraft that still operate with this system of lighting.&lt;/div&gt;&lt;/div&gt;</p>
