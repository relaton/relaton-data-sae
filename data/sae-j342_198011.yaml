  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice establishes equipment and procedures for the evaluation of the relative collection efficiencies and other performance characteristics of spark arresters or turbochargers used on the exhaust system of large engines normally used in railroad locomotives, stationary power plants, and other similar applications. This recommended practice does not cover applications requiring flame arresting, exhaust gas cooling, or isolation from explosive gases. Two uniform testing methods are offered; a laboratory test using ambient air (cold test) and an engine test using exhaust gases (hot test), which may be used by spark arrester manufacturers, governmental bodies, and engine spark arrester users. Though the engine test (hot test) is preferred, approval can be sought based on the lab test (cold test) over the airflow range tested. Arresters meeting this standard should not be expected to adequately arrest sparks when tilted more than 45 deg from their normal operating position. Spark arresters or turbochargers qualified by an engine test can be applied to different engines of similar design without a complete retest, provided the data shows it to be effective in the applicable flow ranges. Additional test data may be obtained to determine effectiveness at higher or lower flow ranges.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Certain design and performance characteristics, which may be required by regulatory agencies for qualification and approval under this recommended practice, are listed in the &lt;span class="xref"&gt;Appendix&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
