  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to self-propelled off-road work machines. Included are the following categories:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Earthmoving&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Implements and Attachments&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Forestry&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Road Building and Maintenance&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Specialized Mining&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Powered Industrial Trucks&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard does not apply to Agricultural Tractors as defined in ANSI/ASAE S390 although some SAE standards are also applicable to Agricultural Tractors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Most standards relating to agricultural tractors and implements are developed by ASABE.&lt;/div&gt;
    &lt;/div&gt;</p>
