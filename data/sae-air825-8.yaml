    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides general information on Continuous Flow Oxygen Systems which are available, principle functions of those systems and technical approaches to be taken into account during design and realization of systems. However, particular performance specifications and detailed information of manufacturing, testing and integration of such systems is beyond the scope of this document.&lt;/div&gt;&lt;/div&gt;</p>
