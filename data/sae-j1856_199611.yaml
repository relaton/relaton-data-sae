abstract:
- language: en
  script: Latn
  content: "<p>This recommended practice describes a method for identification of
    \ air bag equipped vehicles requiring minimal knowledge of vehicle design or air
    bag system configuration. The purpose of this SAE Recommended  Practice is to
    establish a uniform practice regarding the identification of automotive air bags
    during the vehicle disposal process. This recommended practice is intended as
    a guide toward standard practice and is subject to change to keep pace with experience
    and technical advances.</p>"
