  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the measurement of electromagnetic radiation from a motor vehicle or other internal-combustion-powered device (excluding aircraft) over a frequency range of 20-1000 MHz. In the case of motor vehicle sources, auxiliary engines mounted on the vehicle are included and short-duty cycle equipment (such as starting motors, window regulators, turn signals, flashing warning lights, etc.) are excluded.&lt;/div&gt;&lt;/div&gt;</p>
