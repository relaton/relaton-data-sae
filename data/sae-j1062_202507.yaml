    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to give information to engineers and designers in order that access to a passenger handgrip, when used, is easily obtained, and that such handgrips offer maximum safety for a person at least as large as a 95th percentile adult male during snowmobile operation.&lt;/div&gt;&lt;/div&gt;</p>
