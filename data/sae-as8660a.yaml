abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This specification covers one type of a nonmelting, heat stable
    silicone compound for use in high tension electrical connections, ignition systems
    and electronics equipment; for application to unpainted mating threaded or non-threaded
    surfaces, and as a lubricant for components fabricated from rubber.  This compound
    is effective in the temperature range from -54°C (-65°F) to +204°C (+400°F) for
    extended periods and to 260°C (500°F) for short periods.  This compound is identified
    by NATO symbol S-736 (see 6.5).&lt;/p&gt;</p>"
