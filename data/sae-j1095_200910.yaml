  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform laboratory procedures for fatigue testing of wheels for demountable rims and hubs intended for normal highway use on trucks, buses, truck trailers, and multipurpose passenger vehicles. The hubs included have bolt circle diameters from 165.1 to 335.0 mm (6.50 to 13.19 in). It is up to each hub and/or wheel for demountable rims developer to determine what test method, accelerated load factor and cycle life requirements are applicable to obtain satisfactory service life in a given application. When deviations from the procedures recommended herein are made, it is the responsibility of the hub and/or wheel for demountable rims developer to modify other parameters to obtain satisfactory service life.&lt;/div&gt;&lt;/div&gt;</p>
