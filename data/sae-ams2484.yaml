    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a blackening solution, applied at room temperature, for touchup of black oxide coated (AMS 2485 or MIL-C-13924, Class 1) steel to provide a uniform, ebony-black surface. Such black coatings are used on gears and in optical applications.&lt;/div&gt;&lt;/div&gt;</p>
