    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) delineates two complementary filter element performance parameters: (1) dirt capacity, and (2) filtration efficiency, and corresponding test procedures. It is intended for non-cleanable (disposable), fine fuel filter elements, rated at 25 µm(c) or finer, used in aviation gas turbine engine fuel systems.&lt;/div&gt;




    &lt;/div&gt;</p>
