abstract:
- language: en
  script: Latn
  content: "<p>Today's sophisticated aircraft are required to effectively perform
    a variety of missions. With the advent of micro-miniaturization in electronics
    and advanced digital computers, a new generation of avionics equipment and systems
    can be utilized to increase the capabilities of the aircraft. As the quantity
    and variety of equipment and functions increases, the problems of inter-connecting
    these equipments with wires presents a constraint on size, weight, signal conditioning,
    reliability, maintainability and electromagnetic control. Conventional wiring
    has  resulted in large bundles of wires and many connectors which adds excessive
    weight and reduces the space available for the pilot and other vital elements.
    This limitation can be relieved significantly by the  application of well proven
    multiplexing techniques.</p>"
