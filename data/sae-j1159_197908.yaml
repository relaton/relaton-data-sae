    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;It applies to reports of Surface Vehicles and Machinery Technical Committees only. Aerospace technical reports are covered by editorial practices of the Aerospace Council. Close adherence to this recommended practice by technical committees of SAE will help to assure uniform technical reports. Should questions on format, style, or other matters pertaining to the organization and editorial practices of technical reports be raised within technical committees of the Technical Board, they should be referred to the Chairman of the Publications Advisory Committee for interpretation or for discussion by the full Publications Advisory Committee.&lt;/div&gt;&lt;/div&gt;</p>
