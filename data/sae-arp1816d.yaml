  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes three general types of Ground Support Equipment (GSE) battery chargers. The battery charger typically requiring up to 8 hours to recharge a 100% discharged battery, hereafter called “Conventional Charger.” A charger, hereafter called “Opportunity Charger,” which has the ability to charge at a slightly faster rate than a conventional charger. A charger, hereafter called “Fast Charger,” which has the ability to charge at a much faster rate than a conventional charger. Recommendations that apply to all types will refer generically to “charger.”&lt;/div&gt;&lt;/div&gt;</p>
