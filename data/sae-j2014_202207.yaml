  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to all combinations of pneumatic tires, wheels, or runflat devices (only as defined in SAE J2013) for military tactical wheeled vehicles only as defined in SAE J2013. This applies to original equipment and new replacement tires, retread tires, wheels, or runflat devices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document describes tests and test methodology, which will be used to evaluate and measure tire/wheel/runflat system and changes in vehicle performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All of the tests included in this document are not required for each tire/wheel/runflat assembly. The Government Tire Engineering Office and Program Office for the vehicle system have the responsibility for the selection of a specific test(s) to be used. The selected test(s) should be limited to that required to evaluate the tire/wheel/runflat system and changes in vehicle performance. Selected requirements of this specification shall be used as the basis for procurement of a tire, wheel, and/or runflat device for military tactical wheeled vehicles.&lt;/div&gt;&lt;/div&gt;</p>
