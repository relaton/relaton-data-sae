  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides a specification of a general misbehavior report format suitable for reporting misbehavior observed by a system running SAE V2X applications, and specific report contents for specific instances of misbehavior. It also provides an overview of the architecture of a system-wide misbehavior management service for the V2X system and positions the misbehavior reporting services within that architecture.&lt;/div&gt;&lt;/div&gt;</p>
