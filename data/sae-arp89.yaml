    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These specifications are written to cover automatic temperature controls under three classifications, namely:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;A&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;AUTOMATIC TEMPERATURE CONTROLS - GENERAL - Dealing with features applicable to all types and uses.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;B&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;AUTOMATIC TEMPERATURE CONTROLS - MILITARY AND COMMERCIAL - Covering features applicable to military aircraft and commercial aircraft.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;C&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;DESIRABLE DESIGN FEATURES - General information for use of those concerned in meeting the requirements contained herein.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
