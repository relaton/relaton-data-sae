  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for manufacturers of Fasteners to be accredited by the National Aerospace and Defense Contractors Accreditation Program (NADCAP). NADCAP accreditation is granted in accordance with SAE AS7003 after demonstrating compliance with the requirements herein. These requirements may be supplemented by additional requirements specified by NADCAP Fastener Manufacturing Task Group. Using the corrsponding Audit Criteria checklists (PRI ACs) will ensure that accredited Fastener Manufacturing suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;&lt;/div&gt;</p>
