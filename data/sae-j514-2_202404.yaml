  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers complete general and dimensional specifications for flareless type of hydraulic tube fittings. These fittings are intended for general application in hydraulic systems on industrial equipment and commercial products.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These fittings are capable of providing leakproof, full flow connections in hydraulic systems operating at working pressures as specified in &lt;span class="xref"&gt;Table 1&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For any application, it is recommended that sufficient testing be conducted and reviewed by both the user and fitting manufacturer to assure that performance levels will be safe and satisfactory.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Formerly, SAE J514 was organized as a single document with ten clauses, which included six sections. This revision of SAE J514 has been organized into three sections as follows:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Part 1: 37-degree flared fittings&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Part 2: Flareless (bite type) fittings&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Part 3: NPTF pipe fittings and pipe unions&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;It is important to note that this and all SAE J-documents are intended for ground vehicle use only and not intended for aerospace applications.&lt;/div&gt;&lt;/div&gt;</p>
