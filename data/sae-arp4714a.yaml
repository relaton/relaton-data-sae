abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This paper presents guidelines for development of a procedure for external software loading of an electronic engine control (EEC) for a commercial application, on-wing or in a qualified service shop. This paper makes the following assumptions:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The EEC is designed to accept external software loading.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The EEC is certified as part of an engine.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The support equipment is qualified in accordance with procedures set forth by the engine (and aircraft, if necessary) certifying authority if the EEC cannot detect an integrity violation of the loaded program.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The software to be loaded has been approved by the engine and aircraft certifying authorities.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;One or more configurations of EEC hardware has been identified for each version of software which is to be loaded in the EEC.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;It is appropriate to use these guidelines in the initial development phase, although the certification issues would not be applicable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Approval as used herein means approval by the engine (and aircraft, if necessary) certifying authority. There are cases where the engine may commence certification activities and no specific aircraft application has been identified. In these cases, the aircraft certification authority should be notified of the EEC’s external software loading capability when the engine’s application is identified. The appropriate documentation can be delivered to the aircraft certifying authority at that time.&lt;/div&gt;&lt;/div&gt;</p>
