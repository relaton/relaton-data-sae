abstract:
- language: en
  script: Latn
  content: "<p>This specification covers the engineering requirements for selective (brush) electrodeposition of nickel and the properties of the deposit. This process has been used typically to provide good wear resistance and dimensional build-up and restoration of parts which may operate in service up to 450 degrees F (232 degrees C), where low tensile stress in the deposit is required, but usage is not limited to such applications. Diffusion heat treatment of the deposit is not required.</p>"
