  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The content of ARP6328 contains guidance for implementing processes used for risk identification, mitigation, detection, avoidance, disposition, and reporting of counterfeit electrical, electronic, and electromechanical (EEE) parts and assemblies in accordance with AS5553 Revision D. This document may also be used in conjunction with other revisions of AS5553. This document retains guidance contained in the base document of AS5553, updated as appropriate to reflect current practices. This is not intended to stand alone, supersede, or cancel requirements found in other quality management system documents, requirements imposed by contracting authorities, or applicable laws and regulations unless an authorized exemption/variance has been obtained.&lt;/div&gt;&lt;/div&gt;</p>
