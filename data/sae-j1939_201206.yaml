    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This top level document describes the network in general, the OSI layering structure, the subordinate document structure, and provides control for all preassigned values and names. The Appendices of this document lists all SPN assignments, PGN assignments, NAME Function assignments, Manufacturer Code assignments, and Preferred Address assignments. All SPN and PGN assignments are listed in this document even though the complete definition details might be recorded in another standard. The SPN and PGN listings in this document identify the standard document that either contains the definition details or is associated with the identifier.&lt;/div&gt;

    &lt;/div&gt;</p>
