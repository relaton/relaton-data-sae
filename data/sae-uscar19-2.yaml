    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This radio frequency (RF) connector interface specification is suited for unsealed automobile applications up to 2 GHz. Dimensional requirements are specified in this document to ensure interchangeability. This RF connector interface specification is intended for in-line, board mount, device mount, straight or angled applications. Performance requirements are specified in SAE/USCAR-2, and in SAE/USCAR-17.&lt;/div&gt;&lt;/div&gt;</p>
