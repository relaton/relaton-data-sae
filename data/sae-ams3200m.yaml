    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an acrylonitrile-butadiene (NBR) elastomer that can be used to manufacture product in the form of sheet, strip, tubing, extrusions, and molded shapes. For molded rings, compression seals, O-ring cord, and molded-in-place gaskets for aeronautical and aerospace applications, use the AMS-P-83461 specification or the MIL-PRF-25732 specification.&lt;/div&gt;&lt;/div&gt;</p>
