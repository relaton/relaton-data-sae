  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the general requirements for the design, construction, acceptance and qualification testing of flat cut-off pressure compensated, variable delivery hydraulic pumps, used in civil aircraft hydraulic systems. It also provides parameters for a Procurement Specification to be used in conjunction with this AS for each pump.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Hydraulic pumps may incorporate features such as a clutch in the input drive, which will not be covered by this standard.&lt;/div&gt;
    &lt;/div&gt;</p>
