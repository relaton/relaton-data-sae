abstract:
- language: en
  script: Latn
  content: "<p>Verification of landing gear design strength is accomplished by dynamic
    and static test programs. This is essentially a verification of the analytical
    procedures used to design the gear. An industry survey was recently conducted
    to determine just what analysis and testing are currently being applied to landing
    gear. Timing in relation to first flight of new aircraft was also questioned.
    Opinions were solicited from designers of the following categories and/or types
    of aircraft: \na. military - large land based (bomber);\nb. mililtary - small
    land based  (fighter);\nc. military - carrier based (Navy); \nd. military - helicopter
    (large);\ne. military - helicopter (small-attack); \nf. commercial - large (airliner);
    \ng. commercial - small (business); and \nh. USAF (WPAFB) - recommendations.\n
    It is the objective of this AIR to present a summary of these  responses. It is
    hoped that this summary will be useful to designers as a guide and/or check list
    in establishing criteria for landing gear analysis and test.</p>"
