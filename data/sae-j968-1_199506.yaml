  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This part of SAE J968 specifies two types of calibrating nozzle and holder assemblies intended for the testing and setting of diesel injection pumps on test benches.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It applies to:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A calibrating nozzle and holder assembly with a single hole orifice plate;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A calibrating nozzle and holder assembly with a delay pintle type nozzle.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The approximate range of the calibrating nozzle and holder assembly is up to:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;300 mm&lt;sup&gt;3&lt;/sup&gt;/stroke with the single hole orifice plate;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;150 mm&lt;sup&gt;3&lt;/sup&gt;/stroke with the delay pintle type nozzle.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Setting and maintenance requirements are specified in ISO 4008/3.&lt;/div&gt;&lt;/div&gt;</p>
