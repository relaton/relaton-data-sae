  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to the anchorage or attachment of seat belt assemblies, as described in the current version of SAE J4, to the seat assembly or other suitable structure of passenger cars. It specifies performance requirements, test procedures, and location of anchorages for seat belt assemblies when anchorages are provided, and the provisions for identification and location of attachment points for seat belt assemblies when anchorages are not provided.&lt;/div&gt;&lt;/div&gt;</p>
