abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document outlines a standard practice for conducting system safety. In some cases, these principles may be captured in other standards that apply to specific commodities such as commercial aircraft and automobiles. For example, those manufacturers that produce commercial aircraft should use SAE ARP4754 or SAE ARP4761 (see &lt;span class="xref"&gt;Section 2&lt;/span&gt; below) to meet FAA or other regulatory agency system safety-related requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The system safety practice as defined herein provides a consistent means of evaluating identified risks. Mishap risk should be identified, evaluated, and mitigated to a level as low as reasonably practicable. The mishap risk should be accepted by the appropriate authority and comply with federal (and state, where applicable) laws and regulations, executive orders, treaties, and agreements. Program trade studies associated with mitigating mishap risk should consider total life cycle cost in any decision.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended for use as one of the elements of project solicitation for complex systems requiring a systematic evaluation of hazards and mitigating measures. The Managing Authority may identify, in the solicitation and system specification, specific system safety requirements to be met by the Developer. These may include risk assessment and acceptance criteria, unique classifications and certifications, or mishap reduction needs unique to their program. Additional information in meeting program specific requirements is located in the Appendixes.&lt;/div&gt;&lt;/div&gt;</p>
