    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Information Report (AIR) is to provide information and guidance for the selection and use of lubrication system monitoring methods.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR is intended to be used as a technical guide. It is not intended to be used as a legal document or standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The scope of this document is limited to those inspection and analysis methods and devices that can be considered appropriate for routine maintenance.&lt;/div&gt;&lt;/div&gt;</p>
