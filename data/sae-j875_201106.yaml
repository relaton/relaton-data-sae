  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Recommended Practice, trailer axle alignment, is to identify the dimensional limits of, and a method to, establish a perpendicular relationship between the king pin centerline and the axle centerline at its midpoint. Various types of equipment are commercially available which can be used for this measurement which provides varying degrees of accuracy, but none can be endorsed by SAE.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The most fundamental methods of measurement will be described here, but other equipment is available if a greater degree of accuracy is desired.&lt;/div&gt;&lt;/div&gt;</p>
