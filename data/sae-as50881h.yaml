    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers all aspects in Electrical Wiring Interconnection Systems (EWIS) from the selection through installation of wiring and wiring devices and optical cabling and termination devices used in aerospace vehicles. Aerospace vehicles include manned and unmanned airplanes, helicopters, lighter-than-air vehicles, missiles, and external pods.&lt;/div&gt;
