    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AIR5317 establishes the foundation for developing a successful APU health management capability for any commercial or military operator, flying fixed wing aircraft or rotorcraft. This AIR provides guidance for demonstrating business value through improved dispatch reliability, fewer service interruptions, and lower maintenance costs and for satisfying Extended Operations (ETOPS) availability and compliance requirements.&lt;/div&gt;
