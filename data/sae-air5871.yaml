  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to prognostics of gas turbine engines and its related auxiliary and subsystems. Its purpose is to define the meaning of prognostics with regard to gas turbine engines and related subsystems, explain its potential and limitations, and to provide guidelines for potential approaches for use in existing condition monitoring environments. It also includes some examples.&lt;/div&gt;&lt;/div&gt;</p>
