  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Recommended Practice is to promote compatibility between child restraint systems and vehicle rear seats and seat belts. Design guidelines are provided to vehicle manufacturers for certain characteristics of rear seats and seatbelts, and to child restraint system (CRS) manufacturers for corresponding CRS features so that each can be made more compatible with the other.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Child Restraint System Accommodation Fixture, shown in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;, is used to represent a CRS to the designers of both the vehicle interior and the CRS for evaluation of each product for compatibility with the other. The features of the accommodation fixture are described as each is used. A CRS accommodation template of transparent plastic, now shown, represents the side of the accommodation fixture for use in approximating its installed position on design drawings.&lt;/div&gt;
    &lt;/div&gt;</p>
