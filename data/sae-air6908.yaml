  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides background information, rationale, and data (both physical testing and computer simulations) used in defining the component test methods and similarity criteria described in SAE Aerospace Recommended Practice (ARP) 6330. ARP6330 defines multiple test methods uses to assess the effect of seat back mounted IFE monitor changes on blunt trauma to the head and post-impact sharp edge generation. The data generated is based on seat and IFE components installed on type A-T (transport airplane) certified aircraft. While not within the scope of ARP6330, generated test data for the possible future development of surrogate target evaluation methods is also included.&lt;/div&gt;&lt;/div&gt;</p>
