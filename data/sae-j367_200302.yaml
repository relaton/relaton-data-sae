abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Recommended Practice establishes a uniform laboratory test method to evaluate the capability of passenger car door systems to resist a concentrated lateral inward load.  The procedure is intended to provide repeatable results and to permit numerical comparisons.

    A test is conducted in which the door and related structural members of the vehicle are loaded under controlled laboratory conditions.  Structural strength measurements obtained under these conditions are reproducible.  Background information and rationale for the test procedures described in this Recommended Practice are provided in the Appendix.</p>
