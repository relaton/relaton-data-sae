  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) outlines transient measurement methods to determine engine-generated levels of relevant compressor bleed air contaminant marker compounds on a ground level test cell for aircraft propulsion engine or auxiliary power unit (APU) to be fitted on civil and military aircraft. This AIR focuses on lubrication oils that might enter the bleed air through leaking engine seals or other sources. Also considered are ingested engine combustion products, which must be differentiated from oil. The intent of this AIR is to identify key species that are markers typical of contaminants, not to characterize all possible contaminants. Real-time (transient) measurement methods to approximately quantify those markers are also discussed. Real-time methods developed for transient measurement could also be applied for real-time measurements in steady state operations in ground level test beds. Discussions of test setup and test procedures, techniques for sampling ambient air and compressor bleed air, and one or more specific analytical methodologies for each of the identified bleed air contaminant marker compounds are included. This AIR will not recommend levels of acceptability.&lt;/div&gt;
    &lt;/div&gt;</p>
