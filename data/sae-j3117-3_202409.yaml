    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers a single shielded balanced pair (twisted or parallel) jacketed data cable intended for use in surface vehicle cables for 2.5, 5, and 10 Gb/s Ethernet applications. The tests in this standard are intended to qualify cables for normal operation in an automotive environment while maintaining the necessary electrical properties for reliable data transmission.&lt;/div&gt;
    &lt;/div&gt;</p>
