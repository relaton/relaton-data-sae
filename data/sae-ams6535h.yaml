abstract:
- language: en
  script: Latn
  content: <p>Primarily for use where welding and moderate tensile properties are required.  May be used where minimum tensile strength up to 180,000 psi (1240 MPa) is required for wall thicknesses up to 0.125 in. (3 mm) and proportionately lower strength is required in heavier thicknesses. This specification has been declared "Noncurrent" by the Aerospace Materials Division, SAE, as of 19 April 1988. It is recommended, therefore, that this specification not be specified for new designs.</p>
