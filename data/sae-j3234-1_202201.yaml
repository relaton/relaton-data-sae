    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide the design specifications/requirements for metal guardrail surrogates that represent real metal guardrails to the in-vehicle sensors and can be used for performance assessment of such in-vehicle sensing systems in real-world test scenarios/conditions. This document only includes the recommended metal guardrail surrogate characteristics for automotive cameras, LiDARs, and/or radars.&lt;/div&gt;&lt;/div&gt;</p>
