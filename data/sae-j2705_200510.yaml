  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a test method for determining properties of a non-rolling tire quasi-statically enveloping, loaded onto, either a set of triangular cleats or a single step cleat. In the case of the triangular cleats the normal force and vertical deflection of the non-rolling tire are determined. In the case of the step cleats the normal force, longitudinal force, and vertical deflection of the non-rolling tire are determined. The method applies to any tire so long as the equipment is properly sized to correctly conduct the measurements for the intended test tire.&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; The data are intended for use in determining parameters for road load models and for comparative evaluations of the measured properties in research and development.&lt;/div&gt;



    &lt;/div&gt;</p>
