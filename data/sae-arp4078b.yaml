  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This aerospace recommended practice (ARP) addresses the care, use, and training required to employ an effective borescope inspection program. Five subsections are included that cover training, storage, preoperational inspections, operation, and postoperational care related to both rigid and flexible borescopes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Throughout this ARP, proper borescope system nomenclature and terminology are utilized as specified in SAE ARP4022, Borescope Inspection System Definitions.&lt;/div&gt;
    &lt;/div&gt;</p>
