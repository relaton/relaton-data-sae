abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of SAE J2064 covers coupled hose assemblies intended for containing and circulating lubricant, liquid, and gaseous R-134a, R-152a, and/or R-1234yf refrigerant in automotive air-conditioning systems. Historically, requirements for the hose used in coupled automotive refrigerant air conditioning assemblies was included in SAE J2064. SAE J2064 has been changed to establish the requirements for factory and field coupled hose assemblies. SAE J3062 has been issued to define requirements for the hose used in these assemblies into its own standard. SAE J2064 also provides the necessary values used in SAE J2727. The certified coupling of MAC hose assemblies is required in meeting certain regulatory requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A hose which has met the requirements of SAE J3062 and certified in SAE J2911 shall be used as part of the coupled assembly. A hose which meets the requirements of SAE J3062 does not ensure the assembly will meet the requirements of SAE J2064. It is the hose assembly manufacturer’s responsibility to confirm that the assemblies meet the specified acceptance criteria for this specification. The hose assembly shall be designed to minimize permeation of the refrigerant, contamination of the system, and to be functional over a temperature range of -30 to 125 °C. Specific construction details are to be agreed upon between user and supplier.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Bulk hose produced prior to the release of this standard in 2015 could be labeled “SAE J2064” and may not meet the requirements of SAE J3062.&lt;/div&gt;&lt;/div&gt;</p>
