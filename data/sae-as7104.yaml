  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the minimum requirements for the quality assurance program of a distributor of factory new material and excess inventory, assembled, altered, new, used, remanufactured, repaired, rebuilt or overhauled parts and materials. It is applicable to the distributor who procures parts and materials, assembles higher level components/assemblies from parts or kits, or performs or contracts for the alteration, assembly, modification, remanufacture, repair, rebuilding or overhaul of products and resells them to customers or other distributors (i.e., a VALUE ADDED DISTRIBUTOR).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NADCAP accreditation is granted in accordance with SAE AS7003 after demonstrating compliance with the requirements herein. These requirements may be supplemented by additional requirements specified by the NADCAP Distributors Task Group. Using the audit checklist (AC7104) will ensure that accredited Full Distributors meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;&lt;/div&gt;</p>
