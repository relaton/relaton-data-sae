    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers brake linings used on motor vehicles operated on the public ways, except those used only for parking brakes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The performance requirements outlined in this SAE Recommended Practice are based on currently available engineering data. It is intended that all portions of this recommended practice will be reviewed periodically and revised as additional knowledge regarding brake lining performance is developed.&lt;/div&gt;&lt;/div&gt;</p>
