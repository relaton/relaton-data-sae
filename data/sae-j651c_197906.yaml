  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The range of test conditions on the dynamometer shall be sufficient to determine the primary operating characteristics corresponding to the full range of vehicle operations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The transmission characteristics to be determined for all driving ranges or gears are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Efficiency versus output speed.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Torque ratio versus output speed.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Input speed versus output speed.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;4&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Output torque versus output speed.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;5&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Parasitic losses versus input speed.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
