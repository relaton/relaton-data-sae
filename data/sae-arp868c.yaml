    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides recommended methods and describes associated equipment and test setups to assist in understanding and conducting pressure drop tests on fuel system components. Background information and suggestions are provided as means of improving accuracy and repeatability of test results. Although written specifically for fuel system components, the methods, equipment and suggestions presented herein apply equally to pressure drop tests of other liquid-handling devices.&lt;/div&gt;
    &lt;/div&gt;</p>
