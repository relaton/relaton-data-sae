  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report establishes use cases for a plug-in electric vehicle (PEV) communicating with a DER Managing Entity (DME) as a distributed energy resource (DER) which is supported by SAE J2847/3. This document also provides guidance for updates to SAE J2847/2 to allow an inverter in an EVSE to use the PEV battery when operating together as either a DER or as a power source for loads which are not connected in parallel with the utility grid. Beyond these two specific communication objectives, this document is also intended to serve as a broad guide to the topic of reverse power flow (discharging) and vehicle-to-grid (V2G) technology.&lt;/div&gt;
    &lt;/div&gt;</p>
