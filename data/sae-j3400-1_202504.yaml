  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the general physical, electrical, functional, and performance requirements for adapters connected to standards conforming conductive power transfer via handheld conductive coupler capable of transferring either DC or single-phase power using two current-carrying contacts. The focus is on defining the process to evaluate the suitability of adapters for NACS couplers. This edition only covers adapters used between SAE J3400 and SAE J1772.&lt;/div&gt;&lt;/div&gt;</p>
