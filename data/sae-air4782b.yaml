    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) presents historical information and background data related to hydrant valves and couplers used in worldwide ground refueling of commercial aircraft (hereafter generically referred to as hydrant devices). Military hydrant devices are not included since their mission requirements demand approaches that may differ.&lt;/div&gt;

