abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;Il presente documento è stato preparato e rilasciato al fine di fornire informazioni e linee guida sull’applicazione della AQAP-2110, laddove il fornitore si attenga a quanto previsto dalla 9100. Il presente documento viene pubblicato come AQAP-2110-SRD.2 e IA9137. Il documento è stato sviluppato congiuntamente dalla NATO e dai rappresentanti dell’industria affinché sia utilizzato dalla NATO e dall’industria per facilitare l’utilizzo e la comprensione del rapporto tra la AQAP-2110 e la 9100. Le AQAP possono costituire un requisito qualora un Paese acquirente utilizzi le Foreign Military Sales (FMS) come proprio metodo di approvvigionamento.&lt;/p&gt;


    &lt;p&gt;Esso mira a contribuire all’interpretazione condivisa dei requisiti della AQAP-2110 da parte dell’acquirente e del fornitore 9100.&lt;/p&gt;


    &lt;p&gt;Il suo contenuto non ha natura giuridica o contrattuale, né sostituisce, integra o annulla alcuno dei requisiti della AQAP-2110 o della 9100.&lt;/p&gt;


    &lt;p&gt;A causa della molteplicità delle condizioni che possono sussistere (dipendenti da fattori come la tipologia di lavoro o processo, i dispositivi utilizzati e le abilità del personale coinvolto), le presenti linee guida non devono essere considerate come onnicomprensive, né devono essere considerate tali da imporre mezzi o metodi specifici per l’adempimento dei requisiti contrattuali. Le parti interessate sono tenute a sapere che è possibile servirsi di altri mezzi e metodi per l’adempimento di tali requisiti.&lt;/p&gt;


    &lt;p&gt;Gli utenti delle presenti linee guida devono tenere presente che i requisiti della AQAP 2110 sono obbligatori, come citato nel contratto, per fornitori e sub-fornitori.&lt;/p&gt;</p>
