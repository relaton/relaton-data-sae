abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard establishes emblem dimensional specifications, performance requirements, related test procedures, and mounting requirements.

    This unique idenification emblem shall be used only on machines which are designed for and travel at rates of speed less than 40 km/h (25 mph).

    The identifcation emblem shall supplement but not replace warning devices such as tail lamp regulators or flashing lights and shall not be used to identify stationary objects or stopped vehicles and/or machines.

    The dimensions and color patterns of the emblem have been established as a unique identification and shall not be altered to permit advertising or other markings on the face of the emblem, except as permitted in 4.2</p>
