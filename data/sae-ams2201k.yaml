  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established inch/pound manufacturing tolerances applicable to aluminum alloy rolled or cold-finished bar, rod, wire, and forging stock ordered to inch/pound dimensions. These tolerances apply to all conditions, unless otherwise noted. The term "excl" applies only to the higher figure of the specified range. The general temper designation "-TX51" is used for brevity and denotes the full temper designations -T351, -T451, -T651, -T851, and -T7351, the "X" representing one or more digits preceding the "51".&lt;/div&gt;&lt;/div&gt;</p>
