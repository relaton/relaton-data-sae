  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AS provides suitable test methods for measuring the dynamic coefficient of friction ("slip resistance" or "sliding friction") of aircraft flooring and walkway surfaces in accordance with 14 CFR and EASA CS 25.793 and 25.810(c). § 25.793 specifies the areas which are likely to become wet in service must have slip-resistant properties, and § 25.810 specifies an escape route must be established from each overwing emergency exit that is covered with a slip-resistant surface.&lt;/div&gt;&lt;/div&gt;</p>
