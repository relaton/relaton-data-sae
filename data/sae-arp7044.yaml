  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes a method to measure, track, and characterize the history of powder feedstock when consumed in the production of parts via additive manufacturing (AM). The history captured as part of this ARP includes AM process exposure, feedstock consumption, blending, and losses associated with the totality of the AM workflow. This document also outlines a two-part metric schema for used powder feedstock consequential of its process exposure history. This metric schema also enables aligning risk determination and usage practices for used powder when based on a correlation between tabulated values in the scheme and user-identified metrics. These correlated metrics with schema values may also be used when establishing powder blending workflows or identifying end-of-life for feedstock.&lt;/div&gt;&lt;/div&gt;</p>
