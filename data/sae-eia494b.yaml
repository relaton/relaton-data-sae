  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this Standard is the definition of the response of a numerically controlled machine to a valid sequence of records made up of 32 bit binary words or ASCII text strings. The Standard defines the structure of these records and of the 32 bit binary words or ASCII text strings which make up the records.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard addresses the control of machines capable of performing 2, 3, 4, and 5 axis motion of an active tool (mill, laser, pen, etc.) relative to a part, and those capable of 2 and 4 axis tool motion relative to a rotating part (turning machines), including parallel tool slide sets capable of concurrent (merged) motion.&lt;/div&gt;&lt;/div&gt;</p>
