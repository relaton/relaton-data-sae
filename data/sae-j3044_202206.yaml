    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the test procedures for conducting rear impact occupant restraint and equipment mounting integrity tests for ambulance patient compartment applications. Its purpose is to describe crash pulse characteristics and establish recommended test procedures that will standardize restraint system and equipment mount testing for ambulances. Descriptions of the test set-up, test instrumentation, photographic/video coverage, and the test fixtures are included.&lt;/div&gt;&lt;/div&gt;</p>
