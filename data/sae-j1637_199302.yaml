  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a laboratory test procedure for measuring the vibration damping performance of a system consisting of a damping material bonded to a vibrating cantilevered steel bar. The bar is often called the Oberst bar (named after Dr. H. Oberst) and the test method is often called the Oberst Bar Test Method. Materials for damping treatments may include homogeneous materials, nonhomogeneous materials, or a combination of homogeneous, nonhomogeneous, and/or inelastic (such as aluminum foil) materials. These materials are commonly installed in transportation systems such as ground vehicles, marine products, and aircraft to reduce vibration at resonance, and thus reduce the noise radiation from the vibrating surface. However, the test method described herein was developed to rank order materials used in PASSENGER VEHICLE APPLICATIONS with steel sheet metal and may not be fully applicable to other situations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Damping performance for most materials and systems varies as a function of both frequency and temperature. Accordingly, this test procedure includes provisions for measuring damping over a range of frequencies and temperatures found applicable to many transportation systems. The measured damping performance will be expressed in terms of composite loss factor, η&lt;sub&gt;c&lt;/sub&gt;, within the frequency range of approximately 100 to 1000 Hz, and over the useful temperature range for the given application. The term composite refers to the steel and damping material combination.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedure described here is based on the method described in ASTM E 756. However, this SAE document differs from the ASTM E 756 method in that the SAE practice specifies the bar material, the bar size, and the mounting conditions of the test samples. This document provides a means of rank ordering damping materials according to their composite loss factor values from test samples that represent typical passenger vehicle applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The ASTM E 756 should be followed to determine the damping properties of materials alone, including loss factor η, Young's modulus E, and shear modulus G.&lt;/div&gt;&lt;/div&gt;</p>
