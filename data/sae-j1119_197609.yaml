  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The compositions and mechanical properties are only suggested to ensure good weldability and good formability in conjunction with control of mechanical properties. &lt;i&gt;The particular design must be considered to ensure that the materials selected are compatible with the design.&lt;/i&gt; The indicated properties are intended to assure that the ROPS or FOPS will have meaningful resistance to brittle fracture. The impact toughness requirement is the conventional Charpy V Notch evaluation: it is primarily a quality control check and the indicated temperature does not directly relate to operating conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Three steel product categories are covered: hollow structural members, plates, bars and shapes, and castings.&lt;/div&gt;&lt;/div&gt;</p>
