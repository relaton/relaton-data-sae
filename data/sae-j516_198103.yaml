  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard is intended to document general and dimensional specifications for the various types and styles of hose fittings used in conjunction with hydraulic hoses specified in SAE J517 (June 1980), in hydraulic systems on construction and industrial equipment and commercial products. Also included are adapter unions. The basic design and dimensional features of the fittings shown are derived from existing industry practice and include the following types:&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Male Dryseal pipe thread type hose fittings shall be as shown in &lt;span class="xref"&gt;Figs. 1A&lt;/span&gt;-&lt;span class="xref"&gt;1C&lt;/span&gt; for the respective styles, and in &lt;span class="xref"&gt;Tables 1A&lt;/span&gt;-&lt;span class="xref"&gt;1F&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Male straight thread O-ring boss type hose fittings shall be as shown in &lt;span class="xref"&gt;Figs. 2A&lt;/span&gt; and &lt;span class="xref"&gt;2B&lt;/span&gt; for the respective styles, and in &lt;span class="xref"&gt;Tables 2A&lt;/span&gt;-&lt;span class="xref"&gt;2C&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Male 37-deg flared type hose fittings shall be as shown in &lt;span class="xref"&gt;Figs. 3A&lt;/span&gt;-&lt;span class="xref"&gt;3C&lt;/span&gt; for the respective styles, and in &lt;span class="xref"&gt;Tables 3A&lt;/span&gt;-&lt;span class="xref"&gt;3F&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Female 37-deg flared type hose fittings shall be as shown in &lt;span class="xref"&gt;Figs. 4A&lt;/span&gt;-&lt;span class="xref"&gt;7B&lt;/span&gt; for the respective styles and shapes, and in &lt;span class="xref"&gt;Tables 4A&lt;/span&gt;-&lt;span class="xref"&gt;4F&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Male 45-deg flared type hose fittings shall be as shown in &lt;span class="xref"&gt;Figs. 8A&lt;/span&gt; and &lt;span class="xref"&gt;8B&lt;/span&gt; for the respective styles, and in &lt;span class="xref"&gt;Tables 5A&lt;/span&gt;-&lt;span class="xref"&gt;5D&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Female 45-deg flared type hose fittings shall be as shown in &lt;span class="xref"&gt;Figs. 9A&lt;/span&gt;-&lt;span class="xref"&gt;12B&lt;/span&gt; for the respective styles and shapes, and in &lt;span class="xref"&gt;Tables 6A&lt;/span&gt;-&lt;span class="xref"&gt;6D&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Male flareless type hose fittings shall be as shown in &lt;span class="xref"&gt;Figs. 13A&lt;/span&gt; and &lt;span class="xref"&gt;13B&lt;/span&gt; for the respective styles, and in &lt;span class="xref"&gt;Tables 7A&lt;/span&gt; and &lt;span class="xref"&gt;7B&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Female flareless type hose fittings shall be as shown in &lt;span class="xref"&gt;Figs. 14A&lt;/span&gt;-&lt;span class="xref"&gt;14C&lt;/span&gt; for the respective styles, and in &lt;span class="xref"&gt;Tables 8A&lt;/span&gt; and &lt;span class="xref"&gt;8B&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;4-bolt split flange type hose fittings shall be as shown in &lt;span class="xref"&gt;Figs. 15A&lt;/span&gt;-&lt;span class="xref"&gt;21C&lt;/span&gt; for the respective styles and shapes, and in &lt;span class="xref"&gt;Tables 9A&lt;/span&gt;-&lt;span class="xref"&gt;9D&lt;/span&gt; for the applicable hoses and sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Adapter unions shall be as shown in &lt;span class="xref"&gt;Figs. 22&lt;/span&gt;-&lt;span class="xref"&gt;25&lt;/span&gt; and &lt;span class="xref"&gt;Table 10&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recommended that where step sizes or additional types of fittings are required, they be designed to conform with the specifications of this standard insofar as they may apply.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications shall supplement the dimensional data contained in the tables with respect to all unspecified detail.&lt;/div&gt;&lt;/div&gt;</p>
