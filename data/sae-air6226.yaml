  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Most of the Trimmable Horizontal Stabilizer Actuators (THSA) feature a dual structural load path, the primary load path being loaded, the secondary load path being normally unloaded, or both load paths sharing in parallel the Horizontal Stabilizer load. This document describes existing methods for detecting rupture or disconnection of loaded load paths as an overview for those specifying or designing Horizontal Stabilizer Trim Actuators in order to compare existing solutions as reference for implementation in new aircraft programs.&lt;/div&gt;&lt;/div&gt;</p>
