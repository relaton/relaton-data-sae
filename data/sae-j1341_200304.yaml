  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The testing technique outlined in this SAE Recommended Practice was developed as part of an overall program for testing and evaluating fuel consumption of heavy-duty trucks and buses. The technique outlined in this document provides a general description of the type of equipment and facility which is necessary to determine the power consumption of these engine driven components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recommended that the specific operating condition suggested throughout the test be carefully reviewed on the basis of actual data obtained on the specific vehicle operation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers evaluation techniques for determining the power consumption characteristics of hydraulic pumps used on heavy-duty trucks and buses.&lt;/div&gt;
    &lt;/div&gt;</p>
