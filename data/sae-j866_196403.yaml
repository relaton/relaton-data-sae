  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to provide a uniform means of identification which may be used to describe the initial friction characteristics only of brake blocks (see SAE J660, Brake Linings) for use on commercial vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: It is emphasized that this recommended practice does not establish friction requirements for brake blocks, nor does it designate other significant block characteristics which must also be considered in overall brake performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The basis for determining the friction coefficients for brake blocks are tests conducted in accordance with SAE J661, Brake Lining Quality Control Test Procedures.&lt;/div&gt;&lt;/div&gt;</p>
