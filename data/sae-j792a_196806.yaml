  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Blast cleaning may be defined as a secondary manufacturing process in which a suitable stream of solid particles is propelled with sufficient velocity against a work surface to cause a cleaning or abrading action when it comes in contact with the workpiece.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;As indicated in the definition, blast cleaning may be employed for a variety of purposes. Ordinarily, it is considered as a method for removing sand from castings, burrs or scale from forgings, mill products, or heat treated parts; to promote machinability, and to minimize the possibility of interference in actual operation. In addition to this use, blast cleaning also produces an excellent surface for industrial coatings. All these objectives are often accomplished in the one operation.&lt;/div&gt;


    &lt;/div&gt;</p>
