  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This user's manual provides additional information and references relevant to identifying: (1) acceptance criteria for the indirect effects of lightning compliance approaches, (2) verification (analysis and test) methods including those associated with multiple stroke and multiple burst and (3) recommended design options to optimize needed system immunity to lightning indirect effects. Equipment hazards addressed include those due to the indirect effects on equipment mounted on the aircraft exterior and equipment located within the aircraft interior as well as all associated interconnecting wiring. This document has specific application toward those topics and subsystems addressed in ARP5413 but also provides additional guidelines in the application of those tests identified in DO-160/ED-14, Section 22.&lt;/div&gt;
    &lt;/div&gt;</p>
