  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document, expanding upon AIR6037A, provides technical specifications and operational protocols for instruments commonly used to measure aircraft engine nonvolatile Particulate Matter (nvPM) Particle Size Distributions (PSDs). For each instrument type, its functionality, calibration, uncertainties, and known limitations are discussed to support the development of procedures that help ARP6320B nvPM system operators reliably determine PSDs. Practical setup considerations, such as sample conditioning and instrument positioning, are highlighted, together with guidelines for maintenance, data correction, and quality control to minimize measurement uncertainty.&lt;/div&gt;&lt;/div&gt;</p>
