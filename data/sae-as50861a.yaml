    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers polyvinyl chloride insulated single conductor electric wires made with tincoated copper conductors or silver-coated copper alloy conductors as specified in the applicable detail specification. The polyvinyl chloride insulation of these wires may be used alone or in combination with other insulating or protective materials.&lt;/div&gt;&lt;/div&gt;</p>
