  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the general and dimensional data for various types of ball joints with inch threads commonly used on control linkages in automotive, marine, and construction and industrial equipment applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Inasmuch as the load carrying and wear capabilities of ball joints vary considerably with their design and fabrication, it is suggested that the manufacturers be consulted in regard to these features and for recommendations relating to application of the different types and styles available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The inclusion of dimensional data in this standard is not intended to imply that all the products described are stock production sizes. Consumers are requested to consult with manufacturers concerning availability of stock production parts.&lt;/div&gt;&lt;/div&gt;</p>
