    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers minimum requirements for skid control equipment for use on all types and models of civil aircraft. It shall be the responsibility of the applicant to determine the compatibility of these requirements with the application aircraft and to specify requirements in excess of these minimums as necessary.&lt;/div&gt;&lt;/div&gt;</p>
