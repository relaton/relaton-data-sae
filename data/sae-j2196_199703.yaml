    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers reinforced rubber, reinforced thermoplastic, or otherwise constructed hose, or hose assemblies, intended for conducting liquid and gaseous refrigerants for service connections from mobile air conditioning systems to service equipment such as a manifold gauge set and vacuum pumps or for use internally, in charging stations or service equipment intended for use in servicing mobile air-conditioning systems.&lt;/div&gt;
