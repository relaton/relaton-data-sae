    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers procedures and requirements for dry peening the surfaces of metals by impingement of metallic shot or glass beads for the purpose of increasing the fatigue strength and resistance to stress corrosion cracking by inducing residual compressive stresses in specified surfaces.&lt;/div&gt;&lt;/div&gt;</p>
