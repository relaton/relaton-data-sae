  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides Nuclear, Biological and Chemical (NBC) protection considerations for environmental control system (ECS) design. It is intended to familiarize the ECS designer with the subject in order to know what information will be required to do an ECS design where NBC protection is a requirement. This is not intended to be a thorough discussion of NBC protection. Such a document would be large and would be classified. Topics of NBC protection that are more pertinent to the ECS designer are discussed in more detail. Those of peripheral interest, but of which the ECS designer should be aware are briefly discussed. Only radiological aspects of nuclear blast are discussed. The term CBR (Chemical, Biological, and Radiological) has been used to contrast with NBC to indicate that only the radiological aspects of a nuclear blast are being discussed. This is actually a more accurate term to describe the subject of this paper, but NBC has become more widely used in the aircraft industry.&lt;/div&gt;&lt;/div&gt;</p>
