  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Evaluation of the energy absorbing properties of the steering wheel assembly of a motor vehicle, or of the relative merit of alternative designs of such assemblies, is a complex problem involving human tolerance, vehicle and occupant dynamics during an accident, and frequency and severity of injuries to various body areas.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Two fundamental approaches are being used currently for steering wheel assembly evaluations: laboratory impact tests of varying degrees of complexity, and simulated collision tests. This SAE Recommended Practice describes a simplified laboratory procedure for evaluating the characteristics of steering wheel assemblies under simulated driver impact conditions. Basically, the test procedure employs a torso shaped body block which is impacted against the steering wheel assembly and the transmitted load-time history is measured.&lt;/div&gt;&lt;/div&gt;</p>
