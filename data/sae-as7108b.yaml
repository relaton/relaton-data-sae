  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for suppliers of Chemical Processing Services to be accredited by Nadcap. Nadcap accreditation is granted in accordance with SAE AS7003 after demonstrating compliance with the requirements herein. These requirements may be supplemented by additional requirements specified by Nadcap Chemical Processes Task Group. Using the audit checklist (AC7108) will ensure that accredited Chemical Process suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;&lt;/div&gt;</p>
