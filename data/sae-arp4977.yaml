  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes standard methods for drying commercial aircraft composite structures prior to repair and gives general guidelines on use and applicability.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It addresses the removal of liquids that have collected inside the structures through open damage, microcracks, or porosity and the removal of absorbed moisture from the composite material. The methods described in this document shall only be used when specified in an approved repair document or with the agreement of the original equipment manufacturer (OEM) or regulatory authority. If this document is used for the drying of materials other than thermosetting composite materials, the fitness for this purpose must be determined by the user.&lt;/div&gt;
    &lt;/div&gt;</p>
