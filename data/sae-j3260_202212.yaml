  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice is intended to provide general guidelines for the selection and proper use of cleaning and disinfecting product characteristics acceptable for use on vehicle interiors and exterior touch points (cleaning before disinfecting being best practice in general for vehicles, as with other situations), and the effectiveness of the disinfecting products with certain characteristics, as well as indicating the product characteristics that will not cause damage to those surfaces.&lt;/div&gt;&lt;/div&gt;</p>
