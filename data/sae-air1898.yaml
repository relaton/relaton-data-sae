  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) covers, and is restricted to, hands-on servicing/maintenance of industrial lead acid batteries used solely for motive power and exclusively for ground support equipment (GSE). It does not address or pertain to automotive-type SLI (starting-lighting-ignition) batteries or any other types of batteries (such as nickel-cadmium, zinc, or lithium batteries) which may be on-board airport GSE for either motive power or auxiliary uses. Similarly, the battery servicing and charging facilities described herein are those intended exclusively for industrial lead acid batteries.&lt;/div&gt;
    &lt;/div&gt;</p>
