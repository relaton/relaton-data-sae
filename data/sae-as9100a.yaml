  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;&lt;i&gt;This standard includes ISO 9001:1994&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; quality system requirements and specifies additional requirements for the quality system of the aerospace industry.&lt;/i&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;&lt;i&gt;For those not involved in design activities (ref. ISO 9002:1994), &lt;span class="xref"&gt;4.4&lt;/span&gt; is not applicable.&lt;/i&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;&lt;i&gt;It is emphasized that the quality system requirements specified in this standard are complementary (not alternative) to the contractual and applicable law and regulatory requirements.&lt;/i&gt;&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;</p>
