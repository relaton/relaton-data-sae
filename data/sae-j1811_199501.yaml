  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines the terminals that carry the electrical current developed in the main cranking circuit of the starting systems used in off-road machinery as described in SAE J1116. These systems normally use batteries as described in SAE J537 and J930. The terminals addressed by this document are primarily used to connect batteries, cranking motors, solenoids, magnetic switches, and master disconnect switches with power cable assemblies.&lt;/div&gt;
    &lt;/div&gt;</p>
