  content: |-
    <p>&lt;p&gt;This specification covers an aluminum alloy in the form of hand forgings procured to metric dimensions. AMS 4247 is the inch/pound version of this MAM.&lt;/p&gt;
    &lt;p&gt;These forgings have been used typically for parts requiring a combination of high strength and resistance to stress-corrosion cracking and for parts requiring stability during machining, but usage is not limited to such applications.&lt;/p&gt;</p>
