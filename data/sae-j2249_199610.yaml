  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to WTORS comprised of a system or device for wheelchair tiedown and a system or device for restraining the wheelchair-seated occupant. It specifies design requirements, test methods, and performance requirements for WTORS, requirements for manufacturer’s instructions to installers and users, and requirements for product marking and labeling. This document places particular emphasis on design requirements, test procedures, and performance requirements for the dynamic performance of WTORS in a 48-km/h, 20-g frontal impact. It also specifies test procedures and performance requirements for webbing slippage at adjustment devices of strap-type wheelchair tiedowns, and for partial but ineffective engagement of wheelchair tiedowns, and tiedown components that could be perceived to be effectively engaged. &lt;span class="xref"&gt;Appendix F&lt;/span&gt; includes additional recommendations for WTORS that will enhance the design, performance, installation, and use of WTORS, but which are not, at this time, required for compliance with this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The contents of this document apply to WTORS used with forward-facing wheelchair-seated children and adults, and apply to passengers and drivers of personally licensed motor vehicles as well as to passengers of motor vehicles used in public and school transportation. While much of the focus of this document is on WTORS that use four-point wheelchair tiedown systems, unless otherwise specified, the provisions of this document are applicable to all types of WTORS, including those that use docking-type wheelchair tiedowns.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While the primary focus of this document is a WTORS that is packaged by the manufacturer as a complete system or kit, it is recognized that a significant portion of the WTORS market consists of separate WTORS components and subassemblies, such as anchorage track that is sold to the bus manufacturer, or securement and restraint assemblies that are sold to the transit provider. Manufacturers of such WTORS components and subassemblies may certify their equipment as being in compliance with this document provided that:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The subassemblies and components intended to be used together to create a WTORS meet all the appropriate requirements of this document, and&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The separately sold components and subassemblies are provided with instructions in accordance with &lt;span class="xref"&gt;5.5&lt;/span&gt;, where the word “compatible” means tested together to comply with this document.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
