abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the system and component functions, measurement metrics, and testing methodologies for evaluating the functionality and performance of tire pressure systems for use on trailers under 26000 pounds GVWR within the known operating environments.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is applicable to all towed trailers under 26000 pounds GVWR. Examples of towed trailers are recreational vehicle travel trailers and fifth wheels, utility trailers, cargo trailers, livestock trailers, flatbed trailers, boat trailers, and snowmobile trailers. These trailers can be equipped with one, two, or three axles with each axle supporting either two or four tires.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These systems are recommended to address all tires in service as originally installed on a trailer by the OEM. This recommended practice can also be applied to external TPMS that also cover tow vehicles and trailers simultaneously.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document will focus on tire pressure systems of the monitoring type.&lt;/div&gt;
    &lt;/div&gt;</p>
