  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE J1939 series of recommended practices are intended for light- and heavy-duty vehicle uses on or off road as well as appropriate stationary applications which use vehicle derived components (e.g., generator sets). Vehicles of interest include, but are not limited to: on- and off-highway trucks and their trailers, construction equipment, and agriculture equipment and implements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of these documents is to provide an open interconnect system for on-board electronic systems. It is the intention of these documents to allow electronic devices to communicate with each other by providing a standard architecture.&lt;/div&gt;&lt;/div&gt;</p>
