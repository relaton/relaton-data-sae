  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This drawing and dimensional data documents the typical transmission interface dimensions that are used with 14 in and 15½ in pull-type clutches. It is intended to provide dimensional guidelines for current and future designs and thus promote interchangeability between various clutch and transmission combinations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Due to the variety of clutches and transmission mounted clutch housings, it has been found that no standard clearance envelope can be established without imposing design restrictions. Therefore, it is recommended that any specific combination be verified for clearance before incorporating in design.&lt;/div&gt;
    &lt;/div&gt;</p>
