  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document derives from combining the driving cycle from the European Commission’s Worldwide harmonized Light Vehicle Test Procedure (WLTP-Brake cycle) and cyclic corrosion with humidity, temperature, and salt spray from SAE J2334. This document applies to vehicles with an internal combustion engine, a rechargeable energy storage system, or both as a source for propulsion. These cycles apply to passenger and light-duty vehicles with a Gross Vehicle Weight Rating of 3500 kg or below. Before using this document for other vehicle categories, the test requestor shall assess with the test facility the WLTP’s applicability, which applies to vehicles category 1-1 (carriage of persons with not more than eight seating positions in addition to the driver) and category 2 (carriage of goods) with a fully laden mass of 3500 kg or below.&lt;/div&gt;
    &lt;/div&gt;</p>
