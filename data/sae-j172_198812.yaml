    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the mechanical and chemical requirements of the best quality hard drawn carbon steel spring wire used for the manufacture of engine valve springs and other springs requiring high fatigue properties. It also covers the basic material and processing requirements of springs fabricated from this wire.&lt;/div&gt;&lt;/div&gt;</p>
