  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) specifies the minimum design and performance criteria and testing methods of passive fire resistant containers (FRCs) used either:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;In those cargo compartments of civil transport aircraft where they constitute one means of complying with applicable airworthiness regulations, or&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;On a voluntary basis, when deemed appropriate by operators to improve fire protection in aircraft cargo compartments where airworthiness regulations do not mandate their use.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
