  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This terminology aims to encompass all terms and definitions pertaining to the road performance of pneumatic tires designed for over-the-highway use, such as passenger car, light truck, truck and bus, and motorcycle tires. Not included are terms specific to the performance of agricultural, aircraft, industrial, and other off-highway tires. However, many terms contained in this document also apply to non-highway tires.&lt;/div&gt;&lt;/div&gt;</p>
