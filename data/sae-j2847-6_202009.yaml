abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J2847/6 establishes minimum requirements for communication between an electric vehicle and an inductive battery charging system for wireless power transfer (WPT). Where relevant, this document notes—but does not formally specify—interactions between the vehicle and vehicle operator.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document leverages the work of the SAE J2954 Alignment and Controls Sub-Team in the Wireless Power Transfer and Alignment Task Force by extending a JSON-based message set (protocol) originally developed to bench test wireless energy transfer interoperability between unmatched Ground Assembly (GA) and Vehicle Assembly (VA) systems (i.e., components manufactured by different companies). SAE J2847/6 furthers that work by adding messages sufficient to indicate that proper coil alignment has been achieved, initialize the sub-systems for wireless charging, ramp-up to full power, perform active wireless power transfer, and terminate the WPT session.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Guidance for an engineering implementation of the JSON protocol is provided as a reference for developing verification and validation of test plans by enabling the GA and VA to transmit a basic set of information using standard wireless IEEE 802.11n (Wi-Fi) communications hardware.&lt;/div&gt;
    &lt;/div&gt;</p>
