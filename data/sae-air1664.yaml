  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) includes general information about the various types and styles of flexible tanks and the tank-mounted fittings that adapt the tank to the surrounding structure and fluid-system plumbing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Recommendations are given relative to the dimensional layout of the tank when these recommendations serve to avoid tank fabrication problems and tank/structure interface problems. As a part of these recommendations, critical dimensions of plumbing adapter fittings are discussed and recommendations made. Tank manufacturing tolerances are given.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Recommendations are made relative to cavity design and preparation to facilitate a reliable installation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The special installation requirements of non-self-sealing, self-sealing, and crash-resistant tanks are discussed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is not intended to replace the information or requirements of the military and commercial procurement specifications listed in &lt;span class="xref"&gt;section 3&lt;/span&gt;. No attempt has been made, except in a very general way, to include physical property data such as weight and thickness of the composite materials available in the industry. Such materials are too numerous and vary too much between manufacturers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Whenever specific data or advice is required, it is necessary that the tank manufacturers be consulted.&lt;/div&gt;&lt;/div&gt;</p>
