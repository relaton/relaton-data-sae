    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) applies to performance and testing of solid chemical oxygen generators which produce oxygen at essentially ambient pressure for use aboard aircraft whose cabin pressure altitude does not exceed 40,000 ft (about 12,200 m). Portable chemical oxygen devices are covered by AS1303.&lt;/div&gt;&lt;/div&gt;</p>
