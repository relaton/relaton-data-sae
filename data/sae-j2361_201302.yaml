abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard covers military engine oils suitable for preservation,
    break-in, and lubrication of reciprocating internal combustion engines of both
    spark-ignition and compression-ignition types and of power transmission fluid
    applications in equipment used in combat/tactical service (see 7.1). This document
    is equivalent to MIL-L-21260 when all requirements are met.</p>"
