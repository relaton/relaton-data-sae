  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to expressly describe the method of calculating state of health (SOH) related to the on-road traction battery management systems (BMS). This document will attempt to clearly educate and explain four key areas of BMS SOH: (1) basic SOH definition, (2) SOH calculation methods, (3) influence items for SOH, and (4) SOH reporting.&lt;/div&gt;

    &lt;/div&gt;</p>
