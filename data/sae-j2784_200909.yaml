    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is derived from the Federal Motor Vehicle Safety Standards 105 and 135 vehicle test protocols as single-ended inertia-dynamometer test procedures. It measures brake output, friction material effectiveness, and corner performance in a controlled and repeatable environment. The test procedures also include optional sections for parking brake output performance for rear brakes. It is applicable to brake corners from vehicles covered by the FMVSS 105 and 135 when using the appropriate brake hardware and test parameters. The FMVSS 135 is applicable to all passenger cars and light trucks up to 3500 kg of GVWR. The FMVSS 105 is applicable to all passenger cars, multi-purpose vehicles, buses, and trucks above 3500 kg of GVWR. This document does not include testing for school bus applications or vehicles equipped with hydraulic brakes with a GVWR above 4540 kg.&lt;/div&gt;
    &lt;/div&gt;</p>
