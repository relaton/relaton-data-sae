  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report discusses the significant factors which measure the effectiveness of the total occupant restraint system in commonly encountered collision configurations. The total system includes the components which affect occupant injury by influencing the manner in which the collision energy management is accomplished. In addition to the elements that contribute to impact attenuation, consideration must be given to factors that encourage maximum use, such as comfort, reliability, appearance, and convenience. Hence, system evaluation necessarily involves consideration of the complete vehicle.&lt;/div&gt;&lt;/div&gt;</p>
