abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard applies to trenchers as categorized in SAE J1116.  Only those terms not covered by SAE J1234 are described herein.  The illustrations used are for clarification and are not intended to resemble a particular machine.  Only basic working dimensions are given.  They may be supplemented by the machine manufacturer.  It is intended for this document to apply to any size trenching machine since many of the features of larger machines are found on smaller trenching machines as well.
    Purpose
    This SAE document defines classification, nomenclature, and dimensional specifications for trenching machines.</p>
