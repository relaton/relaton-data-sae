  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice (RP) aids in the identification, handling, and shipping of lithium batteries to and from specified locations. It is the specific intent of this RP to identify, utilize, and reference existing U.S. and international hazardous materials (dangerous goods) transportation regulations, which are the only methodologies to be used to establish transportability. It is also the intent of this RP to provide recommendations to be used by service and shipping personnel for the purpose of determining a possibly damaged/defective battery’s transportability. In support of the service and shipping personnel, these recommendations seek to use standard tools of the trade and avoid laboratory-type equipment.&lt;/div&gt;
    &lt;/div&gt;</p>
