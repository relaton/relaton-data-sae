  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Common Interface Control Plan (CICP) establishes the methodology for developing, controlling and managing the technical interfaces between and within systems. The document is not intended to directly control any other aspects of program management, such as matters of contractual, financial or those of an intellectual property rights nature. Members in the interface control process include: procurement authorities, design authorities and other related agencies as defined in the specific System Interface Control Plan (SICP). For the purposes of this plan only the terms Procuring Organization and Producing Organization will be used. This plan is predicated upon formal agreements between participating organizations that provide:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Authority to participate in Interface Control Working Group (ICWG) and decision making processes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Primary integration control, interface problem resolution, and interface impact assessments through the ICWG.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Higher level interface management under the purview of the appellate process as defined by this document and in the SICP.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
