abstract:
- language: en
  script: Latn
  content: |-
    <p>This model guidelines define performance-based technician training. Essential training program elements supported by a systematic process for development are also identified.

    This set of guidelines is to be used as a model for the preparation of a training program for technician.  A training program can be developed internally or by external suppliers.  In either case the elements identified in this model should be used in the development of a training program.</p>
