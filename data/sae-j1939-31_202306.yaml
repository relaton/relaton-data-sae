  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1939-31 network layer describes the requirements and services for network interconnection ECUs (NIECU) that enable electronic control units (ECUs) on an SAE J1939 network segment to intercommunicate with other ECUs on different network segments of the vehicle or system network. This document defines various types of NIECUs. The information in this document applies only to ECUs that are intended to provide networking services. It is not necessary for an ECU to provide any of these services in order to be compliant with the SAE J1939 protocol.&lt;/div&gt;&lt;/div&gt;</p>
