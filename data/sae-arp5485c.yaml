  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to provide the sample selection and endurance time test procedures for SAE Type II, III, and IV aircraft deicing/anti-icing fluids, required for the generation of endurance time data of acceptable quality for review by the SAE G-12 Holdover Time Committee.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The related standard ARP5718 provides the process by which endurance time data is converted to holdover times for publication by regulators and subsequent use by aircraft operators.&lt;/div&gt;&lt;/div&gt;</p>
