  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides measurement methods to determine HUD optical performance in typical automotive ambient lighting conditions. It covers indoor measurements with simulated outdoor lighting for the measurement of HUD virtual images. HUD types addressed by this standard includes w-HUD (windshield HUD) and c-HUD (combiner HUD) with references to Augmented Reality (AR) HUD as needed. It is not the scope of this document to set threshold values for automotive compliance; however, some recommended values are presented for reference.&lt;/div&gt;&lt;/div&gt;</p>
