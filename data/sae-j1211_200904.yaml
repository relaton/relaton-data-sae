abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document addresses robustness of electrical/electronic modules for use in automotive applications. Where practical, methods of extrinsic reliability detection and prevention will also be addressed. This document primarily deals with electrical/electronic modules (EEMs), but can easily be adapted for use on mechatronics, sensors, actuators and switches. EEM qualification is the main scope of this document. Other procedures addressing random failures are specifically addressed in the CPI (Component Process Interaction) &lt;span class="xref"&gt;section 10&lt;/span&gt;. This document is to be used within the context of the Zero Defect concept for component manufacturing and product use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recommended that the robustness of semiconductor devices and other components used in the EEM be assured using SAE J1879 OCT2007, Handbook for Robustness Validation of Semiconductor Devices in Automotive Applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The emphasis of this document is on hardware and manufacturing failure mechanisms, however, other contemporary issues as shown in &lt;span class="xref"&gt;Figure 1&lt;/span&gt; need to be addressed for a thorough Robustness Validation. A Pareto of contemporary issues is shown in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;. Although this document addresses many of the issues shown, however some are outside the scope of this document and will need to be addressed for a thorough RV process application. Examples of issues outside the scope of this document are system interactions, interfaces, functionality, HMI (Human-Machine Interface) and software. At the time of publication of this handbook, a system level Robustness Validation handbook, which addresses these issues, had been initiated.&lt;/div&gt;

    &lt;/div&gt;</p>
