    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AS covers Underwater Locating Devices (ULD) to assist in finding flight recorders, cockpit recorders or aircraft or both. Such ULDs are to be installed adjacent to the recorders in a manner that they are unlikely to become separated during crash conditions.&lt;/div&gt;
