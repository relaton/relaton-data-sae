  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes the performance requirements for the control of the electromagnetic emission and susceptibility characteristics of electronic, electrical, and electromechanical equipment and subsystems designed or procured for use in severe electromagnetic environments such as ships, aircraft, spacecraft, armored vehicles, etc. Such equipment and subsystems may be used independently or as an integral part of other subsystems or systems.&lt;/div&gt;&lt;/div&gt;</p>
