    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;As described in the parent document, SAE J1939, there are a minimum of seven documents required to fully define a SAE J1939 network. This particular document, SAE J1939-21, describes a Data Link Layer using the CAN protocol with 29 bit Identifiers. For SAE J1939, no alternative data link layers are permitted.&lt;/div&gt;&lt;/div&gt;</p>
