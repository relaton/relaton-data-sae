    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Icing Technology Bibliography is a compendium of references from the open literature, including both national and foreign sources. Due to the generality of the subject, and the difficulty of fully investigating every available source, the present Bibliography is not intended to be complete. However, it will be updated every 18 months by the SAE AC-9C Aircraft Icing Technology Subcommittee. Any suggestions in terms of additional references, sources, and corrections should be referred to the Icing Technology Bibliography Panel of the SAE AC-9C Aircraft Icing Technology Subcommittee.&lt;/div&gt;&lt;/div&gt;</p>
