abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for heat-treatment of four classes of steel (see &lt;span class="xref"&gt;1.2&lt;/span&gt;) and the requirements for furnace equipment, test procedures and information for heat-treating procedures, heat-treating temperatures and material (see &lt;span class="xref"&gt;6.11&lt;/span&gt;) test procedures. It is applicable to all heat treatment of parts and to only the heat treatment of mill products which could affect its fabricability or the properties of parts. This specification also describes procedures which, when followed, will produce the desired properties and material qualities within the limitations of the respective alloys tabulated in &lt;span class="xref"&gt;Tables IA&lt;/span&gt;, &lt;span class="xref"&gt;IB&lt;/span&gt;, &lt;span class="xref"&gt;IC&lt;/span&gt; and &lt;span class="xref"&gt;ID&lt;/span&gt;. Alloys other than those specifically covered herein may be heat treated using all applicable requirements of this specification.&lt;/div&gt;
    &lt;/div&gt;</p>
