abstract:
- language: en
  script: Latn
  content: |-
    <p>This standard covers the hardness and microstructural requirements for malleable iron castings - ferritic, pearlitic, tempered pearlitic, and tempered martensitic grades used in automotive and allied industries. Castings shall be heat treated to meet this SAE Standard. The Appendix provides general information on the application of malleable iron castings and their chemical composition to meet hardness, microstructure, and other properties needed for particular service conditions. The mechanical properties in the Appendix are provided for design purposes.

    The specific grades, hardness range, and final heat treatment are shown in Table 1.</p>
