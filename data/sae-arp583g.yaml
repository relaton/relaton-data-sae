  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to provide guidelines for the design and location of flight attendant stations, including emergency equipment installations at or near such stations, so as to enable the flight attendant to function effectively in an emergency situation, either in-flight or during an evacuation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Recommendations regarding the design of flight attendant stations shall apply to all such stations; such recommendations relative to location shall apply to those stations which are located near or adjacent to floor level exits.&lt;/div&gt;&lt;/div&gt;</p>
