    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for 24° cone flareless fluid connection fittings and nuts, internally or externally swaged or welded sleeves or tube end adapters used only with flareless fittings and bite type flareless sleeves (see &lt;span class="xref"&gt;Section 6&lt;/span&gt;) for use in aircraft fluid systems at nominal operating pressures up to and including 3000 psi.&lt;/div&gt;&lt;/div&gt;</p>
