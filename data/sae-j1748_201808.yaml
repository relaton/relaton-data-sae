    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to determining worst-case fuel or test fluid surrogate, conditioning test specimens in worst-case fuel(s)/surrogate(s) prior to testing, individual tests for properties of polymeric materials exposed to oxygenate fuel/surrogate mixtures with additives. The determination of equilibrium, as well as typical calculations are also covered.&lt;/div&gt;
