  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers equipment used to remove refrigerant from a Mobile Thermal Management System to be sent for reclamation rather than on-site recycling. The refrigerant could be contaminated and should not be mixed with recycled refrigerant. This could also be any refrigerant that the technician is not going to recycle and reuse. The refrigerant could also be a blend or a refrigerant for which Recovery/Recycling/Recharging equipment is not available.&lt;/div&gt;


    &lt;/div&gt;</p>
