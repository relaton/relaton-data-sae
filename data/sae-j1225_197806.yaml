    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;The task force was assigned responsibility for the following activities:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Formulate a recommendation for an acceptable ride meter including features, functional performance, and design specifications.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Conduct a survey to determine if there is a commercially available ride meter conforming to the recommendation.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;If an acceptable ride meter is not commercially available, work with an electronics supplier to initiate a design and build a working prototype of a meter conforming to the recommendation.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;/div&gt;</p>
