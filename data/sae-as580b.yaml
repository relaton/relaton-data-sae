abstract:
- language: en
  script: Latn
  content: <p>This Aerospace Standard (AS) assures that new transport type aircraft
    will provide adequate visibility from the flight deck. Background - Prior to updating
    this AS, the committee re-evaluated flight deck visibility angles existing in
    transport aircraft produced up to 1975. In addition, studies and evaluations made
    by various airframe manufacturers were reviewed. As a result, this standard has
    been modified to provide more visibility in the critical areas that are most effective
    for collision avoidance.  The "three second rule" for landing has been retained
    unmodified even though some late model aircraft do not completely meet the rule.  The
    SAE Committee S-7, whose members represent a good cross section of operations
    personnel of the airline operators and manufacturers feel that it is still a desirable
    goal and no technical studies have been presented to show that a better standard
    would be more desirable.</p>
