  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the minimum design verification testing required to verify the suitability of in-tank mounted electric motor driven fuel pumps used for pumping gasoline or gasoline blend fuels.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Additional tests not specified in SAE J1537 will be required for frame mounted pump applications or pumps intended for use on aircraft, motorcycles, or marine equipment.&lt;/div&gt;
    &lt;/div&gt;</p>
