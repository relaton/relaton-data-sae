abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard covers engine military oils suitable for lubrication
    of reciprocating internal combustion engines of both spark-ignition and compression-ignition
    types, and for power transmission fluid applications in combat/tactical service
    equipment (see 7.1). This document is equivalent to MIL-PRF-2104G when all requirements
    are met.</p>"
