  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Differences, where they exist, are shown in Appendix A.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document specifies the quality aspects that are capable of definition but not normally found on a drawing specification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The difficulty of trying to define in absolute terms the quality attainable in normal commercial manufacture of piston rings is well known. In this document the commonly encountered aspects of quality in terms of casting defects and other departures from ideal are quantified. Many minor defects are clearly quite acceptable; other defects because of size or numbers are inadmissible.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers the following:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Single piece piston rings of grey, carbidic, malleable, spheroidal graphite cast iron or steel;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Multipiece piston rings (oil control rings) consisting of cast iron parts and spring components;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Single piece and multipiece rings of steel, i.e., oil control rings in the form of strip steel components or steel segments (rails) with spring expander components.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;In addition to specifying certain limits of acceptance relating to inspection measuring principles (covered by SAE J1589) this document also covers those features for which no recognized quantitative measurement procedures exist and which are only checked visually with normal eyesight and without magnification. Such features (superficial defects) are additional to the standard tolerances of ring width, radial wall thickness, and closed gap.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this document apply to all rings up to and including 200 mm diameter covered by the above classification for both reciprocating internal combustion engines and compressors.&lt;/div&gt;&lt;/div&gt;</p>
