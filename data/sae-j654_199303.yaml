    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended as a guide to the design and use of static and reciprocating elastomeric transmission seals. It has been prepared from existing literature, which includes standards, specifications, and catalog data of both producers and users and includes generally-accepted information and data. The main reason for the preparation of the document is to make standard information available in one document to the users of static and reciprocating elastomeric transmission seals.&lt;/div&gt;&lt;/div&gt;</p>
