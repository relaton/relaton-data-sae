abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document discusses formulae considered applicable to aircraft engines having integral supercharging without aftercooling, and using gasoline introduced at the entrance to the supercharger or directly into the cylinders. Such engines are normally designated as single and two speed engines. Correction formulae for engines having two stage or exhaust turbo supercharging will not be discussed. Corrections for engines having a high degree of integral supercharging will be discussed in general terms only and no specific formulae will be presented.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The correction formulae and methods listed are empirical and subject to error due to conditions beyond the scope of known corrections. Usage has indicated, however, that the correction formulae listed will provide a satisfactory approximation of power output under standard conditions.&lt;/div&gt;&lt;/div&gt;</p>
