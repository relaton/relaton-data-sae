  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides engineering methods that can be applied to monitoring aircraft noise and operations in the vicinity of airports using either attended or unattended monitoring systems, as well as methods for validation of measurement results from permanent systems. Part 1 provides guidance on the components, installation and administration of permanent systems and guidance on analysis of data collected from temporary monitoring of aircraft noise. A separate document, Part 2, describes both system screening tests and detailed test methods for validating the data reported by permanently installed systems. This document is intended as a guide toward standard practice and is subject to change with experience and technical advances.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Potential users include: airport proprietors, airport neighbors, federal, state and local government agencies, equipment vendors and other public bodies and officials. Potential applications include: Part 1 - development of a basis for communication among concerned parties for acquisition, installation and operation of a permanent monitoring system, and reduction of sound level data collected through temporary monitoring; Part 2 - initial system testing and detailed system validation and improvement.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommended practices included here are intended to apply to commercial air carrier airports and general-aviation airports.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The guidance in Part 1 of this document is intended for application to airport noise-monitoring systems that are designed and installed (or refurbished) after the publication date of the document. Part 1 also provides methods for analyzing data from temporary noise monitoring. The methods and information in Part 2 may be used for any permanent monitoring system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The primary topics addressed in this Part 1 are identified in seven subsections. &lt;span class="xref"&gt;Sections 2&lt;/span&gt; and &lt;span class="xref"&gt;3&lt;/span&gt; give References and Definitions. &lt;span class="xref"&gt;Sections 4&lt;/span&gt; through &lt;span class="xref"&gt;6&lt;/span&gt; provide guidance and information intended for those who have had little experience with the design, installation and use of permanent aircraft noise and operations monitoring system. &lt;span class="xref"&gt;Section 4&lt;/span&gt;, System Description, describes the basic components of a complete airport noise and operations monitoring system and gives minimum requirements. &lt;span class="xref"&gt;Section 5&lt;/span&gt;, Site Selection and Installation, describes what steps should be taken in locating noise monitors, and provides minimum requirements for monitor and microphone installation. &lt;span class="xref"&gt;Section 6&lt;/span&gt;, System Administration, describes basic administrative and maintenance activities necessary to ensure an installed system performs as intended.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Section 7 provides detailed guidance for making and reporting on aircraft noise measurements made using unattended portable noise monitors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Appendices provide related and additional information.&lt;/div&gt;&lt;/div&gt;</p>
