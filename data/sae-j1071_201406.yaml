abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard covers the relative position and direction of motion of controls which influence the movement of the machine and the operating direction only of equipment controls.

    There is no intention to eliminate or restrict the use of combination controls, automatic controls, or special operating controls.

    Purpose
    This document is intended as a guide for designing uniform operator controls for graders.  Graders are defined in SAE J/ISO 6165.</p>
