    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies those requirements and procedures for periodic tests to insure maintenance of balancing machine capabilities for balancing jet engine components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It will specify:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Requirements for tests.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Calibration tests.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(c)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Residual unbalance and accurate angle and amount indication tests.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(d)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Static-couple separation test.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;/div&gt;</p>
