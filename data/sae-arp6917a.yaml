  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides a procedure for exposing test slabs of fluoroelastomers, representative of those used in aviation gas turbine engines, to a lubricant for a period of 77 days at temperatures between 100 and 160 °C. Conditions outside those specified within the ARP can be used if required; however, the modification to this standard must be detailed alongside test results when reporting data.&lt;/div&gt;&lt;/div&gt;</p>
