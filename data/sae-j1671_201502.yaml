    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice contains dimensions and tolerances for outboard mounted brake drums and disc wheel hubs in the interface areas. This recommended practice is intended for outboard mounted brake drums and disc wheel hubs commonly used on class 7 and 8 commercial vehicles. Included are SAE J694 mounting systems II, III, IV, XIV, and X. Special and less common applications are not covered.&lt;/div&gt;
    &lt;/div&gt;</p>
