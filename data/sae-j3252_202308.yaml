  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report provides the process for developing a flexible test framework to support the creation of system-level cooperative driving automation (CDA) Feature test procedures, which are intended to be objective, repeatable, and transparent, and enable collaborative testing of the Feature. Utilizing a Feature’s functional and logical scenario details, it provides the building blocks necessary to develop cooperative automated driving system (C-ADS)-equipped vehicle (C-ADS-V) and CDA infrastructure (CDA-I) system diagrams, identify the interfaces to and from the systems, and identify the set of functional test support components specific to the CDA Feature. Utilizing these details, along with the Feature-specific concrete scenarios, a method for developing a test scope and system level use-case-focused test procedures is provided.&lt;/div&gt;
    &lt;/div&gt;</p>
