  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) examines the whole construct of an Engine Health Management (EHM) system. This keystone document gives a top-level view and addresses EHM description, benefits, and capabilities, and provides examples. This ARP purposely addresses a wide range of EHM architectures to demonstrate possible EHM design options. This ARP is not intended as a legal document and does not provide detailed implementation steps, but does address general implementation concerns and potential benefits. Other SAE documents (Aerospace Standards, Aerospace Recommended Practices, and Aerospace Information Reports) address specific component specifications, procedures and "lessons learned".&lt;/div&gt;
    &lt;/div&gt;</p>
