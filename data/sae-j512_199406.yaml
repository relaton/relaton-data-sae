  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers complete general and dimensional specifications for the various types of tube fittings intended for general application in the automotive, appliance, and allied fields. See SAE J1131 for the performance requirements of reusable (push to connect) fittings intended for use in automotive air brake systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Flare type fittings shall be as specified in &lt;span class="xref"&gt;Figures 1&lt;/span&gt; to &lt;span class="xref"&gt;4&lt;/span&gt; and &lt;span class="xref"&gt;Tables 3&lt;/span&gt; to &lt;span class="xref"&gt;5&lt;/span&gt;.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Inverted flared type fittings shall be as specified in &lt;span class="xref"&gt;Figures 5&lt;/span&gt; to &lt;span class="xref"&gt;11&lt;/span&gt; and &lt;span class="xref"&gt;Tables 3&lt;/span&gt;, &lt;span class="xref"&gt;6&lt;/span&gt;, &lt;span class="xref"&gt;7&lt;/span&gt;, &lt;span class="xref"&gt;8&lt;/span&gt;, and &lt;span class="xref"&gt;9&lt;/span&gt;. Gages and gaging procedures pertaining to inverted flared tube fittings are given in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Tapered sleeve compression type fittings intended for general use with annealed copper alloy tubings shall be as specified in &lt;span class="xref"&gt;Figures 12&lt;/span&gt; to &lt;span class="xref"&gt;17&lt;/span&gt; and &lt;span class="xref"&gt;Tables 3&lt;/span&gt;, &lt;span class="xref"&gt;10&lt;/span&gt;, &lt;span class="xref"&gt;11&lt;/span&gt;, and &lt;span class="xref"&gt;12&lt;/span&gt;. To assure satisfactory performance, spherical sleeve compression type fitting components (see SAE J246) should not be intermixed with tapered sleeve compression type fitting components when assembling connections in areas where both types are available.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensions of single and double 45 degree flares on tubing to be used in conjunction with flared and inverted flared fittings are given in Figure 2 and Table 3 of SAE J533.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data for all types of fittings contained in &lt;span class="xref"&gt;Tables 3&lt;/span&gt; to &lt;span class="xref"&gt;13&lt;/span&gt; with respect to all unspecified detail.&lt;/div&gt;&lt;/div&gt;</p>
