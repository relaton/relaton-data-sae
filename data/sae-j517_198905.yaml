  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides general, dimensional and performance specifications for the most common hoses used in hydraulic systems on mobile and stationary equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The general specifications contained in &lt;span class="xref"&gt;sections 1&lt;/span&gt; through &lt;span class="xref"&gt;11&lt;/span&gt; are applicable to all hydraulic hoses and supplement the detailed specifications for the 100R-series hoses contained in the later sections of this standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard shall be utilized as a procurement document only to the extent as agreed upon by the manufacturer and user.&lt;/div&gt;&lt;/div&gt;</p>
