  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the minimum requirements for seats and restraint systems for the flight deck.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Due to limitations that it would place upon basic aircraft design, it is not considered practical for these requirements to apply fully to the observer seat. However, it is emphasized that every effort should be made to provide the observer seat position with an equivalent level of comfort and safety.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is also intended to make recommendations for flight crew restraint systems. A properly designed crew restraint system will minimize injury or debilitation during a survivable crash and enable post crash assistance to occupants and escape from the aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Crew member safety is the primary objective, with appropriate provisions for crew comfort taken into consideration. The criteria established herein are designed to standardize restraint systems without hindering the development of new, improved systems.&lt;/div&gt;&lt;/div&gt;</p>
