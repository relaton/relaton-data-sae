  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice sets forth the procedures to be used only in measuring sound levels and the determination of the time weighted average sound level at the operator station(s) of powered mobile earthmoving machinery of 15 kW (20 bhp) and over. This Recommended Practice is applicable to earthmoving machinery which has operator station(s) where the operator can either stand or sit and is transported by the machinery during its operation. The Recommended Practice describes the instrumentation requirements and specifies work cycles for earthmoving machinery. The Recommended Practice describes the method used to calculate the time weighted average sound level at the operator station(s)—identified in this practice as L&lt;sub&gt;eq(5)&lt;/sub&gt;—for continuous operation on the work cycle. A method to relate the time weighted average sound level at the operator station(s) to operator sound exposure is also provided.&lt;/div&gt;&lt;/div&gt;</p>
