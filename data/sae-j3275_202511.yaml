  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides general and dimensional specifications for low-pressure quick connect hose fittings used in conjunction with hoses specified in SAE J20, SAE J30, and SAE J517 and utilized in fluid systems on mobile and stationary equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The fittings in this standard are compatible with SAE J2044.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document specifies hose fitting geometry. It does not specify fluid compatibility.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document shall be utilized as a procurement document only to the extent agreed upon by the manufacturer and user.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Refer to SAE J517 for information on hose assemblies. SAE J1273 contains information on application factors affecting hose fittings, hose, and hose assemblies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The rated working pressure of a hose assembly comprising SAE J3275 fittings and SAE J20, SAE J30, and SAE J517 hoses shall not exceed the lower of the two working pressure rated values.&lt;/div&gt;&lt;/div&gt;</p>
