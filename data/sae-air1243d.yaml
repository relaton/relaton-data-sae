    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides information on anti blow-by design practice for cap seals. Suggestions for piston cap seal sidewall notch design and other anti blow-by design details are also described. It also includes information on two key investigations based on the XC-142 as part of the text and as &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
