    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;FMECA is normally accomplished before, and provides basic information to, a reliability prediction. FMECA should be initiated as an integral part of the early design process of system functional assemblies and should be periodically updated to reflect design changes. An updated FMECA should be a major consideration in the design reviews, inspections and certifications.&lt;/div&gt;&lt;/div&gt;</p>
