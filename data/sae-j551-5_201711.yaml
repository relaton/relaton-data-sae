abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This SAE Recommended Practice specifies measurement procedures
    and performance levels for magnetic and electric field emissions and conducted
    power mains emissions over the frequency range 150 kHz to 30 MHz, for vehicles
    incorporating electric propulsion systems, e.g., battery, hybrid, or plug-in hybrid
    electric vehicles.&lt;/p&gt;\n  \n&lt;p&gt;Conducted emission measurements in
    this document are applicable only to battery-charging systems which utilize a
    switching frequency above 9 kHz, are mounted on the vehicle, and whose power is
    transferred by metallic conductors.  Conducted emission requirements apply only
    during charging of the batteries from AC power lines.&lt;/p&gt;\n  \n&lt;p&gt;Conducted
    and radiated emissions measurements of battery-charging systems that use an induction
    power coupling device are not covered by this document.&lt;/p&gt;\n  \n&lt;p&gt;The
    measurement of electromagnetic disturbances for frequencies from 30 MHz to 1000
    MHz is covered in CISPR 12.&lt;/p&gt;</p>"
