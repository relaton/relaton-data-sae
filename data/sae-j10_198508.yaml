  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard applies to all new production air brake reservoirs used in automotive vehicles and off-road machines. This standard defines an "air brake reservoir" as a reservoir having single or multiple compartments that is used for storage of compressed air. This standard does not apply to accumulators or reservoirs for storage of gases other than compressed air.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The reservoirs tested per these requirements shall be selected from production stock and shall be equipped with all permanently attached items such as mounting brackets and fitting bosses.&lt;/div&gt;&lt;/div&gt;</p>
