    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report is intended to provide design guidance in the selection of steel tubing and related tube fittings for general hydraulic system applications. The information presented herein is based on tubing products which conform to SAE and ISO standards listed in the reference section. All pressure rating data found in the charts included in this document are calculated per the formula found in ISO 10763 and the main body of this document.&lt;/div&gt;

    &lt;/div&gt;</p>
