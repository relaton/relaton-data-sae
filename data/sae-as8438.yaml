    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides details of test methods that should be taken into consideration when qualifying fiber optic termini to the product specifications (slash sheets). The product specifications (slash sheets) provide pass/fail criteria, optical and physical intermatability, and interoperability requirements for fiber optic termini in circular, rectangular, and modular type aerospace connectors.&lt;/div&gt;&lt;/div&gt;</p>
