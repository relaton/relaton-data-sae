  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Differences, where they exist, are shown in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice specifies the essential dimensional features of R, B, and M rectangular piston ring types with narrow ring width.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensional &lt;span class="xref"&gt;Tables 8&lt;/span&gt; and &lt;span class="xref"&gt;9&lt;/span&gt; allow for the use of cast iron (&lt;span class="xref"&gt;Table 8&lt;/span&gt;) or steel (&lt;span class="xref"&gt;Table 9&lt;/span&gt;). Since the modulus of elasticity of steel rings is higher than that of cast iron rings, the fluctuation in the surface pressure will become greater if the free gap is set as the reference for force. Therefore, forces are set using the surface pressure as the reference, in order to minimize the effect of the fluctuation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this document apply to rectangular rings for reciprocating internal combustion engines up to and including 90 mm diameter for cast iron rings and up to and including 100 mm diameter for steel. They may also be used for piston rings of compressors working under similar conditions.&lt;/div&gt;&lt;/div&gt;</p>
