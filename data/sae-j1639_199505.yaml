  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a system for classification and specification for limited number of polyamides (nylons) used in the Automotive Industry. Based upon ASTM D 4066, Classification System for Nylon Injection and Extrusion Materials (PA), it calls for additional descriptive characteristics and properties commonly used in the Automotive Industry.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to natural and non-color matched black, heat-stabilized polyamide compounds only. Color matched compounds shall be defined by the proprietary OEM standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document allows for the use of recycled, reconstituted, and regrind materials provided that the requirements as stated in this document are met, the material has not been altered or modified to change its suitability for safe processing and use, and the material shall be identified as such.&lt;/div&gt;
    &lt;/div&gt;</p>
