  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the test procedure, environment, instrumentation, and data analyses for comparing interior sound level of passenger cars, multipurpose vehicles, and light trucks having gross vehicle weight rating (GVWR) of 4540 kg (10 000 lb) or less.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedure is characterized by having fixed initial conditions (specified initial vehicle speed and gear selection at the starting point on the test site) to obtain vehicle interior sound measurement during road load operation over various road surfaces at specified constant speeds.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The measurement data so derived is useful for vehicle engineering development and analysis.&lt;/div&gt;
    &lt;/div&gt;</p>
