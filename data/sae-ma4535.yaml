  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Metric Aerospace Standard (MA) provides dimensional, performance, testing and other requirements for high strength, thin wall, double head box and combination wrenches which possess an internal wrenching design so configured that, when mated with hexagon (6 point) fasteners, they shall transmit torque to the fastener without bearing on the apex of the fastener's wrenching points. This standard provides additional requirements beyond ANSI B107.9 appropriate for aerospace use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Inclusion of dimensional data in this document is not intended to imply all of the products described therein are stock production sizes. Consumers are requested to consult with manufacturers concerning lists of stock production sizes.&lt;/div&gt;
    &lt;/div&gt;</p>
