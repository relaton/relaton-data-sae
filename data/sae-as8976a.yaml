    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers all metal plain spherical bearings which are self-aligning for use between 65 °F to 250 °F. This specification covers bearings with alloy steel races, aluminum bronze races, and an entierly CRES bearing (ball and race). All units are inches, unless otherwise stated.&lt;/div&gt;
