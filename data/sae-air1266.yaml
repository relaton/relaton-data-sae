    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR outlines concepts for the design and use of fault isolation equipment that have general application. However, the specific concern applies only to use with Environmental Control Systems in commercial transports. In particular, automatic Built In Test Equipment (BITE) with manual initiation and software programs are covered as systems already in use.&lt;/div&gt;&lt;/div&gt;</p>
