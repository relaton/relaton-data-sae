  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This coding system is intended to provide a convenient means of identifying the various tube, pipe, and hose fittings and of transmitting technical or engineering information relating to them wherever drawings or other pictorial media may not be readily available. The code has been kept flexible to permit expansion to cover new fitting categories or styles and, if the need develops, the inclusion of materials. The system is also compatible with automatic data processing equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not intended that this code should supersede established systems or means of identification. However, because the SAE code for automotive flare fittings shown in SAE J512 is also applicable to corresponding refrigeration fittings in SAE J513, both an SAE code and the existing code ANSI B70.1 are included throughout SAE J513. Therefore, it should be the prerogative of the user to apply that code which best satisfies his requirements.&lt;/div&gt;&lt;/div&gt;</p>
