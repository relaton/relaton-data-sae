  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is equivalent to ISO Standard 362-1981 except for the differences detailed in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;, and includes the modifications adopted by WP29 in ECE R51.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document specifies an engineering method for measuring the noise emitted by accelerating highway vehicles of all types (except motorcycles) in intermediate gears with full utilization of the available engine power.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The method is designed to meet the requirements of simplicity and reproducibility of results under realistic vehicle operating conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Measurements relate to operating conditions of the vehicle which give the highest noise level consistent with urban driving and which lead to reproducible noise emissions. Therefore, an acceleration test at full throttle from a stated engine or vehicle speed is specified.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test method calls for an acoustical environment which can only be obtained in an extensive open space.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;If measurements have to be carried out on the road in an acoustical environment which do not fulfill the requirements stated in this document, it should be recognized that the results obtained may deviate appreciably from the results obtained using the specified conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The results obtained by this method give an objective measure of the noise emitted under prescribed conditions of test. However, it is necessary to consider the fact that the subjective appraisal of the annoyance of different classes of motor vehicles is not simply related to the indications of a sound level meter.&lt;/div&gt;&lt;/div&gt;</p>
