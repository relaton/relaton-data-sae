  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion and heat-resistant nickel alloy in the form of bars up to 4.00 inches (101.6 mm) exclusive in nominal diameter or thickness, forgings 4.00 inches (101.6 mm) exclusive in nominal thickness, flash welded rings up to 4.00 inches (101.6 mm) exclusive in nominal radial thickness, and stock of any size for forging or flash welded rings (see &lt;span class="xref"&gt;8.6&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
