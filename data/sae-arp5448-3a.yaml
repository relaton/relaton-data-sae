    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method outlines a recommended procedure for performing unidirectional load dynamic testing of self-lubricating bearings at room temperature, elevated temperature or sub-zero temperature, dry or contaminated with fluids. The wear data from these tests is to be used for qualification and to establish bearing design criteria.&lt;/div&gt;&lt;/div&gt;</p>
