    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procurement specification covers aircraft premium quality bolts and screws made from a low alloy, heat resistant steel of the type identified under the Unified Numbering System as UNS K14675, having UNJ thread profile, and of 195 000 psi tensile strength at room temperature with maximum test temperature of parts at 900°F.&lt;/div&gt;&lt;/div&gt;</p>
