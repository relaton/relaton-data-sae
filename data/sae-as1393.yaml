  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes the design requirements for a fiber optic serial interconnect protocol, topology, and media. The application target for this standard is the interconnection of multiple aerospace sensors, processing resources, bulk storage resources and communications resources onboard aerospace platforms. The standard is for subsystem interconnection, as opposed to intra-backplane connection.&lt;/div&gt;
    &lt;/div&gt;</p>
