  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this MAP is to establish stud hole clearance diameters to accept standard Metric studs. This is based entirely on recommendations set forth by the International Organization for Standardization (ISO).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;ISO Recommendations R273, Clearance Holes for Metric Bolts (Fine series) and R286, ISO System of Limits and Fits (H14 series) were used to establish the size and tolerance for each stud hole in the MAP.&lt;/div&gt;
    &lt;/div&gt;</p>
