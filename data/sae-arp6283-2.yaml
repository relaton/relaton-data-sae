  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides user information on best practice methods and processes for the in-service inspection, evaluation, and cleaning of multi-fiber push on (MPO) (referred to as multi-fiber) fiber optic interconnect components, test equipment, and test leads based on the information provided in AIR6031 and ARP6283. This document provides the user with a decision-making tool to determine if the fiber optic components are acceptable for operation with multi-fiber fiber optic termini.&lt;/div&gt;&lt;/div&gt;</p>
