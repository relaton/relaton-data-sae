    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the requirements for non-separable, airframe anti-friction needle bearings, corrosion resistant and traditional materials, intended for use in flight vehicle control systems, with radial loads. Under Department of Defense (DoD) Policies and Procedures, any qualification requirements and associated Qualified Products Lists (QPLs) are mandatory for DoD contracts. Any material relating to QPLs have not been adopted by SAE and are not part of this SAE technical document.&lt;/div&gt;
    &lt;/div&gt;</p>
