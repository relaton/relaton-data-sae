  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies requirements for an Approach to Landing Guidance System (ALGS) electronic device. This equipment shall display relative aircraft position and situation information for flight along precision three-dimensional paths within the appropriate coverage area. The precision three-dimensional path may be an ILS straight-in look-alike path or a complex, curved path. The requirements are applicable to electronic devices capable of receiving signals or other information from one or more sources, including but not limited to ILS, GNSS, or IRU inputs.&lt;/div&gt;&lt;/div&gt;</p>
