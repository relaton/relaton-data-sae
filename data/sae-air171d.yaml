    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide a list of specialized terms with their meanings. The glossary will assist the use of other documents related to aircraft oxygen equipment by defining ubiquitous terminology in context of this specialized field. The glossary contains terms of primary importance in the areas of chemistry, equipment, and physiology.&lt;/div&gt;&lt;/div&gt;</p>
