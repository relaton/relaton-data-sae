  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines the test set-up requirements, general analysis procedures, and test report documentation for impact tests where photometric analysis of the high speed film or digital video will be required to obtain target paths (typically the Anthropomorphic Test Dummy (ATD) head path and knee path). Such tests support the requirements of AS8049 - Performance Standard for Seats in Civil Rotorcraft, Transport Aircraft and General Aviation Aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These setup and analysis procedures are applicable to conventional, geometry based, two-dimensional analysis. If a more sophisticated technique that allows cameras to be installed at oblique angles for two or three-dimensional analysis is used, then the specific procedures required by that technique supersede any conflicting procedures contained herein. Some of the requirements that could be superseded include camera placement, optical data channel evaluation, camera to subject measurements, and scaling procedures.&lt;/div&gt;&lt;/div&gt;</p>
