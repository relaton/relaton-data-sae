    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This publication lists the symbols used by manufacturers of electrical and electronic wiring devices and accessories to identify their products that are within the scope of SAE Subcommittees AE-8C1 and AE-8C2.&lt;/div&gt;
