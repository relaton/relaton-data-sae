  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers one type of a non-melting, heat stable silicone compound, for use in high tension electrical connections, ignition systems and electronics equipment, for application to unpainted mating threaded or non-threaded surfaces and as a lubricant for components fabricated from rubber. This compound is effective in the temperature range from -54 °C (-65 °F) to +204 °C (400 °F) for extended periods. This compound is identified by NATO symbol S-736 (see &lt;span class="xref"&gt;6.5&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
