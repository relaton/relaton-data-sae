abstract:
- language: en
  script: Latn
  content: "<p>This specification covers established metric manufacturing tolerances applicable to aluminum alloy standard structural shapes ordered to metric  dimensions.  Standard structural shapes are shapes in certain standard alloys, tempers, sizes, and sections such as angles, channels, Tees,  Zees, I-Beams, and H-Beams commonly used for structural purposes. These  tolerances apply to all conditions, unless otherwise noted. This specification has been declared 'NONCURRENT' by the Aerospace  Materials Division, SAE, as of September 1994.  It is recommended,  therefore, that this specification not be specified for new designs.</p>"
