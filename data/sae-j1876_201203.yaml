  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The material defined by this SAE document is an impact modified, heat stabilized, 66 nylon reinforced with glass fibers. This material is for use in dust shields for hydraulic disc brakes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE—The applicability of a plastic dust shield must be evaluated for each individual brake system. Its use with solid rotors and/or high performance brake systems is not recommended.&lt;/div&gt;&lt;/div&gt;</p>
