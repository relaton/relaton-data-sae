    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This glossary of tire military/industry represents the latest state-of-the-art terms and definitions for military use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE recommended practice shall remain open for comments from the reader and shall also be reviewed and updated periodically. Many similar terms and definitions were reviewed from which the ones best applied to military use were selected. It is the purpose of this task force to provide technical definitions in present day use.&lt;/div&gt;&lt;/div&gt;</p>
