  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes and defines requirements for grades of continuously cast automotive steel sheet that can be formed, welded, assembled, and painted in automotive manufacturing processes. These sheet steels can be specified as hot-rolled, cold-rolled, uncoated, or coated. Steel sheet can be coated by hot dipping, electroplating, or vapor deposition of zinc, aluminum, or organic compounds. Not all combinations of material types, strength levels, and coating types may be commercially available. Consult your steel supplier for availability.&lt;/div&gt;&lt;/div&gt;</p>
