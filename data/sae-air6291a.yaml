    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is intended to be used as a process verification guide for evaluating implementation of key factors in repair of metal bond parts or assemblies in a repair shop environment. This guide is to be used in conjunction with a regulatory approved and substantiated repair and is intended to promote consistency and reliability.&lt;/div&gt;
