    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides guidance for defining the requirements for evaluating hydraulic pumps and motors and for preparing detailed specifications for these components. The user can follow this document to set forth the pump and motor environmental and performance considerations, establish service life and reliability goals, and define specific evaluation tests for marine vehicle applications.&lt;/div&gt;
