    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice which defines the terms and tabulates the limits of the characteristics for various protective devices used in conjunction with 400-cycle ground power for civil aircraft is intended to assist the airlines in standardizing on 400-cycle protective systems. The limits found to be acceptable in the civil aircraft industry are presented.&lt;/div&gt;&lt;/div&gt;</p>
