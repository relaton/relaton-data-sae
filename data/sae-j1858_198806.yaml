  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes a multipass filtration performance test with continuous contaminant injection for lubricating oil filter elements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It also includes a procedure for determining the contaminant capacity, particulate removal characteristics, and pressure loss.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It also includes a test currently applicable to lubricating oil filter elements which exhibit a 10 μm filtration ratio of less than 75 and a rated flow between 4 and 600 L/min.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard provides a test procedure which yields reproducible test data for evaluating the filtration performance of a lubricating oil filter element.&lt;/div&gt;
    &lt;/div&gt;</p>
