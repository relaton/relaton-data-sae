  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method provides stakeholders (runway deicing chemical manufacturers, deicing/anti-icing chemical operators and airport authorities) with a relative ice penetration capacity of runway deicing/anti-icing chemicals, by measuring the ice penetration as a function of time. Such runway deicing/anti-icing chemicals are often also used on taxiways and other paved areas.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This test method does not quantitatively measure the theoretical or extended time of ice penetration capability of ready-to-use runway deicing/anti-icing chemicals in liquid or solid form.&lt;/div&gt;


    &lt;/div&gt;</p>
