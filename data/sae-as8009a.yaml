  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) specifies minimum performance requirements for primary pressure altimeter systems other than air data computers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AS covers altimeter systems that measure and display altitude as a function of atmospheric pressure. The pressure transducer may be contained within the instrument display case or located remotely. Requirements for air data computers are specified in AS8002. Some requirements for nontransducing servoed altitude indicators are included in AS791.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The instrument system specified herein does not include aircraft pressure lines. Unless otherwise specified, whenever the term "instrument" is used, it is to be understood to be the complete system of pressure transducer components, any auxiliary equipment, and display components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedures specified herein apply specifically to analog type instruments. Digital instruments or automatic test instrumentation may require other test procedures. Such differing procedures shall be justified prior to use.&lt;/div&gt;&lt;/div&gt;</p>
