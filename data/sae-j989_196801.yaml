  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide a uniform standard method of testing to determine the carbon monoxide concentration in the passenger compartment of vehicles to assure that the body design and tailpipe outlet location are not causing undesirable levels of CO under normal vehicle usage. The tests are conducted at idling speed, at 25 mph, and at 70-20 mph deceleration in an outdoor area where there is a minimum amount of environmental CO. This test procedure is to be used to determine self-contamination by CO only (except as noted in the first sentence of paragraph &lt;span class="xref"&gt;4.4&lt;/span&gt;) and is not applicable to measurement of ambient CO in traffic.&lt;/div&gt;&lt;/div&gt;</p>
