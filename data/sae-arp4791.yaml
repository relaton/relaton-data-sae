  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document sets forth functional, procedural, and design criteria and recommendations concerning human engineering of data link systems. For the most part, the recommendations are based on evidence from empirical and analytic studies of data link communication, and on experience from operational tests, and actual use of data link. Because the recommendations deal only with the available research, they are not comprehensive; data are not yet available to support recommendations on all potentially critical human engineering issues. Citations for the supporting research are embedded within the recommendations and a full list of references appears in &lt;span class="xref"&gt;Section 2&lt;/span&gt; of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Consistent with the focus of the research and operational development, this document focuses on recommendations for Air Traffic Control (ATC) communications, although data link systems are being designed to support flight information services, airline operational and administrative services, and passenger communication services. Unless otherwise specified within the text, all recommendations apply to both flight deck and ground-based data link systems.&lt;/div&gt;&lt;/div&gt;</p>
