    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide an overview of the techniques found in the published literature for rollover testing and rollover crashworthiness evaluation at the vehicle and component levels. It is not a comprehensive literature review, but rather illustrates the techniques that are in use or have been used to evaluate rollover crashworthiness-related issues.&lt;/div&gt;&lt;/div&gt;</p>
