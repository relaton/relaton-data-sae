  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The implemented Vehicle-to-Everything (V2X) infrastructure for CI must adhere to the minimum performance outlined in the CTI Implementation Guide (CTI 4501/1) to ensure interoperability basic RLVW application within vehicles. The basic RLVW application operates at the onset of the yellow phase during the yellow phase duration of a through movement. This assessment tool and procedure aims to confirm that the duration of the yellow phase, as generated by the Traffic Signal Control (TSC) system during the transition from green to yellow, is precise, and that the information broadcasted by the Roadside Unit (RSU) maintains a consistent periodicity for RLVW. A set of criteria has been established to evaluate and verify the performance of the CI.&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Conformance – The broadcast SPaT message adheres to:
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Required data elements for RLVW application as per CTI 4501&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Message structure and data format as outlined in SAE J2735&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Data values within the range specified in SAE J2735&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Periodicity – The CI infrastructure ensures consistent broadcast message periodicity.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Accuracy – The CI infrastructure assures the accuracy of signal phase status and timing information.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Latency – The CI infrastructure broadcasts messages in a timely manner.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;This document describes the following:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;An example test data acquisition system and procedure for collecting field data from a connected intersection&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Test scenarios to verify the real-world performance of a CI&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Analysis of broadcast message structure, data format and required data elements as per SAE J2735 and CTI 4501/1&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Analysis of broadcast SPaT message accuracy relative to the actual signal controller actions that represents the ground truth for signal phase start time and duration&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Analysis of SPaT information generation and processing latency from signal controller actions to message broadcast&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Analysis of stability and reliability of the information flow to connected vehicles&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
