abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a rigorous-engineering fuel-consumption test procedure that utilizes industry accepted data collection and statistical analysis methods to determine the change in fuel consumption for trucks and buses with gross vehicle weight rating (GVWR) of more than 10000 pounds, equipped with internal combustion engines using diesel, gasoline, or their liquid substitutes. The test procedure may be conducted on a test track or on a public road under controlled conditions and supported by extensive data collection and data analysis constraints. The on-road test procedure is offered as a lower cost alternative to on-track testing, but the user is cautioned that on-road test may result in lower resolution (or precision) data due to a lack of control over the test environment. Test results that do not rigorously follow the method described herein are not intended for public use and dissemination and shall not be represented as an SAE J1321-Type II test result. This document provides information that may be used in concert with SAE Recommended Practices SAE J1252, SAE J1264, SAE J1526, and SAE J2084, as well as additional current and future aerodynamic and vehicle performance SAE Standards.&lt;/div&gt;


    &lt;/div&gt;</p>
