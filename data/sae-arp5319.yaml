  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes and gives general guidelines on use and applicability of standard methods for impregnating dry fabric and lay-up of the impregnated plies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The methods of impregnating dry fabric and ply lay-up described in this document have specific application and are not interchangeable. The methods should only be used when specified in an approved repair procedure or with the agreement of the Original Equipment Manufacturer (OEM) or regulatory authority.&lt;/div&gt;
    &lt;/div&gt;</p>
