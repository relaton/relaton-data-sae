    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies a stationary test method for determining and documenting the masking effect caused by parts of the base machine with equipment as specified by the manufacturer within a visibility test circle around the eye position of a seated operator. It applies to earthmoving machinery which has a specific seated operator’s position.&lt;/div&gt;&lt;/div&gt;</p>
