abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines a set of standard application layer interfaces called &lt;i&gt;JAUS Core Services&lt;/i&gt;. JAUS Services provide the means for software entities in an unmanned system or system of unmanned systems to communicate and coordinate their activities. The Core Services represent the infrastructure commonly found across all domains and types of unmanned systems. At present, seven services are defined in this document:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;○&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Transport Service: Abstracts the functionality of the underlying communication transport layer&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;○&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Events Service: Establishes a publish/subscribe mechanism for automatic messaging&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;○&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Access Control: Manages preemptable exclusive control for safety critical operations&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;○&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Management: Defines component life-cycle management&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;○&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Time: Allows clients to query and set the system time for the component&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;○&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Liveness: Provides a means to maintain connection liveness between communicating components&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;○&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Discovery: Governs automatic discovery of remote entities and their capabilities&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Each service is described by a JAUS Service Definition (JSD) which specifies the message set and protocol required for compliance. Each JSD is fully compliant with the JAUS Service Interface Definition Language [JSIDL].&lt;/div&gt;


    &lt;/div&gt;</p>
