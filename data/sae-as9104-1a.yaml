  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard defines the industry-accepted requirements for the ICOP scheme, which provides confidence to ASD customers, that organizations with certification of their QMS, issued by accredited CBs, meet applicable AQMS standard requirements. The requirements in this standard are applicable to all participants in the ICOP scheme. If there is a conflict between the requirements of this standard, and customer or applicable statutory/regulatory requirements, the latter shall take precedence.&lt;/div&gt;&lt;/div&gt;</p>
