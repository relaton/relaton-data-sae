    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) covers airbone particulate contaminants that may be present in commercial aircraft cabin air during operation. Discussions cover sources of contaminants, methods of control and design recommendations. Air quality, ventilation requirements and standards are also discussed.&lt;/div&gt;
