    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies solid, uncut polytetrafluoroethylene (PTFE) retainers (backup rings) for use in glands in accordance with AS4716. They are usually used in hydraulic and pneumatic system components as anti-extrusion devices in conjunction with O-rings and other seals for static and dynamic applications.&lt;/div&gt;
