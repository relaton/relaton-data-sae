abstract:
- language: en
  script: Latn
  content: "<p>This standard specifies profiles of IEEE 802.1 Time-Sensitive Networking
    (TSN) and IEEE 802.1 Security standards for aerospace onboard bridged IEEE 802.3
    Ethernet networks. The profiles select features, options, configurations, defaults,
    protocols, and procedures of bridges, end stations, and Local Area Networks to
    build deterministic networks for aerospace onboard communications.</p>"
