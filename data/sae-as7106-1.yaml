  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) is to be used as a supplement to either SAE AS7106 or SAE AS7107 for suppliers who have software (to include firmware) that comprises all or part of a product that will be delivered to the customer. This type of software is defined as Class I software in the core documents. All suppliers seeking NADCAP General Quality Systems accreditation who have Class I software shall conform to the requirements of this Standard.&lt;/div&gt;&lt;/div&gt;</p>
