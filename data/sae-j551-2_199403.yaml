  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The limits in this SAE Standard are designed to provide protection for receivers of all types of radio transmissions when used in buildings. As a result, receivers of radio transmissions used out-of-doors may not be protected by the limits specified.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This publication applies to the emission of electromagnetic energy which may cause interference to radio reception and which is emitted from:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Vehicles propelled by an internal combustion engine, electrical means or both (see SAE J551/1 for definition)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Motorboats propelled by an internal combustion engine, electrical means or both
    &lt;div class="table-wrap anchor "&gt;
    &lt;div class="table-container"&gt;&lt;table class="br-none tbr-void "&gt;
    &lt;tbody&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;NOTE—For the purposes of this publication, motorboats are considered to be a subset of vehicles unless specifically mentioned to the contrary.&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div/&gt;&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Devices equipped with spark-ignited internal combustion engines (see SAE J551/1 for definition)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;This publication does not apply to aircraft, traction systems (railway, tramway, and trolley bus), or to incomplete vehicles.&lt;/div&gt;&lt;/div&gt;</p>
