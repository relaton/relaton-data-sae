  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the minimum interface compatibility requirements for electric vehicle (EV) inductively coupled charging for North America.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This part of the specification is applicable to manually connected inductive charging for Levels 1 and 2 power transfer. Requirements for Level 3 compatibility are contained in &lt;span class="xref"&gt;Appendix B&lt;/span&gt;. Recommended software interface messaging requirements are contained in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This type of inductively coupled charging is generally intended for transferring power at frequencies significantly higher than power line frequencies. This part of the specification is not applicable to inductive coupling schemes that employ automatic connection methods or that are intended for transferring power at power line frequencies.&lt;/div&gt;
    &lt;/div&gt;</p>
