  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard specifies a procedure for approximating the volume of materials contained in the grapple of bucket linkage operated grapples mounted to excavators. The volume ratings are based on the inside dimensions of the grapple and representative volumes extending beyond the grapple.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The method employs the technique of dividing the complex shape of the material in the grapple into simple geometric forms to allow volume calculations of different grapple configurations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The rating method is intended to provide a consistent means of comparing grapple capacities. It is not intended to define actual capacities that might be observed in any specific application.&lt;/div&gt;&lt;/div&gt;</p>
