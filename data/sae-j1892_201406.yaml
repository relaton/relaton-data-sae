  content: |-
    <p>&lt;p&gt;This SAE Recommended Practice describes the basic content requirements, bar-code specifications, and functional test specifications of a vehicle emission configuration (VEC) label. On the vehicle, the VEC label is to be mounted under the hood in a readily accessible location for use of a bar-code scanning device.
    &lt;/p&gt;



    &lt;p&gt;This document specifies a permanent vehicle emission configuration label that can be automatically identified through a bar-coded format.&lt;/p&gt;</p>
