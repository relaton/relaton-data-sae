  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this procedure is to establish a technique for reliably and repeatedly measuring the RF shielding characteristics of EMI conductive gasket materials and EMI conductive gaskets. Depending on the materials used for the construction of the measuring setup, the EMI conductive gaskets can be characterized against various joint surfaces. This standard will directly provide shielding effectiveness values up to 40 GHz, and will also be applicable for small samples of conductive EMI gaskets.&lt;/div&gt;&lt;/div&gt;</p>
