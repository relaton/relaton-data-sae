    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the design and assembly force guidelines for conventional shipping caps, torque caps, and body plugs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All possible design and applications could not be anticipated in creating these guidelines. Where there are questions of adherence to this document, such as use of an “off-the-shelf” design, always consult the responsible Ergonomics Department.&lt;/div&gt;&lt;/div&gt;</p>
