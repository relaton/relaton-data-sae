abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice utilizes existing industry standards to identify a common physical interface and define the protocols necessary to retrieve records stored by light duty vehicle event data recorders (EDRs). To accomplish this, the SAE J1962 diagnostic connector is designated as the primary physical interface for EDR retrieval tools.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to be used for the development of EDR retrieval tools. Retrieval tools are intended to interface with light duty vehicles and to produce EDR record reports with data element formats specified by SAE J1698-1.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Limitations:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommend Practice specifies how EDR records should be imaged, translated, and reported by EDR retrieval tools. It does not specify how EDR records are recorded and stored by individual vehicles.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice addresses EDR record retrieval (including imaging and translating) via the connection to the vehicle’s SAE J1962 connector or via direct connection to an electronic control unit (ECU) containing an EDR record. Direct connection to an ECU may require the use of specialized interface adapters.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;</p>
