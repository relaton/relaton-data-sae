  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a test method for determining the vertical force and deflection properties of a non-rolling tire and the associated contact patch length and width. The method applies to any tire so long as the equipment is properly scaled to conduct the measurements for the intended test tire. The data are suitable for use in determining parameters for road load models and for comparative evaluations of the measured properties in research and development.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Herein, road load models are models for predicting forces applied to the vehicle spindles during operation over irregular pavements. Within the context of this Recommended Practice, forces applied to the pavement are not considered.&lt;/div&gt;

    &lt;/div&gt;</p>
