  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers tubing intended for use as high pressure fuel injection lines on a range of engines requiring tubing no larger than ¼ in. OD. The material and construction of the tubing shall be cold drawn annealed low carbon seamless steel of a quality suitable for cold swaging, cold upsetting, and cold bending.&lt;/div&gt;&lt;/div&gt;</p>
