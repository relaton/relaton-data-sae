  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The requirements contained herein are intended for those standards that are promulgated by national standards organizations and used in the aerospace industry. These technical data include narrative text, tables and various graphic data which comprise the standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Both interface control and interface definitions are covered in this specification. The internal architectures of the computer facilities of either the providers or the users are not constrained by this interchange specification. Rather, neutral formats and transmitting media are defined in order to enable more cost-effective ways to distribute information for computer users than by sending printed documents.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This method for digital delivery of aerospace standards is intended to allow the users to display and maintain standards on current computer systems in addition to producing hard copy comparable to existing printed standards.&lt;/div&gt;&lt;/div&gt;</p>
