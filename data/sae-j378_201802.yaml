  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the requirements for all marine inboard engine wiring, wiring assemblies, wiring components, and wiring connectors connected to microprocessors associated with the operation of the propulsion system, operating at 50 V or less.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;EXCEPTION—Outboard engines and engines in Personal Water Craft (PWC).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: See ABYC E11 for additional requirements related to electrical installations on small craft.&lt;/div&gt;

    &lt;/div&gt;</p>
