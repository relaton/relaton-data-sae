    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) shall be used in conjunction with AMS 4946 to provide requirements for qualification testing and for Qualified Products Listing (QPL) and Qualified Manufacturer Listing (QML) for Ti-3Al-2.5V cold worked and stress relieved hydraulic system tubing. The basic tubing shall comply with the requirements of AMS 4946.&lt;/div&gt;
