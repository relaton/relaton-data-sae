  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommend Practice (ARP) is intended to cover the external lights on fixed wing aircraft for illuminating the wing leading edge and engine nacelles and the upper surfaces of the wing. The addition of an ice detection system should be implemented when the areas to inspect are not visible from the aircraft cockpit. It is not intended that this Recommended Practice require the use of any particular light source such as Halogen, LED or other specific design of lamp.&lt;/div&gt;
    &lt;/div&gt;</p>
