  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the general physical, electrical, and performance requirements for the electric vehicle conductive charge system and coupler for use in North America. The intent of this document is to define a common electric vehicle conductive charging system architecture including operational requirements and the functional and dimensional requirements for the vehicle inlet and mating connector.&lt;/div&gt;&lt;/div&gt;</p>
