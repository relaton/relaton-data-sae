  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends criteria to assure adequate visibility from the flight deck. The flight-deck windshield must provide sufficient external vision to permit the pilot to perform any maneuvers within the operating limits of the aircraft safely and, at the same time, afford an unobstructed internal view of the flight instruments and other critical components and displays from the same eye position.&lt;/div&gt;&lt;/div&gt;</p>
