  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to specify the O-ring sizes that are suitable for quality conformance testing (limited to hardness, tensile tests, compression set, specific gravity, and volume swell per ASTM D1414) required by AMS-7xxx series of specifications. In addition, suppliers and/or users, at their own discretion and/or according to their procurement documents, may choose to invoke this specification for procurement or other purposes for O-ring sizes that are not covered by AS568.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;If additional tests are specified as quality conformance tests in any AMS-7xxx specification, then that specification shall also specify the required test size for that additional test. This document does not address O-ring size for qualification testing required by AMS-7xxx series of specifications since that is already specified in the AMS-7xxx specification. This document only covers O-ring sizes required by test type. These O-ring sizes include, but are not limited to, AS568-xxx O-ring sizes. Other testing details such as ASTM or other test methods, etc. are covered elsewhere such as the specific AMS-7xxx specification, etc. and are beyond the scope of this specification and are not addressed in this specification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;AS6837 supersedes ARP3050.&lt;/div&gt;&lt;/div&gt;</p>
