  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to provide a listing for current commercial and military aircraft landing gear systems and their types and manufacturers. Data has been provided for the following commercial aircraft types; wide body jet airliners, narrow body jet airliners, and turboprop/commuter aircraft and the following military aircraft types; fighter, bomber, cargo, attack, surveillance, tanker and helicopter categories. The aircraft that have been included in this document are in operational service either with airlines, business, cargo or military operators. No information is presented for aircraft that are currently being developed or that are not in extensive usage. This document will provide an informational reference for landing gear engineers to access when evaluating other gear and aircraft systems. Future revisions of this document will add aircraft as they enter into service.&lt;/div&gt;

    &lt;/div&gt;</p>
