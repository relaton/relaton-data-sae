  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances. This document establishes additional performance requirements and provides test methods and requirements to evaluate the suitability of materials intended for optical applications in motor vehicles. The tests are intended to determine physical and optical characteristics of the materials only. Performance expectations of finished assemblies, including plastic components, are to be based on tests for lighting devices, as specified in SAE Standards and Recommended Practices for motor vehicle lighting equipment. Glass and materials inclusive to the light source are not in scope for this method.&lt;/div&gt;&lt;/div&gt;</p>
