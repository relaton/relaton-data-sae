    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to motor vehicle Distributed Lighting Systems (DLS) which use light generated by remote sources. It provides test methods, requirements, and guidelines applicable to these systems. This document is intended to be a guide to standard practice and is subject to change dependent upon additional experience and technical advances. This document covers Headlamp, Fog lamp, Auxiliary lamp, plus Signal and Marking lamp functions.&lt;/div&gt;
    &lt;/div&gt;</p>
