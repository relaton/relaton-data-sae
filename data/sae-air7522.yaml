  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides guidelines for the design of portable Controlled Contamination Areas (CCAs) that can provide localized environmental control when processing a repair at the airplane or in a hangar environment. The use of a portable CCA may result in a better quality repair.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The use of a portable CCA may assist in achieving the environmental requirements for bonded repairs specified in an approved repair procedure. This provides an option to accomplish a repair on nonremovable structure or difficult to remove components.&lt;/div&gt;
    &lt;/div&gt;</p>
