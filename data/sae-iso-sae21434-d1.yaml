  content: |-
    <p>&lt;p&gt;This document is an unapproved DRAFT of a proposed SAE International Standard. Consequently, this document is subject to change and cannot be utilized for any conformance or compliance purposes.&lt;/p&gt;


    &lt;p&gt;This document specifies requirements for cybersecurity risk management regarding engineering for concept, development, production, operation, maintenance, and decommissioning for road vehicle electrical and electronic (E/E) systems, including their components and interfaces.&lt;/p&gt;


    &lt;p&gt;A framework is defined that includes requirements for cybersecurity processes and a common language for communicating and managing cybersecurity risk.&lt;/p&gt;


    &lt;p&gt;This document is applicable to series production road vehicle E/E systems, including their components and interfaces whose development or modification began after the publication of the document.&lt;/p&gt;


    &lt;p&gt;This document does not prescribe specific technology or solutions related to cybersecurity.&lt;/p&gt;</p>
