  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies requirements for vulcanized rubbers in sheet form for use as standards in characterizing the effect of test liquids and service fluids. The annexes contain the standard reference elastomer formulas.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The property changes of the SRE in contact with the indicated fluid under specified test conditions are the responsibility of the user. See &lt;span class="xref"&gt;7.3&lt;/span&gt; and &lt;span class="xref"&gt;Table 1&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard is not designed to provide formulations of elastomeric product compositions for actual service.&lt;/div&gt;
    &lt;/div&gt;</p>
