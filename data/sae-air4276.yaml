  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) is the primary vehicle for providing the survey results to industry and government.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Institute of Defense Analysis (IDA), has performed a study which concludes that computerized techniques must be developed to integrate RM&amp;amp;S into product design in order to permit design influence from inception throughout the product life cycle. This AIR addresses the DoD initiative for developing Computer Aided Acquisition and Logistic Support (CALS) and industry's role in its evolution.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;AIR 4276 provides the detailed results of an industry/government survey inquiring into the extent of computerization of RM&amp;amp;S into the design process. Background information describes the evolution of the survey and why it was developed. The results provide demographic information about the respondents, the existence and extent of their CALS policy and plans, the priority placed on each RM&amp;amp;S task, and the extent to which these tasks have been computerized into the design process. Recommendations based on the survey results are included.&lt;/div&gt;&lt;/div&gt;</p>
