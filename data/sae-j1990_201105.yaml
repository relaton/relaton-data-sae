  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to provide equipment specifications for CFC-12 (R-12) recycling equipment. This information applies to equipment used to service automobiles, light trucks, and other vehicles with similar CFC-12 (R-12) air-conditioning (A/C) systems. Systems used on mobile vehicles for refrigerating cargo that have hermetically sealed systems are not covered in this document. The equipment in this document is intended for use with refrigerant that has been directly removed from, and intended to be returned to, a mobile A/C system. Should other revisions due to operational or technical requirements occur, this document may be amended.&lt;/div&gt;&lt;/div&gt;</p>
