  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Aerospace Information Report (AIR) is a review of the factors contributing to speed variation of d-c motors, a presentation of typical data showing speed variation as a function of certain variables for representative motors, and a recommendation of a means of improving communications between motor users and manufacturers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following analysis is limited to variations in voltage, torque, temperature, and altitude of the same magnitude as in MIL-M-8609.&lt;/div&gt;
    &lt;/div&gt;</p>
