  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This user’s manual covers the small adult female Hybrid III test dummy. It is intended for technicians who work with this device. It covers the construction and clothing, disassembly and reassembly, available instrumentation, external dimensions and segment masses, as well as certification and inspection test procedures. It includes instructions for safe handling of the instrumented dummy, repairing dummy flesh, and adjusting the joints throughout the dummy.&lt;/div&gt;&lt;/div&gt;</p>
