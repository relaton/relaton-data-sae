abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p class="c1"&gt;The J1939 Digital Annex&lt;/p&gt;
    &lt;p&gt;The J1939 Digital Annex, introduced in August 2013, offers key J1939 technical data in an Electronic Spreadsheet that can be easily searched, sorted, and adapted to other formats. J1939DA contains all of the SPNs (parameters), PGNs (messages), and other J1939 data previously published in the SAE J1939 top level document. J1939DA also contains all of the SLOTs, Manufacturer ID Codes, NAME Functions, and Preferred Addresses previously published in the SAE J1939 top level and the J1939-71 document. J1939DA contains the complete technical details for all of the SPNs and PGNs previously published in the SAE J1939-71 document. For all other SPNs and PGNs which are published in a document other than SAE J1939-71, J1939DA lists only basic details along with a reference to the document that contains the complete technical details.&lt;/p&gt;
    &lt;p&gt;J1939DA replaces, and expands upon, the 1939 Companion Spreadsheet (CS1939), which was last published through November 2012.&lt;/p&gt;
    &lt;p class="c1"&gt;The data fields included in J1939DA for PGNs are:&lt;/p&gt;
    &lt;ul&gt;&lt;li&gt;PGN&lt;/li&gt;&lt;li&gt;Parameter Group Label&lt;/li&gt;&lt;li&gt;Acronyn&lt;/li&gt;&lt;li&gt;EDP&lt;/li&gt;&lt;li&gt;DP&lt;/li&gt;&lt;li&gt;PF&lt;/li&gt;&lt;li&gt;PGN Length&lt;/li&gt;&lt;li&gt;PS&lt;/li&gt;&lt;li&gt;PGN Description&lt;/li&gt;&lt;li&gt;Multipacket&lt;/li&gt;&lt;li&gt;Transmission Rate&lt;/li&gt;&lt;li&gt;PGN Data Length&lt;/li&gt;&lt;li&gt;Default Priority&lt;/li&gt;&lt;li&gt;PGN Reference&lt;/li&gt;&lt;li&gt;PGN Document&lt;/li&gt;&lt;/ul&gt;
    &lt;p class="c1"&gt;The data fields included in J1939DA for SPNs are:&lt;/p&gt;
    &lt;ul&gt;&lt;li&gt;SPN&lt;/li&gt;&lt;li&gt;SPN Name&lt;/li&gt;&lt;li&gt;SPN Description&lt;/li&gt;&lt;li&gt;SPN Length&lt;/li&gt;&lt;li&gt;Resolution&lt;/li&gt;&lt;li&gt;Offset&lt;/li&gt;&lt;li&gt;Data Range&lt;/li&gt;&lt;li&gt;Operational Range&lt;/li&gt;&lt;li&gt;Units&lt;/li&gt;&lt;li&gt;SLOT Identifier&lt;/li&gt;&lt;li&gt;SPN Type&lt;/li&gt;&lt;li&gt;SPN Reference&lt;/li&gt;&lt;li&gt;SPN Document&lt;/li&gt;&lt;/ul&gt;
    &lt;p&gt;The J1939 Digital Annex is current through Third Quarter 2014 and can be purchased separately or as part of &lt;a href="http://www.sae.org/standardsdev/groundvehicle/j1939.htm"&gt;the SAE J1939 Standards Collection on the Web&lt;/a&gt;.&lt;/p&gt;</p>
