  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice defines a procedure for the construction of a lap shear specimen for the purpose of testing the bondability of an automotive sealant adhesive to the elastomeric material used in automotive encapsulating.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The present practice of encapsulating automotive glass is described as molding elastomeric material onto the outer edge of the glass using thermoplastic or thermosetting material that quickly sets in the mold. The glass is removed from the mold with cured elastomeric material bonded to the perimeter of thee glass. This encapsulated glass module can now be bonded with a sealant adhesive into the body opening of a vehicle.&lt;/div&gt;&lt;/div&gt;</p>
