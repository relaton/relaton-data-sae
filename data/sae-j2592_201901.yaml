  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Information Report describes eddy current testing, flux leakage testing, ultrasonic testing, and magnetic particle testing of steel tubing. The purpose of these testing methods is to expose flaws in the tube material or weld zone, such as discontinuities, seams, cracks, holes, voids, and other imperfections characteristic to the specific construction of the tubing. When agreed upon between the producer and purchaser, nondestructive testing is used in lieu of destructive hydrostatic pressure proof testing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Aircraft and Aerospace applications were not considered during the preparation of this document.&lt;/div&gt;&lt;/div&gt;</p>
