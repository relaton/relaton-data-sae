abstract:
- language: en
  script: Latn
  content: "<p>This specification covers a corrosion and heat resistant nickel alloy
    in the form of sheet, strip, and plate procured in SI (metric) units. AMS 5536
    is the inch/pound version of this MAM.  These products have been used typically
    for parts requiring oxidation resistance up to 1205 degrees C and relatively high
    strength up to 815 degrees C, but usage is not limited to such applications.</p>"
