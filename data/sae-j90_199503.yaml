  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The classification system provides a means for specifying or describing pertinent properties of commercial nonmetallic gasket materials. Materials composed of asbestos, cork, cellulose, and other organic or inorganic materials in combination with various binders or impregnants are included. Materials normally classified as rubber compounds are not included, since they are covered in SAE J200—ASTM D 2000. Gasket coatings are not covered, since details thereof are intended to be given on engineering drawings or in separate specifications.&lt;/div&gt;&lt;/div&gt;</p>
