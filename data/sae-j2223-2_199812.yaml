  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines tests methods and general performance requirements of single-pole and multipole connectors for on-board electrical wiring harnesses of road vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These requirements are not intended for connections internal to electronic devices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to connectors designed to be disconnected after mounting in the vehicle in the case of repair and/or maintenance.&lt;/div&gt;&lt;/div&gt;</p>
