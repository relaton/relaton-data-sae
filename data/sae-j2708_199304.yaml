  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to define test conditions, describe tests to be made, specify data to be obtained, show formulas and calculations, define terms, and establish a uniform method of reporting so that performance data obtained on various makes and models of tractors, tested in accordance with this document, will be comparable regardless of where the tests are made. Because of the availability of many tractor models and types that can be equipped with a variety of special or optional equipment, the scope of this document must be limited to obtaining and reporting only the most significant of widely used performance data.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Tests performed to either the Standard Code as outlined in &lt;span class="xref"&gt;Section 5&lt;/span&gt; or the Restricted Code as outlined in &lt;span class="xref"&gt;Section 6&lt;/span&gt; will satisfy requirements of this Agricultural Tractor Test Code.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is technically equivalent to the OECD Tractor Test Code C(87)53, Annex I and Annex II. It is intended as a guide to development and pretesting of tractors prior to official OECD testing. It is not, however, a replacement for the official codes used by OECD test stations, and any questions or conflicts concerning official OECD testing should be resolved by consulting the official OECD codes of the OECD Coordinating Center in Paris.&lt;/div&gt;
    &lt;/div&gt;</p>
