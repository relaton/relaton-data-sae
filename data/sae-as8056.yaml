    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes minimum design and performance requirements for carts, containers and associated components intended for installation in galleys and other areas of transport category airplanes. The requirements include establishing installation criteria for use by compartment designers and installers of the equipment.&lt;/div&gt;&lt;/div&gt;</p>
