abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Accelerometers are transducers, or sensors, that convert acceleration into an electrical signal which can be used for vibration monitoring and analysis.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document defines interface requirements for accelerometers and associated interfacing electronics for use in a helicopter Health and Usage Monitoring System (HUMS). The purpose is to standardize the accelerometer-to-electronics interface with the intent of increasing interchangeability among HUMS sensors/systems and reducing the cost of HUMS accelerometers. Although this interface was specified with an internally amplified piezoelectric accelerometer in mind, this does not preclude the use of any other sensor technology that meets the requirements given in this specification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These SAE HUMS Interface Specifications include the minimal interface and performance requirements for interoperability with the Rotorcraft Industry Technology Association (RITA) compliant HUMS. Compliance with these Interface Specifications can be referenced in more comprehensive procurement and device specifications.&lt;/div&gt;

    &lt;/div&gt;</p>
