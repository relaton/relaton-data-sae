  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers 600 V heavy duty, portable, power, single and multiconductor, electrical cable for severe flexing service (see detail specifications for voltage limitations). The AS5756 insulation system has been used in aerospace ground power applications using 115/200 V (phase to neutral) at 400 Hz AC. Verification of the suitability of this product for use in other electrical system configurations (600 V, etc.) is the responsibility of the user.&lt;/div&gt;&lt;/div&gt;</p>
