  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard specifies basic and high performance test methods and requirements for round, screened and unscreened, multi-core sheathed cables intended for use in road vehicle applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The unscreened, single-core cables shall be in accordance with ISO 6722, SAE J1127, SAE J1128, SAE J1654, SAE J1678, or SAE J2183. Other cores may be used, but in these cases, the construction and tests required to ensure functionality of these cores shall be agreed between customer and supplier. See ISO 6722 for temperature classes. ISO 6722 will be needed to perform some of the tests in this standard.&lt;/div&gt;&lt;/div&gt;</p>
