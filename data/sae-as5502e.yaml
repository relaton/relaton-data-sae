  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes standard requirements for aerospace sealants and adhesion promoters, which may be incorporated as part of SAE Aerospace Material Specifications (AMS) for such products. This document provides for commonality of methods and procedures for responsibility for inspection, source inspection, classification of tests, establishment of/and qualification to qualified products lists, approval, reports, resampling and retesting, packaging, and marking.&lt;/div&gt;
    &lt;/div&gt;</p>
