abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This part of SAE J2244 specifies dimensions, performance requirements, and test procedures for metric adjustable and nonadjustable light-duty (L series) stud ends and O-rings.&lt;/p&gt;
    &lt;p&gt;Stud ends in accordance with this part of SAE J2244 may be used at working pressures up to 40 MPa for nonadjustable stud ends and 31.5 MPa for adjustable stud ends. The permissible working pressure depends upon materials, design, working conditions, applications, etc.&lt;/p&gt;
    &lt;p&gt;For threaded ports and stud ends for use in new designs in hydraulic fluid power applications, only SAE J2244 shall be used. Threaded ports and stud ends in accordance with ISO 1179, ISO 9974, and SAE J1926 (ISO 11926) shall not be used in new designs in hydraulic fluid power applications.&lt;/p&gt;
    &lt;p&gt;Conformance to the dimensional information in this SAE Standard does not guarantee rated performance. Each manufacturer shall perform testing according to the specification contained in this document to ensure that components made to this document comply with the performance ratings.&lt;/p&gt;</p>
