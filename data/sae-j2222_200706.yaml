  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the minimum performance and endurance requirements for coiled electrical cables used for hookup between trucks, trailers and dollies. The component standards SAE J2394 (replaced SAE J1067) for cable and SAE J560 for connectors must be consulted to determine the complete performance and endurance requirements of the system. Related TMC Recommended Practices may be consulted for information associated with selection, installation and inspection of these coiled electrical cables. This document is intended to set out requirements for the majority of conditions rather than for specialized applications or environments.&lt;/div&gt;&lt;/div&gt;</p>
