  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes the instrumentation and procedures to be used in measuring sound levels at the operator station for self-propelled sweepers as defined in SAE J2130 and self-propelled off-road work machines in categories 1, 2, 4, and 5, of SAE J1116.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE document is applicable to machines that have operator stations where the operator can either stand or sit and will be either transported by, or walk with the machine during its operation. The sound levels obtained using this procedure are repeatable and representative of the higher range of sound levels generated by machines under actual field operating conditions. Due to variability of field operating conditions, this data is not intended to be used for operator noise exposure evaluations. Measurement and calculation of the operator's sound exposure should follow SAE J1166.&lt;/div&gt;&lt;/div&gt;</p>
