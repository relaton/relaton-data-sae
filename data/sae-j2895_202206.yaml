    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides general design performance requirements and related test procedures for LED “white” lighting unit assemblies, other than signal and marking devices, used on Earthmoving, Road Building, and Maintenance off-road work machines as defined in SAE J1116. This report is intended to serve as a guide to standard practice and is subject to change to reflect additional experience and technical advances.&lt;/div&gt;&lt;/div&gt;</p>
