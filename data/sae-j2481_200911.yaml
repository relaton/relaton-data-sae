  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Dynamic simulation sled testing can represent various automotive collision conditions. Deceleration conditions during sled testing are readily reproducible and can be tuned to simulate collision events that occur during vehicle impacts with a fixed barrier or vehicle. Sled tests are conducted on automotive vehicle bodies or other structures to obtain valuable information. This information can be used to evaluate the dynamic performance of, but not limited to, vehicle restraint systems, vehicle seating systems, and body closure systems.&lt;/div&gt;

    &lt;/div&gt;</p>
