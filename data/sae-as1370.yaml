  content: |-
    <p>&lt;p&gt;AS1370 is superseded by MA1370.&lt;/p&gt;


    &lt;p&gt;This standard establishes the basic triangular profile for the J form thread; gives a system of designating; lists the standard series threads for aerospace screws, bolts and nuts; lists the standard series of diameter-pitch combinations for diameters from 1.6 to 200 mm; and specifies limiting dimensions and tolerances.&lt;/p&gt;</p>
