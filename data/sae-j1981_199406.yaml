    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Test is designed for the testing of wheel and tire assemblies used with passenger cars, light trucks, and multipurpose vehicles. The test is limited to a frontal (radial) impact with both wheel rim flanges being impacted simultaneously. For side impact on the outboard rim flange only, please refer to SAE J175. This SAE Recommended Practice does not provide standards of performance.&lt;/div&gt;&lt;/div&gt;</p>
