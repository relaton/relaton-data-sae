  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J3078/2 specifies two uniform test methods to determine performance levels for fresh and recirculation air filters used in operator enclosures with an air ventilation system. It is not applicable for testing vapor and gas filters. The category of machines covered include off-road self-propelled work machines as defined in SAE J1116 and tractors and machinery for agriculture and forestry as defined in ANSI/ASAE S390.&lt;/div&gt;&lt;/div&gt;</p>
