  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers procedures and requirements for peening of metal parts with portable, bonded-shot, rotary flap assemblies in accordance with AS2592. The principles of rotary flap peening are similar to conventional shot peening, except conversion of arc height values using the magnetic Almen test strip holder is required for intensity determination.&lt;/div&gt;&lt;/div&gt;</p>
