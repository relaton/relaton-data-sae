    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) outlines the basic general design requirements for ground support equipment used in the civil air transport industry. It is intended to assist the airlines in standardizing requirements for various configurations of equipment. For procurement of equipment, sections of this document should be specified with due consideration of the functional and environmental requirements of the equipment, and to the relative cost of satisfying those requirements.&lt;/div&gt;&lt;/div&gt;</p>
