  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method provides procedures for exposing specimens of elastomer materials (AS 568-214 size O-rings) representative of those used in gas turbine engines to lubricants or reference fluids under defined time and temperature conditions. This test includes both suspended and compressed O-rings. Resultant changes in the O-ring’s physical properties (tensile strength, elongation, hardness, mass, volume, and compression set) are measured to determine the amount of deterioration of the elastomer.&lt;/div&gt;&lt;/div&gt;</p>
