  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) describes conditions under which freezing (frozen) brakes can occur and describes operating procedures which have been used to prevent or lessen the severity or probability of brake freezing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document also identifies design features that some manufacturers implement to minimize the occurrence of freezing brakes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is not an Aerospace Recommended Practice (ARP) and therefore does not make recommendations based on a consensus of the industry. However, part of this document’s purpose is to describe the design and operational practices that some are using to minimize the risk of frozen brakes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The following information is based upon experience gained across a wide-range of aircraft types and operational profiles, and should NOT take precedence over Aircraft Flight Manual or Flight Operations Procedures.&lt;/div&gt;&lt;/div&gt;</p>
