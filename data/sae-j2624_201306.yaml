abstract:
- language: en
  script: Latn
  content: "<p>There is currently no requirement in place for aftermarket brake lining performance.  NHTSA has indicated that the automotive aftermarket should take a proactive approach to come up with a standard test definition for lining evaluation.  Many aftermarket manufacturers use dynamometer testing to evaluate lining performance, but there is currently not a common recognized method for on-vehicle lining screening.  This procedure was created to provide a quick, on-vehicle test method for lining performance evaluation.  This procedure is intended for use in passenger cars; multi purpose vehicles and light trucks with a gross vehicle weight less than 4535 kg(10 000 lb).</p>"
