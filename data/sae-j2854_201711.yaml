abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The CRABI dummy was developed to evaluate small child restraint systems in automotive crash environments, in all directions of impact, with or without air bag interaction&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Basic anthropometry for this test device was taken from the University of Michigan Transportation Research Institute Report 85-23. Weight distribution and scaling methods for the infant were approved by the Society of Automotive (SAE) Infant Dummy Task Group. The dummy weighs 17.2 pounds and has a 26.4 inches standing or 17.3 inches sitting height. The Hybrid Ill-like neck and lumbar spine are laterally notched to reduce lateral stiffness&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The shoulders have flesh support for durability and human-like performance in areas where seatbelt webbing may be placed. In addition, rubber elements are used in each joint to improve biofidelity and to give the CRABI infant-like range of motion. The CRABI Six-Month-Old design meets all the SAE Infant Dummy Task Group anthropometry, biomechanical and instrumentation requirements. The instrumentation design incorporates three 6-channel load cells to provide load measurements at the C1, C7 and L5 vertebrae locations. Accelerometers are used to measure head, chest and pelvic acceleration and head angular acceleration. All instrumentation is easily accessed&lt;/div&gt;&lt;/div&gt;</p>
