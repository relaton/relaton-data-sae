  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established manufacturing tolerances applicable to aluminum alloy standard structural shapes ordered to inch/pound dimensions. Standard structural shapes are shapes in certain standard alloys, tempers, sizes, and sections such as angles, channels, Tees, Zees, I-Beams, and H-Beams commonly used for structural purposes. These tolerances apply to all conditions, unless otherwise noted. The term "excl" applies only to the higher figure of the specified range.&lt;/div&gt;&lt;/div&gt;</p>
