    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform engineering nomenclature for wheels, rims, and their components used in truck, bus, and trailer applications. This nomenclature and accompanying drawings are intended to define fundamental truck wheel, hub, and rim terms rather than to provide a comprehensive tabulation of all wheel, hub, and rim designs.&lt;/div&gt;&lt;/div&gt;</p>
