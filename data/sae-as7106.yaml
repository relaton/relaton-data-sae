  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard establishes the minimum requirements necessary for NADCAP accreditation of a General Quality System the meets, at a minimum, MIL-Q-9858. These requirements may be supplemented by additional requirements at the discretion of the NADCAP General Quality Systems Task Group.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is the intent of this standard to provide a harmonized quality standard that meets MIL-Q-9858, MIL-STD-45662, and the relevant portions of MIL-STD-1520. In addition to meeting these requirements as a minimum, an attempt has been made to harmonize the requirements of MIL-Q and the ISO9000 series of standards. Where similar requirements existed between these two standards, the more stringent requirement was imposed.&lt;/div&gt;&lt;/div&gt;</p>
