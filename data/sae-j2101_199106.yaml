    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes a method for measuring the weighted sound pressure levels at prescribed microphone positions in the proximity of a device or machine for outdoor use, in order to determine compliance with noise limits. The A-weighted sound power level of the source is calculated from the measured values.&lt;/div&gt;
