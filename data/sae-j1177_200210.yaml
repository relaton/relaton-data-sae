  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers mobile hydraulic excavator controls and the specific arrangement and direction of motion for the primary controls.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to mobile hydraulic excavators. (A mobile hydraulic excavator is defined as a self-propelled machine with an upperstructure capable of continuous rotation and which digs, elevates, swings, and dumps material by action of the boom and arm or telescoping boom with bucket.)&lt;/div&gt;
    &lt;/div&gt;</p>
