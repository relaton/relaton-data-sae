  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report presents an overview of the application and control of fixed and variable displacement pumps with the emphasis on the controls most commonly used on variable displacement pumps. It describes various options to control the operation of hydraulic pumps in terms of controlling the pump output pressure and/or flow and assisting in the selection of the pump.&lt;/div&gt;

    &lt;/div&gt;</p>
