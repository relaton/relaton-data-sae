  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the test procedure, environment, and instrumentation to be used for measuring the exterior exhaust sound level for passenger cars, multipurpose vehicles, and light trucks under stationary conditions providing a continuous measure of exhaust system sound level over a range of engine speeds.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This sound level measurement procedure has been developed for use in engineering evaluation of the sound level performance of passenger car and light truck exhaust systems. It provides the means for detecting exhaust system resonances with the potential to affect both exterior and interior sound quality.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document incorporates certain provisions of ISO 5130-1982-02-15, for measuring the sound level of exhaust systems. (See &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.)&lt;/div&gt;&lt;/div&gt;</p>
