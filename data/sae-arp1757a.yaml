    &lt;div class="htmlview paragraph"&gt;The symbols specified in this SAE Aerospace Recommended Practice (ARP) are applicable to all aircraft cargo handling systems for lower deck as well as for upper deck systems. Utilizing the symbols the conveyance, guidance, restraint, power drive unit and the degree of automation for the total cargo handling system can be depicted.&lt;/div&gt;
