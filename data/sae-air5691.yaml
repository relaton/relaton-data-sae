    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is applicable to commercial and military aircraft fuel quantity indication systems. It is intended to give guidance for system design and installation. It describes key areas to be considered in the design of a modern fuel system, and builds upon experiences gained in the industry in the last 10 years.&lt;/div&gt;
