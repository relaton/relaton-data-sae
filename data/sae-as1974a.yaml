  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes vibration and transmissibility test procedures which compare the relative strengths of various loop and saddle type support clamps.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure is intended for conducting fatigue testing which is standard throughout the aerospace industry thereby establishing a clamp strength comparison that can be used in an evaluation process.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The testing required by this document ensures that clamps will meet adequate fatigue requirements only. It does not infer qualification of the clamp installation techniques or its ability to meet in-service environments or operating conditions. Separate qualification testing should be performed to ensure satisfactory service of the installed clamp.&lt;/div&gt;&lt;/div&gt;</p>
