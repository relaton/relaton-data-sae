abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard applies to all mobile, construction-type, lifting
    cranes as equipped for operation with hook, clamshell, magnet, and grapple attachments.
    It is not applicable to excavating and demolition attachments such as shovels,
    hoes, draglines, and wrecking balls.    The  purpose of this document is to set
    forth wire-rope strength factors that have been proved by design and operating
    practice to be consistent with safety, economy, space, weight, and other requirements
    peculiar to mobile, construction-type, lifting cranes.</p>"
