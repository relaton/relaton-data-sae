  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;Included herein are the detailed general and dimensional specifications applicable to hi-head finished hex bolts. All general specifications and dimensions not shown shall conform to those applicable to finished hex bolts in Table 4 of SAE J104. Hi-head finished hex bolts arc primarily intended for use in the heavy construction and industrial equipment industry. The increase in head height over that of the finished hex bolt assures good wrenchability where frequent servicing is necessary, where high torquing is a requirement, or where wear on the bolt head is a problem.&lt;/div&gt;
    &lt;/div&gt;</p>
