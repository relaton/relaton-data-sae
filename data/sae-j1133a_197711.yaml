    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This engineering design specification provides design parameters and general requirements for School Bus Stop Arms equipped with alternately flashing lights. The stop arm is intended as an optional device which may be used in addition to, but not as a substitute for, school bus signal lamps covered by SAE J887(July, 1964). Decision for adoption of the recommendations presented in the Appendix is left to governmental units or other bodies who adopt this practice.&lt;/div&gt;&lt;/div&gt;</p>
