  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers discontinuously reinforced aluminum alloy (DRA) metal matrix composites (MMC) made by mechanical alloying of 6061B aluminum powder and SiC particulate, which is then consolidated by Hot Isostatic Pressing (HIP) into shapes between 12 to 100 square inches (0.008 to 0.065 m&lt;sup&gt;2&lt;/sup&gt;), inclusive, cross-section. Tensile property response to heat treatment has been demonstrated on samples of 1 square inch (645 mm&lt;sup&gt;2&lt;/sup&gt;) maximum cross section (see &lt;span class="xref"&gt;8.9&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
