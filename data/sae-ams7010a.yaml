  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes process controls for the repeatable production of preforms/parts using the laser directed energy deposition (L-DED-) process for additive manufacturing. Preforms are intended to be used to manufacture aerospace parts, but usage is not limited to such applications. Feedstock may be either wire (for L-DED-Wire) or powder (for L-DED-Powder).&lt;/div&gt;&lt;/div&gt;</p>
