  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Data are related to the dimensional changes with respect to room temperature and provide accuracy sufficient for use with most aerospace systems. Two basic methods of solution are presented with examples for steady state conditions involving uniform and non-uniform temperature distributions. The answers to the example problems are carried to the fifth place for a comparison of the results between Methods I and II.&lt;/div&gt;
    &lt;/div&gt;</p>
