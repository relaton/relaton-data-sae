  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the test procedure, environment, and instrumentation to be used for measuring the exhaust sound level for passenger cars, multipurpose vehicles, and light trucks under stationary conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Measurements are taken under steady-state conditions. In this respect, this procedure differs from ISO 5130 which includes measurements under the dynamic conditions of an engine deceleration.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This sound level measurement procedure has been developed as a guide for governmental agencies establishing vehicle in-service sound level regulations and enforcement measurement procedures. It is directed at the assessment of vehicle exhaust noise and is not intended to determine maximum vehicle sound levels. (See &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.)&lt;/div&gt;&lt;/div&gt;</p>
