  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice provides a method of characterizing Electrohydrostatic Actuator (EHA)/Electrohydrostatic Module (EHM) duty cycles for the following purposes:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To enable the comparison of the severity of different EHA/EHM applications. This allows the use of previously qualified designs without the need for repeat testing.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;To define parameters for endurance-test design of EHAs; e.g., a way of executing a life-equivalent test in a shorter duration by increasing the speed of cycles and/or the level of applied loads.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
