  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This International Standard specifies the dimensions, test methods, and requirements for single core 60 V cables intended for use in road vehicle applications where the nominal system voltage is ≤ (60 V DC or 25 V AC). It also specifies additional test methods and/or requirements for 600 V cables intended for use in road vehicle applications where the nominal system voltage is &amp;gt; (60 V DC or 25 V AC) to ≤ (600 V DC or 600 V AC). It also applies to individual cores in multi-core cables. See ISO 6722 for “Temperature Class Ratings”.&lt;/div&gt;&lt;/div&gt;</p>
