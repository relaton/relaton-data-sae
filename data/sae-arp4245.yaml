    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) defines quantities that may be used to describe various attributes of the sound field in the interior of aircraft. For a particular aircraft, or for a specific situation in a particular aircraft, it may not be necessary to utilize all the quantities included here to provide an adequate description of an aircraft's interior acoustical environment.&lt;/div&gt;&lt;/div&gt;</p>
