  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This is a general curriculum that has been developed to identify the minimum knowledge and skill requirements of a composite and metal bond repair technician/specialist.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Teaching levels have been assigned to the curriculum to define the knowledge, skills and abilities graduates will need to make safe, effective repairs. Minimum hours of instruction have been provided to ensure adequate coverage of all subject matter - lecture and laboratory. These minimums may be exceeded, and may include an increase in the total number of training hours and/or increases in the teaching levels.&lt;/div&gt;&lt;/div&gt;</p>
