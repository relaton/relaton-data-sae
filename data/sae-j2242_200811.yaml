  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These remanufacturing procedures are recommended guidelines for use by remanufacturers of starter solenoids to promote consistent reliability, durability, and safety of remanufactured starters. Installation of remanufactured or rebuilt products is often an economical way to repair a vehicle even though the products may not be identical to original equipment parts. Before processing any part, a remanufacturer should determine if the original design and present condition of the core is suitable for remanufacturing so as to provide durable operation of the part as well as acceptable performance when installed on the vehicle. The remanufacturer should also consider the safety aspects of the product and any recommendations of the original manufacturers related to remanufacturing or rebuilding their product.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While these procedures are meant to be universal in application, various product types have unique features of dimension and design which may require special remanufacturing processes and tests that are either not covered by or are exceptions to these procedures.&lt;/div&gt;
    &lt;/div&gt;</p>
