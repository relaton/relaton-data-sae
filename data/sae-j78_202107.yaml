  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the dimensional and general specifications, including performance requirements, for carbon steel self-drilling tapping screws suitable for use in general applications having point Styles 2, 3, 4, and 5.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is the objective of this document to ensure that carbon steel self-drilling tapping screws, by meeting the mechanical and performance requirements specified, shall drill a hole and form or cut mating threads in materials into which they are driven without deforming their own thread and without breaking during assembly.&lt;/div&gt;&lt;/div&gt;</p>
