  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure shall be applied by ANSI-RAB or other Accreditation Bodies to registrars that meet the criteria of &lt;span class="xref"&gt;5.2&lt;/span&gt; of this document, when specified by an aerospace company requiring assessment and/or registration of their quality system to the requirements of this procedure.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The quality system standard shall be AS9000 or AS9100 and shall be applied to the supplier's complete Quality System that covers aerospace products.&lt;/div&gt;
    &lt;/div&gt;</p>
