  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the performance tests and requirements for hydraulic brake hose assemblies used in the hydraulic braking system of a road vehicle. It also specifies the methods used for identification of the hose manufacturer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to brake hose assemblies made of a hose fabricated from yarn and natural or synthetic elastomers and assembled with metal end fittings for use with nonpetroleum-base brake fluids as specified in SAE J1703 and SAE J1705.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The nominal internal diameter of the brake hose shall be one of the following values:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;3.2 mm (1/8 in) or,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;4.8 mm (3/16 in)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
