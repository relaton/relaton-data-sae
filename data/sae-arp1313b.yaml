    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes procedures for solution and solid graphite furnace atomic absorption spectrometric determination of lead, bismuth, selenium, tellurium, and thallium in nickel and cobalt high temperature alloys. Other analytical methods are able to provide the required accuracy and are mentioned herein.&lt;/div&gt;&lt;/div&gt;</p>
