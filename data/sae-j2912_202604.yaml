  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to refrigerant diagnostic identification equipment to be used for identifying refrigerant HFC-134a (R-134a) and HFO-1234yf (R-1234yf) refrigerant when servicing a mobile A/C system or for identifying refrigerant in a container to be used to charge a mobile A/C system. Identification of other refrigerants is the option of the equipment manufacturer, although it shall not misidentify refrigerants, per &lt;span class="xref"&gt;3.2&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
