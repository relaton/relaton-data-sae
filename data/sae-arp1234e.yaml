    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes standard gland design criteria and dimensions for static axial O-ring seal applications without anti-extrusion devices specifically for engines and engine control systems operating at a maximum pressure of 1500 psi (10345 kPa).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The criteria herein are similar, but not identical, to those in AS4716 and the legacy standard MIL-G-5514.&lt;/div&gt;&lt;/div&gt;</p>
