    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) prescribes requirements for the various types of nozzles that are used for the refueling and defueling of aircraft fitted with pressure fuel servicing systems. It is to be used as a replacement for MIL-N-5877 and MS29520 and for all commercial applications.&lt;/div&gt;


