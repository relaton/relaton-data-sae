abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies minimum performance standards for airborne binocular Head-Up Displays (HUDs) in fixed wing (14 CFR part 23, 25) aircraft; while this document is also applicable to rotorcraft (14 CFR part 27, 29) additional performance standards may be required for rotorcraft. This aerospace standard covers basic display standards, but does not include specific application requirements. Specific applications can include flight instrumentation, navigation, engine and system status, alerting, surveillance, communication, terrain awareness, weather, enhanced vision, synthetic vision and other displays.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers criteria for conformal and non-conformal HUD systems that are intended for use in the flight deck by the pilot or copilot. Display minimum performance characteristics are specified for standard and other environmental conditions for the purpose of product qualification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not address sensor imaging systems, displays worn by the pilot (goggles, helmet mounted displays) or specific symbology to be displayed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended to be used in combination with other guidance material contained in current system specific, Technical Standard Orders (TSOs), Advisory Circulars (ACs), and other Federal Aviation Administration (FAA)-approved guidance material. This SAE Aerospace Standard can be applicable to HUDs used across multiple aircraft types.&lt;/div&gt;&lt;/div&gt;</p>
