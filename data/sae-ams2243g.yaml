  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers manufacturing tolerances applicable to seamless and welded tubing of corrosion and heat resistant steel ordered to inch dimensions. These tolerances apply to all conditions and are based on individual measurements, unless otherwise noted. Tubing may be specified by two dimensions only (OD and wall thickness, ID and wall thickness, or OD and ID).&lt;/div&gt;
    &lt;/div&gt;</p>
