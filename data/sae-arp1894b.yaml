  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide a guideline for the preparation of a plan for testing of inservice chemical oxygen generators to confirm their design useful life. The test program should also allow determination with a sufficient level of confidence, whether generators are suitable for further use (i.e., life extension, or if the useful life limit has been reached).&lt;/div&gt;&lt;/div&gt;</p>
