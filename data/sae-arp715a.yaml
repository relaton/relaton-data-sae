  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice describes two performance acceptance test methods to determine the performance acceptability of new production and overhauled air turbine starters. Before a new or overhauled starter is delivered to a customer, the starter is subjected to a performance acceptance test in accordance with an acceptance test procedure. The performance acceptance test is intended to ensure that the customer receives a starter that meets or exceeds minimum starter performance requirements.&lt;/div&gt;&lt;/div&gt;</p>
