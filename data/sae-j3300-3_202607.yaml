abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is intended to establish a procedure to certify AD fallback test driver skill levels as an endorsement to SAE J3300 foundational level certification. The SAE J3300/3 endorsement can be used by the individual driver to qualify their skills as a test driver of vehicles with automated driving features. The SAE J3300/3 endorsement levels may also be used by test facilities or other organizations when seeking test or professional drivers with these skills.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document provides directions for obtaining the endorsement, including associated AD fallback test driving skill examination requirements, through SAE J3300-certified Examiners (refer to SAE J3300 for definition). Endorsement registration and associated records are administered through Probitas Authentication®. Probitas Authentication® is the current Independent Program Administrator for the SAE J3300 series.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is a supplement to SAE J3300, providing information specific to the AD fallback test driver skill endorsement and clarifying the application of the rules set forth in SAE J3300 to the AD fallback test driver endorsement. While the references, definitions, rules, and guidelines presented in SAE J3300 &lt;span class="xref"&gt;Sections 1&lt;/span&gt; through &lt;span class="xref"&gt;5&lt;/span&gt; apply to the AD fallback test driver endorsement, they are not repeated in this document.&lt;/div&gt;&lt;/div&gt;</p>
