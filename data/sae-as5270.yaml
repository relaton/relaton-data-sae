  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procurement specification covers bolts, screws and studs made from a work-strengthened corrosion and heat resistant, age Hardenable nickel base alloy of the type identified under the Unified Numbering System as UNS N07718. The following properties are covered:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;220 ksi minimum ultimate tensile strength at room temperature&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;180 ksi minimum ultimate tensile strength at 900 °F&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;114 ksi tension to 11.4 ksi tension fatigue at room temperature&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
