    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for self-aligning, self-lubricating plain spherical bearings incorporating polytetrafluoroethylene (PTFE) in a liner between the ball and the outer race for use in a temperature range of -65 to +250 °F (-54 to +121 °C).&lt;/div&gt;&lt;/div&gt;</p>
