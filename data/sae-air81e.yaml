  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document discusses the relative merits of the physical and chemical properties of hydraulic fluids in relation to the aerospace hydraulic system design, and the related materials compatibility. The discussion in this report applies both to hydrocarbon and phosphate ester based aircraft hydraulic fluids. In some cases, numerical limits are suggested, but, in general, the significance and effect of a property is noted qualitatively.&lt;/div&gt;&lt;/div&gt;</p>
