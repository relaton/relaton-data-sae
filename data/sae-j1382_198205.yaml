    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard applies to trenchers as categorized in SAE J1116. Only those terms not covered by SAE J1234 are described herein. The illustrations used are for clarification and are not intended to resemble a particular machine. Only basic working dimensions are given. They may be supplemented by the machine manufacturer. It is intended for this standard to apply to any horsepower trenching machine since many of the features of larger machines are found on smaller trenching machines, as well.&lt;/div&gt;&lt;/div&gt;</p>
