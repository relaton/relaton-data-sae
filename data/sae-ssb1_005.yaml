  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is an annex to SAE Technical Report SSB-1 (the latest revision).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document provides reference information and guidance concerning methods used by the semiconductor industry and original equipment manufacturers related to radiation hardness assessments. This document is broken into three primary sections. &lt;span class="xref"&gt;Section 3&lt;/span&gt; discusses part characterization with focus on selection criteria and acceptance testing. &lt;span class="xref"&gt;Section 4&lt;/span&gt; discusses design hardening for piece parts with focus on degraded design limits and radiation design margin. The last section, &lt;span class="xref"&gt;Section 5&lt;/span&gt;, of this report is on hardness assurance inspection and test. This section discusses total ionizing dose, displacement damage and single event effects testing in detail.&lt;/div&gt;
    &lt;/div&gt;</p>
