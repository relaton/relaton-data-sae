    &lt;span class="li-label"&gt;i)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Forced air&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;ii)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Forced air/fluid&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;iii)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Deicing fluid&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
