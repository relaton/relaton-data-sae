    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE AIR covers Forced Air technology including: reference material, equipment, safety, operation, and methodology. It is intended to provide pressure and temperature (&lt;i&gt;temps pages 26 &amp;amp; 31&lt;/i&gt;) information and minimum safety guidelines regarding use of equipment to remove frozen contaminants related to:&lt;/div&gt;
