abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Recommended Practice specifies a uniform procedure for the evaluation of gaseous exhaust emissions from small utility engines typically less than 20 kW. Details of engine test setup and exhaust gas analysis techniques are specified with the intent of providing a uniform and reproducible method of measurement.&lt;/p&gt;
    &lt;p&gt;The intent has been to allow as much flexibility as possible in the physical construction of the experimental apparatus. Therefore, only those portions of the apparatus whose operation is critical to the accurate measurement of emissions levels are prescribed in detail.&lt;/p&gt;
    &lt;p&gt;An engine test procedure including a test sequence is outlined such that it would cover the various applications in which small engines are used. The intent is to provide an understanding of the levels of exhaust emissions and does not imply that in given application, an engine would operate in all the modes outlined in the test procedure.&lt;/p&gt;
    &lt;p&gt;This document is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances.&lt;/p&gt;</p>
