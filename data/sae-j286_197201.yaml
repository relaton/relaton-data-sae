    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE No. 2 clutch friction test machine is used to evaluate the dynamic and static friction coefficients of automatic transmission clutch friction materials when submerged in various working fluids. It can also be used to conduct life tests on friction materials and working fluids.&lt;/div&gt;&lt;/div&gt;</p>
