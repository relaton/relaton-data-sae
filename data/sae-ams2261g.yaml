    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established manufacturing tolerances applicable to bars, rods, and wire of nickel, nickel alloy, and cobalt alloys ordered to inch-pound dimensions. These tolerances apply to all conditions, unless otherwise noted. The term “excl” is used to apply only to the higher figure of a specified range.&lt;/div&gt;

    &lt;/div&gt;</p>
