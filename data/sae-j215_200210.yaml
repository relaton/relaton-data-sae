abstract:
- language: en
  script: Latn
  content: "<p>The method presented is the current recommendation for the use of flame
    ionization detectors to determine the hydrocarbon content of diesel engine exhaust,
    or exhaust of vehicles using diesel engines, when operating at steady-state.  The
    requirements of the associated sampling system and a general procedure for a continuous
    measuring method are presented.  \n\nThis SAE Recommended Practice provides for
    the continuous measurement of the hydrocarbon concentration in diesel exhaust.</p>"
