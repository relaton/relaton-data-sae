abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers hose fabricated from wire braid and synthetic rubber, assembled with end fittings for use in automotive applications up to 10.3 MPa (1500 psi) maximum pressure, as flexible connections within the temperature range of −40 °C to 121 °C (−40 °F to +250 °F) average, 13.5 °C (275 °F) maximum peaks.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specification in this SAE Standard originated in the SAE-ASTM Technical Committee on Automotive Rubber (other than tires). They represent the correlation of the best information available from research investigation and production experience on the minimum constructional and performance characteristics essential for new power steering assemblies used as original or replacement equipment. This standard applies to passenger cars. It may prove useful to truck manufacturers, but it is not to be presented as present practices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;They also represent the minimum quality recognized by original equipment manufacturers and hose suppliers as essential for satisfactory and safe operation by the hose itself and other coacting parts of the power steering system. The original equipment manufacturer may, at his option, add or alter tests through OEM specifications.&lt;/div&gt;
    &lt;/div&gt;</p>
