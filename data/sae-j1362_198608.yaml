  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1362 is applicable to those controls, indicators, and tell-tales which are fitted on the instrument panel or in the immediate vicinity of the operator on Construction, General Purpose Industrial, Agricultural, Forestry, and Specialized Mining categories of off-road, self-propelled work machines, as defined in SAE J1116 JUN80. Powered industrial trucks are excluded from the scope of SAE J1362, Symbols for agricultural equipment other than the basic agricultural tractor (e.g., combines, forage harvesters) are covered by ASAE S304 and are, therefore, also excluded from the scope of SAE J1362.&lt;/div&gt;&lt;/div&gt;</p>
