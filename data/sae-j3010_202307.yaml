  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE J2530 provides performance, sampling, test procedures, and marking requirements for wheels intended for normal highway use on passenger cars, light trucks, and multipurpose passenger vehicle. This Recommended Practice (which is separate from SAE J2530) specifies the workflow of the Wheel Conformity Assessment Program. This program allows wheel manufacturers to register their product compliant to SAE J3010. The following items precede display of “SAE J3010” on any particular wheel design:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Manufacturer registration&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All manufactures with the objective to pursue registration, shall complete the registration as an individual manufacturer via the registrar’s website &lt;a href="http://wheeldb.registrar.domain" target="_blank"&gt;http://wheeldb.registrar.domain&lt;/a&gt;. The registration includes company contact information, wheels produced, and company identification marks.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wheel design certification&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All wheel designs intended for certification in accordance to this Recommended Practice, shall complete the application and submittal of test results via the above stated registrar website and in accordance to the procedures herewith.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Use of SAE J3010&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Upon completion of the conformity assessment process, the Program Manager will post the image, identification, and conformity report of the wheel design on the corresponding website. Use of the “SAE J3010” mark in any form is restricted only to wheels noted in the online version of the Comprehensive Wheel Registry (REG-CWR).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wheel test facility or laboratory accreditation registration&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All facilities or laboratories (first-, second-, or third-party) intended for wheel testing under the subject conformity assessment process, shall complete the application and submittal of test results via the above stated registrar website and in accordance to the procedures herewith. Accreditation from the registrar is required before providing valid test reports as part of this conformity assessment program.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Manufacturers of wheels for passenger cars and light trucks, who advertise their products as "Conforms to SAE J3010" and label their product with the "SAE J3010" mark, shall follow these procedures. Conformity assessment of products to SAE J3010 is voluntary; however, adherence to these procedures is mandatory for those advertising their products as “Conforming to SAE J3010.” Wheel designs using the “SAE J3010” mark meet the requirements of SAE J2530.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This conformity assessment program does not include other parameters like inner profile of the wheel and fitment to the brake or vehicle suspension, ventilation hole cooling efficiency, wheel attachment or length of thread engagement, etc., which are necessary for complete fitment and suitability to vehicles.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
