  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to serve as a guide for standardization of features, dimensions, and configurations of balance weights and rim flanges for aluminum and steel wheels intended for use on passenger cars, light trucks, and multipurpose vehicles to assure good installation and retention of the balance weight on the rim flange. This document also provides test procedures and minimum performance requirements for testing balance weight retention. Alternate materials and geometries can be addressed in the future, for example adhesive balance weights.&lt;/div&gt;
    &lt;/div&gt;</p>
