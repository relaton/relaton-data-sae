  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes a reference system architecture based on LTE-V2X technology defined in ETSI Release 14. It also describes cross-cutting features unique to LTE-V2X PC5 sidelink (mode 4) that can be used by current and future application standards. The audience for this document includes the developers of applications and application specifications, as well as those interested in LTE-V2X system architecture, testing, and certification.&lt;/div&gt;
    &lt;/div&gt;</p>
