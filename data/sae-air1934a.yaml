  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is to relate areas where carbon brake technology may differ from traditional steel brake technology in design and performance. Carbon brakes have been used on military aircraft for many years and are now frequently used on newly commercial developed aircraft. This document presents some of the lessons learned.&lt;/div&gt;&lt;/div&gt;</p>
