  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification specifies the engineering requirements for heat treatment, by part fabricators (users) or their vendors or subcontractors, of parts made of cast nickel or cobalt alloys and of fabricated assemblies in which cast nickel or cobalt alloys are the primary structural components. This specification is not intended to provide requirements for heat treating operations that are a responsibility of the casting supplier in meeting the requirements of the casting commodity specification.&lt;/div&gt;&lt;/div&gt;</p>
