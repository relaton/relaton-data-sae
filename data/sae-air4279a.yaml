  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;An analysis was made of the effects of various surface conditions on the heat up time of steel bars which are heated in atmosphere furnaces to the temperature range used for steel hardening or normalizing. The purpose was to examine whether a standard heating time for a given section thickness is acceptable.&lt;/div&gt;&lt;/div&gt;</p>
