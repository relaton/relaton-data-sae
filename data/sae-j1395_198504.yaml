    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Technical Report provides test procedures, requirements, and guidelines for turn signal lamps intended for use on vehicles 2032 mm or more in overall width. Turn signal lamps conforming to this report may also be used on vehicles less than 2032 mm in overall width except on passenger cars.&lt;/div&gt;&lt;/div&gt;</p>
