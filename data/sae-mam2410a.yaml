abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This specification covers the engineering requirements for electrodeposition of silver on other metals, usually with a nickel strike between the basis metal and the silver, and the properties of the deposit. AMS 2410 is the inch/pound version of this MAM.&lt;/p&gt;
    &lt;p&gt;This processes has been used typically to provide a bearing surface and to prevent galling or seizing of surfaces of parts made of corrosion-resistant steels and alloys and of parts made of other metals not deleteriously affected by high-temperature baking, but usage is not limited to such applications.&lt;/p&gt;</p>
