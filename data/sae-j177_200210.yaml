abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;The method presented applies to the analysis of the indicated constituents in diesel engine exhaust, or vehicles using diesel engines, when operating at steady-state conditions.&lt;/p&gt;
    &lt;p&gt;The measurements of carbon monoxide, carbon dioxide, and nitric oxide are based on continuous sampling and analysis by nondispersive infrared (NDIR) methods. Measurement of total oxides of nitrogen by chemiluminescence and NDIR methods is discussed.&lt;/p&gt;
    &lt;p&gt;This SAE Recommended Practice provides for the measurement of carbon dioxide, carbon monoxide, and oxides of nitrogen in diesel exhaust.&lt;/p&gt;</p>
