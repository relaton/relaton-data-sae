  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion- and heat-resistant nickel alloy in the form of bars, forgings, flash welded rings up to 4.00 inches (101.6 mm), inclusive, in nominal diameter or least distance between parallel sides (thickness) having a maximum cross-sectional area of less than 12.6 square inches (81 cm&lt;sup&gt;2&lt;/sup&gt;) in the solutioned, stabilized. and precipitation heat-treated condition. Stock for forging or flash welded rings may be of any size and condition as ordered.&lt;/div&gt;&lt;/div&gt;</p>
