  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The Hose Measurement Task Force conducted a round-robin study to determine the measuring capability of automotive suppliers and users to simultaneously measure the Inside Diameter (ID), Outside Diameter (OD), Wall Thickness (Wall), and Wall thickness Variation (WV) of hose using a laser-based, non-contact LOTIS QC-20 gauging device. Three (3) companies (all end users) participated in this testing with one of the three companies performing the GR&amp;amp;R calculations presented herein. Based upon the round-robin study this report will detail procedures, test measuring devices, results, and conclusions.&lt;/div&gt;
    &lt;/div&gt;</p>
