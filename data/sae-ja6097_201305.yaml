  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE JA6097 (“Using a System Reliability Model to Optimize Maintenance”) shows how to determine which maintenance to perform on a system when that system requires corrective maintenance to achieve the lowest long-term operating cost. While this document may focus on applications to Jet Engines and Aircraft, this methodology could be applied to nearly any type of system. However, it would be most effective for systems that are tightly integrated, where a failure in any part of the system causes the entire system to go off-line, and the process of accessing a failed component can require additional maintenance on other unrelated components.&lt;/div&gt;&lt;/div&gt;</p>
