  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides requirements and guidance for laser proponents and aviation authorities to determine the criteria that laser hazard control measures shall meet for the operation of an outdoor laser system in navigable airspace. This document has been developed to be used for a wide range of outdoor laser hazard control measures from completely manual systems to those with various levels of automation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to laser propagation which may expose persons in navigable airspace to laser energy above the applicable maximum permissible exposure limit or which emits visible light in excess of the visual interference limits in the applicable Laser-Free, Critical, and Sensitive Hazard Zones.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The document does not cover systems intended to deliberately aim and or track lasers at aircraft, such as Federal Aviation Administration (FAA) approved purposes, including visual warning systems, search and rescue, etc. Additionally, laser-affected airspace above 60000 feet mean sea level (MSL) is outside the scope of the performance criteria contained herein.&lt;/div&gt;
    &lt;/div&gt;</p>
