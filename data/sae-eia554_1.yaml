  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is intended to provide a uniform method of calculating an estimate of the proportion nonconforming in finished components and to provide a standardized definition of the quality index referred to as Average Outgoing Quality (AOQ). The method used here is primarily directed at components whose production or procured volume is large enough, during some predefined sampling period, to give statistically meaningful information.&lt;/div&gt;&lt;/div&gt;</p>
