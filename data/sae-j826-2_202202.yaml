    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the 2-D computer-aided design (CAD) template for the HPM-1 H-point machine or HPD available from SAE. The elements of the HPD include the curve shapes, datum points and lines, and calibration references. The intended purpose for this information is to provide a master CAD reference for design and benchmarking. The content and format of the data files that are available are also described.&lt;/div&gt;&lt;/div&gt;</p>
