    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines requirements for equipment and supplies to be used in measuring shot peening intensity and other surface enhancement processes. It is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances. Guidelines for use of these items can be found in SAE J443 and SAE J2597.&lt;/div&gt;&lt;/div&gt;</p>
