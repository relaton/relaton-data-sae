  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice applies to construction, general purpose industrial, forestry, and specialized mining machinery as categorized in SAE J1116 JUN85. It describes the machine components and systems that should be disconnected, secured, or otherwise rendered inoperative.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Deterrent systems or devices covered by this Recommended Practice are to be used when the machine is shut down per the manufacturer's shut down instructions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not the intent of this Recommended Practice to protect the machine or the authorized machine operator, or to protect against abuse, destructive vandalism, or theft.&lt;/div&gt;
    &lt;/div&gt;</p>
