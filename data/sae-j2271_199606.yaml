  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Parts Standard provides dimensional and quality assurance requirements for 1/4 through 2 in sizes of studs in the following configurations in standard materials used for ship system applications:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Continuous thread studs in UNRC and 8UNR series.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Double end studs (clamping type) where both ends are of the same thread series (UNRC or 8UN). Also called bolt-studs. (These are suitable for mating with nuts or the set end may be installed with anaerobic thread locking compound.)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Double end studs (interference thread type) with the nut end having UNRC or 8UNR series thread and where the tap end has NC 5 HFS interference fit thread forms. Also called a tap end stud.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;/div&gt;</p>
