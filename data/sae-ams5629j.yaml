  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a premium aircraft-quality corrosion-resistant steel in the form of bars, wire, forgings, flash welded rings, and extrusions up to 12 inches (305 mm) in nominal diameter, or least distance between parallel sides in the solution heat treated condition (see &lt;span class="xref"&gt;8.4&lt;/span&gt;), and stock of any size for forging, flash welded rings, or extrusion (see &lt;span class="xref"&gt;8.8&lt;/span&gt;).&lt;/div&gt;
    &lt;/div&gt;</p>
