  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;An industry survey has been completed to determine the incidence of jam and excessive backlash in rotary and linear mechanical actuators subject to “primary flight control like” duty cycles. The data is valuable for understanding how existing mechanical actuators behave in service, identifying areas for potential improvement and possibly being used as a reference to support future primary flight control system trade-off studies.&lt;/div&gt;

    &lt;/div&gt;</p>
