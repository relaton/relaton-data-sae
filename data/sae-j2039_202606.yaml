  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides test procedures, requirements, and guidelines for side turn signal lamps intended for use on vehicles 12 m or more in overall length, except pole trailers. Side turn signal lamps conforming to the requirements of this document may be used on other large vehicles such as trucks, truck tractors, buses, and other applications where this type of lighting device is desirable.&lt;/div&gt;&lt;/div&gt;</p>
