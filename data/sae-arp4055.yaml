abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this ARP embraces the description of a configuration for a ground-plane microphone installation that may be used to determine sound pressure levels equivalent to those which would have been measured in an acoustic freefield at the microphone location. The one-third - octave-band center-frequency range over which equivalent freefield sound pressure levels may be obtained is from as low as 50 Hz to at least as high as 10,000 Hz.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specific application of the measurement technique described in this ARP is the determination of the equivalent freefield sound pressure levels of the noise produced by propeller-driven light aircraft, in flight, for sound incidence angles within 30 degrees of the normal to the ground. For larger angles to the normal, additional adjustments may be necessary which are outside the scope of this ARP. Caution needs to be exercised, therefore, if the recommended configuration is used to measure the noise from aircraft other than those driven by propeller powerplants, in particular, when full spectral information is required (especially outside the range of 30 degrees to the normal to the ground surface), or when measurements of time-integrated noise descriptors are required.&lt;/div&gt;&lt;/div&gt;</p>
