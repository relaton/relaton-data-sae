abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This specification covers a corrosion and heat resistant nickel alloy in the form of sheet, strip, and foil up to 0.38 millimeters in nominal thickness procured in SI (Metric) units.&lt;/p&gt;
    &lt;p&gt;AMS 5914 is the inch/pound version of this MAM.&lt;/p&gt;
    &lt;p&gt;These products have been used typically for the fabrication of bellows, diaphragms, and other components requiring a combination of high strength, resistance to heat and corrosion, leak tightness, and maximum fatigue life, but usage is not limited to such applications.&lt;/p&gt;</p>
