abstract:
- language: en
  script: Latn
  content: "<p>Minimum performance criteria for service braking systems, secondary
    stopping systems, and parking systems for all self-propelled vibratory and static
    roller/compactors are provided in this SAE Recommended Practice. The purpose of
    this document is to define minimum braking system performance for in-service machines
    and to provide test criteria by which machine braking system performance may be
    verified.</p>"
