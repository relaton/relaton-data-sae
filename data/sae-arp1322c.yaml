  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) specifies the minimum design and qualification test recommendations for aircraft wheel overpressurization release devices used with tubeless aircraft tires to protect from possible explosive failure of the contained inflation chamber due to overinflation. Devices of this type provide a means, but not the only means, for showing compliance to Subsection 25.731(d) of Part 25 of Title 14 of the Code of Federal Regulations. Devices of this type will not protect against flash fire explosive conditions within the inflation chamber which may occur due to extremely overheated brakes or spontaneous combustion caused by a foreign substance within the inflation chamber. To help protect against this condition, nitrogen (N2) or other inert gas should be used for inflation.&lt;/div&gt;

    &lt;/div&gt;</p>
