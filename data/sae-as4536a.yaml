  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procurement specification covers aerospace quality safety cable kits consisting of safety cables and ferrules made from the same corrosion and heat resistant steels and a nickel base alloy of the type identified under the Unified Numbering system as follows:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;UNS S30400 - Corrosion resistant steel (AMS 5697)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;UNS S32100 - Corrosion and heat resistant steel (AMS 5689)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;UNS N06600 - Nickel base alloy (AMS 5687)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements for installation practices are also specified.&lt;/div&gt;&lt;/div&gt;</p>
