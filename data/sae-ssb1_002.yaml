    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is an annex to EIA Engineering Bulletin SSB-1, &lt;i&gt;Guidelines for Using Plastic Encapsulated Microcircuits and Semiconductors in Military, Aerospace and Other Rugged Applications.&lt;/i&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document provides reference information concerning the environmental stresses associated with tests specifically designed to apply to (or have unique implications for) plastic encapsulated microcircuits and semiconductors, and the specific failures induced by these environmental stresses.&lt;/div&gt;&lt;/div&gt;</p>
