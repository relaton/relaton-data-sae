  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides test methods for evaluating the maximum power of electrified vehicle powertrain systems by direct measurement at the drive wheel hubs or axles. Additional tests are included specifically for PHEVs to measure electric-only propulsion power and for HEVs to measure electric power assist and regenerative braking. The testing requires either a chassis or hub dynamometer for all driven wheels. Results are processed to provide fair and consistent comparisons of power capabilities among different designs of electrified powertrains. Tests can also be performed on conventional vehicles if precise comparisons to electrified vehicles are desired.&lt;/div&gt;&lt;/div&gt;</p>
