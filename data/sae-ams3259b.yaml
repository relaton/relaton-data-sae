abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This specification covers a polythioether sealing compound with nonchromated corrosion inhibitors supplied as a two-component system which cures at room temperature.&lt;/p&gt;
    &lt;p&gt;The compound has been used typically for faying surface sealing and for wet-installation of fasteners in aircraft structural joints, but usage is not limited to such applications. This compound is also suitable for fillet sealing and overcoating fasteners in nonfuel areas. The sealing compounds are usable from -65 to +320 degrees F (-54 to +160 degrees C) with short term (six hour) exposures up to 36 degrees F (182 degrees C).&lt;/p&gt;</p>
