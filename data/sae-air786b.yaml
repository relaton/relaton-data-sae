    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document contains data relative to the chemical nature of aerospace fluids and relates each to its empirical effect upon elastomeric components. Since the compatibilities of elastomers are determined by the compounding as well as the nature of the base polymer, the elastomers considered are limited to finished compounds for which material or performance specifications can be referenced.&lt;/div&gt;
