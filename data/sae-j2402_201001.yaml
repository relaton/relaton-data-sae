  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies symbols (i.e. conventional signs) for use on controls, indicators, and tell-tales applying to passenger cars, light and heavy commercial vehicles, and buses, to ensure identification and facilitate use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It also indicates the colors of possible optical tell-tales, which inform the driver of either correct operation or malfunctioning of the related devices.&lt;/div&gt;&lt;/div&gt;</p>
