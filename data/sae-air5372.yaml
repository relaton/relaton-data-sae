  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;A panel of the SAE A-5A Committee prepared this SAE Aerospace Information Report (AIR). The document describes the design approaches used for current applications of Brake-by-Wire (BBW) control systems that are used on commercial and military airplanes. The document also discusses the experience gained during service in the commercial and military environments, and covers system, ergonomic, hardware, and development aspects. The treatment includes the lessons that have been learned during application of the technology.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Although there are a variety of approaches that have been used in the design of BBW systems, the main focus of this document is on systems that use the electro-hydraulic method of control. The overall range of implementations is briefly described in &lt;span class="xref"&gt;2.3&lt;/span&gt;. &lt;span class="xref"&gt;Sections 3&lt;/span&gt;, &lt;span class="xref"&gt;4&lt;/span&gt;, and &lt;span class="xref"&gt;5&lt;/span&gt; describe the electro-hydraulic method in detail.&lt;/div&gt;

    &lt;/div&gt;</p>
