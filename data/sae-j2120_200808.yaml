  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to personal watercraft as defined in &lt;span class="xref"&gt;Section 3&lt;/span&gt;. With the exception of &lt;span class="xref"&gt;Sections 5&lt;/span&gt; and &lt;span class="xref"&gt;6&lt;/span&gt;, this document does not apply to electronic circuits having a current flow of less than 1 A; conductors which are totally inside an equipment housing; resistance conductors that control circuit amperage; high-voltage secondary conductors and terminations that are in ignition systems; pigtails of less than 180 mm of exposed length; and cranking motor conductors.&lt;/div&gt;
    &lt;/div&gt;</p>
