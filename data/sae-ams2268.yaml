    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers chemical check (product or verification) analysis limits as established by AMS usage. The chemical check analysis limits shown herein shall apply when this specification is referenced in material specifications for cast nickel and nickel alloys. Check analysis limits for elements or for ranges of elements not listed herein shall be as specified in the applicable material specification or as agreed upon by purchaser and vendor.&lt;/div&gt;&lt;/div&gt;</p>
