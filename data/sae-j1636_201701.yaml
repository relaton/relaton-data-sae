  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to review factors that influence the behavior of elastomeric components under conditions of loading or deforming at a constant rate and to provide guidance concerning test procedures used to define or specify the load/deformation characteristics of elastomeric components. This characteristic is referred to as Static Stiffness. This is also referred to as a "Static Deflection Test."&lt;/div&gt;&lt;/div&gt;</p>
