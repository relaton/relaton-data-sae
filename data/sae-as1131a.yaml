  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes four sizes of basic pallet nets as follows:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Size F (10 ft) - To restrain a 96 x 117.75 x 96 in. (2,43 x 2,99 x 2,43 m) high (maximum) load.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Size G (20 ft) - To restrain a 96 x 238.500 x 96 in. (2,43 x 6,05 x 2,43 m) high (maximum) load.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Size H (30 ft) - To restrain a 96 x 359.25 x 96 in. (2,43 x 9,12 x 2,43 m) high (maximum) load.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Size J (40 ft) - To restrain a 96 x 480 x 96 in. (2,43 x 12,19 x 2,43 m) high (maximum) load.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
