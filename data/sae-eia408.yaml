  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard applies to the interconnection of data terminal equipment and numerical control equipment at the tape reader interface. The data terminal would typically be connected to a remote data source/sink such as a computer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard defines:&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;This standard is applicable for the interchange of signals when used in conjunction with electronic equipment, each interchange circuit of which has a single return (signal ground) that can be interconnected at the interface point.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Figure 1.1&lt;/span&gt;, typical installation, shows how this standard should be applied to a typical tape reader interface of numerical control equipment.&lt;/div&gt;&lt;/div&gt;</p>
