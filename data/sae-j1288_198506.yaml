  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report is the listing of recommendations for the proper packaging, storage, and shelf life limitations of new and unused hydraulic brake hose assemblies. The report embodies the testing, analysis, and experience of many users and manufacturers. Where specific manufacturer's recommendations are made, those recommendations shall supersede the recommendations of this report.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This report describes the successful procedures and practices associated with brake hose assemblies usage by a wide cross section of manufacturers and users over several years. The practices are expected to be applicable to all brake hose assemblies which qualify under SAE Standard J1401.&lt;/div&gt;&lt;/div&gt;</p>
