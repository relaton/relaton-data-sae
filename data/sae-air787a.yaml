  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides technical information to assist the development of specific cleaning methods for filter elements. Consideration is limited to filter elements which are designated as "cleanable" (not "disposable"), but which cannot be cleaned by simple and obvious procedures. Cleaning methods developed according to this report should be evaluated by the methods of ARP725.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Satisfactory cleaning methods can be developed for most "cleanable" filter elements. Technical or economic feasibility of the cleaning method may be limited, however, by incompatibility of filter-element construction materials, by mechanical weakness or lack of corrosion resistance to withstand repeated or continued cleaning, or by the presence of unusually tenacious contamination. These factors must be considered when selecting approaches to the development of specific methods.&lt;/div&gt;
    &lt;/div&gt;</p>
