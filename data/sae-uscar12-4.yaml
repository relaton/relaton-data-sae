  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document gives specific and measurable design criteria to be applied at a design review prior to tooling. The specification is formatted as a checklist to aid in its use. The requirements do not apply in all situations so engineering judgment must be used. This is a specification for design criteria; applicable performance specifications (USCAR-2, etc.) must still be performed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Items in this document are grouped by component as follows:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;A&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Terminals&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;B&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Secondary Terminal Locks&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;C&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Connectors&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;D&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Connector Locks&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;E&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Secondary Connector Locks (Connector Position Assurance, CPA)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;F&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Connector Seals&lt;/div&gt;&lt;/li&gt;
