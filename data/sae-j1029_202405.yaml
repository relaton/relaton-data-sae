  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes minimum requirements for lighting and marking earthmoving work machinery as defined in SAE J1116. It may be used as guidance for other types of machinery.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Earthmoving work machines are normally operated off-highway. Therefore, this SAE document is not intended to be used as a basis for regulations by those having authority over on-highway motor vehicles.&lt;/div&gt;&lt;/div&gt;</p>
