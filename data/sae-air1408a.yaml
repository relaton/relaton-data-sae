  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report lists documents that aid and govern the design of gas turbine powered aircraft and missile fuel systems. The report lists the military and industry specifications and standards and the most notable design handbooks that are commonly used in fuel system design.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specifications and standards section has been divided into two parts, a master list arranged numerically of all industry and military specifications and standards and a component list that provides a functional breakdown and a cross-reference of these documents. It is intended that this report be a supplement to specifications MIL-F-8615, MIL-F-17874, MIL-F-38363 and MIL-F-87154. Revisions and amendments which are correct for the specifications and standards are not listed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The fuel system design handbooks are listed for fuels and for system and component design.&lt;/div&gt;
    &lt;/div&gt;</p>
