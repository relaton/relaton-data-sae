  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The &lt;u&gt;E&lt;/u&gt;nvironmental Control &lt;u&gt;A&lt;/u&gt;nalysis &lt;u&gt;SY&lt;/u&gt;stem (EASY) computer program is summarized in this report. Development of this computer program initially was sponsored by the U.S. Air Force Flight Dynamics Laboratory. (See References 1, 2, 3, and 4.) It provides techniques for determination of steady state and dynamic (transient) ECS performance, and of control system stability; and for synthesis of optimal ECS control systems. The program is available from the U.S. Air Force, or as a proprietary commercial version.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;General uses of a transient analysis computer program for ECS design and development, and general features of EASY relative to these uses, are presented. This report summarizes the nine analysis options of EASY, EASY program organization for analyzing ECS, data input to the program and resulting data output, and a discussion of EASY limitations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Appendices provide general definitions for dynamic analysis, and samples of input and output for EASY.&lt;/div&gt;&lt;/div&gt;</p>
