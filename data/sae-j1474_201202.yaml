abstract:
- language: en
  script: Latn
  content: "<p>The following topics are included in this report:\nSection 2 - References\n\tSection
    3-Definitions\nSection 4 - Material Selection\nSection 5 - Production Considerations\nSection
    6 - Initial Structural Integrity\nSection 7 - In-Vehicle Testing\nSection 8 -
    Laboratory Testing\n\nThe Material Selection section lists environmental factors
    and material properties which should be considered when determining appropriate
    fan material(s) for a given application.\n\nThe Production Considerations section
    covers various aspects of machine selection, mold design, and process control.\nThe
    Initial Structural Integrity section lists factors which should be considered
    in addition to those covered by Section 3 of SAE J1390.\n\nThe In-Vehicle Testing
    section lists factors which should be considered in addition to those covered
    by Section 4 of SAE J1390.\n\nThe Laboratory Testing section addresses some test
    considerations and methods for nonmetallic fans which differ from those used with
    metallic fans or which were not included in Section 5 of SAE J1390.</p>"
