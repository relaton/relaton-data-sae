  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the minimum construction and performance requirements for seven conductor 1/8-2/10-4/12 cable for use on trucks, trailers, and converter dollies for 12 VDC nominal applications. Where appropriate, the standard refers to two types of cables (Type F and S, described later in the standard), due to the variation in the performance demands of cables used in flexing and stationary applications. While the document’s title refers to ABS Power to differentiate the document from the SAE J1067 standard that it supersedes, the scope applies to both the primary green cable for powering ABS and lighting and the yellow auxiliary cable of the same construction.&lt;/div&gt;&lt;/div&gt;</p>
