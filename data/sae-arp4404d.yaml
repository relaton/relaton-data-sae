  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;It is the purpose of this document to present design recommendations that will provide a basis for satisfactory and safe electrical installations in transport aircraft. This document is not intended to be a complete electrical installation design handbook. However, the requirements for safety extend so thoroughly throughout the electric systems that few areas of the installation are untouched by the document. It is recognized that individual circumstances may alter the details of any design. It is, therefore, important that this document not be considered mandatory but be used as a guide to good electrical application and installation design.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Transport aircraft electric systems have rapidly increased in importance over a number of years until they are now used for many functions necessary to the successful operation of the aircraft. An ever increasing number of these functions are critical to the safety of the aircraft and its occupants. The greatly increased power available in electric systems is another factor in aircraft safety. These considerations make it essential that aircraft electrical design practices be carefully considered from the standpoint of safety and reliability. It is believed that this document will be of value in pointing out potential difficulties and in solving many of the problems.&lt;/div&gt;&lt;/div&gt;</p>
