    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides a record of the development by SAE AGE-2A Air Cargo Sub-Committee of Aerospace Standard AS36100, Air Cargo Unit Load Devices - Performance Requirements and Test Parameters, published 2005-02, intended as a technical reference for airworthiness approval of air cargo unit load devices (pallets, nets and containers) to be loaded with either baggage or freight on board civil transport aircraft, and to partly supersede previously used NAS 3610, Cargo unit load devices - Specification for - [Revision 10, 1990, referenced in TSO C90c].&lt;/div&gt;&lt;/div&gt;</p>
