  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard defines the common nonconformity data definition and documentation that shall be exchanged between an internal/external supplier or sub-tier supplier, and the customer when informing about a nonconformity requiring formal decision. The requirements are applicable, partly or totally, when reporting a product nonconformity to the owner or operator, as user of the end item (e.g., engine, aircraft, spacecraft, helicopter), if specified by contract.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Reporting of nonconformity data, either electronically or conventionally on paper, is subject to the terms and conditions of the contract. This also includes, where applicable, data access under export control regulations.&lt;/div&gt;&lt;/div&gt;</p>
