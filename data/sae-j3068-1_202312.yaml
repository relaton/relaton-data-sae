  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is an optional addition to SAE J3068 that adds additional communications (using LIN-CP) between the EV and SE that provide capabilities valuable to commercial fleets. These include the ability of the EV and SE to exchange unique identifiers, to establish which EV is connected to which SE, and to specify requirements for the next trip.&lt;/div&gt;&lt;/div&gt;</p>
