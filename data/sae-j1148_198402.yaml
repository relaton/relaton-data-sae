  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice is intended to outline basic nomenclature and terminology in common use for engine charge air coolers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;An Engine Charge Air Cooler is a heat exchanger used to cool the charge air of an internal combustion engine after it has been compressed by an exhaust gas driven turbocharger and/or mechanically driven blower. The use of an engine charge air cooler allows increased engine output because of the denser and cooler air available for combustion. Normal cooling sources are the engine’s coolant, a raw water source, or air.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Engine charge air coolers are often referred to as either Intercoolers or Aftercoolers depending upon their location, relative to the final compression stage, in the air induction system.&lt;/div&gt;
