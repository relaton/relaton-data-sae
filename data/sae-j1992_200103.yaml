  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides minimum performance requirements and uniform laboratory procedures for fatigue testing of disc wheels, demountable rims, and bolt-together wheels intended for normal highway use on military trucks, buses, truck-trailers, and multipurpose vehicles. For wheels and rims intended for normal highway use by trucks, see SAE J267. For wheels intended for normal highway use by passenger cars, light trucks, and multipurpose vehicles, see SAE J328. For wheels used on trailers drawn by passenger cars, light trucks, or multipurpose vehicles, see SAE J1204. This document does not cover off-highway or other special application wheels and rims.&lt;/div&gt;&lt;/div&gt;</p>
