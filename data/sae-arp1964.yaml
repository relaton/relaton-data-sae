  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Satisfactory measurements of noise in personnel-occupied rotorcraft cabins may require test techniques different from those prescribed for other types of aircraft (ARP1323) because rotorcraft operate under significantly different flight conditions. Recommendations of this ARP apply to the recording of acoustical data on magnetic tape and the subsequent processing and analysis of the recorded data.&lt;/div&gt;&lt;/div&gt;</p>
