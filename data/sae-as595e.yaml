  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides general design and test requirements for a flat cut-off pressure compensated, variable delivery hydraulic pump for use in a civil aircraft hydraulic system with a rated system pressure up to 5000 psi (34500 kPa).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Hydraulic pumps may incorporate features such as a clutch in the input drive, which will not be covered by this standard.&lt;/div&gt;

    &lt;/div&gt;</p>
