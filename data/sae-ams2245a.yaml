    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established inch/pound manufacturing tolerances applicable to titanium and titanium alloy extruded bars, rods, and shapes ordered to inch/pound dimensions. These tolerances apply to all conditions, unless otherwise noted. The term “excl” applies only to the higher figure of the specified range.&lt;/div&gt;&lt;/div&gt;</p>
