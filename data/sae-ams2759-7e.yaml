  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification, in conjunction with the general requirements for steel heat treatment covered in AMS2759, establishes the requirements and procedures for three classes of gas, vacuum, liquid, and low pressure (LPC) carburizing and related heat treatment of parts fabricated from carburizing grade steels. Parts made from steels other than those specified in the detail specifications may be heat treated in accordance with the applicable requirements using processing temperatures, times, and other parameters recommended by the material producer unless otherwise specified by the purchaser. This specification does not cover pack carburizing.&lt;/div&gt;

    &lt;/div&gt;</p>
