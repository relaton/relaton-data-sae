  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is intended to provide a method to obtain repeatable measurements that accurately reflect true engine performance in customer service. Whenever there is an opportunity for interpretation of the standard, a good faith effort shall be made to obtain the engine’s typical in-service performance and avoid finding the best possible performance under the best possible conditions. Intentional biasing of engine component or assembly tolerances to optimize performance for this test is prohibited.&lt;/div&gt;


    &lt;/div&gt;</p>
