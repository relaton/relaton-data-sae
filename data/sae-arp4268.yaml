  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this Aerospace Recommended Practice (ARP) covers where, when, and how often to sample hydraulic system fluid on aerospace vehicles for particulate contamination measurements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The measurement of hydraulic fluid particulate contamination is of concern to the aerospace community because of the critical importance of hydraulic equipment reliability. Contamination is always present in the system fluid, even in new unused fluid. Contamination must be below a level that will not adversely affect system operation. This ARP draws from aerospace industry experience and practice to establish criteria for fluid contamination sampling recommendations in aerospace vehicle hydraulic systems. Fluid samples can then be subjected to measurement of particulate contamination and of other harmful contaminants such as chlorinated solvents and water.&lt;/div&gt;&lt;/div&gt;</p>
