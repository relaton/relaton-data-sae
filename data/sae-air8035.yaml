  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) summarizes prior empirical findings (AIAA 2018-3991; Chati, 2018) to recommend a modified baseline fuel flow rate model for jet-powered commercial aircraft during taxi operations on the airport surface that better reflects operational values. Existing standard modeling approaches are found to significantly overestimate the taxi fuel flow rate; therefore, a modified multiplicative factor is recommended to be applied to these existing approaches to make them more accurate. Results from the analysis of operational flight data are reported, which form the basis for the modeling enhancements being recommended.&lt;/div&gt;&lt;/div&gt;</p>
