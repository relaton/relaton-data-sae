    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is for providing an overview of the type of information that is needed by insurance and the collison repair industry on plastic repairs. The format herein should be considered as that required for plastic repairs in general. The specific information contained applies to the repair and refinishing of most flexible, semi-flexible, and rigid exterior plastic body parts. When a new type of plastic is being introduced to the market through a new vehicle program, the specific repair and refinishing procedures should follow the same format as this document.&lt;/div&gt;
    &lt;/div&gt;</p>
