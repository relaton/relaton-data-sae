  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide guides toward standard conditions for operating marine hydraulic transmissions where push-pull cable control is applicable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For control cable information see SAE J917.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Provide suitable detents at forward, neutral, and reverse positions. Approximately 22 N (5 lb) of cable force are required to move the engine clutch lever out of the detent positions.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Provide an engine clutch lever with a 6.35 mm (¼ in) diameter hole at a radius to provide 70 mm (2¾ in) linear travel from forward to reverse, with neutral at the center.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The engine clutch lever (at 6.35 mm [¼ in] diameter hole) to have 6.35 mm (¼ in) maximum thickness.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Common cable terminals used are ball joints, clevises, and pivots.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Provide clear cable path to engine clutch lever.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Provide choice of cable paths from different angles. This can be done by providing a sector type of lever with a series of holes equidistant from the centerline of the shaft. It can also be done by having the engine clutch lever repositionable on the engine clutch control shaft.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Provide bracket support near the engine clutch control shaft. This can be a hub, bolt holes, bolt, or other means for use for attaching a cable anchor bracket.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A bolt pattern concentric with the engine clutch control shaft is desirable.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
