abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Hardness measurements are used as a quality control check of the consistency of formulation and processing of brake linings. Gogan hardness is nondestructive (the penetrator causes shallow surface deformation.). Gogan hardness method alone does not show anything about a lining’s ability to develop friction or to resist fade when used as a friction element in brakes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The hardness and the range of hardness are peculiar to each formulation, thickness, and contour; therefore, the acceptable values and ranges must be established for each formulation and part configuration by the manufacturer.&lt;/div&gt;

    &lt;/div&gt;</p>
