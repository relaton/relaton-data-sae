  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The information and data contained in this SAE Information Report are intended as a guide in the selection of steel types and grades for various purposes. Consideration of the individual types of steel is preceded by a discussion of the factors affecting steel properties and characteristics.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J4xx steels are generally purchased on the basis of chemical composition requirements (SAE J403, SAE J404, and SAE J405). High-strength, low-alloy (HSLA) steels (SAE J1392 and SAE J1442) are generally purchased on the basis of mechanical properties; different chemical compositions are used to achieve the specified mechanical properties. Because these steels are characterized by their special mechanical properties obtained in the as-rolled condition, they are not intended for any heat treatment by the purchaser either before, during, or after fabrication.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In many instances, as in the case of steels listed in SAE J1268 and SAE J1868, hardenability is also a specification requirement. This information report can be used as a reference for determining the general characteristics and applications of commonly used SAE steels. The use of the typical heat treatments listed in &lt;span class="xref"&gt;Tables 1&lt;/span&gt; through &lt;span class="xref"&gt;7&lt;/span&gt; is recommended. These and other heat treatments commonly used on steel are briefly described at the end of this section.&lt;/div&gt;&lt;/div&gt;</p>
