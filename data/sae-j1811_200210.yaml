    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended for light and heavy-duty on-highway trucks and their trailers; and off-road machinery applications as described in SAE J1116. The terminals described in this document are primarily used to connect batteries, cranking motors, solenoids, magnetic switches, and master disconnect switches and power cable assemblies.&lt;/div&gt;
