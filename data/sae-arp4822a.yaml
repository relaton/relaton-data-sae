  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) reviews the basics of NVIS compatibility and discusses the specific illuminated pushbutton switch and indicator requirements for sunlight readability, color, luminance, and NVIS radiance when used in NVIS compatible cockpits.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommendations and special considerations set forth in this document are made to give the design engineer a better understanding of MIL-L-85762A and MIL-STD-3009 NVIS compatibility requirements and to provide information on the visual characteristics of NVIS compatible pushbutton switch and indicators. The recommendations are primarly for military aircraft since civilian aircraft FAR requirements typically do not cover NVIS applications with the exception of those covered by RTCA/DO-275.&lt;/div&gt;
    &lt;/div&gt;</p>
