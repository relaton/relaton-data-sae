abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a set of standard application layer interfaces called JAUS Core Services.  JAUS Services provide the means for software entities in an unmanned system or system of unmanned systems to communicate and coordinate their activities.  The Core Services represent the infrastructure commonly found across all domains and types of unmanned systems.  At present, seven services are defined in this document:

    o	Transport Service: Abstracts the functionality of the underlying communication transport layer
    o	Events Service: Establishes a publish/subscribe mechanism for automatic messaging
    o	Access Control: Manages preemptable exclusive control for safety critical operations
    o	Management: Defines component life-cycle management
    o	Time: Allows clients to query and set the system time for the component
    o	Liveness: Provides a means to maintain connection liveness between communicating components
    o	Discovery: Governs automatic discovery of remote entities and their capabilities
    Each service is described by a JAUS Service Definition (JSD) which specifies the message set and protocol required for compliance. Each JSD is fully compliant with the JAUS Service Interface Definition Language [JSIDL].


