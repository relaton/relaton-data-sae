  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The backup ring is defined. The various types designed for use with O-rings in MIL-G-5514 packing glands, and MS33566 and MS21344 universal fitting installations are described.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Guidelines are included for selecting backup rings and backup ring materials. Backup ring installation procedures and precautions are described.&lt;/div&gt;
