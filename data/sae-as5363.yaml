  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes general requirements for a family of trip-free Electromechanical Power Controller/Relays (EMPC) with electronic overcurrent sensing and control, intended for use in electrical systems conforming to RTCA, D0160 Revision C. These devices will be utilized for the protection of ac and/or dc electrical systems, bus feeders, and electrical equipment.&lt;/div&gt;&lt;/div&gt;</p>
