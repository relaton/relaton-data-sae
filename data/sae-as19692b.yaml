  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the general requirements for the design, construction, acceptance, and qualification testing of flat cut-off pressure compensated, variable delivery hydraulic pumps used in military aircraft hydraulic systems. It also provides parameters for a Procurement Specification to be used in conjunction with this AS.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The hydraulic pumps defined by this AS are generally for use in aircraft hydraulic systems conforming to and as defined in AS5440 and MIL-H-8891, as applicable.&lt;/div&gt;

    &lt;/div&gt;</p>
