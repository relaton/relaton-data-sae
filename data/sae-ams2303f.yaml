  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers steel cleanliness requirements in inch/pound units for aircraft-quality, ferro-magnetic, hardenable, corrosion-resistant steels as determined by magnetic particle inspection methods. This specification contains sampling, specimen preparation, and inspection procedures and cleanliness rating criteria (See &lt;span class="xref"&gt;8.2&lt;/span&gt;).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The metric version, MAM2303, has been cancelled. The SI units have been included in this specification, but the inch-pound units are primary (See &lt;span class="xref"&gt;8.5&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
