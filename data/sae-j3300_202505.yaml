  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to establish a procedure to certify the fundamental driving skill levels of professional drivers. This certification can be used by the individual driver to qualify their skills when seeking employment or other professional activity. These certification levels may also be used by test facilities or other organizations when seeking test or professional drivers of various skills. The associated family of documents listed below establish driving skill criteria for various specific categories.&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J3300: Driving level&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J3300/1: Low mu/winter driving&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J3300/2: Trailer towing&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J3300/3: Automated driving&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;Additional certifications to be added as appropriate.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This main document provides: (1) common definitions and general guidance for using this family of documents, (2) directions for obtaining certification through Probitas Authentication&lt;sup&gt;®&lt;/sup&gt;&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;, and (3) driving level examination requirements.&lt;/div&gt;&lt;/div&gt;</p>
