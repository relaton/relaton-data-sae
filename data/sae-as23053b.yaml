  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for various types and colors of electrical insulating sleeving that will shrink to a predetermined size upon the application of heat. This specification includes provisions for demonstrating compliance with qualification requirements (see &lt;span class="xref"&gt;Section 4&lt;/span&gt; and &lt;span class="xref"&gt;7.3&lt;/span&gt;), in process inspection, and statistical process control inspections (see &lt;span class="xref"&gt;4.4&lt;/span&gt;). The continuous operating temperature ranges for the sleeving classes covered by this specification are from -112 to +482 °F (-80 to +250 °C). The continuous operating temperature range for each sleeving class is given in the applicable detail specification.&lt;/div&gt;&lt;/div&gt;</p>
