    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These general operator precautions apply to off-road work machines as defined in SAE J1116, and Agricultural Tractors as defined in ANSI/ASAE S390, Nov 2004. These should not be considered as all-inclusive for all specific uses and unique features of each particular machine. Other more specific operator precautions not mentioned herein should be covered by users of this recommended practice for each particular machine application.&lt;/div&gt;
