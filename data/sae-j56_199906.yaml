    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies test methods and general requirements for the determination of the electrical characteristic data of alternators for road vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It applies to alternators, cooled according to manufacturer’s instructions, mounted on internal combustion engines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document attempts to follow ISO 8854, dated 1988. ISO 8854 has been modified herein to reflect local market requirements and historical precedent.&lt;/div&gt;&lt;/div&gt;</p>
