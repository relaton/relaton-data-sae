    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes test procedures for evaluating hardware used in Type 1 and Type 2 motor vehicle seat belt assemblies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The hardware test procedures covered in this report are intended to supersede those now reported in SAE J4c. Related hardware performance requirements are covered in SAE J141. Test procedures and performance requirements for seat belt retractors will likewise be covered in separate SAE Recommended Practices to be issued later.&lt;/div&gt;&lt;/div&gt;</p>
