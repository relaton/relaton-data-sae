  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The test method describes the procedure for determination of the total acid number (TAN) of new and degraded polyol ester and diester-based gas turbine lubricants by the potentiometric titration technique. The method was validated to cover an acidity range of 0.05 to 6.0 mg KOH g&lt;sup&gt;-1&lt;/sup&gt;. The method may also be suitable for the determination of acidities outside of this range and for other classes of lubricants.&lt;/div&gt;
    &lt;/div&gt;</p>
