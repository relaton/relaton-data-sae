  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE/USCAR-45 defines test methods and performance requirements for ultrasonically-welded wire-to-wire splices for automotive applications. Face-to-face, butt splice, and center strip configurations per &lt;span class="xref"&gt;Figure 1&lt;/span&gt; can be tested. The tests defined in this specification subject samples on test to stresses that simulate a lifetime of exposure for a road vehicle. Stresses called out in this specification include thermal shock, temperature/humidity cycling and mechanical stress from different directions.&lt;/div&gt;



    &lt;/div&gt;</p>
