  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is a guideline for the design and operation of Aviation Aircraft Refueling Vehicles and for the materials, components, and systems used thereon. The criteria set forth herein are the minimum recommendations for all types of aircraft refueling vehicles, including tanker vehicles, hydrant service vehicles, towable hydrant carts, fixed refueling cabinets, and any other type of aircraft refueling vehicles used at airports for aircraft refueling operations with nominal operating fuel pressures and flow rates as specified within this document.&lt;/div&gt;&lt;/div&gt;</p>
