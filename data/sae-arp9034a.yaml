abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes requirements for standardized processes (and associated technologies) that ensure type design data are retrievable and usable for the life of a type certificate (50+ years). These processes are primarily concerned with, but not limited to, digital type design data retained in three-dimensional representations and associated data that is required for complete product definition, such as tolerances, specification call-outs, product structure and configuration control data, etc. This process standard includes process requirements for managing the evolution of technologies required to ensure the availability of the data for the life of the product. This data must be available to meet regulatory, legal, contractual and business requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This process standard is not intended to incorporate every company specific requirement and does not dictate specific organizational structures within a company. This process standard does not specify a design or an implementation. Actual implementations may distribute responsibilities or break out functionality differently.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document assumes that all requirements for configuration management of the type design data as specified by CFR Title 14, Part 21 [CFR 21] are in place and therefore are not specifically described in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document sets forth the minimum requirements for product data storage. If an organization chooses to implement requirements beyond those outlined in this standard, those additional requirements shall not conflict or negatively impact the standard requirements. Additional requirements shall also be documented for auditing purposes.&lt;/div&gt;
    &lt;/div&gt;</p>
