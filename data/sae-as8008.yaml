  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard covers Flight Director Equipments which display to the pilot a computed command for the operation of an aircraft in accordance with selected Mode(s). The term “Equipment” may include controls, displays, computers, etc. and may include sensors if furnished as a part of the Flight Director.&lt;/div&gt;&lt;/div&gt;</p>
