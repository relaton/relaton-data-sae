  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends criteria for the design and installation of flight crew rest facilities (FCRF) on transport category aircraft when operations with an augmented flight crew are performed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Within this ARP, the term “must” will indicate items required for compliance with outside known government regulations, especially 14 CFR Part 117. “Shall” describes sections which are required if this ARP is used as a means of compliance. The term “should” will indicate optional requirements, preferences, and recommendations of the approving SAE committee.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Wherever noted and bracketed as [FAA] or [EASA], this document includes agency regulations for reference that are not otherwise evaluated herein.&lt;/div&gt;&lt;/div&gt;</p>
