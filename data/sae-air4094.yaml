  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) supplies information on the flight control systems incorporated on various aircraft. A brief description of the aircraft is followed by a description of the flight control system, some specific components, drawings of the internal arrangement, block diagrams, and schematics. System operation redundancy management is also presented.&lt;/div&gt;&lt;/div&gt;</p>
