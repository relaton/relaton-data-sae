    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies dimensional, functional and visual requirements for Automotive grade coaxial cable. This material will be designated AG for general-purpose automotive applications or AG LL for low loss applications. It is the responsibility of the user of this cable to verify the suitability of the selected product (based on dimensional, mechanical, electrical and environmental requirements) for its intended application. It is the responsibility of the supplier to retain and maintain records as evidence of compliance to the requirements detailed in this standard.&lt;/div&gt;&lt;/div&gt;</p>
