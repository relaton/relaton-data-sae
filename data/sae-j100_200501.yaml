  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes boundaries for shade bands on glazed surfaces in class "A" vehicles. These boundaries are located so that the shade band can provide occupant comfort and driver vision protection from glare, with respect to solar radiation, under some lighting and driving conditions. Since shade bands transmit less visible light than adjacent glazed surfaces, the shade band boundaries establish boundaries for the driver's field of view.&lt;/div&gt;
    &lt;/div&gt;</p>
