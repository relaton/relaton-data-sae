    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test can be used to determine the resistance to crocking (color rub-off) of organic trim materials such as fabrics, vinyl coated fabrics, leather, coated fiberboard and carpet.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This method is similar to AATCC Method 8 –Colorfastness to Crocking.&lt;/div&gt;&lt;/div&gt;</p>
