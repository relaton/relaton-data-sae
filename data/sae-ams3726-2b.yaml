abstract:
- language: en
  script: Latn
  content: "<p>This specification covers a filled, resinous, thermosetting, precatalyzed
    compound in the form of sheet capable of being applied and cured in place between
    the surfaces of mechanically fastened (joined) structures.  This product has been
    used typically as a molded shim during assembly of aircraft components and parts,
    but usage is not limited to such applications.  The compound covered by this detail
    specification requires storage in the frozen condition until just prior to installation.</p>"
