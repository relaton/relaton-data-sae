abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides a comprehensive compilation of currently available practices, standards, regulations, and guidance material that have been considered relevant for developing an electrified propulsion system (independently or as part of an aircraft) and that may also help the applicants in the process of building their own certification approach with their Authority. It also covers unique considerations for electrified propulsion development and aircraft integration. It focuses on the particularities introduced by the new technology.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is not intended to represent a proposed Means of Compliance (MoC) with any particular certification regulation.&lt;/div&gt;
    &lt;/div&gt;</p>
