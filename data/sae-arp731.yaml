  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Recommendations of this ARP refer specifically to the application of closed cycle vapor cycle refrigeration systems as a source of cooling in an aircraft air conditioning system. General recommendations for an air conditioning system which may include a vapor cycle system as a cooling source are included in ARP 85, Air Conditioning Equipment, General Requirements for Subsonic Airplanes, ARP 292, Air Conditioning, Helicopters, General Requirements For, and AIR 806, Air Conditioning Design Information for Cargo and High Density Passenger Transport Airplanes, and are not included herein.&lt;/div&gt;&lt;/div&gt;</p>
