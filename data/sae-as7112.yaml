  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) establishes the requirements for manufacturers of Fluid System Components to be accredited by the National Aerospace and Defense Contractors Accreditation Program (NADCAP). NADCAP accreditation is granted in accordance with SAE AS7003 after demonstrating compliance with the requirements herein. These requirements may be supplemented by additional requirements specified by NADCAP Fluid System Components Task Group. Using the corrsponding Audit Criteria checklists (PRI ACs) will ensure that accredited Fluid System suppliers meet all of the requirements in this standard and all applicable supplementary standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this audit program is to assess a supplier's ability to consistently provide a product or service that conforms to the technical specifications and customer requirements. The corresponding audit criteria are also structured to obtain information relevant to management practices and processes that directly or indirectly affect the product or service. The information thus obtained will be used for determination of accreditation status, and may be used by the supplier to guide improvements in the product/service or associated processes.&lt;/div&gt;&lt;/div&gt;</p>
