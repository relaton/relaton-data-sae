  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies: a test method for assessing the lubricating property of diesel fuels including those which may contain a lubricity enhancing additive, and the performance criteria necessary to ensure reliable operation of diesel fuel injection equipment with respect to fuel lubrication of such equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It applies to fuel used in diesel engines.&lt;/div&gt;&lt;/div&gt;</p>
