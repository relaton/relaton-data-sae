  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides vehicle-level data collection, data analysis, and data verification procedures that may be used to verify that an instrument under test (IUT) satisfies the vehicle-level requirements specified in SAE J3161/1. For the purposes of this report, “vehicle-level requirements” primarily consist of those requirements which can be verified external to the vehicle. The IUT for these procedures is a configured LTE-V2X vehicle-to-vehicle (V2V) device as defined in SAE J3161/1 and is installed on a light vehicle&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; or public safety vehicle&lt;span class="xref"&gt;&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;. While the IUT is conceptually separated from the vehicle it is installed on, the tests outlined in this document are primarily vehicle-level so the terms “vehicle” and “IUT” can generally be considered interchangeable. Additionally, non-vehicle-level complimentary tests, not included in this document, are required to verify that the entire set of requirements specified in SAE J3161/1 is satisfied.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;This document also includes a Traceability Matrix to provide traceability between SAE J3161/1 sections and the test procedures. This can be used to ensure thoroughness of testing coverage. The traceability matrix in &lt;span class="xref"&gt;Section 7&lt;/span&gt; correlates test procedures from this document with the sections in SAE J3161/1 being tested.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE J3161/1 sections that are addressed in this document are indicated in &lt;span class="xref"&gt;Table 1&lt;/span&gt;. SAE J3161/1 major section numbers that are indicated as N/A do not contain any requirements (subsections may include requirements). Sections that are not in scope, such as standards profiles, are expected to be tested and verified as part of device-level certification, done prior to the vehicle-level testing described in this document.&lt;/div&gt;

    &lt;/div&gt;</p>
