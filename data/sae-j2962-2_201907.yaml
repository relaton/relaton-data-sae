  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the requirements for transceiver qualification. Requirements stated in this document will provide a minimum standard level of performance for the CAN transceiver in the IC to which all compatible transceivers shall be designed. No other features in the IC are tested or qualified as part of this recommended practice. This will assure robust serial data communication among all connected devices, regardless of supplier.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The goal of SAE J2962-2 is to commonize approval processes of CAN transceivers across OEMs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The intended audience includes, but is not limited to, CAN transceiver suppliers, component release engineers, and vehicle system engineers.&lt;/div&gt;&lt;/div&gt;</p>
