    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This practice describes recommended performance requirements of fuel tank closures used in conjunction with fuel level senders and fuel delivery systems. It provides guidelines that assure interchangeability and compatibility between fuel tanks and fuel pump/sender closure systems without specifying a specific closure system design. These systems may be used in rigid fuel tank systems made of plastic or metal.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Complete details of specific designs shall be established by mutual agreement between customer and supplier.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The dimensions and performance requirements are selected to optimize
