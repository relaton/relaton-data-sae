    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice specifies performance requirements for either static or dynamic testing of seat belt anchorages attached to vehicle structure or to the seat assemblies as installed in the motor vehicle (This SAE Recommended Practice supersedes the Performance Requirements Section of SAE J787bl. Design Requirements and Test Procedures are specified in Recommended Practice SAE J383, Motor Vehicle Seat Belt Anchorages—Design Recommendations and Recommended Practice SAE J384, Motor Vehicle Seat Belt Anchorages—Test Procedure.&lt;/div&gt;&lt;/div&gt;</p>
