  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) shall be limited to information about cuprous/cupric oxide corrosion of silver plated conductors. It examines some possible causes and some recommendations to minimize the possibility of its occurrence. It also provides a number of reference documents that describe the corrosion in detail, methods to determine conductor damage, methods to produce the corrosion, and other investigative reports of this phenomena and their conclusions.&lt;/div&gt;
    &lt;/div&gt;</p>
