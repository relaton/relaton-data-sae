  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report documents efforts toward developing a test method for the evaluation of hose protection sleeves used in hydraulic fluid power applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These sleeves are intended for general application and hydraulic systems on industrial equipment and commercial products. These sleeves shall be capable of providing protection to pin hole failures in hydraulic systems operating to working pressures specified by the manufacturer. Hose assembly burst containment is not in the scope of this document.&lt;/div&gt;&lt;/div&gt;</p>
