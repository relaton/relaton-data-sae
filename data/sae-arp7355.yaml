    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This method is used for determining the volume swelling effect of aero-derived gas turbine engine lubricants on elastomeric materials. It provides insight into the expected performance of a candidate lubricants impact upon elastomer swell and provides data to determine if the candidate lubricant meets specification requirements. This ARP is based upon Federal Standard 791, Method 3604.&lt;/div&gt;
    &lt;/div&gt;</p>
