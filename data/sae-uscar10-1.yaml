    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides a test method for determining the torque-tension relationship of both external and internal metric threaded fasteners for the purpose of measuring the frictional characteristics of the threaded fasteners. The results obtained by this test are relevant to the test conditions only and should not be utilized for specific applications.&lt;/div&gt;
