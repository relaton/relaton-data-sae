  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for flake or granular cetyl alcohol, solvents for dissolving the cetyl alcohol, preparation and application requirements for use of cetyl alcohol as an installation lubricant on mechanical fasteners, such as pins, bolts, nuts, washers, threaded or nonthreaded fastening devices, and inspection criteria for coated parts.&lt;/div&gt;
    &lt;/div&gt;</p>
