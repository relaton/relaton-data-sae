  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a set of test methods for characterizing lithium-ion battery electrolytes. These test methods are applicable to existing electrolyte materials and allow different facilities to conduct testing in a common manner.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Solid electrolytes are expected to be commercially used for large scale batteries in the future. However, characterizing solid electrolytes may require methods different from those contained in this document. Such methods are not addressed in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not within the scope of this document to establish acceptance criteria for test results, as this is usually established between the vendor and customer. It is also not within the scope of this document to examine the electrochemical properties of an electrolyte, since these are influenced by electrolyte composition. In addition, establishing an electrolyte composition appropriate for all applications is not feasible.&lt;/div&gt;&lt;/div&gt;</p>
