    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard establishes a uniform procedure for calculation of electron vacancy numbers in superalloys. It is intended for use by suppliers of raw materials and parts, typically castings, for which control of electron vacancy number is required by the raw material specification.&lt;/div&gt;&lt;/div&gt;</p>
