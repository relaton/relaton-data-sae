  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE Recommended Practice specifies a standardize method and test procedure to measure low pressure differential (&amp;lt; 1bar) brake component brake fluid flow performance. The standard can be utilized for flow measurements across hydraulic brake components such as master cylinders, apply system to chassis controls piping, or other sources of flow restriction in the low pressure side of the hydraulic brake system. It covers materials, manufacturing processes, and general properties required to meet the wide range of service encountered in automotive application. This specification covers only low pressure differential fluid flow and does not include measurement recommended practice for High Pressure differential (&amp;gt; 1 bar) flows.&lt;/div&gt;&lt;/div&gt;</p>
