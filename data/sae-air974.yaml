    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Much of the available long-term storage test data has been reviewed and topically separated to enable the independent discussion of storage effects on fluids, seals, hydraulic components, and hydraulic systems. Comments are made in &lt;span class="xref"&gt;Section 4&lt;/span&gt; concerning the applicability of the test results and regarding design practices for storability. Conclusions are drawn in &lt;span class="xref"&gt;Section 5&lt;/span&gt; regarding inactive storage of hydraulic systems for at least a 5 year period.&lt;/div&gt;&lt;/div&gt;</p>
