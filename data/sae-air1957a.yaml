  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document summarizes types of heat sinks and considerations in relation to the general requirements of aircraft heat sources, and it provides information to achieve efficient utilization and management of these heat sinks. In this document, a heat sink is defined as a body or substance used for removal of the heat generated by thermodynamic processes. This document provides general data about airborne heat sources, heat sinks, and modes of heat transfer. The document also discusses approaches to control the use of heat sinks and techniques for analysis and verification of heat sink management. The heat sinks are for aircraft operating at subsonic and supersonic speeds.&lt;/div&gt;&lt;/div&gt;</p>
