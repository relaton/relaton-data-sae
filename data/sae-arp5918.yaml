  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes the minimum recommended Test Stand Setup and Procedures for inspecting and testing Aircraft Refuelers. The inspection and test procedure shall be used to evaluate the operation and performance of an Aircraft Refueler to assure that it meets the minimum refueling performance criteria and is fit for aircraft fueling and/or defueling operations. These procedures shall be used to test new Aircraft Refuelers and may be used to perform routine tests to confirm that the Aircraft Refuelers comply with the minimum performance criteria as specified herein.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers all types of Aircraft Refuelers, stationary (e.g., cabinet type units) or mobile (e.g., hydrant service vehicles, tankers, etc).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Aircraft refueling vehicle design and operating requirements are provided in separate SAE ARP Documents.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: This document does &lt;u&gt;NOT&lt;/u&gt; address Aircraft Refuelers with operating pressure above 150 psi although many of the paragraphs can be used as a guideline.&lt;/div&gt;&lt;/div&gt;</p>
