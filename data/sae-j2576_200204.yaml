  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the blade fuse styles, test conditions, procedures, and performance requirements for use in vehicle electrical power systems designed to the new motor vehicle industry 42 V architecture. The intent of this document is to provide a framework for 58 V Blade Fuse characteristics, serving the motor vehicle industry to establish standardization with respect to electrical performance and mechanical requirements. This standardization shall lend itself to safe application practices; e.g., prevention of 32 V devices utilized inappropriately in 42 V electrical systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Both the performance and mechanical requirements expressed herein are for the advancement of mobility engineering and the development of safe application practices. They are not intended for the establishment of design exclusions, patent rights, or franchising that engenders restraint of trade.&lt;/div&gt;&lt;/div&gt;</p>
