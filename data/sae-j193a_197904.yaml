    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this test procedure is to provide a uniform method of testing ball stud and socket assemblies to determine their functional characteristics. This procedure is an extension of the dimensional recommendations for ball studs as used in integral socket assemblies. All tests, except ball stud yield, may be run using complete integral assemblies representing the application.&lt;/div&gt;&lt;/div&gt;</p>
