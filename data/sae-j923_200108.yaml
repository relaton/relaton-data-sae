    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice outlines basic nomenclature in common use for truck and bus drive axle designs. Over a period of years there have been many different designs introduced; however, for this report, only the most common have been selected and only their general construction is illustrated to show the nomenclature of the various parts.&lt;/div&gt;&lt;/div&gt;</p>
