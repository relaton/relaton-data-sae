  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The devices described in this document provide a method for a reliable layout and measurement of occupant seating compartments and/or seats. &lt;b&gt;They are not to be construed as tools that measure or indicate occupant capabilities or comfort&lt;/b&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The devices are intended for applications at designated seating positions. They are not intended for use in defining or assessing temporary seating, such as folding jump seats.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;When using the H-Point Machine (HPM), interactions can occur between adjacent seating positions (i.e., having an HPM installed at the center occupant position can change the results obtained for the outboard occupant position). Therefore, only one machine should be installed in a particular row of seats during each test.&lt;/div&gt;

    &lt;/div&gt;</p>
