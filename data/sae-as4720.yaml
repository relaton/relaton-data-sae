  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers batch qualification procedure for virgin and compounded polytetrafluoroethylene (PTFE) resins used for compression molding. AS9100 requires virgin and modified PTFE as a testing material be representative of production PTFE and/or parts. The testing specified herein is limited to tensile strength, elongation and specific gravity. Any other tests required by the purchaser must be specified separately.&lt;/div&gt;

    &lt;/div&gt;</p>
