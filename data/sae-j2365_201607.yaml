  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice can apply to both Original Equipment Manufacturer and Aftermarket route-guidance and navigation system functions for passenger vehicles. The methods apply only to the presentation of visual information and the use of manual control inputs to accomplish a navigation or route guidance task. They do not apply to visual monitoring tasks which do not require a manual control input, such as route following. Voice-activated controls or passenger operation of controls are also excluded.&lt;/div&gt;&lt;/div&gt;</p>
