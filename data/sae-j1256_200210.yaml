abstract:
- language: en
  script: Latn
  content: |-
    <p>This procedure is a modification of the urban driving cycles noted in SAE J1082 and which is run on a suitable road or test track.  The procedure yields cold start/warm-up fuel economy values indicative of consumer level at the ambient condition of the test.  Within referenced limitations, the procedure can be utilized to determine the fuel economy differential among vehicles or between vehicle changes.

    Purpose
    This SAE Recommended Practice provides a uniform test procedure for measuring the fuel economy of light-duty vehicles during cold start and warm-up operation (motor vehicles designed primarily for transportation of persons or property and rated at 4500 kg GVW (10 000 lb) or less) on suitable roads.</p>
