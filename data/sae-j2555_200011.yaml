    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes a procedure to be used to evaluate a disturbance known as “idle gear rattle” which can exist in vehicles equipped with manual transmissions and clutches. Other types of noises associated with operation at idle are also briefly described.&lt;/div&gt;
