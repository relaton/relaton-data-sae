    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice is derived from common test sequences used within the industry. This procedure applies to all on-road passenger cars and light trucks up to 4 540 kg of GVWR. This recommended practice does not address other aspects such as performance, NVH, and durability. Test results from this recommended practice should be combined with other measurements and dynamometer tests (or vehicle-level tests), and acceptance criteria to validate a given design or configuration.&lt;/div&gt;
    &lt;/div&gt;</p>
