  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This classification system tabulates the properties of vulcanized rubber materials (natural rubber, reclaimed rubber, synthetic rubbers, alone or in combination) that are intended for, but not limited to, use in rubber products for automotive applications.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 1: The SAE Committee on Automotive Rubber Specifications (CARS) has the sole responsibility for SAE J200. CARS Works closely with and receives input from ASTM Subcommittee D11.30 on Classification of Rubber Compounds with the goal to keep SAE J200 and ASTM D 2000 technically equivalent. Candidate materials presented for development of new tables or for inclusion in &lt;span class="xref"&gt;Tables A1&lt;/span&gt; or &lt;span class="xref"&gt;A2&lt;/span&gt; of SAE J200 or Table X1.1 of ASTM D 2000 shall be initiated with the SAE CARS Committee. The procedure to be followed is detailed in &lt;span class="xref"&gt;Appendix C&lt;/span&gt; of SAE J200.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 2: This document may serve many of the needs of other industries in much the same manner as SAE numbered steels. It must be remembered, however, that this system is subject to revision when required by automotive needs. It is recommended that the latest revision always be used. This document is based on the premise that all rubber materials intended for use in rubber products can be arranged into characteristic designations. These designations are determined by types, based on resistance to heat aging, and classes, based on resistance to swelling by oil. Basic levels are thus established which, together with values describing additional requirements, permit complete description of the quality of all rubber materials. In all cases where provisions of this document would conflict with those of the detailed specifications for a particular product, the latter shall take precedence.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 3: When the rubber product is to be used for purposes where the requirements are too specific to be completely prescribed by this classification system, it is necessary for the purchaser to consult the supplier in advance to establish the appropriate properties, test methods, and specification test limits.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;/div&gt;</p>
