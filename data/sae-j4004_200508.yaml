abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes how to position and posture the H-point design tool (HPD) described in &lt;span class="xref"&gt;Appendix B&lt;/span&gt;, and how to establish the seating reference point (SgRP), design H-point travel path, and other key reference points that are used in the design and specification of both driver and passenger seat positions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This practice also provides a method for determining the length of the seat track for a driver seat that adjusts fore/aft. The seat track length is based on a desired level of driver accommodation, assuming a U.S. population containing an equal number of male and female drivers. The procedure can be used to establish driver seat track accommodation for new vehicle designs or to evaluate accommodation in existing vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A general method for determining driver seat track length for any driver population (male and female stature distribution) at any selected accommodation percentile and gender mix is given in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Application of this Recommended Practice is limited to Class A Vehicles (Passenger Cars, Multipurpose Passenger Vehicles, and Light Trucks) as defined in SAE J1100.&lt;/div&gt;
    &lt;/div&gt;</p>
