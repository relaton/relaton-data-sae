    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard defines minimum light intensity in terms of candelas in vertical and horizontal-directions about the longitudinal, vertical and lateral axes of the aircraft. It also defines color tolerances in terms of limiting chromaticities for the light emitted from the position lights.&lt;/div&gt;&lt;/div&gt;</p>
