    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides definitions and background information regarding the physical performance and testing of electrohydraulic flow control and pressure control servovalves. This ARP also provides extensive guidance for the preparation of procurement specifications and for functional testing.&lt;/div&gt;
