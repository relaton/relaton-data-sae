    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is written to establish tire removal criteria of on-wing civil aircraft tires only. This document is primarily intended for use with commercial aircraft, but may be used on other categories of civil aircraft, as applicable. The criteria are harmonized with the care and service manuals (CSMs) of the tire manufacturers for both radial and bias tires.&lt;/div&gt;&lt;/div&gt;</p>
