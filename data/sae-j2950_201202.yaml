  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This RP aids in the identification, handling, and shipping of new and used un-installed lithium ion battery systems to and from specified locations. The generic term “battery system” shall be used to identify automotive-type and sized “traction” batteries when used as intended by the vehicle and battery system original equipment manufacturers (OEMs) for ground vehicles. It is the specific intent of this RP to identify, utilize and reference existing US and International hazardous materials (dangerous goods) transportation regulations, which are the only methodologies to be used to establish transportability of new battery systems. It is also the intent of this RP to provide recommendations regarding diagnostic testing to be used by service and shipping personnel for the purpose of determining a used battery system’s transportability. In support of the service and shipping personnel, the diagnostics process seeks to use standard tools of the trade and avoid laboratory type equipment.&lt;/div&gt;
    &lt;/div&gt;</p>
