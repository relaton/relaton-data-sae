  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE J2334 lab test procedure should be used when determining cosmetic corrosion performance for a particular coating system, substrate, process, or design. Since it is a field correlated test, it can be used as a validation tool as well as a development tool. If corrosion mechanisms other than cosmetic or general corrosion are to be examined using this test, field correlation must be established.&lt;/div&gt;&lt;/div&gt;</p>
