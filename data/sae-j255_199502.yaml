  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Measurement of diesel smoke in an accurate and consistent manner has been a serious problem for engine and vehicle manufacturers, users, and agencies charged with enforcing smoke limits. Several instruments, based on different principles and using different scales, are commonly used. In addition to these, human observation and judgment are often used to relate smoke to a variety of standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Information Report is to provide an understanding of the nature of diesel smoke, how it can be measured, and how the various measurement methods can be correlated. Except for defining the various types of smoke, the report deals solely with the steady-state measurement of visible, black smoke emitted from diesel engines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For the benefit of those who wish to study various aspects of the subject in greater depth, a list of useful references is included in &lt;span class="xref"&gt;Section 2&lt;/span&gt;.&lt;/div&gt;
