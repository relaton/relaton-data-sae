    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides the minimum requirements for Automotive or RV, 7 Position, Self Draining Trailer Tow Connector Interface. The procedures included within this specification are intended to cover the test methods, design, and performance requirements, of the electrical interface of the 7 position trailer tow connector in low voltage (0 to 20) road vehicle applications.&lt;/div&gt;&lt;/div&gt;</p>
