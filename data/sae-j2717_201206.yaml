  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a trio of test methods which determine basic tire size (geometry), mass, and moments of inertia. The methods apply to any tire so long as the equipment is properly scaled to conduct the measurements for the intended test tire. The data are suitable for determining parameters for road load models and for comparative evaluations of the measured properties in research and development.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Herein, road load models are models for predicting forces applied to the vehicle spindles during operation over irregular surfaces paved or unpaved. Within the context of this Recommended Practice, forces applied to the surface on which the tire is operating are not considered.&lt;/div&gt;

    &lt;/div&gt;</p>
