  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers all types of manually operated high pressure oxygen, cylinder shut off valves for use in commercial type aircraft. It is intended that the valve shall be attached to a pressure cylinder storing oxygen under pressure of 1800 to 2100 psig at 70 F. Upon opening the valve, oxygen will be permitted to discharge from the storage cylinder to the valve outlet and thence to other components of the oxygen system. It shall also be possible to recharge the cylinder through the valve.&lt;/div&gt;&lt;/div&gt;</p>
