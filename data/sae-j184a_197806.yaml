  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of the recommended practice includes the system performance requirements for the entire sound measurement system. It provides the methods needed to verify Type 1 or Type 2 instruments. However, it also provides a method to qualify a SDAS that does not meet the requirements in their entirety, but can be used provided knowledge of the test data is obtained and an iterative process is followed in qualifying the SDAS. The system need only be qualified for the dynamic characteristic and weighting mode in which it is to be used. The scope of this document does not include qualification of system components for harmonic distortion, tape recorder wow and flutter, etc. However, these factors must be considered when determining system performance, especially where spectral information is sought. The references in &lt;span class="xref"&gt;Section 8&lt;/span&gt; should be consulted for general performance requirements and precautions regarding instrumentation for acoustical measurements.&lt;/div&gt;&lt;/div&gt;</p>
