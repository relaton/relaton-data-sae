  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform laboratory procedures for biaxial fatigue testing of wheels intended for normal highway use and temporary use on passenger car vehicles and light trucks. The appendices provide scaleable load files that are applicable to ballasted passenger cars and ballasted light trucks. A load file for unballasted passenger cars will be added to this document.&lt;/div&gt;
    &lt;/div&gt;</p>
