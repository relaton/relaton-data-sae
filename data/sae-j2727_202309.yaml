abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The system emissions chart contained herein is intended to serve as a means of estimating the annual refrigerant emission rate (grams per year) from new production A/C systems equipped with specified component technologies. It provides emission values for various component technologies that are currently available and can be expanded as new technologies are commercialized. This document provides the information to develop an Excel file template system emissions chart for system emission analysis. The chart includes automotive compressor technologies for conventional mobile air conditioning systems, as well as those using semi-hermetic compressors. Fully hermetic compressors contain the working electric compressor within a welded housing that allows little if any typical emissions and the emission value for this type of compressor is added as low, fixed value. This standard can be considered a companion document to SAE J2763. SAE J2727 estimates system emissions, taking into account production assembly variation and accounts for components that are 100% helium leak tested prior to vehicle final assembly. The results from SAE J2064 are used to better represent permeation emissions from different hose material and coupling configurations in this version. SAE J2763 may be used to quantify emissions from properly assembled systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This estimate is does not apply to systems that use sealing technology that has not been characterized and included in the spreadsheet calculation, such as R-744 sealing designs.&lt;/div&gt;&lt;/div&gt;</p>
