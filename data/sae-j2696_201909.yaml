    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes dimensions and tolerances for the interface between inboard mounted disc brake rotors and disc wheel hubs. This document is intended for inboard mounted disc brake rotors and disc wheel hubs for Class 5, 6, 7, and 8 commercial vehicles. Special and less-common applications are not covered.&lt;/div&gt;
