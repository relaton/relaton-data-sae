  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These cable practice recommendations tend toward design guidance rather than standardization. EMC achievement tests can be standardized, but the means for achievement should not be constrained. The material can best be described as an essay on cabling, and the theme is that a cable is just a part of a complete circuit, the interconnect circuit. Cable EMC performance is thus determined largely by circuit design; it is unrealistic to expect cabling techniques to compensate for improper impedance, symmetry or waveform in the circuit.&lt;/div&gt;&lt;/div&gt;</p>
