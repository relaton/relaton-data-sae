abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document considers the cooling of equipment installed in equipment centers, which usually consist of rack-mounted equipment and panel mounted equipment in the flight deck. Instances where these two locations result in different requirements are identified. This document generally refers to the cooled equipment as E/E equipment, denoting that both electrical and electronic equipment is considered, or as an E/E equipment line-replaceable-unit (LRU). The majority of cooled equipment takes the form of LRUs. The primary focus of this document is E/E equipment which uses forced air cooling to keep the equipment within acceptable environmental limits. These limits ensure the equipment operates reliably and within acceptable tolerances. Cooling may be supplied internally or externally to the E/E equipment case. Some E/E equipment is cooled solely by natural convection, conduction, and radiation to the surrounding environment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document discusses specification requirements, system design considerations, component design, and system testing. It also discusses the analysis and test considerations for the thermal design of the avionic equipment. The discussion of supplementary cooling systems includes consideration of a refrigeration system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document just covers air cooling of equipment. AIR1811 should be consulted for information on liquid cooling of equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Although this document is targeted at transport category airplanes, most of the material applies to other classes of aircraft with possible adaptions.&lt;/div&gt;
    &lt;/div&gt;</p>
