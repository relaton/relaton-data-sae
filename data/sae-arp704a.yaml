  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) recommends a methodology to be used for the design, analysis and test evaluation of modern helicopter gas turbine propulsion system stability and transient response characteristics. This methodology utilizes the computational power of modern digital computers to more thoroughly analyze, simulate and bench-test the helicopter engine/rotor system speed control loop over the flight envelope. This up-front work results in significantly less effort expended during flight test and delivers a more effective system into service.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The methodology presented herein is recommended for modern digital electronic propulsion control systems and also for traditional analog and hydromechanical systems.&lt;/div&gt;&lt;/div&gt;</p>
