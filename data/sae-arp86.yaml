    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;A&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;EXHAUST HOT AIR TYPE HEATERS - GENERAL - Dealing with features applicable to all makes and users.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;B&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;EXHAUST HOT AIR TYPE HEATERS - MILITARY AND COMMERCIAL -Covering features applicable to military and commercial aircraft.&lt;/div&gt;&lt;/li&gt;
