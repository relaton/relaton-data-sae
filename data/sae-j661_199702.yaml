    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to establish a uniform laboratory procedure for securing and reporting the friction and wear characteristics of brake linings. The performance data obtained can be used for in-plant quality control by brake lining manufacturers and for the quality assessment of incoming shipments by the purchasers of brake linings.&lt;/div&gt;&lt;/div&gt;</p>
