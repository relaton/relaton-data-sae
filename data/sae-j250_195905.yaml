    &lt;div class="htmlview paragraph"&gt;The material desired under this recommended practice is a synthetic resin plastic sealer of the nondrying, nonbleeding, and noncorrosive type that may be extruded to the specified size and used as a medium for producing a water tight seal between 2 pressed steel sections or between rubber and steel.&lt;/div&gt;&lt;/div&gt;</p>
