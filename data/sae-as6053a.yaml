  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers definition of landing impact tests which are to be conducted on landing gear assemblies including shock absorbers, suggested instrumentation for the tests and required data of the resulting test report. It is intended to standardize impact test procedures on landing gear shock absorbers and to provide sufficient data to allow evaluation of the design with respect to requirements of MIL-L-8552 and MIL-S-8959 as applicable.&lt;/div&gt;&lt;/div&gt;</p>
