  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to the usage of tires of the same nominal size and tread type, but with different outside diameter for articulated front-end loaders. Articulated four-wheel-drive front-end loader performance and component life can be affected by excessive differences in the tire outside circumference and/or diameter. The purpose is to provide specific guidelines for the usage of tires with different outside circumference and/or diameter on articulated front-end loaders.&lt;/div&gt;&lt;/div&gt;</p>
