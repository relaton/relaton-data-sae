  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;In the analysis and measurement of residual stresses of materials, it has been noted that there are frequently differences in interpretation of the terms "macrostrain" and "microstrain." To assist communication among research personnel in this area, definitions for these two terms are suggested by the Fatigue Design and Evaluation Committee of SAE. Since "macrostress" is commonly computed from "macrostrain" in residual stress analysis, to be consistent, the definitions given are for "macrostrain" and "microstrain."&lt;/div&gt;&lt;/div&gt;</p>
