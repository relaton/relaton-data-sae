  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established metric manufacturing tolerances applicable to aluminum alloy rolled, drawn, or cold finished bar, rod, wire, and forging stock ordered to metric dimensions. These tolerances apply to all conditions, unless otherwise noted. The general temper designation "-TX51" is used for brevity and denotes the full temper designations -T351, -T451, -T651, -T851, and -T7351, the "X" representing one or more digits preceding the "51."&lt;/div&gt;&lt;/div&gt;</p>
