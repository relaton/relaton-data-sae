    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR points out that above a frequency called the “transition frequency,” variances associated with the shielding effectiveness measurements can become large. It includes the derivations to demonstrate this. This fact should be taken into account when designing shielding for use above the transition frequency.&lt;/div&gt;&lt;/div&gt;</p>
