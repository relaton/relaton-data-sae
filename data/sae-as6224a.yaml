  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The AS6224 specification covers environment resistant, permanent insulation repair sleeves for repairing different types of insulation damages of wire or cable jackets in installed applications. The repair sleeve is intended to repair damaged primary wire or cable jacket covers where the shielding and wire conductors are not damaged.&lt;/div&gt;

    &lt;/div&gt;</p>
