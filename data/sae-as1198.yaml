abstract:
- language: en
  script: Latn
  content: "<p>This standard is issued in loose leaf form to permit the insertion
    or removal of new or revised sections and test methods.  All users of this standard
    should keep it up-to-date by inserting the revised or new sections and test methods
    as issued and by removing the superseded pages. New and revised sections will
    be issued with a revised title page showing the latest revision date and with
    a revised index Section 3).  In Section 3, the most closely corresponding FED,
    TEST METHOD STD NO. 228 Method number and the most closely corresponding ASTM
    Test Procedure is given for reference purposes.  No implication of agreement with
    those test methods or procedures is intended. This standard gives the general
    physical, electrical, and chemical methods for testing wires and cables for conformance
    to the requirements of their controlling detail specifications and other related
    documents. This standard also includes methods (Group 5000) for comparative evaluation
    testing of wires and cables.  It was prepared to promote standardization and to
    eliminate unnecessary or undesirable variation in testing procedures.  This standard
    does not include special test methods applicable only to certain wires and cables,
    such as a radio frequency coasial cables, which are described in their applicable
    detail specifications.  In case of conflict between the provisions of this standard
    and those of the controlling detail specification, the latter shall take precedence.</p>"
