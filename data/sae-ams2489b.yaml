  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for an inorganic black coating applied at ambient temperature to steel to touch up black oxide coating in areas where the black oxide has been removed. This coating is intended only to visually change the surface to a black color, not to meet the requirements of any black oxide specification.&lt;/div&gt;&lt;/div&gt;</p>
