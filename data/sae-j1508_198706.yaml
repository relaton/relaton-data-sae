  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers complete dimensional and general specifications for three types of worm gear drive hose clamps intended for general application on ground based vehicles and industrial equipment. Also included, where appropriate are performance requirements tests and installation recommendations for other than worm gear hose clamps see SAE J536, Hose Clamps.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard is not intended to imply that all sizes shown are stock production items nor that all variations of the respective clamp types are described herein. Users should consult clamp manufacturers relative to the availability of sizes and clamps having features other than those specified.&lt;/div&gt;&lt;/div&gt;</p>
