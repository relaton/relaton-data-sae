  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) identifies the risks and dangers associated with the carriage and use of pyrotechnic signaling devices in transport category aircraft life rafts and slide/rafts, and provides a rationale for allowing the use of alternative non-pyrotechnic devices authorized by FAA/TSO-C168. These devices offer an equivalent level of safety while eliminating flight safety risks, enhancing survivability of aircraft ditching survivors, reducing costs, eliminating dangerous goods transportation and handling issues, and reducing environmental impact of dangerous goods disposal.&lt;/div&gt;&lt;/div&gt;</p>
