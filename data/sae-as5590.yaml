  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the performance requirements for a plug and receptacle, multiple termini, fiber optic connector. Fiber optic connectors using removable termini, and are capable of operating within a temperature range of -65 to +200 °C (see &lt;span class="xref"&gt;1.2.1.1&lt;/span&gt;). These connectors are supplied under MIL-STD-790 reliability assurance program. Statistical process control (SPC) techniques are required in the manufacturing process to minimize variation in production of connectors supplied to the requirements of this specification.&lt;/div&gt;&lt;/div&gt;</p>
