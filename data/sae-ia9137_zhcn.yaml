  content: |-
    <p>&lt;p&gt;编制和发布本文件旨在供应商遵守 9100 规定的情况下，就 AQAP-2110 的应用提供相关信息和指南。本文件的发布号为 AQAP-2110-SRD.2 和 IA9137。本文件由 NATO 和行业代表联合编制，供 NATO 和行业内使用，旨在促进 AQAP-2110 和 9100 的使用及对其之间关系的理解。当采购国使用对外军售 (FMS) 作为其采购方式时，可能需要 AQAP。&lt;/p&gt;


    &lt;p&gt;本文件旨在促进采购方及其 9100 供应商对 AQAP-2110 要求解释的通用性。&lt;/p&gt;


    &lt;p&gt;本文件内容不具有法律或合同地位，亦不会取代、增加或取消 AQAP-2110 或 9100 的任何要求。&lt;/p&gt;


    &lt;p&gt;由于可能存在多种条件（取决于工作或过程类型、所用设备和所涉人员的技能等因素），不应将本指南视为包含所有事宜，亦不应将本指南视为强加满足合同要求的具体手段或方法。相关方应意识到，可使用其他手段或方法来满足这些要求。&lt;/p&gt;


    &lt;p&gt;本指南使用者应谨记，当合同引用了 AQAP 2110，其要求对于供应商和次级供应商具有强制性。&lt;/p&gt;</p>
