  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes software capability guidelines for computer controlled test equipment, hereinafter referred to as automatic test equipment (ATE), for testing hydraulic components. A typical ATE system is shown in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;. The items herein have been selected as potential features which may or may not be applicable to a particular application. This document does not address software development requirements, qualification procedures, or hardware design requirements, but encourages users to refer to existing documents, defined in &lt;span class="xref"&gt;2.1.1&lt;/span&gt;, for guidance on such issues.&lt;/div&gt;&lt;/div&gt;</p>
