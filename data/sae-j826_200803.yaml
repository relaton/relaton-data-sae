  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The devices of this SAE Standard provide the means by which passenger compartment dimensions can be obtained using a deflected seat rather than a free seat contour as a reference for defining seating space. All definitions and dimensions used in conjunction with this document are described in SAE J1100. These devices are intended only to apply to the driver side or center occupant seating spaces and are not to be construed as instruments which measure or indicate occupant capabilities or comfort. This document covers only one H-point machine installed on a seat during each test. Certified H-point templates and machines can be purchased from:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE International&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;400 Commonwealth Drive&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Warrendale, PA 15096-0001&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Specific procedures are included in &lt;span class="xref"&gt;Appendix A&lt;/span&gt; for seat measurements in short- and long-coupled vehicles and in &lt;span class="xref"&gt;Appendix B&lt;/span&gt; for measurement of the driver seat cushion angle. Specifications and a calibration inspection procedure for the H-point machine are given in &lt;span class="xref"&gt;Appendix C&lt;/span&gt;. Additional considerations are necessary when a Head Restraint Measuring Device (HRMD) is mounted to an H-point machine (&lt;span class="xref"&gt;Appendix D&lt;/span&gt;).&lt;/div&gt;
    &lt;/div&gt;</p>
