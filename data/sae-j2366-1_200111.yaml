  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice details the Physical Layer of the Intelligent Transportation Systems (ITS) Data Bus on CAN (IDB-C), which is generally intended for in-vehicle use. It has been developed by the ITS Data Bus (IDB) Physical Layer Subcommittee of the IDB Committee. The objectives of the subcommittee are to develop information reports, recommended practices and standards concerned with the requirements, design, and usage of devices that communicate electronic signals and control information among ITS related components within the vehicle environment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The IDB-C is a non-proprietary virtual-token passing bus, designed to allow disparate consumer, vehicle, and commercial electronic components to communicate and share information across a standard, open data bus.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document describes the Physical Layer of the IDB-C, as shown in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;. The Physical Layer of the IDB-C incorporates the CAN 2.0B specification per SAE J2284-2, with modifications as noted in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The IDB-C Physical Layer includes the line drivers/receivers, bus topology and termination, and the physical IDB-C connector. This connector is defined only for the IDB-C backbone, and is not intended to define the actual connector on the IDB-C device itself.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The usage of this document is not limited to automotive, truck, bus, agriculture, and marine applications.&lt;/div&gt;
    &lt;/div&gt;</p>
