  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides test methods and requirements to evaluate the suitability of plastic optical materials for possible use in discharge forward lighting (DFL) devices in motor vehicles. These materials are typically used for lenses and reflectors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Separate testing is required for each combination of material, industrial coating, DFL light source, and device focal length. The tests are intended to determine physical and optical characteristics of the materials and coatings. Performance expectations of finished assemblies, including plastic components, are to be based on tests for lighting devices, as specified in SAE Standards and Recommended Practices for motor vehicle lighting equipment. Optical components exposed to weathering should also be subject to SAE J576.&lt;/div&gt;&lt;/div&gt;</p>
