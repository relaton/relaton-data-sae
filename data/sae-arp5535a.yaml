    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to safety observers or spotters involved with the use of outdoor laser systems. It may be used in conjunction with SAE Aerospace Standard (AS4970) “Human Factors Considerations for Outdoor Laser Operations in the Navigable Airspace.” Additional control measures may be applicable and are listed in ANSI Z136.6.&lt;/div&gt;

