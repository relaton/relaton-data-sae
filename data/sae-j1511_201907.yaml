abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Standard applies to off-road rubber-tired machines having rated speed capability exceeding 20 km/h.&lt;/p&gt;
    &lt;p&gt;Only the following machine categories in SAE J1116 are included in the scope of this document.&lt;/p&gt;
    &lt;p&gt;a. Earthmoving&lt;/p&gt;
    &lt;p&gt;b. Other than earthmoving: except rollers and compactors&lt;/p&gt;
    &lt;p&gt;c. General purpose industrial&lt;/p&gt;
    &lt;p&gt;d. Forestry&lt;/p&gt;
    &lt;p&gt;e. Specialized mining machinery&lt;/p&gt;
    &lt;p&gt;Applicable steering systems include the following means of providing power for steering:&lt;/p&gt;
    &lt;p&gt;a. Manual steering&lt;/p&gt;
    &lt;p&gt;b. Power-assisted steering&lt;/p&gt;
    &lt;p&gt;c. Full-power steering&lt;/p&gt;
    &lt;p&gt;This document does not imply that secondary steering is mandatory. However, if secondary steering is provided, performance and test requirements are included.&lt;/p&gt;</p>
