  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE Guide to APU health management establishes the foundation for developing a successful APU health management program at any aircraft or APU operator, such as an airline, an OEM, an equipment supplier, or a military transport unit. This guide identifies the best practices for using an APU health management program to improve dispatch reliability and to satisfy Extended Operations (ETOPS) availability requirements.&lt;/div&gt;
