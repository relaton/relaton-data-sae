  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers hose fabricated from fabric braid and synthetic rubber, assembled with end fittings for use in automotive power steering applications at pressures as indicated in &lt;span class="xref"&gt;Table 1B&lt;/span&gt;, as flexible connections within the temperature range of -40 °C (-40 °F) to 121°C (250 °F) average, 135 °C (275 °F) maximum peaks.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These hoses are intended for use in applications where reduction in amplitude of pump pressure pulsations is not required.&lt;/div&gt;&lt;/div&gt;</p>
