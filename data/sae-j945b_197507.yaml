  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Flasher(s) referred to in this SAE Recommended Practice are for nominal 12 V or 6 V d-c circuits and are required to operate from two signal lamps to the maximum design load including pilot lamps, as stated by the flasher manufacturer. It is an engineering design standard and is supplemented by SAE J1056 covering service performance requirements for vehicular hazard warning flashers.&lt;/div&gt;&lt;/div&gt;</p>
