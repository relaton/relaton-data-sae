  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides the test procedure and methods to calculate the effectiveness of brake blocks, using an inertia dynamometer. To minimize testing variability, and to optimize standardization and correlation, a single, high volume size of brake block is specified (FMSI No. 4515E) and evaluated in a reference S-cam brake assembly of 419 mm x 178 mm (16.5 in x 7.0 in) size, using a specified brake drum.&lt;/div&gt;
    &lt;/div&gt;</p>
