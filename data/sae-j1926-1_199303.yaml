  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This part of SAE J1926 specifies dimensions for fluid power and general use ports with inch threads to ISO 725 for use with adjustable and nonadjustable stud ends shown in SAE J1926-2 and SAE J1926-3.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Ports in accordance with this part of SAE J1926 may be used at working pressures up to 63 MPa for nonadjustable stud ends up to 40 MPa for adjustable stud ends. The permissible working pressure depends upon materials, design, working conditions, application, etc.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For threaded ports and stud ends specified in new designs for hydraulic fluid power applications, only SAE J2244 (ISO 6149) shall be used. Threaded ports and stud ends in accordance with ISO 1179, ISO 9974, and ISO 11926 shall not be used for new design in hydraulic fluid power applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Appendix A&lt;/span&gt; of this document is informative.&lt;/div&gt;&lt;/div&gt;</p>
