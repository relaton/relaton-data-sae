    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers recommendations for the application of existing qualified and approved in-service fixed wing aircraft tires, wheels and brakes to military and commercial rotorcraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: This document does not address the use of radial tires due to insufficient data to support their approved use on rotorcraft, see paragraph &lt;span class="xref"&gt;4.3.14&lt;/span&gt; for specific impact on ground resonance.&lt;/div&gt;
    &lt;/div&gt;</p>
