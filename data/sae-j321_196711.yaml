  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice establishes uniform tire coverage procedures and certain minimum structural requirements for fenders on all wheels of pneumatic-tired earthmoving haulage equipment wherever specified maximum travel speeds exceed 15 mph. Examples of this equipment are heavy construction units such as trucks, scrapers, front-end loaders, tractors, tractor-dozers, pushers, and trailing units.&lt;/div&gt;&lt;/div&gt;</p>
