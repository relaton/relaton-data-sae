  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The thermal modeling guidelines and best practices provided in this document are applicable to powered aerospace vehicle wires and wire bundles in thermal environments ranging from -65 to +260 °C (-85 to +500 °F) and pressures ranging from sea level to space vacuum. Currently the ARP only considers steady state and direct current conditions. The effects of wiring terminations and connectors are not addressed. Both can significantly impact the overall current derating and safety margins for a wiring system.&lt;/div&gt;&lt;/div&gt;</p>
