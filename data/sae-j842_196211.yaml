  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to single-occupancy child-restraining devices, intended for installation and use in motor vehicles. The devices covered by this report are intended for use of children, ranging, in weight and size, from infants able to sit up by themselves to those weighing not more than 50 pounds. (Based on information from the American Academy of Pediatrics and the U. S. National Bureau of Standards, this represents an age range of approximately 8 months to 6 years.)&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: There is no evidence to indicate that children under 6 years cannot safely use an adult belt, and there is no intent to discourage this practice.&lt;/div&gt;&lt;/div&gt;</p>
