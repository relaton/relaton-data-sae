  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document deals with ground and flight test of airplane installed Environmental Control Systems (ECS), &lt;span class="xref"&gt;Figure 1&lt;/span&gt;. The ECS provide an environment, controlled within specified operational limits of comfort and safety, for humans, animals, and equipment. These limits include the following: pressure, temperature, humidity, ventilation air velocity, ventilation rate, wall temperature, audible noise, vibration, and environment composition (ozone, contaminants, etc.). The ECS are composed of equipment, controls, and indicators that supply, distribute, recycle and exhaust air to maintain the desired environment.&lt;/div&gt;

    &lt;/div&gt;</p>
