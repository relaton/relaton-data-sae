    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report provides a concept of operations needed to evaluate a CDA Feature for a permissive left turn across opposing traffic, with infrastructure guidance. The Feature uses CDA cooperation levels including status-sharing and agreement-seeking, and a set of test scenarios (functional, logical, and concrete) is developed to evaluate this CDA Feature.&lt;/div&gt;
