abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the tests to be performed on all J2602-1 defined Master and Slave nodes. Tests described in this document will ensure a minimum standard level of performance to which all compatible ECUs and media shall be designed. This will assure full serial data communication among all connected devices regardless of supplier.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The goal of SAE J2602-2 is to improve the interoperability and interchangeability of LIN devices within a network by verifying the devices pass a minimum set of tests.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;To allow for easy cross-reference, this document is arranged such that the conformance test for a given section in J2602-1 is in the same section in J2602-2.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is to be referenced by the particular vehicle OEM component technical specification that describes any given ECU in which the LIN data link controller and physical layer interface is located. Primarily, the performance of the physical layer is specified in this document. ECU environmental and other requirements, when provided in the component technical specification, shall supercede the requirements of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The intended audience includes, but is not limited to, ECU suppliers, LIN controller suppliers, LIN transceiver suppliers, component release engineers and vehicle system engineers.&lt;/div&gt;



    &lt;/div&gt;</p>
