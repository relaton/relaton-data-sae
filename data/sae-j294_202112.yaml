  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a method of testing the structural integrity of the brake system of all new trucks, buses, and combination vehicles designed for roadway use and falling in the following classifications:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Truck and bus: Over 4500 kg (10000 pounds) GVWR&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Combination vehicle: Towing vehicle over 4500 kg (10000 pounds) GVWR&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The test consists of two distinct tests: a structural endurance test followed by a structural ultimate strength test.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: These two tests originated from separate procedures, and were combined in this recommended practice. Each test can be considered to be an independent evaluation of the service brake’s structure. Based on time available, cost limitations, and the desired evaluation and historical data available, either of these tests could be considered as a complete evaluation of the brake’s structure.&lt;/div&gt;
    &lt;/div&gt;</p>
