  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document supplements ARP85, to extend its use in the design of ECS for supersonic transports. The ECS provides an environment controlled within specified operational limits of comfort and safety, for humans, animals, and equipment. These limits include pressure, temperature, humidity, conditioned air velocity, ventilation rate, thermal radiation, wall temperature, audible noise, vibration, and composition (ozone, contaminants, etc.) of the environment. The ECS is comprised of equipment, controls, and indicators that supply and distribute conditioned air to the occupied compartments. This system is defined within the ATA 100 specification, Chapter 21. It interfaces with the pneumatic system (Chapter 36 of ATA 100), at the inlet of the air conditioning system shutoff valves.&lt;/div&gt;
    &lt;/div&gt;</p>
