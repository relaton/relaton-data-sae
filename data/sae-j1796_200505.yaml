    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE performance standard is to define the test method by which the direct solar and visible transmission of safety glazing materials for road vehicles shall be measured. Adherence to this performance standard will facilitate writing, use and referencing of reports by government, industry and other organizations.&lt;/div&gt;


