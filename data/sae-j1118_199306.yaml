  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE Recommended Practice specifies the test procedure to assure valve assemblies which are satisfactory for vehicle usage, and it is applicable to new valve assemblies for commercial production. It covers such valves where they are employed in passenger car and light truck brake systems utilizing motor vehicle hydraulic brake fluids. This procedure and requirements (SAE J1137) was developed for brake fluids conforming to SAE J1703 and FMVSS 116 (DOT 3); however, it may be utilized for valves which use DOT 4 or DOT 5 brake fluid.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These procedure specifications were developed for base brake operation and do not consider the effects of ABS (anti-lock brake systems) or traction control systems which may have a significant effect on the valve. Careful analysis of the particular type ABS and/or traction control (if included in the system) should be made and additional tests are required which are not included in this document. Provisions for ABS and traction control will be incorporated in a future revision or covered in a separate document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The minimum performance requirements are specified in SAE J1137.&lt;/div&gt;
    &lt;/div&gt;</p>
