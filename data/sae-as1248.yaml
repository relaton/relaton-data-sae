  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is designed to cover all types of pressure reducers required for oxygen systems and for all performance profiles without regard for a particular inlet pressure or outlet pressure performance curve. Special attention will be given, however, to construction requirements essential in reducers where critical high initial oxygen pressures such as 1850 to 2250 psig (12.76 to 15.51 MN/m&lt;sup&gt;2&lt;/sup&gt; gauge) at 70° F (21.1° C) are involved.&lt;/div&gt;&lt;/div&gt;</p>
