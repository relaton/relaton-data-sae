    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the test procedures for conducting simulated dynamic lateral rollover restraint system tests for heavy truck applications. Its purpose is to establish recommended test procedures that will standardize restraint system testing for heavy trucks. Descriptions of the test set-up, test instrumentation, photographic/video coverage, and the test fixtures are included.&lt;/div&gt;&lt;/div&gt;</p>
