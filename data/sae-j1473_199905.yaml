abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard applies to self-propelled, rubber-tired loaders, tractors, graders, back-hoe loaders, tractor-scrapers, excavators, and dumpers as defined in SAE J1057 SEP88. Service, secondary and parking brake systems, and retarders are included. This document specifies brake system minimum performance and test criteria to enable uniform evaluation of the brake capability of earthmoving machines as defined in the scope.</p>"
