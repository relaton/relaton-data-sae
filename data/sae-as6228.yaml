  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers the requirements and technical guidance for evaluation of life-cycle cost, productivity, and safety/health factors related to power hand tool selection. It applies approaches to selection of quieter and lower vibration hand-held powered tools, with optimal ergonomic features, for the prevention of Hand-Arm Vibration Syndrome (HAVS), hearing loss and repetitive motion injuries. It suggests use of noise and vibration data provided by vendors to be verified and supplemented by information available through the National Institute for Occupational Safety and Health (NIOSH) and European Union databases.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Inclusion/exclusion of data in this document is not intended to imply that all of the products described herein are the only production models that meet this standard. Consumers are requested to consult with manufacturers concerning lists of stock production models that meet this standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Guidance for selection, procurement and maintenance of power hand tools should be one component of management processes supporting productivity, reliability and product quality while safe guarding the safety and health of employees. Workplace design, procurement of safest available products and periodic evaluation is integral to risk/cost management and promotion of personnel morale and efficient operations. An ergonomics program should be an integral part of occupational health and management systems, such as those outlined in ANSI Z10-2012.&lt;/div&gt;

    &lt;/div&gt;</p>
