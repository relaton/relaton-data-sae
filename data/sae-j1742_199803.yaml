  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines recommended test methods and general performance requirements of single-pole and multi-pole connectors for on-board electrical wiring harnesses of electric or hybrid powered road vehicles operating at voltages between 50 and 600 V AC or DC rms and those circuits using copper wire only.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These requirements are not intended for connections internal to electrical/electronic modules or complete subassemblies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to connectors designed to be disconnected in the case of repair and/or maintenance after mounting in the vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document excludes one-part connections, i.e., where one part of the connection has direct contact to the pattern of the circuit board.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Duty cycles are considered to be application specific and are not specified in this document; however, these effects must be considered during design.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Recommended Practice for High Voltage Wiring Assembly is contained in SAE J1673. The Recommended Practice for Low Voltage Connector Performance is contained in SAE J2223 (Parts 1, 2, 3, and 4).&lt;/div&gt;&lt;/div&gt;</p>
