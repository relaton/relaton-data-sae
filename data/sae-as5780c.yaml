  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification defines basic physical, chemical, and performance limits for 5 cSt grades of gas turbine engine lubricating oils used in aero and aero-derived marine and industrial applications, along with standard test methods and requirements for laboratories performing them. It also defines the quality control requirements to assure batch conformance and materials traceability, and the procedures to manage and communicate changes in oil formulation and brand. This specification invokes the Performance Review Institute (PRI) product qualification process. Requests for submittal information may be made to the PRI at the address in &lt;span class="xref"&gt;Appendix D&lt;/span&gt; &lt;span class="xref"&gt;Section D.2&lt;/span&gt;, referencing this specification. Products qualified to this specification are listed on a Qualified Products List (QPL) managed by the PRI. Additional tests and evaluations may be required by individual equipment builders before an oil is approved for use in their equipment. Approval and/or certification for use of a specific gas turbine oil in aero and aero-derived marine and industrial applications is the responsibility of the individual equipment builders and/or governmental authorities and is not implied by compliance with or qualification to this specification.&lt;/div&gt;&lt;/div&gt;</p>
