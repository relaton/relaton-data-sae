abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard covers the minimum requirements for nonmetallic tubing as manufactured for use in gasoline or diesel fuel systems. It is not intended to cover tubing for any portion of the system which operates below -40 degrees C, above 115 degrees C, or above a maximum working gage pressure of 690 kPa.</p>"
