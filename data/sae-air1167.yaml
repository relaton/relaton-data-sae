    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes environmental criteria for designing Aerospace Ground Equipment (AGE) in support of space systems. The test levels in this specification have been elevated to compensate for absence of combined environments during test, and to allow for variations in equipment and operating conditions. Environmental requirements are summarized in &lt;span class="xref"&gt;Table 1&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
