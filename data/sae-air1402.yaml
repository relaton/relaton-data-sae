  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report defines the guidelines for a COMMON TERMINATION METHOD for aerospace vehicle electrical wiring systems and shows how designers can select a minimum number of different parts, among preferred connecting devices that will satisfy all system requirements while achieving the objective of minimum cost in procurement, assembly and maintenance without compromising quality or reliability.&lt;/div&gt;&lt;/div&gt;</p>
