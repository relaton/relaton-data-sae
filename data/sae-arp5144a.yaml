    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) describes standard methods of heat application to cure thermosetting resins for commercial aircraft composite repairs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The methods described in this document shall only be used when specified in an approved repair document or with the agreement of the Original Equipment Manufacturer (OEM) or regulatory authority.&lt;/div&gt;
