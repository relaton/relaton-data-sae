abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;Although not limited to, these clutch requirements are normally
    used on trucks considered as Heavy Duty (Class 8).  This SAE Information Report
    defines and discusses clutch and related component configurations which will become
    the subject of future SAE Recommended Practices to promote standardization of
    clutch installations and mounting dimensions for use with pull-type heavy-duty
    clutches.&lt;/p&gt;</p>"
