abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is primarily intended to apply to new parts and products intended to be produced in an on-going production phase, but can also be applied to parts currently in production (e.g., manufacturing, maintenance). The standard is applicable to all production processes that influence the variation of KCs, as well as maintenance and service processes in which KCs are identified. It applies to organizations for assemblies and all levels of parts within an assembly, down to the basic materials including castings and forgings, and to organizations that are responsible for producing the design characteristics of the product.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The variation control process begins with product definition, typically stated in the design documentation (e.g., digital model, engineering drawing, specification) which identifies KCs, and leads to a variation management process for those KCs. This process may also be used for producer-identified KCs (e.g., process KCs, additional/substitute product KCs).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Producers and their subcontractors are responsible for flow down of the standard requirements to those external providers, who produce design characteristics and provide production and service provisions, to ensure that KCs conform to the customer’s requirements.&lt;/div&gt;

    &lt;/div&gt;</p>
