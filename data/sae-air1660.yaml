abstract:
- language: en
  script: Latn
  content: "<p>A fuel level control valve/system controls the quantity of fuel in
    a tank being filled or emptied. This document provides a general  familiarization
    with these mechanisms (e.g. forms they take, functions, system design considerations).
    This document provides the aircraft fuel system designer with information about
    these mechanisms/devices, so that he can prescribe the types of level control
    valves/systems which are best suited for his particular fuel system configuration.</p>"
