  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes minimum design, installation, qualification, and operational requirements for thermally actuated, pressure release devices for use only in tubeless tire type aircraft wheels. These devices are designed to completely release the contained air pressure from a tubeless tire and wheel assembly when absorbed and/or brake generated heat causes the tire or wheel to exceed a safe pressure/temperature/load operating level. The objective is to prevent tire or wheel rupture from brake generated heat which could cause serious personnel injuries or serious aircraft operational hazards.&lt;/div&gt;&lt;/div&gt;</p>
