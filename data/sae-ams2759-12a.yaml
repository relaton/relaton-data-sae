  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for producing a continuous compound layer with controlled phase composition by means of a gaseous process, automatically controlled to maintain set values of the nitriding and carburizing potentials that determine properties of the nitrocarburized surface. Automatic control is intended to ensure repeatability of nitrogen and carbon content of the compound layer which establishes properties such as wear and corrosion resistance, ductility and fatigue strength.&lt;/div&gt;&lt;/div&gt;</p>
