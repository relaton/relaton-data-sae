  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test procedure outlines the necessary test equipment (test fixture, dynamometer, data acquisition system, etc.) and test sequence required to test for low-frequency brake noise (200 Hz to 1.25 kHz) on a brake noise dynamometer. It is intended to complement SAE J2521, which focuses on high-frequency brake squeal. This RP applies to passenger cars and light trucks with a gross vehicle weight rating below 4536 kg. Before using this RP for heavier vehicles, consult and agree with the test requestor and the testing facility.&lt;/div&gt;
    &lt;/div&gt;</p>
