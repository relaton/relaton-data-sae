  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes minimum performance requirements and uniform test procedures for passenger car, truck, bus, and multipurpose vehicle windshield washer systems. This recommended practice also provides a uniform terminology of windshield washer system characteristics and phenomena. The test procedures are limited to those tests that can be conducted with uniform test equipment by commercially available laboratory facilities.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The minimum performance requirements and test procedures, outlined in this recommended practice, are based on currently available engineering data. It is intended that all portions of the recommended practice will be periodically reviewed and revised as additional data on windshield washer system performance are developed.&lt;/div&gt;&lt;/div&gt;</p>
