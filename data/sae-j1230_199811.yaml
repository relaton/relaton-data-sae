abstract:
- language: en
  script: Latn
  content: "<p>It is recognized that a malfunction in any one of the specified areas can degrade intended performance, but that levels of malfunction or combinations thereof must be considered by the vehicle designer in determining the point at which a failure indication is warranted. Consequently, the minimum reaction recommended by this document consists of making available a malfunction signal. \n\nThis SAE Recommended Practice establishes a uniform minimum set of functional areas to be monitored in the process of detecting malfunctions in discrete wheel-slip brake-control systems for motor vehicles, and establishes a minimum reaction to those detected malfunctions.</p>"
