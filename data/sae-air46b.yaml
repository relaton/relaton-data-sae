  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) reviews the precautions that must be taken and the corrections which must be evaluated and applied if the experimental error in measuring the temperature of a hot gas stream with a thermocouple is to be kept to a practicable minimum. Discussions will focus on Type K thermocouples. These are defined in NBS Monograph 125 as nickel-chromium alloy versus nickel-aluminum alloy thermocouples.&lt;/div&gt;
    &lt;/div&gt;</p>
