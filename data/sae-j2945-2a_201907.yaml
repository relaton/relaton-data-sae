  content: |-
    <p>&lt;p&gt;This Abstract Syntax Notation (ASN.1) File is the precise source code used for SAE International Standard J2945/2. As part of an international treaty, all US ITS standards are expressed in "ASN.1 syntax". ASN.1 Syntax is used to define the messages or "ASN specifications". Using the ASN.1 specification, a compiler tool produces the ASN library which will then be used to produce encodings (The J2945/2 message set uses UPER encoding). The library is a set of many separate files that collectively implement the encoding and decoding of the standard. The library is then used by any application (along with the additional logic of that application) to manage the messages. The chosen ASN tool is used to produce a new copy of the library when changes are made, and it is then linked to the final application being developed. The ASN library manages many of the details associated with ASN syntax, allowing for subtle manipulation to make the best advantage of the encoding style.&lt;/p&gt;
    &lt;p&gt;This SAE Document specifies DSRC interface requirements for V2V Safety Awareness applications, including detailed Systems Engineering documentation (needs and requirements mapped to appropriate message exchanges). These applications include: Emergency Vehicle Alert, Roadside Alert, and Safety Awareness Alerts for Objects and Adverse Road Conditions. This document extends the V2V Communications capabilities defined in J2945/1 to support these applications, and the National ITS Architecture.&lt;/p&gt;
    &lt;p&gt;The purpose of this SAE Document is to enable interoperability for V2V Safety Awareness communications.&lt;/p&gt;
