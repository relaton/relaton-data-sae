abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Full, industry standard test procedures for measuring the charging performance of a vehicle can be found in ISO/SAE 12906. This document describes the lessons learned during the development of that document, including false assumptions that are common in vehicle charging tests. The purpose of this document to better explain the need for the specific procedures in ISO/SAE 12906. Furthermore, by communicating the false assumptions and complications of historic charging tests, it is also hoped that others wishing to create test procedures different from ISO/SAE 12906 can do so without making the same mistakes of the past.&lt;/div&gt;&lt;/div&gt;</p>
