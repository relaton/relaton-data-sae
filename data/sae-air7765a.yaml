abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this joint EUROCAE/SAE report is to compile the considerations relating to airborne application of hydrogen fuel cells. This document provides a comprehensive analysis of the use of hydrogen as a fuel by describing its existing applications and the experience gained by exploiting fuel cells in sectors other than aviation. The use of hydrogen fuel cells in aircraft can help in meeting aviation environmental targets (including noise pollution) and can be vital to achieving efficient electrically propelled air vehicles. The experience gained with mature fuel cells in terrestrial applications and the handling of other gases in aviation, as presented herein, will help in alleviating safety concerns and in demystifying the usage of hydrogen in aviation.&lt;/div&gt;&lt;/div&gt;</p>
