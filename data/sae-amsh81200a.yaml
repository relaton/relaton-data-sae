  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the heat treatment of titanium and titanium alloy mill products (raw material), including wrought and cast products, by material producers. This specification also covers furnace equipment requirements, test procedures, and general information for heat treating procedures, heat treating temperatures, and material test procedures for the heat treatment of titanium and titanium alloys. It also describes procedures which, when followed, have produced the desired properties within the limitations of the respective alloys.&lt;/div&gt;&lt;/div&gt;</p>
