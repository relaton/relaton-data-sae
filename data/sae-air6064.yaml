  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Propulsion measurements and thrust methods presented in the current published versions of AIR1703 and AIR5450 place a primary focus on the engine reactionary force (thrust) acting to propel an aircraft in the forward direction. In contrast, this document addresses the use of the engine reactionary force in the opposite direction (reverse thrust) to supplement aircraft deceleration.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document’s application spans commercial and military transport turbofan engine applications for various engine and reverse thrust configurations. The discussion and examples primarily focus on separate flow exhaust turbofan engines. Piston and turboprop variable-pitch propeller blade applications are not covered. Although reverse thrust has been utilized for in-flight deceleration, primarily for short takeoff and landing aircraft and military fighter applications, this application of reverse thrust is only covered in a cursory manner.&lt;/div&gt;&lt;/div&gt;</p>
