    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice defines, illustrates, and specifies allowable limits for the various types of surface discontinuities that may occur during the manufacture and processing of metric-series nuts, in sizes 6.3 to 25 mm and inch-series nuts in sizes ¼ to 1 in., inclusive, which are primarily intended for use in automotive assemblies.&lt;/div&gt;
