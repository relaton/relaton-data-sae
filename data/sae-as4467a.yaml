  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines a series of standardized tube walls to be used for high pressure hydraulic tubing. These tube walls are applicable to all homogenous tube materials (i.e., aluminum, steel, titanium) throughout a rated pressure range of 1000 to 8000 psi and a maximum rated operating temperature range of 160 to 450 °F. All future aerospace applications for which a required tube outside diameter/tube wall combination is not presently available shall be selected from the table contained herein (see &lt;span class="xref"&gt;Figure 1&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
