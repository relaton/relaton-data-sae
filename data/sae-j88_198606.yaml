  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is applicable to machinery that is primarily used in construction and mining applications. It is not intended to cover operation of safety devices (such as backup alarms). The sound levels obtained by using the test procedures set forth in this SAE Standard are repeatable and are representative of the higher range of sound levels generated by the machinery under actual field operating conditions, but do not necessarily represent the average sound level over a field use cycle.&lt;/div&gt;&lt;/div&gt;</p>
