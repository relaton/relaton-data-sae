  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report proposes a methodology for applying weighting factors to system effectiveness quantification expressions of mathematical models for multi-function situations. Since the circumstances for applying "W" and "U" terms are almost unlimited, no attempt is made to show all possible applications of these terms. Rather, the basic principles are discussed and illustrated by simple examples in order to keep the focus on the principles for quantifying "W" and "U". The methods that are used at lower levels of the mission-function hierarchical tree are equally valid at higher levels. Consequently, the extension of these basic methods to more complicated situations was deliberately excluded from the content of this report.&lt;/div&gt;&lt;/div&gt;</p>
