abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard requires the developers and customer/user’s working as a team to plan and implement a reliability program that provides systems/products that satisfy the user’s requirements and expectations. The user’s requirements and needs are expressed in the form of the following four reliability objectives:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;The developer shall solicit, investigate, analyze, understand and agree to the user’s requirements and product needs.&lt;/b&gt; The developer, working with the customer and user, shall include the activities necessary to ensure that the user’s requirements and product needs are fully understood and defined, so that a comprehensive design specification and Reliability Program Plan can be generated.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;The developer shall use well-defined reliability- and systems-engineering processes to develop, design, and verify that the system/product meets the user’s documented reliability requirements and needs.&lt;/b&gt; The developer shall implement a set of engineering activities (included in this standard as normative activities and informative activities, refer to &lt;span class="xref"&gt;Section 3&lt;/span&gt;) so that the resulting system/product satisfies the customer’s documented requirements and needs.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;The multifunctional team shall verify during production that the developer has met the user’s reliability requirements and needs prior to fielding.&lt;/b&gt; The developer shall include activities that assure the customer that the reliability requirements and product needs have been satisfied.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;The multifunctional team shall monitor and assess the reliability of the system/product in the field.&lt;/b&gt; The team is responsible for identifying the data elements to assess the reliability of the system/product in the field and to ensure the data collected are accurate and complete. The team will establish a closed-loop feedback method to flow recommended improvements (corrective actions) for monitoring reliability growth.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;



    &lt;/div&gt;</p>
