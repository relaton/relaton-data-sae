  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides standardized guidelines for the design and identification of slide or slide/raft operating features. Review of the inflatable evacuation and ditching devices in service on the current airline fleet reveals the existence of a wide variety of design and labeling configurations related to the inflation and release of these devices from the aircraft structure. Due to the critical safety nature of these specific operating functions, a common and consistent approach to the design and identification of the inflation and release features is considered warranted. In addition, definition of other features requiring labelling is warranted.&lt;/div&gt;&lt;/div&gt;</p>
