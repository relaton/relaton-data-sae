  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to establish guidelines for the automatic transmission and hydraulic systems Engineer to design rectangular cross section seals for rotating and static grooved shaft applications. Also included are material property comparisons of polymeric materials suitable for these applications. Material covered in this document is not intended to include aluminum applications.&lt;/div&gt;&lt;/div&gt;</p>
