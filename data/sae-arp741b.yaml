  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This paper describes a recommended practice and procedure for the correlation of test cells that are used for the performance testing of turbofan and turbojet engines. Test cell correlation is performed to determine the effect of any given test cell enclosure and equipment on the performance of an engine relative to the baseline performance of that engine. When baseline testing is performed in an indoor test cell, the baseline performance data are adjusted to open air conditions.&lt;/div&gt;&lt;/div&gt;</p>
