  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide guidelines for instrumentation used with SAE J850. The aim is to achieve uniformity in instrumentation practice and in reporting test results without imposing undue restrictions on the performance characteristics of the individual elements in an instrumentation system. Use of this recommended practice will provide a basis for meaningful comparisons of test results from different sources.&lt;/div&gt;&lt;/div&gt;</p>
