  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Technical Information Report provides a compendium of terms, definitions, abbreviations, and acronyms to enable common terminology for use in engineering reports, diagnostic tools and publications related to active safety systems. This information report is a survey of active safety systems and related terms. The definitions offered are descriptions of functionality rather than technical specifications. Included are warning and momentary intervention systems, which do not automate any part of the dynamic driving task on a sustained basis like those defined in SAE J3016 Automated Driving Systems.&lt;/div&gt;&lt;/div&gt;</p>
