  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the procedure for determining the operator duty cycle sound pressure level L&lt;sub&gt;odc&lt;/sub&gt; to which operators of powered recreational craft up to 24 m in length are exposed during typical operation as determined by marine engine duty cycle studies. This document describes the instrumentation, the required calibration procedures, the test site, the specifications for “standard craft”, the craft operating conditions, microphone positioning, test procedure, engine speeds for each of the Duty Cycle modes and the formula and table for calculating the Duty Cycle operator ear sound pressure level.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is subject to change to keep pace with technical advances as well as other international standards and practices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Changes in this Revision: The sound pressure level measurements performed while applying this document are based on the Five-Mode Marine Engine Duty Cycle instead of a single engine speed. A calculation is required to obtain the Duty Cycle operator ear sound pressure level (L&lt;sub&gt;odc&lt;/sub&gt;). Provisions for type testing are provided along with specifications for Standard Craft.&lt;/div&gt;&lt;/div&gt;</p>
