  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This information report provides an overview of a typical high voltage electric propulsion vehicle (xEV) and the associated on-board safety systems typically employed by OEM’s to protect these high voltage systems. The report aims to improve public confidence in xEV safety systems and dispel public misconceptions about the likelihood of being shocked by the high voltage system, even when the vehicle has been damaged. The report will document select high voltage systems used for xEV’s and describe safety systems employed to prevent exposure to the high voltage systems.&lt;/div&gt;&lt;/div&gt;</p>
