  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes an inertia dynamometer test procedure, using exemplar caliper disc or drum brakes, to characterize the effectiveness of brake friction products for passenger cars and light trucks, up to and including 3500 kg GVW.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J2430 provides a method of characterizing friction material effectiveness, using vehicle specific brake hardware and test conditions that approximate those for U.S. mandated new vehicle brake tests.&lt;/div&gt;&lt;/div&gt;</p>
