    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established metric (SI) manufacturing tolerances applicable to non-cellular rubber products ordered to metric dimensions. These tolerances apply to all conditions, unless otherwise noted. The term "exclusive" applies only to the higher figure of the specified range.&lt;/div&gt;&lt;/div&gt;</p>
