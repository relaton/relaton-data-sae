abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;CTI 4501 defines the key capabilities and interfaces a connected signalized intersection must support to ensure interoperability with vehicles, including production vehicles, for state and local IOOs. A connected intersection is defined as an infrastructure system that broadcasts SPaT, MAP, and optionally position correction data to vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The CTI 4501 family of documents define procurement and implementation guidance and the expectations leading to minimum performance requirements for a connected intersection. It is intended to be used by IOOs to provide guidance on how to implement an interoperable connected intersection. For OEMs and other application developers, these recommended practices provide an explanation on what data and connected vehicle messages are being provided from an interoperable connected intersection so safety applications can be developed for production vehicles, with an initial focus on the Red Light Violation Warning (RLVW) application. Although the focus is on the RLVW application, requirements for other V2X applications related to connected intersections, including requirements for traffic signal controllers to generate the SPaT information, are also addressed assuming the connected intersection configuration and messages can support them and no significant effort was needed. The Needs to Requirements Traceability Matrix (NRTM) in 6.2.3 provides the guidance to IOOs for the procurement of a connected intersection.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Recognizing that some stakeholders require more in-depth guidance on specific aspects of connected intersections, Version 2 of the CI Implementation Guide has been reorganized into a main document and several companion sub-documents. The main document establishes the overarching framework - following a Systems Engineering Process (SEP) - and includes a Concept of Operations (ConOps), System Requirements (Functional Requirements), System Design Details, and an NRTM. These elements enable users to identify and procure connected intersection solutions that satisfy their specific needs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The companion documents elaborate on specialized areas such as SPaT, MAP, security, and testing and validation, providing requirements and design details tailored for those subject areas. &lt;span class="xref"&gt;Figure 1&lt;/span&gt; depicts the relationships among these sub-documents and other documents that support the implementation of a connected intersection. By separating out these focused topics, the guide more effectively supports IOOs, OEMs, suppliers, and application developers that need targeted information. Taken together, the main guide and the companion documents ensure that connected intersection deployments align with national standards and support a high level of interoperability, ultimately facilitating safer and more efficient automated transportation systems.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;This Security Guidance document equips practitioners with targeted security guidelines, helping foster reliable, resilient connected intersections that maintain public trust and support the broader goals of interoperable, secure connected intersections. The document addresses multiple facets of security, while aligning with the overall structure and methodology of the main CTI 4501 document, including:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Data Trustworthiness - Ensuring the integrity and authenticity of information originating from both infrastructure and vehicles.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Communications Security - Protecting data exchanges across all relevant interfaces.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;System Management and Recovery - Defining best practices for updates, operational modes, and restoration procedures.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Verification Requirements - Outlining checks to confirm that security measures are properly implemented.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;For IOOs, this document provides actionable guidance on specifying and deploying security capabilities and functions to support robust, trustworthy connected intersections. For OEMs and developers, it explains how to secure the data and messages which will be broadcast from interoperable intersections, enabling the development of safety-critical applications such as RLVW.&lt;/div&gt;&lt;/div&gt;</p>
