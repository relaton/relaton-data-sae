  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers complete general and dimensional specifications for 37 deg flared and flareless types of hydraulic tube fittings and the O-ring bosses and related components with which they assemble. Also included are pipe fittings for use in conjunction with these tube fittings. These fittings are intended for general application in hydraulic systems on industrial equipment and commerical products.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These fittings are capable of providing leak proof full flow connections in hydraulic systems operating at working pressures as specified in SAE J1065 “Pressure Ratings for Hydraulic Tubing and Fittings”.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Since many factors influence the pressure at which a hydraulic system will or will not perform satisfactorily, the values shown in SAE J1065 should not be construed as a guaranteed minimum.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For any severe applications it is recommended sufficient testing be conducted and reviewed by both the user and fitting manufacturer to assure performance levels will be safe and satisfactory.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The standard is divided into five sections as follows:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Section I—37 deg Flare Tube Fittings.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Section II—Flareless Tube Fittings.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Section III—O-Ring Boss and Plugs.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Section IV—Hydraulic Pipe Fittings (formerly J926).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Section V—Tables for Calculating Dimensions on Special Sizes.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
















    &lt;/div&gt;</p>
