  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion- and heat-resistant nickel alloy in the form of bars, forgings, and flash-welded rings up to 4.00 inches (101.6 mm), inclusive, in nominal thickness or distance between parallel sides and having a maximum cross-sectional area of less than 12.6 square inches (81 cm&lt;sup&gt;2&lt;/sup&gt;). Stock for forging or flash-welded rings may be of any size and condition as ordered.&lt;/div&gt;&lt;/div&gt;</p>
