  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE/USCAR-46 defines test methods and outputs for engine oil pump bench testing. Performance and durability testing are the primary focus of this standard. This is written to specifically address testing of electronically controlled variable displacement pumps but can be adapted to mechanically controlled pumps and other pump technologies as needed. This standard outlines critical inputs and outputs in order to perform the testing and report results, but does not specifically set the acceptance standards or pass/fail criteria. Acceptance criteria must be set by the customer.&lt;/div&gt;&lt;/div&gt;</p>
