  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides minimum performance and design standards for a handheld, high-intensity, flashing Aviation Visual Distress Signal (AVDS) based on light-emitting-diode (LED) technology operating simultaneously in visible (white) and near infrared (NIR) spectra designed to facilitate location and rescue of aviation accident/ditching survivors in open sea conditions.&lt;/div&gt;
    &lt;/div&gt;</p>
