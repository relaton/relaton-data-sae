  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;As the number of Hydraulic Hybrid Powertrain equipped motor vehicles has increased, the number of terms, abbreviations, and acronyms which describe various components of these systems has increased. For the sake of industry standardization and to bring some order to the proliferation of such terms, abbreviations, and acronyms, the SAE Truck and Bus Hydraulic Hybrid committee prepared this document.&lt;/div&gt;&lt;/div&gt;</p>
