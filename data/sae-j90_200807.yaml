abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;The classification system provides a means for specifying or describing pertinent properties of commercial nonmetallic gasket materials. Materials composed of asbestos, cork, cellulose, and other organic or inorganic materials in combination with various binders or impregnants are included. Materials normally classified as rubber compounds are not included, since they are covered in SAE J200 - ASTM D 2000. Gasket coatings are not covered, since details thereof are intended to be given on engineering drawings or in separate specifications.&lt;/p&gt;
    &lt;p&gt;Since all of the properties that contribute to gasket performance are not included, use of the classification system as a basis for selecting materials is limited.&lt;/p&gt;
    &lt;p&gt;The values stated in SI units are to be regarded as the standard. The values given in parentheses are for information only.&lt;/p&gt;
    &lt;p&gt;This SAE Recommended Practice may involve hazardous materials, operations, and equipment. This document does not purport to address all of the safety problems associated with its use. It is the responsibility of the user of this document to establish appropriate safety and health practices and determine the applicability of regulatory limitations prior to use.lems associated with its use.&lt;/p&gt;</p>
