  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for 24° cone AS5827 or EN 6123 flareless Ring locked fitting assemblies per AS5550 and AS5865, for use in aircraft fluid systems at nominal operating pressure of 5080 psi maximum and operating temperature range of -65 to +275 °F.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The general requirements shall be for, but not limited to, commercial aircraft hydraulic components per AS4941, using port configuration as specified in AS5551.&lt;/div&gt;
    &lt;/div&gt;</p>
