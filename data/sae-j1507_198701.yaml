  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This information report gives typical requirements for an anechoic chamber in which the system susceptibility of an operating motor vehicle to electromagnetic fields can be determined in the frequency range of 20 MHz to 18 GHz. Because of the large cone sizes required for 20 MHz cut-off, several anechoic facilities have been designed with lower cut-off frequencies of 200 MHz or greater. Testing below cut-off is then accomplished using customized antennas at reduced accuracy. Users should carefully review their testing requirements before undertaking the construction of a test facility the magnitude of an anechoic chamber. Other test approaches include, but are not limited to, open field testing per SAE J1338 and mode stirred reverberation chambers.&lt;/div&gt;&lt;/div&gt;</p>
