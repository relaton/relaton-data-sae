    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide criteria for determining the compatibility of air-conditioning (A/C) system materials/components with candidate retrofit refrigerants intended to replace CFC-12 (R12) in mobile A/C systems originally designed to use CFC-12 (R-12).&lt;/div&gt;&lt;/div&gt;</p>
