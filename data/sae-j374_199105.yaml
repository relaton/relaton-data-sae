  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a uniform laboratory test method to evaluate the strength characteristics of roof systems. The test procedure is intended to provide reliable and repeatable results and to permit numerical comparisons.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A test is conducted in which the vehicle roof system is loaded under controlled laboratory conditions. Structural strength measurements are obtained under load application angles chosen to concentrate forces on the forward portions of the roof panel and roof supporting structure.&lt;/div&gt;&lt;/div&gt;</p>
