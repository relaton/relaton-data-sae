  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines the minimum requirements for auditors, CBs, Auditor Authentication Bodies (AABs), Training Provider Approval Bodies (TPABs), and Training Providers (TPs) who participate in the IAQG Industry Controlled Other Party (ICOP) scheme. The requirements in this standard supplement those defined within the 9104/1, 9104/2, ISO/IEC 17021-1, and ISO/IEC 17021-3 standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Data protection for the parties subject to this document and other relevant requirements of the ICOP scheme are managed via bi-lateral contracts between the joint controllers of the data.&lt;/div&gt;&lt;/div&gt;</p>
