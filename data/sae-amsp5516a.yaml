    <p>&lt;p&gt;This specification has been declared "CANCELLED" by the Aerospace Materials Division, SAE, as of November 2010. By this action, this document will remain listed in the Numerical Section of the Index of Aerospace Materials Specifications indicating that it has been "CANCELLED".&lt;/p&gt;
