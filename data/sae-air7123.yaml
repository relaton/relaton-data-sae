    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide an overview, process, and implementation guidance on use of blockchain technology for a secure, immutable, and traceable digital authorized release certificate. This document does not standardize the process nor is it meant for authorities to recognize the standard as an acceptable means of recording data collected through the required authorized release certificate (ARC) tags.&lt;/div&gt;


    &lt;/div&gt;</p>
