abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This document establishes standardized dimensional cell geometry, performance-test procedures, and reporting requirements for secondary (i.e., rechargeable) pouch cells used in Group 1 sUAV. It defines reference geometries, test conditions, and uniform data formats to allow direct comparison of pouch-cell performance across manufacturers and to improve interoperability within the sUAV ecosystem.&lt;/p&gt;</p>"
