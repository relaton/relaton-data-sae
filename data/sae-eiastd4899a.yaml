  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines the requirements for developing an Electronic Components Management Plan (ECMP), hereinafter also called the Plan, to assure customers and regulatory agencies that all of the electronic components in the equipment of the Plan owner are selected and applied in controlled processes compatible with the end application; and that the Technical Requirements detailed in clause 5.0 are accomplished. In general the owners of a complete Electronic Components Management Plan are avionics equipment manufacturers.&lt;/div&gt;&lt;/div&gt;</p>
