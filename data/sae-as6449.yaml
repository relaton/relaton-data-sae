    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the requirements for a dry film lubricant AS6449 lubricant for use on breathing oxygen system and potable water system components, for a tempersture range of -90 °F to +300 °F. This document also establishes the Non-Destructive Test (NDT) procedures and criteria for coated production parts. This document requires qualified products and product applicators.&lt;/div&gt;


    &lt;/div&gt;</p>
