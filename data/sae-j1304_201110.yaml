  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;For cutting edges used on buckets for loaders defined in SAE J1057a. The dimensions are applicable to rolled and machined sections only. Cutting edge cross section thickness is limited to a maximum of 35 mm. Bolt-on tooth adapters are rarely used on loader buckets with cutting edge thicknesses in excess of 35 mm. This recommended practice applies only to straight cutting edges defined as those whose leading edge and rear edge are parallel and thus are of constant cross section. Overall cross sections to which bolt holes were added as indicated by this recommended practice were selected from those indicated per "Cutting Edge—Cross Sections Loader Straight," SAE J1303 FEB85. Selection was based on minimum section width requirements to accommodate bolt-on tooth adapters.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE—For some heavy-duty applications, cross sections with larger blunts, greater bevel angles, and larger bolt holes may be required.&lt;/div&gt;

    &lt;/div&gt;</p>
