    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines a method for the measurement of the whole body vibration to which the seated operator of off-highway self-propelled work machines is exposed while performing an actual or simulated operation. It applies to vibration transmitted to the operator through the seat. There are no equivalent ISO Standards.&lt;/div&gt;
    &lt;/div&gt;</p>
