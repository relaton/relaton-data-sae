  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the minimum internal dimensions for clutch housings to provide adequate clearance for single and two plate spring loaded clutches.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Consult SAE J617c (June, 1976) for housing flange dimensions. Consult SAE J618d (May, 1974) and J619d (May, 1974) for spring loaded clutch flywheel dimensions &lt;i&gt;E&lt;/i&gt; and &lt;i&gt;G&lt;/i&gt; and other dimensional data.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Table 1&lt;/span&gt; provides housing minimum internal dimensions for single and two flange spring loaded clutches.&lt;/div&gt;

    &lt;/div&gt;</p>
