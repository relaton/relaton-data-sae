    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers standard chemical check analysis limits as established by AMS usage. The chemical check analysis limits shown herein shall apply when this specification is referenced in material specifications for titanium and titanium alloys. Check analysis limits for elements or for ranges of elements not listed herein shall be as agreed upon by purchaser and vendor.&lt;/div&gt;&lt;/div&gt;</p>
