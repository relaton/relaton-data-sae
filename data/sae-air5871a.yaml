  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to prognostics of aerospace propulsion systems. Its purpose is to define the meaning of prognostics in this context, explain their potential and limitations, and to provide guidelines for potential approaches for use in existing condition monitoring environments. This document also includes some examples. The current revision does not provide specific guidance on validation and verification, nor does it address implementation aspects such as computational capability or certification.&lt;/div&gt;&lt;/div&gt;</p>
