  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes those factors which affect the accuracy and reliability of voltage indicating units and electrical indicating and sending units for fuel level, pressure, and temperature suitable for off-road, self-propelled work machines as described in SAE J1116 and agricultural tractors as defined in ASAE S390. Indicating units are divided into two groups, fully sealed and partially sealed. Serviceable lighting is not covered by this document unless otherwise specified. No ISO document has been found to be compatible.&lt;/div&gt;
    &lt;/div&gt;</p>
