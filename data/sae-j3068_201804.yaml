  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the general physical, electrical, functional, testing, and performance requirements for conductive power transfer to an Electric Vehicle using a Coupler capable of, but not limited to, transferring three-phase AC power. It defines a conductive power transfer method including the digital communication system. It also covers the functional and dimensional requirements for the Electric Vehicle Inlet, Supply Equipment Connector, and mating housings and contacts. Moveable charging equipment such as a service truck with charging facilities are within scope. Charging while moving (or in-route-charging) is not in scope.&lt;/div&gt;&lt;/div&gt;</p>
