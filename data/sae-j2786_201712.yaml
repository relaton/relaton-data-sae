  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines various vehicular noises and vibrations that are attributed to being created by the foundation brake components of the vehicle, particularly on passenger cars and light trucks. These definitions cover both disc and drum brakes. The frequency ranges from near zero Hz (tactile sensations) all the way up to 17 kHz, or the upper limit of normal hearing. These noises and vibrations may either directly radiate off the brake system or provide the excitation energy that causes other vehicle components to react.&lt;/div&gt;
    &lt;/div&gt;</p>
