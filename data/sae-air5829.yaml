  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) discusses the forms that air may take in aircraft hydraulic systems. Further, the effects of the various air forms on system operation are addressed. Recommended system design to prevent air effects and maintenance procedures to prevent and remove air are provided. Nitrogen leakage from accumulators is also a source of gas in hydraulic systems and may compose a portion of the “air” in the hydraulic system. The term “air” in this report does not differentiate between a gas composed strictly of normal atmospheric air or one that includes a mixture of additional nitrogen as well. The discussions of the report apply equally with any proportions of atmospheric air and nitrogen in the system.&lt;/div&gt;&lt;/div&gt;</p>
