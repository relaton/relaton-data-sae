  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard establishes the minimum construction and performance requirements for a combination cable consisting of 11 conductors and 4 twisted pairs for use on trucks, trailers, and dollies in conjunction with SAEJ2691. (15 pole connectors.) The cable includes both power and unjacketed SAE J1939-15 paired signal circuits along with dual ground wires to accommodate grounding requirements within the constraints of the SAE J2691 terminal capacity.&lt;/div&gt;&lt;/div&gt;</p>
