abstract:
- language: en
  script: Latn
  content: "<p>This report defines the guidelines for a Common Termination Method
    for aerospace vehicle electrical wiring systems and shows how designers can select
    a minimum number of different parts, among preferred connecting devices that will
    satisfy all system requirements while achieving the objective of minimum cost
    in procurement, assembly and maintenance without compromising quality or reliability..</p>"
