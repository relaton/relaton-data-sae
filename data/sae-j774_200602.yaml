  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides test procedures and performance requirements for emergency warning devices (triangular shape), without self-contained energy sources, that are designed to be carried in motor vehicles and used to warn approaching traffic of the presence of a stopped vehicle, except for devices designed to be permanently affixed to the vehicle, and provides test procedures and performance requirements for protective containers for such emergency warning devices.&lt;/div&gt;&lt;/div&gt;</p>
