  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides the testing and functional requirements guidance necessary for a leak detection device that uses any non-A/C refrigerant tracer gas, such as helium or a nitrogen-hydrogen blend, to provide functional performance equivalent to a refrigerant electronic leak detector. It explains how a non- refrigerant leak detector’s calibration can be established to provide levels of detection equal to electronic leak detectors that meet SAE J2791 for R-134a and SAE J2913 for R-1234yf.&lt;/div&gt;&lt;/div&gt;</p>
