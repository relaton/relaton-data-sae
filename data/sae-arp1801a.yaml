  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Recommended Practice covers specialized internal combustion engine powered equipment used in support of aircraft operations. The equipment may be self-propelled, truck mounted, trailer mounted, skid mounted or stationary. It does not include construction equipment or equipment designed primarily for operation on highways or within factories or building areas.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Equivalent methodology is provided in (CEN) EN 1915-4, Aircraft ground support equipment - General requirements - Part 4: Noise measurement methods and reduction, to be used for measurements conforming to the EU Machinery Directive&lt;/div&gt;
    &lt;/div&gt;</p>
