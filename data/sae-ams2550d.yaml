  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the engineering requirements for a treatment to provide enhanced corrosion resistance to sheet metal parts, such as brackets, spacers, and washers, fabricated from martensitic corrosion-resistant steels, usually AMS 5504 or AMS 5508 and having hardness not higher than 40 HRC, or ferritic corrosion-resistant steels, usually AMS 5506. The treatment is not recommended for use on parts subject to impact in service.&lt;/div&gt;&lt;/div&gt;</p>
