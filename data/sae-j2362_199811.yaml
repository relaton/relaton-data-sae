  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes lubricating oils meeting the API SJ performance category, SAE J300, the International Lubricant Standardization and Approval Committee (ILSAC) GF-2 Standard, and bear the API Certification Mark (starburst symbol) in accordance with API 1509. These oils are suitable for the lubrication of spark-ignition engines (gasoline engines). This document is equivalent to the military’s Commercial Item Description A-A-52039 when all requirements are met.&lt;/div&gt;&lt;/div&gt;</p>
