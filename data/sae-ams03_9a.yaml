    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the requirements for the electro-deposition of silver on ferrous-base, copper-base, aluminum-base, zinc-base and nickel base materials. It is primarily intended for use on electrical and electronic items which are to be plated with silver to increase the electrical conductivity of the surface.&lt;/div&gt;&lt;/div&gt;</p>
