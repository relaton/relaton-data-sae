    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;The purpose of this specification is to define and provide for the control of colors employed in motor vehicle lighting equipment. The specification applies to the overall effective color of light emitted by the device and not to the color of light from a small area of the cover lens.&lt;/div&gt;&lt;/div&gt;</p>
