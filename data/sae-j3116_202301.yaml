  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The goal of the Pedestrian Test Mannequin Task Force is to develop standard specifications/requirements for pedestrian test mannequins (1 adult and 1 child) that are representative of real pedestrians to the sensors used in Pedestrian Detection systems and can be used for performance assessment of such in-vehicle systems (including warning and/or braking) in real world test scenarios/conditions. This version of the document only includes the pedestrian mannequin for vision, Lidar, and/or 76 to 78 GHz radar based Pedestrian Pre-collision systems.&lt;/div&gt;&lt;/div&gt;</p>
