  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) contains technical information on aerospace hydraulic, actuation and support equipment technologies lessons learned. The lessons learned were prepared by system designers and hydraulic engineers from the aerospace industry and government services as part of SAE Committee A-6, Aerospace Fluid Power, Actuation, and Control Technologies, and were presented at eight Lessons Learned Symposia from 1989 through 1999 held during A-6 Committee meetings. The technical topics represent many years of design experience in hydraulics and actuation, which it is felt is a resource for learning that should be documented and made available to current and future aerospace hydraulic engineers and designers. The document is organized into two sections: systems and components with further categories within the components section. The information topics are presented in a concise format of problem, issue, and solution, with accompanying descriptive diagrams and illustrations for clarity and understanding.&lt;/div&gt;&lt;/div&gt;</p>
