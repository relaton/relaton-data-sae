  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes requirements applicable to metal stock that is ordered and produced in accordance with an Aerospace Material Specification (AMS). Topics include producer requirements, distributor requirements, size and grain orientation nomenclature, and purchaser ordering information to distributors. Requirements of this document have been developed to address titanium and titanium alloys.&lt;/div&gt;&lt;/div&gt;</p>
