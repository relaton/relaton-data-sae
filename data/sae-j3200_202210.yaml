  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report details the important new performance properties and suggested test methods for lubricants used in e-Mobility drivetrain components. The lubricants under discussion are those used in electrified drivetrains, mainly electric-transmissions and axles (e-transmissions and e-axles). The scope is limited to those geared systems in which an electric motor (e-motor) is immersed in the powertrain lubricant or comes in contact with the powertrain lubricant. Though the report focuses on new lubricant attributes, some information on conventional lubricant attributes is included. The information presented here will be helpful in understanding the similarities and differences between conventional (i.e., internal combustion engine (ICE)) and e-Mobility powertrain systems.&lt;/div&gt;&lt;/div&gt;</p>
