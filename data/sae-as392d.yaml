  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aeronautical Standard covers two (2) basic types of instruments as follows:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;TYPE I - Range 35,000 feet. Barometric Pressure. Scale range at least 28.1 - 30.99 inches of mercury (946-1049 millibars). May include markers working in conjunction with the Barometric Pressure Scale to indicate pressure altitude.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;TYPE II- Range 50,000 feet. Barometric Pressure. Scale range at least 28.1 - 30.99 inches of mercury (946-1049 millibars). May include markers working in conjunction with the Barometric Pressure Scale to indicate pressure altitude.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
