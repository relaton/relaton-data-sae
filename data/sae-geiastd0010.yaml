  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document outlines a standard practice for conducting system safety. The system safety practice as defined herein provides a consistent means of evaluating identified risks. Mishap risk must be identified, evaluated, and mitigated to a level as low as reasonably practicable. The mishap risk must be accepted by the appropriate authority and comply with federal (and state, where applicable) laws and regulations, executive orders, treaties, and agreements. Program trade studies associated with mitigating mishap risk must consider total life cycle cost in any decision.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended for use as one of the elements of project solicitation for complex systems requiring a systematic evaluation of safety hazards and mitigating measures. The Managing authority may identify, in the solicitation and system specification, specific system safety engineering requirements to be met by the Developer. These may include risk assessment and acceptance criteria, unique classifications and certifications, or mishap reduction needs unique to their program. Additional information in meeting program specific requirements is located in the Appendixes.&lt;/div&gt;&lt;/div&gt;</p>
