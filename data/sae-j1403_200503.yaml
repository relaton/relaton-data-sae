    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The vacuum brake hose is intended for use in the power braking systems of vehicles or as connections on vacuum lines of vehicles or systems thereof. For the purposes of clearly identifying hose classification and for specification simplification, vacuum brake hose is divided into two types: heavy-wall Type H, and light-wall Type L.&lt;/div&gt;
