  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides guidance for in-flight rest facilities provided for use by cabin crew on commercial transport airplane.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is applicable to dedicated cabin crew rest facilities with rigid walls. The facility includes a bunk or other surface that allows for a flat sleeping position, is located in an area that is temperature-controlled, allows the crew member to control light, and provides isolation from noise and disturbance.&lt;/div&gt;&lt;/div&gt;</p>
