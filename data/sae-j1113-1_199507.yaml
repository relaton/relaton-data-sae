    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the measurement of voltage transient immunity, and within the applicable frequency ranges, audio (af) and radio frequency (rf) immunity, and conducted and radiated emissions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Emissions from intentional radiators are not controlled by this document. (See applicable appropriate regulatory documents.) The immunity of commercial mains powered equipment to over voltages and line transients is not covered by this document. (See applicable UL or other appropriate agency documents.)&lt;/div&gt;&lt;/div&gt;</p>
