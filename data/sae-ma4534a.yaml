  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard covers high strength commercial sockets and universal sockets which possess the strength, clearances, and internal wrenching design so configured that, when mated with hexagon (6 point) fasteners, they shall transmit torque to the fastener without bearing on the outer 5% of the fastener’s wrenching points. This document provides additional requirements beyond ANSI B107.5 appropriate for aerospace use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Inclusion of dimensional data in this document is not intended to imply all of the products described therein are stock production sizes. Consumers are requested to consult with manufacturers concerning lists of stock production sizes.&lt;/div&gt;
    &lt;/div&gt;</p>
