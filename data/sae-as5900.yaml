  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the aerodynamic flow-off requirements for SAE AMS 1424 Type I and SAE AMS 1428 Type II, III and IV. Fluids used to deice and/or anti-ice:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Large transport type jet aircraft while on the ground where the takeoff rotation speeds generally exceed approximately 100 to 110 knots. (The procedure for this type of aircraft is referred to as the High Speed Ramp Tests).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;and/or&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Commuter type aircraft while on the ground and when no compensating measures are taken in the aircraft takeoff procedure where the takeoff rotation speeds generally exceed approximately 60 knots. (The procedure for this type of aircraft is referred to as the Low Speed Ramp Tests.)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The objective of this standard is to ensure acceptable aerodynamic characteristics of the deicing/ anti-icing fluids as they flow off aircraft lifting and control surfaces during the takeoff ground acceleration and climb.&lt;/div&gt;&lt;/div&gt;</p>
