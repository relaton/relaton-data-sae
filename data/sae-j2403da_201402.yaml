abstract:
- language: en
  script: Latn
  content: "<p>This document is intended to supplement SAE J2403 by providing the
    content of Table 1, Table 2, and Table 3 from SAE J2403 in a form that can be
    sorted and searched for easier use. It is NOT intended as a substitute for the
    actual document, and any discrepancies between this Digital Annex and the published
    SAE J2403 document must be resolved in favor of the published document.  This
    document provides the content of Table 1 and Table 2 published in SAE J2403 into
    the single table in the 'Term' tab, while the 'Recommended Term Definitions' tab
    provides the content of Table 3 in SAE J2403 and the 'Glossary' tab provides the
    content of Table 4 in SAE J2403.</p>"
