  script: Latn
  content: |-
    <p>&lt;p&gt;This Abstract Syntax Notation (ASN.1) file precisely specifies the structure of the data used to support the implementation of SAE International Standard 2945/6. Using the ASN.1 specification, a compiler tool can be used to produce encodings as required by the encoding rules identified in the standard. Both this file and the SAE J2735 ASN.1 files are necessary to collectively implement the data exchange described in the J2945/6. The combined library can be used by any application (along with the additional logic of the application) to exchange the data over an interface conformant to J2945/6.&lt;/p&gt;
    &lt;p&gt;SAE J2945/6 specifies the interface and requirements for Cooperative Adaptive Cruise Control (CACC) and Platooning. It provides the information necessary to build interoperable systems that support CACC, which rely on the exchange of Cooperative Control Messages.&lt;/p&gt;
    &lt;p&gt;You may also be interested in:&lt;/p&gt;
