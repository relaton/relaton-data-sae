  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Recommendations of this Aerospace Recommended Practice (ARP) are not intended to satisfy the more detailed and stringent requirements of aircraft design development. Also, they may not be directly applicable to general or private aviation aircraft where special restraints on measurement locations and procedures may exist. However, many of the principles and standards discussed may apply to these aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommended procedure for sound pressure level measurements in aircraft involves the recording of data on magnetic tape for subsequent processing and analysis after the flight. Sound level meter/octave-band analyzer measurements, because of inherent inaccuracies associated with manual data readings, are not as precise as those obtained from a tape-recorder/time integrating analyzer system and are, therefore, precluded from this recommended practice.&lt;/div&gt;&lt;/div&gt;</p>
