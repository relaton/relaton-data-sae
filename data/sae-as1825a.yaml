  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Aerospace Standard (AS) shall cover the methodology of defining and determining the "internal volumes" of both the main deck and lower deck aircraft cargo compartments. The minimum required clearance between the compartment envelope and the unit load devices (ULDs) shall also be stated in order to provide the maximum ULD external contour and the methodology to define the ULD internal volumes.&lt;/div&gt;
    &lt;/div&gt;</p>
