    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following information applies to automotive camshaft drives, distributor drives, or other underhood drives that may require synchronization. For other power transmission drives requiring synchronization, refer to &lt;i&gt;Specifications for Drives using Synchronous Belts&lt;/i&gt; (MXL, XL, L, H, XH and XXH belt sections) (IP 24/1978), published jointly by the Rubber Manufacturers Association (RMA), the Mechanical Power Transmission Association (MPTA), and the Rubber Association of Canada (RAC).&lt;/div&gt;&lt;/div&gt;</p>
