  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the general physical, electrical, and performance requirements for the electric vehicle conductive charging system and coupler for use in North America. The intent of the document is to define a common electric vehicle conductive charging system architecture and the functional requirements of the vehicle inlet and mating connector. Application and compatability requirements for the connector and vehicle inlet are stated herein.&lt;/div&gt;
