abstract:
- language: en
  script: Latn
  content: "<p>The Initial Graphics Exchange Specification (I.G.E.S.) defines a neutral
    file format for facilitating transfer of graphic information between dissimilar
    CAD/CAM systems. This specification is being developed under the auspices of the
    National Institute for Standards and Technology and in the opinion of this committee
    is properly addressing the key communication issue of dissimilar graphic data
    formats.  The purpose of this SAE Recommended Practice is to establish a  uniform
    practice for the exchange of graphic data between organizations using dissimilar
    CAD/CAM systems.</p>"
