  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice specifies the general characteristics and test procedure to define the minimum characteristics, performance, and durability requirements. It is applicable to remanufactured assemblies (factory rebuild) only.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to master cylinder assemblies and components of current established designs but does not cover fluid level sensors, integral proportioning valves or those master cylinders used in anti-lock brake or traction control systems. These will be covered by other standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The minimum characteristics, performance, and durability requirements are specified in SAE J1694.&lt;/div&gt;
    &lt;/div&gt;</p>
