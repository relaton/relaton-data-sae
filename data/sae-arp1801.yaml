    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this recommended practice covers specialized internal combustion engine powered equipment used in the support of aircraft operations. The equipment may be self-propelled, truck mounted, trailer mounted, skid mounted or stationary. It does not include construction equipment or equipment designed primarily for operation on highways or within factories or building areas.&lt;/div&gt;&lt;/div&gt;</p>
