  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification is written for rolled goods used for trim sets for automotive seats. Face materials are fabric-woven or knitted textiles, and plastic goods like polyvinyl chloride (PVC), thermoplastic polyolefin (TPO), or thermoplastic polyurethane (TPU). This specification covers material rolled goods with and without foam or backing adhered to the face material.&lt;/div&gt;&lt;/div&gt;</p>
