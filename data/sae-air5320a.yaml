  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) contains information on most of the major icing simulation ground facilities. An effort was made to obtain data from as many facilities as possible over a two year time period. The data in this document represents the state of the facilities in calendar year 1996. Facilities are constantly changing and upgrading and, therefore, some facility specifications may change during the life of this report.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Of the 27 facilities described in this report, the primary use is split with approximately half for engine testing and half for wind tunnel testing. The facilities are limited to ground facilities and, therefore, icing tankers have not been included.&lt;/div&gt;
    &lt;/div&gt;</p>
