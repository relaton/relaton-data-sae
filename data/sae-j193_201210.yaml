  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The test procedures describe a method to laboratory test suspension and steering system ball stud and/or socket assemblies for functional characteristics. This procedure is an extension of SAE J491b recommended practice on dimensional recommendations for ball studs towards a vehicle application. The tests are conducted either on ball studs individually or on complete integral assemblies representing the application.&lt;/div&gt;
    &lt;/div&gt;</p>
