  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is a technology-neutral approach to speech input and audible output system guidelines applicable for OEM and aftermarket systems in light vehicles. These may be stand-alone interfaces or the speech aspects of multi-modal interfaces. This document does not apply to speech input and audible output systems used to interact with automation or automated driving systems in vehicles that are equipped with such systems while they are in use (ref. J3016:JAN2014).&lt;/div&gt;
    &lt;/div&gt;</p>
