    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is to present to hydraulic system designers the salient factors that affect hydraulic piston pump life and performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is noted that this document differs in scope from ARP819. ARP819 is a composite checklist of the many variables that affect the pump selection for a particular application.&lt;/div&gt;
