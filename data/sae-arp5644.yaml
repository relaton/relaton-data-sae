    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this document is to provide recommended practices for conducting shock absorption testing of civil aircraft landing gear equipped with oleo-pneumatic shock absorbers. The primary focus is for Part 25 aircraft, but differences for Part 23, 27, and 29 aircraft are provided where appropriate.&lt;/div&gt;
