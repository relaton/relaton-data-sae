  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These SAE Recommended Practices are intended for light- and heavy-duty vehicles used on or off road as well as appropriate stationary applications which use vehicle derived components (e.g., generator sets). Vehicles of interest include, but are not limited to: on and off highway trucks and their trailers, construction equipment, and agricultural equipment and implements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of these documents is to provide an open interconnect system for electronic systems. It is the intention of these documents to allow Electronic Control Units to communicate with each other by providing a standard architecture.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Network management in the SAE J1939 network is concerned with the management of source addresses and the association of those addresses with an actual function and with the detection and reporting of network related errors. Due to the nature of management of source addresses, network management also specifies initialization processes, requirements for reaction to brief power outages, and minimum requirements for ECUs on the network.&lt;/div&gt;&lt;/div&gt;</p>
