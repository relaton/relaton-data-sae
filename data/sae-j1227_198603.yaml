    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To describe laboratory methods for determining and reporting the contaminant level of the wetted portion of hydraulic fluid power components, parts, subsystems and systems, and of fill fluids. For each type of item it provides a method of obtaining the liquid sample and the contamination level thereof. It also includes procedures for establishing a sampling plan and guidelines for establishing levels of acceptace, but does not set those levels.&lt;/div&gt;
