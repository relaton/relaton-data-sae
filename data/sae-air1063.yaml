    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this HIR is to specify general oceanographic environments. Specific environmental requirements shall be specified in a detail specification. Specific requirements are in the state of constant flux because the ocean environment is constantly changing and the changes occur not only on a seasonal basis but also monthly, weekly, daily, and in some cases even hourly.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This HIR is to be used as a guide only.&lt;/div&gt;&lt;/div&gt;</p>
