  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the measurement of radio frequency radiated emissions and immunity. Each part details the requirements for a specific type of electromagnetic compatibility (EMC) test and the applicable frequency range of the test method.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The methods are applicable to a vehicle, boat, machine or device powered by an internal combustion engine or battery powered electric motor. Operation of all engines or motors (main and auxiliary) of a vehicle, boat, machine or device is included. All equipment normally operating when the vehicle, boat, machine or device is in operation is included. Operator controlled equipment is included or excluded as specified in the individual document parts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;As a special case, CISPR 12 applies to battery powered floor finishing equipment, but robot carpet sweepers are excluded. By reference, IEC CISPR 12 and CISPR 25 are adopted as the standards for the measurement of vehicle emissions. In the event that an amendment is made or a new edition is published, the new IEC document shall become part of this standard six months after the publication of the IEC document. SAE reserves the right to identify exceptions to the published IEC documents with the exceptions to be documented in SAE J551-2 and SAE J551-4, respectively. Also by reference, ISO 11451-2, ISO 11451-3 and ISO 11451-4 are adopted as standards for the measurement of vehicle immunity. In the event that an amendment is made or a new edition is published, the new ISO document shall become part of this standard six months after the publication of the ISO document. SAE reserves the right to identify exceptions to the published ISO documents with the exceptions to be documented in SAE J551-11, SAE J551-12 and SAE J551-13, respectively.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommended levels apply only to complete vehicles in their final manufactured form. Vehicle-mounted rectifiers used for charging in electric vehicles are included in this series of documents when operated in their charging mode.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Emissions from intentional radiators are not controlled by this document. (See applicable, appropriate regulatory documents.) The immunity of commercial mains powered equipment to over voltages and line transients is not covered by this document.&lt;/div&gt;&lt;/div&gt;</p>
