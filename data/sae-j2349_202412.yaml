  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes for trucks, buses, and multipurpose vehicles with GVW of 4500 kg (10 000 lb) or greater:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Minimum performance requirements for the switch for electrically or electro-pneumatically powered windshield wiping systems.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Uniform test procedures that include those tests that can be conducted on uniform test equipment by commercially available laboratory facilities.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedures and minimum performance requirements, outlined in this document are based on currently available engineering data.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is the intent that all portions of the document will be periodically reviewed and revised as additional data regarding windshield wiping system performance are developed.&lt;/div&gt;&lt;/div&gt;</p>
