  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) presents a recommended part numbering scheme for fluid system component parts, which may require complex standard numbers. Standardizing on certain numbering systems provides for numbering simplicity, ease of interchangeability and supersession (when required), standardization and limitation of usable codes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP has been coordinated in ISO/TC20/SC10 and its usage is recommended for commonality in international standard part numbering practices.&lt;/div&gt;
    &lt;/div&gt;</p>
