  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers complete general and dimensional specifications for 37 deg flared and flareless types of hydraulic tube fittings and the O-ring bosses and related components with which they assemble. These fittings are intended for general application in hydraulic systems on industrial equipment and commercial products.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The 37 deg flared tube fittings shall be as shown in &lt;span class="xref"&gt;Figs. 5&lt;/span&gt;-&lt;span class="xref"&gt;18&lt;/span&gt; and &lt;span class="xref"&gt;Tables 3&lt;/span&gt;-&lt;span class="xref"&gt;6&lt;/span&gt;. Since the basic design of these fittings is derived from Air Force and Navy Standards for 37 deg flared fittings which meet a performance specification, any future changes should not be detrimental to the design or performance. Dimensions for double and single 37 deg flares on tubing to be used with these fittings are given in Fig. 3 and Table 2 of SAE J533.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The flareless tube fittings shall be as shown in &lt;span class="xref"&gt;Figs. 19&lt;/span&gt;-&lt;span class="xref"&gt;32&lt;/span&gt; and &lt;span class="xref"&gt;Tables 7&lt;/span&gt;-&lt;span class="xref"&gt;10&lt;/span&gt;. The basic design of these fittings is derived from existing military standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Specifications for straight thread O-ring bosses into which connector and adjustable styles of hydraulic tube fittings assemble are given in &lt;span class="xref"&gt;Fig. 34&lt;/span&gt; and &lt;span class="xref"&gt;Table 12&lt;/span&gt;. O-ring boss plugs shall be as shown in &lt;span class="xref"&gt;Fig. 35&lt;/span&gt; and &lt;span class="xref"&gt;Table 13&lt;/span&gt;. Modification of hexagon chamfers on standard fittings when used in MS 33649 (or superseded AND 10050) type O-ring bosses is covered in &lt;span class="xref"&gt;Fig. 33&lt;/span&gt; and &lt;span class="xref"&gt;Table 11&lt;/span&gt;. For specifications of O-rings used in conjunction with these fittings, see SAE J515.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For guidance in the selection of steel tubing for any pressure using these fittings see SAE J1065—Pressure ratings for Hydraulic tubing and fittings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Also included are &lt;span class="xref"&gt;Tables 14&lt;/span&gt; to &lt;span class="xref"&gt;24&lt;/span&gt; and &lt;span class="xref"&gt;Figure 38&lt;/span&gt; and instructions which may be used for determining the overall lengths, leg lengths, and stock sizes applicable to special size combination fittings not covered in the standard dimensional tabulations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data contained in &lt;span class="xref"&gt;Tables 3&lt;/span&gt;-&lt;span class="xref"&gt;13&lt;/span&gt; with respect to all unspecified detail.&lt;/div&gt;&lt;/div&gt;</p>
