    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard is to be used as a supplement to either SAE AS7106 or SAE AS7107. This Standard is required for all suppliers seeking NADCAP General Quality Systems accreditation who have Material Review Board (MRB) authority. Suppliers seeking NADCAP General Quality Systems accreditation who are authorized by contract to conduct &lt;u&gt;final&lt;/u&gt; MRB decisions shall comply with all of the requirements contained herein.&lt;/div&gt;&lt;/div&gt;</p>
