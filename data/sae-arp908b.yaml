  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) is intended to establish recommended installation torque value limits and test criterion for machined flared and flareless hose and tube end fitting connections.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP is applicable to two types of connections and two basic material classifications.
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;u&gt;Type I&lt;/u&gt; - Flared to mate with MS33656, Style E&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;u&gt;Type II&lt;/u&gt; - Flareless to mate with MS33514, Style E&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;u&gt;Material I&lt;/u&gt; - Steel, CRES, and titanium fittings&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;u&gt;Material II&lt;/u&gt; - Aluminum fittings&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
