    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) documents the operating instructions, rules, policies, and practices of the Performance Review Institute (PRI), an affiliate of SAE.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Covered in this standard are the operations of NADCAP committees, headquarters and field personnel, requirements for ongoing relations with suppliers, and procedures for conducting audits, continuing surveillance and accreditation. Supporting SAE NADCAP Aerospace Standards provide supplier requirements for complying with each individual accreditation process.&lt;/div&gt;&lt;/div&gt;</p>
