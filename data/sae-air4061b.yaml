  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE Aerospace Information Report (AIR) 4061 provides best practice guidelines for the integration of Engine Health Management (EHM) system functions within aircraft systems to include both its main engine(s) and any Auxiliary Power Unit(s) (APU). This document provides an overview of some of the functions EHM typically integrates, offers some system variations encountered with different aircraft, and suggests general considerations involved with integration. It presents a sample EHM parameter coverage matrix to show the types of parameters with which a typical EHM system might interface, offers insight into signal and data processing and retrieval, and offers a view of typical EHM parameter requirements by function. Where practical, this document delineates between military and commercial practices.&lt;/div&gt;
    &lt;/div&gt;</p>
