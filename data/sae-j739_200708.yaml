  content: |-
    <p>This SAE Standard is intended for curved cutting edge sections used on graders as defined in SAE J870 and J1057. (See Figure 1 and Table 1.)  Hole conformation is further defined in SAE J740 and J1580.

    This document specifes hole placement along the length and width of the cutting edge and dimensions for cutting edge cross sections. See Table 1.</p>
