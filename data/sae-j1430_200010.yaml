abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard applies to off-highway dumpers and scrapers equipped with an auxiliary retarder.

    1.1  Purpose--To define test procedures for verifying that the machine will at least meet the manufacturer's published continuous retarding capability curve.

    To recommend a common format for reporting retardation performance.</p>
