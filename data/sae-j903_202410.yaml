  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes for passenger cars, light trucks, and multipurpose vehicles with GVW of 4500 kg (10000 pounds) or less:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Minimum performance standards for windshield wiper systems.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Test procedures that can be conducted on uniform test equipment by commercially available laboratory facilities.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Uniform terminology of windshield wiper system characteristics and phenomena consistent with those found in guides for the use of engineering layout studies to evaluate system performance.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Guides for the design and location of components of the systems for function, servicing of the system, etc.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedures and minimum performance standards outlined in this document are based on currently available engineering data. It is the intent that all portions of the document will be periodically reviewed and revised as additional data regarding windshield wiping system performance are developed.&lt;/div&gt;&lt;/div&gt;</p>
