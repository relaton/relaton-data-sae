  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice SAE J2847-2 establishes requirements and specifications for communication between PLUG-IN ELECTRIC VEHICLE (EVCC)s and the DC Off-board charger. Where relevant, this document notes, but does not formally specify, interactions between the vehicle and vehicle operator.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to the off-board DC charger for conductive charging, which supplies DC current to the RESS of the electric vehicle through a SAE J1772™ coupler. Communications will be on the J1772 Pilot line for PLC communication. The details of PLC communications are found in SAE J2931/4.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specification supports DC energy transfer via Forward Power Flow (FPF) from source to vehicle.&lt;/div&gt;
    &lt;/div&gt;</p>
