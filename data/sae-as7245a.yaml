  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers closely-wound helical coil, screw thread inserts made of a corrosion resistant steel formed wire with a chemical composition in accordance with &lt;span class="xref"&gt;Table 1&lt;/span&gt; and identified under the Unified Numbering System as UNS S30200 or UNS S30400 that can be formed by an insert manufacturer to achieve the requirements of this procurement specification. The inner surface of the insert coil, after assembly into a screw thread tapped hole, provides internal threads of standard 60° Unified form.&lt;/div&gt;&lt;/div&gt;</p>
