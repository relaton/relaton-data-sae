  content: |-
    <p>&lt;p&gt;Dieses Dokument wurde erstellt und veröffentlicht, um Informationen und Anleitungen zur Anwendung von AQAP-2110 zu geben, wenn der Auftragnehmer die Anforderungen der Norm 9100 erfüllt. Dieses Dokument wird als AQAP-2110-SRD.2 und IA9137 veröffentlicht. Es wurde zur Erleichterung der Anwendung und des Verständnisses der Beziehung zwischen AQAP-2110 und 9100 gemeinsam von Vertretern der NATO und der Industrie entwickelt. AQAPs können erforderlich sein, wenn eine beschaffende Nation Foreign Military Sales (FMS) als Beschaffungsmethode verwendet.&lt;/p&gt;


    &lt;p&gt;Es soll zu einer einheitlichen Auslegung der AQAP-2110-Anforderungen durch den Auftraggeber und seinen 9100-Auftragnehmer beitragen.&lt;/p&gt;


    &lt;p&gt;Sein Inhalt hat keinen rechtlichen oder vertraglichen Status und ersetzt, ergänzt oder hebt keine der Anforderungen von AQAP-2110 oder 9100 auf.&lt;/p&gt;


    &lt;p&gt;Aufgrund der Vielzahl von Bedingungen, die bestehen können (abhängig von Faktoren wie der Art der Arbeit oder des Prozesses, den verwendeten Geräten und den Fähigkeiten des beteiligten Personals), sollte dieser Leitfaden nicht als allumfassend betrachtet werden, noch sollte dieser als Vorgabe bestimmter Mittel oder Methoden zur Erfüllung der Vertragsanforderungen angesehen werden. Die Interessenvertreter sollten sich darüber im Klaren sein, dass diese Anforderungen auch mit anderen Mitteln oder Methoden erfüllt werden können.&lt;/p&gt;


    &lt;p&gt;Die Nutzer dieses Leitfadens sollten bedenken, dass die Anforderungen der AQAP 2110 für Auftragnehmer und Unterauftragnehmer obligatorisch sind, wenn diese im Vertrag genannt werden.&lt;/p&gt;</p>
