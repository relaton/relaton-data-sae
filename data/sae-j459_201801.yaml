  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The bearing performance of steel backed half bearings, bushings, and washers is dependent on the properties and thickness of the lining alloy, the strength and dimensional stability of the steel backing (usually SAE 1010) and the strength of the bond between the lining alloy and the backing. This SAE Information Report is primarily concerned with the properties of the lining alloys used in automotive applications, in particular, the crankshaft bearings of the internal combustion engine.&lt;/div&gt;&lt;/div&gt;</p>
