    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This concept for measuring worn splines provides a direct wear depth dimension by utilizing the unworn involute surface as a contact point from which to measure the depth of wear on the spline tooth at the pitch diameter. &lt;span class="xref"&gt;Fig. 1&lt;/span&gt; shows spline wear patterns and pitch diameter gaging points.&lt;/div&gt;&lt;/div&gt;</p>
