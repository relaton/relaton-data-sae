  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the specific requirements for 7075 aluminum alloy alclad one side plate and sheet; the general requirements are covered in AMS-QQ-A-250. The plate and sheet covered by this specification shall be an integral composite product consisting of a heat-treatable aluminum alloy (7075) core with a thin layer of an aluminum alloy (7072) anodic to the core bonded to one surface.&lt;/div&gt;&lt;/div&gt;</p>
