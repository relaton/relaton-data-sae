  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is broken into various categories for convenience and ease of identification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is the purpose of this document to provide certain criteria for the design and selection of stairways, for the boarding of passengers onto an aircraft. The criteria presented are limited to those factors which affect the safety of the passengers and are coordinated, where applicable, with the practices of the architectural profession, with respect to the design of stairways.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommended practices are applicable to both mobile variable-elevation type stairways and to fixed-elevation stairways of the type built into an aircraft fuselage.&lt;/div&gt;&lt;/div&gt;</p>
