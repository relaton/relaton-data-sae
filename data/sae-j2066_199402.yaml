  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes a common specification and ordering code for hydraulic filter assemblies and hydraulic filter elements, and establishes minimum performance criteria and test methods. This document establishes two filter diameter sizes, five basic micron ratings, and two basic collapse ratings. These classifications will satisfy most hydraulic filter applications, and thereby can minimize inventory requirements for hydraulic filter elements.&lt;/div&gt;&lt;/div&gt;</p>
