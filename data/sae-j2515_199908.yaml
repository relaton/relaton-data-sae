  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;A subcommittee within SAE ISTC Division 35 has written this report to provide automotive engineers and designers a basic understanding of the design considerations and high temperature material availability for exhaust manifold use. It is hoped that it will constitute a concise reference of the important characteristics of selected cast and wrought ferrous materials available for this application, as well as methods employed for manufacturing. The different types of manifolds used in current engine designs are discussed, along with their range of applicability. Finally, a general description of mechanical, chemical, and thermophysical properties of commonly-used alloys is provided, along with discussions on the importance of such properties.&lt;/div&gt;
    &lt;/div&gt;</p>
