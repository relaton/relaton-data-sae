  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines gland details for scrapers for rod diameters from 1/4 to 15-1/2 inch (6.35 to 393.70 mm) inclusive, corresponding to AS568 O-ring Dash No. sizes -108/-111, -206/-222, -325/-349, and -425/-460.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The gland details herein allow the use of more stable, efficient and reliable scraper devices than MS33675 glands.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Scraper configurations are not specified in this document.&lt;/div&gt;&lt;/div&gt;</p>
