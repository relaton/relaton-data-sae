  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The testing technique outlined in this SAE Recommended Practice was developed as part of an overall program for testing and evaluating fuel consumption of heavy-duty trucks and buses. The technique outlined in this recommended practice provides a general description of the type of equipment and facility which is necessary to determine the power consumption of these engine-driven components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is recommended that the specific operating conditions suggested be carefully reviewed on the basis of actual data obtained on the specific vehicle operation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Because of the variation in size, shape, configuration, and mountings available in cooling fans and fan drive systems, specific test devices have not been included.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Using known power/speed relationships for a given fan as developed by SAE J1339, Test Method for Measuring Power Consumption of Cooling Fans for Trucks and Buses, this procedure can be used to calculate the fan power requirements for truck and bus cooling systems using fixed-ratio, speed-modulating, and on-off fan drive control.&lt;/div&gt;&lt;/div&gt;</p>
