  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers specific requirements for several styles of hose and/or hose assemblies in systems on board commercial vessels inspected and certificated by the U.S. Coast Guard. It is intended that this standard establish hose constructions and performance levels that are essential to safe operations in the marine environment. Refer to SAE J1273 for selection, installation and maintenance of hose and hose assemblies.&lt;/div&gt;&lt;/div&gt;</p>
