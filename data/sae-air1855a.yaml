  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) includes all missile and launch vehicle actuation systems, including electrohydraulic, electropneumatic, and electromechanical types. The data for many systems are not complete. As more information becomes available, periodic updates will be issued to complete existing data sheets and to add new ones.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;An index by type of vehicle and by type of actuation system is included. The actual data sheets in the body of the report are organized in alphabetical order.&lt;/div&gt;
    &lt;/div&gt;</p>
