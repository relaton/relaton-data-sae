    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies test methods for fitting assemblies used in aircraft fluid systems in the pressure classes B, D, and E (1500 psi, 3000 psi, and 4000 psi), and in temperature Types I, II, and III (-65 to 160 °F, -65 to 275 °F, and -65 to 400 °F) of AS2001.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies each time that it is referred to in a procurement specification or other definition document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Fluids and materials used for the tests are listed in &lt;span class="xref"&gt;Section 2&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
