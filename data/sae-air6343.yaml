  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR is intended to provide a basic overview of methodologies that should be utilized when undertaking the design and development of rechargeable lithium battery systems for aerospace applications. The battery system includes the battery cells, monitoring and control electronics, and battery charger as applicable. The methodologies presented herein apply to “installed” equipment which would be part of the original or supplemental type certification or military airframe qualification.&lt;/div&gt;
    &lt;/div&gt;</p>
