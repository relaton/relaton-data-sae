abstract:
- language: en
  script: Latn
  content: "<p>This SAE standard recommends the use of ISO 19879 to perform various types of tests to evaluate functional performance requirements for carbon and steel alloy tube conductor assemblies for hydraulic fluid power applications made from both standard and non-standard metallic tubing and components. See the appropriate listed SAE or ISO tubing and connector standard for chemical, mechanical and dimensional requirements for standard tubing, end components and tube end joint configurations for the standard tube assemblies being tested. See SAE J1065 and ISO 10763 for listed nominal reference working pressures and/or reference formula that may be used to calculate referenceworking pressures for standard and non-standard metallic tube conductors.</p>"
