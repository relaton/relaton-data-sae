  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Information Report addresses the design and performance specifications for a generic buck to be used in full-scale vehicle to pedestrian tests conducted to evaluate pedestrian dummy performance. Specifically, the buck is designed to mimic the impact response of the front end of a sedan within the small family car class during a collision with a pedestrian. The goal is to develop a generic buck with simplified geometry and a limited number of components made of clearly defined and readily available engineering materials to facilitate fabrication and reproducibility. To ensure performance of the buck, it is specified that the buck mimics the maximum crush distance, absorbed energy, and maximum force corresponding to a sedan within the small family car class during a pedestrian impact. The design and performance specifications provided in this document focus on: (1) the design specifications describing the materials and geometry of the generic buck and (2) the specific certification tests that are required to ensure that any fabricated buck meets the necessary design specifications.&lt;/div&gt;
    &lt;/div&gt;</p>
