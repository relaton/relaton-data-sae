  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document discusses the work done by the U.S. Army Corps of Engineers and the Waterways Experiment Station (WES) in support of SAE A-5 Committee activity on Aerospace Landing Gear Systems. It is an example of how seemingly unrelated disciplines can be combined effectively for the eventual benefit of the overall aircraft system, where that system includes the total airfield environment in which the aircraft must operate.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In summary, this AIR documents the history of aircraft flotation analysis as it involves WES and the SAE.&lt;/div&gt;&lt;/div&gt;</p>
