abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers general and dimensional specifications for the Code 61 metric (Type 1) and inch (Type 2) flanged heads, flange clamps (FC and FCM), and split flange clamps (FCS and FCSM) applicable to four-screw flange type tube, pipe, and hose connections. Also included are the recommended port dimensions and port design considerations. Type 2 (inch) flange clamps and split flanges are not for new design.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The flanged heads specified are incorporated into fittings having suitable means for attachment of tubes, pipes, or hoses to provide connection ends. These connections are intended for application in hydraulic systems, on industrial and commercial products, where it is desired to avoid the use of threaded connections.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The rated working pressure of an assembly shall not exceed the least of all the component working pressure rated values.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data contained in the tables with respect to all unspecified detail. Parts manufactured to this standard are interchangeable with ISO 6162-1 and connectors to either standard can be supplied.&lt;/div&gt;&lt;/div&gt;</p>
