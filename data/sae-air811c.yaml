abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;The development and use of brakes with high temperature capabilities has resulted in instances of tire and wheel failures which were attributed to excessive brake heat. These instances have led to the establishment of more stringent wheel requirements and the addition of heat shields, safety devices, auxiliary cooling devices, brake temperature and low tire pressure indication systems.&lt;/p&gt;
    &lt;p&gt;This SAE Aerospace Information Report (AIR) has been prepared to assist those who are concerned with the removal, inspection, and disposition of magnesium and aluminum wheels which may have been subjected to excessive temperatures.&lt;/p&gt;</p>
