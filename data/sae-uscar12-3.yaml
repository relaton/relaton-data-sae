  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This document gives general guidelines to be used during the connector design stage. Various guidelines may not apply in all situations. Therefore, sound engineering judgment must be used in their application. Consider these guidelines as the basis for connector and wiring DFMEA’s. Items in this document are grouped by DFMEA functional requirements. Groups are as follows:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;A&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Electrical Continuity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;B&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Electrical Isolation/Sealing&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;C&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Device Assembly&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;D&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Harness Assembly&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;E&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Vehicle Assembly&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;F&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Materials&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;G&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Serviceability&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;H&lt;/span&gt;
