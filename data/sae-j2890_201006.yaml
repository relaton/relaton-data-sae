  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice defines a procedure, which will aid in assessing the contaminant wear characteristics of hydraulic components. This procedure utilizes a very high level of contaminant that permits an accelerated test to determine the wear effects of contamination in a relatively short period. This recommended practice utilizes the contamination sensitivity test circuit identified in SAE J2470.&lt;/div&gt;&lt;/div&gt;</p>
