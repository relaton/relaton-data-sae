    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to supply a uniform means of designating cast ferrous materials reported in SAE Standards and Recommended Practices. The system outlined in this report is intended to facilitate the addition of new, widely used casting materials and also the deletion of now obsolete grades.&lt;/div&gt;&lt;/div&gt;</p>
