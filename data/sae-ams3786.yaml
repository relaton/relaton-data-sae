    &lt;div class="htmlview paragraph"&gt;This specification covers a nitrile rubber (NBR) elastomer that can be used to manufacture product in the form of sheet, strip, tubing, extrusions, and molded shapes. For molded rings, compression seals, and molded-in-place gaskets for aeronautical and aerospace applications, use the AMS7289 specification.&lt;/div&gt;&lt;/div&gt;</p>
