  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard defines requirements for the identification, assessment, mitigation, and prevention of risk in the manufacturing process through the application of Process Flow Diagrams (PFDs), Process Failure Mode and Effects Analysis (PFMEA) and Control Plans throughout the life cycle of a product.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard aligns and collaborates with the requirements of AS9100, AS9102, AS9103, and AS9145.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements specified in this standard apply in conjunction with and are not alternative to contractual and applicable statutory and regulatory requirements. In case of conflict between the requirements of this standard and applicable statutory or regulatory requirements, the latter shall take precedence.&lt;/div&gt;&lt;/div&gt;</p>
