  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes the minimum construction and performance requirements for a 15 pole connector between towing vehicles and trailers, for trucks, trailers, and dollies, for 12 VDC nominal applications in conjunction with SAE J2742. The connector accommodates both power and ISO 11992-1 signal circuits along with dual ground wires to accommodate grounding requirements within the constraints of the SAE J2691 terminal capacity.&lt;/div&gt;&lt;/div&gt;</p>
