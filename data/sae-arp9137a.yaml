  content: "<p>&lt;p&gt;This document has been prepared and issued to provide information and guidance on the application of AQAP 2110 when the Supplier adheres to the provisions of 9100. This document is published as AQAP 2009 Annex F and 9137. It was jointly developed by NATO and industry representatives for use by NATO and industry to facilitate the use and understanding of the relationship between the AQAP 2110 and 9100.&lt;/p&gt;</p>"
