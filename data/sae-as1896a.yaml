  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the requirements for aircraft, hydraulic couplings, self-sealing one side only, for use in Type II hydraulic systems (-65 to +275 °F temperature range) as defined by MIL-H-5440. The purpose being to connect a hose or tube to a standard MS33656, MS33514 or MIL-F-85421, or MIL-F-85720 fitting and to provide the self-sealing feature on the hose or tube side of the connection.&lt;/div&gt;
    &lt;/div&gt;</p>
