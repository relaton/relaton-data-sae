  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended as the definition of a standard test, but may be subject to frequent change to keep pace with experience and technical advances. This should be kept in mind when considering its use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE No. 2 Friction Test Machine is used to evaluate the friction characteristics of automatic transmission plate clutches with automotive transmission fluids. It can also be used to conduct durability tests on wet friction systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specific purpose of this document is to define a 6000 r/min Stepped Power Test for the evaluation of wet friction system performance variation as a function of power level. This procedure uses an initial engagement speed of 6000 r/min and is intended as a standard procedure for common use by both suppliers and end users.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The only variables selected by the supplier or user of the friction system are:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Friction Material&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Fluid&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Reaction Plates&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These three variables must be clearly identified when reporting the results of using this test. If any of the test parameters or system hardware as described in this document are changed, other than the friction material, test fluid, or reaction plates, the data may not be reported as having been obtained using this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure is not intended to evaluate the initial coefficient or break-in characteristics. For this information, refer to SAE J2490 SAE No. 2 Friction Test Machine μPVT Test.&lt;/div&gt;&lt;/div&gt;</p>
