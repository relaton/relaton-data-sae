  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE RP provides a set of test methods and practices for the characterization of the properties of Li-battery separator.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test methods in this RP have been grouped into one of three categories:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Separator material parameters: Minimum set of separator properties to be measured.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Chemistry/customer-specific parameters: Properties that are dependent on the application, customer needs and/or requirements, manufacturing process, etc. This RP will include the current best practice methodologies for these tests, with an understanding that the best practice methodologies are evolving as more information is learned.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;R&amp;amp;D parameters: Properties that are dependent on the application, customer needs and/or requirements, manufacturing process, etc. The methodologies in this third section are under development and have not yet achieved broad application.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;It is not within the scope of this document to establish criteria for the test results, as this is usually established between the materials supplier and seperator manufacturer and the user. This is especially true where this document specifies a range of target values, or an open testing parameter. In these cases, the sample supplier and recipient must agree to specific numbers for the test parameters.&lt;/div&gt;&lt;/div&gt;</p>
