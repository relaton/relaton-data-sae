  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the design requirements and test procedures for separable beam seal fittings which includes end fittings (see &lt;span class="xref"&gt;6.10.3&lt;/span&gt;), fitting bodies (see &lt;span class="xref"&gt;6.10.6&lt;/span&gt;), and boss fittings (see &lt;span class="xref"&gt;6.10.1&lt;/span&gt;) for use in aerospace fluid systems. Design requirements are for class 3000 in corrosion resistant steel (CRES) only and for class 4000 in titanium alloy (Ti) only. Definition of fittings and related terms are defined in &lt;span class="xref"&gt;6.10&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
