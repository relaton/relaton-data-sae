    &lt;div class="htmlview paragraph"&gt;NOTE—For leaf springs made to metric units, see SAE J1123.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard is limited to concise specifications promoting an adequate understanding between spring maker and spring user on all practical requirements in the finished spring. The basic concepts for the spring design and for many of the details have been fully addressed in HS-J788, SAE Information Report, Manual on Design and Application of Leaf Springs, which is available from SAE Headquarters.&lt;/div&gt;&lt;/div&gt;</p>
