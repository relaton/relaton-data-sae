  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines recommended planning and substantiation procedures and associated reviewing and approval processes to confirm that proposed changes do not compromise the demonstrated safety of the originally certified aircraft, and performance and aircraft compatibility are appropriately addressed in aircraft documentation. Successful demonstration also requires that failure modes be identified and mitigation provided for each.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These procedures apply to modifications made by the original component or assembly supplier as well as approval of an alternate supplier.&lt;/div&gt;
    &lt;/div&gt;</p>
