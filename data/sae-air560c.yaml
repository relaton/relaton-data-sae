  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Missile pumps are categorized by a moderate testing life and a relatively short operational service life. Generally, the pumps are operated at higher speeds, temperatures, and pressures than those used in manned aircraft systems, yet reliability must be extremely high, since there rarely is a redundant system aboard the missile. Due to the short but critical life and performance requirements, development, reliability and acceptance testing should be focussed on eliminating infant mortality failures.&lt;/div&gt;&lt;/div&gt;</p>
