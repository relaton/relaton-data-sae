    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a screening procedure for evaluating the susceptibility of plastics to environmental stress cracking by testing their resistance to pure solvents or their mixtures. This method can be used to evaluate effect of complex chemical mixtures with unknown or suspect components, which may be encountered in the polymer's environment.&lt;/div&gt;&lt;/div&gt;</p>
