  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE J526 Standard covers electric-resistance welded single-wall low-carbon steel pressure tubing intended for general automotive, refrigeration, hydraulic, and other similar applications requiring tubing of a quality suitable for bending, flaring, beading, forming, and brazing. Material produced to this specification is not intended to be used for single flare applications due to the potential leak path that would be caused by the ID weld bead or scarfed region. Assumption of risks when using this material for single flare applications shall be defined by agreement between the producer and tube purchaser. The material produced to this specification is intended to service pressure applications where severe forming and bending is not required. As this material may exhibit mechanical properties that reduce some desired forming characteristics versus SAE J356, the severity of the forming requirements of the finished assembly should be considered when utilizing material produced to this specification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In an effort to standardize within a global marketplace and ensure that companies can remain competitive in an international market, it is the intent to convert to metric tube sizes, which will:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Lead to one global system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Guide users to preferred system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Reduce complexity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Eliminate inventory duplications&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
