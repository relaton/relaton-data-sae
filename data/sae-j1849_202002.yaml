  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides laboratory test procedures, requirements, and guidelines for electronic siren systems with a single loudspeaker, and electromechanical sirens for use on authorized emergency vehicles, which call for the right-of-way. Test procedures and performance requirements for individual system components are not included in this version. Results obtained for a siren system with a speaker array that is greater than 0.5 m in any dimension shall apply to the system only when the array is in the same spatial configuration as tested (i.e., the same speaker separation and orientation).&lt;/div&gt;&lt;/div&gt;</p>
