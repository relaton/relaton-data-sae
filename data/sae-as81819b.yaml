  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the requirements for spherical, self-aligning, self-lubricating bearings that are for use in the ambient temperature range of -65 to +160 °F (-54 to +71 °C) at high cyclic speeds. The scope of the standard is to provide a liner system qualification procedure for helicopter sliding bearings defined and controlled by source control drawings. Once a liner system is qualified, the source controlled bearings may be further tested under application conditions.&lt;/div&gt;&lt;/div&gt;</p>
