  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Counterfeiting of refrigerants has seen a dramatic rise over the past two decades. This rise can be partially attributed to global restrictions placed on production and use of refrigerants by the 1987 Montreal and the 1997 Kyoto Protocols (1, 2). These Protocols regulate the gradual phase-out and strict regulations on the use of refrigerants with high Ozone Depletion Potential (ODP) and high Global Warming Potential (GWP). These protocols require that older refrigerants shall be replaced with newer, more expensive, and environmentally friendly chemicals (3, 4) and necessitates redesigned or replaced equipment to operate efficiently with these new refrigerants.&lt;/div&gt;&lt;/div&gt;</p>
