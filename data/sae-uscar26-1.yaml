  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test procedure is intended to evaluate and/or validate electrical ground schemes for use on the body or chassis. There are two classes based on the expected environmental conditions. &lt;b&gt;Exposed&lt;/b&gt; Grounds can be located anywhere in the vehicle (except on the powertrain) and is the class for which most schemes should be tested. &lt;b&gt;Unexposed&lt;/b&gt; Grounds can only be used in the passenger compartment or trunk and as such are special cases.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure as written is not intended for testing powertrain grounds where high temperatures and vibration levels may be encountered. These situations may require modifications to this procedure and are left to the Responsible Engineer to determine.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification does not specifically address validation of terminal to wire electrical crimps. Crimps are tested to SAE/USCAR-21&lt;/div&gt;&lt;/div&gt;</p>
