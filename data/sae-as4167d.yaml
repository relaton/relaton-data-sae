  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers 6-point and 12-point flare nut crowfoot, flare nut wrenches, double end flare nut wrenches, combination box end and flare nut wrenches, combination open end and flare nut wrenches, and ratcheting flare nut wrenches that are designed with the following requirements: (a) non-distorting usage; (b) possessing the strength, clearances, and internal wrenching design to be used on hydraulic tube fittings that conform to the requirements of SAE J514 and ISO 8434-2; and (c) transmitting torque to tube fittings without bearing on the apex of fitting wrenching points. Inclusion of dimensional data in this document is not intended to imply that all of the products described herein are stock production sizes. Consumers are requested to consult with manufacturers concerning lists of stock production sizes.&lt;/div&gt;
    &lt;/div&gt;</p>
