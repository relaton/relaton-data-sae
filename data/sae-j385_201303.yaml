    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice specifies performance requirements for the strength of seat belt anchorages attached to vehicle structure or to the seat assemblies as installed in the motor vehicle. (This document supersedes the Performance Requirements Section of SAE J787b.) Design recommendations and test procedures are specified in SAE J383 and SAE J384, respectively.&lt;/div&gt;&lt;/div&gt;</p>
