  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) reviews the precautions that must be taken and the corrections which must be evaluated and applied if the experimental error in measuring the temperature of a hot gas stream with a thermocouple is to be kept to a practicable minimum. Discussions will focus on Type K thermocouples, as defined in National Institute of Standards and Technology (NIST) Monograph 175 as Type K, nickel-chromium (Kp) alloy versus nickel-aluminium (Kn) alloy (or nickel-silicon alloy) thermocouples. However, the majority of the content is relevant to any thermocouple type used in gas turbine applications.&lt;/div&gt;
    &lt;/div&gt;</p>
