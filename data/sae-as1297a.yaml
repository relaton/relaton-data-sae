  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The complete specification for a pneumatic pressure reducer for high pressure pneumatic systems used in missiles comprises: (1) this standard, which includes many of the general performance requirements, (2) a detailed procurement specification describing envelope and operating conditions, and (3) the "Pneumatic Components, Aeronautical - General Specification For - MIL-P-8564" which covers general requirements common to all components for use in high pressure pneumatic systems.&lt;/div&gt;&lt;/div&gt;</p>
