    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers power transfer units (PTUs) used in passenger car and sport utility vehicles to support all wheel drive (AWD) operation. PTUs are typically full-time use geared devices (see &lt;span class="xref"&gt;3.1&lt;/span&gt;). Some PTUs have additional features such as part-time on-demand capability via electronically actuated disconnect features, and other configurations are possible.&lt;/div&gt;
    &lt;/div&gt;</p>
