abstract:
- language: en
  script: Latn
  content: <p>This specification covers established metric manufacturing tolerances
    applicable to carbon steel sheet, strip, and plate ordered to metric dimensions.
    These tolerances apply to all conditions unless otherwise noted. The term "excl"
    is used to apply only to the higher figure of the specified range. Tolerances
    for product sizes not listed herein shall be as agreed upon by purchaser and vendor.</p>
