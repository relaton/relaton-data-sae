  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers the requirements for a combined Mobile Digital Infrared Pavement Surface, Ambient Air, and Dew Point Temperature Sensing System (referred to as the system). The system monitors real-time surface, air and dew point temperatures of airfield pavement areas to ensure safe winter ground operations of aircraft and other vehicles. The vehicle mounted electronic system provides the operator with real-time readings of surface, air and dew point temperatures of airfield pavement areas including runways, taxiways, ramps, bridges, vehicular roadways, parking garages and parking lots. The electronic system shall be available with or without the dew point sensing option.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This electronic system can be utilized as a stand alone system at small airports, or may be used to augment airport operations that currently have a Stationary Runway Weather Information System (reference ARP5533). Because the electronic system is mobile, it can be utilized to measure pavement temperatures at locations where an in-pavement sensor or weather station is not located.&lt;/div&gt;&lt;/div&gt;</p>
