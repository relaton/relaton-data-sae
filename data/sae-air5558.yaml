  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this report is to provide information on the results of ultra violet (UV) laser marking and mark contrast measurement of a wide range of aerospace wire and cable constructions, the specifications for most of which do not state specific requirements for laser markability. The contents of this document are for information and guidance only. It is not intended that it be used as the basis for marking process specifications or standards, which are covered by AS5649 Wire and Cable Marking Process, UV Laser.&lt;/div&gt;&lt;/div&gt;</p>
