  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides information on the current practices used by commercial and military operators in regards to hard landings (or overload events designated as hard landings). Since detailed information on inspections would be aircraft specific, this AIR provides only a general framework. Detailed information and procedures are available in the maintenance manuals for specific aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Because hard landings potentially affect the entire aircraft, guidelines are listed here for non-landing gear areas. But, the primary focus of the document is the landing gear and related systems. The document may be considered to be applicable to all types of aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does NOT provide recommended practices for hard landing inspections, nor does it provide recommendations on the disposition of damaged equipment. Refer to ARP 4915 and ARP 5600. Also, this document does not necessarily address overloads from circumstances other than landings, such as from tow vehicles, runway bumps, traversing cables, etc.&lt;/div&gt;&lt;/div&gt;</p>
