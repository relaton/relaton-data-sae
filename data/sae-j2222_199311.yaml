    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Draft Technical Report covers the minimum performance and endurance requirements for coiled electrical cables to connect a tractor and trailer and/or trailer to trailer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this Draft Technical Report is to give the technical community the opportunity to review, comment on, and use the Draft Technical Report prior to its final approval by SAE. This document shall have a life span of no more than three years from approval which may not be renewed.&lt;/div&gt;
