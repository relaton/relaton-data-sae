abstract:
- language: en
  script: Latn
  content: "<p>Conventional Representation provides established drafting practice
    \ for showing various common part elements which are a compromise between complete
    pictorial representation and complete symbolization. The use of conventional representation
    materially reduces drafting time and thus  increases drafting economy without
    impairing the clarity of the drawing.</p>"
