    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers transfer cases used in passenger car and light truck applications. Transfer cases are of the chain, geared, manually and electronically shifted types although other configurations are possible. The operating points (speeds, temperatures, etc.) were chosen to mirror those of the United States Environmental Protection Agency Vehicle Chassis Dynamometer Driving Schedules (DDS).&lt;/div&gt;
    &lt;/div&gt;</p>
