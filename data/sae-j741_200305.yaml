abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard specifies a procedure for approximating the volume
    of typical materials contained in the bowl of Open Bowl scrapers as defined in
    SAE J728 and SAE J1057.  The volumes are based on the inside dimensions of the
    bowl and representative volumes on top of the bowl.  This rating method is intended
    to provide a consistent means of comparing capacities; it is not intended to define
    actual capacities that might be observed in any specific application.</p>"
