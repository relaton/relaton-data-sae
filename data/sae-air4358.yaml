    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) considers the origin of cornering forces generated by tilted, free-swiveling nose gears; the effect of various landing gear parameters on the measured cornering forces; and a method of towing aircraft to measure the resulting steering forces.&lt;/div&gt;&lt;/div&gt;</p>
