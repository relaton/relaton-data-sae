  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;Included herein are complete general and dimensional data for the various types of square and hex nuts recognized as SAE Standard and commonly used in automotive and other ground based motor vehicles and industrial equipment. Also included are appendixes covering wrench openings for nuts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The inclusion of dimensional data in this standard is not intended to imply that all of the products described are stock production sizes. Users are requested to consult with manufacturers concerning lists of stock production sizes.&lt;/div&gt;&lt;/div&gt;</p>
