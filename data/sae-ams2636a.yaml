  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers procedures for ultrasonic immersion inspection of premium grade wrought titanium and titanium alloy forgings. Premium grade is a term used to describe titanium alloys used for critical rotating components in turbine engines. For details, see SAE AMS2380, the specification that covers the procedures for approval of products of premium-quality titanium alloys and the controls to be exercised in producing such products.&lt;/div&gt;&lt;/div&gt;</p>
