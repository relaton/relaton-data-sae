  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice provides guidelines for the establishment of an induction hardening process for steel components. It is intended to be used as a guide for designers of induction hardened parts, for process auditors, and for purchase specifications and/or process sheets as applicable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Induction heat treatment is intended for hardening of only selected areas of plain carbon or alloy steel components. A prior heat treatment may be specified for improved response of the overall component to induction hardening, or for control of properties in the balance of the part. AMS 2759 is recommended for such prior heat treatment.&lt;/div&gt;&lt;/div&gt;</p>
