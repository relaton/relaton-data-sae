  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidelines for the standardization of safe operating procedures to be used in performing services and maintenance at designated deicing facilities (DDFs), comprising both central deicing facilities (CDFs) and remote deicing facilities. These procedures are necessary for the proper deicing/anti-icing of aircraft on the ground and performance of associated checks in accordance with the various approved ground icing programs, while considering applicable local environmental, operational, and economic requirements. This document should be used by operators, regulators, and airport authorities to develop and standardize approvals and permits for the establishment and operation of a DDF.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The coordination of stakeholders is required prior to the approval of design plans for a deicing facility.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Operating procedures shall be agreed to, in writing, by all air operators, airport authorities, regulators, and service providers prior to commencing deicing operations.&lt;/div&gt;&lt;/div&gt;</p>
