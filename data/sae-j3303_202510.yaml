  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Prescribe test conditions to quantify the effectiveness of containment devices for containing thermal runaway hazards of lithium/lithium-ion cells, batteries, and equipment during storage resulting from the failure of a cell within the container. Due to the many storage locations (indoors, outdoors, etc.), the hazards shall be classified individually to allow for varying performance based on a given storage location.&lt;/div&gt;&lt;/div&gt;</p>
