  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines a physical layer having a robust immunity to EMI and physical properties suitable for harsh environments. This document is suitable for CAN interfaces applying CAN HS (high-speed) transceivers as specified in ISO 11898-2.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These SAE Recommended Practices are intended for light- and heavy-duty vehicles on- or off-road, as well as appropriate stationary applications which use vehicle derived components (e.g., generator sets). Vehicles of interest include, but are not limited to, on- and off-highway trucks and their trailers, construction equipment, and agricultural equipment and implements.&lt;/div&gt;&lt;/div&gt;</p>
