    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) sets forth criteria for the selection, inspection, retread and repair of worn civil aircraft tires, and the means to verify that the retreaded tire is suitable for continued service. This document is applicable to both bias ply and radial aircraft tires qualified subsequent to the adoption of this document.&lt;/div&gt;
