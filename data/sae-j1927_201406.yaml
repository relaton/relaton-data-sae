  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report is intended to provide the hydraulic system analyst with a procedure which will assist in the selection and use of high-pressure wire reinforced hydraulic hose assemblies. Many construction, agricultural, industrial, or commercial equipment systems utilize hydraulic hose assemblies that are subjected to irregular cyclic pressure variations (cannot be approximated by a constant amplitude pressure cycle). This document relates damage done by pressure cycles with the pressure-life performance curve for the hose assembly being evaluated, using a linear damage rule to predict fatigue life similar to that used for predicting metal fatigue life. More detailed information on the subject may be found in SAE Paper No. 880713. The accuracy of cumulative damage calculations is directly related to proper measurement of the service pressure history and pressure-life performance for the hose assembly being evaluated. Final selection of a hose assembly must also consider installation and maintenance as noted in SAE J1273.&lt;/div&gt;
    &lt;/div&gt;</p>
