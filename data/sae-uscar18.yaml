  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is a supplement to ISO document TC 22/WG 5 N44 and is intended to give recommended usages for one and two way connectors and dimensional requirements for 2-way connectors which are not currently specified by ISO. The radio frequency (RF) connector interface specified herein is suited for unsealed automobile applications up to 3 GHz and is intended for in-line, board mount, device mount, straight or angled applications. Dimensional requirements are specified in this document to ensure interchangeability. Performance requirements are specified in SAE/USCAR-2, and in SAE/USCAR-17.&lt;/div&gt;&lt;/div&gt;</p>
