  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers the minimum requirements for nonmetallic tubing as manufactured for use in air brake systems. Non-reinforced products are designated type &lt;i&gt;A&lt;/i&gt; and reinforced products type &lt;i&gt;B&lt;/i&gt;. It is not intended to cover tubing for any portion of the system which operates below -40° F (-40° C), above +200° F (+93°C), above a maximum working gage pressure of 150 psi (1030 KPa), or in an area subject to attack by battery acid. This tubing is intended for use in the brake system for connections which maintain a basically fixed relationship between components during vehicle operation. &lt;i&gt;Coiled tube assemblies&lt;/i&gt; required for those installations where flexing occurs are covered by this standard and SAE J1131 to the extent of setting minimum requirements on the essentially straight tube and tube fitting connections which are used in the construction of such assemblies.&lt;span class="xref"&gt;&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;</p>
