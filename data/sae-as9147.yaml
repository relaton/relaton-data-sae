abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is applicable to all items used for manufacturing, maintenance, and repair of aviation, space, and defense products from the raw material to the final product (e.g., aircraft, structural items, constituent assemblies, standard parts, consumables with conformity and/or safety impact).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard considers items dispositioned as scrap in accordance with 9100-series standards’ supporting nonconformity management, corrective action, or organization decisions (e.g., obsolescence, inventory management, missing traceability documentation).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements specified in this standard are complementary (not alternative) to contractual and applicable statutory and regulatory requirements. Should there be a conflict between the requirements of this standard and applicable statutory or regulatory requirements, the applicable statutory or regulatory requirements take precedence.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard defines requirements and actions to be taken after the disposition decision to control the unsalvageable items within the organization and its external providers.&lt;/div&gt;
    &lt;/div&gt;</p>
