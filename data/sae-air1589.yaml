  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR examines only those incidents which were caused by ground support equipment used for aircraft handling and servicing and for line maintenance. It does not include damage that occurred during heavy maintenance or overhaul activity, taxi incidents or accidents where an aircraft under tow collided with a piece of GSE.&lt;/div&gt;&lt;/div&gt;</p>
