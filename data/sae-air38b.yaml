  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To establish design recommendations that will provide a basis for safe and reliable connections to threaded screw- or stud-type electrical equipment terminations. These recommendations are directed primarily, but not solely, to the aerospace and ground support equipment industries.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Since individual design criteria may alter the details as outlined, it is therefore important that this Aerospace Information Report (AIR) not be considered mandatory, but be used only as a design guide.&lt;/div&gt;&lt;/div&gt;</p>
