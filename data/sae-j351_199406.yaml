    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the physical and chemical requirements of oil-tempered carbon-steel valve spring quality wire used for the manufacture of engine valve springs and other springs requiring high-fatigue properties. This document also covers the basic processing requirements of springs fabricated from this wire.&lt;/div&gt;&lt;/div&gt;</p>
