abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following off-highway machines commonly used in earthmoving, construction, logging, and mining applications are included (pneumatic-tired agricultural machines and machines whose use is predominantly, or entirely, in manufacturing plants and/or warehouses are specifically excluded):&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Crawler tractors and crawler loaders of mass greater than 700 kg (1543 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Graders of mass greater than 700 kg (1543 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(c)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wheel loaders, and wheel tractors, and their modifications used for rolling and compacting, and wheel log skidders of mass greater than 700 kg (1543 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(d)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The tractor portion of semi-mounted scrapers, dumpers, water wagons, bottom dump wagons, rear dump wagons and towed fifth wheel attachments of mass greater than 700 kg (1543 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(e)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Dumpers with full-mounted bodies of mass greater than 700 kg (1543 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(f)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Skid-steer loaders of mass greater than 700 kg (1543 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(g)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Wheel loaders and wheel tractors equipped with dozers of mass greater than 700 kg (1543 lb).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(h)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Rollers and compactors of mass greater than 2700 kg (5952 lb).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
