  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes test procedures and performance requirements for stop lamp switches intended for use in an AC or a DC circuit on motorcycles. In service use may impose specific conditions on the switch which can affect its functional life. Those conditions should be replicated, as necessary, during the testing described in this document to ensure the adequate functioning of the device.&lt;/div&gt;&lt;/div&gt;</p>
