abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This report specifies the minimum requirements for the Road Geometry and Attributes (RGA) data set (DS) to support road geometry related motor vehicle safety applications. Contained in this report are a concept of operations, requirements, and design, developed using a detailed systems engineering process. Utilizing the requirements, the RGA DS is defined, which includes the DS Abstract Syntax Notation One (ASN.1) format, data frames, and data element definitions.&lt;/p&gt;


    &lt;p&gt;The requirements are intended to enable the exchange of the messages and their DS information to provide the desired interoperability and data integrity to support the applications considered within this report, as well as other applications which may be able to utilize the DS information. System requirements beyond this are outside the scope of this report.&lt;/p&gt;


    &lt;p&gt;NOTE: Unless otherwise marked as Informative, all material in this report is to be considered normative.&lt;/p&gt;</p>
