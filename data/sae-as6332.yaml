  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the general requirements for the quality management of aircraft ground deicing/anti-icing systems and processes. It covers the areas of:
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Quality system, documentation and control of records;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Management responsibility;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Resource management;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Product realization; and&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Measurement, analysis and improvement.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document defines these areas and their key aspects so they can be practically managed, and that deicing operations can become safer with time. In alignment with AS6285 and AS6286, the primary focus of this standard is on the deicing/anti-icing of aircraft using deicing and anti-icing fluids.&lt;/div&gt;&lt;/div&gt;</p>
