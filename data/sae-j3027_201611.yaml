  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the testing procedures required to evaluate the integrity of a ground ambulance-based patient litter, litter retention system, and patient restraint when exposed to a frontal, side or rear impact. Its purpose is to provide litter manufacturers, ambulance builders, and end-users with testing procedures and, where appropriate, acceptance criteria that, to a great extent ensures the patient litter, litter retention system, and patient restraint utilizes a similar dynamic performance test methodology to that which is applied to other vehicle seating and occupant restraint systems. Descriptions of the test set-up, test instrumentation, photographic/video coverage, test fixture, and performance metrics are included.&lt;/div&gt;&lt;/div&gt;</p>
