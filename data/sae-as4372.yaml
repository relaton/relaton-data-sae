  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the requirements for insulated, single-conductor, electric wires with tin-coated, silver-coated, or nickel-coated conductors of copper or copper alloy as specified in the applicable performance sheet (see &lt;span class="xref"&gt;Appendix A&lt;/span&gt; for sample). It provides general performance requirements, ratings, and information for various characteristics of insulated wire systems used in aerospace applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Wire will be assigned a level of performance for many requirements set forth in this standard. These performance levels, in addition to numerical test results, shall be listed in the applicable performance sheet. These test methods contain some new tests that have not been rigorously confirmed as reproducible. Such new methods are identified under the Precision and Bias Statements in the individual Test Methods. Many requirements have multiple levels of performance. The wire with base level of performance is acceptable for general use; however, there may be special applications that will require wire with higher performance levels.&lt;/div&gt;&lt;/div&gt;</p>
