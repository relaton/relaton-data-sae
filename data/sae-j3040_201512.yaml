abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The special risks associated with conducting crash tests on E-Vehicles can be divided into two main categories; 1) thermal activity inside the battery (resulting from electrical or mechanical abuse) may lead to energetic emission of harmful and/or flammable gases, thermal runaway, and potentially fire, and 2) the risk of electrocution. Procedures to ensure protection from all types of risk must be integrated into the entire crash test process. This informational report is intended to provide guidance in this endeavor using current best practices at the time of this publication. As both battery technology and battery management system technology is in a phase of expansion, the contents of this report must then be gaged against current technology of the time, and updated periodically to retain its applicability and usefulness.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide an understanding of the risks and an overview of the techniques established to reduce the likelihood that an event would cause harm to laboratory personnel and/or property. A laboratory considering E-Vehicle crash testing should work closely with the E-Vehicle manufacturer to identify and understand the risks associated with shipping and handling of their vehicle (pre and post-crash), storage of the vehicle (pre and post-crash), battery system diagnostics procedures, and operation of the vehicle.&lt;/div&gt;&lt;/div&gt;</p>
