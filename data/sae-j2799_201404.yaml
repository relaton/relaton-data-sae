  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard specifies the communications hardware and software requirements for fueling Hydrogen Surface Vehicles (HSV), such as fuel cell vehicles, but may also be used where appropriate, with heavy duty vehicles (e.g., busses) and industrial trucks (e.g., forklifts) with compressed hydrogen storage. It contains a description of the communications hardware and communications protocol that may be used to refuel the HSV. The intent of this standard is to enable harmonized development and implementation of the hydrogen fueling interfaces.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard is intended to be used in conjunction with the hydrogen fueling protocol, SAE J2601, Compressed Hydrogen Light Duty Vehicle Fueling Protocol and SAE J2600, Compressed Hydrogen Surface Vehicle Fueling Connection Devices.&lt;/div&gt;
    &lt;/div&gt;</p>
