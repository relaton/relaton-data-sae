abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a test method for determination of heavy truck (Class VI, VII, and VIII) tire force and moment properties under free-rolling cornering conditions. The steady-state properties are acquired as functions of slip angle and normal force, which are changed incrementally using a sequence specified in this document. The data are suitable for use in vehicle dynamics modeling, comparative evaluations for research and development purposes, and manufacturing quality control.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document addresses two principal topics; a) the description of a hypothetical “Ideal Machine,” and b) a standard directly applicable to testing practices currently common to the industry. The references to the “Ideal Machine” are meant to provide a roadmap for the testing machine manufacturer, providing direction and goals for the next generation of testing capabilities. The ranges of parameters for the “Ideal Machine,” including those in &lt;span class="xref"&gt;Tables 2&lt;/span&gt; and &lt;span class="xref"&gt;3&lt;/span&gt;, are intended to represent minimal requirements to meet the &lt;i&gt;full and complete&lt;/i&gt; data needs of the industry. The remaining documentation provides practical guidelines for the test engineer to ensure the integrity of data generated using current and conventional means.&lt;/div&gt;


    &lt;/div&gt;</p>
