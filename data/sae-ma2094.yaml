    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies test methods for fitting assemblies used in aircraft fluid systems in the pressure classes B, D, and E, and in temperature Types I, II, and III of MA 2001.&lt;/div&gt;
