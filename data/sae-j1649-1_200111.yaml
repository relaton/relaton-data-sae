abstract:
- language: en
  script: Latn
  content: "<p>This part of SAE J1649/1 specifies quality classes of industrial compressed air for general use (e.g. for workshops, the construction industry, pneumatic transport, etc.) without consideration of the quality of the air when it is discharged from the compressor. The quality class of compressed air for a particular application has to be based on the  mean value of several measurements carried out over a specific period of time and under defined operating conditions.</p>"
