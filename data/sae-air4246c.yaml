  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document discusses descriptions of fluid contamination products. These contaminants are used for design evaluation and formal component qualification/certification testing. Such tests are routinely performed on candidate aircraft engine fuel and pneumatic system components. Typical of these components are fuel pumps, fuel filters, fuel controls, pressurizing valves, flow dividers, selector valves, and combustor nozzles. The purpose of this document is to recommend standard descriptions to be used by specification writers.&lt;/div&gt;&lt;/div&gt;</p>
