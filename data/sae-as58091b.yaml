  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The primary function of this specification is to cover the general requirements of one-, two-, and three-phase (often referred to as poles) trip-free circuit breakers for use in aircraft electric systems conforming to MIL-STD-704. As a secondary function, this specification may possibly cover the general requirements of one-, two- and three-phase circuit breakers for use in primary vehicles, other than aircraft, when mounted directly to the structure.&lt;/div&gt;&lt;/div&gt;</p>
