    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) is to be used to supplement AS7116. In addition to the requirements contained in AS7116, the requirements contained herein shall apply to suppliers seeking NADCAP accreditation for electrical discharge machining (EDM). The EDM requirements contained herein address the wire, sinker and fast hole EDM process methods.&lt;/div&gt;&lt;/div&gt;</p>
