  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Under U.S. GHG and CAFE regulations, manufacturers are required to perform confirmatory testing to validate indirect air conditioning credits (refer to 40 CFR 86.1868-12). The purpose of this SAE Recommended Practice is to provide manufacturers with updated criteria for the 2020 and later model years. This SAE Recommended Practice is also suitable for reporting credit using and Engineering Analysis to the California Air Resources Board (CARB).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the work done by the IMAC GHG CRP to develop test procedures, publish SAE Standards, and determine performance requirements to demonstrate the performance of A/C technologies from the pre-approved credit menu meeting regulatory requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Also, enclosed in this SAE Recommended Practice are instructions that can be used by vehicle manufacturers in establishing an engineering analysis in lieu of performing the AC17 test on a vehicle which does not incorporate the credit-generating technologies. These procedures for performing an engineering analysis should be sufficient to satisfy the requirements of the regulation to earn credits for indirect A/C technologies from the pre-approved credit menu.&lt;/div&gt;&lt;/div&gt;</p>
