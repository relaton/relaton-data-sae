  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers requirements for a rotary plow with carrier vehicle primarily used to cast heavy concentrations of snow away from airport operational areas such as runways and taxiways. The term carrier vehicle represents the various self-propelled prime movers that provide the power necessary to move snow and ice control equipment during winter operations.&lt;/div&gt;&lt;/div&gt;</p>
