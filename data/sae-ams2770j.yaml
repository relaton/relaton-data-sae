abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification specifies the engineering requirements for heat treatment, by part fabricators (users) or their vendors or subcontractors, of parts (See 8.8.1). It also covers heat treatment by warehouses or distributors converting raw material from one temper to another temper (See 1.3 and 8.5). It covers the following aluminum alloys:

    1100, 2004, 2014, 2017, 2024, 2098, 2117, 2124, 2219, 2224, 3003, 5052, 6013, 6061, 6063, 6066, 6951, 7049, 7050, 7075, 7149, 7178, 7249, 7475</p>
