  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is intended for discrete and integrated digital, wavelength division multiplexing (WDM), and analog/radio frequency (RF) photonic components developed for eventual transition to aerospace platforms. The document provides the reasons for verification of photonic device life test and packaging durability. The document focuses on pre-qualification activity at the optical component level to achieve TRL 6. The recommended tests in this document are intended to excite typical failure mechanisms encountered with photonic devices in an aerospace operating environment, and to build confidence that a technology is qualifiable during a program’s engineering and manufacturing development phase.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This recommended practice is targeting components to support electrical-to-optical, optical-to-electrical, or optical-to-optical functionality. Passive optical waveguide, fiber optic cable, and connector components that are integral to a photonic package are included. Component and photonic package radiation tolerance requirements are not within the scope of this recommended practice.&lt;/div&gt;&lt;/div&gt;</p>
