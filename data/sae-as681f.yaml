  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) provides a method for the presentation of gas turbine engine steady-state and/or transient performance as calculated by means of digital computer programs. It also provides a method for the presentation of gas turbine parametric performance, weight and dimensions by means of digital computer programs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is intended to facilitate calculations by the program user without unduly restricting the method of calculation used by the program supplier.&lt;/div&gt;&lt;/div&gt;</p>
