  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidance when creating integrated vehicle health management (IVHM) system architecture. IVHM covers a vehicle’s monitoring and data processing functions inherent within its sub-systems, and the tools and processes used to manage and restore the vehicle health.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These guidelines are drawn from experience within both defense and commercial IVHM initiatives and implementations. The document identifies a step-by-step methodology to expose functional and non-functional requirements, mature the architecture and support organizational business goals and objectives.&lt;/div&gt;&lt;/div&gt;</p>
