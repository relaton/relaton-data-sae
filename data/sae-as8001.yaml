  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Standard covers Bank and Pitch Instruments which measure and display the angular displacement of bank and pitch from a gyroscopic vertical reference. This reference may be pneumatically or electrically driven and be contained within the instrument display case or located remotely.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Unless otherwise specified, whenever the term "Instrument" is used, it is to be understood to be the complete system of gyro component, any auxiliary equipment and display.&lt;/div&gt;&lt;/div&gt;</p>
