abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To provide test guidelines, recommendations, and referenced standards for insulation materials in a high energy system especially at high voltages (AC, DC, and PWM) and at operational altitudes, for the purpose of defining/measuring the effects of insulation aging.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is a part of a family of documents related to the impact of ageing on insulating materials devoted to aviation applications. Aging mechanisms, and the markers to monitor them, have been defined in AIR7374. For sake of brevity, the main conclusions are used here.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;ARP7375 focuses on the ways to measure these markers on representative samples (either coupons or electrical insulation systems) for aerospace applications.&lt;/div&gt;&lt;/div&gt;</p>
