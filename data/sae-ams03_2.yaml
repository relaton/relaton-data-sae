  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies processes for the cleaning of metal surfaces to remove any extraneous or undesirable material or deposits at any stage of manufacture, storage or service and for the preparation of these surfaces for further treatment. Any necessary stress-relieving treatments are also included. This Standard does not override special preparatory procedures specified in individual Defence Standards, Defence Specifications, DTD Process Specifications, DG Ships Specifications and Naval Defence Standards. It also does not cover cleaning operations associated with the maintenance of internal combustion engines, the preliminary removal of heavy deposits of oil, grease, or dirt accumulated during operational service, preparations for welding and the cleaning of electrical contacts.&lt;/div&gt;&lt;/div&gt;</p>
