abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification covers a corrosion and heat-resistant steel in the form of sheet, strip, and plate.
    These products have been used typically for parts requiring both corrosion and heat resistance, especially when such parts require welding during fabrication and for parts requiring oxidation resistance up to 1500 °F (816 °C) but useful at that temperature only when stresses are low, but usage is not limited to such applications.</p>
