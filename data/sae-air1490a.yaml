  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Since the ULD device containing textiles should have a predictable service life, there should be data available so that predictions can be made. This technical report compiles available information on textiles of the types used in air cargo ULD devices and reviews the degradation characteristics of each.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Textiles are used primarily in cargo restraint nets on air cargo pallets and non structural containers, restraint nets installed in cargo aircraft, and similar applications.&lt;/div&gt;&lt;/div&gt;</p>
