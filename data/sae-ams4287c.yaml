    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an aluminum alloy in the form of extruded bars, rods, and profiles (shapes) produced with nominal thickness up to 3.000 inches (76.20 mm), inclusive, and having a cross-sectional area of 42 square inches (271 cm&lt;sup&gt;2&lt;/sup&gt;) maximum and a circumscribing circle diameter (circle size) of 15 inches (38 cm) maximum (see &lt;span class="xref"&gt;2.4.1&lt;/span&gt; and &lt;span class="xref"&gt;8.8&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
