    &lt;div class="htmlview paragraph"&gt;This SAE Information Report provides test procedures, requirements, and guidelines for reflex reflectors used on vehicles 2032 mm or more in overall width and 7.6 m or more in length. Reflex reflectors conforming to these requirements may also be used on vehicles less than 2032 mm in overall width.&lt;/div&gt;&lt;/div&gt;</p>
