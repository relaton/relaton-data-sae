  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines the method for voltage identification by the use of color-coded insulators at the base of the lamp. &lt;span class="xref"&gt;Table 1&lt;/span&gt; shows the design volts and corresponding insulator colors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The part numbers shown are for example purposes only.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Insulator colors are to be easily distinguishable as green, yellow, red, and white. Additional colors may be added by a revision process as required.&lt;/div&gt;&lt;/div&gt;</p>
