  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following recommended practice has been developed to assist engineers and designers in the preparation of specifications for the major types of helical compression and extension springs. It is restricted to a concise presentation of items which will promote an adequate under standing between spring manufacturer and spring user of the major practical requirements in the finished spring. Closer tolerances are obtainable where greater accuracy is required and the increased cost is justified.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For the basic concepts underlying the spring design and for many of the details see the SAE Information Report MANUAL ON DESIGN AND APPLICATION OF HELICAL AND SPIRAL SPRINGS, SAE J795, which is available from SAE Headquarters in Warrendale, PA 15096. A uniform method for specifying design information is shown in the TYPICAL DESIGN CHECK LISTS FOR HELICAL SPRINGS, SAE J1122.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Two types of helical springs are considered:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Hot-coiled compression springs for general automotive use as well as for motor vehicle suspensions.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Cold-wound compression and extension springs for general automotive use.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;This recommended practice uses SI (metric) units in accordance with the provisions of SAE J916, dated February 1974.&lt;/div&gt;&lt;/div&gt;</p>
