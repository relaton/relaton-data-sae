abstract:
- language: en
  script: Latn
  content: "<p>This classification for grain size comprises three sets of comparison
    charts to be used for determining grain size. These charts are presented in three
    categories as follows:\n\nPlate I - Untwinned grains (flat etch)\nPlate II - Twinned
    grains (flat etch)\nPlate IV - Austenite grains in steel (McQuaid-Ehn test or
    other test)\n\nTable 1 lists a number of materials and the comparison charts that
    are suggested for use in estimating their grain size by the comparison method.\n\nNOTE\x97The
    suggestions in Table 1 are based upon the customary practices in industry. For
    specimens prepared according to special techniques, the appropriate comparison
    chart should be selected on a structural appearance basis as described in the
    Scope.</p>"
