abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice is intended as a guide in the usage of mechanical face seals for the passenger car air-conditioning compressor application.  Included in this guide is a compilation of present practices; for example, a description of various type seals, material combinations, design data, tolerances, drawing format, qualification testing, inspection information, and quality control data.  The terminology used is recommended to promote uniformity in seal nomenclature.</p>"
