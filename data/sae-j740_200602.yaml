abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To be used on cutting edges and end bits in conjunction with No. 3 head plow bolts (Ref. ANSI B18.9) typically used on off-road self-propelled work machines as described in SAE J1116.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Cutting edges are further defined in SAE J737, J739 and J1304.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;End bits are further defined in SAE J63.&lt;/div&gt;

    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;When section thickness exceeds A in drawing 1 (&lt;span class="xref"&gt;Figure 2&lt;/span&gt;) (countersunk one side) or B in drawing 4 (countersunk both sides), use counterbore with diameter D, as shown in cross section drawings 2, 5 and 6, or extended countersink C, as shown in cross section drawings 3 and 7.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The inscribed circle of the square holes shall be concentric with countersink or counterbore within 0.03 in (0.8 mm).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;



    &lt;/div&gt;</p>
