  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;It is the purpose of this SAE Recommended Practice to provide general installation instructions for universal type seat belt assemblies for installation in either a commercial or passenger car vehicle. Its primary intent is to provide guidance in the installation of seat belt assemblies meeting the requirements of Section 571.209 in the code of Federal Regulations of the National Highway Traffic Safety Administration. These minimum instruction requirements may be supplemented by more specific manufacturer's instructions, if they are necessary to provide proper installation in a particular vehicle.&lt;/div&gt;&lt;/div&gt;</p>
