  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report presents, paraphrased in tabular format, an overview of the Federal Aviation Regulations (FAR) and the Joint Aviation Regulations (JAR) for aircraft oxygen systems. It is intended as a ready reference for those considering the use of oxygen in aircraft and those wishing to familiarize themselves with the systems requirements for existing aircraft. This document is not intended to replace the oxygen related FAR/JAR but rather to index them in some order. For detailed information, the user is referred to the current issue of the relevant FAR/JAR paragraph referenced in this report.&lt;/div&gt;&lt;/div&gt;</p>
