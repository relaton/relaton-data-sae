  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides criteria for the development and standardization of placards containing signs, symbols and/or instructions for locating and operating exits and emergency equipment that might be used or operated by cabin occupants and rescue personnel under emergency conditions. In addition, this ARP gives guidance in the selection and development of warning placards. The placards are intended to be seen and understood by occupants within and, in the case of external exit placards, by persons outside of the airplane.&lt;/div&gt;
    &lt;/div&gt;</p>
