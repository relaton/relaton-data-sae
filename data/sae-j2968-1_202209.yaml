  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended as the definition of a standard test, which may be subject to frequent change to keep pace with experience and technical advances. This should be kept in mind when considering its use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specific purpose of this SAE Recommended Practice is to define a procedure to determine intrinsic properties of friction materials such as compressive modulus and rebound/recovery time at specific fatigue test pressures. Results from this test will both independently characterize the friction material and serve as input to the compression fatigue test.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: If this test is intended to determine the rebound interval for the compression fatigue test, then the maximum test pressure (P&lt;sub&gt;max&lt;/sub&gt;) in this procedure must be selected with future fatigue testing levels in mind. It is important that the rebound time is sufficient at the maximum apply pressure to allow the matieral to rebound back to its original thickness.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Standard reporting processes are recommended. This procedure is intended for use by both suppliers and end users of wet friction materials.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The only variables selected by the supplier or user of the friction system are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Friction material.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Fluid.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Maximum load.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Fatigue test cycle requirements.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;These variables must be clearly identified when reporting the results of this test. Data shall not be reported as having been obtained using this procedure if any test parameters or system hardware described in this document are changed or deviated from in any way (other than the variables described above).&lt;/div&gt;&lt;/div&gt;</p>
