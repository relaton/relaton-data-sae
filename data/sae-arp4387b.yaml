abstract:
- language: en
  script: Latn
  content: |-
    <p>The methods and designs presented herein shall not be construed as being the only means of accomplishing these accommodations.

    This document applies to all transport category aircraft using features required by Department of Transportation Regulations CFR382.

    Passengers with ambulatory disabilities for whom provisions shall be made on each airplane type and location(s) for their seating are defined in 14CFR382.

    The goal is to provide cabin service comparable to that available to other travelers without jeopardizing the safety of fellow passengers. This necessitates consideration of physical, neurological and sensory capabilities, and limitations of mobility impaired persons. With proper consideration and design implementation, it will be possible to serve the needs of the majority of the disabled population.</p>
