  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This classification system tabulates the properties of vulcanized rubber materials (natural rubber, reclaimed rubber, synthetic rubbers, alone or in combination) that are intended for, but not limited to, use in rubber products for automotive applications.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;This document is based on the premise that all rubber materials intended for use in rubber products can be arranged into characteristic designations. These designations are determined by types, based on resistance to heat aging, and classes, based on resistance to swelling by oil. Basic levels are thus established which, together with values describing additional requirements, permit complete description of the quality of all rubber materials.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In all cases where provisions of this document would conflict with those of the detailed specifications for a particular product, the latter shall take precedence.&lt;/div&gt;

    &lt;/div&gt;</p>
