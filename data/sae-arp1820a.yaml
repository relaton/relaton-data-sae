  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This practice provides a method of evaluating microhardness and microstructure very close to the surface of a disk specimen. It is useful for process control in heat treatment of steel parts to detect nitriding and carburization as well as decarburization and excessive intergranular oxidation. It also may be valuable for other evaluations, e.g., plated coatings and other materials.&lt;/div&gt;&lt;/div&gt;</p>
