  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practices (ARP) covers the definitions, functions and broad application guidelines of modern aerospace vehicle electric power management systems. As aerospace control systems have become more sophisticated and autonomous, the electric power subsystem no longer is just a generation and distribution bus control system. New electric power systems include integration of individual load logic control, protection, generation, distribution, and load management. This system can report to a higher level control system, typically a vehicle management system, or can be an autonomous system within itself reporting and responding to operator commands.&lt;/div&gt;&lt;/div&gt;</p>
