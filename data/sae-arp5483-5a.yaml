    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method outlines the recommended procedure for performing static radial limit and ultimate load tests on rolling element bearings used in airframe applications. Bearings covered by this document shall be antifriction ball bearings and spherical roller bearings in either annular or rod end configurations.&lt;/div&gt;&lt;/div&gt;</p>
