    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers minimum requirements for two types of metallic tubing and pipe as used in automotive air brake systems. It includes material and performance specifications, corrosion precautions, and installation recommendations. Copper tubing is designated Type 1, and galvanized steel pipe Type 2.&lt;/div&gt;&lt;/div&gt;</p>
