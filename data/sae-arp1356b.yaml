- language: en
  script: Latn
  content: "<p>This Aerospace Recommended Practice (ARP) establishes criteria for the design and performance of aircraft life raft devices which will ensure their rapid and effective use as a flotation device in a water  landing. This document is not intended to specify particular design methods, mechanisms, or equipment to be used to accomplish the objectives established herein.</p>"
