  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Information Report (AIR) describes the use of FTIR analyzers for measurements of gaseous emissions from aircraft gas turbine engines and combustion rigs. The use of FTIR analyzers can be demonstrated as a suitable and cost-effective equivalent to NDIR and chemiluminescence analyzers as prescribed in ARP1256 for the measurement of CO, CO&lt;sub&gt;2&lt;/sub&gt;, NO, and NO&lt;sub&gt;2&lt;/sub&gt;, where NO&lt;sub&gt;x&lt;/sub&gt; is closely approximated by the sum of NO and NO&lt;sub&gt;2&lt;/sub&gt; concentrations. FTIR analyzers may be proven suitable for equivalency of analyzers used in current emission testing. Additionally, FTIR analyzers have potential for equivalent measurements of “total” hydrocarbon (THC) as currently defined in ARP1256.&lt;/div&gt;
    &lt;/div&gt;</p>
