  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is prepared as a guideline to improve and maintain the quality of remanufactured automotive products. Installation of remanufactured or rebuilt products is often an economical way to repair a vehicle even though they may not fully be equivalent to original equipment parts. Before processing any part, a remanufacturer should determine if the original design and present condition of the core are suitable for remanufacturing, so as to provide durable operation of the part as well as acceptable performance when installed in a vehicle. The remanufacturer should also carefully consider the safety aspects of the product and any recommendations of the original manufacturer related to remanufacturing or rebuilding their product.&lt;/div&gt;&lt;/div&gt;</p>
