  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers design requirements, performance requirements, and methods of procurement for tools and associated accessories used to cut aerospace vehicle electrical wire and cable. Aerospace vehicle electrical wire has stranded conductors with protective plating and specialized insulation. Poor quality wire cutting can compromise the performance of wiring.&lt;/div&gt;&lt;/div&gt;</p>
