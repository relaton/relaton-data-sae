    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides recommendations involving BEV battery data retention and battery design that enhance the potential for BEV battery reuse and serviceability and that can improve recyclability. These recommendations have been developed by a group of professionals skilled in the secondary-use of batteries and in the research, development, and manufacture of BEV batteries and battery systems.&lt;/div&gt;
