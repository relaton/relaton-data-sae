abstract:
- language: en
  script: Latn
  content: |-
    <p>The guidelines for operator and bystander protection in this recommended practice apply to towed,
    semimounted or mounted flail mowers and flail power rakes when powered by a propelling tractor or machine
    of at least 15 kw (20 hp), intended for marketing as industrial mowing equipment and designed for cutting
    grass and other growth in public use areas such as parks, cemeteries and along roadways and highways.

    The use of the word "industrial" is not to be confused with "in-plant industrial equipment".

    This document does not apply to:
    1. Turf care equipment primarily designed for personal use, consumption or enjoyment of a consumer in
    or around a permanent or temporary household or residence.
    2. Machines designed primarily for agricultural purposes but which may be used for industrial use.
    3. Self powered or self propelled mowers or mowing machines.

    Where other standards are referenced, such reference applies only to the document identified, not revisions
    thereof.

    1.1 Purpose—To establish guidelines for operator and bystander protection for flail mowers and flail power rakes
    whose intended use falls within the scope of this document.</p>
