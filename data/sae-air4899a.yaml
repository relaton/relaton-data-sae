abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The methodology for maximum package size loading is based on a mathematical method allowing the calculation of maximum package size tables.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This method does not in principal differentiate between bulk loading and cargo system loading.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;However, some restrictions have to be considered:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Some cargo systems generate pre-determined pallet trajectories. Envelope curves depending on the pallet size and the possible trajectories have to be determined first.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Door geometric limitations (with or without cargo loading system)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Turning limitations due to weight, load geometry and conveyance capability&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Securing requirements&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;This document is not intended for airline operational use. It should be used by engineers performing calculations or developing computer programs to produce Maximum Package Size tables specified in AS1825.&lt;/div&gt;
    &lt;/div&gt;</p>
