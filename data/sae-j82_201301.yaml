    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the mechanical and quality requirements for two grades of carbon steel, slotted, and recessed, 82 degrees flat countersunk, 82 degrees oval countersunk, pan, fillister, hex, and hex washer head machine screws in sizes No. 4 through 3/4 in for use automotive and related industries. The dimensions of these screws are covered in ASME B18.6.3.&lt;/div&gt;&lt;/div&gt;</p>
