  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Standard defines a machine coordinate system and machine motion nomenclature for numerically controlled machines. This Standard applies to all numerically controlled machines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For the sake of simplicity, the majority of the text of this Standard is written in terms which are applicable to machine tools but it is nevertheless applicable to numerically controlled machines in general.&lt;/div&gt;&lt;/div&gt;</p>
