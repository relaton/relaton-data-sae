abstract:
- language: en
  script: Latn
  content: "<p>The purposes of this addendum to B92.1 is to expand the capability of the standard. All numbers are connected to a formula to enable an easier use of the standard. Minimum effective clearance is defined. Form clearance is controlled by tooth size and minimum fillet radius is specified for a flat root spline. Some drawings callouts are added for clarification and the tolerances are limited for splines with a larger number of teeth.</p>"
