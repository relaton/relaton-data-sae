  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method provides procedures for exposing specimens of elastomer material (slab form) representative to those used in gas turbine engines to aviation lubricants under extended duration and engine relevant thermal conditions. For AS5780 requirements the time is at least 1800 hours and temperatures are 100 °C to 160 °C. Positive volume change is an indication of specimen swell and subsequent negative volume change is an indication of specimen deterioration, both properties are important in the evaluation of the compatibility of the lubricant with elastomers used in the construction of the gas turbine.&lt;/div&gt;&lt;/div&gt;</p>
