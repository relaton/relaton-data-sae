    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers quality assurance sampling and testing procedures used to determine conformance to applicable specification requirements of wrought aluminum alloy and wrought magnesium alloy mill products (except forging stock), and includes quality assurance and testing procedures for rolled, forged, and flash welded rings (see &lt;span class="xref"&gt;8.3&lt;/span&gt;). Requirements are specified in inch/pound units.&lt;/div&gt;&lt;/div&gt;</p>
