  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These guidelines are intended for those engineers and scientists who evaluate the corrosion performance of painted automotive parts in laboratory cyclic tests. The guidelines are intended to help ensure that the results of the tests can be used to reach conclusions concerning the variables under study without being confounded by the test procedure itself. The guidelines also serve as a means to assist users of this type of test in obtaining good inter-laboratory agreement of results.&lt;/div&gt;&lt;/div&gt;</p>
