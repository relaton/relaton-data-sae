  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a laboratory test procedure for measuring the thickness of various resilient insulating padding materials that are used in the automotive industry. Such padding materials may include synthetic or non-synthetic materials, fibrous or cellular materials, high loft or compressed materials, single layer homogeneous or multilayer products, low and high surface density products. Some of these samples may be deformable and elastic, high loft thermal and acoustical fibrous materials, as well.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test method described herein has been developed to establish a means of a uniform procedure for measuring the thickness of different types of samples not only for application to all ground vehicles, but also may be applicable to other situations or conditions. The test method is designed to measure the thickness of flat samples and not formed parts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This test method does not purport to address all of the safety concerns, if any, associated with its use. It is the responsibility of the user of this standard to establish appropriate safety and health practices and determine the applicability of regulatory limitations prior to use. This test method provides a different thickness measuring device than what has been mentioned in SAE J1355 Apr87.&lt;/div&gt;&lt;/div&gt;</p>
