    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this standard is to aid manufacturers in creating devices that will provide maintenance staff with objective, reliable data consistent with certain types of airborne contaminants (“sources”), captured either during an event or during maintenance troubleshooting on the ground, in both cases for post-flight interpretation on the ground.&lt;/div&gt;&lt;/div&gt;</p>
