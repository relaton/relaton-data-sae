  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a test method for determination of heavy truck (Class VI, VII, and VIII) tire force and moment properties under straight-line braking conditions. The properties are acquired as functions of normal force and slip ratio using a sequence specified in this practice. At each normal force increment, the slip ratio is continually changed by application of a braking torque ramp. The data are suitable for use in vehicle dynamics modeling, comparative evaluations for research and development purposes, and manufacturing quality control.&lt;/div&gt;


    &lt;/div&gt;</p>
