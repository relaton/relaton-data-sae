  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends criteria for the installation and operation of a printer intended for use by flight crew members on the flight deck. The printer is used to supply the flight crew with hard copies of information that originates from data sources such as FMS, EDMS, ACMS, CMS, and data link.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These criteria are in addition to the specifications of the referenced ARINC Characteristic 744A.&lt;/div&gt;&lt;/div&gt;</p>
