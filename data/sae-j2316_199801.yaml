  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides minimum performance requirements and uniform procedures for nut seat system strength of wheels intended for normal highway use on passenger cars, light trucks, (except dual wheels, which are covered by SAE J1965) and multipurpose passenger vehicles. The nut seat system includes the wheel, wheel bolts, and wheel nuts as applicable. Many factors must be considered in design and validation of wheel attachments for each specific vehicle. The individual components should be evaluated per the SAE standards referenced.&lt;/div&gt;&lt;/div&gt;</p>
