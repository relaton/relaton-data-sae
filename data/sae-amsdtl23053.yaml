  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for various types and colors of electrical insulating sleeving that will shrink to a predetermined size upon the application of heat. This specification includes provisions for demonstrating compliance with requirements through in process inspection and statistical process control (see &lt;span class="xref"&gt;4.4.3.1&lt;/span&gt;). Continuous operating temperature ratings range from -80° to +250°C (-112° to +482°F) (see &lt;span class="xref"&gt;6.1&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
