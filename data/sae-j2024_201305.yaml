  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report establishes a minimum level of uniform recipes for contaminants which may be used when durability testing pneumatic components to obtain additional information on how a device may perform under more true-to-life operating conditions. This type of contamination testing, however, is not meant to replace the type of performance testing described in SAE J1409 and SAE J1410. Durability testing in the presence of contamination, however, will yield results more reflective of actual in-service field conditions and provide an additional evaluation of pneumatic devices.&lt;/div&gt;
