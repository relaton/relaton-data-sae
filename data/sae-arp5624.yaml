    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides recommended definitions for terms commonly used in aircraft inflight icing system design and analysis, research, and operations. Some general thermodynamic terms are included that are frequently used in icing analysis, but this document is not meant to be an inclusive list of such terms.&lt;/div&gt;&lt;/div&gt;</p>
