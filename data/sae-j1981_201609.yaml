  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The test is designed to evaluate the frontal impact resistance of wheel and tire assemblies used with passenger cars, light trucks and multi-purpose vehicles. The test is specifically related to vehicle pothole tests that are undertaken by most vehicle manufacturers. The scope has been expanded to allow the use of a striker that can be angled to preferentially impact the inboard and outboard wheel flange. For side impact of the outboard rim flange only, please refer to SAE J175. This SAE Recommended Practice provides a procedure to test a wheel or a tire and the test failure criteria. The specific test for a vehicle requires input from a pothole test on that vehicle to establish the drop height of the striker used in this test.&lt;/div&gt;
    &lt;/div&gt;</p>
