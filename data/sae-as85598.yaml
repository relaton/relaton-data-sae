  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard defines general requirements for spherical, radial-journal, conical, and thrust bearings which are of laminated elastomeric construction. These bearings are for use in an environment having a temperature spectrum of -65 to +160 °F while reacting steady state loads in addition to oscillating loads and motions. The operating temperature range of -65 to +160 °F reflects the current temperature range for existing parts, but allows for expansion in the future.&lt;/div&gt;&lt;/div&gt;</p>
