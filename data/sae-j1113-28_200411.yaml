  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Vehicle electrical/electronic systems may be affected when immersed in an electromagnetic field generated by sources such as radio and TV broadcast stations, radar and communication sites, mobile transmitters, cellular phones, etc. Reverberation method is used to evaluate the immunity of electronic devices in the frequency range of 400 MHz – 18GHz. Pulse modulation is used for testing above 800 MHz.&lt;/div&gt;&lt;/div&gt;</p>
