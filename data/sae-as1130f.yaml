  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes three classes of pallets:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Type A, Air only Pallet&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Type B, Platform Pallet (Air/Surface Intermodal)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Type C, Adapter Pallet&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Pallets will have nominal dimension of:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Size F pallet (10 ft) (NAS 3610-2F1P) - 2.44 m x 2.99 m (96 in x 117.75 in)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Size R pallet (16 ft) (NAS 3610-2R1P) - 2.44 m x 4.98 m (96 in x 196 in)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Size G pallet (20 ft) (NAS 3610-2G1P) - 2.44 m x 6.06 m (96 in x 238.5 in)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Size H pallet (30 ft) (NAS 3610-2H1P) - 2.44 m x 9.12 m (96 in x 359.25 in)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Size J pallet (40 ft) (NAS 3610-2J1P) - 2.44 m x 12.19 m (96 in x 480 in)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Type A, Air only pallets, will normally be on aircraft equivalent roller conveying systems and/or on similarly equipped ancillary ground handling devices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Type B, Platform pallets, are suitable for air/surface handling and transport systems. Supplementary requirements for Type B version are found in &lt;span class="xref"&gt;Section 4&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Type C, Adapter pallets, are used to adapt 2.44 m x 2.44 m (8 ft x 8 ft) surface mode only containers for transport. Supplementary requirements for Type C version are found in &lt;span class="xref"&gt;Section 5&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: Use of the adapter pallet with surface mode only 2.44 m x 2.44 m (8 ft x 8 ft) containers may require uniform load distribution on the base cross members of these containers for carriage on certain aircraft. The aircraft approved Weight and Balance Manual should be referred to for loadability procedures or limitations, or both.&lt;/div&gt;
    &lt;/div&gt;</p>
