    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes a test method to measure drag force of self-propelled, as well as towed, construction, forestry, and industrial machines, with or without payload, as listed in SAE J/ISO 6165 and J1116.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Drag force is measured as a function of travel speed.&lt;/div&gt;
    &lt;/div&gt;</p>
