  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the major dimensions and tolerances for Engine Flywheel Housings and the Mating Transmission Housing Flanges. It also locates the crankshaft flange face or the transmission pilot bore (or pilot bearing bore) stop face in relation to housing SAE flange face.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is not intended to cover the design of the flywheel housing face mating with the engine crankcase rear face or the design of housing walls and ribs. Housing strength analysis and the selection of housing materials are also excluded.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to any internal combustion engine which can utilize SAE No. 6 through SAE No. 00 size flywheel housing for mounting a transmission.&lt;/div&gt;
    &lt;/div&gt;</p>
