  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Specification covers constant displacement hydraulic motors, generally remotely mounted, using hydraulic fluid under pressure as the energy transfer medium for driving various accessories. Hydraulic motors shall be suitable for use in aircraft hydraulic systems conforming to and as defined in MIL-H-5440 and MIL-H-8891 as applicable.&lt;/div&gt;&lt;/div&gt;</p>
