abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document identifies and expands upon many of the issues and challenges in obtaining high-quality total-pressure measurements at the designated Aerodynamic Interface Plane (AIP). More specifically, it applies to the measurement of inlet total pressure used to characterize and quantify inlet distortion and inlet total-pressure recovery for gas turbine applications where they factor into turbine engine stability or performance. This includes ground (subscale or full-scale wind tunnel and engine tests) and flight test pressure measurements. Static pressure measurements are also useful for understanding inlet flow characteristics; therefore, a section is included describing static pressure installation considerations within an inlet.&lt;/div&gt;
    &lt;/div&gt;</p>
