  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The power take-offs included in this SAE Standard are those which are driven from the transmission, auxiliary transmission, or transfer case of the type used in trucks, and are attached as described under SAE J704; are top-mounted on the auxiliary transmission; or are the type directly incorporated in a gear train unit such as a transfer case or a split-shaft power take-off. Included are their use in construction equipment, and for similar purposes where truck-type transmission units are used for transmitting power to ancillary devices.&lt;/div&gt;&lt;/div&gt;</p>
