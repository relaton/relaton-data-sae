    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Information Report is to provide basic information on penetrating radiation, as applied in the field of nondestructive testing, and to supply the user with sufficient information so that he may decide whether penetrating radiation methods apply to his particular inspection need. Detailed information references are listed in &lt;span class="xref"&gt;Section 2&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
