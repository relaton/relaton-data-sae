  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to provide the aerospace industry with recommendations concerning the minimization of stress corrosion cracking in wrought heat-treatable carbon and low-alloy steels and in austenitic, precipitation hardenable, and martensitic corrosion-resistant steels and alloys.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The detailed recommendations are based on laboratory and field experience and reflect those design practices and fabrication procedures which should avoid in-service stress corrosion cracking.&lt;/div&gt;&lt;/div&gt;</p>
