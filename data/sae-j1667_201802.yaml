  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to vehicle exhaust smoke measurements made using the Snap-Acceleration test procedure. Because this is a non-moving vehicle test, this test can be conducted along the roadside, in a truck depot, a vehicle repair facility, or other test facilities. The test is intended to be used on heavy-duty trucks and buses powered by diesel engines. It is designed to be used in conjunction with smokemeters using the light extinction principle of smoke measurement.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure describes how the snap-acceleration test is to be performed. It also gives specifications for the smokemeter and other test instrumentation and describes the algorithm for the measurement and quantification of the exhaust smoke produced during the test. Included are discussions of factors which influence snap-acceleration test results and methods to correct for these conditions. Unless otherwise noted, these correction methodologies are to be considered an integral part of the snap-acceleration test procedure.&lt;/div&gt;
    &lt;/div&gt;</p>
