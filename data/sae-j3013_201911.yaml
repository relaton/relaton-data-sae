    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies necessary procedures and control parameters in estimating anisotropic elastic constants of friction material based on pad assembly FRF measurements and optimization. It is intended to provide a set of elastic constants as inputs to brake NVH simulation, with the objective of ensuring pad assembly vibration correlation between simulation and measurements.&lt;/div&gt;&lt;/div&gt;</p>
