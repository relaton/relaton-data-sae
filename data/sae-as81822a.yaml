  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers both insulated and uninsulated solid conductor wire, designed for solderless wrap connections in electrical and electronic devices and equipment. The terminations of the wire are intended to be made with hand or automatic tools which wrap the wire, under tension, around terminal pins (commonly called wrapposts) to form solderless wrapped connections.&lt;/div&gt;&lt;/div&gt;</p>
