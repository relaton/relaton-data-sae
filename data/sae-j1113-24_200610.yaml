  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This part of SAE J1113 specifies the transverse electromagnetic mode (TEM) cell test methods and procedures for testing the electromagnetic immunity of electronic components (DUTs) for passenger cars, commercial vehicles and similar applications. Methods using the constant cross-section TEM cell (Crawford TEM) and the flared cross-section TEM cell (wideband TEM) are discussed in the document. The electromagnetic disturbance considered in this part of SAE J1113 will be limited to continuous narrowband electromagnetic fields. TEM cells produce both electric and magnetic fields simultaneously. The test is directly applicable to DUTs whose height is less than 1/3 the septum height; somewhat larger modules can be tested with conditions applied. The Crawford TEM and wideband TEM cell may be used for testing within the 1/3 height condition without demonstrating field uniformity within the cell, if the test set-up complies with the other provisions of this standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This test can be used for two purposes:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Testing the immunity of DUTs with major field coupling to the DUT and wiring harness;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Testing the immunity of DUTs with major field coupling to the DUT.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The methods defined in this document have some significant differences from ISO 11452-3. Careful deliberation has been given to the need to diverge from the international standard. The primary differences are the method of bringing leads from the DUT out of the TEM cell and the inclusion of the wideband TEM cell.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Immunity measurements of complete vehicles are generally only possible by the vehicle manufacturer. The reasons, for example, are the high costs of a vehicle sized absorber lined chamber, preserving the secrecy of prototypes or the large number of different vehicle models. Therefore, the TEM cell is useful for research, development, and quality control. This test method is also required by many vehicle manuafcturers.&lt;/div&gt;&lt;/div&gt;</p>
