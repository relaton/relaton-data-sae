  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for polytetrafluoroethylene (PTFE) hose assemblies for use in aerospace hydraulic systems at temperatures between -55 °C and 204 °C and at a nominal pressure up to 28,000 kPa (280 bar). The hose assemblies are also suitable for use within the same temperature and pressure limitations in aerospace pneumatic systems where some gaseous diffusion through the wall of the PTFE liner can be tolerated.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The use of these hose assemblies in high pressure pneumatic storage systems is not recommended. In addition, installations in which the limits specified herein are exceeded, or in which the application is not covered specifically by this document, for example, oxygen, shall be subject to the approval of the purchaser.&lt;/div&gt;
    &lt;/div&gt;</p>
