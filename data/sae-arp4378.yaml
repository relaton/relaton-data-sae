  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes the minimum requirements and procedures for the design, construction, testing and performance of aerospace, maintenance free, factory pre-charged hydraulic accumulators. The accumulators are designed for use in aircraft hydraulic systems at maximum rated operating pressures up to 8000 psi (55158 KPa). The temperature range of the accumulator is -65 to 275 °F (-54 to 135 °C).&lt;/div&gt;
    &lt;/div&gt;</p>
