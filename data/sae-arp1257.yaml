    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Transient engine performance computer programs will be the primary source for time-dependent variations of engine performance. Steady-state engine performance computer programs will be the primary source for steady-state engine performance. Transient engine performance calculations will be based on one of three steady-state performance categories: preliminary design, status, or specification.&lt;/div&gt;


    &lt;/div&gt;</p>
