  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice sets forth the equipment, environment, and test procedures to be used in measuring sound levels of engines. The purpose is to provide a uniform method of measuring the maximum acoustical radiation from the exterior surfaces of an engine under representative engine operating conditions. The measured sound levels will be useful in development of engines, comparison of engines, and installation of engines in various applications. The correlation of the measured engine sound levels to the various application sound levels will have to be developed.&lt;/div&gt;&lt;/div&gt;</p>
