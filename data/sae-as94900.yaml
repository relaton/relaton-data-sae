  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes general performance, design, test, development and quality assurance requirements for the Flight Control Systems of military piloted aircraft. Flight Control Systems (FCS) include all components used to transmit flight control commands from the pilot or other sources to appropriate force and moment producers. Flight control commands normally result in control of aircraft altitude, airspeed, flight path, attitude, aerodynamic or geometric configuration, ride quality, and structural modes. Among components included are the pilot’s controls, dedicated displays and logic switching, system inertial and air data sensors, signal computation, test devices, mechanical transmission devices, actuators, power sources, and signal transmission lines dedicated to flight control. Excluded are aerodynamic surfaces, engines and engine control systems, rotorcraft rotors, fire control devices, crew displays and electronics not dedicated to flight control. In the event of conflict between this specification and other referenced documents, this specification shall govern. The detail requirements for a particular system shall be specified in the FCS Specification, &lt;span class="xref"&gt;4.6.2&lt;/span&gt;, the Aircraft Detail Specification, the contract, or purchase order for that system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Most of the technical concepts and approaches covered by the document represent industry "best practice". They are based on sound and proven engineering practices and have demonstrated successful production experience. Others require specific approval from the procuring activity before use. This requirement for approval is not intended to prohibit their use; but rather to ensure that the prime contractor has fully investigated their capability to perform reliably and to be sufficiently durable under the required conditions and that the prime contractor can present substantiating evidence for approval before the design is committed to.&lt;/div&gt;&lt;/div&gt;</p>
