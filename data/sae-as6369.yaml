    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for a grooved clamp coupling and flanges suitable for joining intermediate pressure and temperature ducting in aircraft pneumatic systems. The coupling joint assembly, hereafter referred to as "the joint", shall operate within the temperature range of -65 °F external ambient to +800 °F internal fluid.&lt;/div&gt;&lt;/div&gt;</p>
