  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) contains Lessons Learned from aerospace actuation, control and fluid power systems technologies. The lessons were prepared by engineers from the aerospace industry and government services as part of SAE Committee A-6, Aerospace Fluid Power, Actuation, and Control Technologies, and were presented to the A-6 during meetings held from 1989 through 1999. The document is organized into five sections covering systems, actuation, hydromechanical components, electrical components and miscellaneous, each further divided into subsections. The lessons are presented in a concise format of Problem, Issue, Solution and Lesson Learned, often with accompanying descriptive diagrams and illustrations for clarity and understanding.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Because of the potential growth in the size of the document as new lessons are published, those presented to the A-6 Committee in 2000 and later years are planned to be released in separate slash number documents, AIR4543/1, AIR4543/2 and so on.&lt;/div&gt;
    &lt;/div&gt;</p>
