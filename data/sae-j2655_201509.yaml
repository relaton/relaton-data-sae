  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Part Standard covers selected inch dimensioned washers and lock washers manufactured in accordance with American Society for Mechanical Engineers dimensional standards. This SAE standard covers material most often used in ship systems and equipment but its use may be applied wherever washers of the covered materials are used. This standard permits the washers to be identified and ordered by a part identification number (PIN) as defined in this standard.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Appendix A&lt;/span&gt; provides a means of establishing PINs for non-standard flat washers.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Appendix B&lt;/span&gt; establishes standards for lock plates and tab lock washers often used in Navy designs.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Appendix C&lt;/span&gt; identifies other military and non-government standards for flat washers, helical and toothed lock washers. It identifies the materials covered by each standard with a comparison of those dimensions with those SAE J2655 washers.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;


    &lt;/div&gt;</p>
