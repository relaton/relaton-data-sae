  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the specific requirements for aluminum alloy, 7011 alclad, 7075 plate and sheet; the general requirements are covered in AMS-QQ-A-250. The plate and sheet covered by this specification shall be an integral composite product consisting of a heat-treatable aluminum alloy 7075 core with thin layers of a 7011 aluminum alloy anodic to the core and of approximately equal thickness, bonded to both surfaces.&lt;/div&gt;&lt;/div&gt;</p>
