    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice applies to nomenclature of emissions and emissions reduction apparatus as applied to various engines and vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Modifying adjectives are omitted in some cases for the sake of simplicity. However, it is considered good practice to use such adjectives when they add to clarity and understanding.&lt;/div&gt;&lt;/div&gt;</p>
