    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard has been adopted to provide a basis for dynamometer determination of gross engine power and torque under reference conditions. It is intended for use primarily by engine manufacturers that supply engines for installation by others in applications where the engine manufacturer may not control the induction and exhaust system design or the speed at which the engine is run. Intentional biasing of engine component or assembly tolerances to optimize performance for this test is prohibited.&lt;/div&gt;


    &lt;/div&gt;</p>
