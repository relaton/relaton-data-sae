abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice defines the best known techniques for
    evaluating dynamic passenger car and light truck tire driving traction in snow.
    There are many snow conditions which a typical driver will  encounter that are
    not specifically addressed in this Recommended Practice. Dynamic driving traction
    in this Recommended Practice is under a narrow, controlled range of conditions
    of temperature, snow compaction and depth (commonly called the 'Test Window')
    to minimize test variability. Tire rankings may differ on other types of snow
    and ice  conditions.</p>"
