  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure incorporates driving cycles that produce fuel consumption data relating to Urban, Suburban, and Interstate driving patterns. The procedure is intended to be used to determine the relative fuel economy among vehicles and driving patterns under warmed-up conditions on a test track or on suitable roads. The urban driving cycle forms the basis of a Cold-Start Test Procedure described in SAE Recommended Practice SAE J1256.&lt;/div&gt;&lt;/div&gt;</p>
