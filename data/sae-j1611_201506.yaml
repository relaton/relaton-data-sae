  content: |-
    <p>&lt;p&gt;This SAE Standard applies to horizontal earthboring machines of the following types:&lt;br/&gt;
    a. Auger Machines&lt;br/&gt;
    b. Pipe Pushers&lt;br/&gt;
    c. Rotary Rod Machines&lt;br/&gt;
    d. Impact Machines&lt;br/&gt;
    e. Horizontal Directional Drilling Machines&lt;br/&gt;
    Additional information on machines of this type may be found in SAE J2022 and SAE J2305. This document does not apply to specialized mining machinery such as conveyors, tunnel-boring machines, pipe-jacking systems, and microtunnelers.&lt;/p&gt;</p>
