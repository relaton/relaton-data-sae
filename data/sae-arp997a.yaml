    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP covers stowage of all portable cabin emergency equipment, such as oxygen bottles/masks, fire extinguishers, first aid kits, megaphones, flashlights, axes, life rafts, survival kits, life preservers, etc. The following criteria are recommended as general provisions in conjunction with the current applicable Federal Aviation Administration requirements.&lt;/div&gt;&lt;/div&gt;</p>
