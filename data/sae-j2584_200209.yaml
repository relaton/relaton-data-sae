abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The Mounting Height Task Force was tasked to determine the extent of the problem(s) associated with vehicle headlamps mounted at or above the level of the mirror(s) in passenger vehicles; the level of glare exposure caused by high-mounted headlamps; the appropriate height differential needed to maintain a glare level consistent with past and/or current passenger vehicle headlamp mounting; and the necessary headlamp mounting height necessary to control mirror glare at an accepted/acceptable level. The report herein addresses these passenger vehicle mounting height issues.&lt;/div&gt;&lt;/div&gt;</p>
