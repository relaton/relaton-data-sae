    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for various types of identification sleeving that will shrink to a predetermined size upon the application of heat after it has been marked using AS23053 sleeves as basis material. This AS does not cover specific carrier configuration.&lt;/div&gt;&lt;/div&gt;</p>
