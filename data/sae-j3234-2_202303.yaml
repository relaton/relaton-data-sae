  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide the design specifications/requirements/guidelines for concrete divider surrogates that represent actual concrete dividers to the in-vehicle sensors and can be used for performance assessment of such in-vehicle sensing systems in real-world test scenarios/conditions. Therefore, this document only includes the recommended concrete divider surrogate characteristics for automotive cameras, LiDARs, and/or radars. Concrete dividers are also known as concrete barriers [1].&lt;/div&gt;&lt;/div&gt;</p>
