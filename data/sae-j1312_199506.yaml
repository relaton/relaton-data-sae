  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to provide a standardized test procedure for generating engine performance maps. An engine performance map is a listing of engine fuel flow rates versus torque or power obtained at specific engine speeds and loads. Engine performance maps as specified by this code can be used in fuel economy simulation programs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is applicable to both four-stroke spark ignition (SI) and compression ignition (CI) engines, naturally aspirated and pressure charged, with or without charge air cooling.&lt;/div&gt;&lt;/div&gt;</p>
