  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is intended for use by manufacturers of aircraft, engines and Electronic Engine Controls [EECs] as a component change process and evaluation guideline. Its purpose is to provide an effective means of managing the modification of electronic hardware.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The process defined in this document is based upon:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;an understanding of the electronic component market evolution, e.g., obsolescence;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;lessons learned from the effects caused by the introduction of electrical component changes in a service fleet environment;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;industry best practice; and&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;an understanding of the applicable regulations.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
