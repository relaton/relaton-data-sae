  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Solid chemical oxygen supplies of interest to aircraft operations are "chlorate candles" and potassium superoxide (KO&lt;sub&gt;2&lt;/sub&gt;). Chlorate candles are used in passenger oxygen supply units and other emergency oxygen systems, such as submarines and escape devices. Potassium superoxide is not used in aircraft operations but is used in closed-cycle breathing apparatus. Characteristics and applications of both are discussed, with emphasis on chlorate candles.&lt;/div&gt;&lt;/div&gt;</p>
