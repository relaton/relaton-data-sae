  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The objective of this report is to serve as an introductory (educational) document to cover the potential failure mechanisms related to EIS in high voltage electrical component or HV electrical equipment in aircraft power systems. It has the following contents: (1) an overview of the current understandings of potential failure mechanisms related to EIS for high voltage and high-power application in aircraft; (2) main aging stressors and aging processes of EIS in electrical components used in the aircraft power systems and their common failure modes, and (3) the key indicators to assess the status of electrical insulation degradation and related testing needs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document aims to assist HV power system designers in understanding the key considerations for EIS design and testing of HV components in aircraft, as well as the requirements for predicting their designed service life. Detailed testing guideline including testing methods will be provided in ARP7375, and life modeling in ARP7380.&lt;/div&gt;&lt;/div&gt;</p>
