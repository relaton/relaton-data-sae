  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Like the technologies to which it contributes, the science of instrumentation seems to be expanding to unlimited proportions. In considering instrumentation techniques, primary emphasis was given in this section to the fundamentals of pressure, temperature, and flow measurement. Accent was placed on common measurement methods, such as manometers, thermocouples, and head meters, rather than on difficult and specialized techniques. Icing, humidity, velocity, and other special measurements were touched on briefly. Many of the references cited were survey articles or texts containing excellent bibliographies to assist a more detailed study where required.&lt;/div&gt;&lt;/div&gt;</p>
