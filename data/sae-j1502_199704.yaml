  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1502 specifies dimensions, performance requirements, and test procedures for the male half of a diagnostic coupler with either a metric M14x1.5 or an inch 9/16–18 straight thread stud end. The coupler is designed for use with a mineral based hydraulic fluid. It is used on machines specified in SAE J1116. It does not apply to the mating hydraulic quick action couplings not on the machine.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Diagnostic couplings in accordance with this part of ISO may be used at a working pressure of 41.4 MPa (414 bar). The permissible working pressure depends upon the materials, design, working conditions, application, etc.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Conformance to the dimensional information in this part of SAE J1502 does not guarantee rated performance. Each manufacturer should perform testing according to the specification contained in this document to ensure that components comply with the performance rating.&lt;/div&gt;&lt;/div&gt;</p>
