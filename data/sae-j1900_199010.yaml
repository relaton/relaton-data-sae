  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Bond, as it relates to elastomeric seals, is defined as "The adhesion, established by vulcanization, between two cured elastomeric surfaces, or between one cured elastomeric surface and one nonelastomeric surface".&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; Vulcanization refers in this case to chemical bonding. Good bond is essential to the function of elastomeric radial lip seals and other precision. bonded parts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a universal bond test fixture developed by the RMA that can be mounted to a conventional tensile test machine. This will allow a quantitative evaluation of bond rather than a merely qualitative one.&lt;/div&gt;&lt;/div&gt;</p>
