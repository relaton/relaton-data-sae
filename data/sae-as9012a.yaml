  content: |-
    <p>&lt;p&gt;This SAE Aerospace Standard (AS) establishes documentation requirements for the First Article Inspection (FAI).&lt;/p&gt;
    &lt;p&gt;The purpose of the First Article Inspection is to provide objective evidence the all engineering design and specification requirements are properly understood, accounted for, verified, and documented. The purpose of this document is to provide a consistent documentation requirement for aerospace components First Article Inspection.&lt;/p&gt;
    &lt;p&gt;It is the intent that the documentation generated will be a quality record of the supplier and customer for review of accountability and planning, for performing periodic surveillance and audits to verify conformance, for evaluating root cause and corrective action for any non-conformance, and for problem ionvestigations.&lt;/p&gt;</p>
