  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes the characteristics and utilization of 270-VDC electric power at the utilization equipment interface and the constraints on the utilization equipment. These characteristics shall be applicable for both airborne and ground support power systems. This standard also defines the related distribution and installation considerations. Utilization equipment designed for a specific aircraft application may not deviate from these requirements without the approval of the procuring activity.&lt;/div&gt;&lt;/div&gt;</p>
