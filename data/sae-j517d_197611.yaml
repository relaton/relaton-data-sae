    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers general, dimensional, arid performance specifications for several varieties of hose intended for general application in hydraulic systems on construction and industrial equipment and commercial products.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These general specifications are common to and shall supplement the detailed specifications for the SAE 100R1, SAE 100R2, SAE 100R3, SAE 100R4, SAE 100R5, SAE 100R6, SAE 100R7, SAE 100R8, SAE 100R9, SAE 100R10, and SAE 100R11 hydraulic hoses set forth in the following sections.&lt;/div&gt;&lt;/div&gt;</p>
