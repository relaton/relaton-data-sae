  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the communication for the variety of potential functions for plug-in electric vehicle (PEV) customers. This includes features for use case items in SAE J2836/3 that may be PEV/customer optional equipment, such as AC vehicle-to-load (V2L) and AC vehicle-to-vehicle systems. These systems conform to SAE J1772 with variations required to identify to the PEV bidirectional onboard charger (OBC) the mode of operation changes and output requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE has published multiple documents relating to PEV and vehicle-to-grid (V2G) interfaces. The various document series are listed below, with a brief explanation of each.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Figure 1&lt;/span&gt; shows the sequencing of these documents and their primary function (e.g., the SAE J2836 and SAE J2847/1 documents start with smart charging, SAE J2836 and SAE J2847/2 then adds DC charging, etc.). The intent is to have subsequent slash sheets complement each other as more functions and features are included. The /6 series of documents add wireless charging items not already included in the proceeding slash sheets. These are all then included in Interoperability in SAE J2953 and security in SAE J2931/7. SAE J3072 then includes the PEV to grid requirements for V2G power and communication to match the SAE J2836/3 use cases.&lt;/div&gt;

    &lt;/div&gt;</p>
