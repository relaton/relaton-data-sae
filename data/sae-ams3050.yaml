  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This foundation specification (AMS3050) and its associated category specifications (AMS3050/1 through AMS3050/9) cover anti-seize compounds for use on threads of nuts, studs, bolts, and other mating surfaces, including those of superheated steam installations, at temperatures up to 1050 °F (566 °C). Compounds containing PTFE are limited to 600 °F/315 °C maximum. Materials for nuts, studs, bolts and other mating surfaces include, but are not limited to Steel, Nickel alloys, Stainless Steel, Silver coated materials.&lt;/div&gt;
    &lt;/div&gt;</p>
