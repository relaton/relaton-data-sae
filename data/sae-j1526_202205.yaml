  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a fuel-consumption test procedure that utilizes industry accepted data collection and statistical analysis methods to determine the difference in fuel consumption between vehicles with a gross vehicle weight of more than 10000 pounds. This test procedure can be used for an evaluation of two or more different vehicles but is not to be used to evaluate a component change. Although on-road testing is allowed, track testing is the preferred method because it has the greatest opportunity to minimize weather and traffic influences on the variability of the results. All tests shall be conducted in accordance with the weather constraints described within this procedure and shall be supported by collected data and analysis. This document provides information that may be used in concert with SAE Recommended Practices SAE J1264, SAE J1252, SAE J1321, and SAE J2966, as well as additional current and future aerodynamic and vehicle performance SAE standards.&lt;/div&gt;
    &lt;/div&gt;</p>
