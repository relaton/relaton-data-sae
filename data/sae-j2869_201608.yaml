    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report details continuing work examining the fatigue life durability of a US Army Trailer. This report describes, through example, a process to evaluate and reduce the experimental data needed for a Mechanical Systems Physics-of-Failure analysis. In addition the report describes the process used to validate the computer simulation models.&lt;/div&gt;

