  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The devices of this standard provide a method of passenger compartment dimensioning using a deflected seat rather than a free seat contour as a reference for defining seating space. A system of dimensions which may be used in conjunction with this standard is described in Section E1 of the SAE Drawing Standards. The devices described in this standard are intended for applications concerning seated occupant accommodation space only and are not to be construed as instruments which measure or indicate occupant capabilities or comfort. Additional detailed specifications and full-scale drawings of the devices may be obtained from SAE by ordering drawings supplementary to SAE J826.&lt;/div&gt;&lt;/div&gt;</p>
