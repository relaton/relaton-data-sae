  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies the characteristics of the UNJ profile inch series of screw threads, to include a mandatory controlled radius of 0.18142P to 0.15011P at the root of the external thread and with a minor diameter of both external and internal threads increased to provide a basic thread height of 0.5625H in order to accommodate the external thread maximum root radius. The following detailed requirements are included:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;UNJ basic profile and design profiles.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Standard series of diameter-pitch combinations for nominal thread diameters from .060 to 6.000 inches.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Standard thread classes and form tolerances.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Formulae for thread dimensions and tolerances.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Method of designating UNJ threads.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Acceptance and verification requirements.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;g&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Tables for selected diameter-pitch combinations for aerospace screws, bolts, nuts, shaft and bearing retaining screw threads, fluid fittings, and other component thread sizes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;h&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Tables for UNJ screw threads limiting dimensions and tolerances.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;i&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Symbols for UNJ thread dimensions and tolerances.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;

    &lt;/div&gt;</p>
