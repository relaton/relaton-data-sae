  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this Recommended Practice is to verify that vehicles and/or components are capable of communicating a required set of information, in accordance with the diagnostic messages specified in SAE J1939-73, to fulfill the off-board diagnostic tool interface requirements contained in the government regulations cited below.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document describes the tests, methods, and results for verifying diagnostic communications from an off board diagnostic tool (i.e., scan tool) to a vehicle and/or component. SAE members have generated this document to serve as a guide for testing vehicles for compliance with ARB and other requirements for emissions-related on-board diagnostic (OBD) functions for heavy duty engines used in medium and heavy duty vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The development of HD OBD regulations by US EPA and California’s Air Resources Board (ARB) require that diagnostic message services are exercised to evaluate diagnostic communication standardization requirements on production vehicles. The user should reference the summary provided by SAE J1939-73 &lt;span class="xref"&gt;Tables 1&lt;/span&gt; and &lt;span class="xref"&gt;2&lt;/span&gt; for OBD compliance support, and the discussion in SAE J1939-73 Appendix H for additional implementation concepts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The January 2016 version improved language that relies upon contextual technical details in referenced documents. An Engine Serial Number evaluation was added to &lt;span class="xref"&gt;6.1&lt;/span&gt; and &lt;span class="xref"&gt;6.2&lt;/span&gt;. Wait times for fault erasure using DM3 and DM11 were increased to 5 seconds. The transition between part 7 and part 8 was improved to better assure that DM28 tests don’t experience a false positive outcome. &lt;span class="xref"&gt;Section A.6&lt;/span&gt; was improved to separate evaluation of readiness bits provided by OBD modules from non-supported DM5 data provided by non-OBD modules. Data in &lt;span class="xref"&gt;Table A5B&lt;/span&gt; reflects the content of SAE J1939-DA of February 2015. &lt;span class="xref"&gt;Section A.10&lt;/span&gt; was added to describe processing for PGNs that are only supported by some of the OBD modules under test.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The February 2015 version of SAE J1939-84 replaced the test procedures in &lt;span class="xref"&gt;section 6&lt;/span&gt; in order to implement a 2-operating cycle failure detection process for Production Vehicle Evaluation (l)(1) as requested by ARB. The tests also exercise diagnostic executive features such as three drive cycle accounting, freeze frame management and the general denominator in addition to the demonstration of interface function. Detailed criteria for some tests are described in a normative appendix, &lt;span class="xref"&gt;Appendix A&lt;/span&gt;, which was inserted before the output report examples that are now in &lt;span class="xref"&gt;Appendix B&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The December 2008 publication of J1939-84 described a test process for EURO IV and EURO V engine emissions and diagnostics regulations, which is given in &lt;span class="xref"&gt;Section 7&lt;/span&gt;. The December 2010 version of the document added a test plan and procedure outline for ARB and US EPA HD OBD requirements with emphasis on 13 CCR 1971.1 (l)(1) Verification of Standardized Requirements, as &lt;span class="xref"&gt;Section 6&lt;/span&gt;. The June 2012 version added the observation of the MIL_On to MIL_Off transition for a single trip CCM fault and reformatted tables in &lt;span class="xref"&gt;Section 6&lt;/span&gt; to improve ease of use.&lt;/div&gt;&lt;/div&gt;</p>
