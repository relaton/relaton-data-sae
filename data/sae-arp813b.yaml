    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) recommends the maintainability features which should be considered in the design of aircraft wheels and brakes. The effect on other factors, such as, cost, weight, reliability, and compatibility with other systems should be weighed before the incorporation of any of these maintainability features into the design.&lt;/div&gt;
