    &lt;div class="htmlview paragraph"&gt;This document is the Architecture Description (AD) for the SAE Unmanned Systems (UxS) Control Segment (UCS) Architecture Library Revision B or, simply, the UCS Architecture. The architecture is expressed by a library of publications as referenced herein. The other SAE publications in the UCS Architecture Library Revision B are AS6513B and AS6518B. The library also includes the government-owned Autonomous Ground Vehicle Reference Architecture (AGVRA) Data Model Framework Version 3.1A.&lt;/div&gt;&lt;/div&gt;</p>
