    &lt;div class="htmlview paragraph"&gt;This document reviews briefly the subject of woven metal screens. Conditions that can promote damaging corrosion in stainless steel filter screens are discussed and recommendations are listed for minimizing corrosion damage. This is a general document only; for specific applications it is suggested that the reader refer to the technical literature, and selected references listed below.&lt;/div&gt;&lt;/div&gt;</p>
