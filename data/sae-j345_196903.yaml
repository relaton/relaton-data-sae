    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the best known techniques for evaluating peak and locked wheel braking traction. It covers an important phase of tire braking traction, namely, the wet or dry pavement straight ahead conditions. However, this is but a small portion of the whole field of tire traction. As test procedures are established for other phases of this complex study, additional supplementary procedures will be written. A discussion of this entire subject is contained in &lt;span class="xref"&gt;Appendix B&lt;/span&gt; to this recommended practice.&lt;/div&gt;
    &lt;/div&gt;</p>
