abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;The purpose of this AIR is to acquaint the aerospace industry with  problems in attaining electromagnetic compatibility on gas turbine engines, particularly as used in aircraft. It is also the purpose of  this AIR to present guidelines for the application of EMC controls to the engine, to its components which of necessity must operate in very hostile environments and to its interface with the aircraft.&lt;/p&gt;</p>"
