  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides an assessment of current engineering test and simulation standards and methods used to determine the fuel efficiency, freight efficiency and emissions of single-vehicle systems comprised primarily of on-road trucks and buses with GVWR of more than 10000 pounds (4535 kg). This document provides guidance on the applicability and use of each test and simulation standard, method and technology discussed for multi-vehicle systems.&lt;/div&gt;


    &lt;/div&gt;</p>
