  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides a harmonized process and documentation requirements for the establishment of CoCs used to attest the conformity of aviation, space, and defense products (e.g., assemblies, sub-assemblies, equipment and systems, parts, material, software) or services. It includes a CoC template and supporting instructions on how to complete it.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;When quoted by the customer in a contractual requirement, application of this document is mandatory. In other cases, its use is recommended, but if there is a conflict between the requirements of this standard and customer or applicable statutory/regulatory requirements, the latter shall take precedence.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Requirements for the establishment of Authorized Release Certificates (ARCs)—e.g., European Union Aviation Safety Agency (EASA) Form 1, Federal Aviation Administration (FAA) 8130-3 tag, Civil Aviation Administration of China (CAAC) Form 038—by an external provider holding a production approval (for new aviation products, production, or spares) or maintenance approval (i.e., for in service repairs, modifications, after sales maintenance, overhaul activities, inspections) are not covered by this standard, as applicable rules are defined by the aviation authorities having granted these approvals.&lt;/div&gt;&lt;/div&gt;</p>
