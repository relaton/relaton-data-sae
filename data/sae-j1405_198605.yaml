  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The procedures contained herein have been developed to establish a uniform method for comparative impulse testing of hydraulic hose assemblies with and without flexing in order to determine the effect of flexing on ultimate life of hose. The test method minimizes variables to give a comparison between flexing and non-flexing. Basic impulse test parameters are to be in accordance with SAE J343 except as modified to incorporate flexing. This test is not a requirement for SAE J517 hose.&lt;/div&gt;&lt;/div&gt;</p>
