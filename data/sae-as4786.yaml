  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers variable speed, reversible 0.375 (3/8) in chuck battery powered drills, with removable, rechargeable battery pack, used for general maintenance and construction where a battery powered tool is required. When electromagnetic interference (EMI) suppression is required by the purchaser, this document satisfies EMI requirements for driver drills.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document may involve hazardous materials, operations, or equipment. This document does not purport to address all the safety problems associated with its use. It is the responsibility of the user of this equipment to establish appropriate safety and health practices and determine the applicability of regulatory limitations prior to its use. Users are cautioned to read all manufacturer's instructions prior to use.&lt;/div&gt;
    &lt;/div&gt;</p>
