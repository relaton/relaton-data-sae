    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established metric manufacturing tolerances applicable to copper and copper alloy sheet, strip, and plate ordered to metric (SI) dimensions. These tolerances apply to all conditions, unless otherwise noted. The term "excl" is used to apply only to the higher figure of a specified range.&lt;/div&gt;&lt;/div&gt;</p>
