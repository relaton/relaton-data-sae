  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to the development of plans for the integration and management of COTS assemblies in electronic systems used in the commercial, military and space markets. COTS assemblies include items such as VPX circuit cards/modules (single board computers, etc.), servers, printers, laptop computers, printed wiring assemblies, disk drives, etc.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;This publication is not intended to preclude or discourage other approaches that similarly represent good engineering practice, or that may be acceptable to, or have been accepted by, appropriate bodies. Parties who wish to bring other approaches to the attention of the formulating committee to be considered for inclusion in future drafts of this publication are encouraged to do so. It is the intention of the formulating committee to revise and update this publication from time to time as may be occasioned by changes in technology, industry practice, or government regulations, or for other appropriate reasons.&lt;/div&gt;
