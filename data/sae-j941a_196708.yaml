  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes two-dimensional eye ranges, representative of 90th, 95th, and 99th percentile increments&lt;span class="xref"&gt;*&lt;/span&gt; of the driving population, for use in defining the driver's visual requirements to interior and exterior environments in passenger cars. It is to be used in conjunction with the two-dimensional manikin specified in SAE J826. Definitions of the interior dimensions used in this SAE Recommended Practice are listed as an appendix to this practice and are quoted from Section E1 of the SAE Aerospace-Automotive Drawing Standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Reproductions of the passenger car driver's eye range contours may be obtained from SAE by ordering eyellipse drawings supplementary to SAE J941.&lt;/div&gt;&lt;/div&gt;</p>
