  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) offers an overview of the aspects of intellectual property (IP) protection, legislative compliance, business model, and technologies which need to be considered and addressed to implement a data interoperability, secure business model and technology platform to enable prognostics and health management (PHM) in the digital age. While this information report is restricted to the aerospace domain and also to commercial aviation, the concepts are applicable to any other domain that employs data for supporting health management functionality.&lt;/div&gt;
    &lt;/div&gt;</p>
