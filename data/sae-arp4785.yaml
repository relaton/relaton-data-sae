    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes the suggested requirements and test methods for the evaluation, qualification testing, and/or acceptance testing of fuel and pneumatic couplings, quick disconnects, hydraulic fittings, and hose assemblies. The paragraphs noted herein are general words and may be modified to fit specific hardware, materials, and usage which will appear in procurement specifications.&lt;/div&gt;&lt;/div&gt;</p>
