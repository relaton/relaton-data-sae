abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard is applicable to articulated frame loaders and tractors as defined by SAE J/ISO 6165, and rollers and compactors as defined by SAE J1017, when equipped with steering, frame locking device.  The scope is limited to machines where hazards exist due to maintenance operations.

    Purpose
    This document provides the performance requirements for a steering, frame locking device which when used will prevent unintended articulation of the machine either during shipment or maintenance operations.  In addition, it provides mounting position, storage on the machine and identification requirements.</p>
