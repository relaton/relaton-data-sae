    &lt;div class="htmlview paragraph"&gt;SAE J3078/5 specifies a test method for testing defrosting systems. It is applicable to off-road self-propelled work machines as defined in SAE J1116 and agricultural tractors as defined in ANSI/ASAE S390. The full list of machines covered is included in &lt;span class="xref"&gt;Table 1&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
