  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Limited to the Aerospace industry where an approved manufacturer requests a supplier to ship an article against the approved manufacturer’s quality system directly to a customer. The direct ship process is not required or applicable to standard parts or military parts. In this process the approved manufacturer is responsible for assurance that the article conforms to Type Design information.&lt;/div&gt;&lt;/div&gt;</p>
