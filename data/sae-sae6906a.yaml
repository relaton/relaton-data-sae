  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard identifies contractor activities for planning and conducting HSI as part of procurement activities on Department of Defense (DoD) system acquisition programs. This standard covers HSI processes throughout system design, development, test, production, use, and disposal. Depending on contract phase, type of the program and/or complexity of the program, tailoring of this standard &lt;b&gt;should&lt;/b&gt; be applied. &lt;span class="xref"&gt;Appendix A&lt;/span&gt; lists the requrememts (“shall” statements) in this standard along with unique numbers to facilitate tailoring. In addition, &lt;span class="xref"&gt;Appendix D&lt;/span&gt; provides tailoring guidance to better match requirememts in this standard to the DoD’s Adaptive Acquisition Framework pathways. The scope of this standard includes prime and subcontractor HSI activities; it does not include Government HSI activities, which are covered by DoD and service-level regulations and guidelines. HSI programs &lt;b&gt;should&lt;/b&gt; use the latest version of standards and handbooks listed below, unless a particular revision is specifically cited in the contract.&lt;/div&gt;&lt;/div&gt;</p>
