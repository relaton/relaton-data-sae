  script: Latn
  content: "<p>Primarily for use as filler metal for gas-metal-arc and gas-tungsten-arc welding, including repair welding, of aluminum alloy castings. Where casting service conditions require good corrosion resistance, maximum strength, and homogeneity, filler metal should be of the same alloy as the casting.</p>"
