  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to both Original Equipment Manufacturer and aftermarket route-guidance and navigation system functions for passenger vehicles. It establishes two alternative procedures, a static method and an interrupted vision method, for determining which navigation and route guidance functions should be accessible to the driver while the vehicle is in motion. These methods apply only to the presentation of visual information and the use of manual control inputs to accomplish a navigation or route guidance task.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The document does not apply to visual monitoring tasks which do not require a manual control input, such as route following. Voice-activated controls or passenger operation of controls are also excluded.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;There are currently no compelling data that would support the extension of this document to in-vehicle systems other than navigation systems.&lt;/div&gt;&lt;/div&gt;</p>
