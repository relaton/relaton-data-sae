    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Standard is the definition of the functional, environmental, and life cycle test requirements for electrically operated backup alarm devices primarily intended for use on off-road, self-propelled work machines as defined by SAE J1116 JUN86 (limited to categories of 1) construction, and 2) general purpose industrial).&lt;/div&gt;
