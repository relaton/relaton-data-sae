abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document (AIR6005) provides the framework for the specifications of a WDM OBN within the SAE AS5659 WDM LAN Specification document family, in particular, the Transparent Optical Backbone Network Specification. This framework includes potential requirements, technical background, investigation and context to support the writing of SAE’s WDM LAN specifications documents. The SAE’s AS6005 WDM OBN document describes a transparent optical network which contains optical components and optical interfaces to perform optical transport, optical add/drop, optical amplification, optical routing, and optical switching functions. The conforming &lt;b&gt;&lt;i&gt;optical&lt;/i&gt;&lt;/b&gt; signal interfaces for the data plane of the WDM OBN are defined. The conforming signal interfaces for the control and management planes of this network are also defined. The control and management plane signals may be either electrical or optical. If successful, a WDM LAN standard is anticipated to include multiple variants that may get created either as separate documents (e.g. a multimode and single-mode specification) and additional documents may be needed to specify the components from which a WDM LAN and OBN will be built.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The WDM OBN specification is to be established in a future document, SAE AS5659. This AIR document is a requirements document that provides input regarding the WDM OBN to the AS5659 Aerospace Standard. Additional documents are anticipated to specify aggregation of access for multiple systems that interface to the OBN. The transition from electrical communications links to optically multiplexed networks, is anticipated to involve aggregation of slower speed signals as necessary part of a cost effective transition.&lt;/div&gt;&lt;/div&gt;</p>
