  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Surface Vehicle &amp;amp; Aerospace Recommended Practice offers best practices and a methodology by which IVHM functionality relating to components and subsystems should be integrated into vehicle or platform level applications. The intent of the document is to provide practitioners with a structured methodology for specifying, characterizing and exposing the inherent IVHM functionality of a component or subsystem using a common functional reference model, i.e., through the exchange of design-time data and the application of standard vehicle data communications interfaces. This document includes best practices and guidance related to the specification of the information that must be exchanged between the functional layers in the IVHM system or between lower-level components/subsystems and the higher-level control system to enable health monitoring and tracking of system degradation severity. The intent is to provide an IVHM system that can robustly report the degradation of a given component before it reaches the point where it goes outside its operational performance envelope by providing sufficient advance notice to deal with the issue. This document does not specify or address how each layer in the IVHM system produces or uses the data available for exchange.&lt;/div&gt;
    &lt;/div&gt;</p>
