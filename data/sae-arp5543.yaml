    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the recommended design, construction, performance and testing requirements for aircraft wheel inflation valves incorporating an inflation pressure gauge which are mounted on the aircraft wheel. These valve/gauge assemblies should be appropriate for use on all aircraft types supported by tubeless tire/wheel assemblies.&lt;/div&gt;&lt;/div&gt;</p>
