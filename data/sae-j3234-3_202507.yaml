  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide the design specifications/requirements/guidelines for concrete curb surrogates that represent actual concrete curbs to the in-vehicle sensors and can be used for performance assessment of such in-vehicle sensing systems in real-world test scenarios/conditions. Therefore, this document only includes the recommended concrete curb surrogate characteristics for automotive cameras, LiDARs, and/or radars.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is focused only on the concrete curb and not on the asphalt curb, which is not common.&lt;/div&gt;&lt;/div&gt;</p>
