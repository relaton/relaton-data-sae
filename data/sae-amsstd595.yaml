  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard presents the colors used by Government Activities in a format suitable for color selection, color matching and for quality control inspection. This document describes the designation and use of the color chips of this standard. Formats for color chip representation and precise color matching formats are as described below:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Color Chip Representation, Fan Deck: Suitable for color identification and selection.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Color Chip Representation, Color Book: Suitable for color identification, comparison and selection.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Precise Color Matching, Individual Color Chips: A 3 × 5 inch color chip supplied in a 3 × 5 inch protective envelope, suitable for color matching and quality control inspection purposes.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Precise Color Matching, Sets of Color Chips: A set containing one 3 × 5 inch color chip in its protective envelope for each Fed-Std-595 color, suitable for color matching and quality control inspection purposes.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
