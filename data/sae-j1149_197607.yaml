  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This SAE standard covers minimum requirements for two &lt;i&gt;types&lt;/i&gt; of metallic tubing and pipe as used in automotive air brake systems. It includes material and performance specifications, corrosion precautions, and installation recommendations. Copper tubing is designated &lt;i&gt;Type 1&lt;/i&gt;, and galvanized steel pipe &lt;i&gt;Type 2&lt;/i&gt;.&lt;/div&gt;&lt;/div&gt;</p>
