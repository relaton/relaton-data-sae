  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for axially swaged titanium fittings on titanium, CRES, and aluminum tubing with flareless separable fitting ends for use in hydraulic supply and return aerospace fluid systems up to operating pressure of 5080 psig (35000 kPa) maximum. The operating temperature range for titanium tubing and CRES tubing is -65 to +275 °F (-54 to +135 °C) and the operating temperature range for aluminum return system tubing is -65 to +225 °F (-54 to +107 °C).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification covers a common 5080 psi pressure titanium fitting that may be used for a range of operating pressures up to 5080 psi with different tubing materials and tubing wall thicknesses and is assembled with the same tooling in accordance with AS5959. The flareless fitting operating pressure is based on the fitting thread pitch. Extra fine pitch is used for 5080 psi operating pressure and fine pitch for operating pressures 3000 psi and less. &lt;span class="xref"&gt;Table 14&lt;/span&gt; shows applicable aerospace fitting part number standard and tubing materials and operating pressures.&lt;/div&gt;
    &lt;/div&gt;</p>
