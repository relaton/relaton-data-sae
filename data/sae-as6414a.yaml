    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification is applicable to the processes that are used in the manufacture of aerospace elastomer parts utilizing materials conforming to AMS7XXX series specifications, user specifications, or print on a Purchase Order (PO) that calls out this document for aerospace applications. The elastomer parts are in the form of O-rings, plate seals and other compression seals.&lt;/div&gt;&lt;/div&gt;</p>
