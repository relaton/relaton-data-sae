  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To provide a means of comparing the performance characteristics of automatic transmissions. It outlines dynamometer tests that cover the range of operation of transmissions and provides a method of presenting the test data. This procedure must be followed with similar test facilities so that results obtained from different laboratories are comparable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For this SAE Recommended Practice, the transmission is defined as the complete assembly driven by the engine and used to effect a ratio change in transmitting power to the final drive system.&lt;/div&gt;&lt;/div&gt;</p>
