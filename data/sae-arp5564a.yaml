  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This aerospace recommended practice provides definition for Airport Runway Brooms and covers requirements for various configurations of runway brooms with and without a carrier vehicle. Runway brooms are primarily used to move and clear snow and ice down to bare pavement on airport operational areas such as runways, taxiways and ramp areas. The term carrier vehicle represents the various self-propelled prime movers that provide the forward motion of the various configurations of runway brooms.&lt;/div&gt;
    &lt;/div&gt;</p>
