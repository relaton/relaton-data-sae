  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers fuel and oil hose, coupled and uncoupled, for use with gasoline, oil, diesel fuel, lubrication oil, or the vapor present in either the fuel system or in the crankcase of internal combustion engines in mobile, stationary, and marine applications. &lt;span class="xref"&gt;Section 7&lt;/span&gt; covers hose primarily intended to meet the demands of fuel injection systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 3&lt;/span&gt; covers Coupled and Uncoupled Synthetic Rubber Tube and Cover (SAE 30R2).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 4&lt;/span&gt; covers Lightweight Braided Reinforced Lacquer, Cement, or Rubber Covered Hose (SAE 30R3).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 5&lt;/span&gt; covers Wire Inserted Synthetic Rubber Tube and Cover (SAE 30R5).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 6&lt;/span&gt; covers Low-Pressure Coupled and Uncoupled Synthetic Rubber Tube and Cover (SAE 30R6), (SAE 30R7), (SAE 30R8).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 7&lt;/span&gt; covers Fuel Injection Hose Medium-Pressure Coupled and Uncoupled Synthetic Rubber Tube and Cover (SAE 30R9).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 8&lt;/span&gt; covers In-Tank, Low-Pressure, Uncoupled Fuel Hoses (SAE 30R10).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Section 9&lt;/span&gt; covers Unified Method for Fuel Hose Permeation.&lt;/div&gt;&lt;/div&gt;</p>
