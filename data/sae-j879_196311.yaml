  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform test procedures and certain minimum performance requirements for passenger car seats and seat adjusters. It is limited to tests that can be conducted on uniform test fixtures and equipment available in commercial laboratory test facilities.&lt;span class="xref"&gt;*&lt;/span&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This practice includes a minimum requirement for horizontal forward loads encountered in vehicle forward impacts, and horizontal rearward loads obtained by impacting the vehicle from the rear. The requirements and test procedures in this report reflect current technology and industry experience. It is intended to subject the report and its content to a continuing review and revision as technology advances and experience is expanded. Thus, it is intended to eventually include requirements and test procedures for lateral loadings as definite data is obtained.&lt;/div&gt;&lt;/div&gt;</p>
