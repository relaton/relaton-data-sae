    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for 24° cone flareless fluid connection fittings and nuts and bite type flareless sleeves (see &lt;span class="xref"&gt;Section 6&lt;/span&gt;) for use in aircraft fluid systems at an operating pressure of 5000 psi for the fittings and nuts and 3000 psi for the bite type sleeves.&lt;/div&gt;&lt;/div&gt;</p>
