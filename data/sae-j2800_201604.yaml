  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This lab test procedure should be used when evaluating the combined corrosion and fatigue performance for a particular coating system, substrate, process and design. The test is intended to provide an A to B comparison of a proposed coil spring design versus an existing field validated coil spring when subjected to the combined effects of corrosion and fatigue. The corrosion mechanisms covered by this test include general, cosmetic and pitting corrosion. Fatigue testing covers the maximum design stress and/or stress range of the coil spring design (typically defined as excursion from jounce to rebound positions in a vehicle). The effects of gravel and heat are simulated by pre-conditioning the springs prior to fatigue testing. Time dependant corrosion mechanisms such as stress corrosion cracking are not addressed with this test.&lt;/div&gt;&lt;/div&gt;</p>
