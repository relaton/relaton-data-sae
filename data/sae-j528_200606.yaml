abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard covers minimum requirements for soft (061) annealed seamless copper tube intended for automotive and general purposes. (Comparable specifications are ASTM B 75.  Other copper tube is covered in SAE J463.) The tube shall be cold drawn to size and after forming shall be annealed in such a manner as to produce a finished product which will meet all requirements of this standard.</p>"
