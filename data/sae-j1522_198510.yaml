    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes two-dimensional 95th percentile truck driver side view, seated stomach contours for horizontally adjustable seats (&lt;span class="xref"&gt;Fig. 1&lt;/span&gt;). There is one contour and three locating lines to accommodate male/female ratios of 50/50, 75/25 and 90/10 to 95/5.&lt;/div&gt;&lt;/div&gt;</p>
