    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the general physical, electrical, functional and performance requirements to facilitate conductive charging of EV/PHEV vehicles in North America. This document defines a common EV/PHEV and supply equipment vehicle conductive charging method including operational requirements and the functional and dimensional requirements for the vehicle inlet and mating connector.&lt;/div&gt;&lt;/div&gt;</p>
