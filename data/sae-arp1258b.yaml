  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes the method for qualification testing of tube joints and fitting attachments, using the flexure test method described in ARP1185. This qualification test method allows the determination of S-N type stress versus cycles or D-N type deflection versus cycles curves, as illustrated in ARP1418 as an alternate to flexture testing to a minimum endurance stress level.&lt;/div&gt;&lt;/div&gt;</p>
