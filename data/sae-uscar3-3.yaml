    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The procedures contained in this specification cover the laboratory testing of miniature incandescent bulbs for use in automotive illumination and signaling applications. The following tests shall be run whenever the following occurs:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;New bulb design&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Design or process change made to an existing bulb, which could affect the outcome of the test.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
