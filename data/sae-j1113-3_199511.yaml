  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This part of SAE J1113 specifies the direct RF power injection test method and procedure for testing electromagnetic immunity of electronic components for passenger cars and commercial vehicles. The electromagnetic disturbances considered in this part of SAE J1113 are limited to continuous, narrowband conducted RF energy.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This test method is applicable to all DUT leads except ground. The test provides differential mode excitation to the DUT.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Immunity measurements of complete vehicles are generally only possible by the vehicle manufacturer. The reasons, for example, are high costs of a large absorber-lined chamber, preserving the secrecy of prototypes or the large number of different vehicle models. Therefore, for research, development, and quality control, a laboratory measuring method for components shall be applied by the manufacturer. This method is suitable over the frequency range of 250 kHz to 500 MHz.&lt;/div&gt;&lt;/div&gt;</p>
