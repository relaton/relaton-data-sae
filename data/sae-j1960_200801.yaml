  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method specifies the operating procedures for a controlled irradiance, water-cooled xenon arc apparatus used for the accelerated exposure of various automotive exterior materials.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard is limited to the models of xenon arc test apparatus specified in the Section on Apparatus.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All other models of xenon arc test apparatus must use SAE J2527 to perform the test conditions specified in SAE J1960. SAE J2527 is the performance standard based on the test parameters of SAE J1960. Use of xenon arc test apparatus to perform SAE J2527 must be agreed upon by contractual parties.&lt;/div&gt;&lt;/div&gt;</p>
