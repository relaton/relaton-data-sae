    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a fluorocarbon elastomer that can be used to manufacture product in the form of sheet, strip, tubing, extrusions, and molded shapes. For molded rings, molded compression seals, and molded-in-place gaskets for aeronautical and aerospace applications, use the AMS7379 specification.&lt;/div&gt;&lt;/div&gt;</p>
