  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The environment and test waveforms defined in this SAE Aerospace Recommended Practice (ARP) account for the best lightning data and analysis currently available. The quantified environment and levels herein represent the minimum currently required by certifying authorities, which is consistent with the approach applied in related lightning documents.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Lightning, like other weather phenomenon, is probabilistic in nature. Levels and waveforms vary considerably from one flash to the next. Within this document, standardized voltage and current waveforms have been derived to represent the lightning environment external to an aircraft. These standardized waveforms are used to assess the effects of lightning on aircraft. The standardized external current waveforms have, in turn, been used to derive standardized transient voltage and current test waveforms that can be expected to appear on cable bundles and at equipment interfaces within an aircraft. When deriving these latter internal induced test waveforms, considerations such as testability and important waveform characteristics that can demonstrate lightning design effectiveness have been taken into account.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The parameters of the standardized waveforms, both external and derived internal induced transients, represent severe versions of each of the characteristics of natural lightning flashes and include all parameters of interest with respect to lightning protection for aircraft. These standardized waveforms are thus referred to as idealized standard lightning environment waveforms, idealized standard waveforms, or just idealized waveforms within this document. The waveforms associated with the external environment are termed the idealized standard external lightning environment. The waveforms associated with the internal induced environment are termed the idealized standard induced transient waveforms.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In every case, more severe versions of each of the individual characteristics of the idealized standard external lightning environment waveforms have been recorded in natural lightning flashes. The more severe individual characteristics of the idealized standard external lightning environment waveforms have never been recorded together within a single lightning flash. Therefore, the parameters combined in the idealized standard lightning environment waveforms provided in this document represent a very severe environment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The waveforms provided in this ARP are considered to be adequate for the demonstration of compliance for the protection of an aircraft and its systems against the lightning environment and should be applied in accordance with the aircraft lightning strike zones (refer to ARP5414) and test methods (refer to ARP5416) and applicable FAA and EASA advisory and interpretive material.&lt;/div&gt;
    &lt;/div&gt;</p>
