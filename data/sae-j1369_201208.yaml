  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides design guidelines to vehicle manufacturers by establishing the characteristics of top tether anchorage provisions required for securing child restraints so equipped in forward facing rearmost designated passenger seating positions of all passenger cars, multipurpose passenger vehicles, and trucks and buses of 4500 kg (10 000 lb) Gross Vehicle Weight Rating or less, accommodating six occupants or less. Further, it provides interface information to child restraint manufacturers.&lt;/div&gt;&lt;/div&gt;</p>
