    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to provide uniform guidelines for the application of starter motor pinions and ring gears. SAE J543 contains guidelines for the use of diametral pitch gearing. The pinion data shown are based on the Fellows stub tooth system. Refer to ISO 8123, ISO 9457-1, and ISO 9457-2 for module gearing, and corresponding metric dimensions.&lt;/div&gt;&lt;/div&gt;</p>
