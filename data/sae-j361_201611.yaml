    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to parts and materials used in vehicle manufacture which are intended to be acceptable color matches to a specified standard. This document is intended for use with parts or materials which are opaque or nearly so. Materials covered by this document include topcoat paint finishes, interior soft trim, interior and exterior hard trim, and exterior film and flexible trim. This practice requires judgments by observers with a minimum of normal color vision and preferably superior as rated with the FM-100Hue Test as specified in ASTM E1499, Guide for Selection, Evaluation, and Training of Observers.&lt;/div&gt;
    &lt;/div&gt;</p>
