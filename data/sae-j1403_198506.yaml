  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;Vacuum brake hose is intended for use in the power braking systems of vehicles or as connections on transmission lines in combinations of vehicles or systems thereof. For the purpose of clearly identifying the scopes and simplification of the specification, the vacuum brake hose specification is divided into two types with two classes as follows: Heavy-Wall Type H, Class A and B and Light-Wall Type L, Class A and B.&lt;/div&gt;
    &lt;/div&gt;</p>
