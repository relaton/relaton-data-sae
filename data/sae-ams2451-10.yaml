    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the engineering requirements and process for brush plating of tin-zinc by electrodeposition. It is used, in conjunction with AMS 2451, for corrosion-protective, tin-zinc deposits, which may allow omission of hydrogen embrittlement relief treatment of high-strength steels.&lt;/div&gt;&lt;/div&gt;</p>
