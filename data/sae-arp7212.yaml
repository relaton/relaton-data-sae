  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) provides recommendations for the design and test requirements for hydraulic flow regulators (also known as flow control valves).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The hydraulic flow regulator is intended for use in a civil or a military aircraft hydraulic system with a rated system pressure up to 5000 psi (34500 kPa).&lt;/div&gt;

    &lt;/div&gt;</p>
