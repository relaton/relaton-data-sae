    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides design criteria for onboard stairways intended for use by passengers aboard multi-deck transport category airplanes. It is not intended for stairways designed for use only by crewmembers, supernumeries, or maintenance personnel. Additionally, this AS does not apply to fuselage mounted or external stairways used for boarding passengers, which are covered by ARP836.&lt;/div&gt;&lt;/div&gt;</p>
