  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Operator Self-Verification can apply to a variety of processes. The primary focus is on traditional manufacturing operations, but applications can be made wherever traditional inspection methods are employed. The practices recommended in this document are intended to identify the basic elements for structuring Operator Self-Verification programs within the aerospace industry; applicable to producers of commercial and military aircraft and weapons platforms, space vehicles, and all related hardware, software, electronics, engines and composite components. Operator Self-Verification programs are applied to improve overall efficiency and product quality to processes considered mature, as judged by the organization. Operator Self-Verification programs are not stand-alone processes, but augment existing quality management system standard requirements. The identified program elements are for voluntary organizational application, and are not intended for contractual flow-down unless otherwise stipulated through contractual agreement.&lt;/div&gt;
    &lt;/div&gt;</p>
