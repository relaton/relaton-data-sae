  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE J2954 standard establishes an industry-wide specification that defines acceptable criteria for interoperability, electromagnetic compatibility, EMF, minimum performance, safety, and testing for wireless power transfer (WPT) of light-duty plug-in electric vehicles. The specification defines various charging levels that are based on the levels defined for SAE J1772 conductive AC charge levels 1, 2, and 3, with some variations. A standard for WPT based on these charge levels enables selection of a charging rate based on vehicle requirements, thus allowing for better vehicle packaging and ease of customer use. The specification supports home (private) charging and public wireless charging.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In the near term, vehicles that are able to be charged wirelessly under SAE J2954 should also be able to be charged conductively by SAE J1772 plug-in chargers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J2954 addresses unidirectional charging, from grid to vehicle; bidirectional energy transfer may be evaluated for a future standard. This standard is intended to be used in stationary applications (charging while vehicle is not in motion); dynamic applications may be considered in the future. In this version, only above-ground (surface mounted) installations are covered; flush mounted installations have been discussed but are not yet ready for inclusion.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J2954 contains requirements for safety, performance, and interoperability. It also contains recommended methods for evaluating electromagnetic emissions, but the requirements and test procedures are controlled by regulatory bodies. Development of the interoperability requirements in this standard employed a performance-based evaluation of candidate designs using a standardized test station and procedures, resulting in defining reference devices which are used to determine acceptable performance of products.&lt;/div&gt;
    &lt;/div&gt;</p>
