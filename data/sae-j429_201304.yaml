  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the mechanical and material requirements for inch-series steel bolts, screws, studs, screws for sems&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;, and U-bolts&lt;span class="xref"&gt;&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt; in sizes to 1-1/2 in. inclusive.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The term “stud” as referred to herein applies to a cylindrical rod of moderate length threaded on either one or both ends or throughout its entire length. It does not apply to headed, collared, or similar products which are more closely characterized by requirements shown herein for bolts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The mechanical properties included in &lt;span class="xref"&gt;Table 1&lt;/span&gt; were compiled at an ambient temperature of approximately 20 °C (68 °F). These properties are valid within a temperature range which depends upon the material grade used and thermal and mechanical processing. Other properties such as fatigue behavior, corrosion resistance, impact properties, etc., are beyond the scope of this document and responsibility for ensuring the acceptability of the product for applications where conditions warrant consideration of these other properties shall be borne by the end user.&lt;/div&gt;&lt;/div&gt;</p>
