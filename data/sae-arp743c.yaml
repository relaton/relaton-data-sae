  content: |-
    <p>&lt;p&gt;This document has been decalred "CANCELLED" as of May 2010. By this action, this document will remain listed in the Numercial Section of the Aerospace Standards Index.&lt;/p&gt;
    &lt;p&gt;This SAE Aerospace Recommended Practice (ARP) describes two procedures for sampling particles in dust controlled spaces. One procedure covers airborne dust above 5 μm. The other (and newly added procedure) covers particles of 25 μm and larger that "fall out" of the environment onto surfaces. In each case the particles are sized in the longest dimension and counted. Airborne particles are reported as particles per cubic meter (cubic foot) whereas particles collected in fall out samples are reported as particles per 0.1 square meter (square foot). This document includes English units in parentheses as referenced information to the SI units where meaningful.&lt;/p&gt;</p>
