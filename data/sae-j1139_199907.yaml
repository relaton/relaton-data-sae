    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to present design recommendations for the direction-of-motion of hand controls found in passenger vehicles, multipurpose vehicles, and trucks. These recommendations are based on recent and past human factors research and are important considerations in the design of control layouts. This document supersedes Figure 1 of SAE J1139 (9).&lt;/div&gt;
    &lt;/div&gt;</p>
