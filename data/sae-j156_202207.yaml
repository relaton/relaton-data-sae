    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers supplemental requirements for low tension primary cable intended for use as Fusible Links (Fuse Links) at a nominal system voltage of 60 V DC (25 V AC) or less in surface vehicle electrical systems. These supplemental requirements are intended to qualify cables for an extreme current overload.&lt;/div&gt;&lt;/div&gt;</p>
