  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report attempts to provide a list of potential digital data recording devices that may be interrogated for forensic purposes. This list may not be exhaustive, but it lists sources of data that may be useful in the investigation of incidents such as motor vehicle collisions. This list is not intended to give instruction on how to access and preserve the data. This list is only to inform investigators that these known data sources may contain important information and should, if applicable, be searched for and queried. It is recognized that as the state of technology advances there may be additional data sources that become available.&lt;/div&gt;&lt;/div&gt;</p>
