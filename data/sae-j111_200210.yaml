abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this SAE Recommended Practice is to provide a glossary
    of radial seal terms and nomenclature which are normally encountered in the design,
    manufacture, installation, testing, inspection, and failure mode analysis of radial
    seals.  The information will aid in the understanding and communication among
    those people associated with radial seals.</p>"
