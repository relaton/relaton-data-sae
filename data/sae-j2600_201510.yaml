  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J2600 applies to the design and testing of Compressed Hydrogen Surface Vehicle (CHSV) fueling connectors, nozzles, and receptacles. Connectors, nozzles, and receptacles must meet all SAE J2600 requirements and pass all SAE J2600 testing to be considered as SAE J2600 compliant.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to devices which have Pressure Classes of H11, H25, H35, H50 or H70.&lt;/div&gt;
    &lt;/div&gt;</p>
