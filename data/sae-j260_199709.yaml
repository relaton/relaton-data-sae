abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice is intended to provide a uniform basis
    for evaluating the effectiveness of rear underride devices employed to reduce
    the likelihood of penetration of the passenger compartment of an impacting vehicle.
    The procedures described in this report provide means for determining the characteristics
    of rear underride guard, taking into consideration the nature and direction of
    forces involved.</p>"
