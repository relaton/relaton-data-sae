  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The specific purpose of this AIR is to provide general background information to better acquaint those who are involved with ramp de-icing of aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Because the wide variance of atmospheric conditions at different airports, as well as at any individual airport, the figures given are of a general nature only and are to be taken as a very rough guide to the various factors concerned with ramp de-icing.&lt;/div&gt;&lt;/div&gt;</p>
