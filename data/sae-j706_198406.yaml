  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies only to new winches which are primarily designed for intermittent pulls and lifts and whose configuration and condition are the same as when they were shipped by the manufacturer. They are not intended to be used in any manner for the movement of personnel. They may be driven by any power source recommended by the manufacturer and will be capable of being powered in either direction. They will be equipped with an automatic safety brake system to control a load when lowering under power and positively hold a load when power is not being delivered to the winch. A hydraulic flow control valve or similar device may be used in the brake system to control a load when lowering under power. A clutch to release the drum for “free-spooling” may be provided and will be designed not to disengage itself under load. A drag brake may be provided to control “free-spooling,” but will not be relied on to control or hold a load. Power sources, such as hydraulic motors, even though they may be supplied or recommended by the winch manufacturer, are not considered a part of the winch so far as this standard is concerned, except to whatever extent they are a part of the brake system.&lt;/div&gt;&lt;/div&gt;</p>
