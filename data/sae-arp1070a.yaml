  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the general requirements for aircraft skid control systems and their components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Methods of defining skid control system performance criteria for design and evaluation purposes are outlined and recommended.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Design and operational goals, general theory, and functions, which must be considered by the aircraft brake systems engineer to attain the most effective skid control performance, are covered in detail.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Recommended methods for measuring performance of skid control systems are included.&lt;/div&gt;&lt;/div&gt;</p>
