  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Standard covers air data equipment (hereinafter designated the instrument) which when connected to sources of aircraft electrical power, static pressure, total pressure and outside air temperature (singly or in combination) provides some or all of the following computed air data output signals:
    &lt;div class="table-wrap anchor "&gt;
    &lt;div class="table-container"&gt;&lt;table class="br-none tbr-void " data-dataset-id=""&gt;
    &lt;tbody&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Pressure Altitude&lt;span class="xref"&gt;*&lt;/span&gt;&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Total Temperature&lt;span class="xref"&gt;*&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Pressure Altitude (Reporting)&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Altitude Rate&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Baro-Corrected Pressure Altitude&lt;span class="xref"&gt;*&lt;/span&gt;&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Overspeed Warning&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Vertical Speed&lt;span class="xref"&gt;*&lt;/span&gt;&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Altitude Hold&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Computed Airspeed&lt;span class="xref"&gt;*&lt;/span&gt;&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Airspeed Hold&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Mach Number&lt;span class="xref"&gt;*&lt;/span&gt;&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;Mach Hold&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;Maximum Allowable Airspeed&lt;span class="xref"&gt;*&lt;/span&gt;&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;q&lt;sub&gt;c&lt;/sub&gt; (impact pressure)&lt;/td&gt;&lt;/tr&gt;
