  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines the requirements for a threaded flexible coupling assembly, which utilizes ferrules or machined tube end fittings to join tubing and components in aircraft fuel and fuel vent or other systems. This coupling assembly is designed for use from -65 to +200 °F and at 125 psig peak working pressure, and the coupling assembly may be used in other fluid systems when requirements are within the limits.&lt;/div&gt;&lt;/div&gt;</p>
