  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the determination of tire pull force properties for an uninclined tire (SAE J670e) on a laboratory flat surface tire force and moment machine. It is suitable for accurately determining pull forces and residual aligning moments for passenger and light-truck tires. These properties are important determinants of vehicle trim (See &lt;span class="xref"&gt;section 2.1.2&lt;/span&gt;). They describe steady-state, free-rolling pull effects ascribable to tires.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test method described in this document is suitable for comparative evaluation of tires for research and development purposes. The method is also suitable for modeling when followed carefully.&lt;/div&gt;&lt;/div&gt;</p>
