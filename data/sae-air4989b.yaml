    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) developed by a broad cross section of personnel from the aviation industry and government agencies is offered to provide state-of-the-art information for the use of individuals and organizations designing new or upgraded turboshaft engine test facilities. This document is also applicable to turboprop engines tested with a dynamometer as load absorption device, as they are basically tested as turboshaft engines. For propeller-equipped turbofan testing facilities design considerations, see 2.1.7.&lt;/div&gt;
    &lt;/div&gt;</p>
