  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;All glazing materials used in motor vehicles operating on land highways should comply with the requirements of the American National Standard, ANSI/SAE Z-26.1. The American National Standard for Safety Glazing Materials for Glazing Motor Vehicle Equipment Operating on Land Highways - Safety Code, ANSI/SAE Z-26.1-1990 is the most recent complete updated version and is referred to hereafter as "the safety code." This SAE Recommended Practice is not intended to preclude references to any governmental law, ordinance, or regulation which might apply to the glazing of motor vehicles operating on land highways.&lt;/div&gt;&lt;/div&gt;</p>
