  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to offer simplified and prioritized guidelines for collecting and preserving on-scene data related to motor vehicle accidents. It is intended that these guidelines improve the effectiveness of data collection, which will assist subsequent analysis and reconstruction of a particular incident.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The document is to guide early data collectors whose objectives include documenting information related to the incident. It may be used by law enforcement personnel, safety officials, insurance adjusters and other interested parties.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The document identifies categories of scene physical features that deteriorate relatively quickly and recommends documentation task priorities. Detailed methods of collecting data are not part of this document. However, some widely used methods are described in the references in &lt;span class="xref"&gt;Section 2&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
