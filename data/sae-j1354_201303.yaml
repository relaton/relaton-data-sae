- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice identifies major components and parts peculiar to forwarders.  Illustrations used here are not intended to include all existing machines or to be exactly descriptive of any particular machine.  They have been provided to illustrate the principles to be used in applying this document.  Purpose The purpose of this document is to provide standardization of terms for major components of forwarders.</p>"
