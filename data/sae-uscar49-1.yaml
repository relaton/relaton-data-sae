  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document contains procedures for performance testing of electrical terminals, connectors, and components for coaxial-style cable with an outside cable diameter of 3.6 mm and smaller. These are often called “mini coax connector systems.” This specification applies to coaxial cable connection systems that operate at frequencies from DC to 9 GHz and are intended for road vehicles. The characteristic impedance of the mini coax connection system described here is 50 Ω, however nothing excludes the use of these connectors in systems with a different characteristic impedance. This specification applies only to connection systems using coaxial cable.&lt;/div&gt;&lt;/div&gt;</p>
