  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report identifies the reasons for, and results associated with, the conduct of a flight simulation research project evaluating the effect of low powered laser beam illumination of pilot crewmembers operating in the navigable airspace. This evaluation was primarily concerned with the possible degradation of pilot performance when illuminated by a laser while operating in an airport terminal area where pilot workloads are normally at their maximum.&lt;/div&gt;
    &lt;/div&gt;</p>
