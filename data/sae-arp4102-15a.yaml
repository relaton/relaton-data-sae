  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) recommends criteria for an Electronic Data Management System (EDMS) for use on the flight deck of transport aircraft. The EDMS may be the primary, and in some cases sole, on board source of documentation and information for flight operations, engineering, aircraft maintenance, cabin services, and training. This document addresses flight operations applications only. It addresses the requirements for the flight deck characteristics of airborne equipment elements for an Electronic Data Management System (EDMS), but not the ground support system requirements. Development of ground support systems for EDMS will be a significant task, which must take account of the end-user information handing requirements specified here. An Electronic Library System (ELS) is a partial implementation of EDMS, which incorporates only the data storage, retrieval and display functions. The appropriate aspects of this document are applicable to Electronic Library Systems.&lt;/div&gt;&lt;/div&gt;</p>
