  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes flexure test procedures to determine and classify the fatigue strengths of reconnectable or permanent hydraulic tube joints.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The procedure is intended for conducting flexure tests of fittings and joints with high strength hydraulic tubes of various alloys such as corrosion resistant steel, Nimonic, titanium and aluminum alloy hydraulic tube for use on commercial and military aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A mean stress is applied by holding system pressure in the specimens and then flexing in a rotary bending test machine. This test method conforms with ARP 1185 for inch-dimensioned tubing and fittings.&lt;/div&gt;&lt;/div&gt;</p>
