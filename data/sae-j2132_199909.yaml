  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;It is anticipated that this SAE Recommended Practice will be only one step in a comprehensive evaluation of the vehicle/transmission application. This document alone is not adequate “due care” to insure against high-speed seizure or other high-speed problems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;The notes printed in bold print throughout the practice convey important information about the test itself or the results and should be considered carefully.&lt;/b&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All references to transmissions also apply to transaxles, except for the unbalance evaluation which applies only to rear-wheel-drive transmissions with propeller shaft output.&lt;/div&gt;
    &lt;/div&gt;</p>
