abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This document lists military and industry specifications and standards that are considered to be of particular interest to designers of marine vehicle hydraulic systems. SAE AIR737 lists additional aerospace hydraulic documents which occasionally may have application in marine hydraulic systems.&lt;/p&gt;
    &lt;p&gt;This report is intended to assist marine hydraulic system designers in identifying military and industry specifications and standards that are suitable for use in marine hydraulic systems. The documents are listed according to specific categories and components. Documents that can be identified with more than one category are listed accordingly. The user is cautioned to use the latest revision of each document and to review the document carefully to determine the suitability of the document for the particular applications.&lt;/p&gt;</p>
