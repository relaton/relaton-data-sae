  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Information Report (AIR) is to provide information that would be useful to potential users/operators and decision makers for evaluating and quantifying the benefits of an Engine Monitoring Systems (EMS) versus its cost of implementation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document presents excerpts from reports developed to analyze “actual aircraft cost/benefits results”. These are presented as follows:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;First, to outline the benefits and cost elements pertaining to EMS that may be used in performing a cost versus benefits analysis.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Second, to present considerations for use in conducting the analysis.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Third, to provide examples of analyses and results as they relate to the user/operator and decision-maker community.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The document encompasses helicopters and fixed wing aircraft and distinguishes between civilian and military considerations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is not intended to be used as a technical guide, nor is it intended to provide methodologies, be a legal document, or be a standard. The findings are informational and are presented in the words of the report authors.&lt;/div&gt;&lt;/div&gt;</p>
