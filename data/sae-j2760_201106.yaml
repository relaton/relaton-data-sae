    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J2579 is being developed by the SAE Fuel Cell Vehicle (FCV) Standards Committee to provide recommended practices for Fuel Systems in Fuel Cell and Other Hydrogen Vehicles. As part of this work, definitions for pressurized systems and containers were developed. The purpose of this document is to disseminate these definitions prior to the release of SAE J2579 such that other technical groups are aware of the information.&lt;/div&gt;&lt;/div&gt;</p>
