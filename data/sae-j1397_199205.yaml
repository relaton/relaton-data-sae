    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report is intended to provide a guide to mechanical and machinability characteristics of some SAE steel grades. The ratings and properties shown are provided as general information and not as requirements for specifications unless each instance is approved by the source of supply. The data are based on resources which may no longer be totally accurate. However, this report is retained as a service in lieu of current data.&lt;/div&gt;&lt;/div&gt;</p>
