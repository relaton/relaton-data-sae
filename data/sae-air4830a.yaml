  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this SAE Aerospace Information Report (AIR) is to inform the aerospace industry about various systems available to monitor the inflation pressure and/or temperature of an aircraft tire. The tire pressure monitoring system (TPMS), with cockpit display, is the most widely used of all aircraft tire monitoring systems, and is detailed in this document more than other systems.&lt;/div&gt;&lt;/div&gt;</p>
