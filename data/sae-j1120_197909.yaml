  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the general and dimensional data for industrial quality spherical rod ends commonly used on control linkages in automotive, marine, construction, and industrial equipment applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The rod ends described are available from several manufacturers within the range of the interchangeable specifications. The sliding contact spherical self-aligning bearing members (ball and socket) are available in a variety of materials in types shown. The load capacities and wear capabilities vary considerably with the design and fabrication. It is suggested that the manufacturers be consulted for recommendations for the type and design appropriate to particular applications.&lt;/div&gt;&lt;/div&gt;</p>
