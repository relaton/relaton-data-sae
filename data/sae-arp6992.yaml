    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method describes a standardized process to evaluate an aviation lubricant’s resistance to thermal degradation and to evaluate the fluid’s tendency to corrode a steel specimen. Fluids are evaluated in an environment free of both air and moisture at a specified temperature and for a specified time period.&lt;/div&gt;&lt;/div&gt;</p>
