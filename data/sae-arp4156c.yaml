abstract:
- language: en
  script: Latn
  content: "<p>This document defines the method for voltage identification by the
    use of color-coded insulators at the base of the lamps. Table 1 shows the design
    volts and corresponding insulator colors.  The part numbers shown are for example
    purposes only, as an option.  Insulator colors are to be easily distinguishable
    as green, yellow, red, and white.  Additional colors may be added by a revision
    process as required.</p>"
