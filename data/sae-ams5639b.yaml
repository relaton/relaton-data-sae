    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion resistant steel in the form of bars, wire, forgings, mechanical tubing, flash welded rings, and stock for forging or flash welded rings (welding, brazing, or other exposure to temperatures over 800 F (427 C) during fabrication may impair corrosion resistance).&lt;/div&gt;&lt;/div&gt;</p>
