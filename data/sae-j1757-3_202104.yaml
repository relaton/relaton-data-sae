  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides test protocols with performance requirements for vehicular flat panel display systems efficiency. The standard help determine vehicle the display system light efficiency vector K&lt;sub&gt;DS&lt;/sub&gt; = (K&lt;sub&gt;50&lt;/sub&gt;, K&lt;sub&gt;night&lt;/sub&gt;, K&lt;sub&gt;daytime&lt;/sub&gt;, K&lt;sub&gt;high-ambient&lt;/sub&gt;) with the highest optical performance (such as luminance, contrast) and lowest power density (defined as total power divided by active area of the display), based on typical automotive usage such as ambient lighting.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In this standard, we are measuring L&lt;sub&gt;amb&lt;/sub&gt; to determine E&lt;sub&gt;amb&lt;/sub&gt; value such as 1.592 cd/m&lt;sup&gt;2&lt;/sup&gt; measured off a 0.99 standard diffuser equivalent to 5k lux illumination environment, same as in SAE J1757-1.&lt;/div&gt;&lt;/div&gt;</p>
