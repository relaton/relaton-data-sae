  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure establishes a recommended practice for performing a Low Speed Knee Slider test to the Hybrid III 50th Male Anthropomorphic Test Device (ATD or crash dummy). This test was created to satisfy the demand from industry to have a certification test which produces similar results to an actual low energy automotive impact test. An inherent problem exists with the current certification procedure because the normal (2.75 m/s) knee slider test has test corridors that do not represent typical displacements seen in these low energy impact tests. The normal test corridors specify a force requirement at 10 mm and at 18 mm, while the low speed test needs to have a peak displacement around 10 mm.&lt;/div&gt;
    &lt;/div&gt;</p>
