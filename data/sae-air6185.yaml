    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) describes hydraulic system design and installation to minimize the effects of lightning, especially when the aircraft structure is composite. Techniques for effective electrical bonding, hydraulic system lightning protection, and lightning protection verification techniques are discussed.&lt;/div&gt;
