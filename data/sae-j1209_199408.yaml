  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes a procedure and the terminology for identifying and classifying mobile forestry machines which may be portable or self-propelled. Identification is determined by endpoint usage as intended by the manufacturer's design objectives. This document applies to machines that are designed for use in site preparation, planting, transporting, and processing wood and wood fiber. Specifically excluded are machines used exclusively in sawmills or wood yards, on-highway transport vehicles, and aerial vehicles.&lt;/div&gt;
    &lt;/div&gt;</p>
