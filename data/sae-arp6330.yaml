  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines means to assess the effect of changes to seat back mounted IFE monitors on blunt trauma to the head and post-impact sharp edges. The assessment methods described may be used for evaluation of changes to seat back monitor delethalization (blunt trauma and post-test sharp edges) and head injury criterion (HIC) attributes (refer to ARP6448 Appendix A Items 3 and 6, respectively). Application is focused on type A-T (transport airplane) certified seat installations.&lt;/div&gt;
    &lt;/div&gt;</p>
