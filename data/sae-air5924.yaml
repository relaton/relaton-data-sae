  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides methodologies and approaches that have been used to install and integrate full-authority-digital-engine-control (FADEC) systems on transport category aircraft. Although the information provided is based on turbofan engines installed on large commercial transports, many of the issues raised are equally applicable to corporate, general aviation, regional and commuter aircraft, and to military installations, particularly when commercial aircraft are employed by military users.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The word “engine” is used to designate the aircraft propulsion system. The engine station designations used in this report are shown in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Most of the material concerns an Electronic Engine Control (EEC) with its associated software, and its functional integration with the aircraft. However, the report also addresses the physical environment associated with the EEC and its associated wiring and sensors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Since most of today’s transport category engines use dual-channel full-authority digital engine control (FADEC) systems, this is the configuration which is primarily addressed. A typical FADEC system configuration is shown in &lt;span class="xref"&gt;Figure 2&lt;/span&gt;. Special considerations that pertain to single-channel FADEC systems or limited authority “supervisory” control systems are also addressed.&lt;/div&gt;

    &lt;/div&gt;</p>
