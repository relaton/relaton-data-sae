    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The method presented is the current recommendation for the use of flame ionization detectors to determine the hydrocarbon content of diesel engine exhaust, or exhaust of vehicles using diesel engines, when operating at steady-state. The requirements of the associated sampling system and a general procedure for a continuous measuring method are presented.&lt;/div&gt;
