    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document has been prepared and issued to provide information and guidance on the application of AQAP-2110 when the supplier adheres to the provisions of 9100. This document is published as AQAP-2110-SRD.2 and IA9137. It was jointly developed by NATO and industry representatives for use by NATO and industry to facilitate the use and understanding of the relationship between the AQAP-2110 and 9100. AQAPs may be required when an acquiring nation use Foreign Military Sales (FMS) as its procuring method.&lt;/div&gt;&lt;/div&gt;</p>
