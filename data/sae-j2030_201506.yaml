  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard encompasses connectors between two cables or between a cable and an electrical component and focuses on the connectors external to the electrical component. This document provides environmental test requirements and acceptance criteria for the application of connectors for direct current electrical systems of 50 V or less in the majority of heavy-duty applications typically used in off-highway machinery. Severe applications can require higher test levels, or field-testing on the intended application.&lt;/div&gt;&lt;/div&gt;</p>
