    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The Initial Graphics Exchange Specification (I.G.E.S.) defines a neutral file format for facilitating transfer of graphic information between dissimilar CAD/CAM systems. This specification is being developed under the auspices of the National Institute for Standards and Technology and in the opinion of this committee is properly addressing the key communication issue of dissimilar graphic data formats.&lt;/div&gt;
    &lt;/div&gt;</p>
