abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The recommended practice describes a design standard that defines the maximum recommended voltage drop of the starting motor main circuits, as well as control system circuits, for 12/24-V starter systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The battery technologies used in developing this document include the flooded lead acid, gel cell, and AGM. Starting systems supported by NiCd, Lithium Ion, NiZn, etc., or Ultracaps are not included in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is not intended to be updated or modified to include starter motors rated at voltages above the nominal 24-V electrical system. The starter is basically an electrical-to-mechanical power converter. If you double the available battery power in, you double the peak mechanical power out and double the heat losses. This means that we have to pay special attention to how battery power changes when we change the battery voltage and the effects it may have in overpowering the cranking system. A new stand-alone document would need to be developed to address electrical circuit performance for starter motor systems with ratings above the nominal 24-V system.&lt;/div&gt;&lt;/div&gt;</p>
