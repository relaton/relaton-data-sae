    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) defines the power spectrum during normal and emergency operations of a twin engine helicopter and thereby postulates suitable power plant rating structures. This document does not address the power requirements for single engine helicopters or those with more than two engines.&lt;/div&gt;&lt;/div&gt;</p>
