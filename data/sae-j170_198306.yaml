  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;The highly preferred SAE Recommended Practice for measuring evaporative emissions from fuel systems of passenger cars and light trucks is the enclosure technique detailed in SAE J171. The sensitivity and accuracy of the enclosure technique is superior to that of the trap method. This recommended practice is retained for historical reference and for use with older vehicles imported into the United States of America. In addition, this trap method is referenced in SAE J171a for making running loss measurements which cannot practically be made in an enclosure. Emissions are measured during a sequence of laboratory tests that simulate typical vehicle usage in a metropolitan area during summer months:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(1)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A 1 h soak representing one diurnal cycle in which temperature of fuel in the vehicle’s tank is raised from 60 to 84°F (15.6 to 28.9 °C).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(2)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A 7.5 mile (12.1 km) run on a chassis dynamometer.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(3)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;A 1 h hot soak immediately following the 7.5 mile (12.1 km) run.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The method for measuring weight of fuel vapors emitted during the test employs activated carbon traps connected to the fuel system at locations where vapors are expected to escape. Vapors from these openings are adsorbed by the traps, and the gain in weight of the traps represents the fuel evaporative emissions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test sequence and method for measuring emissions are applicable to vehicles either with or without systems or devices to control fuel evaporative emissions. Although they have been used successfully with a wide range of vehicles equipped with a variety of control devices, they should not be applied indiscriminately to new or unique vehicles or fuel systems. For example, based on experience that temperature excursions of the fuel tank in parked vehicles follow those of ambient air, the test sequence prescribes heating of the fuel tank to simulate a diurnal soak. Any control system designed to alter the relation between fuel and ambient temperatures will not be properly evaluated in the test sequences prescribed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommended practice includes the following sections:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
