  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS), establishes minimum performance standards for those sensors, computers, transponders, and airplane flight deck controls/displays which together comprise a Takeoff Performance Monitor (TOPM) System. This standard also defines functional capabilities, design requirements, and test procedures. A TOPM system is intended to monitor the progress of the takeoff and to provide advisory information which the crew may use in conjunction with other available cues to decide to continue or abort the takeoff. See &lt;span class="xref"&gt;Appendix A&lt;/span&gt; for supplementary information relating to NTSB, CAA, and ad hoc committee concerns and background information.&lt;/div&gt;&lt;/div&gt;</p>
