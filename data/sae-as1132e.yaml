abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this document is to define the following dimensional requirements for hexagon and double hexagon head bolts and nuts having a minimum tensile strength ranging up to 220 ksi.&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Head dimensions (see &lt;span class="xref"&gt;3.1&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Shank dimensions (see &lt;span class="xref"&gt;3.2&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Geometric control (see &lt;span class="xref"&gt;3.3&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Surface texture (see &lt;span class="xref"&gt;3.4&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensions for nuts (see &lt;span class="xref"&gt;Section 4&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;For design calculations the MIL-S-8879 coarse threads, UNJC, shall be used for 0.164 size and smaller and fine threads, UNJF, for larger sizes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For particulars of thread runout and lead threads for bolts, see AS3062.&lt;/div&gt;

    &lt;/div&gt;</p>
