  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE International Standard covers handles and attachments for use with sockets and crowfoot wrenches in aerospace applications involving high torque, limited clearances, and generally clean conditions. This document provides additional requirements beyond ASME B107.10 appropriate for aerospace use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Inclusion of dimensional data in this document is not intended to imply all of the products described therein are stock production sizes. Consumers are requested to consult with manufacturers concerning lists of stock production sizes.&lt;/div&gt;
    &lt;/div&gt;</p>
