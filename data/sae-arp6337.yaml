  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines additional documentation, environmental considerations, in-service damage limits, test and evaluation criteria necessary to support certification of aircraft seats manufactured using composite materials, in addition to requirements in AS8049 and ARP5526. This document is limited to aircraft seat composite parts in the seat primary load path from the occupant to the attachments of the seat to the aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The term “composite” is inclusive of any fiber-reinforced polymer matrix materials such as carbon fiber-reinforced plastics, sandwich panels and bonded structure.&lt;/div&gt;&lt;/div&gt;</p>
