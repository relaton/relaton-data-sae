abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a set of standard application layer interfaces called JAUS Mobility Services.  JAUS Services provide the means for software entities in an unmanned system or system of unmanned systems to communicate and coordinate their activities.  The Mobility Services represent the platform-independent capabilities commonly found across all domains and types of unmanned systems.  At present, 15 services are defined in this document.


