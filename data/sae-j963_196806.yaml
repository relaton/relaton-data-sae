  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes and defines a standard anthropomorphic test device for use in both actual and simulated vehicle crash impact tests. This test device is designed to be used in the evaluation of vehicle interiors and restraint systems for vehicle occupants during various impact conditions. The structural characteristics of this device simulate the basic human body components only in size, shape, mass, and kinematics. The device has no capability to simulate human physiological functions or to measure simulated physiological responses.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This report establishes the basic design criteria for component weights, weight distribution, dimensions, and motion capabilities of the device. Specific performance requirements for the device are given only where data are available. This SAE Recommended Practice reflects the current state-of-the-art in this regard. Additional sizes of anthropomorphic test devices are under development. It is intended that the content of this report will be subject to continuing review and will be revised as additional data, experience, and new technology warrant.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Other dynamic anthropomorphic test devices are described in the SAE J944 and SAE J984.&lt;/div&gt;&lt;/div&gt;</p>
