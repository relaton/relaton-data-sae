    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;It is recognized that a malfunction in any one of the specified areas can degrade intended performance, but that levels of malfunction or combinations thereof must be considered by the vehicle designer in determining the point at which a failure indication is warranted. Consequently, the minimum reaction recommended by this document consists of making available a malfunction signal.&lt;/div&gt;
    &lt;/div&gt;</p>
