  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Part Standard covers selected machine screw nuts manufactured in accordance with American Society for Mechanical Engineers (ASME) dimensional standards. This document covers material most often used in ship systems and equipment but its use may be applied wherever nuts of the covered materials are used. This document permits the nuts to be identified and ordered by a part identification number (PIN) as defined in this document.&lt;/div&gt;

    &lt;/div&gt;</p>
