  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Battery Identification and Cross Contamination Prevention document is intended to provide information that may be applicable to all types of Rechargeable Energy Storage System (RESS) devices. It is important to develop a system that can facilitate sorting by chemistry. The recycler is interested in the chemistry of the RESS. This is true for the recyclers of Lead Acid, Lithium Ion, Nickel Cadmium etc.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Thus recyclers of RESS will receive RESS from automotive, commercial, and industrial applications. These RESS have the potential to be contaminated with a RESS of an incompatible chemistry. It is recognized that mitigation methods to reduce or eliminate the introduction of incompatible chemistries into a given recycling stream would also benefit safety and the environment.&lt;/div&gt;
    &lt;/div&gt;</p>
