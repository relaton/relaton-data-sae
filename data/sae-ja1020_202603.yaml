abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides guidance to using Rust in critical and safety-related software. The document summarizes how the usage of Rust supports in arguing safety according to ISO 26262 or RTCA DO-178C combined with RTCA DO-332. Cybersecurity best practices are referenced as these requirements largely overlap with those implemented for safety.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;As the Rust language is still evolving, this document targets the 2021 and 2024 editions of the language. Older or newer editions might require additional or changed rules and guidelines. Generally, the newest available edition of the language should be selected as newer editions remove ambiguities and outdated parts from the language.&lt;/div&gt;
    &lt;/div&gt;</p>
