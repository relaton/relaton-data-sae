  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides information and guidance material to assist in assessing the need for and feasibility of developing deicing facilities, the planning (sizing and siting) and design of deicing facilities, and assessing environmental considerations and operational considerations associated with deicing facilities.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The document presents relevant information necessary to define the need for a deicing facility and factors influencing its size, location, and operation. The determination of the need for deicing facilities rests with airports.&lt;/div&gt;&lt;/div&gt;</p>
