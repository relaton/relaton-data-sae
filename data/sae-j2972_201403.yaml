  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Information Report contains a definition of &lt;i&gt;road vehicle hands-free operation.&lt;/i&gt; This definition applies to driver inputs to a wireless communications device used for person-to-person wireless communications while driving. This report applies to both original equipment manufacturers’ and aftermarket devices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The definition does not apply to outputs, e.g., visual or haptic feedback, from a communication system or device, regardless of the modality of human-machine interface. It also does not apply to parallel or redundant manual control operating modes.&lt;/div&gt;&lt;/div&gt;</p>
