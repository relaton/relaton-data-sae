    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the test conditions, procedures and performance requirements for evaluating the off throttle steering capabilities of personal watercraft. This document covers both single and multiple rider craft commencing in 2006 model year. No provision of this section shall apply to PWC intended to be operated by a single operator who either stands or kneels in a tray located behind a moveable handlepole.&lt;/div&gt;&lt;/div&gt;</p>
