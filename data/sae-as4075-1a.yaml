    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) has been prepared by the Ring Implementation Task Group of the SAE AS-2 Committee. It is intended as a companion document to the SAE AS4075 High Speed Ring Bus Standard. While the Standard is intended to provide as complete a description as possible of an HSRB implementation, certain parameters are system-dependent and evolutionary. This document contains those parameters. The text through &lt;span class="xref"&gt;Table 1&lt;/span&gt; is intended to provide definitions and descriptions applicable to all applications. &lt;span class="xref"&gt;Table 2&lt;/span&gt; contains specific parameter values for one or more implementations. This table will change as new systems are implemented or new HSRB speed options are defined.&lt;/div&gt;

    &lt;/div&gt;</p>
