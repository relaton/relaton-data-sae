  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers normalized electric-resistance welded, cold-drawn, single-wall, low-carbon steel pressure tubing intended for use as pressure lines and in other applications requiring tubing of a quality suitable for bending, flaring, forming, and brazing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In an effort to standardize within a global marketplace and ensuring that companies can remain competitive in an international market it is the intent to convert to metric tube sizes which will:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Lead to one global system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Guide users to preferred system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Reduce complexity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Eliminate inventory duplications&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
