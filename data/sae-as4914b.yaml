    &lt;div class="htmlview paragraph"&gt;The purpose of this standard is to recommend minimum performance requirements to assist the specification writer in establishing a failsafe airplane interior light assembly design. This standard relates to the design of fluorescent lamp ballasts, lampholders, fixtures, and installation of the same.&lt;/div&gt;&lt;/div&gt;</p>
