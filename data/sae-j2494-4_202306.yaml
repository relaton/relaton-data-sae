    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers complete general and dimensional data for the manufacture of, T6061-T6 Aluminum cavities designed to receive Push To Connect threadless fittings known as “cartridges“, for air brake applications. This document is not intended to specify or recommend any style or manufacture of such cartridges but to establish uniform cavity dimensions for interchangeability purposes.&lt;/div&gt;&lt;/div&gt;</p>
