    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This detail specification, along with AMS6562, establishes the requirements for continuous E-glass fabric impregnated with a medium temperature, out-of-autoclave, oven-vacuum-bag cure modified B-staged epoxy resin. The prepreg is produced using a one side coated (one side tacky) hot-melt process.&lt;/div&gt;&lt;/div&gt;</p>
