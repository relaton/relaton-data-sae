  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard provides manufacturers/marketers, testing facilities, and providers of technician training with a procedure for certifying compliance with the applicable standard. Manufacturers/marketers or sellers who advertise their products as certified to an SAE J standard shall follow this procedure. Certification of a product is voluntary; however, this certification process is mandatory for those advertising meeting SAE standard(s) requirements. Only certifying to this standard allows those claiming compliance to advertise that their product (unit), component, or service technician training meets all requirements of the applicable SAE standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Certification of compliance to this and the appropriate standard and use of the SAE label on the product shall only be permitted after all the required information has been submitted to SAE International and it has been posted on the SAE website. This process is mandatory for those advertising as being “Certified to SAE JXXXX-(version)” [appropriate SAE standard] requirements or any advertising or labeling language that implies such certification. SAE International will post the results in the official SAE online database.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J2911 requires manufacturers/marketers, testing facilities, and technician training providers to comply with different requirements. This document covers requirements for MAC system components, service equipment, and printed training manuals that are different in content. Therefore, for consistency of reference in this standard, they are identified for general reference as a “product.” Additionally, a reference in this standard to an applicable standard is used as a general term and it refers to the document that defines the requirements, such as Section 609 of the Clean Air Act. Regulatory agencies will also have access to the SAE International public posting of the results in the official SAE database.&lt;/div&gt;

    &lt;/div&gt;</p>
