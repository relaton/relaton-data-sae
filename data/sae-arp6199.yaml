    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides an approach for determining which parts on aircraft seats are non-traditional, large, non-metallic panels that need to meet the test requirements of 14CFR Part 25 Appendix F, Parts IV &amp;amp; V.&lt;/div&gt;
