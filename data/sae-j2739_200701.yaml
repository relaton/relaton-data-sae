  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report investigates the use of single and multi-layer coatings on replaceable headlamp bulbs and how such coatings can affect the performance of bulbs in terms of light scattering, which can contribute to glare, and spectral separation in headlamps. Tests were developed to investigate the effects of absorptive and interference (multi-layer) coatings on bulbs, and on bulbs in headlamp systems. These tests provide validation for a proposed bulb color separation test, which establishes limits for spectral separation within the boundaries of SAE J578 white color requirements. The bulb color separation test provides a definitive selection criterion to identify bulbs that cause excessive light scatter (glare) and/or spectral separation in an optical system.&lt;/div&gt;&lt;/div&gt;</p>
