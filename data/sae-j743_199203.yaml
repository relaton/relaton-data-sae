  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes a method to calculate and a test procedure to validate rated lift capacity as presented in commercial literature for pipelayers and tractors or loaders (wheel or crawler), equipped with a hydraulic or mechanically operated sideboom. Rated lift capacity considers hoist mechanism limits, tipping loads, and rope factor. After the lift capacity is validated by testing, a reduction factor is applied to establish the rated lift capacity for the specific pipelayer or sideboom configuration.&lt;/div&gt;

    &lt;/div&gt;</p>
