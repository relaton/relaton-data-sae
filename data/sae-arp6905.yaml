  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidelines for the effective operation and use of fire containment covers (FCCs). Technical Standard Orders (TSOs) C203 and C90e (and later revisions) incorporate AS6453, and provide the Minimum Performance Standards (MPS) for an FCC design. The net and pallet used with the FCC must be approved using the updated net and flammability requirements in TSO C90e and later revisions. However, fire containment performance also requires this equipment is properly used. Fire safety is compromised when FCCs are used in an inadequate manner.&lt;/div&gt;&lt;/div&gt;</p>
