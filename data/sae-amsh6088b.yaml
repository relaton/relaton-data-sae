  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements and recommendations for the heat treatment of aluminum alloy rolled, extruded, forged, drawn, and cast product (See &lt;span class="xref"&gt;6.1&lt;/span&gt; and &lt;span class="xref"&gt;6.5.1&lt;/span&gt;). It does not cover the requirements for the heat treatment of aluminum alloy parts (See &lt;span class="xref"&gt;3.4&lt;/span&gt;). Subjects covered are: process establishment and re-establishment (previously called “process qualification” and “process requalification”); periodic process surveys; periodic product monitoring; furnaces and operation controls; pyrometric equipment; quenching equipment, media, and operation controls; parameters and procedures for solution heat treatment, quenching, age hardening, and annealing (of certain product); requirements for inspections and record keeping; test methods; and limits of product acceptability.&lt;/div&gt;&lt;/div&gt;</p>
