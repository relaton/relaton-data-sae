abstract:
- language: en
  script: Latn
  content: "<p>The most important aspect of structural unibody repair is the correct
    application of Gas Metal Arc Welding, or G.M.A.W (formerly called Metallic Inert
    Gas, M.I.G) welding. It is the intent of the SAE  Recommended Practice to inform
    the body repairman on how to evaluate his welds and check if the welder is properly
    adjusted. By doing this, he can improve the quality of his structural repairs
    and develop consistent welds.</p>"
