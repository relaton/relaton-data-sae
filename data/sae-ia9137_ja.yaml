abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;この文書は、供給者が9100の規定を遵守する場合の、AQAP-2110の適用に関する情報及びガイダンスを提供するために作成され、発行された。この文書は、AQAP-2110-SRD.2及びIA9137として発行されている。この文書は、NATO及び業界によるAQAP-2110及び9100の関係の理解及び利用を容易にするために、NATO及び業界の代表者が協同で策定した。AQAPは、調達国が対外有償軍事援助（FMS）を調達手段として利用する場合に、必要となる場合がある。&lt;/p&gt;


    &lt;p&gt;この文書の目的は、調達者及びその9100供給者によるAQAP-2110要求事項の解釈の共通化に寄与することである。&lt;/p&gt;


    &lt;p&gt;この文書の内容は法的位置づけも契約上の位置づけも有せず、AQAP-2110の要求事項又は9100の要求事項のいずれに対しても取って代わるものでも、追加するものでも、削除するものでもない。&lt;/p&gt;


    &lt;p&gt;様々な状況が、作業、工程の種類、又は使用される機器、及び関わる要員のスキルのような要因に左右されて存在し得るため、このガイダンスは網羅的なものと見なされることも、また、契約書の要求事項を満たすための特定の手段や方法を義務付けるものと見なされることも望ましくない。ステークホルダーは、これらの要求事項を満たすために、他の手段や方法が使用され得ることを認識すべきである。&lt;/p&gt;


    &lt;p&gt;このガイダンスの利用者は、AQAP 2110要求事項が、契約書に引用されているとおり、供給者や二次供給者に義務付けられていることに留意することが望ましい。&lt;/p&gt;</p>
