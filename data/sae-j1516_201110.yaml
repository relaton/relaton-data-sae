  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice provides procedures for defining the Accelerator Heel Point and the Accommodation Tool Reference Point, a point on the seat H-point travel path which is used for locating various driver workspace accommodation tools in Class B vehicles (heavy trucks and buses). Three accommodation tool reference points are available depending on the percentages of males and females in the expected driver population (50:50, 75:25, and 90:10 to 95:5).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These procedures are applicable to both the SAE J826 HPM and the SAE J4002 HPM-II.&lt;/div&gt;&lt;/div&gt;</p>
