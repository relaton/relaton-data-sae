  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Recommended Practice is limited to gasoline fuel pumps used in automotive direct fuel injection systems. It is primarily restricted to bench tests.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice also defines the minimum design verification testing that is recommended to verify the suitability of gasoline direct injection (GDI) high-pressure fuel pumps used for pumping gasoline or gasoline-blend fuels to direct injection gasoline injectors. Additional tests not specified in SAE J2714 will be required for non-automotive pump applications or pumps, such as those intended for use on aircraft, motorcycles, or marine equipment. The pump and the gasoline direct injector are complementary components, and the direct injector component is fully described in SAE J2713, which provides a full range of test procedures for the characterization of such injectors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Except where specifically stated otherwise, test results are recorded for individual parts under recommended test conditions. Where population characteristics are reported, the sample size, selection method, and statistical analysis technique shall be explicitly stated.&lt;/div&gt;&lt;/div&gt;</p>
