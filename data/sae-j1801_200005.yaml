    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides the method to assign numerical values of brake effectiveness, using data from single station inertia dynamometer effectiveness tests, and to identify a uniform procedure to mark these values on the edge of brake blocks in excess of 12.7 mm (0.51 in) in thickness.&lt;/div&gt;&lt;/div&gt;</p>
