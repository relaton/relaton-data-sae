  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides a description of a screening method for use in the field for verifying an AMS 1428 anti-icing fluid is above its minimum low shear viscosity as published with holdover time guidelines. The test will determine if the fluid is (a) satisfactory, (b) unsatisfactory, or (c) borderline needing more advanced viscometry testing. Other field tests may be required to determine if an anti-icing fluid is useable, such as refractive index, appearance or other tests as may be recommended by the fluid manufacturer.&lt;/div&gt;&lt;/div&gt;</p>
