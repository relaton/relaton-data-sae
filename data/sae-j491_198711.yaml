  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice has been established for the purpose of providing design criteria and suggested dimensional proportions which may be used for ball studs and ball stud socket assemblies as used on steering systems or control mechanisms of passenger vehicles, trucks and off-road equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommended practice does not cover all applications. It is intended to provide assistance in obtaining functional satisfaction and interchangeability.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The inclusion of dimensional data in this report is not intended to imply that all the products described are stock production sizes. Consumers are requested to consult with manufacturers concerning stock production parts.&lt;/div&gt;&lt;/div&gt;</p>
