    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification specifies the engineering requirements for heat treatment, by part fabricators (users) or subcontractors, of parts made of wrought or additively manufactured nickel or cobalt alloys, of raw materials during fabrication, and of fabricated assemblies in which wrought nickel or cobalt alloys are the primary structural components.&lt;/div&gt;&lt;/div&gt;</p>
