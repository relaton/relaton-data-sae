  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Recommendations of this ARP refer specifically to the application of closed cycle vapor cycle refrigeration systems as a source of cooling in an aircraft air conditioning system. General recommendations for an air conditioning system which may include a vapor cycle system as a cooling source are included in ARP85, Air Conditioning Equipment, General Requirements for Subsonic Airplanes, ARP292, Air Conditioning, Helicopters, General Requirements For, and AIR806, Air Conditioning Design Information for Cargo and High Density Passenger Transport Airplanes, and are not included herein.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Vapor cycle refrigeration system design recommendations are presented in this ARP in the following general areas:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;SYSTEM Design Recommendations: (See &lt;span class="xref"&gt;Section 3&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;COMPONENT Design Recommendations: (See &lt;span class="xref"&gt;Section 4&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Desirable Design Features: (See &lt;span class="xref"&gt;Section 5&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;/div&gt;</p>
