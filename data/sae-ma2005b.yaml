    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies performance and quality requirements for the qualification and manufacture of 24° cone fittings to ensure reliable performance in aircraft hydraulic systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document specifies baseline criteria for the design and manufacture of system fittings that are qualification tested on engines.&lt;/div&gt;
