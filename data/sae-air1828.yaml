  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this Aerospace Information Report (AIR) is to provide information and guidance for the selection and use of oil system monitoring devices and methods.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR is intended to be used as a technical guide. It is not intended to be used as a legal document or standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The scope of this document is limited to those inspection and analysis methods and devices which can be considered appropriate for routine maintenance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In agreement with industry usage, wear particle size ranges are given in μm (1 μm = 10&lt;sup&gt;-3&lt;/sup&gt; millimeter = 10&lt;sup&gt;-6&lt;/sup&gt; meter). Other dimensions are given in millimeters, with inches in parenthesis.&lt;/div&gt;&lt;/div&gt;</p>
