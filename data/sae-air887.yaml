    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR explains the meaning of "ABSOLUTE" and "NOMINAL" ratings which are used to describe liquid filter element physical characteristics. A set of standard filter ratings and methods of determination to further describe an element performance are also included. These data are only applicable to a system in which the system liquid wets the filter element.&lt;/div&gt;&lt;/div&gt;</p>
