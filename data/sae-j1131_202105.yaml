  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended to establish uniform performance criteria and methods of testing compression tube fittings with SAE J844 air brake tubing as used in vehicular air brake systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document also establishes minimum qualifications for tensile and pressure capabilities, vibration durability under cyclic temperatures, serviceability, and fitting compatibility requirements. The specific tests and performance criteria applicable to the tubing are set forth in SAE J844.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The test values contained in this performance standard are for test purposes only. For environmental and usage limitations, refer to SAE J844. For fittings, a type of fitting for use with SAE J844 nonmetallic tubing is included in SAE J246; however, it is not intended to restrict or preclude the use of other designs of fittings that comply with this document.&lt;/div&gt;
    &lt;/div&gt;</p>
