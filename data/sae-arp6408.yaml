  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to provide a practical definition of external hydraulic fluid leakage exhibited by landing gear shock absorbers/struts. The definition will outline normal (acceptable weepage) and excessive leakage (unacceptable leakage) of shock absorbers/struts that is measurable. The definition of leakage is applicable to new gear assemblies, refurbished/remanufactured (overhauled) shock absorbers/struts, leakage of shock absorbers/struts encountered during acceptance flights, newly delivered and in-service aircraft. This ARP is intended to provide guidelines for acceptable leakage of landing gear shock absorbers/struts between the ambient temperatures of -65 °F (-54 °C) and 130 °F (54 °C) and to outline the procedure for measuring such leakage. The specific limits that are applied to any particular aircraft shall be adjusted by the aircraft manufacturer before inclusion in the applicable maintenance manual.&lt;/div&gt;
    &lt;/div&gt;</p>
