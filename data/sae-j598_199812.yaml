abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice applies to floodlamp, headlamp, and general
    service lamp units intended for use on off-road self-propelled work machines classified
    as construction, general purpose industrial and forestry machines, as noted in
    SAE J1116. Construction and industrial machinery is normally operated off highways,
    therefore, this document is not intended to be used as a basis for regulations
    by those having authority over motor vehicles used on public highways. Other performance
    and dimensional information is contained in SAE J572 and J760.</p>"
