  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides guidance for a means of showing compliance with regulations for protection against lightning direct effects for aircraft of conventional design, as well as for those involving advanced composite structures or other new technologies. This guidance also applies to those aspects of aircraft systems and components not addressed in the regulations covering the protection of electrical/electronic systems (for example, FAR/JAR xx.1316) or fuel systems (for example, xx.954). The guidance provided in this document applies to initial designs as well as modifications.&lt;/div&gt;
    &lt;/div&gt;</p>
