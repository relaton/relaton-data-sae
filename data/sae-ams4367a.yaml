    &lt;div class="htmlview paragraph"&gt;This specification covers an aluminum alloy in the form of extruded rods, bars, and profiles (shapes) 0.040 to 4.500 inches (1.02 to 114.30 mm), inclusive, in thickness produced with maximum cross sectional area of 56.1 square inches (36199 mm&lt;sup&gt;2&lt;/sup&gt;) and a maximum circumscribing circle diameter (circle size) of 24.4 inches (620 mm) (see &lt;span class="xref"&gt;2.4.1&lt;/span&gt; and &lt;span class="xref"&gt;8.6&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
