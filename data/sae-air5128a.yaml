  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is limited to the subject of aircraft fuel systems and the questions concerning the requirements for electrical bonding of the various components of the system as related to Static Electric Charges, Fault Current, Electromagnetic Interference (EMI) and Lightning Strikes (Direct and Indirect Effects).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR contains engineering guidelines for the design, installation, testing (measurement) and inspection of electrical bonds.&lt;/div&gt;


    &lt;/div&gt;</p>
