  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procurement specification covers aircraft quality metric bolts and screws with forged heads made from a corrosion and heat resistant nickel-base alloy of the type identified under the Unified Numbering System as UNS N07001, having minimum tensile strength of 1210 MPa at room temperature and stress-rupture rated at 730°C.&lt;/div&gt;
    &lt;/div&gt;</p>
