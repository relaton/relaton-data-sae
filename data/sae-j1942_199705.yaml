  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1942, developed through the cooperative efforts of the U.S. Coast Guard and SAE, became effective August 28, 1991&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;, as the official document for nonmetallic flexible hose assemblies for commercial marine use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers specific requirements for several styles of hose and/or hose assemblies in systems on board commercial vessels inspected and certificated by the U.S. Coast Guard. It is intended that this document establish hose constructions and performance levels that are essential to safe operations in the marine environment. Refer to SAE J1273 for selection, installation, and maintenance of hose and hose assemblies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Refer to SAE J1527 Marine Fuel Hose for hose to convey gasoline or diesel fuel aboard small craft, including pleasure craft and related small commercial craft regulated directly or by reference under 33 CFR 183 Subpart J, and boats and yachts meeting American Boat and Yacht Council standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1942-1—Qualified Hoses for Marine Applications is a listing of the products which have been certified for use in the applications described in SAE J1942, &lt;span class="xref"&gt;Table 1&lt;/span&gt;—HOSE APPLICATION/CONSTRUCTION, for Fluid Power, Fuel Oil, Lube Oil, Water, and Pneumatic systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J1942-1 is updated yearly and is available from SAE as a single copy document.&lt;/div&gt;&lt;/div&gt;</p>
