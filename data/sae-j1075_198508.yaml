  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice sets forth measurement procedures and instrumentation to be used for determining a “representative” sound level during a representative time period at selected measurement locations on a construction site boundary. The practice is not intended for use in determining occupational hearing damage risk. Determination of a representative time period is left to the judgement of the user.&lt;/div&gt;&lt;/div&gt;</p>
