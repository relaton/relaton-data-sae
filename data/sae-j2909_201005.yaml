  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes best practices to measure vehicle stopping distance on dry asphalt in a straight path of travel intended for the purpose of publishing stopping distance by manufacturers and media organizations. It is recommended that the test method within be adopted for all vehicles less than 10 000 lb (4536 kg) GVWR. This procedure is typically used with initial speeds of 100 km/h and 60 mph, but other speeds may be used.&lt;/div&gt;
    &lt;/div&gt;</p>
