abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Mobile air conditioning (MAC) systems used in passenger cars and light duty trucks are covered by these SAE Standards when servicing the refrigerant system. Technician training is required to ensure that recommended procedures are used for service and repair of MAC systems using R-12, R-134a, R-1234yf, R-744, and R-152a refrigerants. Unique requirements for each refrigerant are detailed within this standard. Technicians may be trained in any or all refrigerants. The technician shall be trained to recognize which refrigerant is being handled and how to handle it safely, and be equipped with the essential information, proper equipment, and tools which are unique to these refrigerants. This standard outlines minimum content requirements for such training programs. Training programs designed in accordance with this standard are not intended to ensure or assess the technical skills of technicians regarding the diagnosis and repair of motor vehicle air conditioners. Rather, the goal of such programs is to provide information to technicians about safely handling refrigerants and control of emissions during service.&lt;/div&gt;&lt;/div&gt;</p>
