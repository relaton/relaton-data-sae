    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to standardize locations of aircraft ground service connections to accommodate the trend toward fixed systems, which use the passenger loading bridge as a vehicle for a source of utilities. It must be recognized that, in standardizing the locations of the aircraft service connections, they must continue to be served efficiently in those instances where mobile ground support equipment is used. There is an ever increasing number of fixed installations for aircraft servicing. The objectives to be met by standardizing the locations of the aircraft service connections are the following:&lt;/div&gt;


