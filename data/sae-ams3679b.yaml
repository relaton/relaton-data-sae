    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers alumina-silica, glass, and other ceramic fiber thermal insulation in the form of felt and fabric flat sheets, rolls, or molded non-pliable blocks. Nominal thickness is 0.1 to 2.0 inches (3 to 51 mm) and nominal density is 2 to 24 pounds mass per cubic foot (32 to 384 kg/m&lt;sup&gt;3&lt;/sup&gt;).&lt;/div&gt;&lt;/div&gt;</p>
