    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) addresses the following:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Captures previous experience and lessons learned in the application of PM.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Tabulates public-domain applications, and several representative examples discussed in detail.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Notes relative merits and barriers to implementation.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The document does not contain technical details of probabilistic methods, benchmarking of specific approaches or legal aspects. These subjects are covered in other AIRs, referenced in &lt;span class="xref"&gt;Section 2&lt;/span&gt; and prepared by the Probabilistic Methods Committee of the G-11 Reliability, Maintainability, Supportability and Logistics (RMSL) Division of SAE.&lt;/div&gt;

