    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines the test conditions, procedures, and performance requirements for circuit breakers in ratings up to and including 200 A. The document includes automatic reset, modified reset, and manually reset types of circuit breakers for 12 V and 24 V DC electrical systems. Some circuit breakers may have dual voltage ratings (AC and DC), however, this document evaluates DC performance only.&lt;/div&gt;&lt;/div&gt;</p>
