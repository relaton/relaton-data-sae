  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice establishes the method for qualification testing of tube joints and fittings using the rotary or planar flexure test method described in ARP 1185. This qualification test method requires the determination of S-N type curves except that tube deflections are plotted versus the number of test cycles. This replaces flexure testing to a single stress level as specified in MIL-F-18280, B and C revisions.&lt;/div&gt;&lt;/div&gt;</p>
