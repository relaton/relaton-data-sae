  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice covers minimum requirements for air brake hose assemblies made from reinforced elastomeric hose and suitable fittings for use in automotive air brake systems including flexible connections from frame to axle, tractor to trailer, trailer to trailer and other unshielded air lines that are exposed to potential pull or impact. This hose is not to be used where temperatures, external or internal, fall outside the range of −40 to +200 °F (−40 to +93 °C).&lt;/div&gt;&lt;/div&gt;</p>
