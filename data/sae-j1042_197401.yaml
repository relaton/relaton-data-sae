  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The objective of this standard, with referenced documents, is to establish performance requirements of protective systems for operators of industrial equipment. The scope excludes mast-type forklifts and is limited to protection for the vehicle driver from hazards of vehicle rollover and/or falling objects. Protection for the operator of an attachment (for example, a backhoe) is not specifically included in the scope of this standard.&lt;/div&gt;&lt;/div&gt;</p>
