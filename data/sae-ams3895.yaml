    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers AMS 3894 epoxy-resin-impregnated graphite-fiber broadgoods and tape in the form of multi-plied unidirectional layers constructed from the same or uniform fibers and supplied as broadgood rolls, tape, or cut sheet. The individual ply orientation shall be as ordered.&lt;/div&gt;&lt;/div&gt;</p>
