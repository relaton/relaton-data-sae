  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to provide the minimum acceptable criteria for snowmobile hand brake control systems. This recommendation is not intended to cover competition vehicles, nor is it intended to limit development of new and/or improved technology in controls. Although these recommendations are primarily addressed to hand control systems using an outer flexible conduit with a multiple strand inner cable or hydraulic type brake control system, the basic requirements of freedom of movement, strength, material, etc., will apply to any system.&lt;/div&gt;&lt;/div&gt;</p>
