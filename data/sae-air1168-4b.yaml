    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This section presents the basic equations for computing ice protection requirements for nontransparent and transparent surfaces and for fog and frost protection of windshields. Simplified graphical presentations suitable for preliminary design and a description of various types of ice, fog, frost, and rain protection systems are also presented.&lt;/div&gt;&lt;/div&gt;</p>
