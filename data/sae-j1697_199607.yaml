    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers recommended practices for design and evaluation of hose clamped joints primarily in automotive applications. It is intended to: (a) evaluate current joint designs, (b) compare existing designs, (c) aid in the development of new designs, (d) give objective results once weights are set, (e) rate the overall design and individual sections of design, and (f) encourage future research by industry and the OEM's.&lt;/div&gt;&lt;/div&gt;</p>
