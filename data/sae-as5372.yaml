    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for current limiter type fuses for use in aircraft primary electrical power systems conforming to MIL-STD-704. These limiters are suitable for use in MIL-F-5373 fuse holders for operation at −54°C to 125°C.&lt;/div&gt;&lt;/div&gt;</p>
