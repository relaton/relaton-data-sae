    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide guidelines for selection and application of instrumentation for proper measurement of acoustic impulses within vehicles, as typified by those generated during the deployment of a passive restraint system. The objective is to achieve uniformity in instrumentation practice and reporting of test measurements. Use of this recommended practice should provide a basis for meaningful comparisons of test results from different sources.&lt;/div&gt;&lt;/div&gt;</p>
