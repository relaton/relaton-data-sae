  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is directed at the proper communication of the lift points on the vehicle frame or underbody to commercial service personnel for the purpose of raising passenger vehicles, light trucks, and vans completely off the shop floor. To this end, vehicle manufacturers are guided in the proper design of a lift point label and lift points located on the body/frame for use by service garages.&lt;/div&gt;
    &lt;/div&gt;</p>
