  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the specific requirements for 2014 aluminum alloy alclad plate and sheet; the general requirements are covered in AMS-QQ-A-250. The plate and sheet covered by this specification shall be an integral composite product consisting of a heat-treatable aluminum alloy (2014) core with thin layers of an aluminum alloy (6003) anodic to the core and of approximately equal thickness bonded to both surfaces.&lt;/div&gt;&lt;/div&gt;</p>
