  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes best practices to measure vehicle stopping distance on dry or wet asphalt in a straight path of travel intended for the purpose of publishing stopping distance by manufacturers and media organizations for vehicles with original equipment tires. It is recommended that the test method within be adopted for all vehicles less than 4536 kg (10000 pounds) GVWR. This procedure is typically used with initial speeds of 100 km/h and 60 mph, but other speeds may be used. Since tires play a significant role in stopping distance, this procedure covers tire types typically used as original equipment on new vehicles including all-season, summer, and all-terrain tires. This document may serve as a procedural guideline for all tire types, but the surface temperature correction formulas in this procedure were developed using all-season tires and may not be applicable to other tire types.&lt;/div&gt;
    &lt;/div&gt;</p>
