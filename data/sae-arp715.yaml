  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice covers a means of determining the performance acceptability of new production or overhauled starters that will be used for cranking turbine engines and is intended for use where torque measuring equipment is not available or desirable. This method determines acceptability of the overall performance of the starter on a flywheel test stand, rather than the performance at specific speed conditions. It allows a slight variation of output torque outside specified limits, as long as the overall performance is up to standard.&lt;/div&gt;&lt;/div&gt;</p>
