  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) reviews performance testing parameters for non-cleanable, often referred to as disposable, filter elements utilized in aircraft power and propulsion lubrication systems, including gas turbine engines and auxiliary power units (APUs), propulsion and transmission gear boxes, and constant speed drives and integrated drive generators (IDGs).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is confined to laboratory testing of filter element performance to qualify the filtration medium and filter element construction as opposed to qualification of the complete filter assembly. The testing discussed here is usually followed by laboratory and on-engine testing of the entire lube filter assembly (including filter element, housing, valving, etc.), which is outside the scope of this AIR.&lt;/div&gt;
    &lt;/div&gt;</p>
