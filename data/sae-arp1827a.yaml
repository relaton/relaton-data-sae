    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) delineates two complementary filter element performance ratings: (1) dirt capacity, and (2) filtration efficiency, and corresponding test procedures. It is intended for non-cleanable (disposable), fine fuel filter elements used in aviation gas turbine engine systems.&lt;/div&gt;



