    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This system specification, SAE J2461, revises the requirements for Vehicle Electronics Programming Stations (VEPS) set forth in SAE J2214, Vehicle Electronics Programming Stations (VEPS) System Specification for Programming Components at OEM Assembly Plants. SAE J2461 specifies the recommended practices for a Win32™ environment while maintaining the core VEPS architecture specified in SAE J2214.&lt;/div&gt;&lt;/div&gt;</p>
