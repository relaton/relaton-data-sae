  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies those requirements of balancing equipment which make it suitable for the subject class of work.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It will specify:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Sensitivity,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Accuracy of indications of amount and angle of unbalance,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(c)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Ability to separate the Dynamic Unbalance into two planes and to separate Static and Couple Unbalance,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(d)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Machine capacity relating to weight and physical dimensions of the rotors which can be balanced,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(e)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Balancing speed of rotation,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(f)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Standard balancing machine drive adapter flange dimensions,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(g)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Standard shroud mounting pads,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(h)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Power requirements.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/div&gt;</p>
