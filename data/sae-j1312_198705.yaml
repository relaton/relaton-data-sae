  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE code is to provide a standardized test procedure for generating engine performance maps. An engine performance map is a listing of engine fuel flow rates versus torque or power obtained at specific engine speeds and loads. Engine performance maps as specified by this code can be used in fuel economy simulation programs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard is applicable to both two- and four-stroke spark ignition (SI) engines, with or without pressure charging or charge air cooling.&lt;/div&gt;&lt;/div&gt;</p>
