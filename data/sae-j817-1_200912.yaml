  content: |-
    <p>This SAE Information Report establishes a hierarchy of Product Effectiveness, defines Serviceability, Maintainability, Repairability, and Diagnostics, and relates them to Product Effectiveness. Effectiveness of this procedure depends on its use during early stages of design.

    This document applies to machines defined in J1057 and categorized in J1116.</p>
