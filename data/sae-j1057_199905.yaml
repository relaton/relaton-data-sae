abstract:
- language: en
  script: Latn
  content: |-
    <p>This standard sets forth accepted terminology to name and identify types of earthmoving machines, and is based upon existing commercial earthmoving machines. Illustrations are used to identify functional characteristics.

    The terminology establishes a name for a basic work machine such that it is not renamed when various components are mounted to it. For example, when a dozer is mounted on a 'tractor', the work machine can be referred to as 'tractor with dozer.'</p>
