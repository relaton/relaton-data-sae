    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) prescribes the Minimum Performance Standards (MPS) for wheel, brake, and wheel and brake assemblies to be used on aircraft certificated under 14 CFR Parts 23, 27, and 29.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Compliance with this specification is not considered approval for installation on any aircraft.&lt;/div&gt;

