    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard gives guidance for - and specifies the requirements for - the electrodeposition of chromium for engineering purposes. It relates to both new articles and also the reclamation of worn or over-machined components. Chromium electrodeposition undertaken for decorative purposes is not considered herein.&lt;/div&gt;&lt;/div&gt;</p>
