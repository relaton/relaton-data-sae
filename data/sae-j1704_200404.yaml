  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice was prepared to provide engineers, designers, and manufacturers of motor vehicles with a set of minimum performance standards which covers the next level of performance properties above those of the present SAE J1703 brake fluid standard. These fluids are not intended for use under arctic conditions or in braking systems requiring the use of mineral oil based hydraulic fluid.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These fluids are designed for use in braking systems fitted with rubber cups and seals made from natural rubber (NR), styrene-butadiene rubber (SBR), or a terpolymer of ethylene, propylene, and a diene (EPDM). These fluids are not designed to operate in a pumped or a clutch braking system, especially those hydraulic systems requiring a mineral oil based fluid.&lt;/div&gt;&lt;/div&gt;</p>
