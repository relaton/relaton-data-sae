  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the mechanical and material requirements for inch-series steel bolts, screws, studs, sems&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;, and U-bolts&lt;span class="xref"&gt;&lt;sup&gt;2&lt;/sup&gt;&lt;/span&gt; used in automotive and related industries in sizes to 1-1/2 in inclusive.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The term “stud” as referred to herein applies to a cylindrical rod of moderate length threaded on either one or both ends or throughout its entire length. It does not apply to headed, collared, or similar products which are more closely characterized by requirements shown herein for bolts.&lt;/div&gt;
    &lt;/div&gt;</p>
