abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the assembly force guidelines for manually seated push-pins, clips, and similar retention devices. For the purpose of this document, the term “clip” is used to reference all retention devices addressed within this document. Applicable retention devices must have force exerted directly to the clip using the finger/thumb and are hand seated independent of other fasteners. For a retention device to be manually installed and seated independent of other retention devices, it must be seated fully without any interaction with an adjacent fastener (i.e., multiple PIA clips on the back of a hard trim panel).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard applies to contact surfaces angled at 90 degrees (±10 degrees) and/or perpendicular from the direction of force insertion. Mechanically installed fasteners (screws, rivets, etc.) are not included in this document. This standard does not apply to extraction/retention forces. Refer to USCAR-44 for additional guidelines for clips attached to wire harnesses.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All possible design and applications could not be anticipated in creating this guideline. Pictures and examples are included throughout to assist. Where there are questions of adherence to the guideline, consult the responsible ergonomic departments or representatives.&lt;/div&gt;&lt;/div&gt;</p>
