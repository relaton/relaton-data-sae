abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice defines a guideline to help engineering
    users select workstations by specifying of vendor supported functionality with
    several levels of performance and capacity. These workstations will satisfy different
    engineering applications while maintaining interoperability. The objective is
    to specify a set of standards, not a single workstation, which must be addressed
    by the vendors to meet the hardware and operating environment needs of engineers
    in their CAD, CAM, CAE and other engineering activities.</p>"
