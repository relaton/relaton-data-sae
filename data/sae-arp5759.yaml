  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document discusses, in broad and general terms, the subject of acoustical considerations in engine test cells. One of the primary purposes of an engine test cell is to control the noise emanating from the operating engine in order to reduce noise in the surrounding facility and community to acceptable levels. This is done by the design and installation of specialized acoustic elements and features, which need to be fully integrated into the overall test cell design. It should be further noted, that the requirements of acoustic control are critical to the proper operation of the engine, safety of plant equipment and personnel, and meeting local and legal noise requirements.&lt;/div&gt;&lt;/div&gt;</p>
