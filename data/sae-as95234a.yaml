  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AS95234 includes reverse bayonet coupling, high current electrical connectors that are water tight and principally used in shipboard, ground vehicles and ground support equipment applications at serve voltages from 200 to 3000 V-rms and temperatures between -55 °C and +125 °C (-67 °F and +257 °F). See &lt;span class="xref"&gt;6.1.5&lt;/span&gt; for applications details. For aerospace application connectors, refer to AS50881.&lt;/div&gt;&lt;/div&gt;</p>
