  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method describes a procedure for measuring the largest pore or hole in a filter or similar fluid-permeable porous structure. A standard referee test method for precise determination or resolution of disputes is specified. A simpler inspection test procedure for quality assurance "go-no-go" measurement is also given. Bubble-point testing physics, analysis of bubble-point test data, and correlation with other methods of pore size determination are separately discussed in the appendix.&lt;/div&gt;&lt;/div&gt;</p>
