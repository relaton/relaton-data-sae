abstract:
- language: en
  script: Latn
  content: "<p>This specification covers the engineering requirements for selective
    (brush) electrodeposition of nickel and the properties of the deposit. This process
    has been used typically to provide moderate corrosion and oxidation resistance
    and dimensional build-up and restoration of parts which may operate in service
    up to 700 degrees F (371 degrees C), where low tensile stress in the deposit is
    required to avoid marked reduction of fatigue strength, but usage is not limited
    to such applications.</p>"
