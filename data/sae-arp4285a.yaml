  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes a method for evaluating the particulate matter extracted from the working fluid of a hydraulic system or component using a membrane. The amount of particulate matter deposited on the membrane due to filtering a given quantity of fluid is visually compared against a standard membrane in order to provide an indication of the cleanliness level of the fluid.&lt;/div&gt;&lt;/div&gt;</p>
