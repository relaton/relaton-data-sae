  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides minimum performance requirements and uniform laboratory procedures for fatigue testing of wheels and demountable rims intended for normal highway use on trucks, buses, truck-trailers, and multipurpose vehicles. Users may establish design criteria exceeding the minimum performance requirement for added confidence in a design. The cycle requirements noted in &lt;span class="xref"&gt;Tables 1&lt;/span&gt; and &lt;span class="xref"&gt;2&lt;/span&gt; are based on Weibull statistics using 2 parameter, median ranks, 50% confidence level and 90% reliability, and beta equal to 2, typically noted as B10C50. For other wheels intended for normal highway use and temporary use on passenger cars, light trucks, and multipurpose vehicles, see SAE J328. For wheels used on trailers drawn by passenger cars, light trucks, or multipurpose vehicles, see SAE J1204. For bolt together military wheels, see SAE J1992. This document does not cover other special application wheels and rims.&lt;/div&gt;&lt;/div&gt;</p>
