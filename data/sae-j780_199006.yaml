    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard outlines physical dimensions and nomenclature for the sizes of seals commonly used in engine coolant pumps of automotive type engines. Its purpose is to define a standard envelope to accommodate installation of various seal designs and to promote uniformity in seal nomenclature.&lt;/div&gt;&lt;/div&gt;</p>
