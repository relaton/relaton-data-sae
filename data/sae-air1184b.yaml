abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report is intended to identify the various errors typically encountered in capacitance fuel quantity measurement systems. In addition to identification of error sources, it describes the basic factors which cause the errors. When coupled with appraisals of the relative costs of minimizing the errors, this knowledge will furnish a tool with which to optimize gauging system accuracy, and thus, to obtain the optimum overall system within the constraints imposed by both design and budgetary considerations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Since the subject of fuel measurement accuracy using capacitance based sensing is quite complex, no attempt is made herein to present a fully-comprehensive evaluation of all factors affecting gauging system accuracy. Rather, the major contributors to gauging system inaccuracy are discussed and emphasis is given to simplicity and clarity, somewhat at the expense of completeness.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;An overview of capacitive fuel gauging operation can be found in AIR5691. This document also discusses how to analyze fuel gauging system accuracy as a result of combining the effects of the error sources described here.&lt;/div&gt;
    &lt;/div&gt;</p>
