  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) advises that some of the chemicals being used to disinfect, de-ice, and clean airplanes can cause corrosion and/or degradation of landing gear components. Landing gear equipment includes shock struts, braces, actuators, wheels, brakes, tires, and electrical components. Some of the chemicals that have been recognized as potentially injurious are identified and recommendations for mitigating damage are presented.&lt;/div&gt;
    &lt;/div&gt;</p>
