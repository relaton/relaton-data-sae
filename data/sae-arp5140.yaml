    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) outlines the design and functional requirements for aircraft passenger lifts, operated manually and self-propelled. The primary function of the lift described in this document is to act as an elevator between ground level and aircraft doorsills to a maximum of 144 in.&lt;/div&gt;&lt;/div&gt;</p>
