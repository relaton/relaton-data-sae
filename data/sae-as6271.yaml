  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AS establishes minimum requirements for halocarbon clean agent hand-held fire extinguishers carried on board civil aircraft. The requirements include: design (cylinder, valve, gauge, mounting equipment), performance (firefighting effectiveness - hidden fire test, discharge test, type, etc.), environmental (ozone depleting/global warming potential, atmospheric life span), and occupant safety concerns (toxicology - seat fire test).&lt;/div&gt;&lt;/div&gt;</p>
