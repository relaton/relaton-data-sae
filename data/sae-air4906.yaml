  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;A review of droplet sizing instruments used for icing research is presented. These instruments include the Forward Scattering Spectrometer Probe, the Optical Array Probe, the Phase Doppler Particle Analyzer, the Malvern Particle Size Analyzer, the oil slide technique, and the rotating multicylinder. The report focuses on the theory of operation of these instruments and practical considerations when using them in icing facilities.&lt;/div&gt;
    &lt;/div&gt;</p>
