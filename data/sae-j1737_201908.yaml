  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended for the determination of the losses of hydrocarbon fluids, by permeation through component walls, as well as through "microleaks" at interfaces of assembled components while controlling temperature and pressure independently of each other. This is achieved in a recirculating system in which elements of a test fuel that permeate through the walls of a test specimen and migrate through the interfaces are transported by a controlled flow of dry nitrogen to a point where they are measured. That measurement point is a device, such as a canister containing activated charcoal or other means of collection or accumulation where the hydrocarbon losses are then measured by weight change or analyzed by some other suitable means.&lt;/div&gt;&lt;/div&gt;</p>
