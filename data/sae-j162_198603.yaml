    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice incorporates recommended dimensions for flywheels for use with single bearing power generators in the range of 10-500 kW, operating at speeds of 1000-1800 rpm.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Driving torque, fastener strength, and rotative speeds shall be consistent with good design practice.&lt;/div&gt;&lt;/div&gt;</p>
