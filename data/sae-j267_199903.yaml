  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides minimum performance requirements and uniform laboratory procedures for fatigue testing of wheels and demountable rims intended for normal highway use on trucks, buses, truck-trailers, and multipurpose vehicles. For other wheels intended for normal highway use and temporary use on passenger cars, light trucks, and multipurpose vehicles, see SAE J328. For wheels used on trailers drawn by passenger cars, light trucks, or multipurpose vehicles, see SAE J1204. For bolt together military wheels, see SAE J1992. This document does not cover other special application wheels and rims.&lt;/div&gt;&lt;/div&gt;</p>
