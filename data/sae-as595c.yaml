  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the general requirements for the design, construction, acceptance and qualification test of pressure compensated, variable delivery hydraulic pumps, used in civil aircraft hydraulic systems. It provides additional parameters for a Procurement Specification to be used in conjunction with this AS for each pump.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AS is applicable to hydraulic pumps driven by an engine, in systems conforming to the general requirements of ARP4752, and the regulations of FAR and/or JAR 25.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is also applicable to pumps driven by other power sources such as electric motors, ram air turbines and engine bleed air turbines.&lt;/div&gt;&lt;/div&gt;</p>
