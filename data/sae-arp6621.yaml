    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice provides guidance for designers and specifiers of aircraft exterior lighting. Typical causes of light degradation and methods of predicting performance degradation in the aircraft environment are given. Although the document considers only exterior lighting, many of the principles and methods discussed apply to interior or flight deck lighting as well.&lt;/div&gt;
