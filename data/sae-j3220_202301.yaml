  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines performance and life cycle tests for lithium-ion cells used primarily for propulsion of electric vehicles including battery electric vehicles (BEVs), hybrid electric vehicles (HEVs), and other similar propulsion applications (for example, forklift trucks).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The objective of this document is to define common performance test procedures for lithium-ion cells. Results from these procedures can be used for comparative purposes. Performance requirements are not defined in this document, but are to be defined by the users of the document.&lt;/div&gt;&lt;/div&gt;</p>
