  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides a guide for the preparation of a Helicopter Engine/Airframe Interface Document and Checklist. This document and checklist is intended to provide complete relevant information on the characteristics, performance, and engine interfaces. Of most importance is the identification of the data and the location of data to assure that the engine manufacturer and the airframe manufacturer supply information that can be easily located by either manufacturer.&lt;/div&gt;&lt;/div&gt;</p>
