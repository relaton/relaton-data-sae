    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a methyl phenyl vinyl silicone rubber material that can be used to manufacture product in the form of sheet, strip, tubing, molded shapes, and extrusions. For molded rings, compression seals, O-ring cord, and molded-in-place gaskets for aeronautical and aerospace applications, use the corresponding AMS7000 series specification.&lt;/div&gt;&lt;/div&gt;</p>
