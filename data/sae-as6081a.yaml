    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) standardizes practices to identify reliable sources to procure electrical, electronic, and electromechanical (EEE) parts, assess and mitigate the risk of distributing suspect counterfeit or counterfeit EEE parts, control suspect counterfeit or counterfeit EEE parts, and report incidents of suspect counterfeit and counterfeit EEE parts.&lt;/div&gt;&lt;/div&gt;</p>
