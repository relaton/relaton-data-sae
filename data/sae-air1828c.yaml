  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides information and guidance for the selection and use of technologies and methods for lubrication system monitoring of gas turbine aircraft engines. This AIR describes technologies and methods covering oil system performance monitoring, oil debris monitoring, and oil condition monitoring. Both on-aircraft and off-aircraft applications are presented. A higher-level view of lubrication system monitoring as part of an overall engine monitoring system (EMS), is discussed in ARP1587.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The scope of this document is limited to those lubrication system monitoring, inspection and analysis methods and devices that can be considered appropriate for health monitoring and routine maintenance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR is intended to be used as a technical guide. It is not intended to be used as a legal document or standard.&lt;/div&gt;&lt;/div&gt;</p>
