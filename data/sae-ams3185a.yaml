abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This specification covers a nonflammable hydraulic fluid, composed with a chlorotrifluoroethylene (CTFE) base, in the form of a liquid.&lt;/p&gt;
    &lt;p&gt;This fluid has been used typically for hydraulic systems of aircraft and selected armored vehicles for usage in the temperature range -65 to +275 degrees F (-54 to +135 degrees C), but usage is not limited to such applications.&lt;/p&gt;</p>
