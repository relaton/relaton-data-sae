  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines tests to be performed on electrically, pneumatically, and mechanically actuated (regulating, modulating, and shutoff) air valves. The valves may be further defined as those which function in response to externally applied forces or in response to variations in upstream and/or downstream duct air conditions to maintain a calibrated duct air condition (i.e., air flow, air pressure, air temperature, air pressure ratio, etc.). The requirements of this document should govern for all qualification tests unless different requirements are established by the detail specifications.&lt;/div&gt;&lt;/div&gt;</p>
