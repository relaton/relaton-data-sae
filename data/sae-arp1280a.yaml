  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is an application guide for hydraulic power transfer units, and describes the various types, typical design approaches, their operational characteristics and limitations, circuit recommendations, and a tabulation of typical applications. The scope is limited to devices that transfer power between hydraulic systems and do so by means of rotary subassemblies such as hydraulic motors and pumps.&lt;/div&gt;

    &lt;/div&gt;</p>
