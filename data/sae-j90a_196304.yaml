  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;These specifications for SAE J90 are intended to define the basic properties of commercial nonmetallic gasketing materials commonly used in automotive applications. These include materials composed of asbestos or other inorganic fibers, cork, or cellulose or other organic fibers, in combination with various binders or impregnants. Rubber compounds without fibrous or cork reinforcement are not included since they are covered in SAE Standard, Specifications for Elastomer Compounds for Automotive Applications—SAE J14, and in ASTM D 735-61T. Although the test methods and values are designed to describe the basic properties of the material in each category, they do not define all of, the properties which govern gasket performance. Caution should, therefore, be exercised in using these specifications as a basis for the selection of materials.&lt;/div&gt;&lt;/div&gt;</p>
