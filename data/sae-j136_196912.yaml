  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of the information report is to present an interim test method whereby glancing blow impact testing can be simulated utilizing existing pendulum type equipment. Tests are conducted normal to a test specimen at a reduced velocity which produces results approximating those obtained from a glancing blow impact.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The report also documents the investigation upon which the test method is based.&lt;/div&gt;&lt;/div&gt;</p>
