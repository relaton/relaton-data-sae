    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes basic instrumentation system requirements for use in only those SAE laboratory impact tests which reference this report. Individual SAE laboratory impact test procedures may indicate required deviations from the specifications given here.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The items to be measured in laboratory impact tests may include any or all of the following: accelerations, velocities, penetrations, distances, forces, and event timing.&lt;/div&gt;&lt;/div&gt;</p>
