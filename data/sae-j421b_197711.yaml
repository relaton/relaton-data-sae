  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a rating procedure for the cleanliness rating of steels by the magnetic particle method. The procedure is based on counting the number of indications (frequency) and employs a weighted value to obtain a severity factor. The method outlined is similar to that described in SAE Aerospace Material Specification AMS 2301.&lt;/div&gt;&lt;/div&gt;</p>
