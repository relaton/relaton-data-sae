abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document will primarily address intrinsic reliability of electronic components for use in automotive electronics. Where practical, methods of extrinsic reliability detection and prevention will also be addressed. The current handbook primarily focuses on integrated circuit subjects, but can easily be adapted for use in discrete or passive device qualification with the generation of a list of failure mechanisms relevant to those components. Semiconductor device qualification is the main scope of the current handbook.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Other procedures addressing extrinsic defects are particularly mentioned in the monitoring chapter. Striving for the target of Zero Defects in component manufacturing and product use it is strongly recommended to apply this handbook. If it gets adopted as a standard, the term “shall” will represent a binding requirement.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not relieve the supplier of the responsibility to assure that a product meets the complete set of its requirements.&lt;/div&gt;&lt;/div&gt;</p>
