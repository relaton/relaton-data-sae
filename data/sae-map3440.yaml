    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice provides the design criteria for static elastomeric O-ring seal applications, radial squeeze groove dimensions for aerospace metric O-ring seal sizes as specified in MA2010. The conditions considered to formulate the design criteria are also described, e.g., seal stretch, cross-section reduction, squeeze, and swell.&lt;/div&gt;&lt;/div&gt;</p>
