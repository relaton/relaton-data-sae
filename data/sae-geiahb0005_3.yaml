abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides technical background, procurement guidance, engineering procedures, and guidelines to assist organizations reworking/repairing aerospace and high performance electronic systems, whether they were assembled or previously reworked/repaired using traditional alloys such as SnPb or Pb-free alloys, or a combination of both solders and surface finishes. This document contains a review of known impacts and issues, processes for rework/repair, focused to provide the technical structure to allow the repair technician to execute the task.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document focuses on the removal and replacement of piece parts. For the purposes of this document, the term “Rework/Repair” is used as applicable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;u&gt;&lt;b&gt;NOTE&lt;/b&gt;&lt;/u&gt;: The information contained within this document is based on the current knowledge of the industry at the time of publication. Due to the rapid changing knowledge base, this document should be used for guidance only.&lt;/div&gt;&lt;/div&gt;</p>
