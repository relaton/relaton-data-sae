  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard serves as the guidance document for the J2945/x family of standards as illustrated in &lt;span class="xref"&gt;Figure 7&lt;/span&gt;. It contains cross-cutting material which applies to the other J2945/x standards, including recommended practice for the use of Systems Engineering (SE) and generic DSRC interface requirements content.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The scope for the DSRC system environment is to provide for the information exchange between a host vehicle and another DSRC enabled device, a device worn by or otherwise attached to a traveler, a roadside device, or a management center, to address safety, mobility, and environmental system needs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The audience for this document includes the technical teams of developers of the J2945/x documents and the implementers of the applications which are based on the J2945/x documents.&lt;/div&gt;

    &lt;/div&gt;</p>
