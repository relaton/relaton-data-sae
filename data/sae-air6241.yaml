  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) describes procedures, required continuous sampling conditions, and instrumentation for the measurement of non-volatile particle number and mass concentrations from the exhaust of aircraft gas turbine engines. Procedures are included to calculate sampling loss performance. This AIR is not intended for in-flight testing, nor does it apply to engine operating in the afterburning mode.&lt;/div&gt;
    &lt;/div&gt;</p>
