  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends standard gland design criteria and dimensions for dynamic radial O-ring seal applications specifically for engine and engine control systems operating at pressures up to a maximum of 1500 psi (10342.14 kPa) and provides recommendations for modifying these glands in special applications. There are no provisions in this document for anti-extrusion devices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The criteria set forth here are similar to but not identical with those in MIL-G-5514 and AS4716. This document is not intended to replace MIL-G-5514 or AS4716 for hydraulic applications.&lt;/div&gt;
    &lt;/div&gt;</p>
