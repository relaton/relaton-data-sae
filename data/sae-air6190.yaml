  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides information on provisions for passengers with disabilities on board commercial aircraft. In this context the term "provision of medical oxygen" shall be understood as application of oxygen on board an aircraft not linked to (post) decompression in the sense of Airworthiness Requirements FAR/CS 25 and Operational Regulations of FAR 121/135.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Information about available equipment and physiological treatment in clinical practice will be provided in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It covers the use of oxygen concentrators according to guidance of FAR Advisory Circular AC120-95.&lt;/div&gt;&lt;/div&gt;</p>
