  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers the requirements for a Stationary Runway Weather Information System (referred to as the system) to monitor the surface conditions of airfield operational areas to ensure safer ground operations of aircraft. The system provides (1) temperature and condition information of runway, taxiway, and ramp pavements and (2) atmospheric weather conditions that assist airport personnel to maintain safer and more efficient airport operations. The system can be either a wired system or a wireless system.&lt;/div&gt;&lt;/div&gt;</p>
