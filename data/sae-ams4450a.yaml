    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an aluminum alloy in the form of extruded rods, bars, and profiles (shapes) produced with thicknesses 0.040 to 2.500 inches (1.02 to 38.10 mm), inclusive, having a maximum cross-sectional area of 23 square inches (15000 mm&lt;sup&gt;2&lt;/sup&gt;) and a maximum circumscribing circle diameter (circle size) of 16 inches (406 mm) (see &lt;span class="xref"&gt;2.4.1&lt;/span&gt; and &lt;span class="xref"&gt;8.7&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
