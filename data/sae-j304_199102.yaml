    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to describe test conditions and performance evaluation factors for both diesel and gasoline engine tests. Specifically, the tests described in this document are used in the requirements for engine oils in U. S. military specifications, as well as in the API Engine Service Classification system described in API Publication 1509, and the ASTM D 4485, SAE J183, and SAE J1423 standards.&lt;/div&gt;&lt;/div&gt;</p>
