  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a procedure for measuring the hydrocarbon emissions occurring during the refueling of passenger cars and light trucks. It can be used as a method for investigating the effects of temperatures, fuel characteristics, etc., on refueling emissions in the laboratory. It also can be used to determine the effectiveness of evaporative emissions control systems to control refueling emissions. For this latter use, standard temperatures, fuel volatility, and fuel quantities are specified.&lt;/div&gt;&lt;/div&gt;</p>
