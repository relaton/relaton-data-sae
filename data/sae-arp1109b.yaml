  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) recommends performance requirements for test equipment used in dynamic testing of aviation oxygen breathing equipment. This document describes test equipment and methods used for testing continuous flow, demand and pressure demand regulators and their associated masks as well as filtered protective breathing devices; such articles of oxygen breathing or protective breathing equipment may be tested as individual components or as a complete system.&lt;/div&gt;
    &lt;/div&gt;</p>
