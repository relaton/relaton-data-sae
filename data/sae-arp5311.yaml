  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines all the relevant issues that affect the generation of an Interface Control Document for Mechanical Actuation Sub-Systems. It is intended to provide to all parties involved with the generation of Mechanical Actuation Sub-Systems, a definition of documentation, drawings, reports and design parameters required to assure a successful development of mechanical actuation sub-systems for Aerospace-Military and Commercial applications.&lt;/div&gt;
    &lt;/div&gt;</p>
