    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This part of SAE J551 specifies on-board transmitter simulation test methods and procedures for testing passenger cars and commercial vehicles. The electromagnetic disturbances considered in this part of SAE J551 are limited to continuous narrow band electromagnetic fields.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J551/1 specifies general, definitions, practical use, and basic principles of the test procedure.&lt;/div&gt;&lt;/div&gt;</p>
