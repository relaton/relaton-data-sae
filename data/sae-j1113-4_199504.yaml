  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines a method for evaluating the immunity of automotive electrical/electronic devices to radiated electromagnetic fields coupled to the vehicle wiring harness. The method, called Bulk Current Injection (BCI), uses a current probe to inject RF current from 1 to 400 MHz into the wiring harness of automotive devices. BCI is one of a number of test methods that can be used to simulate the electromagnetic field. For a list of others, see SAE J1113/1.&lt;/div&gt;
    &lt;/div&gt;</p>
