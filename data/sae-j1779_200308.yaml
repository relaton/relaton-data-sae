    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The marine environment differs greatly from other environments in which hydraulics are used. This Recommended Practice provides hydraulic design considerations and criteria for the marine environment and is applicable to commercial vessels, military ships, and submersible vehicles. This document may be used for manned and un-manned vehicles.&lt;/div&gt;&lt;/div&gt;</p>
