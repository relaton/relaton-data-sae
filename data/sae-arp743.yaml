  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test describes a self-checking procedure for the determination of particulate contaminant five microns or greater in size in air by the particle count method. A maximum variation of two to one (±33% of the average of two runs) in results should be expected for replicate counts on the same sample, providing that the procedure is followed closely and the precautions presented regarding check samples and self-checking aspects are observed.&lt;/div&gt;&lt;/div&gt;</p>
