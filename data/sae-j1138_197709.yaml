  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to describe design criteria pertaining to the location and labeling of hand controls necessary to or frequently used during the operation of passenger cars, MPV, and trucks 10 000 GVW and under. The results of SAE human factors research have strongly influenced these recommendations, specifically in the areas of driver reach, control-locating performance, and control location expectancies. Deviations from this recommended practice should be made only after careful study of the various SAE publications on these subjects, as referenced here and in SAE J1139 (September, 1977), Supplemental Information—Driver Hand Controls Location for Passenger Cars, MPV’s and Trucks (10 000 GVW and Under).&lt;/div&gt;&lt;/div&gt;</p>
