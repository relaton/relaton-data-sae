  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies requirements for two types, three classes and four styles of reinforced hose and non-reinforced tubing for conveying gasoline or diesel fuel aboard small craft including pleasure craft whose fuel systems are regulated under 33 CFR 183 Subpart J.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Refer to SAE J1942 Hose and Hose Assemblies for commercial marine nonmetallic flexible hose or hose assemblies used in systems on board commercial vessels inspected and certified by the U.S. Coast Guard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Refer to SAE J2046 Personal Watercraft Fuel Systems for fuel hose used on Personal Watercraft.&lt;/div&gt;



    &lt;/div&gt;</p>
