abstract:
- language: en
  script: Latn
  content: "<p>This specification covers procedures for ultrasonic inspection, by pulse-echo procedures, of flat, rectangular, round, cylindrical, and contoured products having a thickness or cross-sectional dimension greater than 0.50 inch (12.7 mm), using either contact or immersion methods, and using the longitudinal-wave or shear-wave modes or combinations of the two, as necessary. This specification may apply to testing finished machined parts provided the parts can meet the basic testability requirements, such as size, contour, metallurgical structure, and thickness.</p>"
