    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This performance document for the audio cassette was developed by qualified engineers from the automotive industry, the prerecorded tape industry, and the tape and cassette manufacturers. It is based upon sound engineering principles supported by laboratory tests and field experience. The values given are supported by all of these industries and considered necessary to establish customer acceptance and satisfaction.&lt;/div&gt;&lt;/div&gt;</p>
