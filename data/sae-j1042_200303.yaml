    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to General-Purpose Industrial Machines described in Category 2 of SAE J1116, but excludes skid steer loaders (covered by SAE J1388). Protection for the operator of an attachment (for example, a backhoe) is excluded from the scope of this document.&lt;/div&gt;
