  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes signal words, color combinations, letter sizes, and durability requirements for permanently and temporarily affixed safety signs for off-road, self-propelled work machine categories of construction, general purpose industrial, forestry, agricultural tractors, and specialized mining machinery as defined in SAE J1116. This document is suitable for application to tools, machines, and machinery used in the specified categories.&lt;/div&gt;
    &lt;/div&gt;</p>
