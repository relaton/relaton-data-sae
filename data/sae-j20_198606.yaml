  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers reinforced and flexible hoses intended for use in water and ethylene glycol based engine collant system application.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;Compounds based on different synthetic rubber grades are specified and designated Class A, high temperature resistant; Class B, high oil swell resistant; Class C, medium oil swell resistant; Class D-1, low oil resistant, improved service; Class D-2 low oil resistant, standard service; Class D-3, low oil resistant, high temperature resistant, premium service; Class E, low oil resistant, fiber elastomer composite. Typical physical characteristics for each type hose are shown in &lt;span class="xref"&gt;Table 1&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
