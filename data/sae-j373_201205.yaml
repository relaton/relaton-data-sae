  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the minimum internal dimensions for clutch housings to provide adequate clearance for single- and two-plate spring-loaded clutches. (See &lt;span class="xref"&gt;Figure 1&lt;/span&gt;.)&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Consult SAE J617 for housing flange dimensions. Consult SAE J618 and J619 for spring-loaded clutch flywheel dimensions F and G and other dimensional data.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Table 1&lt;/span&gt; provides housing minimum internal dimensions for single- and two-plate spring-loaded clutches.&lt;/div&gt;&lt;/div&gt;</p>
