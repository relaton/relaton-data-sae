  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;A technical committee shall be responsible for a field of endeavor, as defined by its scope. In cases where projects overlap areas of interest of another council’s committee, the originating committee shall submit the project(s) for review and approval to the other concerned committee and its council prior to issuance. A committee is established when a new major project area is to be undertaken and no existing committee is available. A committee is discharged when the assigned work is completed and there is no further need for its services. The councils retain responsibility for periodic review of technical reports developed by their disbanded committees.&lt;/div&gt;&lt;/div&gt;</p>
