  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is applicable to all phases of the system acquisition life cycle. It is intended for use on all programs with manufacturing content. It requires proven manufacturing management practices with the goal of delivering affordable and capable systems to the extent that it is invoked contractually. The term “organization” as used in this document refers to the company or facility that is implementing this standard, such as when imposed contractually by the customer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The term “shall” is used wherever the criterion for conformance with the specific recommendation requires that there be no deviation. The term “should” is used wherever noncompliance with the specific recommendation is permissible.&lt;/div&gt;&lt;/div&gt;</p>
