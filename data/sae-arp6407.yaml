  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Recommended Practice (ARP) provides guidance for the design of an integrated vehicle health management (IVHM) capability that will extend the vehicle’s inherent design to enable health management of the platform and its components. This guidance is technology-independent; the principles are generally applicable to the majority of potential IVHM design scenarios, including “clean sheet” system design, where IVHM is considered as a primary design consideration, and the retrofit design, where existing systems are modified and leveraged with the IVHM capability. In either case, this ARP provides guidance for designing the IVHM capability from the feasibility assessment to the conceptual design analysis and to the development design phases, with considerations given to trade studies, metrics, and life cycle impacts.&lt;/div&gt;

    &lt;/div&gt;</p>
