abstract:
- language: en
  script: Latn
  content: "<p>This Aerospace Standard (AS) covers the general minimum performance
    standards of A-C generators and associated regulators for civil aircraft. The
    generator is a nominal 120/208-volt, 400-Hz, 3-phase, Y-connected  system that
    provides the primary or backup power for electrical systems. The machine can be
    a brush or brushless design and is normally air cooled.</p>"
