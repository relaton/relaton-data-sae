  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides information about impulse loads that occur during normal aircraft towing operations. An instrumented tow bar was used to characterize towing loads. Suggestions to minimize impulse loads by reducing the tow bar to tow vehicle gap are described.&lt;/div&gt;
