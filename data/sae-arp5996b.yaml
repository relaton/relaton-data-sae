  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This method is designed to evaluate the coking propensity of synthetic ester-based aviation lubricants under single phase flow conditions found in certain parts of gas turbine engines, for instance in bearing feed tubes. This method is applicable to lubricants with a coking propensity, as determined by this method, falling in the range 0.01 to 3.00 mg.&lt;/div&gt;&lt;/div&gt;</p>
