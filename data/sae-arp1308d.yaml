  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this ARP is to identify electrical connectors maintained by the AE-8C1 Committee, to provide their general application characteristics, associated configuration options, and recommendations for new design (see &lt;span class="xref"&gt;6.1.1&lt;/span&gt;), repair, and retrofit purposes (see &lt;span class="xref"&gt;6.1&lt;/span&gt;). It is acknowledged the connectors listed herein will not completely satisfy all mobility vehicle and equipment requirements, but optimization of the use of these components will facilitate standardization in the form of maximum utilization of a minimum variety of connectors. This ARP only pertains to AS connector standards. See MIL-STD-1353 for U.S. military specification connector information.&lt;/div&gt;


    &lt;/div&gt;</p>
