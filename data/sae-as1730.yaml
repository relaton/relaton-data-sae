    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification defines the requirements for a threaded rigid coupling assembly, which utilizes ferrule type machined tube end fittings, to join tubing and components in aircraft fuel, vent and other systems. This coupling assembly is designed for use from -65 to 200 deg. F and at 125 psi operating pressure.&lt;/div&gt;
