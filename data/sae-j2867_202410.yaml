  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended for use in testing and evaluating the performance of electric cooling fan (ECF) assemblies typically used for vehicle engine cooling. Conducted in a laboratory environment with intended heat exchangers, the performance measurement includes fan output in terms of airflow and pressure and fan motor input in terms of voltage and current. This information can be used to calculate the efficiency of the assembly, including aerodynamic efficiency of the fan and shroud, and electrical efficiency of the motor. The electric power consumption can be used to estimate electrical charging system sizing and fuel economy.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The performance of a given fan assembly depends on the installation details of the application, including the effects of system resistance and geometries of the grill, heat exchangers, engine and other underhood components, and front end components. This document provides guidance for duplicating such details in the test setup for accurate performance measurement.&lt;/div&gt;



    &lt;/div&gt;</p>
