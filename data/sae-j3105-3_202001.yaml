  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document details one of the connections of the SAE J3105 document. The connections are referenced in the scope of the main document SAE J3105. SAE J3105/3 details the enclosed pin and sleeve connection. All the common requirements are defined in the main document; the current document provides the details of the connection.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers the main safety and interoperability relevant requirements for an electric vehicle power transfer system using a conductive automated charging device based on an enclosed pin and socket design. To allow interoperability for on-road vehicles (in particular, buses and coaches), one configuration is described in this document. Other configurations may be used for non-standard applications (for example, mining trucks or port vehicles).&lt;/div&gt;&lt;/div&gt;</p>
