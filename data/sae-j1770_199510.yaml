  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to establish the specific minimum equipment requirements for recovery/recycling equipment intended for use with both R12 and R134a in a common refrigerant circuit that has been directly removed from, and is intended for reuse in, mobile air-conditioning (A/C) systems. This document does not apply to equipment used for R12 and R134a having a common enclosure with separate circuits for each refrigerant.&lt;/div&gt;&lt;/div&gt;</p>
