  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report contains background information on life cycle cost elements and key ECS cost factors. Elements of life cycle costs are defined from initial design phases through operational use. Information on how ECS designs affect overall aircraft cost and information on primary factors affecting ECS costs are discussed. Key steps or efforts for comparing ECS designs on the basis of LCC are outlined. Brief descriptions of two computer programs for estimating LCC of total aircraft programs and their use to estimate ECS LCC, are included.&lt;/div&gt;&lt;/div&gt;</p>
