abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides a table of textual messages meeting the requirements for expressing "International Traveler Information Systems" (ITIS) phrases commonly used in the ITS industry.&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; The tables provided herein follow the rules of SAE J2540 and therefore allow a local representation in various different languages, media expressions etc… to allow true international use of these phrases. The phrases are predominantly intended for use in the description of traffic related events of interest to travelers and other traffic practitioners. Other phrases exist for other specific specialty areas of ITS, and all such phrases follow a set of encoding and decoding rules outlined in SAE J2540 to ensure that the use of these phrases in messages remains interoperable between disparate types of user equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard SHALL define the normative index values to be used to provide phrases needed by ITS practitioners. This standard provides non-normative textual phrases which MAY be used by implementers to ensure intelligible results. This standard SHALL define the normative index values and textual phrases to be used in the defining ASN.1 and shall provide similar expressions in XML. This standard SHALL follow the formats and rules established in SAE J2540 in the expressions, manipulations, and use of such tables.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It should be pointed out that within the rules established by this standard a variety of final tables are all considered "compliant" with the standard, and may vary as fits the needs of implementers.&lt;/div&gt;
    &lt;/div&gt;</p>
