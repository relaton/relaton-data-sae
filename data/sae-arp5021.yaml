  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides guidance for oxygen cylinder installation on commercial aircraft based on rules and methods practiced in aerospace industry and as far as applicable in other associations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It covers considerations to be taken for oxygen systems from beginning of project phase up to production, maintenance, and servicing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The document is focused on requirements regarding DOT approved oxygen cylinders. However, its basic rules may also be applicable to new development pertaining to use of such equipment in an oxygen environment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For information regarding oxygen cylinders itself, reference should be made to AIR825/12 also.&lt;/div&gt;&lt;/div&gt;</p>
