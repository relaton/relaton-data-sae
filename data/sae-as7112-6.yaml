  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) is to be used as a supplement to SAE AS7112. In addition to the requirements specified in AS7112, the requirements specified herein shall apply to suppliers seeking Nadcap Fluid System accreditation for manufacturing titanium 3AI-2.5V alloy, seamless hydraulic tubing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The corresponding PRI Audit Criteria (AC) is to be applied to ensure the tubing is manufactured to the applicable specification(s) and standard(s).&lt;/div&gt;&lt;/div&gt;</p>
