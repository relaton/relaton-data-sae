  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes minimum design, installation, qualification, and operational requirements for thermally actuated, pressure release devices for use only in tubeless tire type aircraft wheels. These devices are designed to completely release the contained inflation pressure from a tubeless tire and wheel assembly when brake generated heat causes the assembly to exceed a safe temperature operating level. The objective is to prevent tire or wheel rupture due to brake generated heat which could cause serious personnel injuries or serious aircraft operational hazards.&lt;/div&gt;&lt;/div&gt;</p>
