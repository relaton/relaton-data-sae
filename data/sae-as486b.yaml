abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this standard is set forth the desired location, arrangement
    and general requirements of aircraft circuit breakers and fuses. The recommendations
    of this standard apply to all civil type multi-engine transport aircraft.  The
    definitions used herein are made as brief as possible and in familiar cockpit
    language.  They are intended only to identify the devices mentioned rather than
    to prescribe their application.</p>"
