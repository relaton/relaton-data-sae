    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers grease for use on aircraft wheel bearings. It also defines the quality control requirements to assure batch conformance and materials traceability and the procedures to manage and communicate changes in the grease formulation and brand. This specification invokes the Performance Review Institute (PRI) product qualification process. Requests for submittal information may be made to the PRI at the address in &lt;span class="xref"&gt;2.2&lt;/span&gt;, referencing this specification. Products qualified to this specification are listed on a qualified products list (QPL) managed by the PRI. Additional tests and evaluations may be required by individual equipment builders before a grease is approved for use in their equipment. Approval and/or certification for use of a specific grease in aero and aero-derived marine and industrial applications is the responsibility of the individual equipment builder and/or governmental authorities and is not implied by compliance with or qualification to this specification.&lt;/div&gt;&lt;/div&gt;</p>
