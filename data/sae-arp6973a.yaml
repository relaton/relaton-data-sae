  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP provides two methods for measuring the aircraft noise level reduction of building façades. Airports and their consultants can use either of the methods presented in this ARP to determine the eligibility of structures exposed to aircraft noise to participate in an FAA-funded Airport Noise Mitigation Project, to determine the treatments required to meet project objectives, and to verify that such objectives are satisfied.&lt;/div&gt;&lt;/div&gt;</p>
