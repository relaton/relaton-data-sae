  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the minimum requirements for a low-permeation tubing (100 g/m&lt;sup&gt;2&lt;/sup&gt;/day or less) for use as a low pressure (14.5 kPa) liquid- or vapor-carrying component for use in gasoline or diesel fuel filler, vent, and vapor systems. The construction shall be designed to be functional over a temperature range of -40 to 100 °C for the T1 designation, or -40 to 125 °C for the T2 designation.&lt;/div&gt;&lt;/div&gt;</p>
