    &lt;div class="htmlview paragraph"&gt;ASTM E430—Measurement of Gloss of High Gloss Metal Surfaces Using Abridged Goniophotometer or Goniophotometer&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
