abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice provides direction for the design of
    a truck or truck tractor vehicle identification number (VIN). This practice supplements
    SAE J272c. It applies to characteristics of truck and truck descriptive and identifying
    information which are to be set forth in a uniform manner in the vehicle identification
    number.</p>"
