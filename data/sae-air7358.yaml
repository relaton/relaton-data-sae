    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) contains a description of the design approach, the calculations, some comparisons to alternate SAE Aerospace Recommended Practice (ARP) documents, and the background information used to generate the standard face seal gland dimensions specified in AS6235.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: This AIR should be read in conjunction with AS6235. In some instances, the information contained within AS6235 is repeated for clarity.&lt;/div&gt;&lt;/div&gt;</p>
