    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an aluminum alloy powder metallurgy product in the form of round extrusions up to 3.5 inches (89 mm) in diameter and rectangular and other solid extrusions up to 10 square inches (64.5 cm&lt;sup&gt;2&lt;/sup&gt;) in cross-sectional area. The maximum extrusion length is 100 inches (2.5 m).&lt;/div&gt;&lt;/div&gt;</p>
