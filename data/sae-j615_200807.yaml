abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard defines engine mounting dimensions for industry standardization
    and interchangeability. Table 1 and Figure 1 are dimensions for arm type mountings.
    Table 2 and Figure 2 are for side pad mountings. For engine housing SAE flange
    dimensions, see SAE J617. For engine foot type mountings (front and rear), see
    SAE J616.</p>"
