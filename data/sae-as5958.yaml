    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for externally swaged titanium tube fittings on titanium tubing with flareless separable fitting for use in hydraulic supply and return aerospace fluid systems up to operating pressure of 5080 psig (35,000 kPa) maximum and an operating temperature range of -65 to +275 °F (-54 to +135 °C).&lt;/div&gt;&lt;/div&gt;</p>
