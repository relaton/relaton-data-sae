    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a system for classification and specification for limited number of polyamides (nylons) used in the Automotive Industry. Based upon ASTM D 4066, it calls for additional descriptive characteristics and properties commonly used in the Automotive Industry. Recycled polyamides meeting requirements of this practice may be used interchangeably with virgin resins.&lt;/div&gt;
    &lt;/div&gt;</p>
