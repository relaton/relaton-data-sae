  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes methods for characterizing the robustness of vehicle electronic modules to certain environmental stresses. They include:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Voltage-Temperature Design Margins&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Voltage Interruptions-Transients Over Temperature&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Voltage Dips&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Current Draw Under a Number of Conditions&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;These methods can be applied during Development, Pre-Qualification, Qualification or for Conformity. This document does not address other environmental robustness stresses such as vibration, high temp exposure, load faults, ESD, etc.&lt;/div&gt;

    &lt;/div&gt;</p>
