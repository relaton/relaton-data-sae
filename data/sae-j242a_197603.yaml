  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This standard covers complete general and dimensional specifications for most commonly used metric thread high pressure fuel injection line fittings and the related components with which they are assembled.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The basic type of fuel injection tubing connection is the swaged-tapered seat type identified as Type 2 (to correspond to the similar design in SAE J521) and is specified in &lt;span class="xref"&gt;Fig. 1&lt;/span&gt; and &lt;span class="xref"&gt;Table 1&lt;/span&gt;. This type is available in two designs, Style A and Style B, the latter having a collar and nut designed to provide support of the tubing beyond the end of the nut. These connections consist of an upset tapered male seat formed on the end of the high pressure tubing itself (&lt;span class="xref"&gt;Fig. 1D&lt;/span&gt;), which is compressed against the mating seat in the pump discharge or nozzle inlet fitting (&lt;span class="xref"&gt;Fig. 1C&lt;/span&gt;) by means of the collar (&lt;span class="xref"&gt;Figs. 1E&lt;/span&gt; or &lt;span class="xref"&gt;1G&lt;/span&gt;) and the nut (&lt;span class="xref"&gt;Figs. 1F&lt;/span&gt; or &lt;span class="xref"&gt;1H&lt;/span&gt;). (See assembled connections, &lt;span class="xref"&gt;Figs. 1A&lt;/span&gt; and &lt;span class="xref"&gt;1B&lt;/span&gt;.) Upsetting the seat on the end of tubing requires special tools and experienced personnel, and after swaging the inside diameter of the upset portion of tube must be reamed to its original size.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The following general specifications supplement the dimensional data contained in &lt;span class="xref"&gt;Table 1&lt;/span&gt; with respect to all unspecified detail.&lt;/div&gt;&lt;/div&gt;</p>
