- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice describes the test procedures for conducting frontal impact restraint system tests for heavy truck applications. Its purpose is to establish recommended test procedures that will standardize restraint system testing for heavy trucks. Descriptions of the test set-up, test instrumentation, photographic/video coverage, and the test fixtures are included.</p>"
