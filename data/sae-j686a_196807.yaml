    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes basic dimensions for motor vehicle license plates. It is based on data supplied by the American Association of Motor Vehicle Administrators, Automobile Manufacturers Association, and Motorcycle, Scooter and Allied Trades Association. The dimensions established in this standard have considered legibility and identification of the license plate.&lt;/div&gt;&lt;/div&gt;</p>
