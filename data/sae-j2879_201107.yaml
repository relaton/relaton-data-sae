    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to 90 degree double inverted flares used on common sizes of automotive hydraulic brake tubes, and their associated tube nuts and mating ports. The intent of this standard is to replace the use of SAE J512 and SAE J533 for automotive hydraulic brake tube connections.&lt;/div&gt;&lt;/div&gt;</p>
