  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies the procedure and requirements for heat treating low-alloy and tool steels and for their subsequent gas nitriding by the use of raw or dissociated ammonia. Specific process parameters are given for Nitralloy 135M, Nitralloy EZ, Nitralloy N, 4140, 4340, D6AC and H11 steels. Additional alloys and steel families (e.g., stainless steels) can also be nitrided using parameters acceptable to the cognizant engineering organization.&lt;/div&gt;

    &lt;/div&gt;</p>
