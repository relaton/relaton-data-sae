  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method is designed to indicate the degree of surface tackiness, color transfer, loss of embossment, and surface marring when two trim materials are placed face to face under specific conditions of time, temperature, and pressure. These specific conditions are not dictated in this test procedure but will be found in the material standards which govern each type of trim material to be tested.&lt;/div&gt;&lt;/div&gt;</p>
