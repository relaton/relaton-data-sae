abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard defines methods and apparatus to evaluate electronic
    devices for immunity to potential interference from conducted transients along
    battery feed or switched ignition inputs.  Test apparatus specifications outlined
    in this procedure were developed for 12-V passenger cars and light trucks, 12-V
    heavy-duty trucks, and vehicles with 24-V systems.  Presently, it is not intended
    for use on other input/output (I/O) lines of the device under test (DUT).</p>"
