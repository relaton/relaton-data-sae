  content: |-
    <p>&lt;p&gt;This specification covers a titanium alloy in the form of sheet, strip, and plate procured in metric units.&lt;/p&gt;
    &lt;p&gt;AMS 4911 is the inch/pound version of this MAM.&lt;/p&gt;
    &lt;p&gt;These products have been used typically for parts requiring strength up to 400 degrees C, but usage is not limited to such applications.&lt;/p&gt;
    &lt;p&gt;Certain processing procedures and service conditions may cause these products to become subject to stress-corrosion cracking; ARP 982 recommends practices to minimize such conditions.&lt;/p&gt;</p>
