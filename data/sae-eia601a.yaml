  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard specifies requirements for the approval and maintenance of a manufacturer's capability and the procedures for the test and release of passive electronic components manufactured under capability approval. It also includes requirements for generic specifications that invoke this standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It applies to all passive electronic components to be released under the capability requirements of an EIA generic and/or sectional and/or detail specification.&lt;/div&gt;&lt;/div&gt;</p>
