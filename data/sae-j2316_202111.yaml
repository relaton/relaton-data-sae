  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides a uniform procedure and performance requirements for evaluating fastening systems for normal highway use on aftermarket passenger cars and light trucks (except dual wheels, which are covered by SAE J1965) and multipurpose passenger vehicles. The fastening system includes the wheel, wheel bolts, and wheel nuts, as well as vehicle mating surface. The coefficients of friction for steel and aluminum mating surfaces are provided based on information available. Many factors must be considered in design and validation of wheel attachments for each specific vehicle. Where the procedure is used for original equipment applications the vehicle manufacturers specifications supersede those noted.&lt;/div&gt;&lt;/div&gt;</p>
