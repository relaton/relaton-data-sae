    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice recommends a common naming convention to be used to designate the terminals on automotive generators found in internal combustion engine road vehicles. The intent is to standardize the terminology in use. This document is not intended to include hybrid and/or electric vehicles.&lt;/div&gt;&lt;/div&gt;</p>
