  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification describes a method for determining the specific gravity of tubing, fabricated from polytetrafluoroethylene, after a controlled heating and cooling cycle. The specific gravity obtained by this method is a measure of relative molecular weight of the resin. The measure, termed Relative Specific Gravity (RSG), increases with decreasing molecular weight (see &lt;span class="xref"&gt;2.3&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
