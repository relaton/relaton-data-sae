  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The design and location of rear-viewing mirrors or systems, and the presentation of the rear view to the driver can best be achieved if the designer and the engineer have adequate references available on the physiological functions of head and eye movements and on the perceptual capabilities of the human visual system. The following information and charts are provided for this purpose. For more complete information of the relationship of vision to forward vision, see SAE SP-279.&lt;/div&gt;&lt;/div&gt;</p>
