    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended as a guide to the use of radial lip type seals. It has been prepared from existing literature, which includes standards, specifications, and catalog data of both oil seal producers and users and includes generally accepted information and data. The main reason for the preparation of the document is to make standard information available in one document to the users of oil seals.&lt;/div&gt;&lt;/div&gt;</p>
