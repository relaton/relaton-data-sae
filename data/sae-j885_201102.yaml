  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report reviews current&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; quantitative data on human tolerance levels without recommending specific limits. Data developed on humans (including cadavers) are presented where available; however, in many cases animal data are provided where no suitable human results have been reported. This report confines itself, as much as possible, to information of direct use to the automotive designer and tester. Data of only academic interest are largely omitted; therefore, J885 should not be considered as a complete summary of all available biomechanical data.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Most of the data cited in this report applies to adult males since little information is available on women or children. The summary data provided in the tables should be considered in conjunction with the accompanying descriptive test. This material explains the manner in which the data were obtained and provides an insight as to their limitations.&lt;/div&gt;
    &lt;/div&gt;</p>
