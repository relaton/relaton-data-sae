    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This user’s manual covers the instrumented arm for the Hybrid III 5th Percentile Small Female dummy as well as the SID –IIs dummy. It is intended for technicians and engineers who have an interest in assessing arm injury from the use of frontal and side impact airbags. It covers the construction, disassembly and reassembly, available instrumentation, and segment masses.&lt;/div&gt;&lt;/div&gt;</p>
