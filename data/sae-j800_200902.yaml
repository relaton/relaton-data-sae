abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice provides general installation instructions
    for aftermarket, universal type seat belt assemblies for installation in passenger
    cars, trucks, buses, and multipurpose passenger vehicles. This SAE document is
    intended to provide guidance in the installation of seat belt assemblies meeting
    the requirements of Part 571.209 of Title 49 of the Code of Federal Regulations
    as established by the National Highway Traffic Safety Administration.</p>"
