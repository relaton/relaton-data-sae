  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to flywheels and flywheel-starter ring gear assemblies used with internal combustion engines of the spark ignition and diesel type equipped with a governor or speed limiting device. Engine sizes are those capable of using SAE No. 6 through SAE No. 00 flywheel housings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to methods used to determine the rotational speed capability of flywheels for stresses imposed by centrifugal forces only.&lt;/div&gt;

    &lt;/div&gt;</p>
