abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document discusses, in broad general terms, typical present instrumentation practice for post-overhaul gas turbine engine testing. Production engine testing and engine development work are outside the scope of this document as they will typically use many more channels of instrumentation, and in most cases will have requirements for measurements that are never made in post-overhaul testing, such as fan airflow measurements, or strain measurements on compressor blades.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specifications for each parameter to be measured, in terms of measurement range and measurement accuracy, are established by the engine manufacturers. Each test cell instrument system should meet or exceed those requirements. Furthermore, each instrument system should be recalibrated regularly, to ensure that it is still performing correctly.&lt;/div&gt;&lt;/div&gt;</p>
