  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers chemical check analysis limits for wrought nickel alloys and cobalt alloys having nominal compositions made up of elements, other than iron, that comprise more than 50% of the total. The chemical check analysis limits shown herein shall apply when this specification is referenced in the material specification. Check analysis limits for elements or for ranges of elements not listed herein shall be as specified in the applicable material specification or agreed upon by purchaser and vendor.&lt;/div&gt;&lt;/div&gt;</p>
