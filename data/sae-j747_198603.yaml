  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure describes laboratory tests for establishing operating characteristics of hydraulic directional control valves used on mobile industrial and construction equipment as referenced in SAE J1116. These characteristics are to be recorded on data sheets similar to those shown herein. Two sets of data are to be submitted--one at 122°F (50°C) and one at 194°F (90°C). A separate set of data sheets is to be submitted for the cylinder ports closest to, and farthest from the inlet and outlet ports of a multiple section valve.&lt;/div&gt;&lt;/div&gt;</p>
