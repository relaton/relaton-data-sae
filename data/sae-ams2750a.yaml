  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers equipment (temperature sensing elements, instrumentation) and tests (system accuracy, temperature uniformity) required to ensure that parts or raw materials (See &lt;span class="xref"&gt;8.1.7&lt;/span&gt;) being heat treated are exposed to the temperatures indicated on the controlling and recording instruments. It is applicable to all heat treatment of parts and to final heat treatment of raw material which could affect its fabricability or the properties of parts. Unless otherwise specified herein, it is not applicable to heating, or to intermediate (non-final) heat treatment, or raw material, e.g., for hot working.&lt;/div&gt;
    &lt;/div&gt;</p>
