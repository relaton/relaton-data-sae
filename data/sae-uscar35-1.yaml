  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;A bolt-load retention (BLR) test is a practical test to determine the bolt load of a fastener joint with time and at given temperatures. There are three types of BLR tests described in this standard, namely general-purpose test, design-purpose test, and screening material test. A general-purpose BLR test may be used for screening materials, while a design-purpose BLR test is usually used to verify the BLR behavior of a specific joint. The screening material test is an example of the general-purpose test for typical automotive applications.&lt;/div&gt;&lt;/div&gt;</p>
