  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard specifies the dimensional, design criteria, fabrication, performance, operational, environmental, and testing requirements for interline pallets requiring airworthiness approval for loading onto civil transport aircraft equipped with NAS3610/AS36100 restraint systems and using pallet nets meeting the requirements of AS1492. Type II/2 covers NAS3610/AS36100 code sizes. Type III pallets have been removed from this SAE Aerospace Standard revision.&lt;/div&gt;
    &lt;/div&gt;</p>
