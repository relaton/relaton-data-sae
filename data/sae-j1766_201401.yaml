  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Electric, Fuel Cell and Hybrid vehicles may contain many types of high voltage systems. Adequate barriers between occupants and the high voltage systems are necessary to provide protection from potentially harmful electric current and materials within the high voltage system that can cause injury to occupants of the vehicle during and after a crash. This SAE Recommended Practice is applicable to Electric, Fuel Cell and Hybrid vehicle designs that are comprised of at least one vehicle propulsion voltage bus with a nominal operating voltage greater than 60 and less than 1,500 VDC, or greater than 30 and less than 1,000 VAC. This Recommended Practice addresses post-crash electrical safety, retention of electrical propulsion components and electrolyte spillage.&lt;/div&gt;



    &lt;/div&gt;</p>
