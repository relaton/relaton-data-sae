    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a uniform procedure for the level road test of the brake systems of all combinations of new multi-purpose passenger vehicles, new light-duty trucks up to and including 10 000 lb (4500 kg) GVW and new passenger cars when coupled with new trailers (braked or unbraked).&lt;/div&gt;&lt;/div&gt;</p>
