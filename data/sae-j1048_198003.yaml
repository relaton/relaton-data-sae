  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard specifies the symbols, that is, conventional signs, with which certain controls, indicators and tell-tales of a road vehicle are to be provided in order to insure their identification and facilitate their utilization.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It also indicates the colors of possible optical tell-tales which warn the driver of the operation or malfunctioning of the devices and equipment connected to the corresponding controls.&lt;/div&gt;
    &lt;/div&gt;</p>
