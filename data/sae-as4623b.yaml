  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines the requirements for heavy-duty polytetrafluoroethylene (PTFE) lined, para-aramid reinforced, hose assembly suitable for use in 275 °F, 3000 psi aircraft systems where rapid rate pulsing and torsional/longitudinal flexing may occur in addition to normal hydraulic system loading. Size -16 and -20 are limited to +225 °F service.&lt;/div&gt;&lt;/div&gt;</p>
