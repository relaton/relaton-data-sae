abstract:
- language: en
  script: Latn
  content: "<p>It is the fundamental purpose of this standard to prescribe the functional properties of safety glazing materials in such a manner that they can be used in any place in motor vehicles and motor vehicle equipment for which they possess those mechanical or optical properties, or both, that are requisite and appropriate. For example, safety glazing materials for windshields must pass a specified group of test requirements, all of which currently can be met only by certain laminated safety glazing; however, if and when other safety glazing materials are developed which possess properties such that they, too, fulfill the requirements of the prescribed tests for this location, they may also be used; and similar reasoning would apply for other locations. This standard is designed to serve two purposes: (1) to afford a basis for standards for adoption in regulations by governmental regulatory bodies; or (2) for use by motor vehicle commissioners or others as reference standards in such cases as they may have discretionary authority to adopt these or other standards in connection with the approval of safety glazing materials or other items of use in or on motor vehicle equipment.</p>"
