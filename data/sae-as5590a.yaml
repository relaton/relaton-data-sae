  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the performance requirements for a plug and receptacle. The connector inserts may contain multiple termini or multiple termini and electrical contacts. The connectors use removable termini, or removable termini and electrical contacts, and are capable of operating within a temperature range of −65 to +200 °C (see &lt;span class="xref"&gt;1.2.1.1&lt;/span&gt;). These connectors are supplied under AS9100 reliability assurance program.&lt;/div&gt;&lt;/div&gt;</p>
