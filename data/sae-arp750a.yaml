  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;In addition to those aspects of a passenger seat such as comfort and appearance, the passenger seat, whether aft, forward, or side-facing, is the basic link that supports and ties the air transport passenger to the aircraft structure. It is essential that the support and tiedown functions be accomplished in a manner that will provide maximum safety and security during all normal conditions of flight, emergency flight maneuvers and crash landings, whether on land or sea and that these functions not be compromised to attain the comfort and appearance features.&lt;/div&gt;&lt;/div&gt;</p>
