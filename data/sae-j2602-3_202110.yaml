  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the requirements for SAE implementations based on ISO 17987. Requirements stated in this document will provide a minimum standard level of performance to which all compatible systems, design and development tools, software, ECUs, and media shall be designed. This will assure consistent and unambiguous serial data communication among all connected devices regardless of supplier.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document may be referenced by any vehicle OEM component technical specification that describes any given ECU in which the single wire data link controller and physical layer interface is located.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The intended audience includes, but is not limited to, ECU suppliers, LIN controller suppliers, LIN transceiver suppliers, component release engineers, and vehicle system engineers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The term “master” has been replaced by “commander” and term “slave” with “responder” in the following sections.&lt;/div&gt;

    &lt;/div&gt;</p>
