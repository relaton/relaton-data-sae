  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Hardness testing with files consists essentially of cutting or abrading the surface of metal parts, and approximating the hardness by the feel, or extent to which, the file bites into the surface. The term "file hard" means that the surface hardness of the parts tested is such that a new file of proven hardness will not cut the surface of the material being tested.&lt;/div&gt;
    &lt;/div&gt;</p>
