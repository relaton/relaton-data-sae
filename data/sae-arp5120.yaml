  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;ARP5120 provides recommended best practices, procedures, and technology to guide the physical and functional design, development, integration, verification, and validation of highly reliable Engine Health Management (EHM) systems for aircraft engines and Auxiliary Power Units (APUs). This SAE Aerospace Recommended Practice (ARP) also serves as a concise reference of considerations, approaches, activities, and requirements for producing the end-to-end engine health management system comprised of both on and off-board subsystems for the sensing, acquisition, analysis, detection, and data handling functions for EHM. These functions may also be used to effect continued operation or return to service decisions when demonstrated as compliant with the applicable airworthiness requirements defined by the responsible Aviation Authority. Where practical, this document delineates between military and commercial practices.&lt;/div&gt;

    &lt;/div&gt;</p>
