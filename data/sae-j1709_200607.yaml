abstract:
- language: en
  script: Latn
  content: "<p>This SAE Information Report provides an overview of brake fluid technology developed and marketed in Europe which offers enhanced wet and dry boiling point performance.  The information contained within this document applies to hydraulic brake fluids utilized in automotive braking systems which are designed to be compatible with SAE J1703 (DOT 3) and SAE J1704 (DOT 4) fluids.  The report reflects details received as of September 1998.</p>"
