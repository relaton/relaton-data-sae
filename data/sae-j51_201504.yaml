  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers reinforced hose, or hose assemblies, intended for conducting liquid and gaseous dichlorodifluoromethane (refrigerant 12) in automotive air-conditioning systems. The hose shall be designed to minimize permeation of refrigerant 12 and contamination of the system and to be serviceable over a temperature range of −30 to 120 °C (−22 to 248 °F). Specific construction details are to be agreed upon between user and supplier.&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE—R12 refrigerant has been placed on a banned substance list due to its ozone depletion characteristics. SAE J51 specification will be phased out as new automotive A/C systems are using R134a. SAE J2064 is the Standard for refrigerant 134a hose. For refrigerant 134a use, refer to SAE J2064.&lt;/div&gt;&lt;/div&gt;</p>
