  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies the testing requirements, including test equipment, to demonstrate a package of lithium-ion (UN3480) cylindrical cells of a format of 21700 or smaller intended for air transport contains the potential hazardous effects to the aircraft resulting from the failure of a cell within the package.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test described in this standard is intended to force a cylindrical lithium-ion cell into thermal runaway using thermal energy applied to the exterior of a cell. It is understood that, in the future, technology may be developed that will prevent cells from going into thermal runaway by this standard’s test protocol. The scope of this standard may be expanded as more technology and information become available.&lt;/div&gt;&lt;/div&gt;</p>
