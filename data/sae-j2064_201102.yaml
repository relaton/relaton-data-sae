  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers hose and hose assemblies intended for conducting liquid and gaseous R134a and/or R-1234yf refrigerant in automotive air-conditioning systems. The hose shall be designed to minimize permeation of the refrigerant, contamination of the system, and to be functional over a temperature range of −30 to 125 °C. Specific construction details are to be agreed upon between user and supplier. A hose marked “J2064 - R134a”, “J2064 - R-1234yf” or “J2064 - R134a/R-1234yf” signifies that it has been coupled, tested, and has met the requirements of SAE J2064 for the marked refrigerant(s). A hose marked “J2064” without any reference to refrigerant signifies that it has been coupled, tested, and has met the requirements of SAE J2064 for R134a only. It is the hose assembly manufacturer’s responsibility to see that the assemblies meet the specified acceptance criteria for this specification.&lt;/div&gt;&lt;/div&gt;</p>
