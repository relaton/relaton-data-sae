  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Part Standard covers selected inch dimensioned washers and lock washers manufactured in accordance with American Society for Mechanical Engineers dimensional standards. This SAE standard covers material most often used in ship systems and equipment but its use may be applied wherever washers of the covered materials are used. This standard permits the washers to be identified and ordered by a part or identifying number (PIN) as defined in this standard.&lt;/div&gt;

    &lt;/div&gt;</p>
