    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The performance of an aircraft tire/wheel assembly in service is dependent on the geometrical fit, load distribution, and performance at the tire/wheel interface while rolling. This document focuses on the tire-to-wheel circumferential movement for a new tubeless tire.&lt;/div&gt;&lt;/div&gt;</p>
