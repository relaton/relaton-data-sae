  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommendation establishes objectives for high performance control motors to be used with aeronautical and associated equipment in protective enclosures or completely within the shell of the aircraft so that they are subjected only to the internal climatic conditions of heat, cold, shock, vibration, altitude, and humidity. Control motors larger than size #23 are not covered in this document.&lt;/div&gt;&lt;/div&gt;</p>
