  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Report presents general information on over 50 alloys in which nickel either predominates or is a significant alloying element. It covers primarily wrought materials, and is not necessarily all inclusive. Values given are in most cases average or nominal, and if more precise values are required the producer(s) should be contacted. This report does not cover the so-called "superalloys," or the iron base stainless steels. Refer to SAE J467, Special Purpose Alloys, and SAE J405, Chemical Compositions of SAE Wrought Stainless Steels, respectively, for data on these alloys.&lt;/div&gt;&lt;/div&gt;</p>
