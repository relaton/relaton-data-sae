  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies the interface requirements for towbar attachment fittings on the nose gear (when towing operations are performed from the nose gear) of conventional tricycle type landing gears of commercial civil transport aircraft with a maximum ramp weight between 8600 kg (19 000 lb) and 50 000 kg (110 000 lb), commonly designated as “regional aircraft”.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Its purpose is to achieve towbar attachment fittings interface standardization by aircraft weight category (which determines towbar forces) in order to ensure that one single type of towbar with a standard connection can be used for all aircraft types within or near that weight category, so as to assist operators and airport handling companies in reducing the number of different towbar types used.&lt;/div&gt;&lt;/div&gt;</p>
