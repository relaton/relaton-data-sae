  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes a uniform method to calculate and specify swing performance characteristics of material handlers, knuckle boom log loaders, delimbers, feller bunchers, harvesters, processors, and other knuckle boom material handlers. It establishes definitions and specifies machine conditions for calculations and tests. This document applies to knuckle boom log loaders as defined in SAE J1209 and SAE J2055 and to certain forestry equipment defined in SAE J1209 and ISO 6814 that have rotating upper-structures such as feller bunchers, harvesters, processors, and forwarders. Included in the definition of knuckle boom log loaders are behind the cab and rear-mounted log loaders not having their own power supply.&lt;/div&gt;
    &lt;/div&gt;</p>
