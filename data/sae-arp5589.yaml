  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The document focuses on perspective flight displays with or without guidance and is intended for flight deck display applications. Further, this document does not directly address the presence or absence of background information, e.g., synthetic and/or enhanced imagery. Such issues are addressed in a separate E/SVS document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Since this document provides recommendations, the guidance is provided in the form of “should” statements as opposed to the “shall” statements that appear in standards and regulations. When “shall” statements are used, the regulation or standard is referenced (where applicable).&lt;/div&gt;
    &lt;/div&gt;</p>
