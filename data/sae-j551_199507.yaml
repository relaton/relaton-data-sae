abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard covers the measurement of broadband electromagnetic radiation over the frequency range of 30 to 1000 MHz from a vehicle or other device powered by an internal combustion engine or electric motor.  Operation of all engines (main and auxiliary) of a vehicle or device is included.  All equipment normally operating when the engine is running is also included except operator-controlled equipment, which is excluded.

    The recommended level applies only to complete vehicles or devices in their final manufactured form.  Vehicle mounted rectifiers used for battery charging in electric vehicles are included in this document when operated in their charging mode.</p>
