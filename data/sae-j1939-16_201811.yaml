  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Define a process enabling devices to detect the baud rate of a SAE J1939-11, SAE J1939-14, or SAE J1939-15 network automatically with the intent of minimizing or eliminating communication disruption between existing devices. These networks only support CBFF and CEFF Data Frames, as defined in ISO 11898-1.&lt;/div&gt;&lt;/div&gt;</p>
