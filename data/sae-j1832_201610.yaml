abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice Document promotes uniformity in the evaluation tests and performance measurements that are conducted on fuel injectors that are used in low-pressure gasoline engine applications. The scope of this document is limited to electronically-actuated fuel injection devices that are utilized in automotive gasoline port fuel injection systems where the fuel supply pressure is usually below 1000 kPa (low-pressure). Detailed test procedures are provided for determining numerous PFI injector parameters, including, but not limited to, flow curves, leakage, electromechanical performance, fluid compatibility and corrosion susceptibility, durability, the effects of vibration and torsional deflection, thermal cycling effects and noise. The standardized measurement procedures in this document are all bench tests. Characterization of the fuel spray from a low-pressure gasoline port fuel injector is quite important; however, these spray characterization tests are not addressed in this document, but are covered in a companion publication: SAE J2715.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Tests and references to low-pressure gasoline injectors that are no longer commonly used in modern production are not included in the main body of this document. Superseded systems such as throttle body injection (TBI), central port injection (CPI), Pressure-Drop-Ratio (PDR), bottom-feed injectors and eight-ring patternation are examples of this older technology. Those fuel system components and diagnostic tests were extensively utilized in prior decades, but find little application in the industry today. The historical detailed measurement procedures that applied to the tests on these types of injectors have been removed from the main sections of the updated J1832; however, the associated overall descriptions of these hardware items that were in previous versions of J1832 have been retained in the Appendix for archival purposes.&lt;/div&gt;
    &lt;/div&gt;</p>
