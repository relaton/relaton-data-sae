abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This specification covers a corrosion and heat resistant nickel alloy in the form of bars, forgings, flash welded rings, and stock for forging, flash welded rings, or heading procured in SI (metric) units.&lt;/p&gt;
    &lt;p&gt;AMS 5706 is the inch/pound version of this MAM.&lt;/p&gt;
    &lt;p&gt;These products have been used typically for parts, such as fasteners, flanges, and rings, requiring high strength up to 815 degrees C and oxidation resistance up to 955 degrees C, particularly those parts which are formed or welded and then heat treated to develop required properties, but usage is not limited to such applications.&lt;/p&gt;</p>
