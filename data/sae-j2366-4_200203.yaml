  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice details the Thin Transport Layer of the Intelligent Transportation Systems (ITS) Data Bus, which is generally intended for in-vehicle use.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Thin Transport Layer sits between SAE J2366-2 and J2366-7. It provides the handling of such activities as the packetizing of long messages and message reassembly. Design of the messages and headers has stressed economy, in terms of bits within a CAN 2.0B frame.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The ITS Data Bus (IDB) is a non-proprietary virtual token passing bus, designed to allow disparate consumer, vehicle, and commercial electronic components to communicate and share information across a standard, open data bus.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document describes the Thin Transport Layer of the IDB, as shown in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
