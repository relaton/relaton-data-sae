  content: |-
    <p>This SAE Recommended Practice covers the wiring and connector standards for nonpassenger carrying trailers, SAE Classes 1-3, with circuit loads not to exceed 7.5 amp per circuit. It provides the lighting circuits of these trailers with a universal connecting device, standard circuit coding and protection for the wiring from hazards and shorts.

