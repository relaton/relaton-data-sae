  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;According to SAE6906, Force Protection and Survivability (FPS) is the HSI domain that facilitates system operation and personnel safety during and after exposure to hostile situations or environments. Force protection refers to all preventive measures taken to mitigate hostile actions against Department of Defense and DHS (e.g., United States Coast Guard, Customs and Border Patrol, Immigration and Customs Enforcement, etc.) personnel. Survivability denotes the capability of the system and/or personnel manning the system to avoid or withstand manmade hostile environments without suffering an abortive impairment of his/her ability to accomplish its designated mission. Damage due to enemy or fratricidal action, or even equipment failure, will endanger the warfighters' well-being and place them into a life-threatening situation.&lt;/div&gt;&lt;/div&gt;</p>
