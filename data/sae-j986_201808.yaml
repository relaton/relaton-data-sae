abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Standard establishes the test procedure, environment, and instrumentation for determining the exterior sound level for passenger cars, multipurpose vehicles, and light trucks having a gross vehicle mass rating of 4540 kg or less. The test procedure is characterized by having fixed initial conditions, i.e., an as-specified initial vehicle speed and gear selection at a fixed start point on the test site. Full-throttle acceleration and closed-throttle deceleration of the vehicle are included in this procedure.&lt;/p&gt;


    &lt;p&gt;Sound levels determined in accordance with this document are dependent on the performance capability of the test vehicle, as influenced by power-to-mass ratio and overall powertrain gear ratio.&lt;/p&gt;</p>
