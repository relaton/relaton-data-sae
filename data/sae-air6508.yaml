  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) supplements the AS755 performance station designation system for complex or unconventional propulsion cycles and their derivatives.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The station numbering conventions presented herein are for use in all communications concerning propulsion system performance such as computer programs, data reduction, design activities, and published documents. They are intended to facilitate calculations by the program user without unduly restricting the method of calculation used by the program supplier.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The contents of this document will follow AS755 and AS6502 where applicable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The list of symbols presented herein will be used for identification of input and output parameters. These symbols are not required to be used as internal parameter names within the engine subprogram.&lt;/div&gt;&lt;/div&gt;</p>
