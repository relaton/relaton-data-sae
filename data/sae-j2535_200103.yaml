  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to the four primary, large volume applications in the class 7-8 heavy-duty market place, as specified in SAE J1842:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;“N” trailer axle&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;“R” powered rear axle&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;“FF / FG” nonpowered front axle&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;“P” trailer axle&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies to on-highway, disc wheel / outboard drum brake applications. It is not applicable to those applications that exceed the GAWR ratings or the load line restrictions listed in columns “A,” “B,” and “C” of &lt;span class="xref"&gt;Table 1&lt;/span&gt;. Load lines are measured from the inboard bearing cup backface as shown in &lt;span class="xref"&gt;3.4&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document establishes preload force values only. The methodology to obtain these force values must be determined by the fastener supplier and/or axle assembler.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document reviews the bearing system. It is NOT intended to prescribe (new or existing) axle and/or hub manufacturers’ ratings and/or specifications.&lt;/div&gt;
    &lt;/div&gt;</p>
