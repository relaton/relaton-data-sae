  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides recommended best practice methods and processes for the in-service inspection, evaluation and cleaning of all physical contact (PC) fiber optic interconnect components (termini, alignment sleeves and connectors), test equipment and test leads for maintainers qualified to the approved aerospace fiber optic training courses developed in accordance with ARP5602 or ARINC807. This document also provides a decision-making disposition flowchart to determine whether the fiber optic components are acceptable for operation. For definitions of individual component parts refer to ARP5061.&lt;/div&gt;&lt;/div&gt;</p>
