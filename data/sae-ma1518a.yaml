  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To fully define the following requirements for bolts with spline and hexagon heads of strength class up to but not including 1250 MPa:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Head dimensions (See &lt;span class="xref"&gt;3.1&lt;/span&gt;).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Shank dimensions (See &lt;span class="xref"&gt;3.2&lt;/span&gt;).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(c)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Geometric control (See &lt;span class="xref"&gt;3.3&lt;/span&gt;).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(d)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Surface texture (See &lt;span class="xref"&gt;3.4&lt;/span&gt;).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;This standard is based on one class of thread after all processing, including coating or plating, has been completed as follows: Tolerance class 4h6h.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For particulars of thread, see AS 1370. For thread runout and lead threads, see AS 3062.&lt;/div&gt;&lt;/div&gt;</p>
