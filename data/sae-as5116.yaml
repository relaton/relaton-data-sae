  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes minimum performance standards for Airplane Ground Ice Detection (AGID) Systems. This standard also defines functional capabilities, design requirements and test procedures. An AGID system detects frost, ice, slush, or snow on the upper surface of the wings, control surfaces, and/or other critical surfaces of airplanes. The AGID system can include ground-based and/or airplane mounted devices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The AGID system will provide an indication within its area of coverage whenever frost, ice, slush or snow will affect safety of flight.&lt;/div&gt;

    &lt;/div&gt;</p>
