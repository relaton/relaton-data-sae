  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes the requirements for screening, qualification, and lot acceptance testing of Plastic Encapsulated Discrete Semiconductors (PEDS) for use in space application environments. The scope of this document is intended for standard silicon based technology only, but the process and methodology described within can be adopted for other technologies such as Silicon Carbide, Gallium Nitride, and Gallium Arsenide. However, when non-silicon based technology parts are being used, the device characterization shall be modified, and it is recommended to use available industry standards based upon published research/testing reports for those technology to address applicable physics of failure.&lt;/div&gt;
    &lt;/div&gt;</p>
