  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers closely-wound helical coil, screw thread inserts made from a corrosion resistant steel formed wire of the type identified under the Unified Numbering System as UNS N30400. The inner surface of the insert coil, after assembly into a screw thread tapped hole, provides internal threads of standard 60° Unified form.&lt;/div&gt;&lt;/div&gt;</p>
