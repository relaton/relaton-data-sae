  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides recommendations of safety message minimum performance requirements between a Vulnerable Road User (VRU) and a vehicle. It addresses the transmission of Personal Safety Messages (PSM) from road user devices carried by pedestrians, bicycle riders and public safety personnel, to provide driver and vehicle system awareness and potentially offer safety alerts to VRUs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document includes the recommendation of standards profiles, function descriptions and minimum performance requirements for transmitting the SAE J2735-defined PSM [1] over a Dedicated Short Range Communications (DSRC) Wireless communication link as defined in the Institute of Electrical and Electronics Engineers (IEEE) 1609 and the IEEE 802.11 Standards [[1]]-[5]]. While other wireless media may be used to deliver the PSM, DSRC is explicitly assumed in this document, because of anticipated regulatory ruling in the United States and other countries requiring vehicles to be equipped with a DSRC-based safety system using V2V communication.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This recommended practice is limited at this time to communications between the VRU device carried by walking pedestrians and DSRC equipped vehicles. Later versions may incorporate improvements based on field experience with this recommended practice and may include other provisions for communicating with other DSRC equipped devices, and with other VRUs.&lt;/div&gt;&lt;/div&gt;</p>
