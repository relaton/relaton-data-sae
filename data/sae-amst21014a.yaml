  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for four classes of machinable, high density tungsten base metal produced by consolidation of metal powder mixtures whose composition is mainly tungsten. This material may be used for uncoated parts or parts that may be coated with other materials for protection against corrosion and abrasion such as, electrodeposited and vacuum deposited cadmium and electrodeposited chromium. Detailed requirements for coatings should be covered in the applicable part drawing, when required.&lt;/div&gt;&lt;/div&gt;</p>
