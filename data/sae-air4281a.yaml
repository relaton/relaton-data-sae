abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Turbine engines installed in helicopters require a highly sophisticated oil system to fulfill two primary tasks:&lt;/div&gt;
    &lt;ul class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Cooling/oil supply&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Lubrication of rotating components (bearings, shafts, gears, etc.)&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;While lubrication is an engine internal operation, depending on the engine oil system configuration, cooling and oil supply may require more or less design activity on the aircraft side of the engine/airframe interface for proper engine function. The necessity for engine cooling and oil supply provisions on the airframe can lead to interface problems because the helicopter manufacturer can influence engine related functions due to the design of corresponding oil system components.&lt;/div&gt;&lt;/div&gt;</p>
