abstract:
- language: en
  script: Latn
  content: "<p>AS8049A currently requires adjustable features on aircraft seats to be designed so they can be returned to the positions required for taxi, takeoff and landing by the occupant without the release of the occupant restraints. This ARD will demonstrate Aviation Industry support for revisions to TSO-C39c and TSO-C127a to allow Technical Standard Order (TSO) approval of aircraft seat products designed with adjustable features that require the release of occupant restraints to return the feature to the taxi, takeoff and landing position.</p>"
