abstract:
- language: en
  script: Latn
  content: "<p>Problems associated with the evaluation of formability or deep drawability of sheet metals are complex and may be difficult to solve due to the number of variables involved. As long ago as 1940, the AISI Technical Committee on Sheet Steel reviewed this problem. More recently, Volume 1 of the Ninth Edition of the ASM Metals Handbook contains sections on 'Low Carbon Steel and Strip' and 'Formability of Steel Sheet' that provide suggestions to help evaluate parts and select materials. The purpose of this information report is to summarize the sheet metal characteristics that are commonly used when attempting to predict the formability of sheet metal.</p>"
