abstract:
- language: en
  script: Latn
  content: "<p>This standard provides the names of major components of dozers which
    include a blade and all associated structural elements, normally mounted in front
    of a self-propelled machine for scraping and pushing materials through forward
    motion of the machine. It also includes dimensional specification definitions
    applicable to dozers. This standard is applicable to dozers which are commonly
    used on crawler and wheel tractors as defined in SAE J1057.</p>"
