  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) specifies requirements for those portions of the aircraft Unit Load Device ground and terminal handling equipment that will have a direct bearing on the life of the ULD for the purpose of preventing undue wear on the ULD. Past experience has shown that in-service defects in regard to the above equipment cause high ULD cost. Greater control of maintenance is required.&lt;/div&gt;&lt;/div&gt;</p>
