  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers a single Un-Jacketed (UTP) and Jacketed (J-UTP) Balanced Unshielded Twisted Pair data cable intended for use in surface vehicle cables for 10 Mb/s Ethernet shared bus applications. The tests in this document are intended to qualify cables for normal operation in an automotive environment while maintaining the necessary electrical properties for reliable data transmission.&lt;/div&gt;
    &lt;/div&gt;</p>
