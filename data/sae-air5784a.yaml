  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The previous revision of AIR5784 summarizes some of the available literature on cabin air study, engine oil composition, decomposition, and toxicity testing. This revision of AIR5784 includes literature and information on stakeholder involvement, selected air sampling studies, oil composition, and oil degradation, published from 2000 to 2023. The entire contents of the reviewed literature are not necessarily endorsed by either SAE or the members of the study group who produced it.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This is not a comprehensive review but is intended to enable E-34 and other technical organizations to participate in informed discussions on the topic. Also, the review is intended to indicate where additional work may be necessary to properly gauge the potential role that turbine lubricants (and OPs) play in cabin air quality. The toxicology of oil fumes and their individual constituents is beyond the scope of this document and outside the remit of this committee.&lt;/div&gt;&lt;/div&gt;</p>
