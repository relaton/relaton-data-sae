  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice has been established to provide direction for the design and installation of an identification number (IN) as assigned to vehicle engines, transmissions, and transaxles. The IN is used for tracking or traceability of these components. In adhering to these recommended practices, facility of application in factory production and appearance quality are matters for manufacturer control. Reference SAE J853.&lt;/div&gt;&lt;/div&gt;</p>
