abstract:
- language: en
  script: Latn
  content: <p>&lt;p&gt;This collection of 12 Excel spreadsheets and related documents was developed to accompany SAE standard &lt;a href="http://standards.sae.org/j2629_201106"&gt;J2629, Standards Formats for Presenting Acoustical Data&lt;/a&gt;, which includes several preferred formats for presenting acoustical data on materials, components, systems, or vehicles. These formats cover the range of acoustical tests commonly conducted in the automotive industry. These tests follow SAE and ASTM test practices as well as vehicle specific test methods. For each test, the details of samples and test conditions are entered into an electronic template together with the acoustical results data.&lt;/p&gt;</p>
