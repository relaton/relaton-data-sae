  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the design and application of primary on-board wiring distribution system harnessing for surface vehicles. This document is intended for single phase nominal 120 VAC circuits that provide power to truck sleeper cab hotel loads so that they may operate with the main propulsion engine turned off. The power supply comes from alternative sources such as land-based grid power, DC-AC inverters and auxiliary power generators. The circuits may also provide power to improve vehicle performance through charging batteries or operating cold-weather starting aids.&lt;/div&gt;&lt;/div&gt;</p>
