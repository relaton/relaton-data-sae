  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice outlines a procedure for selecting the proper specification for carbon steel sheet and strip which are purchased &lt;i&gt;to make an identified part&lt;/i&gt;. Specifications considered are:&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;It also describes how codes or symbols for specifying certain characteristics may be used in electronic data processing systems. Characteristics covered are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(A)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Hot or cold rolled.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(B)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Sheet or strip.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(C)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Severity of draw (&lt;i&gt;quality&lt;/i&gt; of steel).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(D)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Surface condition (finish, etc.).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(E)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Edge condition.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;(F)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensions.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;It is intended that other characteristics and part identification be covered by a supplement to the specification, as necessary.&lt;/div&gt;&lt;/div&gt;</p>
