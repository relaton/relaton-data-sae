    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document includes a standard set of management practices that can be used, or espoused, by the OEMs for use during the design and development of electronic systems to mitigate the effects of future Diminishing Manufacturing Sources and Material Shortages (DMSMS). While this document focuses primarily on microelectronic devices, the methods described here may also apply to other commodities.&lt;/div&gt;&lt;/div&gt;</p>
