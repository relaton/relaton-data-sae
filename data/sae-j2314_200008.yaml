  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to promote the highest professional and personal conduct of practitioners in the fields of accident investigation and reconstruction.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It encourages the continuous application of high ethical principles to one’s own endeavors. It also encourages the application of these same principles to others associated with accident investigation and reconstruction.&lt;/div&gt;&lt;/div&gt;</p>
