  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides uniform laboratory procedures for fatigue testing of wheels for demountable rims and hubs intended for normal highway use on trucks, buses, truck trailers, and multipurpose passenger vehicles. The hubs included have bolt circle diameters ranging from 165.1 to 335.0 mm (6.500 to 13.189 inches). It is up to each hub and/or wheel for demountable rims manufacturer to determine the appropriate test method, accelerated load factor and cycle life requirements applicable to obtain satisfactory service life for a given application. When deviations from the procedures recommended herein are made, it is the responsibility of the hub and/or wheel for demountable rims developer to modify other parameters as necessary to ensure satisfactory service life for the intended application. It should be noted that this test procedure focuses on fatigue resulting from vehicle loading and cornering forces. It does not consider loads imparted to the hub from braking events.&lt;/div&gt;&lt;/div&gt;</p>
