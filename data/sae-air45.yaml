  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Outline drawings from all known pump manufacturers for the various size pumps listed in MIL-P-7740 were requested and those received have been combined to make up the various outline drawings. There has been prepared a composite outline drawing enclosing all of the individual outline drawings. Since the pump manufacturers' drawings will change over a period of time and complete detail is not shown, it is not possible to make a detailed mockup of any specific pump. These drawings are intended to provide information concerning the general space requirement for variable delivery pumps, and could be used to manufacture a composite mockup to indicate roughly the space required on a new engine design.&lt;/div&gt;&lt;/div&gt;</p>
