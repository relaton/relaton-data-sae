    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes equipment and test procedures for determining the performance of spark arrester exhaust systems of multiposition small engines (&amp;lt;19 kW) used in portable applications, including hand-held, hand-guided, and backpack mounted devices. It is not applicable to spark arresters used in vehicles or stationary equipment.&lt;/div&gt;

    &lt;/div&gt;</p>
