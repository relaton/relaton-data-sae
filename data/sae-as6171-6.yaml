  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Through the use of ultra-high frequency ultrasound, typically above 10 MHz, Acoustic Microscopy (AM) non-destructively finds and characterizes physical features and latent defects (visualization of interior features in a layer by layer process) - such as material continuity and discontinuities, sub-surface flaws, cracks, voids, delaminations and porosity. AM observed features and defects can be indicators that the components were improperly handled, stored, altered or previously used.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;If AS6171/6 is invoked in the contract, the base document, AS6171 General Requirements shall also apply.&lt;/div&gt;
    &lt;/div&gt;</p>
