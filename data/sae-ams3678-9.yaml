    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a polytetrafluoroethylene (PTFE) resin filled with inorganic pigment in the form of molded rods or tubes which are sintered after molding. The blue colored material is designated for use in rod glands only and the yellow colored material is designated for use in piston glands only.&lt;/div&gt;&lt;/div&gt;</p>
