  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of the test method is to provide stakeholders including fluid manufacturers, airport operators, brake manufacturers, aircraft constructors, aircraft operators and airworthiness authorities with a relative assessment of the effect of deicing chemicals on carbon oxidation. This simple test is only designed to assess the relative effects of runway deicing chemicals by measuring mass change of contaminated and bare carbon samples tested under the same conditions. It is not possible to set a general acceptance threshold oxidation limit based on this test method because carbon brake stack oxidation is a function of heat sink design and the operating environment.&lt;/div&gt;&lt;/div&gt;</p>
