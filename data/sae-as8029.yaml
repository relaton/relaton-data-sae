  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AS defines components in "Capacitance Sensor" and "Non-Capacitance Sensor" type Fuel and Oil Quantity Indicating Systems. "Non-Capacitance" systems may employ any measurement technique current in the art including, but not restricted to, float, ultra-sonic and fiber optic devices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The definition of the individual components contained herein is related to the specified Total Installed System accuracy of the entire Fuel or Oil Quantity Indicating System which is a part of the airframe manufacturer's type certification approval data. This data shall be available from the subject airframe manufacturer as published in the operating manual for the aircraft type, model number and configuration. The Fuel or Oil Quantity Indicating System may incorporate optimum compensation based upon measurement of dielectric constant, temperature or density to correct for variations in fuel or oil characteristics due to temperature grade variations or additives. Examples of the type of components covered by this AS are as follows:&lt;/div&gt;










