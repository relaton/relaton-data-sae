  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies the on-board system requirements for vehicle-to-vehicle (V2V) safety system for school buses, including functional requirements and performance requirements. The system can send the SAE J2735-defined basic safety message (BSM) over a wireless communications interface; the communications interface itself is outside the scope of this document. This document provides the specifications necessary to build interoperable systems that support V2V applications that rely on receiving BSMs from school buses.&lt;/div&gt;&lt;/div&gt;</p>
