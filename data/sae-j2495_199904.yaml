  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard measures the percent thermal efficiency of materials in sleeve form used to contain heat or insulate around a hot component. The percent thermal efficiency (%TE) is determined by measuring the power difference expended by the heat source (cartridge heater) with and without the test sleeve at the specified temperature. See SAE J2302 to measure radiant heat flow of sleeves.&lt;/div&gt;



    &lt;/div&gt;</p>
