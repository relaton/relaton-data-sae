abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report establishes best practices and key recommendations for the regulation of micromobility devices. The scope is focused on improving consumer safety and clarifying the distinction between electric bicycles and other motor vehicles. Specifically, this report recommends: (a) defining the 750-W motor limit for low-speed electric bicycles as a measure of peak power, not continuous power; (b) mandating electrical system and battery certification to established safety standards such as UL 2849 and UL 2271; and (c) excluding electrical systems and batteries of micromobility devices and electric bicycles from “Right to Repair” mandates to mitigate the risks of fire and injury from improper servicing.&lt;/div&gt;&lt;/div&gt;</p>
