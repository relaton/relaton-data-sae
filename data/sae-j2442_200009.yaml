  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to the location, number, color, and functioning of lamps and retro-reflecting devices installed on road vehicles. It provides a common denominator for installation requirements of lighting and light signaling devices based on existing regulatory requirements and industry standards of North America, Europe, and Asia.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not replace regulatory requirements in effect at the time of application. It is subject to changes to reflect additional experience, technical advances, and especially changes in government and industry documents used as references. Users of this document are advised to verify current legal requirements, regarding the mandatory installation of additional lighting devices or installation restrictions for devices described herein, directly with the appropriate authorities in the territory where their products are intended to be registered.&lt;/div&gt;&lt;/div&gt;</p>
