  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Standard is to establish the specific minimum equipment requirements for recovery/recycling/recharge equipment intended for use with both R-1234yf and R-134a in a common refrigerant circuit that has been directly removed from, and is intended for reuse in, mobile air-conditioning (A/C) systems. This document does not apply to equipment used for R-1234yf and R-134a having a common enclosure with separate circuits for each refrigerant, although some amount of separate circuitry for each refrigerant could be used.&lt;/div&gt;&lt;/div&gt;</p>
