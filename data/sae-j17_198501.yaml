  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These specifications and methods of testing apply to cellular-rubber products known as latex foam rubbers but do not apply to sponge and expanded rubbers. The base material used in their manufacture may be natural rubber, reclaimed rubber, synthetic rubber, or rubberlike materials, alone or in combination. In case of conflict between the provisions of these general specifications and those of detailed specifications or methods of test for a particular product, the latter shall take precedence. Reference to methods for testing cellular-rubber products should specifically state the particular test or tests desired.&lt;/div&gt;&lt;/div&gt;</p>
