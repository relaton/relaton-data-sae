abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Recommended Practice defines machines equipped with forks for material handling, which are intended for use on unimproved or disturbed terrain.  (Reference J1116, Categories 1, 2 or 6.)

    Purpose

    To identify types of machines, which use forks as working tools, while being used on unimproved surfaces.  The machines are grouped as follows: loaders/tractors with forks and rough terrain forklifts.  These groupings are used in identifying the organization responsible for applicable standards.</p>
