    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this specification is for the procurement of carbon fiber and fiberglass epoxy prepreg products with 350 °F (177 °C) cure for aerospace applications; therefore, no qualification or equivalency threshold values are provided. Users that intend to conduct a new material qualification or equivalency program must refer to the production quality assurance section (&lt;span class="xref"&gt;4.3&lt;/span&gt;) of this base specification, AMS6891.&lt;/div&gt;





    &lt;/div&gt;</p>
