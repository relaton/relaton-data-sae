abstract:
- language: en
  script: Latn
  content: "<p>Heavy Truck Crashworthiness Phase II evaluates truck cab  structural
    response to 180 degrees rollovers. The report  includes results of the development
    of a numerical finite  element model of a truck cab structure, correlation and
    enhancement of this model via physical testing of actual  sample cabs, a parametric
    study of selected cab component  structural modifications, and a numerical simulation
    of a  dynamic 180 degrees rollover event.</p>"
