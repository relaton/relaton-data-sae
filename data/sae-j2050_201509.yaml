abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers two types of hose fabricated from textile reinforcement and synthetic rubber, assembled with end fittings for use in high-temperature automotive power steering applications as flexible connections within the temperature range of −40 to +150 °C (−40 to +302 °F) maximum and 10.3 MPa (1500 psi) maximum working pressure. These hoses are intended for use in applications where reduction in amplitude of pump pressure pulsation is required. Class A hose has a nominal OD of 19.84 mm (0.781 in). Class B hose is a lightweight hose with a nominal OD of 17.91 mm (0.705 in). This specification defines the minimum performance levels of a flexible connector in the hydraulic steering system to convey power steering fluid from the steering pump to the steering gear.&lt;/div&gt;&lt;/div&gt;</p>
