    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to cover plastic safety glazing for use in motor vehicles and motor vehicle equipment. Nominal specifications for thickness, flatness, curvature, size, and fabrication details are presented principally for the guidance of body engineers and designers. For additional information on plastic safety glazing materials for use in motor vehicles and motor vehicle equipment, please refer to SAE J673.&lt;/div&gt;&lt;/div&gt;</p>
