  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is derived from SAE J2805 and specifies an engineering method for measuring the sound emitted by M and N category road vehicles at standstill and low speed operating conditions.. The specifications reproduce the level of sound which is generated by the principal vehicle sound sources consistent with stationary and low speed vehicle operating conditions relevant for pedestrian safety. The method is designed to meet the requirements of simplicity as far as they are consistent with reproducibility of results under the operating conditions of the vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test method requires an acoustic environment which is only obtained in an extensive open space or in special designed indoor facilities replicating the conditions of an extensive open space. Such conditions usually exist during:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Measurements of vehicles for regulatory certification.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Measurements at the manufacturing stage.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Measurements at official testing stations.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;The results obtained by this method give an objective measure of the sound emitted under the specified conditions of test. It is necessary to consider the fact that the subjective appraisal of the annoyance, perceptibility, and/or detectability of different motor vehicles or classes of motor vehicles due to their sound emission are not simply related to the indications of a sound measurement system. As annoyance, perceptibility, and/or detectability are strongly related to personal human perception, physiological human condition, culture, and environmental conditions, there are large variations and therefore these terms are not useful as parameters to describe a specific vehicle condition.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Spot checks of vehicles chosen at random rarely occur in an ideal acoustic environment. If measurements are carried out on the road in an acoustic environment which does not fulfill the requirements stated in this SAE Standard, the results obtained may deviate appreciably from the results obtained using the specified conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In addition, this standard provides an engineering method to assess the performance of external sound generation systems intended for the purpose of providing acoustic information to pedestrians on a vehicle’s operating condition. This information is reported as objective criteria related to the external sound generation system’s sound pressure level, frequency content, and changes in sound pressure level and frequency content as a function of vehicle speed. As such, these measures can provide pedestrians with information on the location, speed, direction of travel, acceleration, and deceleration behavior of a vehicle. Annex A contains background information relevant in the development of this SAE Standard.&lt;/div&gt;&lt;/div&gt;</p>
