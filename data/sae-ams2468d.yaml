abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This specification establishes the engineering requirements for producing a hard coating on aluminum alloys and the properties of such coating.&lt;/p&gt;
    &lt;p&gt;This coating has been used typically to increase, by the formation of a dense aluminum oxide, surface hardness and resistance to abrasion and corrosion of aluminum-alloy parts containing, in general, less than 6% copper or 8% silicon or a total of 8% of both, but usage is not limited to such applications. Alloys with higher silicon content alone can be coated satisfactorily with proper precautions in processing. Careful consideration should be given to the use of this process on highly-stressed parts because of the resultant marked lowering of fatigue performance and on parts with sharp corners and edges where chipping may result.&lt;/p&gt;</p>
