abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP describes methods that are known to have been used by aircraft manufacturers to evaluate aircraft aerodynamic performance and handling effects following application of aircraft ground deicing/anti-icing fluids (“fluids”), as well as methods under development. Guidance and insight based upon those experiences are provided, including:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Similarity analyses.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Icing wind tunnel tests.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Flight tests.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;CFD and other numerical analyses.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP also describes:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The history of evaluation of the aerodynamic effects of fluids.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The effects of fluids on aircraft aerodynamics.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The testing for aerodynamic acceptability of fluids for SAE and regulatory qualification performed in accordance with AS5900.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Additionally, &lt;span class="xref"&gt;Appendices A&lt;/span&gt; to &lt;span class="xref"&gt;E&lt;/span&gt; present individual aircraft manufacturers’ histories and methodologies, which substantially contributed to the improvement of knowledge and processes for the evaluation of fluid aerodynamic effects, and &lt;span class="xref"&gt;Appendix F&lt;/span&gt; considers the modeling of fluid removal from aerodynamic surfaces.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;/div&gt;</p>
