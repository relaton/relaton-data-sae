  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Recommended Practice is to establish uniform test procedures and minimum performance requirements for passenger car windshield wiping systems and wiper blades. This recommended practice also provides a uniform terminology of windshield wiper system characteristics and phenomena. The test procedures are limited to those tests that can be conducted on uniform test equipment by commercially available laboratory facilities.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedures and minimum performance requirements, outlined in this recommended practice, are based on currently available engineering data, If is the intent that all portions of the recommended practice will be periodically reviewed and revised as additional data regarding windshield wiping system performance are developed.&lt;/div&gt;&lt;/div&gt;</p>
