abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The landing gear system is a major and safety critical airframe system that needs to be integrated efficiently to meet the overall aircraft program goals of minimizing the penalties of weight, cost, dispatch reliability and maintenance. As the landing gear system business develops and large-scale teaming arrangements and acquisitions become increasingly common, it may be desirable in some instances to procure an Integrated Landing Gear System. This document provides guidelines and useful references for developing an integrated landing gear system for an aircraft. The document structure is divided into four sections:
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Landing Gear System Configuration Requirements (&lt;span class="xref"&gt;Section 3&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Landing Gear System Functional Requirements (&lt;span class="xref"&gt;Section 4&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Landing Gear System Integrity Requirements (&lt;span class="xref"&gt;Section 5&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Landing Gear System Program Requirements (&lt;span class="xref"&gt;Section 6&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The landing gear system encompasses all landing gear structural and subsystem elements. Structural elements include shock struts, truck beams, torsion links, braces, fittings, pins, wheels, tires, and brakes. The subsystem elements include the retraction/extension system (both normal and alternate), the steering system, the braking system (both normal and alternate, manual and automatic), the indication and monitoring systems and control systems (mechanical, hydraulic, electrical and electronic).&lt;/div&gt;

    &lt;/div&gt;</p>
