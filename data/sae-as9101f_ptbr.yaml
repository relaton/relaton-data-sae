abstract:
- language: en
  script: Latn
  content: "<p>Para garantir a satisfação dos clientes as organizações de defesa,
    aviação e aeroespacial devem fornecer e melhorar continuamente produtos e serviços,
    seguros e confiáveis, que atendam ou excedam os requisitos legais e regulamentares
    aplicáveis dos clientes. A globalização da indústria e a diversidade resultante
    das necessidades e expectativas regionais e nacionais têm dificultado este objetivo.
    As organizações têm o desafio de comprar produtos e serviços de fornecedores em
    todo o mundo, em todos os níveis da cadeia de suprimento. Os fornecedores têm
    o desafio de fornecer produtos e serviços a vários clientes com diferentes necessidades
    e expectativas de qualidade.</p>"
