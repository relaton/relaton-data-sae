  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This revision of AS6513 concerns conformance to the SAE Unmanned Systems (UxS) Control Segment (UCS) Architecture Revision B, designated AS6512B (or later). The superseded AS6513A concerned conformance to the previous UCS Architecture, designated AS6512A.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is the authoritative specification within the UCS Architecture for establishing conformance requirements for UCS products.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The conformance of UCS products is determined by assessing the conformance of the UCS Product Description to the UCS Architecture. The UCS Product Description includes test artifacts.&lt;/div&gt;


    &lt;/div&gt;</p>
