  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes methods for testing airframe plain bearings. The purpose of ARP5448 and its associated slash sheets is to document test methods commonly used to evaluate airframe bearings. These test methods may be referenced in specifications, part standards, purchase orders, etc. when the test is deemed appropriate to the intended use of the bearing by the end user of the bearing. These test methods are not intended to encompass every conceivable requirement for an airframe bearing. The end user of the bearing must exercise engineering judgment to determine the most appropriate standard and/or nonstandard tests for the application.&lt;/div&gt;&lt;/div&gt;</p>
