  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard applies to Construction, General Purpose Industrial, Agricultural, Forestry, and Specialized Mining categories of off-road, self-propelled work machines, as defined in SAE J1116. Powered industrial trucks and agricultural equipment, other than the basic agricultural tractor, are excluded from the scope of this document. The document defines positions for convenient placement of hand- and foot-operated controls derived from the overlapping reach capability of large and small operators. The large operator approximates the 95th percentile male, and small operator approximates the 5th percentile female of the U.S. population.&lt;/div&gt;
    &lt;/div&gt;</p>
