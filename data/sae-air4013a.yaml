  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) will examine network aspects of open and shorted stubs, line reflections and bus loading due to network changes. Single network level is assumed, that is, no carriage store hierarchical levels. However, two passive network coupling variants called "branched bus" and "branched stub" will be introduced that possibly could be used in a stores management network.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This report assumes familiarity with MIL-STD-1553B.&lt;/div&gt;
    &lt;/div&gt;</p>
