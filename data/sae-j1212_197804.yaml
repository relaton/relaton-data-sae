    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;Mobile forestry machines&lt;/i&gt; is intended to include those off-road machines which are designed especially for, or adapted to be used in, the planting, site preparation, harvesting, processing, and transporting of trees. The diversity of machines and systems falling within this scope prohibits detailed specifications, and therefore recommendations are of a general nature.&lt;/div&gt;&lt;/div&gt;</p>
