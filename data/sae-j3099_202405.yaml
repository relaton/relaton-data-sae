  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This practice presents methods for establishing the driver workspace. Methods are presented for:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Establishing accelerator reference points, including the equation for calculating the shoe plane angle.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Locating the SgRP as a function of seat height (H30).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Establishing seat track dimensions using the seating accommodation model.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Establishing a steering wheel position.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;Application of this document is limited to Class-A Vehicles (Passenger Cars, Multipurpose Passenger Vehicles, and Light Trucks) as defined in SAE J1100.&lt;/div&gt;&lt;/div&gt;</p>
