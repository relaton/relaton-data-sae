    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a titanium alloy in the form of bars up through 4.000 inches (101.60 mm) in nominal diameter or least distance between parallel sides, inclusive, forgings of thickness up through 4.000 inches (101.60 mm), inclusive, with bars and forgings having a maximum cross-sectional area of 32 square inches (204.46 cm&lt;sup&gt;2&lt;/sup&gt;), and stock for forging of any size (see &lt;span class="xref"&gt;8.6&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
