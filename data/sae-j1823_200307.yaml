abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice identifies and defines the specifications
    most commonly used to describe articulated rubber-tired forwarders. The illustrations
    used are not intended to be descriptive of any existing machine or dictate a combination
    needed for a particular logging situation. The dimensions indicated are basic
    and may be supplemented by the individual machine manufacturer.</p>"
