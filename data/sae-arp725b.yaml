  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) presents a procedure for evaluating cleaning methods with respect to contaminant removal and element degradation particularly for metallic filter elements. A procedure for checking durability of cleaning equipment and a referee cleaning method are also included. It is applicable only to the evaluation of cleaning methods proposed for removal of service dirt and not for built-in dirt, liquid oxygen (LOX) cleaning, etc. Supporting information for use with the ARP is also included.&lt;/div&gt;&lt;/div&gt;</p>
