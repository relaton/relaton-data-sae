    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Gas for the purpose of this ARP shall be defined as the gaseous produces) resulting from the decomposition, dissociation, or combustion of liquid or solid mono or bi-propellants. Where other gases such as heated N&lt;sub&gt;2&lt;/sub&gt;, H&lt;sub&gt;2&lt;/sub&gt;, H&lt;sub&gt;2&lt;/sub&gt;O (steam), etc., which may have similar physical and/or chemical properties as the defined "gas", are used to effect testing economies; they may be considered as being included in this ARP.&lt;/div&gt;&lt;/div&gt;</p>
