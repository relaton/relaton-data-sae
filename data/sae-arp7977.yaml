  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The recommended practices of this document are intended for optical devices and associated optical cables and connectors installed inside transport category aircraft or environments of equivalent ignitability.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document covers optical radiation in the wavelength range from 380 nm to 10 μm. As explained in this document, wavelengths below this range are capable of igniting fuel-air mixtures through an ignition mechanism not considered at this issue of ARP7977. Use of wavelengths outside the range 380 nm to 10 μm should be discussed with the relevant Certification Authority.&lt;/div&gt;
    &lt;/div&gt;</p>
