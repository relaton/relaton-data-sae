  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes an industry standard checklist for the auditing of the methods and procedures used in aircraft deicing and anti-icing on the ground to support conformance with the industry global standards, AS6285, AS6286 and AS6332. The checklist covers the use of SAE AMS1424 and SAE AMS1428 qualified fluids (Types I, II, III, and IV) and non-fluid methods.&lt;/div&gt;&lt;/div&gt;</p>
