    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers all types of oxygen breathing equipment used in non-military aircraft. It is intended that this standard supplement the requirements of the detail specification or drawings of specific components or assemblies, e.g., regulators, masks, cylinders, etc. Where a conflict exists between this and detail specifications, detail specifications shall take precedence.&lt;/div&gt;
