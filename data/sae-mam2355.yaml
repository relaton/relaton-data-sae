    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers quality assurance sampling and testing procedures which shall be used to determine conformance to applicable specification requirements of wrought aluminum alloy and wrought magnesium alloy mill products (except forging stock) and flash welded rings specified in metric (SI) units. AMS 2355 is the equivalent, specified in inch/pound units., of this MAM.&lt;/div&gt;&lt;/div&gt;</p>
