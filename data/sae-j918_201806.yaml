  content: |-
    <p>&lt;p&gt;This SAE Standard provides minimum performance requirements and accompanying uniform laboratory test procedures for evaluating certain essential characteristics of new tires and newly retreaded tires intended for use on passenger cars.&lt;/p&gt;


    &lt;p&gt;(The requirements published in this SAE Standard pertain to tire sizes currently used on American passenger cars and popular sizes used on imported passenger cars. For related  information on tire sizes not listed, contact SAE Automotive Headquarters, 18121 East Eight Mile Road, East Detroit, Michigan 48021.)&lt;/p&gt;</p>
