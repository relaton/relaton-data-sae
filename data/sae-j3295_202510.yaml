  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This information report is a cooperative perception (CP) services concept of operations. Included is a description of CP systems and a description of the data potentially shared between its participants. The participants are the actors within the CP system, such as vehicles, bicycles, pedestrians and infrastructure. The types of data that can be shared among the actors are presented, and the types of features and applications that can be satisfied based on the types and accuracy of information shared are classified into categories. This report supports a wide variety of potential CP use cases ranging from connected-vehicle enabled driver-assistance applications (e.g., for collision avoidance) to connected automation.&lt;/div&gt;&lt;/div&gt;</p>
