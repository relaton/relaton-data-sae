  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard covers the minimum mechanical properties measured on separately cast test pieces of varying thickness and microstructural requirements for ductile iron castings used in automotive and allied industries. Castings may be specified in the as-cast or heat-treated condition. If castings are heat-treated, prior approval from the customer is required.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The appendix provides general information on chemical composition, microstructure and casting mechanical properties, as well as other information for particular service conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In this standard SI units are primary and in-lb units are derived.&lt;/div&gt;&lt;/div&gt;</p>
