  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes boundaries for shade bands on glazed surfaces in class “A” vehicles. These boundaries are located so that the shade band will provide driver vision protection from glare, and occupant comfort with respect to solar radiation. Since shade bands transmit less visible light than surrounding glazed surfaces, the boundaries establish limits for the driver’s field of view.&lt;/div&gt;&lt;/div&gt;</p>
