  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This part of SAE J2244 specifies dimensions for fluid power metric ports for use with adjustable and nonadjustable stud ends shown in SAE J2244/2.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Ports in accordance with this part of SAE J2244 may be used at working pressures up to 63 MPa for nonadjustable stud ends and 40 MPa for adjustable stud ends. The permissible working pressure depends upon materials, design, working conditions, application, etc.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For threaded ports and stud ends specified in new designs in hydraulic fluid power applications, only SAE J2244 shall be used. Threaded ports and stud ends in accordance with ISO 1179, ISO 9974, and SAE J1926 (ISO 11926) shall not be used for new designs in hydraulic fluid power applications.&lt;/div&gt;
    &lt;/div&gt;</p>
