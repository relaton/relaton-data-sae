  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE document provides test procedures, requirements, and guidelines for electronic and electromechanical sirens for use on authorized emergency vehicles. It is based on the performance of state-of-the-art devices that have proven effective in emergency service. However, it is important for the user to understand that such devices will not necessarily be heard by the drivers of every vehicle under all conditions in time to permit all drivers to take appropriate action.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Sound levels high enough to be heard at reasonable distances in soundproofed automobiles with operating air-conditioners and stero sound systems are so high as to be environmentally unacceptable. The siren is a useful warning device for calling for the right-of-way by an emergency vehicle but must always be used in conjunction with effective visual warning devices and operated only by properly trained personnel.&lt;/div&gt;&lt;/div&gt;</p>
