    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the test conditions, procedures, and performance requirements for circuit breakers in ratings from 50 to 200 A. The document covers externally mounted automatic reset and manually reset types of circuit breakers for low voltage DC operation (typically 50 V or less).&lt;/div&gt;&lt;/div&gt;</p>
