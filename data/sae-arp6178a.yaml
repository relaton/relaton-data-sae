  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is a tool that organizations may use to evaluate a non-authorized supplier’s processes for the prevention, detection, containment, adjudication, and reporting of suspect counterfeit and counterfeit EEE parts. See &lt;span class="xref"&gt;3.1.1&lt;/span&gt; and &lt;span class="xref"&gt;3.1.2&lt;/span&gt;, which reference the use of AS6081 when performing pre-visit self-assessment and on-site assessment of non-authorized suppliers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP is applicable for all organizations that procure EEE parts from suppliers other than authorized sources (e.g., independent distributors).&lt;/div&gt;&lt;/div&gt;</p>
