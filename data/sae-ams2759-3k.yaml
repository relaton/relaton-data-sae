  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification, in conjunction with the general requirements for steel heat treatment covered in AMS2759, establishes the requirements for heat treatment of precipitation-hardening corrosion-resistant, maraging, and secondary hardening steel parts. Parts are defined in AMS2759. Parts made from steels other than those specified in this specification may be heat treated in accordance with the applicable requirements herein using processing temperatures, times, and other parameters recommended by the material producer unless otherwise specified by the cognizant engineering organization. General ordering instructions are specified in AMS2759.&lt;/div&gt;&lt;/div&gt;</p>
