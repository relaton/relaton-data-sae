abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Aerospace Recommended Practice (ARP) documents a common understanding of terms, compliance issues, and occupant injury criteria to facilitate the design and certification of oblique facing passenger seat installations specific to Part 25 aircraft.&lt;/p&gt;


    &lt;p&gt;The applicability of the criteria listed in this current release is limited to seats with an occupant facing direction greater than 18 and no greater than 30 degrees relative to the aircraft longitudinal axis. Later revisions are intended to provide criteria for other facing directions. Performance criteria for side facing seats installed with the occupant facing direction at 90 degrees relative to the aircraft longitudinal axis are provided in AS8049/1.&lt;/p&gt;


    &lt;p&gt;Seats installed at angles greater than 30 degrees relative to the aircraft longitudinal axis must have an energy absorbing rest or shoulder harness. However, this document does not provide the criteria for oblique facing seats incorporating such rests. Satisfying the criteria listed in Table 2 may satisfy the requirement for a rest.&lt;/p&gt;


    &lt;p&gt;Although the issues and criteria presented in this document are common with oblique facing seats installed in Part 23 aircraft and Parts 27 and 29 rotorcraft, these recommendations have not been validated for these types of aircraft.&lt;/p&gt;</p>
