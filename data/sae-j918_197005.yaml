    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides minimum performance requirements and accompanying uniform laboratory test procedures for evaluating certain essential characteristics of new tires and newly retreaded tires intended for use on passenger cars.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;(The requirements published in this SAE Standard pertain to tire sizes currently used on American passenger cars and popular sizes used on imported passenger cars. For related information on tire sizes not listed, contact Society of Automotive Engineers, Inc., Detroit Branch Office, 18121 East Eight Mile Road, East Detroit, Michigan 48021.)&lt;/div&gt;&lt;/div&gt;</p>
