abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;Ce document a été élaboré et publié en vue de fournir des informations et un guide pour l’application de l’AQAP-2110 lorsque le fournisseur se conforme aux dispositions de la 9100. Ce document est publié en tant qu’AQAP -2110-SRD.2 et IA9137. Il a été élaboré conjointement par l’OTAN et les représentants de l’industrie pour utilisation par l’OTAN et l’industrie de façon à faciliter l’utilisation et la compréhension de la relation entre l’AQAP-2110 et la 9100. Les AQAP peuvent être exigées lorsqu’un État acquéreur utilise les Ventes Militaires Etrangères (VME) comme méthode d’approvisionnement.&lt;/p&gt;


    &lt;p&gt;Son but est de contribuer à une communauté d’interprétation des exigences de l’AQAP-2110 par l’acquéreur et son fournisseur 9100.&lt;/p&gt;


    &lt;p&gt;Son contenu n’a aucun statut légal ou contractuel, ni ne remplace, s’ajoute à ou ne supprime aucune des exigences de l’AQAP-2110 ou de la 9100.&lt;/p&gt;


    &lt;p&gt;En raison de la multiplicité des conditions susceptibles d’exister (en fonction de facteurs tels que le type de travail ou de processus, les dispositifs utilisés et la compétence du personnel impliqué), il convient de ne pas considérer ce guide comme exhaustif ni de le considérer comme imposant des moyens et des méthodes spécifiques pour satisfaire les exigences du contrat.  Il convient que les parties prenantes sachent que d’autres moyens et méthodes peuvent être utilisés pour satisfaire les exigences.&lt;/p&gt;


    &lt;p&gt;Il convient que les utilisateurs de ce guide gardent à l’esprit que les exigences de l’AQAP 2110 sont obligatoires, comme indiqué dans le contrat, pour les fournisseurs et les sous-traitants.&lt;/p&gt;</p>
