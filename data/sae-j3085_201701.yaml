    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE standard is intended to create standard terminology related to light and medium duty trailer applications. This includes such trailer types as utility, boat, camping, travel, and special purpose trailers which are normally towed by conventional passenger cars, light-duty commercial vehicles, light trucks, and multipurpose passenger vehicles.&lt;/div&gt;&lt;/div&gt;</p>
