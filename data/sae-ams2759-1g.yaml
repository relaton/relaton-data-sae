  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification, in conjunction with the general requirements for steel heat treatment covered in AMS2759, establishes the requirements for heat treatment of carbon and low-alloy steel parts to minimum ultimate tensile strengths below 220 ksi (1517 MPa). Parts are defined in AMS2759. Due to limited hardenability in these materials, there are size limits in this specification.&lt;/div&gt;
    &lt;/div&gt;</p>
