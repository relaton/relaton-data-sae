    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers automatic pilots intended for use on aircraft to automatically operate the primary and trim aerodynamic controls to maintain stable flight and/or to provide maneuvering about any of the three axes through servo control. Automatic control functions essential for primary or augmented flight control are excluded.&lt;/div&gt;
