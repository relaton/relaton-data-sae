  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice presents performance requirements for the brake systems of motor vehicles intended for roadway use and falling into the following classifications:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Light trucks and buses: 6001-10,000 lb gvw&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Truck and bus: Over 10,000 lb gvw&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Combination of vehicles (towing vehicle over 10,000 lb gvw)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Acceptable performance requirements are based on data obtained from applicable sections of SAE J786.&lt;/div&gt;&lt;/div&gt;</p>
