  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides information and guidance material to assist in assessing the need for and feasibility of developing deicing facilities, the planning (size and location) and design of deicing facilities, and assessing environmental considerations and operational considerations associated with de-icing facilities.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The document presents relevant information necessary to define the need for a deicing facility and factors influencing its size, location, and operation. The determination of the need for deicing facilities rests with Airports.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;u&gt;Although this document intends to provide information to airport operator and deicing facility planner/designer, all stakeholders, including deicing service providers, should be involved in the development process.&lt;/u&gt;&lt;/div&gt;&lt;/div&gt;</p>
