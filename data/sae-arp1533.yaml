abstract:
- language: en
  script: Latn
  content: |-
    <p>This is a procedure for calculation of gaseous emissions data, specifically, emission index, fuel-air ratio, and combustion efficiency for aircraft turbine engines based on the measurement of carbon monoxide, carbon dioxide, total hydrocarbons, and the oxides of nitrogen. Reference 2.1.1 gives procedures for the measurement of gaseous emissions from aircraft turbine engines.

    This document includes instructions for the adjustment of the  measured concentrations of the constituents of the exhaust for: a. the humidity of the inlet air, b. the carbon dioxide content of the inlet air, c. the interference of carbon dioxide and water on the measured  concentrations of carbon monoxide and the oxides of nitrogen, d. the interference of oxygen on the measured concentration of carbon dioxide, e. the efficiency of the converter for changing other oxides of nitrogen to nitric oxide, and f. the basis of measurement (semidry or wet).</p>
