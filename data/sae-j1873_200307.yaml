  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended for all vehicle hydraulic brake hoses. It is an accelerated test which is intended to provide the user with a method of comparing the ability of hydraulic brake hose designs to retard the ingress of moisture into brake fluid.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document specifies a laboratory performance requirement. ASTM D 1364 Interlaboratory reproducibility and correlation of data have not been defined, nor has correlation been established between field vehicle brake fluid moisture content and data obtained by this document.&lt;/div&gt;
    &lt;/div&gt;</p>
