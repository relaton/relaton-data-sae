  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) provides general requirements for components that are used in commercial aircraft hydraulic systems. It also includes the 14 CFR Part 25/CS 25 regulations that apply to hydraulic components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It also provides information to be included in the Procurement Specification in &lt;span class="xref"&gt;Appendix A&lt;/span&gt; and a checklist for design reviews in &lt;span class="xref"&gt;Appendix B&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It does not provide requirements for distribution elements such as hoses, pipe fittings and general tubing.&lt;/div&gt;
    &lt;/div&gt;</p>
