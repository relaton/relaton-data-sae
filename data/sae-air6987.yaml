abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The objective of this document is to provide a classification of AI techniques that may be used in AI-based systems for aeronautical products. Aeronautical products include products in Airborne and Air Traffic Management (ATM) and Air Navigation Systems (ANS) domains for crewed and uncrewed aircraft.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Intended to provide an understanding of the AI space, which will improve over time&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Not intended to provide guidance, objectives, or safety considerations&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;A scenario builder for AI technologies, in particular supervised learning&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;The publication of a taxonomy document for the aviation domain is an opportunity to support other AI standardization initiatives that will also publish taxonomy documents.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Disclaimer: This document provides content to support other products of the SAE G-34/EUROCAE WG-114 Committee.&lt;/div&gt;&lt;/div&gt;</p>
