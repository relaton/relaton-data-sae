  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes the concept of operation, use cases, and message flows to create a Sensor Sharing Service (SSS). This service enable RSUs and V2X&lt;span class="xref"&gt;&lt;sup&gt;1&lt;/sup&gt;&lt;/span&gt; vehicles to share information about their localized driving environment. This work defines message structure, V2X entity requirements, and information elements to describe detected objects to facilitate sensor sharing.&lt;/div&gt;&lt;/div&gt;</p>
