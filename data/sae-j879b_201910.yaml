  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes uniform test procedures and certain minimum performance requirements for motor vehicle seats and seat adjusters. It is limited to tests that can be conducted on uniform test fixtures and equipment available in commercial laboratory test facilities. This practice includes a minimum requirement for horizontal forward loads encountered in vehicle forward impacts, and horizontal loads obtained by impacting the vehicle from the rear. The requirements and test procedures in this recommended practice reflect current technology and industry experience. It is intended to subject this recommended practice to a continuing review and revision as technology advances and experience is expanded.&lt;/div&gt;&lt;/div&gt;</p>
