  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification provides requirements for the identification and packaging of sheet, strip, extrusions, and molded parts made of natural rubber, synthetic rubber, reclaimed rubber, and combinations of the above with other materials such as asbestos, cork, and fabrics. AMS 2817 covers preferred requirements for identification and packaging of preformed packings.&lt;/div&gt;&lt;/div&gt;</p>
