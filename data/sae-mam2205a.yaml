abstract:
- language: en
  script: Latn
  content: "<p>This specification covers established metric manufacturing tolerances applicable to aluminum alloy and magnesium alloy extruded bar, rod, wire,  shapes, and tubing ordered to metric dimensions.  Tolerances greater than  standard may be necessary for some shapes; tolerances closer than standard may be possible for others.  Tolerances shown herein, however,  apply unless otherwise agreed upon by purchaser and vendor and apply to  all tempers, unless otherwise noted.</p>"
