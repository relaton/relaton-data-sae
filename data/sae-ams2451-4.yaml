    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the engineering requirements and process controls for brush plating of cadmium by electrodeposition. It should be used, in conjunction with AMS 2451, for corrosion-protective, cadmium deposits which might allow omission of hydrogen embrittlement relief treatment of high-strength steels.&lt;/div&gt;&lt;/div&gt;</p>
