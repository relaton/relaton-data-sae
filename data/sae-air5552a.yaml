  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides general guidance for design considerations and qualification in endurance, strength, and fatigue of landing gear using composite components as principle structural elements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The information discussed herein includes the development and evaluation of design data considering the potential for imbedded manufacturing defects, manufacturing process variations, the component operating environment, potential damage threats in service, rework and overhaul, and inspection processes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR mainly discusses the use of thick composites for landing gear structural components. Considerations and recommendations provided in this AIR may therefore differ greatly from considerations and recommendations found in widely accepted composite design references such as CMH-17 and Advisory Circulars such as AC 20-107B.&lt;/div&gt;



    &lt;/div&gt;</p>
