    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The terms and definitions in this document describe the functions performed within an ADS, as defined in SAE J3016. Where possible we have attempted to capture the language that is already in use within the automated driving development community. Where needed, we have added new terms and definitions, including clarifying notes to avoid ambiguity. SAE J3131 deals primarily with Level 4 and Level 5 ADS features.&lt;/div&gt;&lt;/div&gt;</p>
