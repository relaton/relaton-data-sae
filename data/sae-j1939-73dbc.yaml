  content: |-
    <p>&lt;p&gt;J1939-73 DBC File - Heavy Duty Diagnostics (DM1, DM2, ...)&lt;/p&gt;



    &lt;p&gt;The SAE J1939-73 DBC file contains decoding rules for converting 'version 4' J1939 diagnostic messages (DM1, DM2, ...) to 'physical values'. This lets you identify issues in e.g. trucks, tractors and buses.&lt;/p&gt;



    &lt;p&gt;DBC is a CAN database format used in most automotive tools.&lt;/p&gt;</p>
