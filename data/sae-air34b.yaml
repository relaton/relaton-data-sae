  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Aerospace Information Report (AIR) is to present a guide for the determination of probable power output and the effect on the aircraft system that will be experienced when operating three-phase motors with one phase open. Unfortunately, the above subject cannot be resolved by specific rules. Modern aircraft or missile electrical systems are composed of a wide variety of electrical and electronic components. These components react differently under identical impetus due to the latitude of their design. This latitude of design must be allowed wherever possible to the accessory designer due to the various specification requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Therefore, it cannot be over-emphasized that the effect on the airplane or missile system, as well as motor operation, of three-phase motors on two-phase power must be thoroughly investigated.&lt;/div&gt;&lt;/div&gt;</p>
