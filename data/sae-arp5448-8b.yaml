  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method provides a guidance for determining the total free play between the ball and outer ring of a spherical bearing when measured in both the radial and axial directions. Bearings covered by this test method include all plain spherical-type bearings, both self-lubricated (lined) and metal-to-metal.&lt;/div&gt;&lt;/div&gt;</p>
