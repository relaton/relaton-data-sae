  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the location of drivers’ eyes inside a vehicle for the purpose of measuring the drivers’ field of view. Elliptical (eyellipse) models in both two and three dimensions are used to represent 95th and 99th percentiles of driver eye locations. The procedure used to locate eyellipses in passenger cars differs from the procedure used for heavy trucks. Selected eye (E) points, useful in certain viewing tasks, are derived from the 95th eyellipse. For application of this Practice refer to SAE J1050 (Reference 14).&lt;/div&gt;&lt;/div&gt;</p>
