  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the engineering requirements for heat treatment of wrought aluminum alloy parts (See &lt;span class="xref"&gt;8.2.6&lt;/span&gt; for special definition of "parts") by users or their vendors or subcontractors. It does not cover heat treatment by material producers or forge shops nor does it cover heat treatment of castings or parts made from castings, except that the conditions (temperatures, soaking times, cooling rates) used by material producers and forge shops for qualification of response to heat treatment of their products shall conform to those specified herein. Heat treatment of mill products and forgings by material producers and forge shops and all heat treatment of castings and parts made from castings shall be performed in accordance with the material specification or MIL-H-6088.&lt;/div&gt;&lt;/div&gt;</p>
