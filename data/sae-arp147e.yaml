  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This ARP provides the definition of terms commonly used in aircraft environmental control system (ECS) design and analysis. Many of the terms may be used as guidelines for establishing standard ECS nomenclature. Some general thermodynamic terms are included that are frequently used in ECS analysis, but this document is not meant to be an inclusive list of such terms.&lt;/div&gt;&lt;/div&gt;</p>
