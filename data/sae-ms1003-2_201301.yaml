abstract:
- language: en
  script: Latn
  content: "<p>The Society of Automotive Engineers (SAE) Industrial Lubricants Committee has developed a number of industrial, non-production lubricant performance specifications. \nThe purpose of these voluntary SAE specifications is to:\n\na.\tDefine minimum performance requirements for industrial lubricants.\nb.\tProvide lubricant suppliers with performance targets for a minimum number of key industrial lubricants.\nc.\tImprove the availability of these lubricants to member companies.\nd.\tProvide a plant oriented, user friendly, classification system using common test standards and properties.</p>"
