  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers a high-quality corrosion-resisting steel wire, cold drawn, formed, and heat treated to produce uniform mechanical properties. It is magnetic in all conditions. It is intended for the manufacture of springs and wire forms that are to be heat treated after forming to enhance the spring properties. This document also covers processing requirements of the springs and forms fabricated from this wire.&lt;/div&gt;&lt;/div&gt;</p>
