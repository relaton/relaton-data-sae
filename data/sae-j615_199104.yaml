    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines engine mounting dimensions for industry standardization and interchangeability. &lt;span class="xref"&gt;Table 1&lt;/span&gt; and &lt;span class="xref"&gt;Figure 1&lt;/span&gt; are dimensions for arm type mountings. &lt;span class="xref"&gt;Table 2&lt;/span&gt; and &lt;span class="xref"&gt;Figure 2&lt;/span&gt; are for side pad mountings. For engine housing SAE flange dimensions, see SAE J617. For engine foot type mountings (front and rear), see SAE J616.&lt;/div&gt;&lt;/div&gt;</p>
