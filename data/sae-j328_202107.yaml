  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides minimum performance requirements and uniform procedures for fatigue testing of wheels intended for normal highway use and temporary use on passenger cars, light trucks, and multipurpose vehicles. For heavy truck wheels and wheels intended to be used as duals, refer to SAE J267. For wheels used on trailers drawn by passenger cars, light trucks, or multipurpose vehicles, refer to SAE J1204. These minimum performance requirements apply only to wheels made of materials included in &lt;span class="xref"&gt;Tables 1&lt;/span&gt; to &lt;span class="xref"&gt;4&lt;/span&gt;. The minimum cycles noted in &lt;span class="xref"&gt;Tables 1&lt;/span&gt; through &lt;span class="xref"&gt;4&lt;/span&gt; are to be used on individual test and a sample of tests conducted, with Weibull Statistics using two parameter, median ranks, 50% confidence level, and 90% reliability, typically noted as B10C50.&lt;/div&gt;&lt;/div&gt;</p>
