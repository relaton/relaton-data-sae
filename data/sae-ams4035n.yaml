  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an aluminum alloy in the form of sheet and plate 0.010 to 1.750 inch (0.25 to 44.45 mm) in thickness, supplied in the annealed (O temper) condition. When specified, product shall be supplied in the “as fabricated” (F) temper (see &lt;span class="xref"&gt;8.5&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
