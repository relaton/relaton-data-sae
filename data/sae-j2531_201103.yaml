  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;New methods are available to assist in evaluating the risk of impulse noise-induced hearing loss from inflatable devices, for example, airbags and seat belt pretensioners. This document presents some background on impulse noise measurement techniques and assessment criteria. Related information relative to test details, for example, preamplifier specifications and filtering methods and criteria, will be discussed in a future recommended practice.&lt;/div&gt;
    &lt;/div&gt;</p>
