  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard provides the following:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The required surface finish criteria for the designed function of the parts&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The definition of surface imperfections and defects that affect surface quality&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;The categories by location for each geometry for the permissible type, size and quantity of defects&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;It also establishes the quantitative levels of acceptance by providing defined limits and inspection guidance for the acceptance or rejection of production parts&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification is applicable but not limited to, the surface quality of:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;T-Seals&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;L-Rings&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Capped T Rings&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Capped L Rings&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Cammed Type Seals&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Cruciform Shaped Elastomers&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Pyramid (Dyna-Bak) Seals&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Square Ring Seals&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Quadruple Lobed Seals&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;U-Cups&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Spring Energized U-Cups&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Molded in Place Metal Gasket Seals&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
