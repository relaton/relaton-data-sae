    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes minimum requirements for lighting and marking earthmoving construction machinery as defined in SAE J1116, 1.1 Self-Propelled Construction Machines—Earthmoving (excluding excavators).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;(Construction machinery is normally operated off-highway, and therefore this SAE document is not intended to be used as a basis for regulations by those having authority over on-highway motor vehicles.)&lt;/div&gt;&lt;/div&gt;</p>
