  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The instrument system specified shall accept an input of static pressure and in some equipment other inputs that contribute altitude information to provide a visual indication of pressure altitude. If equipped with an automatic correction mechanism, it shall indicate by a positive means when the automatic correction mechanism is not in use. If the static source pressure error compensating mechanism is operational it shall be functional throughout the required operating envelope of the particular aircraft. Each aircraft type has its own static source error data which shall be obtained from the airframe manufacturer’s certified data. When a Central Air Data Computer is used in the altimeter system, the CADC shall be certified to its own governing document and the altimeter system (CADC and display) shall comply with the requirements of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The instrument system specified herein does not include the aircraft pressure lines and pressure sources.&lt;/div&gt;
    &lt;/div&gt;</p>
