  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers the general technical requirements and provides specification guidance for towable deicing vehicles/units equipped with a deicing/anti-icing fluid spraying system. The unit shall be highly maneuverable for applying deicing/anti-icing fluid onto all exterior surfaces of commercial/commuter aircraft to be treated. The unit shall also be suitable for day and night operations and shall be reliable and capable of performing deicing/anti-icing treatments satisfactorily under various precipitation (e.g., moderate snow) and icy weather conditions (e.g., outside air temperatures down to -40 °C/-40 °F) in accordance with the recommendations and instructions specified in aircraft manufacturers’ documents and the current version of AS6285.&lt;/div&gt;&lt;/div&gt;</p>
