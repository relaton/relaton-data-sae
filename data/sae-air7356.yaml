  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) focuses on opportunities, challenges, and requirements in use of blockchain for Unmanned Aircraft Systems (UAS) operating at and below 400 feet above ground level (AGL) for commercial use. UAS stakeholders like original equipment manufacturers (OEMs), suppliers, operators, owners, regulators, and maintenance repair and overhaul (MRO) providers face many challenges in certification, airspace management, operations, supply chain, and maintenance. Blockchain—defined as a distributed ledger technology that includes enterprise blockchain—can help address some of these challenges. Blockchain technology is evolving and also poses certain concerns in adoption. This AIR provides information on the current UAS challenges and how these challenges can be addressed by deploying blockchain technology along with identified areas of concern when using this technology. The scope of this AIR includes elicitation of key requirements for blockchain in UAS across its life cycle and the need for the standardization of blockchain-enabled processes.&lt;/div&gt;


    &lt;/div&gt;</p>
