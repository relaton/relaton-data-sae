    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes minimum performance criteria at GCWR and calculation methodology to determine tow-vehicle TWR for passenger cars, multipurpose passenger vehicles and trucks. This includes all vehicles up to 16000 lb GVWR. It is recommended that the performance requirements within be adopted for all vehicles with model year designation 2011 or later.&lt;/div&gt;
