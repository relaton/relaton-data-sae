  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies test procedures to determine the charging performance of electric vehicles. This document facilitates clear and consistent comparisons of realistic charging capabilities of electrically propelled vehicles (EVs) via commercially available electric vehicle supply equipment. It provides details about test conditions, test methods, and test processes derived from typical use cases. Furthermore, it specifies requirements regarding the information for the vehicle operator.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is applicable to EVs, including plug-in hybrid EVs.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not provide requirements for mopeds and motorcycles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Unless specified otherwise, all test procedures can be applied to AC, DC, or wireless charging methods.&lt;/div&gt;
    &lt;/div&gt;</p>
