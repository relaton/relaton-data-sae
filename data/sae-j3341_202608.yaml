abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Disclosure Addendum will provide recommended disclosures and a standardized scenario for life cycle assessment (LCA) studies which:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Include the midpoint impact category, climate change, via the impact indicator, global warming potential over a 100-year time frame (GWP&lt;sub&gt;100&lt;/sub&gt;), hereby referred to as greenhouse gas (GHG) emissions&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Adhere to ISO 14040 and ISO14044 standards&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Follow the cut-off approach for allocation per ISO14067:2018&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Are conducted for &lt;u&gt;light-duty vehicles (LDVs)&lt;/u&gt; with the following powertrains:
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Internal Combustion Engine&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Hybrid Electric&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Plug-in Hybrid Electric and Extended-Range Electric&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Battery Electric&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;These types of studies may also be referred to as a carbon footprint study or automotive LCA (A-LCA).&lt;/div&gt;&lt;/div&gt;</p>
