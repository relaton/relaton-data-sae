  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This recommended practice defines conditions for evaluating the compatibility of vehicle fuel tanks and fill pipes with fuel dispensing facilities. It applies to passenger cars, multipurpose passenger vehicles, and light-duty trucks. It also includes a technique for filling a tank “full” that can be used to establish a reference condition for other tests which require starting with a “full” tank.&lt;/div&gt;&lt;/div&gt;</p>
