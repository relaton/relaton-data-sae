  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the test requirements in addition to those given in ISO 3046-1 for determining the power, at a single point or as a power curve, of marine propulsion engines or systems for recreational craft and other small craft using similar propulsion equipment of less than 24 m length of the hull.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It also provides the means for documenting and checking the declared (rated) power published by the manufacturer.&lt;/div&gt;&lt;/div&gt;</p>
