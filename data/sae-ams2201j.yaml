  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established manufacturing tolerances applicable to aluminum-base alloy rolled or drawn bar, rod, wire, and forging stock. These tolerances apply to all conditions, unless otherwise noted. The term "excl" applies only to the higher figure of the specified range. The general temper designation "-TX51" is used for brevity and denotes the full temper designations -T351, -T451, -T651, -T851, and -T7351, the "X" representing one or more digits preceding the "51". Dimensions in U.S. conventional units are primary; dimensions in SI units are shown as the equivalent of the inch/foot/degree dimensions and are not to be construed as standard for product produced to SI dimensions.&lt;/div&gt;&lt;/div&gt;</p>
