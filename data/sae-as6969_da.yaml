    <p>&lt;p&gt;Enhanced License for Data Dictionary for Quantities Used in Cyber Physical Systems (AS6969) allowing for greater usage as outlined in the terms of the Enhanced License.  Terms can be reviewed prior to purchase once item is added to the cart.&lt;/p&gt;


    &lt;p&gt;&lt;a href="https://www.sae.org/standards/content/as6969/"&gt; Data Dictionary for Quantities Used in Cyber Physical Systems (AS6969)&lt;/a&gt; This data dictionary provides a mathematically coherent set of definitions for quantity types used in data models for unmanned systems.  In this data dictionary, a quantity is defined as a property of a phenomenon, substance, or body whose value has magnitude.&lt;/p&gt;</p>
