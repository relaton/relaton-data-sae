    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides information and guidance for the control of hazardous laser energy in the navigable airspace.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This ARP does not address techniqies that pilots can apply to mitigate laser illuminations during a critical phase of flight. Such mitigation strategies are described in ARP6378.&lt;/div&gt;
