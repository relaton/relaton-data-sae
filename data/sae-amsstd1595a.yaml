  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard establishes the procedure for qualification of welders and welding operators engaged in the welding of aircraft, missiles, other aerospace equipment, and their parts and accessories by fusion welding processes. This standard is applicable to aircraft, missile, and aerospace ground support equipment or other welding, when included in the contracting documents or when invoked in the absence of a specified welder qualification document.&lt;/div&gt;&lt;/div&gt;</p>
