  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers hose fabricated from fabric braid and synthetic rubber, assembled with end fittings or user applied clamps for use in automotive power steering applications as flexible connections within the temperature range of -40 °C to +120 °C (-40 °F to 250 °F) average and 135 °C (275 °F) maximum peaks. Hose assemblies shall be suitable for 1.72 MPa (250 psi) maximum working pressure with end fittings and 0.69 MPa (100 psi) maximum working pressure with user applied clamps.&lt;/div&gt;&lt;/div&gt;</p>
