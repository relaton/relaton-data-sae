  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers two types of hose fabricated from fabric braid and synthetic rubber, assembled with end fittings for use in automotive power steering applications as flexible connections within the temperature range of -40 °C to +120 °C (-40 °F to +250 °F) average, and 135 °C (275 °F) maximum peaks.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These hoses are intended for use in applications where reduction in amplitude of pump pressure pulsations is required.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Type 1 hose shall be suitable for 10.3 MPa (1500 psi) maximum working pressure.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Type 2 hose shall be suitable for 10.3 MPa (1500 psi) maximum working pressure.&lt;/div&gt;&lt;/div&gt;</p>
