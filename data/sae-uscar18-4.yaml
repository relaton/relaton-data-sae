  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is a supplement to SAE/USCAR 17 and is intended to give recommended usages for one and two-way RF connectors and dimensional requirements for 2-way RF connectors and hybrid (RF &amp;amp; DC power) connectors which are not currently specified elsewhere. The radio frequency (RF) connector interface specified herein is suited for unsealed and sealed automobile applications up to 6 GHz and is intended for in-line, board mount, device mount, straight or angled applications. Dimensional requirements are specified in this document to ensure interchangeability. Compliance with the dimensional requirements of this specification will not guarantee interoperability between different suppliers mating connectors. It is the supplier responsibility to ensure RF performance requirements are met with other suppliers mating connectors. Performance requirements are specified in SAE/USCAR-2, and in SAE/USCAR-17.&lt;/div&gt;&lt;/div&gt;</p>
