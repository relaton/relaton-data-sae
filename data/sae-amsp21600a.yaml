    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements for a high visibility, durable, exterior fluorescent coating system consisting of a pigmented fluorescent coating with a clear protective overcoat containing a weathering stabilizer. This coating system is capable of being removed without softening the permanent undercoats.&lt;/div&gt;

    &lt;/div&gt;</p>
