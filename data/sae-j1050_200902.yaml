  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes methods for describing and measuring the driver’s field of view. The document describes three methods for measuring the direct and indirect fields of view and the extent of obstructions within those fields. The first method uses any single pair of eye points to determine the fields or obstructions that would be seen by an individual driver. The second method uses the SAE Eyellipses defined in SAE J941 to determine the largest fields or obstructions that would be seen for a given percentage of the driving population. The third method uses specific eye points defined in SAE J941 to measure the extent of a specific field of view or obstruction for which those points were developed.&lt;/div&gt;&lt;/div&gt;</p>
