    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Oxygen system integration and performance precautions are in particularly dependent on applicable sections of airworthiness requirements per FAR/JAR 25. In this document information will be provided on common principles and good practices regarding design criteria, installation, manufacturing, safety aspects and system handling during maintenance and inspection.&lt;/div&gt;&lt;/div&gt;</p>
