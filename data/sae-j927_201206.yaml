    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines flywheel configuration to promote standardization of flywheels for engine flywheel mounted torque converters.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Tables 1A&lt;/span&gt; and &lt;span class="xref"&gt;1B&lt;/span&gt; and &lt;span class="xref"&gt;Figure 1&lt;/span&gt; give dimensions for flywheels mounted-type torque converters. For torque converters using drive ring overcenter type disconnect clutch, see SAE J620.&lt;/div&gt;&lt;/div&gt;</p>
