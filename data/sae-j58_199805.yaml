  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Included in this SAE Standard are the detailed general and dimensional specifications applicable to flanged 12-point screws recognized as SAE Standard and intended for general use in automotive and other ground-based vehicles and industrial equipment. Also included is &lt;span class="xref"&gt;Appendix A&lt;/span&gt;, covering runout sleeve gages and gaging.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The inclusion of dimensional data in this standard is not intended to imply that all of the products described are stock production sizes. Consumers should consult manufacturers concerning availability of product.&lt;/div&gt;&lt;/div&gt;</p>
