    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the mechanical and quality requirements for steel tapping screws used in automotive and related industries. It does not apply to corrosion resistant (stainless) steel screws. (Dimensional requirements for most types of screws mentioned herein are covered in ASME B 18.6.4, Thread Forming and Thread Cutting Tapping Screws and Metallic Drive Screws’.)&lt;/div&gt;&lt;/div&gt;</p>
