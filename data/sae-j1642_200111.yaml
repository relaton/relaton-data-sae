abstract:
- language: en
  script: Latn
  content: "<p>This SAE Draft Technical Report is intended to document the technical
    consensus of the current design state of converter/mufflers for heavy-duty emission
    classification diesel vehicle applications. This will maximize standardization
    and promote interchangeability of parts from  different manufacturers. The purpose
    of this SAE Draft Technical Report is to give the  technical community the opportunity
    to review, comment on, and use the Draft Technical Report prior to its final approval
    by SAE.</p>"
