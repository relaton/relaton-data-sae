abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This SAE Standard specifies the dimensional requirements necessary for the mounting and interchangeability of a type of fuel injector used in diesel engines. &lt;/p&gt;\n \n\n&lt;p&gt;&lt;b&gt;Field of Application&lt;/b&gt; This document is applicable to a clamp-mounted fuel injector of an integral nozzle and nozzle holder design with a 9.5 mm (nominal) holder shank diameter and deals only with the interface between the injector and the engine.  The internal construction of the fuel injector remains optional with the manufacturer.&lt;/p&gt;</p>"
