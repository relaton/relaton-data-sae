  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers preforms fabricated up through 5.5 inches (140 mm) inclusive in deposition width thickness (see &lt;span class="xref"&gt;8.2.5&lt;/span&gt;) using a Plasma Arc Directed Energy Deposition (PA-DED) additive manufacturing process on a Ti-6Al-4V substrate that are subjected to post-deposition stress relief heat treatment. This is a wire fed additive manufacturing process. If required by the CEO, preforms may require subsequent machining to meet requirements for their intended final part application.&lt;/div&gt;&lt;/div&gt;</p>
