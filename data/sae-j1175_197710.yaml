  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the instrumentation and procedure to be used in measuring the bystander sound level of engine powered equipment under 15 kW (20 bhp) typical of their normal operation. It is intended to include equipment such as lawn mowers, snow blowers, and tillers. It is not intended to include equipment designed primarily for operation on highways or within factories and buildings, or vehicles such as motorcycles, snowmobiles, and pleasure motorboats that are covered by other SAE Standards or Recommended Practices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This procedure does not cover chain saws.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice may also be used when measuring the bystander sound level on similar equipment powered by electricity or other power sources.&lt;/div&gt;&lt;/div&gt;</p>
