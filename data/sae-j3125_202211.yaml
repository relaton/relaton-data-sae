  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report is specific to integration of rechargeable energy storage systems (RESS) into electrification of buses of all types which comprehends safety, performance, life, etc., utilizing worldwide standards and regulations as references in order to maximize existing work. This document applies to both purpose-built electric buses and retrofit electrified buses at an original equipment manufacturer (OEM). This document does not comprehend retrofitting of buses outside the OEM manufacturing environment.&lt;/div&gt;&lt;/div&gt;</p>
