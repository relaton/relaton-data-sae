  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;&lt;i&gt;This standard includes selected quality system requirements from ISO 9001:2008&lt;/i&gt;&lt;/b&gt;&lt;b&gt;&lt;i&gt;&lt;span class="xref"&gt;[1]&lt;/span&gt;&lt;/i&gt;&lt;/b&gt; &lt;b&gt;&lt;i&gt;and AS9100:2009 applicable to noncomplex products and associated manufacturing processes. ISO 9001 text incorporated into this standard appears in standard font; while aviation, space, and defense industry additional requirements, definitions, and notes are presented in bold, italic text.&lt;/i&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;&lt;b&gt;The requirements of this standard are intended to be applied in whole, without any exclusions. Compliance with all corresponding AS9100 requirements is considered to meet/exceed compliance with the requirements of this standard.&lt;/b&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;&lt;b&gt;The requirements specified in this standard are complementary (not alternative) to contractual and applicable statutory and regulatory requirements. Should there be a conflict between the requirements of this standard and applicable statutory or regulatory requirements, the latter shall take precedence.&lt;/b&gt;&lt;/i&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;&lt;b&gt;The process approach described in ISO 9001 and AS9100 applies to this standard.&lt;/b&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;</p>
