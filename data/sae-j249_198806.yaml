    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The mechanical stop lamp switch is an operator activated mechanical device intended primarily to control the functioning of the stop lamp and high mounted stop lamp circuits. Secondarily, the device may control the functioning of various accessories, such as disengaging cruise control, with operator actuation of brake pedal.&lt;/div&gt;
