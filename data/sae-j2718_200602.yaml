  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes application of two closely related test procedures, which together determine the linear range longitudinal and lateral stiffnesses of a statically loaded non-rotating tire. The procedures apply to any tire so long as the equipment is properly sized to correctly conduct the measurements for the intended test tire. The data are suitable for use in determining parameters for road load models and for comparative evaluations of the measured properties in research and development.&lt;/div&gt;


    &lt;/div&gt;</p>
