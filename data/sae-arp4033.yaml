  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;A recommended pilot-system integration (i.e., crew interface and system integration) approach for concept development is described in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;. The approach emphasizes the fundamental need for a top-down design methodology with particular focus on clear operational performance requirements and functional integration. While this document is primarily aimed at aircraft systems design and integration, the methodology is applicable to a wide range of design and integration situations. It is derived from well established human factors engineering design principles.&lt;/div&gt;
    &lt;/div&gt;</p>
