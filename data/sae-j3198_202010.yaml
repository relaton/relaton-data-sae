  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report provides definitions and discussions of key terms concerning driver drowsiness and fatigue, and basic information on measuring drowsiness and fatigue. It also includes information and concepts for driver drowsiness as they relate to the safe operation of a vehicle. The key driver drowsiness and fatigue causal factors include the following: (1) sleep quality and quantity, (2) time of day, (3) time awake, (4) time on task (modulated by characteristics of the driving task), (5) task-related fatigue (variations of arousal levels related to task underload and overload), and (6) combinations of these factors. Medical conditions, medication, alcohol, or drugs exacerbate drowsiness; however, the discussion in this report is limited to fatigue concepts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This report has two primary outputs: (1) definitions and discussions of key terms concerning driver drowsiness and fatigue, and (2) basic information on measuring drowsiness and fatigue and its effects on the safe operation of a vehicle. These include the physiological and cognitive effects of driver drowsiness and fatigue on driving safety. Examples of effect of driver drowsiness and fatigue on driving safety include those related to vehicle control, operator vigilance (sustained attention), reaction times (object and event detection and response), situational awareness, physiological indicators, subjective assessments, and combinations thereof. For definitions of driving performance measures, refer to SAE J2944. This report applies to all worldwide motor vehicle passenger cars and light trucks, as well as heavy trucks, buses, motorcycles, and mopeds. The intended users of the document are practitioners and researchers in the automotive industry, academia, and other organizations with interest in driver drowsiness and fatigue, driving and driver performance assessment, and road safety.&lt;/div&gt;&lt;/div&gt;</p>
