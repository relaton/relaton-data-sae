    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) is intended as a guide in establishing inspection procedures to determine the condition of inservice accumulators. A minimum inspection program is recommended to determine the existence of corrosion and damage. Recommendations are also provided for corrective action if it is determined that the environment is contributing to the deterioration of the surface protection system treatments.&lt;/div&gt;&lt;/div&gt;</p>
