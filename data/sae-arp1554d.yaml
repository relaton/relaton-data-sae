  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The tests are static in nature to minimize complexity and cost of required testing facilities. As far as practical, applied static loads should take into account the combined static and dynamic loads anticipated in service.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is intended that tests shall be non-destructive in nature and not result in damage unless ultimate load conditions are employed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Test equipment and methods of testing described are not meant to be restrictive. Alternate equivalent methods to accomplish the desired results may be employed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In selected cases, tests may be repeated under ultimate load conditions when required for substantiation of analytical data. If this becomes necessary, the parts deformed may be removed and replaced prior to the retest.&lt;/div&gt;&lt;/div&gt;</p>
