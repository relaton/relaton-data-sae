  content: |-
    <p>&lt;p&gt;This SAE Standard establishes a vocabulary and definitions relating to the components used in fuel injection systems for compression ignition (diesel) engines.&lt;/p&gt;
    &lt;p&gt;Definitions are separated into six sections by topic as follows:&lt;/p&gt;
    &lt;p&gt;Section 3--Fuel Injection Pumps&lt;br/&gt;
    Section 4--Fuel Injectors&lt;br/&gt;
    Section 5--Unit Injectors&lt;br/&gt;
    Section 6--Governors&lt;br/&gt;
    Section 7--Timing Devices&lt;br/&gt;
    Section 8--High Pressure Pipes and Connections&lt;/p&gt;
    &lt;p&gt;NOTE: When the word &lt;q&gt;fuel&lt;/q&gt; is used in the terms listed it may be omitted providing there can be no misunderstanding.&lt;/p&gt;</p>
