    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;It is the purpose of this aerospace information report to provide a listing of existing and forthcoming metric standards for aerospace fluid systems. It is shown which ISO/TC 20 and ISO/TC 131 or other ISO Technical Committee documents have been approved by the United States Technical Advisory Group (U.S. TAG) to TC 20. This AIR also lists U.S. Aerospace accepted AECMA and International De-Facto standards, also the forthcoming standards being developed in ISO/TC 20/SC 10.&lt;/div&gt;&lt;/div&gt;</p>
