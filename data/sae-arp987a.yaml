  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this document is threefold: (1) to review the problem of moisture in avionics equipment, (2) to outline methods for correcting conditions of excess moisture in existing avionics installations, and (3) to recommend design practices for new avionics cooling system installations which will minimize the adverse effects of moisture.&lt;/div&gt;&lt;/div&gt;</p>
