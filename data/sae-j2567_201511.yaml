  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes the test procedure, environment and instrumentation for determining the sound levels of snowmobiles in the stationary test mode. This test method is intended to provide an accurate measurement of exhaust and other engine noise and may be used to evaluate new and in-use snowmobiles to determine compliance with noise control regulations. Sound level measurements obtained with this test method are not intended as an engineering determination of overall machine noise. For this purpose, the use of SAE J192 is recommended.&lt;/div&gt;&lt;/div&gt;</p>
