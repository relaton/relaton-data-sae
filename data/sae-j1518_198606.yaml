  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Minimum performance criteria for operator and bystander protection in this document apply to three point hitch (Type A) backhoes as defined in SAE J326 when mounted on any agricultural tractor (SAE J1150) or other off-road self-propelled work machine (SAE J1116 JUNE 81). This criteria includes backhoes which may not be manufactured and/or marketed by the same company that manufactures and/or markets the propelling machine and is intended for the backhoe manufacturer.&lt;/div&gt;
    &lt;/div&gt;</p>
