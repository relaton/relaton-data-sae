    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies the nominal dimensions and tolerances which affect interchangeability between cross-tooth companion flanges type T and mating parts. Dimensions and tolerances of the mating parts, other than those occurring at the interface of the two flanges, are left to the discretion of the manufacturer of that component. This document is equivalent to ISO 8667.&lt;/div&gt;&lt;/div&gt;</p>
