  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides the minimum requirements for high power two conductor jumper cable plug and receptacle for truck-trailer jumper cable systems. It includes the test procedures, design, and performance requirements. This document covers receptacles rated at more than 30A (Ampere) up to and including 150A and is intended for a single circuit with one power conductor and one common return conductor. Single conductor high current connectors are not recommended for future designs because of inadequate ground return through 5&lt;sup&gt;th&lt;/sup&gt; wheel / king pin. Cable size selection is to be made by the vehicle OEM for specific applications and the specific voltage drop requirements of those applications. This SAE Standard covers two variants of high power two conductor connections: a heavy duty version with horizontally aligned pins, typically for lift-gate battery charging and a medium duty version with vertically aligned pins: typically for loads such as power tarpaulins.&lt;/div&gt;&lt;/div&gt;</p>
