  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended to describe the basic types of felling heads, including those with bunching capabilities, that are attachments to a self-propelled machine. Only the major components that are necessary to describe the functions of the felling head, and to apply the principles of the standard are included. Illustrations used are not intended to include all existing felling heads or to describe any particular manufacturer’s variation.&lt;/div&gt;
    &lt;/div&gt;</p>
