    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document has not changed other than to put it into the new SAE Technical Standards Board Format&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the most commonly used magnesium alloys suitable for casting by the various commercial processes. The chemical composition limits and minimum mechanical properties are shown. Over the years, magnesium alloys have been identified by many numbering systems, as shown in &lt;span class="xref"&gt;Table 1&lt;/span&gt;. Presently, SAE is recommending the use of the use of the UNS numbering system to identify those materials. Other equally important characteristics such as surface finish and dimensional tolerances are not covered in this standard.&lt;/div&gt;






    &lt;/div&gt;</p>
