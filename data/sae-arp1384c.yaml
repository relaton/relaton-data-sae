    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These recommendations are to aid the international air transport industry by identifying a standard, minimum amount of safety instructions that shall be given in passenger safety information briefing cards and, if available, passenger safety video briefings. Aircraft operators are encouraged to customize the passenger safety information briefing cards and safety videos for their own operations.&lt;/div&gt;
