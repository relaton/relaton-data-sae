  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Supplementary to the heat or cast analysis, a product analysis may be made on steel in the semifinished or finished form. For definitions and methods of sampling steel for product chemical analysis, refer to SAE J408.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A product analysis is a chemical analysis of the semifinished or finished steel to determine conformance to the specification requirements. The range of the specified chemical composition is normally expanded to take into account deviations associated with analytical reproducibility and the heterogeneity of the steel. Individual determinations may vary from the specified heat or cast analysis ranges or limits to the extent shown in &lt;span class="xref"&gt;Tables 1&lt;/span&gt; through &lt;span class="xref"&gt;5&lt;/span&gt;. The several determinations of any element in a heat or cast may not vary both above and below the specified range except for lead. &lt;span class="xref"&gt;Tables 1&lt;/span&gt; through &lt;span class="xref"&gt;5&lt;/span&gt; provide permissible limits for various steel forms and composition types.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For rephosphorized and resulfurized steels, the product analysis tolerance limits are not applicable to phosphorus and sulfur because of the degree to which these elements segregate.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Boron is not subject to product analysis tolerances.&lt;/div&gt;&lt;/div&gt;</p>
