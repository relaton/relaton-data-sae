  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes the design, assembly force, and packaging guidelines for conventional hand-plug, mechanical assist and twist lock electrical connectors, as well as Connector Position Assurances (CPAs).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All possible designs and applications could not be anticipated in creating these guidelines. Where there are questions of adherence to this document, such as use of an “off-the-shelf” design, always consult the responsible Ergonomics Department.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Refer to SAE/USCAR-12 Wiring Component Design Guidelines for additional guidelines.&lt;/div&gt;&lt;/div&gt;</p>
