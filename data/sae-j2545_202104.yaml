  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice identifies test procedures and parameters which may be used to evaluate, qualify and inspect non-SAE hydraulic hoses or other hose constructions which do not conform to any established ISO or national standards defining hydraulic hoses. (Non-SAE hydraulic hoses are defined as those which do not conform to the categories listed in SAE J517.) It is not intended for evaluating fluoropolymer lined hose constructions or hose constructions with working pressures above 86 MPa.&lt;/div&gt;&lt;/div&gt;</p>
