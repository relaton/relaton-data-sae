  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides a system for specifying significant material properties of thermoplastic elastomers (TPEs) that are intended for, but not limited to, use in automotive applications.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 1—For the purposes of this document a TPE is defined as a polymeric material that, without further chemical modifications, is capable of recovering from deformations quickly and forcibly and is also capable of being repeatedly softened by heating and hardened by cooling within a temperature range characteristic of the material.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 2—When the TPE product is to be used for purposes where the requirements are too specific to be completely prescribed by this classification system, it is necessary for the purchaser to consult the supplier in advance to establish the appropriate properties, test methods, and specification test limits.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In all cases where provisions of this classification system would conflict with those of the detailed specifications for a particular product, the latter shall take precedence.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This classification is based on SI units.&lt;/div&gt;

    &lt;/div&gt;</p>
