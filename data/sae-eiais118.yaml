abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The CDIF Family of Standards is primarily designed to be used as a description of a mechanism for transferring information between CASE tools. It facilitates a successful transfer when the authors of the importing and exporting tools have nothing in common except an agreement to conform to CDIF. The language that is defined for the Transfer Format also has applicability as a general language for Import/Export from repositories. The CDIF Integrated Meta-model also has applicability as the basis of standard definitions for use in repositories.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The standards that form the complete family of CDIF Standards are documented in &lt;i&gt;EIA/IS-106 CDIF - CASE Data Interchange Format - Overview.&lt;/i&gt; These standards cover the overall framework, the transfer format and the CDIF Integrated Meta-model.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;The diagram in &lt;span class="xref"&gt;Figure 1&lt;/span&gt; depicts the various standards that comprise the CDIF Family of Standards. The shaded box depicts this Standard and its position in the CDIF Family of Standards.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard, &lt;i&gt;EIA/IS-118 CDIF - Integrated Meta-model - Presentation Location and Connectivity Subject Area,&lt;/i&gt; defines the portion of the CDIF Integrated Meta-model that supports presentation concepts such as nodes, edges, and annotations.&lt;/div&gt;&lt;/div&gt;</p>
