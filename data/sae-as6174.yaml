  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard standardizes practices to:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;maximize availability of authentic materiel,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;procure materiel from reliable sources,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;assure authenticity and conformance of procured materiel, including methods such as certification, traceability, testing and inspection appropriate to the commodity/item in question,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;control materiel identified as fraudulent/counterfeit,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;and report suspect or confirmed fraudulent/counterfeit materiel to other potential users and Authority Having Jurisdiction.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
