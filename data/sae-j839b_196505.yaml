  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes minimum performance requirements and test procedures for evaluating and testing passenger car side door latch systems. It is limited to tests that can be conducted on uniform test fixtures and equipment in commercially available laboratory test facilities.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedures and minimum performance requirements outlined in this recommended practice are based on currently available engineering data. It is intended that all portions of the recommended practice will be periodically reviewed and revised, as additional knowledge regarding vehicle latch performance under impact conditions is developed.&lt;/div&gt;&lt;/div&gt;</p>
