  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification, in conjunction with the general requirements for steel heat treatment covered in AMS2759, establishes the requirements and procedures for three classes of gas, vacuum, liquid, and low pressure (LPC) carburizing and related heat treatment of parts fabricated from carburizing grade steels. It does not cover pack carburizing.&lt;/div&gt;


    &lt;/div&gt;</p>
