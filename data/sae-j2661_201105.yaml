  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers a procedure for evaluating plastic and multiple-layer coatings exposed to gravelometer testing (as defined in SAE J400) with an optical imaging and analysis system. The intent of the procedure is to detect, count and characterize instances of damage in the coated surface that fracture the top coat layer or penetrate through multiple layers of the coating system. It may be possible to extend this methodology of coating damage evaluation to specimens that have undergone test procedures or exposures that produce similar, discrete damage sites in the coating system. If so applied, evaluation results must be interpreted with respect to the limitations and intent implied by the original evaluation procedure and its associated rating system, if applicable.&lt;/div&gt;

    &lt;/div&gt;</p>
