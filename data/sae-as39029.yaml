    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the general requirements for removable crimp, solderless wrap, and solder type electrical contacts for use in connectors and other electric and electronic components (see &lt;span class="xref"&gt;6.1&lt;/span&gt;). These contacts shall be capable of operating within the temperature range as specified (see &lt;span class="xref"&gt;3.1&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
