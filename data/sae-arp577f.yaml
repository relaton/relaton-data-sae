  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) specifies criteria for the design, development, standardization, and comprehension testing of placards containing pictures, drawings, symbols, and/or written instructions for locating and operating aircraft emergency equipment. This ARP also provides guidance in the selection and implementation of warning placards intended to instruct occupants inside, and rescue personnel outside, the aircraft.&lt;/div&gt;
