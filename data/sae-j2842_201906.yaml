abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this standard is to establish a framework to assure that all evaporators for R-744 and R-1234yf mobile air conditioning (MAC) systems shall meet appropriate testing and labeling requirements. SAE J639 requires an assement to be performed to minimize reasonable risks in MAC systems. The evaporator (as designed and manufactured) shall be part of that risk assessment, and it is the responsibility of the vehicle manufacturer to assure all relevant aspects of the evaporator are included. It is the responsibility of all vehicle or evaporator manufacturers to comply with the standards of this document at a minimum. (Substitution of specific test procedures by vehicle manufactures that correlate well to field return data is acceptable.) As appropriate, this standard can be used as a guide to support risk assessments.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;With regard to certification, most vehicle manufacturers have established formal production part approval processes (PPAP) where compliance certification is established and formally documented. For an evaporator manufacturer of non-original equipment parts (or a vehicle manufacturer that does not have a formal part compliance certification process), then the certification described in this standard is the requirement to which those evaporators shall comply. In this case, the evaporator manufacturer or an independent institution shall complete the evaporator certification according to SAE J2911. An example of the latter would be the completion of witness testing by the evaporator manufacturer with the submission of certification documents by the witness organization.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Refrigerant R-152a was excluded from this standard because a secondary loop refrigerant system is required. This standard also does not apply to R-134a refrigerant evaporators because it is proven in use.&lt;/div&gt;&lt;/div&gt;</p>
