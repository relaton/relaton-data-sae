  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These remanufacturing procedures are recommended minimum guidelines (with theunderstanding that being more critical is acceptable) for use by remanufacturers/rebuilders of alternators to promote consistent reliability, durability, and safety of remanufactured alternators. Installation of remanufactured or rebuilt products is often an economical way to repair an application even though the products may not be identical to original equipment parts. Before processing any part, a remanufacturer/rebuilder should determine if the original design and present condition of the core are suitable for remanufacturing/rebuilding so as to provide durable operation of the part as well as acceptable performance when installed on the application. The remanufacturer/rebuilder should also consider the safety aspects of the product and any recommendations of the original manufacturers related to remanufacturing or rebuilding this product.&lt;/div&gt;&lt;/div&gt;</p>
