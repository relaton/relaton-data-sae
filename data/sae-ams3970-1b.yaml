  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;AMS3970/1 gives information about the technical requirements and qualification procedure for carbon fiber fabric epoxy prepreg and a companion non-structural glass prepreg used for repair of carbon fiber reinforced epoxy structures. The prepreg system may include a film adhesive to be applied in a co-curing process with the prepreg for joint and sandwich bonding. The need for a film adhesive shall be established during screening tests.&lt;/div&gt;&lt;/div&gt;</p>
