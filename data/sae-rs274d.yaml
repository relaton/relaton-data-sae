  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is intended to serve as a guide in the coordination of system design, to minimize the variety of program manuscripts required, to promote uniformity of programming techniques, and to foster interchangeability of input data between numerically controlled machines of the same classification by type, process function, size, and accuracy. It is intended that simple numerically controlled machines be programmed using a simple format, which is systematically expandable for more complex machines.&lt;/div&gt;&lt;/div&gt;</p>
