  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) presents information on gas energy limited propulsion engine starting systems employed in commercial and military applications and remote industrial sites. The types of systems discussed utilize solid propellant cartridge gas, monopropellant hydrazine gas, bipropellant gas, compressed stored gas, and cryogenic stored nitrogen. Presented information conveys design features, performance capabilities and system limitations with methods of computing results.&lt;/div&gt;&lt;/div&gt;</p>
