  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard covers two basic Stall Warning Systems, one measures air flow and pressure distribution on the airfoil and the other measures the angle of airflow with respect to an arbitrary reference line. Each type of system includes, as a minimum, a sensor and the means for activating a device which warns the pilot of an impending stall.&lt;/div&gt;&lt;/div&gt;</p>
