    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice has been developed to provide a uniform method for reporting the weight, dimensions, center of gravity, and moment of inertia of internal combustion engines. SAE J2038 is not intended to cover the technical interface between the engine and transmission. To locate the rear of the engine crankshaft in relationship to the rear of the flywheel housing, refer to SAE J617.&lt;/div&gt;&lt;/div&gt;</p>
