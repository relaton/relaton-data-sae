  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report defines the minimum performance specifications for accelerometers, load cells, and angular position transducers used within Anthropomorphic Test Devices (ATDs) when performing impact tests per SAE J211, “Instrumentation for Impact Test”. This report does not define methodology and equipment for performing verification tests of the transducers. It is intended that any agency proposing to conduct tests in accordance with SAE J211 shall be able to demonstrate that the transducers they use would meet the performance requirements specified in this document.&lt;/div&gt;

    &lt;/div&gt;</p>
