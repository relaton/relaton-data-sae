    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines, for vehicle manufacturers and collision information and equipment providers, the types of vehicle dimensional data needed by the collision repair industry and aftermarket equipment modifiers to properly perform high-quality repairs to damaged vehicles. Both body-frame and unitized vehicles, including passenger cars and light trucks, are addressed.&lt;/div&gt;
