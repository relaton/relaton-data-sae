  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the minimum standard requirements for Message Boards (MBs) at Deicing Facilities. This standard also defines the minimum content and appearance of the display, functional capabilities, design requirements, and inspection and testing requirements.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Design and Operation of Aircraft Deicing Facilities are covered by ARP4902.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Standards for the deicing facility management system are outside the scope of this document.&lt;/div&gt;


    &lt;/div&gt;</p>
