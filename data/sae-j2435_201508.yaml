  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The SAE Standard covers normalized electric resistance welded flash controlled single-wall, carbon steel pressure tubing intended for use as pressure lines and in other applications requiring tubing of a quality suitable for cold forming, welding and brazing. Material produced to this specification should not be used for single flare applications due to the potential leak path that would be caused by the ID weld bead or scarfed region. Assumption of risks when using this material for single flare applications to be defined by agreement between the producer and tube purchaser.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The grade of material produced to this specification is higher in carbon and manganese content than the grade of material specified in SAE J356 and is intended to service higher pressure applications than equivalent sizes of SAE J356. Due to the higher carbon and manganese content the forming characteristics of the finished tube are diminished versus the SAE J356 product. Special attention to the overall forming requirements of the finished assembly shall be taken into consideration when specifying material produced to this specification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In an effort to standardize within a global marketplace and ensuring that companies can remain competitive in an international market it is the intent to convert to metric tube sizes which will:
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Lead to one global system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Guide users to preferred system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Reduce complexity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Eliminate inventory duplications&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;</p>
