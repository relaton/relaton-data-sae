abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This specification covers an aircraft-quality, low-alloy, heat-resistant steel in the form of bars, forgings, mechanical tubing, and forging stock procured in SI (metric) units.&lt;/p&gt;
    &lt;p&gt;AMS 6304 is the inch/pound version of this MAM.&lt;/p&gt;
    &lt;p&gt;These products have been used typically for parts, such as shafts, and fasteners, for service up to 540 degrees C, but usage is not limited to such applications.&lt;/p&gt;</p>
