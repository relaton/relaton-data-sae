  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This compilation of terms, acronyms and symbols was drawn from usage which should be familiar to those working in automotive electronics reliability. Terms are included which are used to describe how items, materials and systems are evaluated for reliability, how they fail, how failures are modeled and how failures are prevented. Terms are also included from the disciplines of designing for reliability, testing and failure analysis as well as the general disciplines of Quality and Reliability Engineering. This glossary is intended to augment SAE J1213, Glossary of Automotive Electronic Terms.&lt;/div&gt;&lt;/div&gt;</p>
