  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes consistent test procedures for determination of steady-state directional control properties for passenger cars and light trucks with single axles. These properties include the &lt;i&gt;gradients&lt;/i&gt; with respect to lateral acceleration of steering wheel angle, understeer/ oversteer, sideslip, roll angle, and steering wheel torque; the &lt;i&gt;gains&lt;/i&gt; with respect to steering wheel angle of yaw velocity, lateral acceleration, and sideslip; the &lt;i&gt;characteristic speed&lt;/i&gt; or &lt;i&gt;critical speed&lt;/i&gt;; and the total, steering, and tire &lt;i&gt;compliances&lt;/i&gt; at the front and rear wheels.&lt;/div&gt;&lt;/div&gt;</p>
