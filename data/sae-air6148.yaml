  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides general information on the developing subject of synthetic jet fuels derived from non-petroleum feed stocks. It addresses synthetic jet fuel properties and other topics associated with their use and is intended as a guide to assist aviation fuel system designers in considering important information on fuel properties when designing aircraft fuel systems and components. The AIR is limited to “drop-in” fuels that meet the requirements of the respective fuel specifications and are compatible with typical aircraft and ground refueling systems. While some key properties are included in this AIR for discussion, the reader should utilize documents such as MIL-HDBK-510 or the ASTM International research reports for a more-detailed review of fuel properties. AIR7484 also gives more details on fuel properties, specifically as they relate to airframe fuel system design.&lt;/div&gt;

    &lt;/div&gt;</p>
