    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is applicable to all heat exchangers used in vehicle and industrial cooling systems. This document outlines the tests to determine the heat transfer and pressure drop performance of heat exchangers under specified conditions. This document has been reviewed and revised by adding several clarifying statements to &lt;span class="xref"&gt;Section 4&lt;/span&gt;.&lt;/div&gt;

