  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Pallet extensions provide support for items of cargo beyond either the short or the long sides of a pallet, allowing increased volume to be achieved. The extensions are designed to suit the contour of wide-bodied aircraft. Each extension consists of a panel or shelf extending upwards and outboards within an envelope bounded by the ULD contour (see &lt;span class="xref"&gt;Figures 1&lt;/span&gt;, &lt;span class="xref"&gt;2&lt;/span&gt;, &lt;span class="xref"&gt;3&lt;/span&gt;, and &lt;span class="xref"&gt;4&lt;/span&gt;). The panel or shelf is secured in this position by means of chains, cables, or structural members attached to the rails of the adjacent sides of the pallet edge.&lt;/div&gt;



    &lt;/div&gt;</p>
