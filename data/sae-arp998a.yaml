  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Part I of this document relates to the restraint systems for the flight deck crew.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Part II considers restraint systems for flight attendants and other crew members.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;As applicable, the same criteria should be incorporated in both Part I and Part II installations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommendations herein include coverage of such items as harness reels, shoulder harnesses, and safety belts. However, the intention is not to limit the design of restraint devices to these particular system components only.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These recommendations apply primarily to forward-facing and aft-facing seats. However, the design should take into account the fact that loads may be applied from any direction and be of a magnitude at least as great as those specified in current FAR's.&lt;/div&gt;&lt;/div&gt;</p>
