  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this test procedure is to provide a uniform method of testing commercial spherical rod end bearings to determine their performance characteristics under specific application situations. This procedure is an extension of the dimensional requirements for spherical rod end bearings as set forth in SAE J1120 and J1259. The loads, number of cycles, definition of failure, etc., are to be agreed to by the user and supplier. This procedure can also be used as the basis for testing ball joints covered by SAE J490.&lt;/div&gt;&lt;/div&gt;</p>
