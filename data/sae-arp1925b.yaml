    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice establishes a procedure for the application of long string abrasive monofilaments to machined aircraft structures for the purpose of removing burrs produced during the machining operations. This procedure is typically applicable to aluminum, titanium, and steel, but usage is not limited to such applications.&lt;/div&gt;&lt;/div&gt;</p>
