  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard details two methods of inspecting TFE lined spherical or journal bearing wear outside the test apparatus. The methods described herein are applicable only to bearings which were unidirectionally loaded and the area of sliding wear is known and held constant throughout the dynamic test. The two methods described are:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Destructive Inspection - Cut and measure (not applicable to molded liners)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Non-destructive Inspection - Radial play (gage) measurement&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
