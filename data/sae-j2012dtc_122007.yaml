  content: |-
    <p>&lt;p&gt;The J2012 Diagnostic Trouble Code Definitions Spreadsheet provides DTC information in an excel format for use in your organization's work processes. The column headings include the same information as contained in the &lt;a href="http://www.sae.org/technical/standards/J2012_200712"&gt;J2012 standard&lt;/a&gt;.&lt;/p&gt;
    &lt;p&gt;Information in the excel spreadsheet will be updated several times annually, and the spreadsheet includes a column heading denoting which DTC have been updated in the current version.&lt;/p&gt;</p>
