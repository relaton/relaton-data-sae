  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This guide provides detailed information, guidance, and methods for demonstrating electromagnetic compatibility (EMC) on civil aircraft. This guide addresses aircraft EMC compliance for safety and functional performance of installed electrical and electronic systems. The EMC guidance considers conducted and radiated electromagnetic emissions and transients generated by the installed electrical and electronic systems which may affect other installed electrical and electronic systems on the aircraft. Application of appropriate electrical and electronic equipment EMC requirements are discussed. Methods for aircraft EMC tests and analysis are described. This guide does not address aircraft compatibility with the internal electromagnetic environments of portable electronic devices (PED) or with the external electromagnetic environments, such as high-intensity radiated fields (HIRF), lightning, and precipitation static.&lt;/div&gt;
    &lt;/div&gt;</p>
