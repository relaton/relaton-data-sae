abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This specification, in conjunction with the general requirements for steel heat treatment covered in AMS 2759, establishes the requirements for heat treatment of martensitic corrosion-resistant steel parts. Parts are defined in AMS 2759.&lt;/p&gt;
    &lt;p&gt;This specification is applicable to parts made from the following steels: Types 403, 410, 416, 420, 422, 431, 440C, and Greek Ascoloy (UNS S40300, S41000, S41600, S42000, S42200, S43100, S44004, and S41800 respectively).&lt;/p&gt;</p>
