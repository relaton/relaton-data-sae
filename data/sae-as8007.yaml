  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AS defines instruments which use inputs of static and pitot pressure equal to those which are utilized to establish the pressure altitude and speed of that aircraft. These pressures are applied to the instrument ports to provide means for generation of an aural warning whenever the aircraft reaches or exceeds the maximum operating limit speed. This Over Speed Warning Instrument function may be incorporated as part of an Air Data Computer, or an Air Speed Indicator, or an Air Speed/Mach Number Indicator, or other instruments. In those cases where the Over Speed Warning Instrument is part of another instrument, the standards contained herein apply only to the Over Speed Warning Instrument function. Each aircraft type and model has a defined maximum operating limit speed curve or curves which are a part of the airframe manufacturer's type certification approval data; this limit speed data shall be available from the subject airframe manufacturer as published in the operating manual for the aircraft type and model number and configuration.&lt;/div&gt;&lt;/div&gt;</p>
