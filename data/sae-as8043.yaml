  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard specifies laboratory test procedures and minimal requirements for the manufacturer of torso restraint systems for use in small fixed wing aircraft and rotorcraft. It is intended to establish a minimum level of quality which can be called upon by the designer of those systems. However, compliance with this standard alone may not assure adequate performance of the restraint system under normal and emergency conditions. Such performance requires consideration of factors beyond the scope of this standard, and must be demonstrated by a system evaluation procedure which includes the seat, the occupant, the specific restraint installation and the cabin interior configuration.&lt;/div&gt;&lt;/div&gt;</p>
