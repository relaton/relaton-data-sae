abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;p&gt;This SAE Recommended Practice has been adopted by SAE to specify:&lt;/p&gt;
    &lt;p&gt;a. A standard procedure for chassis dynamometer testing of heavy-duty road vehicles for the purpose of determining power delivered through the drive tires.&lt;/p&gt;
    &lt;p&gt;b. A method of correcting observed power to reference test conditions.&lt;/p&gt;
    &lt;p&gt;c. A method of analyzing the test data to determine if the test results are within expected power ranges.&lt;/p&gt;</p>
