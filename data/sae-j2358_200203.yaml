  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines the safety and performance requirements for Low Speed Vehicles (“LSV”). The safety specifications in this document apply to any powered vehicle with a minimum of 4-wheels, a maximum level ground speed of more than 32 km/h (20 mph) but less than 40 km/h (25 mph), a maximum rated capacity of 500 kg (1100 lb), and a maximum gross vehicle weight of 1135 Kg (2500 lb), that is intended for transporting not more than four (4) persons and operating on designated roadways where permitted by law. Personal Neighborhood Vehicles (PNVs) have the same general specifications as LSVs, but the maximum level ground speed is limited to 32 km/h (20 mph).&lt;/div&gt;
    &lt;/div&gt;</p>
