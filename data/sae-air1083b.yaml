  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides the hydraulic system designer with the various design options and techniques currently available to enhance the survivability of hydraulic systems. A comprehensive knowledge of the hostile environment to which the air vehicle will be exposed will form the basis upon which the overall design philosophy is formulated. The designer should strive to achieve at the absolute minimum a system which provides the actuation and control capability to meet the minimum acceptable flying quality level to complete the operational mission for which the aircraft is designed; i.e., the aircraft can be controlled and the mission terminated safely, including landing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This AIR will attempt to address the following threats:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Typical Small Arms Fire (5.56, 7.62, 12.7 and 14.5 mm AP)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Cannon (20, 30, and 40 mm API/HEI)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;NBC/EMI/EMP/Beamed Particle&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Chemical/Biological&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Protection against missiles is beyond the scope of this AIR.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Except for electronic counter-measures or evasive maneuvers, no practical technology exists which allows a hydraulic system to survive a direct hit by a missile or large caliber anti-aircraft projectile. The AIR addresses the following major topics:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Design concepts and architecture&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Design implementation&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Subsystem mechanization&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Component design&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;/div&gt;</p>
