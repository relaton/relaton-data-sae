  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines the requirements for a threadless, flexible, self-bonding coupling assembly, which, when installed on machined fixed cavity ferrules, provides a flexible connection for joining tubing and components in aircraft fuel, vent, or other systems. This assembled coupling, hereafter referred to as the assembly, is designed for use from -54 to 204 °C and at 862 kPa operating pressure. AS coupling components referenced herein have been qualified to AS1650. Ferrules referenced herein are inch ferrules adapted to metric tubing.&lt;/div&gt;
    &lt;/div&gt;</p>
