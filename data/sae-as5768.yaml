  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers design requirements, performance requirements, and methods of procurement for tools and associated accessories used to strip aerospace vehicle electrical wire and cable. Aerospace vehicle electrical wire has stranded conductors with protective plating and specialized insulation. Poor quality wire strippers or mismatched blades can compromise the performance of wiring.&lt;/div&gt;&lt;/div&gt;</p>
