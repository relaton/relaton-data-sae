abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard specifies brake system performance and test criteria
    to enable uniform evaluation of the braking capability of self-propelled, ride-on
    vibratory steel wheel, static steel wheel, and rubber-tire roller compactors with
    maximum level surface machine speeds of 25 km/h or less.  Service, secondary,
    and parking brakes are included.  Machines with maximum level surface machine
    speeds greater than 25 km/h shall conform to the requirements of SAE J/ISO 3450.</p>"
