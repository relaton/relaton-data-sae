  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes the requirements and test procedures for automotive miniature bulb retention devices, including wedge base sockets with integral connector, direct wire wedge base sockets, circuit plate assemblies, and associated interfaces.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Tests shall follow the sequence shown in the flow charts in &lt;span class="xref"&gt;Appendix E&lt;/span&gt; whenever the following occurs:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;New design&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Design, material or process change made to an existing device, which could affect the outcome of the test.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;The test sequence shown in &lt;span class="xref"&gt;Appendix F&lt;/span&gt; shall be run annually.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;i&gt;(Note: Production process control data collected at a shorter interval per an approved control plan, may be substituted if approved by customer’s responsible engineer and purchasing representative.)&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;</p>
