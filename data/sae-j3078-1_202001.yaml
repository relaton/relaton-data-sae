    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J3078 provides test methods and criteria for the evaluation of the operator enclosure environment in earth-moving machinery as defined in ISO 6165. SAE J3078/1 gives the terms and definitions which are used in other parts of SAE J3078. It is applicable to Off-Road Self-Propelled Work Machines as defined in SAE J1116 and Agricultural Tractors as defined in ANSI/ASAE S390.&lt;/div&gt;&lt;/div&gt;</p>
