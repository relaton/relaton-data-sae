  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;The method presented applies to the analysis of the indicated constituents in diesel engine exhaust, or exhaust of vehicles using diesel engines, when operating at steady-state conditions. The measurements of carbon monoxide, carbon dioxide, and nitric oxide are based on continuous sampling and analysis by nondispersive infrared methods.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A supplementary batch sampling, wet chemistry method is described for analysis of the oxides of nitrogen.&lt;/div&gt;&lt;/div&gt;</p>
