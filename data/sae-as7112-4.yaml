    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Aerospace Standard (AS) is to be used as a supplement to SAE AS7112. In addition to the requirements contained in AS7112, the requirements contained herein shall apply to suppliers seeking NADCAP Fluid System Components Accreditation for Hose Assembly.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Hose/tube assemblies may be qualified as being comprised of bulk qualified hose/tube and fittings. The purpose of this standard is to define requirements for audit qualification of the hose/tube assembly to an "assembly" procurement/performance specification. It addresses the fabrication of two or more components coupled by means of screwing, bolting, welding, brazing, swaging or crimping together to form an assembly to meet performance criteria - qualification.&lt;/div&gt;&lt;/div&gt;</p>
