    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;ROPS and/or FOPS may commonly be a part of construction, forestry, mining, industrial, and agricultural machines. The label content herein should be applied to a ROPS and/or FOPS on any of these machines. See SAE J1116 for categories of machines.&lt;/div&gt;&lt;/div&gt;</p>
