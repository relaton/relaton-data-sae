  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice (RP) establishes uniform powered vehicle level test procedure for Forward Collision Avoidance and Mitigation (FCAM) systems (also identified as Automatic Emergency Braking (AEB) systems) used in highway commercial vehicles and coaches greater than 4535 Kg (10,000 lb.) GVWR. This RP does not apply to trailers, dollies, etc. and does not intend to exclude any particular system or sensor technology. These FCAM systems utilize various methodologies to identify, track and communicate data to the operator and vehicle systems to warn, intervene and/or mitigate in the longitudinal control of the vehicle.&lt;/div&gt;&lt;/div&gt;</p>
