  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides test procedures, requirements, and guidelines for high-mounted stop lamps and high-mounted turn signal lamps intended for use on vehicles 2032 mm or more in overall width. This document applies to trucks, motor coaches, van type trailers, and other vehicles with permanent structure greater than 2800 mm high.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not apply to school buses, truck tractors, pole trailers, flat-bed trailers, pick-up trucks with dual wheels, and trailer converter dollies.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of the high-mounted stop lamp(s) and high-mounted turn signal lamp(s) is to provide a signal to the driver of following (approaching a signaling vehicle from the rear) or oncoming (approaching a signaling vehicle from the front) vehicles over intervening vehicles.&lt;/div&gt;&lt;/div&gt;</p>
