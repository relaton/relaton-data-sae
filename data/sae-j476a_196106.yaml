  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The Dryseal American Standard Taper Pipe Thread, the Dryseal American Fuel Internal Straight Pipe Thread and the Dryseal American Intermediate Internal Straight Pipe Thread covered by this standard conform with the American Standard ASA-B2.2. The Dryseal SAE-Short Taper Pipe Thread in this standard conforms with the Dryseal American Standard Taper Pipe Thread except for the length of thread, which is shortened for increased clearance and economy of material.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The significant feature of the Dryseal thread is controlled truncation at the crest and root to assure metal to metal contact coincident with or prior to flank contact. Contact at the crest and root prevents spiral leakage and insures pressure-tight joints without the use of a lubricant or sealer.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Lubricants, if not functionally objectionable, may be used to minimize the possibility of galling in assembly.&lt;/div&gt;&lt;/div&gt;</p>
