    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice establishes a minimum zone of protection for the operator of the machine and certain structural requirements for guards on pneumatic-tired earthmoving haulage machines capable of speeds in excess of 25 km/h (15 mph). Earthmoving machines covered by this recommended practice are dumpers, and tractor-scrapers as identified in SAE J1057a (June, 1975).&lt;/div&gt;&lt;/div&gt;</p>
