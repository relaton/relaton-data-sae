  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method provides stakeholders (runway deicing chemical manufacturers, deicing/anti-icing chemical operators and airport authorities) with relative ice melting capacity of runway deicing chemicals, by measuring the amount of ice melted as a function of time. Such runway deicing chemicals are often also used on taxiways.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This test method does not quantitatively measure the theoretical or extended time ice melting capability of ready-to-use runway deicing/anti-icing chemicals in liquid or solid form.&lt;/div&gt;


    &lt;/div&gt;</p>
