  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides design, operation, construction, test and installation recommendations for equipment that automatically presents supplemental oxygen masks to cabin occupants in the event of loss of cabin pressure. It specifically covers automatic presentation for transport category aircraft that operate above 30,000 ft (9144 m) altitude, although it also provides guidance for similar equipment used in non-transport category aircraft, or aircraft operated below 30,000 f (9144 m) altitude.&lt;/div&gt;&lt;/div&gt;</p>
