  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard describes the test methods for flexible PTFE hose and hose assemblies used in aircraft fluid systems in the pressure and temperature ranges defined in MA2001 (ISO 6771). It applies to the hose and the hose coupling. The tests and assembly requirements for the connecting end fitting are covered in the procurement specification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document applies each time that it is referred to in a procurement specification or other definition document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Fluids and materials used for the tests are listed in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
