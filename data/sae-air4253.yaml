  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This AIR provides a description of representative state-of-the-art, fly-by-wire (FBW) actuation systems used in flight control systems of manned aircraft. It presents the basic characteristics, hardware descriptions, redundancy concepts, functional schematics, and discussions of the servo controls, failure monitoring, and fault tolerance. All existing FBW actuation systems are not described herein; however, those most representing the latest designs are included. While this AIR is intended as a reference source of information for future aircraft actuation system designs, the exclusion or omission of any other appropriate actuation system or subsystem should not limit consideration of their use on future aircraft.&lt;/div&gt;&lt;/div&gt;</p>
