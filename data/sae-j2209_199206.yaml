  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to provide equipment specifications for CFC-12 (R-12) recovery for return to a refrigerant reclamation facility that will process it to ARI standard 700-88 as a minimum (Air Conditioning and Refrigerant Institute). It is not acceptable that the refrigerant removed from a mobile air-conditioning system, with this equipment, be directly returned to a mobile air-conditioning system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This information applies to equipment used to service automobiles, light trucks, and other vehicles with similar R-12 systems.&lt;/div&gt;&lt;/div&gt;</p>
