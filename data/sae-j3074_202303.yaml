  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procedure establishes a recommended practice for performing a lumbar flexion test to the Hybrid III 50th male anthropomorphic test device (ATD or crash dummy). This test was created to satisfy the demand from industry to have a certification test which characterizes the lumbar without interaction of other dummy components. In the past, there have not been any tests to evaluate the performance of Hybrid III 50th lumbar.&lt;/div&gt;
    &lt;/div&gt;</p>
