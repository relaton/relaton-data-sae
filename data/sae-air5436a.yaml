  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a method to correct engine thrust, measured in an indoor test cell, for the aerodynamic effects caused by the secondary airflow induced in the test cell by the engine operating in an enclosed environment in close proximity to an exhaust duct. While it is not recommended to be used to replace test cell correlation, it does provide a means to verify an existing thrust correlation factor.&lt;/div&gt;&lt;/div&gt;</p>
