    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes training guidelines applicable to fiber optic fabricator technical training for individuals involved in the manufacturing, installation, support, integration and testing of fiber optic systems. Applicable personnel include:
