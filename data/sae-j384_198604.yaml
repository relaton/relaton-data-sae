    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice outlines both dynamic and static test procedures of seat belt anchorages attached to vehicle structure or seat assemblies installed in the vehicle. (This SAE Recommended Practice supersedes the Test Procedure Section of SAE J787b.) Design Recommendations and Performance Requirements are specified in the Recommended Practices SAE J383, Motor Vehicle Seat Belt Anchorages--Design Recommendations and SAE J385, Motor Vehicle Seat Belt Anchorages--Performance Requirements, respectively.&lt;/div&gt;&lt;/div&gt;</p>
