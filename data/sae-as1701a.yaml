    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the performance requirements for solid dry film lubricants, air dried, or heat cured for use in aerospace applications. These lubricants are intended to prevent galling, and may be capable of remaining effective for extended periods of time after exposure to extreme environmental conditions.&lt;/div&gt;


