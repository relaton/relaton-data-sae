  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is intended to provide guidelines to tightening methods and torque values as applied to electrical connectors, related hardware and switches, relays, circuit breakers and A-A-59125 type terminal boards. The connectors and associated hardware discussed herein, are typically manufactured from aluminum alloy, high grade engineering thermoplastics or corrosion resistant steel and typically plated with a protective/conductive coating. These guidelines may be used where no rules have been mandated either contractually or otherwise.&lt;/div&gt;
    &lt;/div&gt;</p>
