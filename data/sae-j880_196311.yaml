  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The code provides test procedures and instructions for:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Instrumentation and equipment.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Vehicle preparation.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Determining brake system energy absorption capacity.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Calculation of a brake rating.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The code includes provision for those vehicles, single unit, combinations, or special, which cannot be loaded to the manufacturer's rated gross vehicle weight, cannot be accelerated in the time interval required, or cannot attain the specified 50 mph speed.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Methods for measuring energy absorption capacity, other than described herein, may be equally valid.&lt;/div&gt;&lt;/div&gt;</p>
