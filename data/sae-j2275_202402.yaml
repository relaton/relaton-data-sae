  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;There is no ISO standard equivalent to this SAE Standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Standard identifies and defines the most commonly used terms for piston ring-groove characteristics, specifies dimensioning for groove widths, and demonstrates the methodology for calculation of piston groove root diameter.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this document apply to pistons and rings of reciprocating internal combustion engines and compressors working under analogous conditions, up to and including 200 mm diameter and 4.5 mm width for compression rings and 8.0 mm width for oil rings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specifications in this document assume that components are measured at an ambient temperature of 20 °C (68 °F).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Tolerances specified in this document represent practical functional limits and do not imply process capabilities.&lt;/div&gt;&lt;/div&gt;</p>
