  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers types and qualities of felts required for general automotive uses. It was developed with the cooperation of the Standardization Committee of the Felt Association. Inc., and in accordance with the ASTM tests indicated in the standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The commercial trade designations of the more commonly used grades of automotive felts are given along with complete specifications and tolerances for thickness, mass, wool content, chemical and physical requirements, color, and width.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;General information, recommended uses, etc., are published in an &lt;span class="xref"&gt;Appendix&lt;/span&gt; as a guide in the selection of felts for particular uses, but the requirements for each application should be taken into consideration in making final selections.&lt;/div&gt;&lt;/div&gt;</p>
