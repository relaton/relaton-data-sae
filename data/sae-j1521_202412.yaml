  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes two-dimensional, 95th percentile truck driver, side view, seated shin-knee contours for both the accelerator operating leg and the clutch operating leg for horizontally adjustable seats (see &lt;span class="xref"&gt;Figure 1&lt;/span&gt;). There is one contour for the clutch shin-knee and one contour for the accelerator shin-knee. There are three locating equations for each curve to accommodate male-to-female ratios of 50:50, 75:25, and 90:10 to 95:5.&lt;/div&gt;&lt;/div&gt;</p>
