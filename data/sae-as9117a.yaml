abstract:
- language: en
  script: Latn
  content: |-
    <p>This standard specifies requirements for DPRV to establish common product/service requirements for use at all levels of the supply chain. This standard shall apply when an organization elects to delegate product release verification by contractual flow down to their supplier (reference 9100 and 9110 standards) to perform product acceptance on their behalf.
    The delegating organization shall use this standard as the baseline for establishing a DPRV process, although they may include additional contract requirements to meet their specific needs.</p>
