  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides basic information on the use of slipper seal sealing devices when used as piston (OD) and rod (ID) seals in aerospace fluid power components such as actuators, valves, and swivel joints, including:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;The definition of a slipper seal and the description of the basic types in use.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Guidelines for selecting the type of slipper seal for a given design requirement are provided in terms of friction, leakage, service life, installation characteristics, and interchangeability.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
