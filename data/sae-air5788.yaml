abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document specifies the CLARA interfaces of the CLAR Truth Data Generator as shown in &lt;span class="xref"&gt;Figure 1&lt;/span&gt;. The solid bold arrows are defined in &lt;span class="xref"&gt;Table 1&lt;/span&gt; and &lt;span class="xref"&gt;Table 2&lt;/span&gt;. The dashed arrows from the CLAR Coefficient Generator and Truth Database to the CLAR Data Space Generator indicate a feedback loop and are defined in the CLAR Data Space Generator ICD (Reference 1). The dashed arrow from the Truth Database to the CLAR Coefficient Generator is defined in the CLAR Coefficient Generator ICD (Reference 2).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The objective for the CLAR Truth Data Generator is to produce impact data sets to be used in the CLAR Coefficient Generator first to score and form LAR boundaries, and then to generate coefficients. A model of the weapon system that predicts weapon delivery performance to a predefined accuracy is to be used for this purpose. The model can be the Six-Degree-Of-Freedom (6DOF) equations of motion or another mathematical representation that meets the objective for the weapon system LAR.&lt;/div&gt;
    &lt;/div&gt;</p>
