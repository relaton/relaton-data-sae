  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a test method for determination of steady-state heavy truck (Class VI, VII, and VIII) tire force and moment properties under free-rolling conditions. The properties are acquired as functions of incrementally changed slip angle and normal force using a sequence specified in this document. The data are suitable for use in vehicle dynamics modeling, comparative evaluations for research and development purposes, and manufacturing quality control.&lt;/div&gt;


    &lt;/div&gt;</p>
