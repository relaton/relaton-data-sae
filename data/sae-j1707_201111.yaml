  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides basic recommendations for dispensing and handling of SAE J1703 and SAE J1704 Brake Fluids by Service Maintenance Personnel to assure their safe and effective performance when installed in or added to motor vehicle hydraulic brake actuating systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is concerned only with brake fluid and those system parts in contact with it. It describes general maintenance procedures that constitute good practice and that should be employed to help assure a properly functioning brake system. Recommendations that promote safety are emphasized. Specific step-by-step service instructions for brake maintenance on individual makes or models are neither intended nor implied. For these, one should consult the vehicle manufacturer’s service brake maintenance procedures for the particular vehicle. Vehicle manufacturer’s recommendations should always be followed.&lt;/div&gt;&lt;/div&gt;</p>
