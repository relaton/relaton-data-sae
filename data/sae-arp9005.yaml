  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;This document contains recommended practices for the effective control of non-deliverable software. It addresses practices for control during the development, production, release maintenance, and retirement of non-deliverable software, as well as for software procured from outside manufacturers and incorporated in the production, evaluation, test, acceptance or calibration of processes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For the purposes of this document, the terms software and non-deliverable software are considered synonymous.&lt;/div&gt;&lt;/div&gt;</p>
