  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to establish a testing procedure to determine the performance capability of heavy-duty vehicle cooling systems to meet Original Equipment Manufacturer or end user thermal specifications to ensure long term reliable vehicle operations. The recommendations from the present document are intended for heavy-duty vehicles including, but not limited to, on- and off-highway trucks, buses, cranes, drill rigs, construction, forestry, and agricultural machines.&lt;/div&gt;&lt;/div&gt;</p>
