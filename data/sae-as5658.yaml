  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) defines the editorial format and policies necessary for the publication of platform/subsystem Interface Control documents. The Common Interface Control Document Format Standard defines a common format for platform to subsystem interface documents to facilitate subsystem integration.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This aerospace standard specifies the common technical data sections for the Common Interface Control Document Format down to the third header level for the majority of sub-sections. The Common Interface Control Document Format Aerospace Standard provides a structured document format in appendixes supported by example paragraphs, drawings, etc.&lt;/div&gt;

    &lt;/div&gt;</p>
