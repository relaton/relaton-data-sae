  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines the wear limits allowed on certain features of Pressure Fuel Servicing Adapters which are crucial for safe interfacing of Pressure Fuel Servicing Nozzles and Pressure Caps. Wear limits as described herein represent the maximum amount of wear on certain features of the Adapter beyond which use of the Adapter for these purposes may contribute to an unsafe condition. Such wear is the result of the normal use of the Adapter for aircraft refueling and also, in some cases, for Nozzle stowage on refueling vehicles.&lt;/div&gt;

    &lt;/div&gt;</p>
