abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard is for use by organizations that procure and integrate EEE parts. These organizations may provide EEE parts that are not integrated into assemblies (e.g., spares and/or repair EEE parts). Examples of such organizations include, but are not limited to: original equipment manufacturers; contract assembly manufacturers; maintenance, repair, and overhaul organizations; value-added resellers; and suppliers that provide EEE parts or assemblies as part of a service. The requirements of this standard are generic. These requirements are intended to be applied (or flowed down as applicable) through the supply chain to all organizations that procure EEE parts and/or systems, subsystems, or assemblies, regardless of type, size, and product provided. The mitigation of counterfeit EEE parts in this standard is risk-based and these mitigation steps will vary depending on the criticality of the application, desired performance and reliability of the equipment/hardware.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The requirements of this document are intended to be used in conjunction with a higher-level quality standard (e.g., AS/EN/JISQ9100, ISO-9001, ANSI/ASQC E4, ASME NQA-1, AS9120, AS9003, or equivalent) and other quality management system documents. They are not intended to stand alone, supersede, or cancel requirements found in other quality management system documents, requirements imposed by contracting authorities, or applicable laws and regulations unless an authorized exemption/variance has been obtained. This document is not intended to make a legal determination of fraud, and appropriate legal counsel should be consulted for further action.&lt;/div&gt;&lt;/div&gt;</p>
