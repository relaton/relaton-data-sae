  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;The following Recommended Practice furnishes sample forms for helical compression, extension, and torsion springs to provide a uniform method for specifying design information. It is not necessary to fill in all the data, but sufficient information must be supplied to fully describe the part and to satisfy the requirements of its application. For detailed information see Design and Application of Helical and Spiral Springs—SAE J795a, also Helical Compression and Extension Spring Terminology—SAE J1121. For springs to be designed in the metric system with SI units, the terms shown in parentheses are to be used.&lt;/div&gt;


    &lt;/div&gt;</p>
