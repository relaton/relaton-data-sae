    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides testing and functional requirements to meet specified minimum performance criteria for electronic probe-type leak detectors. So they will identify smaller refrigerant leaks when servicing all motor vehicle air conditioning systems, including those engineered with improved sealing and smaller refrigerant charges to address environmental concerns and increase system efficiency. This document does not address any safety issues concerning their design or use.&lt;/div&gt;&lt;/div&gt;</p>
