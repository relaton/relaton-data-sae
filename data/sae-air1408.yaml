    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report lists military and industry specifications and standards which are commonly used in aerospace gas turbine fuel systems. It is intended as a supplement to specifications MIL-F-3863, MIL-F-17874 and MIL-F-8615. Revisions and amendments which are current for these specifications and standards are not listed.&lt;/div&gt;
