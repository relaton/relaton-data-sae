    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) establishes recommendations with respect to personnel and aircraft safety for the design of lavatory compartments in commercial aircraft. Consideration should be given to the fact the lavatory compartment is an area in which the passenger is not under direct observation of the flight attendants.&lt;/div&gt;&lt;/div&gt;</p>
