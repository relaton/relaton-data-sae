  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This aerospace recommended practice provides a framework and suggested procedures or values for requirements for the design, performance, and test of hydraulically powered servoactuators for use in aircraft flight control systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The original version of this document was intended for military usage: consequently, the requirements still often reflect such use. However, the basic requirements of this ARP may and should be applicable to commercial usage as well, provided that appropriate considerations are given for the applicable FAR/JAR 25 regulations, hydraulic fluids, and environmental conditions.&lt;/div&gt;


    &lt;/div&gt;</p>
