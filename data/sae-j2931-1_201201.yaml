  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report SAE J2931 establishes the requirements for digital communication between Plug-In Vehicles (PEV), the Electric Vehicle Supply Equipment (EVSE) and the utility or service provider, Energy Services Interface (ESI), Advanced Metering Infrastructure (AMI) and Home Area Network (HAN).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This is the first version of this document and completes the step 1 effort that captures the initial objectives of the SAE task force. The intent of step 1 was to record as much information on “what we think works” and publish. The effort continues however, to step 2 that allows public review for additional comments and viewpoints, while the task force also continues additional testing and early implementation. Results of the step 2 effort will then be incorporated into updates of this document and lead to a republished version.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The SAE J2931 family of documents has been organized into several “slash” subsections:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;This document, SAE J2931/1, defines architecture and general requirements including association, registration, security, and HAN requirements, as well as mapping to other SAE documents.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J2931/2 is under development and is proposed to define a MAC &amp;amp; PHY layer implementation of digital communications using FSK and the SAE J1772™ Pilot wire.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J2931/3 is under development and is proposed to define a MAC &amp;amp; PHY layer implementation of digital communications using NB OFDM and either the SAE J1772™ Pilot wire or mains.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;SAE J2931/4 is under development and is proposed to define a MAC &amp;amp; PHY layer implementation of digital communications using BB OFDM and either the SAE J1772™ Pilot wire or mains.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Testing and validation of the aforementioned physical layer specifications is ongoing, and it is possible that the results of said testing may preclude one or more of the proposed solutions as unable to meet the technical requirements. Reduction of the available options to a single, worldwide standard remains the long-term goal.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The document mapping of the PEV communication standards are further defined in &lt;span class="xref"&gt;section 4&lt;/span&gt;.&lt;/div&gt;
    &lt;/div&gt;</p>
