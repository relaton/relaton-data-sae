  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Three levels of fan structural analysis are included in this practice:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;1&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Initial Structural Integrity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;2&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;In-vehicle Testing&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;3&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Durability Test Methods&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;The Initial Structural Integrity section describes analytical and test methods used to predict potential resonance and, therefore, possible fatigue accumulation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The In-vehicle (or machine) section enumerates the general procedure used to conduct a fan strain gage test. Various considerations that may affect the outcome of strain gage data have been described for the user of this procedure to adapt/discard depending on the particular application.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Durability Test Methods section describes the detailed test procedures that may be used depending on type of fan, equipment availability, and end objective.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Each of the previous levels builds upon information derived from the previous level. Engineering judgment is required as to the applicability of each level to a different vehicle environment or a new fan design.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is applicable to medium and heavy-duty trucks, buses, construction equipment, industrial, and agricultural equipment. It does not necessarily include passenger cars and light trucks.&lt;/div&gt;
    &lt;/div&gt;</p>
