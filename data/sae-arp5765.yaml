  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines a means of assessing the credibility of computer models of aircraft seating systems used to simulate dynamic impact conditions set forth in Federal Regulations 14 CFR Part 23.562, 25.562, 27.562, and 29.562. The ARP is applicable to lumped mass and detailed finite element seat models. This includes specifications and performance criteria for aviation specific virtual anthropomorphic test devices (v-ATDs). A methodology to evaluate the degree of correlation between a seat model and dynamic impact tests is recommended. This ARP also provides testing and modeling best practices specific to support the implementation of analytical models of aircraft seat systems. Supporting information within this document includes procedures for the quantitative comparison of test and simulation results, as well as test reports for data generated to support the development of v-ATDs and a sample report. For this revision, &lt;span class="xref"&gt;Section 4&lt;/span&gt;, Seat System Validation is held in reserve.&lt;/div&gt;


    &lt;/div&gt;</p>
