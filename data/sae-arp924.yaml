    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice covers the requirements for the types of glass to be utilized in the fabrication of cover glasses and lighting wedges used in aerospace instruments. It defines the maximum extent of physical defects and recommend standard methods of inspection and evaluation. Definitions of terminology used in this document are covered in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
