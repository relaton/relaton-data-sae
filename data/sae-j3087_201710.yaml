  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes an SAE Recommended Practice for Automatic Emergency Braking (AEB) system performance testing which:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;establishes uniform vehicle level test procedures&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;identifies target equipment, test scenarios, and measurement methods&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;identifies and explains the performance data of interest&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;does not exclude any particular system or sensor technology&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;identifies the known limitations of the information contained within (assumptions and “gaps”)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;is intended to be a guide toward standard practice and is subject to change on pace with the technology&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;is limited to “Vehicle Front to Rear, In lane Scenarios” for initial release&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;This document describes the equipment, facilities, methods and procedures needed to evaluate the ability of Automatic Emergency Braking (AEB) systems to detect and respond to another vehicle, in its immediate forward path, as it is approached from the rear.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document does not specify test conditions (e.g., speeds, decelerations, headways, etc.). Those values will be defined by the tester according to the intended purpose of a given test sequence. Informative examples are provided for reference in &lt;span class="xref"&gt;Appendix B&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The procedure includes three test scenarios:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Stopped lead vehicle (Test 1) - the vehicle being approached is stopped in the lane of the test vehicle.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Slower lead vehicle (Test 2) the vehicle being approached is moving at a constant speed that is slower than the test vehicle.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Decelerating lead vehicle (Test 3) - the vehicle being approached is initially moving at the same speed as the test vehicle, but then slows.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
