abstract:
- language: en
  script: Latn
  content: "<p>This specification and its supplementary detail specifications cover accelerated curing synthetic rubber compounds with corrosion inhibitors and low adhesive strength, supplied as a two-component system, curing at room temperature.  This product has been used typically for sealing aircraft access doors and accessories where gaskets are required, but usage is not limited to such applications. The sealing compounds are resistant to both jet fuels and high aromatic aviation gasolines and are useable from -55 to +120 degrees C (-67 to +249 degrees F).</p>"
