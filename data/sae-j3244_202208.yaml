  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report lists common port connection types used in truck, bus, truck-trailer, converter dolly, and multi-purpose vehicles with air brake systems at the time of publication. The purpose of the document is to give system designers and users a starting point for connector selection and a reference to the standards that govern these connector types. Also included are notes on common practices associated with these ports.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;CAUTION: Consult the relevant standard for the connector before making a decision on suitability for use in a specific application.&lt;/div&gt;&lt;/div&gt;</p>
