    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a laboratory test procedure and requirements for evaluating the characteristics of heavy-truck steering control systems under simulated driver impact conditions, as well as driver entry/egress conditions. The test procedure employs a torso-shaped body block that is impacted against the steering wheel.&lt;/div&gt;&lt;/div&gt;</p>
