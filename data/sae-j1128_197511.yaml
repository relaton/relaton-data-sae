    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This standard covers low tension primary cable intended for use at 50 V or less in surface vehicle wiring. Requirements for cable sizes 20 through 4 previously contained in SAE Standard, Low Tension Cable—SAE J558 and SAE Recommended Practice, Low Tension Cable Thermosetting Insulation—SAE J878, are included. Cable sizes 6 through 4/0 previously specified in SAE J558 are now included in SAE J1127.&lt;/div&gt;&lt;/div&gt;</p>
