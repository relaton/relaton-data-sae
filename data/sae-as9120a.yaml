abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;&lt;i&gt;This standard includes ISO 9001:2008&lt;sup&gt;&lt;span class="xref"&gt;1&lt;/span&gt;&lt;/sup&gt; quality management system requirements and specifies additional aviation, space and defense industry requirements, definitions and notes as shown in bold, italic text.&lt;/i&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;b&gt;&lt;i&gt;It is emphasized that the requirements specified in this standard are complementary (not alternative) to contractual and applicable statutory and regulatory requirements. Should there be a conflict between the requirements of this standard and applicable statutory or regulatory requirements, the latter shall take precedence.&lt;/i&gt;&lt;/b&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This International Standard specifies requirements for a quality management system where an organization&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;needs to demonstrate its ability to consistently provide product that meets customer and applicable statutory and regulatory requirements, and&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;aims to enhance customer satisfaction through the effective application of the system, including processes for continual improvement of the system and the assurance of conformity to customer and applicable statutory and regulatory requirements.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 1 In this International Standard, the term “product” only applies to&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;product intended for, or required by, a customer,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;any intended output resulting from the product realization processes.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE 2 Statutory and regulatory requirements can be expressed as legal requirements.&lt;/div&gt;&lt;/div&gt;</p>
