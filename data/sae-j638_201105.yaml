    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice, limited to liquid coolant systems, establishes uniform vehicle heater test procedures. Both laboratory and complete vehicle tests are specified in this document. Required test equipment, facilities, and definitions are included.&lt;/div&gt;
