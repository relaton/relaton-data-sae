  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Vehicle electrical/electronic systems may be affected when immersed in an electromagnetic field generated by sources such as radio and TV broadcast stations, radar and communication sites, mobile transmitters, cellular phones, etc. Reverberation method is used to evaluate the immunity of electronic devices in the frequency range of 500 MHz to 2.0 GHz, with possible extensions to 200 MHz to 10 GHz. At a later date, pulse modulation capability will be added for testing above 1 GHz.&lt;/div&gt;&lt;/div&gt;</p>
