  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice specifies criteria for steps, stairways, ladders, walkways, platforms, handrails, handholds, guardrails and entrance openings which permit access to and from operator, inspection or maintenance platforms on mobile cranes parked in accordance with the manufacturer’s instruction. It also presents requirements for guards and restraints as related to moving parts.&lt;/div&gt;&lt;/div&gt;</p>
