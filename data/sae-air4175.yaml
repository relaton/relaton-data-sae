  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;An effective ground station is vital to the successful implementation of an EMS and is a fundamental part of the total monitoring system design. Unlike on-board processing systems which principally use data to indicate when engine maintenance is required, ground stations offer much greater processing power to analyse and manipulate EMS data more comprehensively for both maintenance and logistics purposes.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document reviews the main EMS functions and discusses the operating requirements which will determine the basic design of a ground station, including the interfaces with other maintenance or logistics systems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;A brief discussion is also included on some of the more recent advances in EMS ground station technology which have been specifically developed to provide more effective diagnostic capabilities for gas turbine engines.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Finally, this document addresses the program management requirements associated with the initial development and on-going support of a ground station.&lt;/div&gt;&lt;/div&gt;</p>
