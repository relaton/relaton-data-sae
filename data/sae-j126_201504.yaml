  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice outlines a procedure for selecting the proper specification for carbon steel sheet and strip which are purchased to make an identified part. Specifications considered are:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ASTM A109—Steel, Carbon, Cold Rolled Strip.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ASTM A569—Steel, Carbon (0.15 maximum percent), Hot Rolled Sheet, Commercial Quality (HRCQ).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ASTM A621—Steel, Sheet, Carbon, Hot Rolled, Drawing Quality (HRDQ).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ASTM A622—Steel, Sheet, Carbon, Hot Rolled, Drawing Quality, Special Killed (HRDQSK).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ASTM A568—Steel, Carbon and High-Strength Low-Alloy Hot Rolled Sheet, and Cold Rolled Sheet, General Requirements.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ASTM A366—Steel, Carbon, Cold Rolled Sheet, Commercial Quality (CRCQ).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ASTM A619—Steel, Sheet, Carbon, Cold Rolled, Drawing Quality (CRDQ).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ASTM A620—Steel, Sheet, Carbon, Cold Rolled, Drawing Quality, Special Killed (CRDQSK).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ASTM A749M—Steel, Carbon and High-Strength Low-Alloy, Hot Rolled Strip, General Requirements.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;ASTM A635—Steel Sheet and Strip, Carbon, Hot Rolled Commercial Quality, Heavy Thickness Coils. (Metric ASTM documents are designated by suffix M)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It also describes how codes or symbols for specifying certain characteristics may be used in electronic data processing systems. Characteristics covered are:
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Hot or cold rolled.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Sheet or strip.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Severity of draw (quality of steel).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Surface condition (finish, etc.).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Edge condition.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;f&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Dimensions.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is intended that other characteristics and part identification be covered by a supplement to the specification, as necessary.&lt;/div&gt;&lt;/div&gt;</p>
