  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice was established to provide an accurate, uniform, and reproducible procedure for simulating use of MD/HD conventional vehicles (CVs) and hybrid-electric vehicles (HEVs), as well as plug-in hybrid-electric vehicles (PHEVs) and battery electric vehicles (BEVs) on powertrain dynamometers for the purpose of measuring emissions and fuel economy. This document does not specify which emissions constituents to measure (e.g., HC, CO, NOx, PM, CO&lt;sub&gt;2&lt;/sub&gt;), as that decision will depend on the objectives of the tester. While the main focus of this procedure is for calculating fuel and energy consumption, it is anticipated that emissions may also be recorded during execution of this procedure.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It should be noted that most MD/HD powertrains addressed in this document would be powered by engines that are certified separately for emissions. The engine certification procedure appears in the Code of Federal Regulations, Title 40 §86 and §1065.&lt;/div&gt;
    &lt;/div&gt;</p>
