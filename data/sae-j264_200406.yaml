  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The function of uniform terminology is to promote understandable and exact communication in the area of vision. A great deal of effort has been expended to make these definitions suit this purpose. It is recognized that this terminology, like other dictionaries, must be revised periodically to reflect current usage and changing needs. The Driver Vision Subcommittee of the Human Factors Engineering Committee, therefore, solicits suggestions for improvements and additions to be considered in future revisions.&lt;/div&gt;&lt;/div&gt;</p>
