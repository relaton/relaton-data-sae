  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides for the following types of seat belt assemblies for use in motor vehicles, in order to minimize the risk of bodily harm in an accident:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Type 1 - Lap Belt for pelvic restraint.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Type 2 - Combination of pelvic and upper torso restraints.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;(&lt;u&gt;Type 2a&lt;/u&gt; - Shoulder belt - An upper torso restraint for use only in conjunction with a lap belt as a Type 2 seat belt assembly.)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Type 3 - Combination pelvic and upper torso restraint for persons weighing 50 lb (23 kg) or less and capable of sitting upright by themselves, that is children in the approximate age range of 8 months-6 years.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
