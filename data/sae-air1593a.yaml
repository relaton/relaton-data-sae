  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) contains information relative to stresses and loads developed in tubes caused by tube deflections encountered in misaligned installations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Users are advised that when calculating the stresses and loads of a tubing system, the yield strength of existing loop clamp material is significantly lower than the tubing materials specified herein and should be considered.&lt;/div&gt;&lt;/div&gt;</p>
