    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers un-shielded balanced single twisted pair data cable intended for use in surface vehicle cables for 100 Mbps Ethernet applications. The tests in this document are intended to qualify cables for normal operation in an automotive environment while maintaining the necessary electrical properties for reliable data transmission.&lt;/div&gt;
