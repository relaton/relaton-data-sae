    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Part Standard covers selected inch dimensioned set screws manufactured in accordance with American Society for Mechanical Engineers dimensional standards. This SAE standard covers material most often used in ship systems and equipment but its use may be applied wherever fasteners of the covered materials are used. This standard permits the fasteners to be identified and ordered by a part or identifying number (PIN) as defined in this document.&lt;/div&gt;

    &lt;/div&gt;</p>
