abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;It is intended to provide capacitance gaging system "specifiers" with the necessary tools to make value judgements concerning the various errors typically encountered in systems of this type. Thus, in addition to merely identifying the error-causes, descriptions are given concerning the basic factors from which these error-causes derive. This knowledge, when complemented with appraisals of the relative costs of minimizing the error-causes, will furnish the system specifier with a powerful tool with which to optimize gaging system accuracy, and thus, to obtain the "best possible" overall system within the constraints imposed by both design and budgetary considerations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Since the subject of capacitance gaging accuracy is quite extensive, and in some instances very complex, no attempt is made herein to present an all-inclusive and fully comprehensive evaluation of the subject. Rather, the &lt;u&gt;major&lt;/u&gt; contributors to gaging system inaccuracy are discussed. Furthermore, emphasis in these discussions is given to simplicity-of-approach and clarity, somewhat at the expense of completeness.&lt;/div&gt;&lt;/div&gt;</p>
