  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This method estimates noise for both single and tandem main rotor helicopters except for approach where it applies to single rotor designs only. It does not apply to coaxial rotor designs. Application is limited to helicopters powered by turbo-shaft engines and does not apply to helicopters powered by reciprocating engine, tip jets or other types of power plants. It provides noise information using basic operating and geometric information available in the open literature. To keep the method simple, it generates A-weighted sound levels, precluding the necessity for spectral details. The method prescribes estimates for typical helicopter operations; certain maneuvers may produce noise levels different from those estimated. Estimates are given for the maximum sound levels at 4 ft (1.2 m) height above the ground. For aircraft in forward flight, the estimate is given for an aircraft at an altitude of 500 ft (152 m) on a path directly over the observer. For an aircraft in hover the estimate is given for an aircraft hovering 10 ft above ground level at a distance of 500 ft (152 m) to the side of the observer.&lt;/div&gt;&lt;/div&gt;</p>
