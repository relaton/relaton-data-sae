  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice establishes a rating scale for subjective evaluation of vehicle handling. The scale is applicable for the evaluation of specific vehicle handling properties in specific maneuvers on the proving grounds and highways. The validity of the evaluation is restricted to the individual handling disciplines defined by these maneuvers and to the particular combination of conditions of the vehicle (e.g., equipment, degree of maintenance) and of the environment (e.g., road, weather).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances.&lt;/div&gt;&lt;/div&gt;</p>
