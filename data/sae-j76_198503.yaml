  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to provide basic recommendations to aid in the development and use of safe and efficient practices for all operations involving the handling and dispensing of brake fluids.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The quality of brake fluid is important for the safe and efficient use of motor vehicles traveling on public highways. The latest SAE Standard which conforms to legal requirements applies to any brake fluid installed in the braking system of any motor vehicle.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is not intended as a documentation of current commercial practices employed in the handling and dispensing of brake fluid, but it is intended as a guide toward recommended practices, based upon technical knowledge, that will require the cooperation and assistance of industry and government to implement effectively.&lt;/div&gt;&lt;/div&gt;</p>
