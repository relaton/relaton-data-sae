  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides guidance on the engine performance parameters that may be selected by airframe and engine manufacturers, and used by a pilot or operator, to monitor the thermodynamic health of a turboshaft engine installed in a rotorcraft and the measurement system accuracies desired. Different accuracies may be required for in-flight operations such as engine control.&lt;/div&gt;&lt;/div&gt;</p>
