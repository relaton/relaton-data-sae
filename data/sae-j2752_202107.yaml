abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This SAE Recommended Practice applies to compact tool carriers
    sometimes called, but not limited to mini-loaders, mini skid-steer loaders or
    compact utility loaders. Machines having a seated-operator position are excluded
    from this standard. However, certain attachments for a compact tool carrier may
    provide a seated-operator position for the operation of the attachment.&lt;/p&gt;</p>"
