  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines various grades of continuously cast high-strength sheet steels and establishes mechanical property ranges. These sheet steels can be formed, welded, assembled and painted in automotive manufacturing processes. They can be specified as hot-rolled or cold-rolled sheet. Furthermore, they can be coated (hot-dipped galvanized, hot-dipped galvannealed, and electrogalvanized) or uncoated. Not all combinations of strength, dimensions and coatings may be commercially available; consult your steel supplier for details.&lt;/div&gt;&lt;/div&gt;</p>
