abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document describes a rigorous engineering test procedure that utilizes industry-accepted data collection and statistical analysis methods to determine the road load and to estimate the aerodynamic drag area of trucks and buses weighing more than 10000 pounds. The test procedure may be conducted on a test track or on a public road under controlled conditions and supported by extensive data collection and data analysis constraints. The estimated aerodynamic-drag-area result represents a single-speed and single-yaw-angle condition. Test results that do not rigorously follow the method described herein shall not be represented as an SAE J2978 result.&lt;/div&gt;

    &lt;/div&gt;</p>
