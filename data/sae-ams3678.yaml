    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers several grades of virgin polytetrafluoroethylene (PTFE) resin which may be compounded with pigment and fillers in the form of extruded or molded rods or tubes which are sintered after molding or, in the case of extrusions, sintered during the extrusion process.&lt;/div&gt;&lt;/div&gt;</p>
