  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard establishes a criteria for a minimum zone of protection for the operator of the machine and establishes certain structural requirements for guards on pneumatic-tired earthmoving haulage machines capable of speeds in excess of 25 km/h. Earthmoving machines covered by this document are dumpers and tractor-scrapers as identified in SAE J/ISO 6165.&lt;/div&gt;&lt;/div&gt;</p>
