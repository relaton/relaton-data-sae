  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the mini-shed testing methodology to measure the rate of refrigerant loss from an automotive air conditioning (A/C) system. This SAE procedure encompasses both front and rear air conditioning systems utilizing refrigerants operating under sub-critical conditions. The SAE procedure will cover multiple refrigerants to emission testing and is utilized for evaluating air condtioning systems. Heat pump systems can also be evaluated; however, they will have different usage and mission profiles.&lt;/div&gt;
    &lt;/div&gt;</p>
