  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This report lists documents that aid and govern the design, development, and utilization of aerospace electronic engine control systems. The report lists the military and industry specifications and standards that are commonly used in electronic engine control system design. However, this list is not necessarily complete.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The specifications and standards section has been divided into two parts; a master list arranged numerically and a categorized list that provides a functional breakdown and cross-reference of these documents.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Current revisions for standards and specifications are not listed. For details of current revisions of many documents, including notices, amendments, and supplements, refer to the Department of Defense Index of Specifications and Standards (DODISS).&lt;/div&gt;
    &lt;/div&gt;</p>
