  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;In efforts to increase the accuracy and reliability of altimetry, speed measurement and other aspects of air data, a great deal of attention and money have been expended on new and refined pressure transducing and computing systems and on the standards by which they are calibrated. So much progress has been made in this that the limiting factor is, or may soon be, the sensing and transmitting in the aircraft of the pressures to be transduced. Until the appearance of References 1-13 and 18 there was little guidance available on the maintenance of pitot and static systems. This report presents what information is available, suggests limits, and lists the principal original papers on the subject.&lt;/div&gt;
    &lt;/div&gt;</p>
