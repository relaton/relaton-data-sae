abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) establishes the requirements for externally swaged tube-fitting assemblies used in aircraft fluid systems in the following pressure classes: B (1500 psi or 10500 kPa), and D (3000 psi or 21000 kPa), and in temperature types I (-65 to 160 °F or -55 to 70 °C), and II (-65 to 275 °F or -55 to 135 °C) of AS2001.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification covers a common Cres, titanium, and aluminum fittings that may be used for a range of operating pressures up to 3000 psi with different tubing materials and tubing wall thicknesses, and is assembled with the same tooling in accordance with AS5902. &lt;span class="xref"&gt;Table 11&lt;/span&gt; shows applicable aerospace fitting part number standard and tubing materials and operating pressures.&lt;/div&gt;
    &lt;/div&gt;</p>
