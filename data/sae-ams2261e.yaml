  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established inch-pound manufacturing tolerances applicable to bars and forging stock of nickel, nickel alloy, and cobalt alloys ordered to inch-pound dimensions. These tolerances apply to all conditions, unless otherwise noted. The term "excl" is used to apply only to the higher figure of a specified range.&lt;/div&gt;

    &lt;/div&gt;</p>
