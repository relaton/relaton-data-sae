  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers hose and hose assemblies intended for conducting liquid and gaseous R134a refrigerant in automotive air conditioning systems. The hose shall be designed to minimize permeation of R134a refrigerant, contamination of the system, and to be functional over a temperature range of -30 to 125 °C (-22 to 257 °F). Specific construction details are to be agreed upon between user and supplier.&lt;/div&gt;&lt;/div&gt;</p>
