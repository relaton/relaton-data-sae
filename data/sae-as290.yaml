    &lt;div class="htmlview paragraph"&gt;The requirements listed in &lt;span class="xref"&gt;Section 4&lt;/span&gt; shall apply to all regularly assigned flight crew members. Due to limitations that it would place upon basic airplane design, it is not considered practical for these requirements to apply fully to the so-called jump seat. However, it should be emphasized that every effort should be made to provide the jump seat position with an equivalent level of comfort and safety.&lt;/div&gt;
