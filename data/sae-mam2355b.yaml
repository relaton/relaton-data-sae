  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers quality assurance sampling and testing procedures used to determine conformance to applicable specification requirements of wrought aluminum alloy and wrought magnesium alloy mill products, except forging stock, including rolled, forged, and flash welded rings specified in metric (SI) units. Definitions of rings, as applicable to this specification, are presented in &lt;span class="xref"&gt;8.3&lt;/span&gt; (Definitions).&lt;/div&gt;
    &lt;/div&gt;</p>
