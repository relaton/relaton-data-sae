    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers procedures which will provide protection of elastomeric seals and seal assemblies such as O-rings, cap seal assemblies, and other designs from contamination by foreign materials and handling / transportation / storage damage prior to installation and ensure positive identification by part number of each piece until it is installed.&lt;/div&gt;&lt;/div&gt;</p>
