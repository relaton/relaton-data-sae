  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Recommended Practice, Operational Definitions of Driving Performance Measures and Statistics, provides functional definitions of and guidance for performance measures and statistics concerned with driving on roadways. As a consequence, measurements and statistics will be calculated and reported in a consistent manner in SAE and ISO standards, journal articles proceedings papers, technical reports, and presentations so that the procedures and results can be more readily compared. Only measures and statistics pertaining to driver/vehicle responses that affect the lateral and longitudinal positioning of a road vehicle are currently provided in this document. Measures and statistics covering other aspects of driving performance may be included in future editions. For eye glance-related measures and statistics, see SAE J2396 (Society of Automotive Engineers, 2007) and ISO 15007-1 (International Standards Organization, 2002).&lt;/div&gt;


    &lt;/div&gt;</p>
