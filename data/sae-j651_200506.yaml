abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To provide a means of obtaining the efficiency characteristics of automatic transmissions and automatic transaxles. It outlines dynamometer tests that map the steady-state characteristics over a range of operations of an automatic transmission/automatic transaxle and provides a method of presenting test data. This procedure must be followed, with similar test facilities so that results obtained from different laboratories are comparable.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;For this SAE Recommended Practice, the transmission is defined as the complete automatic transmission or transaxle assembly between the engine and the driveshaft(s) used to effect a ratio change in transmitting power. For 4WD/AWD, it does not include transfer case or power take off subsystems.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This test procedure deals with the aspect of conducting complete transmission and transaxle assembly testing. However, by its very nature a transmission should be viewed as a compilation of three major component systems: pump, torque converter, and gearbox (all ratio change elements).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;From a design perspective, it is important that the losses associated with each of these components be determined by conducting separate tests of each component under controlled test conditions that simulate the in-transmission operating conditions. Torque converter testing is described in SAE J643, and pump testing is described in SAE J2311. If done with strict attention to detail it is possible to subtract off the pump and torque converter losses from the transmission assembly losses in order to obtain gearbox losses only, eliminating the need to conduct a separate gearbox test.&lt;/div&gt;
    &lt;/div&gt;</p>
