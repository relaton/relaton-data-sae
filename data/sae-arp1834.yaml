  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;ARP 1834 provides general guidance for the selection, approach to, and performance of various kinds of F/FA of digital systems and equipment. Its prime objective is to present several industry-acceptable, cost-effective methods for identifying, analyzing, and documenting digital-equipment failure modes and their effects. The analysis techniques and considerations presented here are directed to digital-equipment hardware faults and failures exclusively.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;ARP 1834 is not intended as an exhaustive treatment of the enormously complex process involved in the analytical failure evaluation of complete digital systems, nor as a universally applicable, definitive listing of the necessary and sufficient steps and actions for such evaluation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;ARP 1834 addresses the following areas of consideration in the preparation and performance of F/FA's for digital equipment:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;u&gt;Possible Analysis Approaches:&lt;/u&gt; Top-Down and/or Bottom-Up (&lt;span class="xref"&gt;Sect 2&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;u&gt;Fault/Failure Modes,&lt;/u&gt; as they affect equipment operation and performance (&lt;span class="xref"&gt;Sect 3&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;u&gt;Fault Monitoring Methodology:&lt;/u&gt; Reasons for, types of, and effectiveness (&lt;span class="xref"&gt;Sect 4&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;u&gt;Analysis Methods:&lt;/u&gt; Preparation for, types of, effectiveness and coverage (&lt;span class="xref"&gt;Sect 5&lt;/span&gt;)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
