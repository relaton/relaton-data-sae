  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides an industry standard for Long Term Storage (LTS) of electronic devices by drawing from the best long term storage practices currently known. LTS is defined as any device storage for more than 12 months but typically allows for much longer (years). While intended to address the storage of unpackaged semiconductors and packaged electronic devices, nothing in this standard precludes the storage of other items under the storage levels defined herein. This standard is not intended to address built-in failure mechanisms (e.g., tin whiskers, plating diffusion, and intermetallics) that would take place regardless of storage conditions&lt;/div&gt;&lt;/div&gt;</p>
