    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification establishes engineering requirements for the uphill quenching process. Uphill quenching immerses product in liquid nitrogen followed by exposure to a high pressure/velocity steam blast or boiling water.&lt;/div&gt;

    &lt;/div&gt;</p>
