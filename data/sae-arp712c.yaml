    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) provides minimum standards and environmental design requirement recommendations for lighting and control in galley areas. It also addresses electrical shock hazard in galley areas. The use of “shall” in this document expresses provisions that are binding. Non-mandatory provisions use the term “should.”&lt;/div&gt;
