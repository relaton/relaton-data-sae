  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers heavy braid hose assemblies intended for use in high-temperature, 400°F (204°C), high-pressure, 3000 psi (210 bar) aircraft hydraulic systems, also for use in pneumatic systems which allow some gaseous diffusion through the PTFE wall. The -20 size operating temperature is limited to 275°F (57°C) maximum.&lt;/div&gt;&lt;/div&gt;</p>
