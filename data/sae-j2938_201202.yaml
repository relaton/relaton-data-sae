    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides test procedures, requirements, and guidelines for the methods of the measurement of lumen maintenance of LED devices (packages, arrays and modules). This document does not provide guidance or make any recommendation regarding predictive estimations or extrapolation for lumen maintenance beyond the limits of the lumen maintenance determined from actual measurements.&lt;/div&gt;&lt;/div&gt;</p>
