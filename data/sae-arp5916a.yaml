  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The tow vehicle should be designed for towbarless push-back and/or maintenance towing of regional type aircraft as specified in &lt;span class="xref"&gt;1.3&lt;/span&gt;.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The design will ensure that the unit will safely secure the aircraft nose landing gear within the coupling system for any operational mode.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of this towing procedure is to achieve a safer and faster operation than is possible with conventional towing equipment.&lt;/div&gt;


    &lt;/div&gt;</p>
