  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice establishes signal words, color combinations, letter sizes, and durability requirements for permanently and temporarily affixed safety signs for off-road, self-propelled work machine categories of construction, general purpose industrial, forestry, and specialized mining machinery as defined in SAE J1116 (May, 1979). This recommended practice is suitable for application to tools, machines, and machinery used in the specified categories.&lt;/div&gt;&lt;/div&gt;</p>
