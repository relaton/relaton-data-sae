abstract:
- language: en
  script: Latn
  content: "<p>&lt;div class=\"section abstract\"&gt;\n            \n            \n
    \           &lt;div class=\"htmlview paragraph\"&gt;This specification establishes
    the requirements and test procedures for automotive\n                miniature
    bulb retention devices, including wedge base sockets with integral\n                connector,
    direct wire wedge base sockets, circuit plate assemblies, and associated\n                interfaces.&lt;/div&gt;\n
    \           &lt;div class=\"htmlview paragraph\"&gt;Tests shall follow the sequence
    shown in the flow charts in &lt;span class=\"xref\"&gt;Appendix E&lt;/span&gt;
    whenever the following occurs:&lt;/div&gt;\n            &lt;ul class=\"list disc\"&gt;\n
    \               &lt;li class=\"list-item\"&gt;\n                    &lt;div class=\"htmlview
    paragraph\"&gt;New design&lt;/div&gt;\n                &lt;/li&gt;\n                &lt;li
    class=\"list-item\"&gt;\n                    &lt;div class=\"htmlview paragraph\"&gt;Design,
    material or process change made to an existing device, which could\n                        affect
    the outcome of the test.&lt;/div&gt;\n                &lt;/li&gt;\n            &lt;/ul&gt;\n
    \           &lt;div class=\"htmlview paragraph\"&gt;The test sequence shown in
    &lt;span class=\"xref\"&gt;Appendix F&lt;/span&gt; shall be\n                run
    annually.&lt;/div&gt;\n            &lt;div class=\"htmlview paragraph\"&gt;\n
    \               &lt;i&gt;(NOTE: Production process control data collected at a
    shorter interval per\n                    an approved control plan, may be substituted
    if approved by customer’s\n                    responsible engineer and purchasing
    representative.)&lt;/i&gt;\n            &lt;/div&gt;\n        &lt;/div&gt;</p>"
