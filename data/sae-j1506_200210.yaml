abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Information Report describes various dynamometer driving schedules currently in use in the world for measurement of exhaust emissions and fuel economy of passenger cars and light trucks.  Issuance of this document will allow driving schedules to be deleted from individual test procedures, thus reducing the amount of repeated information in the SAE Handbook.

    This document includes: a.) Descriptions of driving schedules and b.) Second-by-second definition of speed versus time sequences.</p>
