  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document establishes a minimum performance criteria for conventional towing systems for the towing interface between a tow vehicle and trailer up to 9072 kg (20000 pounds) Gross Trailer Weight Rating. This does not include weight distributing hitches. This creates the minimum performance criteria for the hitch, trailer attachment structure, coupling, and tow vehicle attachment structure. This standard may be used as a regulatory guide in the selection of products covered. This document is intended to be used voluntarily by the industry producing these products.&lt;/div&gt;&lt;/div&gt;</p>
