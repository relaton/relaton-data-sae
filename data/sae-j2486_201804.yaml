    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers installation and inspection methods for fasteners which are tensioned using Tension Indicating Washers (TIWs) as a means to ensure that adequate tension is developed in mechanically fastened joints. &lt;span class="xref"&gt;Figure 1&lt;/span&gt; depicts a typical TIW, and &lt;span class="xref"&gt;Figure 2&lt;/span&gt; depicts a fastener assembly with a TIW before and after tensioning.&lt;/div&gt;

    &lt;/div&gt;</p>
