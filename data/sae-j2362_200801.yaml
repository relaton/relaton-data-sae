abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard describes lubricating oils meeting the physical,
    chemical, and performance requirements of the American Petroluem Institute (API)
    SM category and the International Lubricant Standardization and Approval Committee
    (ILSAC) GF-4 standard. These oils are suitable for the lubrication of spark-ignition
    engines (gasoline engines).  This document supersedes the military's Commercial
    Item Description (CID) A-A-52039.</p>"
