    &lt;div class="htmlview paragraph"&gt;This eLoran transmitted signal standard provides technical descriptions of the data channel using ninth pulse modulation techniques. The eLoran transmitted signal standard, to which this data channel technique applies, is part of the SAE9990 family of standards covering data channels, receiver specifications, and recommended practices for eLoran.&lt;/div&gt;&lt;/div&gt;</p>
