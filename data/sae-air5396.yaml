  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides various graphical displays of atmospheric variables related to aircraft icing conditions in natural clouds. It is intended as a review of recent developments on the subject, and for stimulating thought on novel ways to arrange and use the available data. Included in this Report is FAR 25 (JAR 25) Appendix C, the established Aircraft Icing Atmospheric Characterization used for engineering design, development, testing and certification of civilian aircraft to fly in aircraft icing conditions.&lt;/div&gt;

    &lt;/div&gt;</p>
