abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice establishes a uniform procedure for testing the brake systems (service and parking) of all passenger cars, light-duty trucks, and multipurpose passenger vehicles up to and  including 4500 kg (10 000 lb) GVWR.    The purpose of the test code is to evaluate brake system performance of vehicles in service for compliance with regulations.    The test code is expected to be utilized as a basis for a brake evaluation conducted by State or Federal officials engaged in highway safety programs.    The primary consideration is that this test requires a minimum of instrumentation, time, driver skill, and cost to conduct.</p>"
