    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice, limited to liquid coolant systems, establishes uniform cold weather bus vehicle heating system test procedures for all vehicles designed to transport 10 or more passengers. Required test equipment, facilities, and definitions are included. Defrosting and defogging procedures and requirements are established by SAE J381 which is hereby included by reference.&lt;/div&gt;
