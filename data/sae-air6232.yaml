  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides descriptions of test methods for determining if an aircraft surface coating of any thickness has adverse effects on aircraft deicing/anti-icing fluids with respect to fluid holdover time performance and aerodynamic performance.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Although not the primary mandate of the G-12 Aircraft Ground Deicing Committee, this document also provides descriptions of suggested test methods for evaluating aircraft surface coatings with respect to durability, hardness, weathering, aerodynamic drag, ice adhesion, ice accumulation, contact angle, and thermal conductivity. These additional tests can provide informational data for characterizing the coatings and may be useful to operators when evaluating the coatings.&lt;/div&gt;
    &lt;/div&gt;</p>
