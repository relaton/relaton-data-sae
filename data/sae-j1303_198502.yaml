  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;For cutting edges used on buckets for loaders defined in SAE J1057a. The dimensions are applicable to rolled, cast, forged, flame cut, and machined cutting edge sections. Straight cutting edges are defined as those whose leading edge and rear edge are parallel and, thus, are of constant cross section. For "straight cutting edge sections with bolt holes," see SAE J1304 FEB85.&lt;/div&gt;

    &lt;/div&gt;</p>
