  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes a test method for determination of heavy truck (Class VI, VII, and VIII) tire force and moment properties under cornering conditions. The properties are acquired as functions of normal force and slip angle using a sequence specified in this practice. At each normal force increment, the slip angle is continually ramped or stepped. The data are suitable for use in vehicle dynamics modeling, comparative evaluations for research and development purposes, and manufacturing quality control.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended to be a general guideline for testing on an ideal machine. Users of this SAE Recommended Practice may modify the recommended protocols to satify the needs of specific use-cases, e.g., reducing the recommended number of test loads and/or pressures for benchmarking purposes. However, due care is necessary when modifying the protocols to maintain data integrity.&lt;/div&gt;


    &lt;/div&gt;</p>
