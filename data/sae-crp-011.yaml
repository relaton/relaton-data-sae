abstract:
- language: en
  script: Latn
  content: "<p>This research report establishes a standardized testing procedure for
    producing free-rolling tire force and moment data for use in vehicle dynamics
    simulations employed in  the design and development of heavy duty trucks. Tire
    properties evaluated include: friction during straight  ahead and cornering; lateral
    force and aligning torque in  cornering; lateral/longitudinal force interactions
    during  braking; and braking stiffness.</p>"
