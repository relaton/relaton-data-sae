    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides minimum performance requirements and accompanying uniform laboratory test procedures for evaluating certain essential characteristics of new tires and newly retreaded tires intended primarily for highway use on trucks, buses, trailers, and multi-purpose passenger vehicles.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;(The requirements published in this SAE Recommended Practice pertain to tire sizes currently used on American trucks, buses, trailers, and multi-purpose passenger vehicles. For related information on tire sizes not listed, contact Society of Automotive Engineers, Inc., Detroit Branch Office, 18121 East Eight Mile Road, East Detroit, Michigan 48021.)&lt;/div&gt;&lt;/div&gt;</p>
