    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice has been established to provide direction for the design and installation of an identification number as assigned to passenger car and truck engines and transmissions. In adhering to these recommended practices, facility of application in factory production and appearance are matters for manufacturer control. Reference SAE J853.&lt;/div&gt;&lt;/div&gt;</p>
