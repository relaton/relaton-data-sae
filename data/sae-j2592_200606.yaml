  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE information report provides a means to understand the various methods of evaluating the integrity of steel tubing without the need of destroying the tubing. This report describes eddy current testing, flux leakage testing, ultrasonic testing, and magnetic particle testing of steel tubing. The primary purpose of these methods of testing steel tubing is to look for flaws in the tubing, such as discontinuities, seams, cracks, holes, voids and other imperfections characteristic to the specific construction of the tubing.&lt;/div&gt;
    &lt;/div&gt;</p>
