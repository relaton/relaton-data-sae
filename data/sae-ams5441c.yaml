  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion- and heat-resistant nickel alloy in the form of bars, forgings, and flash welded rings in the solution heat-treated condition, 5 inches (127 mm) and under in nominal diameter or least distance between parallel sides (thickness) having a maximum cross-sectional area of 50 square inches (323 cm&lt;sup&gt;2&lt;/sup&gt;), and stock of any size for forging, flash welded rings, or heading.&lt;/div&gt;&lt;/div&gt;</p>
