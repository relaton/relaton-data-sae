    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard provides the auxiliary requirements for automotive or RV, additional 12 position, sealed Trailer Tow Connector Plug and Receptacle. The information included within this specification is intended to cover the test methods, design, and performance requirements of optional features for additional power, clean ground for electronic functions, video, data communication, and supplementary electric brake control.&lt;/div&gt;&lt;/div&gt;</p>
