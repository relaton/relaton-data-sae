    &lt;div class="htmlview paragraph"&gt;The test procedures and performance criteria are directed to operation and parking of agricultural tractors equipped with braking system(s) and having a maximum design speed exceeding 6 km/h. Combinations of agricultural towing machines equipped with braking systems and towed agricultural machines without braking systems are included in this SAE Standard.&lt;/div&gt;
