  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document applies to the development of Plans for integrating and managing electronic materials and processes for equipment in the military and commercial aerospace markets; as well as other ADHP markets that wish to use this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Examples of electronic materials and processes, as described in this document, include soldering alloys, plating finishes, bulk metals, chassis materials and finishes, materials used for mechanical parts, etc.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is critical for the Plan owner to review and understand the properties and configuration control of all “as-received” or “off-the-shelf” electronic materials with respect to the application capabilities in order to identify risks, and where necessary, take additional action to mitigate the risks.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The technical requirements are in &lt;span class="xref"&gt;Section 3&lt;/span&gt; of this standard, and the administrative requirements are in &lt;span class="xref"&gt;Section 4&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
