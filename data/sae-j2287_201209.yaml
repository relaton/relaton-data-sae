  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines minimum performance standards, qualification requirements, and minimum documentation requirements for Integrated Lap and Shoulder Restraint (to) equipped Seats (IL&amp;amp;SRTS). The goal is to achieve comfort, durability, and occupant protection under expected and foreseeable normal operation loads. The document attempts to define test and evaluation criteria to demonstrate performance at peak operational loads, while attempting to maintain the seat’s ability to meet loads set forth in FMVSS 207, 210, and ECE 14, 16, and 17.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document also provides guidance for design by enumerating certain design goals to enhance comfort, serviceability, and safety. Guidance for test procedures, measurements, equipment, and interpretation of results may be presented to promote uniform techniques and to achieve acceptable data.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While this document addresses system performance, responsibility for the seating systems is divided between the seat supplier and the vehicle OEM. The seat suppliers’ responsibility consists of meeting all the established system performance requirements and obtaining and supplying to the vehicle OEM all the data prescribed by this document. The vehicle OEM has the ultimate system responsibility in assuring that all requirements for safe seat applications have been met.&lt;/div&gt;
    &lt;/div&gt;</p>
