    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this specification is to allow procurement of defined carbon fiber and fiberglass epoxy prepreg materials corresponding to their statistically derived material properties published in CMH-17 (formerly MIL-HDBK-17). As a result, no qualification or equivalency threshold values are provided. Users that intend to conduct a new material qualification or equivalency program shall notify the Qualifying Agency per &lt;span class="xref"&gt;4.2.1&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
