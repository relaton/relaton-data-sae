  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice describes the method for safe deployment of air bag modules in vehicles equipped with electrically actuated air bag systems for the purpose of disposal. It is intended to provide a procedure which does not require significant technical expertise, is easy to operate, and is readily available, to be used by automobile dismantlers or vehicle shredders to deploy air bag modules prior to automobile reclamation.&lt;/div&gt;
    &lt;/div&gt;</p>
