  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides test methods and requirements to evaluate the suitability of plastic materials intended for optical applications in motor vehicles. The tests are intended to determine physical and optical characteristics of the material only. Performance expectations of finished assemblies, including plastic components, are to be based on tests for lighting devices, as specified in SAE Standards and Recommended Practices for motor vehicle lighting equipment. Field experience has shown that plastic materials meeting the requirements of this document and molded in accordance with good molding practices will produce durable lighting devices.&lt;/div&gt;&lt;/div&gt;</p>
