  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers normalized electric-resistance welded flash-controlled single-wall, low-carbon steel pressure tubing intended for use as pressure lines and in other applications requiring tubing of a quality suitable for bending, double flaring, beading, forming, and brazing. Material produced to this specification is not intended to be used for single flare applications, due to the potential leak path caused by the Inside Diameter (ID) weld bead or scarfed region. Assumption of risks when using this material for single flare applications shall be defined by agreement between the producer and purchaser.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification also covers SAE J356 Type-A tubing. The mechanical properties and performance requirements of SAE J356 and SAE J356 Type-A are the same. The SAE J356 or SAE J356 Type-A designation define unique manufacturing differences between coiled and straight material. Nominal reference working pressures for this tubing are listed in ISO 10763 for metric tubing, and SAE J1065 for inch tubing. SAE J356 is produced in straight lengths that undergo a secondary heat treat operation. SAE J356 Type-A tubing is heat treated in-line to relieve stresses, and is produced in coil form.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In an effort to standardize within a global marketplace and ensure that companies can remain competitive in an international market, it is the intent to convert to metric tube sizes, which will:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Lead to one global system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Guide users to preferred system&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Reduce complexity&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Eliminate inventory duplications&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
