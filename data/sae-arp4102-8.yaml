    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends criteria for the design and installation of Head-Up Display (HUD) systems. The recommendations are applicable to HUD systems which display flight information focused at infinity in the forward field of view. This annex does not address devices for peripheral vision or displays worn by the pilot (goggles, helmet sights).&lt;/div&gt;&lt;/div&gt;</p>
