  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This aerospace specification defines the requirements for metric weld fittings and machine weldments using an orbiting welding head suitable for use on cold worked 3A1-2.5V titanium and 21Cr-6Ni-9Mn CRES tubing and associated fittings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification is equivalent to AS1576 except for metric dimensions and standards.&lt;/div&gt;&lt;/div&gt;</p>
