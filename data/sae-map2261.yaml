  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Metric Aerospace Recommended Practice (MAP) establishes the requirements for preparing a specification for fluid couplings for spacecraft servicing. The objective of this document is to provide design, development, verification, storage, and delivery requirement guidelines for the preparation of specifications for fluid couplings and the ancillary hardware for use with serviceable spacecraft designed for use in the space environment. The couplings shall be capable of resupplying storable propellants, cryogenic liquids, and gases to a variety of spacecrafts.&lt;/div&gt;

    &lt;/div&gt;</p>
