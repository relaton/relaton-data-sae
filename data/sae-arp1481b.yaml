  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Corrosion control is always of concern to the designer of electronic enclosures. The use of EMI gaskets to provide shielding often creates requirements that are in conflict with ideal corrosion control. This SAE Aerospace Recommended Practice (ARP) presents a compatibility table (see &lt;span class="xref"&gt;Figure 1&lt;/span&gt;) which has as its objective a listing of metallic couples that are compatible from a corrosion aspect and which still maintain a low contact impedance.&lt;/div&gt;&lt;/div&gt;</p>
