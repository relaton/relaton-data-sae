abstract:
- language: en
  script: Latn
  content: "<p>This specification establishes the engineering requirements for producing thin coatings of polytetrafluoroethylene (PTFE) resin on parts and the properties of such coatings.  Primarily to provide dry lubrication, high heat stability, and corrosion protection on parts which operate at not higher than 275 degrees C (527 degrees F) for limited periods or not higher than 245 degrees C (473 degrees C) for extended periods.  This coating may also be used as a release film for molds.</p>"
