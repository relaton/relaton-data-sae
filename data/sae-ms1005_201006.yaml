    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;ISO 7745 shall be used for providing detailing, operational characteristics, advantages, disadvantages, and factors affecting the choice to be made among fire-resistant fluids.&lt;/div&gt;

    &lt;div class="htmlview paragraph"&gt;HFAE, HFC, HFDR, HFDU and HETG oils are covered in this specification. HFAS, HFB and HFDS fluids are not addressed.&lt;/div&gt;&lt;/div&gt;</p>
