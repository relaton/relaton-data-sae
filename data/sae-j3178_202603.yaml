abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report introduces key concepts and properties of adhesives, sealants, and heat transfer materials (HTMs) and the roles they serve in present-day battery systems applications. The basic chemistry and properties of the three types of materials are summarized along with important health and environmental information. Relevant material dispense methodologies and equipment for material dispensing is reviewed. A series of representative battery applications examples employing adhesives, sealants, and HTMs is also provided with particular attention given to end-use performance.&lt;/div&gt;&lt;/div&gt;</p>
