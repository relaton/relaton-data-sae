abstract:
- language: en
  script: Latn
  content: "<p>This Aerospace Recommended Practice (ARP) describes techniques recommended
    for use in producing electron beam welded joints in materials commonly employed
    in the aerospace industry. The guidelines described herein are oriented toward
    the use of welding equipment capable of maintaining the workpiece at pressure
    levels of 1 x 10(sup)-4 Torr (133 x 10(sup)-4 Pa) or lower during welding.</p>"
