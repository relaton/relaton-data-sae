    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is intended to cover any type of portable electronic device, powered by a rechargeable lithium battery that has application in operating the aircraft. This includes devices such as laptop computers, electronic tablets, and electronic book-reading devices, used as Electronic Flight Bags (EFBs), and similar applications.&lt;/div&gt;
