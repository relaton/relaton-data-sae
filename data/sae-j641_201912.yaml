  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Since the torque converter and fluid coupling are commonly used components of automatic transmissions in industry, the SAE appointed a committee to standardize terminology, test procedure, data recording, design symbols, and so forth, in this field. The following committee recommendations will facilitate a clear understanding for engineering discussions, comparisons, and the preparation of technical papers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommended usages represent the predominant practice or the acceptable practice. Where agreement is not complete, alternates have been included for clarification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;EXAMPLE: Two systems of blade angle designations are described. Consequently, when a blade angle is specified, the system should be designated.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice deals only with the physical parts and dimensions and does not attempt to standardize the design considerations, such as the actual fluid flow angle resulting from the physical blade shape.&lt;/div&gt;&lt;/div&gt;</p>
