abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;This SAE Aerospace Recommended Practice (ARP) establishes standard phraseology for the communication procedures during aircraft ground deicing/anti-icing operations.NOTE: The minimum requirements to accomplish an aircraft deicing/anti-icing operation are specified in AS6285.Clear concise standard phraseology between the groundcrew and flightcrew is an important part of the deicing/anti-icing process. It plays a key role in the overall safety of the deicing program. Historically, flightcrew and groundcrew have had to deal with differing communication scripts at multiple airport locations. This has led to unsafe situations, including aircraft moving before the deicing process has been fully completed.&lt;/p&gt;</p>"
