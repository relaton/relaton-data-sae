abstract:
- language: en
  script: Latn
  content: |-
    <p>This SAE Standard specifies uniform methods for the testing and performance evaluation of threaded metallic tube connections and stud ends of ports for hydraulic fluid power.

    Tests outlined within this document are independent of each other and document the method to follow for each test; see the appropriate component SAE or ISO standard for the test(s) requirements and the performance criteria.

    Appendix A of SAE J1644 is normative; Appendix B is informative.</p>
