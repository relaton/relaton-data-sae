abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice describes a procedure for measuring gaseous
    hydrogen emissions from the aqueous battery system of a  battery-powered passenger
    car or light truck. The purpose of this procedure is to determine what concentrations
    of hydrogen gas an electric vehicle together with its charger will generate while
    being charged in a residential garage. Gaseous emissions are measured during a
    sequence of vehicle tests and laboratory tests that simulate normal and abnormal
    conditions during operational use. The results of this test may be used to determine
    whether or not forced air ventilation is required when a  particular electric
    vehicle and its associated battery and charging system are used in a residential
    garage.</p>"
