    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines the performance criteria and validation for tire circumferential movement on the rim, in the laboratory, by a static test, as well as a performance assessment in service. This document is applicable to braked wheel positions using both bias ply and radial aircraft tires.&lt;/div&gt;&lt;/div&gt;</p>
