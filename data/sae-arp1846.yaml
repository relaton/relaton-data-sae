  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Recommendations presented in this document are intended primarily for the acquisition of far-field acoustical data. The test engine is to be appropriately configured and operated so that the acoustical signals generated are consistent with the specific objectives of the test. The principal output of the data reduction system is one-third octave band sound pressure levels. However, broader or narrower bandwidth analysis of the recorded data may also be accomplished when appropriate.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Although not specifically intended to apply to special purpose engine noise testing (for example, tests involving unique instrumentation or procedures to identify specific noise sources), some of the practices described herein may be appropriate for such testing.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Specification of reference conditions is outside the scope of this document although procedures to adjust data to a reference condition are described in &lt;span class="xref"&gt;7.2.4&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
