  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The Physics-of-Failure (PoF) is a science-based approach to reliability that uses modeling and simulation to design-in reliability. This approach models the root causes of failures such as fatigue, fracture, wear, and corrosion. Computer-Aided Design (CAD) tools have been developed to address various loads, stresses, failure mechanisms and sites. PoF uses knowledge of basic failure processes to prevent failures through robust design and manufacturing practices, and aims to:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Design-in reliability up front;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Eliminate failures prior to testing;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Increase fielded reliability;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Promote rapid, cost effective deployment of Health and Usage Monitoring Systems (HUMS);&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Improve diagnostic and prognostic techniques and processes; and,&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Decrease operational and support costs.&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;This guide provides a high level overview of the methodology, process and advantages to performing a PoF assessment.&lt;/div&gt;&lt;/div&gt;</p>
