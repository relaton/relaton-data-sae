  content: |-
    <p>This standard applies to General Purpose Industrial Machines, as described in SAE J1116, which are equipped with Rollover Protective Structures (ROPS).

    This SAE Standard establishes performance criteria for Falling Object Protective Structures (FOPS) intended to provide operators of general purpose industrial machines with overhead protection from objects such as bricks, concrete blocks, and small hand tools that may fall from heights of not more than 9 m (30 ft) above the ground, encountered in operations such as highway maintenance, landscaping, and other services on construction sites where the falling object develops an energy not to exceed 1360 J (1000 ft-lbf).</p>
