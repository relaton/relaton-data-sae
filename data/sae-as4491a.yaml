  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers empty cartridges, plungers, cartridge assemblies, and nozzles which are used to package, store, and dispense single or multiple component sealants, adhesives, and other similar materials. This document defines the size, shape, composition, and function of the plastic molded cartridges, plungers, and cartridge assemblies. This document is not intended as a detailed manufacturing document.&lt;/div&gt;
    &lt;/div&gt;</p>
