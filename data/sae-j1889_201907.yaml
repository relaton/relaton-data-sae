  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to functions of motor vehicle signaling and marking lighting devices which use light emitting diodes (LEDs) as light sources. This report provides test methods, requirements, and guidelines applicable to the special characteristics of LED lighting devices. This Recommended Practice is in addition to those required for devices designed with incandescent light sources. This report is intended to be a guide to standard practice and is subject to change to reflect additional experience and technical advances.&lt;/div&gt;&lt;/div&gt;</p>
