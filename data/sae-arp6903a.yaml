  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this ARP is to provide guidance to assist users in choosing compatible component finishes/platings to achieve the best corrosion resistance performance for compatible components/couples. This SAE Recommended Practice is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances. A galvanic compatibility table is provided to assist with the compatible plating/finish selection. Specific plating performance parameters for each individual plating and each connector/accessory specification have also been provided to assist the product user with compatible plating/finish selection.&lt;/div&gt;
    &lt;/div&gt;</p>
