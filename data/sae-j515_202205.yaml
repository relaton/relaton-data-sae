    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J515 covers the specification for hydraulic O-ring material and properties and sizes applicable to face seal fittings, metric and inch stud ends, and four-bolt flange fittings. The standard includes a size code to allow industry and government agencies to order O-rings with a coded part number.&lt;/div&gt;&lt;/div&gt;</p>
