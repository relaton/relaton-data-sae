  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the engineering requirements for producing a continuous thin epsilon-iron-carbonitride compound layer on parts by means of a gaseous, low temperature carbon enriched nitriding process. The process is intended to utilize an atmosphere of high nitriding potential that produces a compound layer. If the compound layer is intended to be controlled automatically, AMS2759/12 shall be used.&lt;/div&gt;&lt;/div&gt;</p>
