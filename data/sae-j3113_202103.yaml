    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J3113 provides principles and a process for developing icons for use in electronic displays related to off-road work machines as stated defined in SAE J1116. Following the process ensures that icons are derived from ISO-registered graphical symbols or ISO-compliant non-registered graphical symbols.&lt;/div&gt;
