    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification is written to cover heating and ventilating equipment under four main classifications, namely;&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;A&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;HEATING AND VENTILATING EQUIPMENT - GENERAL - Dealing with features applicable to all makes and uses.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;B&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;HEATING AND VENTILATING EQUIPMENT - MILITARY - Dealing with features applicable only to military aircraft.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;C&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;HEATING AND VENTILATING EQUIPMENT - COMMERCIAL - Dealing with features applicable only to commercial aircraft.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;D&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;DESIRABLE DESIGN FEATURES - General information for use of those concerned in meeting requirements contained herein.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
