  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the measurement of radio frequency radiated emissions and immunity. Each part details the requirements for a specific type of electromagnetic compatibility (EMC) test and the applicable frequency range of the test method.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The methods are applicable to a vehicle or device powered by an internal combustion engine or electric motor. Operation of all engines (main and auxiliary) of a vehicle or device is included. All equipment normally operating when the engine is running is included. Operator controlled equipment is included or excluded as specified in the individual document parts.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The recommended levels apply only to complete vehicles in their final manufactured form. Vehicle-mounted rectifiers used for charging in electric vehicles are included in Part 2 of this document when operated in their charging mode. Additional charger requirements are under development in SAE J551-5.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Emissions from intentional radiators are not controlled by this document. (See applicable, appropriate regulatory documents.) The immunity of commercial mains powered equipment to overvoltages and line transients is not covered by this document. (See applicable UL or other appropriate agency documents.)&lt;/div&gt;&lt;/div&gt;</p>
