  script: Latn
  content: "<p>&lt;p&gt;This SAE Standard specifies: a test method for assessing the lubricating property of diesel fuels including those which may contain a lubricity enhancing additive, and the performance criteria necessary to ensure reliable operation of diesel fuel injection equipment with respect to fuel lubrication of such equipment. &lt;/p&gt;\n    \n\n&lt;p&gt;It applies to fuel used in diesel engines.&lt;/p&gt;</p>"
