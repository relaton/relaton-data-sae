abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice defines, illustrates, and specifies allowable
    limits for the various types of surface discontinuities that may occur during
    the manufacture and processing of metric-series nuts, in sizes 6.3 to 25 mm and
    inch-series nuts in sizes 1/4 to 1 in, inclusive, which are primarily intended
    for use in automotive assemblies.</p>"
