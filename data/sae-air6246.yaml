  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) will review new landing gear (engine off) taxi system technologies currently being developed by various companies and describe the basic design concepts and potential benefits and issues. This AIR will identify the associated systems that could be affected by this new technology. The document will review basic design and operational requirements, failure modes and identify system certification requirements that may need to be addressed. The technology is evolving as this paper is being written and the data present is currently up to date as of 2015.&lt;/div&gt;&lt;/div&gt;</p>
