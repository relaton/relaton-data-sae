    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers established manufacturing tolerances applicable to seamless and welded tubing of corrosion and heat resistant steel ordered to metric dimensions. These tolerances apply to all conditions and are based on individual measurements, unless otherwise noted. The term "excl" is used to apply only to the higher figure of a specified range.&lt;/div&gt;


    &lt;/div&gt;</p>
