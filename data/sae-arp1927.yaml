    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice describes the materials, related equipment, and particular processing techniques utilized in process science curing of composite hardware where pressure is imparted specifically to the resin of curing composites. Included as &lt;span class="xref"&gt;Appendix "A"&lt;/span&gt; to this ARP is a discussion of the particular techniques developed for a processing science philosophy which has consistently produced void and porosity-free, large area, thick composite structures.&lt;/div&gt;&lt;/div&gt;</p>
