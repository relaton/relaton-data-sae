    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes lubricating oils meeting the API performance categories CF, CF-2, and CG-4, and the SAE J300. These oils are suitable for the lubrication of wheeled vehicles with compression-ignition (diesel) engines. This document is equivalent to the military’s Commercial Item Description A-A-52306 when all requirements are met.&lt;/div&gt;&lt;/div&gt;</p>
