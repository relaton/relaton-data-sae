  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard covers the basic cigar lighter receptacle, which may optionally incorporate overload protective devices.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;&lt;span class="xref"&gt;Figure 1&lt;/span&gt; and &lt;span class="xref"&gt;Table 1&lt;/span&gt; show the cigar lighter receptacle and its pertinent dimensions.&lt;/div&gt;


    &lt;div class="htmlview paragraph"&gt;Lighter plugs shall be permanently marked either "6 volt" or "12 volt".&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Manufacturers of accessory plugs to energize devices such as trouble lamps and razors are cautioned to conform to the provisions given in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Live contact of any accessory plug shall be made with the center stud; the contacting member must not be less than 3.56 mm in diameter and have a minimum spherical radius of 2.54 mm at the contacting end.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;To prevent damage, the body of an accessory plug back of the contact end should be large enough to serve as a centering guide when it is inserted into the receptacle. The contact end of any accessory plug should have sufficient taper so as not to interfere with the receptacle bimetal fingers. Any ground contact fingers should be so designed as not to interfere with, distort, or catch on the grounding lances in the receptacle when the plug is rotated.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Wiring capacity and overload protection, as provided by the automotive industry to the 12 V lighter receptacle, restricts accessory plug devices to a maximum current draw of 8.0 A.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Accessory plugs shall be permanently marked "6 volt" or "12 volt" in letters 4.7 mm high minimum.&lt;/div&gt;&lt;/div&gt;</p>
