abstract:
- language: en
  script: Latn
  content: "<p>This specification covers established manufacturing tolerances applicable
    to aluminum alloy and magnesium alloy sheet and plate ordered to metric dimensions.
    \ These tolerances apply to all conditions, unless  otherwise noted. These tables
    are based on logical metric values and  preferred metric sizes.  Throughout this
    specification, the term 'metric'  is intended to refer to the SI system.</p>"
