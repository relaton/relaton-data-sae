    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides standardized laboratory tests, test methods, and requirements applicable to many of the lighting devices and components covered by SAE Recommended Practices and Standards and is intended for reference for devices used on vehicles less than 2032 mm in width, regardless of length, or 7620 mm in length regardless of width. Tests for vehicles larger than 2032 mm in overall width are covered in J2139.&lt;/div&gt;&lt;/div&gt;</p>
