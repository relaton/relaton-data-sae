  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) defines recommended substantiation procedures and associated reviewing and approval processes to confirm that proposed changes do not compromise the demonstrated safety, performance, and airplane compatibility of the originally certified commercial and military aircraft. Successful demonstration also includes confirmation that no adverse failure modes are introduced.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These procedures apply to modifications made by the original component or assembly supplier as well as certification of an alternate supplier.&lt;/div&gt;
    &lt;/div&gt;</p>
