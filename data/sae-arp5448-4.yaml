  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method outlines a recommended procedure for performing bond integrity tests of bonded peelable woven fabric reinforced polytetrafluoroethylene (PTFE) liners, hereafter referred to within this document as "PTFE liner" or "liner". The data from these tests shall be used to determine if the product meets the "bond integrity" requirements of the applicable specifications.&lt;/div&gt;&lt;/div&gt;</p>
