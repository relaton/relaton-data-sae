  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes electric immersion engine preheaters for use in the coolant jacket of heavy-duty and intermediate size diesel engines. This document gives the dimensional information on the four basic styles of engine preheaters. The tables for each style will list the wattage commonly used.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Small engines that typically require less than 600 W of preheat for cold weather starting are not covered by this document. These types of engines generally have very little space available to accommodate an immersion heater of the styles presented in this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;No related ISO standards were found.&lt;/div&gt;
    &lt;/div&gt;</p>
