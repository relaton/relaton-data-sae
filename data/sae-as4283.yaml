  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) covers handles and attachments for use with sockets and crowfoot wrenches in aerospace applications involving high torque, limited clearances, and generally clean conditions. This document provides additional requirements beyond ANSI B107.10M appropriate for aerospace use. The use of adapters, either enlarging or reducing, for turning high-strength fasteners is an unsafe practice. Adapters are not included in this document. The listing of tools in this document does not insure that they are available commercially.&lt;/div&gt;
    &lt;/div&gt;</p>
