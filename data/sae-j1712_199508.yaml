  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to the reporting of laboratory and test site data from the gaseous and evaporative emission tests of in-use light-duty trucks and passenger vehicles. This document describes the reporting of procedures, fuel specifications, and vehicle information necessary to compare the results of in-use tests. Any variations in vehicles, instrumentation, test equipment, or test program purpose should be adequately described.&lt;/div&gt;
    &lt;/div&gt;</p>
