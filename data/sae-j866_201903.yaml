  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to provide a uniform means of identification which may be used to classify the friction coefficient of brake linings, based on data obtained from tests conducted in accordance with SAE J661 Brake Lining Quality Test Procedure and SAE J2975 Measurement of Copper and other elements in Brake Friction Materials.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: It is emphasized that this document does not establish friction requirements for brake linings, nor does it designate significant characteristics of brake linings which must be considered in overall brake performance. Due to other factors that include brake system design and operating environment, the friction codes obtained from this document cannot reliably be used to predict brake system performance.&lt;/div&gt;&lt;/div&gt;</p>
