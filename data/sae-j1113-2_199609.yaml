  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document is an SAE Standard and covers the requirements for determining the immunity characteristics of automotive electronic equipment, subsystems, and systems to EM energy injected individually onto all leads. This test may be used over the frequency range of 30 Hz to 250 kHz. The method is applicable to all input, output, and power leads. The method is particularly useful in evaluating DUTs with acoustic or visible display functions.&lt;/div&gt;&lt;/div&gt;</p>
