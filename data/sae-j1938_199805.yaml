  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The following subjects reflect the automotive environment and are based on good engineering practices and past ("lessons learned") experiences. Since it is impossible to be all inclusive and cover every aspect of quality and reliability, this document should be used as a basis for preparation of a more comprehensive and detailed checklist that reflects the accumulated "lessons learned" at a particular Company.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;It is not the intent of this document to give a lot of detail, only to point out the type of subjects that need to be investigated and acted upon.&lt;/div&gt;&lt;/div&gt;</p>
