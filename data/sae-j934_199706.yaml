  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Recommended Practice is to establish recommended uniform test procedures and minimum static load requirements for vehicle passenger door hinge systems. Tests are described that can be conducted on test fixtures and equipment in laboratory test facilities.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The test procedures and minimum performance requirements outlined in this document are based on currently available engineering data. It is intended that all portions of the document be periodically reviewed and revised as additional knowledge regarding vehicle hinge system performance under impact conditions is developed.&lt;/div&gt;&lt;/div&gt;</p>
