  content: |-
    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;Flashers referred to in this SAE Standard are for nominal 12 or 6 v d-c circuits and are intended to operate at the design load for the turn signal system as stated by the manufacturer. EXAMPLE: two No. 1034 bulbs plus one No. 57 pilot bulb or three No. 1073 bulbs plus one No. 57 pilot bulb.&lt;/div&gt;&lt;/div&gt;</p>
