  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers the most common applications of electronically controlled on-demand clutch systems used in passenger (car and light truck) vehicle applications. This practice is applicable for torque modulation devices used in transfer cases, electronic limited slip differential (eLSD) cross-axle devices, rear drive module (RDM) integrated torque transfer devices with or without disconnect capability, and other related torque transfer devices.&lt;/div&gt;
    &lt;/div&gt;</p>
