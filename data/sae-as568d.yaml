    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies the inside diameters, cross-sections, tolerances, and size identification codes (dash numbers) for O-rings used in sealing applications and for straight thread tube fitting boss gaskets. The dimensions and tolerances specified in this standard are suitable for any elastomeric material provided that suitable tooling is available.&lt;/div&gt;&lt;/div&gt;</p>
