    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers high temperature, compression set, and fluid resistant fluorocarbon elastomer sheets, strips, molded parts, and extruded shapes for aeronautical and aerospace applications. This material differs from other fluorocarbon elastomers because of its improved low temperature performance of approximately 25°F.&lt;/div&gt;&lt;/div&gt;</p>
