  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard describes a uniform method to calculate and specify travel performance characteristics of hydraulic excavators, material handlers, knuckle boom log loaders, delimbers, feller bunchers, harvesters, processors, and other knuckle boom material handlers. It establishes definitions and specifies machine conditions for calculations and tests. This document applies to crawler mounted machines such as hydraulic excavators as defined in SAE J1057 and ISO 7135, and knuckle boom log loaders as defined in SAE J1209 and SAE J2055. This document also applies to certain forestry equipment defined in SAE J1209 and ISO 6814 that have crawler mountings such as delimbers, feller bunchers, harvesters, and processors. Included in the definition of hydraulic excavators are also front shovel, clamshell, and telescoping boom excavators.&lt;/div&gt;
    &lt;/div&gt;</p>
