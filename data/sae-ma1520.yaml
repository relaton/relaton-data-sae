  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Areas for the standard metric series of thread diameter-pitch combinations for aerospace externally threaded fasteners are established for the following conditions:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Area for ultimate shear stress or load in unthreaded shank.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Area for ultimate tensile stress or load in thread.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Area for stress durability test load in thread.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Area for stress-rupture test load at elevated temperature.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;e)&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Area for tension-tension fatigue test load.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
