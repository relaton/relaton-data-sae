  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document defines a set of standard application layer interfaces called &lt;i&gt;JAUS Autonomous Capabilities Services&lt;/i&gt;. JAUS Services provide the means for software entities in an unmanned system or system of unmanned systems to communicate and coordinate their activities. The Autonomous Behaviors Services represent the platform-independent capabilities commonly found in platforms across domains, including air, maritime, and ground. At present five (5) services are defined in this document. These services are:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Comms Lost Policy Manager: Detect and recover from loss of communications with a control station&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Retrotraverse: Return along a path previously traveled&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Self-Righting: Attempt to recover from a tip over condition&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Cost Map 2D: Provides information about the current operating environment of the platform&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Path Reporter: Provides information about the previous or future planned path of the platform&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;



    &lt;/div&gt;</p>
