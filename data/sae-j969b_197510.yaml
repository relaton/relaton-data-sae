    <p>&lt;div class="section abstract"&gt;

    &lt;div class="htmlview paragraph"&gt;The techniques outlined in this SAE Recommended Practice were developed for use by service agencies in the testing of fuel injction equipment for diesel engines. The need for standardizing these techniques developed out of an increase in different fuel injection equipment designs, and the effect of these different designs on the test stands, test media, and equipment used in fuel injection equipment.&lt;/div&gt;&lt;/div&gt;</p>
