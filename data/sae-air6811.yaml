  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document provides guidance for applying aircraft equipment electromagnetic, electrical, and mechanical qualification standards (i.e., DO-160, MIL-STD-461, MIL-STD-704, and MIL-STD-810) to civil aircraft certification intended for military use and for military aircraft equipment installed on civil aircraft. The guidance identifies where the equipment environmental qualification standards meet the intent of both the civil or military aircraft certification requirements. Conversely, the guidance will identify where the equipment environmental qualification standards have differences that do not meet the intent of the civil or military aircraft certification requirements and when these differences matter based on equipment criticality, installation location, and/or other variables.&lt;/div&gt;
    &lt;/div&gt;</p>
