  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE J1939-1 specifies the minimum set of SAE J1939 documents that define the Truck and bus control and communications vehicle network as it applies to on-highway equipment. Vehicles covered include all on-highway straight trucks and combination vehicles. A combination vehicle consists of one towing vehicle (tractor) and one or more towed vehicles (trailers and dollies). Dolly axles within the road train are considered to be towed vehicles.&lt;/div&gt;

    &lt;/div&gt;</p>
