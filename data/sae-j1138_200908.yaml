  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Recommended Practice is to describe design criteria pertaining to the location and labeling of hand controls, including embedded displays and controls when displayed, necessary to or frequently used during the operation of passenger cars, MPVs, and trucks 10 000 GVW and under designed for left-hand drive operation. The results of SAE human factors research have strongly influenced these recommendations, specifically in the area of driver reach, control-locating performance, and control location expectancies. Deviations from this recommended practice should be made only after careful study of the various SAE publications on these subjects. This document does not include hand-held devices such as remote controls or cellular phones.&lt;/div&gt;&lt;/div&gt;</p>
