  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies the dimensional requirements necessary for the mounting and interchangeability of four types of fuel injectors in diesel engines. Two of the types specified are flats-located injectors.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The location and dimensions of the fuel inlet, leak-off connections, and type of attachment are not defined since they may vary according to the particular application.&lt;/div&gt;
    &lt;/div&gt;</p>
