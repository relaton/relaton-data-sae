  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The intent of this report is to encourage that the thermal management system architecture be designed from a global platform perspective. Separate procurements for air vehicle, propulsion system, and avionics have contributed to the development of aircraft that are sub-optimized from a thermal management viewpoint. In order to maximize the capabilities of the aircraft for mission performance and desired growth capability, overall system efficiency and effectiveness should be considered. This document provides general information about aircraft Thermal Management System Engineering (TMSE). The document also discusses approaches to processes and methodologies for validation and verification of thermal management system engineering.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Thermal integration between the air vehicle, propulsion system, and avionics can be particularly important from a thermal management standpoint. Due to these factors, this report is written to encourage the development of a more comprehensive system engineering approach to help eliminate and/or reduce mission limitations as a result of materials and components nearing temperature limits.&lt;/div&gt;
    &lt;/div&gt;</p>
