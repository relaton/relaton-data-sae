  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice provides the minimum performance requirements and uniform laboratory procedures for fatigue testing of ferrous wheels and demountable rims intended primarily for off road use on agricultural machines (e.g., agricultural tractors, harvesters, trailers, and implements) and light construction machines (e.g., wheel loaders, backhoe loaders, dumpers, mobile excavators, and telehandlers). For other wheels intended for normal highway use and temporary use on passenger cars, light trucks, and multipurpose vehicles, refer to SAE J328. For wheels used on trailers drawn by passenger cars, light trucks, or multipurpose vehicles, refer to SAE J1204. For wheels intended for normal highway use on trucks, buses, truck-trailers, and multipurpose vehicles, refer to SAE J267. For bolt together military wheels, refer to SAE J1992. This document does not cover other special application wheels and rims.&lt;/div&gt;&lt;/div&gt;</p>
