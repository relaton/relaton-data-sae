    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to single occupancy shoulder harness type restraint assemblies intended for installation in motor vehicles. Such a restraint assembly is composed of a shoulder belt portion and a lap belt portion. This recommended practice specifies performance requirements, test procedures and certain minimal design requirements for this type of restraining device.&lt;span class="xref"&gt;*&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;</p>
