  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This dictionary of terms was prepared for use by those with a need to describe and understand the dynamics and handling of two-wheeled, single track vehicles. It is intended to span the gap between vehicle dynamics specialists and those with a more general interest.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This report is pertinent to such areas as vehicle design and development, the description of two-wheeler properties, rider training and education, and the preparation of standards and regulations.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This report was prepared by the SAE Motorcycle Committee, which solicits suggestions for improvements and additions to be considered in future revisions. Comments should be directed to SAE Headquarters.&lt;/div&gt;&lt;/div&gt;</p>
