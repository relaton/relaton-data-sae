  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers external lighting for Electric Vertical Takeoff and Landing (E-VTOL) and Urban Air Mobility (UAM) vehicles. It discusses lights that may be installed both to meet regulatory requirements as well as for customer comfort and aircraft recognition. It also discusses the differences between UAM vehicles and other aircraft and how those differences impact the lighting.&lt;/div&gt;
    &lt;/div&gt;</p>
