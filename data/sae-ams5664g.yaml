  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a corrosion- and heat-resistant nickel alloy in the form of bars, forgings, flash welded rings in the solution heat treated condition, Product covered by this specification is limited to 10.00 inches (254 mm) and under in nominal diameter or maximum cross-sectional dimension between parallel sides (thickness) and 78.54 square inches (503 cm&lt;sup&gt;2&lt;/sup&gt;) in cross-sectional area. Stock may be of any size for forging or flash welded rings.&lt;/div&gt;&lt;/div&gt;</p>
