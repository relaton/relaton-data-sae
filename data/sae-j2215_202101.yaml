abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice applies to evaluation of the conformance match condition existing between two surfaces. Evaluation of this conformance may be especially useful in bonded applications although it may also have relevance to bolted adjacent surface joint conditions.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Since good bonding surface conformity is necessary for providing optimal bond performance with pressure sensitive adhesives, the purpose of this document is to provide a method of evaluating the conformance match of the mating surfaces.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This document is intended as a guide toward standard practice but may be subject to frequent change to keep pace with experience and technical advances. This should be kept in mind when considering the use of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Tool types, materials, application tools, and component contact area evaluation methods are included as part of this document.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;In most cases a visual evaluation of contact performance may be satisfactory; however, for greater accuracy a measurement tool may be used. When reporting a contact value the mode of evaluation (e.g., visual, measurement tool) should be indicated.&lt;/div&gt;
    &lt;/div&gt;</p>
