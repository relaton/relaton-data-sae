  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The scope of this SAE Aerospace Information Report (AIR) is to define recommended methods of determining the optimal dimensional relationship of components coupled together using thrust wires for applications such as coupling nuts and fittings.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These design parameters are intended to optimize component loading characteristics and maximize wire shear capabilities for both high and low pressure applications.&lt;/div&gt;
    &lt;/div&gt;</p>
