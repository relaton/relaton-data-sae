abstract:
- language: en
  script: Latn
  content: "<p>This Aerospace Recommended Practice (ARP) is intended to specify the
    environmental conditions necessary to permit the operating crew of large civil
    transport aircraft to perform their required duties and functions in comfort,
    with minimum fatigue and no distraction. Environmental conditions should cause
    no short or long-term effects deleterious to health or physical well being, nor
    significantly impair ability to perform normal flight deck crew functions.</p>"
