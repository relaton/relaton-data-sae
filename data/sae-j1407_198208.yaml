  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This information report gives the procedures for use and operation of a large transverse electromagnetic (TEM) mode cell for the determination of electromagnetic (EM) radiated susceptibility of equipment, subsystems and systems (whose dimensions are less than 3 m × 6 m × 18 m) in the frequency range 10 kHz–20 MHz. Several large TEM cells have been designed and constructed by various organizations for EMP and high power CW testing. Two cell designs and associated instrumentation are included for example purposes in this report. Other cell configurations have also been constructed. Users should consult the literature before undertaking a project of this magnitude for other cell and instrumentation designs.&lt;/div&gt;&lt;/div&gt;</p>
