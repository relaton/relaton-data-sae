  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;SAE Aerospace Recommended Practice ARP1533 is a procedure for the analysis and evaluation of the measured composition of the exhaust gas from aircraft engines. Measurements of carbon monoxide, carbon dioxide, total hydrocarbon, and the oxides of nitrogen are used to deduce emission indices, fuel-air ratio, combustion efficiency, and exhaust gas thermodynamic properties. The emission indices (EI) are the parameters of critical interest to the engine developers and the atmospheric emissions regulatory agencies because they relate engine performance to environmental impact.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;While this procedure is intended to guide the analysis and evaluation of the emissions from aircraft gas turbine engines (burning conventional hydrocarbon based liquid fuels), the methodology may be applied to the analysis of the exhaust products of any hydrocarbon/air combustor. Some successful applications include:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Aircraft engine combustor development rig tests (aviation jet fueled)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Stationary source combustor development rig tests (natural gas and diesel fueled)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Afterburning military engine tests (aviation jet fueled)&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;Internal combustion aircraft engine diagnostics (AVGAS fueled)&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;
    &lt;div class="htmlview paragraph"&gt;Each application may be characterized by very different measured emissions levels (parts per million versus percent by volume) but this common approach solves the same basic combustion chemical equation.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The matrix method of solving the combustion chemical equation is recommended because of all the potential variations in exhaust gas measurement requirements. Changes in the fuel type, addition of diluents, addition of measured species, and options for wet or dry basis measurements are most easily handled by revising individual matrix row equations. Matrix solution software is widely available on personal computers. However, derivation of the algebraic solution of the chemical equation is retained for traceability to previous versions of this document. This document also contains a section pertaining to data quality checks, measurement uncertainty, and water content calculations.&lt;/div&gt;
    &lt;/div&gt;</p>
