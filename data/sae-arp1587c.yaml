abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) addresses aeronautical Propulsion System Health Management. Aircraft propulsion systems are broader than gas turbine engines and include electric and hybrid propulsion systems. Furthermore, health management of auxiliary systems such as for thermal management of electric propulsion modules is also included in the scope. This document uses the term Engine Health Management (EHM) to include health management of propulsion systems and related equipment such as electric motors and heat exchangers for thermal management in an integrated power and propulsion system (IPPS). This keystone document gives a top-level view and addresses EHM description, benefits, and capabilities, and provides examples. This ARP purposely addresses a wide range of EHM architectures to demonstrate possible EHM design options. This ARP is not intended as a legal document and does not provide detailed implementation steps but does address potential benefits and general implementation issues. Other SAE documents (aerospace standards, aerospace recommended practices, and aerospace information reports) address specific component specifications, procedures, and “lessons learned.”&lt;/div&gt;
    &lt;/div&gt;</p>
