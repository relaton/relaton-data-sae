  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The purpose of this SAE Aerospace Recommended Practice (ARP) is to describe key features that should be incorporated in the lavatory smoke detector system. Consideration has been given to existing requirements of the FAA and to recommendations of aircraft operators and manufacturers. This document is deliberately not specific in all areas in order to maximize the freedom to use state-of-the-art design and manufacturing technologies. Safe, reliable, and effective lavatory smoke detectors remain the primary goal of the document.&lt;/div&gt;&lt;/div&gt;</p>
