  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice covers equipment capabilities and the test procedure to quantify and qualify the shear strength between the friction material and backing plate or brake shoe for automotive applications. This SAE Recommended Practice is applicable to: bonded drum brake linings; integrally molded disc brake pads; disc brake pads and backing plate assemblies using mechanical retention systems (MRS); coupons from drum brake shoes or disc brake pad assemblies. The test and its results are also useful for short, semi-quantitative verification of the bonding and molding process.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This Recommended Practice is applicable during product and process development, product verification and quality control. This Recommended Practice does not replicate or predict actual vehicle performance or part durability.&lt;/div&gt;
    &lt;/div&gt;</p>
