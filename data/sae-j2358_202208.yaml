  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard defines the safety and performance requirements for low-speed vehicles (LSVs). The safety specifications in this document apply to any powered vehicle with a minimum of four wheels, a maximum level ground speed of more than 32 km/h (20 mph) but not more than 40 km/h (25 mph), and a maximum gross vehicle weight of 1361 kg (3000 pounds), that is intended for operating on designated roadways where permitted by law.&lt;/div&gt;
    &lt;/div&gt;</p>
