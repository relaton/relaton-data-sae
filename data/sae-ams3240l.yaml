  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers a chloroprene rubber (CR) that can be used to manufacture product in the form of sheet, strip, tubing, extrusions, and molded shapes such as window channels, bumper pads, chafing strips, etc. For molded rings, compression seals, molded O-ring cord, and molded-in-place gaskets for aeronautical and aerospace applications, use the equivalent AMS7XXX specification.&lt;/div&gt;&lt;/div&gt;</p>
