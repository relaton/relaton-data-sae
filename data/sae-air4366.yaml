  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) enumerates areas of concern which need to be addressed when the aircraft propulsion control system functions are distributed. Distributed items may include electronic control sensors, electrical or hydraulic power sources, computer hardware and software, etc. This report identifies many factors which should be considered to determine the best system architecture for any given application.&lt;/div&gt;&lt;/div&gt;</p>
