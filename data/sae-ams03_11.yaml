  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard specifies requirements for the processing of iron and steel (excluding corrosion resisting steels) to produce coatings consisting essentially of inorganic phosphates, which are intended to be used in conjunction with supplementary finishes for the protection of the basis metal against corrosion (and in certain cases to give, additionally, anti-wear properties to sliding surfaces).&lt;/div&gt;&lt;/div&gt;</p>
