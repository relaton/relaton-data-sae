  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Flasher(s) referred to in this SAE Standard are for nominal 12 V or 6 V d-c circuits and are intended to operate at the design load(s) for the turn signal system as stated by the flasher manufacturer. It is an engineering design standard and is supplemented by SAE J1055 covering service performance requirements for turn signal flashers.&lt;/div&gt;&lt;/div&gt;</p>
