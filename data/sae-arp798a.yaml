  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) covers the general requirements and test procedures recommended for use with white incandescent integrally lighted instruments. Its use should provide uniformity of illumination from instrument to instrument and legibility under daylight operation. An appendix is provided to familiarize the designer with some of the techniques used to obtain uniformity of color and illumination in various types of instruments.&lt;/div&gt;
    &lt;/div&gt;</p>
