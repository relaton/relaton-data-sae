    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procurement specification covers bolts and screws made from a corrosion and heat resistant, age hardenable nickel base alloy of the type identified under the Unified Numbering System as UNS N07718. The following specification designations and their properties are covered:
    &lt;div class="table-wrap anchor " id="tu1-AS7467B"&gt;
    &lt;div class="table-container"&gt;&lt;table class="br-none tbr-void " data-dataset-id=""&gt;
    &lt;tbody&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left " rowspan="3"&gt;AS7467&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;185 ksi minimum ultimate tensile strength at room temperature&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;145 ksi minimum ultimate tensile strength at 1200 °F&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;100 ksi stress rupture strength at 1200 °F&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left " rowspan="2"&gt;AS7467-1&lt;/td&gt;
    &lt;td class="va-top ta-left "&gt;185 ksi minimum ultimate tensile strength at room temperature&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;
    &lt;td class="va-top ta-left "&gt;111 ksi minimum ultimate shear strength at room temperature&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div/&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;</p>
