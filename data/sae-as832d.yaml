  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This aerospace standard establishes the basic requirements for the specification and testing of air/surface (intermodal) 8 x 8 ft (2.44 x 2.44 m) cross-section containers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The basic requirements for the air/surface (intermodal) container are presented in paragraphs &lt;span class="xref"&gt;3&lt;/span&gt; - &lt;span class="xref"&gt;6&lt;/span&gt; while the detailed design requirements are in &lt;span class="xref"&gt;Appendix A&lt;/span&gt;. &lt;span class="xref"&gt;Appendix B&lt;/span&gt; describes the sections of other standards that apply to air/surface containers. &lt;span class="xref"&gt;Appendix C&lt;/span&gt; describes uniformity of test apparatus and methods. These appendices shall be referred to for important supplemental requirements and procedures for this SAE Aerospace Standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;AS 4041 presents the requirements for air mode general purpose containers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Requirements for containers to be transported by rotary-wing aircraft are excluded from this aerospace standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;NOTE: The essential basic and detail criteria are identified by use of the key word "shall." Recommended basic and detail criteria are identified by use of the key word "should," and while not mandatory, are considered to be of primary importance in providing serviceable, economical and practical air/surface containers.&lt;/div&gt;
    &lt;/div&gt;</p>
