  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers the requirements for SAE implementations based on ISO 17987:2016. Requirements stated in this document will provide a minimum standard level of performance to which all compatible ECUs and media shall be designed. This will assure full serial data communication among all connected devices regardless of supplier.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The goal of SAE J2602-1 is to improve the interoperability and interchangeability of LIN devices within a network by adding additional requirements that are not present in ISO 17987:2016 (e.g., fault tolerant operation, network topology, etc.).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The intended audience includes, but is not limited to, ECU suppliers, LIN controller suppliers, LIN transceiver suppliers, component release engineers, and vehicle system engineers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The term “master” has been replaced by “commander” and term “slave” with “responder” in the following sections.&lt;/div&gt;


    &lt;/div&gt;</p>
