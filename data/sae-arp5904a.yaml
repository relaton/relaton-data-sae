abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Recommended Practice (ARP) document establishes criteria and recommended practices for the use of airborne icing tankers to aid in design and certification of aircraft ice protection systems and components. Several icing tankers are described, along with their capabilities and suggested use. Sample data for these tanker spray systems are included, shown with 14 CFR Parts 25 and 29, Appendix C icing envelopes for continuous maximum and intermittent maximum icing conditions. (Note: In the remainder of this document, the phrase “Appendix C icing envelopes” will be used for brevity.) This ARP is intended as a guide toward standard practice and is subject to change to keep pace with experience and technical advances.&lt;/div&gt;

    &lt;/div&gt;</p>
