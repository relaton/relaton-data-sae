  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document contains guidance for designers, specifiers, regulatory personnel, purchasers, managers, and others who specify or use optical simulations of aircraft lights. All aircraft lighting will be considered interior, flight deck, and exterior lighting. Guidance on standard methods of analysis and presentation of data will be provided. Although this document concentrates on lighting, many of the principles covered will be helpful in other types of optical simulation, such as for displays, non-visible radiation, etc.&lt;/div&gt;
    &lt;/div&gt;</p>
