  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The terms included in this SAE Information Report have been collected during the development of SAE documents related to standards for the adaptation of vehicles for use by persons with physical disabilities. It includes only those terms that are pertinent to the adaptive devices discipline, leaving to other authorities more common automotive engineering terms. Where several terms have a common meaning in the practice, the Terminology Task Force has attempted to select the most appropriate term.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The Terminology Task Force recognizes that there will be a need to expand and update current terminology as advances in the industry occur, and as related standards documents are completed. Accordingly, they will continue to develop and maintain this document to reflect those changes.&lt;/div&gt;
    &lt;/div&gt;</p>
