  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) is limited to the requirements of AS50881 and examines these requirements, providing rationale behind them. AS50881 is only applicable to the aircraft electrical wiring and interconnect system (EWIS). Pods and other devices that can be attached to an aircraft are considered as part of the aircraft equipment design. Its scope does not include wiring inside of airborne electronic equipment, but does apply to wiring externally attached to such equipment. The AS50881 scope does not include attached devices but does include the interface between the pod/equipment and aircraft wiring. &lt;span class="xref"&gt;3.3.5&lt;/span&gt; addresses components such as antennas and other similar equipment that were once supplied as Government Furnished Aeronautical/Aerospace Equipment (GFAE).&lt;/div&gt;

    &lt;/div&gt;</p>
