  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method provides a standardized procedure for evaluating the electrical resistance of automotive coolant hose covers. It is known that an electrical potential exists between the engine and the radiator. Coolant hose cover conductivity has been determined to be a factor to reduce hose clamp life when vehicle build variations allow possible contact of the hose or the clamp to metal components on the radiator and engine thus completing an electrical circuit. The ensuing electrical current can undercut the clamp protective coating, leaving it vulnerable to the corrosive effects of road salts, moisture, and other environmental contaminants. SAE Recommended Practice J1684 addresses the electrochemical resistance of the tube portion of the coolant hose.&lt;/div&gt;&lt;/div&gt;</p>
