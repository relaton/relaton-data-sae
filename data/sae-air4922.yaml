  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) provides a description of the interfaces and their requirements for generic and specific hydraulic actuation systems used in the flight control systems of manned aircraft. Included are the basic control system characteristics and functional requirements, and the essential interfaces (structural, mechanical, hydraulic power, control input, status monitoring, and environment). Major design issues, requirements, and other considerations are presented and discussed.&lt;/div&gt;

    &lt;/div&gt;</p>
