    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice is intended to outline basic nomenclature for axle designs in common use for automotive drives. Over a period of years, there have been many different designs; however, for the purpose of this report, only the most common designs have been selected and only their general construction is illustrated to show the nomenclature of the various parts.&lt;/div&gt;&lt;/div&gt;</p>
