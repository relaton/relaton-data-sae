  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Information Report J2836/5™ establishes the use cases for communications between Plug-In Electric Vehicles (PEV) and their customers. The use case scenarios define the information to be communicated related to customer convenience features for charge on/off control, charge power curtailment, customer preference settings, charging status, EVSE availability/access, and electricity usage. Also addresses customer information resulting from conflicts to customer charging preferences. This document only provides the use cases that define the communications requirements to enable customers to interact with the PEV and to optimize their experience with driving a Plug-In Electric Vehicle. Specifications such as protocols and physical transfer methods for communicating information are not within the scope of this document.&lt;/div&gt;
    &lt;/div&gt;</p>
