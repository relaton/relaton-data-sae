    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;These recommendations are written to cover the testing of air conditioning equipment as installed in the prototype aircraft for the purpose of:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;A&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Demonstrating safety of the installation.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;B&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Demonstrating performance of the installation.
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Aircraft ducting and distribution system.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Component parts (i.e., vendors equipment)&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;C&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Obtaining data for future design.&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;</p>
