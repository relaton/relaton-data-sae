    &lt;div class="htmlview paragraph"&gt;The following definitions and illustrations are intended to establish common nomenclature and terminology for driveshafts and their articulating joints used in various drivetrain applications. In addition, useful guidelines are included for the application of driveshafts and their joints. For more specific details, refer to AE-07.&lt;/div&gt;&lt;/div&gt;</p>
