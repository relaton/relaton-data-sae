  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method outlines the recommended machine function, fixtures and procedures used to test airframe rolling element bearings for dynamic performance under steady unidirectional radial load and oscillatory motion. Bearings covered by this test method shall be ball, roller and needle type in either annular or rod end configuration, used in airframe control applications.&lt;/div&gt;&lt;/div&gt;</p>
