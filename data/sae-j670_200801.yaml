  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;The vehicle dynamics terminology presented herein pertains to passenger cars and light trucks with two axles and to those vehicles pulling single-axle trailers. The terminology presents symbols and definitions covering the following subjects: axis systems, vehicle bodies, suspension and steering systems, brakes, tires and wheels, operating states and modes, control and disturbance inputs, vehicle responses, and vehicle characterizing descriptors. The scope does not include terms relating to the human perception of vehicle response.&lt;/div&gt;&lt;/div&gt;</p>
