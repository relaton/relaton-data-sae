  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;To describe typical ignition systems in general usage and their parameters that warrant consideration during the development of a gas turbine engine.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;To describe those parameters in gas turbine engine design and, in particular, burner configurations that influence the type selection and performance of the ignition system.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;To indicate the areas where future work may uncover important effects having a direct bearing on certain interrelated parameters, with resultant benefits to both the engine and ignition designers.&lt;/div&gt;
    &lt;/div&gt;</p>
