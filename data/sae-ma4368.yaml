  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This procurement specification covers aircraft quality metric spanner nuts for retaining shaft mounted parts. Nuts are made from a corrosion and heat resistant age hardenable iron base alloy of the type identified under the Unified Numbering System as UNS S66286, and silver plated. Thread shear proof strength at room temperature is 450 MPa.&lt;/div&gt;&lt;/div&gt;</p>
