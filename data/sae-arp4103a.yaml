    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends design and performance criteria for aircraft lighting systems used to illuminate flight deck controls, luminous visual displays used for transfer of information, and flight deck background and instrument surfaces that form the flight deck visual environment. This document is for commercial transport aircraft except for applications requiring night vision compatibility.&lt;/div&gt;


