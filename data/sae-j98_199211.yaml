    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard is intended to be used as a guide for manufacturers and users of general purpose industrial machines to provide a reasonable degree of protection for personnel during normal operation and servicing. This document excludes skid steers which are covered by SAE J1388. Avoidance of accidents also depends upon the care exercised by such persons (see SAE J153). Inclusion of this standard in state, federal, or any laws or regulations where flexibility of revision is lacking is discouraged.&lt;/div&gt;&lt;/div&gt;</p>
