  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document presents standard methods to evaluate the common mode and differential mode insertion loss of passive electromagnetic interference power line filters from 10 kHz through 10 GHz. Insertion loss test methods for both quality assurance and performance prediction purposes are described. The performance prediction tests are selected to more closely approximate operating impedances. They are not intended to be inclusive or to represent worst case conditions. However, the methodology of this document can be used to determine the performance in an arbitrary impedance circuit.&lt;/div&gt;&lt;/div&gt;</p>
