  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Procedures included within this specification are intended to cover performance testing at all phases of development, production, and field analysis of electrical terminals, connectors and components for coaxial cable connection systems (hereafter referred to as RF connectors) in road vehicle applications. The intent of this specification is to qualify RF connectors that operate at frequencies greater than 200 MHz. This specification does not apply to single conductor wire or twisted pair connection systems. The RF connection system will be qualified for specific coaxial cable; the qualified coaxial cable and frequency range of interest must be listed on the connector drawing. Changing coaxial cable necessitates re-qualification.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This specification is a supplement to the SAE/USCAR-2 Performance Standard for Automotive Electrical Connector Systems and all requirements herein must be met in addition to all requirements of SAE/USCAR-2, unless otherwise specified. Only RF connector related additions and/or subtractions to the SAE/USCAR-2 specification are contained in this document.&lt;/div&gt;&lt;/div&gt;</p>
