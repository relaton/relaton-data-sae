    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers the requirements for two types of gasoline and oil resistant grease for lubrication of tapered plug valves, gaskets, and for other applications in fuel and oil systems. The type I grease is identified by NATO symbol G-363 (see &lt;span class="xref"&gt;6.4&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
