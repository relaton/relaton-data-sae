abstract:
- language: en
  script: Latn
  content: "<p>&lt;p&gt;The primary purpose of this document is to provide roles, responsibilities and accountabilities to meet AC 21-49 Section 7.b ‘Type Certification using TSO-approved seat with electronic components defined in TSO design’.  This document may be applied to all applicable seat TSOs (C39(), C127()…etc).  The approval for the integration of the electronics will fall, in part or in full, under the type design authority of the Seat Installer rather than the Seat Supplier shipping the integrated seat. The defined responsibilities, areas of authority and accountability of each party, as well as necessary communication protocols, must ensure configuration management, design control and quality control. These definitions, controls and protocols are agreed (thru normal commerical agreements and binding contracts) and adhered to by all parties ensuring all parts in the supply chain remain approved (e.g. certified and conformed).&lt;/p&gt;</p>"
