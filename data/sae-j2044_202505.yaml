  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice defines the minimum functional requirements for quick connect couplings used for supply, return, and vapor/emission fuel system connections. This document also defines standard male tube end form dimensions, so as to guarantee interchangeability between all connector designs of the same male tube end form size. This document applies to automotive and light truck applications under the following conditions:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Gasoline and diesel fuel delivery systems or their vapor venting or evaporative emission control systems.&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Operating pressure up to 500 kPa, 5 bar, (72 psig).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;c&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Operating vacuum down to −50 kPa, −0.5 bar (−7.2 psi).&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;d&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Operating temperatures from −40 °C (−40 °F) to 115 °C (239 °F).&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;Quick connect couplings function by joining the connector to a mating tube end form, then pulling back to assure a complete connection. The requirements stated in this document apply to new connectors in assembly operations unless otherwise indicated. For service operations, the mating tube should be lubricated with SAE 30-weight oil before re-connecting.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Vehicle OEM fuel system specifications may impose additional requirements beyond the scope of this general SAE document. In those cases, the OEM specification takes precedence over this document.&lt;/div&gt;&lt;/div&gt;</p>
