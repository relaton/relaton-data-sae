abstract:
- language: en
  script: Latn
  content: "<p>This SAE Standard establishes definitions of specifications most commonly
    associated with grapple skidders. Specifications common to all articulated, rubber-tired
    log skidders are included in SAE J1110. The  dimensions included in this document
    are basic and may be supplemented by the individual machine manufacturer. Dimensions
    shall be stated in SI units. Illustrations used herein are not intended to include
    all existing commercial machines or to be exactly descriptive of any particular
    machine. They have been included to facilitate application of this document.</p>"
