    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an aluminum alloy in the form of extruded bars, rods, and profiles (shapes) produced with a cross-sectional area of 24 square inches (155 cm&lt;sup&gt;2&lt;/sup&gt;), maximum, and a circumscribing circle (see &lt;span class="xref"&gt;2.4.1&lt;/span&gt;) diameter (circle size) of 10.5 inches (267 mm), maximum, with a nominal thickness up to 3.000 inch (76.20 mm), inclusive (see &lt;span class="xref"&gt;8.6&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
