abstract:
- language: en
  script: Latn
  content: "<p>This SAE Recommended Practice establishes a uniform laboratory procedure
    for evaluating performance and wear of automotive brakes and brake drums by an
    inertial dynamometer simulation of vehicle test and  operating conditions. The
    code is applicable to hydraulic, air, or electrically actuated brakes. For electric
    brakes, 'ampere' values are substituted for 'line pressure' where specified in
    the procedure or on data and curve sheets. The procedure includes the following
    tests: 1.  Torque output and deceleration (various speeds and brake input). 2.
    Evaluation of lining life (wear tests). 3. Brake characteristics (fade and recovery
    tests, noise, chatter, grabbiness). 4. Drum evaluation (wear, heat checking, scoring).</p>"
