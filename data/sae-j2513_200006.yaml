  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard sets forth standard dimension requirements for the loader attachment bracket and attachment interface to allow interchangeability of attachments on skid steer loaders whose operating mass (see SAE J/ISO 6165) is 4,500 kg or less. Narrow skid steer loaders may have a width that does not allow compliance with this standard.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The design of the loader attachment bracket locking system is not restricted by this standard and is left to the discretion of the manufacturer.&lt;/div&gt;
    &lt;/div&gt;</p>
