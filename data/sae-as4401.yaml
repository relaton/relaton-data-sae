  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This Performance Standard covers the Qualification Test Requirements for separable fittings, permanent fittings, and tubing suitable for use in 8000 psi aerospace fluid power systems. The standard treats each of these elements as part of a “system” in which each element has a specific critical relationship one to the other This document is applicable to both the pressure (8000 psi) and the return (4000 psi) portions of an 8000 psi rated system. Rationale for tests, testing philosophy, and key words are covered in &lt;span class="xref"&gt;Sections 5&lt;/span&gt; and &lt;span class="xref"&gt;6&lt;/span&gt;.&lt;/div&gt;&lt;/div&gt;</p>
