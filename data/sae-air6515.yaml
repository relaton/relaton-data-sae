  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This User Guide describes the content of the Enterprise Architect (EA) version of the UCS Architectural Model and how to use this model within the EA modeling tool environment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The purpose of the EA version of the UCS Architectural Interface Control Document (ICD) model is to provide a working model for Enterprise Architect tool users and to serve as the source model for the Rational Software Architect (RSA) and Rhapsody models (AIR6516 and AIR6517).&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The AIR6515 EA Model has been validated to contain the same content as the AS6518 model for:&lt;/div&gt;
    &lt;ul class="list disc"&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;all UCS ICD interfaces&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;all UCS ICD messages&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;all UCS ICD data directly or indirectly referenced by ICD messages and interfaces&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;div class="htmlview paragraph"&gt;the Domain Participant, Information, Service, and Non-Functional Properties Models&lt;/div&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;</p>
