  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document covers all metal, self-locking wrenching nuts, plate nuts, shank nuts, and gang channel nuts made from a corrosion and heat resistant steel of the type identified under the Unified Numbering System as UNS S66286 and of 160 000 psi tensile strength at room temperature, with maximum test temperature of parts at 1200 °F.&lt;/div&gt;&lt;/div&gt;</p>
