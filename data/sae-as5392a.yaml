  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Standard (AS) specifies requirements for the interface between a rotational system indexing sensor and its interface electronics. These sensors generate one or more electrical pulses for each revolution of the shaft being monitored. These pulses can be used to determine the actual shaft rotational speed and/or position for use in a Health and Usage Monitoring System (HUMS). Indexing sensors are used in the following HUMS areas on the aircraft: (a) rotor track and balance, (b) engine vibration monitoring and diagnostics, (c) drive train vibration monitoring and diagnostics. The goal of this standardization effort is to be able to take any compliant indexing sensor and connect it to any compliant interface electronics.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;These SAE HUMS Interface Specifications include the minimal interface and performance requirements for interoperability with the Rotorcraft Industry Technology Association (RITA) compliant HUMS. Compliance with these Interface Specifications can be referenced in more comprehensive procurement and device specifications.&lt;/div&gt;

    &lt;/div&gt;</p>
