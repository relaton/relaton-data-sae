  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Roll-over tests are conducted to evaluate vehicle structure and occupant injury potential. This SAE Recommended Practice is in tended to establish guidelines for conducting passenger car rollover tests for the purpose of standardizing these tests, so that data obtained by various test facilities may be more readily compared. Methods and instrumentation are recommended for the study and evaluation of vehicle structures and occupant movement in simulated roll-over accidents without collision.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Procedures and equipment described will be subject to continuing review and will be revised as experience and improvements in the technology warrant.&lt;/div&gt;&lt;/div&gt;</p>
