    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This specification covers an aluminum alloy in the form of sheet and plate 0.008 to 1.000 inch (0.203 to 25.4 mm) thick, supplied in the annealed (O) temper (see &lt;span class="xref"&gt;8.5&lt;/span&gt;). When specified, product shall be supplied in the “as fabricated” (F) temper (see &lt;span class="xref"&gt;8.5&lt;/span&gt;).&lt;/div&gt;&lt;/div&gt;</p>
