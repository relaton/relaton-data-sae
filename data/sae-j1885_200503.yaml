  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This test method specifies the operating procedures for a controlled irradiance, water cooled xenon-arc apparatus used for the accelerated exposure of various automotive interior trim components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;Test durations, as well as any exceptions to the sample preparation and performance evaluation procedures contained in this document, are covered in material specifications of the different automotive manufacturers.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This standard is limited to the models of xenon arc test apparatus specified in the Section on Equipment.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;All other models of xenon arc test apparatus must use SAE J2412 to perform the test conditions specified in SAE J1885. SAE J2412 is the performance standard based on the test parameters of SAE J1885. Use of xenon arc test apparatus to perform SAE J2412 must be agreed upon by contractual parties.&lt;/div&gt;
    &lt;/div&gt;</p>
