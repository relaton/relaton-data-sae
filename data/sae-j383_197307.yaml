    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Recommended Practice specifies design recommendations for location of seat belt assembly anchorages. It applies to seat belt anchorages attached to vehicle structure or installed to seat assemblies in the vehicle. (This SAE Recommended Practice supersedes the design section of SAE J787b.) Test Procedures and Performance Requirements are specified in SAE J384 and SAE J385, respectively.&lt;/div&gt;&lt;/div&gt;</p>
