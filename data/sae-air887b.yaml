  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) identifies and explains the meaning of various ratings and terms used to describe the physical characteristics of liquid filter elements. The significance of various filter parameters is discussed. In addition, a number of filter test methods is briefly described. This AIR and the data presented are only applicable to filters in which the system liquid wets the filter elements. This document includes equivalent metric units (in parentheses) as referenced information.&lt;/div&gt;&lt;/div&gt;</p>
