abstract:
- language: en
  script: Latn
  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;Turbine engines installed in helicopters require a highly sophisticated oil system to fulfill two tasks:&lt;/div&gt;
    &lt;ol class="list nostyle"&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;a&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Cooling/oil supply&lt;/div&gt;&lt;/li&gt;
    &lt;li class="list-item"&gt;
    &lt;span class="li-label"&gt;b&lt;/span&gt;
    &lt;div class="htmlview paragraph"&gt;Lubrication&lt;/div&gt;&lt;/li&gt;&lt;/ol&gt;
    &lt;div class="htmlview paragraph"&gt;While lubrication is an engine internal procedure, cooling and oil supply require more or less design activity on the aircraft side of the engine/airframe interface for proper engine function, depending on the engine type.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;The necessity for engine cooling and oil supply provisions on the airframe can lead to interface problems because the helicopter manufacturer can influence engine related functions due to the design of corresponding oil system components.&lt;/div&gt;
    &lt;div class="htmlview paragraph"&gt;This SAE Aerospace Information Report (AIR) deals with integration of engine oil systems with the airframe and gives information for both helicopter and engine manufacturers for a better understanding of interface requirements.&lt;/div&gt;&lt;/div&gt;</p>
