  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This document recommends design criteria for the Flight Deck Alerting System. The FAS shall enhance safety of flight by providing early crew recognition of aircraft system or component status or malfunction as well as of crew operational error. The FAS, therefore, relates to aircraft configuration and flight phase as well as the aircraft systems. To fulfill this objective, the FAS must attract the attention of the crew, must state with clarity the nature and location of the problem, and must be highly reliable and thoroughly responsive to the operational requirements and environment. Wherever possible, it should provide guidance as to the corrective action.&lt;/div&gt;&lt;/div&gt;</p>
