    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE Standard details procedures for testing lead-acid SLI (starting, lighting, and ignition), Heavy-Duty, EV (electric vehicle) and RV (recreational vehicle) batteries to determine the effectiveness of the battery venting system to retard the propagation of an externally ignited flame of battery gas into the interior of the battery where an explosive mixture is usually present.&lt;/div&gt;
    &lt;/div&gt;</p>
