    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This SAE recommended practice establishes a uniform procedure for the level road test of the brake systems of all combinations of new multipurpose passenger vehicles, new light-duty trucks up to and including 10,000 lb (4500 kg). GVW and new passenger cars when coupled with new trailers (braked or unbraked). For purposes of this test, adherence to each manufacturer’s recommendations&lt;sup&gt;&lt;span class="xref"&gt;1&lt;/span&gt;&lt;/sup&gt; is mandatory.&lt;/div&gt;&lt;/div&gt;</p>
