  content: |-
    <p>&lt;div class="section abstract"&gt;


    &lt;div class="htmlview paragraph"&gt;This recommended practice outlines the general requirements of a continuous duty, electric motor-driven brushless alternator unit for supplying 400 Hz electrical power to high performance commercial transport aircraft. This specification is for a single motor-generator set with one or two outputs. The generator set will generate at the aircraft voltage of 115/200 volts. This unit may be used in a central system of small size or in hangar or electronic shop applications. Power characteristics of this unit at the receptacle will meet MIL-Standard-704 requirements. Other limits which are necessary to meet specific conditions must be specified by the purchaser.&lt;/div&gt;&lt;/div&gt;</p>
